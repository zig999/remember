looked_past: >-
  The logged route string `GET /api/v1/fragments/accepted`, the log event name, the `total > 0` roundtrip-saving
  short-circuit and the `Number(...)` coercion are transport, logging and performance choices with no domain fact
  in them, so they belong to another judgment.