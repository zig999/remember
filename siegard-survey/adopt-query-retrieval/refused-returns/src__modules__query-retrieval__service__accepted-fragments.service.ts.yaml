findings:
  - file: src/modules/query-retrieval/service/accepted-fragments.service.ts
    where: header comment, lines 3-4
    evidence: >-
      // Read-only, single transaction (the route wraps the call in
      // `withReadOnly`).
    cost: >-
      The file's only statement that the listing runs read-only is this comment. The service takes a bare
      `PoolClient` and opens nothing itself. A reader who follows the comment to the route to confirm the
      transaction cannot check it from this file, and the node's fitness check has nothing here to read.
    kind: contradicts
    correction: >-
      Remove the prose. The fact is held by the node, and the read-only transaction has to be held by code
      in the file that opens it (the route, per the comment).
    node: constraints/retrieval-is-read-only
  - file: src/modules/query-retrieval/service/accepted-fragments.service.ts
    where: header comment, line 7 (step 2 of the service description)
    evidence: >-
      //   2. Runs the page query (deduped per fragment_id, ordered by
      //      `r.received_at DESC NULLS LAST, f.created_at DESC, f.id ASC`).
    cost: >-
      The listing order is spelled out here as if decided, and it adds `NULLS LAST`, which the node does
      not state. The node orders by source reception time descending, then fragment creation time
      descending, then fragment identifier ascending. The file's code does none of this ordering (it is
      delegated to `selectAcceptedFragments`). The next reader sees two homes for the order and cannot
      tell which was decided.
    kind: contradicts
    correction: >-
      Remove the prose. The order belongs to the node, and the repository SQL is where code holds it.
    node: rules/knowledge-base/listing-order
  - file: src/modules/query-retrieval/service/accepted-fragments.service.ts
    where: header comment, line 7 ("deduped per fragment_id")
    evidence: '//   2. Runs the page query (deduped per fragment_id, ordered by'
    cost: >-
      The one-entry-per-fragment rule is restated in prose. Nothing in this file dedups, and the
      lowest-index-chunk attribution the node states is not mentioned. The rule appears as a claim about
      code in another file.
    kind: contradicts
    correction: Remove the prose. The rule is held by the node and, in code, by the repository query.
    node: rules/knowledge-base/listing-one-entry-per-fragment
  - file: src/modules/query-retrieval/service/accepted-fragments.service.ts
    where: header comment, lines 10-11
    evidence: >-
      // Filter validation (at-least-one-of, UUID syntax, limit/offset range) lives
      // at the route DTO; this service receives an already-typed input.
    cost: >-
      The requirement that a listing name an LLM run, a raw information or both is asserted here as
      living elsewhere. The service's own input type makes both filters optional
      (`readonly llm_run_id?: string; readonly raw_information_id?: string;`), so this file enforces
      nothing of it. A reader trusts the comment rather than the node.
    kind: contradicts
    correction: Remove the prose. The rule is held by the node and must be held in the route DTO's code.
    node: rules/knowledge-base/listing-requires-a-filter
  - file: src/modules/query-retrieval/service/accepted-fragments.service.ts
    where: header comment, lines 11-13
    evidence: >-
      // Tombstone
      // short-circuit is in the repository SQL (`NOT EXISTS compliance_deletion`),
      // per back-spec BR-14: tombstoned RawInformation rows are silently omitted.
    cost: >-
      The compliance-deletion exclusion is stated and attributed to a back-spec rule in prose. No code in
      this file performs it, so a reader looking for where the exclusion is decided finds a citation of a
      document that is not the specification.
    kind: contradicks
    correction: Remove the prose. The exclusion is held by the node and, in code, by the repository SQL.
    node: rules/knowledge-base/listing-excludes-compliance-deleted
