findings:
  - file: src/modules/query-retrieval/service/errors.ts
    where: >-
      EmptyProvenanceError constructor, the message passed to super(), line 75
    evidence: >-
      `provenance chain is empty for ${anchorKind} ${anchorId} (legacy-data inconsistency).`
    cost: >-
      The message tells whoever reads the failure that an empty provenance chain comes from legacy data. The specification only says such a read is refused with SYSTEM_INTERNAL_ERROR. It never says where an empty chain comes from. The code therefore holds a claim about cause that looks like a business decision. A later reader would look for it in the specification and not find it.
    kind: unstated
    correction: >-
      Either give the cause of an empty provenance chain a node, in the analysis that owns `rules/knowledge-base/empty-provenance-chain-refused`, or drop the "(legacy-data inconsistency)" claim from the message.
    node: rules/knowledge-base/empty-provenance-chain-refused
  - file: src/modules/query-retrieval/service/errors.ts
    where: >-
      InvalidSearchQueryError constructor, the `too_long` branch of the message, line 16
    evidence: >-
      `"query exceeds 1000 characters"`
    cost: >-
      The 1000-character limit is written into a message string in this file. The node holds it and this file is not bound to that fact. If the node's limit moves, this text keeps saying 1000 and nothing reaches it. The message is prose about a value held elsewhere. The check that enforces it is not in this file, so I did not judge that part.
    kind: restates
    correction: >-
      Remove the literal from the message, for example "query is too long", so the limit lives only in the node and in the code that enforces it.
    node: rules/knowledge-base/search-query-length
