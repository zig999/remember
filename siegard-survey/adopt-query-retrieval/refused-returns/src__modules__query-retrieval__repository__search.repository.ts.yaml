findings:
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: parseTsQuery, line 39, and the same parse in every layer query (lines 77, 123, 179)
    evidence: >-
      SELECT websearch_to_tsquery($1::regconfig, $2)::text AS q
    cost: >-
      The owner's query text is read with web-search operator syntax. The file's own comment gives "OR -" as an example: OR, minus-exclusion and quoted phrases are operators, and terms combine as AND. No node states the query grammar. search-query-must-parse only says a parse that yields no term is refused. The grammar lives only in this Postgres function choice, so a reader who looks in the specification will not learn that "-word" excludes or that "a OR b" is an alternative.
    kind: unstated
    correction: >-
      A node has to state how the query text is interpreted (operators, phrases, implicit conjunction). The search-query or search-query-must-parse node is the natural home.
    node: rules/knowledge-base/search-query-must-parse
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: searchNodeAliasLayer, line 123 (score) and line 124 (matched_alias_ids)
    evidence: >-
      (max(ts_rank_cd(to_tsvector($1::regconfig, na.alias), websearch_to_tsquery($1::regconfig, $2))) * $3::float)::float AS score
    cost: >-
      A node matched through several aliases scores as its best single alias, not the sum or the mean. That rule changes which nodes rank first, and no node holds it. node-layer-matches-through-aliases says only that any one matching alias matches the node, and layer-weights gives the weights without saying how a match's strength is measured. A future edit could change the aggregation and nothing in the specification would say which behavior was decided.
    kind: unstated
    correction: >-
      Add to node-layer-matches-through-aliases, or to a new node, how a node's score is drawn from its several matching aliases.
    node: rules/knowledge-base/node-layer-matches-through-aliases
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: searchNodeAliasLayer, line 130
    evidence: >-
      ORDER BY score DESC, kn.canonical_name ASC, kn.id ASC
      LIMIT $4
    cost: >-
      The specified order is score descending, then recording time (a node counts as never recorded), then identifier ascending. Here canonical name ascending sits between score and identifier, and this order decides which nodes survive the layer LIMIT. So a name-based tie-break, which the specification never states, determines which tied nodes reach the result. The next reader will look in search-ranking and not find it.
    kind: contradicts
    correction: >-
      Either the node-layer order follows search-ranking (score, then never-recorded, then id), or search-ranking has to state the canonical-name tie-break.
    node: rules/knowledge-base/search-ranking
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: listProvenanceForLinks (lines 293-313) and listProvenanceForFragments (lines 256-275)
    evidence: >-
      FROM provenance p
      JOIN information_fragment f ON f.id = p.fragment_id
      JOIN fragment_source fs     ON fs.fragment_id = f.id
      JOIN raw_chunk rc           ON rc.id = fs.raw_chunk_id
      JOIN raw_information ri     ON ri.id = rc.raw_information_id
     WHERE p.link_id = ANY($1::uuid[])
    cost: >-
      The rule says search shows no fragment whose raw information was deleted for compliance, "neither as a search item nor as the support of one". These support queries have no filter on fragment status, chunk supersession or compliance deletion. The fragment layer excludes such fragments only through status = 'accepted'. A link that also has provenance from a compliance-deleted fragment would list that fragment as support unless the service filters it, which this file does not show. Where the exclusion is held is therefore unclear.
    kind: contradicts
    correction: >-
      The support queries need to exclude fragments (and chunks) of compliance-deleted raw information, or the exclusion has to be shown to be enforced elsewhere and the node bound to that file.
    node: rules/knowledge-base/search-excludes-compliance-deleted-sources
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: listProvenanceForNodes, line 373
    evidence: >-
      ORDER BY kn.id, f.created_at DESC, f.id ASC
    cost: >-
      The order of the supporting fragments shown under a node item (newest fragment first) is a visible choice, and no node holds it. provenance-in-recording-order covers only the provenance of links and attributes. The order therefore lives only in this ORDER BY.
    kind: unstated
    correction: >-
      A node has to state the order of the fragments supporting a node search item. search-item or a new rule is the natural home.
    node: domain/knowledge-base/search-item
