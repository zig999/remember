  - node: domain/knowledge-base/document-context
    held_at: >-
      The `observeRefusal` function and the `EXPECTED.incompleteContextRefused` expectation. The shape itself is declared in another file and is only read here.
    evidence: >-
      `schemaAcceptsContextWithoutModel: DocumentContextSchema.safeParse({ summary: FIRST_LINE, entities: [] }).success` and `schemaAcceptsContextWithoutSummary: DocumentContextSchema.safeParse({ entities: [], model: CONTEXT_MODEL }).success` are both expected `false`. `contextOf` parses `DocumentContextSchema.nullable().parse(recordedContext(world))`.
  - node: domain/knowledge-base/document-context-status
    held_at: >-
