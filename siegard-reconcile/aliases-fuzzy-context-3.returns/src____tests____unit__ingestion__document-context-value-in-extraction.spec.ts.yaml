  - node: rules/knowledge-base/document-context-model
    held_at: >-
      The `recordedContextEqualsShownContext` expectation, in `observeProducedContext`. The configured model value `CONTEXT_MODEL` comes from the helper file.
    evidence: >-
      `recordedModel: contextOf(produced)?.model, readerModels: readerModels(produced)` is expected to equal `recordedModel: CONTEXT_MODEL, readerModels: [CONTEXT_MODEL]`.
  - node: rules/knowledge-base/document-context-read-first
    held_at: >-
      The `observeProducedContext` function and `EXPECTED.producedContextShownToEveryChunk`. They show that a reading is made and yields a context that is then shown to the chunks.
    evidence: >-
      `const produced = await extractedAfterReading({ summary: SUMMARY_LINES.join("\n"), entities: [MARIA, ACME, UNKNOWN_TYPE] });` is expected to give `chunksRead: CHUNK_COUNT` and `showsSummaryAndEntities: EVERY_CHUNK_TRUE`.
