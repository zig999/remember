  - node: constraints/document-content-is-data
    held_at: >-
      nowhere
    evidence: >-
      The expectations are `EXPECTED.producedContextShownToEveryChunk` and `showsSummaryAndEntities: EVERY_CHUNK_TRUE`. They check that each prompt `includes` the summary and names. Nothing checks that the content is marked apart from the instructions.
