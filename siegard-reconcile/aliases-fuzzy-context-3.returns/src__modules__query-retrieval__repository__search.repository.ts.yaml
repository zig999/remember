findings:
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      The score expressions of searchFragmentLayer, searchNodeAliasLayer (exact node layer) and searchChunkLayer, lines 43, 76 and 161.
    evidence: >-
      `(ts_rank_cd(f.text_search, websearch_to_tsquery($1::regconfig, $2)) * $3::float)::float AS score`; `(max(ts_rank_cd(to_tsvector($1::regconfig, na.alias), websearch_to_tsquery($1::regconfig, $2))) * $3::float)::float AS score`; `(ts_rank_cd(rc.text_search, websearch_to_tsquery($1::regconfig, $2)) * $3::float)::float AS score`
    cost: >-
      The strength of a fragment-layer, exact node-layer or chunk-layer match is the cover-density text rank, and that choice lives only in these queries. No node says what a match's strength is on those layers. layer-weights says only that strength is weighted, and approximate-match-strength defines it for the approximate node layer alone. The next reader looks in the specification for what ranks one match above another and finds no answer. Swapping the rank function would change every search ordering with no node to disagree with.
    kind: unstated
    correction: >-
      Give the strength of a match on the fragment, exact node and chunk layers a node. rules/knowledge-base/layer-weights is the natural home, or a sibling of approximate-match-strength.
    node: rules/knowledge-base/layer-weights
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      The ORDER BY ... LIMIT clauses that choose which candidates each layer keeps, in searchFragmentLayer, searchNodeAliasLayer, APPROXIMATE_NODE_ALIAS_SQL and searchChunkLayer, lines 47-48, 83-84, 119-120 and 165-166.
    evidence: >-
      `ORDER BY score DESC, f.created_at DESC, f.id ASC LIMIT $4`; `ORDER BY score DESC, kn.canonical_name ASC, kn.id ASC LIMIT $4`; `ORDER BY score DESC, rc.id ASC LIMIT $4`
    cost: >-
      search-layer-candidate-cap says a layer keeps at most 200 candidates before ranking. It does not say which ones survive the cut when more match. This file decides it, with tie-breaks that differ by layer: newest fragment first, canonical name ascending, chunk identifier ascending. The set of kept candidates, and so the search total, depends on a rule no node holds. search-ranking orders the final items and does not govern this cut.
    kind: unstated
    correction: >-
      State in a node which candidates a layer keeps when it has more than the cap, tie order included. search-layer-candidate-cap is the node that should hold it.
    node: rules/knowledge-base/search-layer-candidate-cap
