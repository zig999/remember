looked_past: >-
  The first test reads the known versions by parsing the refusal message with `/Known versions:\s*([^.]*)\./`, and the regex windows such as `{0,120}` are test heuristics. They couple the test to the wording of the emitted refusal and to the prompt's phrasing. Both are test design rather than a domain fact, so I did not report them.
