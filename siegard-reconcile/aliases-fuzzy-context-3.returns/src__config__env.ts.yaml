looked_past: >-
  The operational defaults PORT 3000, LOG_LEVEL info, PG_POOL_MIN 2, PG_POOL_MAX 10, PG_STATEMENT_TIMEOUT_MS 10000 and the DATABASE_URL and NEON_AUTH_URL format checks are deployment configuration rather than domain facts, so they are not reported. Also not reported: the OWNER_TZ default and the ANTHROPIC_API_KEY, LOCAL_OPERATOR_TOKEN and unknown-time-zone refusals, which nodes outside this set (rules/chat/owner-time-zone-default, constraints/anthropic-key-required, constraints/local-operator-token-minimum-length, constraints/local-operator-token-needs-explicit-development, constraints/owner-time-zone-must-be-known) already hold and which the trace already binds here.
