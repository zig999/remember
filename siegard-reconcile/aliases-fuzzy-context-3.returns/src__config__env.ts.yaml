    cost: >-
      A threshold of 20 turns after which summarising applies is a rule the code states, and no node holds it.
      rules/chat/rolling-summary-refresh makes a refold depend on owner-written messages older than the recent
      window, not on a turn count. The two answer differently for a conversation of fewer than 20 turns, and the
      reader looking in the specification finds only the first.
    kind: unstated
    correction: >-
      The analysis would give the turn count after which summarising applies a node, or settle that the setting is not
      a rule and remove it.
