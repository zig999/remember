      CHAT_ENABLED: z.union([z.boolean(), z.enum(["true", "false"])]).transform(...).default(true)
    cost: >-
      The chat-enabled default is held here and the node is not bound to this file. A change to the node does not
      reach this declaration through --check.
    kind: contradicts
    correction: >-
      Bind rules/chat/chat-enabled-by-default to src/config/env.ts.
    node: rules/chat/chat-enabled-by-default
