findings:
  - file: src/config/env.ts
    where: >-
      line 12-13, the CORS_ORIGINS schema default
    evidence: >-
      CORS_ORIGINS: z.string().default("http://localhost:5173,http://127.0.0.1:5173")
    cost: >-
      Which origins are allowed when nothing configures them is a decision about who may call the system from a
      browser. It lives only in this default. The next reader looks for it in the specification, finds only that an
      answer to an allowed origin carries that origin, and cannot tell which origins those are.
    kind: unstated
    correction: >-
      The analysis would give the default set of allowed origins a node, beside
      constraints/answers-carry-allowed-origin, which states only how an allowed origin is answered.
    node: constraints/answers-carry-allowed-origin
  - file: src/config/env.ts
    where: >-
      line 39, the NEON_AUTH_JWKS_TTL_S schema entry
    evidence: >-
      NEON_AUTH_JWKS_TTL_S: z.coerce.number().int().min(60).default(600)
    cost: >-
      The 600-second default and the 60-second floor for how long the auth provider's key set is kept are thresholds
      the code applies. A token signed with a rotated key is refused or admitted according to them, and no node states
      them.
    kind: unstated
    correction: >-
      The analysis would give the key-set lifetime, its default and its minimum, a node. The nearest nodes state only
      that a key set which cannot be fetched is a refusal.
  - file: src/config/env.ts
    where: >-
      line 50, the INGEST_MODEL schema default
    evidence: >-
      INGEST_MODEL: z.string().min(1).default("claude-sonnet-4-6")
    cost: >-
      The node holds this default, but this declaration is its only code home in this file and the node is not bound
      here. When the node moves, --check does not reach this file. If the node's bound file also holds the value,
      there are two homes and nobody knows which was decided.
    kind: contradicts
    correction: >-
      Bind rules/knowledge-base/default-extraction-model to src/config/env.ts so the declaration is the claimed home.
      Code never reads the specification, and the bind is what closes it.
    node: rules/knowledge-base/default-extraction-model
  - file: src/config/env.ts
    where: >-
      lines 54-57, the CHAT_ENABLED schema default
