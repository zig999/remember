certified:
  - node: rules/knowledge-base/expansion-decay
    state: covered
    tests:
      - file: src/__tests__/unit/query-retrieval/search-service-expansion.spec.ts
        name: >-
          scores a link reached at hop 1 from a matched node at 0.5 times the matched node's score
      - file: src/__tests__/unit/query-retrieval/search-service-expansion.spec.ts
        name: >-
          scores a link reached at hop 2 from a matched node, neither endpoint being matched, at 0.25 times the matched node's score
      - file: src/__tests__/unit/query-retrieval/search-service-expansion.spec.ts
        name: >-
          scores a link reached at hop 3 from a matched node, neither endpoint being matched, at 0.125 times the matched node's score
      - file: src/__tests__/unit/query-retrieval/search-service-expansion.spec.ts
        name: >-
          scores every expanded link at 0.5 raised to its hop times the score of the matched node it was reached from, whichever matched node that is
      - file: src/__tests__/unit/query-retrieval/search-service-expansion.spec.ts
        name: >-
          scores a link whose target is the matched node at 0.5 times its score at hop 1, and the link beyond it walked the same way at 0.25 times at hop 2
      - file: src/__tests__/unit/query-retrieval/search-service-expansion.spec.ts
        name: >-
          scores the link after a change of walking direction at 0.25 times the matched node's score at hop 2: an outgoing link followed by an incoming one
      - file: src/__tests__/unit/query-retrieval/search-service-expansion.spec.ts
        name: >-
          scores the link after a change of walking direction at 0.25 times the matched node's score at hop 2: an incoming link followed by an outgoing one
      - file: src/__tests__/unit/query-retrieval/search-service-expansion.spec.ts
        name: >-
          expands from it like any matched node, scoring a link at hop h at 0.5 raised to h times the score of the matched node it was reached from, whether that node was matched exactly or approximately
