findings:
  - file: src/app.ts
    where: >-
      line 55, the constant BODY_LIMIT_BYTES, passed as bodyLimit to Fastify() at line 59
    evidence: >-
      const BODY_LIMIT_BYTES = 11 * 1024 * 1024;
      ... bodyLimit: BODY_LIMIT_BYTES,
    cost: >-
      The 11 MiB ceiling is applied app-wide here, and the same figure is declared again as POST_INGEST_BODY_LIMIT in src/modules/ingestion/routes/ingestion.routes.ts. The node constraints/request-body-ceiling is bound only to the routes file. If the node's figure changes, --check does not reach this file, and the two copies can drift without anyone knowing which one was decided.
    kind: contradicts
    correction: >-
      The node is bound to the routes file only. A bind that also claims this file would make the declaration here a held home, since code never reads the specification. Alternatively the fact is held once, in one bound file.
    node: constraints/request-body-ceiling
  - file: src/app.ts
    where: >-
      lines 64-71, the CORS default origins and allowed methods
    evidence: >-
      const corsOrigins = env.CORS_ORIGINS ?? [
          "http://localhost:5173",
          "http://127.0.0.1:5173",
        ];
      ... methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
    cost: >-
      Which browser origins may call the BFF when nothing is configured, and which HTTP methods cross origins, is a rule the code decides and no node holds (a search of the specification for CORS and for 5173 found nothing). The next reader looks for it in the specification and finds nothing. The default origin port is 5173, which the project's CLAUDE.md names as another project's port, so the decision is visible only in this file.
    kind: unstated
    correction: >-
      An analysis would have to give the cross-origin policy a node. Candidate home: contracts/knowledge-base/access, which already holds the answers every request receives.
    node: contracts/knowledge-base/access
  - file: src/app.ts
    where: >-
      lines 82-85, the /_self route inside the authenticated scope
    evidence: >-
      scoped.get("/_self", async (request) => ({
            ok: true,
            result: { user_id: request.user?.id ?? null },
          }));
    cost: >-
      An authenticated endpoint that answers the owner's identity as user_id, with null when absent, is stated by the code and by no node (a search of the specification for _self found nothing). The access contract names authenticate-owner, route-request and read-health only. A client reading the specification will not know this operation exists or what it answers.
    kind: unstated
    correction: >-
      An analysis would have to decide whether /_self is an operation and, if so, record it in a contract. Candidate home: contracts/knowledge-base/access.
    node: contracts/knowledge-base/access
  - file: src/app.ts
    where: >-
      lines 108-115, the toolNames list handed to registerIngestMcpTransport
    evidence: >-
      "ingest_document",
              "ingest_directed",
              "health",
              "get_ingestion_status",
              "list_recent_ingestions",
    cost: >-
      The MCP tool get_ingestion_status is exposed on the ingest endpoint, and no node names it (a search of the specification for ingestion_status found nothing). The ingestion contract names read-llm-run, which it says both REST and MCP carry, but it does not say this tool is that operation. Anyone looking for the MCP surface in the specification cannot tell whether the tool is specified.
    kind: unstated
    correction: >-
      An analysis would have to record the tool in contracts/knowledge-base/ingestion, either as read-llm-run's MCP spelling or as an operation of its own.
    node: contracts/knowledge-base/ingestion
