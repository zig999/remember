certified:
  - node: scenarios/knowledge-base/retried-run-reuses-context
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/retry-reuses-document-context.spec.ts
        name: >-
          makes no preliminary reading and shows each chunk the context the run held when a retried run holding a document context is extracted again
      - file: src/__tests__/unit/ingestion/retry-reuses-document-context.spec.ts
        name: >-
          leaves the document context recorded when a failed run holding one is retried
    why: >-
      Both then-clauses are asserted directly, in one test that exists for them. A failed run
      holding a produced document context is retried and extracted again. The test then asserts
      that no preliminary-reading call is made (readings 0). It also asserts that every one of
      the three chunk calls carries the held context's summary and every entity name. If a
      second reading were made, or any chunk were shown without the held context, the test
      would fail. The second test supports this: it shows the held context is still recorded
      after the retry. The proof file never states that the run is under prompt version v5.
      The failedRunWorld fixture would set that, and it was outside what this certification
      allowed me to open. So the scenario's given about the prompt version is fixed outside the
      proof under judgment. Nothing in the proof itself contradicts it.
