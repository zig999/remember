findings:
  - file: src/modules/ingestion/service/directed-run.ts
    where: >-
      lines 1 and 3, the exported constants DIRECTED_MODEL and DIRECTED_PROMPT_VERSION
    evidence: >-
      export const DIRECTED_MODEL = "directed" as const;
      export const DIRECTED_PROMPT_VERSION = "directed-v1" as const;
    cost: >-
      The node rules/knowledge-base/directed-ingestion-run states that a directed ingestion opens an LLM run of model directed and prompt version directed-v1. The trace binds that node to directed-ingestion.service.ts only. The two values are declared in directed-run.ts, which the node is not bound to. directed-ingestion.service.ts and entity-resolution.service.ts import them from here. If the node's values change, trace.py --check does not reach this file, so the declaration can drift from the node unnoticed.
    kind: contradicts
    correction: >-
      The values agree with the node. What is missing is the bind: the node rules/knowledge-base/directed-ingestion-run would have to be bound to this file as well, because this is where the values are declared. The code cannot read the specification, so a rebind or a trace link closes the finding, not a code change.
    node: rules/knowledge-base/directed-ingestion-run
