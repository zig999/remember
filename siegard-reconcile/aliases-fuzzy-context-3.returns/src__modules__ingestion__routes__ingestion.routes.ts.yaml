  - node: constraints/request-body-ceiling
    held_at: >-
      the constant POST_INGEST_BODY_LIMIT and its use as the bodyLimit option of the POST "/raw-information" route.
    evidence: >-
      const POST_INGEST_BODY_LIMIT = 11 * 1024 * 1024; app.post("/raw-information", { bodyLimit: POST_INGEST_BODY_LIMIT }, ...)
  - node: constraints/document-content-is-data
    held_at: >-
      nowhere
    evidence: >-
      The file registers routes and does not build any prompt. Its only extraction call is `runLlmExtraction(deps.pool, params.llmRunId, deps.logger, orchestratorCatalog, {...})`.
  - node: constraints/extraction-model-call-bounded
    held_at: >-
      nowhere
    evidence: >-
      The file sets no timeout and no retry count. It only forwards `env: orchestratorEnv` and `anthropicFactory` to `runLlmExtraction`.
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      the REST routes in registerIngestionRoutes and the error mapping in handleProposeMirror. These cover intake, read-raw-information, list-raw-chunks, read-llm-run, list-tool-calls, run-extraction, retry-llm-run and the four propose mirrors.
    evidence: >-
      `if (err instanceof RunNotRunnableError) { return reply.status(409).send({ ok: false, error: { code: err.code, ... current_status: err.currentStatus } }) }`; `if (err instanceof LlmProviderFatalError) { return reply.status(502) ... partial_run: err.partialRun }`; `if (err instanceof ExtractionFatalError) { return reply.status(500) ... }`; `if (err instanceof RunNotRetryableError) { return reply.status(409) ...}`; `if (run.status !== "running") { throw new RunNotRunningError(llmRunId, run.status); }` mapped to 409; `if (isValidationFailure(err)) { throw new ProposeMirrorEnvelopeReject({ ok: false, ... }) }` answered with `reply.status(200).send(err.envelope)`; `RunLlmExtractionRequestSchema = z.object({}).strict().default({})`.
