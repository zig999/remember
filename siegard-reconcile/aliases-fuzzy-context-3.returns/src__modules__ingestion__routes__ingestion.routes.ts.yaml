looked_past: >-
  The route-registration conditions (the run route only when catalog and env are present, the propose-node, propose-link and propose-attribute mirrors only when a catalog is present, with a warn log otherwise) and the repeated 404 mapping blocks are wiring and code-quality matters, not domain facts, so they are another judgment's.
