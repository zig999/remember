findings:
  - file: src/__tests__/unit/env.spec.ts
    where: >-
      line 28, in the test "parses a valid environment"
    evidence: >-
      expect(env.NEON_AUTH_JWKS_TTL_S).toBe(600);
    cost: >-
      The 600-second life of the cached signing-key set is a value the test pins as the expected default. No node in the specification states it. The next reader will look for it in the specification and find nothing, so the test and the loader become the place where this decision lives.
    kind: unstated
    correction: >-
      An analysis would need to give this default a node. The constraints under specification/constraints/ that cover authentication, such as every-operation-requires-owner-authentication, are the likely home.
  - file: src/__tests__/unit/env.spec.ts
    where: >-
      lines 29-30, in the test "parses a valid environment"
    evidence: >-
      expect(env.PG_POOL_MIN).toBe(2);
          expect(env.PG_POOL_MAX).toBe(10);
    cost: >-
      The minimum of 2 and maximum of 10 store connections are values the test pins as the expected defaults. A search of the specification root for "pool" finds no node holding them. They live only in code and test, where a reader who looks in the specification will not find them.
    kind: unstated
    correction: >-
      An analysis would need to give these defaults a node.
  - file: src/__tests__/unit/env.spec.ts
    where: >-
      line 31, in the test "parses a valid environment"
    evidence: >-
      expect(env.PG_STATEMENT_TIMEOUT_MS).toBe(10_000);
    cost: >-
      The 10 000 ms store-statement limit is a value the test pins. The constraint that an operation whose statement times out answers that a backing service is unavailable names the behaviour but gives no duration. The value therefore lives only in code and test.
    kind: unstated
    correction: >-
      An analysis would need to give the statement time limit a node, or add it to the node that governs the time-out answer.
  - file: src/__tests__/unit/env.spec.ts
    where: >-
      lines 46-51, in the test "throws EnvValidationError when DATABASE_URL is missing"
    evidence: >-
      it("throws EnvValidationError when DATABASE_URL is missing", () => {
          // TC-01: missing required var crashes with a clear message.
          const { DATABASE_URL: _unused, ...rest } = baseEnv;
          void _unused;
          expect(() => loadEnv(rest)).toThrowError(EnvValidationError);
    cost: >-
      The test states that the system refuses to start without a store connection string. Only the Anthropic key has such a startup constraint (anthropic-key-required), and the owner-time-zone and local-operator-token constraints cover those settings. No node holds this refusal, so it exists only as a test and a loader branch.
    kind: unstated
    correction: >-
      An analysis would need to add a startup constraint for the store connection string, next to anthropic-key-required.
  - file: src/__tests__/unit/env.spec.ts
    where: >-
      lines 53-58, in the test "throws when DATABASE_URL has an unsupported scheme"
    evidence: >-
      expect(() => loadEnv({ ...baseEnv, DATABASE_URL: "mysql://host/db" })).toThrowError(
            EnvValidationError
          );
    cost: >-
      The test states a refusal rule, namely that the connection string must use a postgres or postgresql scheme. A search of the specification found no node holding it, so the format guard is decided only in code and test.
    kind: unstated
    correction: >-
      An analysis would need to give the connection-string format a node, together with the missing-value refusal above.
  - file: src/__tests__/unit/env.spec.ts
    where: >-
      lines 60-64, in the test "throws when NEON_AUTH_URL is missing"
    evidence: >-
      it("throws when NEON_AUTH_URL is missing", () => {
          const { NEON_AUTH_URL: _unused, ...rest } = baseEnv;
          void _unused;
          expect(() => loadEnv(rest)).toThrowError(EnvValidationError);
    cost: >-
      The test states that the system does not start without the auth provider address. No node holds this startup refusal, so only code and test decide it.
    kind: unstated
    correction: >-
      An analysis would need to add a startup constraint for the auth provider address.
  - file: src/__tests__/unit/env.spec.ts
    where: >-
      lines 101-107, in the test "produces a human-readable, multi-line message"
    evidence: >-
      expect(err.message).toMatch(/Invalid backend environment configuration/);
    cost: >-
      The text the system prints at a failed start is pinned here as an assertion. No node holds this message or the rule that it names every failing variable. An operator or test relying on the wording has nowhere in the specification to check it.
    kind: unstated
    correction: >-
      An analysis would need to give the startup refusal message a node, or add it to the startup constraints.
  - file: src/__tests__/unit/env.spec.ts
    where: >-
      line 211, in the test "applies the v2 defaults (chat.back.md v2.0.0 §8)"
    evidence: >-
      expect(env.CHAT_SUMMARY_AFTER_TURNS).toBe(20);
    cost: >-
      The default of 20 turns before a rolling summary starts is pinned as a business value. No node states it. rules/chat/rolling-summary-refold-when-older-messages gives the trigger as owner-written messages older than the recent window, with no turn count. The value lives only in code and test.
    kind: unstated
    correction: >-
      An analysis would need to give the turn threshold a node, or reconcile it with the node that sets the refold trigger.
