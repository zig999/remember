looked_past: >-
  The file's comments cite TC-, BR- and chat.back.md identifiers and restate facts that nodes outside this set hold (anthropic-key-required, local-operator-token-needs-explicit-development, default-chat-prompt-version and its lineage). Which of them restate and which contradict depends on code in src/config/env.ts, which is outside this file set, so I do not report them. The other assertions state values that nodes outside the set hold: the chat defaults, the owner time zone, the 16-character token floor, and the chat-enabled and directed-ingestion-disabled defaults.
