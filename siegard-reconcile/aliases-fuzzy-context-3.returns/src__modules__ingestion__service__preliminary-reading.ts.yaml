  - node: rules/knowledge-base/document-context-read-first
    held_at: >-
      shouldReadDocument() and readsDocumentFirst(). Together they require prompt version v5 or later, more than one chunk, content of at most 100000 UTF-16 code units, and no document context held by the run. produceDocumentContext() then reads the content once through readDocumentContext().
    evidence: >-
      readsDocumentFirst(request.run.prompt_version) && request.chunkCount > 1 && request.content.length <= PRELIMINARY_READING_MAX_CONTENT_UNITS && (request.run.document_context === null || request.run.document_context === undefined); export const PRELIMINARY_READING_MAX_CONTENT_UNITS = 100_000 as const;
  - node: rules/knowledge-base/document-context-status-kept-on-reuse
    held_at: >-
      The first branch of produceDocumentContext(). It returns the held context before any status is recorded.
    evidence: >-
      const held = request.run.document_context ?? null; if (held !== null) return held;
  - node: rules/knowledge-base/document-context-status-recorded
    held_at: >-
      skippedReadingStatus() gives single-chunk and too-long. recordFailedReading() records failed when the reading throws. recordProducedContext() records produced.
    evidence: >-
      if (request.chunkCount === SINGLE_CHUNK_COUNT) return "single-chunk"; if (request.chunkCount > SINGLE_CHUNK_COUNT && request.content.length > PRELIMINARY_READING_MAX_CONTENT_UNITS) { return "too-long"; } ... await recordReadingStatus(request.pool, request.run.id, "failed"); ... document_context_status: "produced",
  - node: rules/knowledge-base/document-context-summary-cut-to-five-lines
    held_at: >-
      The summary field built in readDocumentContext(), through cutSummaryToLines(). The limit comes from SUMMARY_MAX_LINES, imported from ../prompts/preliminary-reading.js.
    evidence: >-
      summary: cutSummaryToLines(reading.summary, SUMMARY_MAX_LINES), ... if (lines.length <= maxLines) return summary; return lines.slice(0, maxLines).join(LINE_BREAK);
  - node: rules/knowledge-base/document-context-summary-lines
    held_at: >-
      cutSummaryToLines(). A line ends at the newline character, a trailing empty segment is dropped, and carriage return is not a separator. The number 5 is not in this file; it is imported as SUMMARY_MAX_LINES.
    evidence: >-
      const LINE_BREAK = "\n"; ... const lines = summary.split(LINE_BREAK); if (lines[lines.length - 1] === "") lines.pop();
  - node: rules/knowledge-base/failed-preliminary-reading-continues
    held_at: >-
      The catch branch of produceDocumentContext(). It records the failure and returns null instead of rethrowing, so the caller goes on to the chunks.
    evidence: >-
      try { context = await readDocumentContext(request); } catch (err) { await recordFailedReading(request, err); return null; }
