findings:
  - file: src/__tests__/unit/query-retrieval/search-service-ranking.spec.ts
    where: >-
      the constant DECLARED_ITEM_KEYS (lines 500-511) and the test "answers a node, a link and a fragment item with no attribute the search item does not declare" (lines 513-544)
    evidence: >-
      const DECLARED_ITEM_KEYS = [
        "kind",
        "layer",
        "id",
        "score",
        "hop",
        "summary",
        "flags",
        "provenance",
        "match",
        "similarity",
      ];
      (the node domain/knowledge-base/search-item declares the attributes kind, layer, score, hop, summary, flags, match and similarity, plus the relationship role provenance, and no attribute id)
    cost: >-
      This file holds the search item's attribute vocabulary a second time, as the list its test treats as the authority on what the item "declares". It differs from the node by `id`, an attribute the node does not hold. When the node moves, the test keeps judging items against its own copy, because nothing ties the file to the node. The reader cannot tell whether the list or the node records what was decided.
    kind: contradicts
    correction: >-
      Where the item's identifier is a fact of the business, the search-item node has to hold it. The test would then compare against what the bind to that node claims and keep no list of its own. Giving the node an `id` attribute is the analysis's act, not this file's.
    node: domain/knowledge-base/search-item

