    evidence: >-
      `readonly aliases_not_admitted: readonly AliasNotAdmitted[];` and `reason: ALIAS_NOT_IN_SOURCE`, with `resolution: needsReview ? "needs_review" : "created_new"` and `resolution: "matched_existing"`.
