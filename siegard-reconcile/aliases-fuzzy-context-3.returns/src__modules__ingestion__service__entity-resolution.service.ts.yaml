looked_past: >-
  The file also implements four facts held by nodes outside its set and not bound to it in the candidate index (a blank alias is refused through `norm(a.alias) <> ''`, concurrent proposals are serialized by `pg_advisory_xact_lock`, a candidate's similarity is the highest alias trigram similarity, and a review pair is unique through `ON CONFLICT (node_id, candidate_node_id) DO NOTHING`), so they are attributions for the trace and not findings here.
