read:
  - node: rules/knowledge-base/alias-admitted-only-from-source
    held_at: >-
      ALIAS_ADMISSION_SQL, the `admitted` column, and admitAliases(), which splits the rows into admitted and notAdmitted.
    evidence: >-
      `COALESCE(r.directed OR (norm(a.alias) <> '' AND strpos(r.content_norm, norm(a.alias)) > 0), false) AS admitted`
      with `norm(ri.content) AS content_norm` taken from the run's raw_information, and `(lr.model = $2 AND lr.prompt_version = $3) AS directed`.
  - node: rules/knowledge-base/ambiguous-candidates-need-review
    held_at: >-
      decideFromCandidates() returning kind "ambiguous", createNewNode() with needsReview, insertMatchReviews(), and the LIMIT of findTrigramCandidates().
    evidence: >-
      `const TRIGRAM_CANDIDATE_LIMIT = 10;` and `export const MATCH_FLOOR = 0.55;`, then
      `return { kind: "ambiguous", candidates: aboveFloor };`, then
      `needsReview ? "needs_review" : "active"` and
      `INSERT INTO entity_match_review (node_id, candidate_node_id, similarity)`.
  - node: rules/knowledge-base/exact-alias-resolves
    held_at: >-
      findExactMatch(), consumed first in resolveWithAdmittedAliases(), which then calls matchExisting().
    evidence: >-
      `WHERE na.alias_norm = norm($1::text) AND kn.node_type_id = $2 AND kn.status = 'active'`, and
      `return { node_id: nodeId, resolution: "matched_existing" };`.
  - node: rules/knowledge-base/matched-node-gains-only-aliases
    held_at: >-
      matchExisting() attaching admission.admittedOtherThanName, and the is_name column of ALIAS_ADMISSION_SQL.
    evidence: >-
      `aliases: admission.admittedOtherThanName,` in matchExisting(), with
      `norm(a.alias) = norm($5::text) AS is_name` and `.filter((r) => !r.is_name)`.
  - node: rules/knowledge-base/name-normalization
    held_at: >-
      Every name comparison in the file goes through the database function norm(): findExactMatch, findTrigramCandidates, ALIAS_ADMISSION_SQL and the lock key.
      The definition of norm() is not in this file.
    evidence: >-
      `WHERE na.alias_norm = norm($1::text)`, `na.alias_norm % norm($1::text)` and
      `strpos(r.content_norm, norm(a.alias))` with `norm(ri.content) AS content_norm`.
  - node: rules/knowledge-base/new-node-aliases
    held_at: >-
      attachCanonicalAndAliases() and attachAliases(), called from createNewNode() with admission.admitted.
    evidence: >-
      `VALUES ($1, $2, 'canonical', $3)` with `args.canonicalName`, then
      `VALUES ($1, $2, 'alias', $3)` for each admitted alias, and `aliases: admission.admitted` in resolveWithAdmittedAliases().
  - node: rules/knowledge-base/no-candidate-creates-active-node
    held_at: >-
      decideFromCandidates() returning kind "novel", then createNewNode() with no review candidates.
    evidence: >-
      `if (aboveFloor.length === 0) { return { kind: "novel" }; }` and
      `reviewCandidates: decision.kind === "ambiguous" ? decision.candidates : [],` which leads to `needsReview ? "needs_review" : "active"` and `"created_new"`.
  - node: rules/knowledge-base/strong-candidate-resolves
    held_at: >-
      decideFromCandidates() returning kind "strong_unique", with the MATCH_STRONG constant.
    evidence: >-
      `export const MATCH_STRONG = 0.85;` and
      `if (strong.length === 1 && aboveFloor.length === 1) { return { kind: "strong_unique", nodeId: strong[0]!.node_id }; }`.
  - node: scenarios/knowledge-base/acronym-in-source-is-admitted
    held_at: >-
      The alias admission test in ALIAS_ADMISSION_SQL, together with attachCanonicalAndAliases() on the create path.
    evidence: >-
      `norm(a.alias) <> '' AND strpos(r.content_norm, norm(a.alias)) > 0` and
      `VALUES ($1, $2, 'canonical', $3)` followed by `VALUES ($1, $2, 'alias', $3)`.
  - node: scenarios/knowledge-base/admitted-acronym-resolves-later-proposal
    held_at: >-
      findExactMatch(), which matches the proposal's name against every alias row of an active node, canonical or not.
    evidence: >-
      `FROM node_alias na JOIN knowledge_node kn ON kn.id = na.node_id WHERE na.alias_norm = norm($1::text)` with `kn.status = 'active'`.
  - node: scenarios/knowledge-base/alias-absent-from-source-not-admitted
    held_at: >-
      admitAliases(), the notAdmitted mapping, and the aliases_not_admitted field of resolveOrCreateNode()'s result.
    evidence: >-
      `.map((r) => ({ alias: r.alias, reason: ALIAS_NOT_IN_SOURCE }))` and `return { ...resolved, aliases_not_admitted: admission.notAdmitted };`.
  - node: scenarios/knowledge-base/directed-alias-admitted-without-source
    held_at: >-
      The `directed` term of ALIAS_ADMISSION_SQL, fed by DIRECTED_MODEL and DIRECTED_PROMPT_VERSION in admitAliases().
    evidence: >-
      `SELECT (lr.model = $2 AND lr.prompt_version = $3) AS directed` and `COALESCE(r.directed OR (...), false) AS admitted`,
      with `DIRECTED_MODEL, DIRECTED_PROMPT_VERSION` passed as the query parameters.
