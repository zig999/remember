findings:
  - file: src/__tests__/unit/ingestion/preliminary-reading-model-call-bounds.spec.ts
    where: >-
      the second test, lines 215-223, together with overloadedFetch (lines 144-156), which answers every attempt with status 529
    evidence: >-
      it("calls the context model exactly three times for one preliminary reading when it answers a retryable error on every attempt", async () => {
      ... expect(readingAttempts).toHaveLength(MAX_ATTEMPTS_OF_ONE_CALL);
      ... const OVERLOADED_STATUS = 529;
    cost: >-
      The test fixes two facts as business facts. A provider answer of overloaded_error (status 529) is a retryable error. A call that keeps meeting one is retried until the retry allowance is used up, so exactly three attempts are made. The constraint only caps retries ("retried at most twice"). It names no retryable error and does not say the cap is always reached. A later reader looking for what is retried will look in the specification and find nothing. The only place this decision lives is this test's assertion, so changing the retry classification would fail the test with no node to say which side was decided.
    kind: unstated
    correction: >-
      Analysis would have to state in constraints/extraction-model-call-bounded, or in a rule beside it, which provider errors a model call retries and that it retries until the cap of two retries. Otherwise the test would have to assert only the cap ("at most three attempts").
    node: constraints/extraction-model-call-bounded
