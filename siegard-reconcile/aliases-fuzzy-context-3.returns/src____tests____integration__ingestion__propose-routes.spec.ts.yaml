  - node: contracts/knowledge-base/ingestion
    held_at: >-
      Not implemented here. Its REST answers for the four propose-* operations are asserted by the
      it() blocks of the five describe blocks, lines 495-916. Examples are the 200 with ok:true and
      status proposed, the 200 with ok:false VALIDATION_INVALID_FORMAT for chunks outside the run's
      source, the 404 RESOURCE_NOT_FOUND for an unknown run, the 409 BUSINESS_RUN_NOT_RUNNING, the
      422 for a missing field, and the closed-domain refusal with details value and allowed_values.
    evidence: >-
      `expect(res.statusCode).toBe(409);` with `expect(body.error.code).toBe("BUSINESS_RUN_NOT_RUNNING");`
      and `expect(body.error?.details.allowed_values).toEqual(["Apollo","Gemini","Mercury"]);`
