findings:
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      the file-header comment, lines 3-17 (the acceptance-criteria list)
    evidence: >-
      "//   - "POST /llm-runs/:id/propose-node returns 409 BUSINESS_RUN_NOT_RUNNING
      when run exists but is completed"
      //   - "POST /llm-runs/:id/propose-link returns 404 RESOURCE_NOT_FOUND when
      llmRunId is unknown"
      //   - "POST /llm-runs/:id/propose-attribute returns 422 on Zod parse failure
      (malformed body / missing required field)""
    cost: >-
      The comment restates the ingestion contract's refusals (409 BUSINESS_RUN_NOT_RUNNING,
      404 RESOURCE_NOT_FOUND, 422 over REST) as a second written home. The it() blocks of
      this file already assert the same codes and statuses in code. If the contract moves,
      this prose is not reached and keeps stating the old answer.
    kind: restates
    correction: >-
      Remove the header comment through the comment route, then run /reconcile over the file.
      The behavior is already asserted by the it() blocks and the contract already holds the fact.
    node: contracts/knowledge-base/ingestion
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      the "Note on the envelope semantics" comment, lines 24-28
    evidence: >-
      "// Note on the envelope semantics (BR-28 / SD-1 in delivery): any
      // `ValidationFailure` raised by the propose-* service surfaces as HTTP 200
      // with `{ ok: false, error: ... }`. ZodErrors at the route boundary continue
      // to surface as HTTP 422 via the global error handler"
    cost: >-
      The comment states, in prose, the split the contract holds between a 200 with
      `{ ok: false, error }` and a 422 over REST. The assertions `expect(res.statusCode).toBe(200)`
      with `expect(body.ok).toBe(false)` and `expect(res.statusCode).toBe(422)` in this file
      carry the same fact in code. A reader who trusts the comment looks for the rule in the
      test file and not in the specification.
    kind: restates
    correction: >-
      Remove the comment through the comment route, then run /reconcile over the file.
      The assertions stay.
    node: contracts/knowledge-base/ingestion
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      the comment inside the out-of-domain test of propose-fragment, lines 536-541
    evidence: >-
      "// the original criterion referenced
      // "text > 1000 chars" as the trigger; Zod's max(1000) intercepts that
      // before the service runs (it surfaces as HTTP 422 via the global handler"
    cost: >-
      The 1000-character limit on a fragment's text is stated in a comment of a test that
      never exercises it. The limit is held by the node fragment-text-length. The candidate
      index binds that node to src/modules/ingestion/mcp/mcp-schemas.ts, which I did not read
      because it is outside the file set. If the limit moves, this comment keeps stating 1000.
    kind: restates
    correction: >-
      Remove the comment through the comment route, then run /reconcile over the file.
    node: rules/knowledge-base/fragment-text-length
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      the TC-06 block comment, lines 795-806, and the comment above the allowed_values assertion, line 879
    evidence: >-
      "//   - out-of-domain     → 200 ok:false VALIDATION_INVALID_FORMAT envelope with
      ...
      //                          details = { value, allowed_values }; NO inserts"
      and "// allowed_values is lexicographically sorted per TC-02/TC-03 contract."
    cost: >-
      The comments restate the contract's answer for a value outside a closed domain
      (VALIDATION_INVALID_FORMAT, details value and allowed_values in sorted order, HTTP 200
      over REST). The assertions on `body.error?.details.value` and
      `toEqual(["Apollo","Gemini","Mercury"])` already hold the same fact in code in this file.
      The comments are a second written home, and "TC-02/TC-03 contract" points to a source
      that is not a node.
    kind: restates
    correction: >-
      Remove both comments through the comment route, then run /reconcile over the file.
    node: contracts/knowledge-base/ingestion
