  - node: constraints/document-content-is-data
    held_at: >-
      nowhere
    evidence: >-
      The test's END_TURN_MESSAGE returns text "done" and the test reads only the system text:
      `systemTextOf(world.requests[0])`. It never inspects how document content is marked in a request.
  - node: constraints/extraction-model-call-bounded
    held_at: >-
      nowhere
    evidence: >-
      The fake model is `stream: (req: ModelRequest): ExtractionMessageStream => { requests.push(req); return { finalMessage: async () => END_TURN_MESSAGE }; }`.
      It sets no timeout and counts no retries.
