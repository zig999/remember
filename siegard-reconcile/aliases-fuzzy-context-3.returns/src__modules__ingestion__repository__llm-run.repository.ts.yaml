    evidence: >-
      The file makes no model call. It holds no timeout and no retry count, only functions of the form `client.query(...)`.
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      Partly. findRecentIngestions holds the 80-character preview and the latest-run fields of list-recent-ingestions.
      findToolCallsByRun and countToolCalls serve list-tool-calls. findLlmRunById and aggregateToolCallOutcomes serve
      read-llm-run. retryLlmRunRow serves retry-llm-run. No refusal code or HTTP status is stated in this file.
    evidence: >-
      `left(ri.content, 80) AS content_preview`;
      `SELECT id, llm_run_id, tool_name, arguments, result, validation_outcome, created_at FROM tool_call WHERE llm_run_id = $1 ORDER BY created_at ASC, id ASC LIMIT $2 OFFSET $3`
