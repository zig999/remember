    held_at: >-
      nowhere
    evidence: >-
      The file only passes the value along and declares no shape for it:
      `document_context_status: DocumentContextStatus;` is imported from "../dto/llm-run.dto.js", and
      `SET document_context_status = $2::document_context_status` writes the value it is given.
  - node: domain/knowledge-base/information-fragment
    held_at: >-
      nowhere
    evidence: >-
      The file declares no shape for the fragment. It only inserts into and updates the table:
      `INSERT INTO information_fragment (llm_run_id, "text", confidence)`.
  - node: domain/knowledge-base/llm-run
    held_at: >-
      retryLlmRunRow and closeLlmRunRow, which hold the retry and the complete/fail operations. The row shape LlmRunRow is
      declared in ingestion.repository.ts and only re-exported here.
    evidence: >-
      `SET status = 'running', attempts = attempts + 1, finished_at = NULL WHERE id = $1 AND status = 'failed'`
      and `SET status = $2::llm_run_status, finished_at = now() WHERE id = $1 AND status = 'running'`
  - node: domain/knowledge-base/raw-information
    held_at: >-
      nowhere
    evidence: >-
      The shape is not declared here. findRecentIngestions only reads columns from the table:
      `FROM raw_information ri ... left(ri.content, 80) AS content_preview`.
  - node: domain/knowledge-base/tool-call
    held_at: >-
      The ToolCallRow interface, line 16.
    evidence: >-
      `export interface ToolCallRow { readonly id: string; readonly llm_run_id: string; readonly tool_name: IngestToolName; readonly arguments: Record<string, unknown>; readonly result: Record<string, unknown> | null; readonly validation_outcome: ValidationOutcome; readonly created_at: Date; }`
  - node: rules/knowledge-base/retry-keeps-document-context-status
    held_at: >-
      retryLlmRunRow, the UPDATE of the retried run, lines 170-180.
    evidence: >-
      The UPDATE sets only `status = 'running', attempts = attempts + 1, finished_at = NULL`.
      It never assigns document_context_status. The column is only returned in RETURNING.
  - node: scenarios/knowledge-base/retried-run-reuses-context
    held_at: >-
      Only the retry half sits here, in retryLlmRunRow. The retry leaves document_context untouched, so the retried run
      still holds it. The decision to skip a second preliminary reading is not in this file.
    evidence: >-
      The retry's `SET status = 'running', attempts = attempts + 1, finished_at = NULL` assigns no document_context,
      and `RETURNING ... document_context, document_context_status` hands the held context back.
  - node: constraints/document-content-is-data
    held_at: >-
      nowhere
    evidence: >-
      The file builds no prompt and presents no content to a model. It holds only SQL over llm_run, tool_call and information_fragment.
  - node: constraints/extraction-model-call-bounded
