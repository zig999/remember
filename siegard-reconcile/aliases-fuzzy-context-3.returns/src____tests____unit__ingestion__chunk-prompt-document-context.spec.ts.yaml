looked_past: >-
  The fake database picks its answers by regular expressions over the production SQL text (for example `/na\.alias_norm = norm/` and `/count\(\*\)::text AS n FROM raw_chunk/`), and the data and context detectors rely on the prompt's wording (`/\bdata\b/i`, `/document context/i`), which is test-suite construction rather than a domain fact and so another judgment's.
