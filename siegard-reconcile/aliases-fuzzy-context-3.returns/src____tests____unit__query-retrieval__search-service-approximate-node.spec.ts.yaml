findings:
  - file: src/__tests__/unit/query-retrieval/search-service-approximate-node.spec.ts
    where: >-
      the TRIGRAM_PATTERN constant (line 32), the PROSE_LAYER_STORES table (lines 274-277) and the describe block "searchKnowledgeService: prose layers stay lexical" (lines 279-288)
    evidence: >-
      const TRIGRAM_PATTERN = /similarity|<%|%>|\s%\s/;
      ...
      describe("searchKnowledgeService: prose layers stay lexical", () => {
        it.each(PROSE_LAYER_STORES)(
          "answers no %s-layer item for text that only a trigram match could reach",
          ... expect(body.items.filter((item) => item.layer === layer)).toEqual([]);
    cost: >-
      The test fixes a business decision: the fragment and chunk layers never match by trigram similarity, and only the node layer does. The nodes in the pack do not state it. prose-matching says only "Portuguese stemming and without regard to accents". node-layer-approximate-match and node-match confine trigram similarity to node aliases, but none of them says the prose layers exclude it. The only place that says "The fragment and chunk layers stay full-text only" is the "why" line of the decision log beside rules/knowledge-base/link-and-fragment-items-carry-no-match. That is a log, not a node. A reader who looks in the specification for what the prose layers match on finds no exclusion. If someone later adds fuzzy matching to those layers, nothing in the specification fails; only this test, which a person may edit, does.
    kind: unstated
    correction: >-
      The analysis would need to give the fact a node: the fragment layer and the chunk layer match query text only through the full-text parse, never through trigram similarity. prose-matching could carry it, or a sibling rule could. Until then the test is the only home of the exclusion.
    node: rules/knowledge-base/prose-matching
