findings:
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      searchKnowledgeService, lines 216-221 and 248-253: the node loop skips a matched node that holds no provenance, and expansion then starts only from the node items that were kept
    evidence: >-
      if (provenance.length === 0) continue;
      ...
      const expanded = await collectExpandedLinks(
            context,
            scoreMatchedNodes(items)
          );
    cost: >-
      The code decides that a matched knowledge node without provenance, which is not shown, also starts no expansion, so the links around it are never reached. A reader of expansion-starts-from-matched-nodes would expect expansion to start from every matched node. matched-node-requires-provenance only says the node does not surface. The decision exists only in this file, where the next reader will not look for it.
    kind: unstated
    correction: >-
      A node would have to say whether a matched node that does not surface still starts expansion. Candidates are rules/knowledge-base/expansion-starts-from-matched-nodes or rules/knowledge-base/matched-node-requires-provenance.
    node: rules/knowledge-base/expansion-starts-from-matched-nodes
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      resolveLayers, lines 469-471
    evidence: >-
      if (layers === undefined || layers.length === 0) {
          return new Set(ALLOWED_LAYERS);
        }
    cost: >-
      The code treats a query that names an empty list of layers as one that omitted them, and searches every layer. search-option-defaults only covers an omitted option. Whether an empty list means "no layers" or "all layers" is therefore a rule that lives only in this branch, and a reader of the specification cannot find it.
    kind: unstated
    correction: >-
      search-option-defaults, or another node of search-query, would have to say how a query that names an empty list of layers is read.
    node: rules/knowledge-base/search-option-defaults
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      resolveLinkTypeIds, line 486
    evidence: >-
      if (names === undefined || names.length === 0) return undefined;
    cost: >-
      The code treats an empty list of link types as no restriction, so expansion follows links of every type. expansion-restricted-to-named-link-types speaks only of a query that names link types. What an empty list does is decided here alone, and a reader of the specification cannot find it.
    kind: unstated
    correction: >-
      expansion-restricted-to-named-link-types, or a node of search-query, would have to say what a query that names an empty list of link types follows.
    node: rules/knowledge-base/expansion-restricted-to-named-link-types
