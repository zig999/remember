looked_past: >-
  The file also applies facts held by nodes outside this set, which are not findings. These are the uncertain filter, the matched-node and expanded-link provenance requirement, the low-confidence threshold of 0.4, the hop-0 and layer-node values, the summaries and the link-once scoring. The file also emits log lines and warnings, and it fetches chunk-layer hits that it uses only to count a deduplication figure for the log.
