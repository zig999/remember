certified:
  - node: rules/knowledge-base/node-item-shows-match
    state: covered
    tests:
      - file: src/__tests__/unit/query-retrieval/search-service-approximate-node.spec.ts
        name: answers an exactly matched node with the match exact and no similarity, and an approximately matched node with the match approximate and the highest word similarity of its aliases, not its weighted score
      - file: src/__tests__/unit/query-retrieval/search-service-approximate-node.spec.ts
        name: answers the knowledge nodes Petrobras and Petrobrás Distribuidora for petrobras as two node items, each carrying the match exact
      - file: src/__tests__/unit/query-retrieval/search-service-approximate-node.spec.ts
        name: answers a knowledge node matched both exactly and approximately with the match exact
      - file: src/__tests__/unit/query-retrieval/search-service-approximate-node.spec.ts
        name: answers a knowledge node matched both exactly and approximately with no similarity, though one of its aliases is similar enough for an approximate match
    why: >-
      The fact is covered by the first named test. With expand off, every item is a hop-0 item.
      That test fails if a hop-0 node item stops carrying `match` exact or approximate. It also
      fails if an approximate item stops carrying its similarity: the similarity is 0.8 and the
      weighted score is 0.72, so a score passed off as the similarity also fails it. Over-assertion
      findings, left for a reader to route: (1) The first test and the "no similarity" test assert
      that an exactly matched node has no similarity at all. The node does not state that. (2) The
      two "matched both exactly and approximately" tests assert that a node found by both routes
      comes back as `match` exact with no similarity. The node does not state that rule either.
      (3) The first test's name claims "the highest word similarity of its aliases". The stand-in
      client returns one precomputed similarity per row, so nothing here exercises picking the
      highest value across several aliases. The test proves only that the service passes the row's
      similarity through.
