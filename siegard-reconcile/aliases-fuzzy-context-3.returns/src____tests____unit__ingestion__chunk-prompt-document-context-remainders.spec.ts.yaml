  - node: rules/knowledge-base/extraction-reads-chunks-in-order
    held_at: >-
      The second `it` block, with `tailShownWithChunk`, `readOrder`, `missingFromChunks`, `EXPECTED_WITH_CONTEXT` and `EXPECTED_WITHOUT_CONTEXT`. It pins index order against a store that returns the chunks out of order, one model call in flight at a time, source type, document date, title, reception time, the last 200 code points of the predecessor, and the context only when the run holds one.
    evidence: >-
      `const TAIL_CODE_POINTS = 200;`, `const STORED_UNORDERED: readonly number[] = [2, 0, 1];` and `expect(observed).toEqual({ "a v5 run holding a context": EXPECTED_WITH_CONTEXT, ...})` where `readOrder: [0, 1, 2], largestNumberOfModelCallsInFlight: 1, missingFromAChunk: [], tails: [SHOWN_EXACTLY, SHOWN_EXACTLY]`
