read:
  - node: constraints/document-content-is-data
    held_at: >-
      The first `it` block, with the helpers `marksViolations`, `everyOccurrenceIsDelimited` and `isDelimitedAt`. It pins the node's behavior for a v5 run, a v4 run, a one-chunk run and a run whose preliminary reading failed. Chunk text is checked in every shape. Entity names and the preliminary reading's content are checked only in the three-chunk v5 shape, the one that produces a context.
    evidence: >-
      `const problems = call.system.includes(needle) ? ["present in the system prompt"] : [];` and `expect(observed).toEqual({ chunksRead: {...}, problems: [] })`
  - node: constraints/extraction-model-call-bounded
    held_at: >-
      nowhere
    evidence: >-
      The file states no timeout and no retry limit. It only invokes `await runLlmExtraction(buildPool(world), RUN_ID, pino({ level: "silent" }), CATALOG, { env: ENV, anthropicFactory: () => buildModel(world) });`
