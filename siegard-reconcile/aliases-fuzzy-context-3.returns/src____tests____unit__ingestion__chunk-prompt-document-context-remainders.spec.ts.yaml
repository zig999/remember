looked_past: >-
  The file mirrors the llm_run, raw_information and raw_chunk persistence rows as test doubles (`RunRow`, `ChunkRow`, `rawRow`), and its oracle fixes a concrete data-marking shape (`DATA_OPENER = /\bdata\b.*:$/i`, `BLOCK_CLOSER = /^END\b/`) that the node leaves open, which I left to a code or test review because neither states a domain value or refusal.
