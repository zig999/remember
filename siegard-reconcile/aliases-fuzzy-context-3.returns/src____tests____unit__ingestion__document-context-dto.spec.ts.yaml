findings:
  - file: src/__tests__/unit/ingestion/document-context-dto.spec.ts
    where: >-
      the test "is refused when its names list is empty", in the describe "a document entity" (lines 67-73)
    evidence: >-
      it("is refused when its names list is empty", () => {
          const withEmptyNames = { node_type: "Person", names: [] };

          const refused = refusedFields(DocumentEntitySchema, withEmptyNames);

          expect(refused).toEqual(["names"]);
    cost: >-
      The test decides that an empty names list is refused, as a minimum of one name. The node document-entity declares names only as `required: true` and `many: true` and sets no minimum. The next reader who asks whether an entity may list no names looks in the node, finds no answer, and finds the answer only in this test and in the DTO's `.min(1)`.
    kind: unstated
    correction: >-
      The specification would have to state whether a document entity must list at least one name, in domain/knowledge-base/document-entity or in a rule constraining it. This file cannot close that on its own.
    node: domain/knowledge-base/document-entity
