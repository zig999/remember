looked_past: >-
  The file is a test: it asserts behaviour that nodes govern, and the test values it uses (claude-haiku-4-5 as CONTEXT_MODEL, "v4"/"v5", the "produced" status) are inputs and expectations, not a second home for those facts, so I filed no finding. The stub store's SQL-substring routing and the hand-built row shapes are test mechanics, which is another judgment's.
