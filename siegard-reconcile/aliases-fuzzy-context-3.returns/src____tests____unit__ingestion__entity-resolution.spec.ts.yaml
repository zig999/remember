findings:
  - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
    where: >-
      header comment, lines 3-9, the list of the four decision branches
    evidence: >-
      // Verifies `resolveOrCreateNode(client, args)` and the wired delegation from
      // `proposeNodeService`. Covers all four decision branches:
      //
      //   1. exact-match              -> matched_existing
    cost: >-
      A comment restates the exact-alias resolution rule next to the test. The file is not bound to
      rules/knowledge-base/exact-alias-resolves, so when that node changes nothing points a reader
      at this prose, and it can go on saying a rule the node no longer holds. Code holds the same
      fact in src/modules/ingestion/service/entity-resolution.service.ts (resolveWithAdmittedAliases,
      which returns matchExisting when findExactMatch returns a node id).
    kind: restates
    correction: >-
      Remove the prose. The branch behavior is already carried by the assertions in the
      `resolveOrCreateNode pipeline branches` tests.
    node: rules/knowledge-base/exact-alias-resolves
  - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
    where: >-
      header comment, lines 15-16, the sentence naming the thresholds
    evidence: >-
      //   - thresholds (MATCH_STRONG = 0.85, MATCH_FLOOR = 0.55) live in the
      //     entity-resolution module only.
    cost: >-
      The comment states the 0.85 and 0.55 thresholds, which strong-candidate-resolves and
      no-candidate-creates-active-node hold. Prose outside behavior is a second home for them. If
      the nodes move the thresholds, the comment keeps the old numbers and nobody is sent to
      correct it. Code holds the values in src/modules/ingestion/service/entity-resolution.service.ts
      (`export const MATCH_STRONG = 0.85;` and `export const MATCH_FLOOR = 0.55;`).
    kind: restates
    correction: >-
      Remove the prose. The values are held by the nodes and by the constants the comment already
      names.
    node: rules/knowledge-base/strong-candidate-resolves
  - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
    where: >-
      line 267, the comment above the alias assertion in `branch 1`
    evidence: >-
      // LLM-supplied alias was attempted (canonical not re-inserted on match).
    cost: >-
      A comment restates that a matched node gains only the admitted aliases and never the proposed
      name. The file is not bound to matched-node-gains-only-aliases, so the prose would outlive a
      change to that node. Code holds the fact in entity-resolution.service.ts (matchExisting
      attaches `admission.admittedOtherThanName` and inserts no canonical alias).
    kind: restates
    correction: >-
      Remove the prose. The `expect(state.aliasRows).toEqual([...])` assertion beneath it already
      carries the expectation.
    node: rules/knowledge-base/matched-node-gains-only-aliases
  - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
    where: >-
      lines 329-330, the comment above the review-rows assertion in `branch 3`
    evidence: >-
      // EXACTLY 2 entity_match_review rows — one per candidate at or above
      // MATCH_FLOOR (BR-25 / TC-10 constraint).
    cost: >-
      A comment restates that one entity match review is recorded per candidate at or above the
      floor. The ambiguous-candidates-need-review node holds that, with its cap of ten, and this
      file is not bound to it. Code holds it in entity-resolution.service.ts (decideFromCandidates
      returns `aboveFloor` as the candidates, and insertMatchReviews inserts one row for each).
    kind: restates
    correction: >-
      Remove the prose. The assertion beneath it already carries the expectation.
    node: rules/knowledge-base/ambiguous-candidates-need-review
  - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
    where: >-
      line 335, the comment above the alias assertion in `branch 3`
    evidence: >-
      // Canonical alias + 1 LLM-supplied alias for the new node.
    cost: >-
      A comment restates that a new node holds its proposed name as its canonical alias and each
      admitted alias as an alias. The file is not bound to new-node-aliases, so the prose would
      outlive a change to that node. Code holds the fact in entity-resolution.service.ts
      (attachCanonicalAndAliases inserts kind 'canonical' and then each admitted alias with kind
      'alias').
    kind: restates
    correction: >-
      Remove the prose. The `expect(state.aliasRows).toEqual([...])` assertion beneath it already
      carries the expectation.
    node: rules/knowledge-base/new-node-aliases
