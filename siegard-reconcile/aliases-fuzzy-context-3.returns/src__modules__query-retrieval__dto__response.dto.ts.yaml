findings:
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: >-
      SearchResponse interface, the `query` field (line 55)
    evidence: >-
      export interface SearchResponse {
        readonly query: string;
        readonly total: number;
        readonly limit: number;
        readonly offset: number;
        readonly items: readonly SearchItem[];
      }
    cost: >-
      The search answer is declared to carry the query text back to the caller.
      The retrieval contract's `search` answer lists the page of ranked items,
      their node match and similarity, their supporting fragments and the total
      before pagination, and does not list the query text. No other node does
      either: domain/knowledge-base/search-query holds the query as a request
      value and nothing says it is returned. A client that reads `query` is
      depending on a decision that lives only in this type, and a reader who
      checks the specification will not find it.
    kind: unstated
    correction: >-
      Either the retrieval contract's `search` answer gains the query text, by
      an analysis that decides it, or the field leaves the response.
    node: contracts/knowledge-base/retrieval
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: >-
      ProvenanceFragment interface, the `status` union (line 84)
    evidence: >-
      readonly status: "accepted" | "proposed" | "rejected" | "deleted";
    cost: >-
      The node holds five fragment states: proposed, accepted, rejected,
      superseded and deleted. This file declares four and leaves out
      `superseded`. The decision log of fragment-status records that this exact
      omission was already corrected in the node, so the type restates a
      vocabulary the node rejected. A fragment in `superseded` state would be
      typed as something it cannot be. fragment-status is not bound to this
      file, so a change to that enumeration will not reach this union.
    kind: contradicts
    correction: >-
      The union has to carry the five values of the node, `superseded`
      included. Because the node is not bound to this file, the declaration
      cannot read it, so the correction is the bind that claims this
      declaration or a reuse of the type from the file the node is bound to.
    node: domain/knowledge-base/fragment-status
