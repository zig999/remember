  The file carries no comments, and every domain value its tests assert (100000 UTF-16 code units, 5 lines, 200 code points, five minutes, two retries, the status names) is held by a node in the set, so no finding stands. The tests do not exercise the reuse and retry rules of the set, and that is coverage, which belongs to another judgment.
