findings:
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      the registration of the read tool in registerIngestToolset (the mcp.registerTool("ingest", ...) call after the health tool), and its repeat in READ_ONLY_TOOL_NAMES
    evidence: >-
      name: "get_ingestion_status",
      description: IngestToolDescriptions.get_ingestion_status,
      ...
      const READ_ONLY_TOOL_NAMES = [
        "health",
        "get_ingestion_status",
        "list_recent_ingestions",
      ] as const;
    cost: >-
      The MCP name `get_ingestion_status` is the public name a model calls to read an LLM run, and no node holds it. The ingestion contract's operation is `read-llm-run`, and `domain/knowledge-base/ingest-tool` holds only the four `propose_*` names. A reader who looks in the specification for the tool that reads a run's status will not find it, and the name lives only in this file.
    kind: unstated
    correction: >-
      The analysis would give the MCP name of the run read a node, most likely in contracts/knowledge-base/ingestion beside its read-llm-run operation.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      mapReadError, the ResourceNotFoundError branch
    evidence: >-
      if (err instanceof ResourceNotFoundError) {
        return {
          ok: false,
          error: {
            code: err.code,
            message: err.message,
            details: { entity: err.entity, id: err.entityId },
          },
        };
      }
    cost: >-
      The not-found answer of the run read over MCP carries the details keys `entity` and `id`, and the ingestion contract's read-llm-run refusal names only the error code RESOURCE_NOT_FOUND. A caller reading the specification cannot learn what the answer names. The retrieval contract spells the equivalent ("naming the entity and identity") for its own reads, so the same fact is stated in one place and omitted in the other.
    kind: unstated
    correction: >-
      The analysis would extend the read-llm-run not-found refusal in contracts/knowledge-base/ingestion with what the answer names, or decide that the details are not part of the contract.
    node: contracts/knowledge-base/ingestion
