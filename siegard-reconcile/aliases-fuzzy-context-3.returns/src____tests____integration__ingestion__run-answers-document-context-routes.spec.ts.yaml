findings:
  - file: src/__tests__/integration/ingestion/run-answers-document-context-routes.spec.ts
    where: >-
      getRunAnswer (lines 57-87) and the five assertions at lines 92, 101, 111, 117 and 123, which read fields from the root of the REST body
    evidence: >-
      `return res.json() as Record<string, unknown>;` and then `expect(body.document_context_status).toBe("too-long");`, `expect(body.document_context).toEqual(DOCUMENT_CONTEXT);`
    cost: >-
      The read-llm-run answer in contracts/knowledge-base/ingestion is stated as "`{ ok: true, result }` carrying the run's identity, ... its document context status and document context when it holds them". This test fixes the run fields at the root of the REST body, with no `result` level. A reader who goes to the contract for the shape of this answer finds an envelope the test never reads through. The two assertions that read `body.document_context ?? null` and `body.document_context_status ?? null` would also pass against an enveloped answer, because the root field would be absent. If the answer is enveloped, the two positive assertions fail and the two absence assertions go on passing, so those two would no longer show that anything was checked.
    kind: contradicts
    correction: >-
      Either the contract's accepted answer for read-llm-run is settled to say whether REST carries the run at the root or inside `result`, or the test reads the body as the contract states it. The route's behaviour is not in this file set and was not judged.
    node: contracts/knowledge-base/ingestion
