  - node: contracts/knowledge-base/ingestion
    held_at: >-
      Partly held. RunNotRetryableError (BUSINESS_RUN_NOT_RETRYABLE, 409) and RunNotRunningError (BUSINESS_RUN_NOT_RUNNING, 409) declare the two run-status refusals. getLlmRunById holds read-llm-run, with ResourceNotFoundError for a missing run and affected nodes only for a completed run. listToolCallsByLlmRun holds list-tool-calls. retryLlmRun holds retry-llm-run. listRecentIngestions holds the list-recent-ingestions item shape.
    evidence: >-
      public readonly code = "BUSINESS_RUN_NOT_RETRYABLE" as const; ... public readonly code = "BUSINESS_RUN_NOT_RUNNING" as const; ... if (row.status === "completed") { const cached = getCachedAffectedNodes(llmRunId); ... } ... if (existing.status !== "failed") { throw new RunNotRetryableError(llmRunId, existing.status); } ... return { total, limit: args.limit, offset: args.offset, items: rows.map(toToolCallResponse), };
