looked_past: >-
  Seen and not reported because it is another judgment's: the retry guard (only a failed run is retried, "if (existing.status !== "failed")") agrees with rules/knowledge-base/llm-run-lifecycle, which is outside this set, and the in-process cache of affected nodes (getCachedAffectedNodes/setCachedAffectedNodes) is an implementation choice that states no domain fact.
