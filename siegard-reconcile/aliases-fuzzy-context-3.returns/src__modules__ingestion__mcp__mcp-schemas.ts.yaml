looked_past: >-
  The file holds facts that nodes outside the set govern and the candidate index does not bind to it, so I filed no finding for them: the limits 1..50 and default 10 of the recent-ingestions listing, the directed reference length 1..120, the directed attribute value shape, the directed label length 1..200, the name and alias length 1..500, the `HealthMcpInputSchema` health tool (contracts/knowledge-base/access, read-health), and the directed validity-start shape and basis default; I also left aside the "atomic claim" guidance in the directed fragment description.
