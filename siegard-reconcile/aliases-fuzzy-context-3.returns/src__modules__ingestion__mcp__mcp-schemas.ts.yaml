findings:
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      StartAsyncIngestionMcpInputSchema, lines 48-79 (the description of the `content` field)
    evidence: >-
      export const StartAsyncIngestionMcpInputSchema = z.object({ content: z.string()... .describe("The full plain text of the document to ingest. Paste the raw content; the server chunks it, runs structured extraction in the BACKGROUND, and persists the knowledge graph with provenance. No base64/binary.")
    cost: >-
      The file declares the input of a tool that starts an ingestion and returns before it completes, and its description tells the model that extraction runs in the BACKGROUND. The constraint says the ingest toolset offers no such tool. Anyone who reads this file learns of an asynchronous ingestion surface that the specification excludes, and a reader of the specification never learns that the code declares one. I did not open anything outside the file set, so I cannot say whether the schema is registered anywhere. If it is, the description is emitted text that contradicts the constraint. If it is not, it is a dead declaration of the excluded surface.
    kind: contradicts
    correction: >-
      The declaration of the asynchronous-ingestion input schema would have to leave this file. If the business wants such a tool, the constraint has to change through analysis first.
    node: constraints/ingest-toolset-offers-no-async-ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      GetIngestionStatusOutputSchema, `attempts` field, line 159
    evidence: >-
      attempts: z.number().int().positive(),
    cost: >-
      The output schema refuses a run read whose attempts is below 1. The llm-run node types `attempts` as an integer and the retry-counts-attempts rule only adds one on retry. Neither states a floor or the value a run starts with. The floor lives only in this schema, so the next reader looks for it in the specification and does not find it.
    kind: unstated
    correction: >-
      Analysis would have to decide whether an LLM run's attempts is at least 1, and the llm-run node would have to hold that.
    node: domain/knowledge-base/llm-run
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      GetIngestionStatusOutputSchema, `idempotency_key` field, line 161
    evidence: >-
      idempotency_key: z.string().regex(/^[0-9a-f]{64}$/),
    cost: >-
      The idempotency-key node fixes the key as 64 lowercase hexadecimal characters. The candidate index binds that node to src/modules/ingestion/dto/llm-run.dto.ts, not to this file. This pattern is a second declaration of that format in a file the node is not bound to. When the node moves, `--check` never reaches this file, and nobody can tell which declaration was the decided one.
    kind: contradicts
    correction: >-
      The key's format would have to be declared once, in the file the node is bound to. This file would have to read it from there, or the bind would have to claim this file as well.
    node: rules/knowledge-base/idempotency-key
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedNodeItemSchema, description of `node_id`, line 230
    evidence: >-
      Rejected (VALIDATION_INVALID_FORMAT) if the id does not point to an active node.
    cost: >-
      This text is a tool description sent to the model. The contract answers a pinned identity that names no knowledge node with RESOURCE_NOT_FOUND (reason not_found). Only a pinned identity that names a non-active node gets VALIDATION_INVALID_FORMAT (reason inactive). The description gives the second code for both cases, so a caller handling the refusal by the description handles a missing node wrongly.
    kind: contradicts
    correction: >-
      The description would have to say that an identity naming no node is reported RESOURCE_NOT_FOUND and that an identity naming a non-active node is reported VALIDATION_INVALID_FORMAT.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedAttributeItemSchema, description of `valid_from`, lines 262-264
    evidence: >-
      Optional ISO date when this attribute became valid. Required when the catalog AttributeKey requires it.
    cost: >-
      The required-start-available rule says a proposal for a key that requires a validity start MUST state one OR come from a source with a document date or a reception date. A directed ingestion's source always has a reception date. The description tells the model the date is required, which is stricter than the rule. This text is emitted to the model, so it states the rule differently from the node that governs it.
    kind: contradicts
    correction: >-
      The description would have to say what the rule says: the start may be left out where the source supplies a document date or a reception date.
    node: rules/knowledge-base/required-start-available
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedLinkItemSchema, description of `valid_from`, lines 286-288
    evidence: >-
      Optional ISO date when this link became valid. Required when the catalog LinkType requires it.
    cost: >-
      Same departure as for the attribute item. The description says "Required" where the rule allows the start to come from the source's document date or reception date.
    kind: contradicts
    correction: >-
      The description would have to say what the rule says: the start may be left out where the source supplies a document date or a reception date.
    node: rules/knowledge-base/required-start-available
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedMcpInputSchema, description of `source_label`, line 325
    evidence: >-
      Carried into the run's `metadata.source_label` for audit; not parsed by the server.
    cost: >-
      The node says a directed ingestion records its label in its raw information's metadata. The LLM run in the llm-run node has no metadata attribute. The description, emitted to the model, places the label on the run, so a caller who looks for the label on the run will not find it.
    kind: contradicts
    correction: >-
      The description would have to name the raw information's metadata, not the run's.
    node: rules/knowledge-base/directed-source-metadata
