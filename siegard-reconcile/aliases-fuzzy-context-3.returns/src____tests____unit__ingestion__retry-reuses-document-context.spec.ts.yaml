looked_past: >-
  The test asserts that a retry leaves the run's document context itself recorded (`expect(world.run["document_context"]).toEqual(DOCUMENT_CONTEXT);`). The only nodes that say a retried run keeps its context are the scenario retried-run-reuses-context and the decision log of retry-keeps-document-context-status, and no rule states it, so I report that as a gap in the rules and not as a finding against this file.
