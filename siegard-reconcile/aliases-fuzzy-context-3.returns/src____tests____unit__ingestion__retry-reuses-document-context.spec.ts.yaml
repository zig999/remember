  - node: rules/knowledge-base/document-context-read-first
    held_at: >-
      The test "makes no preliminary reading and shows each chunk the context the run held ..." (the `readings: 0` expectation) and the test "makes a preliminary reading when a retried run whose document context status is failed is extracted again" (the `toHaveLength(1)` expectation). These are test assertions and hold the rule's "when the run holds none" clause by execution. They do not hold the rule's prompt-version, chunk-count or length clauses.
    evidence: >-
      `expect({ readings: readingCalls(world).length, chunksRead: chunkCalls(world).length, chunksShownTheHeldContext: chunkCalls(world).map(showsHeldContext), }).toEqual({ readings: 0, chunksRead: CHUNKS_IN_THE_RAW_INFORMATION, chunksShownTheHeldContext: [true, true, true], });` and `expect(readingCalls(world)).toHaveLength(1);`
  - node: rules/knowledge-base/document-context-status-kept-on-reuse
    held_at: >-
      The test "leaves the document context status as it was after a retried run holding a document context is extracted again, whichever status it held" (the loop over `EVERY_HELD_STATUS` and its `toEqual` expectation).
    evidence: >-
      `const world = failedRunWorld({ status, context: DOCUMENT_CONTEXT }); await retryRun(world); await extractRun(world); kept[label] = statusOf(world);` and `expect(kept).toEqual({ produced: "produced", "single-chunk": "single-chunk", "too-long": "too-long", failed: "failed", none: null, });`
  - node: rules/knowledge-base/document-context-status-recorded
    held_at: >-
      Only the produced clause, in the test "records the status produced when the preliminary reading made for a retried run whose status was failed yields a document context" (the `toBe("produced")` expectation). The single-chunk, too-long and failed clauses are not exercised as records.
    evidence: >-
      `const world = failedRunWorld(HOLDS_FAILED_NONE); await retryRun(world); await extractRun(world); expect(world.run["document_context_status"]).toBe("produced");`
