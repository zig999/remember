certified:
  - node: rules/knowledge-base/extraction-reads-chunks-in-order
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/chunk-prompt-document-context-remainders.spec.ts
        name: reads the chunks one at a time in index order even when the store returns them out of order, shows every chunk the source type, document date, title, reception time and the last 200 code points of its index predecessor, and shows the run's context only when the run holds one
    why: >-
      The test checks index order: the store returns the chunks as 2, 0, 1 and the test
      expects them read as 0, 1, 2. It checks that every chunk is shown the source type,
      document date and title. It checks the predecessor tail exactly: the last 200 code
      points, using astral characters so a cut by UTF-16 units fails, and not the 201st. It
      checks that the document context is shown when the run holds one and absent in a v4 run
      and in a run whose preliminary reading failed.

      The reception time is not exercised as the reception time. The fixture gives the run's
      started_at the same instant as the raw information's received_at (both RECEIVED_AT),
      and the test only looks for that timestamp's text in each chunk prompt. An extraction
      that showed the run's start time instead of the source's reception time would pass.

      "One at a time" is checked only for the run that holds a context. The test asserts
      largestNumberOfModelCallsInFlight equals 1 there, but observeRunWithoutContext does not
      record it. So chunks read concurrently in a v4 run, or in a run whose preliminary
      reading failed, would go unnoticed.

      The other test in the file, the one about the data label and closing delimiter, counts
      the chunks read for each run shape. It does so only on the way to its delimiting
      assertion and does not bear on this fact.
    remainder: testable
    remainder_why: >-
      Two assertions would close it. First, an extraction over raw information whose
      received_at differs from the run's started_at, expecting every chunk prompt to show
      received_at and not started_at. Second, an extraction of a multi-chunk run that holds
      no document context (a v4 run, or one whose preliminary reading failed), expecting
      chunk model calls never to overlap: at most one in flight at any time.
