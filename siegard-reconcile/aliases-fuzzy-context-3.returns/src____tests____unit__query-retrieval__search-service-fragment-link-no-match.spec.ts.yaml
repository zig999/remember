looked_past: >-
  The test asserts that a fragment matched by both the fragment layer and a supporting chunk appears once, and that links reached from exactly and approximately matched nodes appear. These facts are held by nodes outside the set (rules/knowledge-base/chunk-match-cites-its-fragment, rules/knowledge-base/expansion-link-once and the expansion rules); the fixture constants EXPAND_DEPTH, RESULT_LIMIT and the stub scores are test inputs, not domain statements.
