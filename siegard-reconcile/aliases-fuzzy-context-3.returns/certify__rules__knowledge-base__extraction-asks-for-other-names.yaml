certified:
  - node: rules/knowledge-base/extraction-asks-for-other-names
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/extraction-prompt-held-versions.spec.ts
        name: sends every held prompt version from v5 on a request asking for every other name of each entity, naming an acronym, a short name and another spelling, and excluding a pronoun alone and a role alone
      - file: src/__tests__/unit/ingestion/extraction-prompt-held-versions.spec.ts
        name: fails an extraction under a prompt version the system does not hold without asking the model, and runs every held version under its own prompt
    why: >-
      Some parts of the fact are exercised. The first named test runs a real extraction under
      every held version from v5 to v50. For each one it captures the system text actually sent
      to the model. It fails if v5 is not held, or if any of those versions sends no request for
      every other name near a mention of a node. The fourth test asserts only one thing here:
      v5 is held and runs under its own prompt. Three stated parts are left unexercised. First,
      the fact limits the request to other names "the text gives". Nothing checks that
      restriction: a prompt that asked for every other name the model knows would still pass.
      Second, the checks for an acronym, a short name and another spelling are unanchored
      searches for those words anywhere in the sent text. Nothing ties them to the other-names
      instruction. A version that dropped them as examples of another name could still pass if
      the words appear in any other instruction. Third, the pronoun and role checks only need a
      "not" or "never" within 120 characters of "pronoun alone" or "role alone". Any sentence
      that refuses a pronoun or role alone for some other purpose passes. Nothing asserts that a
      pronoun or role alone is excluded from the other names proposed with a node.
    remainder: testable
    remainder_why: >-
      For each held version from v5 on, run one extraction and capture the system text it
      sends. Assert that a single instruction does all of the following. It asks for the other
      names proposed with each node to be names the text itself gives for that same entity. It
      gives an acronym, a short name and another spelling as examples of such names. It
      excludes a pronoun alone and a role alone from them. The test should fail when any one of
      these is missing from that instruction, even if the same words appear elsewhere in the
      prompt.
