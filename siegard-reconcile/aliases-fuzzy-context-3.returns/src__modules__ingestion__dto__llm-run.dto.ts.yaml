read:
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      The run and tool-call response schemas, the retry request schema and the tool-call listing query schema (LlmRunResponseSchema, ToolCallResponseSchema, ListToolCallsResponseSchema, RetryLlmRunRequestSchema, ListToolCallsQuerySchema).
    evidence: >-
      reason: z.string().max(500).optional(); limit: z.coerce.number().int().min(1).max(100).default(50); offset: z.coerce.number().int().min(0).default(0); total / limit / offset / items on ListToolCallsResponseSchema; document_context_status: DocumentContextStatusSchema.optional(); affected_nodes: z.array(AffectedNodeSchema).optional()
  - node: domain/knowledge-base/document-context
    held_at: >-
      DocumentContextSchema.
    evidence: >-
      export const DocumentContextSchema = z.object({ summary: z.string(), entities: z.array(DocumentEntitySchema), model: z.string(), });
  - node: domain/knowledge-base/document-context-status
    held_at: >-
      DocumentContextStatusSchema.
    evidence: >-
      z.enum(["produced", "single-chunk", "too-long", "failed"])
  - node: domain/knowledge-base/document-entity
    held_at: >-
      DocumentEntitySchema.
    evidence: >-
      export const DocumentEntitySchema = z.object({ node_type: z.string(), names: z.array(z.string()).min(1), });
  - node: domain/knowledge-base/ingest-tool
    held_at: >-
      IngestToolNameSchema, in the underscore spelling the node says the material uses.
    evidence: >-
      z.enum(["propose_fragment", "propose_node", "propose_link", "propose_attribute"])
  - node: domain/knowledge-base/llm-run
    held_at: >-
      LlmRunResponseSchema, which declares the run's attributes.
    evidence: >-
      model: z.string(), prompt_version: z.string(), started_at: ..., finished_at: z.string().datetime({ offset: true }).nullable(), status: LlmRunStatusSchema, attempts: z.number().int().positive(), input_raw_information_id: z.string().uuid(), idempotency_key: ..., summary: LlmRunSummarySchema, document_context_status, document_context
  - node: domain/knowledge-base/run-status
    held_at: >-
      LlmRunStatusSchema.
    evidence: >-
      export const LlmRunStatusSchema = z.enum(["running", "completed", "failed"]);
  - node: domain/knowledge-base/run-summary
    held_at: >-
      LlmRunSummarySchema.
    evidence: >-
      accepted, consolidated, superseded_previous, needs_review, uncertain, disputed, rejected, error, orphaned_fragments, each z.number().int().nonnegative()
  - node: domain/knowledge-base/tool-call
    held_at: >-
      ToolCallResponseSchema.
    evidence: >-
      tool_name: IngestToolNameSchema, arguments: z.record(z.string(), z.unknown()), result: z.record(z.string(), z.unknown()).nullable(), validation_outcome: ValidationOutcomeSchema, created_at: z.string().datetime({ offset: true })
  - node: domain/knowledge-base/validation-outcome
    held_at: >-
      ValidationOutcomeSchema.
    evidence: >-
      z.enum(["accepted", "consolidated", "superseded_previous", "needs_review", "uncertain", "disputed", "rejected", "error"])
  - node: rules/knowledge-base/idempotency-key
    held_at: >-
      The idempotency_key field of LlmRunResponseSchema, for the format only (64 lowercase hexadecimal characters). The derivation (digest of content hash, prompt version, model and chunking version) is not computed in this file.
    evidence: >-
      idempotency_key: z.string().regex(/^[0-9a-f]{64}$/),
  - node: constraints/document-content-is-data
    held_at: >-
      nowhere
    evidence: >-
      The file holds only response and request schemas and types; no prompt or presentation of document content to a model appears in it.
  - node: constraints/extraction-model-call-bounded
    held_at: >-
      nowhere
    evidence: >-
      No timeout or retry bound appears; the file's only numeric bounds are `.max(500)`, `.max(100)`, `.min(1)` and `.min(0)` on request fields.
  - node: contracts/knowledge-base/retrieval
    held_at: >-
      nowhere
    evidence: >-
      The file declares no search, provenance, catalog or graph read shapes; its schemas concern LLM runs and tool calls only.
  - node: domain/knowledge-base/assertion-flag
    held_at: >-
      nowhere
    evidence: >-
      No enumeration of uncertain, disputed or low-confidence appears in the file; the closest `z.enum` is ValidationOutcomeSchema, which is another node's.
