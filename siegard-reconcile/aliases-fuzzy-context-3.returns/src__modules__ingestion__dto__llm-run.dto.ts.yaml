looked_past: >-
  The limit bounds, offset floor and default of 50 on ListToolCallsQuerySchema, and the positive attempts bound, are held by nodes outside this set (rules/knowledge-base/page-limit-bounds, page-offset-non-negative, tool-call-page-defaults, run-opens-with-one-attempt) and agree with them, so they are no finding here.
