looked_past: >-
  The file is a test harness whose literals (the model name "claude-context-under-test", the node-type rows Person and Organization, the chunk texts, the metadata keys document_date and title, the SQL-text matching in answer and applyUpdate) are fixture data standing in for the store and the model, not domain facts the code applies. Whether the double mirrors the repository's SQL faithfully is a code-review matter, not this pass's judgment.
