looked_past: >-
  The test uses the prompt version literal "v6", which the prompt-version enumeration does not hold (v1 to v5), and remaps it to the v5 module through a mock. I took it as a test fixture standing for the "v5 and later" wording of document-context-status-kept-on-reuse, not as a stated domain fact, and it is another judgment's if anyone weighs it.
