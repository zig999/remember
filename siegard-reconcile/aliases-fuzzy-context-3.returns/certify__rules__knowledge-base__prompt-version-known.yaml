certified:
  - node: rules/knowledge-base/prompt-version-known
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/extraction-prompt-held-versions.spec.ts
        name: fails an extraction under a prompt version the system does not hold without asking the model, and runs every held version under its own prompt
    why: >-
      The test covers running an extraction. It sets up a run whose recorded prompt version
      is v99, which the system does not hold. It asserts that the extraction ends with the run
      failed and that the model receives no request. It also asserts that each held version
      (v1 to v50 checked against the prompt selector) runs under its own prompt and not a
      substitute. That proves an unheld version never gets to drive a model request. The test
      does not stop such a version from being recorded in the first place: its stub pool hands
      back a run that already carries v99, and the test only checks what happens when that run
      is executed. Nothing in the proof tries to start or record an extraction under an unheld
      version. So the half of the rule that sits on the LLM run itself goes untested: that the
      prompt version an extraction carries must be a held one. The file's other three tests do
      not bear on this rule. They check the prompt text: the other-names wording from v5 on,
      the relative-date words from v4 on, and that v4's instruction lines are kept in v5.
    remainder: testable
    remainder_why: >-
      One input, one expected result. Start an extraction run with a prompt version the system
      does not hold, through whatever path creates the run. Expect a refusal, and expect no LLM
      run to be recorded with that version.
