looked_past: >-
  The prompt's own wording, such as "in the language of the document", "listed once", "Never invent an entity or a name" and "A pronoun alone or a role alone is not a name", is instruction text sent to a model that no node in the set states. I did not report it as a finding, and the whole-specification search for those terms found no node holding them.
