findings:
  - file: src/modules/ingestion/prompts/preliminary-reading.ts
    where: >-
      line 5, the exported constant MAX_TOKENS
    evidence: >-
      export const MAX_TOKENS = 4000 as const;
    cost: >-
      The ceiling on the model's output for a preliminary reading is a value
      the code applies and no node holds, and the service passes it on as
      `max_tokens: MAX_TOKENS`. A reader looking in the specification for what
      a preliminary reading may ask of the model finds nothing. The nearest
      node, rules/knowledge-base/extraction-turn-token-ceiling, sets 8000 tokens for
      an extraction's turns, which is a different call with a different
      value. That rule's log decided the ceiling is "a rule of extraction"
      because the code is the truth, so the same decision is owed here.
    kind: unstated
    correction: >-
      The analysis would give the preliminary reading's output ceiling a node
      (or extend the node that holds the extraction turn ceiling), and the
      constant would then be bound to it.

