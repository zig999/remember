read:
  - node: domain/knowledge-base/llm-run
    held_at: >-
      the LlmRunRow interface declares the run's attributes: model, prompt_version, started_at, finished_at, status, attempts, idempotency_key, document_context and document_context_status. It has no summary field. insertLlmRun and findLlmRunByIdempotencyKey read and write that shape.
    evidence: >-
      export interface LlmRunRow { readonly id: string; readonly model: string; readonly prompt_version: string; readonly started_at: Date; readonly finished_at: Date | null; readonly status: "running" | "completed" | "failed"; readonly attempts: number; readonly input_raw_information_id: string; readonly idempotency_key: string;
  - node: domain/knowledge-base/raw-chunk
    held_at: >-
      the RawChunkRow interface declares the chunk's attributes: chunk_index, offset_start, offset_end, text, locator and chunking_version. It does not carry status or superseded_at. insertRawChunks and findChunksByRawInformationId persist and read it.
    evidence: >-
      export interface RawChunkRow { readonly id: string; readonly raw_information_id: string; readonly chunk_index: number; readonly text: string; readonly offset_start: number; readonly offset_end: number; readonly locator: ChunkLocator; readonly chunking_version: string; }
  - node: domain/knowledge-base/raw-information
    held_at: >-
      the RawInformationRow interface declares the source's attributes: source_type, content, storage_ref, content_hash, received_at, metadata and original_input. It does not carry title, document_date, status or superseded_at. insertRawInformation and the two finders persist and read it.
    evidence: >-
      export interface RawInformationRow { readonly id: string; readonly source_type: SourceType; readonly content: string; readonly storage_ref: string | null; readonly content_hash: string; readonly received_at: Date; readonly metadata: Record<string, unknown>; readonly original_input: string | null; }
