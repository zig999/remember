looked_past: >-
  The file also holds facts of directed-ingestion nodes outside this set (full confidence, first-chunk anchoring, dependency-failed cascade, item status, pinned node, run completion, nonce content), which are held by code and left to those nodes' own passes, while comments such as "chunkV1 always emits at least one chunk for non-empty content (BR-03)" state a fact only in prose and the "BR-xx" and "TC-xx" citations name identities outside the specification.
