findings:
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      The file header comment, lines 20-23, in the bullet list "Distinct from `runLlmExtraction`".
    evidence: >-
      "// Distinct from `runLlmExtraction`:
      //   - No `LLMRun` pre-check: the orchestrator OPENS the run as part of
      //     intake (BR-34 step 2). Failure to open the run is the only `failed`
      //     terminal outcome; otherwise the run always lands `completed`.
      //   - No chunk loop, no model dispatch — items are pre-structured."
    cost: >-
      The header says in prose that a directed ingestion opens a run and calls no model. The code holds both facts in the `ingestRaw` call with `DIRECTED_MODEL` and `DIRECTED_PROMPT_VERSION`, and in the absence of any model call. A reader who finds the comment will treat it as the home of the rule and will not look in the specification. If the node moves, the comment keeps the old wording.
    kind: restates
    correction: >-
      Remove the prose by the comment route, then run /reconcile over the file. The code in this file already carries the fact.
    node: rules/knowledge-base/directed-ingestion-run
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      The header comment, lines 24-25, and the comment above the attribute loop, lines 584-586.
    evidence: >-
      "//   - Forces `confidence = 1.0` and defaults `valid_from_basis = 'stated'`
      //     when the caller omits it (BR-34 step 4)."
      and
      "//     either is missing. `confidence = 1.0`; `valid_from_basis` defaults to
      //     `'stated'` when omitted by caller (BR-34 Defaults matrix)."
    cost: >-
      The default basis is stated in prose twice, citing "BR-34", a rule identity from outside the specification. The code holds the same fact at `valid_from_basis: item.valid_from_basis ?? "stated"`, lines 621 and 701. A reader looking for the default finds the comment first and treats it as a second authority. The comments say nothing of the change hint the node also holds, so they do not even agree with the node's full statement.
    kind: restates
    correction: >-
      Remove both comments by the comment route, then run /reconcile over the file. The code at lines 621-622 and 701-702 holds the fact.
    node: rules/knowledge-base/directed-defaults
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      Line 93, the `IsoDateSchema` message, and the `valid_to` fields of `DirectedAttributeItemSchema` (line 133) and `DirectedLinkItemSchema` (line 144), forwarded at lines 620 and 700.
    evidence: >-
      "const IsoDateSchema = z
        .string()
        .regex(/^\d{4}-\d{2}-\d{2}$/, "valid_from / valid_to must be ISO YYYY-MM-DD");"
      "valid_to: IsoDateSchema.optional(),"
      "...(item.valid_to !== undefined ? { valid_to: item.valid_to } : {}),"
    cost: >-
      The service lets a directed attribute or link state a validity end and proposes it. The specification states only a validity start for a directed item. The decision log of directed-validity-start-shape records "Only the validity start is stated, because the tool strips any other field before the service reads it." A caller who reaches the service directly can state a validity end that no node holds. The code becomes the only place that capability is decided, and the next reader will not look for it there. The validation message the service emits also names `valid_to` as a shape the specification does not hold.
    kind: unstated
    correction: >-
      Either the analysis gives a validity end of a directed item a node, or the service stops accepting it. This pass does not choose between the two.
    node: rules/knowledge-base/directed-validity-start-shape
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      `DirectedNodeItemSchema` (lines 102-108), the `key` of `DirectedAttributeItemSchema` (line 129) and the `link_type` of `DirectedLinkItemSchema` (line 140).
    evidence: >-
      "node_type: z.string().min(1),
        name: z.string().min(1).max(500),
        node_id: z.string().uuid().optional(),
        aliases: z.array(z.string().min(1).max(500)).optional(),"
      "key: z.string().min(1),"
      "link_type: z.string().min(1),"
    cost: >-
      The service refuses the whole directed request when a node name or alias runs past 500 characters, when a node type, attribute key or link type is empty, or when a pinned identity is not a UUID. The contract lists six rules that refuse an ingest-directed request, and none of them is any of these. node-name-length applies to a node proposal, not to the directed request. A caller cannot learn from the specification that these values fail the entire request before any item is dispatched. The refusal behavior lives only in the schema.
    kind: unstated
    correction: >-
      The analysis would give the directed request these refusals a place in the ingest-directed answers of the contract, or state that they are refused per item through the proposal rules. This pass does not choose.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      The comment on `metadataPointer`, lines 273-281, and the comment above the metadata merge, lines 336-338.
    evidence: >-
      "* Non-PII pointer back to the chat row that triggered this directed run
         * (TC-02 / BR-34). When the chat-agent dispatch invoked the tool the route
         * supplies `{ conversation_id, message_id }` so the orchestrator can merge
         * it into the `RawInformation.metadata` jsonb."
      and
      "// TC-02 / BR-34 — chat-row pointer (non-PII; the verbatim text lives in
        // `original_input`, not here). Merged in only when the chat dispatch
        // supplied it; REST / MCP-direct calls emit metadata without these keys."
    cost: >-
      Two comments restate which metadata a directed ingestion records and when. The code holds it at `intakeMetadata.conversation_id = deps.metadataPointer.conversation_id;` and the lines beside it. A reader may treat the comment as the authority for when the pointer is recorded. The comments cite "TC-02 / BR-34", identities that live outside the specification.
    kind: restates
    correction: >-
      Remove both comments by the comment route, then run /reconcile over the file. The code at lines 330-342 holds the fact.
    node: rules/knowledge-base/directed-source-metadata
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      The Zod-failure refusal at the start of `directedIngestionService`, lines 299-314.
    evidence: >-
      "code: "VALIDATION_INVALID_FORMAT",
          message: "Input failed Zod parse.","
    cost: >-
      The contract answers every ingest-directed request refused for shape with the message "ingest_directed arguments failed validation.". The caller-facing handler `directed-ingest.handler.ts` already emits that wording before the service runs. The service emits a different message when its own parse fails. The text is reachable only when the service is called without the handler, and a reader comparing the two sees two messages for one refusal. The service schema is also a second implementation of the shape rules the handler's schema `IngestDirectedMcpInputSchema` already checks.
    kind: contradicts
    correction: >-
      The message the service emits on its own parse failure would have to be the one the contract names, or the service would have to stop re-parsing a payload the handler has already validated. This pass does not choose.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      `refForAttribute`, lines 914-916, which names an attribute's report entry.
    evidence: >-
      "function refForAttribute(item: DirectedAttributeItem): string {
        return `${item.node_ref}.${item.key}`;
      }"
    cost: >-
      The contract says only that a link's reference is its source reference, link type and target reference joined by "->", and says nothing of the reference of an attribute entry. The form `<node_ref>.<key>` is decided only in this function, and callers that read the report depend on it. Two attributes of one node and key share this reference with no rule saying which the reference names, and the specification does not hold that either.
    kind: unstated
    correction: >-
      The analysis would give the report reference of an attribute entry a place in the ingest-directed answer of the contract, beside the link form it already states.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      The `fallback` of `readClosedRunSafe`, lines 1035-1039, and its use at lines 1052, 1058 and 1072.
    evidence: >-
      "const fallback = {
          started_at: new Date(0).toISOString(),
          finished_at: new Date(0).toISOString(),
          attempts: 1,
        };"
      "finished_at:
            row.finished_at === null
              ? new Date(0).toISOString()
              : row.finished_at.toISOString(),"
    cost: >-
      When the closed run cannot be read, or has no finish time, the response reports the run starting and finishing at 1970-01-01T00:00:00.000Z with one attempt. The contract says only that the run is reported completed even where closing it failed. It holds no value for the times or attempts of a run that cannot be read. A caller or an audit reading the response receives an invented timestamp that looks like a real one, and no rule says it is a placeholder.
    kind: unstated
    correction: >-
      The analysis would give the times and attempts a directed run reports when its row cannot be read a place in the ingest-directed answer of the contract, or say they are omitted. This pass does not choose.
    node: contracts/knowledge-base/ingestion
