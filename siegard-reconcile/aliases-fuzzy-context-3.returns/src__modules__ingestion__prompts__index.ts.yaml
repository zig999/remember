read:
  - node: domain/knowledge-base/prompt-version
    held_at: >-
      The REGISTRY constant, which declares the closed set of prompt versions the system holds as five entries keyed by each version module's PROMPT_VERSION.
    evidence: >-
      const REGISTRY: Readonly<Record<string, PromptModule>> = { [v1.PROMPT_VERSION]: V1, [v2.PROMPT_VERSION]: V2, [v3.PROMPT_VERSION]: V3, [v4.PROMPT_VERSION]: V4, [v5.PROMPT_VERSION]: V5, };
  - node: rules/knowledge-base/default-prompt-version
    held_at: >-
      The DEFAULT_PROMPT_VERSION export, which is bound to the v5 module's version.
    evidence: >-
      export const DEFAULT_PROMPT_VERSION: string = v5.PROMPT_VERSION;
  - node: rules/knowledge-base/prompt-version-known
    held_at: >-
      selectPromptModule, which throws UnknownPromptVersionError for a version absent from REGISTRY.
    evidence: >-
      const module = REGISTRY[promptVersion]; if (module === undefined) { throw new UnknownPromptVersionError(promptVersion); }
  - node: constraints/document-content-is-data
    held_at: nowhere
    evidence: >-
      The file only declares user(args: ContextUserPromptArgs): Anthropic.Messages.TextBlockParam[] on PromptModule and forwards user: v5.user. It builds no prompt text, so the marking of content as data is not stated here.
