looked_past: >-
  The file is a test double that interprets the repository's SQL in memory (`SET_CLAUSE`, `ASSIGNMENT`, `SELF_PLUS_ONE`) and carries invented fixture values (`"sk-ant-test"`, `chunking_version: "v1"`, the marker tokens), which is test-construction quality and no domain fact of any node.
