read:
  - node: constraints/document-content-is-data
    held_at: >-
      nowhere
    evidence: >-
      The file reads the text shown to the model only to classify a call: `const text = userTextOf(req.messages);`. It states no marking of content apart from instructions.
  - node: constraints/extraction-model-call-bounded
    held_at: >-
      nowhere
    evidence: >-
      The model stand-in has no wait limit or retry count: `return { finalMessage: async () => endTurn(reply) };`. The extraction is only handed it: `anthropicFactory: () => modelOf(world),`.
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      nowhere
    evidence: >-
      The file only calls the service functions: `return retryLlmRun(clientOf(world), RUN_ID);` and `return runLlmExtraction(poolOf(world), RUN_ID, pino({ level: "silent" }), CATALOG, {`. It declares no operation answer, refusal or error code.
