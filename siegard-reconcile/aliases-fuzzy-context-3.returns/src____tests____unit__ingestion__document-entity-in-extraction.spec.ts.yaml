findings:
  - file: src/__tests__/unit/ingestion/document-entity-in-extraction.spec.ts
    where: >-
      MALFORMED_ENTITIES (lines 33-37), EXPECTED.refusedWithNothingRecorded (lines 46-50), and the test title at line 107
    evidence: >-
      "an entity whose names list is empty": null,
      "an entity with no names": null,
      "an entity with no node type": null,
      and the title "records no context for an entity with no names, an empty names list or no node type"
    cost: >-
      The test asserts that one malformed entity in a preliminary reading leaves the run with no document context at all. That is the whole reading and its other valid entities, not only the malformed one. Nothing in the specification says so. domain/knowledge-base/document-entity makes names required, and its log gives only the reason that an entity with no name gives the model nothing to recognise. rules/knowledge-base/document-context-entity-type-in-catalog drops only the offending entity for an unknown node type and keeps the context. A reader choosing between dropping the entity and discarding the context finds no node that decides it, and this assertion is the only place the choice is written down.
    kind: unstated
    correction: >-
      The analysis would have to decide, in a node, what an extraction records when a preliminary reading lists an entity that breaks the document-entity shape: whether the context is absent or the entity is dropped. It would also have to say which document context status the run then records.
    node: domain/knowledge-base/document-entity
