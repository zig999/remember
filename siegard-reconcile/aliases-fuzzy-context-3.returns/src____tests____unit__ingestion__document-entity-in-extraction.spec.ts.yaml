looked_past: >-
  The helper `carriesEntity` treats an entity as shown only when its node type and all its names sit on one prompt line, a layout of the prompt that no node states. It is a way of detecting what the test asserts, not a rule the test states, and it belongs to a test-quality judgment, not to this one.
