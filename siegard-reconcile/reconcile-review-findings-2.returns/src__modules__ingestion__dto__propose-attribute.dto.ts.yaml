      value, confidence, change_hint, valid_from, valid_to and valid_from_basis, plus
      fragment_ids and the node and key it targets.
    evidence: >-
      value: z
          .string()
          .min(1)
      ...
        confidence: z
          .number()
          .min(0)
          .max(1)
      ...
        valid_from_basis: ValidFromBasisSchema.optional()
      ...
