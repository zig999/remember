    evidence: >-
      confidence: z.number().min(0).max(1) ... valid_from: IsoDateSchema.optional() ... valid_to: IsoDateSchema.optional() ... valid_from_basis: ValidFromBasisSchema.optional() ... change_hint: ChangeHintSchema.default("none")
  - node: rules/knowledge-base/caller-never-states-received
    held_at: >-
      ValidFromBasisSchema, line 8. The enum admits only stated and document, so a caller-supplied valid_from_basis of received fails parsing.
    evidence: >-
      export const ValidFromBasisSchema = z.enum(["stated", "document"]);
looked_past: >-
  The schema also enforces the confidence range, the minimum of one cited fragment, and the YYYY-MM-DD date format, which other rule and contract nodes hold but this file is not bound to; I reported only the vocabularies, the default and the empty link type.