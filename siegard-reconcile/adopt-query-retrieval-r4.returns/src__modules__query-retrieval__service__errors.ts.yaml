findings:
  - file: src/modules/query-retrieval/service/errors.ts
    where: >-
      InvalidSearchQueryError constructor, the message chosen for reason "too_long" (line 16)
    evidence: >-
      "query exceeds 1000 characters"
    cost: >-
      The 1000-character limit appears in this file as a literal inside message text. If the limit in the node moves, this string keeps saying 1000, and the owner sees a refusal that names a limit the specification no longer holds. The file states no other value for the limit, so a reader who finds it here has no sign that the node is where it was decided.
    kind: restates
    correction: >-
      Remove the number from the message, so the refusal states that the query is too long and carries no threshold. The limit stays in rules/knowledge-base/search-query-length. Where the limit is enforced is outside this file and was not reviewed.
    node: rules/knowledge-base/search-query-length

