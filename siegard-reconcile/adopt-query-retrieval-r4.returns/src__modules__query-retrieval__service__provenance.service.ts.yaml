looked_past: >-
  The structured log events and the route strings inside their payloads (for example `GET /api/v1/provenance/${anchorKind}s/:id` and `query_retrieval_provenance_tombstone`) are observability choices rather than domain facts, so I left them to other judgments. I did not open the repository or error modules, which sit outside the file set.
