    where: |-
      the `ChatStatus` type, lines 4-9
    evidence: |-
      export type ChatStatus =
        | "idle"
        | "thinking"
        | "streaming"
        | "tool_running"
        | "error";
    cost: |-
      The chat-status enumeration is declared here as its own authority, in a file that node is not bound to. The node spells the fourth value `tool-running` and this file spells it `tool_running`. When the node's values move, `--check` does not reach this file. Nobody can then tell which spelling was decided. The same literal `tool_running` is also compared in `ChatStatusIndicator.tsx`, so the divergence spreads from this declaration.
    kind: contradicts
    correction: |-
      The enumeration is the node's fact, and its shape is declared in this file. Code does not read the specification, so the correction is to bind `domain/chat-workspace/chat-status` to this file. The value `tool_running` against the node's `tool-running` then needs a decision on which spelling is the business's.
    node: domain/chat-workspace/chat-status

