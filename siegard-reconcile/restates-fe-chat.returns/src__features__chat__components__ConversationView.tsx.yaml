read:
  - node: contracts/chat-workspace/chat-screen
    held_at: |-
      The empty branch of ConversationView (conversationId undefined) and the section returned by ActiveConversation, with its two labelled slots. The archived banner and the composer's own fields are not in this file. The file hands them to Composer through the isArchived and onUnarchive props.
    evidence: |-
      <section aria-label="Conversa" ...> <p className="text-body text-body">Selecione ou crie uma conversa para começar.</p>
      aria-label="Mensagens da conversa" wrapping <MessageStream conversationId={conversationId} className="h-full" />
      aria-label="Compositor de mensagem" wrapping <Composer conversationId={conversationId} isArchived={isArchived} .../>
  - node: rules/chat-workspace/conversation-is-archived-when-its-detail-says-so
    held_at: |-
      The isArchived constant in ActiveConversation, line 35.
    evidence: |-
      const isArchived = conversationQuery.data?.archivedAt != null;
  - node: rules/chat-workspace/reactivating-sends-an-unarchive-update
    held_at: |-
      The onUnarchive prop passed to Composer, lines 59-61.
    evidence: |-
      onUnarchive={() =>
            updateMutation.mutate({ id: conversationId, archivedAt: null })
          }
