    held_at: |-
      The message-list part of the contract is held in the COPY_* constants (lines 13-17) and in the three render branches. The pending branch (146-162) shows the placeholders, the error branch (164-178) shows the alert and the retry, and the empty branch (196-202) shows the empty text. The other operations of the contract belong to other files.
    evidence: |-
      const LABEL_REGION = "Mensagens da conversa";
      const COPY_EMPTY = "Nenhuma mensagem ainda. Envie uma mensagem para começar.";
      const COPY_ERROR =
        "Não foi possível carregar o histórico. Tente novamente.";
      const COPY_RETRY = "Tentar novamente";
  - node: domain/chat-workspace/message-list-state
    held_at: |-
      The `data-state` values on the three section elements (lines 157, 174, 194). The two enumerations match exactly.
    evidence: |-
      data-state="loading"
      data-state="error"
      data-state={isStreaming ? "streaming" : isEmpty ? "empty" : "success"}
  - node: rules/chat-workspace/changing-conversation-does-not-stop-the-turn
    held_at: |-
      The abort effect (lines 138-144) has an empty dependency array, so it runs only on unmount. A change of `conversationId` does not run it.
    evidence: |-
      useEffect(() => {
        return () => {
          const controller = useChatTurnStore.getState().abortController;
          controller?.abort();
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);
  - node: rules/chat-workspace/failed-turn-gets-no-wording-from-the-list
    held_at: |-
      The non-empty branch (lines 204-226) renders only the history bubbles, the streaming bubble and ChatStatusIndicator. It has no failure copy for a turn. The only error wording in the file is COPY_ERROR, which belongs to the history query.
    evidence: |-
      {isStreaming ? (
        <ChatBubble
          key="streaming"
          variant="assistant"
          content={streamingText}
          streaming
          animate
        />
      ) : null}

      <ChatStatusIndicator />
