read:
  - node: contracts/chat-workspace/chat-screen
    held_at: |-
      buildAriaLabel() and the aria-label on the root span of UsageBadge. These cover only the show-usage operation. The file holds nothing of the other four operations.
    evidence: |-
      `Uso: ${tokensIn} tokens de entrada, ` +
          `${tokensOut} tokens de saída, ` +
          `${toolCalls} chamadas de ferramenta`
      ...
      aria-label={ariaLabel}
  - node: rules/chat-workspace/usage-badge-shows-nothing-until-usage-arrives
    held_at: |-
      The early return at line 24 of UsageBadge.
    evidence: |-
      if (query.isLoading || query.data == null) {
          return null;
        }
  - node: rules/chat-workspace/usage-badge-shows-the-three-counts
    held_at: |-
      The destructuring at line 28 and the three count spans of the returned markup. No message count is read or rendered.
    evidence: |-
      const { tokens_in, tokens_out, tool_calls } = query.data;
      ...
      <span data-testid="usage-badge-tokens-in">
      ...
      <span data-testid="usage-badge-tokens-out">
      ...
      <span data-testid="usage-badge-tool-calls">
looked_past: |-
  The arrow and gear glyphs, the Tailwind classes and the data-testid attributes are presentation and test hooks, which are not domain facts and are not judged here.