findings:
  - file: src/features/chat/components/Composer.tsx
    where: |-
      the Textarea in ComposerSendBand, line 262
    evidence: |-
      placeholder="Pergunte algo…"
    cost: |-
      The composer shows this hint text inside the empty field, and no node holds it. The contract for compose-message names the field's label, the send and stop buttons and the band, but not a placeholder. The wording therefore lives only in this file, so a reader who looks in the specification for what the empty field says will not find it.
    kind: unstated
    correction: |-
      The accepted answer of compose-message in contracts/chat-workspace/chat-screen would have to state the placeholder, or a node would have to rule that the field carries none.
    node: contracts/chat-workspace/chat-screen
