looked_past: |-
  The optimistic message is built in the file and held by rules/chat-workspace/owner-message-is-appended-before-the-answer, which is outside this set. That rule says the identifier is built from the idempotency key and the browser's time, and the code builds `optimistic-${args.idempotencyKey}` with `createdAt: new Date()`. Whether the two agree belongs to a judgment over that node.
