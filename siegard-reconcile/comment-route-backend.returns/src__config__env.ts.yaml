looked_past: >-
  The defaults for the chat and ingestion models, the turn, tool and result limits, the
  recent window, the summary overlap, the owner zone, the prompt versions and the chat
  switches are held by nodes outside this pack (for example rules/chat/tool-result-truncated
  and rules/chat/turn-model-default, which bind to other files), so their declaration here
  is a bind matter and not a finding. The prose comments restating those chat facts, the
  PORT, LOG_LEVEL and pool-size defaults, and the unused MAX_HISTORY_MESSAGES field belong
  to the comment route or to another judgment.
