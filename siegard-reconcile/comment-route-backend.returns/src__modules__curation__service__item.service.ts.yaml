findings:
  - file: src/modules/curation/service/item.service.ts
    where: >-
      the ItemServiceDeps docstring on `catalog`, lines 36-48
    evidence: >-
      "Required by `correctItemService` (UC-10 / BR-23) to resolve the
      predecessor's `attribute_key` for the type-parse + closed-value-domain
      legs."
    cost: >-
      The comment states the rule that a corrected attribute value must parse
      as its key's value type, a second home outside behavior. The branch that
      enforces it is `parseAttributeValue({ value: body.corrected.value,
      value_type: attrKey.value_type })` in this same file. When the node
      changes, nothing tells the next reader to update this prose.
    kind: restates
    correction: >-
      Remove the sentences of the docstring that restate the correction's
      type-parse and closed-domain legs. The code in correctItemService
      already holds the fact.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/curation/service/item.service.ts
    where: >-
      the same ItemServiceDeps docstring on `catalog`, lines 36-48
    evidence: >-
      "Because it materializes `attributeValidValuesByKeyId` and exposes the
      `domainOf` helper ... only the ingestion catalog also carries the
      closed-domain map."
    cost: >-
      The comment describes the closed-value-domain check on corrected
      attribute values, a second home outside behavior. The code that holds it
      is `const domain = domainOf(deps.catalog, attrKey.id);` followed by
      `assertValueInDomain(body.corrected.value, domain)`.
    kind: restates
    correction: >-
      Remove the closed-domain description from the docstring.
    node: rules/knowledge-base/attribute-value-in-allowed-values
  - file: src/modules/curation/service/item.service.ts
    where: >-
      the comment above the supersedePredecessor call, line 289
    evidence: >-
      "// 1. Supersede predecessor — `valid_to` UNCHANGED (BR-18)."
    cost: >-
      The comment says a correction leaves the superseded item's validity end
      as it was. Code holds this in another file, `supersedePredecessor` in
      src/modules/curation/repository/curation.repository.ts, whose UPDATE sets
      only `status = 'superseded', superseded_at = now()`. The prose is a
      second home that nothing reads.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/correction-supersedes-item
  - file: src/modules/curation/service/item.service.ts
    where: >-
      the comment above the insertCorrectedRow call, line 303
    evidence: >-
      "// 2. Insert new row with COALESCE overrides."
    cost: >-
      The comment names how the new item takes the stated values, where the
      superseded item's value is the fallback. The code holds it in another
      file, `insertCorrectedRow` in
      src/modules/curation/repository/curation.repository.ts
      (`COALESCE($2::text, value)`, `COALESCE($3::date, valid_from)`). The
      prose is a second home outside behavior.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/corrected-item-values
read:
