    held_at: >-
      confirmItemService lines 67-80 and rejectItemService lines 127-140
    evidence: >-
      "if (locked.length === 0) { throw new ResourceNotFoundError(\"Item not
      found\", ..." comes first. It is followed by `if (row.status !==
      \"uncertain\")` in confirm and `if (row.status === \"deleted\" ||
      row.status === \"superseded\")` in reject.
  - node: rules/knowledge-base/assertion-review-records-curation-action
    held_at: >-
      the insertCurationAction calls in confirmItemService (lines 91-97) and
      rejectItemService (lines 151-157)
    evidence: >-
      "action: \"confirm_item\", target_kind: body.item_kind, target_id:
      body.item_id, payload: {}, reason: body.reason ?? null" and "action:
      \"reject_item\", ... payload: {}, reason: body.reason"
  - node: rules/knowledge-base/attribute-value-in-allowed-values
