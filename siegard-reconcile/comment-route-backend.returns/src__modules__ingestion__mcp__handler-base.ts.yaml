findings:
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      the docstring above assertRunIsRunning, lines 79-90
    evidence: >-
      "- id does not match any LLMRun row -> `RESOURCE_NOT_FOUND`
       - id matches a row whose `status !== 'running'` -> `BUSINESS_RUN_NOT_RUNNING`"
    cost: >-
      The docstring states a second time the rule that a proposal is taken only within a running run,
      and its order of checks. The code below it already holds both: `if (row === null)` throws
      RESOURCE_NOT_FOUND and `if (row.status !== "running")` throws BUSINESS_RUN_NOT_RUNNING. A reader
      can take the prose for where the rule lives, and when the node moves the prose stays behind
      saying the old thing.
    kind: restates
    correction: >-
      Remove the docstring's restatement of the two refusals. The code in assertRunIsRunning stays,
      since it is where the node's fact is held.
    node: rules/knowledge-base/proposal-requires-running-run
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      the comment inside deriveValidationOutcome's default branch, lines 73-75
    evidence: >-
      "// `accepted`, `matched_existing`, `created_new`, `proposed`, missing
       // tag — all collapse to `accepted` per the current contract."
    cost: >-
      The comment restates the mapping from a proposal's result tag to a tool call's validation
      outcome. Candidate node rules/knowledge-base/tool-call-validation-outcome holds that mapping
      and the `switch` in this file implements it. The comment is a second home outside behavior, and
      this file is not bound to that node, so a change to the node does not reach this file through
      `--check`.
    kind: restates
    correction: >-
      Remove the comment. Binding the file to rules/knowledge-base/tool-call-validation-outcome would
      claim the switch as the place where that node's fact is held.
    node: rules/knowledge-base/tool-call-validation-outcome
