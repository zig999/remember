    evidence: >-
      `if (row.status !== "running") { throw new ValidationFailure("BUSINESS_RUN_NOT_RUNNING", ...`
  - node: rules/knowledge-base/proposal-run-checks-first
    held_at: >-
      assertRunIsRunning, lines 95-109, for the existing-run check followed by the running check. The
      well-formed-request check happens before this function and is not carried in this file.
    evidence: >-
      `const row = await findLlmRunById(client, llmRunId); if (row === null) { throw new
      ValidationFailure("RESOURCE_NOT_FOUND", ...` followed by `if (row.status !== "running") {
      throw ... "BUSINESS_RUN_NOT_RUNNING"`
  - node: rules/knowledge-base/refused-proposal-records-only-its-tool-call
    held_at: runIngestHandler, catch and rollback branch and the audit writes, lines 141-186 and 197-224
    evidence: >-
      `await client.query("ROLLBACK");` discards the business writes, then
      `await safeWriteAuditOnRollback(args.deps, args.tool_name, args.input, errEnv, "rejected");` and
      `... errEnv, "error");` write only the tool call through `insertToolCallStandalone`.
