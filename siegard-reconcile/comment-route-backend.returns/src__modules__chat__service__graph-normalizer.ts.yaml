findings:
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      header comment, lines 5-11 (scope list of the four graph-producing read tools)
    evidence: >-
      "//   - traverse   -> N nodes + M links  (subgraph; canonical source).
      //   - get_node   -> 1 node  + 0 links.
      //   - list_nodes -> N nodes + 0 links.
      //   - search     -> hydrate items(kind=node) -> N nodes + 0 links."
    cost: >-
      The content of a graph delta per tool is stated a second time in prose beside the code that holds it (normalizeTraverse, normalizeGetNode, normalizeListNodes, normalizeSearch). When the node moves, `--check` does not reach the comment, and a reader may take it for the decided list.
    kind: restates
    correction: >-
      Remove the prose by the comment route. The code in this file already holds the fact, so no node change is needed.
    node: rules/chat/graph-delta-content
