looked_past: >-
  The comments on status_for_new_row ("`'active'` if confidence ≥ 0.75, else `'uncertain'` (BR-17)") restate a confidence threshold that this file does not hold and whose node is outside this pack, and the message of the second-collision refusal is emitted text that agrees with the specification's contract for the proposal operations, so neither is reported.
