findings:
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      header comment, lines 4-9, and the docstring of insertLinkProvenance, lines 176-179
    evidence: >-
      "In every branch where a (new or existing) main row id ends up being the
      provenance target, the service inserts one provenance row per fragment
      with ON CONFLICT DO NOTHING" and "`ON CONFLICT DO NOTHING` makes re-affirmation idempotent (§18)."
    cost: >-
      The one-provenance-per-cited-fragment rule is stated a second time in prose beside the
      code that holds it (insertLinkProvenance and insertAttributeProvenance, `INSERT INTO provenance ...
      SELECT $1, f FROM unnest($2::uuid[]) AS f ON CONFLICT DO NOTHING`). When the node moves, the prose
      keeps saying the old rule and no check reaches it.
    kind: restates
    correction: >-
      Remove the comment text; the fact is held by the node and by the INSERT statements in this file.
    node: rules/knowledge-base/consolidation-records-provenance
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      header comment, lines 15-32, and the comment inside the correction branch of consolidateLinkOnce, lines 456-458
    evidence: >-
      "describe the correction branch as closing the previous row" ... "This service uses `'superseded'` for the
      closed vigent row in the correction branch" and "Close the vigent row (transaction axis only — valid_to untouched
      per §6.5-B)."
    cost: >-
      The correction rule (supersede the current assertion, leave its validity end, chain the new row) is
      restated in prose, together with a claim about a divergence from other documents. The code already holds
      it (`SET superseded_at = now(), status = 'superseded'::assertion_status` with `supersedes_link_id: vigent.id`),
      so the prose is a second home that will not follow the node.
    kind: restates
    correction: >-
      Remove the comment text; the rule is held by the node and by the UPDATE and INSERT in the correction branches.
    node: rules/knowledge-base/correction-replaces
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      header comment, lines 34-40, and the comments in the succession branches, lines 488-491 and 703
    evidence: >-
      "BR-27 succession step says `valid_to = $newValidFrom (or now()::date
      if the new row has no valid_from)`" and "Close the old row for succession (§6.5-A): valid_to = the new row's
      valid_from (or today when absent)"
    cost: >-
      The closing-date rule is stated in prose in three places while the code holds it in closeVigentForSuccession
      (`const closeExpr = closeDate !== null ? "$2::date" : "now()::date";`). A change to the node would leave
      three stale statements of it.
    kind: restates
    correction: >-
      Remove the comment text; the rule is held by the node and by closeVigentForSuccession.
    node: rules/knowledge-base/succession-closing-date
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      the comment before the retry loop of consolidateLink, line 360, and the comment at its retry exit, lines 392-393
    evidence: >-
      "// Two attempts max (BR-27 / task contract)." and "// attempt === 1 -> loop and retry. The concurrent row is now
      // visible to our SELECT FOR UPDATE."
    cost: >-
      The decide-again-once rule is restated in prose beside the loop that holds it
      (`for (let attempt = 1; attempt <= 2; attempt += 1)` with ROLLBACK TO SAVEPOINT), so the bound has two
      homes in this file.
    kind: restates
    correction: >-
      Remove the comment text; the rule is held by the node and by the loops in consolidateLink and consolidateAttribute.
    node: rules/knowledge-base/consolidation-race-decided-again
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      the comment at the start of consolidateLinkOnce, lines 417-425
    evidence: >-
      "For FUNCTIONAL types: the succession scope is (source, link_type). We
      lock that broader scope, then refine the decision by comparing target." and "For MULTI-VALUED types: succession does not apply (§6.5). The scope is
      // (source, link_type, target)"
    cost: >-
      What a proposal meets, by type, is restated in prose next to the two lock calls that hold it
