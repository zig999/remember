  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      the comments in the succession branches, lines 488-491 and 703
    evidence: >-
      "EXCEPT for an intra-day succession
      // where that would collapse the interval — then close on the transaction
      // axis only. See closeVigentForSuccession." and "§6.5-A succession close with the same intra-day collapse guard as links."
    cost: >-
      The rule for a closing date on or before the previous start is restated in prose while the code holds it in the
      CASE of closeVigentForSuccession (`WHEN valid_from IS NOT NULL AND valid_from >= ${closeExpr} THEN valid_to`).
    kind: restates
    correction: >-
      Remove the comment text; the rule is held by the node and by closeVigentForSuccession.
    node: rules/knowledge-base/succession-before-previous-start
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateLinkOnce, lines 510-519, the fall-through for a multi-current link type that meets a current link
      of the same target with change hint succession, and the retry loop of consolidateLink that then throws
    evidence: >-
      "can only reach here when change_hint is 'succession' or
      //     'correction' on a multi-current type ... We
      //     fall through to (e) which will hit the dup-guard and surface
      //     SYSTEM_INTERNAL_ERROR — the correct outcome for a malformed
      //     proposal on a multi-current type."
    cost: >-
      No node says what a proposal of change hint succession does when it meets the current link of the same
      target on a type that allows multiple current links. The code decides it: the proposal falls to the new-assertion
      insert, collides with the duplicate guard, and is refused as SYSTEM_INTERNAL_ERROR with the message about
      "a concurrent transaction committed a conflicting row" although no concurrent transaction exists. The next reader
      looks for this refusal in the specification and does not find it.
    kind: unstated
    correction: >-
      The analysis would have to decide what such a proposal does and give it a node, for example one beside
      reaffirmation-consolidates and consolidation-precedence.
