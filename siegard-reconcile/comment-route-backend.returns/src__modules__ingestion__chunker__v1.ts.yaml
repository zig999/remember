    evidence: >-
      Line terminator is
       * `\n`; the terminator is NOT included in the range
      ...
          if (codePoints[i] === "\n") {
    cost: >-
      The nodes speak of a "blank line", a "line break" and "a line", and none says what ends a line. The code decides that only "\n" does. A CRLF email leaves "\r" on its blank line, so that line is not blank by `line.endExclusive === line.start`. Its header block then never ends and the whole email becomes one block. Nobody looking in the specification would find this decision.
    kind: unstated
    correction: >-
      Give the definition of a line break (which characters end a line, and how CRLF is treated) to the node that governs it, probably alongside email-header-block, speaker-line and turn-blocks, through the analysis route.
    node: rules/knowledge-base/email-header-block
