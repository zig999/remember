findings:
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      the doc comment above IngestRawInformationRequestSchema, lines 19-20
    evidence: >-
      * - `model` and `prompt_version`: parts of the `llm_run.idempotency_key`
      *    composition (BR-08, A18).
    cost: >-
      The doc comment states, in part, how the idempotency key is composed. The
      composition is already decided in rules/knowledge-base/idempotency-key and
      is carried out by composeIdempotencyKey in hash.ts. A reader who finds the
      comment here has a second place to check, and it goes stale if the node
      moves.
    kind: restates
    correction: >-
      Remove the comment. The composition is held by the node and by
      composeIdempotencyKey in src/modules/ingestion/hash.ts, which hashes
      content_hash, prompt_version, model and chunking_version in that order.
    node: rules/knowledge-base/idempotency-key
read:
  - node: domain/knowledge-base/llm-run
    held_at: nowhere
    evidence: >-
      The file declares only request and response schemas. `model: z.string().min(1, "model is required")`,
      `prompt_version: z.string().min(1, "prompt_version is required")` and
      `llm_run_id: z.string().uuid()` pass LLM run values along. The LLMRun shape
      (status, attempts, started_at, summary) is not declared here.
  - node: domain/knowledge-base/raw-chunk
    held_at: >-
      ChunkRefSchema, lines 52-57, which declares part of the chunk's shape.
    evidence: >-
      export const ChunkRefSchema = z.object({ id: z.string().uuid(), chunk_index: z.number().int().nonnegative(), offset_start: z.number().int().nonnegative(), offset_end: z.number().int().positive(), });
  - node: domain/knowledge-base/raw-information
    held_at: >-
      IngestRawInformationRequestSchema, lines 22-41, which declares part of
      the raw information's shape.
    evidence: >-
      source_type: SourceTypeSchema, content: z.string()..., storage_ref: z.string().nullable().optional(), metadata: z.record(z.string(), z.unknown()).default({}), original_input: z.string().max(...).nullable().optional()
  - node: rules/knowledge-base/content-length
    held_at: >-
      the `content` field of IngestRawInformationRequestSchema, lines 24-27
    evidence: >-
      .min(1, "content must not be empty") .max(10 * 1024 * 1024, "content must not exceed 10 MiB")
  - node: rules/knowledge-base/idempotency-key
    held_at: nowhere
    evidence: >-
      The file only checks the response format: `idempotency_key: z.string().regex(/^[0-9a-f]{64}$/)`.
      The SHA-256 composition over content hash, prompt version, model and
      chunking version is carried out in hash.ts (composeIdempotencyKey), not in
      this file. Here it appears only in a comment.
  - node: rules/knowledge-base/original-input-length
    held_at: >-
      the `original_input` field of IngestRawInformationRequestSchema, lines 36-40
    evidence: >-
      .max(10 * 1024 * 1024, "original_input must not exceed 10 MiB")
looked_past: >-
  The comment "storage_ref: nullable; must be `null` in v1.0.0" states a rule that no code in this file enforces, and the header comment restates the 422 VALIDATION_INVALID_FORMAT mapping that contracts/knowledge-base/ingestion holds, so both are prose for the comment route and not findings; the outcome enum, the response shape and the 422 refusals are held by that contract node, which is outside this set.
