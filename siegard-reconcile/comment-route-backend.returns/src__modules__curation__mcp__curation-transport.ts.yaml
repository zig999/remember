read:
  - node: constraints/curation-mcp-needs-no-run-identity
    held_at: >-
      the mountMcpEndpoint call in registerCurationMcpTransport, lines 38-55, specifically the
      getTools mapping, which builds each tool from name, description, inputSchema and handler only.
    evidence: >-
      getTools: () => deps.toolNames.map((name) => deps.mcp.getTool("curation", name)) ... .map((t): McpHttpTool => ({ name: t.name, description: t.description, inputSchema: t.inputSchema, handler: t.handler as (input: unknown) => Promise<McpEnvelope> }))
      This file reads no run id from a header, an argument or a session, and it never checks for one.
      The curation tools are served through the kernel without that identity.
looked_past: >-
  The header comment (lines 1-13) describes the tool count, the BR-30 validation and the stateless kernel, and the mount path, serverName and serverVersion are plain transport wiring; these are prose and transport wiring, not facts of the node in this set, so I did not report them.
