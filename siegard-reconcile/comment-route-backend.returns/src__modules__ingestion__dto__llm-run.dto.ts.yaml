findings:
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      the doc comment above LlmRunSummarySchema, lines 36-41
    evidence: >-
      * Counters for `LlmRun`. The 8 outcome buckets are aggregated from
      * `tool_call.validation_outcome`; `orphaned_fragments` is a separate
      * fragment-level recall signal (see field doc). All fields always
      * present (BR-12).
    cost: >-
      The comment states a second time that a run's summary counts its tool calls by validation outcome and that every counter is always present. A reader who changes the counting rule would find this prose beside the schema and could take it for the home of the rule. The counting itself is done in llm-run.repository.ts.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by the node, and the code that holds it is the GROUP BY query in src/modules/ingestion/repository/llm-run.repository.ts, which seeds zeros and then fills in the counts. The schema here declares all nine fields as required.
    node: rules/knowledge-base/summary-counts-tool-calls
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      the doc comment above AffectedNodeSchema, lines 55-63
    evidence: >-
      * Surfaces a `KnowledgeNode` the run touched (created, matched, or
      * consolidated). The triple `{ id, canonical_name, node_type }` is the
      * minimum the chat-side `block 4C` ...
    cost: >-
      The comment paraphrases which nodes count as affected as "created, matched, or consolidated". The node lists a different and longer set of outcomes: accepted, consolidated, superseded, disputed, created, matched and needs review. A reader could take the comment's shorter list as the rule. The collection rule is carried by service/affected-nodes.ts.
    kind: restates
    correction: >-
      Remove the comment. The rule is held by the node, and the code that holds it is src/modules/ingestion/service/affected-nodes.ts.
    node: rules/knowledge-base/affected-nodes-of-a-run
