findings:
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      line 243, idempotency_key in GetIngestionStatusOutputSchema
    evidence: >-
      idempotency_key: z.string().regex(/^[0-9a-f]{64}$/),
    cost: >-
      The key's shape (SHA-256, 64 lowercase hex characters) is a rule node
      rules/knowledge-base/idempotency-key holds, and it is bound to
      llm-run.dto.ts, ingest-raw-information.dto.ts, hash.ts and
      ingestion.service.ts, not to this file. This regex repeats it where
      nothing reads the node. When the node moves, --check never reaches this
      file, and nobody can tell which of the two copies was decided.
    kind: contradicts
    correction: >-
      Take the key's shape from the LlmRunResponseSchema declared in
      llm-run.dto.ts, which the node binds, instead of declaring the regex a
      second time here. Alternatively, bind this file to the node.
    node: rules/knowledge-base/idempotency-key
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      line 304, IngestDirectedValidFromBasisSchema
    evidence: >-
      const IngestDirectedValidFromBasisSchema = z.enum(["stated", "document"]);
    cost: >-
      The vocabulary of a validity-start basis lives in
      domain/knowledge-base/valid-from-basis (stated, document, received). The
      rule that a caller never states `received` lives in
      rules/knowledge-base/caller-never-states-received. This file declares
      its own subset enum, and the file is bound to neither node. Whoever
      changes the vocabulary or the rule will not be led to this enum, and
      directed ingestion would keep accepting the old set.
    kind: contradicts
    correction: >-
      Derive the caller-statable subset from the enum declared in
      curation/dto/enums.dto.ts (where valid-from-basis is bound), or bind
      this file to the two nodes.
    node: rules/knowledge-base/caller-never-states-received
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      line 341, the .describe text of node_id in IngestDirectedNodeItemSchema
      (text emitted on tools/list)
    evidence: >-
      Rejected (VALIDATION_INVALID_FORMAT) if the id does not point to an active node.
    cost: >-
      The ingestion contract answers a pin that names no knowledge node with
      RESOURCE_NOT_FOUND ("node_id pin does not resolve to an existing
      knowledge_node row."). Only a pin to a non-active node gets
      VALIDATION_INVALID_FORMAT. A client that reads this description expects
      VALIDATION_INVALID_FORMAT for a nonexistent id as well, and the
      contract says otherwise.
    kind: contradicts
    correction: >-
      State the two refusals as the contract does: RESOURCE_NOT_FOUND where the
      pinned id names no node, VALIDATION_INVALID_FORMAT where it names a node
      that is not active.
    node: contracts/knowledge-base/ingestion
