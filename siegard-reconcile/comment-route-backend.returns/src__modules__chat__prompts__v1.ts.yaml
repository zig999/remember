findings:
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      the docstring above CHAT_PROMPT_MARKER_V1, lines 17-28, and the header comment, lines 3-12
    evidence: >-
      "Planted at the head of the system prompt body so the output guard can detect leakage."
      and "The marker token is included BY THE BUILDER — callers do NOT re-insert it"
    cost: >-
      The prose says a second time that the prompt begins with the one marker. The code already
      holds that fact, as the constant and as the first element of the array system() joins.
      Prose that restates a node's fact is a second place to keep in step with the node, and
      nothing reads it. Its detail ("FROZEN per prompt-module version", the output guard
      scrubbing "the union of all known markers") is a belief about other files, not something
      this file enforces.
    kind: restates
    correction: >-
      Remove the prose. The code in this file already carries the fact, and the node binds it.
      This is the comment route, with /reconcile over the file afterwards.
    node: rules/chat/chat-prompt-carries-marker
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      principle 3 of the emitted prompt, lines 57-60
    evidence: >-
      "Se voce precisa de um id, RESOLVA o nome chamando `search` ou `list_nodes`",
      "antes de chamar qualquer ferramenta que exige id (`get_node`,",
      "`traverse`, `get_history_*`, `get_provenance_*`)."
    cost: >-
      The prompt tells the assistant to resolve a name through search or list_nodes before any
      tool that takes an id. The node holds only "never to invent identifiers and to cite its
      source". The next reader looks in the specification for what the assistant was told about
      identifiers, finds half of it, and treats this file as the place where the other half was
      decided.
    kind: unstated
    correction: >-
      Analysis would extend the node's statement, or give a new node, to cover the instruction
      to resolve a name to an id through search or the node listing before an id-taking tool.
    node: rules/chat/chat-prompt-v1-cites-sources
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      principle 4 of the emitted prompt, lines 61-63
    evidence: >-
      "Toda afirmacao factual deve apontar para o fragmento", "ou o chunk que a sustenta — use
      as ferramentas `get_provenance_*`", "quando o usuario pedir verificacao."
    cost: >-
      The node says only "cite its source". The prompt also fixes what counts as the source (the
      fragment or the chunk) and when the provenance tools are used (when the owner asks for
      verification). Those choices shape every cited answer, and they live only in the prompt
      text.
    kind: unstated
    correction: >-
      Analysis would decide whether the citation target (fragment or chunk) and the
      provenance-on-request behavior belong in the node's statement, or in a node of their own.
    node: rules/chat/chat-prompt-v1-cites-sources
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      principle 7, the second sentence, lines 72-73
    evidence: >-
      "Em caso de erro de uma", "ferramenta, traduza para uma frase curta em pt-BR para o
      usuario."
    cost: >-
      The node rules/chat/assistant-withholds-internals says only that internal error messages
      are never shown. The prompt adds what the assistant says instead, a short pt-BR sentence
      for a tool error. That substitute behavior is not in the specification.
    kind: unstated
    correction: >-
      Analysis would decide whether replacing a tool error with a short pt-BR sentence is a
      fact of the chat and gets a node, or an implementation detail of the prompt.
    node: rules/chat/assistant-withholds-internals
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      the persona opening of the emitted prompt, lines 47-50
    evidence: >-
      "Voce e um assistente de consulta ao grafo de conhecimento Remember." and "ferramentas
      (tools) disponibilizadas — voce NUNCA acessa o banco de dados" "diretamente."
    cost: >-
      The prompt tells the assistant that it never accesses the database directly and that it
      works only through the tools. I found no chat node that holds this instruction, so the
      assistant's role and its no-direct-access boundary are decided only in prompt text.
    kind: unstated
    correction: >-
      Analysis would give the persona and the no-direct-access instruction a node in the chat
      prompt rules, or decide that they are not a fact of the specification.
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      the FERRAMENTAS section of the emitted prompt, lines 77-79
    evidence: >-
      "Use as ferramentas SOMENTE quando elas adicionarem informacao que voce" "ainda nao tem.
      Cada chamada e auditada e tem orcamento de tempo."
    cost: >-
      The prompt tells the assistant to call tools only when they add information it lacks, and
      says that each call is audited and has a time budget. No node holds the restraint on tool
      use or the claim about audit and time budget. A reader looking at how the assistant is
      held back from calling tools finds nothing in the specification.
    kind: unstated
    correction: >-
      Analysis would decide whether the restraint on tool use belongs in a chat prompt rule. The
      claims about audit and time budget would have to be checked against nodes that hold them.
