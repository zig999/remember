findings:
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      the docstring of resolveOrCreateNode, line 69, and the file header, lines 7-8
    evidence: >-
      " *   1. Acquires `pg_advisory_xact_lock(hashtextextended(nt || '\\x1F' || norm(name), 0))`
       *      BEFORE any read on `node_alias` (BR-20)."
    cost: >-
      The serialisation of concurrent proposals is described a second time in prose. If the node
      moves, this docstring keeps saying the old rule, and `--check` does not reach it. The code
      in this file already takes the lock (`SELECT pg_advisory_xact_lock(hashtextextended($1::text, 0))`).
    kind: restates
    correction: >-
      Remove the prose. The fact is held by the lock query in this file and by the node.
    node: rules/knowledge-base/concurrent-proposals-resolve-in-turn
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      the docstring of resolveOrCreateNode, line 71
    evidence: >-
      " *   2. Tries exact `alias_norm = norm(name)` match against active nodes of
       *      `nodeTypeId`. Hit → reuse; resolution = `matched_existing`."
    cost: >-
      The exact-alias rule is stated a second time in a docstring. A change to the node would
      leave this text stale without any check noticing.
    kind: restates
    correction: >-
      Remove the prose. The exact-match SELECT (`WHERE na.alias_norm = norm($1::text) AND kn.node_type_id = $2 AND kn.status = 'active'`)
      holds the fact in this file.
    node: rules/knowledge-base/exact-alias-resolves
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      comment inside the exact-match branch, lines 126-127
    evidence: >-
      "// Canonical name not re-inserted on match (already present by virtue of
       // alias_norm hit). LLM-supplied aliases still attempt insert."
    cost: >-
      The rule that a matched node gains only the proposed aliases is repeated as prose beside
      code that already enforces it, because `attachAliases` is called with `aliases: args.aliases`
      and no canonical name.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/matched-node-gains-only-aliases
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      the trigram candidate query (lines 137-148) and the constant TRIGRAM_CANDIDATE_LIMIT, line 28
    evidence: >-
      "const TRIGRAM_CANDIDATE_LIMIT = 10;" and "ORDER BY MAX(similarity(na.alias_norm, norm($1::text))) DESC
      LIMIT ${TRIGRAM_CANDIDATE_LIMIT}", after which `decision.candidates` (the above-floor subset of that
      list) is the only set that gets an `entity_match_review` row.
    cost: >-
      The node says the review pairs the new node with each active node at 0.55 or more. The code
      pairs it only with the ten most similar. If an eleventh node reaches the floor, the owner never
      sees it in the curation queue. The cap of ten is a business value that lives only in this file.
    kind: contradicts
    correction: >-
      Either the candidate set is not capped before the floor filter, or the node states the cap.
      Which of the two applies is for the analysis to decide.
    node: rules/knowledge-base/ambiguous-candidates-need-review
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      comment in decideFromCandidates, line 236
    evidence: >-
      "// Strong-unique requires exactly one strong AND no second above the floor."
    cost: >-
      The strong-candidate rule is stated a second time in prose, next to the condition that already
      implements it (`strong.length === 1 && aboveFloor.length === 1`). A change to the node would
      leave the comment stale.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/strong-candidate-resolves
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      comment in decideFromCandidates, lines 241-243
    evidence: >-
      "// Everything else with at least one above-floor candidate is ambiguous:
       //  - any candidate in [MATCH_FLOOR, MATCH_STRONG), OR
       //  - two-or-more candidates >= MATCH_STRONG."
    cost: >-
      The routing of ambiguous proposals to review is restated in prose. The code that holds it is
      `return { kind: "ambiguous", candidates: aboveFloor }` and the `needs_review` INSERTs. The
      comment will not follow the node if it moves.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/ambiguous-candidates-need-review
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      the docstring of attachCanonicalAndAliases, lines 247-250
    evidence: >-
      "Attach the canonical name as the first alias (`kind = 'canonical'`) plus
       any LLM-supplied aliases (`kind = 'alias'`) to a newly created node."
    cost: >-
      The alias composition of a new node is described a second time in a docstring. The two INSERT
      statements in this file already hold it, so a change to the node would leave the docstring stale.
    kind: restates
    correction: >-
      Remove the docstring.
    node: rules/knowledge-base/new-node-aliases
