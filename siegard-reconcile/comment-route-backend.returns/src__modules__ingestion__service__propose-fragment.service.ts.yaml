read:
  - node: domain/knowledge-base/information-fragment
    held_at: >-
      nowhere
    evidence: >-
      The file declares no type, schema or table for the fragment. It only passes values to `insertFragmentWithSources(client, { llm_run_id, text, confidence, chunk_ids })` and returns `{ fragment_id: fragment.id, status: "proposed" }` typed as `ProposeFragmentResult` from the DTO file.
  - node: rules/knowledge-base/fragment-chunks-exist
    held_at: >-
      the failure branch of proposeFragmentService, lines 53-64
    evidence: >-
      `if (exists !== args.chunk_ids.length) { throw new ValidationFailure("RESOURCE_NOT_FOUND", "One or more chunk_ids do not resolve to an existing raw_chunk row.", { chunk_ids: args.chunk_ids }); }`
  - node: rules/knowledge-base/fragment-chunks-in-run-source
    held_at: >-
      the source-membership count at lines 45-49 and the throw at lines 65-72
    evidence: >-
      `countChunksInSource(client, { chunk_ids: args.chunk_ids, expected_raw_information_id: runCtx.rawInformationId })`, then `throw new ValidationFailure("VALIDATION_INVALID_FORMAT", "One or more chunk_ids are not part of this run's source.", { chunk_ids: ..., expected_raw_information_id: runCtx.rawInformationId })`
  - node: rules/knowledge-base/fragment-missing-chunk-first
    held_at: >-
      the order of the checks inside the `matched !== args.chunk_ids.length` branch, lines 49-72
    evidence: >-
      The existence check and its `RESOURCE_NOT_FOUND` throw (lines 58-64) come before the `VALIDATION_INVALID_FORMAT` throw for chunks outside the run's source (lines 65-72). A missing chunk is therefore reported before a wrong-source chunk.
