looked_past: >-
  A non-object input is collapsed to "0 keys" before the switch, so a catalog-listing call with a null or
  array input would not give the empty summary. Whether the dispatcher can ever pass such an input is the
  dispatcher's judgment, not this file's, so I did not report it.
