    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/lineage-history
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      the doc comment on listAttributeHistoryByNodeKey(), lines 494-499
    evidence: >-
      * UC-11 — list every version of `(node_id, attribute_key_id)`, ordered ASC
