    cost: >-
      Prose states the rule that uncertain attributes are left out by their status. The code
      holds it in this file (`uncertainClause = "AND na.status <> 'uncertain'"`). The comment is
      a restatement outside behavior.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/node-read-excludes-uncertain-on-request
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      the doc comment on TraversalHopFilter.direction, line 362
