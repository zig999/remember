findings:
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      KnowledgeNodeRow.status, line 28 (the same union is repeated in ListNodesFilter.status, line 57)
    evidence: >-
      readonly status: "active" | "needs_review" | "merged" | "deleted";
      The node reads: values: active, needs-review, merged, deleted.
    cost: >-
      The file declares the node-status shape with the value spelled needs_review. The node
      holds needs-review. The two spellings are different strings, so a reader who checks this
      file against the specification cannot tell which one the business decided. The
      compliance-checked wire value is the one the code emits, and it is not the one the
      specification names.
    kind: contradicts
    correction: >-
      Either the node-status spelling or the code's spelling has to change. Which of the two is
      meant is for a person to decide. A boundary mapping is not visible in this file.
    node: domain/knowledge-base/node-status
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      the doc comment on ListNodesFilter.status, line 56
    evidence: >-
      /** Status filter; defaults to "active" in the service (BR-15). */
    cost: >-
      Prose states the node's default of active. No running system emits it. The default is held
      in code in another file, backend/src/modules/knowledge-graph/service/node.service.ts line
      62 (`const status: NodeStatus = input.status ?? "active";`). The comment is a second home
      for the fact outside behavior, and it can drift from the node unseen.
    kind: restates
    correction: >-
      Remove the comment. The fact stays held by node-listing-by-status and by the service code.
    node: rules/knowledge-base/node-listing-by-status
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      the comment above the alias join in listNodes(), lines 88-90
    evidence: >-
      // We always JOIN node_type for the response. Alias prefix is an optional
      // INNER JOIN — when present, narrows the candidate set; the DISTINCT keeps
      // one row per node id.
    cost: >-
      Prose states the one-entry-per-node rule. The code holds it in this file
      (`count(DISTINCT kn.id)` and `SELECT DISTINCT kn.id`). The comment is a second statement of
      the fact that nothing reads.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/node-listing-one-entry-per-node
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      the comment in listAttributesByNodeId(), line 201
    evidence: >-
