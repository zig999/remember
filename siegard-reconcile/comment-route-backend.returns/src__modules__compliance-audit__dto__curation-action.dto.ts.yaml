    where: >-
      the JSDoc above TargetKindSchema, line 16
    evidence: >-
      /** Allowed target_kind values (mirrors openapi.yaml). */
    cost: >-
      The comment names openapi.yaml as a second authority for the closed set of target kinds. The set is held by the enum declared just below it (and by the node domain/knowledge-base/curation-target-kind). A reader is sent to a third place to learn what is allowed, and a change to the node does not reach that file.
    kind: restates
    correction: >-
      Remove the comment. The fact is already held by the TargetKindSchema enumeration in this file, which is where the node's bind claims it.
    node: domain/knowledge-base/curation-target-kind
