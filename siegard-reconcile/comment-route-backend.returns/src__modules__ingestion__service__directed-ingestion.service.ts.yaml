      *     `SYSTEM_SERVICE_UNAVAILABLE`) collapse to `'error'` (SDK / catch-all
      *     bucket).
    cost: >-
      The error versus rejected rule is restated in prose. The `startsWith("SYSTEM_")` branch holds it.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/directed-item-status
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the fallback in readClosedRunSafe, lines 1042-1046
    evidence: >-
      const fallback = {
          started_at: new Date(0).toISOString(),
          finished_at: new Date(0).toISOString(),
          attempts: 1,
        };
    cost: >-
      When the closed run cannot be read, the response reports the 1970 epoch as the run's start and
      finish times, with one attempt. The contract's ingest-directed answer holds the completed run
      and the empty affected-nodes case. It states no placeholder times or attempts, so a caller sees
      invented values.
    kind: unstated
    correction: >-
      The analysis should state what the response carries when the run cannot be read, or the service
      should stop inventing values.
    node: contracts/knowledge-base/ingestion
