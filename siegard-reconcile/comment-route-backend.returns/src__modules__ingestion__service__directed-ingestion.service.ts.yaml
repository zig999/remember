      `verifyPin` holds it.
    kind: restates
    correction: >-
      Remove the comments.
    node: rules/knowledge-base/directed-pinned-node
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the attribute and link proposals, lines 629 and 709, with the schemas that accept the field at lines 142 and 153
    evidence: >-
      change_hint: item.change_hint ?? "none",
      ...
        change_hint: ChangeHintSchema.optional(),
    cost: >-
      The node says a directed attribute or link is proposed with change hint none. The service lets
      the caller supply any change hint and proposes that one. The specification's decision log says
      the directed tool carries none, so the service states a freedom the specification does not
      grant. If a caller reaches the service by another path, a directed item can be proposed as a
      correction or a change.
    kind: contradicts
    correction: >-
      Propose change hint none unconditionally and drop `change_hint` from the directed item schemas.
      The alternative is for the analysis to give the supplied hint a node.
    node: rules/knowledge-base/directed-defaults
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the comment above Step 4, line 755 ("always 'completed' on this path")
    evidence: >-
      // ---- Step 4 — close the run (always 'completed' on this path) ----
    cost: >-
      The rule is restated in prose. `closeLlmRunRow(client, { llm_run_id: llmRunId, outcome: "completed" })` holds it.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/directed-run-completes
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      refForAttribute, lines 915-923
    evidence: >-
      function refForAttribute(item: DirectedAttributeItem): string {
        return `${item.node_ref}.${item.key}`;
      }
    cost: >-
      The reference an attribute's report entry carries (its node reference and key joined by ".") is
      emitted to callers. No node states it. The specification holds this only for links, as source,
      link type and target joined by "->". A caller or the chat layer that reads attribute reports has
      to find the format here.
    kind: unstated
    correction: >-
      The analysis should give the attribute report reference a node beside directed-link-report-reference.
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
