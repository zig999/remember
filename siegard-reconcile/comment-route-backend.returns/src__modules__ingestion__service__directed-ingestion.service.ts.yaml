  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the reference maps, lines 459-460, filled only on success at lines 476, 511 and 561
    evidence: >-
      const refToFragmentId = new Map<string, string>();
        const refToNodeId = new Map<string, string>();
      ...
          refToFragmentId.set(item.ref, envelope.result.fragment_id);
    cost: >-
      When two items of one kind share a reference and the later one is refused, the map is never
      updated. A dependent attribute or link then resolves to the earlier item's id instead of being
      reported dependency-failed. The node says the reference names the later one. Two ingestions that
      differ only in whether the later item is refused attach the same evidence to different fragments.
    kind: contradicts
    correction: >-
      A later item that shares a reference with an earlier one must displace the earlier entry even
      when the later one is refused, so that the reference then names nothing resolvable. As written,
      the code does not carry the fact the node holds.
    node: rules/knowledge-base/directed-later-reference-wins
