findings:
  - file: src/modules/chat/service/datetime-block.ts
    where: >-
      the docstring above formatIsoWithOffset (lines 38-48) and the header comment (lines 1-16), which cite "BR-47" and describe the string's shape
    evidence: >-
      " * Format `now` as `YYYY-MM-DDTHH:mm:ss±HH:MM` in the requested IANA zone." and
      " * @returns    The exact-shape string per BR-47 step 2 example."
    cost: >-
      The fact that the time is rendered as ISO-8601 with an offset, followed by the zone identifier, is stated a second time in prose that no running system emits. It also points the reader to "BR-47", a back-spec step, as its authority. When the node moves, the node's binding does not reach this prose, so a reader can trust a shape the node no longer holds.
    kind: restates
    correction: >-
      Remove the header comment and the docstrings. The code already holds the fact: renderDatetimeBlockB returns `${ISO_PREFIX}${iso} (${tz})`, and formatIsoWithOffset builds the ISO string with its offset.
    node: rules/chat/model-context-owner-time
