findings:
  - file: src/modules/compliance-audit/mcp/compliance-toolset.ts
    where: >-
      the docstring above mapZodErrorToEnvelope, lines 48-61
    evidence: >-
      " * Zod parse failure -> canonical VALIDATION_* code (P2.1). Mirrors the priority
       * discrimination the REST route uses ... 1. Explicit `superRefine` `VALIDATION_OUT_OF_RANGE` marker ...
       *   2. Missing / undefined field -> `VALIDATION_REQUIRED_FIELD`. ...
       *   4. Everything else -> `VALIDATION_INVALID_FORMAT`."
    cost: >-
      The order in which failed form checks are refused is stated in prose here as well as in the
      node. The comment skips item 3 and numbers the last item 4, so it already differs from the
      code, which has a third branch for `reason` length. A reader who trusts the comment gets the
      order wrong, and the node is not bound to it, so a change to the node never reaches it.
    kind: restates
    correction: >-
      Remove the docstring. The code in this file (the four ordered branches of
      mapZodErrorToEnvelope) holds the order, and the node already states it.
    node: rules/knowledge-base/audit-filter-checks-order
  - file: src/modules/compliance-audit/mcp/compliance-toolset.ts
    where: >-
      the file header comment lines 7-15, and the comment at lines 158-159
    evidence: >-
      "// Envelope (CLAUDE.md "Architecture / Backend"):
      //   success -> { ok: true,  result: { outcome, deletion } }
      //   failure -> { ok: false, error: { code, message, details? } }" and
      "// Anything else -> generic 500 (SYSTEM_INTERNAL_ERROR). Never leak
      // `err.message` to the client (BR-15)."
    cost: >-
      The answer shape and the withheld-cause refusal of compliance-delete are written again in
      comments. The code holds both, in `return { ok: true, result }` and in the
      "Unexpected internal error." branch. The prose is a second home that no check follows when the
      contract moves.
    kind: restates
    correction: >-
      Remove the header comment and the BR-15 comment. The contract node holds both facts and the
      code already implements them.
    node: contracts/knowledge-base/compliance-audit
