    cost: >-
      The comment restates that a deletion requested for an already deleted raw information records nothing and ends in noop_already_deleted. The branch below it holds that. The prose repeats the rule under a back-spec id (BR-03) that a reader will not find among the nodes.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/deleted-source-deletion-records-nothing
