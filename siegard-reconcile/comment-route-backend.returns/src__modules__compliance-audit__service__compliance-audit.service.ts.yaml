findings:
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      lines 41-47, the exported constant REDACTED_LITERAL and its docstring
    evidence: >-
      export const REDACTED_LITERAL = "[REDACTED]" as const;   (docstring: "The literal `[REDACTED]` is hardcoded by spec (constraint #4 of TC-08 ... Exposed as a NAMED constant so the unit test can import and pin it.")
    cost: >-
      The literal that a compliance deletion writes over content and original input is declared a second time here, as a constant of its own. The write that holds it sits in `compliance-audit.repository.ts` as `SET content = '[REDACTED]'`, and nothing in this service reads the constant. It is only re-exported by `compliance-audit/index.ts`. If the node's literal changes, the repository, this constant and its pinning test can disagree, and nobody can tell which one was decided. This file is not bound to the redaction node, so `--check` does not reach it when that node moves. The docstring's "hardcoded by spec" cites a task constraint (TC-08), not a node.
    kind: contradicts
    correction: >-
      The literal should have one home, in the file that executes the redaction. This file's constant is a second declaration that no node claims. Its removal, or the repository reading it, is for the implementation route, and no comment can close it.
    node: rules/knowledge-base/compliance-deletion-redacts-content
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      lines 57-66 (docstring of complianceDelete) and lines 109-110 (comment before the orphan-tombstone branch)
    evidence: >-
      "Throws: - ResourceNotFoundError on UC-01 alt 4a (raw_information_id resolves to no row). - InternalFailure('legacy_orphan_tombstone') on UC-01 alt 4c (BR-17)." and "// UC-01 alt 4c — legacy orphan tombstone (BR-17). Operational alarm and 500."
    cost: >-
      The prose restates the contract's refusals for a missing raw information and for a deleted one with no deletion on record (HTTP 404 and 500). The code holds both, in the `ResourceNotFoundError` and `InternalFailure` throws. The prose is a second home for the fact, outside behavior, and it cites back-spec ids (UC-01, BR-17) rather than nodes.
    kind: restates
    correction: >-
      Remove the docstring's Throws list and the alt 4c comment. The throws in the code already hold the fact.
    node: contracts/knowledge-base/compliance-audit
