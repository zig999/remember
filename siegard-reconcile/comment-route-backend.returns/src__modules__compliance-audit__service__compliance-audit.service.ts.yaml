      // BR-06 / BR-07 cascade. RETURNING counts feed `affected.*` (BR-16).
    cost: >-
      The comment states that the affected counts come from the rows marked, which is the rule that the counts are what the deletion marked deleted. The code holds it: `const affected = { chunks, fragments, links, attributes };` takes the return of each tombstone call. The comment is prose under back-spec ids.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/compliance-deletion-counts-what-it-marked
