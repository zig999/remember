findings:
  - file: src/modules/query-retrieval/dto/fragment.dto.ts
    where: >-
      ListAcceptedFragmentsQuerySchema, the `limit` field, line 26
    evidence: >-
      limit: IntegerQuery.pipe(z.number().int().min(1).max(100))
    cost: >-
      The page-limit bound of 1 to 100 is enforced here, but the file is not bound to the node that states it.
      The index lists page-limit-bounds against other files and not against this one.
      If that node changes, `--check` never reaches this schema, and the bound here goes on silently
      disagreeing. The file's own offset and default rules are bound, so a reader would expect the limit
      bound to be bound too.
    kind: contradicts
    correction: >-
      Bind this file to rules/knowledge-base/page-limit-bounds, which holds the bound this schema
      implements. The code does not read the specification, so the bind is what closes this.
    node: rules/knowledge-base/page-limit-bounds
