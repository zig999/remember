  The comments on AuthErrorCode, AuthError, NeonAuth, buildJwksUrl, buildNeonAuth and mapJoseError, and the closing comment on the Fastify typing, are prose about the file's own code and not about any node's fact, so I left them out. The JWKS cooldown literal `30_000` and the `cacheMaxAge` from `NEON_AUTH_JWKS_TTL_S` are configuration of a library, not a domain fact, and belong to another judgment.
