findings:
  - file: src/middleware/auth.ts
    where: >-
      the header comment, lines 1-15, in particular lines 3-8
    evidence: >-
      // Implements BR-01 of knowledge-graph.back.md and the corresponding ingestion
      // requirement: every request that reaches a protected route must carry
      // `Authorization: Bearer <jwt>`. We verify the signature against Neon Auth's
      // JWKS, cache the JWKS in process for the configured TTL (default 10 min, per
      // knowledge-graph.back.md §1), and refuse to dispatch the route on any failure.
    cost: >-
      The comment restates, in prose no running system emits, what the constraint holds. That constraint is that every operation authenticates the owner by a signed, unexpired bearer token. It also cites a back-spec as the authority for the rule and for the 10-minute JWKS cache default. A reader may take the comment as a second home for the rule, and it will drift when the node moves. The code that holds the rule is in this file, in the `extractBearer` and `jwtVerify` calls.
    kind: restates
    correction: >-
      Remove the comment through the comment route, then run /reconcile over this file. The behavior is correct and the node already holds the fact.
    node: constraints/every-operation-requires-owner-authentication
  - file: src/middleware/auth.ts
    where: >-
      the docstring of extractBearer, lines 156-160
    evidence: >-
      * header is absent / malformed. Spec compliance: the scheme MUST be `Bearer`
      * (case-insensitive) and a single non-empty token MUST follow.
    cost: >-
      The docstring states the bearer-token requirement a second time as prose, and the regex `/^Bearer\s+(\S+)\s*$/i` already holds it. The prose can disagree with the node later without anything flagging it.
    kind: restates
    correction: >-
      Remove the docstring through the comment route, then run /reconcile over this file.
    node: constraints/every-operation-requires-owner-authentication
