      env.NODE_ENV === "development" && typeof env.LOCAL_OPERATOR_TOKEN === "string" && env.LOCAL_OPERATOR_TOKEN.length > 0 ? env.LOCAL_OPERATOR_TOKEN : null; if (localOperatorToken !== null && constantTimeEqual(token, localOperatorToken)) { request.user = { id: "local-operator", ... }; return; }; constantTimeEqual uses timingSafeEqual(ab, bb)
