findings:
  - file: src/modules/curation/dto/item.dto.ts
    where: >-
      line 13, the comment above ConfirmItemBodySchema
    evidence: >-
      /** confirm_item — reason optional. */
    cost: >-
      The comment says a second time that a confirmation's reason is optional, a fact the assertion-review node holds. The code already holds it at `reason: z.string().trim().min(1).optional().nullable()` in this file. If the node moves, the comment keeps saying the old thing and the bound check never reaches it.
    kind: restates
    correction: >-
      Remove the comment through the comment route. The fact stays in the assertion-review node and in the schema's `.optional()`.
    node: domain/knowledge-base/assertion-review
  - file: src/modules/curation/dto/item.dto.ts
    where: >-
      line 30, the `value` field of CorrectedValuesSchema
    evidence: >-
      value: z.string().min(1).optional().nullable(),
    cost: >-
      A corrected value of the empty string is refused here with a format error, and no node says so. The attribute-value-parses rule says a text-typed value accepts "any text". So the next reader will look in the specification for what an empty corrected value does, find no answer, and find the refusal only in this schema. The same `min(1)` bound is not stated by corrected-values, whose `value` attribute is a bare string.
    kind: unstated
    correction: >-
      Analysis should decide whether a correction's value must be non-empty, and give that decision a node. Candidate homes are corrected-values or attribute-value-parses. Otherwise the bound is a rule the code holds alone.
    node: domain/knowledge-base/corrected-values
