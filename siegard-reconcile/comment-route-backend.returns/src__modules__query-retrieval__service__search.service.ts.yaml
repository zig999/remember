  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      the scoring of an expanded link, lines 305-311. This is the traversal link scored from `sourceScore`.
    evidence: |-
      // The hop's source node id is one of the endpoints — pick whichever
                // is in our scoring map; fall back to the highest source score.
                const sourceScore =
                  nodeScoreById.get(link.source_node_id) ??
                  nodeScoreById.get(link.target_node_id) ??
                  0;
                const score = Math.pow(TRAVERSAL_DECAY, hop) * sourceScore;
    cost: >-
      The node says a link reached at hop h scores 0.5^h times the score of the matched node it was
      reached from. `nodeScoreById` holds only the matched node items. At depth 2 or 3 neither endpoint
      of a link is a matched node, so the lookup falls through to `0` and the link scores 0. The comment
      promises "fall back to the highest source score", and the code does not do that. Expanded links
      beyond hop 1 therefore sort to the bottom of the ranking with score 0, and the page the owner
      reads is ordered differently from what the node decided. A link whose two endpoints are both
      matched nodes takes the source end's score, whichever end it was reached from.
    kind: contradicts
    correction: >-
      Score each link from the matched node it was reached from, through the traversal, not from a
      lookup of its endpoints among the matched nodes.
    node: rules/knowledge-base/expansion-decay
