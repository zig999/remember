findings:
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      `DEFAULT_INGEST_MODEL` (line 35) and the `model` entry of `body` (line 103)
    evidence: >-
      export const DEFAULT_INGEST_MODEL = "claude-sonnet-4-6";
      ...
      model: input.model ?? deps.ingestModel ?? DEFAULT_INGEST_MODEL,
    cost: >-
      The node holds the default-model order: the configured ingestion model, otherwise
      claude-sonnet-4-6. This file implements that order and the literal, but the node is not
      bound to it. If the node moves, `--check` never reaches this file, and nobody can tell
      whether the literal here or the node was the decision.
    kind: contradicts
    correction: >-
      Bind rules/knowledge-base/default-extraction-model to this file. The declaration is
      where the fact is held. A bind closes it, and the code does not need to read the
      specification.
    node: rules/knowledge-base/default-extraction-model
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      the comment above the `noop_existing` branch, line 141
    evidence: >-
      // Step 2 — idempotent short-circuit: already ingested, do not re-extract.
    cost: >-
      The node holds that held content is not extracted again. This comment says it again in
      prose. The code already holds it at `if (outcome === "noop_existing")`, which returns
      `outcome: "already_ingested"` before `runExtraction` is reached. When the rule moves,
      the comment keeps the old account.
    kind: restates
    correction: >-
      Remove the comment. The fact stays held by the `noop_existing` branch in this file.
    node: rules/knowledge-base/document-ingestion-extracts-new-content
