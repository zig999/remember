read:
  - node: domain/knowledge-base/prompt-version
    held_at: >-
      the `PROMPT_VERSION` declaration (line 17), which names the v2 member of the
      enumeration and is the identifier of the instructions this file builds. The other
      members are not enumerated here; they sit in `./index.ts`.
    evidence: >-
      export const PROMPT_VERSION = "v2" as const;
  - node: rules/knowledge-base/extraction-dates-events
    held_at: >-
      `EVENT_DATING_DIRECTIVE` (lines 22-36), appended to the v1 system prompt by `system()`
      (lines 39-41)
    evidence: >-
      "- When you create an `Event` (meeting, go-live, workshop…), ALWAYS propose its",
      "  `event_date` when the document states the date of the occurrence (and",
      "  `end_date` when there is a distinct end). Justify it with `valid_from_basis`;",
      and return `${systemV1(catalog)}\n${EVENT_DATING_DIRECTIVE}`;
  - node: rules/knowledge-base/extraction-event-date-is-the-value
    held_at: >-
      the second bullet of `EVENT_DATING_DIRECTIVE` (lines 29-33)
    evidence: >-
      "- CRUCIAL distinction: `event_date` is the VALUE — the date the event happens.",
      "  `valid_from` is when that date started to hold / became known (typically the",
      "  document date).
  - node: rules/knowledge-base/extraction-never-invents-a-date
    held_at: >-
      the end of the first bullet of `EVENT_DATING_DIRECTIVE` (line 28)
    evidence: >-
      "  NEVER invent a date."
  - node: scenarios/knowledge-base/go-live-date-is-the-value
    held_at: >-
      the worked example inside the second bullet of `EVENT_DATING_DIRECTIVE` (lines 30-33)
    evidence: >-
      "  document date). E.g. a go-live on 2026-08-01 announced in minutes dated",
      "  2026-06-20 → `event_date`=\"2026-08-01\" (value), `valid_from`=\"2026-06-20\"",
      "  with `valid_from_basis`=\"document\"."
looked_past: >-
  The header comment (lines 1-5) and the `BR-26` docstring (line 38) are prose that no running system emits. The header restates how `llm_run.prompt_version`, the registry and `idempotency_key` (`hash.ts`, which hashes `prompt_version`) behave, and no node I found holds that. The docstring cites a back-spec rule rather than a node. Both belong to the comment route, not to this judgment. The rescheduling sentence in the directive is emitted text that agrees with `rules/knowledge-base/extraction-reschedule-is-succession`, so it is no finding.
