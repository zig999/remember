findings:
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      the POST_INGEST_BODY_LIMIT constant (line 82) and its use as the bodyLimit
      option of the POST /raw-information route (line 100)
    evidence: >-
      const POST_INGEST_BODY_LIMIT = 11 * 1024 * 1024;
      ...
      { bodyLimit: POST_INGEST_BODY_LIMIT },
      The node constraints/request-body-ceiling states: "The system refuses a
      request body larger than 11 MiB before any operation answers it."
      backend/src/app.ts line 92 declares the same figure again:
      const BODY_LIMIT_BYTES = 11 * 1024 * 1024;
    cost: >-
      The 11 MiB ceiling is a system-wide fact held by a node, and it is declared
      a second time in this route file, next to the declaration in app.ts. If the
      node's figure changes, nothing ties this per-route override to it. The
      route would keep applying the old limit while app.ts or the node moved. The
      next reader could not tell which of the two figures was decided. This file
      is not bound to constraints/request-body-ceiling, so `--check` would not
      reach it when the node moves.
    kind: contradicts
    correction: >-
      The figure should have one home in code. Either this route drops its own
      limit and inherits the one in app.ts, or the constant is read from a single
      shared declaration that the node's bind claims. Code cannot read the
      specification. What closes the gap is binding the file that holds the
      figure to constraints/request-body-ceiling.
    node: constraints/request-body-ceiling
