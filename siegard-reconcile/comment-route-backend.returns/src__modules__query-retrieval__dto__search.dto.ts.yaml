findings:
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: >-
      the doc comment above LayersArray, lines 20-25
    evidence: >-
      non-enum elements raise
       * a ZodError that the service translates to BUSINESS_INVALID_SEARCH_LAYER.
    cost: >-
      The comment states, outside any behavior, that a layer outside the closed set is refused. The node holds that
      refusal, and code holds it too, in resolveLayers in search.service.ts (the check against ALLOWED_LAYERS).
      The next reader finds a second statement of the rule beside a schema that does not enforce it, and the
      comment does not move when the node does.
    kind: restates
    correction: >-
      Remove the comment. The refusal is held by code in
      src/modules/query-retrieval/service/search.service.ts and by the node.
    node: rules/knowledge-base/search-layer-outside-set-refused
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: >-
      the doc comment above QueryString, lines 37-42
    evidence: >-
      Empty-after-btrim raises a Zod custom issue with message
       * `BUSINESS_INVALID_SEARCH_QUERY` so the route can branch on it
    cost: >-
      The comment restates the not-blank rule, which this file's .transform((s) => s.trim()).refine((s) => s.length > 0, ...)
      already enforces. It also claims an error code that the code beside it does not emit. The refine message is
      "query is empty after trim". A reader trusting the comment looks for a code the schema never produces.
    kind: restates
    correction: >-
      Remove the comment. The rule is held by the refine in this file and by the node.
    node: rules/knowledge-base/search-query-not-blank
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: >-
      QueryString, the .max(1000) call, line 46
    evidence: >-
      .max(1000, { message: "query exceeds 1000 characters" })
    cost: >-
      The 1000-character ceiling on a search query's text is a fact a node holds, in a node the file is not bound
      to. Code states it here as its own authority. When the node's number moves, `--check` never reaches this
      file, and nobody knows which value was decided.
    kind: contradicts
    correction: >-
      Bind rules/knowledge-base/search-query-length to this file. Code does not read the specification, so the
      bind is what closes the declaration, not a change to the code.
    node: rules/knowledge-base/search-query-length
