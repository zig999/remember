findings:
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      the prefer_one branch of resolveDisputeService, the guard on winnerId (lines 115-121)
    evidence: >-
      throw new BusinessError(
          "BUSINESS_DISPUTE_WINNER_REQUIRED",
          "decision=prefer_one requires winner_id"
        );
    cost: >-
      The curation contract (contracts/knowledge-base/curation.md) fixes the message for this refusal as
      "decision=prefer_one requires winner_id (member of item_ids)". This message omits the parenthetical.
      The two diverge wherever the service is reached without the DTO's superRefine, so a reader who
      trusts the contract gets different text from what the system emits.
    kind: contradicts
    correction: >-
      The emitted message has to match the wording the contract fixes for BUSINESS_DISPUTE_WINNER_REQUIRED.
    node: rules/knowledge-base/prefer-one-requires-winner
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      the adjust_periods branch of resolveDisputeService, the guard on periods (lines 198-204)
    evidence: >-
      throw new BusinessError(
          "BUSINESS_DISPUTE_PERIODS_REQUIRED",
          "decision=adjust_periods requires periods[]"
        );
    cost: >-
      The contract fixes the message as "decision=adjust_periods requires periods[] (one entry per item_id)".
      This one drops the "one entry per item_id" part, which is the rule the refusal states. The text a
      caller sees therefore differs from the contract. The service also checks only that periods is
      non-empty, not that there is one per item.
    kind: contradicts
    correction: >-
      The emitted message has to match the contract's wording for BUSINESS_DISPUTE_PERIODS_REQUIRED.
    node: rules/knowledge-base/adjust-periods-one-per-item
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      assertSameScope, lines 281-315 (links branch, lines 287-301)
    evidence: >-
      r.source_node_id !== first.source_node_id ||
              r.target_node_id !== first.target_node_id ||
              r.link_type_id !== first.link_type_id
    cost: >-
      rules/knowledge-base/dispute-scope says links share a scope when they come from one source node of
      one link type that does not allow multiple current links, whatever their target. They also share
      one when they come from one source node of one link type to one target node. The code accepts only
      the second form. A dispute between links of a functional link type that point at different targets
      is refused with BUSINESS_ITEM_NOT_DISPUTED and scope_mismatch: true. The specification calls that
      dispute one scope and resolvable.
    kind: contradicts
    correction: >-
      The links scope check has to accept same source and same link type where the link type does not allow
      multiple current links. It then has to require the same target only where multiple current links
      are allowed.
    node: rules/knowledge-base/dispute-resolution-single-scope
