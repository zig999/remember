  - node: rules/knowledge-base/prefer-one-requires-winner
    held_at: >-
      the winner check inside the prefer_one branch, lines 59-69
    evidence: >-
      if (value.winner_id === undefined || value.winner_id === null || !value.item_ids.includes(value.winner_id)) {
        ctx.addIssue({ code: "custom", path: ["winner_id"], message: "BUSINESS_DISPUTE_WINNER_REQUIRED" });
  - node: rules/knowledge-base/unused-resolution-fields-ignored
    held_at: >-
      nowhere
    evidence: >-
      The superRefine gates its winner and periods checks on `value.decision === "prefer_one"` and `value.decision === "adjust_periods"`. winner_id and periods are still format-validated for every decision by `winner_id: UuidSchema.optional().nullable()` and `periods: z.array(AdjustedPeriodSchema).optional().nullable()`, so an unused malformed field is refused, not ignored (see the finding). The only statement that unused fields are ignored is the docstring.
  - node: rules/knowledge-base/validity-start-before-end
    held_at: >-
      the per-period comparison in the adjust_periods branch, lines 109-120
    evidence: >-
      p.valid_from !== null && p.valid_to !== null && p.valid_to !== undefined && p.valid_from >= p.valid_to
      The code adds an issue with message "BUSINESS_TEMPORAL_INCOHERENT" when both dates are stated and the start is not strictly before the end.
