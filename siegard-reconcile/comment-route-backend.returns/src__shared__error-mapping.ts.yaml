findings:
  - file: src/shared/error-mapping.ts
    where: >-
      codeToHttpStatus, the Resource group, line 85
    evidence: >-
      RESOURCE_ALREADY_EXISTS: 409,
    cost: >-
      The registry gives the code RESOURCE_ALREADY_EXISTS a 409 status. No node in the specification
      names that code or its status, and no source under backend/src emits it. The only other
      mention is the unit test that asserts the 409. The next reader who wants the refusal
      vocabulary reads the contracts and does not find this code. This file is the only place it
      is stated, so it reads as a business decision.
    kind: unstated
    correction: >-
      Either a node gives RESOURCE_ALREADY_EXISTS a refusal that answers it, or the entry leaves
      the registry. The analysis decides which. The source cannot settle it.
  - file: src/shared/error-mapping.ts
    where: >-
      codeToHttpStatus, the Business Chat group, line 128
    evidence: >-
      BUSINESS_CHAT_INGEST_DISABLED: 503,
    cost: >-
      The registry fixes a 503 for BUSINESS_CHAT_INGEST_DISABLED. The specification holds no
      refusal under that code. The contracts/chat/conversations refusals list BUSINESS_CHAT_DISABLED
      and BUSINESS_CHAT_PROVIDER_UNAVAILABLE but not this one. constraints/chat-toolset speaks
      only of directed ingestion being available "only where chat ingestion is enabled". No source
      under backend/src emits the code, and only the unit test asserts it. The status of a refusal
      the specification never stated is written only here, where the next reader will not look for it.
    kind: unstated
    correction: >-
      A chat node would have to state the refusal with its code and status, or the entry would
      leave the registry. The analysis decides which.
