findings:
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      the node_type_id guard after the attribute_key lookup, lines 71-80
    evidence: >-
      if (resolvedKey.node_type_id !== nodeTypeId) {
        throw new ValidationFailure(
          "VALIDATION_INVALID_FORMAT",
          "attribute_key.node_type_id does not match the node's node_type_id.",
    cost: >-
      The same refusal, an attribute key not held for the node's type, is implemented a second time. It answers VALIDATION_INVALID_FORMAT with its own message. The contract answers it with BUSINESS_UNKNOWN_ATTRIBUTE_KEY naming the key. The branch is unreachable while the catalog lookup is scoped by (node_type_id, key), so it only matters if that scoping is ever relaxed. From then on the wire would carry a code and wording the specification does not state for this refusal.
    kind: contradicts
    correction: >-
      Remove the guard, so the refusal stays with the scoped lookup and assertKnownType that already answer it. Alternatively, make the guard raise the same BUSINESS_UNKNOWN_ATTRIBUTE_KEY refusal the contract names.
    node: rules/knowledge-base/attribute-key-for-node-type
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      the header comment lines 9-11, and the comment above the guard at lines 71-73
    evidence: >-
      the attribute_key catalog itself
        //     scopes the `node_type` (UNIQUE(node_type_id, key)). The "graph rules"
        //     layer for attributes is "key.node_type_id == node.node_type_id".
      and "Cross-table check: key.node_type_id matches node.node_type_id. The
        // catalog lookup already enforces this"
    cost: >-
      Prose states a second time that an attribute key must be one the catalog holds for the node's type. The lookup keyed by attributeKeyCacheKey(nodeTypeId!, args.key) already holds that fact in this file. The prose is a second home that the specification's change would not reach.
    kind: restates
    correction: >-
      Remove the two comments. The comment route applies, followed by /reconcile over the file.
    node: rules/knowledge-base/attribute-key-for-node-type
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      the layer-heading comments at lines 52, 118-120, 122, 146 and 157
    evidence: >-
      // ---- Layer 1: Structural ----
      // ---- Layer 2: Graph rules (attributes have none beyond catalog scope) ----
      // ---- Layer 3: Temporal ----
      // ---- Layer 4: Confidence ----
      // ---- Layer 5: Anti-hallucination ----
    cost: >-
      The comments restate the order in which an attribute proposal is checked, and the statements below them already carry that order. The wording "attributes have none beyond catalog scope" is a second statement of a fact about which checks apply. If the node's order changes, the prose keeps the old order and nothing flags it.
    kind: restates
    correction: >-
      Remove the layer-heading comments. The comment route applies, followed by /reconcile over the file.
    node: rules/knowledge-base/attribute-proposal-check-order
