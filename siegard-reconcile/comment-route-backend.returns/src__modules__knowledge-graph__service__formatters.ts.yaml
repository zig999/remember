findings:
  - file: src/modules/knowledge-graph/service/formatters.ts
    where: >-
      the SOURCE_TYPE set (lines 43-51), used by toSourceType() at line 92 and by toProvenanceEntry()
    evidence: >-
      const SOURCE_TYPE: ReadonlySet<SourceType> = new Set([ "pdf", "email", "ata", "chat", "artigo", "transcricao", "outro", ]);
    cost: >-
      The source-type vocabulary is declared again as a runtime set in a file that the source-type node is not bound to. If the node's values change, trace --check never reaches this file. toSourceType() would then throw InvariantError("Unexpected source_type from DB: ...") on a value the specification now allows, or keep accepting one it has dropped. It is also unclear which declaration was the decision. The node names `meeting-minutes`, `article`, `transcript` and `other` as canonical values and lists `ata`, `artigo`, `transcricao` and `outro` only as the material's own words for them. The set here holds the material's spellings.
    kind: contradicts
    correction: >-
      Either bind domain/knowledge-base/source-type to this file, so that the declaration is held where the node claims it, or stop restating the vocabulary here and take the validation from the file that declares SourceType (dto/enums.dto.ts). The vocabulary should keep one home that the specification can reach.
    node: domain/knowledge-base/source-type
