findings:
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      the comment above the INSERT try/catch in ingestRawInformation (lines 101-104)
    evidence: >-
      // Attempt the INSERT; catch UNIQUE violation on content_hash and switch to
      // the no-op path. Any other 23505 (e.g. on idempotency_key alone, which
      // would mean a state inconsistency since content_hash is the primary anchor)
      // is logged and re-raised as 500 by the global error handler.
    cost: >-
      The comment restates that content hashes are unique and that a duplicate takes the no-op path. The
      catch branch beneath it, `if (isUniqueViolation(err, RAW_INFORMATION_CONTENT_HASH_CONSTRAINT)) { return await noopExisting(...) }`,
      holds that behavior already. A second statement of the fact in prose would not follow the node if the
      node moved.
    kind: restates
    correction: >-
      Remove the comment. The branch below it holds the fact, and the node binds the file.
    node: rules/knowledge-base/content-hash-unique
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      the comment inside the insertLlmRun catch block (lines 153-157)
    evidence: >-
      // Possible only if a concurrent caller raced us with the same
      // (content_hash, model, prompt_version) tuple and inserted the run
      // between our `insertRawInformation` and `insertLlmRun` — extremely
      // unlikely because we hold the row lock from the first INSERT in the
      // same transaction. Surface as 500 (the global handler maps it).
    cost: >-
      The comment explains when an idempotency-key collision can occur, which is a second statement of
      "no two LLM runs hold the same idempotency key". The code holds the fact too, in
      `if (isUniqueViolation(err, LLM_RUN_IDEMPOTENCY_KEY_CONSTRAINT)) { throw new InvariantError(...) }`. Prose
      about which tuple forms the key would not follow the node if the key's composition changed.
    kind: restates
    correction: >-
      Remove the comment. The collision branch holds the fact, and the node binds the file.
    node: rules/knowledge-base/idempotency-key-unique
