    where: >-
      CurationActionNameSchema, lines 5-13
    evidence: >-
      export const CurationActionNameSchema = z.enum([ "resolve_entity_match", "merge_nodes", "resolve_dispute", "confirm_item", "reject_item", "correct_item", "compliance_delete", ]);
    cost: >-
      The seven curation action kinds are declared here as a second vocabulary, and the node is not bound to this file. If the node gains or drops a kind, `--check` never reaches this file, and nobody can tell which list was decided.
    kind: contradicts
    correction: >-
      The node's values are the same seven kinds (hyphenated in the node, snake_case here). Code does not read the specification, so the bind that claims this declaration closes the finding. Bind domain/knowledge-base/curation-action-kind to this file.
