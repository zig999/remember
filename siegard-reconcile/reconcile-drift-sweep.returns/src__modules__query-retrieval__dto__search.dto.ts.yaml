read:
  - node: domain/knowledge-base/search-layer
    held_at: >-
      the ALLOWED_LAYERS declaration and the SearchLayer type derived from it, lines 96-97
    evidence: >-
      export const ALLOWED_LAYERS = ["fragment", "node", "chunk"] as const;
      export type SearchLayer = (typeof ALLOWED_LAYERS)[number];
looked_past: >-
  The header comment names the code VALIDATION_OUT_OF_RANGE, which the retrieval contract does not list for search, and the other limits and defaults in this file (query at most 1000 characters, limit 1 to 100 with a default of 20, expand_depth 1 to 3) belong to nodes outside this pack, so I judged none of them here.
