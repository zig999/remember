read:
  - node: rules/knowledge-base/attribute-value-parses
    held_at: >-
      the try block in correctItemService that calls parseAttributeValue with the corrected value and the
      attribute key's value_type, and maps a validation failure to BUSINESS_INVALID_ATTRIBUTE_VALUE.
      The formats themselves (date, number, bool, text) are not declared in this file. The parser sits in
      ../../ingestion/validation/structural.js, which this file imports.
    evidence: >-
      parseAttributeValue({ value: body.corrected.value, value_type: attrKey.value_type, });
      ... throw new BusinessError("BUSINESS_INVALID_ATTRIBUTE_VALUE", "corrected.value does not parse against
      attribute_key.value_type", { value_type: attrKey.value_type, value: body.corrected.value });
      The curation contract's refusal for this rule reads "error code BUSINESS_INVALID_ATTRIBUTE_VALUE naming
      the value type and the value, HTTP 422 over REST", which matches the code and the details it carries.
looked_past: >-
  The file's comments ("// UC-08 ... UC-10", the ItemServiceDeps docstring on the catalog, "// 1. Supersede
  predecessor — `valid_to` UNCHANGED (BR-18).") are prose that no code emits. They are another judgment's
  and belong to the comment route, since the behavior they describe is held by code and by nodes already.
