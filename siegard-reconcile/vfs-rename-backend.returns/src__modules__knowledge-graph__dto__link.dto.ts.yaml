read:
  - node: domain/knowledge-base/knowledge-link
    held_at: >-
      The `LinkDetailResponseSchema` z.object declaration (lines 14-33). It is the file's declaration of the link's read shape, and it carries the node's attributes and relationships in part.
    evidence: |-
      export const LinkDetailResponseSchema = z.object({
        id: z.string().uuid(),
        source_node_id: z.string().uuid(),
        target_node_id: z.string().uuid(),
        link_type: z.string(),
        valid_from: z.string().regex(/^\d{4}-\d{2}-\d{2}$/).nullable().optional(),
        valid_to: z.string().regex(/^\d{4}-\d{2}-\d{2}$/).nullable().optional(),
        recorded_at: z.string().datetime({ offset: true }),
        superseded_at: z.string().datetime({ offset: true }).nullable().optional(),
        status: AssertionStatusSchema,
        confidence: z.number().min(0).max(1),
        valid_from_source: ValidFromSourceSchema.nullable().optional(),
        supersedes_link_id: z.string().uuid().nullable().optional(),
        provenance: z.array(ProvenanceEntryResponseSchema),
      });
looked_past: >-
  The two-line header comment ("Mirrors `openapi.yaml` components.schemas.LinkDetail") is prose that states no domain fact, and the derived read fields (effective_status, is_current, is_in_effect, flags, link_inverse_name) and the 0..1 confidence bound belong to other nodes and to the retrieval contract (rules/knowledge-base/link-confidence-range, contracts/knowledge-base/retrieval), which this pass does not review.
