read:
  - node: domain/knowledge-base/node-attribute
    held_at: >-
      AttributeDetailResponseSchema (lines 15-34), the zod object that declares the shape of a node attribute as read. It carries every attribute the node declares: value, status, recorded_at, provenance, valid_from, valid_to, valid_from_source, confidence and superseded_at. It also carries the references to the node, the attribute key and the superseded attribute.
    evidence: |-
      value: z.string(),
      valid_from: z.string().regex(/^\d{4}-\d{2}-\d{2}$/).nullable().optional(),
      valid_to: z.string().regex(/^\d{4}-\d{2}-\d{2}$/).nullable().optional(),
      recorded_at: z.string().datetime({ offset: true }),
      superseded_at: z.string().datetime({ offset: true }).nullable().optional(),
      status: AssertionStatusSchema,
      confidence: z.number().min(0).max(1),
      valid_from_source: ValidFromSourceSchema.nullable().optional(),
      supersedes_attribute_id: z.string().uuid().nullable().optional(),
      provenance: z.array(ProvenanceEntryResponseSchema),
looked_past: >-
  The header comment "Mirrors `openapi.yaml` components.schemas.AttributeDetail." states no domain fact, so it is prose for the comment route. The extra read-side fields (value_type, effective_status, is_current, is_in_effect, flags) and the confidence range 0 to 1 are held by nodes outside this set (the retrieval contract and rules/knowledge-base/attribute-confidence-range), and I did not review those nodes.
