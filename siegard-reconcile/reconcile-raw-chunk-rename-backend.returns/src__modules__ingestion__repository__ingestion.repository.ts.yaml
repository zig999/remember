looked_past: >-
  Only comments state the following, so no finding is filed: the rule that `original_input` never takes part in `content_hash`, the `llm_run` defaults `status = 'running'` and `attempts = 1`, and the compliance-deletion coverage. Separately, `LlmRunRow` declares the `llm-run` shape and the `run-status` literals ("running" | "completed" | "failed") in a file whose binding to those nodes is outside this node set, so I left them to a pass that reviews those nodes.
