findings:
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of RecentIngestionRow, lines 38-44
    evidence: >-
      `content_preview` is the first 80 code points of the
      raw text — enough for an operator to recognise a document after a client
      timeout without shipping the whole content back.
    cost: >-
      The 80-character preview is held in the code as `left(ri.content, 80) AS content_preview` in
      this file's findRecentIngestions. The docstring says it a second time, and it also says
      "code points" where the contract says "characters". When the contract moves, this prose is
      not rebound with it and keeps stating the old value.
    kind: restates
    correction: >-
      Remove the sentence from the docstring. The fact stays with the contract and with the
      `left(ri.content, 80)` call.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of findRecentIngestions, lines 59-63
    evidence: >-
      `limit` is validated (1..50) at the toolset
      boundary before it reaches here.
    cost: >-
      The 1..50 bound is enforced by code in another file, `.min(1).max(50).default(10)` in
      src/modules/ingestion/mcp/mcp-schemas.ts. Stated here as prose, it is a third copy of the
      bound. A reader of this repository file takes the comment for the place the bound lives, and
      it is not.
    kind: restates
    correction: >-
      Remove the sentence. The bound is held by the rule and enforced in mcp-schemas.ts.
    node: rules/knowledge-base/recent-ingestions-limit-bounds
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of aggregateToolCallOutcomes, lines 111-118
    evidence: >-
      `orphaned_fragments`, the count of this run's `proposed` fragments with
      no provenance row (uncited → unsearchable; recall-gap signal). Defined
      identically to the retry orphan-cleanup in `retryLlmRunRow` (BR-10).
    cost: >-
      The definition of an orphaned fragment and the summary's count of them are both held by the
      SQL in this same function (`AND status = 'proposed'` and `NOT IN (SELECT fragment_id FROM
      provenance ...)`). The docstring restates them and adds a rationale ("unsearchable;
      recall-gap signal") that no node states.
    kind: restates
    correction: >-
      Remove the prose. The fact remains in the nodes and in the query.
    node: rules/knowledge-base/summary-counts-orphaned-fragments
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of retryLlmRunRow, lines 165-171, and the comment at lines 188-189
    evidence: >-
      In the same transaction, orphan `proposed` fragments of this run are
      flipped to `rejected`.
    cost: >-
      The rejection of a run's orphaned fragments on retry is held by the second `UPDATE
      information_fragment SET status = 'rejected'` in this function. The docstring and the inline
      comment say it again, citing BR-10 and BR-11, so a reader looks for the rule in the code's
      citations rather than in the nodes.
    kind: restates
    correction: >-
      Remove the docstring and the inline comment. The rule stays with the node and the UPDATE.
    node: rules/knowledge-base/retry-rejects-orphaned-fragments
read:
  - node: domain/knowledge-base/raw-chunk
    held_at: nowhere
    evidence: >-
      The file never declares the shape of a raw chunk. It reads two columns of `raw_chunk` in
      queries: `JOIN raw_chunk rc       ON rc.id = fs.raw_chunk_id ... AND rc.raw_information_id = $2`
      and `FROM raw_chunk WHERE id = ANY($1::uuid[]) AND raw_information_id = $2`. It never
      declares chunk_index, offset_start, offset_end, text, locator, superseded_at,
      chunking_version or status.
  - node: domain/knowledge-base/raw-information
    held_at: nowhere
    evidence: >-
      The file never declares the shape of a raw information. `RecentIngestionRow` is a read
      projection (`readonly source_type: string; readonly raw_status: string; readonly received_at: Date;
      readonly content_preview: string;`) that passes along some of its values. The
      `SELECT ri.id AS raw_information_id, ri.source_type ... left(ri.content, 80) AS content_preview`
      query only reads them.
looked_past: >-
  The orphaned-fragment SQL predicate is written twice in this file (aggregateToolCallOutcomes and
  retryLlmRunRow), and many comments cite BR-numbers or restate rules held by other nodes. The
  duplication is a code-review matter, and the remaining comments are the comment route's to
  remove.
