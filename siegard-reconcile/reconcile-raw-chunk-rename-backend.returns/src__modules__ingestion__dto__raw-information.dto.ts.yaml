findings:
  - file: src/modules/ingestion/dto/raw-information.dto.ts
    where: >-
      line 11, the doc comment above ChunkLocatorSchema
    evidence: >-
      /** Optional readable anchor (page/line/speaker/ts) — shape per A23. */
    cost: >-
      The comment lists the locator's keys and cites "A23", a reference into the old v6/v7 document, as the authority for the shape. A reader who follows it lands in a document the specification has superseded, not in the node. The keys are already declared by the schema below it, so the comment is a second home for a fact that the code and the node both hold.
    kind: restates
    correction: >-
      Remove the comment. The fact stays held by ChunkLocatorSchema in this file, and the node domain/knowledge-base/chunk-locator holds the same shape.
    node: domain/knowledge-base/chunk-locator
