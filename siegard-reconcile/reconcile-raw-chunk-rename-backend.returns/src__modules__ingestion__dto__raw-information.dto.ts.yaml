  - node: domain/knowledge-base/raw-information
    held_at: >-
      RawInformationResponseSchema, lines 23-31.
    evidence: >-
      source_type: SourceTypeSchema, content: z.string(), storage_ref: z.string().nullable(), content_hash: z.string().regex(/^[0-9a-f]{64}$/), received_at: z.string().datetime({ offset: true }), metadata: z.record(z.string(), z.unknown())
looked_past: >-
  The content_hash regex /^[0-9a-f]{64}$/ and the nonnegative and positive bounds on chunk_index and the offsets apply rules held by nodes outside this set (rules/knowledge-base/content-hash-is-sha256, chunk-index-follows-content and chunk-offsets-ordered), and they agree with those nodes, so I filed nothing for them; the other comments only describe routes and the repository layer.
