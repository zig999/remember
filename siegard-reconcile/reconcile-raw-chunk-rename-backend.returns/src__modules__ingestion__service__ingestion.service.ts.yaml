  The emitted not-found message `${entity} ${entityId} not found.` (for example "raw_information X not found.") is worded differently from the "RawInformation <id> not found." that a compliance node states. I did not check whether the route layer replaces it, because that file is outside the set. The comment citing `BR-02` ("enforced by the absence of code") and the case where Postgres aborts the transaction after the caught unique violation are not conformance matters for these nodes.

