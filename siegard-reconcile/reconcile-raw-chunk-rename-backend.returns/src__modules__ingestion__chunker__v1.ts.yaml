  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      `SPEAKER_LINE_REGEX`, line 351
    evidence: >-
      const SPEAKER_LINE_REGEX = /^\s*(?:[[(]\d{1,2}:\d{2}(?::\d{2})?[\])][\s\t]+)?[A-Za-zÀ-ÿ0-9_]+(?:\s[A-Za-zÀ-ÿ0-9_]+)?:\s/;
    cost: >-
      The node lists exactly four time stamp forms: "[h:mm], [hh:mm], (hh:mm) or (hh:mm:ss)". The regex accepts any bracket pair with a one- or two-digit hour and an optional seconds part. That admits forms such as `(h:mm)`, `[hh:mm:ss]` and the mixed `[12:00)`, so a line the node says is not a speaker line opens a new block. The regex's letter class `A-Za-zÀ-ÿ` is also narrower than the node's "letters". It excludes letters outside Latin-1 and includes `×` and `÷`. Block edges, and so chunk edges and offsets, then differ from what the specification decided.
    kind: contradicts
    correction: >-
      The time stamp alternatives and the letter class would have to match the node: exactly [h:mm], [hh:mm], (hh:mm) and (hh:mm:ss).
    node: rules/knowledge-base/speaker-line
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      `scanLines` (line 298) and the blank-line test in `splitEmail` (line 229)
    evidence: >-
      if (codePoints[i] === "\n") {
      ...
      const isBlank = line.endExclusive === line.start;
    cost: >-
      The code decides that a line ends only at `\n` and that a blank line is a zero-length one. A CRLF email leaves `\r` in every line, so its header/body separator is never recognised. A whitespace-only line is not blank either. The nodes for the email header block and the speaker line say "blank line" and "line" and never define either. This choice therefore lives only in the code, where a reader of the specification will not look for it.
    kind: unstated
    correction: >-
      A node would have to state what ends a line and what makes a line blank. The natural home is `rules/knowledge-base/email-header-block`, with the line definition shared by `turn-blocks` and `email-quote-blocks`.
    node: rules/knowledge-base/email-header-block
