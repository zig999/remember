findings:
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      the fragment and node item construction in searchKnowledgeService, lines 184 and 220
    evidence: >-
      `layer: "fragment",
        id: f.id,
        score: f.score,
        hop: 0,` and, for the node item, `layer: "node",
        id: n.node_id,
        score: n.score,
        hop: 0,`
    cost: >-
      A matched fragment or node is reported at hop 0 while a link beside it is at hop 1. This value is visible on every search item, and no node says it. The search-item node lists `hop` as an integer attribute without saying what an item that expansion did not reach carries. The expansion-hop node only sets the hop of an expanded link. A reader looking for what a matched item's hop is will find nothing in the specification, and the next reader will take the code's 0 as the decision.
    kind: unstated
    correction: >-
      The analysis would give the hop of an item the search matched directly, as opposed to one reached by expansion, a node. The natural place is domain/knowledge-base/search-item or a rule beside rules/knowledge-base/expansion-hop.
    node: domain/knowledge-base/search-item
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      the node-hit loop in searchKnowledgeService, line 207
    evidence: >-
      `if (provenance.length === 0) continue;`
    cost: >-
      A knowledge node whose alias matched the query is silently dropped from the results when it has no provenance. The specification has this refusal only for expanded links (rules/knowledge-base/expansion-link-without-provenance, the statement "A knowledge link expansion reaches surfaces as a search item only when it holds provenance"). The search-item node says only that an item has 1..* provenance fragments. A matched node can vanish from search and from the total, and no node says that this happens or why.
    kind: unstated
    correction: >-
      The analysis would decide whether a matched node with no provenance is omitted from search, and state it in a node. Candidate home: domain/knowledge-base/search-item or a new rule beside the link-expansion provenance rule.
    node: domain/knowledge-base/search-item
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      toExpandedLinkItem, the returned item, line 390
    evidence: >-
      `key: `link:${link.id}`,
        kind: "link",
        layer: "node",`
    cost: >-
      Every expanded link is reported with layer `node`, although the search-layer enumeration names the layers a search reads and a link is not read from the node layer. A client that groups or filters results by layer gets links mixed into the node layer, and no node says that is intended.
    kind: unstated
    correction: >-
      The analysis would decide what layer, if any, a link search item carries, and state it in domain/knowledge-base/search-item or domain/knowledge-base/search-layer.
    node: domain/knowledge-base/search-item
