findings:
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      parseAttributeValue, the number branch's finiteness refusal (lines 51-57) and the bool branch (lines 60-69)
    evidence: >-
      throw new ValidationFailure("VALIDATION_INVALID_FORMAT", "value is not a finite number.", { value: v });
      and throw new ValidationFailure("VALIDATION_INVALID_FORMAT", "value does not parse as a bool (expected 'true' or 'false').", { value: v });
      The date branches and the number-shape branch carry { value: v, value_type: args.value_type }.
      The contract's propose-attribute refusal for rules/knowledge-base/attribute-value-parses reads: "error code VALIDATION_INVALID_FORMAT naming the value and its value type, HTTP 200 carrying `{ ok: false, error }` over REST".
    cost: >-
      The refusal for an attribute value that does not read as its key's value type names the value type in four of its six branches. A bool value refused, or a number refused as non-finite, comes back naming only the value. A caller or curator reading the details cannot rely on the value type being there, although the contract promises it. The next reader trusts the contract and does not find the gap.
    kind: contradicts
    correction: >-
      Carry value_type in the details of the finiteness refusal and of the bool refusal, as the other branches of the same refusal do.
    node: contracts/knowledge-base/ingestion
