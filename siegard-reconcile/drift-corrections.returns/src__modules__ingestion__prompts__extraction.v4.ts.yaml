read:
  - node: rules/knowledge-base/extraction-relative-date-falls-back-to-reception
    held_at: >-
      the string array RECEIVED_AT_ANCHOR_DIRECTIVE (lines 15-31), appended to the v3 system prompt by system() at line 34. It is text sent to the model.
    evidence: >-
      "  deictics), resolve it AGAINST `document_date` if it is present (basis", "  `\"document\"`). If `document_date` is `(unknown)`, fall back to the date", "  portion of `received_at` (the `YYYY-MM-DD` prefix of the ISO-8601 string)." and "return `${systemV3(catalog)}\n${RECEIVED_AT_ANCHOR_DIRECTIVE}`;". The prompt asks for resolution against the document date when the source has one and otherwise against the date of reception, and the file declares `PROMPT_VERSION = "v4"`. It agrees with the node.
  - node: rules/knowledge-base/attribute-value-parses
    held_at: nowhere
    evidence: >-
      The file only exports the prompt directive and re-exports `MAX_TOKENS` and `user`. It declares no value-type parsing or validation. The one date-shaped text, "the `YYYY-MM-DD` prefix of the ISO-8601 string", describes the `received_at` anchor and is not a rule about attribute values.
  - node: scenarios/knowledge-base/impossible-calendar-date-refused
    held_at: nowhere
    evidence: >-
      No proposal refusal, calendar-day check or attribute-proposal handling exists in this file. It builds a system prompt string from `systemV3(catalog)` and RECEIVED_AT_ANCHOR_DIRECTIVE.
  - node: contracts/knowledge-base/ingestion
    held_at: nowhere
    evidence: >-
      The file declares no operation, answer or refusal of the ingestion surface. It exports `PROMPT_VERSION`, `system`, `RECEIVED_AT_ANCHOR_DIRECTIVE` and re-exports `MAX_TOKENS`, `user` and two types.
  - node: domain/knowledge-base/proposal
    held_at: nowhere
    evidence: >-
      The file declares no proposal shape (kind, confidence, change_hint, valid_from, valid_to, valid_from_basis). It only references `UserPromptArgs` and `DocumentMetadata` through `export type { DocumentMetadata, UserPromptArgs };`.
  - node: domain/knowledge-base/attribute-key
    held_at: nowhere
    evidence: >-
      No attribute-key shape is declared. `CatalogSnapshot` is imported as a type from "../catalog/catalog.js" and passed through to `systemV3(catalog)`.
  - node: domain/knowledge-base/value-type
    held_at: nowhere
    evidence: >-
      No enumeration of date, number, text or bool is declared or used in this file.
  - node: rules/knowledge-base/expansion-decay
    held_at: nowhere
    evidence: >-
      The file has no search scoring or hop decay. Its only logic is `return `${systemV3(catalog)}\n${RECEIVED_AT_ANCHOR_DIRECTIVE}`;`.
  - node: rules/knowledge-base/expansion-hop
    held_at: nowhere
    evidence: >-
      The file has no search expansion or hop counting.
  - node: domain/knowledge-base/search-item
    held_at: nowhere
    evidence: >-
      The file declares no search-item shape (kind, layer, score, hop, summary, flags).
  - node: rules/knowledge-base/caller-never-states-received
    held_at: nowhere
    evidence: >-
      The file enforces no refusal of a proposal that states the basis received. The prompt names only the bases "document" and "stated": "(basis `\"document\"`)" and "Absolute dates stated in the chunk text remain `\"stated\"`". It never tells the model to state `received` as a basis. That is an absence in emitted text, not a held rule.
looked_past: >-
  The prompt's illustrative list of pt-BR deictics ("hoje", "ontem", "amanhã", "semana que vem", "esta semana") and its remark that this "supersedes v3's rule" are prompt content, so I filed no finding. Whether the vocabulary belongs in a node is a different judgment from conformance to the nodes in this set.