findings:
  - file: src/__tests__/unit/ingestion/structural.spec.ts
    where: >-
      line 153, in the test "throws VALIDATION_INVALID_FORMAT with {value, allowed_values} on miss" (describe "assertValueInDomain (BR-30)")
    evidence: >-
      expect(vf.message).toBe("attribute value not in closed domain");
    cost: >-
      The test fixes the exact text a caller is told when an attribute value is outside its key's allowed values. No node holds that text. The ingestion contract answers this refusal only as "error code VALIDATION_INVALID_FORMAT naming the value and the allowed values in sorted order", with no message. The same contract does state messages verbatim for other refusals, for example "ingest_document arguments failed validation.". A reader looking in the specification for what the system says here finds nothing, and will take this test as the decision. The test also fixes the detail names `value` and `allowed_values`, which no node names either.
    kind: unstated
    correction: >-
      An analysis would have to decide whether this refusal's message, and its detail names, are part of the contract. If so, the propose-attribute refusal for rules/knowledge-base/attribute-value-in-allowed-values in contracts/knowledge-base/ingestion would state them. If not, the test should stop asserting them.
    node: contracts/knowledge-base/ingestion
