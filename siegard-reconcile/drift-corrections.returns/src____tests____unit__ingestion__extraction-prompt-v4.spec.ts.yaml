looked_past: >-
  The file's other assertions state facts that nodes outside my set already hold: DEFAULT_PROMPT_VERSION "v4" (default-prompt-version), the "never invent a date" instruction (extraction-never-invents-a-date), the shared MAX_TOKENS across versions (extraction-turn-token-ceiling), and the data-not-instruction marker (document-content-is-data). I report none of them, and I did not weigh the file's regex style or its duplication of the prompt wording as a code review.