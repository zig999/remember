findings:
  - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
    where: >-
      the test "v4 keeps relative-date words verbatim in pt", lines 99-105
    evidence: >-
      expect(s).toContain('"hoje"');
      expect(s).toContain('"ontem"');
      expect(s).toContain('"amanhã"');
    cost: >-
      The test fixes three Portuguese day words that the v4 extraction prompt must carry, and no node says so.
      Under extraction-relative-date-falls-back-to-reception the prompt only has to ask the model to resolve a relative date against the document date or the reception date.
      A reader who looks for which relative-date words the prompt must name finds nothing in the specification, and the suite is the only place the list is decided.
    kind: unstated
    correction: >-
      The analysis would decide whether the prompt must name these relative-date words, and which node holds that.
      The extraction-relative-date-falls-back-to-reception node is the natural home, or a sibling rule beside it.
  - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
    where: >-
      the test 'v4.user() surfaces received_at and an unknown document_date in the metadata block', lines 111-128
    evidence: >-
      expect(metaBlock?.text).toContain("- received_at: 2026-06-26T12:00:00Z");
      expect(metaBlock?.text).toContain("- document_date: (unknown)");
    cost: >-
      The test fixes the layout of the metadata block in the user message ("- received_at: <value>"), and the literal "(unknown)" that stands for a missing document date.
      The prompt regex at line 42, which anchors on "if `document_date` is `(unknown)`", depends on the same literal.
      No node holds the block's layout or the "(unknown)" marker, so the marker and the way the model is shown the two anchor dates are decided only in the suite.
    kind: unstated
    correction: >-
      The analysis would give the user message's presentation of the reception time and the document date, including the marker for an absent document date, a node.
