findings:
  - file: src/__tests__/unit/query-retrieval/search-service-expansion.spec.ts
    where: >-
      the it block "answers a node, a link and a fragment each as an item with kind, layer, score, hop, summary, flags and at least one supporting fragment", lines 351-381
    evidence: >-
      for (const item of body.items) {
        expect(item).toEqual(
          expect.objectContaining({
            kind: expect.stringMatching(/^(node|link|fragment)$/),
            layer: expect.stringMatching(/^(fragment|node|chunk)$/),
            score: expect.any(Number),
            hop: expect.any(Number),
            summary: expect.any(String),
            flags: expect.any(Array),
            provenance: expect.any(Array),
          })
        );
    cost: >-
      The test makes layer, hop, summary and flags mandatory on every item, nodes and fragments included. Node domain/knowledge-base/search-item declares only kind and score as `required: true`, and says nothing about which kinds of item carry a hop. A reader looking for what a node item's hop is, or whether it exists, finds the specification silent and the test the only place that decides it. If the answer is the other way round, this assertion fails, and nothing points back to a decision.
    kind: unstated
    correction: >-
      Either the specification states that every search item carries layer, hop, summary and flags, and what hop is for a node or fragment item, or the test stops asserting the presence of those fields on items other than links. The first goes through the analysis that gives the fact a node.
    node: domain/knowledge-base/search-item
