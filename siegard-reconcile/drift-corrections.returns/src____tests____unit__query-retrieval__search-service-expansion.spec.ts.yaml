  - node: rules/knowledge-base/expansion-decay
    held_at: >-
      the assertions in describe "decayed score of an expanded link", lines 272-323
    evidence: >-
      `expect(linkItem(body, linkId).score).toBeCloseTo(expectedScore, 10);` with link-1 at 0.4, link-2 at 0.2 and link-3 at 0.1 over a match scored 0.8, and `"link-x1": 0.2, "link-x2": 0.1, "link-x3": 0.05` for the match scored 0.4. This is 0.5 to the hop times the score of the matched node each link was reached from.
  - node: rules/knowledge-base/expansion-hop
    held_at: >-
      the assertion in describe "the item's hop", lines 325-349
    evidence: >-
      `expect(hopByLink).toEqual({ "link-in": 1, "link-1": 1, "link-2": 2, "link-3": 3 });` The matched node is an endpoint of link-in and link-1, as target and as source, and both are hop 1.
  - node: domain/knowledge-base/search-item
    held_at: >-
      the assertions in describe "the search item's shape", lines 351-381
    evidence: >-
      `expect(item.provenance.length).toBeGreaterThanOrEqual(1);` and `kind: expect.stringMatching(/^(node|link|fragment)$/)`. The node declares provenance as 1..*, kind as the item-kind values and layer as the search-layer values. The mandatory presence of layer, hop, summary and flags on every item is reported as a finding.
