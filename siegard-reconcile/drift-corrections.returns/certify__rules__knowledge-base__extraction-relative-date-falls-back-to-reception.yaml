certified:
  - node: rules/knowledge-base/extraction-relative-date-falls-back-to-reception
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: v4 asks the model to resolve a relative date against the document date when present and otherwise against the date portion of received_at
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: v4.system extends v3.system verbatim with the received_at-anchor directive
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: v4.user() surfaces received_at and an unknown document_date in the metadata block
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: dispatches 'v4' to the v4 module
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: differentiates v4 from v3 by appending to the v3 system prompt
    why: >-
      The instruction itself is tested. The text that v4.system adds after the v3 prompt is
      pinned to a regex: resolve against `document_date` when it is present, and when
      `document_date` is `(unknown)` fall back to the date portion of `received_at`, with
      document date tried first. The user-message test covers the fallback path. When the
      source has no date, the model sees `received_at` and `document_date: (unknown)`.
      Three parts of the fact go unexercised. First, nothing checks the case where the source
      has a date. Nothing calls `user()` with a non-null `document_date` and asserts that the
      model is shown that date. If the metadata block always printed `(unknown)`, the
      instruction to resolve against the document date would have nothing to point at, and
      every test would still pass. Second, nothing checks that a v4 extraction actually sends
      this instruction. The directive test reads `system` imported directly from
      `extraction.v4`, not the module the registry hands an extraction for 'v4'. The registry
      tests check only that module's `version` field and that its system prompt starts with
      v3's and differs from it. A registry entry with any other appended text would pass
      them. Third, the regex begins at "resolve it against". It does not check that "it" is a
      relative date in the chunk, so the instruction's subject is not pinned.
    remainder: testable
    remainder_why: >-
      Two assertions would close it. First, call `selectPromptModule("v4").user` with metadata
      whose `document_date` is a real date, for example 2026-05-10. Expect the metadata block
      to contain `- document_date: 2026-05-10`, next to the existing assertion for the null
      case. Second, take `selectPromptModule("v4").system(snapshot)`, the module a v4
      extraction is given. Expect it to contain a directive whose subject is a relative date
      in the chunk, resolved against `document_date` when present and otherwise against the
      date portion of `received_at`.