read:
  - node: domain/knowledge-base/raw-chunk
    held_at: >-
      nowhere
    evidence: >-
      The file declares no shape for the chunk. It reads one field of a row type declared in the repository, as "chunk_index: row.chunk_index", and passes it into the "source" object of AcceptedFragmentItem, which is declared in ../dto/fragment.dto.js. The attributes start_offset, end_offset, excerpt, locator, superseded_at, chunking_version and status do not appear here.
  - node: domain/knowledge-base/raw-information
    held_at: >-
      nowhere
    evidence: >-
      The file declares no shape for the raw information. It forwards values from AcceptedFragmentRow: "raw_information_id: row.raw_information_id", "source_type: toSourceType(row.source_type)", "received_at: row.received_at.toISOString()" and "document_title: row.document_title". The source_type conversion sits in ../dto/response.dto.js, and the row type sits in ../repository/accepted-fragments.repository.js.
looked_past: >-
  I saw the log line "query_retrieval_list_accepted_fragments_ok" with its route and filters fields, and the service's use of the repository. I did not report them because they state no fact of these two nodes. Which fragments count as accepted is decided in the repository, which is outside the file set.
