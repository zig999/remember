read:
  - node: domain/knowledge-base/raw-chunk
    held_at: >-
      nowhere
    evidence: >-
      The file declares no shape for the chunk. It maps repository rows into a response type declared in
      ../dto/response.dto.js and a row type declared in ../repository/provenance.repository.js, and only passes
      the values along: `chunk_index: c.chunk_index, offset_start: c.offset_start, offset_end: c.offset_end,
      excerpt: c.excerpt, locator: c.locator`. It adds no value, threshold or rule of its own to the chunk.
  - node: domain/knowledge-base/raw-information
    held_at: >-
      nowhere
    evidence: >-
      The file declares no shape for the raw information. It reads fields of a row type declared in another file
      and copies them into the response: `id: c.raw_information_id, source_type: toSourceType(c.source_type),
      received_at: c.received_at.toISOString(), metadata: c.metadata, original_input: c.original_input ?? null`.
      The shape is declared in the DTO and repository files.
looked_past: >-
  The three refusals (fragment not accepted, compliance deletion, empty chain), their order, and the
  `query_retrieval_provenance_*` log events belong to the provenance-read rules (for example
  rules/knowledge-base/provenance-requires-accepted-fragment and rules/knowledge-base/empty-provenance-chain-refused)
  and to the read-*-provenance operations, which are outside this node set; the code agrees with those rules as
  they appear in projections/full-text.md. I did not judge them.
