findings:
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedNodeItemSchema, the `node_id` field's describe(...) text (lines 343-349),
      compared with the header comment's `node_id` bullet (lines 283-288)
    evidence: >-
      describe text: "Rejected (VALIDATION_INVALID_FORMAT) if the id does not point to an active node."
      comment: "(rejected `STRUCTURAL_INVALID` if the id does not point to an `active`
      node)"
    cost: >-
      The tool description is sent to the calling model, and it names a refusal code for a pinned
      node that is not active. The specification holds the pin and its provisos (the node exists
      and is active) but not the refusal code. The code is therefore decided only in this text,
      and the next reader will not find it in the specification. The file's own comment names a
      different code (STRUCTURAL_INVALID), so the file does not say which code the handler raises.
    kind: unstated
    correction: >-
      The node that holds the pin (rules/knowledge-base/directed-pinned-node) would have to state
      what a pin naming a missing or non-active node is refused with, or the refusal would have to
      be left out of the description. Which code is right is not settled in this file.
    node: rules/knowledge-base/directed-pinned-node
