      The file declares no shape for raw-information. `RecentIngestionRow` is a read projection (`readonly source_type: string; readonly raw_status: string; readonly received_at: Date; readonly content_preview: string;`) built by `SELECT ri.id AS raw_information_id, ri.source_type AS source_type, ri.status AS raw_status, ri.received_at AS received_at, left(ri.content, 80) AS content_preview ... FROM raw_information ri`. It reads a few fields of a shape declared elsewhere and declares none of its own.
