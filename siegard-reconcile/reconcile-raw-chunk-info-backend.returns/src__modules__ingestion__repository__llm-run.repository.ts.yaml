    evidence: >-
      The file declares no shape for raw-chunk. It only reads the table: `SELECT count(*)::text AS n FROM raw_chunk WHERE id = ANY($1::uuid[]) AND raw_information_id = $2` and `JOIN raw_chunk rc ON rc.id = fs.raw_chunk_id`. It uses `raw_information_id` and `id` and passes the value along. It declares none of chunk_index, offsets, excerpt, locator, chunking_version or status.
