  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      line 351, the SPEAKER_LINE_REGEX constant
    evidence: |-
      const SPEAKER_LINE_REGEX = /^\s*(?:[[(]\d{1,2}:\d{2}(?::\d{2})?[\])][\s\t]+)?[A-Za-zÀ-ÿ0-9_]+(?:\s[A-Za-zÀ-ÿ0-9_]+)?:\s/;
      The node states: "an optional time stamp written [h:mm], [hh:mm], (hh:mm) or (hh:mm:ss) followed by whitespace, starts with one or two words of letters, digits or underscores"
    cost: >-
      The regex and the node name different sets of lines as speaker lines, so chat and transcript content is cut into different blocks than the node dictates. The regex accepts time stamps the node does not list: `[hh:mm:ss]`, `(h:mm)` and mismatched brackets such as `[12:00)`. For "letters" it accepts only `A-Za-z` and `À-ÿ`. That range includes × and ÷ and leaves out letters beyond Latin-1. Whichever is right, nobody can tell which was decided.
    kind: contradicts
    correction: >-
      Make the pattern accept exactly the forms and the letters the node names, or have the node restate the forms the code actually accepts. The choice belongs to the specification.
    node: rules/knowledge-base/speaker-line
