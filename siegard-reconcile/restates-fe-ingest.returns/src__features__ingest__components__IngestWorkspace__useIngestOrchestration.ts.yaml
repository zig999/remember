findings:
  - file: src/features/ingest/components/IngestWorkspace/useIngestOrchestration.ts
    where: |-
      the constant INGEST_MODEL, line 18, sent as model in handleSubmit (line 126)
    evidence: |-
      const INGEST_MODEL = "claude-opus-4-8";
    cost: |-
      The model every ingestion from the screen runs under is decided only in this constant. The only node that names this model value is rules/chat/turn-model-default, and it governs the chat turn, not ingestion. rules/chat/turn-model-default was found by grep of the specification root and was not opened. bff-ingestion says only that model is "sent as given and checked by nothing in the client". The next reader looks in the specification for which model an ingestion uses and finds no answer, and the LLM run's recorded model becomes whatever this file says.
    kind: unstated
    correction: |-
      A node must hold which model the ingest screen names when it records a source, most naturally contracts/ingest-workspace/bff-ingestion at its ingest-raw-information operation. Until it does, this value has no home in the specification.
    node: contracts/ingest-workspace/bff-ingestion
  - file: src/features/ingest/components/IngestWorkspace/useIngestOrchestration.ts
    where: |-
      the constant INGEST_PROMPT_VERSION, line 19, sent as prompt_version in handleSubmit (line 127)
    evidence: |-
      const INGEST_PROMPT_VERSION = "v3";
    cost: |-
      The extraction prompt version every ingestion from the screen runs under is decided only here. The extraction rules are conditioned on prompt version, for example event-type-fallback from v3 on and relative-date from v3 alone, so this constant selects which extraction rules apply. The next reader finds no node saying the screen submits v3 and learns it only from the code.
    kind: unstated
    correction: |-
      A node must hold which prompt version the ingest screen names when it records a source, most naturally contracts/ingest-workspace/bff-ingestion at its ingest-raw-information operation.
    node: contracts/ingest-workspace/bff-ingestion

