findings:
  - file: src/features/ingest/api/useIngestGraphAssembly.ts
    where: |-
      TRAVERSE_STALE_MS constant (line 18), used in the useQueries options at lines 114-115
    evidence: |-
      const TRAVERSE_STALE_MS = 5 * 60_000;
      ...
      staleTime: TRAVERSE_STALE_MS,
      refetchOnWindowFocus: false,
    cost: |-
      How long a traversal counts as fresh, and that a regained window focus never rereads it, are decided only here. The node for the traversal request states depth, direction and parallelism but no freshness. A reader looking in the specification for how current the assembled graph is will not find it. Other ingest-workspace rules were found to state no freshness window.
    kind: unstated
    correction: |-
      The analysis would have to give the traversal's freshness window (five minutes) and its no-reread-on-focus behaviour a node, most naturally the rule on the traversal request.
    node: rules/ingest-workspace/assembly-traverses-each-affected-node
  - file: src/features/ingest/api/useIngestGraphAssembly.ts
    where: |-
      the two GraphDelta literals, lines 135-139 (empty assembly) and 174-178 (full assembly)
    evidence: |-
      const delta: GraphDelta = {
        sourceTool: "ingest_assembly",
        nodes: [],
        links: [],
      };
    cost: |-
      The name an ingest assembly gives itself as the tool that showed the graph is a literal that appears only in code. The graph-delta node only requires a source_tool string, and no node in the specification names this value. The next reader will not find in the specification what source an ingest-assembled graph carries.
    kind: unstated
    correction: |-
      The analysis would have to state the source tool of an ingest assembly's delta in a node of the ingest-workspace, for example on the session or on the assembly rules.
