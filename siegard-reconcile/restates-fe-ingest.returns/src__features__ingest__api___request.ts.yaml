  - node: scenarios/ingest-workspace/expired-token-is-refreshed-once-and-resent
    held_at: |-
      The 401 branch of httpIngest, lines 137-152. A refreshed token is stored by trySilentRefresh and the same request is sent again once.
    evidence: |-
      `const refreshed = await trySilentRefresh(); if (refreshed) { ... return httpIngest<T>(path, { ...opts, headers: Object.fromEntries(nextHeaders.entries()), __retried: true }); }`
looked_past: |-
  The details objects `{ cause: String(err) }` on the timeout, network, abort and invalid-response failures are not stated by the contract. The duplicated default redirect closure and the test-only `__setIngestRedirectForTests` setter are code-structure matters. I did not weigh any of them as domain facts.