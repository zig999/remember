  - node: rules/ingest-workspace/first-unauthorized-answer-refreshes-the-token-once
    held_at: |-
      The 401 branch of httpIngest, lines 137-152, and trySilentRefresh, lines 73-84.
    evidence: |-
      `if (response.status === 401 && __retried !== true) { const refreshed = await trySilentRefresh(); if (refreshed) { ... nextHeaders.set("Authorization", `Bearer ${fresh}`); ... return httpIngest<T>(path, { ...opts, headers: ..., __retried: true }); }`
      trySilentRefresh does `const newJwt = await fetchAccessToken(); useAuthStore.getState().setToken(newJwt);`.
  - node: rules/ingest-workspace/ingestion-request-carries-the-access-token
