read:
  - node: contracts/ingest-workspace/bff-ingestion
    held_at: |-
      httpIngest (lines 86-207), together with authHeader (lines 6-9). The send-ingestion-request operation is held here. The other operations (ingest-raw-information, run-extraction, retry-llm-run, read-llm-run) name paths and bodies that this file does not state.
    evidence: |-
      A 2xx answer is returned as the JSON body, and a 204 gives no value: `if (response.status === 204) return undefined as unknown as T; return (await response.json()) as T;`.
      A 2xx answer whose body is not JSON becomes `code: "SYSTEM_INVALID_RESPONSE" ... message: "Resposta do servidor não é JSON válido."`.
      A failed fetch becomes SYSTEM_TIMEOUT "Tempo limite excedido na requisição.", SYSTEM_ABORTED "Requisição cancelada." or SYSTEM_NETWORK "Falha de rede ao contactar o servidor.".
      An unrefreshable 401 throws `code: "AUTH_SESSION_EXPIRED", httpStatus: 401, message: "Sua sessão expirou. Faça login novamente."`.
      A non-2xx answer takes `typeof errObj?.code === "string" ? errObj.code : response.status >= 500 ? "SYSTEM_UPSTREAM" : "SYSTEM_UNKNOWN"` and passes `details: errObj?.details`.
      The message is `typeof errObj?.message === "string" ? errObj.message : response.status >= 500 ? "Algo deu errado. Tente novamente." : "Erro desconhecido do servidor."`.
  - node: rules/ingest-workspace/extraction-has-no-client-cutoff
