findings:
  - file: src/features/ingest/api/_transforms.ts
    where: |-
      SourceTypeWire, lines 1-8 (IngestSourceType, line 10, re-exports it)
    evidence: |-
      export type SourceTypeWire =
        | "pdf"
        | "email"
        | "ata"
        | "chat"
        | "artigo"
        | "transcricao"
        | "outro";
    cost: |-
      The closed set of source types is declared here as its own vocabulary. Its node, domain/knowledge-base/source-type, is not bound to this file, so a change to the node never reaches this declaration. The node lists pdf, email, meeting-minutes, chat, article, transcript and other, and gives ata, artigo, transcricao and outro as the material's own words for four of them. If the node moves, nobody can tell which spelling the business decided.
    kind: contradicts
    correction: |-
      The vocabulary is held in this file's own declaration, and the code cannot read the specification. What closes it is a bind of domain/knowledge-base/source-type to this file, so that a change to the node reaches the declaration.
    node: domain/knowledge-base/source-type
  - file: src/features/ingest/api/_transforms.ts
    where: |-
      IngestRawInformationRequestWire, line 24
    evidence: |-
      export interface IngestRawInformationRequestWire {
        readonly source_type: SourceTypeWire;
        readonly content: string;
        readonly storage_ref?: string | null;
        readonly metadata?: Record<string, unknown>;
        readonly model: string;
        readonly prompt_version: string;
      }
    cost: |-
      The node lists the body of ingest-raw-information as "the JSON body of source_type, content, model, prompt_version and an optional metadata". This shape adds an optional storage_ref the intake request does not name. A reader looking for what the screen may send would trust the node and miss the field. The sibling ingest-document operation records no storage reference, and only the raw-information domain node holds storage_ref, as an attribute of the stored record.
    kind: contradicts
    correction: |-
      Either the node gains storage_ref in the intake request body through the analysis route, or the field leaves this declaration.
    node: contracts/ingest-workspace/bff-ingestion

