read:
  - node: rules/application-shell/a-state-badge-has-five-states-with-labels
    held_at: |-
      The ConfidenceState union (lines 3-8) declares the five states. The label?: string prop of StateBadgeProps (line 21) declares the label override. The label texts Aceito, Incerto, Baixa confiança, Em disputa and Superado are not in this file; it is a types file and declares only the shape.
    evidence: |-
      export type ConfidenceState =
        | "accepted"
        | "uncertain"
        | "low-confidence"
        | "disputed"
        | "superseded";

      export interface StateBadgeProps {
        state: ConfidenceState;
        ...
        label?: string;
looked_past: |-
  The size, animate and iconOnly props in StateBadgeProps are presentation surface and state no domain fact, so they are another judgment's.