findings: []
read:
  - node: rules/application-shell/a-bubble-shows-its-tool-chips-first
    held_at: |-
      nowhere. The file only types the `toolChips` prop and declares no chip order, content or colour. The `ToolCallData` shape comes from `@/features/chat/types`.
    evidence: |-
      toolChips?: ReadonlyArray<ToolCallData>;
  - node: rules/application-shell/a-bubble-shows-plain-text
    held_at: |-
      the `content: string` member of `ChatBubbleProps`. It is a required string, so an empty string is accepted. Keeping line breaks is rendering behavior and is not declared in this file.
    evidence: |-
      content: string;
  - node: rules/application-shell/a-bubble-takes-one-role
    held_at: |-
      the `ChatBubbleVariant` union and the required `variant` member of `ChatBubbleProps`. They give exactly one role per bubble. The side and the fill that the role decides are not declared in this file.
    evidence: |-
      export type ChatBubbleVariant = "user" | "assistant";
      ...
      variant: ChatBubbleVariant;
looked_past: |-
  The `animate?: boolean` prop is presentational and states no domain fact, and the `streaming`, `error` and `stopReason` props belong to the unreviewed node domain/application-shell/message-bubble, so I reported none of them.