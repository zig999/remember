findings:
  - file: src/components/ds/ConversationMenu/ConversationMenu.tsx
    where: |-
      STRINGS.deleteBody, rendered in the delete dialog's DialogDescription (lines 49 and 403-405)
    evidence: |-
      deleteBody: "Tem certeza? Esta ação não pode ser desfeita.",
      ...
      <DialogDescription id="conversation-menu-delete-desc">
        {STRINGS.deleteBody}
      </DialogDescription>
    cost: |-
      The dialog tells the owner that deleting a conversation is irreversible. No node holds that claim. deleting-asks-first holds only the dialog's title, and only-the-confirmation-deletes holds who sends the delete. The statement about what deletion does therefore lives only in this file. The next reader looks for it in the specification and does not find it. If deletion semantics change, nothing flags this text.
    kind: unstated
    correction: |-
      deleting-asks-first (or a node for the dialog's content) would have to state the dialog's body text, or the irreversibility of deleting a conversation. Alternatively the body would have to stop asserting it.
    node: rules/application-shell/deleting-asks-first
  - file: src/components/ds/ConversationMenu/ConversationMenu.tsx
    where: |-
      the STRINGS vocabulary for the row actions, the rename field and the dialog buttons (lines 39-51), and the aria-labels built from it (lines 246, 255, 313, 327, 341, 355)
    evidence: |-
      rename: "Renomear",
      archive: "Arquivar",
      delete: "Excluir",
      confirmRename: "Confirmar renomeação",
      cancelRename: "Cancelar renomeação",
      deleteCancel: "Cancelar",
      deleteConfirm: "Confirmar",
      ...
      aria-label={`Renomeando ${itemTitle}`}
      aria-label={`Novo título para ${itemTitle}`}
    cost: |-
      The rules require rename, archive, reactivate, delete, confirm and cancel controls but name none of their labels, except that deleting-asks-first names the dialog title "Excluir conversa". The words the owner and assistive technology hear for these controls are decided only here. A relabelling or a translation has no node to answer to.
    kind: unstated
    correction: |-
      The nodes that require these controls (a-row-offers-its-actions, a-rename-sends-the-trimmed-title, only-the-confirmation-deletes) would have to name their labels if the business holds them as fact. If they are surface vocabulary only, the project's surface route covers them.

