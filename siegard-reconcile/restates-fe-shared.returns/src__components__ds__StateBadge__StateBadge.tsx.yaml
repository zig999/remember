findings:
  - file: src/components/ds/StateBadge/StateBadge.tsx
    where: >-
      decideTransition() (lines 75-86) and the animation selection in StateBadge (lines 122-146)
    evidence: |-
      if (dataTransitionAttr === "merge") return "merge";
      if (prev === "uncertain" && next === "accepted") return "promote";
      if (next === "superseded") return "supersede";
      ...
      } else if (state === "uncertain" && motionAllowed) {
        variants = pulseUncertain(false);
        animateProp = "visible";
    cost: >-
      The code decides which confidence-state changes the badge animates: uncertain to accepted is a promotion, any change into superseded is a supersession, a merge is signalled by a data attribute, and an uncertain badge pulses continuously. It also decides that reduced motion switches all of this off. No node in the specification holds any of it. Only the two badge nodes (five labelled states, always named) bind this file, and neither mentions motion or transitions. The next reader looks in the specification for which state changes the badge marks, finds nothing, and the code becomes the only place that decision lives.
    kind: unstated
    correction: >-
      Give the state-badge's confidence-state transition and pulse behaviour a node under domain/application-shell, or a rule constraining domain/application-shell/state-badge. Then this file can be bound to it.
