findings:
  - file: src/shell/Header.tsx
    where: >-
      the NAV constant, lines 23-30 (the `to` value of each of the six entries)
    evidence: |-
      { to: "/chat", label: "Chat", icon: MessageSquare },
        { to: "/graph", label: "Grafo", icon: Network },
        { to: "/search", label: "Buscar", icon: Search },
        { to: "/ingest", label: "Ingerir", icon: Upload },
        { to: "/curation", label: "Curar", icon: Scale },
        { to: "/history", label: "Histórico", icon: History },
    cost: >-
      The node fixes the six area names, their order and the "equals or begins" test for the current area. It does not give the address each area is at. The mapping from Chat, Grafo, Buscar, Ingerir, Curar and Histórico to "/chat", "/graph", "/search", "/ingest", "/curation" and "/history" lives only in this array. A reader who looks in the specification for where each area lives finds no address. If an address changes, no node says which was decided.
    kind: unstated
    correction: >-
      The analysis would have to give the area-to-address mapping a node, most naturally rules/application-shell/the-header-lists-six-areas or the application-shell domain node.
    node: rules/application-shell/the-header-lists-six-areas
  - file: src/shell/Header.tsx
    where: >-
      the brand block at the start of the header, lines 55-60
    evidence: |-
      <span className="font-sans text-sm font-medium font-bold tracking-tight text-foreground">
                Remember
              </span>
    cost: >-
      The header shows the product name "Remember" as text the owner reads. No node holds that name or the fact that the header shows it. The shell-screen show-shell answer lists the banner's contents (the navigation, the palette toggle and the theme choice) and does not mention it. The wording lives only in the code, where nobody looks for it when the specification is read.
    kind: unstated
    correction: >-
      The analysis would have to give the product name shown in the header a node, most naturally contracts/application-shell/shell-screen under show-shell.
    node: contracts/application-shell/shell-screen
