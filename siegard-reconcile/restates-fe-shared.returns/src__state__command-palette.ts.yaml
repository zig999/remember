read:
  - node: rules/application-shell/the-palette-starts-closed-in-memory
    held_at: |-
      the `useCommandPaletteStore` initializer, line 9-13: `open: false` as the initial state, in a plain zustand `create` store with no persistence middleware.
    evidence: |-
      export const useCommandPaletteStore = create<CommandPaletteState>((set, get) => ({
        open: false,
        setOpen: (open) => set({ open }),
        toggle: () => set({ open: !get().open }),
      }));