read:
  - node: contracts/application-shell/shell-screen
    held_at: |-
      NotFoundFallback (lines 27-38) for the "Página não encontrada." answer of show-page-state. RootComponent (lines 11-21) mounts the AppToaster that carries show-failure's toasts, but the toast wordings are not in this file.
    evidence: |-
      <h1 className="text-lg font-semibold tracking-tight">Página não encontrada.</h1>
      <p className="text-body text-body">
        O endereço solicitado não existe ou foi removido.
      </p>
  - node: rules/application-shell/a-render-failure-replaces-the-screen
    held_at: |-
      RootComponent, lines 15-17. It wraps the Outlet in AppErrorBoundary under the root, so a render failure of any page falls inside the boundary. The notice and the Recarregar action are in the imported AppErrorBoundary, a file outside this set, and this file states neither.
    evidence: |-
      <AppErrorBoundary>
        <Outlet />
      </AppErrorBoundary>
  - node: rules/application-shell/an-unknown-address-says-page-not-found
    held_at: |-
      notFoundComponent on the root route (line 8), which renders NotFoundFallback (lines 27-38). The root route carries no guard and no shell around the fallback.
    evidence: |-
      notFoundComponent: NotFoundComponent,
      ...
      <h1 className="text-lg font-semibold tracking-tight">Página não encontrada.</h1>
      <p className="text-body text-body">
        O endereço solicitado não existe ou foi removido.
      </p>
looked_past: |-
  The Tailwind class strings, the data-testid "not-found-page" and the AmbientBackdrop mount are surface and test hooks, not domain facts, so they are another judgment's.