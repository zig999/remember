    held_at: |-
      NodeAttributeView, lines 76-87
    evidence: |-
      export interface NodeAttributeView {
        readonly id: string;
        readonly key: string;
        readonly value: string;
        readonly valueType: AttributeWire["value_type"];
        readonly effectiveStatus: AttributeWireEffectiveStatus;
        readonly isInEffect: boolean;
        readonly state: ConfidenceState;
        readonly validFromLabel: string | null;
        readonly validToLabel: string | null;
        readonly provenance: ReadonlyArray<ProvenanceEntryView>;
      }
      The view carries the id, key, value, value type, effective status, in-effect flag, badge, validity labels and provenance. It declares no is_current, confidence or node_id. The wire shape AttributeWire carries those three, which is the wire and not what is shown.
