    where: >-
      line 9, the attributesHeading entry of NODE_DETAIL_COPY, rendered at NodeDetailPanel.success.tsx line 113
    evidence: |-
      attributesHeading: "Atributos",
    cost: >-
      The panel emits a heading, "Atributos", over the attributes table, and no node under the
      specification root states that text. The graph-explorer nodes name the table's columns
      (attribute, value, state), the list "Aliases" and the section "Relações". A reader who
      looks in the specification for what the attributes section is called will not find it.
      The label lives only in this file.
    kind: unstated
    correction: >-
      The analysis would give the attributes section's heading a node, most likely beside the
      "Aliases" and "Relações" headings in contracts/graph-explorer/graph-screen or in a rule
      like attributes-are-listed-as-received.
