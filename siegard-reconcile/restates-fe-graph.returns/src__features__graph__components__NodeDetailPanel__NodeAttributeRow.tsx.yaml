findings: []
read:
  - node: contracts/graph-explorer/graph-screen
    held_at: |-
      NodeAttributeRow renders the attributes part of the show-node-detail row (key, value, state badge). The wording the contract names for the origin disclosure comes from NODE_DETAIL_COPY and is not held in this file.
    evidence: |-
      <td className="p-xs align-top">{attr.key}</td> ... <StateBadge state={attr.state} size="sm" iconOnly /> ... {NODE_DETAIL_COPY.originSummary}
  - node: rules/graph-explorer/an-attribute-row-shows-key-value-state-and-validity
    held_at: |-
      the first <tr> of NodeAttributeRow, lines 103-122
    evidence: |-
      <td className="p-xs align-top">{attr.key}</td> ... <span>{attr.value}</span> ... {(attr.validFromLabel !== null || attr.validToLabel !== null) && ( ... {attr.validFromLabel ?? "—"}{" → "}{attr.validToLabel ?? "—"} ... <StateBadge state={attr.state} size="sm" iconOnly />
  - node: rules/graph-explorer/an-attribute-without-provenance-has-an-empty-list
    held_at: |-
      the first statement of NodeAttributeRow, line 99
    evidence: |-
      const provenance = attr.provenance ?? [];
  - node: rules/graph-explorer/every-item-offers-its-full-origin
    held_at: |-
      LazyOrigin, lines 66-92, rendered unconditionally for every attribute at line 129. The provenance read is enabled only while the disclosure is open.
    evidence: |-
      const [open, setOpen] = useState(false); const query = useProvenance("attributes", attributeId, open); ... onToggle={(e) => setOpen((e.currentTarget as HTMLDetailsElement).open)} ... <LazyOrigin attributeId={attr.id} />
  - node: rules/graph-explorer/inline-entries-show-text-and-what-they-have
    held_at: |-
      the entries.map in InlineProvenance, lines 25-56
    evidence: |-
      <p className="text-xs text-foreground">{p.fragmentText}</p> ... {p.confidenceLabel !== null && ( ... )} {p.sourceType !== null && ( ... )} {p.receivedAtLabel !== null && ( ... )}
  - node: rules/graph-explorer/inline-provenance-needs-an-entry
    held_at: |-
      The guard on the inline disclosure, line 126-128. The summary wording (Proveniência, count in parentheses, entrada/entradas) is delegated to NODE_DETAIL_COPY.attributeProvenanceSummary in NodeDetailPanel.copy.ts, where `Proveniência (${n} ${n === 1 ? "entrada" : "entradas"})` is declared. The "Proveniência do link" variant belongs to the relationship row, not this file.
    evidence: |-
      const hasInlineProvenance = provenance.length > 0; ... {hasInlineProvenance && (<InlineProvenance entries={provenance} />)} ... {NODE_DETAIL_COPY.attributeProvenanceSummary(entries.length)}