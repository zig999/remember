    where: |-
      the visible label inside the reorganize Button, line 207
    evidence: |-
      <Shuffle aria-hidden="true" className="size-4" />
                        Reorganizar
    cost: |-
      The text a person reads on the control is "Reorganizar". The only node that speaks of it, rules/graph-explorer/the-reorganize-control-needs-its-handler, fixes the control's name as "Reorganizar o layout do grafo", which the aria-label carries. A search of the specification finds no node holding the visible text. Anyone changing the control's wording looks in the specification, finds only the accessible name, and has no node that decides what is displayed.
    kind: unstated
    correction: |-
      The visible text of the reorganize control would need a node to hold it, most naturally by extending rules/graph-explorer/the-reorganize-control-needs-its-handler or the graph-screen contract. That is a change to the specification, not to this file.
    node: rules/graph-explorer/the-reorganize-control-needs-its-handler
