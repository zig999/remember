findings: []
read:
  - node: rules/graph-explorer/error-overlay-shows-the-message-or-the-default
    held_at: |-
      GRAPH_STATUS_ERROR_DEFAULT_COPY, and the `message` expression in GraphStatusOverlay (lines 9-21). The component renders only the message span, with no button or link.
    evidence: |-
      export const GRAPH_STATUS_ERROR_DEFAULT_COPY =
        "Não foi possível carregar o grafo agora.";
      const message = isError
        ? (errorMessage ?? GRAPH_STATUS_ERROR_DEFAULT_COPY)
        : GRAPH_STATUS_LOADING_COPY;
  - node: rules/graph-explorer/loading-overlay-says-it-is-searching
    held_at: |-
      GRAPH_STATUS_LOADING_COPY (line 7), the spinner rendered when `!isError` (lines 47-52), and the message span (lines 53-60).
    evidence: |-
      export const GRAPH_STATUS_LOADING_COPY = "Buscando na memória…";
      {!isError && (
        <Loader2
          className="size-4 shrink-0 animate-spin text-foreground"
          aria-hidden="true"
        />
      )}
  - node: rules/graph-explorer/the-overlay-is-a-polite-status-region
    held_at: |-
      The root div's role and aria-live attributes (lines 32-33), and the GlassSurface aria-label (line 45).
    evidence: |-
      role="status"
      aria-live="polite"
      aria-label={isError ? "Erro do grafo" : "Carregando grafo"}
  - node: rules/graph-explorer/the-overlay-message-is-two-lines-at-most
    held_at: |-
      The class list of the message span (lines 54-57).
    evidence: |-
      "min-w-0 line-clamp-2",
looked_past: |-
  The overlay's layout and styling (z-frame, pointer-events, GlassSurface level and accent, spacing and text-size tokens) and the data-variant and data-testid attributes are surface, not domain facts.