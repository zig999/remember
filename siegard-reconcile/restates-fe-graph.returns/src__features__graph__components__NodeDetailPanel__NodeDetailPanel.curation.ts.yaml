read:
  - node: rules/graph-explorer/curation-target-follows-the-node
    held_at: |-
      deriveCurationTarget(), lines 9-24: the needs_review branch, then the loop over data.attributes, then the null return
    evidence: |-
      if (data.status === "needs_review") {
          return { kind: "entity_match", itemId: data.id };
        }
        for (const attr of data.attributes) {
          if (
            attr.effectiveStatus === "uncertain" ||
            attr.effectiveStatus === "disputed"
          ) {
            return { kind: "disputed", itemId: attr.id };
          }
        }
        return null;
looked_past: |-
  The file reads data.status and attr.effectiveStatus from NodeDetailView, and SelectedItemKind is imported from the curation store. Those shapes are declared in other files and are not this file's to judge.