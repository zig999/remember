read:
  - node: rules/graph-explorer/a-chunk-offset-window-is-shown-as-chars
    held_at: |-
      toChunkView, the offsetRangeLabel property
    evidence: |-
      offsetRangeLabel: `chars ${wire.offset_start}–${wire.offset_end}`,
  - node: rules/graph-explorer/a-chunk-without-locator-has-an-empty-one
    held_at: |-
      toChunkView, the locator property
    evidence: |-
      locator: wire.locator ?? {},
  - node: rules/graph-explorer/a-provenance-answer-is-a-list-of-fragments
    held_at: |-
      toProvenanceResponse, toFragmentView and toChunkView
    evidence: |-
      return { fragments: wire.fragments.map(toFragmentView) };
      ...
      id: wire.id, text: wire.text, confidence: wire.confidence, confidenceLabel: formatConfidenceLabel(wire.confidence) ?? "0%", status: wire.status, chunks: wire.chunks.map(toChunkView),
      ...
      id: wire.id, chunkIndex: wire.chunk_index, offsetStart: wire.offset_start, offsetEnd: wire.offset_end, ... excerpt: wire.excerpt, locator: wire.locator ?? {}, rawInformation: toRawInformationView(wire.raw_information),
  - node: rules/graph-explorer/a-source-date-time-is-short-pt-br
    held_at: |-
      RECEIVED_AT_DATETIME and formatReceivedAtDateTime
    evidence: |-
      const RECEIVED_AT_DATETIME = new Intl.DateTimeFormat("pt-BR", { dateStyle: "short", timeStyle: "short", });
      ...
      if (Number.isNaN(dt.getTime())) return iso;
      return RECEIVED_AT_DATETIME.format(dt);
  - node: rules/graph-explorer/a-source-shows-its-id-type-dates-and-title
    held_at: |-
      toRawInformationView, the base object
    evidence: |-
      id: wire.id, sourceType: wire.source_type, receivedAtLabel: formatReceivedAtDateTime(wire.received_at), title: readMetadataTitle(wire.metadata), documentDateLabel: readMetadataDocumentDate(wire.metadata),
  - node: rules/graph-explorer/a-validity-date-is-shown-day-month-year
    held_at: |-
      readMetadataDocumentDate delegates the formatting to formatDateLabel, which is declared in _transforms.ts. The day/month/year, UTC and raw-text-fallback behavior sits there, not in this file.
    evidence: |-
      return formatDateLabel(d);
      (_transforms.ts: `if (parts.length !== 3) return date;` ... `new Date(Date.UTC(year, month - 1, day))`)
  - node: rules/graph-explorer/an-unformatted-confidence-shows-zero-percent
    held_at: |-
      toFragmentView, the confidenceLabel property
    evidence: |-
      confidenceLabel: formatConfidenceLabel(wire.confidence) ?? "0%",
  - node: rules/graph-explorer/lists-keep-the-answered-order
    held_at: |-
      toProvenanceResponse and toFragmentView, which map without sorting or filtering
    evidence: |-
      return { fragments: wire.fragments.map(toFragmentView) };
      ...
      chunks: wire.chunks.map(toChunkView),
  - node: rules/graph-explorer/original-input-is-carried-only-when-answered
    held_at: |-
      toRawInformationView, the original_input branch
    evidence: |-
      if (wire.original_input !== undefined) {
        return { ...base, originalInput: wire.original_input };
      }
      return base;
  - node: rules/graph-explorer/title-and-document-date-come-from-metadata
    held_at: |-
      readMetadataTitle and readMetadataDocumentDate
    evidence: |-
      return typeof t === "string" && t.length > 0 ? t : null;
      ...
      if (typeof d !== "string" || d.length === 0) return null;
      return formatDateLabel(d);
looked_past: |-
  The file imports its date and confidence formatting from _transforms.ts, which sits outside this judgment's file set.