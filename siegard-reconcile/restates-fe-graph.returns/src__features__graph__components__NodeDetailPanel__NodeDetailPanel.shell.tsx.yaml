findings:
  - file: src/features/graph/components/NodeDetailPanel/NodeDetailPanel.shell.tsx
    where: >-
      ErrorView, the PanelHeader title prop (lines 118-122)
    evidence: |-
      <PanelHeader
        title={NODE_DETAIL_COPY.errorNotFound}
        closeRef={closeRef}
        onClose={onClose}
      />
    cost: |-
      Whatever the variant, the header of a failed panel reads "Nó não encontrado.". For a deleted node the alert reads "Este nó foi removido por conformidade." while the header above it says the node was not found. For a generic failure the header says not found while the alert asks for a retry. The owner is shown two messages that disagree, and the not-found wording is the one the specification reserves for RESOURCE_NOT_FOUND. No node says what the header shows in a failed state, so the code is where that decision now lives.
    kind: contradicts
    correction: |-
      The candidate rule says each variant shows its own message and never another variant's. The header text of a failed panel needs a decision: either a node states what the failed header shows, or the header stops carrying another variant's message.
    node: rules/graph-explorer/a-node-failure-reads-its-wording
