      The d3 tree layout configuration (lines 27-30) and the polar-to-Cartesian conversion (lines 67-71). The separation callback gives the gap of 1 between siblings and 2 between other neighbours, divided by depth. Radius 0 at depth 0 puts the root at (0, 0). Angle 0 maps to the top because y is -radius*cos(theta).
