  - node: rules/graph-explorer/radial-rings-take-the-largest-radius
    held_at: |-
      The NODE_FOOTPRINT and MIN_RING_GAP constants (lines 10-12) and the ring radius loop (lines 41-57). The loop takes the largest of depth*200, 270/(2*sin(pi/count)) for a ring of two or more nodes, and the previous radius plus 200. Ring 0 has radius 0.
    evidence: |-
      const NODE_FOOTPRINT = 270;
      const MIN_RING_GAP = 200;
      const angularTerm = count >= 2
            ? NODE_FOOTPRINT / (2 * Math.sin(Math.PI / count))
            : 0;
      : Math.max(
                d * MIN_RING_GAP,
                angularTerm,
                prevRadius + MIN_RING_GAP,
              );
