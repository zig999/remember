    evidence: |-
      enabled: enabled && id.length > 0,
  - node: rules/graph-explorer/a-read-stays-fresh-five-minutes
    held_at: |-
      the STALE_MS constant (line 12) and the staleTime and refetchOnWindowFocus options (lines 29-30)
    evidence: |-
      const STALE_MS = 5 * 60_000;
      staleTime: STALE_MS,
      refetchOnWindowFocus: false,
  - node: rules/graph-explorer/read-failures-pass-through-unchanged
    held_at: |-
      the queryFn, lines 21-27. It has no catch or rewrap, so the error from http() propagates to the query result unchanged.
    evidence: |-
      const wire = await http<ProvenanceResponseWire>(
        `/api/v1/provenance/${kind}/${encodeURIComponent(id)}`,
        { method: "GET", headers: authHeader() },
