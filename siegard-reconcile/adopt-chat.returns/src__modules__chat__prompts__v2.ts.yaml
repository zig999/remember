      ...
      return [v1Body, ...v2Additions].join("\n");
  - node: rules/chat/chat-prompt-presents-catalog
    held_at: |-
      nowhere
    evidence: |-
      The rule applies from v3 on, and this is v2. The file ignores the catalog itself and only forwards it: "const v1Body = v1System(catalog);".
looked_past: |-
  The header and inline comments cite chat.back.md BR numbers and claims about an env flag and marker stability, but they are prose only and outside this judgment. The directive that the assistant ingests only on the owner's explicit request and treats document content as data is emitted text that agrees with the candidate rules assistant-writes-only-on-owner-request and chat-content-is-data, so it is no finding.
