findings:
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      BLOCK_4B_SEARCH_DISCIPLINE, lines 77-95 (directives 1 and 2, the search and node-listing discipline)
    evidence: |-
      "1. A ferramenta `search` e LEXICA E TEM SEMANTICA `AND` sobre o texto",
      "   NUNCA concatene varios nomes proprios numa unica chamada `search`",
      "2. `list_nodes` DEVE ser chamada COM um filtro `node_type` quando voce",
      "   `list_nodes` SEM `node_type` para responder \"o que foi ingerido\"",
    cost: |-
      The prompt sent to the model sets the usage rules for the search and node-listing tools: one name per search call, and a node-type filter on every listing. No node holds them, and the prompt is the only place they appear. Someone reading the specification to learn how the chat assistant searches will not find them. When the search or listing behavior changes, nothing points at this text.
    kind: unstated
    correction: |-
      Analysis would give the assistant's search and listing discipline a node in the chat context, and the prompt would then state what that node holds.
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      BLOCK_4C_DIRECTED_INGESTION, lines 99-105 (the opening paragraph naming the trigger phrases)
    evidence: |-
      "esta playbook quando — e SOMENTE quando — o dono pedir explicitamente",
      "para registrar conhecimento novo. Frases de gatilho tipicas: \"crie\",",
      "\"registre\", \"linke\", \"ingerir esta informacao\". Se nao houver",
    cost: |-
      The node says only that directed ingestion is called when the owner's own message asks to record knowledge. The prompt adds a concrete list of signal phrases ("crie", "registre", "linke", "ingerir esta informacao") that steers what counts as a request. Only the prompt holds that list. A change to what counts as an owner request would be made here, and the specification would not show it.
    kind: unstated
    correction: |-
      Either the owner-request rule or a new chat node holds the signal phrases, or the prompt drops them and keeps only what the node states.
    node: rules/chat/assistant-writes-only-on-owner-request
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      BLOCK_4C_DIRECTED_INGESTION directive 3 (DATAS), lines 119-127
    evidence: |-
      "   true`) e o dono NAO disser uma data, voce DEVE perguntar a data ao",
      "   dono ANTES de chamar `ingest_directed`. NAO chame `ingest_directed`",
      "   sem `valid_from` confiando no fallback `received` — esse fallback e",
    cost: |-
      The prompt makes the assistant ask the owner for a date before recording a temporal link or attribute, and tells it not to rely on the server's `received` fallback. No node holds that conversational rule. The specification's directed-ingestion rules hold the server defaults only. A reader of the specification would expect the assistant to record the knowledge with the fallback date.
    kind: unstated
    correction: |-
      Analysis would give the assistant's ask-for-a-date duty a node in the chat context.
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      BLOCK_4C_DIRECTED_INGESTION directive 4 (ATRIBUTOS), lines 128-135
    evidence: |-
      "4. ATRIBUTOS. Grave APENAS atributos que o dono declarou. NAO infira",
      "   (mesma regra das datas). Para atributos de DOMINIO FECHADO (o bloco de",
    cost: |-
      The prompt restricts the assistant to attributes the owner stated. It also tells the assistant to ask before recording an attribute that looks useful but was not stated. No node holds this. It decides what the assistant may write into the owner's knowledge base, and it lives only in prompt text.
    kind: unstated
    correction: |-
      Analysis would give the record-only-what-the-owner-stated rule a node in the chat context.
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      BLOCK_4C_DIRECTED_INGESTION directive 5 (UMA UNICA CHAMADA POR COMANDO), lines 136-145
    evidence: |-
      "5. UMA UNICA CHAMADA POR COMANDO. A dispatcher executa o payload INTEIRO",
      "   NAO faca auto-loop — NAO chame `ingest_directed` repetidamente para",
      "   tentar consertar itens rejeitados. Apos a resposta, RELATE ao dono,",
    cost: |-
      The prompt sets two things: one `ingest_directed` call per owner command, with no retry of rejected items, and an item-by-item report to the owner. Only the prompt holds both. Whether the assistant may retry a failed directed ingestion, and what it must tell the owner afterwards, is a business decision nobody can find in the specification.
    kind: unstated
    correction: |-
      Analysis would give the one-call-per-command rule and the duty to report each item's outcome a node or nodes in the chat context.
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      BLOCK_4C_DIRECTED_INGESTION, the PLAYBOOK POS-INGESTAO section, lines 150-172
    evidence: |-
      "1. Use `result.run.affected_nodes` como PRIMEIRA via de consulta — esse",
      "   diretamente em `get_node(id)` e/ou `traverse(start_node_id=id,",
      "   depth=2)`. Descreva APENAS o que essas chamadas retornaram.",
      "2. Cite a fonte: o campo `raw_information_id` retornado por",
    cost: |-
      The prompt sets the recipe for answering "show what was ingested": affected nodes first, a traversal of depth 2, a fallback to a single-name search, and citing the raw information identity. No node holds that recipe. A change to how the assistant reports prior ingestions would be made in prompt text and would not show in the specification.
    kind: unstated
    correction: |-
      Analysis would give the post-ingestion consultation recipe a node in the chat context.
