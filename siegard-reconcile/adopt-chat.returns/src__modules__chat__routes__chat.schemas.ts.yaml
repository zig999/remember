findings:
  - file: src/modules/chat/routes/chat.schemas.ts
    where: |-
      buildChatTurnRequestSchema and ChatMessageSchema, lines 27-58 (the v1 carry-over block)
    evidence: |-
      .min(1, "messages must contain at least 1 entry")
      .max(
        opts.maxHistoryMessages,
        `messages must contain at most ${opts.maxHistoryMessages} entries`
      ),
      ...
      .refine((v) => v.messages[0]?.role === "user", {
        message: "first message must have role=user",
        path: ["messages", 0, "role"],
      });
    cost: |-
      The file exports a request shape that carries a history bound and a first-message-must-be-user rule. No node holds either. The contract's send-message operation takes one content string and a model, and the chat contract says the surface is carried by REST alone. The next reader who wants to know what a chat turn may carry would find a stateless multi-message contract here and nowhere in the specification. The schema is unused, per its own comment.
    kind: unstated
    correction: |-
      Either remove the unused v1 export, or have the analysis give the v1 stateless turn shape a node if it is still meant to exist. The specification's send-message operation does not include it.
  - file: src/modules/chat/routes/chat.schemas.ts
    where: |-
      UpdateConversationRequest .refine message, lines 89-99
    evidence: |-
      message:
        "VALIDATION_REQUIRED_FIELD: at least one of title or archived_at must be present",
      ...
      // The `.refine` failure renders as `VALIDATION_INVALID_FORMAT` via the
      // global ZodError handler.
    cost: |-
      The node answers a conversation update that names no field with HTTP 422, code VALIDATION_REQUIRED_FIELD, and the message "at least one of title or archived_at must be present". For a body that is an object naming neither field, this schema fails the refine and, by its own comment, renders VALIDATION_INVALID_FORMAT. It also puts the code name inside the message text, with a prefix the node does not give. A client that branches on the code for an empty update would see a different code depending on whether the body was absent or was `{}`.
    kind: contradicts
    correction: |-
      The refusal for an update naming no field must answer VALIDATION_REQUIRED_FIELD with the node's message text. The schema's refine cannot do this alone while it renders through the ZodError handler.
    node: contracts/chat/conversations
  - file: src/modules/chat/routes/chat.schemas.ts
    where: |-
      comment above SaveGraphViewRequest, lines 179-184
    evidence: |-
      * Size cap on nodes/links (max 2000 each) bounds the JSONB blob.
    cost: |-
      The 2000 bound is stated in prose beside the code that enforces it. If the rule moves, the comment stays behind as a second, stale home for the number. The code holds it in this file at `.max(2000, "nodes must contain at most 2000 entries")` and `.max(2000, "links must contain at most 2000 entries")`.
    kind: restates
    correction: |-
      Remove the comment. The rule is held by the node and by the schema.
    node: rules/chat/graph-view-snapshot-bounds
  - file: src/modules/chat/routes/chat.schemas.ts
    where: |-
      comment above UpdateConversationRequest, lines 78-83
    evidence: |-
      * `PATCH /api/v1/conversations/:id` body. BR-36 — at least one of `title`
       * or `archived_at` must be present; empty body -> 422
       * `VALIDATION_REQUIRED_FIELD`. `null` clears `title`, un-archives on
       * `archived_at`.
    cost: |-
      The prose restates a rule the node holds and the `.refine` in this file enforces (`body.title !== undefined || body.archived_at !== undefined`). It also claims the error code for an empty body. That claim diverges from what the schema emits (see the contradicts finding on this file). A reader who trusts the comment will believe the code is VALIDATION_REQUIRED_FIELD.
    kind: restates
    correction: |-
      Remove the comment.
    node: rules/chat/conversation-update-names-a-field
