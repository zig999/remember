    cost: |-
      The rule that directed nodes enter as active is justified in prose by reference to BR-43. The justification is not a node and could be mistaken for the authority for the rule.
    kind: restates
    correction: |-
      Remove the prose. The code holds the fact in `status: "active"` inside the push in normalizeIngestDirected, line 480.
    node: rules/chat/graph-delta-directed-nodes-active
  - file: src/modules/chat/service/graph-normalizer.ts
    where: |-
      normalizeIngestDirected, line 460, in the envelope guard
    evidence: |-
      export function normalizeIngestDirected(
        result: unknown,
        catalog: CatalogSnapshot
      ): GraphDeltaWire | null {
        if (!isRecord(result)) return null;
    cost: |-
      The node says an unreadable tool result yields a graph delta with no nodes and no links, whatever the tool. Here the directed-ingestion arm yields no delta at all. The decision-log entry on this rule records that only the directed arm diverged. The four other arms return `{ nodes: [], links: [] }` on the same condition. The code and the node disagree, and the code states the opposite rule.
    kind: contradicts
    correction: |-
      Return `{ source_tool: "ingest_directed", nodes: [], links: [] }` when the result is not readable. The comment block at lines 444-448 that asserts the null behavior would go with it.
    node: rules/chat/graph-delta-unreadable-result
  - file: src/modules/chat/service/graph-normalizer.ts
    where: |-
      normalizeToolResult, the ingest_directed arm (lines 597-601) taking the null from normalizeIngestDirected
    evidence: |-
      if (toolName === "ingest_directed") {
        return Promise.resolve(normalizeIngestDirected(result, catalog));
      }
    cost: |-
      The node says a successful result of directed ingestion is followed by a graph delta. When normalizeIngestDirected returns null, the dispatcher passes the null on and no delta follows. This is the same null branch as the finding above, seen from the other node's side.
    kind: contradicts
    correction: |-
      This is closed by the same change as the unreadable-result finding. The directed arm returns a delta on every successful result.
    node: rules/chat/graph-delta-follows-tool-result
