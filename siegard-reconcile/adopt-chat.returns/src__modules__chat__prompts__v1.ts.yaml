  - file: src/modules/chat/prompts/v1.ts
    where: |-
      system() prompt text, principle 3, lines 64-67
    evidence: |-
      "3. NUNCA invente identificadores (uuids), nomes ou aliases. Se voce",
      "   precisa de um id, RESOLVA o nome chamando `search` ou `list_nodes`",
      "   antes de chamar qualquer ferramenta que exige id (`get_node`,",
      "   `traverse`, `get_history_*`, `get_provenance_*`).",
    cost: |-
      The prompt tells the assistant it must resolve a name to an id through `search` or `list_nodes` before any id-taking tool, and must never invent ids. No node holds this behavior rule. It lives only in prompt copy, so the next reader who looks in the specification for what the assistant is told about identifiers will not find it.
    kind: unstated
    correction: |-
      Give the resolve-before-call and never-invent-identifiers behavior a node in the chat context, for example a rule constraining domain/chat/chat-prompt-version.
  - file: src/modules/chat/prompts/v1.ts
    where: |-
      system() prompt text, principle 4, lines 68-70
    evidence: |-
      "4. CITE A FONTE. Toda afirmacao factual deve apontar para o fragmento",
      "   ou o chunk que a sustenta — use as ferramentas `get_provenance_*`",
      "   quando o usuario pedir verificacao.",
    cost: |-
      The prompt requires the assistant to cite the fragment or chunk behind each factual claim, using the provenance tools. No node holds a citation rule for the assistant, so the obligation, and the condition "when the user asks for verification", sit only in prompt copy.
    kind: unstated
    correction: |-
      Give the assistant's citation rule a node in the chat context.
  - file: src/modules/chat/prompts/v1.ts
    where: |-
      system() prompt text, principle 5, lines 71-74
    evidence: |-
      "5. RESPEITE OS EIXOS TEMPORAIS. O grafo distingue eixo de validade",
      "   (`valid_from`/`valid_to`) do eixo de transacao (`recorded_at`/",
      "   `superseded_at`). Quando o usuario perguntar sobre uma data, use",
      "   `get_history_*` para responder com precisao.",
    cost: |-
      The prompt tells the assistant to answer date questions through the history tools, distinguishing the validity axis from the transaction axis. No chat node holds this instruction, so how the assistant is told to handle dates is decided only in prompt copy.
    kind: unstated
    correction: |-
      Give the assistant's temporal-axis behavior a node in the chat context.
