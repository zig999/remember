looked_past: >-
  The `cache_control: { type: "ephemeral" }` on the first system block and its absence on the second is a provider prefix-caching choice that no node holds, so I treated it as an implementation detail and not as a domain fact. The prose-only statements, such as "Must be >= 1" for `recentLimit` and the "Renamed from `systemPrompt` at v2.9" history, are not code facts and belong to the comment route.
