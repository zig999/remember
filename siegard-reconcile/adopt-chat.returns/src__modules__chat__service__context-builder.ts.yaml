findings:
  - file: src/modules/chat/service/context-builder.ts
    where: >-
      the module header comment, lines 11-14, and the `recentLimit` doc comment, lines 93-100
    evidence: |-
      //   2. The last `env.CHAT_RECENT_WINDOW` REAL TURNS via
      //      `repository.listRecentRealTurns` (BR-31 v2.9 — turn-based, not row-
      //      based; returns every row of each selected turn including scaffolding,
      //      already sorted ASC by the repo).
      ...
      * row-based; typically `env.CHAT_RECENT_WINDOW`, default 6). A real turn is
      * one user `chat_message` row with `idempotency_key IS NOT NULL`; the
      * repository returns ALL rows of each selected turn
    cost: |-
      The window rule is written as prose here, with its definition of a real turn and the default of 6. The code that enforces it is in another file, `backend/src/modules/chat/repository/chat.repository.ts`. There, `listRecentRealTurns` selects on `role = 'user' AND idempotency_key IS NOT NULL ... OFFSET $2` and returns the rows from that boundary on. A reader who changes the window rule can be misled into treating this comment as its home. The node does not bind this prose, so it would not be refreshed when the node moves.
    kind: restates
    correction: >-
      Remove the prose. The code in chat.repository.ts already holds the rule, and the node holds the statement.
    node: rules/chat/model-context-window
  - file: src/modules/chat/service/context-builder.ts
    where: >-
      the comment above the `sanitizeAnthropicSequence(windowMessages)` call, lines 201-209
    evidence: |-
      // v2.2 (faithful multi-row persistence): the COUNT-bounded recent window can
      // begin or end in the MIDDLE of a tool-bearing turn (a leading
      // `user[tool_result]` whose `assistant[tool_use]` fell outside the window, a
      // trailing dangling `assistant[tool_use]`, or an empty-content row). Trim
      // those boundary artefacts so the replayed sequence is valid by construction
    cost: |-
      The prose restates which messages are dropped from the history: empty rows, leading assistant and tool-result messages, and trailing tool requests. The code that does it is `sanitizeAnthropicSequence` in `backend/src/modules/chat/service/message-sequence.ts`: `messages.filter((m) => hasBlocks(m.content))`, the front trim and the tail trim. This file holds none of that. If the rule changes, the comment becomes a second home that nothing checks.
    kind: restates
    correction: >-
      Remove the prose. `message-sequence.ts` already holds the rule, and the node holds the statement.
    node: rules/chat/model-context-well-formed
