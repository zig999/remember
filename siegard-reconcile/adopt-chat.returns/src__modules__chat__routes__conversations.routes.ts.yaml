      tryWrite(
        reply,
        frameJson("done", {
      ...
        case "provider_error":
        case "internal_error":
        default:
          return "end_turn";
    cost: |-
      A replay of a turn recorded as provider-error or internal-error streams a done event with stop reason end_turn, so the owner's client reads a failed turn as a successful one. The node requires an error event, as the live turn closed with, and the contract says so in the replay clause of send-message. The replay never emits an error frame, so the failure is hidden on resend.
    kind: contradicts
    correction: |-
      On replay, when the recorded stop reason is provider_error or internal_error, stream the error frame that turn closed with instead of done.
    node: rules/chat/replay-reports-failure
