  - file: src/modules/chat/routes/conversations.routes.ts
    where: |-
      sendMessage handler, steps (1) to (3), lines 592-633: the Idempotency-Key header check and the body parse run before the kill-switch check
    evidence: |-
      // ---- (1) Idempotency-Key header — checked FIRST per spec (BR-26 has
      //          precedence over conversation lookup). Missing -> 422
      ...
