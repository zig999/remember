      ...
      // ---- (3) Kill-switch (BR-14).
      if (killSwitchTripped(deps.env)) {
        return sendKillSwitch(reply);
      }
    cost: |-
      The node says a sent message is checked for a disabled chat first, and the contract says the disabled-chat refusal is "answered before anything else is checked". With CHAT_ENABLED=false, a request with a missing or malformed Idempotency-Key, an invalid conversation id or invalid content gets a 422. The caller expects HTTP 503 BUSINESS_CHAT_DISABLED. The other eight handlers check the kill switch first, so send-message is the one endpoint whose refusal order differs from its node.
    kind: contradicts
    correction: |-
      Move the kill-switch check ahead of the Idempotency-Key header check in the sendMessage handler, as the other handlers already do.
    node: rules/chat/send-message-check-order
