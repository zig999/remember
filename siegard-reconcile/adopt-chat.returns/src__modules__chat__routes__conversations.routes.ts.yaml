    cost: |-
      The node says a successful result of the traversal, the node read, the node listing, search or directed ingestion is followed by a graph delta. The code skips the graph_delta frame whenever the catalog dependency is absent. It also skips the frame whenever normalization throws, and only logs a warning. The owner's graph view then silently lacks nodes for a tool result that succeeded. The refusal or skip rule exists only here.
    kind: contradicts
    correction: |-
      Either make the catalog a required dependency and let a normalization failure be handled as the specification states it (rules/chat/graph-delta-unreadable-result), or record the degraded-skip behavior in a node.
    node: rules/chat/graph-delta-follows-tool-result
