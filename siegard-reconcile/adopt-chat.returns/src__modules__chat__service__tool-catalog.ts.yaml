findings:
  - file: src/modules/chat/service/tool-catalog.ts
    where: |-
      the header comment block, lines 20-24 ("Why `undefined` on a `query`-portion miss?")
    evidence: |-
      // Why `undefined` on a `query`-portion miss? BR-05: "if any of the 13 query
      // names is missing at resolution time, the resolver returns `undefined` and
      // the route is not registered". A missing query tool is a deployment bug —
      // the route registrar logs a single ERROR with the diff and does NOT serve a
      // degraded chat surface.
    cost: |-
      The rule that chat does not run on a partial query toolset is written out a second time as prose. The code already holds it in buildChatToolCatalog (`if (missingQuery.length > 0) { ... return undefined; }`). The prose cites a back-spec rule number as its authority. When the node moves, this comment goes stale without anything flagging it.
    kind: restates
    correction: |-
      Remove the comment. The fact stays held by the `missingQuery` branch of buildChatToolCatalog, which returns `undefined`.
    node: rules/chat/chat-toolset-requires-every-query-tool
  - file: src/modules/chat/service/tool-catalog.ts
    where: |-
      the header comment lines 1-6 and the doc comments on CHAT_TOOL_NAMES (lines 37-38) and CHAT_INGEST_TOOL_NAMES (lines 57-63)
    evidence: |-
      // Lazy tool-catalog resolver — looks up the read-only `query`-toolset tools
      // in the in-process `McpServer` registry (BR-05 v2.4) AND, when the feature
      // flag `env.CHAT_INGEST_ENABLED === true`, one additional `ingest`-toolset
      // tool (`ingest_directed` — BR-44 v2.8).
      /** The 13 read-only `query`-toolset tools the chat agentic loop is always
       *  allowed to call (BR-05 v2.4 step 1). */
    cost: |-
      The composition of the assistant's toolset appears again as prose, with its own count ("13") and its own citations. The code holds it in the `CHAT_TOOL_NAMES` and `CHAT_INGEST_TOOL_NAMES` arrays and in the `ingestFlag` branch. If the toolset changes, the prose keeps saying the old count.
    kind: restates
    correction: |-
      Remove the comments. The toolset stays held by the `CHAT_TOOL_NAMES` and `CHAT_INGEST_TOOL_NAMES` declarations and the `if (ingestFlag)` resolution branch.
    node: constraints/chat-toolset
