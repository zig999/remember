  - file: src/modules/chat/repository/chat.repository.ts
    where: |-
      the query of listMessagesPaginated, lines 791-804
    evidence: |-
      WHERE conversation_id = $1${beforeClause}${displayFilter}
            ORDER BY created_at ASC, id ASC
            LIMIT ${limitParam}
      ...
        const hasMore = rows.length > limit;
        const items = hasMore ? rows.slice(0, limit) : rows;
    cost: |-
      The node says a page is the most recent messages created before its moment. This query orders ascending and keeps the first `limit` rows, so each page is the oldest messages before the moment. When more exist, the page is cut from the old end. A next-page moment taken from the oldest item of that page selects nothing older, so a long conversation cannot be paged back to its newest messages. The decision log records this same defect against the node.
    kind: contradicts
    correction: |-
      Select the most recent `limit` messages before the moment (descending scan with the limit), then answer them oldest first, so that hasMore means older messages remain.
    node: rules/chat/message-listing-pages-backwards
