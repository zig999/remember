  - file: src/features/graph/api/use-graph-persistence.ts
    where: >-
      the timer callback in handleStoreChange, lines 136-138
    evidence: |-
      const snapshot = useGraphStore.getState().getSnapshot();
      // nodes.size guard already passed — double-check after debounce.
      if (snapshot.nodes.length === 0) return;
    cost: >-
      The code applies a second refusal when the wait ends: a save is skipped if the pane has emptied during the 800 ms. The node requires at least one node only at the moment of the change. The step lives only here, so the next reader looks for it in the specification and does not find it.
    kind: unstated
    correction: >-
      Give the fact a place in the save-guard rule, or in a sibling rule, stating whether the node count is re-checked when the wait ends.
    node: rules/graph-explorer/a-change-saves-only-with-a-conversation-and-nodes
