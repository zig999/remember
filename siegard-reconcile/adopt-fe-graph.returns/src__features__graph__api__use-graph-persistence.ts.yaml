    cost: >-
      The version history and the "v2 adds layout_algorithm" rule are told in prose next to the type that declares them. The comment cites a ticket and a table name the node does not carry.
    kind: restates
    correction: >-
      Remove the prose. The union type and the `snapshot.version === 2` branch hold the fact.
