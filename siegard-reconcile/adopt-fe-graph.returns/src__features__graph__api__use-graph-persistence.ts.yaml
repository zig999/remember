  - file: src/features/graph/api/use-graph-persistence.ts
    where: >-
      the catch comments, lines 104-106 and 147-149
    evidence: |-
      // Restore is best-effort — a network error / 404 leaves the graph
      // in its cleared state (the user sees an empty graph until the next
      // turn produces a fresh delta). Do not surface the error.
      // Save is best-effort — a transient failure is silent. The next
      // user interaction will trigger another debounced save attempt.
    cost: >-
      Prose states that failures are silent, and also what happens afterwards (the user sees an empty graph, the next interaction saves again). The empty catch blocks hold the silence, and the node holds no retry. A reader gets a second, wider account of failure behavior that the node does not state.
    kind: restates
    correction: >-
      Remove the prose. Silence is held by `catch {}` and `.catch(() => {})`, and the no-retry rule by the absence of any re-send.
    node: rules/graph-explorer/view-failures-are-silent
  - file: src/features/graph/api/use-graph-persistence.ts
    where: >-
