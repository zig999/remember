      the SuccessView body, lines 39-147. It renders the header with name, type and state badge, the "Curar" action, the aliases section, the attributes section and `<NodeRelationshipsSection nodeId={data.id} />`.
    evidence: |-
      <PanelHeader title={data.canonicalName} ... /> ... <section className="mt-md"> <h3 ...>{NODE_DETAIL_COPY.aliasesHeading}</h3> ... <NodeRelationshipsSection nodeId={data.id} />
