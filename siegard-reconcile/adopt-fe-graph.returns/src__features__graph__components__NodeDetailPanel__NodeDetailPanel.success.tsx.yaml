      {data.aliases.length === 0 ? (<p ...>{NODE_DETAIL_COPY.noAliases}</p>) : (<ul aria-label={NODE_DETAIL_COPY.aliasesHeading} ...>{data.aliases.map((alias) => (<li key={alias.id} ...><span>{alias.alias}</span>{alias.kind === "canonical" && (<span ...>(canônico)</span>)}
  - node: rules/graph-explorer/attributes-are-listed-as-received
    held_at: |-
      the attributes section, lines 111-144
    evidence: |-
      {data.attributes.length === 0 ? (<p ...>{NODE_DETAIL_COPY.noAttributes}</p>) : (<table ...><thead>...{NODE_DETAIL_COPY.attrColKey}...{NODE_DETAIL_COPY.attrColValue}...{NODE_DETAIL_COPY.attrColState}...</thead><tbody>{data.attributes.map((attr) => (<NodeAttributeRow key={attr.id} attr={attr} />))}
  - node: rules/graph-explorer/curar-needs-a-target
    held_at: |-
      the conditional render of the button, lines 54-72
    evidence: |-
      {curationTarget !== null && (<button ref={curateButtonRef} type="button" onClick={onCurate} data-testid="node-detail-curate" ...>...{NODE_DETAIL_COPY.curate}</button>)}
