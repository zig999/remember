  - node: rules/graph-explorer/node-detail-reads-share-a-key-by-node
    held_at: |-
      graphNodeKeys.detail and graphNodeKeys.relationships, lines 24 and 27. The key is by node id. The relationships key sits under a separate prefix, so the detail key does not cover it. The placeholder id for the case with no node is not in this file, because detail only takes an id string.
    evidence: |-
      detail: (id: string) => ["nodes", id] as const,
      relationships: (id: string) => ["graph", "node", id, "relationships"] as const,
