findings:
  - file: src/features/graph/components/NodeDetailPanel/NodeDetailPanel.shell.tsx
    where: |-
      ErrorView, the PanelHeader call at lines 131-135
    evidence: |-
      <PanelHeader
        title={NODE_DETAIL_COPY.errorNotFound}
        closeRef={closeRef}
        onClose={onClose}
      />
    cost: |-
      The header title is always "Nó não encontrado.", whatever the variant. A node whose read failed with BUSINESS_NODE_DELETED or with a generic failure therefore shows the not-found message in the header, above an alert that carries the deleted or generic message. The owner is told two different things at once. No node says the failure header shows any text, so the not-found header title is a fact the code applies that the specification does not hold.
    kind: contradicts
    correction: |-
      The header should either carry the variant's own message or carry no title, as the loading view does when no label was given. The specification should say which, in the rule on node failure wording or in the contract's show-node-detail answer.
    node: rules/graph-explorer/a-node-failure-reads-its-wording
  - file: src/features/graph/components/NodeDetailPanel/NodeDetailPanel.shell.tsx
    where: |-
      the docstring of classifyError, lines 17-18
    evidence: |-
      /** Classify a top-level `useNodeDetail` error code into the state row to
       *  render. 404 / 410 are terminal — only `generic` gets a retry button. */
    cost: |-
      The docstring restates the classification and retry rule a second time as prose. It also speaks of HTTP statuses 404 and 410, while the code keys on the codes RESOURCE_NOT_FOUND and BUSINESS_NODE_DELETED. If the node moves, this text is not reached by `--check`, and it names different identifiers from the ones the code uses. The code holds the fact at lines 20-24 and at `const showRetry = variant === "generic";`.
    kind: restates
    correction: |-
      Remove the prose by the comment route. The fact stays held by the node and by the code.
    node: rules/graph-explorer/a-failed-node-read-is-an-alert
read:
