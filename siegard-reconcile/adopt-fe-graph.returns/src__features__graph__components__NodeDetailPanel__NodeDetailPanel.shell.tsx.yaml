      const showRetry = variant === "generic"; ... role="alert" ... {showRetry && ( <button type="button" onClick={onRetry} data-testid="node-detail-retry"
  - node: rules/graph-explorer/a-node-failure-is-classified-by-its-code
    held_at: |-
      classifyError, lines 19-25
    evidence: |-
      if (err === null || typeof err !== "object") return "generic"; const code = (err as { code?: unknown }).code; if (code === "RESOURCE_NOT_FOUND") return "not-found"; if (code === "BUSINESS_NODE_DELETED") return "deleted"; return "generic";
  - node: rules/graph-explorer/a-node-failure-reads-its-wording
    held_at: |-
      the message selection in ErrorView, lines 122-127. The header title at line 132 shows the not-found message for every variant (see the finding).
    evidence: |-
      const message = variant === "not-found" ? NODE_DETAIL_COPY.errorNotFound : variant === "deleted" ? NODE_DETAIL_COPY.errorDeleted : NODE_DETAIL_COPY.errorGeneric; ... <PanelHeader title={NODE_DETAIL_COPY.errorNotFound}
  - node: rules/graph-explorer/the-close-button-takes-focus
    held_at: |-
      Only the name is held here: the aria-label on the close button at line 60, with the button receiving closeRef at line 57. The code that moves focus on mount and on a node id change is not in this file, which only receives the ref. NodeDetailPanel.tsx is the file in the candidate index bound to it.
    evidence: |-
      <button ref={closeRef} type="button" onClick={onClose} aria-label={NODE_DETAIL_COPY.close}
  - node: rules/graph-explorer/the-loading-view-says-it-is-loading
