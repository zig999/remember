  - node: rules/graph-explorer/curation-target-follows-the-node
    held_at: |-
      deriveCurationTarget, lines 24-39
    evidence: |-
      if (data.status === "needs_review") {
          return { kind: "entity_match", itemId: data.id };
        }
        for (const attr of data.attributes) {
          if (
            attr.effectiveStatus === "uncertain" ||
            attr.effectiveStatus === "disputed"
          ) {
            return { kind: "disputed", itemId: attr.id };
          }
        }
        return null;

looked_past: |-
  The `NodeCurationTarget` interface declares a shape that is a code-structure matter, and the `SelectedItemKind` import from the curation store is a dependency, not a domain fact stated here.