findings:
  - file: src/features/graph/components/NodeDetailPanel/NodeDetailPanel.curation.ts
    where: |-
      the header docblock, lines 1-15
    evidence: |-
      * The "Curar" button on the panel header surfaces two distinct curation
      * targets, mutually exclusive:
      *  - `needs_review` nodes belong to the **entity_match** queue (BFF emits
      *    one queue row per `needs_review` node — keyed by `node_id`).
      *  - Nodes with at least one `uncertain`/`disputed` attribute have a
      *    contextual `disputed` target (uncertain is a display flag, not a
      *    dedicated queue, so the drawer surfaces it via the disputed family +
      *    the attribute id).
    cost: |-
      The docblock states in prose the same rule that `deriveCurationTarget` implements: the entity-match target for `needs_review`, otherwise the disputed target for an `uncertain` or `disputed` attribute, otherwise none. If the node moves, the comment keeps asserting the old rule. Nothing checks it, and a reader may take it for the authority. The comment also describes the queue and display-flag semantics, and no code here carries those.
    kind: restates
    correction: |-
      Remove the docblock. The code in this file already holds the rule and the node holds it too, so this is the comment route followed by `/reconcile` over the file.
    node: rules/graph-explorer/curation-target-follows-the-node

