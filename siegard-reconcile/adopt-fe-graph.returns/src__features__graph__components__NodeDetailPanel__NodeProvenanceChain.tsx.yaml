    where: >-
      the docblock of classifyProvenanceError, lines 37-41
    evidence: |-
      * Codes are namespaced (`RESOURCE_NOT_FOUND`, `BUSINESS_RAW_INFORMATION_DELETED`,
      * `SYSTEM_*`). Anything else falls back to `generic`.
    cost: >-
      The comment says any other code is `generic`. The node, and the code under the comment
      (`return "unknown";`), make `generic` only a `SYSTEM_` code and `unknown` everything else.
      A reader who trusts the comment will look for a `generic` fallback that does not exist.
      The two variants read the same wording today, so the mismatch is invisible on screen.
    kind: restates
    correction: >-
      Remove the sentence. The classification is held by the function body, where
      `startsWith("SYSTEM_")` gives `generic` and the final `return "unknown"` covers the rest.
    node: rules/graph-explorer/an-origin-failure-is-classified-by-its-code
