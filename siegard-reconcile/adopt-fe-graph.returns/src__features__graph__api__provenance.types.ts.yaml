findings:
  - file: src/features/graph/api/provenance.types.ts
    where: >-
      the `ProvenanceKind` declaration, line 19. The header comment at lines 9-12 lists the three URL shapes.
    evidence: |-
      export type ProvenanceKind = "links" | "attributes" | "fragments";
      (header comment) GET /api/v1/provenance/fragments/:fragment_id
    cost: >-
      The graph-explorer contract holds only the link and attribute provenance reads. This file declares a
      third read, `fragments`, that no graph-explorer node holds. The `fragments` provenance read is held
      only by the curation-workspace contract. A reader checking what the node detail panel may call
      finds two operations in the graph-explorer node and three in the code, and the third is stated in
      another feature's contract.
    kind: unstated
    correction: >-
      Either the graph-explorer contract gains a `read-fragment-provenance` operation, or the declared
      vocabulary stops carrying a read the graph-explorer specification does not hold. The curation
      contract names this read for the curation screen, not for the node detail panel.
    node: contracts/curation-workspace/bff-curation-reads
