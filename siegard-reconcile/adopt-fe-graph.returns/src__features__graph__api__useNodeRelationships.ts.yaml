findings:
  - file: src/features/graph/api/useNodeRelationships.ts
    where: |-
      the file docstring, line 2-3 (header line)
    evidence: |-
      * useNodeRelationships — GET /api/v1/nodes/:id/traverse?depth=1&direction=both
    cost: |-
      The depth and direction of a node's relationships read are written a second time in prose beside the code that sends them. When the node changes, a reader can mistake this header for the place the rule lives, and `--check` never reaches a comment.
    kind: restates
    correction: |-
      Remove the prose. The fact stays held by the request path in the queryFn, which sends `?depth=1&direction=both`.
    node: rules/graph-explorer/relationships-are-read-at-depth-one-both-ways
  - file: src/features/graph/api/useNodeRelationships.ts
    where: |-
      the file docstring, lines 10-12 (Spec references, first bullet)
    evidence: |-
      *    "useNodeRelationships hook" — query key, staleTime 5min, enabled gate.
    cost: |-
      The 5-minute freshness window is restated in a comment. Code holds it twice in this file (`STALE_MS` and `staleTime: STALE_MS`). The prose is a second home that would go stale unnoticed if the node moved.
    kind: restates
    correction: |-
      Remove the prose. The fact stays held by `const STALE_MS = 5 * 60_000;` with `staleTime: STALE_MS` and `refetchOnWindowFocus: false`.
    node: rules/graph-explorer/a-read-stays-fresh-five-minutes
