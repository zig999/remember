findings:
  - file: src/features/graph/components/GraphStatusOverlay/GraphStatusOverlay.tsx
    where: >-
      the className of the GlassSurface card, line 90 (inside the JSX at lines 81-95)
    evidence: |-
      className={cn(
                "pointer-events-auto",
                "flex items-center gap-sm px-lg py-md",
                "min-w-0 max-w-md",
              )}
    cost: >-
      The node says the overlay must not capture the pointer. The outer wrapper does let events through, but the card re-enables them with pointer-events-auto, so the card captures the pointer. Pan, zoom and click on the canvas stop working under the card, which sits at the centre of the canvas. A reader who trusts the node would expect the whole overlay to be transparent to the pointer. The comments in the file (lines 24-27 and 86-88) present the re-enable as intended, so it reads as a decision made in code.
    kind: contradicts
    correction: >-
      Either the card drops pointer-events-auto so nothing in the overlay captures the pointer, or the node is amended through analysis to state the exception. The file cannot decide which.
    node: rules/graph-explorer/the-overlay-lets-the-pointer-through
