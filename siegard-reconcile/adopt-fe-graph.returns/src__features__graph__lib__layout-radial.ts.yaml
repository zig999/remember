findings:
  - file: src/features/graph/lib/layout-radial.ts
    where: |-
      The module docstring (lines 4-9) and the inline comments at lines 84-88 and 145-149, above the `.separation(...)` call and the polar-to-Cartesian projection.
    evidence: |-
      " * `(angle, radius)` then projects to Cartesian `(x, y)` with
       * `x = r·sin(θ)` / `y = -r·cos(θ)`. The negation on y places angle 0 at the
       * top of the canvas"
      "`.separation` is the canonical radial idiom: siblings get a unit gap,
         // cousins twice that, and dividing by `a.depth` keeps inner rings"
      The code holds the same fact: `.separation((a, b) => (a.parent === b.parent ? 1 : 2) / a.depth)`, `const x = radius * Math.sin(theta);` and `const y = -radius * Math.cos(theta);`, with ring 0 given `radius` 0.
    cost: |-
      The comments restate the node's convention a second time (root at the centre, angle 0 at the top, gap 1 for siblings and 2 for other neighbours divided by depth). When the node moves, a comment that no tool checks keeps saying the old numbers, and the next reader cannot tell which one was decided.
    kind: restates
    correction: |-
      Remove the comments, by the route that answers prose. The code in this file already holds the fact.
    node: rules/graph-explorer/radial-layout-puts-the-root-at-the-centre
  - file: src/features/graph/lib/layout-radial.ts
    where: |-
      The module docstring (lines 20-22 and 24-28) and the doc comments on `NODE_FOOTPRINT` (lines 50-54) and `MIN_RING_GAP` (lines 56-59). The inline comments at lines 112-120 repeat the same facts.
    evidence: |-
      " *    r[d] = max( d · MIN_RING_GAP,                       // radial gap between rings
       *                (count[d] · NODE_FOOTPRINT) / (2π) )     // arc ≥ footprint per node
       *    r[d] = max( r[d], r[d-1] + MIN_RING_GAP )            // keep rings monotonic"
      "`r ≥ footprint / (2·sin(π/count))`. With one node on the ring there is no
          // neighbour, so the term is 0."
      The code holds it too: `const NODE_FOOTPRINT = 270;`, `const MIN_RING_GAP = 200;`, `NODE_FOOTPRINT / (2 * Math.sin(Math.PI / count))` for `count >= 2`, and `Math.max(d * MIN_RING_GAP, angularTerm, prevRadius + MIN_RING_GAP)`.
    cost: |-
      The ring-radius rule and its constants 200 and 270 are written in prose several times as well as in code. The docstring formula even uses the arc estimate `count·footprint / 2π`, which differs from the chord formula the code and the node use. A reader who trusts the comment gets a different radius than the one the system computes.
    kind: restates
    correction: |-
      Remove the prose. The code in this file holds the rule, and the node holds the values 200 and 270.
