  - file: src/features/graph/types.ts
    where: |-
      the module docblock, lines 11-13, the GraphNodeData.state docblock, lines 42-43, and the GraphNodeWireStatus docblock, lines 101-103
    evidence: |-
      *  - `GraphNodeData.state` is derived from the node `status` field only —
      *    nodes do not carry `flags` (I-2 — flags live on links). The wire
      *    `GraphNodeWire` therefore intentionally omits a `flags` field.
    cost: |-
      The rule that a node's state follows its status alone is stated in prose in this file. The code that applies it is `deriveNodeState` in src/features/graph/lib/map.ts, which takes only `status`. Someone reading the prose would assume it is the rule, and a change to the specification would never reach it.
    kind: restates
    correction: |-
      Remove the prose. `deriveNodeState(status: GraphNodeWireStatus)` in src/features/graph/lib/map.ts holds the rule, and the node binds to it.
