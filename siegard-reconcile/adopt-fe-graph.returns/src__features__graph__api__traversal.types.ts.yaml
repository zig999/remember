findings:
  - file: src/features/graph/api/traversal.types.ts
    where: |-
      the doc comments on `directionLabel` (lines 63-64) and `directionArrow` (line 67) in `TraversalLinkView`
    evidence: |-
      /** Label rendered for the link kind — `link_type` for outgoing,
       *  `link_inverse_name` for incoming, mirroring spec §9 transform. */
      readonly directionLabel: string;
      ...
      /** `"→"` for outgoing, `"←"` for incoming — used in the row arrow. */
      readonly directionArrow: "→" | "←";
    cost: |-
      The wording-and-arrow rule is stated a second time in prose beside the type. The running code that holds it is in another file (`src/features/graph/api/traversal.transforms.ts`: `directionLabel: isOutgoing ? wire.link_type : wire.link_inverse_name,` and `directionArrow: isOutgoing ? "→" : "←",`). The comment also cites "spec §9", an authority that is not a node. If the node moves, the comment keeps asserting the old wording and nothing flags it.
    kind: restates
    correction: |-
      Remove the two comments. The fact stays in the node and in the code of `traversal.transforms.ts`.
    node: rules/graph-explorer/direction-picks-the-link-wording
  - file: src/features/graph/api/traversal.types.ts
    where: |-
      the header doc comment, lines 8-11
    evidence: |-
      The panel only consumes `depth=1&direction=both` so the surface trims the
      wire payload to the fields actually rendered.
    cost: |-
      The request depth and direction are restated in prose in a file that does not issue the request. The code that holds them is `src/features/graph/api/useNodeRelationships.ts`, which builds `/traverse?depth=1&direction=both`. A change to the node would leave this comment stating the old values.
    kind: restates
    correction: |-
      Remove the sentence. The request parameters stay in the node and in `useNodeRelationships.ts`.
    node: rules/graph-explorer/relationships-are-read-at-depth-one-both-ways
  - file: src/features/graph/api/traversal.types.ts
    where: |-
      the doc comment on `confidenceLabel` in `TraversalLinkView`, line 75
    evidence: |-
      /** `"92%"`-style label for the link confidence. */
      readonly confidenceLabel: string;
    cost: |-
      The percentage format is described in prose beside the type. The format is held by `formatConfidenceLabel` in `src/features/graph/api/_transforms.ts`, which `traversal.transforms.ts` calls. The comment is a second home for the format rule, and nothing reads it.
    kind: restates
    correction: |-
      Remove the comment. The format stays in the node and in `formatConfidenceLabel`.
    node: rules/graph-explorer/confidence-is-a-rounded-percentage

