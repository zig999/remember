  - file: src/features/graph/api/provenance.transforms.ts
    where: >-
      the comment block in toRawInformationView, lines 72-76
    evidence: |-
      // Only set the field when
      // the wire actually carried a value — TS strict `exactOptionalPropertyTypes`
      // forbids assigning `undefined` to an optional property.
    cost: >-
      The rule that original input is carried only when answered is restated in prose. The comment also
