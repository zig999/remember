findings:
  - file: src/features/graph/components/NodeDetailPanel/NodeDetailPanel.copy.ts
    where: >-
      line 19, the attributesHeading entry of NODE_DETAIL_COPY (rendered as the h3 of the attributes section in NodeDetailPanel.success.tsx)
    evidence: |-
      attributesHeading: "Atributos",
    cost: >-
      This is text the system shows the owner, as the heading above the attributes table. No node names that heading. The attributes rule only says "a table of attribute, value and state", and the graph-screen contract lists the aliases and attributes without naming the heading. The wording therefore lives only in this file. A reader looking in the specification for what the attributes section is called will not find it, and a change to the specification cannot reach it.
    kind: unstated
    correction: >-
      Give the attributes section's heading a node, or add it to the existing attributes-are-listed-as-received rule, the way the relationships section is already named "Relações" and the aliases list "Aliases".
    node: rules/graph-explorer/attributes-are-listed-as-received
  - file: src/features/graph/components/NodeDetailPanel/NodeDetailPanel.copy.ts
    where: >-
      the doc comment above originalInputRedacted, line 54
    evidence: |-
      /** Muted indicator shown when `original_input === '[REDACTED]'`. */
    cost: >-
      The comment restates the sentinel condition that rules/graph-explorer/a-redacted-original-input-is-never-shown holds. Code already holds that condition, so the comment is a second home outside behavior. When the rule moves, this comment will still say the old condition.
    kind: restates
    correction: >-
      Remove the comment by the comment route. The condition is held by code in src/features/graph/components/NodeDetailPanel/NodeProvenanceChain.tsx, where originalInput is compared to REDACTED_SENTINEL.
    node: rules/graph-explorer/a-redacted-original-input-is-never-shown
