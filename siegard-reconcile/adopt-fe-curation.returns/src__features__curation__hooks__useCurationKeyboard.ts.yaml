looked_past: >-
  The CurationShortcut values are spelled "prev" and camelCase where the node's enumeration says previous, toggle-check, keep-separate, toggle-help and select-index, and a docstring at lines 27-34 claims the page gates `m` on the item being entity_match with a candidate selected. I did not file the spelling as a finding, and the gating claim is prose only, with no code in this file carrying it.