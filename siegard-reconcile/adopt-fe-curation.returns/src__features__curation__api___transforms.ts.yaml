looked_past: |-
  Absent optional values are normalised differently from node to node: `locator ?? {}`, `metadata ?? {}` and `flags ?? []` become empty containers, while `document_title ?? null` and `valid_from_source ?? null` become null. I read that as a presentation default rather than a domain fact, and the many comments in the file (the sectioned banners, the NaN guard note) are prose I did not file separately.
