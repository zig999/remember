    held_at: |-
      toEntityMatchCandidate, toEntityMatchQueueItem, toDisputedItemSide, toDisputeQueueItem, toReviewQueueItem, toReviewQueueList and toCurationMetrics (lines 115-202). These cover the read side of list-review-queue and read-curation-metrics. The request-sending operations are not in this file.
    evidence: |-
      export function toReviewQueueItem(wire: ReviewQueueItemWire): ReviewQueueItem {
        if (wire.kind === "entity_match") {
          return toEntityMatchQueueItem(wire);
        }
        return toDisputeQueueItem(wire);
      }
      ... acceptRate: wire.accept_rate, rejectRateByCode: wire.reject_rate_by_code, ... entityMatchQueueCount: wire.entity_match_queue_count, disputedQueueCount: wire.disputed_queue_count, computedAt: parseIso(wire.computed_at)
