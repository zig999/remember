  - node: rules/curation-workspace/form-hands-the-request-to-its-caller
    held_at: >-
      the `onSubmit` and `serverError` members of CorrectionFormProps, lines 57-64
    evidence: |-
      readonly onSubmit: (body: CorrectItemRequest) => void;
      readonly serverError?: { readonly code: string; readonly message: string } | null;
  - node: rules/curation-workspace/stated-basis-lists-the-accepted-fragments
    held_at: nowhere
    evidence: |-
      readonly fragmentFilter?: {
        readonly llmRunId?: string;
        readonly rawInformationId?: string;
      };
      The file declares only the filter's shape and forwards it. The listing of accepted fragments in a picker is not here. DateJustification.tsx is where the form acts on the filter.
