findings:
  - file: src/features/curation/components/DecisionPanel/DecisionBar.tsx
    where: >-
      the file header comment, lines 1-17 (and the comment inside gated(), lines 57-59)
    evidence: |-
      * Click handlers fire even when `evidenceViewed=false`? NO — aria-disabled
       * + a guard in the click handler skips the dispatch. This matches BDD
       * Scenario 2 ("nenhuma ação é disparada").
    cost: >-
      The evidence-gate rule (a blocked click sends nothing) is also written as prose in this
      file. When the node moves, a reader may take the comment for the decided rule. The comment
      is not bound to the node, so nothing signals that it has gone stale. The code already holds
      the rule in gated(), which returns before calling handler() when evidenceViewed is false,
      so only the prose is owed removal.
    kind: restates
    correction: >-
      Remove the prose by the comment route. The behavior is already correct and held by
      gated().
    node: rules/curation-workspace/every-decision-waits-for-the-evidence
  - file: src/features/curation/components/DecisionPanel/DecisionBar.tsx
    where: >-
      the toolbar element's accessible name, line 71
    evidence: |-
      role="toolbar"
            aria-label="Ações de decisão"
    cost: >-
      This text is read aloud to screen-reader users, so the system tells someone this label.
      Neither the curation-screen contract nor any node under the specification root states it.
      A grep of the root for "Ações de decisão" and "toolbar" returned nothing. Anyone looking
      for the screen's wording in the specification will not find this string, and no node
      governs a change to it.
    kind: unstated
    correction: >-
      An analysis should decide whether the decision bar's accessible name belongs in
      contracts/curation-workspace/curation-screen, for example under read-decision-panel.
    node: contracts/curation-workspace/curation-screen
