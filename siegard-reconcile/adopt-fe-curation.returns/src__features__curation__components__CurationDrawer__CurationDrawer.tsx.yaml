      line 376, the aria-label of DialogPrimitive.Close in CurationDrawer
    evidence: |-
      <DialogPrimitive.Close
                      aria-label="Fechar curadoria"
                      data-testid="curation-drawer-close"
    cost: |-
      The close button's accessible name is text the running system tells assistive-technology users. It is stated only in this file. The next reader who looks in the specification for what the drawer's close control is called will not find it, and a change of the wording will not reach any node.
    kind: unstated
    correction: |-
      Contracts/curation-workspace/curation-screen, operation open-drawer, would have to state the close control's accessible name, or a node would have to declare that it is not a fact of the business.
    node: contracts/curation-workspace/curation-screen
