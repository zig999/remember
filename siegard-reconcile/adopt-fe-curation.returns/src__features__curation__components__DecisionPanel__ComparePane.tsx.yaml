findings:
  - file: src/features/curation/components/DecisionPanel/ComparePane.tsx
    where: >-
      EntityMatchView, the radiogroup's aria-label (line 71); the same kind of text sits at the DisputeView radiogroup (line 141) and the ComparePane section (line 175)
    evidence: |-
      aria-label="Candidatos para fusão"
      aria-label="Lados em disputa"
      aria-label="Comparação"
    cost: >-
      These are the accessible names announced for the comparison region and for the two selection groups. They are text the screen tells a person using assistive technology. No node states them, and a search of the specification root for these strings found nothing. The wording lives only in this file, so a reader who looks for what the panel announces will not find it in the specification.
    kind: unstated
    correction: >-
      The analysis would have to give the accessible names a node, most naturally the read-decision-panel operation of contracts/curation-workspace/curation-screen.
    node: contracts/curation-workspace/curation-screen
  - file: src/features/curation/components/DecisionPanel/ComparePane.tsx
    where: >-
      EntityMatchView, the radiogroup branch (lines 68-93). It renders the "Múltiplos candidatos" line before the empty-candidates check, and it is also the branch taken by a single candidate outside summary presentation.
    evidence: |-
      <p className="text-xs text-foreground">
        Múltiplos candidatos — escolha qual representa a mesma entidade.
      </p>
      {item.candidates.length === 0 ? (
        <p className="text-xs text-body">
          Nenhum candidato sugerido. Você pode manter separados ou fundir
    cost: >-
      The node gives each hint its own case: "for several candidates 'Múltiplos candidatos — escolha qual representa a mesma entidade.', for none 'Nenhum candidato sugerido. Você pode manter separados ou fundir ad-hoc por busca.'". The code shows both hints when there are no candidates. It also shows "Múltiplos candidatos" for a single candidate in full presentation. The owner is told to choose among several candidates when there are none or only one, and the node does not say that is intended.
    kind: contradicts
    correction: >-
      Either the node would have to state that the "Múltiplos candidatos" hint also shows for none and for a single candidate outside summary presentation, or the code would have to show that hint only for several candidates.
    node: contracts/curation-workspace/curation-screen
