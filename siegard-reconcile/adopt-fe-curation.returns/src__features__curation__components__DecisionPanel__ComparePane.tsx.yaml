looked_past: >-
  The header comment and the DisputeSubject comment cite spec sections and say the panel HEADER shows the subject node and relation, and the prop comment says a SELF_MERGE_FORBIDDEN refusal highlights the candidate. Those facts belong to nodes outside this set and are held by code in DecisionPanel and CandidateCard, so they are prose for the comment route and not findings here.