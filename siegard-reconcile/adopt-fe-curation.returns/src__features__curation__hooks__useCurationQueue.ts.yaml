    where: |-
      the file's header docstring, lines 1-15, against `refetchIntervalInBackground: false` at line 42
    evidence: |-
      * Local copy of `useListReviewQueue` that pins
      * `refetchIntervalInBackground: false` (TC-04 constraint #4).
      ...
      * The TC-04 contract requires the
      * stricter "only while tab visible" behaviour
    cost: |-
      The docstring restates the node's "read again every thirty seconds while the tab is visible" in prose that no running system emits. It cites a "TC-04 constraint #4" and a `spec_divergences` entry as the authority. A reader who trusts the docstring looks for the fact in those places and not in the node. Once the node moves, the docstring stays behind with no check reaching it.
    kind: restates
    correction: |-
      Remove the docstring. The behavior is already held by code in this file (`refetchIntervalInBackground: false` and `refetchInterval: QUEUE_POLL_MS`) and by the node, so nothing is lost.
    node: rules/curation-workspace/queue-is-read-again-on-every-read-poll-and-focus
  - file: src/features/curation/hooks/useCurationQueue.ts
    where: |-
      `QUEUE_POLL_MS`, `staleTime`, `refetchInterval` and `refetchOnWindowFocus` in the useQuery options (lines 23, 40-43), a second copy of the hook in api/curation.hooks.ts
    evidence: |-
      const QUEUE_POLL_MS = 30_000;
      ...
      staleTime: 0,
      refetchInterval: QUEUE_POLL_MS,
      refetchIntervalInBackground: false,
      refetchOnWindowFocus: true,
      // the other copy, src/features/curation/api/curation.hooks.ts line 74 and line 127:
      const QUEUE_POLL_MS = 30_000;
      refetchInterval: QUEUE_POLL_MS,
    cost: |-
      The queue refresh policy is implemented in two live hooks. This one is `useCurationQueue`. The other is `useListReviewQueue`, which CurationDrawer.tsx calls. Nothing makes either read the other. When the node's thirty-second interval or its visibility behavior changes, one copy can move and the other stay, and nobody can tell which one was decided. The docstring itself says the two already differ on `refetchIntervalInBackground`.
    kind: contradicts
    correction: |-
      The queue refresh policy needs one home in code. Which hook keeps it is for a person to decide, and code cannot read the specification to resolve it. Whichever hook remains is the one the node should be bound to.
    node: rules/curation-workspace/queue-is-read-again-on-every-read-poll-and-focus
