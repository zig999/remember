    held_at: |-
      nowhere. QueueTabs is a controlled component. The start value and the guarantee that no address is written belong to the parent page, which this file does not contain.
    evidence: |-
      export const QueueTabs: FC<QueueTabsProps> = ({ value, onChange }) => {
      onValueChange={(next) => onChange(keyToFilter(next))}
  - node: rules/curation-workspace/tabs-choose-the-queue-kind
    held_at: |-
      the TABS array and keyToFilter, lines 40-49. The tab maps to a filter that is undefined for all and the kind entity_match or disputed otherwise. The read of the queue from that filter happens in the parent, not here.
    evidence: |-
      { id: undefined, label: "Tudo", key: ALL_SENTINEL },
      { id: "entity_match", label: "Entidades", key: "entity_match" },
      { id: "disputed", label: "Disputas", key: "disputed" },
      if (key === ALL_SENTINEL) return undefined;
looked_past: |-
  The docstring claims that the parent persists the filter in URL search and that "?queue=" is reserved for a later TC, while the active-tab rule says the tab is written to no address. No code in this file holds that claim. It is prose that I did not file as a finding, and a comment-removal route would answer it. The tablist role, the Radix Tabs wiring and the redundant defaultValue next to value are implementation choices, not domain facts.