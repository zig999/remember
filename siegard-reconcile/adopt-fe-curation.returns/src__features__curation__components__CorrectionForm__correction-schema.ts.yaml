looked_past: >-
  The docstring and the line 13 comment claim uuid validation of the link target ("Top-level `z.uuid()`", "link target — uuid validation"), but no code in the file performs it and the node denies any format check. That is prose alone, a claim no running code holds, and its route is the removal of the comment.