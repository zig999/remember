findings:
  - file: src/features/curation/components/CorrectionForm/correction-schema.ts
    where: >-
      line 48, the `itemKind` field of `correctionSchema`; also the literal unions `"link" | "attribute"` in `CorrectionRawDefaults` (line 112) and `buildCorrectItemRequest` (line 146)
    evidence: |-
      itemKind: z.enum(["link", "attribute"]),
    cost: >-
      The file declares which kinds of item can be corrected, link and attribute, and no node in the set or in the specification root holds that vocabulary as an enumeration. domain/knowledge-base/item-kind holds node, link and fragment, and its decision log excludes attribute as a kind. The next reader who looks in the specification for the kinds a correction accepts finds a different enumeration, and the real one lives only in this schema. The correction contract nodes name `item_kind` only as a body field and give it no values.
    kind: unstated
    correction: >-
      Analysis would give the curation item kind (link or attribute) a node of its own, separate from the search item kind, and bind this file to it.
  - file: src/features/curation/components/CorrectionForm/correction-schema.ts
    where: >-
      docstring at lines 11-17, listing the pt-BR messages
    evidence: |-
      * Single-owner pt-BR messages match §5 exactly:
       *  - "Informe o valor corrigido." (atributo)
       *  - "Selecione o nó-alvo da fusão." (link target — uuid validation)
       *  - "Data inválida. Use o formato AAAA-MM-DD."
       *  - "O início deve ser anterior ao fim."
       *  - "Selecione o fragmento que justifica a data."
       *  - "Informe um motivo para continuar."
    cost: >-
      The same texts are held a second time in prose. If the node changes a message, this docstring keeps the old one, and nothing reads it. The code that emits these messages is in this same file, so only the prose needs removing.
    kind: restates
    correction: >-
      Remove the docstring paragraph. The messages are held by the `message:` strings in this file and by the node.
    node: contracts/curation-workspace/curation-screen
  - file: src/features/curation/components/CorrectionForm/correction-schema.ts
    where: >-
      comment at lines 24-25 above `optionalString`
    evidence: |-
      /** Empty string is treated as "not provided" — RHF defaults always render
       *  a controlled string but the request DTO accepts null. */
    cost: >-
      The empty-means-null rule is stated in prose beside the code that implements it, so it has two homes.
    kind: restates
    correction: >-
      Remove the comment. The `transform` in `optionalString` and `dateString` holds the rule.
    node: rules/curation-workspace/empty-correction-field-is-sent-as-null
  - file: src/features/curation/components/CorrectionForm/correction-schema.ts
    where: >-
      comment at line 81 above the start-before-end check
    evidence: |-
      // Temporal coherence (§5).
    cost: >-
      The comment cites a section of a document as the authority for the start-before-end rule. A reader may take that document as the home of the rule and not the node.
    kind: restates
    correction: >-
      Remove the comment. The check `data.validFrom >= data.validTo` holds the rule.
    node: rules/curation-workspace/correction-start-precedes-the-end
  - file: src/features/curation/components/CorrectionForm/correction-schema.ts
    where: >-
      comment at line 92 above the stated-basis check
    evidence: |-
      // valid_from_source=stated requires the fragment id (BR-15).
    cost: >-
      The comment cites BR-15, a rule identifier from an outside document, as the owner of the fragment requirement. It points the reader away from the node that holds it.
    kind: restates
    correction: >-
      Remove the comment. The `validFromSource === "stated" && validFromFragmentId === null` branch holds the rule.
    node: rules/curation-workspace/stated-basis-needs-a-fragment
  - file: src/features/curation/components/CorrectionForm/correction-schema.ts
    where: >-
      docstring at lines 138-144 above `buildCorrectItemRequest`
    evidence: |-
      * Map validated form values to the `CorrectItemRequest` wire body — the
       * single source of the snake_case shape submitted by CorrectionForm
       * (openapi.yaml CorrectItemRequest / CorrectedValues). `itemKind` selects
       * `value` (attribute) vs `target_node_id` (link); the remaining fields are
       * passed through as the validated (possibly-null) values.
    cost: >-
      The docstring claims to be the single source of the request body shape, and it cites openapi.yaml as its authority. That is a second claim of authority over what the node holds, in prose no system reads.
    kind: restates
    correction: >-
      Remove the docstring. The returned object holds the shape.
    node: rules/curation-workspace/correction-sends-the-item-the-values-and-the-reason
