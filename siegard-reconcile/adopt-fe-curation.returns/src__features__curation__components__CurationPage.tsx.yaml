findings:
  - file: src/features/curation/components/CurationPage.tsx
    where: |-
      the header docblock, line 28 (Responsibilities owned HERE)
    evidence: |-
      *  - Deep-link `?item=<kind>:<id>` resolution + auto-select-first.
    cost: |-
      The docblock states the address format of the selected item a second time, outside any running behavior. The code holds that fact in `parseItemSearchParam` and `stringifyItemSearchParam` in src/features/curation/state/curation-store.ts, and the page itself uses the `item` key at `search: next !== undefined ? { item: next } : {}`. If the node moves, this prose is not reached and keeps saying the old format.
    kind: restates
    correction: |-
      Remove the line. The code in the store and in `handleSelect` holds the fact, and the node binds it.
    node: rules/curation-workspace/selected-item-is-carried-in-the-address
  - file: src/features/curation/components/CurationPage.tsx
    where: |-
      the header docblock, line 29, and the comment at line 98
    evidence: |-
      *  - Polling pill: when `data.total` grows above `lastSeenTotal`.
    cost: |-
      The docblock restates the new-item count rule as prose. The code holds the rule at lines 99-105 (`Math.max(0, total - lastSeenTotal)` and `updateLastSeen(total)` only while `lastSeenTotal === null`). The prose omits the clamp at zero and the baseline moving only on the pill click, so it would mislead a reader who trusts it over the code.
    kind: restates
    correction: |-
      Remove the prose. The `delta` computation and the baseline effect are where the fact is held.
    node: rules/curation-workspace/new-item-count-is-the-total-minus-the-baseline
  - file: src/features/curation/components/CurationPage.tsx
    where: |-
      the header docblock, lines 35-36 (Deferred), against the render tree at lines 168-265
    evidence: |-
      * Deferred (not yet wired here): BatchBar multi-select dispatch (the queue
      * checkbox state exists; the batch action bar is a follow-up).
    cost: |-
      The node says the screen offers the batch bar ("N selecionados" with "Manter separados N", "Confirmar N" and "Rejeitar N"). The page builds its checked set (`onToggleCheck` calls `setSelectedItems(next)`) but mounts no BatchBar. In the whole non-test tree under src/features/curation, BatchBar appears only in its own files and in comments, and nothing renders it. The owner can check items, but nothing on the screen acts on the checked set. The comment says as much, yet the node reads as if the capability exists. Which of the two is the decision is not stated anywhere.
    kind: contradicts
    correction: |-
      Either the page mounts the bar over `checkedIds`, or the node is narrowed to what the page delivers. That choice is for a person.
    node: contracts/curation-workspace/curation-screen
  - file: src/features/curation/components/CurationPage.tsx
    where: |-
      the comment at lines 107-108 above `handleSelect`
    evidence: |-
      // Selection callback — mirrors the choice into the URL (replace, no back-
      // stack pollution) so a reload / share-link reproduces the same view.
    cost: |-
      The comment restates the rule that selecting writes the item to /curation replacing the history entry. The code holds it in the same file at `void navigate({ to: "/curation", ..., replace: true })`. The prose adds a rationale (reload and share-link) that no node states, so it is a second home for the fact outside behavior.
    kind: restates
    correction: |-
      Remove the comment. The `navigate` call holds the fact.
    node: rules/curation-workspace/selecting-writes-the-item-to-the-address
  - file: src/features/curation/components/CurationPage.tsx
    where: |-
      the comment at lines 128-129 above `metricsFallback`
    evidence: |-
      // R1 fallback for MetricsStrip — best-effort per-kind counts from the
      // loaded page (≤20 items). Only consulted when metrics errors out.
    cost: |-
      The comment restates the metrics fallback rule and states a page size of 20. The code holds the counting at lines 130-138. The page size of 20 is held in src/features/curation/hooks/useCurationQueue.ts (`const QUEUE_LIMIT = 20;`). The number in the comment can drift from that constant without anything noticing.
    kind: restates
    correction: |-
      Remove the comment. The loop counting entity_match entries toward one queue and every other entry toward the other is where the fact is held.
    node: rules/curation-workspace/page-counts-loaded-entries-as-the-metrics-fallback
  - file: src/features/curation/components/CurationPage.tsx
    where: |-
      the region names at lines 185 and 247
    evidence: |-
      aria-label="Fila de curadoria"
      aria-label="Painel de decisão"
    cost: |-
      These are the accessible names the screen announces for its two regions. They are text the running system emits, and no node holds them. The screen contract lists its other labels and messages exactly, so a reader looking in the specification for what the screen says will not find these two. A change to them would have to be made in code alone.
    kind: unstated
    correction: |-
      Give the region names a home in curation-screen, or decide they are surface and not domain. That decision is for the analysis.
    node: contracts/curation-workspace/curation-screen
  - file: src/features/curation/components/CurationPage.tsx
    where: |-
      line 200, the page heading
    evidence: |-
      <h2 className="text-lg font-semibold tracking-tight text-foreground">Curadoria</h2>
    cost: |-
      The visible title of the queue column is emitted text. The only "Curadoria" the node holds is the title of the overlay (the open-drawer operation); the page heading is held by nothing. The next reader of the node cannot learn from it what the page titles itself.
    kind: unstated
    correction: |-
      Add the page title to the show-queue answer in curation-screen, or decide it is surface.
    node: contracts/curation-workspace/curation-screen
