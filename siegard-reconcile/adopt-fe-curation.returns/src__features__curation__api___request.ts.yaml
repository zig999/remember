looked_past: |-
  I saw a comment-only claim that curation calls have a "sub-second p95 budget", the `httpStatus: 0` and `details: { cause: String(err) }` values on the timeout, abort, network and invalid-JSON failures, the `__setCurationRedirectForTests` test seam, and the cross-feature duplication rationale for `authHeader`. I did not report them: the first is prose no code holds, the second and third are error-object construction and test plumbing rather than a domain fact, and the last is a code-structure convention.