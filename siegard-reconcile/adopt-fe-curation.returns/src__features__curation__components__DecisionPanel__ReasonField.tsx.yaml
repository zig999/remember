    where: >-
      The `required` prop and its default (lines 38-39, 48), the conditional asterisk (line 89), and the placeholder branch (lines 100-104).
    evidence: |-
      /** Marks the field as required in the label rendering. */
        readonly required?: boolean;
      ...
        required = false,
      ...
        {required ? <span aria-hidden="true"> *</span> : null}
      ...
          required
            ? "Explique brevemente a decisão (obrigatório)."
            : "Explique brevemente a decisão (opcional)."
    cost: >-
      The node says the reason field is always rendered and always marked as required. This file makes the marking optional, defaults it to off, and has an "(opcional)" placeholder that tells the owner the reason is optional. Any caller that omits `required` shows the owner an unmarked field that is announced as optional. The rule is not held where the field is declared, so a reader of the node cannot see that the code leaves room to break it.
    kind: contradicts
    correction: >-
      The field should always be marked as required, with no prop and no optional branch, or the node should state when the field is optional. The code cannot be made to read the node, so the owner of the node or of the code has to settle which of the two is right.
    node: rules/curation-workspace/reason-field-always-shows-as-required
