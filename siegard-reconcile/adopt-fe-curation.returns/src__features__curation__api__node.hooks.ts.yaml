read:
  - node: contracts/curation-workspace/bff-curation-reads
    held_at: |-
      Partly. The request side of read-node, read-link-history and read-attribute-history is held in the queryFn of `useCurationNodeDetail`, `useLinkHistory` and `useAttributeHistory`. The wire shapes (`NodeDetailWire`, `LinkHistoryResponseWire`, `AttributeHistoryResponseWire`) are declared in `../types`, and this file only passes them along. read-link-provenance, read-attribute-provenance, read-fragment-provenance and list-accepted-fragments are not in this file.
    evidence: |-
      `/api/v1/nodes/${encodeURIComponent(nodeId as string)}${buildNodeQs(params)}`
      `/api/v1/links/${encodeURIComponent(linkId as string)}/history`
      `/api/v1/attributes/${encodeURIComponent(attributeId as string)}/history`
  - node: rules/curation-workspace/node-detail-sends-its-options-only-when-asked
    held_at: |-
      the function buildNodeQs, lines 57-65
    evidence: |-
      if (params.asOf !== undefined) search.set("as_of", params.asOf);
      if (params.inEffectOnly === true) search.set("in_effect_only", "true");
      if (params.includeUncertain === false)
        search.set("include_uncertain", "false");
  - node: rules/curation-workspace/read-without-an-identifier-is-not-requested
    held_at: |-
      the `enabled` constant in each of the three hooks, lines 79, 102 and 125. The accepted-fragments half of the rule is not in this file.
    evidence: |-
      const enabled = typeof nodeId === "string" && nodeId.length > 0;
      const enabled = typeof linkId === "string" && linkId.length > 0;
      const enabled = typeof attributeId === "string" && attributeId.length > 0;
  - node: rules/curation-workspace/stable-reads-stay-fresh-for-five-minutes
    held_at: |-
      STABLE_STALE_MS at line 42, and the `staleTime` and `refetchOnWindowFocus` options of the three useQuery calls for node detail and lineage history. Provenance and accepted fragments are not in this file.
    evidence: |-
      const STABLE_STALE_MS = 5 * 60_000; // 5 min
      staleTime: STABLE_STALE_MS,
      refetchOnWindowFocus: false,
looked_past: |-
  The query key `nodeKeys.detail(nodeId ?? "")` ignores `params`, so reads with different `as_of` values would share one cache entry. That is a code-quality concern about the hook, not a domain-fact finding. I also did not report the docstring's note on duplication with `features/graph`, which is not a fact of any node.