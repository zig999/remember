    where: >-
      useListReviewQueue, line 113
    evidence: |-
      const limit = params.limit ?? 20;
    cost: >-
      The default page size of twenty is written a second time here, as the literal that derives the cache-key page. The node that holds it is a candidate bound to src/features/curation/hooks/useCurationQueue.ts, not to this file. If that default changes there, the cache pages derived here silently disagree. `--check` does not reach this file when the node moves.
