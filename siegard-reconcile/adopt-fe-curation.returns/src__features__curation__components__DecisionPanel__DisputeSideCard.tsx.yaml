findings:
  - file: src/features/curation/components/DecisionPanel/DisputeSideCard.tsx
    where: >-
      SOURCE_LABEL (lines 20-26), and the "Vigência:", "Fonte:" and "Confiança" captions in the metadata span (lines 85-89)
    evidence: |-
      stated: "Declarada",
        document: "Doc.",
        received: "Receb.",
      ...
      Vigência: {fmt(side.validFrom)} – {fmt(side.validTo)} ·{" "}
      Fonte: {SOURCE_LABEL[side.validFromSource]} ·{" "}
      Confiança {(side.confidence * 100).toFixed(0)}%
    cost: >-
      The node requires "the label of its valid-from basis" but never states what the labels are. The three words "Declarada", "Doc." and "Receb." exist only in this file. The date-justification form is the only place the specification gives wording for the same three bases ("Data do documento", "Data de recebimento"), and that wording differs from these. The next reader who looks in the specification for what a person sees as the basis of a disputed side will not find it, and the two vocabularies can drift apart unnoticed. The captions "Vigência:", "Fonte:" and "Confiança" are likewise stated in no node.
    kind: unstated
    correction: >-
      The node that governs a side's validity basis would have to state the label of each of the three bases, and the captions of the validity, basis and confidence fields. The analysis that gives these facts a node closes this. The code cannot read the specification, so the bind is what closes it.
    node: rules/curation-workspace/side-shows-its-validity-basis-and-confidence
  - file: src/features/curation/components/DecisionPanel/DisputeSideCard.tsx
    where: >-
      the StateBadge rendered inside each side (line 83)
    evidence: |-
      <StateBadge state="disputed" size="sm" />
    cost: >-
      Every side card carries a disputed state badge. The specification only states a header badge (Para revisar / Disputado) and says nothing about a badge on each side. The next reader who looks in the specification for what a side shows will not find this element, and what it displays lives only in the badge component and this call.
    kind: unstated
    correction: >-
      The analysis would have to decide whether a side shows a state badge and give that fact a node. If the specification holds it, nothing is owed here.
  - file: src/features/curation/components/DecisionPanel/DisputeSideCard.tsx
    where: >-
      the file's header docstring, lines 1-6
    evidence: |-
      Spec: curadoria.feature.spec.md §10 (feature-local), §11 (full-diff mode
       * lists all sides). Selection sets the `winner_id` for `prefer_one`.
    cost: >-
      The docstring is a second home outside behavior for the rule that every side is listed and that selecting a side makes it the winner. It also cites a feature spec outside the specification root as authority, so a reader may take it for the decision rather than the node.
    kind: restates
    correction: >-
      Remove the docstring. The fact is held by code in src/features/curation/components/DecisionPanel/DecisionPanel.tsx (`winner_id: selectedSide`) and in ComparePane.tsx, which renders each DisputeSideCard.
    node: rules/curation-workspace/every-side-is-listed-and-selectable
  - file: src/features/curation/components/DecisionPanel/DisputeSideCard.tsx
    where: >-
      the comment inside fmt(), lines 29-31
    evidence: |-
      // Format in UTC: valid_from/valid_to are DATE-ONLY values parsed to UTC
        // midnight. Formatting in local time (BR = UTC-3) would shift them back a
        // day (2026-06-17 → 16/06). UTC keeps the stored calendar date.
    cost: >-
      The comment states again the rule that dates show as pt-BR calendar dates in UTC. The code already holds it in this same function (`timeZone: "UTC"`), so the comment is a second home for the rule and would go stale on its own.
    kind: restates
    correction: >-
      Remove the comment. The rationale belongs in the decision log of the node.
    node: rules/curation-workspace/dates-show-as-pt-br-calendar-dates-in-utc
