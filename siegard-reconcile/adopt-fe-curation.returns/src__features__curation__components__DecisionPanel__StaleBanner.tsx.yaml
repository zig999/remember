    held_at: |-
      the Alert and its Button in the StaleBanner return, lines 20-32. Only the read-decision-panel stale-item answer is held here; the other operations of the node are held in other files.
    evidence: |-
      <Alert variant="warning" role="alert" className={className} action={<Button type="button" size="sm" variant="outline" onClick={onReload}> ... Recarregar </Button>}>
        Este item mudou desde que você o abriu.
      </Alert>
  - node: rules/curation-workspace/stale-item-shows-the-notice-with-a-reload
    held_at: |-
      the StaleBanner component, lines 18-34. The Recarregar Button's onClick is wired to the onReload prop, and the notice text is rendered. Whether the banner is shown only for a stale item is decided by the caller, not in this file.
    evidence: |-
      <Button type="button" size="sm" variant="outline" onClick={onReload}>
          <RefreshCw aria-hidden="true" className="size-4" />
          Recarregar
        </Button>
looked_past: |-
  The variant="warning" styling, the RefreshCw icon and the role="alert" are surface presentation that no node states, so I did not file them as domain facts.