findings:
  - file: src/features/curation/components/DecisionPanel/StaleBanner.tsx
    where: |-
      the file's docstring, lines 1-7
    evidence: |-
      * Spec: curadoria.feature.spec.md §2 UI-10 — "StaleBanner aparece sobre o
      * DecisionPanel (não bloqueia, mas avisa): ícone refresh-cw, 'Este item
      * mudou desde que você o abriu. [Recarregar]' (bg-warning)." §8: role=alert.
    cost: |-
      The docstring restates the stale notice text and the Recarregar action as though a document outside the specification governed them. The JSX below already holds both. When the node moves, the docstring still carries the old wording and cites a feature spec that the framework's check never reaches, so a reader can take it for the decided text.
    kind: restates
    correction: |-
      Remove the docstring. The fact is already held by the node and implemented by the JSX in this file, so the prose is a second home and not a source. Take the comment route, followed by /reconcile over this file.
    node: contracts/curation-workspace/curation-screen
read:
