findings:
  - file: src/features/curation/types.ts
    where: |-
      line 27, the ItemKind type
    evidence: |-
      export type ItemKind = "link" | "attribute";
    cost: |-
      The type is named ItemKind, the name of the node that holds "node | link | fragment" (what a search item stands for). It declares the values of a different node, assertion-kind ("link | attribute"). A reader who follows the name to the specification finds a different vocabulary. When assertion-kind moves, `--check` does not reach this file, because the trace binds this file to item-kind and not to assertion-kind.
    kind: contradicts
    correction: |-
      The vocabulary this type declares is held by domain/knowledge-base/assertion-kind, so that node is the one the bind to this file should name. domain/knowledge-base/item-kind has no declaration here and should not stay bound to this file. Source cannot read the specification, so the correction is the bind and not a change to the code.
    node: domain/knowledge-base/assertion-kind
  - file: src/features/curation/types.ts
    where: |-
      line 38-43, the EffectiveStatus type
    evidence: |-
      export type EffectiveStatus =
        | "active"
        | "uncertain"
        | "disputed"
        | "superseded"
        | "deleted";
    cost: |-
      The node declares six values, including inactive, which is how an ended assertion reads. This type has five. The inactive value that the node defines for an ended assertion cannot be typed on AttributeDetailWire.effective_status, LinkDetailWire.effective_status, AttributeDetail or LinkDetail. A reader of this file would conclude that inactive is not a status the screen can receive.
    kind: contradicts
    correction: |-
      The EffectiveStatus union has to carry "inactive" as the node lists it.
    node: domain/knowledge-base/effective-status
  - file: src/features/curation/types.ts
    where: |-
      the header docstring, lines 1-20, the passage on bare-body answers and envelope unwrapping
    evidence: |-
      KG/QR envelopes are unwrapped (the curation REST domain is bare-body on
       * 2xx — see curadoria.feature.spec.md §6).
    cost: |-
      The docstring is a second statement, outside any behavior, of how the screen reads the curation answers (the bare 2xx body, the unwrapping of the other answers). It cites a document under docs/specs as its authority and not a node. Code holds the fact too, so this prose is a second home that can drift from it.
    kind: restates
    correction: |-
      Remove the passage. The fact lives in the code (src/features/curation/api/_request.ts, "2xx — bare body", line 220) and in the node. The docstring also cites docs/specs paths, which are not specification nodes.
    node: contracts/curation-workspace/bff-curation
