findings:
  - file: src/features/curation/hooks/useDecisionDispatch.tsx
    where: >-
      handleError, the vanished-code branch (lines 323-335), the call to advance() at line 333
    evidence: |-
      if (VANISHED_CODES.has(code)) {
              if (optimisticId !== null) {
                onItemRemove(optimisticId);
              }
              toast.warning(vanishedToastMessage(code));
              setStale(code === "BUSINESS_REVIEW_NOT_PENDING" ||
                code === "BUSINESS_ITEM_NOT_DISPUTED");
              advance();
              return;
            }
    cost: >-
      A decision refused with a code meaning the item is gone moves the selection to the next item and adds one to the session's resolved count (advance() calls setSelectedItem and incrementResolved). For a destructive decision this is a second move on top of the one made when it was dispatched. No node says that a refusal moves on or counts as resolved. The curation-screen contract says only "with the item removed", and destructive-decision-moves-on-twice names two moves, at dispatch and on server acceptance. The resolved count therefore moves by a rule that lives only in this hook, and a reader looking in the specification will not find it.
    kind: unstated
    correction: >-
      The analysis would give this fact a node: whether a gone-item refusal moves on and counts as resolved, for immediate decisions and for destructive ones separately. It could also decide that it does not, in which case the code changes.
