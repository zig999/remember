findings:
  - file: src/features/curation/components/QueueItem.tsx
    where: |-
      the file header docstring (lines 1-19) and the docstring above formatRelative (lines 37-41)
    evidence: |-
      relative "Há Ns" timestamp
      ...
      Pretty-print a Date into a coarse pt-BR "Há …" relative label. Buckets
       * are intentionally coarse: the queue is volatile (refetches every 30s)
    cost: |-
      The age wording is stated in prose as "Há Ns", while the code emits "agora", "há N min", "há N h", "há N d" and a pt-BR date. A reader who trusts the docstring learns a second, different age vocabulary outside the specification. No running system emits this prose, so removing it is the whole remedy.
    kind: restates
    correction: |-
      Remove the docstring wording. The bucket rule is held by the code in formatRelative (the lines `if (min < 1) return "agora";`, `if (min < 60) return \`há ${min} min\`;` and so on) and by the node. The same prose also states a 30s refetch interval that no code in this file holds; that is not a finding here.
    node: rules/curation-workspace/item-age-reads-in-minutes-hours-and-days
  - file: src/features/curation/components/QueueItem.tsx
    where: |-
      the comment above the useMemo call in QueueItem (lines 96-99)
    evidence: |-
      // `formatRelative` is pure but the `now` it closes over would otherwise
        // re-compute on every render. Memoise against `createdAt` so the label
        // is stable while the row is on screen
    cost: |-
      This prose restates the rule that an item's age does not advance while the item is open. The code holds it in `useMemo(() => formatRelative(item.createdAt), [item.createdAt])`, so the comment is a second home for the rule. If the memoisation is later removed, the comment would keep claiming a rule the code no longer keeps.
    kind: restates
    correction: |-
      Remove the comment. The fact is held by the useMemo dependency on `item.createdAt` and by the node.
    node: rules/curation-workspace/item-age-is-measured-from-a-fixed-reference
  - file: src/features/curation/components/QueueItem.tsx
    where: |-
      the comment inside handleKey (lines 106-109), plus the docstring lines 14-17 and the `onSelect` prop doc (line 33)
    evidence: |-
      // Enter and Space are the standard listbox-option activators. The
          // browser already fires `click` on these for <button>, but we keep
          // an explicit handler so future migrations to `<div role="option">`
          // do not lose the affordance.
    cost: |-
      The rule that the owner selects by click, Enter or Space is restated in prose while the code holds it in `onClick={() => onSelect(itemKey)}` and in `if (event.key === "Enter" || event.key === " ")`. The comment is a second home for the rule and adds a rationale (future migration to a div) that no node holds.
    kind: restates
    correction: |-
      Remove the prose. The fact is held by the onClick and onKeyDown handlers and by the node.
    node: rules/curation-workspace/owner-selects-by-click-enter-or-space
