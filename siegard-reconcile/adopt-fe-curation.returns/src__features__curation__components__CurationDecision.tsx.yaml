    where: |-
      the file docstring, lines 11-14 ("Auto-advance"), and the comment inside getNextItem, lines 56-57
    evidence: |-
      * Auto-advance: on a successful destructive commit the dispatch hook calls
      *    `getNextItem()` and advances the page selection (the drawer hosts a single
      *    item and has no "next"). We advance via the queue ring (`neighbour`).
      // Advance through the queue ring on a successful commit. We read the
      // live selection from the store so the lookup is never stale.
    cost: |-
      The rule that the next item is the ring neighbour of the current selection, taken from the queue as last loaded, is stated a second time in prose. Code holds it in `neighbour(queue, useCurationStore.getState().selectedItem, "next")`. When the node moves, nothing reads these comments, so a reader may take them for the rule.
    kind: restates
    correction: |-
      Remove the two comments. The code is where the fact is held, and the node binds it.
    node: rules/curation-workspace/decision-moves-to-the-ring-neighbour
  - file: src/features/curation/components/CurationDecision.tsx
    where: |-
      the file docstring, lines 15-18 ("onItemRemove/onItemRestore are no-ops"), and the comment at lines 60-61
    evidence: |-
      * `onItemRemove`/`onItemRestore` are no-ops: the page does not keep its own
      *    item list (the queue is server-cached and the mutation's
      *    `invalidateQueries` refetches it); selection movement is handled by
      // The page has no local item list — the queue refetch (mutation
      // invalidateQueries) removes the row; selection moves via `advance`.
    cost: |-
      The rule that the page never removes or restores a decided item, because the list changes only when the queue is read again, is restated in prose. Code holds it in `onItemRemove: () => {}` and `onItemRestore: () => {}`. The comments also describe the refetch mechanism, so a later change to that mechanism leaves them stating a fact nobody maintains.
    kind: restates
    correction: |-
      Remove the comments. The two empty handlers hold the fact, and the node binds them.
    node: rules/curation-workspace/page-does-not-remove-a-decided-item-itself
  - file: src/features/curation/components/CurationDecision.tsx
    where: |-
      the docstring of provenanceContextOf, lines 29-34, and the comment before armedImmediately, lines 66-67
    evidence: |-
      * Derive the `(itemKind, itemId)` for the ProvenanceTrail. `entity_match`
      * items carry no link/attribute id of their own (provenance lives on the
      * candidate nodes), so they get no trail — the ComparePane summary IS the
      * evidence and the panel arms immediately.
      // entity_match has no provenance hook → evidence is the ComparePane summary,
      // so arm immediately. Otherwise ProvenanceTrail.onEvidenceViewed flips it.
    cost: |-
      The rule that an entity-match entry's evidence counts as viewed as soon as it opens is stated in prose. Code holds it in `const armedImmediately = provenance === null;` and `const effectiveEvidenceViewed = armedImmediately || evidenceViewed;`. The comments also give a reason, that provenance lives on the candidate nodes. The specification does not state that reason, so it reads as a decision made here.
    kind: restates
    correction: |-
      Remove the docstring and the comment. If the reason for the rule belongs to the business, it goes to the node or its decision log, not to source.
    node: rules/curation-workspace/entity-match-evidence-counts-as-viewed-at-once
