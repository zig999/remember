findings:
  - file: src/features/curation/components/DecisionPanel/CandidateCard.tsx
    where: |-
      lines 63-72, the progressbar span: its aria-label and its visible text
    evidence: |-
      aria-label="Similaridade com o nó proposto"
      ...
      Similaridade {pct} de 100
    cost: |-
      This is text the screen emits to the owner and to assistive technology. It states the similarity as "Similaridade N de 100" and names the compared node "o nó proposto". No node holds either wording; the grep for "Similaridade" over the specification root returned nothing. The next reader looks in the specification for what the candidate card says and does not find it. The wording therefore lives only in this file, and no node's change reaches it.
    kind: unstated
    correction: |-
      The analysis would give the candidate card's similarity label and its progressbar accessible name a home, most likely in the curation-screen read-decision-panel answer. The rule candidate-shows-its-similarity-as-a-percentage only constrains the percentage value and the canonical name, not this wording.
    node: contracts/curation-workspace/curation-screen
  - file: src/features/curation/components/DecisionPanel/CandidateCard.tsx
    where: |-
      the file docstring, lines 4-5
    evidence: |-
      Selecting a candidate sets the merge target_node_id.
    cost: |-
      Prose states the rule a node already holds. The code that holds it is in another file. DecisionPanel.tsx keeps `selectedCandidate` in state and sends it as `target_node_id: selectedCandidate`. This file only calls `onSelect(candidate.candidateNodeId)`. The docstring is a second home for the rule, and it can drift from the node unnoticed.
    kind: restates
    correction: |-
      Remove the sentence from the docstring.
    node: rules/curation-workspace/selecting-a-candidate-makes-it-the-merge-target
  - file: src/features/curation/components/DecisionPanel/CandidateCard.tsx
    where: |-
      the comment on the `invalid` prop, lines 17-18
    evidence: |-
      When the parent surfaces BUSINESS_INVALID_TARGET_NODE / SELF_MERGE
         *  inline, the card highlights with the error border.
    cost: |-
      Prose restates the self-merge refusal rule, which says to mark the selected candidate invalid. The code holds that marking in two places. DecisionPanel.tsx derives `invalidCandidateId` from `selectedCandidate`, and this file's `aria-invalid` and `border-border-error` classes render it. The comment adds a second home for the rule.
    kind: restates
    correction: |-
      Remove the comment.
    node: rules/curation-workspace/self-merge-refusal-shows-the-fixed-text
