findings:
  - file: src/features/curation/components/ProvenanceTrail/ProvenanceTrail.tsx
    where: |-
      the accessible names of the four render branches, lines 158, 177, 197 and 218
    evidence: |-
      aria-label="Proveniência indisponível"
      aria-label="Erro ao carregar proveniência"
      aria-label="Sem proveniência"
      aria-label="Trilha de evidência"
    cost: |-
      These four labels are what a screen reader announces for the trail's compliance-deleted, failed, empty and loaded states. The specification holds only the visible texts and the loading label "Carregando evidência". A change to the wording is made here, and the next reader looks for it in the specification and does not find it.
    kind: unstated
    correction: |-
      The analysis would give the accessible names of the evidence trail a home in the show-evidence operation, or decide they are not part of the contract.
    node: contracts/curation-workspace/curation-screen
  - file: src/features/curation/components/ProvenanceTrail/ProvenanceTrail.tsx
    where: |-
      the header docstring, lines 12-19 ("Evidence-viewed tracking")
    evidence: |-
      The trail fires `onEvidenceViewed()` exactly once per mount, the FIRST
       *   time either of these happens:
       *     1. The root sentinel enters the viewport (IntersectionObserver,
       *        threshold 0.25 — enough surface visible to count as "viewing").
       *     2. The root receives keyboard focus (Tab navigation lands on it).
    cost: |-
      The once-per-mount, quarter-visible and focus facts are stated in prose as well as in the node. When the node moves, the docstring keeps saying the old rule and nothing reads it. The code that holds the fact is IO_THRESHOLD, firedRef and the focusin listener in this file.
    kind: restates
    correction: |-
      Remove the prose. The code in this file already holds the fact, and the node is the place to read it.
    node: rules/curation-workspace/trail-signals-that-the-evidence-was-viewed-once
  - file: src/features/curation/components/ProvenanceTrail/ProvenanceTrail.tsx
    where: |-
      the comments at lines 82-83 and 94-95
    evidence: |-
      // Detect the compliance-tombstone case explicitly — keeps the
        // decision-bar gate closed (caller never sees onEvidenceViewed).
      // Only observe when there IS evidence to view (compliance tombstone
        // case must keep the gate closed — see spec §6 row).
    cost: |-
      The rule that the viewed signal does not fire on a loading, failed or compliance-deleted trail is repeated in comments beside the code. The comments also name a "decision-bar gate" and a "spec §6 row" that no node of this set holds, so they point a reader to a second home. The code that holds the fact is `dataReady = !isPending && !isError && data !== undefined`, which gates the effect.
    kind: restates
    correction: |-
      Remove the comments. The `dataReady` gate holds the fact.
    node: rules/curation-workspace/viewed-signal-never-fires-on-a-failed-trail

