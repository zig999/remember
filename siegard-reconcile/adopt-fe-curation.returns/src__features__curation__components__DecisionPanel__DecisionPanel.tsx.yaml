    evidence: |-
      aria-label="Painel de decisão"
    cost: >-
      This is text the panel tells assistive-technology users, and neither the curation-screen contract's read-decision-panel answer nor any other node holds it. A grep of the specification for "Painel de decisão" finds nothing. The label would live only in this file, so a reader looking in the specification for what the panel announces would not find it.
    kind: unstated
    correction: >-
      Analysis would have to give the panel's accessible name a home in the curation-screen contract, or the label would have to be judged surface.
