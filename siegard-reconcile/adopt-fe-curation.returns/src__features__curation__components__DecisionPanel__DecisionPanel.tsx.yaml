findings:
  - file: src/features/curation/components/DecisionPanel/DecisionPanel.tsx
    where: >-
      the file docstring, line 14 ("ReasonField (always rendered for destructive actions)"), and the comment at lines 201-202 above `const reasonRequired = true;`
    evidence: |-
      *   - ReasonField (always rendered for destructive actions)
      ...
        // Require reason if any destructive button is going to fire.
        const reasonRequired = true;
    cost: >-
      Both comments describe the reason field as conditional on a destructive action. The code renders `<ReasonField ... required={reasonRequired} />` unconditionally, with `reasonRequired` fixed at `true`. A reader trusting the prose would look for a condition that does not exist. The rule is held by that code, so the comments are a second, slightly different statement of it.
    kind: restates
    correction: >-
      Remove both comments. The rule is held by the node and by the unconditional render with `required={reasonRequired}`.
    node: rules/curation-workspace/reason-field-always-shows-as-required
  - file: src/features/curation/components/DecisionPanel/DecisionPanel.tsx
    where: >-
      the file docstring, "Server-error projection (§6)", lines 24-29
    evidence: |-
      * Server-error projection (§6):
      *   - BUSINESS_TEMPORAL_INCOHERENT  -> forwarded to CorrectionForm.
      *   - BUSINESS_CORRECTION_NO_CHANGES -> forwarded to CorrectionForm.
      *   - Other codes              -> generic inline error banner.
    cost: >-
      The prose routes the refusal codes a second time. The code that holds the routing is the exclusion list at lines 245-251 and `serverError={serverError}` passed to `CorrectionSection`. The prose omits BUSINESS_INVALID_TARGET_NODE, BUSINESS_DATE_UNJUSTIFIED and BUSINESS_FRAGMENT_NOT_ACCEPTED, so it already differs from the node. On the day the node moves, a reader would find two routing tables in this file.
    kind: restates
    correction: >-
      Remove the docstring block. The routing is held by the exclusion list in the JSX and by the node.
    node: rules/curation-workspace/correction-refusals-reach-the-form
