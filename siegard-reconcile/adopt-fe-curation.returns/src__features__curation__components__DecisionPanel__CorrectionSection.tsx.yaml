       *  by the DecisionPanel-level banner. */
    cost: |-
      The comment restates which refusals reach the correction form, which is the node's fact. The same function body already holds that fact as code (four `serverError.code ===` comparisons). A reader gets two statements of the code set, and only the code is bound to the node.
    kind: restates
    correction: |-
      Remove the comment. The code in this file already holds the fact.
