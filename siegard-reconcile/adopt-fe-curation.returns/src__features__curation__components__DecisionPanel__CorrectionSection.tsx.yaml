  - file: src/features/curation/components/DecisionPanel/CorrectionSection.tsx
    where: |-
      correctionServerError, lines 36-46 (the filter that decides which server errors the correction form receives)
    evidence: |-
      return serverError.code === "BUSINESS_TEMPORAL_INCOHERENT" ||
          serverError.code === "BUSINESS_CORRECTION_NO_CHANGES" ||
          serverError.code === "BUSINESS_DATE_UNJUSTIFIED" ||
          serverError.code === "BUSINESS_FRAGMENT_NOT_ACCEPTED"
          ? serverError
          : null;
    cost: |-
      The contract's correct-item operation says a BUSINESS_REASON_REQUIRED answer from the server shows "the server's message on the reason field" of the correction. This filter turns that code into `null` before it reaches CorrectionForm. CorrectionForm.tsx, line 50, has `case "BUSINESS_REASON_REQUIRED":`, so it can handle the code but is never given it from this caller. DecisionPanel.tsx instead sends the code to the panel's own ReasonField. So the code reaches only the panel's reason field, never the correction form's reason field, which is where the contract places it. Whether the contract's "reason field" means the form's field or the panel's is not settled by either node, so the owner has to decide it.
    kind: contradicts
    correction: |-
      Either this filter also lets BUSINESS_REASON_REQUIRED through to the form, or the contract's correct-item refusal is restated to say the code lands on the panel's reason field. Which of the two is for the owner to decide.
    node: contracts/curation-workspace/curation-screen
