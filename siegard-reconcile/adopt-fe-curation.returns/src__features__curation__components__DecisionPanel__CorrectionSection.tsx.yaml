    where: |-
      the file's opening docstring, lines 6-9
    evidence: |-
      The parent resets this section on item change by
       * giving it a `key` tied to the item id (remount → fresh state), mirroring
       * the previous in-panel `setCorrectionOpen(false)` reset.
    cost: |-
      The docstring states the node's restart-on-item-change rule a second time, where nothing reads it. The behavior is held by code in both places. Here, `const [open, setOpen] = useState(false);` is the fresh state. In DecisionPanel.tsx, `key={correctionItemId}` on `<CorrectionSection` forces the remount. If the node moves, this prose is a second statement that `--check` never reaches.
    kind: restates
    correction: |-
      Remove the passage from the docstring. The fact stays in the node and in the code, which already holds it (the `key` in src/features/curation/components/DecisionPanel/DecisionPanel.tsx and the initial state here).
