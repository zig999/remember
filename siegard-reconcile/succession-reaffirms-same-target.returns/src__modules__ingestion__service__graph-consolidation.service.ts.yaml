    evidence: >-
      if (sameTarget && args.change_hint !== "correction") { await insertLinkProvenance(client, vigent.id, args.fragment_ids); return { outcome: "consolidated", link_id: vigent.id }; }
  - node: scenarios/knowledge-base/same-target-succession-re-affirms
    held_at: >-
