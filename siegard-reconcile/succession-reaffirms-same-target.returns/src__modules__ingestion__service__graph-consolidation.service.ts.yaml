  - node: rules/knowledge-base/reaffirmation-consolidates
    held_at: >-
      the first branch inside `if (vigent !== null)` in consolidateLinkOnce (lines 344-347) and consolidateAttributeOnce (lines 528-531)
    evidence: >-
      if (sameTarget && args.change_hint !== "correction") { await insertLinkProvenance(client, vigent.id, args.fragment_ids); return { outcome: "consolidated", link_id: vigent.id }; }. No valid_from comparison is made and nothing on the assertion is changed.
  - node: rules/knowledge-base/succession-before-previous-start
    held_at: >-
      the CASE expressions of closeVigentForSuccession (lines 167-181)
    evidence: >-
      valid_to = CASE WHEN valid_from IS NOT NULL AND valid_from >= ${closeExpr} THEN valid_to ELSE ${closeExpr} END, superseded_at = CASE WHEN valid_from IS NOT NULL AND valid_from >= ${closeExpr} THEN now() ELSE superseded_at END
  - node: rules/knowledge-base/succession-closes-previous
    held_at: >-
      the succession branch in consolidateLinkOnce (lines 369-391) and consolidateAttributeOnce (lines 553-575)
    evidence: >-
      functional && !sameTarget && (args.change_hint === "succession" || hasSuccessionSignal(fragmentTexts)), then closeVigentForSuccession(...) and insertLinkRow(..., { supersedes_link_id: vigent.id })
  - node: rules/knowledge-base/succession-closing-date
    held_at: >-
