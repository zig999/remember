certified:
  - node: rules/knowledge-base/conflict-disputes
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: marks that assertion disputed and records a new assertion in status disputed that supersedes nothing, for a link and for an attribute
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: marks the current link disputed and records the new link from A to C in status disputed, superseding nothing
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: takes a proposal as the first of re-affirmation, correction, succession, dispute and new assertion whose condition it meets
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: is the one of its node and type, or the one of its node, type and target or value where the type allows multiple current assertions, and no other
    why: >-
      The tests cover a dispute on a link of a type allowing one current link and on an
      attribute of a key allowing one current value. For each they check three things: the
      new assertion is recorded in status disputed, it supersedes nothing (the only recorded
      row has a null supersedes column), and some update on the same table sets status
      disputed. The precedence and meeting tests also show that a type allowing multiple
      current assertions does not become a dispute. One part goes unexercised: "marks that
      assertion disputed", meaning the assertion that was met. `assignedStatuses` collects the
      status from every update written to the table and never checks which row an update
      addresses. An implementation that wrote its disputed status to some row other than the
      held one would pass every named test, and so would one that wrote it to an identity
      that does not exist. In that case the assertion that was met stays active, so the fact
      has stopped holding, but nothing fails. As the pack directs, I did not open the world
      fixture, so this reading comes from the spec file alone.
    remainder: testable
    remainder_why: >-
      One input: a held current link of a type allowing one current link and, separately, a
      held current attribute of such a key, each met by a proposal with change hint none, no
      fragment signalling succession, and another target or value. Expected result: the
      status-disputed update is addressed to the held assertion's own identity (HELD_LINK_ID
      or HELD_ATTRIBUTE_ID), or reading that held row back shows it in status disputed. This
      goes alongside the existing checks on the newly recorded assertion.
