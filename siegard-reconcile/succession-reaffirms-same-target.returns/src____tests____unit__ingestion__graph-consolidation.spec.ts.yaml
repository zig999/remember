findings:
  - file: src/__tests__/unit/ingestion/graph-consolidation.spec.ts
    where: >-
      the test "closes vigent and inserts a new chained row when functional + different target + textual succession signal", lines 766-771
    evidence: >-
      expect(state.updates[0]!.sql).toContain("ELSE superseded_at");
      with the preceding comment "succession closes the VALIDITY axis only — the close must guard superseded_at conditionally (intra-day fallback), never set it unconditionally."
    cost: >-
      A succession that closes an assertion at the new start leaves its supersession time empty. The test pins that, and the only place it is stated is this assertion. The nearest nodes say that a succession "closes that assertion as superseded", that a correction "supersedes it, leaving its validity end as it was", and that as-of reads show only assertions "without a supersession time". None of them says whether an ordinary succession stamps a supersession time. The next reader will look in the specification, find no answer, and may take the stamp to belong to every supersession.
    kind: unstated
    correction: >-
      The analysis gives rules/knowledge-base/succession-closes-previous, or a sibling node, the statement of what a succession stamps. That means a validity end and no supersession time, except under succession-before-previous-start, where no validity end can be given.
    node: rules/knowledge-base/succession-closes-previous
