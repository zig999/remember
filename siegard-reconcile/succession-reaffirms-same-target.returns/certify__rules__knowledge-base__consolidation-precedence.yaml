certified:
  - node: rules/knowledge-base/consolidation-precedence
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: takes a proposal as the first of re-affirmation, correction, succession, dispute and new assertion whose condition it meets
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: is the one of its node and type, or the one of its node, type and target or value where the type allows multiple current assertions, and no other
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: does not answer a proposal with change hint correction and the held target as a re-affirmation
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: does not answer a proposal with change hint correction and the held value as a re-affirmation
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: supersedes the held link, leaves its validity end and records a new link naming it, when its change hint is correction
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: is answered as a dispute when no cited fragment signals succession
    why: >-
      The PRECEDENCE table checks each proposal against the outcome it lands on and the status
      written to the held row, for links and attributes. It covers these pairs: re-affirmation
      wins over succession, but only when the succession comes from the change hint "succession"
      with neutral fragment texts. Re-affirmation wins over a new assertion on types that allow
      several current assertions. Correction wins over succession and over dispute. Succession
      wins over dispute, whether it comes from the signal or from the hint. Dispute wins over a
      new assertion. A new assertion is taken when nothing is current. Two parts of the order go
      untested. First, nothing in the set proposes the held target or value with change hint
      "none" while citing a fragment whose text signals succession (SUCCESSION_TEXTS is only
      paired with a different target or value). So re-affirmation winning over succession by
      signal is never tested. Second, correction is only tested against a held assertion of a
      type that allows one current assertion. Nothing tests correction against a type that
      allows several current assertions, or against a node with nothing current, so correction
      winning over new assertion is never tested. Separately, the proof treats a correction-hinted
      proposal that repeats the held target or value as a correction, not a re-affirmation (the
      two "does not answer ... correction ... as a re-affirmation" tests and the correction
      supersession test). That fits this node's order only if the re-affirmation condition leaves
      out the change hint "correction". This node does not state the conditions, and the pack
      does not hold them. That reading is the test's, not this node's, and is not settled here.
    remainder: testable
    remainder_why: >-
      Two inputs, each against one expected result. First: a held current assertion of a type
      that allows one current assertion, and a proposal with change hint "none" that repeats its
      target or value and cites a fragment whose text signals succession. Expected: consolidated
      on the held assertion's identity, with no supersession and no new row. Second: a proposal
      with change hint "correction" against a type that allows several current assertions, and
      again against a node with nothing current. Expected: the correction outcome rather than
      "accepted" as a new assertion. The second expectation depends on what correction's
      condition is, and that is stated outside this node.
