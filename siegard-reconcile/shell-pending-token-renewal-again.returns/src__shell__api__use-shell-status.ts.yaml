    evidence: >-
      This file declares no shape for the shell. It only returns values: `useHealth(): HealthStatus` imports its type with `import type { HealthStatus } from "@/shell/Footer"`, and `useCurationCount(): number` returns a number. The attributes health and curation_pending are declared in another file, and `address` and `reason` appear only as a literal in `SESSION_EXPIRED_ADDRESS`.
looked_past: >-
  Three facts the file states are held by nodes outside the set and are not findings against it. The health judgment (ok, down, checking) is held by rules/application-shell/health-is-judged-by-the-database-field. The /sign-in?reason=session_expired literal is held by rules/curation-workspace/unrefreshable-curation-session-ends-at-sign-in. The null return of useActiveRun is held by rules/application-shell/the-active-ingestion-segment-is-never-shown. None of the three is bound to this file, so a change to any of them would not reach it; the file also carries no comments.