certified:
  - node: rules/application-shell/an-expired-token-is-renewed-by-the-pending-read
    state: covered
    tests:
      - file: src/shell/api/__tests__/use-shell-status.spec.ts
        name: >-
          asks the identity provider once with the session cookie and repeats the read with the fresh token
      - file: src/shell/api/__tests__/use-shell-status.spec.ts
        name: >-
          does not ask the identity provider a second time when the repeated read is also answered 401
      - file: src/shell/api/__tests__/use-shell-status.spec.ts
        name: >-
          does not send a third pending read before the next interval when the repeated read is also answered 401
      - file: src/shell/api/__tests__/use-shell-status.spec.ts
        name: >-
          asks the repeated read as the queue listing with limit 1