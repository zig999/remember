read:
  - node: contracts/entity-workspace/bff-entity-reads
    held_at: >-
      nowhere
    evidence: >-
      The file only calls hooks: `const nodeQuery = useNodeRead(nodeId);` and `const catalogQuery = useAttributeKeys(formNodeType);`. The request, path and query parameters are not stated in this file.
  - node: contracts/entity-workspace/entity-screen
    held_at: >-
      the body selection chain in EntityPage, for the show-entity-form answers (loading, not found, load failure with retry, form, attributes without form)
    evidence: >-
      `if (nodeFailure === "not-found") { body = <NodeNotFoundAlert />; } else if (nodeFailure === "deleted") { body = <NodeDeletedAlert />; } else if (nodeFailure === "other" || catalogFailed) { body = <FormLoadErrorAlert onRetry={retry} />; } else if (read === undefined) { body = <FormLoading />; }`
  - node: domain/entity-workspace/entity-edit-session
    held_at: >-
      nowhere
    evidence: >-
      The file declares no shape for the session. It reads only `const { nodeId } = useParams({ from: entityRoute.id }) as { nodeId: string };` and hands `<EntityForm node={read} attributeKeys={catalogQuery.data} />` the data.
  - node: rules/entity-workspace/a-deleted-node-shows-its-own-alert
    held_at: >-
      the `nodeFailure === "deleted"` branch of the body chain
    evidence: >-
      `} else if (nodeFailure === "deleted") { body = <NodeDeletedAlert />;` takes the place of the form, and the `NodeDeletedAlert` element is given no retry prop, unlike `<FormLoadErrorAlert onRetry={retry} />`.
  - node: rules/entity-workspace/the-form-is-offered-only-for-an-active-node
    held_at: >-
      the formNodeType derivation and the `formNodeType === null` branch
    evidence: >-
      `read !== undefined && read.node.status === ACTIVE_NODE_STATUS ? read.node.nodeType : null` and `} else if (formNodeType === null) { body = <NodeAttributeList attributes={read.attributes} />;`
