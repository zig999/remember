    held_at: >-
      the assertions in the "edit body" describe block, which check the request body the edit sends. `sentBody()["reason"]` is checked for the reason and `sentBody()["changes"]` for the list of changes. The `toStrictEqual` over `byKey` checks the six members of each change.
