      expect(sentBody()["reason"]).toBe("Corrigir o status"); expect(sentBody()["changes"]).toEqual([ expect.anything(), expect.anything(), ]); attribute_key: "k_full", kind: "set", value: "v", item_id: "i-1", valid_from: "2020-01-01", valid_to: "2021-01-01"
