  - node: rules/entity-workspace/review-states-the-effect-of-each-change
    held_at: >-
      the effect member of the FieldChange that changeOfField returns for each changed field, lines 27-31 and 38-66
    evidence: >-
      return { kind: "set", effect: "first-value", itemId: null };
  - node: rules/knowledge-base/entity-edit-addition
    held_at: >-
      the addition branch of changeOfField, lines 59-64. It sets no itemId, requires a key that allows multiple values and a value the key does not already hold, and states no closure.
    evidence: >-
      attributeKey.allowsMultiple && !holdsValue(attributes, field.attributeKey, field.value) ... return { kind: "set", effect: "addition", itemId: null };
  - node: rules/knowledge-base/entity-edit-correction
    held_at: >-
      the set branch for a field that carries an itemId, line 51, when the key is not temporal
    evidence: >-
      effect: attributeKey.isTemporal ? "succession" : "correction",
  - node: rules/knowledge-base/entity-edit-first-value
    held_at: >-
      the first-value branch of changeOfField, lines 56-58. A set change with no itemId, made to a key of which the node holds no attribute, takes the effect first-value.
    evidence: >-
      if (heldAttributesOf(attributes, field.attributeKey).length === 0) { return { kind: "set", effect: "first-value", itemId: null }; }
  - node: rules/knowledge-base/entity-edit-removal
    held_at: >-
      the remove branch of changeOfField, lines 46-48. A field that carries an itemId and was emptied takes the effect removal.
    evidence: >-
      if (field.value === "") { return { kind: "remove", effect: "removal", itemId }; }
  - node: rules/knowledge-base/entity-edit-succession
    held_at: >-
