certified:
  - node: rules/entity-workspace/a-saved-edit-reloads-the-entity
    state: covered
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.reload-after-save.spec.tsx
        name: reads the node again after the edit and shows every field with the value now current
      - file: src/features/entities/components/__tests__/EntityForm.reload-after-save.spec.tsx
        name: names the attribute now current, not the superseded one, in the next edit it sends
      - file: src/features/entities/components/__tests__/EntityForm.reload-after-save.spec.tsx
        name: lists the value now current as the previous value when the next edit is reviewed
      - file: src/features/entities/components/__tests__/EntityForm.reload-after-save.spec.tsx
        name: closes the review, offering neither the open review nor the control to open it
      - file: src/features/entities/components/__tests__/EntityForm.reload-after-save.spec.tsx
        name: clears the reason, so the next review has an empty reason field and no Salvar
      - file: src/features/entities/components/__tests__/EntityForm.reload-after-save.spec.tsx
        name: starts over from the held values, with the reason cleared and the review closed, when the node read again is the same node
    why: >-
      Covered. One over-assertion is noted here and not settled. "reads the node again after the
      edit and shows every field with the value now current" compares the whole request sequence
      to exactly [GET node, POST edit, GET node]. The fact only requires that the node is read
      again after the save. That exact list also says no other request happens during the save.
      It will break if a sibling task legitimately adds a request, even when the reload still
      works. The fact does not depend on that test alone. "names the attribute now current, not
      the superseded one, in the next edit it sends" needs the next edit to name the current
      attribute (CURRENT_STATUS_ID). "lists the value now current as the previous value when the
      next edit is reviewed" needs the reloaded value to show as the previous value. Both fail
      if the node is not reloaded. As the pack instructed, the imported support modules were not
      opened. This judgment assumes their fixtures give different values for the held state, the
      reloaded state and the typed state, as the constant names suggest.