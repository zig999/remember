  - node: contracts/entity-workspace/bff-entity-reads
    held_at: >-
      entityGet, which sends every entity read through the application's request helper http (only the routing of reads through it; the paths and the query parameters belong to the callers)
    evidence: >-
      return http<T>(path, { method: "GET", headers: bearerHeaders(), signal });
  - node: rules/entity-workspace/a-401-refreshes-the-token-and-repeats-the-request-once
    held_at: >-
      nowhere
    evidence: >-
      the file calls http<T>(path, { method: "GET", headers: bearerHeaders(), signal }) and states no refresh, no repeat and no 30000 millisecond cutoff. The Authorization getter only reads the token afresh at each send.
  - node: rules/entity-workspace/entity-workspace-requests-carry-the-access-token
    held_at: >-
      bearerHeaders, whose Authorization member is read through authHeader() on every send, and entityGet, which passes those headers on each read
    evidence: >-
      Object.defineProperty(headers, "Authorization", { enumerable: true, get: () => authHeader().Authorization ?? "", }); and headers: bearerHeaders()
