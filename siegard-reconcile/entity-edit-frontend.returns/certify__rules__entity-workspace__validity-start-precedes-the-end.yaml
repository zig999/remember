certified:
  - node: rules/entity-workspace/validity-start-precedes-the-end
    state: covered
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.validity-order.spec.tsx
        name: puts the fixed message on the validity end field when the start is $label the end
      - file: src/features/entities/components/__tests__/EntityForm.validity-order.spec.tsx
        name: raises no message when the start is one day earlier than the end
      - file: src/features/entities/components/__tests__/EntityForm.validity-order.spec.tsx
        name: raises no message when no end is stated and there is $label
      - file: src/features/entities/components/__tests__/EntityForm.validity-order.spec.tsx
        name: offers the save with a valid reason when the start is strictly earlier than the end
      - file: src/features/entities/components/__tests__/EntityForm.validity-order.spec.tsx
        name: withholds the save despite a valid reason once the start becomes $label the end
      - file: src/features/entities/components/__tests__/EntityForm.validity-order.spec.tsx
        name: offers the save again once a violated order is corrected
    why: >-
      Both parts of the fact are exercised. The tests cover a start one day later than the end
      and a start equal to the end. In both cases they assert the fixed order message and that
      the validity end field is described by it. A start one day earlier than the end raises
      neither. The save is withheld while the order is violated and offered again once it is
      corrected. So the strictness boundary, the refusal and the field the message shows on
      would each fail if the fact stopped holding.

      There are two caveats a reader should route.
      (1) Over-assertion. Two tests claim more than this node states:
      "raises no message for an end earlier than today when the start is left unstated" and
      "offers the save with a valid reason for an end earlier than today when the start is left
      unstated". Both fix the clock and assert that an end earlier than today, with no start
      given, raises no message and leaves the save offered. The node states nothing about an
      end compared with today, or about the case where the start is not given. These tests hold
      ground that belongs to some other rule and will break if one is delivered there.
      "raises no message when no end is stated and there is $label" stays within the node's
      "gives both" condition.
      (2) Unopened helpers. The pack's instruction allowed reading only the proof file. The
      helpers it imports were therefore not opened: orderAlertOf, endDescribedByMessage,
      saveOfferedIn, changeRoleWithValidity and offerSaveWithReason, from
      entity-form-order-support, entity-form-reason-support and entity-form-support. This
      verdict reads them by how they are used. It assumes endDescribedByMessage resolves the
      end input's description, not a literal.