certified:
  - node: rules/entity-workspace/attributes-outside-the-catalog-show-without-a-field
    state: covered
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.outside-catalog.spec.tsx
        name: shows the value of an attribute whose key the catalog does not hold, and adds no field for it
      - file: src/features/entities/components/__tests__/EntityForm.outside-catalog.spec.tsx
        name: shows the value of every attribute outside the catalog, across keys and across several values of one key
      - file: src/features/entities/components/__tests__/EntityForm.outside-catalog.spec.tsx
        name: leaves the form with exactly the controls its catalog keys give, whatever lies outside the catalog
      - file: src/features/entities/components/__tests__/EntityForm.outside-catalog.spec.tsx
        name: gives no input, select, textarea, combobox or button that carries or represents an outside-catalog value
    why: >-
      Both halves of the fact are exercised by comparing the form with and without the
      outside-catalog attributes. The value is shown: the first two tests check that every
      outside value is in the form's text, including several values of one key. No field is
      added: the first and third tests compare the control signature with and without those
      attributes, and the fourth checks that no control carries an outside value. These
      tests judge rendering through imported support helpers (formTextOf, controlSignatureOf,
      controlsCarrying). The pack limited this reading to the proof file, so those helpers were
      not opened. That the helpers do what their names say is an assumption, not something
      this reading checked.
      Every test uses keys that were never in the catalog. None uses a key that was once in it
      and then removed. The form only gets the current catalog as input, so it has no way to
      tell those two cases apart.
      One over-assertion, not cited above: "renders nothing beyond the catalog's field groups
      when no attribute lies outside the catalog" claims the form's whole text equals the
      catalog groups' text. That goes beyond this fact and would break if a sibling task
      legitimately adds any other text to the form.
      Two tests do not test this fact and are not cited: "keeps an attribute whose key the
      catalog holds in its own field group, with its own values" covers attributes inside the
      catalog, and "keeps the value-type flag true when an outside-catalog value would be
      refused by a date or a number type" covers the value-type flag.