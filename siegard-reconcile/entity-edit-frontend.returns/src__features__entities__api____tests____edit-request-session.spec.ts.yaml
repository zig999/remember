  - node: rules/application-shell/a-failed-refresh-ends-the-session
    held_at: >-
      the first test of "edit whose session refresh fails", which asserts the cleared token, the replaced page and the code.
    evidence: >-
      mocks.fetchAccessToken.mockRejectedValue(new Error("no session")); ... toEqual({ storedToken: null, redirects: [["/sign-in?reason=session_expired"]], code: "AUTH_SESSION_EXPIRED" })
  - node: rules/application-shell/a-request-is-cut-off-after-thirty-seconds
    held_at: nowhere
    evidence: >-
      the file never states the 30000 ms cutoff or the timeout message; it only uses `answersAfter(20_000, ...)` and `answersAfter(29_000, ...)` delays to show a repeat gets a fresh cutoff.
  - node: rules/application-shell/every-other-address-is-guarded
    held_at: nowhere
    evidence: >-
      the file renders no layout or route; `__setEditRedirectForTests(redirect)` only captures a redirect URL.
  - node: rules/entity-workspace/a-401-refreshes-the-token-and-repeats-the-request-once
    held_at: >-
      the first test of "edit answered 401 on its first attempt", which asserts one refresh, two requests, the new token on the repeat, the same target and body, and a delay on the repeat that outlasts the first attempt's cutoff.
    evidence: >-
      toEqual({ refreshes: 1, requests: 2, firstAuthorization: "Bearer old.token", repeatAuthorization: "Bearer new.token", repeatTarget: [first?.method, first?.url.href], repeatBody: sentBody(0), repeatAnswered: 401 })
