read:
  - node: contracts/entity-workspace/bff-entity-edit
    held_at: >-
      the second test of "edit answered 401 on its first attempt" (the SYSTEM_UNKNOWN assertion) and the second test of "edit whose session refresh fails" (the AUTH_SESSION_EXPIRED message). Both are assertions on the failure the edit request gives.
    evidence: >-
      toMatchObject({ httpStatus: 401, code: "SYSTEM_UNKNOWN", message: "Erro desconhecido do servidor." }) and toMatchObject({ httpStatus: 401, message: "Sua sessão expirou. Faça login novamente." })
  - node: contracts/entity-workspace/bff-entity-reads
    held_at: nowhere
    evidence: >-
      the file calls only entityEdit("n-1", SOME_EDIT) and sends no read of node types, nodes, a node or attribute keys.
  - node: contracts/entity-workspace/entity-screen
    held_at: nowhere
    evidence: >-
      the file imports no screen or component and asserts on the request helper's failure only, for example `const failure = await failureOf(entityEdit("n-1", SOME_EDIT));`
