read:
  - node: contracts/entity-workspace/entity-screen
    held_at: >-
      FormLoading, NodeNotFoundAlert, FormLoadErrorAlert and NodeHeader, which hold the form-side states of show-entity-form. The listing states, show-review and save-edit are not in this file.
    evidence: >-
      "Carregando formulário…" in FormLoading; "Nó não encontrado." in NodeNotFoundAlert; "Não foi possível carregar o formulário. Tente novamente." with the "Tentar novamente" action calling onRetry in FormLoadErrorAlert; {node.canonicalName}, {node.nodeType} and {node.status} in NodeHeader.
  - node: rules/entity-workspace/a-deleted-node-shows-its-own-alert
    held_at: >-
      NodeDeletedAlert. It carries no retry action and no failure code or message.
    evidence: >-
      <Alert variant="warning" role="alert" data-testid="entity-deleted">
          Este nó foi apagado.
        </Alert>
  - node: rules/entity-workspace/the-listing-and-page-states-read-their-wording
    held_at: >-
      FormLoading, NodeNotFoundAlert and FormLoadErrorAlert hold the page-side wording. The listing wording and the recorded-edit notice are not in this file.
    evidence: >-
      "Carregando formulário…"; "Nó não encontrado."; "Não foi possível carregar o formulário. Tente novamente."; "Tentar novamente". None of these carries a code or message of the failure's own.
  - node: contracts/entity-workspace/bff-entity-edit
    held_at: nowhere
    evidence: >-
      The file only renders alerts and a header. It builds no edit request, for example no POST /api/v1/nodes/{node_id}/edit.
  - node: contracts/entity-workspace/bff-entity-reads
    held_at: nowhere
    evidence: >-
      The file issues no read. It imports only "@/shared/components/ui/alert", "@/shared/components/ui/button", "@/shared/components/ui/panel" and types from "../types".
  - node: contracts/knowledge-base/entity-editing
    held_at: nowhere
    evidence: >-
      This published contract belongs to the backend. No file construct answers edit-entity; the file's only action is onRetry on the load-error alert.
  - node: contracts/knowledge-base/retrieval
    held_at: nowhere
    evidence: >-
