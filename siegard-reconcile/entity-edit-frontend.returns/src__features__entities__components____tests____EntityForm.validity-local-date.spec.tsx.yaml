looked_past: >-
  The test pins the zone `America/Sao_Paulo` and the dates 2026-01-31 and 2026-02-01 as fixtures to make the local date differ from the UTC date. I took these as test choices and not as domain facts, and I made no code-review judgment on how the test sets `process.env.TZ`.