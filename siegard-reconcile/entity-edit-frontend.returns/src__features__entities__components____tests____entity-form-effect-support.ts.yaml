looked_past: >-
  The `data-testid` prefixes (`entity-review-item-`, `entity-review-previous-`, `entity-review-new-`, `entity-review-effect-`) and the `localeCompare` sort order name controls and tune how tests compare. They are what the implementation chose, not facts of the domain.