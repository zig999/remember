findings:
  - file: src/features/entities/api/__tests__/edit-outcomes.spec.ts
    where: >-
      line 45, the expected `applied` entry of the first test, "is accepted with the node, the action and what was applied when the edit is answered 200".
    evidence: >-
      effect: "created",
    cost: >-
      The test states "created" as the effect a 200 answer reports for a change. The enumeration holds six effects and "created" is not one of them: first-value, addition, succession, correction, removal and unchanged. The accepted answer the knowledge base publishes lists one effect per change. A reader who takes the accepted outcome's shape from this test will think "created" is an effect the knowledge base can report. The same fixture value is in `edit-support.ts` (`ACCEPTED_WIRE`), and `types.ts` types `effect` as a bare `string`, so nothing fails if a value outside the set arrives.
    kind: contradicts
    correction: >-
      The expected effect, and the wire fixture it comes from, should use a value the enumeration holds, for example the first-value that a first value on `status_text` would report.
    node: domain/knowledge-base/edit-effect

