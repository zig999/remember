findings:
  - file: src/features/entities/components/__tests__/EntityForm.closed-keys.spec.tsx
    where: >-
      the test at line 101 and the last catalog entry of the test at line 34, which treat an allowed value whose label is the empty string as one that has no label
    evidence: >-
      it("shows an allowed value whose label is the empty string by its own value, not as an empty option", ... allowed("venus-code", ""), ... "venus-code",
    cost: >-
      The node and its decision log say a value "that has no label" is shown by its own value. Neither says whether an empty-string label counts as no label, and the domain node allowed-value only declares `label` as an optional string. This test makes that choice. An owner and a later reader see the rule only here. If the catalog ever ships an empty label on purpose, the form and the specification will disagree and no node says which one was decided.
    kind: unstated
    correction: >-
      Give the fact a node, either by extending rules/entity-workspace/a-closed-key-offers-only-its-allowed-values or by stating in domain/knowledge-base/allowed-value that an empty label is no label. Otherwise remove the assertion.
    node: rules/entity-workspace/a-closed-key-offers-only-its-allowed-values
  - file: src/features/entities/components/__tests__/EntityForm.closed-keys.spec.tsx
    where: >-
      the test at line 67, "keeps the order the catalog delivers the allowed values in, whatever their sort orders and whatever alphabetical order would give"
    evidence: >-
      allowed("k", "Medium", 30), allowed("c", "Urgent", 10), allowed("t", "High", 20), allowed("a", "Low", 40), ... toEqual(["Medium", "Urgent", "High", "Low"])
    cost: >-
      The node says only "in their order". The allowed-value domain node gives each value a `sort_order` ("its place in the key's order"), and the retrieval listing is stated elsewhere to give values in ascending string order. This test decides that the form shows the listing's delivery order and ignores `sort_order`. That decides what order the owner sees for every closed key, for example the status of a Task, and no node states it. The next reader would look in the specification for which order is meant and find two candidates.
    kind: unstated
    correction: >-
      State in the node which order the form shows, either the order the catalog listing delivers or `sort_order`. Then this test follows the node.
    node: rules/entity-workspace/a-closed-key-offers-only-its-allowed-values
