    where: >-
      the KEYS_WIRE fixture, item k-2 (line 48), and keyNamed() (line 63)
    evidence: >-
      allows_multiple: true,
    cost: >-
      The fixture gives the wire member that says a key allows multiple current values the name allows_multiple. The attribute-key node names that attribute allows_multiple_current, and the retrieval contract's list-attribute-keys answer does not name the wire member. The test pins a wire name the specification does not hold. If the knowledge base publishes the node's name, the test passes against a shape it never sends. Whoever reads the test for the wire shape will take allows_multiple as the decided name. I could not tell from the nodes which name is the wire name.
    kind: contradicts
    correction: >-
      Either the retrieval contract's list-attribute-keys answer names the wire member of this fact and the fixture follows it, or the fixture uses the attribute-key node's name, allows_multiple_current.
    node: domain/knowledge-base/attribute-key
