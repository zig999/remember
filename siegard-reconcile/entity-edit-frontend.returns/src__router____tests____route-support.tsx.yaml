  The file is test scaffolding only, with a fake env, a never-resolving fetch stub, a sonner mock and a router builder. Its values (`https://bff.test`, `https://auth.test`, `WAIT_MS = 10_000`, `retry: false`) are test tuning and no domain fact. It also has no comments.