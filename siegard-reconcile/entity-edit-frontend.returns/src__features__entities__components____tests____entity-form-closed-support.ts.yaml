looked_past: >-
  The fixture defaults `valueType ?? "text"` and `allowsMultiple ?? false` in closedKey, and the role="combobox", role="option" and aria-selected selectors, are test scaffolding for the DOM and the catalog fixture, not domain facts, so I reported nothing on them.