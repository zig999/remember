certified:
  - node: rules/entity-workspace/a-field-added-with-a-held-value-is-not-changed
    state: covered
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.review-offered.spec.tsx
        name: does not offer the review for an added field whose value an active attribute holds or an uncertain attribute holds, and offers it for an added field with a value nothing holds
      - file: src/features/entities/components/__tests__/EntityForm.review-offered.spec.tsx
        name: does not list an added field that repeats an active or an uncertain value while another field is changed
      - file: src/features/entities/components/__tests__/EntityForm.review-offered.spec.tsx
        name: lists an added field whose value only a superseded attribute holds
      - file: src/features/entities/components/__tests__/entity-edit-payload.spec.ts
        name: sends no change for fields added to a multi-valued key that repeat an active value and an uncertain value the node holds
      - file: src/features/entities/components/__tests__/entity-edit-payload.spec.ts
        name: sends a set change for a field added to a multi-valued key that repeats only a superseded value
    why: >-
      Both halves of the fact are tested: a value held by an active attribute and a value
      held by an uncertain attribute. In the form, the fixture HELD_BY_STATUS marks tag "Beta"
      uncertain. In the payload support, PAYLOAD_NODE holds tag "Red" as active and "Green" as
      uncertain. In each case, an added field repeating the value is not counted as changed.
      The checks are on the review being offered, on the review list, and on the body sent.
      Counter-cases stop an implementation that never counts added fields from passing: an
      added "Gamma" turns the review on, and an added "Violet" produces a set change. A finding
      for the reader, not a gap in coverage: the two superseded-value tests, "lists an added
      field whose value only a superseded attribute holds" and "sends a set change for a field
      added to a multi-valued key that repeats only a superseded value", assert more than this
      node states. They require a field repeating a value that only a superseded attribute
      holds to count as changed. The node only says what must not count, so that half rests on
      no statement in this node.