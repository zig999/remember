looked_past: >-
  The stub route `path: "/curation"` names the curation address that rules/entity-workspace/a-disputed-key-links-to-the-curation-queue holds. It is only a test double standing in as the link's destination, so it is no domain fact stated, and the file's test-client `retry: false` and `setTimeout(resolve, 0)` are test tuning rather than domain facts.