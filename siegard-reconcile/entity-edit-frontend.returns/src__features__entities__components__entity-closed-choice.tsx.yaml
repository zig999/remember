findings:
  - file: src/features/entities/components/entity-closed-choice.tsx
    where: >-
      the paragraph shown when heldOutside is true, line 80
    evidence: >-
      {`Valor atual fora dos valores permitidos: ${value}`}
    cost: >-
      This is text the running system shows the owner. It states a domain fact: when the node's current value is not among a key's allowed values, the field keeps showing that value and tells the owner it is outside them. No node holds that fact. The entity-screen contract and a-closed-key-offers-only-its-allowed-values say only that a closed key offers its allowed values. The next reader looks for this behavior in the specification and finds it only in the component.
    kind: unstated
    correction: >-
      An analysis would give the fact a node. That node would say what a closed-key field shows, and says, when the held value lies outside the allowed values. It would also fix the wording of the notice. Candidates are rules/entity-workspace/a-closed-key-offers-only-its-allowed-values or a refusal or answer on contracts/entity-workspace/entity-screen.
    node: rules/entity-workspace/a-closed-key-offers-only-its-allowed-values
