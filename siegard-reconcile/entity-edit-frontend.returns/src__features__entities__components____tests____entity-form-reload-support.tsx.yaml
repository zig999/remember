looked_past: >-
  The file is test support: its fixture data (node type "Project", keys "status_text" and "title", status values, "Apollo Mission") and the 5000 ms wait are values for an exercised screen, not rules the file applies, so I raised no finding on them. Test design and the file's helper structure are another judgment's.