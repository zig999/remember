findings:
  - file: src/features/entities/components/__tests__/EntityForm.review-listing.spec.tsx
    where: >-
      the first test of "entity form review listing of changed fields", lines 49-53, the expected order of the listed entries
    evidence: >-
      expect(listed.map(({ key, previous, next }) => ({ key, previous, next }))).toEqual([ { key: "tag", previous: "Alpha", next: "Alpha-edited" }, { key: "tag", previous: "Beta", next: "Beta-edited" }, { key: "title", previous: "Alpha", next: "Gamma" }, ]);
    cost: >-
      The test fixes an order for the review's entries: both tag fields come before title, although the catalog lists title first (CATALOG = [catalogKey("title"), temporalKey("role"), catalogKey("note"), multiKey("tag")]). No node of the set states how the review orders its entries, so this order is a decision that lives only in the test. The next reader will look for it in the specification and not find it.
    kind: unstated
    correction: >-
      Either a node gives the review's order of entries, with review-lists-each-changed-field-once as the natural home, or the assertion stops depending on an order the specification does not decide.
    node: rules/entity-workspace/review-lists-each-changed-field-once
