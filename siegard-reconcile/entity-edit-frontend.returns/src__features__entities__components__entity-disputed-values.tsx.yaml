  - node: contracts/entity-workspace/entity-screen
    held_at: >-
      The returned element of DisputedValues, in two parts. The values list is the key's values with no field, and the Link is the pointer to the curation workspace. These are the show-entity-form answer for a disputed key. The file states no other answer of the contract.
    evidence: >-
      {attribute.value}</li> ... <Link to="/curation" ...>Abrir na fila de curadoria</Link>
  - node: rules/entity-workspace/a-disputed-key-links-to-the-curation-queue
    held_at: >-
      The Link element at lines 33-42. It targets the curation address with no search key and reads the written text.
    evidence: >-
      <Link
            to="/curation"
            data-testid={`entity-curation-link-${attributeKey}`}
      ...
            Abrir na fila de curadoria
          </Link>
  - node: rules/entity-workspace/a-disputed-key-shows-without-a-field-and-points-to-curation
    held_at: >-
      The DisputedValues component. It renders each value as plain list text with no input, and renders the pointer to curation. Deciding which key is disputed is not done in this file; the component receives the key's values through its props.
    evidence: >-
      {values.map((attribute) => (<li key={attribute.id} ... >{attribute.value}</li>))} followed by <Link to="/curation" ...>
