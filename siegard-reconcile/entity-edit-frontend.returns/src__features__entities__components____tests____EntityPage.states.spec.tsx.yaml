looked_past: >-
  The retry tests assert request counts after the try-again action (`toEqual({ node: 2, keys: 2 })`, and the catalog requested only after the node answered). No node states that sequence. The spec says only "with the action to try again", so I took the counts as the test's mechanics of that action and not as a domain fact.