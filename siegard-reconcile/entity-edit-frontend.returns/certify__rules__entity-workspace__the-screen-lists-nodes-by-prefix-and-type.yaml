certified:
  - node: rules/entity-workspace/the-screen-lists-nodes-by-prefix-and-type
    state: covered
    tests:
      - file: src/features/entities/components/__tests__/EntityListPage.listing.spec.tsx
        name: shows its $label
      - file: src/features/entities/components/__tests__/EntityListPage.listing.spec.tsx
        name: lists the nodes the knowledge base lists for the name prefix the owner types
      - file: src/features/entities/components/__tests__/EntityListPage.listing.spec.tsx
        name: lists the nodes the knowledge base lists for the node type the owner picks
      - file: src/features/entities/components/__tests__/EntityListPage.listing.spec.tsx
        name: offers as node types the node types the knowledge base lists
      - file: src/features/entities/components/__tests__/EntityListPage.listing.spec.tsx
        name: narrows by the name prefix and the node type together and opens /entities/{identity} of the node the owner picks
      - file: src/features/entities/components/__tests__/EntityListPage.listing.spec.tsx
        name: carry the name prefix under name_prefix and the node type by its name under node_type, and carry neither before the owner gives it
    why: >-
      Every part of the fact is exercised. The screen lists what the knowledge base answers,
      both unnarrowed and for each narrowing: the shown names must equal the answered names. It
      narrows by a name prefix, by a node type, and by both together, and both the request
      parameters and the shown result are asserted. It opens the node the owner picks: the test
      clicks MOON and asserts the path /entities/{MOON.id}. So these tests would fail if the
      fact stopped holding.

      One limit on this reading. As the pack directs, I judged from this file alone. The
      helpers it imports from ./list-support and ../../api/__tests__/support were not opened.
      These include listingBy, namesOnceShown, waitForItems, offeredTypeLabels and paramsOf, and
      I took their behaviour at their names. If namesOnceShown returned its expected argument
      instead of reading the screen, the narrowing assertions could not fail.

      Over-assertions, for a person to route, not settle:
      - "shows its $label" also requires each row to show the node type and the status. The
        node does not state that.
      - "offers as node types the node types the knowledge base lists" requires exactly one
        option outside the listed types (others: 1). That claims the whole option set, which
        the node does not name.
      - The requests test fixes the wire names name_prefix and node_type. Those are a contract
        detail beyond this rule.