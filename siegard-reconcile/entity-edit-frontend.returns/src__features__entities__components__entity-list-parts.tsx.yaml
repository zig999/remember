    evidence: >-
      export const ALL_TYPES_VALUE = "";
  - node: rules/entity-workspace/the-listing-and-page-states-read-their-wording
    held_at: >-
      ListLoading, ListErrorAlert, ListEmpty and RetryAlert. The listing wording and the try-again action label are held here. The page-level texts (node not found, form load failure, edit notice, undo) are not in this file.
    evidence: >-
      "Carregando nós…"; "Não foi possível carregar os nós. Tente novamente."; "Nenhum nó encontrado."; the RetryAlert button text "Tentar novamente"; the alert takes only message, onRetry and test ids and carries no code or message of the failure's own.
  - node: rules/entity-workspace/the-listing-request-carries-its-narrowings-by-name
    held_at: >-
      nowhere. The file builds no request. TypeChoice offers the type by name, but the query parameters are set elsewhere.
    evidence: >-
      ...types.map((type) => ({ value: type.name, label: type.name }))
  - node: rules/entity-workspace/the-node-listing-stands-without-the-node-types
    held_at: >-
      TypesLoading and TypesErrorAlert hold the loading indication and the could-not-load-types alert with its retry action. That the node listing stays offered meanwhile is not decided here.
    evidence: >-
      message="Não foi possível carregar os tipos de nó. Tente novamente." with retryTestId="entity-list-types-retry" and the "Tentar novamente" action; TypesLoading renders role="status" "Carregando tipos de nó…"
  - node: rules/entity-workspace/the-screen-lists-nodes-by-prefix-and-type
    held_at: >-
      NodeList, which lists each node with its name, type and status and links to open it. TypeChoice offers the type narrowing.
    evidence: >-
      <Link to="/entities/$nodeId" params={{ nodeId: node.id }} ...>{node.canonicalName}</Link> with node.nodeType and node.status in the list item
