looked_past: >-
  The option label "Todos os tipos", the group label "Tipo de nó", the list's aria-label "Nós de conhecimento" and the sr-only "Tipo" and "Status" labels are control and accessible names that no node holds, so they are no finding under SPEC-005 R2.