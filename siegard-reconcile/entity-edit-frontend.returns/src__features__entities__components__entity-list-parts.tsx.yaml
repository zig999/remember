findings:
  - file: src/features/entities/components/entity-list-parts.tsx
    where: >-
      TypesLoading, the text of the node-type loading indication (line 82)
    evidence: >-
      Carregando tipos de nó…
    cost: >-
      The wording shown while the node-type listing is fetched lives only in this component. The sibling indications ("Carregando nós…", "Carregando formulário…") have their wording written in a node, so a reader checking the specification for what the screen says here finds nothing. A change to this wording would never reach a node.
    kind: unstated
    correction: >-
      The analysis would have to give the node-type loading indication's wording a node. The natural home is the-node-listing-stands-without-the-node-types, which requires the indication but writes no text for it.
    node: rules/entity-workspace/the-node-listing-stands-without-the-node-types
read:
  - node: contracts/entity-workspace/entity-screen
    held_at: >-
      ListLoading, ListErrorAlert and ListEmpty, which hold the show-entity-list answers (loading indication, alert with a retry action, no-node statement). The other operations (form, review, save) are not in this file.
    evidence: >-
      <ListLoading>Carregando nós…</ListLoading>; <RetryAlert message="Não foi possível carregar os nós. Tente novamente." ... role="alert"> with a "Tentar novamente" button; <p data-testid="entity-list-empty">Nenhum nó encontrado.</p>
  - node: rules/entity-workspace/an-empty-narrowing-is-a-narrowing-not-given
    held_at: >-
