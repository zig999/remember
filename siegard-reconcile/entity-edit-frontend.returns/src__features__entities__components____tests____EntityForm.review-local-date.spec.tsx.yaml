looked_past: >-
  The test expects the review to show the start date written as year-month-day (`shown.includes("2026-01-31")`), and no node in the pack or the full-text projection states how the review writes that date; I judged it a test fixture's reading of "calendar date" rather than a fact the test owns, and I report it here without filing it.