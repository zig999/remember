certified:
  - node: rules/entity-workspace/a-field-shows-its-key-description-as-help-text
    state: covered
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.field-groups.spec.tsx
        name: shows each field the description the catalog holds for its own key as help text
    why: >-
      The test gives three catalog keys three different descriptions and checks that each field's help text is exactly its own key's description. The help text is read through the field's aria-describedby target (helpTextsOf in entity-form-support.tsx). So the test fails if a description is missing, swapped with another key's, or shown next to extra help text.

      Over-assertion, for a reader to route rather than for me to settle: the test reads help text only through aria-describedby. That is how help text is announced to assistive technology, which this node assigns to rules/application-shell/an-invalid-field-is-described. A help text that is visible but not linked to its field would satisfy this node and still fail the test. A description linked but hidden from view would pass it.

      The test also checks that each field has exactly one describing element, which holds only while no error message is linked to the field.

      It matches fields to keys by position, so it relies on the order of fields, which the sibling test in the same file checks ("holds one field for every catalog key of the node's type, in the order the catalog lists them").