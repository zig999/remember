findings:
  - file: src/features/entities/api/__tests__/edit-support.ts
    where: >-
      ACCEPTED_WIRE, the first entry of applied (line 34)
    evidence: >-
      effect: "created",
    cost: >-
      The fixture stands in for the accepted answer the upstream publishes, and it gives that answer an effect the specification never names. The effect enumeration holds first-value, addition, succession, correction, removal and unchanged. The wire type declares effect as a bare string, so the compiler does not catch the value. Tests that read this fixture assert against an effect word the knowledge base never sends. The next reader takes "created" as one of the effects and finds no node that holds it.
    kind: contradicts
    correction: >-
      The fixture's effect would have to be one of the values the edit-effect enumeration holds, for example first-value for a change recorded as a new current value.
    node: domain/knowledge-base/edit-effect

