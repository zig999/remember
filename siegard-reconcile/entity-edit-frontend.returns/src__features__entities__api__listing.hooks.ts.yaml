read:
  - node: contracts/entity-workspace/bff-entity-reads
    held_at: >-
      useNodeTypes and useNodeListing, the two queryFn bodies, and buildListingQs.
    evidence: >-
      entityGet<NodeTypeListWire>("/api/v1/node-types", signal) is sent with no query string.
      entityGet<NodeListingWire>(`/api/v1/nodes${buildListingQs(namePrefix, nodeType)}`, signal) is the node listing read.
      The failures go through entityGet, which is not in this file.
  - node: rules/entity-workspace/an-empty-narrowing-is-a-narrowing-not-given
    held_at: >-
      buildListingQs, the two length guards.
    evidence: >-
      if (namePrefix.length > 0) search.set("name_prefix", namePrefix);
      if (nodeType.length > 0) search.set("node_type", nodeType);
  - node: rules/entity-workspace/the-listing-request-carries-its-narrowings-by-name
    held_at: >-
      buildListingQs. It uses the parameter names, and it omits each narrowing that is empty or not given.
    evidence: >-
      search.set("name_prefix", namePrefix); search.set("node_type", nodeType); return qs.length > 0 ? `?${qs}` : "";
      narrowing.namePrefix ?? "" and narrowing.nodeType ?? "" turn a missing narrowing into an empty one, which is then left out.
  - node: contracts/entity-workspace/bff-entity-edit
    held_at: nowhere
    evidence: >-
      The file makes only two GET reads, node-types and nodes. It sends no POST to /edit.
  - node: contracts/entity-workspace/entity-screen
    held_at: nowhere
    evidence: >-
      The file holds hooks only. It has no loading indication, alert or statement, and no listing or form rendering.
  - node: contracts/knowledge-base/entity-editing
    held_at: nowhere
