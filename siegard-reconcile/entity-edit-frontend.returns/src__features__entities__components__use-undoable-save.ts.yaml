findings: []
read:
  - node: contracts/entity-workspace/entity-screen
    held_at: >-
      confirm() and the toast call. The recorded notice with its undo action lasts UNDO_WINDOW_MS. The reload follows in send(), where `restart(reloaded)` runs.
    evidence: >-
      toast(RECORDED_NOTICE, { id: toastId, duration: UNDO_WINDOW_MS, action: { label: UNDO_ACTION_LABEL, ... } }); if (reloaded !== undefined) restart(reloaded);
  - node: domain/entity-workspace/entity-edit-session
    held_at: >-
      confirm(), the confirm-save and undo-save operations. They hold the typed values until the timer fires, and an undo clears the timer.
    evidence: >-
      const timer = setTimeout(() => { toast.dismiss(toastId); void send(variables); }, UNDO_WINDOW_MS); onClick: () => { clearTimeout(timer); busy.current = false; }
  - node: rules/entity-workspace/a-conflict-keeps-the-typed-values
    held_at: >-
      The guard in send(). The form is restarted and the reason and review are cleared only for an accepted result. Any other outcome is only stored in `outcome`, so the typed values stay. The alert wording is rendered elsewhere.
    evidence: >-
      if (result.kind === "accepted") { clearReason(); closeReview(); ... restart(reloaded); } setOutcome(result);
  - node: rules/entity-workspace/a-saved-edit-reloads-the-entity
    held_at: >-
      send(), the accepted branch.
    evidence: >-
      const reloaded = reloadedNode(nodeId); if (reloaded !== undefined) restart(reloaded);
  - node: rules/entity-workspace/saving-waits-for-undo
    held_at: >-
      UNDO_WINDOW_MS and the setTimeout in confirm(). The send runs only in the timer callback, and the undo action clears the timer.
    evidence: >-
      export const UNDO_WINDOW_MS = 5_000; const timer = setTimeout(() => { toast.dismiss(toastId); void send(variables); }, UNDO_WINDOW_MS); clearTimeout(timer);
  - node: rules/entity-workspace/the-listing-and-page-states-read-their-wording
    held_at: >-
      The RECORDED_NOTICE and UNDO_ACTION_LABEL constants. Both match the node's wording. The other texts of the node are not in this file.
    evidence: >-
      export const RECORDED_NOTICE = "Edição registrada."; export const UNDO_ACTION_LABEL = "Desfazer";
  - node: scenarios/entity-workspace/undo-within-five-seconds-sends-nothing
    held_at: >-
      The undo action's onClick in confirm(). It cancels the pending send and clears none of the form.
    evidence: >-
