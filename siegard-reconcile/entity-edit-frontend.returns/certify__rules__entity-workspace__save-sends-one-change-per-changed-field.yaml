        name: >-
          sends a set change that names no attribute for $label
      - file: src/features/entities/components/__tests__/entity-edit-payload.spec.ts
        name: >-
          sends one remove change naming the attribute it started from, with null value and validity, for $label
      - file: src/features/entities/components/__tests__/entity-edit-payload.spec.ts
        name: >-
          sends no change for fields the owner left as they started
      - file: src/features/entities/components/__tests__/entity-edit-payload.spec.ts
        name: >-
          sends one change for each changed field, a set change for a held or new value and a remove change for an emptied or removed one, and none for the fields left as they started
      - file: src/features/entities/components/__tests__/entity-edit-payload.spec.ts
        name: >-
          writes JSON null in every member that holds nothing and in the value and validity of a remove change
      - file: src/features/entities/components/__tests__/entity-edit-payload.spec.ts
        name: >-
          sends no change for a field whose value equals the one it started with, whatever validity it holds