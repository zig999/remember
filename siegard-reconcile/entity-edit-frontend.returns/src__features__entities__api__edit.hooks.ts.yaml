read:
  - node: contracts/entity-workspace/bff-entity-edit
    held_at: >-
      conflictFacts() and toFailureOutcome(). They read the conflict's attribute_key and item_id from the error details, with null where absent, and sort the failure codes. The request path, body and wire shape are in _edit-request and _transforms, which this file only calls.
    evidence: >-
      return { attributeKey: typeof named.attribute_key === "string" ? named.attribute_key : null, itemId: typeof named.item_id === "string" ? named.item_id : null, };
  - node: rules/entity-workspace/a-conflict-keeps-the-typed-values
    held_at: nowhere
    evidence: >-
      The file only returns `{ kind: "conflict", ...conflictFacts(error.details) }`. Nothing in it keeps typed values or alerts the owner, because that belongs to the form.
  - node: rules/entity-workspace/a-save-failure-is-classified-by-its-code
    held_at: >-
      the UNREACHABLE_CODES constant and the branches of toFailureOutcome()
    evidence: >-
      const UNREACHABLE_CODES: readonly string[] = ["SYSTEM_NETWORK","SYSTEM_TIMEOUT","SYSTEM_ABORTED"]; if (error.code === SESSION_ENDED_CODE) return { kind: "session-ended" }; return UNREACHABLE_CODES.includes(error.code) ? { kind: "unreachable", failure } : { kind: "refused", failure };
  - node: rules/entity-workspace/a-saved-edit-reloads-the-entity
    held_at: >-
      the onSuccess of useEditEntity()
    evidence: >-
      if (outcome.kind === "accepted") { await queryClient.invalidateQueries({ queryKey: entityKeys.node(nodeId), }); }
