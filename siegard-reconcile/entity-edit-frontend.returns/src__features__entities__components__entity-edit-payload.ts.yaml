findings:
  - file: src/features/entities/components/entity-edit-payload.ts
    where: >-
      buildEntityEdit, the .sort(...) over the built changes (lines 129-130)
    evidence: >-
      .sort((first, second) => first.position - second.position)
    cost: >-
      The order in which the edit lists its changes is chosen only here: catalog position of the key, with changed fields ahead of removed fields inside one key (the sort is stable over fieldsToSend). The knowledge base answers one `applied` entry per change "in the order given", and its conflict and no-second-current-value judgments are made over that edit. The next reader looks in the specification for the order a save sends its changes and finds none, so the order reads as an implementation accident rather than a decision.
    kind: unstated
    correction: >-
      Give the order in which a save sends its changes a node, for example by extending rules/entity-workspace/save-sends-one-change-per-changed-field, or state that the order is not significant.
    node: rules/entity-workspace/save-sends-one-change-per-changed-field
