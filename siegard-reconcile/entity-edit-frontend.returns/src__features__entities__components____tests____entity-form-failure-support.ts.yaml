looked_past: >-
  The file's constants `UNDO_WINDOW_MS` and `CUTOFF_MS` repeat durations the nodes hold, and `refusalAnswer` stubs a 422 whose message and details differ from the upstream's published ones; both are test drivers and fixtures that no running system emits, so they are another judgment's.