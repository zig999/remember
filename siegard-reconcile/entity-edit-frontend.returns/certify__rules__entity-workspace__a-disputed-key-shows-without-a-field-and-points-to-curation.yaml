certified:
  - node: rules/entity-workspace/a-disputed-key-shows-without-a-field-and-points-to-curation
    state: covered
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.disputed-keys.spec.tsx
        name: >-
          decides a key's disputed state from the status of its attributes alone: $label
      - file: src/features/entities/components/__tests__/EntityForm.disputed-keys.spec.tsx
        name: shows every value a disputed key holds
      - file: src/features/entities/components/__tests__/EntityForm.disputed-keys.spec.tsx
        name: >-
          shows no field and no add or remove control for a disputed key that is $label
      - file: src/features/entities/components/__tests__/EntityForm.disputed-keys.spec.tsx
        name: >-
          shows the pointer in the disputed key's group alone and keeps the field of a key beside it
      - file: src/features/entities/components/__tests__/EntityForm.disputed-keys.spec.tsx
        name: leads to the curation address when the pointer is followed
      - file: src/features/entities/components/__tests__/EntityForm.disputed-keys.spec.tsx
        name: >-
          makes the pointer a link to exactly /curation, with no search, reading exactly 'Abrir na fila de curadoria'
    why: >-
      Every part of the fact is tested. One test is a disputed attribute that is current. One is a disputed attribute that is not current. One is a current disputed attribute whose validity ended in 2000, so it is no longer in effect. In each of these the key shows its value, has no field and has exactly one link. When that link is clicked the app goes to /curation. Several values on one disputed key are all shown. Text, closed-choice and multi-valued keys all have no field or add/remove control when disputed. Superseded, deleted, uncertain and active attributes keep their field and get no link. One finding is not settled here. The last test checks that the link's text is exactly 'Abrir na fila de curadoria' and that its href is exactly '/curation' with no search. The node only says the key points the owner to the curation workspace. It names neither the label nor the address, so if this node were the only source, that test would check more than the node states. Those two values may come from a sibling node. If they do not, changing the wording would break this test even though the fact still holds. One gap I could not check: the pack let me open only this test file, not the support helpers. So I could not see which effective status or flags `heldAttribute` gives by default. No row in the file sets status to something other than disputed while setting an effective status or flag that reads as disputed. That means the Description's line that a key is not disputed because of its effective status or its flags is only checked to the extent the helper's defaults differ from the status.