certified:
  - node: rules/entity-workspace/fields-start-from-the-current-values
    state: partial
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.starting-values.spec.tsx
        name: starts each field with its key's current attribute value, and empty where the key holds no current attribute
    why: >-
      Both halves of the fact are exercised. A key holding a current attribute starts with that
      value: location gives "Lisbon", and status_text gives "New-status" over its stale
      "Old-status". A key holding none starts empty: owner, whose only attribute is stale, and
      deadline, which holds nothing. The gap is the word "current". The fixtures come from
      staleAttribute, which sets status "superseded" and isCurrent false together, and
      heldAttribute, which sets status "active" and isCurrent true together. No attribute in the
      set is current with a status other than "active", and none is non-current with status
      "active". So a form that picks a field's starting value by status instead of by whether the
      attribute is current passes this test while breaking the fact. A separate point to route,
      not settle: valuesByKey pairs keys to fields by position, taking every input in the
      container in catalog order. The test therefore also requires that the form renders no other
      input and lays fields out in catalog order. The fact states neither.
    remainder: testable
    remainder_why: >-
      Two inputs, each against one expected result. First, a node whose only attribute for a key
      is current but has a status other than "active": the field must start with that value.
      Second, a node whose only attribute for a key has status "active" but is not current: the
      field must start empty.