  - node: contracts/entity-workspace/entity-screen
    held_at: >-
      the three-way chain that builds `results`, in the body of EntityListPage (the show-entity-list operation only)
    evidence: >-
      if (listing.isPending) { results = <ListLoading />; } else if (listing.isError) { results = (<ListErrorAlert onRetry={() => { void listing.refetch(); }} />); } else if (listing.data.items.length === 0) { results = <ListEmpty />; } else { results = <NodeList nodes={listing.data.items} />; }
  - node: rules/entity-workspace/the-listing-request-carries-its-narrowings-by-name
    held_at: >-
      nowhere
    evidence: >-
      The file hands the two narrowings to the hook as `useNodeListing({ namePrefix, nodeType })`. The parameter names name_prefix and node_type, and the omission of a narrowing not given, are not stated in this file.
  - node: rules/entity-workspace/the-node-listing-stands-without-the-node-types
    held_at: >-
      the `typeChoice` chain, with `listing` computed independently of `types`
    evidence: >-
      if (types.data !== undefined) { typeChoice = (<TypeChoice types={types.data} value={nodeType} onChange={setNodeType} />); } else if (types.isError) { typeChoice = (<TypesErrorAlert onRetry={() => { void types.refetch(); }} />); } else { typeChoice = <TypesLoading />; } and `const listing = useNodeListing({ namePrefix, nodeType });`
  - node: rules/entity-workspace/the-screen-lists-nodes-by-prefix-and-type
    held_at: >-
      the `namePrefix` and `nodeType` state, the prefix input, and the call to useNodeListing, plus the NodeList render
    evidence: >-
      const [namePrefix, setNamePrefix] = useState(""); const [nodeType, setNodeType] = useState(""); const listing = useNodeListing({ namePrefix, nodeType }); results = <NodeList nodes={listing.data.items} />;
