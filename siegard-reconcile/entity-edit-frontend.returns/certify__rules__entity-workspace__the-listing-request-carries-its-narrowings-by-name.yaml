certified:
  - node: rules/entity-workspace/the-listing-request-carries-its-narrowings-by-name
    state: covered
    tests:
      - file: src/features/entities/components/__tests__/EntityListPage.listing.spec.tsx
        name: carry the name prefix under name_prefix and the node type by its name under node_type, and carry neither before the owner gives it
      - file: src/features/entities/components/__tests__/EntityListPage.listing.spec.tsx
        name: leave out an emptied name prefix and the all-types option instead of sending an empty value or a sentinel
      - file: src/features/entities/api/__tests__/listing-requests.spec.ts
        name: carries each narrowing given under its parameter and leaves out each not given
      - file: src/features/entities/api/__tests__/listing-requests.spec.ts
        name: treats an empty name prefix or an empty node type as a narrowing not given
    why: >-
      Every part of the fact is exercised through the screen. The name prefix is checked under
      name_prefix. The node type is checked under node_type, by name: the offered types carry
      identities such as "type-id-Artefato" that differ from their names, so a request that sent
      the identity would fail. Each narrowing the owner has not given is checked as left out:
      before any narrowing, with type only, with prefix only after the owner picks the all-types
      option, and with an emptied prefix. The hook-level tests repeat this for all four
      combinations and for empty values. One finding is over-assertion, not a gap. Both screen
      tests, and both hook tests, compare the request's whole sorted query-parameter list for
      exact equality. So they claim the request carries no parameter at all beyond the two
      narrowings. The fact only says which narrowings appear and which are left out. Today that
      holds. These tests will break the day a sibling task legitimately adds a non-narrowing
      parameter to this request, such as the limit or offset the listing response already
      reports.