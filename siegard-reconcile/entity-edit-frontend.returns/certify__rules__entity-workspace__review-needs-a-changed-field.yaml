certified:
  - node: rules/entity-workspace/review-needs-a-changed-field
    state: partial
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.review-offered.spec.tsx
        name: offers the review only while a field differs from the value it started with
    why: >-
      The fact applies to every field on the form. This test fails if the review is offered when the form opens, before anything is edited. It also fails if the review stays offered after the single-valued "title" field is typed back to the value it started with, so it tells "differs" apart from "was touched" for that one field kind. Nothing in the set does the same for the other field kinds the form renders. The temporal "role" field and the multi-valued "tag" field are both on this form but neither is edited. No test edits a temporal field's value and then restores it. No test retypes a held multi-valued field and then restores it. No test adds a value field and then empties or removes it. In each of those cases, a form that offered the review after the field came back to its starting value would still pass. The test also checks that the review is offered while the title differs (whileChanged: true). The node does not state that: it only forbids the offer while nothing differs. That assertion bears on a sibling fact, not this one. The other tests in the file assert other refusals: no review while a value its key's type refuses stands, and no review for an added field that repeats an active or uncertain value. They do not exercise a form where no field differs from its starting value.
    remainder: testable
    remainder_why: >-
      For each field kind the form renders (temporal, multi-valued held, multi-valued added), use one input: change that field, then return it to the value it started with. An added field is emptied or removed. The expected result each time is that the review is not offered.