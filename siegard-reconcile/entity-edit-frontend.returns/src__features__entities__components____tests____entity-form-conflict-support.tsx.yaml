    held_at: >-
      nowhere
    evidence: >-
      The file stages the knowledge base's answers as fixtures and does not state how the request is sent or how failures are read. It holds `acceptedAnswer()` returning `jsonResponse(ACCEPTED_WIRE)`, and `conflictAnswer()` returning a 409 refusal body with `"BUSINESS_ENTITY_EDIT_CONFLICT"` and details `{ attribute_key: "status_text", item_id: "at-status_text-Em andamento" }`. That fixture matches the shape the contract states.
