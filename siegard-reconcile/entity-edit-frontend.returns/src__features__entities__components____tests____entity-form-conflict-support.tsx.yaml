looked_past: >-
  The fixture values (the "Em andamento", "Pausado" and "Concluído" labels, the "ZX-41" marker, the item id "at-status_text-Em andamento") are test data, and the catalog's status_text labels match them. The test-scaffolding choices (the fake timers, the 20 answer turns, the mounting helpers) are code-review matters, so I did not report them.