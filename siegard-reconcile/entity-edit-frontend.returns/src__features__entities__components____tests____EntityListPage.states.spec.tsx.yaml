looked_past: >-
  The fixture names and values the file imports from list-support, such as `APOLLO`, `APOSENTADORIA`, `FAILURE_CODE` and `"Apo|"`, are test data defined outside this file, and the `10_000` polling bound is the test's own, so I reported none of them.