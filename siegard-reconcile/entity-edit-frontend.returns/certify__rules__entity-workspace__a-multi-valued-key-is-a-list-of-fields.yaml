certified:
  - node: rules/entity-workspace/a-multi-valued-key-is-a-list-of-fields
    state: covered
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.multi-valued.spec.tsx
        name: shows one field for each current attribute the node holds of the key and none for a non-current one
      - file: src/features/entities/components/__tests__/EntityForm.multi-valued.spec.tsx
        name: starts each field of the key with the value of its own attribute
      - file: src/features/entities/components/__tests__/EntityForm.multi-valued.spec.tsx
        name: adds one field to the key when the owner adds a field
      - file: src/features/entities/components/__tests__/EntityForm.multi-valued.spec.tsx
        name: starts an added field empty, whatever values the key already holds, and leaves the held fields as they were
      - file: src/features/entities/components/__tests__/EntityForm.multi-valued.spec.tsx
        name: removes the field the owner removes and leaves the others holding their own values
      - file: src/features/entities/components/__tests__/EntityForm.multi-valued.spec.tsx
        name: keeps what the owner typed in a field when another field of the key is removed
      - file: src/features/entities/components/__tests__/EntityForm.multi-valued.spec.tsx
        name: lists a field per current attribute and lets the owner add one and remove one
    why: >-
      The fact is covered by the tests named above. One test in the offered file asserts more
      than the fact states, and it is cited here as a finding rather than as coverage. "offers
      no add or remove control on a key that does not allow multiple current values" asserts
      something about single-valued keys, and the node says nothing about them. It also checks
      that the status_text field group holds zero buttons of any kind (buttonsIn counts every
      button in the group). That is a claim about everything in shared ground, not about the
      add and remove controls only. It would break the day another task legitimately puts any
      button in a single-valued key's group, even though this node's fact still held.