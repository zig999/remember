read:
  - node: contracts/entity-workspace/entity-screen
    held_at: >-
      Only the show-entity-form part that renders one key's group: the help paragraph and the closed-value branch. The rest of the contract (list, review, save, loading and error states) is not in this file.
    evidence: >-
      {hasHelp ? (<p id={helpId} className="text-xs text-muted-foreground">{description}</p>) : null} and {allowedValues === null ? (<Input ... />) : (<ClosedChoice ... allowedValues={allowedValues} .../>)}
  - node: domain/entity-workspace/attribute-field
    held_at: >-
      nowhere
    evidence: >-
      The file declares no shape for the element. It only imports it with `import type { EntityFormValues, GroupField } from "./entity-form-schema";` and reads `fields.map(({ index, id }, position)`.
  - node: rules/entity-workspace/a-changed-stable-field-offers-no-validity
    held_at: >-
      The condition that gates ValidityFields on the key being temporal.
    evidence: >-
      {attributeKey.isTemporal && changed[index] === true ? (<ValidityFields ... />) : null}
  - node: rules/entity-workspace/a-changed-temporal-field-offers-its-validity
    held_at: >-
      The same ValidityFields branch. It is rendered for a changed field of a temporal key. The start and end inputs themselves are in the imported ValidityFields.
    evidence: >-
      {attributeKey.isTemporal && changed[index] === true ? (<ValidityFields attributeKey={key} ... orderMessage={validityOrder[index] ?? null} control={control} />) : null}
  - node: rules/entity-workspace/a-closed-key-offers-only-its-allowed-values
    held_at: >-
      The branch that hands the key's allowed values to ClosedChoice instead of a free-text Input. The order and labels of the values are decided in the imported ClosedChoice.
    evidence: >-
      <ClosedChoice name={numbered ? `${key} (valor ${position + 1})` : key} ... value={field.value} allowedValues={allowedValues} describedBy={described} onChange={field.onChange} />
  - node: rules/entity-workspace/a-disputed-key-shows-without-a-field-and-points-to-curation
    held_at: >-
      The DisputedValues branch and the guard that hides the add button for a disputed key. Whether the key has any field is decided by the `fields` prop the caller passes. This file does not itself drop fields when `disputed` is true.
    evidence: >-
      {disputed ? (<DisputedValues attributeKey={key} values={heldValues} />) : null} and {listed && !disputed ? (<Button ref={addRef} ...
  - node: rules/entity-workspace/a-field-shows-its-key-description-as-help-text
    held_at: >-
      The help paragraph, which is wired into each field's aria-describedby.
    evidence: >-
      const description = attributeKey.description; ... {hasHelp ? (<p id={helpId} className="text-xs text-muted-foreground">{description}</p>) : null}
  - node: rules/entity-workspace/a-multi-valued-key-is-a-list-of-fields
    held_at: >-
      The field list rendered for each entry of `fields`, plus the remove button and the add button, both gated on the key allowing multiple values. The fields come from the caller, one per current attribute.
    evidence: >-
      const listed = attributeKey.allowsMultiple; ... {listed ? (<Button type="button" ... onClick={() => removeField(index)} ...) : null} and onClick={onAdd}
  - node: rules/entity-workspace/a-value-of-the-wrong-type-reads-its-wording
    held_at: >-
      nowhere
    evidence: >-
      The file only shows whatever message the form schema produced: `const message = fieldState.error?.message;` ... {message}. It states no wording and no type check.
  - node: rules/entity-workspace/the-form-has-a-field-group-per-catalog-key
    held_at: >-
      The component renders the group for one catalog key. The one-group-per-key iteration and its order sit in the caller.
    evidence: >-
