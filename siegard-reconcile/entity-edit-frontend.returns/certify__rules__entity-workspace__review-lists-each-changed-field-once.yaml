certified:
  - node: rules/entity-workspace/review-lists-each-changed-field-once
    state: covered
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.review-listing.spec.tsx
        name: lists each changed field once with the value it started with beside the value it now holds
    why: >-
      The fact is covered by the named test. It changes "title" twice (Alpha to Beta to Gamma) and
      checks that "title" appears once, as Alpha beside Gamma. It also checks that each held value of
      the multi-value key "tag" appears once, with its starting value beside its edited value. The
      check is an exact match on every listed entry, so the test fails if a field is listed twice,
      is left out, or loses its starting or current value. Three things in the file are findings,
      not extra coverage. First, that exact match also requires the untouched "role" and "note" to
      be absent. The node says each changed field is listed. It does not say nothing else is.
      Second, the test "does not list a field that holds the value it started with, whether the
      owner never touched it or returned it to that value" asserts that a field returned to its
      starting value is left out. The node does not state that either. Third, the test "does not
      list a field of a temporal key whose value is the value it started with while the validity it
      holds differs from the validity it started with" decides that a validity change alone does
      not count as a changed field. The node does not decide that. If that exclusion is wanted,
      some other node has to state it. The three "entity form review validity" tests check
      validity dates, not this fact. As the pack directs, I read only the proof file. I did not open
      the helper reviewedFieldsIn from entity-form-review-support. The "beside" half of the fact
      depends on that helper taking each entry's previous and next values from the same rendered
      review row.