findings:
  - file: src/features/entities/components/entity-form-schema.ts
    where: >-
      HELD_ATTRIBUTE_STATUSES, lines 58-62, and isHeldAttribute, lines 64-66
    evidence: >-
      const HELD_ATTRIBUTE_STATUSES: readonly string[] = [
        "active",
        "uncertain",
        DISPUTED_ATTRIBUTE_STATUS,
      ];
    cost: >-
      The three statuses a node attribute can hold while it is still held are
      already an enumeration in domain/knowledge-base/live-assertion-status
      (active, uncertain, disputed). This file declares them a second time as
      its own list, and the node is not bound to this file. If the enumeration
      gains or loses a value, no check reaches this list, and nobody can tell
      which of the two was decided.
    kind: contradicts
    correction: >-
      The vocabulary needs one home. Either the node binds to this file, so
      that a change to the node reaches the list, or the list is derived from
      a declaration the node is bound to. Code cannot read the specification,
      so the correction is the bind and not a request that the file read it.
    node: domain/knowledge-base/live-assertion-status
  - file: src/features/entities/components/entity-form-schema.ts
    where: >-
      outsideCatalogGroupsOf, line 92, and heldAttributesOf, lines 68-75
    evidence: >-
      if (!isHeldAttribute(attribute)) continue;
    cost: >-
      The node says an attribute whose key the catalog no longer holds
      "MUST show its value without a field", with no status condition. The
      code drops every attribute that is superseded, deleted or of any status
      outside the three listed. That exclusion is a rule about what the owner
      sees, and it lives only here. The next reader looks for it in the
      specification and does not find it.
    kind: unstated
    correction: >-
      Add to the outside-the-catalog rule, or to a sibling node, which
      statuses show their value. The code can then stay as it is.
    node: rules/entity-workspace/attributes-outside-the-catalog-show-without-a-field
