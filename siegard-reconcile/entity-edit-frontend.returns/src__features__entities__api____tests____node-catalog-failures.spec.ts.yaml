looked_past: >-
  The simulated 500 answer carries `details: { cause: "trace-1" }` and the 410 answer carries the message "KnowledgeNode is marked as deleted"; these are fixtures fed to the read hooks, whose failures are only compared with the http function's, so I took them for inputs and not as domain facts the file states.