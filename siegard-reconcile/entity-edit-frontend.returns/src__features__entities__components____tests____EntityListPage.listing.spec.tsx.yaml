looked_past: >-
  The fixtures, the page helpers and the `data-*` or role lookups this spec uses all live in the sibling files list-support and page-support, outside this file set. The all-types option, counted as `others: 1`, names a control, which is no fact of the domain. The test titles and the `UNNARROWED` and `TYPE_NAMES` data are fixtures that state no domain fact of their own.