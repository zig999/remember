      The assertions in the describe "the requests of the entity listing", for the list-nodes request. The setup also builds the node-types listing with `typesListing(TYPE_NAMES)`.
    evidence: >-
      expect({ none, typeOnly, both }).toEqual({ none: [], typeOnly: [["node_type", "Artefato"]], both: [ ["name_prefix", "Apo"], ["node_type", "Artefato"], ], });
  - node: contracts/entity-workspace/entity-screen
    held_at: >-
      The describe "each node of the entity listing" and the describe "the narrowings of the entity listing". Both cover the show-entity-list operation (name, type and status per node, narrowed by prefix and type). No loading, error or empty state of the listing is asserted.
    evidence: >-
      expect( UNNARROWED.map((node, index) => (rows[index] ?? "").includes(field(node))), ).toEqual(UNNARROWED.map(() => true));
