findings:
  - file: src/features/entities/components/entity-review.tsx
    where: >-
      ReviewValue, line 19, the wording shown for a value that is empty
    evidence: >-
      <span className="italic text-muted-foreground">Sem valor</span>
    cost: >-
      The text the review shows for an absent previous or new value, such as a first value or a removal, is a wording no node holds. The wording rules of the entity workspace pin the texts the screen shows to the letter ("Edição registrada.", "Primeiro valor" and others). This one lives only in this component, so the next reader looks in the specification and finds no such text. A later edit to it would not be a decision anyone recorded.
    kind: unstated
    correction: >-
      Give the wording for an empty previous or new value in the review a node. The show-review answer of contracts/entity-workspace/entity-screen, or a wording rule beside review-names-each-effect-in-its-wording, could hold it. Until then the string is a domain wording decided only in source.
    node: contracts/entity-workspace/entity-screen
