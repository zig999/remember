certified:
  - node: rules/entity-workspace/the-form-has-a-field-group-per-catalog-key
    state: partial
    tests:
      - file: src/features/entities/components/__tests__/EntityForm.field-groups.spec.tsx
        name: holds one field for every catalog key of the node's type, in the order the catalog lists them
      - file: src/features/entities/components/__tests__/EntityForm.field-groups.spec.tsx
        name: shows each field the description the catalog holds for its own key as help text
      - file: src/features/entities/components/__tests__/EntityForm.field-groups.spec.tsx
        name: adds no field for an attribute whose key the catalog does not hold
      - file: src/features/entities/components/__tests__/EntityForm.field-groups.spec.tsx
        name: offers no field, prefilled or empty, for a key holding a disputed attribute
    why: >-
      "holds one field for every catalog key..." covers part of the fact. It uses a catalog of
      three keys listed out of alphabetical order (gamma, alpha, beta). One key holds no value.
      All three keys are plain text keys that take one value and carry no dates. The test checks
      that every `input` in the form appears in catalog order (["G-value", "", "B-value"]). It
      would fail if a group were dropped, if the order changed, or if a key holding no value
      lost its group. The fact's "every attribute key the catalog holds" goes unchecked for any
      other kind of key. Nothing in the set uses a key that takes several values, a key that
      carries dates, or a key with a closed list of allowed values. Such a key may render a
      group with more than one input, or with a control that is not an `input`. The helper
      `valuesOf` counts only `input` elements, so it would never see that control. So nothing
      shows that such keys get their group, or get it in catalog order.

      "offers no field, prefilled or empty, for a key holding a disputed attribute" pins the
      opposite of the node as written. The catalog holds alpha and beta, and alpha holds a
      disputed attribute. The test asserts that the form holds only beta's field, so the form
      has no group for a key the catalog holds. If the fact held whole, that test would fail.
      The node states no exception for disputed attributes. Which one stands, the node or the
      test, is a person's decision. This audit does not settle it.

      "adds no field for an attribute whose key the catalog does not hold" asserts more than
      this node says. The node requires a group for every catalog key. It does not say there is
      no group for a key outside the catalog. That exclusion is not a fact this node states.

      "shows each field the description the catalog holds for its own key as help text" pairs
      each key with an input by position. It would also fail if the order changed, but only as
      a side effect of checking help text. Nothing in that test marks the order as the point.
    remainder: testable
    remainder_why: >-
      Each gap closes with one input against one expected result. First input: a catalog that
      lists a key taking several values, a key carrying dates, and a key with a closed list of
      allowed values, mixed with text keys. Expected result: one group per key, in catalog
      order, found by key rather than by counting `input` elements. Second input: a catalog key
      whose only attribute is disputed. Expected result under the node as written: the form
      still holds a group for that key. That assertion contradicts what "offers no field,
      prefilled or empty, for a key holding a disputed attribute" pins now, so a person decides
      between the node and that test before such a test can be written.