  - node: rules/entity-workspace/attributes-outside-the-catalog-show-without-a-field
    held_at: >-
      the OutsideCatalogValues component, which renders each group as a dt with the key and a dd with the value. It declares no field or input anywhere. The choice of which attributes count as outside the catalog is made by outsideCatalogGroupsOf in entity-form-schema.ts, not in this file.
    evidence: >-
      <dt className="text-xs text-muted-foreground">{key}</dt> ... <dd key={attribute.id} data-testid={`entity-outside-catalog-value-${key}`} className="text-sm text-foreground"> {attribute.value} </dd>
