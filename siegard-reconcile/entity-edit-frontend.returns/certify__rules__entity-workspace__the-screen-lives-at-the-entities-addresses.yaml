certified:
  - node: rules/entity-workspace/the-screen-lives-at-the-entities-addresses
    state: partial
    tests:
      - file: src/router/__tests__/routes.entity-list.dom.spec.tsx
        name: >-
          fetch the code of each page only when its address is first opened, never with the initial load or a preload, and open the listing at /entities and the form at /entities/{identity}
      - file: src/router/__tests__/routes.entity-list.dom.spec.tsx
        name: >-
          renders the listing in the workspace of the application shell for a visit with a session
      - file: src/router/__tests__/routes.entity-list.dom.spec.tsx
        name: >-
          does not fetch the listing page's code with the initial load of the application
      - file: src/router/__tests__/routes.entity-list.dom.spec.tsx
        name: >-
          does not fetch the listing page's code when its address is preloaded
    why: >-
      The tests exercise most of the fact. They show the listing at /entities and the form at
      /entities/n-1. They check that neither page's code is fetched when the application first
      loads at /graph. They check that opening /entities fetches the listing code and not the
      form code. Their only order of visits is the listing first and then the form. Nothing in
      the set opens /entities/{node identity} directly without visiting /entities first. So no
      test checks that opening the form's address leaves the listing page's code unfetched,
      which the rule requires ("each" page's code fetched "only when its address is first
      opened"). If a route arrangement fetched the listing code whenever the form address
      opens, the combined test would still pass, because the listing code is already loaded by
      then. Two cited tests also check that preloading an address does not fetch its code. The
      rule follows from that wording and states it nowhere else. The test "redirects a visit
      without a session to /sign-in instead of showing the listing" is about the guarded layout,
      which the node's description leaves to
      rules/application-shell/every-other-address-is-guarded. For that reason it is not cited
      here.
    remainder: testable
    remainder_why: >-
      Start the application at /graph with a session. Open /entities/{node identity} directly,
      without opening /entities first. Expect the form page's code to be fetched once, the form
      to be shown at /entities/{node identity}, and the listing page's code not to be fetched.