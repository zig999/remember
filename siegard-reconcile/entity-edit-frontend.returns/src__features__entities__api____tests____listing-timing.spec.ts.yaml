  - node: rules/entity-workspace/a-401-refreshes-the-token-and-repeats-the-request-once
    held_at: >-
      the single `it(...)` in `describe("read answered 401 on its first attempt")`, lines 43-77. It exercises the rule on the listing read and asserts the outcome.
    evidence: >-
      `answersAfter(20_000, () => jsonResponse({}, 401))` for the first attempt and `answersAfter(29_000, () => jsonResponse({}, 401))` for the repeat, with `refreshes: 1, requests: 2`, `repeatAuthorization: "Bearer new.token"`, `repeatTarget: [first?.method, first?.url.href]` and `repeatAnswered: 401`. The second answer comes 29 s after the repeat, so the repeat has its own cutoff, since the two waits together exceed 30 s.
