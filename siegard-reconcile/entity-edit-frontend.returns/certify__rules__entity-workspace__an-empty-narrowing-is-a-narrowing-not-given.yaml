certified:
  - node: rules/entity-workspace/an-empty-narrowing-is-a-narrowing-not-given
    state: covered
    tests:
      - file: src/features/entities/api/__tests__/listing-requests.spec.ts
        name: treats an empty name prefix or an empty node type as a narrowing not given
      - file: src/features/entities/components/__tests__/EntityListPage.listing.spec.tsx
        name: leave out an emptied name prefix and the all-types option instead of sending an empty value or a sentinel
    why: >-
      Not a coverage gap, but a finding for a reader to route: both tests assert more than this
      node states. Both compare the request's whole query-parameter set with exact equality, so
      they also claim that no other parameter is sent. The node is only about whether an empty
      prefix or type counts as a narrowing that was given. If a sibling task legitimately adds
      another listing parameter, such as paging, both tests break even though this fact still
      holds. Whether the request carries only the narrowings is for
      rules/entity-workspace/the-listing-request-carries-its-narrowings-by-name to say, and that
      rule was not read here. A note on the screen test: it produces an empty node type through
      the all-types option. The hook test passes a literal empty string for each narrowing
      directly.