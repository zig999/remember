  - node: contracts/entity-workspace/bff-entity-edit
    held_at: >-
      nowhere
    evidence: >-
      The file sends no request. It renders the form and reads the review through helpers, for example `const entries = await reviewedEffectsIn(container);`.
  - node: contracts/entity-workspace/bff-entity-reads
    held_at: >-
      nowhere
    evidence: >-
      The file makes no read of the knowledge base. It builds a node with `nodeHolding([...])` and passes the catalog to `renderForm(...)`.
  - node: contracts/entity-workspace/entity-screen
    held_at: >-
      the show-review answer, in part, through the assertions in the three describe blocks
    evidence: >-
      `expect(effectsWhere(entries, { key: "role", previous: "Open" })).toEqual([ ["Sucessão"], ]);` The file reads only the effect shown for a changed field.
  - node: contracts/knowledge-base/entity-editing
    held_at: >-
      nowhere
    evidence: >-
      No edit is sent and no refusal is read. The file reads only `reviewedEffectsIn(container)`.
  - node: contracts/knowledge-base/retrieval
    held_at: >-
      nowhere
    evidence: >-
      The file makes no retrieval call. It uses `nodeHolding(...)` and `catalogKey(...)`.
  - node: domain/entity-workspace/attribute-field
    held_at: >-
      nowhere
    evidence: >-
      The file declares only the test types `interface FirstValueCase`, `AdditionCase` and `EmptiedCase`. None of them declares the shape of the field.
  - node: domain/entity-workspace/entity-edit-session
    held_at: >-
      nowhere
    evidence: >-
      The file declares no session shape. It drives the form with `typeInto`, `addValue` and `removeValue`.
