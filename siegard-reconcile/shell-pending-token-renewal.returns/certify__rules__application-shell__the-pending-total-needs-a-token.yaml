certified:
  - node: rules/application-shell/the-pending-total-needs-a-token
    state: covered
    tests:
      - file: src/shell/api/__tests__/use-shell-status.spec.ts
        name: >-
          is the queue listing with limit 1 and the token as bearer, made only with a token, and an answer without a total counts as 0
      - file: src/shell/api/__tests__/use-shell-status.spec.ts
        name: >-
          is not made while no access token is held
      - file: src/shell/api/__tests__/use-shell-status.spec.ts
        name: >-
          asks the identity provider once with the session cookie and repeats the read with the fresh token
      - file: src/shell/api/__tests__/use-shell-status.spec.ts
        name: >-
          asks the repeated read as the queue listing with limit 1
      - file: src/shell/api/__tests__/use-shell-status.spec.ts
        name: >-
          shows the total of the repeated read's answer
      - file: src/shell/api/__tests__/use-shell-status.spec.ts
        name: >-
          shows 0 pending, not the total shown before, when the repeated read's answer has no total
    why: >-
      Every part of the fact is exercised by exact-equality assertions. These are the exact
      request URL `/api/v1/curation/queue?limit=1`, the exact `Bearer <token>` header, zero
      pending requests while no token is held, the shown value equal to the answer's `total`,
      and 0 shown after a later answer `{}` that replaced a total of 5. The first named test
      also asserts more than the fact establishes. Its `withoutToken.shown: 0` fixes the value
      shown when no request was ever made. The fact states only that an answer without a total
      counts as 0. It says nothing about the value before any answer, so that assertion would
      break on a change the fact allows. A reader should route that finding. It does not reduce
      the coverage. Separately, the last named test treats a 401 on the repeated read as "an
      answer without a total". That is the test's reading, not the node's wording.