findings:
  - file: src/shell/api/use-shell-status.ts
    where: >-
      renewToken(), line 43, inside the renewal that getPendingJson() runs on a 401
    evidence: >-
      useAuthStore.getState().setToken(fresh);
    cost: >-
      After a renewal, the fresh token is also kept as the shell's stored token, so every later read uses it. No node of the pending-read renewal says this. The nodes say only that the shell asks the identity provider once and asks the read once more with the fresh token. The one rule that states storing a renewed token, a-refreshed-token-repeats-the-request, constrains the request helper and not this read. A reader looking in the specification for what happens to the token after a renewed pending read finds nothing, and the answer lives only in this file.
    kind: unstated
    correction: >-
      The analysis would decide whether a renewed token on the pending read is stored. If it is, a node would state it, probably rules/application-shell/an-expired-token-is-renewed-by-the-pending-read, or the node the request-helper rule belongs to would be widened to cover it.
    node: rules/application-shell/an-expired-token-is-renewed-by-the-pending-read
