findings:
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      the header comment, lines 13-21. The same closed-domain wording recurs in the
      docstring on `attributeValidValuesByKeyId` (lines 96-112) and the docstring on
      `domainOf` (lines 227-249).
    evidence: >-
      // materializes the closed value domains per `AttributeKey` from the new
      // `attribute_valid_value` table ... A key with
      // zero rows = open domain (backward-compatible legacy behavior; any literal
      // that parses against `value_type` is accepted). A key with >= 1 rows =
      // closed domain — only the listed values are accepted by the structural
      // validator.
    cost: >-
      These comments state, a second time and in prose, which attribute keys are
      closed and what a closed key accepts. That is a fact attribute-key holds
      through `allowed_values`. The code here already holds the distinction:
      `domainOf` returns `null` for an open key and the set for a closed one, and
      `buildSnapshot` accumulates the set. A reader who looks here finds a second
      statement of the rule with its own wording, such as "backward-compatible
      legacy behavior". When the node moves, `--check` does not reach this prose.
      The prose also describes enforcement that happens in another file,
      `validation/structural.ts`, which I did not read. The candidate index binds
      that file to rules/knowledge-base/attribute-value-in-allowed-values.
    kind: restates
    correction: >-
      Remove the prose. The pair conforms: the closed and open domain is held by
      `attributeValidValuesByKeyId` and `domainOf`, and the node binds that
      declaration.
    node: domain/knowledge-base/attribute-key
