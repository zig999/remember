read:
  - node: domain/knowledge-base/knowledge-link
    held_at: nowhere
    evidence: >-
      The file declares no shape of a KnowledgeLink. getProvenanceByLinkService only
      passes a link id to the repository and groups the rows that come back:
      `const exists = await linkExists(client, linkId);` and
      `const rows = await chainByLink(client, linkId);`. The provenance shape it fills
      (`ProvenanceResponse`, `ProvenanceFragment`, `ProvenanceChunk`) is imported from
      "../dto/response.dto.js", and the chain row type (`ProvenanceChainRow`) is imported
      from "../repository/provenance.repository.js". This file reads the provenance
      field of a shape declared in other files.
  - node: domain/knowledge-base/node-attribute
    held_at: nowhere
    evidence: >-
      The file declares no shape of a NodeAttribute. getProvenanceByAttributeService only
      passes an attribute id to the repository and groups the rows that come back:
      `const exists = await attributeExists(client, attributeId);` and
      `const rows = await chainByAttribute(client, attributeId);`. The provenance shape
      it fills is imported from "../dto/response.dto.js". This file reads the provenance
      field of a shape declared in other files.
looked_past: >-
  The refusal order (fragment not accepted, then compliance tombstone, then empty chain), the accepted-status gate and the empty-chain refusal are all held by nodes outside this set (rules/knowledge-base/provenance-requires-accepted-fragment, compliance-refusal-takes-precedence, provenance-refused-after-compliance-deletion, empty-provenance-chain-refused), and the code agrees with them, so none is reported here; the log lines, the grouping code and the Number(...) conversion are not domain facts and are not this pass's judgment.
