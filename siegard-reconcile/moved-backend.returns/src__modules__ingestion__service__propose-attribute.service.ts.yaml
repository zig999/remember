    where: >-
      the comment block above the closed-domain gate, lines 85-92 ("Closed-domain gate (BR-30)" through "Exact match (no normalisation) per spec §1 / BR-30 v1 semantics.")
    evidence: >-
      // key is closed and `assertValueInDomain` rejects out-of-domain literals
      // with `VALIDATION_INVALID_FORMAT` carrying `{ value, allowed_values }`.
      // Exact match (no normalisation) per spec §1 / BR-30 v1 semantics.
    cost: >-
      The rule that an attribute value must be one of the allowed values exactly as written is stated in prose here, next to the call that enforces it. A reader can take this comment for the place the rule is decided. If the node moves, the comment keeps asserting the old wording, and nothing reads it or flags it.
    kind: restates
    correction: >-
      Remove the comment. Code holds the fact: the `domainOf` / `assertValueInDomain` branch in this file delegates to `assertValueInDomain` in backend/src/modules/ingestion/validation/structural.ts, where the exact-match comparison lives. The fact is already held by the node, so this is the comment-only route, followed by a reconcile over the file.
    node: rules/knowledge-base/attribute-value-in-allowed-values
