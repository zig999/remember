  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      the document_date branch of the requires_valid_from fallback, lines 144-158
    evidence: >-
      if (input.document_date !== null) { ... return { valid_from: input.valid_from, valid_from_basis: input.valid_from_basis, }; }
    cost: >-
      The node says a proposal that requires a start and states none takes the source's document
      date with basis document. This branch passes the proposal through with valid_from and basis
      both null. A row for a type that requires a validity start is left without one, and without
      a justification. The decision log records exactly this divergence as the reason the node was
      decided, yet the code still carries it.
    kind: contradicts
    correction: >-
      When requires_valid_from is true, valid_from is null and document_date is present, resolve
      valid_from to the document date (date portion) with valid_from_basis "document", as the
      received branch already does for its own link. Bind
      rules/knowledge-base/required-start-fallback to this file.
    node: rules/knowledge-base/required-start-fallback
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      the final throw of the requires_valid_from branch, lines 167-172
    evidence: >-
      throw new ValidationFailure("BUSINESS_DATE_UNJUSTIFIED", "link_type / attribute_key requires_valid_from = true but no date is available (stated, document_date, and received_at are all absent).", { requires_valid_from: input.requires_valid_from } );
    cost: >-
      The refusal of a proposal that requires a start when no start, document date or reception
      date exists is held here. The node that holds it, rules/knowledge-base/required-start-available,
      is not bound to this file. A change to the node never reaches this refusal, and the next
      reader looks for the rule in the specification and cannot tell it lives here too.
    kind: contradicts
    correction: >-
      Bind rules/knowledge-base/required-start-available to this file. The refusal and its error
      code already agree with the node.
    node: rules/knowledge-base/required-start-available
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      the BUSINESS_DATE_UNJUSTIFIED message for a valid_from without a basis, line 139
    evidence: >-
      "valid_from supplied without a valid_from_basis (stated | document | received)."
    cost: >-
      This is text the system emits to the caller. It lists received as a basis the caller may
      supply. The node says a proposal must not state basis received. A caller who follows the
      message is steered into supplying a basis that another layer refuses with
      VALIDATION_INVALID_FORMAT, which is a different error code.
    kind: contradicts
    correction: >-
      The message should name only the bases a proposal may state (stated | document).
    node: rules/knowledge-base/caller-never-states-received
