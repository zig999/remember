read:
  - node: domain/knowledge-base/knowledge-link
    held_at: >-
      LinkDetailResponseSchema, lines 14-33. It declares the attributes the node lists: status, recorded_at, valid_from, valid_to, superseded_at, confidence, provenance and the valid-from basis. It also declares the source, target, link-type and supersedes relationships as source_node_id, target_node_id, link_type and supersedes_link_id.
    evidence: |-
      export const LinkDetailResponseSchema = z.object({
        source_node_id: z.string().uuid(),
        target_node_id: z.string().uuid(),
        link_type: z.string(),
        valid_from: z.string().regex(/^\d{4}-\d{2}-\d{2}$/).nullable().optional(),
        valid_to: z.string().regex(/^\d{4}-\d{2}-\d{2}$/).nullable().optional(),
        recorded_at: z.string().datetime({ offset: true }),
        superseded_at: z.string().datetime({ offset: true }).nullable().optional(),
        status: AssertionStatusSchema,
        confidence: z.number().min(0).max(1),
        valid_from_source: ValidFromSourceSchema.nullable().optional(),
        supersedes_link_id: z.string().uuid().nullable().optional(),
        provenance: z.array(ProvenanceEntryResponseSchema),
looked_past: >-
  The leading comment ("Mirrors `openapi.yaml` components.schemas.LinkDetail.") is prose and carries no domain fact, so I did not file it. The wire name `valid_from_source` differs from the node attribute `valid_from_basis`, but contracts/knowledge-base/curation.md already uses `valid_from_source` as a wire field and retrieval.md describes the link detail's extra fields (inverse name, effective status, current and in effect, flags) in the same terms as this file, so I left it unfiled.
