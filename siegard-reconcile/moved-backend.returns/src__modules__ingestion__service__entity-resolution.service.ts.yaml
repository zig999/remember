    cost: >-
      The prose states a second time that entity resolution compares names under norm(). The queries in this file hold that fact, at `WHERE na.alias_norm = norm($1::text)` and `na.alias_norm % norm($1::text)`. If the rule moves, this prose stays behind, and a reader can take it for where the rule is decided.
