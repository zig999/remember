read:
  - node: rules/knowledge-base/attribute-value-in-allowed-values
    held_at: >-
      assertValueInDomain(value, domain), lines 109-125. It is the exact-match
      gate, and it raises VALIDATION_INVALID_FORMAT with the sorted allowed
      values on a miss.
    evidence: |-
      export function assertValueInDomain(
        value: string,
        domain: ReadonlySet<string>
      ): void {
        if (domain.has(value)) {
          return;
        }
        const allowed_values = [...domain].sort();
        throw new ValidationFailure(
          "VALIDATION_INVALID_FORMAT",
          "attribute value not in closed domain",
          { value, allowed_values }
        );
      }
