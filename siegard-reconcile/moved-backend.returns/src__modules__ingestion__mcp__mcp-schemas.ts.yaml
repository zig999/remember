read:
  - node: domain/knowledge-base/node-alias
    held_at: >-
      nowhere
    evidence: >-
      The node declares the NodeAlias shape (alias, kind: alias-kind, created_at, reference to llm-run). This file declares no such shape. The only alias-related construct is a field of the directed-ingestion node item, which passes alias surface forms along: `aliases: z.array(z.string().min(1).max(500)).optional()`. It has no kind, no created_at and no llm-run reference, so it is a value passed along, not the element's shape. The alias row shape is therefore held in another file.
looked_past: >-
  The file's schemas carry many facts that other nodes outside this set hold and that the code states in agreement with them: 10,485,760 content units, the recent-ingestions limit of 1..50 with default 10, directed reference 1..120, directed attribute value 1..2000, node name and alias 1..500, directed label 1..200, the YYYY-MM-DD date format, and the stated/document basis. Whether those nodes should be bound to this file is the trace's question, not this judgment's. The file's comments restating BR-21/24/28/33/34 and the directed-ingestion sentinels are prose that no node of this set governs.
