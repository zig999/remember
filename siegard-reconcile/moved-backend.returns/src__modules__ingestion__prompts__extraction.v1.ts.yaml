findings:
  - file: src/modules/ingestion/prompts/extraction.v1.ts
    where: >-
      lines 89-99, the comment block above `attrKeysByNodeType` in `system()`
    evidence: >-
      "The runtime check (`assertValueInDomain`, BR-30) is still the authoritative
      gate; this is a hint to steer the LLM toward in-domain values."
    cost: >-
      The allowed-values rule is written a second time as prose in the prompt
      builder. A reader changing the rule can take this comment for its home.
      The running gate is in another file, and the comment does not move with it.
    kind: restates
    correction: >-
      Remove the comment. The fact is already held by
      `assertValueInDomain` in
      /home/siegfriedneto/projects/eternal/backend/src/modules/ingestion/validation/structural.ts,
      which throws `VALIDATION_INVALID_FORMAT` for a value outside the domain.
    node: rules/knowledge-base/attribute-value-in-allowed-values
  - file: src/modules/ingestion/prompts/extraction.v1.ts
    where: >-
      the "Dates" section of the SYSTEM prompt built by `system()`, lines 164-167
    evidence: >-
      "- Justify it with `valid_from_basis`: `stated` only when the start date is",
      "  written in the chunk (and supported by a cited fragment); `document` uses",
      "  the document date; otherwise omit `valid_from`/basis and the backend",
      "  records `received`. NEVER invent a date. Dates are ISO `YYYY-MM-DD`."
    cost: >-
      The prompt tells the model that an omitted start always ends up recorded
      as `received`. The node says the backend takes the source's document date
      with basis `document` when the source has one, and only falls back to
      `received` when it has none. A model that follows the prompt will believe
      the document date is lost when it omits the start, so the prompt and the
      backend disagree about what gets recorded.
    kind: contradicts
    correction: >-
      The prompt text would have to say that an omitted start, on a type that
      requires one, is filled from the document date with basis `document`,
      else from the reception date with basis `received`.
    node: rules/knowledge-base/required-start-fallback
