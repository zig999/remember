    held_at: nowhere
    evidence: >-
      The file only builds a logger: `return pino(options);`. It carries no CORS or origin handling.
  - node: constraints/anthropic-key-required
    held_at: nowhere
    evidence: >-
      `buildLogger(env: Pick<Env, "LOG_LEVEL" | "NODE_ENV">)` reads only the log level and the environment name. It does not check any provider key.
  - node: constraints/curation-mcp-needs-no-run-identity
    held_at: nowhere
    evidence: >-
      The file has no MCP or run-identity logic. Its only construct is the `buildLogger` factory.
  - node: constraints/curation-write-failure-logged
    held_at: nowhere
    evidence: >-
      The file only configures pino. It emits no `curation_request_failed` log line and no error-level event.
