findings:
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the comment above the `logLevel === "error"` branch in sendError, lines 87-93
    evidence: >-
      // Infra / unknown faults (logLevel "error": pg unavailable, unhandled
      // exceptions) have their `err.message` masked in the envelope. Log the
      // original server-side so the cause is not lost
    cost: >-
      The comment says again that an unreachable-store write failure is logged with its cause. The code
      holds that fact at the `logger.error(... "curation_request_failed")` call just below it. A second
      account of the fact sits beside the node's own, and if the node moves the comment goes on
      claiming the old behaviour.
    kind: restates
    correction: >-
      Remove the comment. The code in this file already holds the fact, so nothing needs to be added anywhere.
    node: constraints/curation-write-failure-logged
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the same comment in sendError, lines 90-93
    evidence: >-
      // Expected client-driven
      // faults (logLevel "warn": business / validation / not-found) are NOT logged
      // here, matching the pre-refactor behaviour and avoiding log noise.
    cost: >-
      The comment restates that business and validation refusals are not logged at error level. The
      `if (logLevel === "error")` gate in this file holds that fact. The comment is a second home
      outside behaviour, and its reference to "pre-refactor behaviour" points to a history the
      specification does not carry.
    kind: restates
    correction: >-
      Remove the comment. The gate in sendError already holds the fact.
    node: constraints/expected-refusals-not-logged-as-errors
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the comment above the GET /metrics handler, lines 126-135
    evidence: >-
      // Wraps the shared mapper with a graceful-degradation override: ANY residual
      // 500 outcome is re-mapped to 503 SYSTEM_SERVICE_UNAVAILABLE so the front
      // spec MetricsStrip (R1) can fall back to per-kind totals from /queue. 401
      // auth failures and 2xx responses are NEVER degraded.
    cost: >-
      The comment restates the metrics refusal that the node holds: when the metrics cannot be read, the
      answer is HTTP 503 SYSTEM_SERVICE_UNAVAILABLE. The code holds the same thing in this file at
      `const degradedStatus = statusCode === 500 ? 503 : statusCode`. The comment also adds a rationale
      (a front-end MetricsStrip fallback) and a "401 ... NEVER degraded" claim. Neither of those
      appears in any node I opened.
    kind: restates
    correction: >-
      Remove the comment. The code in this file holds the fact. The rationale belongs in the decision
      log of the node, not in source.
    node: contracts/knowledge-base/curation
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the comment inside the GET /metrics handler, lines 145-149
    evidence: >-
      // Bare success body — consistent with every other curation REST
      // endpoint (queue/confirm/reject/...). The SPA's httpCuration returns
      // the raw 2xx JSON, so an `{ ok, result }` wrapper here would surface
    cost: >-
      The comment restates that the metrics success is an HTTP 200 with no envelope, which the node
      holds. The code holds it at `return reply.status(200).send(result);`. The comment is a second
      account of a contract fact, and it names SPA internals.
    kind: restates
    correction: >-
      Remove the comment. The code in this file already holds the fact.
    node: contracts/knowledge-base/curation
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the warn log line in the GET /metrics catch block, lines 169-186
    evidence: >-
      deps.logger.warn(
        { route: "GET /api/v1/curation/metrics", operation: "getCurationMetrics", transport: "rest", original_status: statusCode, outcome: degradedStatus, error_code: degradedEnvelope.error.code, error_class: ..., cause_message: ... },
        "curation_metrics_degraded"
      );
    cost: >-
      The system emits a log event, a level, a trigger (a 500, or an error-level mapping) and a set of
      fields for a degraded metrics read. No node I read or searched for holds any of them. The
      sibling constraint curation-write-failure-logged shows that this project specifies such log
      events. A reader looking in the specification for what is logged when the metrics read degrades
      finds nothing, and the file becomes the only place that behaviour lives.
    kind: unstated
    correction: >-
      Analysis should decide whether a degraded metrics read is logged. If it is, the decision should
      name the event, the level and the fields, in a node beside curation-write-failure-logged.
read:
