    held_at: nowhere
    evidence: >-
      The file sets no origin header. It only calls `reply.status(statusCode).send(envelope)` and
      `reply.status(200).send(result)`.
  - node: constraints/anthropic-key-required
    held_at: nowhere
    evidence: >-
      The file reads no environment and no provider key. Its deps are `pool`, `logger`, `catalog` and
      `ingestionCatalog`.
  - node: constraints/curation-mcp-needs-no-run-identity
    held_at: nowhere
    evidence: >-
      This is the REST route file. Its routes (`app.get("/queue"`, `app.post("/items/confirm"` and so
      on) carry no MCP transport and no run identity.
  - node: constraints/curation-write-failure-logged
    held_at: >-
      sendError, lines 94-105, the `logLevel === "error"` branch. It is used by the write routes
      (resolve, merge, dispute, confirm, reject, correct).
    evidence: >-
      if (logLevel === "error") { logger.error({ route: ..., method: reply.request.method, error_code: envelope.error.code, cause_message: err instanceof Error ? err.message : String(err), cause_name: ... }, "curation_request_failed"); }
  - node: constraints/expected-refusals-not-logged-as-errors
    held_at: >-
      the `if (logLevel === "error")` gate in sendError, lines 94-105. Only causes the mapper
      classifies as "error" are logged at error level. The classification itself comes from
      `mapErrorToHttpResponse` in another file.
    evidence: >-
      const { statusCode, envelope, logLevel } = mapErrorToHttpResponse(err);
      if (logLevel === "error") { logger.error({ ... }, "curation_request_failed"); }
      return reply.status(statusCode).send(envelope);
  - node: constraints/extraction-model-call-bounded
    held_at: nowhere
    evidence: >-
      The file has no model call, timeout or retry. Every handler calls a curation service.
  - node: constraints/ingest-toolset-offers-no-async-ingestion
    held_at: nowhere
    evidence: >-
      The file registers only curation routes (/queue, /metrics, /entity-matches/:node_id/resolve,
      /nodes/merge, /disputes/resolve, /items/*). It registers no ingest tool.
  - node: constraints/local-operator-token-minimum-length
    held_at: nowhere
    evidence: >-
      The file does no authentication and has no token. Its header comment says "handlers do NOT
      re-check the token".
  - node: constraints/local-operator-token-needs-explicit-development
    held_at: nowhere
    evidence: >-
      The file reads no configuration or environment. It registers routes only.
  - node: constraints/logs-redact-text-fields
    held_at: nowhere
    evidence: >-
      The file configures no redaction. The objects it logs carry only `route`, `method`,
      `error_code`, `cause_message`, `cause_name` and similar fields, and none of them is a content,
      text or value field.
  - node: constraints/mcp-endpoint-serves-only-its-toolset
    held_at: nowhere
    evidence: >-
      The file is the REST surface only and has no MCP tool dispatch. Its header comment says only
