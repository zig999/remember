read:
  - node: constraints/answers-carry-allowed-origin
    held_at: nowhere
    evidence: >-
      The file registers seven MCP tools and sets no response header or origin.
      Its only response construction is `return { ok: true, result };` and
      `return mapErrorToEnvelope(err);`.
  - node: constraints/anthropic-key-required
    held_at: nowhere
    evidence: >-
      The file reads no configuration and no model-provider key. Its deps are
      `mcp`, `pool`, `logger`, `catalog` and `ingestionCatalog`.
  - node: constraints/curation-mcp-needs-no-run-identity
    held_at: >-
      makeHandler and the seven registerTool calls in registerCurationToolset.
      No handler reads a run identity, and the toolset is registered under
      "curation" with no run-bound step.
    evidence: >-
      `return async (rawInput: unknown): Promise<McpEnvelopeJson> => { try {
      const parsed = schema.parse(rawInput) as z.output<S>; const result =
      await run(parsed);`. The services are called with `{ pool }` or
      `{ pool, logger }` and the parsed input, and no llm_run_id is passed.
  - node: constraints/curation-write-failure-logged
    held_at: nowhere
    evidence: >-
      The handler's catch only maps the error: `catch (err) { return
      mapErrorToEnvelope(err); }`. This file never logs `curation_request_failed`.
      Its only log call is `logger.info({...}, "curation_toolset_registered")`.
  - node: constraints/expected-refusals-not-logged-as-errors
    held_at: nowhere
    evidence: >-
      The file never logs a refusal. A refusal falls into `catch (err) { return
      mapErrorToEnvelope(err); }` with no logger call, so it carries no
      error-level logging rule.
  - node: constraints/extraction-model-call-bounded
    held_at: nowhere
    evidence: >-
      No model call, timeout or retry appears in the file. It only registers
      curation tools that call the services `listReviewQueueService`,
      `resolveEntityMatchService`, `mergeNodesService` and the like.
  - node: constraints/ingest-toolset-offers-no-async-ingestion
    held_at: nowhere
    evidence: >-
      The file registers only the curation toolset, via `mcp.registerTool("curation", {...})`.
      The tool names are `list_review_queue`, `resolve_entity_match`,
      `merge_nodes`, `resolve_dispute`, `confirm_item`, `reject_item` and
      `correct_item`. It registers no ingest tool.
  - node: constraints/local-operator-token-minimum-length
    held_at: nowhere
    evidence: >-
      The file has no authentication or token handling. The only construct near
      it is `mapErrorToEnvelope(err)`.
  - node: constraints/local-operator-token-needs-explicit-development
    held_at: nowhere
    evidence: >-
      The file has no environment or startup logic. It exports
      `registerCurationToolset(deps: CurationToolsetDeps): void`, which only
      registers tools.
  - node: constraints/logs-redact-text-fields
    held_at: nowhere
    evidence: >-
      The file configures no redaction. It logs one object, `{ component:
      "mcp.curation", tools_registered: CURATION_TOOL_NAMES.length, tool_names:
      CURATION_TOOL_NAMES }`, with no content, text or value field.
  - node: constraints/mcp-endpoint-serves-only-its-toolset
    held_at: nowhere
    evidence: >-
      The file only registers its seven tools under the "curation" key. The
      NOT_FOUND answer for a tool outside the endpoint's toolset is not
      produced here. The file contains no NOT_FOUND code and no dispatch
      lookup.
  - node: constraints/owner-time-zone-must-be-known
    held_at: nowhere
    evidence: >-
      The file has no time-zone logic. Its imports are zod, pg, pino and the
      curation DTOs and services.
  - node: constraints/preflight-needs-no-authentication
    held_at: nowhere
    evidence: >-
      The file has no HTTP, CORS or authentication code. It holds only tool
      schemas, descriptions and handler registration.
  - node: constraints/retrieval-transports-answer-alike
    held_at: nowhere
    evidence: >-
      The file registers write-side curation tools. The one read tool is
      `list_review_queue` over `listReviewQueueService({ pool }, input)`. It
      defines no retrieval operation of the search, node, link or attribute
      kind.
looked_past: >-
  The file's header and section comments restate behavior the code holds
  (envelope shape, one transaction per tool call, the seven tool names), and
  they cite superseded back-spec identifiers such as BR-29 and BR-31. That is
  prose for the comment route and not a conformance judgment. The tool
  descriptions it emits (page limit 1..100 with default 20, the
  prefer_one/adjust_periods/keep_disputed outcomes, and the reject and correct
  preconditions) agree with the knowledge-base rules I grepped in the
  specification, so they are not findings.
