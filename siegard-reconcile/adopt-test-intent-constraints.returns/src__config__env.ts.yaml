    cost: >-
      The refusal rule is also prose in a second place beside the branch that enforces it, so the two can drift unnoticed.
    kind: restates
    correction: >-
      Remove the comment. The branch `parsed.data.LOCAL_OPERATOR_TOKEN !== undefined && source.NODE_ENV !== "development"` holds the fact.
    node: constraints/local-operator-token-needs-explicit-development
  - file: src/config/env.ts
    where: >-
      lines 79-82, the comment above ANTHROPIC_API_KEY
    evidence: >-
      Missing key at boot is a fatal config error; absence
        // here causes the process to refuse to start (acceptance criterion of
        // TC-12).
    cost: >-
      The start-refusal rule is also prose beside the required schema line, so it has to be kept in step with the node by hand.
    kind: restates
    correction: >-
      Remove the comment. The `ANTHROPIC_API_KEY: z.string().min(1, ...)` entry, which the parse turns into a thrown EnvValidationError, holds the fact.
    node: constraints/anthropic-key-required
  - file: src/config/env.ts
    where: >-
      lines 206-211 and 251-257, the comments above OWNER_TZ and above the Intl.DateTimeFormat check
    evidence: >-
      an invalid / unknown zone -> the BFF refuses to start
        //   (`InvalidOwnerTimezoneError`, fail-closed).
    cost: >-
      The rule that an unknown zone stops startup is also prose in two places beside the try/catch that enforces it, so it has to be kept in step with the node by hand.
    kind: restates
    correction: >-
      Remove both comments. The `new Intl.DateTimeFormat(undefined, { timeZone: parsed.data.OWNER_TZ })` try/catch that throws InvalidOwnerTimezoneError holds the fact.
    node: constraints/owner-time-zone-must-be-known
