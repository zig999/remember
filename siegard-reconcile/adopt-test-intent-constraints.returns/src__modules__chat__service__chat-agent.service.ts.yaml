findings:
  - file: src/modules/chat/service/chat-agent.service.ts
    where: >-
      the createChatAgentService factory-failure branch of getClient(), lines 80-88
    evidence: >-
      deps.logger.error(
        { event: "chat.provider_factory_failed", error: serializeError(err) },
        "chat anthropic factory failed"
      );
      throw new ChatProviderUnavailableError();
    cost: >-
      The failure is logged at error level and then refused with the chat provider unavailable error. The contract answers that case with the business code BUSINESS_CHAT_PROVIDER_UNAVAILABLE ("The model provider cannot be reached when the turn starts"). The node says a refusal for a business cause is never logged at error level. The same refusal during streaming is logged at warn, in this file as "chat.provider_stream_error". The two paths therefore disagree on the level for one business refusal, and error-level alerts fire on a refusal the specification classes as expected.
    kind: contradicts
    correction: >-
      Either the factory-failure log drops below error level, or the specification says that a provider that cannot be built at turn start is a failure to be logged at error level. The second would be a decision for an analysis, not for this file.
    node: constraints/expected-refusals-not-logged-as-errors
  - file: src/modules/chat/service/chat-agent.service.ts
    where: >-
      the MAX_TOKENS_PER_ITERATION constant (line 53) and its use in the model request (line 255)
    evidence: >-
      const MAX_TOKENS_PER_ITERATION = 4096;
      ...
      max_tokens: MAX_TOKENS_PER_ITERATION,
    cost: >-
      A cap of 4096 output tokens on every model call of a turn decides when the model's answer is cut and the turn ends as max-tokens. No node holds the value (a search of the specification found no 4096 and no per-call output limit). The next reader looks for the limit in the specification and finds only the model-call count limit.
    kind: unstated
    correction: >-
      Give the per-model-call output token limit a node. A rule constraining domain/chat/turn, next to rules/chat/turn-model-call-limit, would hold it.
    node: domain/chat/turn
  - file: src/modules/chat/service/chat-agent.service.ts
    where: >-
      the failure envelopes handed to the model: unknown tool (lines 416-423), tool timeout (lines 634-639), tool handler throw (lines 672-679)
    evidence: >-
      error: { code: "VALIDATION_INVALID_FORMAT", message: "unknown tool name" }
      ...
      code: "SYSTEM_SERVICE_UNAVAILABLE", message: "tool timeout"
      ...
      code: "SYSTEM_INTERNAL_ERROR", message: errMessage(err) ?? "tool handler threw"
    cost: >-
      rules/chat/tool-failure-continues-turn says only that a failed tool call "hands its failure to the assistant". The error codes and messages the assistant is told are decided here: VALIDATION_INVALID_FORMAT for an unknown tool, SYSTEM_SERVICE_UNAVAILABLE for a timeout, and the thrown error's own message for a handler that threw. No node holds them. This text is sent to the model and also surfaces in the tool_result error_message events. The next reader looks for it in the specification and finds only the continuation rule.
    kind: unstated
    correction: >-
      Extend rules/chat/tool-failure-continues-turn, or add a sibling rule, with the code and message each tool failure hands the assistant.
    node: rules/chat/tool-failure-continues-turn
