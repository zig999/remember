read:
  - node: constraints/answers-carry-allowed-origin
    held_at: >-
      nowhere
    evidence: >-
      The file only exports resolveStdioTools and the ToolCoordinate interface. It sets no response header and has no notion of an origin: `.map((c) => registry.getTool(c.toolset, c.name))`.
  - node: constraints/anthropic-key-required
    held_at: >-
      nowhere
    evidence: >-
      The file reads no environment and no provider key. Its only imports are types (`import type { McpEnvelope, McpHttpTool }`, `import type { McpServer, ToolsetName }`).
  - node: constraints/curation-mcp-needs-no-run-identity
    held_at: >-
      nowhere
    evidence: >-
      The lifted tool carries no run identity: `{ name: t.name, description: t.description, inputSchema: t.inputSchema, handler: t.handler as (input: unknown) => Promise<McpEnvelope> }`. The file handles no curation call and states nothing about run identity.
  - node: constraints/curation-write-failure-logged
    held_at: >-
      nowhere
    evidence: >-
      The file has no logging and no write path. The whole body is `coordinates.map(...).filter(...).map(...)`.
  - node: constraints/expected-refusals-not-logged-as-errors
    held_at: >-
      nowhere
    evidence: >-
      The file has no logger, no refusal handling and no error-level call. The handler is passed through uncalled.
  - node: constraints/extraction-model-call-bounded
    held_at: >-
      nowhere
    evidence: >-
      The file has no model call, no timeout and no retry. It only projects registry entries into the McpHttpTool shape.
  - node: constraints/ingest-toolset-offers-no-async-ingestion
    held_at: >-
      nowhere
    evidence: >-
      The file chooses no tools. The caller supplies the coordinates: `coordinates: readonly ToolCoordinate[]`. The ingest toolset's content is decided elsewhere.
  - node: constraints/local-operator-token-minimum-length
    held_at: >-
      nowhere
    evidence: >-
      The file has no token handling and no length check.
  - node: constraints/local-operator-token-needs-explicit-development
    held_at: >-
      nowhere
    evidence: >-
      The file has no environment validation and no start-up refusal.
  - node: constraints/logs-redact-text-fields
    held_at: >-
      nowhere
    evidence: >-
      The file has no logging and no redaction of content, text or value fields.
  - node: constraints/mcp-endpoint-serves-only-its-toolset
    held_at: >-
      nowhere
    evidence: >-
      The file serves no endpoint and emits no tool error. A coordinate absent from the registry is dropped, not refused: `.filter((t): t is NonNullable<typeof t> => t !== undefined)`. The stdio path carries no NOT_FOUND answer, and the file mentions no curation endpoint.
  - node: constraints/owner-time-zone-must-be-known
    held_at: >-
      nowhere
    evidence: >-
      The file has no time zone handling or configuration.
  - node: constraints/preflight-needs-no-authentication
    held_at: >-
      nowhere
    evidence: >-
      The file has no HTTP handling, no preflight and no authentication.
  - node: constraints/retrieval-transports-answer-alike
    held_at: >-
      nowhere
    evidence: >-
      The file implements no retrieval operation and compares no transports. It passes the handler through unchanged: `handler: t.handler as (input: unknown) => Promise<McpEnvelope>`. The result and error code for each operation come from the handlers, not from this file.
looked_past: >-
  The header and docstring prose describing the stdio toolset composition and the silent dropping of unregistered coordinates is technical design rationale, not a fact any node of the pack holds, and so is not this judgment's.
