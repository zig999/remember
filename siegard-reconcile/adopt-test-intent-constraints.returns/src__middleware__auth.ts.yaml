      The file does no logging and has no curation code.
  - node: constraints/expected-refusals-not-logged-as-errors
    held_at: nowhere
    evidence: >-
      The file throws `AuthError` and logs nothing. The comment "the global error handler logs it
      server-side" is prose.
  - node: constraints/extraction-model-call-bounded
    held_at: nowhere
    evidence: >-
      The file has no call to the language model, no timeout and no retry.
  - node: constraints/ingest-toolset-offers-no-async-ingestion
    held_at: nowhere
    evidence: >-
