  - node: constraints/local-operator-token-minimum-length
    held_at: nowhere
    evidence: >-
      The file tests only `env.LOCAL_OPERATOR_TOKEN.length > 0` and has no 16-character check. A
      shorter token is not refused here.
  - node: constraints/local-operator-token-needs-explicit-development
    held_at: nowhere
    evidence: >-
      The file only declines to enable the bypass outside development: `env.NODE_ENV ===
      "development" && ...? env.LOCAL_OPERATOR_TOKEN : null`. It does not refuse to start. Refusing
      to start is a startup behavior and is not in this file.
  - node: constraints/logs-redact-text-fields
    held_at: nowhere
    evidence: >-
      The file has no logging or redaction code.
  - node: constraints/mcp-endpoint-serves-only-its-toolset
    held_at: nowhere
    evidence: >-
      The file has no tool routing and no NOT_FOUND code.
  - node: constraints/owner-time-zone-must-be-known
    held_at: nowhere
    evidence: >-
      The file has no time zone or IANA zone handling.
  - node: constraints/preflight-needs-no-authentication
    held_at: nowhere
    evidence: >-
      The preHandler requires a bearer token for every request it is registered on and has no
      branch for OPTIONS or preflight requests: `if (token === null) { throw new AuthError(
      "AUTH_UNAUTHORIZED", ...`. Exempting preflight requests would be done by the code that
      registers it, not here.
  - node: constraints/retrieval-transports-answer-alike
    held_at: nowhere
    evidence: >-
      The file has no retrieval operation and no REST or MCP transport code.

looked_past: >-
  The bearer-token gate, the 401 refusals, the `local-operator` identity and the constant-time comparison are held by nodes outside this pack (constraints/every-operation-requires-owner-authentication, constraints/local-operator-token-development-only, contracts/knowledge-base/access), and the file conforms to those nodes. Prose such as the provider note about EdDSA and the issuer/audience hardening is a belief and not a fact the code emits.

