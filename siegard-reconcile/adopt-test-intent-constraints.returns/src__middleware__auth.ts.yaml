    evidence: >-
      The file sets no response header. `preHandler: async (request) => {` only verifies the bearer
      token and sets `request.user`.
  - node: constraints/anthropic-key-required
    held_at: nowhere
    evidence: >-
      The file reads only `NEON_AUTH_URL`, `NEON_AUTH_JWKS_TTL_S`, `NODE_ENV` and
      `LOCAL_OPERATOR_TOKEN`, and has no startup check on the language model key.
  - node: constraints/curation-mcp-needs-no-run-identity
    held_at: nowhere
    evidence: >-
      No reference to a run identity or `llm_run_id` anywhere in the file.
  - node: constraints/curation-write-failure-logged
    held_at: nowhere
