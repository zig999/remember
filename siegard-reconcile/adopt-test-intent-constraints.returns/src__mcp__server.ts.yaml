findings:
  - file: src/mcp/server.ts
    where: >-
      the doc comment on McpServer.getTool, line 111
    evidence: >-
      Returns `undefined` for unknown
         * keys; the transport layer turns that into a `NOT_FOUND` envelope.
    cost: >-
      The refusal code for a tool outside an endpoint's toolset is stated in prose here as well as in
      the transport that emits it. A reader of getTool takes this comment as where NOT_FOUND is
      decided, and it can drift from the transport without anything flagging it. This file's code
      holds none of it, since getTool only returns undefined.
    kind: restates
    correction: >-
      Remove the sentence from the getTool docstring. The code that holds the fact is in
      src/mcp/sdk-http-transport.ts (`code: "NOT_FOUND"`, line 127), and the node binds that file.
    node: constraints/mcp-endpoint-serves-only-its-toolset
