  - file: src/features/chat/api/chat-stream.ts
    where: |-
      comment at lines 146-147, inside parseSSEFrame
    evidence: |-
      `// Multi-line `data:` per SSE spec would concatenate with `\n`; the BFF`
      `// emits single-line JSON, so the last `data:` wins on malformed input.`
    cost: |-
      The prose restates the data-line rule and says the last `data:` wins. The code on the next line joins every data line with a newline: `dataLine = dataLine === null ? value : `${dataLine}\n${value}``. It is the last `event:` line that wins. A reader who trusts the comment gets the opposite rule from the one the code runs.
    kind: restates
    correction: |-
      Remove the comment. The joining and the last-event-wins rule are held by the code and by the node.
    node: rules/chat-workspace/event-names-the-frame-and-data-carries-it
  - file: src/features/chat/api/chat-stream.ts
    where: |-
      line 160, inside parseSSEFrame, together with `case "llm_start":` at line 164
    evidence: |-
      `if (payload === null || typeof payload !== "object") return null;`
      `case "llm_start":`
      `  return { type: "llm_start" };`
    cost: |-
      The node requires a frame to be skipped when its data is not a JSON object. `typeof payload !== "object"` is also false for an array, so `event: llm_start` with `data: []` is applied as an `llm_start` frame. It would move the turn status to thinking, where the node says the frame is skipped silently. The other event kinds happen to be rejected later only because their required fields are absent on an array.
    kind: contradicts
    correction: |-
      The object check would have to refuse arrays as well as null and non-objects, so that no event kind can pass on array data.
    node: rules/chat-workspace/malformed-frames-are-skipped-silently
  - file: src/features/chat/api/chat-stream.ts
    where: |-
      the frame-drain loop, lines 346-353, together with the carriage-return drop at line 135
    evidence: |-
      `let boundary = buffer.indexOf("\n\n");`
      `const line = rawLine.replace(/\r$/, "");`
    cost: |-
      The node ends a frame at a blank line and drops a carriage return at the end of each line. The loop recognises only a bare `\n\n`. In a stream with CRLF line endings the separator is `\r\n\r\n`, and `indexOf("\n\n")` never matches it. No frame would be applied as it arrives. Everything would pile up in the buffer until the stream ends and be read as one block, which keeps only the last event and joins all the data lines. The `\r` handling at line 135 shows the code expects CRLF lines, but the frame boundary does not.
    kind: contradicts
    correction: |-
      Frame boundaries would have to be detected on a blank line after carriage-return removal, not only on a literal `\n\n`.
    node: rules/chat-workspace/frames-end-at-a-blank-line
  - file: src/features/chat/api/chat-stream.ts
    where: |-
      comment at lines 355-356, before the trailing-frame drain
    evidence: |-
      `// Drain a trailing partial frame (rare — well-behaved servers terminate`
      `// with `\n\n`, but defensive).`
    cost: |-
      Prose restates the rule that an unterminated last frame is read. The code holds it in `const tail = buffer.trim();` and the `parseSSEFrame(tail)` call that follows.
    kind: restates
    correction: |-
      Remove the comment.
    node: rules/chat-workspace/unterminated-last-frame-is-read
