  - node: rules/chat-workspace/conversation-is-archived-when-its-detail-says-so
    held_at: >-
      the `isArchived` declaration in ActiveConversation, line 68. It is true
      only when the loaded detail's `archivedAt` is non-null. While the query is
      pending or has failed, `data` is undefined and the result is false.
    evidence: |-
      const isArchived = conversationQuery.data?.archivedAt != null;
