findings:
  - file: src/features/chat/api/useSendMessage.ts
    where: |-
      dispatchFrame, case "tool_start" (line 384), and the header docblock line 29
    evidence: |-
      actions.setChatStatus("tool_running");
    cost: |-
      The node spells this chat status "tool-running", with a hyphen, and the code emits "tool_running", with an underscore. Whoever reads the specification for the status value does not find the string the screen sets. The two spellings are two decisions, and the next change to either one will not reach the other. The ChatStatus type itself is declared in ../state/chat-turn, outside this file. This file is where the literal is set.
    kind: contradicts
    correction: |-
      Settle which spelling is the decision, then change the node or the status type and its emitters to match. The node cannot bind here until they agree.
    node: domain/chat-workspace/chat-status
  - file: src/features/chat/api/useSendMessage.ts
    where: |-
      buildOptimisticUserMessage, the returned object (lines 116-128)
    evidence: |-
      id: `optimistic-${args.idempotencyKey}`,
      ...
      createdAt: new Date(),
    cost: |-
      The node says the optimistic identifier is built from the idempotency key and the browser's time. The code builds the id from the key alone and keeps the time in a separate createdAt field. A reader who relies on the node's identifier format will not find the time in the id.
    kind: contradicts
    correction: |-
      Either the node states that the identifier is built from the key alone, with the browser's time held as the creation time, or the identifier is built to include the time.
    node: rules/chat-workspace/owner-message-is-appended-before-the-answer
