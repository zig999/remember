looked_past: |-
  Comments that state facts only in prose, with no code or emitted text carrying them (the BR-29 claim that the BFF persists the user message before the SSE opens, and the claim that the server may emit text_delta before llm_start on retry), plus the references to docs/specs and plan sections, are prose for the comment route. The hand-rolled joinUrl and the `Promise<... | undefined>` cache typing are code style, not a domain fact.