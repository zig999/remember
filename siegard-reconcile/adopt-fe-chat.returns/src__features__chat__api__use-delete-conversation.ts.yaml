findings:
  - file: src/features/chat/api/use-delete-conversation.ts
    where: |-
      the file docstring, lines 12-15
    evidence: |-
      * Because the endpoint returns 204, this hook uses the local `httpVoid`
      * helper (see `_request.ts`) instead of `http<T>()` — `http<T>` always
      * tries to `response.json()` which throws on an empty body. Narrow scope:
      * only this hook depends on `httpVoid`.
    cost: |-
      The no-body helper rule has a second home in prose. When the node moves, this text stays and still reads as the reason. The code (`await httpVoid(...)` in `mutationFn`) is where the rule is held, and a reader who finds the docstring first will take it for the decision.
    kind: restates
    correction: |-
      Remove the passage. The behavior is held by `await httpVoid(` in `mutationFn` and by `UseMutationResult<void, ...>`, which gives the caller nothing back.
    node: rules/chat-workspace/delete-uses-the-no-body-helper
  - file: src/features/chat/api/use-delete-conversation.ts
    where: |-
      the comment inside onSuccess, lines 43-44
    evidence: |-
      // Drop the detail + nested children from the cache outright — the
      // entity no longer exists. List queries refresh from the server.
    cost: |-
      The cache-removal and re-read rule is restated in prose beside the calls that carry it (`removeQueries` for detail, messages and usage, and `invalidateQueries({ queryKey: conversationKeys.all })`). The comment says only "list queries refresh", while the code invalidates every conversation-scoped key. The comment and the code can drift apart, and a reader would not know which one was decided.
    kind: restates
    correction: |-
      Remove the comment. The rule is held by the four calls in `onSuccess`.
    node: rules/chat-workspace/delete-removes-the-conversations-reads

