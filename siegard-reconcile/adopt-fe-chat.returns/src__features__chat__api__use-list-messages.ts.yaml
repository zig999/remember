    cost: |-
      The message read attaches the owner's bearer through authHeader() (in ./_request), and no node of the chat workspace states that a read carries it. The chat nodes state it only for a send ("A send MUST carry the owner's access token as a bearer...") and for cancelling a turn. The curation and ingestion contexts each have a node for the same fact on their requests. A reader looking in the specification for how chat reads authenticate finds nothing, and the behaviour lives only in this code.
    kind: unstated
