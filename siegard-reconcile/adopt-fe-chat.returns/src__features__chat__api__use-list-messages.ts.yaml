      Analysis would give the fact a node. It would say that a conversation read, messages included, carries the owner's access token as a bearer when one is held and no Authorization header otherwise. The natural home is contracts/chat-workspace/bff-conversations or a rule beside send-carries-the-access-token-when-held.
