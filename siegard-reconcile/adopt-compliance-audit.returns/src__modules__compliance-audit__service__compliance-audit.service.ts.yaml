findings:
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      the header comment, lines 7-11 (Transaction policy (BR-02))
    evidence: |-
      The CALLER (route or MCP handler) opens BEGIN / COMMIT / ROLLBACK and
      //     hands the live `client` to `complianceDelete`. Every DB statement of
      //     UC-01 runs on that same client; commit is reached only after BR-08 has
      //     written BOTH audit rows.
    cost: >-
      The atomicity of a compliance deletion is written out in prose here, beside code that does not hold it. A reader who edits this comment, or the function, believes they changed the guarantee. The guarantee is actually in src/shared/pg-transaction.ts (`withTransaction`), which the route and the MCP toolset call.
    kind: restates
    correction: >-
      Remove the prose. The fact is already held by the node, and the code that enforces it is `withTransaction` in src/shared/pg-transaction.ts, called from routes/compliance-audit.routes.ts and mcp/compliance-toolset.ts.
    node: constraints/compliance-deletion-is-atomic
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      the doc comment above REDACTED_LITERAL, lines 51-56
    evidence: |-
      The literal `[REDACTED]` is hardcoded by spec (constraint #4 of TC-08:
       * "[REDACTED] literal is hardcoded in the service (not config); a Vitest test
       *  must pin its exact byte value").
    cost: >-
      The prose claims the literal is held "in the service". The redaction that runs is SQL in the repository (`SET content = '[REDACTED]'`), so a reader following the comment looks in the wrong file. The comment also cites a task constraint as though it were the authority for the value.
    kind: restates
    correction: >-
      Remove the prose. The code that holds the fact is the UPDATE in modules/compliance-audit/repository/compliance-audit.repository.ts.
    node: rules/knowledge-base/compliance-deletion-redacts-content
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      the exported constant REDACTED_LITERAL, line 57
    evidence: >-
      export const REDACTED_LITERAL = "[REDACTED]" as const;
    cost: >-
      The literal is declared a second time as a constant that nothing reads. The repository redacts with its own inline '[REDACTED]' in SQL, and the constant is only re-exported from the module index and pinned by tests. If the node's literal changes, the constant and its test can keep passing while the real redaction stays as it was, or the reverse. Nobody can tell which value was decided. This file does not perform the redaction at all.
    kind: contradicts
    correction: >-
      Remove the constant and its re-export, so the literal has one home, the repository statement the redaction node is bound to. Code cannot read the specification, so the bind is what ties the node to the repository file.
    node: rules/knowledge-base/compliance-deletion-redacts-content
