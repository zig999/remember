      The file only invokes `tombstoneCascadedFragments`, `tombstoneCascadedLinks` and `tombstoneCascadedAttributes` with the raw information id. The "rests on no other non-deleted raw information" predicate is not stated in this file; it lives in the repository.
  - node: rules/knowledge-base/compliance-deletion-records-curation-action
