looked_past: >-
  Another judgment's: the structured log lines and operational alarm (`compliance.legacy_orphan_tombstone`, `compliance_delete_ok`) that no node mentions. Also the defensive coercion of a partial `affected` blob to zero counts in rowToDto, and the remaining explanatory comments (BR-, UC- and TC- citations) that restate nothing a node holds.
