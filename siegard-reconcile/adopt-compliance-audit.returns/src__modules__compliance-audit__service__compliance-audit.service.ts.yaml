    held_at: >-
      lines 153-164 in complianceDelete
    evidence: >-
      `const chunks = await tombstoneRawChunksOfRaw(...); const fragments = await tombstoneCascadedFragments(...); const links = await tombstoneCascadedLinks(...); const attributes = await tombstoneCascadedAttributes(...); const affected = { chunks, fragments, links, attributes };`
  - node: rules/knowledge-base/compliance-deletion-propagates
