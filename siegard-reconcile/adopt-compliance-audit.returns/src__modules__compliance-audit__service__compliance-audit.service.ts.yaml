    held_at: nowhere
    evidence: >-
      `complianceDelete(deps, client, body)` only runs statements on the `client` it is handed. BEGIN, COMMIT and ROLLBACK are not in this file; the only statement of who opens the transaction is the header comment "The CALLER (route or MCP handler) opens BEGIN / COMMIT / ROLLBACK".
  - node: contracts/knowledge-base/compliance-audit
