  - node: rules/knowledge-base/compliance-deletion-check-order
    held_at: >-
      the order of statements in complianceDelete, lines 87-136
    evidence: >-
      `const raw = await loadRawInformationForUpdate(client, body.raw_information_id); if (!raw) { throw new ResourceNotFoundError(...) } if (raw.status === "deleted") {` precede the first `tombstoneRawInformation` call. Request well-formedness is checked upstream, before the service is called.
