findings:
  - file: src/modules/compliance-audit/mcp/compliance-toolset.ts
    where: >-
      the header comment, lines 11-16 ("Per BR-15 (P2.1 canonical taxonomy ...)")
    evidence: >-
      // Per BR-15 (P2.1 canonical taxonomy — same codes on REST and MCP):
      //   - Zod parse failure -> VALIDATION_REQUIRED_FIELD | VALIDATION_INVALID_FORMAT
      //                         | VALIDATION_OUT_OF_RANGE (Zod-discriminated)
      //   - raw_information_id resolves to no row -> RESOURCE_NOT_FOUND
    cost: >-
      The comment restates the contract's refusal codes for compliance-delete as prose. The
      code in this file already holds the validation codes in mapZodErrorToEnvelope and passes
      the service errors through renderErrorEnvelope. If the contract's codes change, this
      comment goes on claiming the old ones, and a reader may take it for the place the codes
      are decided.
    kind: restates
    correction: >-
      Remove the comment. The contract node holds the codes, and mapZodErrorToEnvelope in this
      file holds them as code.
    node: contracts/knowledge-base/compliance-audit
  - file: src/modules/compliance-audit/mcp/compliance-toolset.ts
    where: >-
      the docblock of mapZodErrorToEnvelope, lines 57-72 (the numbered priority list)
    evidence: >-
      *   1. Explicit `superRefine` `VALIDATION_OUT_OF_RANGE` marker (semi-open range
      *      guard on the list endpoint ...
      *   2. Missing / undefined field -> `VALIDATION_REQUIRED_FIELD`. ...
      *   3. `reason` length / trim violation (`too_small` / `too_big` on the `reason`
      *      path) -> `VALIDATION_OUT_OF_RANGE`.
      *   4. Everything else -> `VALIDATION_INVALID_FORMAT`.
    cost: >-
      The docblock restates the order in which form checks are refused: time window, then
      missing field, then reason out of range, then anything else. The code in this file holds
      that order in the four sequential branches of the same function. A second statement of
      the order in prose can drift from the node without anything noticing.
    kind: restates
    correction: >-
      Remove the docblock prose. The order is held by the node and by the branch sequence in
      this function.
    node: rules/knowledge-base/audit-filter-checks-order
