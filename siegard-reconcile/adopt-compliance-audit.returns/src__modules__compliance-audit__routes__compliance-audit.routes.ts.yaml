findings:
  - file: src/modules/compliance-audit/routes/compliance-audit.routes.ts
    where: >-
      the five route registrations in registerComplianceAuditRoutes (lines 65-175)
    evidence: >-
      app.post(
          "/compliance/deletions",
      app.get(
          "/compliance/deletions",
      app.get(
          "/compliance/deletions/:complianceDeletionId",
      app.get(
          "/audit/curation-actions",
      app.get(
          "/audit/curation-actions/:curationActionId",
    cost: >-
      The URL and verb for each of the five operations are stated only in this file. The contract names the operations and their answers but never a path. The next reader who looks in the specification for where compliance-delete or the audit reads are exposed will not find it, and a client can only learn the paths from the code.
    kind: unstated
    correction: >-
      The contract should state the path and verb of each of its five operations, or the specification should record that paths are deliberately left to the implementation.
    node: contracts/knowledge-base/compliance-audit
  - file: src/modules/compliance-audit/routes/compliance-audit.routes.ts
    where: >-
      the docstring above handleZodError (lines 182-189) and the comments "Priority 1", "Priority 2" and "Priority 3" inside it (lines 197, 210, 239)
    evidence: >-
      // Priority 1 — explicit semi-open range refinement.
      // Priority 2 — required-field detection.
      // Priority 3 — `reason` length / trim violations.
    cost: >-
      The refusal order (time window, then missing field, then reason out of range, then other) is written out a second time as prose. The docstring above it lists only two "special-case mappings" and then a third bullet, so it already differs from the code. The comments stay in the file after the node binds, and a reader can take them for the place the order was decided.
    kind: restates
    correction: >-
      Remove the docstring and the Priority comments. The if-sequence in handleZodError holds the order, and the node audit-filter-checks-order is where it is decided.
    node: rules/knowledge-base/audit-filter-checks-order
