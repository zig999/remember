  - node: rules/knowledge-base/compliance-deletion-reason-trimmed
    held_at: >-
      nowhere
    evidence: >-
      The handler forwards the parsed body untouched, `complianceDelete({ logger: deps.logger }, client, body)`. Nothing in this file trims `reason`. handleZodError only tests `i.path[0] === "reason"` on issues raised by the schema, which is declared in another file.
looked_past: >-
  The header comment (endpoint list, UC numbers, BR-13, Neon Auth scope) and the section-banner comments are prose no node in this set holds, so they are a matter for the comment route. The `ok: false` envelope and the `details.issues` shape belong to the error-mapping convention rather than to this set. The "> 1000 chars" comment restates the reason-length rule, a candidate node outside this set, which I did not open.
