looked_past: >-
  The comment "Time-range filters honor BR-09 (`from` inclusive, `to` exclusive)" states a half-open window that this file does not enforce; that belongs to another node and file (the candidate audit-listing-window-half-open, held in the repository). Also, the superRefine issue message is the bare code "VALIDATION_OUT_OF_RANGE" rather than the contract's wording, which the error mapping outside this file set may or may not replace.
