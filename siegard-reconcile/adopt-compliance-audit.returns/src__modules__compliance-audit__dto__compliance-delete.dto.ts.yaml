findings:
  - file: src/modules/compliance-audit/dto/compliance-delete.dto.ts
    where: >-
      the doc comment above ReasonSchema, lines 12-19
    evidence: >-
      /** `reason` — non-empty after trim, ≤ 1000 chars (BR-01). ... `z.string().trim().min(1).max(1000)` runs `trim()` then checks the length AFTER the trim. */
    cost: >-
      The 1..1000 trimmed-length bound is written twice in this file, once as prose and once as `z.string().trim().min(1).max(1000)`. If the node moves, the comment keeps stating the old number. It also cites the back-spec rule id BR-01 as its authority. The next reader may take the comment, not the node, as where the bound was decided.
    kind: restates
    correction: >-
      Remove the comment. The code in this same file (`ReasonSchema`) holds the fact, and the node's binding claims it.
    node: rules/knowledge-base/compliance-deletion-reason-length
  - file: src/modules/compliance-audit/dto/compliance-delete.dto.ts
    where: >-
      the doc comment above ListComplianceDeletionsQuerySchema, lines 74-79
    evidence: >-
      When both bounds are supplied, the parser rejects `from >= to` with `VALIDATION_OUT_OF_RANGE`.
    cost: >-
      The start-strictly-before-end rule is restated in prose beside the `superRefine` that enforces it. The two can drift apart, and the comment cites BR-09 as its authority instead of the node.
    kind: restates
    correction: >-
      Remove the prose. The `superRefine` in this same file holds the fact (`Date.parse(value.executed_from) >= Date.parse(value.executed_to)`).
    node: rules/knowledge-base/audit-window-ordered
  - file: src/modules/compliance-audit/dto/compliance-delete.dto.ts
    where: >-
      ComplianceDeletionListSchema, line 108 (the list envelope key)
    evidence: >-
      items: z.array(ComplianceDeletionSchema),
    cost: >-
      The contract says the listing carries "the total, the limit, the offset and the page of compliance deletions". It gives no name for the key that holds the page, and no node in the specification root names it. The wire name `items` is decided only in this schema. A reader looking in the specification for what the REST and MCP callers receive will not find it.
    kind: unstated
    correction: >-
      Have contracts/knowledge-base/compliance-audit name the key that carries the page of compliance deletions (and the same for the curation-action listing), so the schema is declaring a named fact rather than deciding one.
    node: contracts/knowledge-base/compliance-audit
