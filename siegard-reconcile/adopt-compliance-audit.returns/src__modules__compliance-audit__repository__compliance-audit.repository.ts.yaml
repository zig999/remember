  - file: src/modules/compliance-audit/repository/compliance-audit.repository.ts
    where: >-
      docstring of tombstoneCascadedFragments, lines 105-107, and the predicate of
      tombstoneRawChunksOfRaw, lines 94-98
    evidence: |-
      WHERE raw_information_id = $1
        AND superseded_at IS NULL
      RETURNING id
    cost: >-
      The node says a compliance deletion marks deleted each of its raw information's raw
      chunks. This query marks only chunks whose superseded_at is null, and no node states
      that restriction. A chunk of the raw information that already carries a supersession
      time is left un-deleted, and the chunk count in the audit record omits it. The next
      reader looks for the chunk rule in the specification and finds no such guard.
    kind: contradicts
    correction: >-
      Either the node would have to state the restriction to not-yet-superseded chunks, or
      the query would have to mark every chunk of the raw information.
    node: rules/knowledge-base/compliance-deletion-tombstones
