      Every function takes a caller-supplied connection and opens no transaction of its own, e.g. `export async function tombstoneRawChunksOfRaw(client: PoolClient, rawInformationId: string)`. The file has no BEGIN, COMMIT or transaction call. The only mention is the comment "inside the UC-01 transaction", so the boundary is held by the caller.
