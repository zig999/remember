findings:
  - file: src/modules/compliance-audit/repository/compliance-audit.repository.ts
    where: >-
      the status member of interface RawInformationLockedRow, line 23
    evidence: |-
      readonly status: "active" | "needs_review" | "merged" | "deleted";
    cost: >-
      The node says a raw information's status is active or deleted, and this row type, which
      is the only declaration of a raw information's status in the file, admits four values.
      A reader taking the vocabulary from the type would treat needs_review and merged as
      states a source can be in, and that is what the node denies.
    kind: contradicts
    correction: >-
      The raw information's status shape would have to admit only active and deleted, as the
      node states.
    node: rules/knowledge-base/source-status-active-or-deleted
