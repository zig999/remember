read:
  - node: domain/chat/message
    held_at: >-
      CREATE TABLE chat_message (lines 95-109), with the enum chat_message_role (line 33)
      declaring the role values.
    evidence: |-
      CREATE TYPE chat_message_role AS ENUM ('user', 'assistant');
      CREATE TABLE chat_message (
        id              uuid               PRIMARY KEY DEFAULT gen_random_uuid(),
        conversation_id uuid               NOT NULL REFERENCES chat_conversation(id) ON DELETE CASCADE,
        role            chat_message_role  NOT NULL,
        content         jsonb              NOT NULL,
        stop_reason     text               NULL,
        idempotency_key uuid               NULL,
        model           text               NULL,
        tokens_in       int                NULL,
        tokens_out      int                NULL,
        latency_ms      int                NULL,
        created_at      timestamptz        NOT NULL DEFAULT now()
      );
looked_past: >-
  The file's prose comments restate business rules (BR-xx citations, the stop_reason vocabulary written with underscores such as end_turn and max_iterations, the 1..200 title length, tool_name being one of 13 names). The stop_reason and tool-name vocabularies appear only in comments, because the columns are plain text, so they are comment-route matters and not findings.
