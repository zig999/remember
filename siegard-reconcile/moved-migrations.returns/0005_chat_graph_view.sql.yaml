read:
  - node: domain/chat/graph-view
    held_at: >-
      the CREATE TABLE chat_graph_view statement, lines 6-11. It declares the
      shape's two required attributes as columns, `snapshot` and `updated_at`.
      `conversation_id`, the primary key, is the 0..1 composition with the
      conversation aggregate. The optional `layout_algorithm` has no column of
      its own. It is carried inside the `snapshot` jsonb, in the version-2
      snapshot that contracts/chat/conversations.md describes.
    evidence: |-
      CREATE TABLE chat_graph_view (
        conversation_id uuid        PRIMARY KEY
                                    REFERENCES chat_conversation(id) ON DELETE CASCADE,
        snapshot        jsonb       NOT NULL,
        updated_at      timestamptz NOT NULL DEFAULT now()
      );
looked_past: >-
  The header comments (the "BR-42 (chat.back.md v2.3.0)" citation, the apply-order note and the "Do NOT apply automatically" note) are prose the running system does not emit and carry no domain fact the code lacks, so they belong to the comment route rather than to this judgment.
