    evidence: >-
      value text NOT NULL, status assertion_status NOT NULL, recorded_at, valid_from, valid_to, confidence,
      valid_from_source valid_from_source, superseded_at timestamptz, supersedes_attribute_id uuid REFERENCES node_attribute (id)
  - node: domain/knowledge-base/node-type
