      name        text NOT NULL UNIQUE, description text NOT NULL, version     int  NOT NULL DEFAULT 1
looked_past: >-
  I did not report these as findings because they belong to other judgments: curation_action.action and target_kind are free text with no closed vocabulary declared in this file, and the provenance table names its timestamp created_at where the provenance node names it recorded_at. The raw_information, raw_chunk, llm_run, tool_call, information_fragment and entity_match_review tables, the 1000-character fragment cap and the confidence bounds are not governed by any node in this file's set.
