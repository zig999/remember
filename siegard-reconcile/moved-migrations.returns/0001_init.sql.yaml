findings:
  - file: 0001_init.sql
    where: >-
      node_attribute column at line 392, and the enum declared at line 139
    evidence: >-
      CREATE TYPE valid_from_source AS ENUM ('stated', 'document', 'received'); -- §6.5/A14
      ... valid_from_source       valid_from_source,
    cost: >-
      The node names this attribute valid_from_basis, typed by the valid-from-basis enumeration. The table
      declares the same attribute as valid_from_source with an enum of that name. A reader who follows the node
      to this file finds no valid_from_basis column, and a rename in the node never reaches the DDL. The
      migration and the specification now name one fact two ways, and nothing says which name was decided.
    kind: contradicts
    correction: >-
      The column, and the enum type that backs it, would have to carry the name the node gives the attribute,
      valid_from_basis. Only the name differs; the three values already match the enumeration.
    node: domain/knowledge-base/node-attribute
  - file: 0001_init.sql
    where: >-
      node_attribute_current_dup_guard, lines 411-413
    evidence: >-
      CREATE UNIQUE INDEX node_attribute_current_dup_guard
        ON node_attribute (node_id, attribute_key_id, value)
        WHERE valid_to IS NULL AND superseded_at IS NULL;
    cost: >-
      The rule allows at most one current attribute that is not disputed per node, key and value, so a dispute
      may hold a second current assertion beside the one it disputes. This index has no status predicate, so
      it rejects that second assertion at the database. Curation then refuses a dispute resolution with the
      duplicate-guard error that contracts/knowledge-base/curation names. The DDL enforces a stricter rule than
      the one the business decided.
    kind: contradicts
    correction: >-
      The partial index predicate would have to exempt disputed rows, for example by adding status <> 'disputed'
      to the WHERE clause.
    node: rules/knowledge-base/one-current-attribute-per-value
  - file: 0001_init.sql
    where: >-
      knowledge_link column at line 440, and the enum declared at line 139
    evidence: >-
      valid_from_source  valid_from_source,
    cost: >-
      The node names this attribute valid_from_basis, typed by the valid-from-basis enumeration. The table
      declares it as valid_from_source. A reader following the node to this file finds no such column, and a
      change to the node's name never reaches the DDL.
    kind: contradicts
    correction: >-
      The column would have to carry the node's name, valid_from_basis, and its enum type would follow it.
    node: domain/knowledge-base/knowledge-link
  - file: 0001_init.sql
    where: >-
      knowledge_link_current_dup_guard, lines 454-456
    evidence: >-
      CREATE UNIQUE INDEX knowledge_link_current_dup_guard
        ON knowledge_link (source_node_id, target_node_id, link_type_id)
        WHERE valid_to IS NULL AND superseded_at IS NULL;
    cost: >-
      The rule allows at most one current link that is not disputed per source, target and link type, so a
      dispute may hold a second current link beside the disputed one. This index has no status predicate, so it
      rejects that second link at the database. The DDL enforces a stricter rule than the one the business
      decided.
    kind: contradicts
    correction: >-
      The partial index predicate would have to exempt disputed rows, for example by adding status <> 'disputed'
      to the WHERE clause.
    node: rules/knowledge-base/one-current-link-per-target
  - file: 0001_init.sql
    where: >-
      compliance_deletion.affected, line 523
    evidence: >-
      affected           jsonb NOT NULL DEFAULT '{}'::jsonb  -- contagens por entidade afetada
    cost: >-
      The node requires affected to hold four required counts: chunks, fragments, links and attributes. The
      column declares no such shape, and its default is an empty object, which a row can carry and which holds
      none of the four. The deletion audit trail can then record a compliance deletion whose reach is unstated.
      Nothing in this file says the counts are required.
    kind: contradicts
    correction: >-
      The column would have to hold the four counts, for example as a CHECK on the four integer keys or as four
      columns. The empty-object default would have to go.
    node: domain/knowledge-base/compliance-deletion
