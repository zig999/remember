findings:
  - file: src/modules/compliance-audit/repository/compliance-audit.repository.ts
    where: >-
      RawInformationLockedRow, the `status` field of the interface (line 23)
    evidence: >-
      readonly status: "active" | "needs_review" | "merged" | "deleted";
    cost: >-
      The row type that loadRawInformationForUpdate returns for a raw_information
      row admits needs_review and merged. The specification holds that a raw
      information is only ever active or deleted, and its decision log records
      that typing it with all four node statuses was the mistake corrected.
      A reader of this type sees four states for a source, and a branch on
      "needs_review" or "merged" for a raw would look legitimate here when no
      node gives either state a meaning for a source.
    kind: contradicts
    correction: >-
      Type the raw_information status as "active" | "deleted", the two values
      the node holds for a source.
    node: rules/knowledge-base/source-status-active-or-deleted
