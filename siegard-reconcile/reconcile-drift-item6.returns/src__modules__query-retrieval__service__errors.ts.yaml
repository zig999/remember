      statusCode = 422 / code = "BUSINESS_INVALID_SEARCH_QUERY"; statusCode = 422 / code = "BUSINESS_INVALID_SEARCH_LAYER" with `allowed = ["fragment", "node", "chunk"]`; statusCode = 404 / code = "BUSINESS_FRAGMENT_NOT_ACCEPTED"; statusCode = 410 / code = "BUSINESS_RAW_INFORMATION_DELETED" with `deletedAt`; statusCode = 500 / code = "SYSTEM_INTERNAL_ERROR". The `too_long` and `empty_after_trim` reasons of InvalidSearchQueryError diverge from the contract, as the two findings state.
