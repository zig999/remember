read:
  - node: rules/knowledge-base/curation-reason-not-blank
    held_at: >-
      nowhere
    evidence: >-
      The file only maps already-raised errors to envelopes. Its one touch on reasons is the emitted
      message `case "BUSINESS_REASON_REQUIRED": return "reason is required for the requested operation";`.
      It has no trim, no length test and no schema declaring the reason. The invariant is enforced
      where the request schema is declared, not here.
  - node: rules/knowledge-base/dispute-resolution-distinct-items
    held_at: >-
      nowhere
    evidence: >-
      No check of an item count or of duplicate item ids appears in the file. A failure of this rule
      can only reach `mapZodError` as an ordinary issue, and so falls to the default branch
      `return mapped(422, "warn", { code: "VALIDATION_INVALID_FORMAT", message: "Request payload failed validation.", ...`.
      The "at least two, none twice" condition is not stated here.
looked_past: >-
  The error codes, HTTP statuses, messages and the priority order of the custom Zod codes in this file
  agree with the scenario answers in the curation nodes' refusal tables (for example
  "decision=merge_into requires target_node_id" and "A duplicate-guard index rejected the resolution;
  another row currently occupies this scope."), so I reported no finding on them. The map from
  Zod/pg errors to envelopes is not part of either node in my set.
