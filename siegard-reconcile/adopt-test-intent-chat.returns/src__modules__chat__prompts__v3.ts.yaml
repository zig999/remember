findings:
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      BLOCK_4C_POST_INGESTION_PLAYBOOK, line 2.b (lines 112-121), the fallback when affected_nodes is absent or empty
    evidence: >-
      "recue para UM", "`search` por nome proprio mencionado pelo dono, OU", "`list_nodes(node_type=<tipo plausivel>)` ESCOLHIDO no bloco de", "ontologia."
    cost: >-
      The node says that when a completed run lists no affected nodes the assistant looks the nodes up by node type. The emitted playbook adds a second fallback, a single-name `search` per name the owner mentioned. That choice between two fallbacks is made only in this prompt text. The next reader looks for it in the node, finds only the node-type lookup, and cannot tell whether the single-name search was decided.
    kind: unstated
    correction: >-
      Either the node chat-prompt-fallback-lists-by-node-type states that a single-name search is also an accepted fallback, or the prompt drops it.
    node: rules/chat/chat-prompt-fallback-lists-by-node-type
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      BLOCK_4C_POST_INGESTION_PLAYBOOK, line 2.a (lines 112-114), the depth argument of traverse
    evidence: >-
      "diretamente em `get_node(id)` e/ou `traverse(start_node_id=id,", "depth=2)`. Descreva APENAS o que essas chamadas retornaram."
    cost: >-
      The node says only to read each node and traverse from it directly. The prompt fixes the traversal depth at 2 and restricts the answer to what those calls returned. Both are values the assistant obeys, and no node states them. A change to the depth would be made here, where the next reader of the specification will not look.
    kind: unstated
    correction: >-
      chat-prompt-affected-nodes-first should state the depth and the describe-only-what-was-returned restriction, or the prompt should stop stating them.
    node: rules/chat/chat-prompt-affected-nodes-first
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      BLOCK_4C_POST_INGESTION_PLAYBOOK, step 1 (lines 105-107), the instruction for a run still running
    evidence: >-
      "1. Chame `get_ingestion_status` UMA UNICA VEZ para confirmar que a", "ingestao alcancou `status: \"completed\"`. Se ainda estiver em", "`running`, informe e PARE — nao tente descrever o que foi ingerido."
    cost: >-
      This tells the assistant what to do when the owner asks for the result while the run has not completed: report and stop, and do not describe what was ingested. The candidate v2 nodes cover returning while running, no polling within the starting turn, and following up by asking the status. None covers this behavior, so it lives only in the prompt text.
    kind: unstated
    correction: >-
      A node in the chat-prompt family should state the behavior for a run found still running when the owner asks for its result.
    node: rules/chat/chat-prompt-v2-ingestion-returns-running
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      BLOCK_4C_POST_INGESTION_PLAYBOOK, steps 3 and 4 (lines 122-128)
    evidence: >-
      "3. Cite a fonte: o campo `raw_information_id` retornado por", "   `get_ingestion_status` identifica o documento ingerido — mencione-o", "   ao dono." and "Em caso de duvida,", "   recuse a resposta e replaneje pelos passos 2.a / 2.b."
    cost: >-
      Two directives are stated only in the prompt. The assistant must mention `raw_information_id` to the owner, and in case of doubt it must refuse the answer and replan. The candidate chat-prompt-v1-cites-sources says only to cite the source. The specific field to cite and the refuse-and-replan instruction are decisions no node holds.
    kind: unstated
    correction: >-
      The chat-prompt nodes should state which identifier is cited after an ingestion and the refuse-and-replan behavior, or the prompt should drop them.
    node: rules/chat/chat-prompt-v1-cites-sources
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      the file header comment, lines 13-17 (Block 4B)
    evidence: >-
      "`search` is lexical AND (one specific name per call, never concatenate", "multiple proper nouns); `list_nodes` MUST carry a `node_type` filter", "when used as category enumeration; `list_node_types` /", "`list_link_types` / `list_attribute_keys` are the discovery primitives."
    cost: >-
      This is prose that no running system emits, and it restates facts the nodes hold: search-one-name, search-is-lexical-and, list-by-node-type and discovery-listings. BLOCK_4B_SEARCH_DISCIPLINE in this file holds those facts as emitted text. The comment is a second home for them. If a node moves, the comment keeps saying the old fact and nothing flags it.
    kind: restates
    correction: >-
      Remove the comment. It adds no fact the nodes do not hold, and the code holds them in BLOCK_4B_SEARCH_DISCIPLINE.
    node: rules/chat/chat-prompt-search-one-name
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      the file header comment, lines 18-24 (Block 4C)
    evidence: >-
      "The model", "MUST consult `result.affected_nodes` FIRST (TC-5 propagation, BR-43 /", "BR-45 amendments) and do direct `get_node` / `traverse` lookups; the", "`search` / `list_nodes(node_type=...)` path is the fallback when", "`affected_nodes` is empty or absent; an unfiltered `list_nodes(limit:30)`", "used as \"what was ingested\" is forbidden."
    cost: >-
      This is prose that restates the facts held by affected-nodes-first, fallback-lists-by-node-type and unfiltered-listing-is-not-ingested. BLOCK_4C_POST_INGESTION_PLAYBOOK holds them as emitted text. The comment also names `limit:30`, a value that appears in no node and in no emitted text.
    kind: restates
    correction: >-
      Remove the comment. The code holds the facts in BLOCK_4C_POST_INGESTION_PLAYBOOK.
    node: rules/chat/chat-prompt-affected-nodes-first
