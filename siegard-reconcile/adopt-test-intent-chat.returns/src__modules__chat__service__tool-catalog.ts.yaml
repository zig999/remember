findings:
  - file: src/modules/chat/service/tool-catalog.ts
    where: >-
      the header comment (lines 1-31) and the doc comments on CHAT_TOOL_NAMES (lines 37-38),
      CHAT_INGEST_TOOL_NAMES (lines 57-62), ResolvedChatToolCatalog (lines 70-76) and
      buildChatToolCatalog (lines 99-121)
    evidence: >-
      "The 13 read-only `query`-toolset tools the chat agentic loop is always
      allowed to call (BR-05 v2.4 step 1)." and "The `ingest`-toolset tool added to the chat catalog when
      `env.CHAT_INGEST_ENABLED === true` (BR-05 v2.8 step 2 / BR-44 v2.8)." and "`undefined` when at least ONE of the 13 query names is missing in the
      registry (route is not mounted — BR-05)."
    cost: >-
      These comments say again, in prose, what constraints/chat-toolset holds: which tools the
      assistant has, and that directed ingestion is offered only where chat ingestion is enabled
      and available. The running code holds the same fact in this file, in the CHAT_TOOL_NAMES
      array and in the `if (ingestFlag)` branch. When the node moves, nothing reaches the
      comments, so the next reader finds a second statement of the toolset, quoting retired
      back-spec rule ids (BR-05, BR-44), that can disagree with the node unnoticed.
    kind: restates
    correction: >-
      Remove the comments. The code in this file already holds the fact. This is the comment
      route, followed by a reconcile over the file.
    node: constraints/chat-toolset

