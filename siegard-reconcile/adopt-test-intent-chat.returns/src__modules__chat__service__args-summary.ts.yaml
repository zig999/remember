    where: >-
      header comment, lines 11-12 and 26-32, plus the doc comments at lines 40 and 53
    evidence: >-
      "2. Bounded length — `<= 200` code points (matches the openapi.yaml
      ToolStartEvent.args_summary `maxLength: 200` schema, line 489)."
      and "the `args_summary` for `start_async_ingestion` MUST NEVER include the raw `content` payload"
    cost: >-
      The 200 cap and the ban on carrying ingestion content are said twice, once as prose
      here and once in clampToMax / the start_async_ingestion branch. When the node moves,
      this prose keeps saying the old figure and the next reader cannot tell which was decided.
    kind: restates
    correction: >-
      Remove the prose. The code holds the fact at ARGS_SUMMARY_MAX_CHARS and clampToMax() in
      this file, and at the content_len branch of start_async_ingestion.
    node: rules/chat/tool-start-summary-bounded
