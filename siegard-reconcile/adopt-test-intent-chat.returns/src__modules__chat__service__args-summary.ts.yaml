    node: rules/chat/tool-start-listing-summary
  - file: src/modules/chat/service/args-summary.ts
    where: >-
      header comment lines 34-38 and the comment at line 159
    evidence: >-
      "Fallback when the input shape is unexpected: `<n keys>` — the dispatcher
      counts top-level keys and emits that string (e.g. `"3 keys"`). The fallback
      also fires for an unknown tool name"
    cost: >-
      The fallback rule is stated again in prose, and the prose misattributes the counting to
      the dispatcher when fallbackSummary() in this file does it.
    kind: restates
    correction: >-
      Remove the prose. The code holds the fact in fallbackSummary() and in the `default:`
      branch of formatByTool.
    node: rules/chat/tool-start-summary-fallback
  - file: src/modules/chat/service/args-summary.ts
    where: >-
      the "start_async_ingestion" case, lines 142-150
    evidence: >-
      const contentLen = [...content].length;
      return `source_type=${sourceType} content_len=${contentLen}`;
    cost: >-
      The summary of a directed ingestion start, showing source_type and the content length in
      code points, is a domain fact that appears only here. tool-start-summary-bounded says
      only that the content is never carried. The next reader looks in the specification for
      what the owner sees for an ingestion start and finds nothing.
    kind: unstated
    correction: >-
      An analysis should give the start_async_ingestion tool-start summary a node, or extend
      tool-start-summary-bounded, stating that it shows the source type and the content length
      in Unicode code points.
  - file: src/modules/chat/service/args-summary.ts
    where: >-
      the "get_ingestion_status" case, lines 152-156
    evidence: >-
      const llmRunId = readString(obj, "llm_run_id");
      if (llmRunId === undefined) return fallbackSummary(obj);
      return `llm_run_id=${llmRunId}`;
    cost: >-
      The summary of an ingestion status read, showing the run identity, appears in no node.
      The tool-start-read-summary node covers identity-alone summaries only for node reads,
      history reads and provenance reads, so this format is held only by the code.
    kind: unstated
    correction: >-
      An analysis should give the get_ingestion_status tool-start summary a node, or extend an
      existing tool-start summary node to cover it.
