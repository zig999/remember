    held_at: >-
      listRecentRealTurns (lines 674-715): the boundary CTE takes the created_at of the K-th most recent owner-written
      message, and the outer query returns every message of the conversation from that moment on. The default of 6 is
      not in this file; the caller passes turn_count.
    evidence: >-
      "WITH boundary AS ( SELECT created_at AS at FROM chat_message WHERE conversation_id = $1 AND role = 'user' AND
      idempotency_key IS NOT NULL ORDER BY created_at DESC, id DESC LIMIT 1 OFFSET $2 ) ... WHERE conversation_id =
      $1 AND created_at >= COALESCE( (SELECT at FROM boundary), (SELECT at FROM fallback) ) ORDER BY created_at ASC,
      id ASC"
