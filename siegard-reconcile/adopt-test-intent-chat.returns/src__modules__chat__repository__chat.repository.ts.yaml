  The file also keeps listRecentMessages, listOlderMessagesForSummary and countUserTurns, which no production caller uses (a code-hygiene matter, with listRecentMessages cutting its window by message count where the node cuts it by owner-written messages), and it spells AssistantStopReason with underscores (end_turn, max_iterations, turn_timeout) where domain/chat/assistant-stop-reason uses hyphens while contracts/chat/conversations.md spells the same values with underscores; I did not judge either.
