findings:
  - file: src/modules/chat/repository/chat.repository.ts
    where: >-
      the comment above the listRecentRealTurns member of the ChatRepository interface (lines 206-213) and the
      comment above the function listRecentRealTurns (lines 656-673, with the inline comment at lines 681-687)
    evidence: >-
      "// BR-31 v2.9: turn-based recent window. Returns every chat_message row that
      // belongs to one of the last `turn_count` REAL turns (a real turn is anchored
      // by a `role='user' AND idempotency_key IS NOT NULL` row), in chronological
      // ASC order ... When fewer than `turn_count`
      // real turns exist, all rows from the available turns are returned (no error,
      // no padding)."
    cost: >-
      The recent-window rule is written out in prose in the interface and again above the function, while the
      WITH boundary / fallback query holds it as code. The prose is a second home that has to be kept in step with
      rules/chat/model-context-window by hand. The next reader may take the comment, not the node, as the place the
      window was decided.
    kind: restates
    correction: >-
      Remove the two comments. The behavior is already held by the query in listRecentRealTurns, and the fact is
      held by the node.
    node: rules/chat/model-context-window
  - file: src/modules/chat/repository/chat.repository.ts
    where: >-
      listMessagesPaginated, lines 764-804: the query that selects the page (ORDER BY created_at ASC ... LIMIT
      limit+1, then rows.slice(0, limit)). The route that consumes the page computes next_before from page.items[0]
      (src/modules/chat/routes/conversations.routes.ts, line 460).
    evidence: >-
      "WHERE conversation_id = $1${beforeClause}${displayFilter}
      ORDER BY created_at ASC, id ASC
      LIMIT ${limitParam}" followed by "const items = hasMore ? rows.slice(0, limit) : rows;". The node says: "A
      message listing's page is the most recent messages created before its given moment, and the next page ends
      before the oldest of them."
    cost: >-
      The query returns the oldest `limit` messages before the cursor, not the most recent ones. The node's own log
      records this same behavior as the case the decision replaced: "The material answers a message page with the
      oldest messages and a next-page moment that selects messages older than that page, so following it from the
      first page finds nothing." A conversation longer than one page therefore shows its oldest messages first, and
      following next_before does not reach the rest of the history.
    kind: contradicts
    correction: >-
      Select the most recent `limit` rows created before `before` (a descending scan, then re-sorted ascending so
      the page is still answered oldest first, ties by identity). The next page's moment is then the oldest created_at
      of that page.
    node: rules/chat/message-listing-pages-backwards
