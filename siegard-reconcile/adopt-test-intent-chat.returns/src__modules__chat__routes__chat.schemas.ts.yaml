findings:
  - file: src/modules/chat/routes/chat.schemas.ts
    where: >-
      buildChatTurnRequestSchema and the ChatTurnRequest type, lines 12-41 (with ChatMessageSchema and ChatRoleSchema, lines 3-10)
    evidence: |-
      messages: z
        .array(ChatMessageSchema)
        .min(1, "messages must contain at least 1 entry")
        .max(opts.maxHistoryMessages, `messages must contain at most ${opts.maxHistoryMessages} entries`),
      ...
      .refine((v) => v.messages[0]?.role === "user", {
        message: "first message must have role=user",
    cost: >-
      The file states a request shape that no node holds: a turn request carrying a list of role/content messages, at least one and at most a configured number, the first of them from the user. The specification's send-message operation takes a single content and an optional model. A grep of backend/src finds no use of buildChatTurnRequestSchema or ChatTurnRequest outside this file, and modules/chat/index.ts re-exports only ChatMessageSchema and ChatRoleSchema from this group. The rule therefore lives only here. The next reader looks for it in the specification and does not find it, and the first-message role refusal reads like a decision the business made.
    kind: unstated
    correction: >-
      Either analysis gives the chat turn request shape a node, or the schema, which nothing reads, is removed by the route that answers dead code. A node cannot be chosen here.
  - file: src/modules/chat/routes/chat.schemas.ts
    where: >-
      UpdateConversationRequest, the .refine at lines 53-59 (message carries the code as a text prefix)
    evidence: |-
      .refine(
        (body) => body.title !== undefined || body.archived_at !== undefined,
        {
          message:
            "VALIDATION_REQUIRED_FIELD: at least one of title or archived_at must be present",
        }
      );
    cost: >-
      The contract says every update naming neither field answers HTTP 422 VALIDATION_REQUIRED_FIELD with message "at least one of title or archived_at must be present". In the source, the refine only fails Zod parsing. conversations.routes.ts calls UpdateConversationRequest.parse(request.body), and middleware/error-handler.ts maps any ZodError to code VALIDATION_INVALID_FORMAT, message "Request payload failed validation.", with the issues as details. The only path that returns VALIDATION_REQUIRED_FIELD is the route's separate empty-body check. A body holding only other keys therefore answers VALIDATION_INVALID_FORMAT. The code is written into the message text but never reaches the code field. That is the very split the contract's decision log says was resolved, and a client branching on the code is told something other than the node says.
    kind: contradicts
    correction: >-
      An update body naming neither title nor archived_at, empty or holding only other keys, must answer VALIDATION_REQUIRED_FIELD with message "at least one of title or archived_at must be present" and details { body: "PATCH /conversations/:id" }. The refine's failure has to reach that answer, instead of being carried as a message prefix that the generic ZodError mapping turns into VALIDATION_INVALID_FORMAT.
    node: contracts/chat/conversations
