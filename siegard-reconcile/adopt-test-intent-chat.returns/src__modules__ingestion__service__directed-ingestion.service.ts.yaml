looked_past: >-
  Every node in this pack is a chat rule, and the file's directed-ingestion facts (sentinels, confidence 1.0, dependency ordering, the cascade, the 120/200/2000-character bounds, the pin, the metadata and content synthesis) are held by knowledge-base nodes outside this set; I did not review them. The block comments restate several of those facts (BR-34 and others). That prose is a separate judgment.
