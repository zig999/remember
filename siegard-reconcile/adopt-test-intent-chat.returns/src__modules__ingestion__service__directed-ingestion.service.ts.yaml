findings:
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      readClosedRunSafe, the `fallback` constant and its two uses (lines 1050-1054, 1067 and 1087), which feed `run.started_at`, `run.finished_at` and `run.attempts` in the returned result (lines 818-820)
    evidence: >-
      const fallback = {
          started_at: new Date(0).toISOString(),
          finished_at: new Date(0).toISOString(),
          attempts: 1,
        };
    cost: >-
      When the closed run row is missing or cannot be read, the result reports a completed run that started and finished at 1970-01-01T00:00:00.000Z with one attempt. A caller cannot tell these placeholders from real times. The specification only says a run holds a finish time exactly when its status is not running. A reader looking for what a directed result reports when its run cannot be read will not find this rule in the specification. The same applies to `finished_at` on a row whose finish time is null.
    kind: unstated
    correction: >-
      The analysis would need to state, in a knowledge-base node for the directed ingestion's run report, what the run's times and attempts are when the run row cannot be read. I searched the specification's full-text projection for `epoch`, `1970`, `placeholder` and unreadable-run wording and found no such node.
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      closeRunCompletedSafe (lines 1006-1034) and the affected-nodes resolution catch block in step 5 (lines 767-787)
    evidence: >-
      logger.warn(... event: "directed_ingestion_close_failed" ...) after `/* swallow */`; and `// resolvedAffected stays []; the run is still completed.`
    cost: >-
      A failed close of the run row is swallowed and logged only. The result still says `status: "completed"`, so the run row can stay running while the response claims completion. A failed affected-nodes resolution yields an empty `affected_nodes` list, which the chat treats as «a completed run lists no affected nodes». The specification holds that a directed ingestion completes its run whatever its items' statuses, but not these degraded paths. The next reader will find them only in this code.
    kind: unstated
    correction: >-
      A knowledge-base node would need to state what a directed ingestion reports when closing its run, or resolving its affected nodes, fails after dispatch.
