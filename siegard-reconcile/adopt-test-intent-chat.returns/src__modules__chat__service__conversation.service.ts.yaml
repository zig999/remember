findings:
  - file: src/modules/chat/service/conversation.service.ts
    where: >-
      decodeCursor, lines 99-108 (the shape check on the decoded cursor)
    evidence: >-
      typeof (parsed as { created_at?: unknown }).created_at !== "string" ||
      typeof (parsed as { id?: unknown }).id !== "string"
    cost: >-
      The contract answers a cursor that does not decode to a creation time and a well-formed
      conversation identity with HTTP 422 VALIDATION_INVALID_FORMAT. Its log records that the earlier
      material answered such cursors with an internal error instead. This decoder accepts any pair of
      strings, so a cursor with a non-timestamp creation time or a non-identifier identity passes it.
      That cursor then reaches the repository, and the 422 refusal is not produced here. I read only
      this file, so I cannot see whether the route or the repository checks the two values elsewhere.
      If neither does, a malformed cursor is the owner's error and is reported as a system fault.
    kind: contradicts
    correction: >-
      Either this decoder also refuses a created_at that is not a timestamp and an id that is not a
      well-formed identifier, throwing InvalidCursorError, or the layer that does is named. The
      refusal belongs to contracts/chat/conversations.
    node: contracts/chat/conversations
