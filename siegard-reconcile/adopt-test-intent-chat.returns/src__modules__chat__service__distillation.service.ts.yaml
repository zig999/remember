findings:
  - file: src/modules/chat/service/distillation.service.ts
    where: >-
      const SUMMARY_MAX_TOKENS = 600, line 146, passed as max_tokens in the
      anthropic.messages.create call of maybeRefreshSummary (line 277)
    evidence: >-
      const SUMMARY_MAX_TOKENS = 600;
      ...
      max_tokens: SUMMARY_MAX_TOKENS,
    cost: >-
      This is a numeric ceiling on the model output of a rolling-summary refold. No
      node holds it. The nearest node, rules/chat/rolling-summary-length, bounds the
      trimmed summary in characters (1 to 2000) and says nothing about tokens. The
      figure is easy to mistake for an implementation detail. A change to it changes
      which summaries come back cut short and then pass or fail the length rule. The
      next reader looks in the specification for the ceiling and finds nothing.
      The docstring of maybeRefreshSummary also says max_tokens: 512, which differs
      from this value.
    kind: unstated
    correction: >-
      An analysis would either give the output-token ceiling of a refold a node, or
      decide that it is not a business fact and record that decision.
    node: rules/chat/rolling-summary-length
  - file: src/modules/chat/service/distillation.service.ts
    where: >-
      const TITLE_MAX_TOKENS = 64, line 147, passed as max_tokens in the
      anthropic.messages.create call of maybeDistillTitle (line 404)
    evidence: >-
      const TITLE_MAX_TOKENS = 64;
      ...
      max_tokens: TITLE_MAX_TOKENS,
    cost: >-
      This is a numeric ceiling on the model output of title distillation. No node
      holds it. rules/chat/distilled-title-length bounds the trimmed title in
      characters (1 to 80) and says nothing about tokens. A change to it changes
      which titles are cut short and then dropped by the length check. The next
      reader looks in the specification for the ceiling and finds nothing.
    kind: unstated
    correction: >-
      An analysis would either give the output-token ceiling of title distillation a
      node, or decide that it is not a business fact and record that decision.
    node: rules/chat/distilled-title-length
