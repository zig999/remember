looked_past: >-
  Nodes outside the pack and the candidate index hold what this file implements as code: rules/chat/rolling-summary-length for SUMMARY_MAX_CHARS and the oversize refusal, rules/chat/distilled-title-length for TITLE_MAX_LENGTH, and the refresh, overlap, fold, failure and title policies. The file conforms to them, so they are not findings. I saw the comments and the fixed log event names and shapes, which are another judgment's. Among the comments are the header and docstrings that restate node facts (the 2000 and 80 character ceilings, "default claude-haiku-4-5", "stream: false") and the docstring's "max_tokens: 512", which differs from the code's 600.
