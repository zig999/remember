      the header comment (lines 1-7) and the docstring of renderDatetimeBlockB (lines 22-34)
    evidence: >-
      // `"Data/hora atual do dono: <ISO-8601 with offset> (<tz-id>)"` and
      * @returns    The exact-shape string per BR-47 step 2 example.
    cost: >-
      The opening words are held twice: in the code (the ISO_PREFIX constant) and in the header comment
      and docstring. When the node changes, the comment still names the old wording. The comment also
      points readers to a BR-47 step list instead of the specification node.
    kind: restates
    correction: >-
      Remove the header comment and the docstring prose. The fact stays held by the ISO_PREFIX
      constant and the template in renderDatetimeBlockB.
    node: rules/chat/model-context-owner-time-opening
  - file: src/modules/chat/service/datetime-block.ts
    where: >-
      renderDatetimeBlockB, line 37: the template that appends the zone identifier in parentheses
    evidence: >-
      return `${ISO_PREFIX}${iso} (${tz})`;
    cost: >-
      The text sent to the assistant ends with the owner's zone identifier in parentheses. The nodes
      that govern this statement fix only its opening words, and the ISO-8601 time with offset in the
      owner's zone. Nothing says the zone id is stated, in parentheses, after the time. The shape is
      decided here, so the next reader looks in the specification and does not find it.
    kind: unstated
    correction: >-
      Analysis would give the statement's trailing parenthesised zone identifier a node, or extend
      rules/chat/model-context-owner-time.
    node: rules/chat/model-context-owner-time
