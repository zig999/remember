findings:
  - file: src/modules/chat/prompts/v2.ts
    where: >-
      v2Additions, directive 1 (lines 66-71), the text sent to the model as part of the system prompt
    evidence: >-
      "1. CHAME `start_async_ingestion` SOMENTE quando o dono pedir",
      "   EXPLICITAMENTE para ingerir um documento — sinais tipicos sao",
      "   frases como \"ingerir\", \"salvar este documento\", \"registrar",
      "   este texto\".
    cost: >-
      The prompt makes explicit owner request the only trigger for asynchronous ingestion, and lists
      the phrases that count as a request. No node holds that rule for start_async_ingestion.
      rules/chat/assistant-writes-only-on-owner-request covers directed ingestion only, and
      rules/chat/chat-prompt-v2-ingestion-returns-running, chat-prompt-v2-no-status-polling and
      chat-prompt-v2-no-content-echo do not state it. The trigger rule and its example phrases
      therefore live only in this prompt string. A reader who looks in the specification for when
      the assistant may start an asynchronous ingestion finds nothing.
    kind: unstated
    correction: >-
      An analysis would have to give the fact a node: either extend
      rules/chat/assistant-writes-only-on-owner-request to cover asynchronous ingestion, or add a
      rule for the v2 chat prompt. The example trigger phrases would also need a decision on
      whether they are part of the fact.
  - file: src/modules/chat/prompts/v2.ts
    where: >-
      v2Additions, introduction (lines 61-64), the text sent to the model as part of the system prompt
    evidence: >-
      "estiverem disponiveis no catalogo, observe os limites abaixo. Se elas",
      "nao aparecerem no catalogo, ignore esta secao — significa que a",
      "capacidade de ingestao via chat esta desligada nesta instalacao.",
    cost: >-
      The prompt tells the model that absence of the two ingestion tools from its catalog means chat
      ingestion is switched off in this installation, and that the section is then to be ignored.
      No node holds this. The enablement nodes (chat-enabled-by-default,
      directed-ingestion-disabled-by-default) speak of the chat and of directed ingestion, not of
      asynchronous ingestion. The conditional behavior therefore exists only in this string.
    kind: unstated
    correction: >-
      An analysis would have to state in a node that the v2 chat prompt's ingestion directives apply
      only while the asynchronous ingestion tools are offered, and what their absence means.
