findings:
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      file header, lines 13-17 (comment on tools that return null)
    evidence: >-
      // Every other tool (`list_node_types`, `list_link_types`, `list_attribute_keys`,
      // `get_history_*`, `get_provenance_*`) returns `null` from the dispatcher — a
      // quiet no-op, NOT an empty delta.
    cost: >-
      The comment says again that catalog listings, history reads and provenance reads get no graph delta. The dispatcher already holds this in code, and it is a second copy that goes stale when the node moves.
    kind: restates
    correction: >-
      Remove the comment. The fact stays held by the `GRAPH_TOOL_NAMES` guard at the top of `normalizeToolResult`, which returns `Promise.resolve(null)`.
    node: rules/chat/graph-delta-absent-for-catalog-history-provenance
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      file header lines 39-42 and the `ingest_directed` docstring, lines 444-448 (comments on unreadable results)
    evidence: >-
      // every tool call. A guard miss returns an empty delta (`{nodes:[], links:[]}`)
      // rather than throwing, so a broken tool result never crashes the SSE stream.
      and
      *   5. **Envelope guard** — if `result` is not a well-formed object return
      *      `null` (the other arms return an empty delta on this branch, but
      *      BR-41 v2.11 says return `null` for the ingest_directed path
    cost: >-
      The rule that an unreadable result gives an empty delta, except for directed ingestion which gives none, is written again as prose. The code holds it in the `isRecord` guards of each arm and in `if (!isRecord(result)) return null;`. A change to the node would leave these comments saying the old rule.
    kind: restates
    correction: >-
      Remove both comments. The code is the home of the fact.
    node: rules/chat/graph-delta-unreadable-result
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      `GraphLinkWire.link_type_label` docstring, lines 81-88
    evidence: >-
      * Optional pt-BR display label of the LinkType, projected server-side from
      * the catalog row (`link_type.label`). Additive in v2.4.0 — OMITTED when
      * the slug is not present in the catalog snapshot (open-ontology fallback);
    cost: >-
      The docstring repeats the rule that a link carries its catalog label and none when the catalog lacks the link type. The code holds it in `...(linkTypeRow !== undefined ? { link_type_label: linkTypeRow.label } : {})`. Comments at lines 215-218 and 533-534 repeat it again.
    kind: restates
    correction: >-
      Remove the prose. The fact stays held by the two spread expressions in `pickLinkWire` and `normalizeIngestDirected`.
    node: rules/chat/graph-delta-link-label
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      `normalizeSearch`, comment at lines 379-381
    evidence: >-
      // If `byId.get(id)` is undefined, the node was deleted between the
      // search and the hydration (rare race) — we just drop it. The front-end
      // never knew about it; no need to surface a placeholder.
    cost: >-
      The comment states again that a found node no longer held is left out of the delta. The code already does this with `if (node !== undefined) nodes.push(node);`, so the comment is a second home for the fact.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/chat/graph-delta-search-drops-vanished-node
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      `normalizeIngestDirected` docstring, lines 410-412
    evidence: >-
      If `run.affected_nodes` is absent, `nodes = []` and the
      *      frame still emits (an empty `{nodes:[], links:[]}` delta is
      *      contractual — BR-41 v2.11).
    cost: >-
      The docstring says again that a directed ingestion which affected nothing still gets an empty delta. The code holds it with the `rawAffected` default of `[]` and the final `return { source_tool: "ingest_directed", nodes, links };`. The comment is a second home that can drift from the node.
    kind: restates
    correction: >-
      Remove the prose.
    node: rules/chat/graph-delta-directed-empty
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      `normalizeIngestDirected` docstring item 4, lines 437-442, and comment at lines 544-546
    evidence: >-
      *   4. **Omitted fields** — `is_in_effect`, `status` (assertion_status),
      *      and `flags` are OMITTED from every link on the directed path.
    cost: >-
      The docstring and the in-code comment both state that directed links carry no effectiveness, status or flags. The code holds this by building `out` with only `id`, `source_node_id`, `target_node_id`, `link_type`, `link_type_label` and `is_temporal`. The prose is a duplicate that goes stale if the node changes.
    kind: restates
    correction: >-
      Remove both pieces of prose.
    node: rules/chat/graph-delta-directed-links-bare
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      `normalizeIngestDirected`, link loop, lines 507-517
    evidence: >-
      // Compound ref: "<source_ref>-><link_type>-><target_ref>". Parse via
      // FIRST/LAST '->' to survive link_type slugs that themselves contain
      const first = entry.ref.indexOf("->");
      const last = entry.ref.lastIndexOf("->");
    cost: >-
      The code reads a link item's `ref` as the string `source->link_type->target` and takes the link's ends and type from it. No node in the specification holds this ref format. `directed-item` holds `ref` only as a string, and `directed-item-reference-length` holds only a length of 1 to 120. The format is produced in the ingestion module. The next reader looks in the specification for how a link item is named, finds nothing, and the parse here becomes the only record of it.
    kind: unstated
    correction: >-
      An analysis should give the link item's reference format a node, near the directed-item nodes (`domain/knowledge-base/directed-item`). This file's parse can then be bound to it.

