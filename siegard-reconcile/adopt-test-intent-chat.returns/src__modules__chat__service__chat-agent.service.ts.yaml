looked_past: >-
  The system prompt block's cache_control: { type: "ephemeral" }, the hand-rolled stream queue, and the Zod-to-JSON-Schema fallback in toolInputSchemaFromZod name no domain fact, and the facts the file does apply (one tool per call, cancel precedence, stop-reason mapping, last model, fixed provider and internal error messages) are held by nodes outside this set, so I left them unreported.
