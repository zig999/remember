  - node: rules/chat/tool-failure-continues-turn
    held_at: >-
      the tool loop, lines 414-431 (unknown tool becomes an error envelope;
      the handler is raced against ctx.env.TOOL_TIMEOUT_MS), and
      raceToolHandler. The 15 000 ms default is not in this file.
    evidence: >-
      toolEnvelope = await raceToolHandler( tool.handler, block.input, ctx.env.TOOL_TIMEOUT_MS, invocationContext );
      then toolResultBlocks.push({ type: "tool_result", ..., is_error: !toolEnvelope.ok }); and `continue;`
