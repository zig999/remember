findings:
  - file: src/modules/chat/service/chat-agent.service.ts
    where: >-
      line 53, MAX_TOKENS_PER_ITERATION, used at line 255 in the stream request
    evidence: >-
      const MAX_TOKENS_PER_ITERATION = 4096;
      ... max_tokens: MAX_TOKENS_PER_ITERATION,
    cost: >-
      This number caps how long each assistant answer can be, and a longer
      answer is cut off and ends the turn as max-tokens. It is not configurable
      and no node states it. The next reader will look for the cap in the
      specification, find nothing, and take the code's 4096 as the business
      decision. The turn rules in the set (turn-model-call-limit and
      turn-time-limit) each state their number and say it is configurable.
    kind: unstated
    correction: >-
      Analysis would have to give the per-model-call output cap a node, or
      state it as a configured value with a default, next to
      rules/chat/turn-model-call-limit.
  - file: src/modules/chat/service/chat-agent.service.ts
    where: >-
      the unknown-tool branch (lines 416-423) and the timeout envelope in
      raceToolHandler (lines 633-640)
    evidence: >-
      error: { code: "VALIDATION_INVALID_FORMAT", message: "unknown tool name", }
      and error: { code: "SYSTEM_SERVICE_UNAVAILABLE", message: "tool timeout", }
    cost: >-
      The code and wording of the failure handed to the assistant live only
      here. The node says that failure is handed over and the turn continues,
      but it does not say what the assistant is told. The same text is also
      returned to the owner in the tool_result error_message. I found no node
      or contract that states these two messages. The next reader will not
      find them in the specification.
    kind: unstated
    correction: >-
      Analysis would have to state, in or beside
      rules/chat/tool-failure-continues-turn, the failure the assistant
      receives for an unknown tool and for a tool past its time.
    node: rules/chat/tool-failure-continues-turn
  - file: src/modules/chat/service/chat-agent.service.ts
    where: >-
      synthesiseInternalErrorEnvelope, lines 672-680, reached from the
      rejection handler at line 650
    evidence: >-
      code: "SYSTEM_INTERNAL_ERROR",
      message: errMessage(err) ?? "tool handler threw",
    cost: >-
      A tool that throws hands the assistant, and the owner via
      error_message, the raw exception message, or the fixed text
      "tool handler threw" when there is none. No node states this. The
      conversations contract fixes the stream-level internal-error message
      but not this one. The disclosure rule for a thrown tool failure lives
      only in code.
    kind: unstated
    correction: >-
      Analysis would have to state what a thrown tool failure hands the
      assistant, as part of rules/chat/tool-failure-continues-turn or in a
      node of its own.
    node: rules/chat/tool-failure-continues-turn
