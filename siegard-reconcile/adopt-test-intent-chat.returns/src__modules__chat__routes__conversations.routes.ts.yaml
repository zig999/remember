findings:
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      sendMessage handler, steps (1) to (3): the Idempotency-Key header check and the body parse come before the kill-switch check (lines 592-633).
    evidence: >-
      `if (headerValue === undefined || headerValue === "") { return reply.code(422).send({ ... code: "VALIDATION_REQUIRED_FIELD", message: "Idempotency-Key header is required" ...` and `const body = sendMessageSchema.parse(request.body ?? {});` both run before `// ---- (3) Kill-switch (BR-14). if (killSwitchTripped(deps.env)) { return sendKillSwitch(reply); }`.
      The node reads: "A sent message is checked for a disabled chat, then its idempotency key, conversation identity and content, then an absent conversation, ..., and is refused at the first check it fails."
    cost: >-
      A malformed message sent while the chat is disabled is answered 422 for the missing or invalid key or content, and not 503 BUSINESS_CHAT_DISABLED. Every other conversation operation in this file answers 503 first. The node's decision log says why: "A disabled surface answers that it is disabled whatever the request holds."
    kind: contradicts
    correction: >-
      Move the kill-switch check ahead of the Idempotency-Key header check and the body parse in the sendMessage handler.
    node: rules/chat/send-message-check-order
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      handleIdempotentReplay (lines 1128-1155) and mapStoredStopReason (lines 1546-1562), the replay path of sendMessage.
    evidence: >-
      `const storedStop = mapStoredStopReason(assistantRow.stop_reason);` is followed by `frameJson("done", { stop_reason: storedStop, ...`. In mapStoredStopReason: `case "provider_error": case "internal_error": default: return "end_turn";`.
      The node reads: "A replay of a turn that ended as provider-error or internal-error ends in an error event as the live turn did, never in done."
    cost: >-
      A client that resends under the same Idempotency-Key a turn that failed live gets a successful `done` with `end_turn` instead of the `error` frame. The failure is reported to the owner as a normal answer. The rule's decision log records that "a replay exists to say again what the turn said."
    kind: contradicts
    correction: >-
      On the replay path, send the `error` frame that the stored provider-error or internal-error turn closed with, and keep `done` only for the stop reasons the wire enumerates.
    node: rules/chat/replay-reports-failure
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      Comment in emitChatBootLog, lines 1271-1274 (CHAT_RECENT_WINDOW).
    evidence: >-
      `// BR-31 v2.9: CHAT_RECENT_WINDOW changed UNIT (rows -> turns) and DEFAULT (10 -> 6) in chat-context-fidelity TC-01.`
    cost: >-
      The default of 6 is restated in prose here, and the code that holds it is `CHAT_RECENT_WINDOW: z.coerce.number().int().min(1).default(6)` in src/config/env.ts. A reader who finds the number here has a second place to maintain when the node moves.
    kind: restates
    correction: >-
      Remove the comment. The default is held in src/config/env.ts and the file only forwards `recentLimit: deps.env.CHAT_RECENT_WINDOW`.
    node: rules/chat/model-context-window
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      Comment in emitChatBootLog, lines 1305-1308 (OWNER_TZ).
    evidence: >-
      `// because `OWNER_TZ` carries a fail-closed default (`America/Sao_Paulo`) —`
    cost: >-
      The zone is restated in prose here, and the code that holds it is `OWNER_TZ: z.string().min(1).default("America/Sao_Paulo")` in src/config/env.ts. The comment is a second home for the default.
    kind: restates
    correction: >-
      Remove the comment. The default is held in src/config/env.ts.
    node: rules/chat/owner-time-zone-default
