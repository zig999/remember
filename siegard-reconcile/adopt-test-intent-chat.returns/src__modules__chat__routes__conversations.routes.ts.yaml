looked_past: >-
  Most of the routes' behavior (HTTP statuses, refusal codes and messages, idempotency, recording and distillation sequencing) is held by nodes outside the pack that this file conforms to, and the file is dense with BR-numbered comments restating them. Structured-log event names and fields (chat.turn, chat.boot, chat.recent_window_resolved, chat.deprecated_env) are held by no node. All of that is another judgment's.
