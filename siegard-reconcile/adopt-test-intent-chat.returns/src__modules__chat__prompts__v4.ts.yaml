findings:
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      BLOCK_4C_DIRECTED_INGESTION, opening paragraph, lines 100-104
    evidence: >-
      "Frases de gatilho tipicas: \"crie\",", "\"registre\", \"linke\", \"ingerir esta informacao\". Se nao houver", "pedido explicito, NAO chame esta ferramenta — apenas responda em texto."
    cost: >-
      The prompt the assistant is sent names four specific phrases as what an explicit owner request to record looks like. No node holds that list. The node that governs the gate says only "when the owner's own message asks it to record knowledge". The list therefore lives only in this string, and the next reader will look for it in the specification and not find it.
    kind: unstated
    correction: >-
      Either give the phrases a node, or take them out of the prompt so it states only the gate the specification holds.
    node: rules/chat/assistant-writes-only-on-owner-request
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      header comment, lines 11-13 (item 1 of the block 4C summary)
    evidence: >-
      "(1) `ingest_directed` is the SINGLE write-bearing entry from chat,"
    cost: >-
      A comment says the fact the node holds, and the prompt string BLOCK_4C_DIRECTED_INGESTION already holds it as code. The comment is a second home outside behavior, and it will drift from the node unnoticed.
    kind: restates
    correction: >-
      Remove the prose. The fact is already held by the string at lines 99-100.
    node: rules/chat/chat-prompt-v4-directed-ingestion-writes
