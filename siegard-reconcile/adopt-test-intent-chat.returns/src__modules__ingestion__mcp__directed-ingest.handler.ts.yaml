looked_past: >-
  The file's two emitted failure envelopes (`VALIDATION_INVALID_FORMAT` with "ingest_directed arguments failed validation." and `SYSTEM_INTERNAL_ERROR` with "Unexpected error during directed ingestion.") agree with constraints/failures-answer-one-envelope and constraints/internal-failure-withholds-cause, which do not name the code strings. I could not search the root for a node holding those two code strings, because the search tool failed to run, so I did not file them. The partial-pointer-dropped branch and the `source_excerpt` forwarding agree with rules/knowledge-base/directed-chat-pointer-whole and rules/knowledge-base/directed-turn-is-original-input, which are outside this pack. The long header comments, which restate BR-34 and CLAUDE.md prose, belong to the comment route.
