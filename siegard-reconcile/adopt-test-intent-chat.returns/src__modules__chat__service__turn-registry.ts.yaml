findings:
  - file: src/modules/chat/service/turn-registry.ts
    where: >-
      the header comment (lines 1-30) and the docstrings of get() and release() (lines 48-56, 61-65)
    evidence: >-
      "chat.back.md v2.0.0 §1.1 / BR-28: \"At most ONE in-flight turn per
      conversation is enforced by an in-process registry
      (`Map<conversation_id, AbortController>`), keyed by conversation id\"" and
      "the turn is still running -> 409 BUSINESS_TURN_IN_PROGRESS" and
      "`cancelTurn` (BR-38: absent -> 404 RESOURCE_NOT_FOUND)"
    cost: >-
      The comments restate the rules "a conversation has at most one turn in flight" and
      "cancelling needs a turn in flight" in prose, with the refusal codes beside them. If
      the node moves, nothing reaches these lines, and the next reader finds a second
      statement of the rule that cites a back-spec (BR-28, BR-38) in place of the
      specification node. The code that holds the first rule here is the module-scoped
      `const registry: Map<string, AbortController> = new Map();` keyed by conversation id.
      The guard that returns 409 and the 404 on cancel sit in callers the comments name
      (sendMessage, cancelTurn). I did not read those callers because they are outside the
      file set.
    kind: restates
    correction: >-
      Remove the comments and docstrings. The fact stays held by the keyed Map here and by
      the callers' guards, and by the node, which binds the file through the trace. This
      is the comment route followed by /reconcile over the file.
    node: rules/chat/one-turn-in-flight
