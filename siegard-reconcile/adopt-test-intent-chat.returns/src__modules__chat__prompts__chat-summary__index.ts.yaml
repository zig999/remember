findings:
  - file: src/modules/chat/prompts/chat-summary/index.ts
    where: >-
      the header comment (lines 21-23) and the docstring above DEFAULT_CHAT_SUMMARY_PROMPT_VERSION (lines 56-61)
    evidence: >-
      "`v2` is the incremental fold (BR-46, default — selected by BR-33 v2.9)." and
      "Recommended default for NEW deployments — used when env is unset. v2.9 makes `v2` the default (incremental fold)."
    cost: >-
      The default summary prompt version is stated in prose as well as in code. When the node's default moves, the
      comments keep saying v2 and nothing flags them. The comment's "BR-33 v2.9" citation also sends the next reader
      to a back-spec rule instead of the node that holds the fact.
    kind: restates
    correction: >-
      Remove the comment and the docstring. The code that holds the fact is
      `export const DEFAULT_CHAT_SUMMARY_PROMPT_VERSION: string = v2.PROMPT_VERSION;` in this same file. The file's
      bind to the candidate node is the route that closes this.
    node: rules/chat/default-summary-prompt-version
  - file: src/modules/chat/prompts/chat-summary/index.ts
    where: >-
      the header comment (lines 14-19) and the docstrings of UnknownChatSummaryPromptVersionError and selectChatSummaryPromptModule (lines 69-73, 86-90)
    evidence: >-
      "an unknown `CHAT_SUMMARY_PROMPT_VERSION` is a configuration error, NEVER a silent fallback." and
      "Resolve a chat-summary prompt module by version string. Throws `UnknownChatSummaryPromptVersionError` for an unregistered version (BR-46 — fail loud, never silently substitute a different prompt)."
    cost: >-
      The rule that a summary prompt version must be one the system holds is stated in prose as well as in code. A
      reader can take the comment for a second authority, and it will not follow the node if the node changes.
    kind: restates
    correction: >-
      Remove the prose. The code that holds the fact is `if (module === undefined) { throw new
      UnknownChatSummaryPromptVersionError(promptVersion); }` in this same file.
    node: rules/chat/summary-prompt-version-known
