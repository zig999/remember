findings:
  - file: src/modules/chat/prompts/chat-summary/v2.ts
    where: >-
      the `system` literal, the bullet "pontos em aberto", line 51
    evidence: >-
      "- pontos em aberto — marcar explicitamente como 'pendente: ...';",
    cost: >-
      The rule that unresolved questions are kept in the summary under a literal "pendente: " marker is
      applied only here. The specification's refold rule says the previous summary's salient facts are
      kept and the older messages' folded in, and it says nothing about open points. The next reader
      looks for it in the specification, does not find it, and cannot tell whether the marker was a
      business decision.
    kind: unstated
    correction: >-
      The analysis would give it a node beside rules/chat/rolling-summary-folds or
      rules/chat/summary-prompt-v2-persona, or leave it out of the prompt.
  - file: src/modules/chat/prompts/chat-summary/v2.ts
    where: >-
      the `system` literal, REGRAS 3 and 6, lines 59 to 66
    evidence: >-
      "3. Prosa pt-BR concisa, paragrafos curtos. Sem cabecalhos. Sem bullets.",
      "6. Responda APENAS com o novo resumo. Sem preambulos, sem despedidas, sem",
      "   comentarios sobre o trecho recebido.",
    cost: >-
      The summary's required shape (prose in short paragraphs, no headings, no bullets, and nothing but
      the summary in the reply) is decided only in this prompt text. The persona node holds only the
      language, the persona and the eight-sentence ceiling, so a change to the summary's shape would
      be made in code the specification never mentions.
    kind: unstated
    correction: >-
      The analysis would state the summary's form in a node bound to the v2 summary prompt, such as
      rules/chat/summary-prompt-v2-persona or a sibling.
  - file: src/modules/chat/prompts/chat-summary/v2.ts
    where: >-
      the constant TOOL_ARGS_INLINE_MAX and its use in summariseToolUseArgs, lines 97 and 111-112
    evidence: >-
      const TOOL_ARGS_INLINE_MAX = 200;
      ...
      return serialised.slice(0, TOOL_ARGS_INLINE_MAX) + "...<truncated>";
    cost: >-
      The slice of messages sent to the model is rendered here with a tool call's arguments cut at 200
      characters and the "[role] body" line format, and no node holds either. The threshold decides
      what the refold can keep of a tool call, and the next reader looks for it in the specification
      and does not find it. rules/chat/tool-result-truncated governs only a tool result's length for
      the assistant, not this rendering.
    kind: unstated
    correction: >-
      The analysis would give the rendering of older messages for the refold (line format, tool-call
      argument limit) a node, or drop the limit.
  - file: src/modules/chat/prompts/chat-summary/v2.ts
    where: >-
      the `messagesBlock` branch of buildUserTurn, lines 198-201
    evidence: >-
      new_messages.length === 0
            ? "(nenhuma)"
    cost: >-
      The text sent to the model for an empty slice of new messages is "(nenhuma)", decided only here.
      The specification fixes the placeholder "(vazio)" for a missing previous summary and says
      nothing of an empty slice, so the next reader of the rule sees only half of the placeholder
      convention.
    kind: unstated
    correction: >-
      The analysis would state the empty-slice placeholder beside rules/chat/summary-prompt-v2-empty-previous.
