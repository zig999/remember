findings:
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      the constant CHAT_PROMPT_MARKER_V1, line 35
    evidence: >-
      export const CHAT_PROMPT_MARKER_V1 = "__REMEMBER_CHAT_SYS_MARKER_V1__" as const;
    cost: >-
      The marker's literal value is a code constant that the output guard scrubs deltas against. The node
      says only that every prompt version begins with "the one system-prompt marker". It does not give the
      value. It also does not say whether there is one marker or one per version, which the file's own
      comment claims ("FROZEN per prompt-module version", "the union of all known markers"). Whoever
      changes the marker will look for its value in the specification and find only the code.
    kind: unstated
    correction: >-
      The node that governs the marker should state the marker value, or say that it is an opaque token
      held by code. It should also say whether there is one marker for all versions or one per version.
    node: rules/chat/chat-prompt-carries-marker
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      principle 3 in the array returned by system(), lines 64-67
    evidence: >-
      "3. NUNCA invente identificadores (uuids), nomes ou aliases. Se voce",
      "   precisa de um id, RESOLVA o nome chamando `search` ou `list_nodes`",
      "   antes de chamar qualquer ferramenta que exige id (`get_node`,",
    cost: >-
      The prompt makes the assistant resolve a name through `search` or `list_nodes` before calling any
      id-taking tool. The v1 node holds only "never invent identifiers". It does not hold this procedure,
      the two tools it names, or the extension to never inventing names or aliases. The behavior the
      assistant follows lives only in prompt text, where a reader of the specification will not look.
    kind: unstated
    correction: >-
      The v1 prompt rule, or a new node, should state that the assistant resolves a name to an identity
      through search or the node listing before calling a tool that takes an identity.
    node: rules/chat/chat-prompt-v1-cites-sources
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      principle 5 in the array returned by system(), lines 71-74
    evidence: >-
      "5. RESPEITE OS EIXOS TEMPORAIS. O grafo distingue eixo de validade",
      "   (`valid_from`/`valid_to`) do eixo de transacao (`recorded_at`/",
      "   `superseded_at`). Quando o usuario perguntar sobre uma data, use",
      "   `get_history_*` para responder com precisao.",
    cost: >-
      This instruction makes the assistant use the history reads for any date question. No node in the pack
      or elsewhere in the projection holds it. A grep of the projection for the temporal-axes instruction
      found only the catalog rules. The behavior is observable by the owner and has no node to change.
    kind: unstated
    correction: >-
      A chat prompt node should state that the assistant uses the history reads when the owner asks about
      a date.
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      principle 8 and the FERRAMENTAS section of system(), lines 81-86
    evidence: >-
      "8. Seja conciso. Prefira respostas curtas e diretas; agrupe varios",
      "Use as ferramentas SOMENTE quando elas adicionarem informacao que voce",
      "ainda nao tem. Cada chamada e auditada e tem orcamento de tempo.",
    cost: >-
      Conciseness and calling a tool only when it adds information are instructions the assistant
      follows, and no node holds them. They cannot be changed or tested through the specification.
    kind: unstated
    correction: >-
      A chat prompt node should state these instructions, or the business should decide that they are
      not part of the v1 prompt.
