findings:
  - file: src/modules/ingestion/dto/propose-attribute.dto.ts
    where: >-
      the JSDoc above the `value` field, lines 24-27
    evidence: >-
      "Canonical-serialized value (string form). The structural layer parses
      this against the `attribute_key.value_type` and rejects on mismatch."
    cost: >-
      The comment states a rule the specification holds, that a value must read as its key's value type. It is prose no
      running system emits. The code that enforces the rule is in validation/structural.ts (`parseAttributeValue`, a
      switch on `args.value_type`), called from service/propose-attribute.service.ts. A second statement of the rule
      sits in this file, and the day the node moves nothing reaches it.
    kind: restates
    correction: >-
      Remove the comment. The rule is held by the node and enforced by `parseAttributeValue` in
      src/modules/ingestion/validation/structural.ts.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/ingestion/dto/propose-attribute.dto.ts
    where: >-
      the `.describe(...)` text on `value`, lines 28-33
    evidence: >-
      "The literal value, serialized as a string. Must parse as the key's declared type (date, number, or string)."
    cost: >-
      The text is sent to the language model as the tool's description. It names the value types as date, number and
      string, and leaves out bool. The specification's value types are date, number, text and bool, and the rule
      accepts exactly true or false for bool. A model that reads this never learns that boolean keys exist. The
      description and the node disagree about the vocabulary, and the code (catalog.ts declares
      `"date" | "number" | "text" | "bool"`) sides with the node.
    kind: contradicts
    correction: >-
      Make the description name the value types as the node holds them: date, number, text and bool.
    node: domain/knowledge-base/value-type
  - file: src/modules/ingestion/dto/propose-attribute.dto.ts
    where: >-
      `fragment_ids`, lines 41-46
    evidence: >-
      fragment_ids: z.array(z.string().uuid()).min(1).describe("Evidence: id(s) of propose_fragment claims from this
      chunk that state the value. At least one required.")
    cost: >-
      An attribute proposal that cites no fragment is refused here, as a rule of the business. No node states it. The
      proposal node gives the cited fragments the cardinality 0..*, and the ingestion contract's refusals for
      propose-attribute name only a missing or wrongly shaped field. A reader looking in the specification for
      whether an attribute may be proposed without evidence finds nothing, and this line is the only place that says
      no.
    kind: unstated
    correction: >-
      Give the fact a node, such as an invariant that an attribute proposal MUST cite at least one information
      fragment. Alternatively, have the proposal node's cardinality say what the code enforces.
    node: domain/knowledge-base/proposal
  - file: src/modules/ingestion/dto/propose-attribute.dto.ts
    where: >-
      the `.describe(...)` text on `valid_to`, lines 50-52
    evidence: >-
      "Date the value STOPS holding (YYYY-MM-DD), if stated. Intervals are half-open [from, to)."
    cost: >-
      The text tells the model that an assertion's validity intervals are half-open. No node holds this for
      proposals or assertions. The only half-open statement in the specification is the link type rule's
      `day < valid_to`, and the validity-start-before-end rule says only that the start is strictly before the end.
      The convention lives in a tool description, and a reader of the specification cannot learn from it whether the
      end date is inside the interval.
    kind: unstated
    correction: >-
      Give the interval convention of an assertion's validity a node, or drop the sentence from the description.
    node: domain/knowledge-base/proposal
