findings:
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      RECEIVED_AT_ANCHOR_DIRECTIVE, lines 57-66: the rule for resolving relative dates
      against document_date and then against received_at
    evidence: >-
      "- When you encounter a relative date in the chunk text (`\"hoje\"`, `\"ontem\"`,",
      "  `\"amanhã\"`, `\"semana que vem\"`, `\"esta semana\"`, similar pt-BR temporal",
      "  deictics), resolve it AGAINST `document_date` if it is present (basis",
      "  `\"document\"`). If `document_date` is `(unknown)`, fall back to the date",
      "  portion of `received_at` (the `YYYY-MM-DD` prefix of the ISO-8601 string) —",
    cost: >-
      This states which date a relative expression counts from: the document date first, then
      the reception date. No node holds it. required-start-fallback covers only a proposal
      that states no start at all, not one where the model resolves a "hoje" or "ontem"
      itself. A later reader who wants to know how "ontem" is dated will look in the
      specification, find nothing, and have no reason to look in this prompt.
    kind: unstated
    correction: >-
      Analysis would have to give the relative-date anchoring rule a node, next to
      rules/knowledge-base/required-start-fallback, or decide that the model does not resolve
      relative dates at all.
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      RECEIVED_AT_ANCHOR_DIRECTIVE, lines 60-64: the instruction to use basis "received" when
      document_date is unknown
    evidence: >-
      "`\"document\"`). If `document_date` is `(unknown)`, fall back to the date",
      "  portion of `received_at` (the `YYYY-MM-DD` prefix of the ISO-8601 string) —",
      "  use basis `\"received\"`.",
      "- This supersedes v3's rule of \"omit the date when `document_date` is unknown\":",
      "  with `received_at` always present, you now HAVE an anchor — use it.",
    cost: >-
      The prompt sent to the model tells it to state the basis received. The node says
      "A proposal MUST NOT state the basis received", and the contract refuses that with
      VALIDATION_INVALID_FORMAT. Under v4, a model that follows the directive on a document
      without a document date has its link or attribute proposals refused. The received basis
      is meant to be recorded by the backend through required-start-fallback. v3 said to omit
      the date so the backend could record received, and v4 explicitly overrides that.
    kind: contradicts
    correction: >-
      The emitted directive would have to stop telling the model to state basis received, or
      the node would have to change through analysis. Either way the prompt and the rule have
      to say the same thing.
    node: rules/knowledge-base/caller-never-states-received
