findings:
  - file: src/modules/ingestion/chunker/config.ts
    where: >-
      line 19, the lower bound of CHUNK_TARGET
    evidence: >-
      export const CHUNK_TARGET: readonly [number, number] = [1500, 2000] as const;
      (the docstring says the chunker "keeps appending sentences while the running block stays within `[CHUNK_TARGET[0], CHUNK_TARGET[1]]`"). Only `CHUNK_TARGET[1]` is read, in v1.ts: `if (tentativeSize > CHUNK_TARGET[1]) {`.
    cost: >-
      1500 is a chunk-size threshold that no node holds, and nothing reads it. The chunking nodes state only 4000 and 2000. The docstring describes a soft window the chunker does not apply. A later reader would take 1500 as a decided minimum chunk size, and it would live only in this file.
    kind: unstated
    correction: >-
      Either give the 1500 lower bound a node, in the chunking rules alongside long-block-sentence-chunks, or drop it from the declaration.
  - file: src/modules/ingestion/chunker/config.ts
    where: >-
      line 30, READING_TAIL
    evidence: >-
      export const READING_TAIL = 200 as const;
      (the docstring describes it as an "overlap added to the END of a chunk", "computed at read time by the future retrieval layer")
    cost: >-
      A 200-unit chunk overlap for retrieval is stated only here, and no code reads it (a grep of backend/src finds no importer). The only node with a 200 is rules/knowledge-base/extraction-reads-chunks-in-order, which is the tail of the previous chunk shown to the model during extraction. That is a different fact. A reader looking for the overlap rule would find it here, and would either not find it in the specification or confuse it with the extraction tail.
    kind: unstated
    correction: >-
      If a retrieval overlap is a decided fact, give it a node. If it is not, remove the unused declaration.
  - file: src/modules/ingestion/chunker/config.ts
    where: >-
      docstring above CHUNK_HARD_MAX, line 21
    evidence: >-
      /** Hard ceiling on a single chunk. A block above this size is sentence-split. */
    cost: >-
      The docstring says in prose what rules/knowledge-base/long-block-sentence-chunks holds, and it is a second home for it. It also calls 4000 a "ceiling on a single chunk", and long-sentence-own-chunk says a sentence longer than 2000 is one chunk whatever its length. The pair conforms because the code holds the fact. What the prose owes is its removal.
    kind: restates
    correction: >-
      Remove the docstring. The code that holds the fact is the split at `if (blockSize <= CHUNK_HARD_MAX)` in src/modules/ingestion/chunker/v1.ts.
    node: rules/knowledge-base/long-block-sentence-chunks
