findings:
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      header comment, lines 13-16
    evidence: >-
      // The extraction LLM is the SERVER's (ANTHROPIC_API_KEY) — the calling client
      // only hands over the document; the inviolable rule that the LLM never touches
      // the DB directly is preserved (every write still goes through the validated
      // propose-* path the orchestrator calls).
    cost: >-
      The rule that an extraction acts only through the four proposals is written a second time as prose in a handler that does not enforce it. The next reader can take this comment for where the rule lives. The enforcing code is the tool list the orchestrator builds in src/modules/ingestion/service/extraction.service.ts (`buildTool("propose_fragment", ...)`, `buildTool("propose_node", ...)`). A change to the node would not reach this comment.
    kind: restates
    correction: >-
      Remove the sentence. The constraint is held by the orchestrator's tool list in extraction.service.ts, and the node is the constraint's home.
    node: constraints/extraction-acts-only-through-proposals
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      header comment, lines 18-21
    evidence: >-
      // Idempotency (BR-08): if the same content was already ingested,
      // `ingestRawInformation` returns `noop_existing`; we DO NOT re-run extraction
      // (the existing run is completed, or running, and re-running would either no-op
      // or 409).
    cost: >-
      The rule "extracts nothing when its content is already held" is stated in prose. The same file also holds it in code, in the `if (outcome === "noop_existing")` branch that returns before `runExtraction`. The prose is a second home, and it adds a claim about why (no-op or 409) that no node holds.
    kind: restates
    correction: >-
      Remove the comment. The `noop_existing` branch holds the behavior, and the node holds the rule.
    node: rules/knowledge-base/document-ingestion-extracts-new-content
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      DEFAULT_INGEST_MODEL, line 49, and its use at line 119
    evidence: >-
      export const DEFAULT_INGEST_MODEL = "claude-sonnet-4-6";
      ...
      model: input.model ?? deps.ingestModel ?? DEFAULT_INGEST_MODEL,
    cost: >-
      The model an ingest_document run is recorded under, when the caller names none and no environment default is wired, is decided only here. The contract's ingest-document operation says nothing about which model a document ingestion runs under. The model feeds the run's idempotency key, so the value decides which content counts as already ingested. A reader looking in the specification will not find the default.
    kind: unstated
    correction: >-
      Give the default extraction model (and the precedence of caller argument, then environment setting, then fallback) a home in the ingestion contract or in a rule beside default-prompt-version.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      intake catch branch, lines 132-153 (pg unavailable branch)
    evidence: >-
      code: "SYSTEM_SERVICE_UNAVAILABLE",
      message: "A backing service is temporarily unavailable.",
    cost: >-
      This is a refusal code that ingest-document answers when the database is unreachable at intake. The contract's ingest-document refusals list only content length, source type, repeated system errors, unknown prompt version and provider failure. Clients branch on the code, and it is written down only in this handler.
    kind: unstated
    correction: >-
      Add the refusal, its cause (a backing service unavailable at intake) and its code to the ingest-document refusals of the ingestion contract.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      intake catch branch, lines 149-152 (any other intake failure)
    evidence: >-
      code: "SYSTEM_INTERNAL_ERROR",
      message: "Failed to persist the document before extraction.",
    cost: >-
      The contract holds SYSTEM_INTERNAL_ERROR for ingest-document only "carrying the failed run", for repeated extraction errors or an unknown prompt version. Here the same code answers a persistence failure before any run exists, carrying no run. The answer for this case exists only in the handler.
    kind: unstated
    correction: >-
      State in the ingest-document refusals what is answered when intake fails before a run exists.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      already_ingested result, lines 177-189, and readRunStatus, lines 91-104
    evidence: >-
      run_status: runStatus ?? null,
      message: completed
        ? "This exact content was already ingested and its extraction completed; returning the existing run. No new extraction was triggered."
        : `This exact content was already ingested, but its run is '${runStatus ?? "unknown"}' (not completed) — the prior extraction did not finish. No new extraction was triggered; recovery requires re-running that LLMRun.`,
    cost: >-
      The contract's already_ingested answer carries the identities, the chunk count and the run's status. The handler adds a `message` field with a recovery instruction. It also lets the status be null when the best-effort read fails (`catch { return undefined; }`). Neither the field nor the null status is held by a node, so a client cannot know from the specification that the status may be absent.
    kind: unstated
    correction: >-
      Either state in the ingest-document answer the message and the case where the run's status cannot be read, or drop them from the handler.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      final catch branch, lines 256-263 (unknown extraction error)
    evidence: >-
      code: "SYSTEM_INTERNAL_ERROR",
      message: "Unexpected error during document ingestion.",
      details: { llm_run_id, raw_information_id },
    cost: >-
      A failure that is neither a provider failure nor an extraction failure is answered with SYSTEM_INTERNAL_ERROR carrying the run and raw information identities, not the failed run. The contract holds SYSTEM_INTERNAL_ERROR only "carrying the failed run", so this answer is decided only in the handler.
    kind: unstated
    correction: >-
      State in the ingest-document refusals what is answered for an unexpected failure during extraction, and what it carries.
    node: contracts/knowledge-base/ingestion
