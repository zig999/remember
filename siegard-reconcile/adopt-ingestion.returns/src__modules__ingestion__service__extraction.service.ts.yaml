findings:
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      the header comment, lines 8-10 ("or 'refusal' — soft skip"), with the branch at lines 661-667 that holds the behavior
    evidence: >-
      // 'end_turn' (or `'refusal'` — soft skip; or `'pause_turn'` — resume once
    cost: >-
      The header states in prose that a refused chunk is skipped. The branch `if (response.stop_reason === "refusal")` holds that, and the node holds it too. A reader can take the comment for a second home for the rule, and nothing checks it when the node moves.
    kind: restates
    correction: >-
      Remove the prose. The behavior and the node stay where they are.
    node: rules/knowledge-base/model-refusal-skips-chunk
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      the header comment, line 21, and the docstring at line 89, beside the pre-check at lines 424-426
    evidence: >-
      //   - run not 'running' at entry           -> RunNotRunnableError (409)
    cost: >-
      The prose restates the "only a running run is extracted" rule and its 409 refusal. `if (run.status !== "running") { throw new RunNotRunnableError(llmRunId, run.status); }` already holds it, and the node holds it as well. The comment is a second home outside behavior.
    kind: restates
    correction: >-
      Remove the header lines and the class docstring that restate the rule.
    node: rules/knowledge-base/extraction-requires-running-run
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      the header comment, line 23, the docstring at line 385, and the comment at lines 716-722, beside `FATAL_ERROR_BURST` and the `startsWith("SYSTEM_")` count
    evidence: >-
      //   - >=3 consecutive 'error' outcomes      -> ExtractionFatalError (500)
    cost: >-
      Three places in prose restate that three system errors in a row within a chunk fail the run. `export const FATAL_ERROR_BURST = 3 as const;` and `if (envelope.error.code.startsWith("SYSTEM_"))` hold it in code, and the node holds it too. If the threshold moves, the comments read as decisions of their own.
    kind: restates
    correction: >-
      Remove the prose. The constant and the branch stay.
    node: rules/knowledge-base/extraction-fails-on-repeated-system-errors
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      the header comment, lines 27-29, and the comment at line 523, beside `closeRunSafe(pool, llmRunId, "failed")` and `closeRunSafe(pool, llmRunId, "completed")`
    evidence: >-
      // All four close the run as `failed` in a fresh short transaction (BR-26
      // step 7) BEFORE the exception is thrown out. Successful completion closes
      // the run as `completed` (BR-26 step 6).
    cost: >-
      The prose restates that an extraction completes its run after the last chunk and fails it when it stops on an error. The `closeRunSafe` calls hold that, and so does the node. The comment cites "BR-26 step 6/7" as though that were where the rule lives.
    kind: restates
    correction: >-
      Remove the prose.
    node: rules/knowledge-base/extraction-closes-its-run
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      the constants at lines 200-201, `ANTHROPIC_REQUEST_TIMEOUT_MS` and `ANTHROPIC_MAX_RETRIES`, applied in `defaultAnthropicFactory`
    evidence: >-
      const ANTHROPIC_REQUEST_TIMEOUT_MS = 5 * 60 * 1000;
      const ANTHROPIC_MAX_RETRIES = 2;
    cost: >-
      These two values decide when a stalled model call counts as the provider failing. That failure is what the contract answers with SYSTEM_LLM_PROVIDER_UNAVAILABLE and a failed run. The contract states the failure but not the five-minute ceiling or the two retries, so the next reader looks for them in the specification and finds only this file.
    kind: unstated
    correction: >-
      Give the contract's provider-failure answer, or a rule beside it, the wait ceiling and the retry count. Or decide that they are operational settings and not domain facts.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      the comment at lines 235-241, in `dispatchToolUse`'s propose_fragment case, beside `chunk_ids: [chunkId]`
    evidence: >-
      // Option (b): the orchestrator is authoritative about which chunk is
      // being processed, so it injects the current `chunk_id` instead of
      // asking the LLM for an opaque uuid it cannot know
    cost: >-
      The prose restates that a fragment an extraction proposes is anchored to the chunk being read, whatever chunks the model names. The spread `...(rawInput as Record<string, unknown>), chunk_ids: [chunkId]` holds that in code, and the node holds it too. The comment is a second home for the rule.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/extraction-anchors-to-read-chunk
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      the default branch of `dispatchToolUse`, lines 282-293
    evidence: >-
      code: "VALIDATION_INVALID_FORMAT",
      message: `Unknown tool '${toolName}'.`,
      details: { tool_name: toolName },
    cost: >-
      A tool call from the model that names none of the four proposals gets a VALIDATION_INVALID_FORMAT refusal. It counts as a business refusal, so it resets the fatal-burst counter and never counts toward it. No node states what an extraction does with a tool name outside the four proposals. The behavior lives only in this branch.
    kind: unstated
    correction: >-
      State in the constraint, or in a rule beside it, what an extraction does with a tool call outside the four proposals, and whether that call counts toward the repeated-error burst.
    node: constraints/extraction-acts-only-through-proposals
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      the docstring at line 388 and the slice at lines 492-494, beside `PREV_TAIL_CHARS`
    evidence: >-
      /** `prev_tail` window — last N characters of the previous chunk's text. */
    cost: >-
      The prose restates that the model is shown the tail of the previous chunk. `PREV_TAIL_CHARS = 200` and `chunk.text.slice(-PREV_TAIL_CHARS)` hold that in code, and the node holds it as well.
    kind: restates
    correction: >-
      Remove the docstring.
    node: rules/knowledge-base/extraction-reads-chunks-in-order
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      `MAX_TURNS_PER_CHUNK` inside `runChunkLoop`, lines 625-627 and 749-755
    evidence: >-
      const MAX_TURNS_PER_CHUNK = 64;
      ...
      "extraction_chunk_turn_cap_reached"
      );
      return { kind: "completed" };
    cost: >-
      After 64 turns on one chunk the extraction stops asking about it, counts it as read, logs a warning and moves on without failing the run. That is a decision about when a chunk is deemed read, with a threshold, and no node states it. A chunk can be left partly extracted with the run still completing, and the specification says nothing of it.
    kind: unstated
    correction: >-
      State in a rule beside the run-closing rule when a chunk counts as read. Cover a turn ceiling if one is intended, and give its value.
    node: rules/knowledge-base/extraction-closes-its-run
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      the branch at lines 681-686 of `runChunkLoop`
    evidence: >-
      if (toolUseBlocks.length === 0) {
      ...
      return { kind: "completed" };
    cost: >-
      A model turn that ends with neither a stop signal nor any proposal is taken as the chunk being read, and the run goes on. No node states this. It is the case where a chunk yields nothing, and the code alone decides that it is not a failure.
    kind: unstated
    correction: >-
      State in a rule beside the run-closing rule that a chunk which yields no proposals counts as read.
    node: rules/knowledge-base/extraction-closes-its-run
