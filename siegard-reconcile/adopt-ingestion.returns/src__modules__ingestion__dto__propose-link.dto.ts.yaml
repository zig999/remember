findings:
  - file: src/modules/ingestion/dto/propose-link.dto.ts
    where: >-
      The docstring above ValidFromBasisSchema, lines 5-15, the part saying `received` MUST NOT appear in this input enum.
    evidence: >-
      "Only `stated` and `document` are accepted at the API boundary. The third value, `received`, is a backend-only fallback ... it is never sent by an LLM or any external caller, so it MUST NOT appear in this input enum."
    cost: >-
      The refusal of the basis `received` is written in prose and also held by the enum on line 16, `z.enum(["stated", "document"])`. A reader who edits one can leave the other stale, and the node is the place they should look for it.
    kind: restates
    correction: >-
      Remove the docstring's restatement. The enum on line 16 holds the fact, and the node's binding to this file claims it.
    node: rules/knowledge-base/caller-never-states-received
  - file: src/modules/ingestion/dto/propose-link.dto.ts
    where: >-
      The same docstring, lines 5-15, the part describing the temporal validator's fallback to `received`.
    evidence: >-
      "The third value, `received`, is a backend-only fallback that the temporal validator applies internally when neither `stated` nor `document` can justify the date"
    cost: >-
      The prose describes the fallback chain, but nothing in this file runs it. The behavior sits in src/modules/ingestion/validation/temporal.ts (`valid_from_basis: "received"`). A second description of the chain can drift from the node and from that code without anyone noticing.
    kind: restates
    correction: >-
      Remove the sentence. The fallback is held by rules/knowledge-base/required-start-fallback and implemented in src/modules/ingestion/validation/temporal.ts.
    node: rules/knowledge-base/required-start-fallback
  - file: src/modules/ingestion/dto/propose-link.dto.ts
    where: >-
      The `fragment_ids` field of ProposeLinkInputSchema, lines 54-59.
    evidence: >-
      fragment_ids: z
          .array(z.string().uuid())
          .min(1)
          .describe(
            "Evidence: id(s) of propose_fragment claims from this chunk that state the relation. At least one required."
    cost: >-
      The refusal of a link proposal that cites no fragment is a domain rule, and only this schema states it. The specification says a proposal "cites the information fragments it rests on" with cardinality 0..*, and its cited-fragments rules cover only fragments that exist and belong to the run. The next reader looks in the specification for the minimum of one and does not find it.
    kind: unstated
    correction: >-
      Analysis should give the minimum of one cited fragment per link proposal a node, or state it on domain/knowledge-base/proposal.
    node: domain/knowledge-base/proposal
  - file: src/modules/ingestion/dto/propose-link.dto.ts
    where: >-
      The `valid_to` field's description, lines 63-65.
    evidence: >-
      "Date the relation STOPS holding (YYYY-MM-DD), if stated. Intervals are half-open [from, to)."
    cost: >-
      This text is sent to the model as the tool description. It states half-open validity intervals for proposals, and no node in the set holds that. The nearest node, validity-start-before-end, says only that the start is strictly before the end. Half-open is stated for link type rules and chunk offsets, not for assertion validity. The convention therefore lives only in what the model is told.
    kind: unstated
    correction: >-
      Analysis should decide whether an assertion's validity interval is half-open and put that in a node, for example on rules/knowledge-base/validity-start-before-end.
    node: rules/knowledge-base/validity-start-before-end
  - file: src/modules/ingestion/dto/propose-link.dto.ts
    where: >-
      The `change_hint` field's default, line 69.
    evidence: >-
      change_hint: ChangeHintSchema.default("none").describe(
    cost: >-
      A link proposal that omits its change hint is treated as change hint none. That decides re-affirmation, because reaffirmation-consolidates needs "change hint is none". The specification states the default only for directed ingestion (directed-defaults), so for a proposal from an extraction the default lives only in this schema.
    kind: unstated
    correction: >-
      Analysis should state on domain/knowledge-base/change-hint, or in a rule, that a proposal naming no change hint has change hint none.
    node: domain/knowledge-base/change-hint
