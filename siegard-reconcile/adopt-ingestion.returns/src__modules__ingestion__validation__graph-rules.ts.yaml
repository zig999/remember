findings:
  - file: src/modules/ingestion/validation/graph-rules.ts
    where: >-
      The header comment, lines 3-5 and 7-8, above the imports.
    evidence: >-
      "// Look up an active `link_type_rule` matching the `(source_node_type,
      link_type, target_node_type)` triple." and "// authoritative set. Any other triple yields
      `BUSINESS_LINK_RULE_VIOLATION`."
    cost: >-
      The permitting-rule requirement and its refusal code are also written out as prose next to
      the code that holds them. When the node moves, this prose stays behind and reads as a second
      statement of the rule that nothing checks.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by the branch in `validateGraphRule` and by
      `isLinkRuleActive` in `src/modules/ingestion/catalog/catalog.ts`, so the pair still conforms
      and only the prose is owed a removal.
    node: rules/knowledge-base/link-permitted-by-type-rule
  - file: src/modules/ingestion/validation/graph-rules.ts
    where: >-
      Header comment, lines 3-5.
    evidence: >-
      "// link_type, target_node_type) triple. The 22 seed rules of §15.2 are the v1
      // authoritative set."
    cost: >-
      The comment states the size and authority of the seeded link-type-rule catalog, and no node
      holds that. A reader trusting it will take 22 as the decided rule set. CLAUDE.md, in its
      description of `migrations/seeds/0001_seed.sql`, gives 28 rules, so the number may already be
      stale.
    kind: unstated
    correction: >-
      Either give the catalog's rule set a node, or drop the number from the source.
