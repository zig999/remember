findings:
  - file: src/modules/ingestion/mcp/directed-ingest.handler.ts
    where: >-
      the header comment block, lines 1-30
    evidence: >-
      "the deterministic, NO-LLM sibling of `ingest_document`" and "the audit `tool_call` rows live INSIDE the dispatched `propose_*` calls the service makes (one per dispatched item) — this handler writes none of its own."
    cost: >-
      This is prose no running system emits. It says that a directed ingestion calls no language model and that each dispatched item is audited, and both facts are held by nodes. A second reader-facing home for them sits in a file that does not enforce them, so it can drift from the nodes without any check reaching it.
    kind: restates
    correction: >-
      Remove the prose. The code holds the fact in `src/modules/ingestion/service/directed-ingestion.service.ts`, which declares `DIRECTED_MODEL = "directed"` and `DIRECTED_PROMPT_VERSION = "directed-v1"`. The bind to the node is the link between them.
    node: rules/knowledge-base/directed-ingestion-run
  - file: src/modules/ingestion/mcp/directed-ingest.handler.ts
    where: >-
      the `IngestDirectedInvocationContext` docblock (lines 85-105) and the comment at lines 174-176
    evidence: >-
      "The chat agent dispatch supplies `source_excerpt` (the operator's verbatim turn) here so the orchestrator can persist it as `original_input` on the `RawInformation` row."
    cost: >-
      The rule that a chat turn's excerpt is recorded as the raw information's original input is restated in prose here. It is held by a node and by the code that persists it. A reader can take this comment for the place the rule lives.
    kind: restates
    correction: >-
      Remove the prose. The code that records it is `original_input: deps.sourceExcerpt ?? null` in `src/modules/ingestion/service/directed-ingestion.service.ts` (line 366).
    node: rules/knowledge-base/directed-turn-is-original-input
  - file: src/modules/ingestion/mcp/directed-ingest.handler.ts
    where: >-
      the `metadataPointer` spread, lines 184-193
    evidence: >-
      ...(invocationContext?.pointer !== undefined &&
      typeof invocationContext.pointer.conversation_id === "string" &&
      typeof invocationContext.pointer.message_id === "string"
        ? { metadataPointer: { conversation_id: invocationContext.pointer.conversation_id, message_id: invocationContext.pointer.message_id } }
        : {}),
    cost: >-
      No node says that a directed ingestion from a chat turn records a conversation and message pointer in its raw information's metadata. No node says that a pointer with only one of the two ids is silently dropped. The handler applies the drop and the service merges the ids into metadata (`intakeMetadata.conversation_id = deps.metadataPointer.conversation_id`). The next reader will look for this in the specification, find nothing, and read the code as the decision.
    kind: unstated
    correction: >-
      The analysis should give the chat-turn pointer and its all-or-nothing rule a node. The natural place is beside the rule for the turn's excerpt or in the raw information's metadata.
    node: rules/knowledge-base/directed-turn-is-original-input
  - file: src/modules/ingestion/mcp/directed-ingest.handler.ts
    where: >-
      the catch branch of the delegation, lines 211-226
    evidence: >-
      return { ok: false, error: { code: "SYSTEM_INTERNAL_ERROR", message: "Unexpected error during directed ingestion." } };
    cost: >-
      The ingest-directed operation lists only validation refusals. The handler emits a system-error refusal, with a fixed code and message, for any unexpected throw. That is what the owner is told when the orchestrator fails, and the specification never states it.
    kind: unstated
    correction: >-
      The contract's ingest-directed operation should state the refusal for an unexpected failure, with its error code. The message text is emitted, so the node should decide it.
    node: contracts/knowledge-base/ingestion
