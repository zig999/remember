    cost: >-
      The order and conditions of re-affirmation, succession, dispute and new assertion are written as prose beside the branches that implement them. When the node moves, this comment keeps saying the old rule, and a reader will take it for the current one.
    kind: restates
    correction: >-
      Remove the prose. The precedence is held by the branch order in consolidateLinkOnce and consolidateAttributeOnce, and by the node.
    node: rules/knowledge-base/consolidation-precedence
