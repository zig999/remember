      * own `valid_from` is on/after `closeDate` (a same-effective-date succession),
    cost: >-
      The rule that a succession on or before the old start supersedes without a validity end is restated in a long docstring that also cites an acceptance scenario and an amendment. Two homes of the rule can diverge silently.
    kind: restates
    correction: >-
      Remove the docstring. The two CASE expressions in the UPDATE hold the fact, and the amendment rationale belongs in the decision log.
    node: rules/knowledge-base/succession-before-previous-start
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateLink, the attempt loop and the final throw, lines 443-474, and its mirror in consolidateAttribute, lines 710-736
    evidence: >-
      // Two attempts max (BR-27 / task contract).
      for (let attempt = 1; attempt <= 2; attempt += 1) {
      ...
      if (attempt === 2) {
        throw new ValidationFailure(
          "SYSTEM_INTERNAL_ERROR",
          "graph consolidation: dup-guard constraint hit on retry; a concurrent transaction committed a conflicting row.",
    cost: >-
      The code retries a racing consolidation once and then answers a proposal with SYSTEM_INTERNAL_ERROR. The specification's ingestion contract lists no such refusal for propose-link or propose-attribute, and no node holds the retry count. The behavior lives only here, so anyone reading the contract will not find it. The count and the second-failure answer are the code's own decision.
    kind: unstated
    correction: >-
      Give the concurrent-write retry and its second-failure answer a home in the ingestion contract's refusals for propose-link and propose-attribute, or in a rule.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateLinkOnce, the `reaffirmation` condition, lines 549-552
    evidence: >-
      const reaffirmation =
        sameTarget &&
        args.change_hint === "none" &&
        (!functional || sameValidFrom);
      ---
      node: "when its change hint is not correction and, for a type that does not allow multiple current assertions, its change hint is none and it states the same validity start."
    cost: >-
      For a link type that allows multiple current links, a proposal with change hint succession and the same target is re-affirmation under the node. The code does not re-affirm it. It skips the correction and succession branches, falls through to (e), and inserts a second current row. The dup-guard then fails, and after the retry the proposal is answered with SYSTEM_INTERNAL_ERROR instead of consolidating. The comment at lines 619-627 describes this as intended.
    kind: contradicts
    correction: >-
      For multi-current types the re-affirmation test should require only the same target and a change hint other than correction. The `none` requirement and the validity-start equality apply only to functional types.
    node: rules/knowledge-base/reaffirmation-consolidates
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateLinkOnce correction branch, lines 578-582, and consolidateAttributeOnce correction branch, lines 800-804
    evidence: >-
      return {
        outcome: "accepted",
        link_id: newRow.id,
        superseded_link_id: vigent.id,
      };
    cost: >-
      The code reports a correction to the caller as outcome `accepted`, while recording a superseded predecessor. No node says what outcome a correction carries. The contract lists accepted, consolidated, superseded_previous and disputed, and shows the superseded identity only with superseded_previous. The label is the code's own decision, justified only by a comment citing BR-25.
    kind: unstated
    correction: >-
      Say in correction-replaces, or in the ingestion contract's propose-link and propose-attribute answers, which outcome a correction reports and whether it carries the superseded identity.
    node: rules/knowledge-base/correction-replaces
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateAttributeOnce re-affirmation condition, lines 777-781, and the closing comment, lines 852-854
    evidence: >-
      if (
        sameValue &&
        sameValidFrom &&
        args.change_hint === "none"
      ) {
      ...
      // Multi-valued vigent row with same value would have been caught by
      // re-affirmation; fall through to accepted-new (different valid_from
      // on a multi-valued attribute is coexistence).
    cost: >-
      For an attribute key that allows multiple current values, a proposal with the same value is re-affirmation under the node. The node requires no equal validity start and no change hint of none, only that the hint is not correction. The code inserts a new row instead of adding provenance, which breaks "re-affirmation consolidates, never duplicates". The comment calls this coexistence, while the node holds one current attribute per value.
    kind: contradicts
    correction: >-
      Apply the `none` hint and equal-validity-start conditions to functional keys only. For multi-current keys, re-affirm on the same value unless the hint is correction.
    node: rules/knowledge-base/reaffirmation-consolidates
