findings:
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      header comment, lines 9-11 ("The catalog covers BR-14 ... and BR-15 ...")
    evidence: >-
      // The catalog covers BR-14 (`BUSINESS_UNKNOWN_{NODE_TYPE|LINK_TYPE|ATTRIBUTE_KEY}`
      // on the respective miss) and BR-15 (`BUSINESS_LINK_RULE_VIOLATION` via
      // `LinkTypeRule`).
    cost: >-
      The prose says which refusal code answers a link no rule permits. That fact belongs to the ingestion contract's propose-link refusal. The code that raises it is not in this file. A reader who edits the comment, or reads it as the place the refusal is decided, has a second statement of a contract fact to keep in step.
    kind: restates
    correction: >-
      Remove the comment. The refusal is raised in src/modules/ingestion/validation/graph-rules.ts, which calls `isLinkRuleActive`. The node holds the rule.
    node: rules/knowledge-base/link-permitted-by-type-rule
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      header comment, lines 13-21 (closed and open value domains), repeated in the `attributeValidValuesByKeyId` doc comment, lines 96-112
    evidence: >-
      // zero rows = open domain (backward-compatible legacy behavior; any literal
      // that parses against `value_type` is accepted). A key with >= 1 rows =
      // closed domain — only the listed values are accepted by the structural
      // validator.
    cost: >-
      The prose states when a value must be one of the allowed values. The code that applies the check is `domainOf` here plus the caller in src/modules/ingestion/service/propose-attribute.service.ts. A reader who wants the rule finds it re-told here, and the copy can drift from the node.
    kind: restates
    correction: >-
      Remove the comment prose. The rule is held by the node, and the enforcing code is in propose-attribute.service.ts (`domainOf(deps.catalog, resolvedKey.id)`).
    node: rules/knowledge-base/attribute-value-in-allowed-values
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      `LinkTypeRuleRow` doc comment, lines 47-51
    evidence: >-
      the temporal filter (`valid_to IS NULL OR valid_to > current_date`) is applied at
      * lookup time so a rule that expires between reloads is honoured.
    cost: >-
      The comment gives the in-effect condition as a `valid_to`-only filter on `current_date`. The code applies both bounds through `stripTime`, on UTC dates. The comment is a second, partial account of a rule the node states. When the two differ, a reader cannot tell which was decided.
    kind: restates
    correction: >-
      Remove the comment. `isLinkRuleActive` in this file holds the condition (`today.getTime() < from.getTime()` and `today.getTime() >= to.getTime()`).
    node: rules/knowledge-base/link-type-rule-in-effect
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      `domainOf` docstring, lines 227-249
    evidence: >-
      everything else fails with
      * `VALIDATION_INVALID_FORMAT` carrying `{ value, allowed_values }`.
    cost: >-
      The docstring is prose no running system emits, and it states the refusal code and payload for a value outside the allowed set. The contract holds that answer, and the code that emits it is in another file. The docstring is a second home for a contract fact that neither `--check` nor the node reaches.
    kind: restates
    correction: >-
      Remove the docstring. The contract's propose-attribute refusals hold the answer, and propose-attribute.service.ts emits it.
    node: rules/knowledge-base/attribute-value-in-allowed-values
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      `isLinkRuleActive` docstring, lines 265-270
    evidence: >-
      validity window includes today (semi-open `[valid_from, valid_to)`; nulls
      * mean unbounded — §5.1).
    cost: >-
      The prose restates the in-effect interval that the code in the same function already holds. It also cites a section of a superseded document as its authority. The specification is where a reader should find the interval.
    kind: restates
    correction: >-
      Remove the docstring. The interval is held by the function body and by the node.
    node: rules/knowledge-base/link-type-rule-in-effect
