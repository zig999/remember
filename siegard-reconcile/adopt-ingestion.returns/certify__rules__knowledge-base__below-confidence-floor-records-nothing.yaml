certified:
  - node: rules/knowledge-base/below-confidence-floor-records-nothing
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/propose-service-layer.spec.ts
        name: proposeLinkService returns ok:true with outcome=rejected when confidence < 0.40 (BELOW_CONFIDENCE_FLOOR)
    why: >-
      The link half is exercised at only one point. A link proposal at confidence 0.1 is
      checked to come back with outcome rejected, reason BELOW_CONFIDENCE_FLOOR and link_id
      null, and the stub client is checked to receive no statement starting "INSERT INTO
      knowledge_link". The attribute half is not exercised at all. The file imports and calls
      no proposeAttributeService, and the only attribute assertion in the set checks that a
      JSON Schema for ProposeAttributeInput is an object. So nothing shows that an attribute
      proposal below 0.40 records no node attribute. The floor is also exercised only far
      below 0.40. If the floor dropped to, say, 0.2, a link at 0.35 would be recorded while
      the 0.1 test still passed, so the "below 0.40" boundary itself is unexercised. The
      "no link" check reads a counter keyed on the INSERT statement's opening text in a
      hand-written stub client. A write that started differently would get past that counter.
      The link_id-null and outcome assertions are what bind the link half apart from that
      counter.
    remainder: testable
    remainder_why: >-
      Three assertions would close it. First, an attribute proposal at a confidence just under
      0.40 (e.g. 0.39) comes back rejected and records no node attribute. Second, a link
      proposal at 0.39 comes back rejected and records no knowledge link. Third, the same
      proposals at exactly 0.40 are not rejected with BELOW_CONFIDENCE_FLOOR, which pins the
      floor at 0.40 for both links and attributes.
