findings:
  - file: src/modules/ingestion/dto/propose-node.dto.ts
    where: >-
      the describe() text on node_type, lines 14-16
    evidence: >-
      "The entity's type — must be one of the catalog NodeTypes (e.g. Person, Project, Document)."
    cost: >-
      The model-facing text states that Person, Project and Document are node types the catalog holds. No node in the specification names any catalog node type. A reader who looks in the specification for the catalog's kinds of entity finds none, and the names live only in this tool description and the seed data.
    kind: unstated
    correction: >-
      Give the catalog's node-type membership a node, or state that the catalog's contents are seed data outside the specification. The emitted description is not the thing to edit.
    node: domain/knowledge-base/node-type
  - file: src/modules/ingestion/dto/propose-node.dto.ts
    where: >-
      the describe() text on aliases, lines 27-29
    evidence: >-
      "Optional alternative names or spellings for the same entity; attached without duplicating."
    cost: >-
      The model-facing text promises that an alias the node already holds is not attached a second time. The alias rules say only that a created node holds each proposed alias and that a matched node adds each proposed alias. Nothing states the no-duplicate behavior, so it is a business rule that appears only in a tool description.
    kind: unstated
    correction: >-
      State in the alias rules what happens when a proposed alias is already one of the node's aliases. The emitted description is not the thing to edit.
    node: rules/knowledge-base/matched-node-gains-only-aliases
