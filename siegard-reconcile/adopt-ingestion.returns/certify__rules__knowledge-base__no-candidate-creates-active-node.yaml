certified:
  - node: rules/knowledge-base/no-candidate-creates-active-node
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
        name: "branch 4: novel (no candidate at or above floor) -> created_new with status='active'"
      - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
        name: "branch 4: novel with empty candidate set -> created_new (status='active')"
      - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
        name: returns novel when no candidate is above the floor (including the empty set)
      - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
        name: created_new resolution propagates as ok:true with resolution='created_new'
    why: >-
      Two cases are covered. A proposal with no candidates, and one whose only candidate is at
      0.3 (0.4 in the pure decideFromCandidates test), each gives created_new. The first case
      also gives an inserted knowledge node recorded as 'active'.

      Four parts of the fact go unexercised. First, the 0.55 threshold itself. No test offers a
      candidate at or just below 0.55. A floor checked with a strict comparison, or moved
      anywhere between 0.4 and 0.6, would still pass every test. The test "exports MATCH_STRONG
      = 0.85 and MATCH_FLOOR = 0.55" only checks a constant against a literal, so it does not
      tie the threshold to what a proposal resolves to.

      Second, "active" and "of its node type" are never tested. The stubbed client returns the
      configured candidate rows whatever the query's filters or parameters say. Nothing shows
      that a node of another type, or one that is not active (merged, needs_review, deleted),
      fails to block creation when it matches at or above 0.55. That covers both exact-alias
      and trigram matches.

      Third, the 'active' status is weakly held. The stub reads the status from a literal in
      the INSERT text and falls back to 'active' when that literal is absent. So the
      status='active' assertions are partly met by the stub's own default, not by what the code
      writes.

      Fourth, the proposeNodeService delegation test checks only the created_new resolution. It
      checks no status.
    remainder: testable
    remainder_why: >-
      Each gap is one input against one result, and all of them need a store that applies the
      candidate filters.

      For the threshold, two assertions:
      - a proposal whose best same-type active candidate is at 0.549 resolves created_new, with
        an active node persisted;
      - the same proposal with a candidate at exactly 0.55 does not resolve created_new.

      For "active" and "of its node type": a proposal whose only candidate at or above 0.55 is a
      non-active node, or a node of a different type, still resolves created_new with an active
      node persisted.

      For the status: the persisted node's status is read back from the store, not from the
      SQL text.
