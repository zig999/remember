findings:
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      header comment, lines 6-15 (the five-layer list)
    evidence: >-
      // Layered validation (BR-13) in the documented order. Each layer is a
      // sequential `await`, so layer N+1 only runs when layer N has not thrown:
      //   1. Structural    — cross-table refs (nodes exist, fragments exist,
      //                      link_type known).
      //   2. Graph rules   — active link_type_rule for the triple (BR-15).
    cost: >-
      The order in which a link proposal's checks run is written twice, once in the node and once in this
      comment. If the node's order changes, the comment keeps describing the old one, and a reader trusts
      whichever they open first. The comment even lists "link_type known" last within layer 1, while the
      node lists it first.
    kind: restates
    correction: >-
      Remove the comment. The order is held by the sequence of statements in proposeLinkService (link type,
      nodes, fragments, graph rule, temporal, confidence, anchoring), and the node holds it in prose.
    node: rules/knowledge-base/link-proposal-check-order
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      header comment, lines 13 and 17-19 (the 0.40 floor)
    evidence: >-
      //   4. Confidence    — < 0.40 -> ok:true outcome=rejected (BELOW_CONFIDENCE_FLOOR).
      // On confidence < 0.40 the service returns `{ ok: true, result: { outcome:
      // 'rejected', reason: 'BELOW_CONFIDENCE_FLOOR' } }`.
    cost: >-
      The 0.40 floor is stated in prose here, while the running value is CONFIDENCE_FLOOR in
      validation/confidence.ts. If the number moves, this comment keeps naming the old one.
    kind: restates
    correction: >-
      Remove the comment. The fact is held in code by `CONFIDENCE_FLOOR = 0.4` in
      src/modules/ingestion/validation/confidence.ts, and here by the `below_floor` branch that returns
      before `consolidateLink`.
    node: rules/knowledge-base/below-confidence-floor-records-nothing
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      header comment, lines 21-28 (what the consolidator decides)
    evidence: >-
      // the consolidator locks the
      // vigent row(s) under FOR UPDATE and decides between consolidated /
      // superseded_previous / correction (outcome=accepted) / disputed / accepted
      // (new).
    cost: >-
      The set of ways a link proposal is taken is restated outside the node. The decision lives in
      graph-consolidation.service.ts, so this list can drift from both the code and the node without any
      check noticing.
    kind: restates
    correction: >-
      Remove the comment. The decision is held by `consolidateLink` in
      src/modules/ingestion/service/graph-consolidation.service.ts.
    node: rules/knowledge-base/consolidation-precedence
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      Layer 3 comment, lines 139-142, and the comment at lines 206-208
    evidence: >-
      // `received_at` is the LAST link of the date-justification chain (v7 §6.5 / §13c / A14)
      // and is consumed by `validateTemporal` as the fallback for
      // `requires_valid_from = true` rows that carry no stated/document date.
    cost: >-
      The received-date fallback is written as prose in this file, while its running form is in
      validation/temporal.ts. A reader looking for where a missing validity start is filled in finds the
      claim here and not the rule.
    kind: restates
    correction: >-
      Remove both comments. The fallback is held in code by `validateTemporal` in
      src/modules/ingestion/validation/temporal.ts (the `received` branch that returns
      `valid_from_basis: "received"`).
    node: rules/knowledge-base/required-start-fallback
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      result mapping, lines 221-232
    evidence: >-
      // Map consolidator outcome to the public DTO. `superseded_link_id` only
      // surfaces for `superseded_previous` and `accepted` (correction branch);
      // ...
      consolidation.superseded_link_id !== undefined
            ? { ...baseResult, superseded_link_id: consolidation.superseded_link_id }
    cost: >-
      The link answer carries the superseded link's identity for a correction that is taken as `accepted`.
      The contract names that identity only for `superseded_previous`. The behaviour is set by this
      pass-through together with graph-consolidation.service.ts, which returns `superseded_link_id` on
      `outcome: "accepted"`. No node holds it, so a client and the specification disagree about what an
      accepted answer contains.
    kind: unstated
    correction: >-
      Decide whether an accepted correction answers with the superseded link's identity. If it does, the
      propose-link answer in the ingestion contract should say so. If it does not, the pass-through has to
      stop returning it for `accepted`.
    node: contracts/knowledge-base/ingestion
