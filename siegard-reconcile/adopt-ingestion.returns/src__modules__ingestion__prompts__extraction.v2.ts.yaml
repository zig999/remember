findings:
  - file: src/modules/ingestion/prompts/extraction.v2.ts
    where: >-
      EVENT_DATING_DIRECTIVE, lines 40-44, the first bullet
    evidence: >-
      "- When you create an `Event` (meeting, go-live, workshop…), ALWAYS propose its",
      "  `event_date` when the document states the date of the occurrence (and",
      "  `end_date` when there is a distinct end). Justify it with `valid_from_basis`;",
    cost: >-
      The prompt names an Event node type and its event_date and end_date attribute
      keys. Nothing in the specification holds those catalog entries. The comment
      points at "§15.3" and the seeds instead. The next reader who asks which
      attribute keys an Event carries looks in the specification, finds only the
      generic attribute-key shape, and does not find the answer.
    kind: unstated
    correction: >-
      Analysis would have to give the catalog's Event node type and its event_date
      and end_date attribute keys a node, including that the keys are dates and are
      temporal.
  - file: src/modules/ingestion/prompts/extraction.v2.ts
    where: >-
      EVENT_DATING_DIRECTIVE, lines 41-49, the "always date the occurrence" instruction and the value versus valid_from distinction
    evidence: >-
      "- When you create an `Event` (meeting, go-live, workshop…), ALWAYS propose its",
      "- CRUCIAL distinction: `event_date` is the VALUE — the date the event happens.",
      "  `valid_from` is when that date started to hold / became known (typically the",
      "  document date).
    cost: >-
      The prompt makes it an extraction obligation to date every Event the document
      dates, and it defines valid_from for an event date as "when that date started
      to hold / became known (typically the document date)". No node holds either
      rule. What the model is told to propose for an Event therefore lives only in
      the prompt text, where a reader of the specification will not look.
    kind: unstated
    correction: >-
      Analysis would have to state the obligation and the meaning of valid_from for
      dated Event attributes in a node. The prompt v2 delta can then be traced to it.
