findings:
  - file: src/modules/ingestion/hash.ts
    where: >-
      the file header comment (lines 1-6) and the docstring above sha256Hex (lines 10-15)
    evidence: >-
      "BR-01 (`content_hash`) and BR-08 (`idempotency_key`) of `ingestion.back.md`. Both produce a 64-char lowercase hex string. UTF-8 encoding is explicit on every `.update()`" and "`sha256(content)` -- 64 char lowercase hex string. Used as `raw_information.content_hash` (BR-01); the DB CHECK constraint on the column enforces the same regex."
    cost: >-
      The hash format (SHA-256, UTF-8, 64 lowercase hex characters) is written in prose in three homes: the node, this comment, and the back-spec it cites. `--check` reaches none of the prose. If the node moves, the comment keeps asserting the old format and nothing flags it.
    kind: restates
    correction: >-
      Remove the prose. `sha256Hex` in this file holds the fact, and `migrations/0001_init.sql` line 235 holds it as well: `CHECK (content_hash ~ '^[0-9a-f]{64}$')`. Removal goes through the comment route, then `/reconcile` over the file.
    node: rules/knowledge-base/content-hash-is-sha256
  - file: src/modules/ingestion/hash.ts
    where: >-
      the docstring above composeIdempotencyKey (lines 20-27)
    evidence: >-
      "`idempotency_key = sha256(content_hash ∥ prompt_version ∥ model ∥ chunking_version)`, concatenated WITHOUT a separator. The order is exactly as defined in §8 of v7 and as documented in `ingestion.back.md` BR-08."
    cost: >-
      The composition order and the no-separator rule appear again in prose that no running system emits. A future change to the node would leave this comment describing a key the code no longer builds, and nobody would be told.
    kind: restates
    correction: >-
      Remove the docstring's restatement. The four `h.update(...)` calls in `composeIdempotencyKey` hold the order and the absence of a separator.
    node: rules/knowledge-base/idempotency-key
  - file: src/modules/ingestion/hash.ts
    where: >-
      the last sentence of the composeIdempotencyKey docstring (line 26-27)
    evidence: >-
      "Bumping any operand yields a different key and forces a new `llm_run` row on the same source."
    cost: >-
      The uniqueness of the idempotency key, which is why a new operand yields a new run, is stated as prose here. The code that holds it is not in this file, so a reader could take this comment for the place the rule lives.
    kind: restates
    correction: >-
      Remove the sentence. Uniqueness is held by `idempotency_key text NOT NULL UNIQUE` in `migrations/0001_init.sql` line 277.
    node: rules/knowledge-base/idempotency-key-unique
