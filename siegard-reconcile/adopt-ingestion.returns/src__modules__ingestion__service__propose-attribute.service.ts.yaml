findings:
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      header comment, lines 7-8 ("Structural layer additionally parses the literal `value`")
    evidence: >-
      //   - Structural layer additionally parses the literal `value` against
      //     `attribute_key.value_type` (BR-14, structural cross-table check).
    cost: >-
      The value-parsing rule is stated in prose here and held by code in another file. A reader of this file takes the comment for the rule and does not look in the specification node. When the node changes, this comment is not bound to it and goes stale without notice.
    kind: restates
    correction: >-
      Remove the comment. Code holds the fact in src/modules/ingestion/validation/structural.ts (parseAttributeValue, called at line 83 of this file), which throws VALIDATION_INVALID_FORMAT for a value that does not parse as its key's value type.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      header comment lines 9-11, and the comment on the guard at lines 71-73
    evidence: >-
      //   - There is no link_type_rule lookup — the attribute_key catalog itself
      //     scopes the `node_type` (UNIQUE(node_type_id, key)). The "graph rules"
      //     layer for attributes is "key.node_type_id == node.node_type_id".
      and
      // Cross-table check: key.node_type_id matches node.node_type_id. The
      // catalog lookup already enforces this; if a future version relaxes the
    cost: >-
      The rule that an attribute key must belong to its node's type is restated as prose beside the lookup that enforces it. The next reader takes the comment for the rule and does not open the node. The comment can then drift from the node without anything failing.
    kind: restates
    correction: >-
      Remove both comments. Code in this file holds the fact at the `attributeKeyByNodeTypeAndKey.get(attributeKeyCacheKey(nodeTypeId!, args.key))` lookup and the `assertKnownType` call that follows it.
    node: rules/knowledge-base/attribute-key-for-node-type
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      the layer headings at lines 52, 126, 130, 158 and 169, and the ordering comment at lines 85-87
    evidence: >-
      // ---- Layer 1: Structural ----
      ... // ---- Layer 3: Temporal ---- ... // ---- Layer 4: Confidence ---- ... // ---- Layer 5: Anti-hallucination ----
      and
      // Closed-domain gate (BR-30). Runs IMMEDIATELY after parseAttributeValue
      // and BEFORE any subsequent layer (graph rules / temporal / confidence /
      // anti-hallucination).
    cost: >-
      The order in which an attribute proposal is checked is written down a second time as comments. Code in this file already fixes that order by the sequence of its statements. The comments give a competing account under layer numbers no node uses, so a reader looking for the order finds it in the wrong place.
    kind: restates
    correction: >-
      Remove the headings and the ordering sentence. The statements themselves hold the order: node lookup, key lookup, value parse, allowed values, fragment existence and ownership, dates, confidence, anchoring.
    node: rules/knowledge-base/attribute-proposal-check-order
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      the closed-domain comment block, lines 85-92
    evidence: >-
      // Exact match (no normalisation) per spec §1 / BR-30 v1 semantics.
    cost: >-
      The "exactly as written" rule for allowed values is restated as prose, and it cites a BR number instead of the node that holds the rule. Code holds the rule, so the comment is a second home for it.
    kind: restates
    correction: >-
      Remove the comment. Code holds the fact in src/modules/ingestion/validation/structural.ts (`if (domain.has(value)) { return; }` in assertValueInDomain), reached through the `if (domain !== null) { assertValueInDomain(args.value, domain); }` gate in this file.
    node: rules/knowledge-base/attribute-value-in-allowed-values
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      comments at lines 130-134 and 196-198 on the received fallback
    evidence: >-
      // is the LAST link of the date-justification chain (v7 §6.5 / §13c / A14)
      // and is consumed by `validateTemporal` as the fallback for
      // `requires_valid_from = true` rows that carry no stated/document date.
    cost: >-
      The start-date fallback is described in comments that cite v7 section and ADR numbers instead of the node. Code holds the fallback in another file, so a reader of this file sees a second account of a rule the node owns.
    kind: restates
    correction: >-
      Remove both comments. Code holds the received leg in src/modules/ingestion/validation/temporal.ts (`const receivedDate = toIsoDate(input.received_at); ... valid_from_basis: "received"`). This file only supplies `document_date` and `received_at` and forwards `resolvedTemporal.valid_from` and `resolvedTemporal.valid_from_basis`.
    node: rules/knowledge-base/required-start-fallback
