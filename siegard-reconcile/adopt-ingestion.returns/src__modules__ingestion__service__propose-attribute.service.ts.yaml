looked_past: >-
  Outside this file's judgment: validation/structural.ts validates a date with `Date.parse(`${v}T00:00:00Z`)`, which V8 probably accepts for 2024-02-30, against the impossible-calendar-date-refused scenario. validation/temporal.ts returns null start and basis when the source has a document date, where required-start-fallback says to take the document date with basis document. The defensive guard at lines 74-80 (`resolvedKey.node_type_id !== nodeTypeId`) answers with VALIDATION_INVALID_FORMAT where the node's code is BUSINESS_UNKNOWN_ATTRIBUTE_KEY, but the catalog lookup makes it unreachable. The header note that transaction wrapping is the caller's job (BR-19) states no fact any node in this set holds. The existence check compares row count to `fragment_ids.length` and so misjudges duplicate ids.
