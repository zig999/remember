findings:
  - file: src/modules/ingestion/mcp/transport.ts
    where: >-
      the header comment, lines 6-7 and 16-17, and the doc comment on `toolNames`, line 33
    evidence: >-
      "Exposes 4 tools owned by this domain — the four `propose_*` actions."; "`tools/list` always returns all four tools, regardless of state."; "The closed set of tool names this endpoint exposes (4 propose_* actions)."
    cost: >-
      The contract says this MCP surface also carries document ingestion, directed ingestion and the recent-ingestions listing. app.ts passes `toolNames` of `...INGEST_TOOL_NAMES, "ingest_document", "ingest_directed", "health", "get_ingestion_status", "list_recent_ingestions"`, so the comments understate the surface. A reader who trusts them thinks the endpoint offers four proposal tools, and no running code says so.
    kind: contradicts
    correction: >-
      Remove the count and the "all four tools" claim from the comments. The behavior already conforms, since the tool set is whatever `toolNames` carries, so only the prose is wrong.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/transport.ts
    where: >-
      the header comment, lines 10-12
    evidence: >-
      "The handler shell (`handler-base.ts` -> `runIngestHandler`) owns the per-call transaction, `assertRunIsRunning`, and the `tool_call` audit row (BR-23 updated)."
    cost: >-
      This comment is a second home outside behavior for the rule that a proposal is audited as a tool call, and it states the fact in prose next to a file that does none of it. The code holds the fact in `src/modules/ingestion/mcp/handler-base.ts`, in `await insertToolCall(client, { llm_run_id: ..., tool_name: ..., validation_outcome: ... })` and in `safeWriteAuditOnRollback`. If the rule moves, this prose is not bound to the node.
    kind: restates
    correction: >-
      Remove the sentence. The audit behavior lives in handler-base.ts.
    node: rules/knowledge-base/every-proposal-audited
  - file: src/modules/ingestion/mcp/transport.ts
    where: >-
      the header comment, lines 10-12
    evidence: >-
      "The handler shell (`handler-base.ts` -> `runIngestHandler`) owns the per-call transaction, `assertRunIsRunning`, ..."
    cost: >-
      The comment restates that a proposal is taken only within a running run. The code holds this in `src/modules/ingestion/mcp/handler-base.ts` as `if (row.status !== "running") { throw new ValidationFailure("BUSINESS_RUN_NOT_RUNNING", ...` The prose is a second statement of the rule that the node's binding does not reach.
    kind: restates
    correction: >-
      Remove the reference. The check lives in handler-base.ts.
    node: rules/knowledge-base/proposal-requires-running-run
  - file: src/modules/ingestion/mcp/transport.ts
    where: >-
      the `mountMcpEndpoint` options, line 43
    evidence: >-
      path: "/mcp/ingest",
    cost: >-
      The route under which the ingestion toolset is reached is a fact of the published surface, and no node names it. The contract lists operations and says which transport carries them, but gives no endpoint. The path lives only in this file, so a reader who looks in the specification for where an MCP client connects finds nothing.
    kind: unstated
    correction: >-
      The analysis would give the MCP ingestion endpoint a home in the ingestion contract or a node beside it.
    node: contracts/knowledge-base/ingestion
