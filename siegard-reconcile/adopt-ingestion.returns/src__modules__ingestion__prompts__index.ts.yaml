findings:
  - file: src/modules/ingestion/prompts/index.ts
    where: >-
      the header comment, lines 10-15 ("An unknown version is a configuration error ... it must never silently run a different prompt than the audit trail records")
    evidence: >-
      // An unknown version is a configuration error, NOT a silent fallback: BR-26
      // step 2 mandates "load the extraction.${prompt_version} module; fail with 500
      // SYSTEM_INTERNAL_ERROR if the module is missing". `selectPromptModule` throws
      // `UnknownPromptVersionError`; the extraction orchestrator runs it inside its
      // run-scoped try, so the run is flipped to `failed` and the error surfaces (it
      // must never silently run a different prompt than the audit trail records).
    cost: >-
      The refusal of an unknown prompt version, and its failing the run with SYSTEM_INTERNAL_ERROR, is written a second time as prose in this file. A reader who looks here for the rule finds a paraphrase that cites "BR-26" (a back-spec label, not a node) as its authority. The paraphrase does not move when the node does.
    kind: restates
    correction: >-
      Remove the comment. The node already holds the fact. The code holds it in this file (`throw new UnknownPromptVersionError(promptVersion)` in selectPromptModule). Removal goes through the comment route, followed by /reconcile over the file.
    node: rules/knowledge-base/prompt-version-known
  - file: src/modules/ingestion/prompts/index.ts
    where: >-
      the JSDoc above UnknownPromptVersionError (line 72) and the JSDoc above selectPromptModule (lines 83-87)
    evidence: >-
      /** Thrown when `prompt_version` names no registered module (BR-26 step 2). */
      ... Throws
      * `UnknownPromptVersionError` for an unregistered version (BR-26 step 2 — fail
      * loud, never silently substitute a different prompt than the run declares).
    cost: >-
      This is the same fact as the header comment, restated in two more places, each citing BR-26 as its authority. The next reader sees three prose copies next to one throw and cannot tell which is the decision.
    kind: restates
    correction: >-
      Remove both doc comments. The throw at `if (module === undefined) { throw new UnknownPromptVersionError(promptVersion); }` holds the fact.
    node: rules/knowledge-base/prompt-version-known
  - file: src/modules/ingestion/prompts/index.ts
    where: >-
      the comment above DEFAULT_PROMPT_VERSION, line 62
    evidence: >-
      /** Recommended version for NEW runs — callers SHOULD send this at intake. */
    cost: >-
      The comment restates the default prompt version in prose and adds a caller recommendation ("SHOULD send this at intake") that no node holds. The node says the system fills v4 when a document ingestion names no version. A reader takes the comment as the rule for intake callers.
    kind: restates
    correction: >-
      Remove the comment. `export const DEFAULT_PROMPT_VERSION: string = v4.PROMPT_VERSION;` holds the value. If the "callers SHOULD send" guidance is a business decision, it belongs in the specification, not in a comment.
    node: rules/knowledge-base/default-prompt-version
