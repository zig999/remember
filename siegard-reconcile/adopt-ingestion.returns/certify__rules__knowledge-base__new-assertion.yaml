certified:
  - node: rules/knowledge-base/new-assertion
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/graph-consolidation.spec.ts
        name: inserts a new knowledge_link row and one provenance row when no vigent exists
      - file: src/__tests__/unit/ingestion/graph-consolidation.spec.ts
        name: accepted (new) — no vigent row
    why: >-
      The link half is exercised whole. With no current knowledge_link in scope,
      "inserts a new knowledge_link row and one provenance row when no vigent
      exists" asserts that exactly one new link row is recorded and that its
      supersedes_link_id is null. The attribute half is only partly exercised.
      With no current node_attribute in scope, "accepted (new) — no vigent row"
      asserts the accepted outcome, one inserted node_attribute row and one
      provenance row. It never checks that the new row supersedes nothing: the
      test would still pass if an attribute proposal meeting no current
      assertion recorded a row with a non-null supersedes_attribute_id. Other
      tests in the file also send a proposal with no current row: the BR-18
      "accepted (new)" branch, the link and attribute dup-guard race tests, and
      "inserts with status='uncertain' when 0.40 <= confidence < 0.75". They
      assert that a row or provenance is recorded only on the way to asserting
      something else, and none of them asserts that the new row supersedes
      nothing.
    remainder: testable
    remainder_why: >-
      One input: an attribute proposal (proposeAttributeService) where no
      current node_attribute exists for the (node, key). Expected result: a
      single new node_attribute row whose supersedes_attribute_id is null, and
      no current row closed. Adding
      expect(state.inserts.node_attribute[0]!.supersedes_attribute_id).toBeNull()
      to "accepted (new) — no vigent row" would close it.
