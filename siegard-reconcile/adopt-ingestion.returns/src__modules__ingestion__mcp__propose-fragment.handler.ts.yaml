findings:
  - file: src/modules/ingestion/mcp/propose-fragment.handler.ts
    where: >-
      the comment above the assertRunIsRunning call in proposeFragmentHandler (lines 71-72)
    evidence: >-
      // BR-21 (defence in depth at the service-call boundary). Returns the
      // run's `input_raw_information_id` used to scope the service.
      const run = await assertRunIsRunning(client, deps.llm_run_id);
    cost: >-
      The comment cites a back-spec rule (BR-21) as the authority for the running-run check. A reader
      trying to learn where "a proposal is taken only within a running run" is decided is sent to
      that prose and to a rule identifier outside the specification, when the fact is held by the
      node and by the call beneath the comment.
    kind: restates
    correction: >-
      Remove the comment. The node holds the fact and the `assertRunIsRunning` call, in this file,
      enforces it.
    node: rules/knowledge-base/proposal-requires-running-run
  - file: src/modules/ingestion/mcp/propose-fragment.handler.ts
    where: >-
      the `if (!envelope.ok)` branch in proposeFragmentHandler (lines 79-88)
    evidence: >-
      if (!envelope.ok) {
        // Defensive: a future evolution of the service contract could return
        // an error envelope directly. Map it to the audit shape so the
        // handler shell records the right outcome.
        return {
          result: envelope as unknown as ProposeFragmentResult,
          validation_outcome: "rejected",
    cost: >-
      The node splits a tool call's outcome into rejected for a refused proposal and error for a
      failed one. This branch records "rejected" for every non-ok envelope and does not look at
      what kind of failure it carries. The branch is unreachable while the service only throws. If
      it ever runs, a system failure would be audited as a refusal, and the run summary's `error`
      and `rejected` counts would be wrong.
    kind: contradicts
    correction: >-
      Derive the outcome for an error envelope by the node's rejected/error split, in the same place
      that derives the other outcomes, instead of hard-coding "rejected" here.
    node: rules/knowledge-base/tool-call-validation-outcome
