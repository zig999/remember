findings:
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      noopExisting, the lookup `findLlmRunByIdempotencyKey(client, idempotencyKey)` and the InvariantError thrown when it returns null (lines 215-222). The key comes from ingestRawInformation, lines 104-109.
    evidence: >-
      const run = await findLlmRunByIdempotencyKey(client, idempotencyKey);
      if (run === null) {
        throw new InvariantError(
          `noopExisting: raw_information ${existing.id} exists for content_hash ${contentHash} ` +
            `but no llm_run row matches idempotency_key ${idempotencyKey}. ` +
            `Database is inconsistent — BR-09 invariant violated.`
    cost: >-
      The idempotency key is built from the request's own model and prompt version. Re-ingesting held content while naming a different model or prompt version therefore finds no run and ends in an InvariantError. The contract answers HTTP 200 noop_existing with the run the raw information already has, "whatever model or prompt version the request names". The next reader trusts the node and does not expect a server error there. The comment at lines 89-92 treats a missing run as database corruption, which is not the business rule.
    kind: contradicts
    correction: >-
      Resolve the held raw information's existing run by its raw information, not by the idempotency key derived from the request's model and prompt version.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      noopExisting, the same key-based run lookup (lines 215-222).
    evidence: >-
      const run = await findLlmRunByIdempotencyKey(client, idempotencyKey);
    cost: >-
      The scenario has content ingested with one model and then ingested again naming another model. It expects no new records and an answer that names the held raw information and the run it already has. The key includes the new model, so the lookup misses and the request fails with a 500, not that answer.
    kind: contradicts
    correction: >-
      Same correction as for the contract: find the held run by raw information.
    node: scenarios/knowledge-base/held-content-under-another-model
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      Doc comment above ingestRawInformation, step 1 (line 80).
    evidence: >-
      1. Compute `content_hash = sha256(content)`.
    cost: >-
      A second statement of the content hash rule sits in prose. The code holds it at `sha256Hex(input.content)` in this file, and the digest itself is computed in ../hash.js. If the node moves, this comment says nothing new and keeps stating the old rule.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by the node and by sha256Hex (imported from ../hash.js) at the call in this file.
    node: rules/knowledge-base/content-hash-is-sha256
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      Doc comment above ingestRawInformation, step 2 (line 81).
    evidence: >-
      2. Compute `idempotency_key = sha256(content_hash ∥ prompt_version ∥ model ∥ chunking_version)`.
    cost: >-
      The key formula is written out a second time in prose. The code holds it at the composeIdempotencyKey call in this file, and the composition is in ../hash.js. A reader may take the comment for the authority and not look at the node.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by the node and by composeIdempotencyKey (imported from ../hash.js).
    node: rules/knowledge-base/idempotency-key
