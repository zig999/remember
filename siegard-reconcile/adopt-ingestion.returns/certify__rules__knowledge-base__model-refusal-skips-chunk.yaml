certified:
  - node: rules/knowledge-base/model-refusal-skips-chunk
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/extraction-orchestrator.spec.ts
        name: "refusal: logged, chunk skipped, next chunk continues normally"
    why: >-
      Not a gap. The test also checks something the node does not state. It
      requires a warn log with the event name `extraction_chunk_refused`, but
      the node says nothing about logging a refusal. If that event is renamed,
      the test fails even though the fact still holds. The fact itself is
      checked by the other assertions. The model refuses the first chunk and
      ends normally on the second. The test then asserts exactly two model
      calls, which fails if the refused chunk is retried or the remaining
      chunks are dropped. It also asserts the run closed as completed and the
      call did not throw, which fails if the refusal fails the run.
