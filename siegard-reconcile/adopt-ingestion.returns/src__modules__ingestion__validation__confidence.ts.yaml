findings:
  - file: src/modules/ingestion/validation/confidence.ts
    where: >-
      header comment, lines 3-5 (the active and uncertain thresholds)
    evidence: >-
      //   confidence >= 0.75            -> assertion status = 'active'
      //   0.40 <= confidence < 0.75     -> assertion status = 'uncertain'
    cost: >-
      The same 0.75 and 0.40 thresholds are written a second time in prose beside the constants that hold them. If a node moves a threshold, this comment keeps stating the old one and nothing reads it. The code here is unaffected.
    kind: restates
    correction: >-
      Remove the comment. The rule is held by CONFIDENCE_FLOOR, CONFIDENCE_UNCERTAIN_UPPER and routeConfidence in this file, and by the node.
    node: rules/knowledge-base/new-assertion-status-from-confidence
  - file: src/modules/ingestion/validation/confidence.ts
    where: >-
      header comment, lines 5-12 (the below-floor branch and the rejected outcome)
    evidence: >-
      //   confidence < 0.40             -> link/attribute NOT created;
      // The handler turns it into `{ ok: true, result: { outcome: "rejected",
      //                                    reason: "BELOW_CONFIDENCE_FLOOR" } }` and records the `tool_call` with
      // `validation_outcome = 'rejected'`.
    cost: >-
      The 0.40 floor and its rejected result are restated in prose. The code holds them in CONFIDENCE_FLOOR here and in the services that return the outcome. Two readers can now disagree about where the floor is decided.
    kind: restates
    correction: >-
      Remove the comment. The floor is held by `CONFIDENCE_FLOOR` and the `below_floor` branch here. The rejected outcome with reason BELOW_CONFIDENCE_FLOOR is held in src/modules/ingestion/service/propose-link.service.ts (`reason: "BELOW_CONFIDENCE_FLOOR"`) and src/modules/ingestion/service/propose-attribute.service.ts.
    node: rules/knowledge-base/below-confidence-floor-records-nothing
  - file: src/modules/ingestion/validation/confidence.ts
    where: >-
      header comment, lines 6-7 (supporting fragments)
    evidence: >-
      //                                    supporting fragments stay `proposed`,
    cost: >-
      A fragment-status fact is restated in a file that neither records nor changes any fragment. It could drift from the node without anyone seeing it.
    kind: restates
    correction: >-
      Remove the comment. Fragments are recorded as proposed in src/modules/ingestion/service/propose-fragment.service.ts (`status: "proposed"`).
    node: rules/knowledge-base/fragment-recorded-proposed
