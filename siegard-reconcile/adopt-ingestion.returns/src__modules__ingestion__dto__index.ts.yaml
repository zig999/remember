findings:
  - file: src/modules/ingestion/dto/index.ts
    where: >-
      IngestToolDescriptions.propose_node, lines 124-128
    evidence: >-
      "Propose every entity freely: the backend matches it to an existing entity or " +
      "creates a new one and never duplicates. Returns a node_id to cite from " +
    cost: >-
      This text goes to the model on every connection. It says a proposal either matches
      an existing entity or creates a new one, "never duplicates". The node says a
      proposal with a candidate at similarity 0.55 or more, and no exact alias or single
      strong candidate, creates a second node in status needs-review beside the similar
      one, with an entity match review. The model is told duplicates cannot arise, and
      the owner meets a queue the description denied.
    kind: contradicts
    correction: >-
      The description should name the third resolution, a node created for the owner's
      review when the name resembles an existing one, instead of "never duplicates".
    node: rules/knowledge-base/ambiguous-candidates-need-review
  - file: src/modules/ingestion/dto/index.ts
    where: >-
      IngestToolDescriptions.propose_link and propose_attribute, lines 129-140
    evidence: >-
      "(e.g. a Person responsible_for a Project). Both nodes must exist first, and you " +
      "must cite at least one fragment_id as evidence." and
      "literal as its own node. The node must exist; cite at least one fragment_id. "
    cost: >-
      This states a minimum of one cited fragment for link and attribute proposals. No
      node holds that minimum. The proposal node gives its evidence association as
      0..*, and the only "at least one fragment" rule is the errata rule for
      corrections. The threshold is stated only in text sent to the model. Whoever
      reads the specification will not find it, and the specification's 0..* says
      zero is allowed.
    kind: unstated
    correction: >-
      Analysis should decide whether a link or attribute proposal must cite at least one
      fragment, and give that rule a node. The description then follows it.
    node: domain/knowledge-base/proposal
  - file: src/modules/ingestion/dto/index.ts
    where: >-
      IngestToolDescriptions.ingest_document, lines 148-149
    evidence: >-
      "If your client times out before this returns, the server keeps extracting — do NOT " +
      "re-send; use `list_recent_ingestions` to find the run, then `get_ingestion_status`."
    cost: >-
      This promises that extraction continues after the caller disconnects, and tells the
      caller how to recover. No node holds either. The ingestion contract's
      ingest-document answers describe only the completed answers and refusals. The
      recovery behaviour exists only in text sent to the model.
    kind: unstated
    correction: >-
      Analysis should decide whether extraction outlives the caller's connection, and
      record it in the ingestion contract if so.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/dto/index.ts
    where: >-
      IngestToolDescriptions.health, lines 150-153
    evidence: >-
      "Check that the BFF is running and its database is reachable. Returns service " +
      "status, database connectivity, and a timestamp. Call this first to confirm the " +
    cost: >-
      This is a callable capability, with the fields it returns, that no node holds. A
      search of the specification root for health finds nothing. The tool is offered
      to the model and described only here.
    kind: unstated
    correction: >-
      Analysis should give the health check a node, or record that it is outside the
      specification.
  - file: src/modules/ingestion/dto/index.ts
    where: >-
      IngestToolDescriptions.start_async_ingestion, lines 165-173
    evidence: >-
      "Ingest a whole document and IMMEDIATELY return the run id while extraction " +
      "continues in the background. Use this instead of `ingest_document` when you " +
    cost: >-
      This is a whole ingestion operation, asynchronous and returning the run id at once,
      that the ingestion contract does not list among its operations. The contract lists
      ingest-document and ingest-directed only. A search of the specification root finds
      no asynchronous ingestion, so the behaviour and the promise that "Arguments and
      defaults match `ingest_document` exactly" live only in the source.
    kind: unstated
    correction: >-
      Analysis should add the operation and its answers to the ingestion contract, or
      remove the tool.
    node: contracts/knowledge-base/ingestion
