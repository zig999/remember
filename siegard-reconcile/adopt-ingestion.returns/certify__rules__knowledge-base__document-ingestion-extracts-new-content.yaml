certified:
  - node: rules/knowledge-base/document-ingestion-extracts-new-content
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/ingest-document-handler.spec.ts
        name: created → drives extraction and reports `ingested`
      - file: src/__tests__/unit/ingestion/ingest-document-handler.spec.ts
        name: noop_existing (completed) → `already_ingested` + run_status, WITHOUT re-running extraction
      - file: src/__tests__/unit/ingestion/ingest-document-handler.spec.ts
        name: noop_existing (FAILED prior run) → surfaces run_status='failed' and a not-completed message (fail loud)
    why: >-
      The only part exercised is the handler's branching. When the injected intake stub
      reports `created`, the injected extraction stub is called once with the run id the
      stub returned. When the intake stub reports `noop_existing`, extraction is not
      called. Both collaborators are vi.fn stubs, so these tests would still pass if the
      fact stopped holding in either of two ways.
      First, "records it": nothing checks that the document is stored as held content or
      that a new LLM run is created. The raw id and run id are literals the stub returns,
      and the result simply echoes them back.
      Second, "when its content is already held": nothing submits the same content twice.
      `noop_existing` is handed to the handler as a canned answer, so a failure to notice
      already-held content would never reach these tests.
      Extraction itself is also a stub. What is shown is that the extraction seam is
      called against the new run's id, not that anything is extracted through that run.
      The tests `defaults model + prompt_version when the caller omits them`, the two
      intake-error tests and the three extraction-fatal tests assert defaults and error
      envelopes. None of them bears on this fact.
    remainder: testable
    remainder_why: >-
      Two tests would close it. First, ingest a document whose content the store does
      not hold. Expect the document to be stored, a new LLM run to exist for it, and
      extraction to run against that run's id. Second, ingest the same content again.
      Expect the answer to report it as already held, no second stored document or new
      run, and no extraction to run.
