findings:
  - file: src/modules/ingestion/mcp/propose-link.handler.ts
    where: >-
      the header comment, lines 1-9
    evidence: >-
      // Thin transport adapter. Business logic — including the full 5-layer
      // validation pipeline (BR-13) — lives in `service/propose-link.service.ts`.
    cost: >-
      The comment gives the link-proposal validation as a five-layer pipeline. The node holds it as seven checks in a fixed order (known link type, existing nodes, cited fragments, permitting rule, dates, confidence, anchoring). The next reader who wants to know how a link proposal is checked finds a layer count that matches neither the node nor the service's actual checks, and no running system reads it.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by rules/knowledge-base/link-proposal-check-order, and the file's code delegates the checks to the service it imports and calls, `proposeLinkService`. I did not open the service, which is outside the file set. Remove by the comment route, then reconcile this file.
    node: rules/knowledge-base/link-proposal-check-order
