findings:
  - file: src/modules/ingestion/dto/source-type.ts
    where: >-
      the header comment, lines 1-5, and the doc comment on SourceTypeSchema, line 9
    evidence: >-
      // `source_type` enum — mirrors the PostgreSQL enum of the same name. // Keep this in sync with `migrations/0001_init.sql` (CREATE TYPE source_type) and with `openapi.yaml#/components/schemas/SourceType`. The Zod schema is the single point that REST request validation uses to decide acceptance. /** Closed list — matches `CREATE TYPE source_type` in 0001_init.sql. */
    cost: >-
      The comments say the set of source types is closed and name this file as the place that decides which values REST accepts. domain/knowledge-base/source-type holds that value set, and the `z.enum` in this file already holds it as code. A reader who follows the comment treats the file as the authority and never opens the node. If the node's values change, the comments keep claiming this file is the deciding point.
    kind: restates
    correction: >-
      Remove both comments. The closed set is held by domain/knowledge-base/source-type and by the `z.enum` in this file, so no prose is needed to hold it.
    node: domain/knowledge-base/source-type
