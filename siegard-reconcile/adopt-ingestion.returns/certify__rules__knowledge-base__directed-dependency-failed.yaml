certified:
  - node: rules/knowledge-base/directed-dependency-failed
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/directed-ingestion.spec.ts
        name: "node_id pin (invalid): unknown UUID → RESOURCE_NOT_FOUND; dependent items cascade"
      - file: src/__tests__/unit/ingestion/directed-ingestion.spec.ts
        name: "cascade on missing fragment evidence_ref: link lands dependency_failed"
      - file: src/__tests__/unit/ingestion/directed-ingestion.spec.ts
        name: "checkCascade returns the missing dependency ref or null"
    why: >-
      Three cases go through the orchestrator. In each, the item is not proposed, it is reported
      dependency_failed, and the report names the missing reference. The cases are an attribute
      whose node is missing, a link whose source is missing, and a link whose evidence is missing
      while its source and target resolve. Four parts of the fact are never exercised. First,
      nothing submits a link whose target is missing, so that reference is never tested. Second,
      no input has more than one missing reference: no attribute lacks both node and evidence, and
      no link lacks source and target, source and evidence, or target and evidence. So the rule
      about which reference is named first (node before evidence for an attribute; source, then
      target, then evidence for a link) is never tested, and code that reported any missing
      reference would pass. Third, an attribute whose evidence is missing is only exercised
      through the internal helper `__testing__.checkCascade`, never through the orchestrator's
      report or its dispatch. That helper test is bound to the code's structure, not the fact. Its
      comment says "Missing node_ref returned FIRST", but in that case the evidence reference
      resolves, so the test cannot fail if the order is wrong. It also covers only the attribute
      shape. Fourth, every missing reference in the set is one the payload declared but that
      failed to resolve (a rejected pin or a rejected fragment). None is a reference that no item
      in the payload declares at all.
    remainder: testable
    remainder_why: >-
      Four orchestrator inputs would close it, each with the item reported dependency_failed, its
      propose handler never called, and the reason naming the expected reference. An attribute
      whose node and evidence are both missing: the reason names the node. A link whose target is
      missing and whose source and evidence resolve: the reason names the target. A link whose
      source, target and evidence are all missing: the reason names the source. A link whose target
      and evidence are both missing and whose source resolves: the reason names the target. Adding
      one attribute or link whose reference no item in the payload declares would cover the
      never-declared case.
