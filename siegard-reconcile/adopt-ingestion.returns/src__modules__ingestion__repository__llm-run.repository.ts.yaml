findings:
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `RecentIngestionRow`, lines 38-44
    evidence: >-
      "joined to its MOST RECENT `llm_run` (via LATERAL, so a raw with no run still appears with null run fields)"
    cost: >-
      The rule that a recent ingestion shows its most recently started run, or none, is written a second time as prose beside the query that enforces it. When the node changes, the docstring keeps saying the old rule and nothing reads it. The next reader of this file may take the prose for the decision.
    kind: restates
    correction: >-
      Remove the docstring's statement of the rule. The `LEFT JOIN LATERAL (... ORDER BY started_at DESC LIMIT 1) lr ON true` in `findRecentIngestions` holds the fact, and the node's bind claims it.
    node: rules/knowledge-base/recent-ingestion-latest-run
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `findRecentIngestions`, lines 59-63
    evidence: >-
      "Most recent ingestions, newest first."
    cost: >-
      The listing order is stated as prose beside `ORDER BY ri.received_at DESC`, which holds it. If the node's order changes, the comment goes on asserting the old one.
    kind: restates
    correction: >-
      Remove the phrase. The `ORDER BY ri.received_at DESC` in this file holds the fact.
    node: rules/knowledge-base/recent-ingestions-order
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `findRecentIngestions`, lines 59-63
    evidence: >-
      "`limit` is validated (1..50) at the toolset boundary before it reaches here."
    cost: >-
      The bounds of the limit appear as a number in prose in a file that does not enforce them. The next reader sees "1..50" here, and a change to the node leaves this copy stale.
    kind: restates
    correction: >-
      Remove the sentence. Code holds the bound in another file, `src/modules/ingestion/mcp/mcp-schemas.ts` (`limit: z.number().int().min(1).max(50).default(10)` in `ListRecentIngestionsMcpInputSchema`).
    node: rules/knowledge-base/recent-ingestions-limit-bounds
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `aggregateToolCallOutcomes`, lines 111-114 (the second bullet continues to line 117)
    evidence: >-
      "every field present, missing buckets default to 0 (BR-12)"
    cost: >-
      The zero-for-absent-outcome rule is restated as prose, cited by a back-spec number, next to the initial `summary` object that holds it. A reader looking for where the rule lives is pointed at BR-12 and not at the node.
    kind: restates
    correction: >-
      Remove the sentence. The initialised `summary` object and the `for (const row of result.rows)` fill in this file hold the fact.
    node: rules/knowledge-base/summary-counts-tool-calls
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `aggregateToolCallOutcomes` (lines 115-117) and the inline comment before the orphan query (lines 148-149)
    evidence: >-
      "`orphaned_fragments`, the count of this run's `proposed` fragments with no provenance row" and "Same definition as the retry orphan-cleanup: `proposed` fragments of this run with no provenance."
    cost: >-
      The definition of an orphaned fragment is written twice as prose, in addition to the SQL predicate. A change to the node's definition leaves three places that must agree, and only one of them is read by anything.
    kind: restates
    correction: >-
      Remove both passages. The `status = 'proposed' AND id NOT IN (SELECT fragment_id FROM provenance ...)` predicate of the `orphan` query holds the fact in this file.
    node: rules/knowledge-base/summary-counts-orphaned-fragments
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `retryLlmRunRow` (lines 165-171) and the inline comment before the second query (lines 188-189)
    evidence: >-
      "In the same transaction, orphan `proposed` fragments of this run are flipped to `rejected`."
    cost: >-
      The retry's rejection of orphaned fragments is stated as prose twice, next to the `UPDATE information_fragment SET status = 'rejected'` that performs it. The prose cites BR-10 and BR-11, so a reader is sent to the back-spec for a fact the node holds.
    kind: restates
    correction: >-
      Remove both passages. The `UPDATE information_fragment SET status = 'rejected'` statement in this file holds the fact.
    node: rules/knowledge-base/retry-rejects-orphaned-fragments
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `retryLlmRunRow` (lines 165-168) and the docstring above `closeLlmRunRow` (lines 204-207)
    evidence: >-
      "UPDATE ... WHERE status = 'failed' RETURNING the new row. If no row is affected, the caller surfaces 409 BUSINESS_RUN_NOT_RETRYABLE." and "drive `running -> completed | failed`"
    cost: >-
      The lifecycle's allowed transitions and the refusal code for a non-retryable run are stated as prose here. The guards are `WHERE id = $1 AND status = 'failed'` and `WHERE id = $1 AND status = 'running'`. The refusal code is not raised in this file. The prose claims what a caller does, so it can go stale without any check noticing.
    kind: restates
    correction: >-
      Remove the passages. The two `WHERE ... AND status = ...` guards in this file hold the transitions. The 409 BUSINESS_RUN_NOT_RETRYABLE answer belongs to the contract node and is raised by a caller, not by this file.
    node: rules/knowledge-base/llm-run-lifecycle
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `findToolCallsByRun`, line 237
    evidence: >-
      "Page of `tool_call` rows ordered by `created_at` ascending."
    cost: >-
      The listing order is written as prose, and it is also incomplete, since the node adds the identifier as a tiebreak. A reader who trusts the comment misses the tiebreak that `ORDER BY created_at ASC, id ASC` holds.
    kind: restates
    correction: >-
      Remove the sentence. The `ORDER BY created_at ASC, id ASC` in this file holds the fact.
    node: rules/knowledge-base/tool-call-listing-order
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `insertToolCallStandalone`, lines 287-290
    evidence: >-
      "This is the BR-23 safety net: even when the business transaction rolls back, the audit row must be written."
    cost: >-
      The requirement that every proposal is audited, whether taken, refused or failed, is restated as prose citing BR-23. The next reader is sent to the back-spec for a fact the node holds and the function implements.
    kind: restates
    correction: >-
      Remove the docstring. The separate `BEGIN` / `insertToolCall` / `COMMIT` on a pooled client in `insertToolCallStandalone` holds the behavior.
    node: rules/knowledge-base/every-proposal-audited
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `countFragmentsAnchoredToSource`, lines 320-326
    evidence: >-
      "BR-18 anti-hallucination check. For every fragment in `fragment_ids`, the fragment must exist AND have at least one `fragment_source` row pointing to a `raw_chunk` of `expected_raw_information_id`."
    cost: >-
      The anchoring rule is restated as prose, along with the caller's refusal code, next to the SQL that counts anchored fragments. The rule now has a second home that the node's bind does not reach.
    kind: restates
    correction: >-
      Remove the docstring's statement of the rule. The `JOIN fragment_source` / `JOIN raw_chunk ... rc.raw_information_id = $2` query in this file holds the fact, and its callers, `propose-link.service.ts` and `propose-attribute.service.ts`, compare the count.
    node: rules/knowledge-base/cited-fragments-anchored
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above `countChunksInSource`, lines 347-350
    evidence: >-
      "Verify every chunk in `chunk_ids` exists AND belongs to `expected_raw_information_id`."
    cost: >-
      The rule that a cited chunk belongs to the run's raw information is stated as prose beside the query that counts matches. A change to the node leaves the comment asserting the old rule.
    kind: restates
    correction: >-
      Remove the sentence. The `WHERE id = ANY($1::uuid[]) AND raw_information_id = $2` query in this file holds the fact, and `propose-fragment.service.ts` compares the count.
    node: rules/knowledge-base/fragment-chunks-in-run-source
