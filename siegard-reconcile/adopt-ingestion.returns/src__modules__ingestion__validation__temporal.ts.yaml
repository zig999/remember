findings:
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      Header comment, lines 4-5, and the comment at line 107 above the interval check
    evidence: >-
      "//   - semi-open invariant: `valid_from < valid_to` when both are provided
      //     (BR-16 / §13.3 / §5.2)." and "// Semi-open interval invariant."
    cost: >-
      The start-before-end rule is written twice in this file as prose next to the branch that enforces it. When the node moves, the comment keeps saying the old rule and no check reaches it.
    kind: restates
    correction: >-
      Remove both comments. The rule is held by the `input.valid_from >= input.valid_to` branch in this file and by the node.
    node: rules/knowledge-base/validity-start-before-end
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      Header comment, lines 6-10, and the comment block at lines 128-135
    evidence: >-
      "//   - date justification chain (A14 / §6.5): when `requires_valid_from = true`
      //     for the link_type or attribute_key, AND `valid_from` is supplied, the
      //     caller must declare a non-null `valid_from_basis`."
    cost: >-
      The comment ties the basis rule to `requires_valid_from = true`. The code and the node refuse a stated start without a basis whatever the type requires. A reader who trusts the comment gets the condition wrong.
    kind: restates
    correction: >-
      Remove both comments. The rule is held by the `input.valid_from !== null && input.valid_from_basis === null` branch and by the node.
    node: rules/knowledge-base/stated-start-requires-basis
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      Header comment lines 11-13, the ERRATA_MARKERS docstring at lines 61-65, and the comment at line 117
    evidence: >-
      "//   - correction signal: `change_hint = 'correction'` requires textual errata
      //     evidence in at least one cited fragment." and "'correction' requires textual evidence of an
      * errata in at least one cited fragment (case-insensitive substring of any
      * of the Portuguese/English markers used in the domain glossary)."
    cost: >-
      The rule and the marker vocabulary are restated in prose in three places. The docstring points to a "domain glossary" as the source of the markers. The real home is the node, so the pointer misdirects the next reader.
    kind: restates
    correction: >-
      Remove the three comments. The markers and the refusal are held by ERRATA_MARKERS and the `change_hint === "correction"` branch, and by the node.
    node: rules/knowledge-base/correction-requires-errata-evidence
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      Header comment lines 15-22, the comment at line 135, and the comment at line 167
    evidence: >-
      "The
      //   BUSINESS_DATE_UNJUSTIFIED rejection only fires when ALL THREE links of the chain are absent." and "// ALL three links absent — only now is the row BUSINESS_DATE_UNJUSTIFIED."
    cost: >-
      The refusal condition for a required start is stated in prose in several places. The code enforces it in the final `throw`, so each comment is a second home that can drift from the node.
    kind: restates
    correction: >-
      Remove the comments. The refusal is held by the final `throw new ValidationFailure("BUSINESS_DATE_UNJUSTIFIED", ...)` in the `requires_valid_from` branch and by the node.
    node: rules/knowledge-base/required-start-available
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      Header comment lines 15-22 and the comment at line 159
    evidence: >-
      "//   stated -> document -> received. When `valid_from` is not supplied and
      //   `document_date` is absent BUT `received_at` is available, the layer
      //   resolves `valid_from := received_at` (date portion) with
      //   `valid_from_source := 'received'`."
    cost: >-
      The prose restates the received link of the fallback and names a field, `valid_from_source`, that the code and the node do not use (they use valid_from_basis). It is a second home for the fallback with a drifted name.
    kind: restates
    correction: >-
      Remove the comments. The received fallback is held by the `toIsoDate(input.received_at)` branch that returns `valid_from_basis: "received"`.
    node: rules/knowledge-base/required-start-fallback
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      The `document_date !== null` branch inside `if (input.requires_valid_from && input.valid_from === null)`, lines 145-158
    evidence: >-
      "if (input.document_date !== null) {" ... "return {
        valid_from: input.valid_from,
        valid_from_basis: input.valid_from_basis,
      };" with the comment "we DO NOT
      // resolve `valid_from`/`valid_from_basis` to the document_date here."
    cost: >-
      The node says a required start that is not stated takes the source's document date with basis document. This branch lets it pass with no start and no basis, which is the behavior the decision log records as decided against ("A type that requires a validity start is never left without one"). A required-start assertion from a dated document is therefore stored with no start unless another file fills it, and the next reader looking at the node would not expect that.
    kind: contradicts
    correction: >-
      Resolve `valid_from` to `input.document_date` with `valid_from_basis: "document"` in this branch, as the received branch does for the reception date. If another file is meant to hold that resolution, it must be named and bound to the node.
    node: rules/knowledge-base/required-start-fallback
