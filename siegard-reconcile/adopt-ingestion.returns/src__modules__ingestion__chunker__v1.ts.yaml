  The SourceType union at the top of the file declares the source-type vocabulary in the material's own words (ata, artigo, transcricao, outro), a mirror of the PostgreSQL enum. domain/knowledge-base/source-type records those words as the material's own spelling of its values, so I left the union alone, and the enum's value set is another judgment's.
