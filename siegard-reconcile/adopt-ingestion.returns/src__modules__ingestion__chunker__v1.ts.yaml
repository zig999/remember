  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      scanLines (line 298) and the isBlank test in splitEmail (line 229)
    evidence: >-
      if (codePoints[i] === "\n") {

      const isBlank = line.endExclusive === line.start;
    cost: >-
      The code decides what a line and a blank line are. A line ends only at U+000A. A blank line is one of zero length. A whitespace-only line, or any line of a CRLF email (which keeps a trailing "\r"), is never blank. On a CRLF email the header block then never ends and the whole email stays one block. No node says this, so the next reader looks in the specification and does not find the decision.
    kind: unstated
    correction: >-
      Give the definitions of a line and of a blank line a home in the specification, most naturally in rules/knowledge-base/email-header-block. That should also settle how "\r" is treated.
    node: rules/knowledge-base/email-header-block
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      SPEAKER_LINE_REGEX, line 351
    evidence: >-
      /^\s*(?:[[(]\d{1,2}:\d{2}(?::\d{2})?[\])][\s\t]+)?[A-Za-zÀ-ÿ0-9_]+(?:\s[A-Za-zÀ-ÿ0-9_]+)?:\s/
    cost: >-
      The node lists the time stamp forms [h:mm], [hh:mm], (hh:mm) and (hh:mm:ss). The regex accepts a wider set: `(1:00)`, `[12:00:30]` and mismatched brackets such as `[12:00)`. Lines the node does not count as speaker lines therefore open new blocks. The node says "letters", but the class is ASCII plus U+00C0-U+00FF. That excludes letters such as Ł or Greek, and includes × and ÷. A reader who trusts the node predicts different chunk boundaries than the code produces.
    kind: contradicts
    correction: >-
      Make the regex and the node agree on the time stamp forms and on what counts as a letter.
    node: rules/knowledge-base/speaker-line
