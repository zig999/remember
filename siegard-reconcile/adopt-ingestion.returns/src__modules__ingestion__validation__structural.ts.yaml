findings:
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the header comment (line 7, "Type-catalog membership ... node_type, link_type, attribute_key all live in the seeded catalog") and the docstring of assertKnownType (lines 146-149)
    evidence: >-
      "Assert a catalog membership; raise the kind-specific `BUSINESS_UNKNOWN_*`
       code on miss (BR-14 P2.1 namespaced taxonomy)."
    cost: >-
      The catalog-membership rule for a node type is restated in prose. Code holds it in assertKnownType, so the prose is a second home outside behavior. The next reader may take the comment, or its "BR-14 P2.1" citation, for the authority.
    kind: restates
    correction: >-
      Remove the header line and the docstring by the comment route. The fact is held by the node, and assertKnownType already implements it.
    node: rules/knowledge-base/node-type-in-catalog
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the header comment (line 7) and the docstring of assertKnownType (lines 146-149), for the link_type kind
    evidence: >-
      "Type-catalog membership (BUSINESS_UNKNOWN_{NODE_TYPE|LINK_TYPE|ATTRIBUTE_KEY}):
       node_type, link_type, attribute_key all live in the seeded catalog."
    cost: >-
      The rule that a link proposal names a link type the catalog holds is restated in prose, with the code names of the refusal. Code holds it in assertKnownType, so the prose is a second home outside behavior.
    kind: restates
    correction: >-
      Remove the header line and the docstring by the comment route. assertKnownType already raises BUSINESS_UNKNOWN_LINK_TYPE.
    node: rules/knowledge-base/link-type-in-catalog
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the docstring of parseAttributeValue (lines 22-26) and the inline comments "Strict ISO YYYY-MM-DD; not free-form." (line 37) and "Strict: must be a finite numeric literal (no NaN, no Infinity)." (line 57)
    evidence: >-
      "Parse a `value` string against its declared `value_type`. ... Rejects "tomorrow" for `date`, "abc" for `number`, etc."
    cost: >-
      The value-parses rule is restated in comments. The regexes and finite check in the same function hold it, so the prose is a second home. It can drift from the node without anything noticing.
    kind: restates
    correction: >-
      Remove the docstring and the inline comments by the comment route. The regexes and checks in parseAttributeValue hold the fact.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the date branch of parseAttributeValue, lines 45-53
    evidence: >-
      "// Validate it's a real calendar date by parsing.
      const ts = Date.parse(`${v}T00:00:00Z`);
      if (Number.isNaN(ts)) {"
    cost: >-
      The node requires a date value to name an existing day, and its scenario refuses 2024-02-30. The code refuses only a value for which Date.parse returns NaN. As I understand V8, Date.parse checks an ISO day only against 1-31 and not against the month's length. So 2024-02-30 would parse as 2024-03-01 and pass. I did not run it. An impossible calendar date would then be accepted as an attribute value and stored as written.
    kind: contradicts
    correction: >-
      Refuse when the parsed date, written back as YYYY-MM-DD, differs from the value, so that only an existing day passes.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the date branch of parseAttributeValue, lines 45-53, against the scenario
    evidence: >-
      "const ts = Date.parse(`${v}T00:00:00Z`);
      if (Number.isNaN(ts)) {
        throw new ValidationFailure(
          "VALIDATION_INVALID_FORMAT",
          "value is not a calendar-valid date.","
    cost: >-
      The scenario has an attribute proposal carrying 2024-02-30 refused with no node attribute recorded. The only guard against a nonexistent day is the NaN test on Date.parse. I understand that test to let 2024-02-30 through, so the scenario's outcome is not guaranteed by this file.
    kind: contradicts
    correction: >-
      Same correction as for the rule: compare the round-tripped date with the value.
    node: scenarios/knowledge-base/impossible-calendar-date-refused
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the docstring of assertValueInDomain (lines 88-108) and the inline comment on the sort (lines 116-118)
    evidence: >-
      "exact-match string equality,
       no normalisation, no case-folding, no trim (v1 semantics, §1 / BR-30)."
    cost: >-
      The allowed-values rule (exact match, sorted values in the refusal) is restated in prose and attributed to BR-30. The comment also calls the sort "locale-default lexicographic". A default sort() orders by UTF-16 code units, so the prose is wrong as well as a second home. Code holds the rule in the same function.
    kind: restates
    correction: >-
      Remove the docstring and the inline comment by the comment route. The `domain.has(value)` check and the `[...domain].sort()` refusal hold the fact.
    node: rules/knowledge-base/attribute-value-in-allowed-values
