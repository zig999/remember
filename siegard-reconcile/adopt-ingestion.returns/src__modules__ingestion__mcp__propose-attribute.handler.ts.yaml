looked_past: >-
  The `!envelope.ok` branch stores a service refusal as the tool call's `rejected` result. In handler-base.ts, `runIngestHandler` returns it as `{ ok: true, result }`, so whether MCP and REST answer refusals alike depends on the service and transport files, outside this set. This file also never format-checks `llm_run_id`.
