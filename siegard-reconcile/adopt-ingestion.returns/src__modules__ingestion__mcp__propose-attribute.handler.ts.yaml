findings:
  - file: src/modules/ingestion/mcp/propose-attribute.handler.ts
    where: >-
      the header comment, lines 1-9
    evidence: >-
      "Thin transport adapter. Business logic — including the full 5-layer
      // validation pipeline (BR-13) — lives in
      // `service/propose-attribute.service.ts`."
    cost: >-
      The comment says the attribute proposal goes through a "5-layer" pipeline. The node fixes
      seven ordered checks that stop at the first failure. A reader who trusts the comment counts
      layers where the node counts checks. The comment is prose no system emits. The handler forwards
      to the service with `proposeAttributeService(client, input, ...)`, and the comment says the
      pipeline is there. I did not open that file, so I did not confirm that it holds the check order.
    kind: restates
    correction: >-
      Remove the comment through the comment route, then reconcile this file. Do not refresh the
      count. The check order belongs to the node and to whatever code applies it.
    node: rules/knowledge-base/attribute-proposal-check-order
