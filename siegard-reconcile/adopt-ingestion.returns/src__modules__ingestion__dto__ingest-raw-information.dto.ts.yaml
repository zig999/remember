findings:
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      header comment, lines 1-7
    evidence: >-
      A failed parse becomes a `ZodError` and the global error handler maps it to
      `422 VALIDATION_INVALID_FORMAT`.
    cost: >-
      The comment states, outside behavior, the refusal that the ingestion contract already holds. The code that
      applies it is the 422 entry for VALIDATION_INVALID_FORMAT at backend/src/shared/error-mapping.ts:91. A reader
      of this file sees a second statement of the refusal. If the contract's answer changes, this comment goes
      stale without any check noticing.
    kind: restates
    correction: >-
      Remove the comment. The contract node binds the refusal, and the mapping code sits in
      backend/src/shared/error-mapping.ts.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      doc comment on IngestRawInformationRequestSchema, `content` bullet, lines 16-19
    evidence: >-
      `content`: minLength 1 (empty document is meaningless), maxLength 10 MiB
       in code points
    cost: >-
      The comment gives the content bound in code points. The node fixes it at UTF-16 code units, and
      `.max(10 * 1024 * 1024, ...)` on line 30 counts UTF-16 units. A reader who trusts the comment expects
      astral characters to count once, when each counts twice. The code holds the bound, so the comment is a
      second and inexact home for it.
    kind: restates
    correction: >-
      Remove the comment. The bound is held by the `.min(1)` and `.max(10 * 1024 * 1024)` calls and by the
      content-length node.
    node: rules/knowledge-base/content-length
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      doc comment, `storage_ref` bullet, line 19
    evidence: >-
      `storage_ref`: nullable; must be `null` in v1.0.0 (BR carve-out, A5).
    cost: >-
      The comment claims a domain rule, that a raw information's storage reference is null in v1.0.0. No node
      holds it, and the schema (`storage_ref: z.string().nullable().optional()`) accepts any string. The
      repository INSERT in backend/src/modules/ingestion/repository/ingestion.repository.ts names no
      `storage_ref` column, so the value is silently dropped rather than refused. The next reader looks in the
      specification for what a supplied storage reference does and finds nothing.
    kind: unstated
    correction: >-
      Analysis would give the raw-information node, or a rule constraining it, the decision on whether a caller
      may supply a storage reference. Then remove the comment.
    node: domain/knowledge-base/raw-information
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      doc comment, `model` and `prompt_version` bullet, lines 22-23
    evidence: >-
      `model` and `prompt_version`: parts of the `llm_run.idempotency_key`
       composition (BR-08, A18).
    cost: >-
      The comment states part of how the idempotency key is composed. The idempotency-key node holds that fact,
      and code holds it in composeIdempotencyKey, imported in
      backend/src/modules/ingestion/service/ingestion.service.ts from ../hash.js. Prose here duplicates the rule
      and will not follow it if the composition changes.
    kind: restates
    correction: >-
      Remove the comment. The composition is held by the idempotency-key node and by `composeIdempotencyKey`.
    node: rules/knowledge-base/idempotency-key
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      doc comment on `original_input`, lines 35-39
    evidence: >-
      Never
         factored into `content_hash`.
    cost: >-
      The comment restates what the content-hash node fixes, that the hash covers the content. The computation
      is `sha256Hex(input.content)` in backend/src/modules/ingestion/service/ingestion.service.ts. The prose is
      a second home for the rule, with nothing tying it to the node.
    kind: restates
    correction: >-
      Remove the comment. The hash rule is held by the content-hash-is-sha256 node and by the computation in
      ingestion.service.ts.
    node: rules/knowledge-base/content-hash-is-sha256
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      doc comment on `original_input`, lines 35-39
    evidence: >-
      Capped at 10 MiB to match `content`.
    cost: >-
      The comment restates the original-input bound. The code holds it on line 42 with
      `.max(10 * 1024 * 1024, "original_input must not exceed 10 MiB")`. The prose is a second home for the
      value.
    kind: restates
    correction: >-
      Remove the comment. The bound is held by the `.max(...)` call and by the original-input-length node.
    node: rules/knowledge-base/original-input-length
