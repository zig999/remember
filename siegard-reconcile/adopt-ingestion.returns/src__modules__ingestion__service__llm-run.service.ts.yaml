findings:
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the header comment, lines 6-12 ("Errors:" list)
    evidence: >-
      //   - `RunNotRetryableError` -> 409 BUSINESS_RUN_NOT_RETRYABLE.
      //   - `RunNotRunningError`   -> 409 BUSINESS_RUN_NOT_RUNNING (TC-13 propose-*
    cost: >-
      The status and error code of both refusals are stated in a second place outside behavior. The classes below set the same values, and error-mapping.ts maps them to 409. When the contract's answer changes, this list keeps saying the old one and nothing reads it.
    kind: restates
    correction: >-
      Remove the comment. The values stay held by the two classes at lines 44-84 and by `BUSINESS_RUN_NOT_RETRYABLE: 409` and `BUSINESS_RUN_NOT_RUNNING: 409` in src/shared/error-mapping.ts.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the docstring of RunNotRunningError, lines 58-69
    evidence: >-
      On the MCP transport the same situation surfaces as a
      `BUSINESS_RUN_NOT_RUNNING` envelope via `assertRunIsRunning` in
      `handler-base.ts` — REST + MCP are now byte-identical on this condition
      per the P2.1 namespaced taxonomy.
    cost: >-
      The claim that both transports answer alike is made only by this prose. What holds it is code in two other files: `assertRunIsRunning` in handler-base.ts emits "BUSINESS_RUN_NOT_RUNNING", and ingestion.routes.ts throws `RunNotRunningError`. A reader looking for where the two transports are kept alike finds a comment rather than the constraint.
    kind: restates
    correction: >-
      Remove the docstring's transport paragraph. The code in src/modules/ingestion/mcp/handler-base.ts and src/modules/ingestion/routes/ingestion.routes.ts keeps holding the fact.
    node: constraints/ingestion-transports-answer-alike
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the BR-33 comments in getLlmRunById (lines 97-102) and toLlmRunResponse (lines 254-256)
    evidence: >-
      // BR-33 — attach `affected_nodes` ONLY when the run is `completed`. The
      // field is the snapshot of the run at completion; a `running` or `failed`
      // run does not surface a partial list.
    cost: >-
      The rule that only a completed run lists affected nodes is written in prose and also enforced by `if (row.status === "completed")`. Two homes exist for one fact, and only the code is checked against the node.
    kind: restates
    correction: >-
      Remove both comments. The branch at `if (row.status === "completed")` keeps holding the rule.
    node: rules/knowledge-base/affected-nodes-only-when-completed
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the try/catch around deriveAffectedNodes in getLlmRunById, lines 109-117
    evidence: >-
      } catch {
        // Best-effort — omit the field on a transient read failure; the
        // caller can re-derive on the next poll.
        affectedNodes = undefined;
      }
    cost: >-
      The code makes a rule the specification never states. A completed run's read can answer 200 with no affected nodes when the derivation fails, and the failure is neither logged nor surfaced. The contract says a completed run's read carries its affected nodes. A reader who trusts the node will treat a missing list as "none affected", and nothing tells them the code can omit it on error.
    kind: unstated
    correction: >-
      Analysis would have to decide whether a completed run's read may omit its affected nodes when they cannot be derived, or must refuse. The decision belongs in the read-llm-run answer of the ingestion contract or in a rule of its own.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the docstring of retryLlmRun, line 192 ("Orphan-fragment cleanup happens inside `retryLlmRunRow` in the same TX.")
    evidence: >-
      3. Orphan-fragment cleanup happens inside `retryLlmRunRow` in the same TX.
    cost: >-
      The consequence of a retry for orphaned fragments is stated in prose here, while the code that does it sits in another file. This file never touches fragments, so a reader of this file cannot tell whether the claim still holds.
    kind: restates
    correction: >-
      Remove the item. The fact is held by the `UPDATE information_fragment SET status = 'rejected'` statement in retryLlmRunRow in src/modules/ingestion/repository/llm-run.repository.ts.
    node: rules/knowledge-base/retry-rejects-orphaned-fragments
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the docstring of retryLlmRun, lines 187-192 (items 1 and 2 of the order)
    evidence: >-
      1. Pre-read to distinguish "not found" (404) from "wrong status" (409).
      2. Atomic `UPDATE ... WHERE status = 'failed'`; rowCount === 0 means the
         pre-read showed `failed` but a concurrent transition raced us -> 409.
    cost: >-
      The retry transition (only a failed run may return to running) is restated in prose next to the code that enforces it, in `existing.status !== "failed"` and in the `WHERE id = $1 AND status = 'failed'` update in the repository. It is a second home for the state machine that nothing checks.
    kind: restates
    correction: >-
      Remove the items. The guard at `if (existing.status !== "failed")` and the repository's conditional UPDATE keep holding the transition.
    node: rules/knowledge-base/llm-run-lifecycle
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the race branch of retryLlmRun, lines 209-215
    evidence: >-
      const currentStatus = refreshed?.status ?? "running";
      if (currentStatus === "failed") {
        // Should not happen — log internally and surface as 409 conservatively.
        throw new RunNotRetryableError(llmRunId, "running");
      }
    cost: >-
      The contract says the refusal names the run's status. Here the run was just read as `failed`, and the 409 names `running` anyway. A failed run, which the lifecycle allows to be retried, is refused with a status it does not have. The same branch answers `running` when the row has vanished (`?? "running"`).
    kind: contradicts
    correction: >-
      The refusal would have to name the status actually read. What a retry should do when the row is `failed` again is a decision for whoever owns the lifecycle.
    node: contracts/knowledge-base/ingestion
