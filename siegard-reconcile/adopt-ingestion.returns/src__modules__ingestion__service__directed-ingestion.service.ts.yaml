    evidence: >-
      "// - Forces `confidence = 1.0` and defaults `valid_from_basis = 'stated'`
      //   when the caller omits it (BR-34 step 4)." and "`confidence = 1.0`; `valid_from_basis`
      defaults to `'stated'` when omitted by caller (BR-34 Defaults matrix)."
    cost: >-
      The full-confidence rule is stated in prose beside the three `confidence: 1.0` literals that
