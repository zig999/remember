findings:
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      header comment, lines 5-8, and the docblock on synthesiseContent, lines 834-838
    evidence: >-
      "// `RawInformation` (stamped with a nonce so the `content_hash` is unique per
      // call — no `noop_existing` branch on this path)" and "Concatenates
      `fragments[].text` with `[ref]` prefixes; appends a trailing nonce line so
      the resulting `content_hash` is unique per call"
    cost: >-
      The content-composition rule (reference and text per fragment, label, moment, nonce) is written
      in prose above the code that holds it (synthesiseContent, lines 839-852). A reader can take the
      comment for the authority, and the two can drift apart without anything noticing.
    kind: restates
    correction: >-
      Remove both comments. The rule is held by rules/knowledge-base/directed-source-content and by
      synthesiseContent.
    node: rules/knowledge-base/directed-source-content
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      header comment, lines 9-11
    evidence: >-
      "// the items in dependency order (fragments → nodes → attributes → links)
      // through the existing `propose_*` handlers"
    cost: >-
      The dispatch order is stated in prose while the loops 3a-3d hold it. The order can change in
      the code and the comment will still claim the old one.
    kind: restates
    correction: >-
      Remove the comment. The order is held by rules/knowledge-base/directed-dispatch-order and by
      the sequence of loops 3a-3d in this file.
    node: rules/knowledge-base/directed-dispatch-order
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      header comment, lines 14-19, and the constant docblocks, lines 83-87
    evidence: >-
      "// NEVER calls Anthropic — the directed path is `model = 'directed'`,
      // `prompt_version = 'directed-v1'` (sentinels; ...)" and "/** Sentinel `model` for
      every directed run — NEVER an Anthropic model id. */"
    cost: >-
      The run's model and prompt-version values are also stated as prose. The code holds them at
      DIRECTED_MODEL, DIRECTED_PROMPT_VERSION and the ingestRaw call (lines 360-361). A reader looking
      for the decision finds three places.
    kind: restates
    correction: >-
      Remove the header sentence and the two docblocks. The code holds the fact, and
      rules/knowledge-base/directed-ingestion-run binds it.
    node: rules/knowledge-base/directed-ingestion-run
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      header comment, lines 21-24, and step 4 comment, line 763
    evidence: >-
      "Failure to open the run is the only `failed` terminal outcome; otherwise the run always lands
      `completed`." and "// ---- Step 4 — close the run (always 'completed' on this path) ----"
    cost: >-
      The completes-whatever-the-items rule is restated in prose. The code holds it in
      closeRunCompletedSafe, which passes outcome "completed" unconditionally.
    kind: restates
    correction: >-
      Remove both comments. rules/knowledge-base/directed-run-completes binds the fact, and the
      closeLlmRunRow call holds it.
    node: rules/knowledge-base/directed-run-completes
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
