  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      docblock on the sourceExcerpt dep, lines 274-281, and the comment at lines 362-365
    evidence: >-
      "Forwarded as
       * `original_input` to `ingestRawInformation`; NEVER mixed into
       * `synthesiseContent` (so `content_hash` is unaffected)."
    cost: >-
      The original-input rule is restated as prose. The code holds it at
      `original_input: deps.sourceExcerpt ?? null`.
    kind: restates
    correction: >-
      Remove both comments. rules/knowledge-base/directed-turn-is-original-input binds the fact, and
      line 366 holds it.
    node: rules/knowledge-base/directed-turn-is-original-input
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the intakeMetadata construction, lines 339-344
    evidence: >-
      "const intakeMetadata: Record<string, unknown> = {
         directed: true,
       };
       if (payload.source_label !== undefined) {
         intakeMetadata.source_label = payload.source_label;
       }"
    cost: >-
      The raw information's metadata carries a `directed: true` marker and the label under
      `source_label`. No node holds either key. The next reader who filters or reports on directed
      sources looks in the specification, finds nothing, and takes the code as the decision.
    kind: unstated
    correction: >-
      Give the metadata a directed ingestion writes a home in the specification. The natural place is
      rules/knowledge-base/directed-source-content or domain/knowledge-base/raw-information.
    node: rules/knowledge-base/directed-source-content
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the metadataPointer merge, lines 345-351, and its dep type, lines 282-294
    evidence: >-
      "if (deps.metadataPointer !== undefined) {
         intakeMetadata.conversation_id = deps.metadataPointer.conversation_id;
         intakeMetadata.message_id = deps.metadataPointer.message_id;
       }"
    cost: >-
      A directed ingestion made from a chat turn records a pointer to the chat conversation and
      message inside the raw information's metadata. The spec holds the turn's excerpt as the
      original input but says nothing of this pointer or its key names. The link from a raw
      information back to its chat row lives only here.
    kind: unstated
    correction: >-
      State in the specification that a chat-turn directed ingestion records the conversation and
      message identities in its metadata. rules/knowledge-base/directed-turn-is-original-input is the
      neighbouring node.
    node: rules/knowledge-base/directed-turn-is-original-input
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the intake catch block, lines 369-391
    evidence: >-
      "code: \"SYSTEM_SERVICE_UNAVAILABLE\",
       message: \"A backing service is temporarily unavailable.\"" and "code: \"SYSTEM_INTERNAL_ERROR\",
       message: \"Failed to persist the directed payload before dispatch.\""
    cost: >-
      The contract's ingest-directed operation lists only validation refusals. The refusal a caller
      gets when persisting the payload fails (which code, and the split between an unavailable
      backing service and an internal error) is stated only here. A client reading the contract
      cannot know these answers exist.
    kind: unstated
    correction: >-
      Add the intake-failure refusals, with their error codes, to the ingest-directed operation in
      contracts/knowledge-base/ingestion.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the anchor comment, lines 449-454
    evidence: >-
      "// All fragments are anchored to the first chunk of the synthesised content.
       // The chunker may produce multiple chunks for long payloads, but for the
       // anti-hallucination check (BR-18) any chunk of the run's source is a valid
       // anchor — we deliberately pick the first one for determinism."
    cost: >-
      The first-chunk rule is restated as prose. The code holds it in `const anchorChunkId =
      chunks[0]!.id;` and `chunk_ids: [anchorChunkId]`.
    kind: restates
    correction: >-
      Remove the comment. rules/knowledge-base/directed-fragments-anchor-first-chunk binds the fact.
    node: rules/knowledge-base/directed-fragments-anchor-first-chunk
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the pin branch comment, lines 511-512, and the docblock on verifyNodePin, lines 854-858
    evidence: >-
      "// 3b. Nodes — `node_id` pin bypasses BR-25 fuzzy resolution; otherwise
       //     delegate to `propose_node`" and "the node row must exist AND its
       * `status` must be `'active'`."
    cost: >-
      The pinned-node rule is restated as prose. The code holds it in verifyNodePin
      (`row.status !== "active"`) and in the `if (item.node_id !== undefined)` branch.
    kind: restates
    correction: >-
      Remove both comments. rules/knowledge-base/directed-pinned-node binds the fact.
    node: rules/knowledge-base/directed-pinned-node
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the pin-failure branch, lines 533-553, and verifyNodePin details, lines 877-890
    evidence: >-
      "const pinCode =
         (pinResult.details as { reason?: unknown }).reason === \"not_found\"
           ? \"RESOURCE_NOT_FOUND\"
           : \"VALIDATION_INVALID_FORMAT\";" and "details: { reason: \"inactive\", current_status: row.status }"
    cost: >-
      A pinned node that is absent is reported with RESOURCE_NOT_FOUND. One that is not active is
      reported with VALIDATION_INVALID_FORMAT, and the details carry a `reason` and a
      `current_status`. The node says only that the item is rejected. The codes live only here,
      and the split has no rationale in the specification.
    kind: unstated
    correction: >-
      State in rules/knowledge-base/directed-pinned-node, or in the ingest-directed operation, what
      answer a pinned node that is absent or inactive gets.
    node: rules/knowledge-base/directed-pinned-node
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the pin branch of the node loop, lines 513-555
    evidence: >-
      "if (item.node_id !== undefined) {
         const pinResult = await verifyPin(deps.pool, item.node_id);
         if (pinResult.kind === \"ok\") {
           refToNodeId.set(item.ref, item.node_id);"
    cost: >-
      A pinned node item, taken or refused, never reaches proposeNode, the only place a tool call is
      written. Every other dispatched item leaves one. The node says every proposal made within a run
      is recorded as a tool call, whether taken or refused. A refused pin therefore leaves no
      record, and the run's audit trail has a gap for the owner's own input.
    kind: contradicts
    correction: >-
      Record a tool call for a pinned node item, or state in the specification that a pin is not a
      proposal and so is not audited. Which one is the owner's decision.
    node: rules/knowledge-base/every-proposal-audited
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the schemas for attribute and link items, lines 136-156, and refForAttribute and refForLink, lines 929-934
    evidence: >-
      "export const DirectedAttributeItemSchema = z.object({
         node_ref: DirectedRefSchema,
         key: z.string().min(1)," and "return `${item.node_ref}.${item.key}`;"
    cost: >-
      The node gives every directed item, attributes and links included, a required reference. Here
      an attribute or link item accepts none, and the report entry's reference is composed from its
      parts. An owner cannot name their attribute or link, and the reference-length rule cannot
      apply to what is reported.
    kind: contradicts
    correction: >-
      Either give attribute and link items a `ref` as domain/knowledge-base/directed-item states, or
      change the node to say that only fragments and nodes carry one.
    node: domain/knowledge-base/directed-item
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      refForAttribute and refForLink, lines 929-934
    evidence: >-
      "return `${item.node_ref}.${item.key}`;" and
      "return `${item.source_ref}->${item.link_type}->${item.target_ref}`;"
    cost: >-
      The format of the reference a report gives an attribute or a link is a value no node holds. A
      client reading the report has to learn it from this file.
    kind: unstated
    correction: >-
      State in domain/knowledge-base/directed-item how an attribute's or a link's reference is
      reported, if the owner does not supply one.
    node: domain/knowledge-base/directed-item
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the affected-nodes resolution catch, lines 767-787
    evidence: >-
      "// resolvedAffected stays []; the run is still completed."
    cost: >-
      When resolving the affected nodes fails, the response carries an empty `affected_nodes` list
      on a completed run and the failure goes only to a log. The affected-nodes nodes hold no such
      degradation, so the caller cannot tell an empty list from a failed lookup.
    kind: unstated
    correction: >-
      State in rules/knowledge-base/affected-nodes-of-a-run what a directed ingestion answers when
      the affected nodes cannot be resolved.
    node: rules/knowledge-base/affected-nodes-of-a-run
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      closeRunCompletedSafe, lines 1006-1034, and readClosedRunSafe, lines 1041-1091
    evidence: >-
      "const fallback = {
         started_at: new Date(0).toISOString(),
         finished_at: new Date(0).toISOString(),
         attempts: 1,
       };" and "/** Close the run as `completed` in a fresh short transaction. Swallow errors"
    cost: >-
      When closing or reading the run fails, the response still says `status: "completed"` and
      carries the epoch as its start and finish times, with attempts 1. The times are invented
      values no node holds. The stored run may still be running, and the caller cannot tell.
    kind: unstated
    correction: >-
      State in rules/knowledge-base/directed-run-completes what a directed ingestion answers when
      its run cannot be closed or read back.
    node: rules/knowledge-base/directed-run-completes
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      the docblock on classifyEnvelopeFailureStatus, lines 960-970
    evidence: >-
      "System-level failures (`SYSTEM_*` — e.g. `SYSTEM_INTERNAL_ERROR`,
       `SYSTEM_SERVICE_UNAVAILABLE`) collapse to `'error'` ... Every other namespaced code ... is a
       layered-validation rejection and collapses to `'rejected'`."
    cost: >-
      The error-versus-rejected status rule is restated as prose. The code holds it in
      `envelope.error.code.startsWith("SYSTEM_") ? "error" : "rejected"`.
    kind: restates
    correction: >-
      Remove the docblock. rules/knowledge-base/directed-item-status binds the fact.
    node: rules/knowledge-base/directed-item-status
