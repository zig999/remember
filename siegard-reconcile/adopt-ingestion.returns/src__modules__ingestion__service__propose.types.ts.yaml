findings:
  - file: src/modules/ingestion/service/propose.types.ts
    where: >-
      the JSDoc comments above McpOk (line 14) and McpErr (line 20)
    evidence: >-
      "/** Success envelope (matches the MCP transport's `{ ok: true, result }` shape). */" and
      "/** Failure envelope (matches the MCP transport's `{ ok: false, error }` shape). */"
    cost: >-
      The ingestion contract holds the `{ ok: true, result }` and `{ ok: false, error }` answers. This file's `McpOk` and `McpErr` interfaces already declare them in code. The comments say the same thing a second time, in prose that no check reaches. When the contract moves, they keep claiming a shape it no longer holds.
    kind: restates
    correction: >-
      Remove the two comments through the comment route. The interfaces at lines 15-28 hold the fact, and the contract node holds it for the specification.
    node: contracts/knowledge-base/ingestion
