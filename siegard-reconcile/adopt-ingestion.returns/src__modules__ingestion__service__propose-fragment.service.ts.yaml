looked_past: >-
  The header comment's claim that Zod enforces text length, confidence range and non-empty chunk_ids at the boundary is prose about code in the DTO file, which is outside this file set, so I did not classify it. Separately, `count(*)` over `id = ANY($1::uuid[])` counts distinct rows, so a `chunk_ids` list with a repeated id is refused as RESOURCE_NOT_FOUND. That is a code-review matter, not a domain fact.
