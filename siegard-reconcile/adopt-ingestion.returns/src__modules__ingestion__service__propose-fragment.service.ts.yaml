findings:
  - file: src/modules/ingestion/service/propose-fragment.service.ts
    where: >-
      the comment block inside the mismatch branch, lines 50-55
    evidence: >-
      // "  - chunk_id resolves to no row -> RESOURCE_NOT_FOUND (UC-08 alt 2b)."
    cost: >-
      The refusal for a cited chunk that does not exist is written a second time as prose beside the code that
      enforces it. If the rule moves, the comment is still there saying the old thing. A later reader may take it
      for a second authority on which code is refused.
    kind: restates
    correction: >-
      Remove the comment. The `throw new ValidationFailure("RESOURCE_NOT_FOUND", ...)` at lines 62-66 holds the
      fact, and the node holds it in the specification.
    node: rules/knowledge-base/fragment-chunks-exist
  - file: src/modules/ingestion/service/propose-fragment.service.ts
    where: >-
      the comment block inside the mismatch branch, lines 50-55
    evidence: >-
      // "  - chunk_id belongs to a different source -> VALIDATION_INVALID_FORMAT"
    cost: >-
      The refusal for a cited chunk outside the run's raw information is written a second time as prose beside the
      code that enforces it. The comment and the node can drift apart without anything noticing.
    kind: restates
    correction: >-
      Remove the comment. The `throw new ValidationFailure("VALIDATION_INVALID_FORMAT", ...)` at lines 68-75 holds
      the fact, and the node holds it in the specification.
    node: rules/knowledge-base/fragment-chunks-in-run-source
