findings:
  - file: src/modules/ingestion/validation/errors.ts
    where: >-
      the header comment, lines 3-8 (BR-13 paragraph)
    evidence: >-
      // BR-13 of `ingestion.back.md`: rejection is a business RESULT, not a
      // programmer exception. Each layer throws a `ValidationFailure` with the
      // matching MCP envelope code; the handler catches it, persists the
      // `tool_call` row with `validation_outcome = 'rejected'`, and returns the
      // MCP error envelope.
    cost: >-
      The refused-proposal outcome is described a second time in prose that no running system emits. The behavior is held in code in handler-base.ts (`isValidationFailure(err)` at line 162, then `safeWriteAuditOnRollback(args.deps, args.tool_name, args.input, errEnv, "rejected")` at line 181). A reader who trusts this comment has a second account of the rule that does not move when the node moves.
    kind: restates
    correction: >-
      Remove the paragraph. The fact is held by the tool-call-validation-outcome node and by the handler in src/modules/ingestion/mcp/handler-base.ts.
    node: rules/knowledge-base/tool-call-validation-outcome
  - file: src/modules/ingestion/validation/errors.ts
    where: >-
      the header comment, lines 27-29 (`BUSINESS_RUN_NOT_RUNNING` paragraph)
    evidence: >-
      // The extra `BUSINESS_RUN_NOT_RUNNING` code is emitted by the MCP handler
      // guard when the ambient `llm_run_id` points to a row whose `status` is not
      // `'running'` (BR-21 / catalog Ingestion section).
    cost: >-
      The rule that a proposal is taken only within a running run is restated in prose. Code holds it in another file (src/modules/ingestion/mcp/handler-base.ts, line 117 raises "BUSINESS_RUN_NOT_RUNNING"), so the comment is a second home that can drift from the node.
    kind: restates
    correction: >-
      Remove the paragraph. The rule sits in the proposal-requires-running-run node, and the refusal in the ingestion contract.
    node: rules/knowledge-base/proposal-requires-running-run
  - file: src/modules/ingestion/validation/errors.ts
    where: >-
      the `VALIDATION_REQUIRED_FIELD` member of `McpEnvelopeErrorCode`, line 33 (mapped at comment line 15)
    evidence: >-
      | "VALIDATION_REQUIRED_FIELD"
      ...
      //   STRUCTURAL_INVALID       -> VALIDATION_REQUIRED_FIELD  (Zod missing)
    cost: >-
      The file declares that ingestion validation may refuse with a code for a missing field. The ingestion contract names only VALIDATION_INVALID_FORMAT for "The proposal is missing a required field or holds one of the wrong shape", and no node in the specification names VALIDATION_REQUIRED_FIELD. The code becomes the only place this refusal code lives, and the two transports could answer a missing field differently.
    kind: unstated
    correction: >-
      Either the analysis gives the ingestion contract a refusal for a missing field that names this code, or the member leaves the union.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/validation/errors.ts
    where: >-
      the `VALIDATION_OUT_OF_RANGE` member of `McpEnvelopeErrorCode`, line 35 (mapped at comment line 17)
    evidence: >-
      | "VALIDATION_OUT_OF_RANGE"
      ...
      //                            -> VALIDATION_OUT_OF_RANGE    (numeric bound)
    cost: >-
      The ingestion pipeline declares a numeric-bound refusal code that no ingestion operation in the contract uses. The ingestion contract answers an out-of-range confidence (proposal-confidence-range) and the page limit and offset of the tool-call listing with VALIDATION_INVALID_FORMAT. The retrieval contract uses VALIDATION_OUT_OF_RANGE for its own page bounds only. The code lives here as an ingestion decision that a reader would look for in the specification and not find.
    kind: unstated
    correction: >-
      Either the analysis records where in ingestion a numeric bound answers VALIDATION_OUT_OF_RANGE, or the member leaves the union.
    node: contracts/knowledge-base/ingestion
