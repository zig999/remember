findings:
  - file: src/modules/ingestion/service/affected-nodes.ts
    where: >-
      header comment, lines 19-25 (the CONTRACT block)
    evidence: >-
      // CONTRACT (mirrors BR-33 — additive, optional):
      //   `affected_nodes` is attached to a `LlmRunResponse` ONLY when the run's
      //   status === 'completed'.
    cost: >-
      The comment presents the completed-only rule as this module's contract, but nothing in this file checks a run's status. A reader who follows the comment looks for the gate here and does not find it. The rule is held by the callers and by the node.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by code outside this file: `if (row.status === "completed") {` in src/modules/ingestion/service/llm-run.service.ts (line 104) and `if (row.status === "completed" && affectedNodes !== undefined) {` in src/modules/ingestion/service/extraction.service.ts (line 941).
    node: rules/knowledge-base/affected-nodes-only-when-completed
  - file: src/modules/ingestion/service/affected-nodes.ts
    where: >-
      header comment, lines 27-30, and the comment inside isContributingOutcome, lines 79-86
    evidence: >-
      // `rejected` and `error` validation outcomes do NOT contribute (they did not
      // touch the graph). De-dup is by `node_id`; first-write-wins on the entry.
      // Iteration order on the final list is insertion order (deterministic by
      // per-chunk tool-use order).
    cost: >-
      The comments restate which nodes count as affected, and their order and de-duplication, in prose. This file's code also holds that (`isContributingOutcome`, `affectedIdsFromEnvelope` and the insertion-ordered `seen` Map). If the node moves, the comments go stale without any check reaching them.
    kind: restates
    correction: >-
      Remove the comments. The fact is held in this file by `affectedIdsFromEnvelope`, `isContributingOutcome` and `createAffectedNodeCollector`.
    node: rules/knowledge-base/affected-nodes-of-a-run
  - file: src/modules/ingestion/service/affected-nodes.ts
    where: >-
      resolveAffectedNodes, the merge check at lines 271-276 and 309, and the SQL selecting `kn.status` at line 255
    evidence: >-
      row.status === "merged_into" &&
      row.merged_into_node_id !== null &&
      ...
      if (row.status === "merged_into" && row.merged_into_node_id !== null) {
    cost: >-
      The node status enumeration holds `merged`, not `merged_into`: the specification's node-status lists active, needs-review, merged and deleted, and migrations/0001_init.sql declares `CREATE TYPE node_status AS ENUM ('active', 'needs_review', 'merged', 'deleted')`. The comparison never matches a stored row. A merged node is therefore listed under its own identity and name, not as the node it was merged into, and the survivor lookup never runs. That is the opposite of what the merge-following rule states, and the comments in the file claim the behaviour works.
    kind: contradicts
    correction: >-
      The merged check has to compare against the status value the enumeration actually holds (`merged`).
    node: rules/knowledge-base/affected-nodes-follow-merges
  - file: src/modules/ingestion/service/affected-nodes.ts
    where: >-
      resolveAffectedNodes, Step 3, lines 306-313, with the comment at lines 229-231
    evidence: >-
      let row = byId.get(id);
      if (row === undefined) continue;
      ...
      if (survivor === undefined) continue;
    cost: >-
      The code drops an affected id that no longer resolves to a node row, and the comment calls this "skipped silently". The affected-nodes node says nothing about an affected node that cannot be found, so the omission is a rule that exists only in this file. The next reader looks in the specification for what a run's affected nodes exclude and finds no such exclusion.
    kind: unstated
    correction: >-
      Analysis would need to give affected-nodes-of-a-run (or a sibling node) the rule for an affected id that no longer resolves.
    node: rules/knowledge-base/affected-nodes-of-a-run
