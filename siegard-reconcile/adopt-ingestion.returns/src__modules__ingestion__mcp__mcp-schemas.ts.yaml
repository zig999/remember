findings:
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      StartAsyncIngestionMcpInputSchema, lines 81-123 (with the header comment at lines 71-79)
    evidence: >-
      "The full plain text of the document to ingest. Paste the raw content; the server chunks it, runs structured extraction in the BACKGROUND, and persists the knowledge graph with provenance."
    cost: >-
      A tool that ingests a document and extracts it in the background is a capability no node holds. The published ingestion contract lists ingest-document as the one-shot operation and has no background variant. The schema is exported, but the toolset comment at ingest-toolset.ts:287 calls the tool retired, so it is a stale declaration of an operation the specification never stated. The next reader looks for this operation in the contract and finds nothing.
    kind: unstated
    correction: >-
      Either the analysis gives the background-ingestion operation a node in the ingestion contract, or the retired schema leaves the file.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      HealthMcpInputSchema, lines 159-171 (registered as the `health` tool at ingest-toolset.ts:325)
    evidence: >-
      "`health` — liveness + DB-reachability probe (no args)." and `export const HealthMcpInputSchema = z.object({});`
    cost: >-
      A liveness and database-reachability tool is exposed on the ingest toolset. No operation in the ingestion contract names it or states what it answers, so this file and its toolset are the only place the tool is recorded.
    kind: unstated
    correction: >-
      Give the health probe an operation in a contract node, or record it as outside the business surface.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      comment above GetIngestionStatusOutputSchema, lines 199-203, and its docstring, lines 227-233
    evidence: >-
      "It is attached ONLY when `result.status === 'completed'`; on `running` / `failed` runs the field is absent." and "populated on `status === 'completed'` ... absent otherwise."
    cost: >-
      The when-completed rule is stated a second time in prose beside a schema that only says `.optional()`. Code enforces the rule in backend/src/modules/ingestion/service/llm-run.service.ts (`if (row.status === "completed") {` … `return { ...base, affected_nodes: [...affectedNodes] };`). If the node changes, this prose stays behind as a second, unbound statement of it.
    kind: restates
    correction: >-
      Remove the comment text. The pair conforms where llm-run.service.ts holds the rule.
    node: rules/knowledge-base/affected-nodes-only-when-completed
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      GetIngestionStatusOutputSchema with GetIngestionStatusSummarySchema and AffectedNodeOutputSchema, lines 206-249
    evidence: >-
      "It mirrors `LlmRunResponseSchema` (`dto/llm-run.dto.ts`) plus the OPTIONAL `affected_nodes` field" — `status: z.enum(["running", "completed", "failed"]),` `idempotency_key: z.string().regex(/^[0-9a-f]{64}$/),` `attempts: z.number().int().positive(),`
    cost: >-
      The read-llm-run answer (run identity, status vocabulary, counters, idempotency-key form, affected nodes) is declared here a second time. The running copy is `LlmRunResponseSchema` in dto/llm-run.dto.ts. Nothing in the running code imports this one; only mcp-schemas-affected-nodes.spec.ts does. When the contract moves, the copy that gets updated decides which one the tests pin, and no bind reaches the other.
    kind: contradicts
    correction: >-
      Keep one declaration of the run read shape (the DTO the toolset already uses) and drop this mirror, or have the tests import the DTO.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      comment lines 270-273 and 292-296 (ingest_directed header)
    evidence: >-
      "the server opens a `RawInformation` + `LLMRun` (sentinels `model='directed'`, `prompt_version='directed-v1'`) ... No Anthropic round-trip." and "the orchestrator CREATES the run"
    cost: >-
      The directed run's model, prompt version and no-language-model rule are restated in prose that no system emits. Code holds them in directed-ingestion.service.ts (`export const DIRECTED_MODEL = "directed" as const;` and `export const DIRECTED_PROMPT_VERSION = "directed-v1" as const;`). A change to the node leaves this comment claiming the old sentinels.
    kind: restates
    correction: >-
      Remove the comment text. The service file holds the fact.
    node: rules/knowledge-base/directed-ingestion-run
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      comment lines 276-277 above IngestDirectedRefSchema, and its docstring at line 307
    evidence: >-
      "`ref` strings are local to the call (1..120 chars, must be non-empty)." and "Local ref string scoped to one call. 1..120 chars; never persisted, never returned."
    cost: >-
      The reference bounds are stated in prose while `const IngestDirectedRefSchema = z.string().min(1).max(120);` in this same file already holds them. The prose is a second home for the length that will drift if the node moves.
    kind: restates
    correction: >-
      Remove the comment text. The schema in this file holds the rule.
    node: rules/knowledge-base/directed-reference-length
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      comment lines 277-280 (the `confidence` absence in the ingest_directed header) and line 420
    evidence: >-
      "`confidence` is DELIBERATELY ABSENT from every item — the server forces `confidence = 1.0` on every dispatched `propose_*`" and "`confidence` MUST NOT appear in this schema by design."
    cost: >-
      The full-confidence rule is stated in prose. Code holds it in directed-ingestion.service.ts (`confidence: 1.0,` at the fragment, attribute and link dispatches). This file holds it only as an absent field. The comment is a second home outside behavior.
    kind: restates
    correction: >-
      Remove the comment text. directed-ingestion.service.ts holds the fact.
    node: rules/knowledge-base/directed-full-confidence
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      comment lines 281-283 above IngestDirectedValidFromBasisSchema, and its docstring at line 310
    evidence: >-
      "`valid_from_basis` is restricted to the public `'stated' | 'document'` enum (the `'received'` fallback is server-internal, never accepted from callers — BR-16)." and "Public `ValidFromBasis` enum (BR-16): the `'received'` fallback is server-internal."
    cost: >-
      The refusal of a caller-stated `received` is restated in prose, while `const IngestDirectedValidFromBasisSchema = z.enum(["stated", "document"]);` in this file already holds it. The comments cite BR-16 as the authority, so a reader is sent to a back-spec rule instead of the node.
    kind: restates
    correction: >-
      Remove the comment text. The enum in this file holds the rule.
    node: rules/knowledge-base/caller-never-states-received
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      comment lines 283-288 (the `node_id` pin in the ingest_directed header)
    evidence: >-
      "`node_id` on a node item is an OPTIONAL UUID PIN: when present, the handler skips BR-25 trigram resolution and uses the supplied id directly (rejected `STRUCTURAL_INVALID` if the id does not point to an `active` node)."
    cost: >-
      The pin's resolve-without-entity-resolution rule is restated in prose. Code holds it in directed-ingestion.service.ts, in the pin branch that reports `status: "accepted"` with `resolution: "matched_existing"`. The comment also names STRUCTURAL_INVALID for the failed pin, while that same service reports RESOURCE_NOT_FOUND or VALIDATION_INVALID_FORMAT. The prose is a second home and it is already wrong about the code.
    kind: restates
    correction: >-
      Remove the comment text. The service file holds the pin behavior.
    node: rules/knowledge-base/directed-pinned-node
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      comment lines 289-290 and the `source_label` description, lines 447-454
    evidence: >-
      "`source_label` is a free-form caller tag carried into `metadata.source_label` for audit; not parsed." and `.describe("Optional free-form caller tag (e.g. 'chat-turn-42'). Carried into the run's \`metadata.source_label\` for audit; not parsed by the server.")`
    cost: >-
      That the label is persisted under the key `metadata.source_label` on the raw information is a stored-data fact. The directed-ingestion node holds the label only as an optional string, and directed-source-content places it in the recorded content. The metadata key is written by directed-ingestion.service.ts (`intakeMetadata.source_label = payload.source_label;`) and told to callers by this description, but no node states it. It lives in code and in emitted text only.
    kind: unstated
    correction: >-
      Add to the directed-ingestion analysis where the label is kept on the raw information (the metadata key), or drop the claim from the emitted description.
    node: domain/knowledge-base/directed-ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedNodeItemSchema `node_id` description, lines 343-349
    evidence: >-
      "Rejected (VALIDATION_INVALID_FORMAT) if the id does not point to an active node."
    cost: >-
      The refusal code for a failed pin is told to callers by this description, but no node states it. The directed-pinned-node node says only that a pinned node resolves "provided the node exists and is active". The ingestion contract lists no refusal for it. The service answers RESOURCE_NOT_FOUND when the row is absent and VALIDATION_INVALID_FORMAT only when it is inactive, so the description is also narrower than the code. Callers act on a code that lives only in code and emitted text.
    kind: unstated
    correction: >-
      Give the failed-pin refusals (absent and inactive) and their error codes to the directed-pinned-node analysis or the ingest-directed operation, then let the description follow the node.
    node: rules/knowledge-base/directed-pinned-node
