findings:
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      The file-header comment (lines 9-12, step 4) and the runIngestHandler docstring (lines 129-130).
    evidence: >-
      "4. On `ValidationFailure`: ROLLBACK the business TX, then open a SEPARATE
      short TX to write the audit `tool_call` row (BR-23)." and "BR-23: even when the business transaction rolls back, the audit row is
      written via a SEPARATE short transaction (`insertToolCallStandalone`)."
    cost: >-
      Two comments state that a refused proposal records only its tool call, while the same file already does it in code (the ROLLBACK, then insertToolCallStandalone in safeWriteAuditOnRollback). A reader can take the comment for the place the rule is decided, and when the node moves `--check` does not reach a comment.
    kind: restates
    correction: >-
      Remove the header steps and the docstring sentence. The behavior is held by runIngestHandler in this file (the ROLLBACK, then safeWriteAuditOnRollback calling insertToolCallStandalone) and by the node.
    node: rules/knowledge-base/refused-proposal-records-only-its-tool-call
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      The deriveValidationOutcome docstring, lines 55-65, and the inline comment at lines 85-86.
    evidence: >-
      "Rule: when `result.outcome === 'rejected'` (the BELOW_CONFIDENCE_FLOOR
      branch returns this), the audit row is `'rejected'` per BR-17. Every other
      `ok:true` envelope is `'accepted'`."
    cost: >-
      The docstring states the mapping to a tool call's validation outcome, and it is also incomplete: it says every other envelope is `accepted`, while the switch maps consolidated, superseded_previous, disputed, needs_review and uncertain to themselves. The two homes can drift apart, and the docstring points to BR-17 and TC-010/TC-011 instead of to the node.
    kind: restates
    correction: >-
      Remove the docstring prose. The mapping is held by the switch in deriveValidationOutcome and by the node.
    node: rules/knowledge-base/tool-call-validation-outcome
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      The assertRunIsRunning docstring, lines 91-102.
    evidence: >-
      "- id does not match any LLMRun row -> `RESOURCE_NOT_FOUND`
      - id matches a row whose `status !== 'running'` -> `BUSINESS_RUN_NOT_RUNNING`"
    cost: >-
      The docstring restates which code answers a missing run and which a run that is not running. The same codes are thrown a few lines below, and the contract holds them. The docstring is a second home outside behavior.
    kind: restates
    correction: >-
      Remove the docstring prose. The branches at lines 108-121 hold the fact, together with the contract's propose-* answers.
    node: rules/knowledge-base/proposal-requires-running-run
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      The uncaught-error branch of runIngestHandler, lines 185-201.
    evidence: >-
      error: { code: "SYSTEM_INTERNAL_ERROR", message: "Internal error in MCP handler." }
    cost: >-
      The code decides that a failed proposal is answered with SYSTEM_INTERNAL_ERROR and this message, and recorded as `error`. The contract's propose-fragment, propose-node, propose-link and propose-attribute answers list no system-failure answer. The only SYSTEM_INTERNAL_ERROR answers the contract holds are for run-extraction and ingest-document. The next reader looks in the specification for how a failed proposal is answered and finds nothing.
    kind: unstated
    correction: >-
      Give the contract's propose-* operations a refusal for an unexpected failure, naming the code SYSTEM_INTERNAL_ERROR.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      The catch block of safeWriteAuditOnRollback, lines 227-238.
    evidence: >-
      "// Swallow — we already lost the business TX; failing to audit must not
      // surface a SECOND error to the LLM."
    cost: >-
      The code lets a refused or failed proposal end up with no tool call when the audit write fails: it logs `tool_call_audit_write_failed` and returns the original envelope. The node says every proposal is recorded as a tool call, and no node states this exception. A run's summary is counted from its tool calls, so such a proposal would be missing from its run's account with no rule saying that can happen.
    kind: unstated
    correction: >-
      State in the specification whether a proposal whose audit write fails is still answered and left unrecorded, or is instead answered with an error.
    node: rules/knowledge-base/every-proposal-audited
