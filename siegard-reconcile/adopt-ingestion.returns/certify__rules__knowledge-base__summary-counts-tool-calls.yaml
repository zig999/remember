certified:
  - node: rules/knowledge-base/summary-counts-tool-calls
    state: partial
    tests:
      - file: src/__tests__/integration/ingestion/llm-run-routes.spec.ts
        name: returns the run with an aggregated summary
      - file: src/__tests__/integration/ingestion/llm-run-routes.spec.ts
        name: returns 200 and bumps attempts on a failed run
      - file: src/__tests__/unit/ingestion/ingest-ops-tools.spec.ts
        name: returns the run status + summary for a known id
    why: >-
      Two parts are exercised. The first is counting by outcome: one accepted and one rejected
      tool call give accepted 1 and rejected 1, and pre-grouped rows of 23 accepted and 2 rejected
      come back as 23 and 2. The second is a zero for one outcome that has no tool call:
      `consolidated` is asserted to be 0 in both tests. Three things go unexercised. (1) Zero-fill
      is checked only for `consolidated`. No test checks any other outcome in the validation-outcome
      vocabulary, so a summary could drop one of those keys, or leave it undefined when no tool
      call has it, and every test in the set would still pass. (2) In both files the counting
      itself is done by the test's fake. The integration fake runs its own JavaScript GROUP BY
      filtered by run id, and the unit fake returns rows that are already grouped. So the proof
      shows how the service maps grouped rows onto the summary, not that the real query counts
      only this run's tool calls grouped by outcome. A query that grouped over every run, or
      counted something else, would pass. (3) The zeros in "returns 200 and bumps attempts on a
      failed run" (rejected 0, accepted 0 with no tool calls) are checked in passing, on the way
      to asserting retry behaviour. They are not marked as load-bearing, and they cover only two
      outcomes. No run with some tool calls is checked for zero on each outcome it lacks.
    remainder: testable
    remainder_why: >-
      One input against one expected result. The input is a run whose tool calls cover some of the
      validation outcomes, alongside another run's tool calls, stored in a real database rather than
      a fake that does the grouping itself. The expected result is a summary with an entry for every
      outcome in the validation-outcome vocabulary: the count of this run's tool calls for each
      outcome present, and 0 for each outcome absent, with nothing from the other run.
