findings:
  - file: src/modules/ingestion/dto/propose-fragment.dto.ts
    where: >-
      Header comment, line 3 ("Layer 1 (structural) of the 5-layer validation").
    evidence: >-
      // Layer 1 (structural) of the 5-layer validation. The DB CHECK on
    cost: >-
      The comment states that validation has five layers and that this file is the first. No node holds a
      five-layer division. The nodes hold check orders per proposal (`link-proposal-check-order`,
      `attribute-proposal-check-order`, `proposal-run-checks-first`), and there is none for a fragment proposal.
      A reader who takes the comment as the layering of validation will look for it in the specification and
      not find it.
    kind: unstated
    correction: >-
      Either the analysis gives the layering (and where a fragment proposal's checks sit in it) a node, or the
      comment is removed by the comment route.
  - file: src/modules/ingestion/dto/propose-fragment.dto.ts
    where: >-
      Header comment, lines 4-6, above `ProposeFragmentInputSchema`.
    evidence: >-
      // `information_fragment.text` (≤ 1000 chars) is mirrored here so the failure
      // surfaces as a typed `VALIDATION_INVALID_FORMAT` instead of a SQLSTATE
      // error from pg.
    cost: >-
      This is prose, not emitted text. It restates the 1-to-1000-character limit on a fragment's text, which
      `rules/knowledge-base/fragment-text-length` holds and `.min(1).max(1000)` on `text` in this file enforces.
      The limit now sits in the comment, the schema and the specification. If the limit moves, the comment
      becomes a second, stale statement of it that no check reaches.
    kind: restates
    correction: >-
      Remove the comment. The code that holds the fact is the `.min(1).max(1000)` on `text` in this file.
    node: rules/knowledge-base/fragment-text-length
  - file: src/modules/ingestion/dto/propose-fragment.dto.ts
    where: >-
      The `.describe(...)` on `text`, line 16.
    evidence: >-
      "The factual claim, quoted verbatim from the chunk. One assertion only; max 1000 characters."
    cost: >-
      This text is part of the tool's schema, so a model reads it as an instruction. It says a fragment's text
      is a verbatim quote of the chunk and holds one assertion only. No node holds either rule. The
      `information-fragment` node and `fragment-text-length` say only that the text is a string of 1 to 1000
      characters. Nothing in the specification says a fragment must be verbatim or single-assertion, so those
      rules live only in this description.
    kind: unstated
    correction: >-
      The analysis gives the verbatim-quote and one-assertion rules a home on the fragment node, or the
      description stops asserting them.
    node: domain/knowledge-base/information-fragment
  - file: src/modules/ingestion/dto/propose-fragment.dto.ts
    where: >-
      The `.describe(...)` on `confidence`, line 23.
    evidence: >-
      "Confidence 0–1 that this claim is correctly extracted. ≥0.75 stored active; 0.40–0.74 kept but flagged uncertain; <0.40 dropped."
    cost: >-
      This tells the calling model that a fragment is stored active at 0.75 or more and dropped below 0.40.
      `rules/knowledge-base/fragment-recorded-proposed` says a fragment proposal records the fragment in status
      proposed, whatever its confidence. The result type in the same file also declares `status: "proposed"`.
      The 0.75 and 0.40 thresholds belong to links and attributes (`new-assertion-status-from-confidence`,
      `below-confidence-floor-records-nothing`). The model is told a fragment can be dropped or active when the
      system records every fragment as proposed.
    kind: contradicts
    correction: >-
      The description should say what the node says: a fragment is recorded as proposed whatever its
      confidence. It should keep the thresholds for link and attribute proposals only.
    node: rules/knowledge-base/fragment-recorded-proposed
