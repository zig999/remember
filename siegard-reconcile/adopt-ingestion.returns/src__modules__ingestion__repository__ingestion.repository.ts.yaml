findings:
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      the docstring above RAW_INFORMATION_CONTENT_HASH_CONSTRAINT, line 27
    evidence: >-
      /** Constraint name used by the DB to enforce the content_hash uniqueness. */
    cost: >-
      The uniqueness of a content hash is stated in prose beside a constant. The node holds it, and the DDL enforces it at migrations/0001_init.sql:234 (`content_hash  text NOT NULL UNIQUE`). A third statement of the rule can drift from both.
    kind: restates
    correction: >-
      Remove the prose. The constant and the DDL keep the behavior, and the node holds the fact.
    node: rules/knowledge-base/content-hash-unique
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      the docstring above LLM_RUN_IDEMPOTENCY_KEY_CONSTRAINT, line 31
    evidence: >-
      /** Constraint name used by the DB to enforce the llm_run idempotency_key uniqueness. */
    cost: >-
      Idempotency-key uniqueness is restated in prose. The node holds it, and the DDL enforces it at migrations/0001_init.sql:277 (`idempotency_key          text NOT NULL UNIQUE`). A second reader-facing home for the rule can drift from both.
    kind: restates
    correction: >-
      Remove the prose.
    node: rules/knowledge-base/idempotency-key-unique
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      the docstring on RawInformationRow.original_input, lines 44-49
    evidence: >-
      Verbatim user turn that triggered a chat-directed ingestion (TC-01 /
      BR-34). `null` for every non-chat path (REST, MCP direct, document
      ingestion).
    cost: >-
      The rule for when the original input is recorded is restated in a comment. The node holds it, and code in src/modules/ingestion/service/directed-ingestion.service.ts:366 applies it (`original_input: deps.sourceExcerpt ?? null,`). The comment's "Verbatim user turn" and "every non-chat path" phrasing is a second wording of the same fact and can drift from the node's "turn's excerpt".
    kind: restates
    correction: >-
      Remove the docstring prose. The service holds the behavior, and the node holds the fact.
    node: rules/knowledge-base/directed-turn-is-original-input
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      the docstring above insertRawChunks, lines 153-154
    evidence: >-
      Returns the inserted rows ordered by `chunk_index` ascending. That ordering
      is the contract of the calling route (the response chunk array is sorted).
    cost: >-
      Chunk listing order is stated as a contract in prose. The node holds it, and this file enforces it with `return result.rows.sort((a, b) => a.chunk_index - b.chunk_index);`. A reader may treat the comment as the place the order was decided.
    kind: restates
    correction: >-
      Remove the prose. The sort keeps the behavior.
    node: rules/knowledge-base/chunk-listing-order
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      the docstring above findChunksByRawInformationId, lines 181-184
    evidence: >-
      Find every `raw_chunk` of the given `raw_information_id`, ordered by
      `chunk_index` ascending. Used by GET .../chunks.
    cost: >-
      Chunk listing order is restated in prose. The node holds it, and the same function enforces it with `ORDER BY chunk_index ASC`.
    kind: restates
    correction: >-
      Remove the ordering sentence from the docstring.
    node: rules/knowledge-base/chunk-listing-order
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      the docstring above insertLlmRun, lines 200-203, the status default
    evidence: >-
      Insert a new `llm_run` row. Default `status = 'running'`, `attempts = 1`,
      `finished_at = NULL` (DB defaults).
    cost: >-
      A new run's opening status is restated in a comment. The node holds it, and the DDL applies it at migrations/0001_init.sql:274 (`status                   llm_run_status NOT NULL DEFAULT 'running',`). The insert in this file sets no status, so the comment is the only statement of it here.
    kind: restates
    correction: >-
      Remove the prose about the status default.
    node: rules/knowledge-base/ingestion-records-chunks-and-run
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      the same docstring above insertLlmRun, lines 200-203, the attempts default
    evidence: >-
      Default `status = 'running'`, `attempts = 1`,
      `finished_at = NULL` (DB defaults).
    cost: >-
      A new run starts with one attempt. That fact appears only in this comment and in the DDL default (migrations/0001_init.sql:275, `attempts int NOT NULL DEFAULT 1`). No node holds it: retry-counts-attempts says only that a retry adds one, and llm-run says only that attempts is a required integer. The value the retry arithmetic starts from therefore lives where nobody looks for a business decision.
    kind: unstated
    correction: >-
      Give the initial attempts count of a run a node, most naturally in the node that says a run is opened in status running. Then remove the comment.
    node: rules/knowledge-base/ingestion-records-chunks-and-run
