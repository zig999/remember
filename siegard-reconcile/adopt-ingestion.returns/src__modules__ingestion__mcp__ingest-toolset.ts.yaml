findings:
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      the header comment (lines 11-23), the ingest_document comment (lines 243-247) and the Zod-failure audit comment (lines 431-441)
    evidence: >-
      "A Zod failure (missing/invalid `llm_run_id` or malformed business DTO) also goes through `runIngestHandler` so the rejected `tool_call` audit row is written (BR-23 updated). When no `llm_run_id` is parseable from the raw input, the audit-row insert cannot resolve its FK; the shell's `safeWriteAuditOnRollback` logs and swallows that"
    cost: >-
      The audit rule (every proposal leaves a tool call, and a refused one leaves nothing else) is also told in prose here, in BR-numbered terms the specification does not use. When the node changes, this prose is not bound to it and will go on saying the old rule.
    kind: restates
    correction: >-
      Remove the comments. The code that holds the fact is `runZodFailureAudit` in this file, which routes the failure through `runIngestHandler`. The handler shell in `./handler-base.js` also holds it.
    node: rules/knowledge-base/every-proposal-audited
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      the `health` tool registration (lines 325-333)
    evidence: >-
      mcp.registerTool("ingest", { name: "health", description: IngestToolDescriptions.health, inputSchema: HealthMcpInputSchema, handler: async (): Promise<McpEnvelopeJson> => { const report = await collectHealth(pool); return { ok: true, result: report }; } });
    cost: >-
      The `ingest` toolset exposes a liveness and database-ping operation that always answers `ok: true`. The contract's operation list and its description of what MCP carries do not include it. The next reader looks in the ingestion contract for what the toolset offers and does not find it. The rule that a database failure appears inside `result` and not as an error is decided only here, in a comment.
    kind: unstated
    correction: >-
      Analysis has to decide whether a health operation belongs to the ingestion contract, to another contract, or to no contract, and then give it a node. A search of the specification root for its terms found nothing.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      `mapReadError`, the pg-unavailable and unknown-error branches (lines 425-428)
    evidence: >-
      if (isPgUnavailable(err)) { return serviceUnavailableError().envelope; } return internalError().envelope;
    cost: >-
      `get_ingestion_status` and `list_recent_ingestions` refuse with a service-unavailable error or an internal error. The refusals listed for read-llm-run and list-recent-ingestions are only VALIDATION_INVALID_FORMAT and RESOURCE_NOT_FOUND. The rule for when these operations answer with a SYSTEM_* code lives only in this branch order.
    kind: unstated
    correction: >-
      Give the system refusals of the read operations a home in the contract, or state that they belong to the shared error mapping.
    node: contracts/knowledge-base/ingestion
