certified:
  - node: rules/knowledge-base/correction-replaces
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/graph-consolidation.spec.ts
        name: >-
          closes vigent with status='superseded' (transaction axis only) and inserts a chained new row; outcome=accepted
      - file: src/__tests__/unit/ingestion/graph-consolidation.spec.ts
        name: >-
          correction — change_hint='correction' + errata text, outcome=accepted, valid_to untouched
    why: >-
      The three consequences are exercised for a link and for an attribute. The current row's
      close is issued as 'superseded' (for the link, with superseded_at too). That close never
      writes valid_to, so the validity end is left as it was. A single new row is inserted with
      supersedes_link_id / supersedes_attribute_id naming the current row. What neither test
      separates out is the trigger the rule names, the correction change hint. In both, the hint
      arrives with fragment text carrying an "errata" marker. If the code stopped treating the
      hint as enough, for example by requiring a textual errata marker or by keying on the text
      and ignoring the hint, both tests would still pass. So "a proposal with change hint
      correction ... supersedes it" is proven only when the hint and an errata text come
      together. Two smaller gaps. Neither test checks that the close is bound to the current
      row's id; only the returned superseded_*_id names it. And only functional types (leads,
      deadline) are driven, so nothing exercises a correction meeting a current assertion of a
      multi-valued type. The BR-18 case "correction (outcome=accepted)" also runs this path, but
      it asserts only that a provenance row exists, so it does not bear on this fact.
    remainder: testable
    remainder_why: >-
      One input: a proposal with change_hint correction and fragment text with no errata or
      succession marker, meeting a current assertion. Expected result: the current row closed
      as superseded, its valid_to untouched, and one new row whose supersedes_*_id is that row's
      id. Assert this for a link and for an attribute, and if the rule is meant to reach
      multi-valued types, once for each of those too.
