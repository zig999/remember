findings:
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      header comment lines 7-17 and the route registrations from line 142 ("/raw-information", "/llm-runs/:llmRunId/retry", "/llm-runs/:llmRunId/propose-fragment" and the rest)
    evidence: >-
      //   - POST /api/v1/ingest/raw-information
      //   - GET  /api/v1/ingest/llm-runs/:llmRunId/tool-calls
      //   - POST /api/v1/ingest/llm-runs/:llmRunId/propose-fragment   (TC-13)
    cost: >-
      The contract publishes the REST operations but no node states their addresses, so the path scheme exists only in this file and its mount point. A client author who looks in the specification for where to call intake, retry or the propose mirrors finds nothing. If the paths change, no node moves with them. A grep over the specification root for "/api/v1" and "raw-information/" returned no match.
    kind: unstated
    correction: >-
      Give the published ingestion contract the address of each REST operation, or state the path scheme in a node that binds this file.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      header comment lines 24-44 (TC-13 specifics, points 2 and 4)
    evidence: >-
      //      distinguishes 404 (`RESOURCE_NOT_FOUND`, llm_run row absent) from 409
      //      (`BUSINESS_RUN_NOT_RUNNING`, row present but `status != 'running'`).
      //   4. Return HTTP 200 for any reachable handler. The `ok: true/false` flag on
      //      the body is the outcome indicator — a layered-validation rejection
      //      (ValidationFailure) is a *business result*, not a transport error
    cost: >-
      The prose repeats the contract's answers: 404 RESOURCE_NOT_FOUND, 409 BUSINESS_RUN_NOT_RUNNING, and HTTP 200 with `{ ok: false, error }` for business refusals. If the contract changes, this comment goes on stating the old answer. It also asserts MCP parity ("REST and MCP now emit the SAME namespaced code") that this file cannot show. The pair conforms, and the prose only adds a second place to keep in step.
    kind: restates
    correction: >-
      Remove the comment block. The code that holds these answers is `handleProposeMirror` in this file (the `run.status !== "running"` branch and the catch clauses that send 404 and 409), and the `ok: false` HTTP 200 answer in the same function.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      line 125-126, POST_INGEST_BODY_LIMIT, applied to app.post("/raw-information") at line 144
    evidence: >-
      /** Body limit override for the POST route — 11 MiB per `ingestion.back.md §1`. */
      const POST_INGEST_BODY_LIMIT = 11 * 1024 * 1024;
    cost: >-
      The number 11 MiB is a size limit on intake that the code applies and no node holds. It is measured in bytes on the HTTP body, and it cites a back-spec rather than a node. The nodes bound content and original input at 10,485,760 UTF-16 code units each, and answer over-length with HTTP 422 VALIDATION_INVALID_FORMAT. A request carrying valid multi-byte content or both fields near their limits can exceed 11 MiB and be refused by the transport before the contract's answer applies. Nobody reading the specification would learn that a second, byte-based ceiling exists. A grep over the specification root for "11 MiB", "bodyLimit" and "413" returned no match.
    kind: unstated
    correction: >-
      Decide in the specification whether intake has a request-size ceiling beyond content-length and original-input-length, and what it answers. Then give that a node the file is bound to, or drop the override.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      comment lines 288-289 in the run route
    evidence: >-
      // Body is optional in v1 — parse with a strict default so unknown
      // fields surface as 422.
    cost: >-
      The comment restates the run-extraction refusal, "a body with any field" answers HTTP 422 VALIDATION_INVALID_FORMAT. The code holds it in `RunLlmExtractionRequestSchema = z.object({}).strict().default({})` and `RunLlmExtractionRequestSchema.parse(request.body ?? {})`. The comment is a second home for the rule and can drift from the node.
    kind: restates
    correction: >-
      Remove the comment.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      comment block lines 409-427 above the propose-* mirrors
    evidence: >-
      //   2. Opens a single transaction (BR-19) and within it loads the llm_run
      //      row to distinguish 404 (unknown id) from 409 (status != 'running').
      //   4. Returns the MCP envelope verbatim with HTTP 200; any layered-
      //      validation rejection (ValidationFailure) is mapped to an
      //      `{ ok: false, error: { code, message, details } }` envelope, still
      //      HTTP 200, per BR-28.
    cost: >-
      The block restates the propose-* contract answers: the 404 and 409 split, and business refusals as HTTP 200 with `{ ok: false, error }`. It also restates the proposal-run-checks-first ordering. The code holds all of it in the same file, in `handleProposeMirror`. The comment sends the reader to BR-28 and BR-19 in a back-spec rather than to the nodes.
    kind: restates
    correction: >-
      Remove the comment block. The code that holds these facts stays in `handleProposeMirror`.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      docstring of handleProposeMirror, lines 484-497
    evidence: >-
      *   - `ResourceNotFoundError` -> HTTP 404 with `RESOURCE_NOT_FOUND` envelope.
      *   - `RunNotRunningError`    -> HTTP 409 with `BUSINESS_RUN_NOT_RUNNING` envelope.
      *   - `ValidationFailure`     -> HTTP 200 with `{ ok: false, error: ... }`
    cost: >-
      The docstring is a third statement of the same contract answers. The catch clauses below it (`return reply.status(404).send({`, `return reply.status(409).send({`, `return reply.status(200).send(err.envelope)`) hold them. If the contract moves, this prose keeps the old codes.
    kind: restates
    correction: >-
      Remove the docstring's restatement of the error mapping.
    node: contracts/knowledge-base/ingestion
