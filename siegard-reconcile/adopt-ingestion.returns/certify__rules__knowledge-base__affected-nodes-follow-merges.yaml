certified:
  - node: rules/knowledge-base/affected-nodes-follow-merges
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/affected-nodes.spec.ts
        name: follows merged_into_node_id one hop and swaps in the survivor
    why: >-
      The swap is exercised. One affected node is marked merged_into with merged_into_node_id
      naming a survivor, and the output must hold the survivor alone. The test would fail if the
      merged node were listed as itself or dropped. What it does not check is which node the
      merged one is listed as. The fake client returns the survivor row for any second query and
      never reads its parameters. An implementation that looked up some node other than the one
      named by merged_into_node_id would still pass, so "the knowledge node it was merged into"
      goes unexercised. The fact is also exercised only with a single merged node in isolation.
      No input mixes a merged node with active ones. No input has a merged node alongside its
      own survivor. And "re-applies the collector over tool_call.result rows and resolves" (the
      deriveAffectedNodes test) passes no merged row, so a run's affected-node list rebuilt from
      its tool calls is never shown following a merge. There is also an over-assertion:
      expect(calls).toHaveLength(2) fixes the number of queries, which is how the code is built,
      not the fact. It breaks if the lookup is restructured, while the fact still holds.
    remainder: testable
    remainder_why: >-
      One input: a run whose affected ids include a node whose merged_into_node_id names a
      specific survivor, next to an active node. The fake answers only when asked for that
      survivor's id. Expected result: the listing shows the survivor's id, canonical_name and
      node_type in the merged node's place, the active node is unchanged, and the merged node's
      own id does not appear. The same assertion should also be made through
      deriveAffectedNodes over tool_call rows that name the merged node.
