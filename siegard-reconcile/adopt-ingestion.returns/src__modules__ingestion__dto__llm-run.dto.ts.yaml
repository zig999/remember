findings:
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      the comment above LlmRunSummarySchema, lines 36-41
    evidence: >-
      * Counters for `LlmRun`. The 8 outcome buckets are aggregated from
      * `tool_call.validation_outcome`; `orphaned_fragments` is a separate
      * fragment-level recall signal (see field doc). All fields always
      * present (BR-12).
    cost: >-
      The count-by-outcome rule and the zero-for-absent rule are written a second time as prose beside the schema. The code that holds them is aggregateToolCallOutcomes in src/modules/ingestion/repository/llm-run.repository.ts (`GROUP BY validation_outcome`, buckets defaulted to 0). A reader of this DTO takes the comment for the authority, and it names BR-12, not the node.
    kind: restates
    correction: >-
      Remove the comment by the comment route. The fact is held by the node and by the repository query.
    node: rules/knowledge-base/summary-counts-tool-calls
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      the doc comment on the `orphaned_fragments` field, lines 51-59
    evidence: >-
      * Fragments proposed by this run that carry NO provenance row — i.e. the
      * LLM extracted them but never cited them in any consolidated link/attribute.
      * Such fragments stay `status='proposed'` and are excluded from the partial
      * FTS index (`WHERE status='accepted'`), so they are unsearchable
    cost: >-
      The definition of an orphaned fragment (status proposed, cited by no provenance) is restated as prose here. The code that holds it is the `information_fragment` count in aggregateToolCallOutcomes in src/modules/ingestion/repository/llm-run.repository.ts. The comment also adds claims about the partial FTS index that no node in this set holds.
    kind: restates
    correction: >-
      Remove the comment by the comment route. The definition is held by the node and by the repository query.
    node: rules/knowledge-base/orphaned-fragment
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      the doc comment above LlmRunResponseSchema, lines 80-90
    evidence: >-
      `affected_nodes` (BR-33, v1.3.0) is OPTIONAL — attached ONLY when
      `status === 'completed'`.
    cost: >-
      The completed-only condition is stated as prose in a file that cannot enforce it, and it cites BR-33 instead of the node. The code that holds it is the `if (row.status === "completed")` branch in src/modules/ingestion/service/llm-run.service.ts. A reader of the DTO sees a rule the schema does not carry.
    kind: restates
    correction: >-
      Remove the comment by the comment route. The condition is held by the node and by llm-run.service.ts.
    node: rules/knowledge-base/affected-nodes-only-when-completed
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      the `attempts` field of LlmRunResponseSchema, line 98
    evidence: >-
      attempts: z.number().int().positive(),
    cost: >-
      The schema fixes a lower bound of 1 on a run's attempts. The llm-run node says only that attempts is an integer, and retry-counts-attempts says only that a retry adds one. Neither states that the first attempt counts as 1. The floor is a decision that now lives in this schema, and a reader looking in the specification will not find it.
    kind: unstated
    correction: >-
      Analysis should decide whether a run's attempts start at 1 and give that a node. Otherwise the bound should not be asserted here.
    node: domain/knowledge-base/llm-run
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      the `affected_nodes` field, line 102, with the comment on lines 83-89
    evidence: >-
      affected_nodes: z.array(AffectedNodeSchema).optional(),
      ... ABSENT means the run is
      * `running` / `failed` OR the best-effort batched lookup could not produce
      * the list.
    cost: >-
      The response type lets a completed run carry no affected nodes when the lookup failed, and the comment says so. affected-nodes-only-when-completed and the read-llm-run answer say the nodes are listed when the run is completed, with no failure exception. The best-effort omission is a behaviour decided in code and prose, and a reader of the specification will believe a completed run always lists its nodes.
    kind: unstated
    correction: >-
      Analysis should decide whether a completed run may omit its affected nodes when the lookup fails, and give that a node. Otherwise the response should not allow it.
    node: rules/knowledge-base/affected-nodes-only-when-completed
