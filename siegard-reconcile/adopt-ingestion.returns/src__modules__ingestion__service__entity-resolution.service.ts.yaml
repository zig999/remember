findings:
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The docblock of MATCH_STRONG (lines 26-32) and the docblock of decideFromCandidates (lines 249-257).
    evidence: >-
      "Trigram-similarity ceiling above which a SINGLE candidate is taken as a strong match (reuse the existing node). BR-25 / A12." and "Strong unique: exactly ONE candidate with `sim >= MATCH_STRONG` AND no other candidate has `sim >= MATCH_FLOOR`." The code holds the same fact in this file: `export const MATCH_STRONG = 0.85;` and `if (strong.length === 1 && aboveFloor.length === 1) {`.
    cost: >-
      The strong-match rule is written a second time in prose. The prose also says the value is "not configurable per call - see BR-25 description in the back spec". When the node moves, `--check` does not reach this comment. A reader is then sent to a back-spec rule instead of to the node.
    kind: restates
    correction: >-
      Remove the comments. The constant and the branch already hold the fact, and the node is the place to read it.
    node: rules/knowledge-base/strong-candidate-resolves
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The docblock of MATCH_FLOOR (lines 34-41), the resolveOrCreateNode docblock, step 4, ambiguous bullet (lines 97-99), the comment above the entity_match_review loop (lines 196-199), and the decideFromCandidates docblock (lines 255-261).
    evidence: >-
      "Candidates with `sim < MATCH_FLOOR` do not feed the decision and do not produce `entity_match_review` rows. BR-25 / A12." and "Ambiguous -> INSERT a new node with `status = 'needs_review'`, one `entity_match_review` row per candidate with `sim >= MATCH_FLOOR`". The code holds the same fact in this file: `export const MATCH_FLOOR = 0.55;`, the `decision.kind === "ambiguous"` branch, and the loop `for (const cand of decision.candidates)`.
    cost: >-
      The ambiguity rule, its 0.55 floor and the one-review-per-candidate pairing are restated in four prose places. The comments cite a "TC constraint" and BR-25 as their authority. Those citations point away from the node.
    kind: restates
    correction: >-
      Remove the comments. The floor constant and the ambiguous branch hold the fact.
    node: rules/knowledge-base/ambiguous-candidates-need-review
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The constant TRIGRAM_CANDIDATE_LIMIT (line 47), interpolated as `LIMIT ${TRIGRAM_CANDIDATE_LIMIT}` in the candidate query (line 165).
    evidence: >-
      `const TRIGRAM_CANDIDATE_LIMIT = 10;` and `ORDER BY MAX(similarity(na.alias_norm, norm($1::text))) DESC
      LIMIT ${TRIGRAM_CANDIDATE_LIMIT}`. The node says "records an entity match review pairing it with each such node and its similarity", where "such node" means every active node of the type at a similarity of 0.55 or more.
    cost: >-
      With more than ten active nodes of the type at or above 0.55, only the ten most similar get an entity match review. The rest are silently left unpaired, so the curation queue is incomplete. The cap of ten is a business-visible number that appears only in this file. A reader who checks the node will not find it.
    kind: contradicts
    correction: >-
      Either the node states the cap on candidates, or the query drops the cap so that every node at 0.55 or more is paired. That choice belongs to the analysis.
    node: rules/knowledge-base/ambiguous-candidates-need-review
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The resolveOrCreateNode docblock, step 2 (lines 90-91).
    evidence: >-
      "Tries exact `alias_norm = norm(name)` match against active nodes of `nodeTypeId`. Hit -> reuse; resolution = `matched_existing`." The code holds the same fact: `WHERE na.alias_norm = norm($1::text)
        AND kn.node_type_id = $2
        AND kn.status = 'active'`.
    cost: >-
      The exact-alias rule is stated a second time in prose. If the node changes, the docblock keeps the old rule and nothing flags it.
    kind: restates
    correction: >-
      Remove the step from the docblock.
    node: rules/knowledge-base/exact-alias-resolves
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The resolveOrCreateNode docblock, step 3 (lines 92-94).
    evidence: >-
      "fetches up to 10 trigram candidates via the GIN `node_alias_norm_trgm_idx` (`%` operator), each carrying its max `similarity` against the proposed name." The code holds the same fact: `MAX(similarity(na.alias_norm, norm($1::text)))::text AS sim`.
    cost: >-
      The similarity definition is restated in prose. The same sentence carries the cap of 10, which the node does not hold.
    kind: restates
    correction: >-
      Remove the step from the docblock.
    node: rules/knowledge-base/candidate-similarity
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The resolveOrCreateNode docblock, Novel bullet (lines 100-101), and the decideFromCandidates docblock, Novel bullet (line 257).
    evidence: >-
      "Novel -> INSERT a new node with `status = 'active'`, resolution = `created_new`." and "Novel: every candidate has `sim < MATCH_FLOOR` (empty set included)." The code holds the same fact: `if (aboveFloor.length === 0) {
        return { kind: "novel" };` and `VALUES ($1, $2, 'active')`.
    cost: >-
      The rule for creating an active node when no candidate reaches the floor is stated a second time in prose, with no link to the node.
    kind: restates
    correction: >-
      Remove the bullets.
    node: rules/knowledge-base/no-candidate-creates-active-node
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The resolveOrCreateNode docblock, step 5 (lines 102-104), and the docblock of attachCanonicalAndAliases (lines 284-287).
    evidence: >-
      "Attach the canonical name as the first alias (`kind = 'canonical'`) plus any LLM-supplied aliases (`kind = 'alias'`) to a newly created node." The code holds the same fact: `VALUES ($1, $2, 'canonical', $3)` in attachCanonicalAndAliases, followed by the call to `attachAliases`.
    cost: >-
      The alias-holding rule for a new node is stated a second time in prose. When the node moves, the prose keeps the old rule.
    kind: restates
    correction: >-
      Remove the docblock text and the step.
    node: rules/knowledge-base/new-node-aliases
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The advisory lock taken before the first node_alias read (lines 114-128).
    evidence: >-
      `SELECT pg_advisory_xact_lock(hashtextextended($1::text, 0))`, with the lock key built as `CAST($1::text AS text) || E'\\x1F' || norm($2::text)`. The comment reads "two concurrent `propose_node` calls for the same `(node_type, norm(name))` must NOT race on the resolve-or-create branch."
    cost: >-
      The rule that concurrent proposals of one name and node type are serialized, so that they resolve to one node, lives only in this file and its comments. No node holds it. A reader looking for it in the specification does not find it.
    kind: unstated
    correction: >-
      The analysis should give the serialization of concurrent node proposals for the same node type and normalized name a node. Node resolution is the natural home.
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The comment in the exact-match branch (lines 145-146).
    evidence: >-
      "Canonical name not re-inserted on match (already present by virtue of alias_norm hit). LLM-supplied aliases still attempt insert." The code holds the same fact: the branch calls `attachAliases` with `aliases: args.aliases`, not `attachCanonicalAndAliases`.
    cost: >-
      The rule that a matched node gains only aliases is stated a second time in prose, next to the code that implements it.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/matched-node-gains-only-aliases
