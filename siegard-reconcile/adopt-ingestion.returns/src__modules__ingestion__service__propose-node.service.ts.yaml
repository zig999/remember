findings:
  - file: src/modules/ingestion/service/propose-node.service.ts
    where: >-
      Header comment, lines 6-8 (scope of TC-09), and the comment above the catalog lookup, line 47
    evidence: >-
      //   - Structural layer (BR-14): node_type must exist in the seeded catalog.
      and
      // Layer 1 — catalog lookup (BR-14).
    cost: >-
      The catalog-membership rule for a node proposal's type is written a second time as prose. The refusal is enforced by code at `assertKnownType` in this file and in `validation/structural.ts` (`BUSINESS_UNKNOWN_NODE_TYPE`). A reader who finds the comment first takes it for where the rule is stated. It also says "seeded catalog", which the node does not say.
    kind: restates
    correction: >-
      Remove both comments. The rule is held by rules/knowledge-base/node-type-in-catalog, and the code that enforces it is the `assertKnownType` call.
    node: rules/knowledge-base/node-type-in-catalog
  - file: src/modules/ingestion/service/propose-node.service.ts
    where: >-
      Header comment, lines 9-12 (scope of TC-10), and the comment above the delegation, lines 57-58
    evidence: >-
      //   - Delegate the resolve-or-create branch (advisory lock + exact match +
      //     trigram candidates + A12 decision + alias attachment) to
      //     `entity-resolution.service.resolveOrCreateNode`. The previous exact-
      //     match-or-create stub is replaced by the full §4 pipeline (BR-25).
    cost: >-
      The resolution pipeline (exact alias, trigram candidates, the decision, alias attachment) is summarised as prose here. The behavior is in `entity-resolution.service.ts` (`MATCH_STRONG = 0.85`, `MATCH_FLOOR = 0.55`, the `matched_existing` / `needs_review` / `created_new` returns). If the resolution nodes move, this comment keeps describing the old pipeline and nothing checks it.
    kind: restates
    correction: >-
      Remove the comments. The pipeline is held by the resolution nodes (exact-alias-resolves, strong-candidate-resolves, ambiguous-candidates-need-review, no-candidate-creates-active-node) and by the code in `entity-resolution.service.ts`.
