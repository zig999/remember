findings:
  - file: src/modules/ingestion/dto/raw-information.dto.ts
    where: >-
      ChunkLocatorSchema, lines 11-19, the shape of a chunk's locator
    evidence: >-
      /** Optional readable anchor (page/line/speaker/ts) — shape per A23. */
      export const ChunkLocatorSchema = z.object({ page: z.number().int().nullable().optional(), line: z.number().int().nullable().optional(), speaker: z.string().nullable().optional(), ts: z.string().nullable().optional() }).nullable();
    cost: >-
      The four keys of a locator and their types are a domain fact stated only here. The raw-chunk node holds the locator as an opaque string, and the decision log records that the material gave no shape. A reader who checks the specification finds an opaque string. The shape lives in this schema, and the log's reason ("the retrieval only passes the locator through") no longer describes the system.
    kind: unstated
    correction: >-
      An analysis would decide the locator's shape (page, line, speaker, ts and their types) into the raw-chunk node. Otherwise the source has to stop declaring a shape the specification leaves open.
    node: domain/knowledge-base/raw-chunk
  - file: src/modules/ingestion/dto/raw-information.dto.ts
    where: >-
      RawChunkResponseSchema, lines 37-46, the wire names of a chunk's excerpt and offsets
    evidence: >-
      text: z.string(),
      offset_start: z.number().int().nonnegative(),
      offset_end: z.number().int().positive(),
    cost: >-
      The raw-chunk node names these attributes excerpt, start_offset and end_offset, and the ingestion contract promises the chunk's "excerpt, offsets". The wire vocabulary `text`, `offset_start` and `offset_end` is held by no node. A client or a later reader searching the specification for what the chunk read returns will not find these names. The `positive()` bound on the end offset is likewise stated only here.
    kind: unstated
    correction: >-
      Either the contract or the raw-chunk node records the names the chunk read answers with, or the schema takes the node's names.
    node: domain/knowledge-base/raw-chunk
