findings:
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      line 23, the header comment of directedIngestionService's module
    evidence: >-
      //   - No chunk loop, no model dispatch — items are pre-structured.
    cost: >-
      A second statement of "calls no language model" sits in prose beside the code that holds it (the ingestRaw call with DIRECTED_MODEL and DIRECTED_PROMPT_VERSION and no model client). When the node moves, a reader sees two homes for the fact and the comment is not bound to the node.
    kind: restates
    correction: >-
      Remove the comment. The behavior is held by the intake call at lines 346-358, which opens the run and calls no model, and by directed-run.ts for the model and prompt-version values. Prose is removed by the comment route followed by /reconcile over this file.
    node: rules/knowledge-base/directed-ingestion-run
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      lines 24-25 in the header comment, and lines 584-586 above the attributes loop
    evidence: >-
      //   - Forces `confidence = 1.0` and defaults `valid_from_basis = 'stated'`
      //     when the caller omits it (BR-34 step 4).
      ...
      //     either is missing. `confidence = 1.0`; `valid_from_basis` defaults to
      //     `'stated'` when omitted by caller (BR-34 Defaults matrix).
    cost: >-
      The default basis is stated in prose twice, next to the code that applies it (`valid_from_basis: item.valid_from_basis ?? "stated"`, `change_hint: item.change_hint ?? "none"`). The prose cites a "BR-34 Defaults matrix" that is not the specification node, so the next reader may take it as the home of the default.
    kind: restates
    correction: >-
      Remove both comments. The default is held by the two ?? expressions at lines 621-622 and 701-702.
    node: rules/knowledge-base/directed-defaults
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      lines 104-106, 129, 139 and 106, the DirectedNodeItemSchema, DirectedAttributeItemSchema and DirectedLinkItemSchema declarations
    evidence: >-
      node_type: z.string().min(1),
      ...
      node_id: z.string().uuid().optional(),
      ...
      key: z.string().min(1),
      ...
      link_type: z.string().min(1),
    cost: >-
      The code refuses the whole call with VALIDATION_INVALID_FORMAT when a node type, attribute key or link type is empty, or when a node pin is not a well-formed uuid. The ingest-directed contract lists no such refusal, and a pin that names no node is specified as a per-item rejection (RESOURCE_NOT_FOUND), not a refusal of the whole call. The next reader looks in the specification for why a malformed pin refuses the call and finds nothing.
    kind: unstated
    correction: >-
      The analysis should decide whether these shape refusals are part of ingest-directed (and add the rules and refusals), or whether the schema should not state them.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      lines 91-93 (IsoDateSchema) and its use at lines 133 and 143 for valid_to on directed attributes and links, forwarded at lines 620 and 700
    evidence: >-
      valid_to: IsoDateSchema.optional(),
      ...
      ...(item.valid_to !== undefined ? { valid_to: item.valid_to } : {}),
    cost: >-
      The service accepts and proposes a validity end on a directed attribute or link. The decision log of directed-validity-start-shape records that only the validity start is stated, because the tool strips any other field before the service reads it. The code keeps a validity-end path the specification says never arrives, so the code is the only place that says a validity end can be forwarded.
    kind: unstated
    correction: >-
      The analysis should decide whether a directed item may state a validity end and give that a node, or the field should not be declared here.
    node: rules/knowledge-base/directed-validity-start-shape
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      lines 266-285, the doc comments on `sourceExcerpt` and `metadataPointer` in DirectedIngestionDeps, and lines 336-338
    evidence: >-
      * it into the `RawInformation.metadata` jsonb. REST / MCP-direct callers
      * omit this field; the orchestrator emits a metadata document without the
      * pointer keys. NEVER participates in `content_hash` (lives in metadata,
      ...
      // TC-02 / BR-34 — chat-row pointer (non-PII; the verbatim text lives in
      // `original_input`, not here). Merged in only when the chat dispatch
      // supplied it; REST / MCP-direct calls emit metadata without these keys.
    cost: >-
      The rule that conversation and message identities are recorded in the metadata when the call comes from a chat turn is restated in prose beside the code that holds it (lines 330-342). The prose cites TC-02 / BR-34 as its authority, so the next reader may treat it as the home of the fact.
    kind: restates
    correction: >-
      Remove the comments. The fact is held by `intakeMetadata`, built at lines 330-342.
    node: rules/knowledge-base/directed-source-metadata
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      line 305, the message of the error returned when the Zod parse fails
    evidence: >-
      code: "VALIDATION_INVALID_FORMAT",
      message: "Input failed Zod parse.",
    cost: >-
      The ingestion contract names the message of this refusal as "ingest_directed arguments failed validation.". This service emits a different text, so a caller that reaches this branch is told something the specification does not say. The tool's own handler is outside this file and may validate before this branch.
    kind: contradicts
    correction: >-
      The message emitted here would have to be the one the contract names: "ingest_directed arguments failed validation.".
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      lines 519-523, the comment above the pin-failure code selection
    evidence: >-
      //   - `reason: 'not_found'`  -> RESOURCE_NOT_FOUND (row absent)
      //   - `reason: 'inactive'`   -> VALIDATION_INVALID_FORMAT (row present
      //                                but status != 'active'; structural
    cost: >-
      The contract's code mapping for a pin that names no node or an inactive node is restated in prose, next to the `pinCode` expression that holds it. The comment cites "ingestion.back.md v1.6.0", a document that is not the specification, as its authority.
    kind: restates
    correction: >-
      Remove the comment. The mapping is held by the `pinCode` expression at lines 524-527 and the messages in verifyNodePin at lines 865 and 873.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      lines 914-916, refForAttribute, used for every attribute entry of the report
    evidence: >-
      function refForAttribute(item: DirectedAttributeItem): string {
        return `${item.node_ref}.${item.key}`;
      }
    cost: >-
      The reference an attribute carries in the report is its node reference and key joined by ".". The specification fixes this only for a link, joined by "->". No node says what an attribute's report reference is, so a client that matches report entries to attributes learns the form only from the code.
    kind: unstated
    correction: >-
      The analysis should give the attribute report reference a node, in the manner of directed-link-report-reference, and extend the ingestion contract's report description.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      lines 1035-1039 and 1052, the fallback in readClosedRunSafe, returned in the response run
    evidence: >-
      const fallback = {
          started_at: new Date(0).toISOString(),
          finished_at: new Date(0).toISOString(),
          attempts: 1,
        };
    cost: >-
      When the closed run cannot be read, the response reports the run with start and finish at 1970-01-01T00:00:00.000Z and one attempt. The contract says only that the run is reported completed even where closing it failed; it states no values for the run's times and attempts in that case. A caller sees invented timestamps that look like a real record.
    kind: unstated
    correction: >-
      The analysis should decide what the report holds for the run's times and attempts when the run cannot be read, and give that a node.
    node: contracts/knowledge-base/ingestion
