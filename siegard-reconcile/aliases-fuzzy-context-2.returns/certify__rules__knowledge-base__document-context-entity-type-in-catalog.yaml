certified:
  - node: rules/knowledge-base/document-context-entity-type-in-catalog
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/preliminary-reading.spec.ts
        name: records a document context without an entity listed under a node type the catalog does not hold
    why: >-
      The preliminary reading lists an entity under the node type "Spaceship", which the
      catalog does not hold, placed between a Person and an Organization. The test asserts
      that the recorded document context lists only the Person and the Organization. If that
      entity were kept, the test would fail. It also asserts more than this node states: by
      exact equality, the Person and Organization entities must be kept, in their original
      order. Keeping entities whose type the catalog does hold is a fact this node does not
      state.
