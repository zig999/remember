looked_past: >-
  The fixture list `V5_AND_LATER = ["v5", "v6", "v10"]` feeds versions beyond v5 to the function, while domain/knowledge-base/prompt-version enumerates only v1 to v5. I treated it as a test input probing the "v5 and later" scope and not as a stated fact about which versions exist.
