findings:
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: >-
      line 3, the SearchKind type alias
    evidence: >-
      export type SearchKind = "node" | "link" | "fragment";
    cost: >-
      The values of the item-kind enumeration are declared here, in a file that node is not bound to. When the node moves, a check that follows binds never reaches this file. Nobody can then say which of the two lists was the decision.
    kind: contradicts
    correction: >-
      Bind domain/knowledge-base/item-kind to this file, so the declaration here becomes the place that node is held. The code cannot read the specification, so the bind is what closes it.
    node: domain/knowledge-base/item-kind
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: >-
      line 55, the `query` field of the SearchResponse interface
    evidence: >-
      readonly query: string;
    cost: >-
      The search answer carries the query text back, and no node states it. The retrieval contract's search answer names the page of items and the total before pagination, and the page node gives limit and offset. A reader who looks in the specification for what a search returns will not find this field. A client may come to depend on a field that was never decided.
    kind: unstated
    correction: >-
      Analysis would give the search answer's echo of the query a place in contracts/knowledge-base/retrieval, or the field would be dropped from the shape.
    node: contracts/knowledge-base/retrieval
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: >-
      line 84, the `status` field of the ProvenanceFragment interface
    evidence: >-
      readonly status: "accepted" | "proposed" | "rejected" | "deleted";
    cost: >-
      The fragment-status enumeration holds proposed, accepted, rejected, superseded and deleted. This file redeclares it as a four-value vocabulary without `superseded`. A fragment in that state is outside the type that provenance reads promise. The next reader sees a closed list of four and takes it for the business's list. Nothing reaches this file when the node changes.
    kind: contradicts
    correction: >-
      The status type would have to hold the same values as domain/knowledge-base/fragment-status, and that node would have to be bound to this file.
    node: domain/knowledge-base/fragment-status
