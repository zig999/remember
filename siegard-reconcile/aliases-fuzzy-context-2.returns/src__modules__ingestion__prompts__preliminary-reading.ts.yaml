findings:
  - file: src/modules/ingestion/prompts/preliminary-reading.ts
    where: >-
      INSTRUCTIONS, the Output section, lines 30-31 (summary language)
    evidence: >-
      "- summary: what the document is about, in the language of the document, in"
    cost: >-
      The summary's language is a decision about what a document context holds, and it lives only in
      a prompt sent to the model. A reader looking in domain/knowledge-base/document-context finds only
      "a short summary", so a change of language would be made here and never reach the node.
    kind: unstated
    correction: >-
      Give the summary's language a node, most naturally a statement on domain/knowledge-base/document-context
      or a rule constraining it, through the analysis. Nothing in this file can close it by itself.
    node: domain/knowledge-base/document-context
  - file: src/modules/ingestion/prompts/preliminary-reading.ts
    where: >-
      INSTRUCTIONS, the Output section, line 36 (what counts as a name)
    evidence: >-
      "  catalog below. A pronoun alone or a role alone is not a name."
    cost: >-
      The prompt tells the model to leave a role out of a document entity's names. The node says the names
      are those the document uses, and the scenario's given lists a role among them ("a person the document
      also calls \"o Diretor\""). Whoever relies on the scenario expects a role such as "o Diretor" to reach
      the context. The prompt makes the model withhold it, so the later mention in chunk 3 would not link to
      João Silva.
    kind: contradicts
    correction: >-
      Decide in the specification whether a document context may list a role alone as a name, then bring the
      prompt line or the scenario into line with that decision. The pair now disagrees.
    node: scenarios/knowledge-base/context-links-later-mention
