looked_past: >-
  The route path `/api/v1/ingest/llm-runs/${RUN_ID}` and the response field names `document_context` and `document_context_status` are test wiring over the delivered surface, and the listed contract names operations rather than paths, so I did not report them. The test infrastructure (JWT fixtures, env fixture, pool fixture) is not a domain judgment.
