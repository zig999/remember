findings:
  - file: src/__tests__/unit/ingestion/extraction-prompt-v5.spec.ts
    where: >-
      knownVersionsListedBy (lines 104-111) and its use in the first test (line 136)
    evidence: >-
      const listed = /Known versions:\s*([^.]*)\./.exec(refusalMessage(version))?.[1] ?? "";
      ... const known = knownVersionsListedBy(UNHELD_VERSION);
      expect({ resolved, known }).toEqual({ resolved: expected, known: expected });
    cost: >-
      The test treats it as required that the refusal for an unheld prompt version
      carries the sentence "Known versions: v1, v2, ..." naming every held
      version. Nowhere in the specification states that this message lists the held
      versions or how it is worded. The next reader looks in the specification for
      what the refusal tells a person and finds only that the version must be one
      the system holds. The message's content and format then live in the code and
      in this test, and the test fails if the wording changes, though no business
      decision fixed it.
    kind: unstated
    correction: >-
      Either decide into a node (the rule governing the known-version refusal) that
      the refusal names the held versions, or let the test verify the held set
      without parsing an implementation message.
    node: rules/knowledge-base/prompt-version-known
