looked_past: >-
  The OTHER_NAMES_MARKERS vocabulary (including the Portuguese terms siglas, nomes curtos, grafias) and the regex wording are the test's own detection heuristics, and its fixture values (the Event node type, the Caio chunk text) are test scaffolding, so I reported neither as a domain fact.
