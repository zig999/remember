looked_past: >-
  The fixture computes `const SHARED_SCORE = Math.pow(TRAVERSAL_DECAY, ONE_HOP) * REACHING_NODE_SCORE;`, which restates the shape of rules/knowledge-base/expansion-decay (a candidate outside the set, bound to search.service.ts). The decay value is read from the implementation's `TRAVERSAL_DECAY` rather than stated here, so I left it as a test-fixture matter.
