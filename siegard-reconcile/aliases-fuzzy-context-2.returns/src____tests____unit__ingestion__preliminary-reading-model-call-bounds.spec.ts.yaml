findings:
  - file: src/__tests__/unit/ingestion/preliminary-reading-model-call-bounds.spec.ts
    where: >-
      the second test, "calls the context model exactly three times for one preliminary reading when it answers a retryable error on every attempt", with the overloadedFetch stub and the constants OVERLOADED_STATUS and MAX_ATTEMPTS_OF_ONE_CALL
    evidence: >-
      const OVERLOADED_STATUS = 529;
      ...
      error: { type: "overloaded_error", message: "Overloaded" },
      ...
      expect(readingAttempts).toHaveLength(MAX_ATTEMPTS_OF_ONE_CALL);
    cost: >-
      The test pins that a 529 overloaded answer is retried, and retried exactly twice. The node says only "is retried at most twice". It says nothing about which failures are retried, and nothing that makes three attempts a floor rather than a ceiling. A reader looking for which answers the extraction retries finds it in this test and not in the specification. If the retry policy changes, nothing in the specification says which is right.
    kind: unstated
    correction: >-
      Analysis would need to decide whether which provider answers are retried, and whether the number of attempts is a floor as well as a ceiling, belong in constraints/extraction-model-call-bounded or in a node of their own. Until then the test states a fact the specification does not hold.
