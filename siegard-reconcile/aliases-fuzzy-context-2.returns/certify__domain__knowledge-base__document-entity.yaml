certified:
  - node: domain/knowledge-base/document-entity
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/document-entity-in-extraction.spec.ts
    why: >-
      Each part of the fact is load-bearing in the test's single equality assertion. Every
      chunk prompt must carry one line holding the entity's node type and all three of its
      names. That would fail if any chunk lost the entity, or if the entity came without its
      type or any of its names. An entity with an empty names list, with no names, or with
      no node type must not be accepted. An entity whose node type is not a known node type
      must reach no chunk. The test also asserts more than this node establishes. For a
      malformed entity, it requires that the whole document context is recorded as null,
      summary included. For an entity of an unknown node type, it requires that only that
      entity is dropped and the recorded entities are exactly the remaining one. The node
      states only that names and a node type are required of the entity. It does not say
      whether a malformed entity voids the whole context or is dropped alone, and it does
      not say that the two cases differ. That excess belongs to whatever node holds the
      document context's admission, not to this one.
