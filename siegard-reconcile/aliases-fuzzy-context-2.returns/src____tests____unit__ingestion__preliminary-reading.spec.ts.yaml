    evidence: >-
      const ENV = { ANTHROPIC_API_KEY: "sk-ant-test", CONTEXT_MODEL } as const;
      ...
      expect(reading.model).toBe(CONTEXT_MODEL);
      ...
      expect(world.run.document_context?.model).toBe(CONTEXT_MODEL);
  - node: rules/knowledge-base/document-context-read-first
    held_at: >-
      Tests at lines 395 (exactly one reading), 403 (before the first chunk), 411 (whole content), 521 (exactly 100000 units), 529 (past 100000 units but within 100000 code points) and 744 (100001 characters).
    evidence: >-
      const CONTENT_LIMIT_UNITS = 100_000;
      ...
      expect(readings).toHaveLength(1);
      ...
      expect(firstCall).toBe("reading");
      ...
