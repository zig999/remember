read:
  - node: constraints/document-content-is-data
    held_at: >-
      The test at line 501, "presents the content to the model in the user turn, bracketed and labelled as data, and not among the instructions".
    evidence: >-
      labelledAsDataBefore: /data/i.test(text.slice(0, at)),
      contentInInstructions: system.includes(INJECTION),
      closedAfter: text.slice(at + DEFAULT_CONTENT.length).trim().length > 0,
  - node: constraints/extraction-model-call-bounded
    held_at: >-
      The test at line 638, "makes every model call of an extraction, the preliminary reading included, through a client bounded to five minutes and two retries", with the constants FIVE_MINUTES_MS and MAX_RETRIES.
    evidence: >-
      waitsAtMostFiveMinutes:
            (call.timeout ?? SDK_DEFAULT_TIMEOUT_MS) <= FIVE_MINUTES_MS,
          retriedAtMostTwice:
            (call.maxRetries ?? SDK_DEFAULT_MAX_RETRIES) <= MAX_RETRIES,
  - node: contracts/knowledge-base/ingestion
    held_at: nowhere
    evidence: >-
      The file calls runLlmExtraction directly with a stub pool and states no operation, HTTP status, error code or refusal of the contract. The only error it uses is the SDK's `new InternalServerError(529, ...)`, which is the provider's failure.
  - node: contracts/knowledge-base/retrieval
    held_at: nowhere
    evidence: >-
      No search, provenance read, listing or graph read appears in the file. Its only subject is runLlmExtraction.
  - node: domain/knowledge-base/assertion-flag
    held_at: nowhere
    evidence: >-
      No flag value (uncertain, disputed, low-confidence) is declared or used in the file.
  - node: domain/knowledge-base/document-context
    held_at: nowhere
    evidence: >-
      The shape is declared elsewhere. The file only imports it, `DocumentContextSchema,
        type DocumentContext,`, and reads `world.run.document_context?.summary` and `?.entities`.
  - node: domain/knowledge-base/document-context-status
    held_at: nowhere
    evidence: >-
      The file declares no enumeration of the statuses. `document_context_status: string | null;` is typed as a plain string, and "produced", "single-chunk", "too-long" and "failed" appear only as asserted literals.
  - node: domain/knowledge-base/document-entity
    held_at: nowhere
    evidence: >-
      The shape is declared elsewhere. The file imports `type DocumentEntity,` and builds values such as `{ node_type: "Person", names: ["Maria Souza", "M. Souza"] }`.
  - node: domain/knowledge-base/llm-run
    held_at: >-
      The RunRow type, lines 150-162, a stub of the llm_run row that names the run's attributes in part. The real shape is declared in another file.
    evidence: >-
      type RunRow = {
        id: string;
        model: string;
        prompt_version: string;
        started_at: Date;
        finished_at: Date | null;
        status: string;
        attempts: number;
        input_raw_information_id: string;
        idempotency_key: string;
        document_context: DocumentContext | null;
        document_context_status: string | null;
      };
  - node: domain/knowledge-base/node-match
    held_at: nowhere
    evidence: >-
      No search match (exact or approximate) appears in the file.
  - node: domain/knowledge-base/prompt-version
    held_at: nowhere
    evidence: >-
      `const BEFORE_V5 = ["v1", "v2", "v3", "v4"];` is a list of scenario inputs, not a declared enumeration of the versions the system holds. v5 appears only as `promptVersion: "v5"` in DEFAULT_SCENARIO.
  - node: domain/knowledge-base/search-item
    held_at: nowhere
    evidence: >-
