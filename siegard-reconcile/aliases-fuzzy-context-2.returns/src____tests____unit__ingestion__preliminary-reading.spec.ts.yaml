  - node: rules/knowledge-base/document-context-status-recorded
    held_at: >-
      The test at line 750, "records on a v5 run the status each chunk count, content length and reading outcome calls for, counting the length in UTF-16 code units", with the tests at lines 447, 589 and 719.
    evidence: >-
      expect(statuses).toEqual({
          oneChunkWithinTheLimit: "single-chunk",
          oneChunkPastTheLimit: "single-chunk",
          threeChunksAtTheLimit: "produced",
          threeChunksOneUnitPastTheLimit: "too-long",
          threeChunksPastTheLimitInUnitsWithinItInCodePoints: "too-long",
          threeChunksWhoseReadingFails: "failed",
        });
  - node: rules/knowledge-base/document-context-summary-cut-to-five-lines
    held_at: >-
      The test at line 453, "records the first 5 lines of a 7-line summary as the document context summary".
    evidence: >-
      const sevenLines = ["l1", "l2", "l3", "l4", "l5", "l6", "l7"].join("\n");
      ...
      expect(world.run.document_context?.summary).toBe("l1\nl2\nl3\nl4\nl5");
  - node: rules/knowledge-base/document-context-summary-lines
    held_at: >-
      The tests at line 461, which counts an empty line as a line, and at line 469, in which a carriage return ends no line.
    evidence: >-
      const sixLinesWithAnEmptyOne = "a\n\nb\nc\nd\ne";
      ...
      expect(world.run.document_context?.summary).toBe("a\n\nb\nc\nd");
      ...
      expect(world.run.document_context?.summary).toBe("a\r\nb\r\nc\r\nd\r\ne\r");
