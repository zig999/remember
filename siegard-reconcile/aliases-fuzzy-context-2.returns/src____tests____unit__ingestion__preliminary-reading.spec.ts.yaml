looked_past: >-
  The tests on a failed preliminary reading (lines 575-636: chunks still read, run completed, status failed, no context, including text that is not a document context and a timeout) assert facts held by rules/knowledge-base/failed-preliminary-reading-continues and its scenario failed-context-reading-keeps-extracting, which are outside this node set. The spec already holds them, so they are no finding. The stub row types and fixtures (RunRow, rawRow, chunkRows) are test scaffolding, which belongs to another judgment.
