    evidence: >-
      `const declared = ["produced", "single-chunk", "too-long", "failed"];` and
      `const members = [...DocumentContextStatusSchema.options].sort();` followed by
      `expect(members).toEqual([...declared].sort());`.
  - node: domain/knowledge-base/document-entity
    held_at: >-
      The `describe("a document entity")` block, lines 50-74. Its three cases refuse an entity
      lacking `node_type`, one lacking `names`, and one with an empty `names` list.
    evidence: >-
      `const withoutNodeType = { names: NAMES };` with `expect(refused).toEqual(["node_type"]);`,
      `const withoutNames = { node_type: "Person" };` with `expect(refused).toEqual(["names"]);`,
      and `const withEmptyNames = { node_type: "Person", names: [] };` with
      `expect(refused).toEqual(["names"]);`.
