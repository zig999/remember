      `const withoutSummary = { entities: [ENTITY], model: MODEL };` with
      `expect(refused).toEqual(["summary"]);`, and `const withoutModel = { summary: SUMMARY,
      entities: [ENTITY] };` with `expect(refused).toEqual(["model"]);`. Both are checked
      through `refusedFields(DocumentContextSchema, ...)`.
  - node: domain/knowledge-base/document-context-status
