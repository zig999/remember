    where: >-
      StartAsyncIngestionMcpInputSchema, lines 48-79 (the content field's description, line 54)
    evidence: >-
      export const StartAsyncIngestionMcpInputSchema = z.object({ ... "The full plain text of the document to ingest. Paste the raw content; the server chunks it, runs structured extraction in the BACKGROUND, and persists the knowledge graph with provenance. No base64/binary."
    cost: >-
      The file declares and exports the argument schema of a tool that starts an ingestion and returns before it completes. The specification retires that tool kind, and its decision log says the retirement covers a different name for the same behavior. A reader of the specification would not look here for it. If the schema is registered as a tool, the system offers a tool the specification excludes.
    kind: contradicts
    correction: >-
      Either the node changes through analysis, or the schema and its description leave the toolset. The decision is the owner's. The file only shows the schema is declared.
    node: constraints/ingest-toolset-offers-no-async-ingestion
