looked_past: >-
  The propose-* llm_run_id accepts any non-empty string (`z.string().min(1)`) where the contract refuses a malformed run identity with VALIDATION_INVALID_FORMAT, and the status schema uses `.uuid()`. Whether a handler outside this file closes that gap is outside the file set.
