    evidence: >-
      "Optional UUID PIN: ... Rejected (VALIDATION_INVALID_FORMAT) if the id does not point to an active node."
    cost: >-
      The text the system emits says every pin that does not point to an active node is refused with VALIDATION_INVALID_FORMAT. The contract gives two answers. A pinned identity naming no knowledge node is reported rejected with RESOURCE_NOT_FOUND ("node_id pin does not resolve to an existing knowledge_node row."). Only a node that exists but is not active gets VALIDATION_INVALID_FORMAT. A caller who trusts the description will expect the wrong code for a nonexistent id.
    kind: contradicts
    correction: >-
      The description would have to state the two answers as the contract gives them, or stop naming a code.
