findings:
  - file: src/__tests__/unit/ingestion/extraction-prompt-held-versions.spec.ts
    where: >-
      the fourth test, "fails an extraction under a prompt version the system does not hold without asking the model, ...", and its expected object (lines 321-342)
    evidence: >-
      unheldVersionModelRequests: refused.systemTexts.length, ... unheldVersionModelRequests: 0,
    cost: >-
      The suite asserts that an extraction under an unheld prompt version makes zero requests to the language model. No node states this. prompt-version-known says only that the version must be one the system holds, and the ingestion contract says only that the refusal carries the failed run. A reader who wants to know whether such a run may reach the model looks in the specification, finds nothing, and takes this test's expected value as the business decision.
    kind: unstated
    correction: >-
      Analysis would have to decide whether an extraction under an unheld prompt version calls the model, and give that decision a node. The natural home is prompt-version-known or a rule beside it.
    node: rules/knowledge-base/prompt-version-known
