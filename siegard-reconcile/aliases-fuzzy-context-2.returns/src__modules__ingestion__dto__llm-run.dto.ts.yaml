findings:
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      LlmRunResponseSchema, the attempts field (line 74)
    evidence: >-
      attempts: z.number().int().positive(),
    cost: >-
      The floor of 1 on an LLM run's attempts is applied only here. The llm-run node declares attempts as an integer with no bound, and retry-counts-attempts only says a retry adds one. The next reader looks for the lower bound in the specification and does not find it. A run whose attempts is 0 is refused when the response is built, and no node says why.
    kind: unstated
    correction: >-
      The analysis would have to decide whether an LLM run's attempts is at least 1, and place that on domain/knowledge-base/llm-run or on a rule constraining it. Until then the bound has no node.
    node: domain/knowledge-base/llm-run
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      ListToolCallsQuerySchema, the limit field (line 111)
    evidence: >-
      limit: z.coerce.number().int().min(1).max(100).default(50),
    cost: >-
      rules/knowledge-base/page-limit-bounds holds "A page's limit MUST be between 1 and 100", and this file declares the same bounds. The node is not bound to this file. The identical literal also appears in eight other DTOs, for example src/modules/query-retrieval/dto/search.dto.ts and src/modules/curation/dto/queue.dto.ts. If the node moves, `--check` never reaches this file, and nobody can tell which of the nine copies was the decided one. The default of 50 is a different fact; tool-call-page-defaults holds it, and the pass reads it as conforming.
    kind: contradicts
    correction: >-
      Code never reads the specification, so the closure is the bind. rules/knowledge-base/page-limit-bounds would have to be bound to this file by the trace, so that the declaration here is the place the node claims.
    node: rules/knowledge-base/page-limit-bounds
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      ListToolCallsQuerySchema, the offset field (line 112)
    evidence: >-
      offset: z.coerce.number().int().min(0).default(0),
    cost: >-
      rules/knowledge-base/page-offset-non-negative holds "A page's offset MUST be at least 0", and this file declares the same bound without being bound to that node. If the node changes, `--check` does not reach this file. The default of 0 is a different fact; tool-call-page-defaults holds it, and the pass reads it as conforming.
    kind: contradicts
    correction: >-
      rules/knowledge-base/page-offset-non-negative would have to be bound to this file by the trace, which closes the declaration nobody claims.
    node: rules/knowledge-base/page-offset-non-negative
