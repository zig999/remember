  - node: rules/knowledge-base/document-context-read-first
    held_at: >-
      shouldReadDocument() and produceDocumentContext()
    evidence: >-
      `readsDocumentFirst(request.run.prompt_version) && request.chunkCount > 1 && request.content.length <= PRELIMINARY_READING_MAX_CONTENT_UNITS && (request.run.document_context === null || request.run.document_context === undefined)`, with `PRELIMINARY_READING_MAX_CONTENT_UNITS = 100_000`. readDocumentContext() sends the whole content in one call, `messages: [{ role: "user", content: user(request.content) }]`.
  - node: rules/knowledge-base/document-context-status-kept-on-reuse
    held_at: >-
      the first lines of produceDocumentContext()
    evidence: >-
      `const held = request.run.document_context ?? null; if (held !== null) return held;` This return comes before any call to recordSkippedReading or recordReadingStatus, so the held run's status is not written.
  - node: rules/knowledge-base/document-context-status-recorded
    held_at: >-
      skippedReadingStatus(), recordFailedReading() and recordProducedContext()
    evidence: >-
      `if (request.chunkCount === SINGLE_CHUNK_COUNT) return "single-chunk"; if (request.chunkCount > SINGLE_CHUNK_COUNT && request.content.length > PRELIMINARY_READING_MAX_CONTENT_UNITS) { return "too-long"; }`, `await recordReadingStatus(request.pool, request.run.id, "failed");` and `document_context_status: "produced",`. All are gated by readsDocumentFirst.
  - node: rules/knowledge-base/document-context-summary-cut-to-five-lines
    held_at: >-
      cutSummaryToLines(), called from readDocumentContext()
    evidence: >-
      `summary: cutSummaryToLines(reading.summary, SUMMARY_MAX_LINES),` and `if (lines.length <= maxLines) return summary; return lines.slice(0, maxLines).join(LINE_BREAK);`. The value 5 itself is imported from "../prompts/preliminary-reading.js", not declared in this file.
  - node: rules/knowledge-base/document-context-summary-lines
    held_at: >-
      cutSummaryToLines()
    evidence: >-
      `const lines = summary.split(LINE_BREAK); if (lines[lines.length - 1] === "") lines.pop();` with `LINE_BREAK = "\n"`. A line ends at "\n", a "\r" ends none, an empty line counts, and a trailing newline starts no further line. The limit of 5 is passed in as `maxLines` from SUMMARY_MAX_LINES, defined in another file.
  - node: rules/knowledge-base/no-document-context-before-v5
    held_at: >-
      readsDocumentFirst(), which gates shouldReadDocument() and skippedReadingStatus()
    evidence: >-
