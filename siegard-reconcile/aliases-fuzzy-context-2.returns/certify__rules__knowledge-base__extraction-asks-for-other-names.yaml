certified:
  - node: rules/knowledge-base/extraction-asks-for-other-names
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/extraction-prompt-held-versions.spec.ts
        name: >-
          sends every held prompt version from v5 on a request asking for every other name of each entity, naming an acronym, a short name and another spelling, and excluding a pronoun alone and a role alone
    why: >-
      The test runs an extraction under every held prompt version from v5 onward. Because it
      requires v5 to be held, it cannot pass with no versions checked. It captures the system
      text actually sent to the model and checks that the text does five things: asks for every
      or all other names near "node"/propose_node, names an acronym, names a short name, names
      another spelling, and says a pronoun alone and a role alone are not, or never, another
      name. One part of the fact goes unchecked: the other names must be the ones the text gives
      the same entity. No pattern ties the requested names to the document or chunk being
      extracted. A prompt that asked the model for every other name it knows for the entity
      would break the fact and still pass every check. The other three tests in the file do not
      bear on the other-names request. They cover relative-date words, v4 lines kept in v5, and
      an unheld version being refused while held versions run under their own prompts.
    remainder: testable
    remainder_why: >-
      One input against one expected result. Run an extraction under each held version from v5
      onward. The system text sent to the model must confine the other names it asks for to
      those the extracted text gives the same entity. The check should fail on a request for
      other names the model knows from outside the text.
