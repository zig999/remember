  - node: contracts/knowledge-base/ingestion
    held_at: >-
      nowhere. The file is a search service and reaches no ingestion operation.
    evidence: >-
      export async function searchKnowledgeService(client: PoolClient, catalog: CatalogSnapshot, input: SearchServiceInput, logger: Logger): Promise<SearchResponse>
  - node: contracts/knowledge-base/retrieval
    held_at: >-
      searchKnowledgeService, which produces the page of ranked items with their provenance entries and the total. Request validation and the HTTP envelope are in other files. The service throws InvalidSearchQueryError, InvalidSearchLayerError and UnknownLinkTypeError.
    evidence: >-
      const response: SearchResponse = { query: input.query, total, limit: input.limit, offset: input.offset, items: sliced.map(toSearchItem), };
