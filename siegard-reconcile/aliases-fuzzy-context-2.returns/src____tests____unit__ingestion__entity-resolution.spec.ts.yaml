findings:
  - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
    where: >-
      header comment, line 13 (repeated at lines 329-330, inside the test "branch 3")
    evidence: >-
      //   - entity_match_review row count = candidates with sim >= MATCH_FLOOR
    cost: >-
      The comment says the review rows are one per candidate at or above the floor. It leaves out the cap
      of ten that the node states. A reader who takes the header as the rule will believe the number of
      review rows is unbounded. The cap lives in `TRIGRAM_CANDIDATE_LIMIT = 10` in
      entity-resolution.service.ts, passed as `LIMIT $3`. The comment is a second home for part of this
      fact, and it is out of step with the node. All the tests use at most two candidates at or above the
      floor, so none of them exercises the cap.
    kind: restates
    correction: >-
      Remove the comment prose by the route that answers prose. The fact stays held by the node and by
      the service code. The comment adds nothing the assertions do not already say.
    node: rules/knowledge-base/ambiguous-candidates-need-review
  - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
    where: >-
      header comment, lines 15-16
    evidence: >-
      //   - thresholds (MATCH_STRONG = 0.85, MATCH_FLOOR = 0.55) live in the
      //     entity-resolution module only.
    cost: >-
      This comment states the two thresholds a second time, in a file that none of the three nodes
      holding them binds to. If a node moves one of the values, the comment keeps asserting the old
      numbers and nothing flags it. The values are held by the nodes and by the constants in
      entity-resolution.service.ts (`export const MATCH_STRONG = 0.85;`, `export const MATCH_FLOOR = 0.55;`).
    kind: restates
    correction: >-
      Remove the comment prose by the route that answers prose. The code in the service module is the
      holder of the values.
    node: rules/knowledge-base/strong-candidate-resolves
