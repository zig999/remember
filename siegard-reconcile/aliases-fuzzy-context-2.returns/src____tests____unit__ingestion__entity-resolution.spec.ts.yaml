looked_past: >-
  The test body pins the thresholds (`expect(MATCH_STRONG).toBe(0.85)`), the decision branches (strong, ambiguous, novel) and the lock-before-read ordering via `pg_advisory_xact_lock`, which are held by nodes outside this pack and by the service code, so the pack reads them as another pass's attribution. I also saw legacy references (TC-10, BR-25, A12, BR-20) in comments, which is the comment route's judgment and not a conformance finding.
