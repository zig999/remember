certified:
  - node: rules/knowledge-base/prompt-version-known
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/extraction-prompt-held-versions.spec.ts
        name: fails an extraction under a prompt version the system does not hold without asking the model, and runs every held version under its own prompt
    why: >-
      Only the execution side is exercised. The test runs an extraction whose run already carries
      prompt version "v99", which the system does not hold. It asserts that the run ends "failed"
      and that the model gets no request. If the system fell back to some other prompt, or asked
      the model anyway, this test would fail. What nothing in the offered proof exercises is the
      point where an extraction gets its prompt version: when an LLMRun is opened or recorded.
      The test's own fixture is a stored LLMRun carrying "v99", and the test accepts that run
      ending "failed" instead of never coming into existence. So if the system allowed an
      extraction to be recorded with a prompt version it does not hold, this test would still
      pass. The test also asserts more than the node states. It checks that "v5" is among the
      held versions, and that each held version is sent as its own system prompt. Neither is
      part of this fact, and both would break this certification the day the held set or prompt
      selection legitimately changes. The other three tests in the file assert prompt wording
      (other names, relative-date words, v4 lines kept in v5). They do not bear on this fact.
    remainder: testable
    remainder_why: >-
      One input against one expected result. Open an extraction (create its LLMRun) with a
      prompt version the system does not hold, such as "v99". The expected result is a refusal
      that records no LLMRun with that prompt version and sends no request to the model.
