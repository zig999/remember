      `readonly run_status: LlmRunStatus | null;`, `readonly started_at: Date | null;`, `readonly finished_at: Date | null;`, `readonly prompt_version: string | null;`, `readonly model: string | null;`. Also `SET status = 'running', attempts = attempts + 1, finished_at = NULL WHERE id = $1 AND status = 'failed'`
