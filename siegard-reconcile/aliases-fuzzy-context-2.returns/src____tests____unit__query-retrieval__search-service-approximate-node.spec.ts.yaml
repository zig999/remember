looked_past: >-
  The 200-candidate cap and the lexical-only prose layers, which this test asserts through its NODE_LAYER_CAP constant and its "prose layers stay lexical" cases, are held by nodes outside the pack (rules/knowledge-base/search-layer-candidate-cap and constraints/retrieval-is-lexical-only), so I filed no unstated finding for them.
