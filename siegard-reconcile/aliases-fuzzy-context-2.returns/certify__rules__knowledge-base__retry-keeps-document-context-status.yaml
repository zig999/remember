certified:
  - node: rules/knowledge-base/retry-keeps-document-context-status
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/retry-reuses-document-context.spec.ts
        name: leaves the document context status as it was when a failed run is retried, whichever status it held
    why: >-
      The named test retries a failed run once for each held status: produced, single-chunk,
      too-long, failed, and none. After each retry it reads back the status and asserts it is
      unchanged. If the retry set a status, it would fail on "none". If the retry cleared a
      status, it would fail on any of the other four. The pack limited the reading to this
      proof, so this judgment assumes the retryRun helper in retried-run-world.js runs the real
      retry. The helper was not opened. Five other tests in the file are not cited. The first
      asserts the document context itself, not its status. The remaining four assert what an
      extraction under the retried run reads and records, which the node hands to
      rules/knowledge-base/document-context-status-recorded.
