looked_past: >-
  The file is a test that models the store with an in-memory stand-in, so its dbNorm() and answerAdmission() mirror the normalization and admission predicate in a test double. It also uses the directed model and prompt version values as fixtures, a fact rules/knowledge-base/directed-ingestion-run holds. I read these as another judgment's (test design), not as states of a domain fact.
