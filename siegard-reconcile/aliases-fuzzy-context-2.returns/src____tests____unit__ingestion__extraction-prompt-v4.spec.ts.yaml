looked_past: >-
  The file asserts facts held by nodes outside this set and outside the candidate index: "never invent a date" is held by rules/knowledge-base/extraction-never-invents-a-date, and the "(unknown)" marker and the received_at and document_date lines by rules/knowledge-base/extraction-user-prompt-shows-anchor-dates. Its other checks (v4 extends v3 verbatim, the v4 MAX_TOKENS equals v1's, no hardcoded date in the directive) are about how the prompts are composed and are not a domain fact.
