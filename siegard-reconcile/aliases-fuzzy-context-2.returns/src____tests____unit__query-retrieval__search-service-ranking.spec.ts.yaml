looked_past: >-
  I saw fixture values and stub-routing SQL substrings (QUARTER_SCORE 0.25, APPROXIMATE_SIMILARITY 0.8, "word_similarity", "FROM node_alias na") that mirror how the service scores and queries. The 0.25 is consistent with the 0.5-to-the-power-h expansion decay in candidate rules/knowledge-base/expansion-decay, which I read only as a search-match line and did not open. I left them out as test construction and not as a domain fact this file states.
