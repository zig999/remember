findings:
  - file: src/__tests__/unit/query-retrieval/search-service-ranking.spec.ts
    where: >-
      The DECLARED_ITEM_KEYS constant (lines 500-511), asserted at lines 514-543 in the test "answers a node, a link and a fragment item with no attribute the search item does not declare".
    evidence: >-
      const DECLARED_ITEM_KEYS = [
        "kind",
        "layer",
        "id",
        "score",
        "hop",
        "summary",
        "flags",
        "provenance",
        "match",
        "similarity",
      ];
    cost: >-
      The test treats `id` as a declared attribute of a search item, and the search-item node lists no `id`. Its attributes are kind, layer, score, hop, summary, flags, match and similarity, plus the provenance relationship. Every ordering assertion in this file also reads `item.id`. The fact that a ranked item carries an identity therefore lives only in this test and in the code, where the next reader will not look for it in the specification.
    kind: unstated
    correction: >-
      The analysis that owns search-item would have to decide whether the item carries an identity attribute and give it a node. Until then the test's list is the only declaration of that attribute outside the code.
    node: domain/knowledge-base/search-item
