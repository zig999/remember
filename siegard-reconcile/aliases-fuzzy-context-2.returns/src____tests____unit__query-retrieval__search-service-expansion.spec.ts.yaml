looked_past: >-
  The file is a test, and its titles and expected values (0.5 raised to the hop, hop 1 for a link touching the matched node, the uncertain flag, no match and no similarity on link and fragment items) assert facts that expansion-decay, expansion-hop and the search-item rules in the candidate tier already hold. These are verification of those nodes, not a second home for them, so no finding is filed. The code that applies them is in src/modules/query-retrieval/service/search.service.ts, outside the file set.
read:
  - node: constraints/document-content-is-data
    held_at: nowhere
    evidence: >-
      The file only drives searchKnowledgeService over a stand-in client, for example `searchKnowledgeService(buildClient(world), emptyCatalog, {...}, silentLogger)`. It holds nothing about presenting document content to a language model.
  - node: constraints/extraction-model-call-bounded
    held_at: nowhere
    evidence: >-
      No model call, timeout or retry appears. The only call is `searchKnowledgeService(buildClient(world), emptyCatalog, {...}, silentLogger)`.
  - node: contracts/knowledge-base/ingestion
    held_at: nowhere
    evidence: >-
      The file exercises the search service only and touches no ingestion operation. Its `respond` function answers search SQL such as `sql.includes("FROM node_alias na")`.
  - node: contracts/knowledge-base/retrieval
    held_at: nowhere
    evidence: >-
      The file calls the search service directly with `{ query: "termo", inEffectOnly: false, includeUncertain: true, expand: true, expandDepth: EXPAND_DEPTH, limit: RESULT_LIMIT, offset: 0 }`. It declares no operation, refusal or answer shape of the contract. It only reads the SearchResponse type declared elsewhere.
