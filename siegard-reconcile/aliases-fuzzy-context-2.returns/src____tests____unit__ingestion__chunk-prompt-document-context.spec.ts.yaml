looked_past: >-
  The fake database's norm emulation (normOf), its SQL-pattern routes and the DOCUMENT_CONTEXT_MENTION and DATA_LABEL regexes that detect prompt wording are test-double mechanics, which is a code-review matter and no domain fact of any node.
