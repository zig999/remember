    held_at: >-
      The second test (line 599), "presents the document content, each chunk's text and the document context shown with each chunk in the user turn, labelled as data and outside the instructions", through isMarkedAsData (line 510).
    evidence: >-
      isMarkedAsData returns `holding !== undefined && DATA_LABEL.test(holding) && !call.system.includes(needle)`; the test ends with `expect(presentations).toEqual(allTrue(presentations));`, covering CONTENT_INJECTION in the preliminary reading, CHUNK_INJECTION and SUMMARY_INJECTION in each chunk call.
