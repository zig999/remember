      (max(word_similarity(na.alias_norm, norm($1::text))) * $2::float)::float AS score,
      max(word_similarity(na.alias_norm, norm($1::text))) AS similarity,
  - node: rules/knowledge-base/name-normalization
    held_at: >-
      APPROXIMATE_NODE_ALIAS_SQL, which compares the stored normalized alias with the query passed through the database function norm
    evidence: >-
      word_similarity(na.alias_norm, norm($1::text)) >= $4::real
  - node: rules/knowledge-base/node-item-shows-match
    held_at: >-
      the similarity of an approximate match, in ApproximateNodeAliasHitRow and the approximate query. The exact or approximate marking itself is not set in this file.
    evidence: |-
      export interface ApproximateNodeAliasHitRow extends NodeAliasHitRow {
        readonly similarity: number;
      }
  - node: rules/knowledge-base/node-layer-approximate-match
    held_at: >-
      the WHERE clause of APPROXIMATE_NODE_ALIAS_SQL, with the alias length and similarity thresholds passed in from scoring.js
    evidence: |-
      AND kn.id <> ALL($5::uuid[])
      AND char_length(na.alias_norm) >= $3::int
      AND word_similarity(na.alias_norm, norm($1::text)) >= $4::real
  - node: rules/knowledge-base/node-layer-matches-through-aliases
