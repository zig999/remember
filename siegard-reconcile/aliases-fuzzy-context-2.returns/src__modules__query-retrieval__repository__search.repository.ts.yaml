findings:
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      the three ts_rank_cd expressions that set each exact layer's unweighted score: searchFragmentLayer (line 43), searchNodeAliasLayer (line 76) and searchChunkLayer (line 161)
    evidence: |-
      (ts_rank_cd(f.text_search, websearch_to_tsquery($1::regconfig, $2)) * $3::float)::float AS score
      (max(ts_rank_cd(to_tsvector($1::regconfig, na.alias), websearch_to_tsquery($1::regconfig, $2))) * $3::float)::float AS score
      (ts_rank_cd(rc.text_search, websearch_to_tsquery($1::regconfig, $2)) * $3::float)::float AS score
    cost: >-
      The score of every exact fragment, node and chunk match is the cover-density rank (ts_rank_cd) times the layer weight, and the node that fixes the weights (layer-weights) says only that "a match's strength is weighted by" them. No node says what the unweighted strength is. This file is the only place that decision lives, so a reader who looks in the specification for what orders fragment, chunk and exact node matches will not find the choice of ranking function.
    kind: unstated
    correction: >-
      Analysis would have to give the unweighted strength of an exact layer match a node, or extend rules/knowledge-base/layer-weights to say it. The code cannot read the specification, so nothing is closed by editing this file.
    node: rules/knowledge-base/layer-weights
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      the ORDER BY and LIMIT of searchFragmentLayer (line 47), searchNodeAliasLayer (line 83), APPROXIMATE_NODE_ALIAS_SQL (line 119) and searchChunkLayer (line 165)
    evidence: |-
      ORDER BY score DESC, f.created_at DESC, f.id ASC
      ORDER BY score DESC, kn.canonical_name ASC, kn.id ASC
      ORDER BY score DESC, rc.id ASC
    cost: >-
      The cap node says a search keeps at most 200 candidates from each layer but not which ones survive when a layer overflows. Here the survivors are chosen by score, then newest creation time (fragments), canonical name ascending (nodes) or identifier. The tie-break order decides which matches the owner never sees, and it lives only in this file.
    kind: unstated
    correction: >-
      Analysis would have to state how each layer picks its candidates when it holds more than the cap, in rules/knowledge-base/search-layer-candidate-cap or a sibling node.
    node: rules/knowledge-base/search-layer-candidate-cap
