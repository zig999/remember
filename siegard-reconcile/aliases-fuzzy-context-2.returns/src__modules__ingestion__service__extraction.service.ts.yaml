findings:
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      runChunkLoop, the model call at line 487 (`thinking: { type: "adaptive" }`), and the
      `thinking` field of the ExtractionMessageRequest interface at line 118
    evidence: |-
      thinking: { type: "adaptive" },
    cost: >-
      Every extraction turn is sent with adaptive thinking on. That is a choice about how the
      model reads a chunk, and it affects what each turn costs and how long it takes. No node
      states it. A reader who looks in the specification for how an extraction calls the model
      finds the timeout, the retries and the token ceiling, but not this. The decision lives
      only in this call.
    kind: unstated
    correction: >-
      Analysis would give the extraction's model-call settings a node, or an amendment to
      rules/knowledge-base/extraction-turn-token-ceiling, so that adaptive thinking is stated
      where the other model-call bounds are.
