    held_at: >-
      The harness that stages the scenario: `failedRunWorld`, `retryRun`, `extractRun`, `readingCalls` and `chunkCalls`. The scenario's "then" is asserted by the tests that call them, not in this file.
    evidence: >-
      `llmRunRow({ status: "failed", prompt_version: PROMPT_VERSION, held })` stages the given. `retryLlmRun(clientOf(world), RUN_ID)` followed by `runLlmExtraction(poolOf(world), RUN_ID, ...)` stages the when. `world.calls.filter((call) => call.reading)` and `world.calls.filter((call) => !call.reading)` expose the observations.
