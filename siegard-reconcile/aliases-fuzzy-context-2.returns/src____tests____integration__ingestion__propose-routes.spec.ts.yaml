findings:
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Header comment, lines 3-18 ("Acceptance criteria addressed here"). The same criteria are repeated as
      "criterion:" comments inside the tests at lines 504-505, 532-534, 600-601, 667-668 and 739-740.
    evidence: |-
      //   - "POST /llm-runs/:id/propose-node returns 409 BUSINESS_RUN_NOT_RUNNING
      //      when run exists but is completed"
      //   - "POST /llm-runs/:id/propose-link returns 404 RESOURCE_NOT_FOUND when
      //      llmRunId is unknown"
      //   - "POST /llm-runs/:id/propose-attribute returns 422 on Zod parse failure
      //      (malformed body / missing required field)"
    cost: >-
      The refusal statuses and codes of the proposal routes are already held by the ingestion contract, and the
      assertions in this file (`expect(res.statusCode).toBe(409)`, `expect(body.error.code).toBe("BUSINESS_RUN_NOT_RUNNING")`)
      hold them as code too. The comments are a second home outside behavior. When the contract moves, they go stale
      without anything reaching them, and a reader may take them for the decision.
    kind: restates
    correction: >-
      Remove the comment prose by the comment route. The behavior is already held by the node and by the assertions.
    node: contracts/knowledge-base/ingestion
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Comment "Note on the envelope semantics", lines 24-28.
    evidence: |-
      // Note on the envelope semantics (BR-28 / SD-1 in delivery): any
      // `ValidationFailure` raised by the propose-* service surfaces as HTTP 200
      // with `{ ok: false, error: ... }`. ZodErrors at the route boundary continue
      // to surface as HTTP 422 via the global error handler — see the inference log
    cost: >-
      The contract holds, per refusal, which proposal refusals answer HTTP 200 with `{ ok: false, error }` and which
      answer HTTP 422 over REST. This prose restates that split as a general rule under its own authority ("BR-28 / SD-1"),
      so the next reader looks to the comment for the envelope rule and not to the contract. The tests' status-code
      assertions hold the behavior.
    kind: restates
    correction: >-
      Remove the comment prose by the comment route.
    node: contracts/knowledge-base/ingestion
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      `FakeStore.llm_runs` row type, line 76 (the `status` member of the in-test llm_run row declaration).
    evidence: |-
      status: "running" | "completed" | "failed";
    cost: >-
      The run-status vocabulary is declared a second time, in a file the run-status node is not bound to. Today the
      three values agree with the node. When the node adds or renames a state, `--check` never reaches this file and
      nobody can tell which declaration was decided. The union types a test double of the llm_run row and is not an
      assertion about the node.
    kind: contradicts
    correction: >-
      Remove the second declaration of the vocabulary, for example by typing the fake row's status from the type the
      binding to run-status already owns. The bind that claims it is what keeps such a declaration closed, since code
      never reads the specification.
    node: domain/knowledge-base/run-status
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Interpretation-note comment in the test "returns HTTP 200 with ok:false VALIDATION_INVALID_FORMAT envelope when chunk_ids do not belong to the run's source", lines 536-541.
    evidence: |-
      // "text > 1000 chars" as the trigger; Zod's max(1000) intercepts that
      // before the service runs (it surfaces as HTTP 422 via the global handler,
    cost: >-
      The 1000-character limit of a fragment's text is held by the fragment-text-length rule. Per the candidate index
      that rule is bound to src/modules/ingestion/mcp/mcp-schemas.ts, and I did not open that file. The comment states
      the limit again outside behavior, so a change to the rule leaves a stale "1000" here.
    kind: restates
    correction: >-
      Remove the comment prose by the comment route.
    node: rules/knowledge-base/fragment-text-length
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Test "returns HTTP 409 BUSINESS_RUN_NOT_RUNNING when the run exists but is completed", lines 623-624.
    evidence: |-
      expect(body.error.details.current_status).toBe("completed");
      expect(body.error.details.llm_run_id).toBe(RUN_COMPLETED_ID);
    cost: >-
      The ingestion contract answers the refusal only as "error code BUSINESS_RUN_NOT_RUNNING naming the run's status,
      HTTP 409 over REST". The detail key names `current_status` and `llm_run_id` appear in no node. They are pinned
      only here, and presumably in the code that emits them. A reader of the specification cannot learn them, and a
      client reading them depends on a decision that lives in code and test.
    kind: unstated
    correction: >-
      The analysis would give the BUSINESS_RUN_NOT_RUNNING answer of the ingestion contract the names of its details,
      or the assertion would stop pinning them.
    node: contracts/knowledge-base/ingestion
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Comment block "TC-06 (valid-values-attribute-domains)", lines 795-806.
    evidence: |-
      //   - out-of-domain     → 200 ok:false VALIDATION_INVALID_FORMAT envelope with
      //                          (P2.1 namespaced; deprecated: STRUCTURAL_INVALID)
      //                          details = { value, allowed_values }; NO inserts
    cost: >-
      The contract holds the closed-domain refusal: VALIDATION_INVALID_FORMAT, details naming the value and the allowed
      values, HTTP 200 with `{ ok: false, error }`. The assertions at lines 867-884 hold it as code. The comment also
      cites a "deprecated" code that no node names. It is a second home outside behavior.
    kind: restates
    correction: >-
      Remove the comment prose by the comment route.
    node: contracts/knowledge-base/ingestion
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Comment in the out-of-domain test, lines 865-866.
    evidence: |-
      // Per BR-28 / SD-1: service-layer ValidationFailure surfaces as
      // HTTP 200 with { ok: false, error: ... } envelope.
    cost: >-
      This restates, under the authority of a rule label, the contract's HTTP 200 envelope for service-level
      refusals. `expect(res.statusCode).toBe(200)` and `expect(body.ok).toBe(false)` already hold it as code.
    kind: restates
    correction: >-
      Remove the comment prose by the comment route.
    node: contracts/knowledge-base/ingestion
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Comment before the allowed_values assertion, line 879.
    evidence: |-
      // allowed_values is lexicographically sorted per TC-02/TC-03 contract.
    cost: >-
      The contract holds that the allowed values appear "in sorted order". The assertion
      `toEqual(["Apollo", "Gemini", "Mercury"])` holds it as code. The comment restates it as "lexicographically
      sorted" and cites a task contract that is not a node, so it reads as the authority for the ordering.
    kind: restates
    correction: >-
      Remove the comment prose by the comment route.
    node: contracts/knowledge-base/ingestion
