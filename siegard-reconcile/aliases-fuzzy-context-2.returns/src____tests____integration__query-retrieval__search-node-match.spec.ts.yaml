looked_past: >-
  The file's own scaffolding (the SQL-fragment sniffing in `respond`, the RS256 JWT fixture, the empty catalog snapshot and the stub constants such as `APPROXIMATE_SCORE = 0.72`) states no domain fact, so I treated it as test construction and not as a specification judgment.
