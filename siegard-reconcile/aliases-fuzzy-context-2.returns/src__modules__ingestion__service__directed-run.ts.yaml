findings:
  - file: src/modules/ingestion/service/directed-run.ts
    where: >-
      lines 1 and 3, the exports DIRECTED_MODEL and DIRECTED_PROMPT_VERSION
    evidence: |-
      export const DIRECTED_MODEL = "directed" as const;

      export const DIRECTED_PROMPT_VERSION = "directed-v1" as const;
    cost: >-
      The values are declared only in this file. Node rules/knowledge-base/directed-ingestion-run states them
      ("A directed ingestion opens an LLM run of model directed and prompt version directed-v1"), but the
      trace binds that node to src/modules/ingestion/service/directed-ingestion.service.ts, which imports
      the values from here. If the node moves, --check reaches the service and never this file. The
      constants would then change in a file the node does not answer for, or fail to change, with nobody
      knowing which was decided. The same constants also feed the alias-admission query in
      entity-resolution.service.ts, so the value is read in two places and declared in a third.
    kind: contradicts
    correction: >-
      The bind that claims this declaration has to reach it: rules/knowledge-base/directed-ingestion-run
      bound to this file as well as to directed-ingestion.service.ts. Code never reads the specification, so
      nothing in the source can close this.
    node: rules/knowledge-base/directed-ingestion-run
