findings:
  - file: src/modules/ingestion/dto/propose-node.dto.ts
    where: >-
      the ProposeNodeResult interface, line 38, optional member aliases_not_admitted
    evidence: >-
      export interface ProposeNodeResult {
        readonly node_id: string;
        readonly resolution: ProposeNodeResolution;
        readonly aliases_not_admitted?: readonly AliasNotAdmitted[];
      }
    cost: >-
      The name aliases_not_admitted, with the member names node_id, alias and reason, is the key of a published answer, and no node spells it. The contract says only that the answer carries "each proposed alias that was not admitted, with the reason ALIAS_NOT_IN_SOURCE", and a search of the specification root for aliases_not_admitted finds nothing. The wire key therefore lives only in this type. A client or a test reads the shape from the code, because the contract does not say it.
    kind: unstated
    correction: >-
      Give the key of the unadmitted-alias list and the member names of a propose-node answer a node, by analysis. The ingestion contract's propose-node answer is the natural home.
    node: contracts/knowledge-base/ingestion
