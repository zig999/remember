findings:
  - file: src/__tests__/unit/ingestion/document-entity-in-extraction.spec.ts
    where: >-
      MALFORMED_ENTITIES (lines 33-37), EXPECTED.refusedWithNothingRecorded (lines 46-50), observeMalformedEntities (lines 76-83) and the it(...) title (line 107)
    evidence: >-
      "an entity whose names list is empty": { node_type: "Person", names: [] },
      "an entity with no names": { node_type: "Person" },
      "an entity with no node type": { names: ["Maria Souza"] },
      ...
      refusedWithNothingRecorded: {
        "an entity whose names list is empty": null,
        "an entity with no names": null,
        "an entity with no node type": null,
      },
    cost: >-
      The test fixes what an extraction does when a preliminary reading lists an entity with no names, an empty names list or no node type. The whole document context is dropped and nothing is recorded; the malformed entity is not just left out. No node states this. domain/knowledge-base/document-entity says only that `names` is required and the node type is a reference of cardinality 1. Its log decides that an entity needs a name, but not what happens to the reading that lists one without. rules/knowledge-base/document-context-entity-type-in-catalog drops only an entity of an unknown node type and keeps the context. The log of that rule names the alternatives (drop, keep, or count the reading as failed) for the unknown-type case. Nothing settles them for a malformed entity. A later reader looking for what a malformed entity does to a run's context will look in the specification, find only the required marker, and miss that this test file is where the whole-context refusal lives.
    kind: unstated
    correction: >-
      Analysis would have to decide, in a node such as domain/knowledge-base/document-entity or a rule beside rules/knowledge-base/document-context-entity-type-in-catalog, what a preliminary reading that lists an entity with no names, an empty names list or no node type yields. Examples are a document context without that entity, no document context, or a failed reading. It would also decide which document context status the run records in that case.
    node: domain/knowledge-base/document-entity
