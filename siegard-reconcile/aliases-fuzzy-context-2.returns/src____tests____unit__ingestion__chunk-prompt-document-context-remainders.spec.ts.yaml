findings:
  - file: src/__tests__/unit/ingestion/chunk-prompt-document-context-remainders.spec.ts
    where: >-
      the constants DATA_OPENER and BLOCK_CLOSER (lines 74-75), applied by isDelimitedAt and marksViolations to decide that content is "marked apart"
    evidence: >-
      const DATA_OPENER = /\bdata\b.*:$/i;
      const BLOCK_CLOSER = /^END\b/;
    cost: >-
      The test fixes what the mark is: a line ending in a colon that contains the word "data", and a closing line that starts with "END". The node only says the content is "marked apart from its instructions as data" and names no marker. A prompt that marked the content apart some other way would satisfy the node and fail this test. A reader asking what "marked apart" means will find the answer here, not in the specification.
    kind: unstated
    correction: >-
      The analysis would either state the presentation marker in constraints/document-content-is-data, or leave the marker to the prompt and have the test assert only the node's own wording.
    node: constraints/document-content-is-data
