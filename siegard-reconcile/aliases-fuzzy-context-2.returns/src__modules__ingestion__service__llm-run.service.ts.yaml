looked_past: >-
  In retryLlmRun, when the retry update affects no row and the refreshed run is still failed, the file names the status "running" in RunNotRetryableError (`throw new RunNotRetryableError(llmRunId, "running");`), where the contract says the refusal names the run's status; I left this out of the findings as an edge of the retry race, not a clear departure.
