certified:
  - node: rules/knowledge-base/document-context-summary-cut-to-five-lines
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/preliminary-reading.spec.ts
        name: records the first 5 lines of a 7-line summary as the document context summary
      - file: src/__tests__/unit/ingestion/preliminary-reading.spec.ts
        name: counts an empty line as a line when it cuts a summary to 5 lines
      - file: src/__tests__/unit/ingestion/preliminary-reading.spec.ts
        name: lets a carriage return end no line when it cuts a summary to 5 lines
    why: >-
      The fact is covered. A 7-line summary goes through the whole extraction, and the test
      checks that the recorded document context summary is exactly its first 5 lines. Two
      6-line summaries check the same cut one line past the limit. Two of the tests also
      assert something the node does not state. The node does not say what counts as a line.
      "counts an empty line as a line when it cuts a summary to 5 lines" asserts that an empty
      line counts toward the 5. "lets a carriage return end no line when it cuts a summary to
      5 lines" asserts that only "\n" ends a line, so the kept summary ends in "e\r". Each
      still fails if the cut stops holding. Each also fails if the line definition changes,
      even when no first-5-lines rule is broken. That extra assertion is for a reader to
      route; it is not extra coverage.
