findings:
  - file: src/__tests__/unit/ingestion/document-context-value-in-extraction.spec.ts
    where: >-
      observeRefusal() (lines 124-137) and the expectation incompleteContextRefused.readingWithoutSummaryRecords in EXPECTED (lines 63-67)
    evidence: >-
      const lacksSummary = await extractedAfterReading({ entities: [MARIA] });
      ... readingWithoutSummaryRecords: recordedContext(lacksSummary),
      ... readingWithoutSummaryRecords: null,
    cost: >-
      The test fixes what an extraction records when the preliminary reading returns entities but no summary: no document context at all. No node says this. domain/knowledge-base/document-context only makes the summary a required attribute, and document-context-status-recorded says only that a failed reading records failed and a reading that yields a document context records produced. It does not say whether a reading missing a required field counts as failed. The next reader looks in the specification for what happens to a summary-less reading and finds nothing. The test becomes the place where that outcome is decided.
    kind: unstated
    correction: >-
      An analysis would have to decide, in a node, what an extraction records when the preliminary reading lacks a required field of the document context (the summary or the model): no context, and which document context status. The node that should hold it is domain/knowledge-base/document-context, or a rule constraining it beside document-context-entity-type-in-catalog.
    node: domain/knowledge-base/document-context
