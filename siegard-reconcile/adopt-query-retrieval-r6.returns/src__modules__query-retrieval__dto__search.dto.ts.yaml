findings:
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: >-
      The docblock above QueryString (lines 37-47), first bullets "min 1 char (raw)" and "max 1000 chars (raw)"
    evidence: >-
      * `query` validation per BR-04 of the back spec:
       *   - min 1 char (raw)
       *   - max 1000 chars (raw)
    cost: >-
      The 1000-character ceiling is written a second time in prose beside the code that enforces it,
      as `.max(1000, { message: "query exceeds 1000 characters" })`. If the node's limit moves, the
      comment still reads as a decided limit, and a reader can take it for the source of the number
      instead of the node.
    kind: restates
    correction: >-
      Remove the docblock text through the comment route. The code in this file
      (`.max(1000, ...)` on QueryString) already holds the fact, so the pair conforms.
    node: rules/knowledge-base/search-query-length
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: >-
      The docblock above QueryString (lines 37-47), bullet "btrim non-empty after transform (rejects whitespace-only input)"
    evidence: >-
      *   - btrim non-empty after transform (rejects whitespace-only input)
    cost: >-
      The rule that a blank query is refused is restated in prose beside the code that enforces it, as
      `.transform((s) => s.trim()).refine((s) => s.length > 0, ...)`. The comment also cites
      "BR-04 of the back spec" as the authority, which points a reader to a document other than the node.
    kind: restates
    correction: >-
      Remove the docblock text through the comment route. The transform and refine in this file hold the fact.
    node: rules/knowledge-base/search-query-not-blank
