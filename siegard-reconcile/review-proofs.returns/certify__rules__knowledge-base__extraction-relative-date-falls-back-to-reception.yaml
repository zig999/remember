certified:
  - node: rules/knowledge-base/extraction-relative-date-falls-back-to-reception
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: v4 asks the model to resolve a relative date against the document date when present and otherwise against the date portion of received_at
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: asks, in the system prompt it hands out, to resolve a relative date in the chunk against the document date when present and otherwise against the date portion of received_at
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: shows the reception time and a real document date in the user message, and (unknown) when the source has none
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: v4.user() surfaces received_at and an unknown document_date in the metadata block
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: dispatches 'v4' to the v4 module
    why: >-
      What the v4 prompt says is proven. Two tests check the text v4 adds to the system prompt,
      both straight from the v4 module and from what selectPromptModule("v4") returns: a relative
      date in the chunk is resolved against `document_date` when it is present, and against the
      date portion of `received_at` when `document_date` is `(unknown)`. The regular expression
      also requires the document date to come first and the fallback to come after it. The
      user-message tests check that the model is shown a real `document_date` when the source has
      one and `(unknown)` when it has none, so the condition in the instruction depends on real
      input. The dispatch test checks that the registry maps "v4" to the v4 module. What no test
      in the file does is run an extraction. Nothing takes a run whose prompt version is v4 and
      checks the system prompt that run actually sends to the model. If the extraction stopped
      picking its prompt module from the run's prompt version, for example by sending v3 or a
      fixed module on a v4 run, the fact would stop holding and every named test would still
      pass. The "under prompt version v4, an extraction asks" part of the fact is therefore
      unexercised. The two "names no basis" tests check a different fact (that no basis is named
      for the fallback date) and are not counted here.
    remainder: testable
    remainder_why: >-
      One input against one expected result. Input: an extraction run with prompt version v4,
      over a chunk with a relative date, with the model client stubbed so it captures the
      request. Expected: the system prompt in the captured request contains the instruction to
      resolve the relative date against `document_date` when present and otherwise against the
      date portion of `received_at`. The same run on a source with no document date should show
      `document_date: (unknown)` in the user message it sends.