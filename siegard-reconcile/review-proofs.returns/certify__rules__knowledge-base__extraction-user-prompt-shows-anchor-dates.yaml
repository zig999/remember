certified:
  - node: rules/knowledge-base/extraction-user-prompt-shows-anchor-dates
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: v4.user() surfaces received_at and an unknown document_date in the metadata block
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: shows the reception time and a real document date in the user message, and (unknown) when the source has none
      - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
        name: '%s user message shows the reception time and a real document date, and (unknown) when the source has none'
    why: >-
      The fact says the reception time is shown in every extraction's user message, including
      when the source has no document date. For a source that has a document date, every
      registered prompt version (v1 to v4, through selectPromptModule) is checked for the
      reception time, the real document date, and no "(unknown)". For a source without a
      document date, the reception time is checked only on v4's user() called directly. The
      registry's v4 module and the v1, v2 and v3 modules are given a null document date, but
      the only thing checked is that "- document_date: (unknown)" appears. So if a v1, v2 or
      v3 user message (or the v4 one reached through the registry) dropped received_at when
      the source has no document date, no named test would fail, and the fact would stop
      holding for an extraction run on that version.
    remainder: testable
    remainder_why: >-
      Give each registered prompt version's user() (v1, v2 and v3, and v4 as selectPromptModule
      returns it) a source whose document_date is null and a known received_at. The expected
      result is a user message containing "- received_at: <that time>" next to
      "- document_date: (unknown)".