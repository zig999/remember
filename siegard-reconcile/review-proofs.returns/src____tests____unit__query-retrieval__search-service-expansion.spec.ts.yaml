read:
  - node: rules/knowledge-base/expansion-decay
    held_at: >-
      The tests under describe("searchKnowledgeService expansion: decayed score of an expanded link") and describe("... decayed score of a link reached through its target end"), lines 292-409. They assert the decayed score of an expanded link.
    evidence: >-
      expect(scoreByLink).toEqual({ "link-1": 0.4, "link-2": 0.2, "link-3": 0.1, "link-x1": 0.2, "link-x2": 0.1, "link-x3": 0.05, }) with FIRST_MATCH_SCORE = 0.8 and SECOND_MATCH_SCORE = 0.4. These are 0.5^h times the score of the matched node each link was reached from, which is what the node states. The file declares no scoring rule of its own.
  - node: domain/knowledge-base/search-item
    held_at: >-
      The test describe("searchKnowledgeService expansion: the search item's shape"), lines 437-467, and the hop test at lines 411-435. They assert the item's attributes.
    evidence: >-
      expect.objectContaining({ kind: expect.stringMatching(/^(node|link|fragment)$/), layer: expect.stringMatching(/^(fragment|node|chunk)$/), score: expect.any(Number), hop: expect.any(Number), summary: expect.any(String), flags: expect.any(Array), provenance: expect.any(Array), }) followed by expect(item.provenance.length).toBeGreaterThanOrEqual(1). This is the node's attribute set plus its 1..* provenance. The file declares no shape for the item; it reads one from the service's response type.
  - node: rules/knowledge-base/extraction-relative-date-falls-back-to-reception
    held_at: nowhere
    evidence: >-
      The file exercises searchKnowledgeService over a stubbed PoolClient. It has no extraction, prompt-version or relative-date construct. The nearest text is `query: "termo", inEffectOnly: false, includeUncertain: true, expand: true`.
  - node: rules/knowledge-base/extraction-user-prompt-shows-anchor-dates
    held_at: nowhere
    evidence: >-
      The file builds no extraction user message and refers to no reception time or document date. The only date is `const RECORDED_AT = new Date("2026-06-11T18:30:00Z");`, a fixture value for stubbed rows.
looked_past: >-
  The tests also assert the hop numbering, the uncertain flag, the confidence band and the supporting-fragment provenance. Nodes in the specification outside this set hold those facts (expansion-hop, the search-item flag rule, the proposal confidence-band rule). I read those nodes only in the full-text projection, not as node files. None of the facts is stated as a new domain value here, and the stub's SQL-string matching is a test-design matter, not a conformance one.