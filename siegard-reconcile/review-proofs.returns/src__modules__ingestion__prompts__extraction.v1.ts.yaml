    where: >-
      The catalog section of the SYSTEM prompt built by `system()`: the `nodeTypes` and `linkTypes` maps and sorts, lines 67-77, and the emitted "## Catalog (read-only)" lines, 157-169.
    evidence: >-
      ".map((lt) => ({ name: lt.name, temporal: lt.is_temporal, allowsMultipleCurrent: lt.allows_multiple_current, requiresValidFrom: lt.requires_valid_from, })).sort((a, b) => a.name.localeCompare(b.name))" and
      "` [temporal=${lt.temporal}, multi_current=${lt.allowsMultipleCurrent}, requires_valid_from=${lt.requiresValidFrom}]`" and
      "`  - ${nt.name}${nt.description ? ` — ${nt.description}` : ""}`"
    cost: >-
      What the extraction prompt tells the model about the catalog is a decision no node holds. That covers which attributes of each link type are shown, node types shown with their descriptions, attribute keys shown with value type and a temporal marker, and every list sorted by name. Only the closed-values listing (extraction-prompt-lists-closed-values, extraction-prompt-values-ascending and extraction-prompt-values-verbatim) is held. The chat prompts do have a node for this (rules/chat/chat-prompt-presents-catalog), so a reader who looks in the specification for the extraction counterpart finds nothing and only the code answers.
    kind: unstated
    correction: >-
      Analysis would give the extraction prompt's catalog presentation a node: what is shown for node types, link types and attribute keys, and in what order. Only the closed-values order and spelling have one today.
