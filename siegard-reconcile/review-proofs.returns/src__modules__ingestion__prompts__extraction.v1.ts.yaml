looked_past: >-
  The emitted system prompt otherwise restates facts other nodes hold: the 0.75 and 0.40 confidence thresholds, the 1000-character fragment limit, the stated-basis rule, no invented dates, and the document content delimiters. These agree with those nodes, as does `MAX_TOKENS`, which extraction-turn-token-ceiling holds. I did not weigh the prompt's tone or its worked example, which are another judgment's.