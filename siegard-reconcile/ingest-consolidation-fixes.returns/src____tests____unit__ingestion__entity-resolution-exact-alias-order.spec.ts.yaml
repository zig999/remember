looked_past: >-
  The SQL-parsing store stand-in (ORDER BY regexes, row rotation, `REPETITIONS = 6`) is test scaffolding and test tuning, not a domain fact. The "merged" status value in the fixture is held by domain/knowledge-base/node-status.
