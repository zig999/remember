findings:
  - file: src/__tests__/unit/ingestion/ingest-directed-description.spec.ts
    where: >-
      the filter in the first test (lines 15-21), which requires the word "explicitly" in the owner-request sentence of the ingest_directed description
    evidence: >-
      /owner['’]s own message/i.test(sentence) &&
              /\bexplicitly\b/i.test(sentence) &&
              /\brecord\b/i.test(sentence)
    cost: >-
      The rule node says the assistant calls directed ingestion only when the owner's own message "asks it to record knowledge". The test requires the emitted description to say the ask must be explicit. That stricter condition is held only here, so the next reader looks in the specification for it and does not find it. The test also fails a description that states the node's condition exactly.
    kind: unstated
    correction: >-
      Either an analysis gives the node (or its description) the explicit-ask wording, or the test stops pinning "explicitly".
    node: rules/chat/assistant-writes-only-on-owner-request
  - file: src/__tests__/unit/ingestion/ingest-directed-description.spec.ts
    where: >-
      the third test (lines 41-51), which requires every sentence of the description that mentions tool results, lookups or queries to also say "never" or "not"
    evidence: >-
      /\b(tool|prior|earlier|previous)\s+results?\b|\blookups?\b|\bqueries\b/i.test(sentence) &&
            !/\bnever\b|\bnot\b/i.test(sentence)
    cost: >-
      The rule node names only an instruction inside a document or tool result as something the assistant never acts on. This test extends the prohibition to prior lookups and queries, so a rule about which earlier chat activity may justify a write lives only in a test. A change to the description is judged against it, and the specification gives no way to settle a disagreement.
    kind: unstated
    correction: >-
      An analysis decides whether prior lookups and queries are covered by the rule (by extending the rule node). If they are not, the test stops pinning them.
    node: rules/chat/assistant-writes-only-on-owner-request
