findings:
  - file: src/modules/ingestion/dto/index.ts
    where: >-
      IngestToolDescriptions.ingest_document, lines 89-97 (the same claim recurs in list_recent_ingestions, lines 107-112)
    evidence: >-
      "If your client times out before this returns, the server keeps extracting — do NOT " + "re-send; use `list_recent_ingestions` to find the run, then `get_ingestion_status`."
    cost: >-
      This tells the calling model that extraction survives a client timeout, so it should not re-send. No node holds that behavior. The contract for ingest-document names no timeout or continuation answer. Source is the only place the guarantee is written, and the next reader will look for it in the specification and not find it.
    kind: unstated
    correction: >-
      Analysis would have to give the continues-after-client-timeout behavior of document ingestion a home. The ingestion contract's ingest-document operation is the natural one. The description can then state it truthfully.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/dto/index.ts
    where: >-
      IngestToolDescriptions.start_async_ingestion, lines 113-121
    evidence: >-
      "Ingest a whole document and IMMEDIATELY return the run id while extraction " + "continues in the background."
    cost: >-
      A node says the ingest toolset offers no tool that starts an ingestion and returns before it completes. This file declares a description for exactly such a tool. Its decision log says the tool was retired because ingestion is one-shot, and that a different name for the same behavior would breach the same reason. If this entry is listed to MCP clients, the toolset offers a tool the specification forbids. The description also states a timing fact no node holds ("synchronously (< 1 s)"). I did not read the file that registers tools, so I cannot say whether this entry reaches the tool listing.
    kind: contradicts
    correction: >-
      Remove the start_async_ingestion entry if nothing lists it. If something does list it, the specification and the source have to be reconciled by a person: either the constraint changes or the tool goes.
    node: constraints/ingest-toolset-offers-no-async-ingestion
