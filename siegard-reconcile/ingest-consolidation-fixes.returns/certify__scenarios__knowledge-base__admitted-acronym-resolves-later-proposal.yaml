certified:
  - node: scenarios/knowledge-base/admitted-acronym-resolves-later-proposal
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/entity-resolution-exact-alias-order.spec.ts
        name: resolves the later proposal named CNPq to the node holding the canonical alias and the alias CNPq as matched_existing
    why: >-
      The named test sets up the scenario's given. One active node of the proposal's type holds
      the canonical alias "conselho nacional de desenvolvimento cientifico" and the alias "cnpq".
      The test then proposes "CNPq" of that type and asserts the result is matched_existing to
      that node. Some failures would make it fail. If the service stopped turning an exact-alias
      hit into matched_existing, the result would be the stand-in's created node and the
      assertion would fail. It would also fail if the service fell through to fuzzy matching,
      which the stand-in answers empty, or passed the name and type parameters in a different
      order. One part of the fact is not exercised, though. That part is the store choosing that
      node from a proposal named "CNPq". The stand-in database does not run the lookup's WHERE
      clause. Any query that starts "SELECT na.node_id" and contains "alias_norm = norm(" gets an
      answer from the stand-in's own filter. That filter trims and lowercases the name instead of
      calling the database's norm(). It also checks node type and status "active" itself,
      whatever the SQL says. So suppose the real query stopped returning the node. It could
      compare against the wrong normalization, join the wrong type column, or filter on the
      wrong status. Production would then create a new node, but this test would still pass.
      What the test proves is how the service handles a candidate row it is given, not that the
      lookup finds the node. The other tests in the file also resolve "CNPq" to matched_existing.
      They are about ordering among several homonyms and use the same stand-in, so they leave the
      same part unexercised. A test outside the offered proof may close this, but it is not
      cited here.
    remainder: testable
    remainder_why: >-
      One input against one expected result, run against the real PostgreSQL schema. Persist one
      active knowledge node of a node type with the canonical alias "Conselho Nacional de
      Desenvolvimento Científico" and the alias "CNPq". Then resolve a proposal of the same node
      type named "CNPq". Expect resolution matched_existing with that node's id, and no new
      knowledge_node row.
