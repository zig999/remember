findings:
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      ALIAS_ADMISSION_SQL, the admitted expression (lines 63-68)
    evidence: >-
      OR (norm(a.alias) <> '' AND strpos(r.content_norm, norm(a.alias)) > 0)
    cost: >-
      The refusal of a proposed alias that normalizes to nothing exists only in this query. The node says an alias is admitted when its normalized form occurs in the normalized content. An empty string occurs in any content, so the node would admit it. A reader who looks in the specification for what happens to a blank alias finds no answer, and the code is where the decision lives. In a directed ingestion the same alias is admitted anyway, so the rule is also uneven across the two modes.
    kind: unstated
    correction: >-
      Analysis should state in rules/knowledge-base/alias-admitted-only-from-source, or in a rule beside it, whether an alias whose normalized form is empty is admitted. It should also say whether a directed ingestion is exempt from that refusal.
    node: rules/knowledge-base/alias-admitted-only-from-source
