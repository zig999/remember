findings:
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      lines 74-75 and 85-86, the valid_to field of DirectedAttributeItemSchema and DirectedLinkItemSchema, and its forwarding at lines 480 and 556
    evidence: >-
      valid_to: IsoDateSchema.optional(),  and  ...(item.valid_to !== undefined ? { valid_to: item.valid_to } : {}),  with  .regex(/^\d{4}-\d{2}-\d{2}$/, "valid_from / valid_to must be ISO YYYY-MM-DD")
    cost: >-
      The service accepts a validity end on a directed attribute or link and fixes its shape. The specification holds only the validity start (directed-validity-start-shape), and its decision log records that the end is left unstated because the tool strips it before the service reads it. The end's shape therefore lives only here. The next reader looking for what a directed item may state will not find it in the specification.
    kind: unstated
    correction: >-
      Either the analysis gives the directed validity end a node, or the service stops accepting a field the entry point never delivers. That choice is the person's.
    node: rules/knowledge-base/directed-validity-start-shape
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      refForAttribute, line 741, used as the report reference of every directed attribute entry
    evidence: >-
      return `${item.node_ref}.${item.key}`;
    cost: >-
      A directed attribute's report entry takes a reference built from its node reference and key joined by a dot. No node states this form. The link form is held by directed-link-report-reference, and the log decided the link form only. A client that reads the report relies on a form that only the code states.
    kind: unstated
    correction: >-
      The analysis would give the attribute's report reference a node beside directed-link-report-reference, constraining domain/knowledge-base/directed-item.
    node: domain/knowledge-base/directed-item
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      readClosedRunSafe, lines 839-843 and 861-863, the fallback values for the run's start, finish and attempts
    evidence: >-
      started_at: new Date(0).toISOString(),
          finished_at: new Date(0).toISOString(),
          attempts: 1,
    cost: >-
      When the closed run cannot be read, the answer carries start and finish times at the Unix epoch and one attempt, and the finish time falls back to the epoch while the run is still open. The contract states that the run is reported completed and the affected nodes are an empty list. It states nothing about these values. A reader sees 1970 timestamps as if the business had decided them.
    kind: unstated
    correction: >-
      The contract's ingest-directed answer would have to state what the run's times and attempts are when the run cannot be read, or the answer would have to omit them.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      line 201, the message of the defensive refusal when the payload fails the schema
    evidence: >-
      message: "Input failed Zod parse.",
    cost: >-
      The contract states every shape refusal of ingest-directed with the message "ingest_directed arguments failed validation.". This path, reached when the service is called with a payload its schema refuses, emits a different message. Callers that read the message get two wordings for one refusal.
    kind: contradicts
    correction: >-
      The message would have to be the one the contract names, "ingest_directed arguments failed validation.".
    node: contracts/knowledge-base/ingestion
