    evidence: >-
      This file does not count hops. It takes the hop from the traversal's result and forwards it:
      `score: Math.pow(TRAVERSAL_DECAY, link.hop) * startScore,` and
      `for (const link of traversal.links) { keepBestPath(reached, { link, hop: link.hop, ...`.
      The count itself, starting at 1 for a link next to the start node, is made in another file,
      backend/src/modules/knowledge-graph/service/traversal.service.ts:
      `for (let hop = 1; hop <= input.depth; hop += 1) {` ... `hop,` ... `score,`.
      A change to how a link's hop is counted would reach that file, not this one.
