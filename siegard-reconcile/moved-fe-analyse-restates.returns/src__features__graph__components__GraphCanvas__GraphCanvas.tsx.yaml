read:
  - node: rules/graph-explorer/the-reorganize-control-needs-its-handler
    held_at: |-
      The `onResetLayout &&` branch of the top-right Panel in GraphCanvas, lines 198-209. It renders the Button only when a reset handler is supplied, wires that handler as its click handler, and gives it the visible text and accessible name the node requires.
    evidence: |-
      {onResetLayout && (
        <Button
          type="button"
          variant="secondary"
          size="sm"
          onClick={onResetLayout}
          aria-label="Reorganizar o layout do grafo"
        >
          <Shuffle aria-hidden="true" className="size-4" />
          Reorganizar
        </Button>
      )}
looked_past: |-
  The file also states the layout picker's order and labels (Força, Árvore, Radial), the aria-label "Algoritmo de layout do grafo", the 0.75 default zoom, the 0.1 fit padding and the 300 ms durations. Other graph-explorer nodes outside this set hold these facts, so they are not unstated, and the trace binds this file to several other nodes beyond this pack.