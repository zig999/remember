findings:
  - file: src/features/curation/components/DecisionPanel/EvidenceChip.tsx
    where: |-
      the aria-label prop on the span, lines 14-18, unviewed branch
    evidence: |-
      aria-label={
        viewed
          ? "Evidência vista."
          : "Veja a evidência antes de decidir"
      }
      ...
      {viewed ? "Evidência vista" : "Ver evidência"}
    cost: |-
      The node says the visible words and the accessible name are the same. In the unviewed state the visible text is "Ver evidência", but the accessible name is "Veja a evidência antes de decidir". A screen-reader user hears a different phrase from the one a sighted user reads. That phrase is a wording no node holds, and it lives only in this file. The next reader looks in the specification for what the indicator announces and finds "Ver evidência" there. The viewed branch adds a trailing period ("Evidência vista."), which the visible text lacks. The wording is still the same.
    kind: contradicts
    correction: |-
      The unviewed accessible name would have to be the words the node gives, "Ver evidência", the same words as the visible text. The node already holds the correct wording, so no new node is needed.
    node: rules/curation-workspace/evidence-indicator-pulses-until-viewed
