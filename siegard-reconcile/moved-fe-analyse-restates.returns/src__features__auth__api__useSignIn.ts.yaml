read:
  - node: domain/owner-access/sign-in-attempt
    held_at: |-
      The signIn callback inside useSignIn (lines 73-101), with classifySignInError (lines 37-62) and resolveSafeRedirect (lines 26-35). The credentials, failure kind and destination shapes are declared in ../schema (SignInFormValues, SignInError), not here. This file holds the four operations: submit, request token, classify failure and resolve destination.
    evidence: |-
      await signInWithEmail(values.login, values.senha);

      const jwt = await fetchAccessToken();

      useAuthStore.getState().setToken(jwt);

      const redirectParam = readRedirectParam();
      const target = resolveSafeRedirect(redirectParam);
      void navigate({ to: target });
      } catch (thrown) {
        classified = classifySignInError(thrown);
      } finally {
        setIsLoading(false);
      }
      ...
      setError(null);
  - node: rules/owner-access/sign-in-destination-defaults-to-chat
    held_at: |-
      readRedirectParam (lines 16-24) reads the redirect parameter. resolveSafeRedirect (lines 26-35) falls back to /chat. signIn (lines 86-88) navigates to the resolved target only after the token is stored.
    evidence: |-
      const params = new URLSearchParams(window.location.search);
      return params.get("redirect");
      ...
      if (candidate === null) return "/chat";
      if (candidate.length === 0) return "/chat";
      if (candidate.length > 2048) return "/chat";
      if (!candidate.startsWith("/")) return "/chat";
      if (candidate.startsWith("//")) return "/chat";
      if (candidate.includes("://")) return "/chat";
      if (candidate.includes("\\")) return "/chat";
      return candidate;
looked_past: |-
  The file also implements rules outside its bound set, which I opened from the specification root and found consistent with the code: rules/owner-access/sign-in-destination-is-a-local-path (2048, single slash, "://", backslash), the four failure-classification rules (rejected-credentials, missing-session-or-token, unreachable-provider and network-looking, plus any-other-sign-in-failure-is-unknown), and domain/owner-access/sign-in-failure-kind. They are unbound here, which is a trace matter for the caller, not a conformance finding.