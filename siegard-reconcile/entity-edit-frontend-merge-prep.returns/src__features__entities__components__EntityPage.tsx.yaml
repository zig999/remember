read:
  - node: contracts/entity-workspace/bff-entity-reads
    held_at: >-
      nowhere
    evidence: >-
      The file issues no request. It only calls the hooks, `const nodeQuery = useNodeRead(nodeId);` and `const catalogQuery = useAttributeKeys(formNodeType);`, which are imported from "../api/node.hooks" and "../api/catalog.hooks". The request paths, the node_type query parameter and the envelope reading are not in this file.
  - node: contracts/entity-workspace/entity-screen
    held_at: >-
      the body selection in EntityPage, lines 38-53, with the retry at lines 33-36
    evidence: >-
      `if (nodeFailure === "not-found") { body = <NodeNotFoundAlert />; } else if (nodeFailure === "deleted") { body = <NodeDeletedAlert />; } else if (nodeFailure === "other" || catalogFailed) { body = <FormLoadErrorAlert onRetry={retry} />; } else if (read === undefined) { body = <FormLoading />; } else if (formNodeType === null) { body = <NodeAttributeList attributes={read.attributes} />; } else if (catalogQuery.data === undefined) { body = <FormLoading />; } else { body = <EntityForm node={read} attributeKeys={catalogQuery.data} />; }`. The form is offered only when `read.node.status === ACTIVE_NODE_STATUS`, which is what `formNodeType` tests.
  - node: domain/entity-workspace/entity-edit-session
    held_at: >-
      nowhere
    evidence: >-
      The file declares no shape for the session, with no type, schema or enumeration of node_id, fields, reason, reviewing or undo_deadline. It only reads `nodeId` from `useParams` and passes `node={read}` to `<EntityForm>`.

looked_past: >-
  The deleted-node branch (`body = <NodeDeletedAlert />`) is governed by rules/entity-workspace/a-deleted-node-shows-its-own-alert, which I opened as a searched node and which is outside this pack, so I did not file it as unstated. The alert's wording lives in entity-page-parts.tsx and the failure classification in entity-page-helpers.ts, both outside the file set.