findings:
  - file: src/features/entities/components/entity-form-schema.ts
    where: >-
      HELD_ATTRIBUTE_STATUSES and isHeldAttribute, lines 58-66
    evidence: >-
      const HELD_ATTRIBUTE_STATUSES: readonly string[] = [ "active", "uncertain", DISPUTED_ATTRIBUTE_STATUS, ];
    cost: >-
      domain/knowledge-base/live-assertion-status already enumerates the statuses of an assertion that is still held (active, uncertain, disputed). This array declares that vocabulary a second time, in a file that node is not bound to. entity-field-changed.ts also lists "uncertain" in its own copy. If the enumeration changes, the node's own check never reaches this file. The two copies then disagree and nobody can tell which one was decided.
    kind: contradicts
    correction: >-
      The held-status vocabulary should have one home that the live-assertion-status node binds. Alternatively, the node binding should be extended to this file, so that a change to the node reaches it.
    node: domain/knowledge-base/live-assertion-status
  - file: src/features/entities/components/entity-form-schema.ts
    where: >-
      outsideCatalogGroupsOf (line 92) and buildFieldGroups heldValues (lines 186-188), both through isHeldAttribute
    evidence: >-
      if (!isHeldAttribute(attribute)) continue;
    cost: >-
      The code decides that an attribute outside the catalog, and the values a disputed key lists, are shown only when their status is held. Superseded and deleted attributes are left out. The nodes say only that such an attribute "MUST show its value without a field" and that a disputed key "MUST show its values". The restriction lives only in this file, so the next reader looking for what the form shows will not find it in the specification.
    kind: unstated
    correction: >-
      The analysis should give the node an explicit statement of which of an attribute's statuses the outside-catalog and disputed-key displays show.
    node: rules/entity-workspace/attributes-outside-the-catalog-show-without-a-field
  - file: src/features/entities/components/entity-form-schema.ts
    where: >-
      startingFieldsOf, the multi-valued branch, line 159
    evidence: >-
      return held.length > 0 ? held.map(fieldStartingFrom) : [emptyField(key)];
    cost: >-
      A multi-valued key whose node holds no current attribute opens with one empty field. The node says only "one field for each current attribute the node holds", which gives zero fields for none. The one-empty-field starting state is a form decision no node states, so the next reader looking for what the form shows at open will not find it in the specification.
    kind: unstated
    correction: >-
      The node should state how many fields a multi-valued key shows when the node holds no current attribute of it.
    node: rules/entity-workspace/a-multi-valued-key-is-a-list-of-fields
