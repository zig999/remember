  - node: rules/entity-workspace/a-multi-valued-key-is-a-list-of-fields
    held_at: >-
      startingFieldsOf, multi-valued branch, line 159. Adding and removing fields is not in this file. The empty-field case for no held attribute is reported as a finding.
