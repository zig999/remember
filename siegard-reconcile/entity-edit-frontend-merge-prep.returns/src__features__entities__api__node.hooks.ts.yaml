read:
  - node: contracts/entity-workspace/bff-entity-reads
    held_at: >-
      useNodeRead, the queryFn (lines 15-21). It holds the read-node operation only. The file declares no hook for list-node-types, list-nodes or list-attribute-keys.
    evidence: >-
      await entityGet<NodeReadWire>(`/api/v1/nodes/${encodeURIComponent(nodeId)}`, signal)
  - node: rules/entity-workspace/a-saved-edit-reloads-the-entity
    held_at: nowhere
    evidence: >-
      The file never refetches or invalidates the node. useReloadedNode only reads the cached state: `state?.status === "success" ? state.data : undefined`. The reload after a save is not stated in this file.
  - node: rules/entity-workspace/entity-workspace-requests-carry-the-access-token
    held_at: nowhere
    evidence: >-
      The file sends its request through `entityGet<NodeReadWire>(..., signal)` and names no Authorization header or token. Whatever carries the bearer is in the imported `./_request`, not here.
looked_past: >-
  The unused `UseQueryResult` typing and the choice to return `undefined` from useReloadedNode when the cached state is not a success are implementation shape, not a domain fact.