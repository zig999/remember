findings:
  - file: src/features/auth/components/SignInForm.tsx
    where: >-
      the submit Button's label, line 169
    evidence: |-
      {isSubmitting ? "Entrando…" : "Entrar"}
    cost: >-
      The words the owner reads on the sign-in button, and the change of that
      text while an attempt is in flight, exist only in this component. The
      contract holds the notice, the field labels and the failure messages, so
      the next reader looks there for the button text and does not find it.
      Changing it would not reach any node.
    kind: unstated
    correction: >-
      Analysis would give the button label, and its in-flight label, a home in
      contracts/owner-access/sign-in (or in the credentials value object's
      description, if the business treats it as part of the form), or decide
      that the text is surface only.
    node: contracts/owner-access/sign-in
