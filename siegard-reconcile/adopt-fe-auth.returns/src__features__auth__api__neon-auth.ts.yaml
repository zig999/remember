    where: >-
      The module header comment, lines 16-31 ("Two-step contract").
    evidence: |-
      * 1. POST {base}/sign-in/email  with credentials:'include'
      *      → 401 INVALID_EMAIL_OR_PASSWORD: bad credentials.
      * 2. GET  {base}/token          with credentials:'include'
      *      → 200 { token: "<JWT EdDSA, exp=iat+900s>" } — this is the access token
      *      → 401: session cookie absent or expired.
    cost: |-
      The two requests, their answers and what each answer means are written a second time as prose beside the code that implements them. When the node moves, nothing ties this comment to it, so a reader can take the comment for the decided contract.
