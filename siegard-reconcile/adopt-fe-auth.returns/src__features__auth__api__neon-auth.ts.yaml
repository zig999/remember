      The node says: "a failure carrying the code of the answer's JSON body when it has one, otherwise no code"
    cost: |-
      The node says a failure with no code in the body carries no code. The code gives it the code "UNKNOWN", a sentinel no node holds. A failure with no code and a provider that itself answers with a code spelled UNKNOWN become indistinguishable to whoever reads the code. The next reader will look in the specification for what "UNKNOWN" means as a carried code and will not find it.
    kind: contradicts
    correction: |-
      Either the node states that an answer with no code in its body is carried as the code "UNKNOWN", or the code leaves the code absent in that case.
