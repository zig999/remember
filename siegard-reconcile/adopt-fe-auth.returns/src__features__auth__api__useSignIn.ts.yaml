looked_past: |-
  The header docstring says a step-2 failure surfaces as `unknown`, while the code classifies NO_SESSION and NO_TOKEN as session; that is prose which misstates a fact the code holds correctly, so it is another judgment's, along with the comments on the sanity cap, the navigate-without-await choice and the readRedirectParam rationale.
