    evidence: |-
      const params = new URLSearchParams(window.location.search);
      return params.get("redirect");
    cost: |-
      The name of the query parameter that carries the requested destination is a fact about the sign-in address, and it lives only in this function. The node says only that the owner goes to "the destination the address requested" and never names the parameter. Anything that builds a sign-in address with a destination has to match the string "redirect", and the next reader will look for it in the specification and not find it.
    kind: unstated
    correction: |-
      The analysis would have to give the parameter name a node. The natural home is rules/owner-access/sign-in-destination-defaults-to-chat, or the sign-in-destination value object, or the sign-in contract's open-sign-in operation.
