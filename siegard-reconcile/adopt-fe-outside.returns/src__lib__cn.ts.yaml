findings:
  - file: src/lib/cn.ts
    where: |-
      the extendTailwindMerge call, lines 21-68 (the rounded, font-size, p/m/gap class groups)
    evidence: |-
      rounded: [{ rounded: ["sm", "md", "lg", "xl", "pill"] }],
      "font-size": [{ text: ["display", "heading", "subheading", "body-lg", "body-sm", "label", "caption", "code"] }],
      p: [{ p: ["xs", "sm", "md", "lg", "xl", "2xl"] }],
    cost: |-
      The project's design-token vocabulary is declared as code here: five radius names, eight type-scale names and six spacing names. No node in the specification holds it. A reader who looks in the specification for the token names finds nothing. The next reader has to open this file to learn which names exist. The comment says the list must be kept "in lock-step with theme.css". The specification has no node that reaches this file when the tokens change. The mirroring is therefore held only by that comment.
    kind: unstated
    correction: |-
      If the token scales are a fact the business decided, analysis would give them a node. If they are surface only, the specification already treats spacing and colour as surface, and this stays as styling configuration. The choice is the person's.
read:
  - node: domain/application-shell/application-shell
    held_at: |-
      nowhere
    evidence: |-
      The node holds the shell aggregate (health, curation_pending, as_of, palette_open, address, reason, and the operations open-address, toggle-palette, choose-as-of, show-failure). The file only exports `export function cn(...inputs: ClassValue[]): string { return twMerge(clsx(inputs)); }`, a class-name merge utility. It declares and reads none of the node's attributes or operations.
looked_past: |-
  The doc comment cites front.md §6.4, BR-11, tokens.md and theme.css, none of which is a node. It carries no node's fact, so it is prose for the comment route and not an unstated finding.