certified:
  - node: scenarios/knowledge-base/same-target-other-start-re-affirms
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: "re-affirms a link from A to B valid from 2024-01-01 by a proposal valid from 2024-06-01: provenance added, no new link, validity start kept"
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: "answers a same-target proposal with change hint none and another start as consolidated on the held link"
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: "records no new link when the proposal re-affirms the held link with another start"
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: "adds the provenance of the proposal to the held link"
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: "leaves the held link row unwritten, so its validity start, basis, confidence, status and end stay"
    why: >-
      Every part of the fact is exercised. The setup is a link type that does not allow
      multiple current links, a current link from A to B valid from 2024-01-01, and a
      proposal from A to B with change hint none valid from 2024-06-01. Against it, the
      scenario test asserts four things. The outcome is consolidated on the held link_id,
      which is the re-affirmation. The proposal's fragment is on the held link, which is the
      provenance. No knowledge_link insert is written, so no new link. No knowledge_link
      update is written, which stands in for the link staying valid from 2024-01-01. That
      last assertion asserts more than the fact requires. The fact only says the validity
      start stays, but the test refuses any update to the held row at all. It would also
      fail if a re-affirmation legitimately touched another column of the row. This is a
      finding for a reader to route, not missing coverage. The assertions also rely on the
      write and provenance log of the in-memory world in reaffirm-consolidation-world.js,
      which the pack did not offer, so that file was not opened.
