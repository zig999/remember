findings:
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateLinkOnce, the correction branch (lines 349-367), and consolidateAttributeOnce, its mirror (lines 533-551)
    evidence: >-
      return {
              outcome: "accepted",
              link_id: newRow.id,
              superseded_link_id: vigent.id,
            };
    cost: >-
      The code decides that a correction reports the outcome `accepted` and not `superseded_previous`. It also decides that the outcome carries the superseded identity. No node holds either choice. The contract lists the outcomes as "consolidated, accepted, superseded_previous with the superseded link's identity, or disputed", and correction-replaces says nothing about an outcome. A reader looking in the specification for what a corrected link reports finds nothing, so the answer lives only in this file. The curation and run-summary counts that depend on the outcome follow it.
    kind: unstated
    correction: >-
      The analysis would have to give the outcome a correction reports a node, either in correction-replaces or in the propose-link and propose-attribute answers of the ingestion contract.
    node: rules/knowledge-base/correction-replaces
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateLinkOnce, the fall-through after the `if (vigent !== null)` block (lines 413-418), and consolidateAttributeOnce, its mirror (lines 597-602)
    evidence: >-
      const newRow = await insertLinkRow(client, args, runCtx, {
          status: args.status_for_new_row,
          supersedes_link_id: null,
        });
    cost: >-
      For a type that allows multiple current assertions, a proposal that meets the current assertion at the same triple with change hint succession (neither none nor correction) matches no branch. It is recorded as a new assertion, and `new-assertion` says a new assertion is recorded only when the proposal meets no current assertion. The dispute rule covers only types that do not allow multiple, and re-affirmation requires change hint none. No node says what this case does, so the code settles it silently. In practice the duplicate guard probably turns it into the second-collision refusal, but no node says that either.
    kind: unstated
    correction: >-
      The analysis would have to state what a proposal with change hint succession does when it meets a current assertion of the same target or value under a type that allows multiple current assertions.
    node: rules/knowledge-base/new-assertion
