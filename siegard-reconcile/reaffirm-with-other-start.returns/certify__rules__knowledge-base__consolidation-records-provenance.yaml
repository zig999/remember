certified:
  - node: rules/knowledge-base/consolidation-records-provenance
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: >-
          records, on the assertion a taken proposal lands on, one provenance for each fragment it cites, in every branch of the consolidation order
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: >-
          adds the provenance of the proposal to the held link
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: >-
          adds the provenance of the proposal to the held attribute
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: >-
          adds a second cited fragment once and the already-held one not again when the held link is re-cited
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: >-
          adds a second cited fragment once and the already-held one not again when the held attribute is re-cited
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: >-
          re-affirms a link from A to B valid from 2024-01-01 by a proposal valid from 2024-06-01: provenance added, no new link, validity start kept
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: >-
          re-affirms an attribute holding V valid from 2026-01-01 by a proposal of V valid from 2026-03-01: provenance added, no new attribute, validity start kept
    why: >-
      The fact is exercised whole. The dedicated test sends a link proposal and an attribute proposal, each citing two fragments, through every consolidation branch: new assertion, re-affirmation, correction, succession and dispute. In each case it reads the provenance on the row the result names as the landing and requires exactly one record per cited fragment. It fails if a fragment is dropped, recorded twice, or recorded somewhere else. One finding is for a reader to route, not a gap in coverage. The two "already-held one not again" tests assert something the node does not state: when a cited fragment already has provenance on the held row, no second record is written. The node neither requires nor forbids that. Read strictly ("records ... one provenance for each information fragment it cites"), it could be read as requiring a fresh record from this proposal, so these tests pin one reading of a point the node leaves open. As the pack directed, the fixture module these tests import was not opened. The judgment assumes its provenance list holds the records the consolidation code writes.
