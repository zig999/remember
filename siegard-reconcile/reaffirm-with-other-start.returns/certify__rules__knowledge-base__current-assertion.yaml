certified:
  - node: rules/knowledge-base/current-assertion
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: meets a held link or attribute as current only while it has neither a validity end nor a supersession time
    why: >-
      This test runs all four combinations of validity end and supersession time (each present or absent), for both a held knowledge link and a held node attribute. It treats a held row as current exactly when a change-hint-none proposal with the same target or value consolidates on it. So the test fails if consolidation ignores either field, or treats a row with neither field as not current. That covers the fact only as the consolidation path reads it. The node states currency as a property of every knowledge link and node attribute, with no consumer named. Nothing in the proof reads a held link or attribute back through any other reader of currency, such as the resolved read of a link or attribute, so the fact holding on that side goes unexercised. Separately, the test sees currency only through the in-memory world it imports from reaffirm-consolidation-world.js. That file is not part of the offered proof and was not opened, so this answer does not settle whether the currency decision is made by the service under test or by the fake's own row selection.
    remainder: testable
    remainder_why: >-
      Seed a held link and a held attribute in each of the four combinations (no validity end and no supersession time; only an end; only a supersession time; both). Read each one back through the resolved read the query side serves. Expect it reported current only for the combination with neither field.
