read:
  - node: rules/knowledge-base/reaffirmation-consolidates
    held_at: >-
      nowhere
    evidence: >-
      The file decides no re-affirmation. It answers `SELECT ... FOR UPDATE` with held rows via `selectHeld(state, sql, params)` and records whatever write the code under test issues, with `state.writes.push({ table, kind })`. It never compares change hint or validity start.
  - node: rules/knowledge-base/proposal-meets-current-assertion
    held_at: >-
      nowhere
    evidence: >-
      `matchesWhere` only evaluates the WHERE clause the code under test sends (`where.matchAll(EQUALITY)`, `where.matchAll(IS_NULL)`). The file chooses no target, value or type of its own.
  - node: rules/knowledge-base/consolidation-precedence
    held_at: >-
      nowhere
    evidence: >-
      `answer()` dispatches only on statement shape (`sql.startsWith("INSERT INTO provenance")`, `sql.startsWith("UPDATE information_fragment")`, `recordWrite`). It states no order of re-affirmation, correction, succession, dispute or new assertion.
  - node: rules/knowledge-base/current-assertion
    held_at: >-
      nowhere
    evidence: >-
      `IS_NULL = /(\w+)\s+IS\s+NULL/g` is a generic evaluator of whatever columns the query names. It names no validity-end or supersession column and does not define currency.
  - node: rules/knowledge-base/consolidation-records-provenance
    held_at: >-
      storeProvenance(), which stands in for the store's provenance insert. It is a test double, not the delivering code.
    evidence: >-
      `for (const fragment_id of fragmentIdsOf(params[1])) {` ... `if (!held) state.provenance.push({ target_id: target, fragment_id });`
  - node: rules/knowledge-base/link-provenance-once-per-fragment
    held_at: >-
      storeProvenance(), as a simulation of the store's unique index for links. The file does not own the rule.
    evidence: >-
      `const index = sql.includes("link_id") ? LINK_PROVENANCE_INDEX : ATTRIBUTE_PROVENANCE_INDEX;` and `if (held && !tolerant) throw new UniqueViolation(index);`
  - node: rules/knowledge-base/attribute-provenance-once-per-fragment
    held_at: >-
      storeProvenance(), as a simulation of the store's unique index for attributes. The file does not own the rule.
    evidence: >-
      `const ATTRIBUTE_PROVENANCE_INDEX = "provenance_attr_fragment_uq";` and `if (held && !tolerant) throw new UniqueViolation(index);`
  - node: scenarios/knowledge-base/same-target-other-start-re-affirms
    held_at: >-
      nowhere
    evidence: >-
      The file carries no scenario values such as 2024-01-01 or 2024-06-01. Seeds arrive from the caller as `WorldSeed` rows (`seed.links ?? []`).
  - node: scenarios/knowledge-base/same-value-other-start-re-affirms
    held_at: >-
      nowhere
    evidence: >-
      The file carries no scenario values such as 2026-01-01 or 2026-03-01. Seeds arrive from the caller as `WorldSeed` rows (`seed.attributes ?? []`).
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      nowhere
    evidence: >-
      The file states no operation, outcome, refusal code or message. Its only error is the store-level `UniqueViolation` with `readonly code = UNIQUE_VIOLATION;`, which is a stand-in for the database and not a contract answer.
  - node: domain/knowledge-base/proposal
    held_at: >-
      nowhere
    evidence: >-
      No proposal shape is declared. The file has no kind, confidence, change_hint, value, valid_from or valid_to.
  - node: domain/knowledge-base/knowledge-link
    held_at: >-
      nowhere
    evidence: >-
      Rows are the untyped `export type HeldRow = Readonly<Record<string, string | null>>;`. The link's attributes (status, valid_from, valid_to, superseded_at and the rest) are not declared.
  - node: domain/knowledge-base/node-attribute
    held_at: >-
      nowhere
    evidence: >-
      Rows are the untyped `HeldRow`. The attribute's value, status and validity attributes are not declared.
  - node: domain/knowledge-base/change-hint
    held_at: >-
      nowhere
    evidence: >-
      The file never mentions none, succession or correction. It names no change-hint value.
  - node: domain/knowledge-base/provenance
    held_at: >-
      the `HeldProvenance` interface, which names only the target and the fragment and is a test-world record.
    evidence: >-
      `export interface HeldProvenance { readonly target_id: string; readonly fragment_id: string; }`

looked_past: >-
  The file is a fake of the store (savepoint control, table and index names, ON CONFLICT handling) that reproduces the provenance uniqueness the schema enforces. I took it for test infrastructure and not a second home for the rule, which is a test-design judgment and not this pass's.
