findings:
  - file: src/state/as-of.ts
    where: >-
      The header comment, lines 2 and 9-12, and the `asOf` field's doc comment on line 18.
    evidence: |-
      * useAsOfStore — time-travel cursor (in-memory mirror of the URL `?as_of=…`).
       * The URL is the source of truth — this store is the in-memory cache
       * components read. The router (`useSearch()`) syncs the URL into this store
       * when `?as_of` changes; components only READ from this store, never write
       * directly. Writing happens via `navigate({ search: { as_of: ... } })`.
      /** Time-travel cursor — `null` means "now" (no `?as_of` param). */
    cost: |-
      The comment says the as-of date is mirrored from, and written through, the address (`?as_of`). The node says it is held in memory only and never written to the address. No code carries the URL behaviour. A grep of frontend/src for `as_of`/`asOf`/`useAsOfStore` finds no `useSearch`, no `navigate` and no router sync. `src/shell/Footer.tsx` even notes that it writes the store directly. The comment is therefore the only place the address behaviour appears, and it reads as a decision the business made. The next reader will take the as-of date to be URL-addressable and shareable, when the specification forbids exactly that.
    kind: contradicts
    correction: |-
      Remove the prose that describes the URL as the source of truth and the sync and navigate write path. The comment-only route does this: removal, then /reconcile over the file. The behaviour already matches the node, so no code change is needed.
