findings:
  - file: src/components/ds/StateBadge/StateBadge.tsx
    where: |-
      decideTransition(), lines 125-137, and the variant selection in the component body, lines 206-241
    evidence: |-
      if (prev === "uncertain" && next === "accepted") return "promote";
      if (next === "superseded") return "supersede";
      ...
      } else if (state === "uncertain" && motionAllowed) {
        variants = pulseUncertain(false);
        animateProp = "visible";
    cost: |-
      The badge runs an ambient pulse on `uncertain` and one-shot promote, supersede and merge animations. It also gates all motion on `animate` and on `useReducedMotion()`. The code is the only place that says which state changes are animated and that `uncertain` pulses. A reader looking in the specification for how a confidence change is shown finds neither rule. The two nodes in this set hold only the five labels and the accessible name.
    kind: unstated
    correction: |-
      The analysis would have to decide whether these state-change animations are behavior the specification states or surface it leaves free. If they are behavior, they need a node, likely under domain/application-shell/state-badge.
  - file: src/components/ds/StateBadge/StateBadge.tsx
    where: |-
      the header docstring, line 13, and the block comment at line 41 and the docstring at lines 42-45 above STATE_LABELS
    evidence: |-
      *  - §9   WCAG 2.2 AA: aria-label always present, icon aria-hidden, motion gated by useReducedMotion().
    cost: |-
      The docstring restates the fact that the badge is always named and its icon hidden from assistive technology. The same fact is held by code at the `aria-label` attribute and by `<IconCmp size={iconSize} aria-hidden="true" />`. If the node moves, the prose keeps saying the old fact and `--check` does not reach it.
    kind: restates
    correction: |-
      Remove the prose. The fact is already held by the code in this file, so nothing needs to change in the code.
    node: rules/application-shell/a-state-badge-is-always-named
