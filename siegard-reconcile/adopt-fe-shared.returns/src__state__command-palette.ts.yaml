  - node: rules/application-shell/the-palette-starts-closed-in-memory
    held_at: |-
      the `create<CommandPaletteState>((set, get) => ({ open: false, ... }))` call, lines 20-24. The initial value `open: false` makes it start closed, and the plain `create` has no `persist` middleware or storage, so the state lives in memory only.
    evidence: |-
      export const useCommandPaletteStore = create<CommandPaletteState>((set, get) => ({
        open: false,
        setOpen: (open) => set({ open }),
        toggle: () => set({ open: !get().open }),
      }));
