looked_past: |-
  Comments state facts that no code in this file holds, and prose alone is not a finding: "(entity_match + disputed)" as the composition of the curation total, the claim that the canonical as_of write is `navigate({ search: { as_of } })` with the URL as source of truth, which runs against the in-memory node, and the "Phase 2a/2b" notes that the live hooks are not yet wired. The code also uses `GlassSurface` from `@/components/ds/GlassSurface`, a matter for the comment route and for the code-review judgment, not this pass.