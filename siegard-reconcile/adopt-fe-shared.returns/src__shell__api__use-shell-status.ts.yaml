       * JWT (read from the auth store).
    cost: |-
      The facts that health is read without a token and that the queue needs the access token are stated again in prose. Code holds both facts in this file, in `getJson("/health")` with no token argument and in `enabled: token != null`. The comment is a second home for facts the nodes hold, and it can drift from them unnoticed.
    kind: restates
    correction: |-
      Remove the prose. The code and the nodes already hold the facts.
