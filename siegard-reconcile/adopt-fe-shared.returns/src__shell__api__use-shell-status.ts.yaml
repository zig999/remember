    where: |-
      getJson(), lines 22-28, the template literal inside fetch
    evidence: |-
      const res = await fetch(`${VITE_BFF_URL}${path}`, { headers });
    cost: |-
      The address join is written a second time here, beside the request helper that the node constrains, which the header comment names as bypassed ("Direct fetch (NOT lib/http)"). This copy concatenates unconditionally and has no branch for a path that starts with http:// or https://. The two joins agree only while every caller passes a relative path. If the node moves, the helper follows it, and nothing reaches this copy.
    kind: contradicts
    correction: |-
      The request goes through the one place that holds the join rule. Alternatively, a node states that these two reads are exempt from it. A bind cannot close this, because code never reads the specification.
    node: rules/application-shell/a-request-goes-to-the-back-end-address
