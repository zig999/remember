    where: |-
      the type ChatBubbleVariant, line 34
    evidence: |-
      export type ChatBubbleVariant = "user" | "assistant";
    cost: |-
      The two values a message role can take are declared a second time here. src/features/chat/types.ts already declares `export type ChatMessageRole = "user" | "assistant";`, and the specification's enumeration holds them in domain/chat/message-role. If a role is added, three places can disagree and nobody can tell which one was decided.
    kind: contradicts
    correction: |-
      The bubble's role should take its type from the one existing declaration of the role vocabulary (ChatMessageRole) instead of listing the values again. The specification already holds the vocabulary in domain/chat/message-role.
