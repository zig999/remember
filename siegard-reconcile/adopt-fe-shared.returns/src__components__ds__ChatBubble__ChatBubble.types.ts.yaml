    held_at: |-
      the `toolChips` prop declaration, line 81, carries only the input of the rule: the ordered tool calls. One chip per call, the order, the name-only chip and the pending/ok/error colours are rendered in ChatBubble.tsx and not here.
    evidence: |-
      toolChips?: ReadonlyArray<ToolCallData>;
  - node: rules/application-shell/a-bubble-shows-plain-text
    held_at: |-
      the `content` prop declaration, line 46, which accepts any string including an empty one. Plain rendering with line breaks kept is in ChatBubble.tsx and not in this file.
    evidence: |-
      content: string;
  - node: rules/application-shell/a-bubble-takes-one-role
    held_at: |-
      the `variant` prop, line 41, required and typed by ChatBubbleVariant (line 34). It takes exactly one role. The side and fill that the role decides are realized in ChatBubble.variants.ts and ChatBubble.tsx.
    evidence: |-
      variant: ChatBubbleVariant;
  - node: rules/application-shell/a-user-bubble-may-be-streaming
    held_at: |-
      the `streaming` prop, line 54, which is independent of `variant` and so does not refuse a user bubble marked as streaming. The comment above it says the opposite, and that is reported as a finding.
    evidence: |-
      streaming?: boolean;
