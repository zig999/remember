findings:
  - file: src/components/ds/GraphNode/GraphNode.types.ts
    where: >-
      line 11, the doc comment above the GraphNodeType union
    evidence: |-
      /** The 10 normative NodeTypes (remember-modelagem-v7 §15.1 / tokens.md §6.3). */
    cost: >-
      The number of node types, and the claim that they are normative, is stated a second time in prose beside the
      union that already enumerates ten members. If the set of types changes, the comment still gives its own
      count and its own citation to a document outside the specification tree. A reader checking the type set
      meets two places that each look authoritative.
    kind: restates
    correction: >-
      Remove the comment. The union below it holds the fact, and the node binds it. This is the comment route
      followed by a reconcile over the file.
    node: rules/application-shell/a-graph-node-names-its-type
  - file: src/components/ds/GraphNode/GraphNode.types.ts
    where: >-
      line 31, the doc comment on GraphNodeProps.subtitle
    evidence: |-
      /** Override the subtitle (defaults to the pt-BR type name). */
    cost: >-
      The default-subtitle rule is restated as prose here. The behavior sits in GraphNode.tsx, where the
      subtitle renders as `{subtitle ?? style.label}` and `style.label` is annotated "pt-BR type name (default
      subtitle)". Anyone changing the rule edits the code, and this comment keeps asserting the old rule.
    kind: restates
    correction: >-
      Remove the comment. The fact is held in src/components/ds/GraphNode/GraphNode.tsx, and this file's
      optional `subtitle?: string` prop is the override seam.
    node: rules/application-shell/a-graph-node-names-its-type
