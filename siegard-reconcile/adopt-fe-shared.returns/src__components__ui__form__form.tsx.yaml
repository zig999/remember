    where: |-
      the header docblock, lines 8-10 (the useFormField() bullet)
    evidence: |-
      * - useFormField() joins both contexts + RHF state; THROWS if used outside a
      *     FormField (the misuse is silent otherwise — aria wiring would point at
      *     undefined ids).
    cost: |-
      The rule that a field's wiring read outside a form field raises is stated twice in this file, once as prose and once as the guard at lines 73-75. If the node moves, the prose keeps saying the old rule and nothing reads it. A later reader may take the docblock for the place the rule was decided.
    kind: restates
    correction: |-
      Remove the prose. The code already holds the fact: the `if (!fieldContext) { throw new Error(...) }` guard in useFormField().
    node: rules/application-shell/a-field-outside-a-form-is-a-developer-error
  - file: src/components/ui/form/form.tsx
    where: |-
      the header docblock, lines 11-12 (the FormControl bullet)
    evidence: |-
      * - FormControl (Slot) injects id / aria-invalid / aria-describedby into the
      *     wrapped input so label, description and message are correctly associated.
    cost: |-
      The rule that an invalid field is described by its help text and its error message is restated in prose beside the `aria-describedby` and `aria-invalid` props in FormControl. The two can drift apart without anyone noticing, and the prose gives a reader a second place to look for what the node decided.
    kind: restates
    correction: |-
      Remove the prose. The code already holds the fact: the `aria-describedby` and `aria-invalid` props of the Slot in FormControl.
    node: rules/application-shell/an-invalid-field-is-described
