looked_past: |-
  The optional `fallback` prop (`if (this.props.fallback !== undefined) return this.props.fallback;`) lets a caller swap the failure notice for another. That is an extension point and not a domain fact, and which fallback the root mounts is decided in `__root.tsx`, which is outside this file set. I report it here and make no finding of it.