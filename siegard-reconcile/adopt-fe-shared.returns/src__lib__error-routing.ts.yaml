    evidence: |-
      `kind: "set-error", message: fallbackMessage ?? MSG.validationInvalid, ...("details" in err && err.details !== undefined ? { details: err.details } : {})`. It returns no toast.
  - node: rules/application-shell/any-other-code-shows-a-danger-toast
    held_at: |-
      the last `return` of the `default` branch, line 130
    evidence: |-
      `return { kind: "toast", tone: "danger", message: fallbackMessage ?? MSG.system };`
  - node: rules/application-shell/any-other-system-failure-hides-its-message
    held_at: |-
      the `SYSTEM_` branch of the `default` case, lines 126-128
    evidence: |-
      `if (code.startsWith("SYSTEM_")) { return { kind: "toast", tone: "danger", message: MSG.system }; }`. The server's message is not read.
  - node: rules/application-shell/failure-routing-lives-in-one-function
    held_at: |-
      `routeError`, lines 71-132
    evidence: |-
      `switch (code) { case "AUTH_UNAUTHORIZED": ... case "RESOURCE_GONE": ... default: if (code.startsWith("BUSINESS_")) {...} if (code.startsWith("SYSTEM_")) {...} }`. Exact codes are matched first, then `BUSINESS_` before `SYSTEM_`.
  - node: rules/application-shell/session-expired-failure-carries-no-details
    held_at: |-
