  - node: rules/application-shell/a-bubble-takes-one-role
    held_at: >-
      `data-variant={variant}` and `chatBubble({ variant })` on the root div, and `glassFill` at line 149. The side is decided by the CVA in ChatBubble.variants.ts, which is outside this file.
    evidence: |-
      const glassFill = variant === "user" ? "ambient" : "ambient-accent";
      data-variant={variant}
      className={cn(chatBubble({ variant }), className)}
  - node: rules/application-shell/a-streaming-bubble-is-busy
    held_at: >-
      `ariaBusy`, spread onto the root div, and `StreamingCursorStub` rendered after the content, lines 97-107, 136, 167 and 228
    evidence: |-
      const ariaBusy = streaming ? "true" : undefined;
      {...(ariaBusy !== undefined ? { "aria-busy": ariaBusy } : {})}
      {streaming ? <StreamingCursorStub /> : null}
      <span aria-hidden="true" data-testid="streaming-cursor" ...>
  - node: rules/application-shell/a-user-bubble-may-be-streaming
    held_at: >-
      nowhere in the form of a refusal. No branch rejects `variant === "user"` with `streaming`, and the cursor and `aria-busy` are rendered for any variant.
    evidence: |-
      const ariaBusy = streaming ? "true" : undefined;
      {streaming ? <StreamingCursorStub /> : null}
  - node: rules/application-shell/an-errored-bubble-adds-no-wording
    held_at: >-
      `glassAccent`, passed to `GlassSurface` as `accent`, line 141. No error text is rendered anywhere.
    evidence: |-
      const glassAccent = error ? "error" : "none";
      <GlassSurface level="modal" accent={glassAccent}
  - node: rules/application-shell/only-a-cancelled-reply-shows-a-notice
    held_at: >-
      `STOP_NOTICE_BY_REASON`, the `stopNotice` lookup and the `stop-notice` paragraph, lines 50-52, 131-132 and 235-245
    evidence: |-
      const STOP_NOTICE_BY_REASON: Readonly<Record<string, string>> = { cancelled: "Resposta interrompida", };
      const stopNotice = stopReason !== undefined ? STOP_NOTICE_BY_REASON[stopReason] : undefined;
      {stopNotice !== undefined ? ( <p data-testid="stop-notice" ...> {stopNotice}
