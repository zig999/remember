    held_at: >-
      the `toolChips.map(...)` block rendered before `<GlassSurface>` and the `ToolChipStub` component, lines 60-88 and 171-186
    evidence: |-
      {toolChips !== undefined && toolChips.length > 0 ? ( <div data-testid="tool-chips" ...> {toolChips.map((chip, i) => ( <ToolChipStub key={`${chip.tool}:${i}`} tool={chip.tool} ok={chip.ok} /> ))}
      ok === null ? "border-border-glass text-muted-foreground" : ok ? "border-border-accepted text-state-accepted-fg" : "border-border-error text-state-disputed-fg"
      {tool}
  - node: rules/application-shell/a-bubble-shows-plain-text
    held_at: >-
      the `<p data-testid="bubble-content">` that renders `{content}`, lines 223-229
    evidence: |-
      <p data-testid="bubble-content" className="whitespace-pre-wrap break-words text-xs text-foreground"> {content}
  - node: rules/application-shell/a-bubble-state-is-resolved-in-order
    held_at: >-
      the `data-state` expression on the root div, lines 155-163
    evidence: |-
