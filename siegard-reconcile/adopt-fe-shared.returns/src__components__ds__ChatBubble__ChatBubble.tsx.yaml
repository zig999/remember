findings:
  - file: src/components/ds/ChatBubble/ChatBubble.tsx
    where: >-
      the role/fill comment above `glassFill`, lines 143-148
    evidence: |-
      //  - user (right)      → plain ambient glass.
      //  - assistant (left)  → ambient glass + a touch of the accent (principal)
      //                        color (`--color-surface-glass-ambient-accent`).
    cost: >-
      The role-to-side-and-fill rule is written a second time in prose beside the code that holds it,
      so a reader can take the comment for the place the rule is decided. Code holds the fill here
      (`const glassFill = variant === "user" ? "ambient" : "ambient-accent"`) and the side in
      `chatBubble({ variant })` from ChatBubble.variants.ts. The prose is a second home that
      `--check` does not follow when the node moves.
    kind: restates
    correction: >-
      Remove the comment. The node already holds the fact and the code implements it. The side lives
      in ChatBubble.variants.ts, which the finding names as the second code holder.
    node: rules/application-shell/a-bubble-takes-one-role
  - file: src/components/ds/ChatBubble/ChatBubble.tsx
    where: >-
      the tool-chips slot comment, line 170, and the docblock sentence about chips above the text, line 56-58
    evidence: |-
      {/* Tool chips slot — chips render above the message text (spec §6). */}
    cost: >-
      The placement rule (chips above the text, in the order given) is restated as a comment next to
      the JSX that holds it, citing a spec section that is not the node. A reader may treat the
      comment as the authority, and it would not move with the node.
    kind: restates
    correction: >-
      Remove the comment. The `toolChips.map` block before `<GlassSurface>` holds the placement and the order.
    node: rules/application-shell/a-bubble-shows-its-tool-chips-first
  - file: src/components/ds/ChatBubble/ChatBubble.tsx
    where: >-
      the `ariaBusy` comment, lines 134-135
    evidence: |-
      // ARIA: `aria-busy='true'` only when streaming. Spec §9: removed when
      // streaming ends so live-region semantics do not stay stuck.
    cost: >-
      The busy-while-streaming rule is restated in prose over the code that holds it
      (`const ariaBusy = streaming ? "true" : undefined;` and `{streaming ? <StreamingCursorStub /> : null}`).
      The comment claims a spec section as its authority, which is a second home for the rule.
    kind: restates
    correction: >-
      Remove the comment. The same applies to the docblock comment on `StreamingCursorStub`, lines 90-95,
      which restates that the cursor is hidden from assistive technology.
    node: rules/application-shell/a-streaming-bubble-is-busy
  - file: src/components/ds/ChatBubble/ChatBubble.tsx
    where: >-
      the error-accent comment above `glassAccent`, lines 138-140
    evidence: |-
      // Glass accent — only `error` swaps the border; idle/streaming/stopped all
      // share the default glass border so the bubble's tonal language stays
      // "neutral content surface" by default.
    cost: >-
      The rule that an errored bubble is shown by its border accent alone is restated in prose beside
      `const glassAccent = error ? "error" : "none";`. The comment is a second home for the rule.
    kind: restates
    correction: >-
      Remove the comment. The code holds the rule, and the bubble adds no wording on error.
    node: rules/application-shell/an-errored-bubble-adds-no-wording
  - file: src/components/ds/ChatBubble/ChatBubble.tsx
    where: >-
      the stop-notice comments, lines 49, 128-130 and 232-234, and the docblock item 4, lines 25-26
    evidence: |-
      // Stop-reason notice — table-driven. `stopReason='cancelled'` renders the
      // notice; any other value (including undefined and unknown strings)
      // renders nothing (spec §4 stopped table).
    cost: >-
      The only-cancelled-shows-a-notice rule and its exact copy are restated in several comments, with
      the copy quoted again as "Resposta interrompida". The code holds both in `STOP_NOTICE_BY_REASON`
      (`cancelled: "Resposta interrompida"`) and the `stopNotice` lookup. The comments are second homes
      that cite a spec table instead of the node.
    kind: restates
    correction: >-
      Remove the comments. The table and the lookup in this file hold the fact.
    node: rules/application-shell/only-a-cancelled-reply-shows-a-notice
read:
