  - file: src/components/ui/avatar/avatar.tsx
    where: |-
      lines 19-27, SWATCHES and swatch(), applied in Avatar() at line 50
    evidence: |-
      export const SWATCHES = ["bg-primary", "bg-accent", "bg-data"] as const;
      ...
      for (const c of name) h = (h * 31 + c.charCodeAt(0)) | 0;
      return SWATCHES[Math.abs(h) % SWATCHES.length]!;
    cost: |-
      An avatar's colour is derived from its name by a string hash over a three-colour palette. No node holds that rule, so it lives only in this code. The next reader looks in the specification for what colours an avatar takes and for whether one name always gets one colour, and finds nothing. The file's own header calls this determinism "the load-bearing behavior".
    kind: unstated
    correction: |-
      The analysis would have to give a node the rule that an avatar's colour is a deterministic function of its name, and say how many colours the palette holds. The node an-avatar-is-named-by-the-full-name states only the name, the initials and the blank-name case.
