read:
  - node: domain/knowledge-base/prompt-version
    held_at: >-
      nowhere
    evidence: >-
      The file only passes the version value along: `export const PROMPT_VERSION = "v4" as const;`.
      It declares no enumeration of prompt versions (v1 to v4), so the construct that holds the
      element's shape is in another file.
  - node: rules/knowledge-base/extraction-relative-date-falls-back-to-reception
    held_at: >-
      RECEIVED_AT_ANCHOR_DIRECTIVE, lines 16-33, appended to the v3 system prompt by system() at
      line 37.
    evidence: >-
      "resolve it AGAINST `document_date` if it is present (basis `\"document\"`). If
      `document_date` is `(unknown)`, fall back to the date portion of `received_at` (the
      `YYYY-MM-DD` prefix of the ISO-8601 string) — use basis `\"received\"`." and
      "return `${systemV3(catalog)}\n${RECEIVED_AT_ANCHOR_DIRECTIVE}`;"
  - node: rules/knowledge-base/ambiguous-candidates-need-review
    held_at: >-
      nowhere
    evidence: >-
      The file only composes the v3 system prompt with the received_at directive. It contains no
      node-resolution logic: no similarity threshold, no needs-review status and no entity match
      review.
  - node: rules/knowledge-base/caller-never-states-received
    held_at: >-
      RECEIVED_AT_ANCHOR_DIRECTIVE, lines 25-28. This is the v4 exception only: the model is asked
      to state basis received for a relative date resolved against reception.
    evidence: >-
      "fall back to the date portion of `received_at` (...) — use basis `\"received\"`." The
      directive limits this to relative dates: "The rule applies ONLY to relative dates. Absolute
      dates stated in the chunk text remain `\"stated\"`; never invent a date." The file holds no
      general refusal of the basis received for other proposals.
