looked_past: >-
  Comments in this file state facts as prose, and they are the route that removes prose, not findings. One cites STRUCTURAL_INVALID for a node pin that does not resolve to an active node, although the contract reports VALIDATION_INVALID_FORMAT or RESOURCE_NOT_FOUND. Others restate limits that the code holds in the same file, such as the 120-character ref, and the BR-16 basis restriction. The 10 MiB content limit appears twice, in the start_async and ingest_document schemas. Those schemas also carry values (ref 1..120, label 1..200, attribute text 1..2000, limit 1..50 default 10, ISO date, basis default 'stated') that other nodes outside this file's bindings hold and that conform.
