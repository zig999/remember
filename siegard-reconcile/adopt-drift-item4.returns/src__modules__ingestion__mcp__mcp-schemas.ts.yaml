findings:
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      LlmRunIdField, lines 28-35, the llm_run_id argument added to the four MCP propose_* schemas
    evidence: >-
      llm_run_id: z
          .string()
          .min(1)
          .describe(
            "Active LLMRun id this proposal belongs to. Required on every MCP call (Option B — arg-based run binding). The handler aborts with RESOURCE_NOT_FOUND when the id is unknown or BUSINESS_RUN_NOT_RUNNING when the row exists but its status is not `running`."
    cost: >-
      The contract refuses a malformed LLM run identity with VALIDATION_INVALID_FORMAT on both transports, and its decision log records that MCP proposals used to accept any non-empty text. This schema still accepts any non-empty string, so a value such as "x" passes the Zod parse here. Whether a later check refuses it cannot be seen from this file. The sibling schema in the same file (`get_ingestion_status`) does use `.uuid()`, so the file states the run identity two ways.
    kind: contradicts
    correction: >-
      The run identity on the MCP proposal schemas would have to be refused as a malformed identifier, as it is on the other transport and in `GetIngestionStatusMcpInputSchema`. Or the refusal would have to be shown to happen elsewhere in the tree.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      StartAsyncIngestionMcpInputSchema, lines 81-123, including its description of the BACKGROUND run
    evidence: >-
      export const StartAsyncIngestionMcpInputSchema = z.object({ ... "The full plain text of the document to ingest. Paste the raw content; the server chunks it, runs structured extraction in the BACKGROUND, and persists the knowledge graph with provenance. No base64/binary."
    cost: >-
      The constraint says the ingest toolset offers no tool that starts an ingestion and returns before it completes. Its decision log says the tool is retired because ingestion is one-shot. This file still declares the input contract of such a tool and the text a client would read when it is advertised. A reader of the specification would believe the tool does not exist, while the code is the place it still lives. Whether it is registered is the toolset registrar's, not this file's.
    kind: contradicts
    correction: >-
      The schema and its type would have to go, or a node would have to decide the tool back into the toolset.
    node: constraints/ingest-toolset-offers-no-async-ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedNodeItemSchema, the description of node_id, line 341
    evidence: >-
      Rejected (VALIDATION_INVALID_FORMAT) if the id does not point to an active node.
    cost: >-
      This is text a client reads on `tools/list`. The contract reports a pin that names no knowledge node as rejected with RESOURCE_NOT_FOUND, and only a pin naming a node that is not active as rejected with VALIDATION_INVALID_FORMAT. The description gives one code for both cases, so a caller written to it expects the wrong code for an absent node.
    kind: contradicts
    correction: >-
      The description would have to name RESOURCE_NOT_FOUND for an id that names no node and VALIDATION_INVALID_FORMAT for one whose node is not active. This is emitted text, so it is corrected as behavior and never removed.
    node: contracts/knowledge-base/ingestion
