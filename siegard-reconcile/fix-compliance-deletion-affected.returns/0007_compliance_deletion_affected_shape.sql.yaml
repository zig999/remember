findings:
  - file: 0007_compliance_deletion_affected_shape.sql
    where: >-
      lines 11-12, the COMMENT ON COLUMN statement on compliance_deletion.affected
    evidence: >-
      COMMENT ON COLUMN compliance_deletion.affected IS
        'Contagens do alcance do apagamento: objeto com chunks, fragments, links e attributes, cada um inteiro nao negativo. Sem default.';
    cost: >-
      The column's shape (the four counts, each a non-negative integer, no default) is written a second time
      as catalog prose, beside the CHECK in this file that enforces it and beside
      domain/knowledge-base/affected-counts, which holds it. If the node gains or renames a count, the
      CHECK and the comment can disagree, and nothing reads the comment to notice. The next reader of the
      table description would take it for the shape's home.
    kind: restates
    correction: >-
      Remove the COMMENT ON COLUMN statement. The CHECK constraint in this file already holds the shape and
      the node holds the fact. This is a finding against prose, not behavior. No running system emits the
      catalog comment as a tool description, error message or log line.
    node: domain/knowledge-base/affected-counts
