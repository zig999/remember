  - node: rules/knowledge-base/compliance-deletion-counts-what-it-marked
    held_at: nowhere
    evidence: >-
      The file constrains only the shape of the stored JSON: four keys, each matching '^[0-9]+$'. Nothing
      in a DDL migration can tie the stored numbers to how many rows the deletion actually marked deleted.
      That invariant belongs to the code that performs the deletion, which is outside this file set. The
      file also states no value that contradicts it.
looked_past: >-
