looked_past: >-
  The field `.describe(...)` strings, which are emitted text, state the confidence tiers (">=0.75 stored active; 0.40-0.74 kept but flagged uncertain; <0.40 dropped") and the half-open interval "[from, to)". They agree with rules/knowledge-base/new-assertion-status-from-confidence and rules/knowledge-base/below-confidence-floor-records-nothing, so I reported nothing. The `IsoDateSchema` regex error message, the `ProposeLinkResult` shape and the comment style are not this judgment's.
