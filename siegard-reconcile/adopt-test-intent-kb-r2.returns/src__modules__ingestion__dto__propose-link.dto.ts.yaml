findings:
  - file: src/modules/ingestion/dto/propose-link.dto.ts
    where: >-
      the doc comment above ValidFromBasisSchema, lines 5-15 (the sentences on the `received` basis)
    evidence: >-
      "Only `stated` and `document` are accepted at the API boundary. The third
      value, `received`, is a backend-only fallback ... it is never sent by an LLM or any external
      caller, so it MUST NOT appear in this input enum."
    cost: >-
      The rule that a caller never states `received` is written a second time in prose. The enum
      on line 16 already carries it, and the node does not bind a comment. If the node moves, the
      comment keeps saying the old rule and nothing flags it.
    kind: restates
    correction: >-
      Remove the sentences of the doc comment that restate the rule. The code holds the fact at
      `export const ValidFromBasisSchema = z.enum(["stated", "document"]);` in this file.
    node: rules/knowledge-base/caller-never-states-received
  - file: src/modules/ingestion/dto/propose-link.dto.ts
    where: >-
      the doc comment above ValidFromBasisSchema, lines 5-15 (the sentences on the temporal
      validator's fallback)
    evidence: >-
      "The third value, `received`, is a backend-only fallback that the temporal validator
      applies internally when neither `stated` nor `document` can justify the date"
    cost: >-
      The fallback rule (take the reception date with basis `received`) is described a second
      time in a file that does not implement it. The comment sits in a DTO but speaks for the
      validator, and it can drift from the validator without anyone noticing.
    kind: restates
    correction: >-
      Remove the sentence. The code holds the fact in
      backend/src/modules/ingestion/validation/temporal.ts, which resolves `valid_from := received_at`
      with `valid_from_source := 'received'`.
    node: rules/knowledge-base/required-start-fallback
  - file: src/modules/ingestion/dto/propose-link.dto.ts
    where: >-
      the `change_hint` field of ProposeLinkInputSchema, line 69
    evidence: >-
      change_hint: ChangeHintSchema.default("none").describe(
    cost: >-
      The code treats an omitted `change_hint` as `none`, so an omitted hint takes the re-affirmation
      path. No node states that default for propose-link. The enumeration node lists the values,
      and the re-affirmation rule speaks only of a hint that is none. A reader looking in the
      specification for what an omitted hint means will not find it.
    kind: unstated
    correction: >-
      Analysis should give the omitted-hint default a node. The ingestion contract's propose-link
      operation or the proposal domain node would be the natural home.
    node: contracts/knowledge-base/ingestion
