looked_past: >-
  The 4xx-warn and 5xx-error log level in renderErrorEnvelope, the stale header comments, and the single status per code in the registry (for example 422 for BUSINESS_LINK_RULE_VIOLATION while the ingestion contract answers HTTP 200 with ok false over REST) were not reported. The first two are not domain facts or are comment-rule matters. The last depends on the route files, which are outside this file set.
