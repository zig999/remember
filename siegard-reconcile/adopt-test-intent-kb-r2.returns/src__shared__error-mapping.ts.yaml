findings:
  - file: src/shared/error-mapping.ts
    where: >-
      the comment above codeToHttpStatus, lines 73-81
    evidence: >-
      "every domain sentinel MUST publish its code here so REST + MCP surface byte-identical codes on the same business condition (P2.1 parity contract)."
    cost: >-
      The comment states the node's fact, that both transports answer a refusal with the same error code. Code in this file already holds it: codeToHttpStatus is the one registry, and toMcpToolResult serializes the same envelope.error.code. The comment is a second home outside behavior. A reader can mistake it for where the parity was decided, and it will go stale if the node moves.
    kind: restates
    correction: >-
      Remove the prose. The code in this file already holds the fact, and the constraint node carries it.
    node: constraints/retrieval-transports-answer-alike
  - file: src/shared/error-mapping.ts
    where: >-
      the codeToHttpStatus entry RESOURCE_ALREADY_EXISTS, line 96
    evidence: >-
      RESOURCE_ALREADY_EXISTS: 409,
    cost: >-
      The code and its HTTP 409 are published as a refusal answer, but no node in the specification names this code or any condition that produces it (grep of the whole specification root finds no match). The 409 lives only in this registry. The next reader will look in the specification for what answers 409 and find only RESOURCE_CONFLICT.
    kind: unstated
    correction: >-
      Either an analysis gives the code and its status a node, in the access contract's route-request answers or wherever the producing operation is, or the entry is dropped if no operation produces it.
  - file: src/shared/error-mapping.ts
    where: >-
      the codeToHttpStatus entry BUSINESS_CHAT_INGEST_DISABLED, line 139
    evidence: >-
      BUSINESS_CHAT_INGEST_DISABLED: 503,
    cost: >-
      The code and its HTTP 503 are stated here, but no node holds them. The chat contract holds BUSINESS_CHAT_DISABLED and BUSINESS_CHAT_PROVIDER_UNAVAILABLE, and a grep for CHAT_INGEST and INGEST_DISABLED across the specification finds nothing. The refusal and its status live only in this registry, where the next reader of the chat contract will not look.
    kind: unstated
    correction: >-
      An analysis gives the refusal a node in the chat conversations contract, stating when it is answered and with what message, or the entry is dropped if nothing produces it.
  - file: src/shared/error-mapping.ts
    where: >-
      the doc comment on internalError, line 194
    evidence: >-
      /** 500 — generic internal error. NEVER leaks `err.message` to the client. */
    cost: >-
      The comment restates the access contract's answer for a request that fails for any other cause, "error code SYSTEM_INTERNAL_ERROR with message "Internal server error.", withholding the cause". The function body already holds it by returning a fixed message. The comment is a second home outside behavior and goes stale if the node changes.
    kind: restates
    correction: >-
      Remove the doc comment. The fixed message in internalError holds the fact.
    node: contracts/knowledge-base/access
