findings:
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      LlmRunRow, the status member (line 72)
    evidence: >-
      readonly status: "running" | "completed" | "failed";
    cost: >-
      The three run states are declared here as a type-level union. The node that
      holds that vocabulary is domain/knowledge-base/run-status, and this file is
      bound to neither it nor domain/knowledge-base/llm-run. If the enumeration
      changes, `--check` never reaches this file. The next reader then finds two
      declarations of the run states and cannot tell which one the business decided.
    kind: contradicts
    correction: >-
      The vocabulary lives in one place. Either this file is bound to
      domain/knowledge-base/run-status and domain/knowledge-base/llm-run, since
      LlmRunRow declares their shape, or the row type takes its status type from
      the file that is bound to them.
    node: domain/knowledge-base/run-status
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      the doc comments of insertRawChunks (line 153) and findChunksByRawInformationId (lines 182-183)
    evidence: >-
      * Find every `raw_chunk` of the given `raw_information_id`, ordered by
      * `chunk_index` ascending. Used by GET .../chunks.
    cost: >-
      The comment states the chunk listing order a second time as prose. The
      running code already holds it in this file as `ORDER BY chunk_index ASC`
      and `result.rows.sort((a, b) => a.chunk_index - b.chunk_index)`. The pair
      conforms. What is owed is the removal of the prose, so that the only home
      of the order is the code and the node.
    kind: restates
    correction: >-
      Remove the prose that states the ordering (line 153 and lines 182-183).
      The code that holds the ordering stays.
    node: rules/knowledge-base/chunk-listing-order
