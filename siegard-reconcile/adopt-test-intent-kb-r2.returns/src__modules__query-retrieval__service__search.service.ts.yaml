findings:
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      lines 53-56, the constant PER_LAYER_FETCH_LIMIT and its use in the three layer calls at lines 128-148
    evidence: >-
      const PER_LAYER_FETCH_LIMIT = 200;  ... searchFragmentLayer(client, input.query, PER_LAYER_FETCH_LIMIT) ... searchNodeAliasLayer(client, input.query, PER_LAYER_FETCH_LIMIT) ... searchChunkLayer(client, input.query, PER_LAYER_FETCH_LIMIT)
    cost: >-
      The code keeps at most 200 hits per layer before ranking, and the search total is counted only over what survives that cut. No node states the number or the cap. search-total-before-pagination says the total counts "every search item", so for a broad query the total and the reachable results are smaller than that node reads, and the next reader looking in the specification will not find why.
    kind: unstated
    correction: >-
      Give the per-layer candidate cap a node, or state in the total rule that the total counts the items kept after a per-layer cap.
    node: rules/knowledge-base/search-total-before-pagination
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      lines 178-184, the comment block after the dedup loop
    evidence: >-
      // BR-10: a chunk hit not anchored by ANY fragment in the result set is
      // dropped (we never surface raw-chunk text without the fragment lens).
      // We retain chunk hits only if explicitly requested and no fragment
      // anchored them. Per the spec ("collapse predates ranking; the final
      // list never carries a chunk row"), we DROP all chunk hits unconditionally
    cost: >-
      The prose restates "A chunk-layer match never surfaces as a search item". The code holds the fact, because no chunk hit is ever pushed to `items`, so the pair conforms. The comment also contradicts itself: it says chunk hits are retained when explicitly requested, then says all are dropped. A reader could take that as a second, unwritten rule.
    kind: restates
    correction: >-
      Remove the comment. The fact lives in the node and in the absence of any chunk push into `items` in this file.
    node: rules/knowledge-base/chunk-match-never-surfaces
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      lines 293-295, the comment above the link score
    evidence: >-
      // For each link returned by the traversal, surface a `link` SearchItem.
      // Score = TRAVERSAL_DECAY ** hop * <source node score>.
      // We look up the source-node score by searching the items array.
    cost: >-
      The prose restates the hop-decay scoring rule, which the code also holds at line 322 (`Math.pow(TRAVERSAL_DECAY, hop) * sourceScore`). It is a second home outside behavior: if the rule moves, the comment still states the old formula.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/expansion-decay
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      lines 316-322, resolution of `sourceScore` for a link reached by expansion
    evidence: >-
      // The hop's source node id is one of the endpoints — pick whichever
      // is in our scoring map; fall back to the highest source score.
      const sourceScore =
        nodeScoreById.get(link.source_node_id) ??
        nodeScoreById.get(link.target_node_id) ??
        0;
      const score = Math.pow(TRAVERSAL_DECAY, hop) * sourceScore;
    cost: >-
      expansion-decay says a link reached at hop h scores 0.5^h times the score of the matched node it was reached from. This code takes the score of whichever endpoint is itself a matched node (the map holds only node hits). A link reached at hop 2 or 3, whose endpoints are not matched nodes, scores 0 instead of 0.5^h times its originating match's score. The fallback is 0, not the "highest source score" the comment promises. Such links rank last, and which endpoint wins is decided here and not by the node. This was read from this file alone; the shape of `traversal.links` was not opened.
    kind: contradicts
    correction: >-
      Score each link from the matched node the traversal reached it from, as the node states, and not from whichever endpoint happens to be in the scoring map.
    node: rules/knowledge-base/expansion-decay
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      lines 381-382, the comment above the sort
    evidence: >-
      // (i) Rank (BR-15): score DESC, recordedAtTs DESC, id ASC.
    cost: >-
      The prose restates the ranking order, which the sort comparator at lines 384-389 holds in this file. A second statement of the order outside behavior drifts silently when the node moves.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/search-ranking
