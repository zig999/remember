findings:
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      the doc comment on orphaned_fragments inside LlmRunSummarySchema, lines 51-59
    evidence: >-
      Fragments proposed by this run that carry NO provenance row — i.e. the
      LLM extracted them but never cited them in any consolidated link/attribute.
      Such fragments stay `status='proposed'` and are excluded from the partial
      FTS index (`WHERE status='accepted'`)
    cost: >-
      The definition of an orphaned fragment is written a second time in prose beside a field that
      only declares a count. The code that computes it is in
      src/modules/ingestion/repository/llm-run.repository.ts (`summary.orphaned_fragments = orphan.rows[0]?.n ?? 0;`).
      If the node's definition moves, this comment keeps saying the old one and nothing flags it.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by the node and by the repository code that computes
      the count.
    node: rules/knowledge-base/orphaned-fragment
  - file: src/modules/ingestion/dto/llm-run.dto.ts
    where: >-
      the doc comment on LlmRunResponseSchema, lines 80-90
    evidence: >-
      `affected_nodes` (BR-33, v1.3.0) is OPTIONAL — attached ONLY when
      `status === 'completed'`.
    cost: >-
      The rule that affected nodes are listed only for a completed run is restated as prose in a
      file that only declares the key as `.optional()`. The code that enforces it is in
      src/modules/ingestion/service/llm-run.service.ts (`if (row.status === "completed") {`).
      A reader of the DTO takes the comment for where the rule lives, and a change to the node
      leaves it behind.
    kind: restates
    correction: >-
      Remove the comment. The node holds the rule and llm-run.service.ts implements it.
    node: rules/knowledge-base/affected-nodes-only-when-completed
read:
  - node: contracts/knowledge-base/access
    held_at: nowhere
    evidence: >-
      The file declares only LlmRun DTO schemas, such as `export const LlmRunStatusSchema = z.enum(["running", "completed", "failed"]);`.
      It carries no authentication, routing or health answer.
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      RetryLlmRunRequestSchema, ListToolCallsQuerySchema, LlmRunResponseSchema, ToolCallResponseSchema
      and ListToolCallsResponseSchema (lines 91-140)
    evidence: >-
      `reason: z.string().max(500).optional(),` ; `limit: z.coerce.number().int().min(1).max(100).default(50),` ;
      `offset: z.coerce.number().int().min(0).default(0),` ;
      `affected_nodes: z.array(AffectedNodeSchema).optional(),`.
      These match the contract: retry reason over 500 characters is refused, the tool-call page has a limit and offset,
      the run is read with its summary and affected nodes, and a tool call has identity, run, tool name, arguments,
      result, validation outcome and recording time.
  - node: contracts/knowledge-base/retrieval
    held_at: nowhere
    evidence: >-
      The file declares only LlmRun and ToolCall DTOs, such as `export const ToolCallResponseSchema = z.object({`.
      It carries no search, provenance, catalog or graph read.
