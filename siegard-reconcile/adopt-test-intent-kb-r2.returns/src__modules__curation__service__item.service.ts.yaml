      // BR-23 (TC-04): when correcting an attribute AND `corrected.value` is
      // supplied, run two legs against the predecessor's `attribute_key`
      // BEFORE any DB write: ... curation re-raises as `BUSINESS_INVALID_ATTRIBUTE_VALUE` (HTTP 422)
    cost: >-
      The comment restates, in prose, the type leg, the closed-domain leg and the
