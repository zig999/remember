      fragment's provenance. A node holds that rule and the code at lines 342-352 enforces it, so the citation is
      a second reference to it outside behavior.
    kind: restates
    correction: >-
      Remove the comment. The appendProvenanceFragment call holds the fact, together with the copyProvenance
