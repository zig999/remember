findings:
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the header comment, lines 7-8 (Type-catalog membership), and the docstring of assertKnownType, lines 146-149
    evidence: >-
      "//   - Type-catalog membership (BUSINESS_UNKNOWN_{NODE_TYPE|LINK_TYPE|ATTRIBUTE_KEY}):
      //       node_type, link_type, attribute_key all live in the seeded catalog."
    cost: >-
      Prose says a node's fact (a node proposal names a node type the catalog holds) while assertKnownType
      throws BUSINESS_UNKNOWN_NODE_TYPE for it. A reader may take the comment as the home of the rule and
      look no further, and the comment will not follow the node if the node moves.
    kind: restates
    correction: >-
      Remove the comment text. The rule stays held by assertKnownType in this file (the code mapping) and
      by the caller that supplies `found`.
    node: rules/knowledge-base/node-type-in-catalog
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the docstring of parseAttributeValue, lines 22-26, and the inline comments "// Strict ISO YYYY-MM-DD; not free-form." and "// Strict: must be a finite numeric literal (no NaN, no Infinity)."
    evidence: >-
      "Parse a `value` string against its declared `value_type`. ... Rejects \"tomorrow\" for `date`, \"abc\" for `number`, etc."
    cost: >-
      The per-type value formats are stated in prose and again in the regexes below it
      (/^\d{4}-\d{2}-\d{2}$/, /^-?\d+(?:\.\d+)?$/, v !== "true" && v !== "false"). The comment will not
      follow the node.
    kind: restates
    correction: >-
      Remove the docstring and the inline comments. The rule stays held by the branches of
      parseAttributeValue.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the docstring of assertValueInDomain, lines 88-108, and the comment at lines 116-118
    evidence: >-
      "exact-match string equality, no normalisation, no case-folding, no trim (v1 semantics, §1 / BR-30)."
    cost: >-
      The "exactly as written" semantics and the sorted listing of allowed values are described in prose
      beside the code that applies them (`domain.has(value)` and `[...domain].sort()`). The docstring also
      points to a delivery record ("spec_divergences") and a prompt builder outside the node's reach.
    kind: restates
    correction: >-
      Remove the docstring and the comment. The rule stays held by `domain.has(value)` and
      `[...domain].sort()` in assertValueInDomain.
    node: rules/knowledge-base/attribute-value-in-allowed-values
