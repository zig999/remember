findings:
  - file: src/modules/curation/dto/entity-match.dto.ts
    where: >-
      the doc comments above ResolveEntityMatchBodySchema (lines 17-19) and above MergeNodesBodySchema (line 62)
    evidence: >-
      " * ResolveEntityMatchRequest — BR-11 (reason mandatory on merge_into),
      * BR-23 (self-merge forbidden at request shape)." and
      "/** MergeNodesRequest — BR-11 (reason required), BR-23 (self-merge forbidden). */"
    cost: >-
      The self-merge rule is stated in prose here and in code in two places. MergeNodesBodySchema.superRefine in this file
      raises "BUSINESS_SELF_MERGE_FORBIDDEN" when survivor_id equals absorbed_id. src/modules/curation/service/entity-match.service.ts
      also raises BUSINESS_SELF_MERGE_FORBIDDEN, and that is the only place the resolve path can check it, because its node_id travels
      in the path and not in the body. The resolve comment says "at request shape", which this file does not do for the resolve body.
      A reader trusting the comment would look for the check in the wrong place.
    kind: restates
    correction: >-
      Remove the self-merge clause from both comments. The pair conforms, since the code holds the rule. This is the comment
      route, followed by /reconcile over the file.
    node: rules/knowledge-base/node-never-merged-into-itself
  - file: src/modules/curation/dto/entity-match.dto.ts
    where: >-
      the same doc comments (lines 17-18 and line 62), the BR-11 clauses
    evidence: >-
      "BR-11 (reason mandatory on merge_into)" and "BR-11 (reason required)"
    cost: >-
      The reason requirement is restated in prose beside the code that holds it. In this file, the superRefine branch for
      merge_into adds the issue "BUSINESS_REASON_REQUIRED", and MergeNodesBodySchema uses `reason: ReasonRequiredSchema`.
      The comment cites the project's internal BR-11 label, not the node, so the next reader is pointed away from the specification.
    kind: restates
    correction: >-
      Remove the BR-11 clauses from the comments. The code already holds the rule.
    node: rules/knowledge-base/curation-reason-required
