findings:
  - file: src/modules/query-retrieval/routes/query-retrieval.routes.ts
    where: >-
      the comment block above the error mappers, lines 186-198
    evidence: >-
      BR-24 (knowledge-graph.back.md / query-retrieval.back.md): both REST and MCP
      transports surface IDENTICAL error codes / messages for any thrown service
      error. The classification core lives in
      `backend/src/modules/knowledge-graph/mcp/error-envelope.ts`
    cost: >-
      The fact that the two transports answer alike is stated in prose here as well as in the node,
      and the comment cites a back-spec rule number (BR-24) rather than the node. A reader who trusts
      the comment has a second place that claims to say what the transports owe each other.
      The comment goes stale silently if the node moves.
    kind: restates
    correction: >-
      Remove the comment. The code that holds the fact is the shared mapper
      `mapErrorToHttpResponse` in src/modules/knowledge-graph/mcp/error-envelope.ts, which this file
      calls from handleSearchError and handleProvenanceError. Removing the prose goes through the
      comment route, followed by /reconcile over this file.
    node: constraints/retrieval-transports-answer-alike
  - file: src/modules/query-retrieval/routes/query-retrieval.routes.ts
    where: >-
      the comment above the GET /fragments/accepted route, lines 157-163
    evidence: >-
      Lists `information_fragment` rows with `status = 'accepted'`
      filtered by `llm_run_id` and/or `raw_information_id` (at least
      one required).
    cost: >-
      The rule that an accepted-fragment listing must name a run, a raw information or both is
      written a second time in prose in the route file. The enforcing code is elsewhere
      (ListAcceptedFragmentsQuerySchema refine in dto/fragment.dto.ts), so a reader of this route
      sees a claim and no enforcement.
    kind: restates
    correction: >-
      Remove the sentence. The code holds the fact in src/modules/query-retrieval/dto/fragment.dto.ts:
      `(v) => v.llm_run_id !== undefined || v.raw_information_id !== undefined`.
    node: rules/knowledge-base/listing-requires-a-filter
  - file: src/modules/query-retrieval/routes/query-retrieval.routes.ts
    where: >-
      the file header comment, lines 3-5
    evidence: >-
      The parent scope
      // already enforces Neon Auth JWT (BR-01); individual handlers do NOT
      // re-check the token.
    cost: >-
      The owner-authentication behavior is described in prose in a file that does not hold it. The
      description cites BR-01 and not a node. It says the same thing as the access contract's
      authenticate-owner operation.
    kind: restates
    correction: >-
      Remove the sentence. The code that enforces it is the requireNeonAuth preHandler on the scope
      into which src/app.ts mounts registerQueryRetrievalRoutes (app.ts line 266).
    node: contracts/knowledge-base/access
