findings:
  - file: src/modules/knowledge-graph/service/history.service.ts
    where: >-
      assembleLinkHistory (lines 150-155) and assembleAttributeHistory (lines 174-179), the warning logged for a version with no provenance
    evidence: >-
      if (row.status !== "deleted" && provenance.length === 0) {
        logger.warn(
          { route, link_id: row.id, status: row.status },
          "knowledge_graph_empty_provenance"
        );
      }
      (the attribute twin logs { route, attribute_id: row.id, status: row.status } under the same message)
    cost: >-
      The code treats a non-deleted link or attribute version with an empty provenance list as an anomaly worth an alarm, and treats a deleted one as unremarkable. No node in the set or among the candidates states this. The nearest, rules/knowledge-base/graph-read-shows-empty-provenance, says only that a graph read answers such an item with an empty provenance list. A reader who looks in the specification for what an unsourced version means finds the answer in a log call.
    kind: unstated
    correction: >-
      An analysis would have to decide whether an unsourced non-deleted version is an alarm condition. If it is, the decision goes into a node, probably beside rules/knowledge-base/graph-read-shows-empty-provenance.
read:
  - node: contracts/knowledge-base/access
    held_at: nowhere
    evidence: >-
      The file states no authentication, routing, validation or health answer. It only throws ResourceNotFoundError, NodeDeletedError and UnknownAttributeKeyError, which are imported from "./errors.js".
  - node: contracts/knowledge-base/ingestion
    held_at: nowhere
    evidence: >-
      The file does no intake, proposal, extraction or run reads. It only has the history services getLinkHistoryService, getAttributeHistoryService and getAttributeKeyHistoryService.
  - node: contracts/knowledge-base/retrieval
    held_at: >-
      getLinkHistoryService, getAttributeHistoryService and getAttributeKeyHistoryService, with the assemblers assembleLinkHistory and assembleAttributeHistory. These cover the read-link-history, read-attribute-history and read-attribute-key-history operations. Both assemblers return `{ versions }`.
    evidence: >-
      `if (rows === null) { throw new ResourceNotFoundError("KnowledgeLink", linkId); }`. The attribute twin throws ResourceNotFoundError("NodeAttribute", attributeId). The key-history service throws ResourceNotFoundError("KnowledgeNode", input.nodeId) when the node is absent, and `if (node.status === "deleted") { throw new NodeDeletedError(input.nodeId); }`. A key missing from the catalog throws `new UnknownAttributeKeyError(node.node_type, input.key)`. A key with no rows returns `{ versions }` with an empty list. Each version is built with toLinkDetail(row, provenance) or toAttributeDetail(row, provenance).
