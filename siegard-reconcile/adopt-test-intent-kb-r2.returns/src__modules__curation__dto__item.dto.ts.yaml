looked_past: >-
  The facts this file's code implements belong to nodes outside the pack, mainly contracts/knowledge-base/curation and the rules curation-reason-required, curation-reason-not-blank, correction-changes-something, correction-fits-assertion-kind, stated-start-requires-basis, corrected-stated-start-cites-fragment and validity-start-before-end, and no conformance finding was made against them. Two points were left to another judgment. The issue messages are bare error-code tokens such as "BUSINESS_CORRECTION_NO_CHANGES", while the curation contract states full wording for them. Whether the 1000-character cap of curation-action-reason-length is enforced is not visible here, because `ConfirmItemBodySchema` declares `reason` with no maximum and `ReasonRequiredSchema` is declared in enums.dto.js.
