findings:
  - file: src/modules/curation/dto/item.dto.ts
    where: >-
      line 21, the comment above RejectItemBodySchema
    evidence: >-
      /** reject_item — reason mandatory (destructive, BR-11). */
    cost: >-
      The comment states, as prose, the fact that a rejection must state a reason. A reader can take the comment for the place the rule lives, when it lives in rules/knowledge-base/curation-reason-required and in the code line `reason: ReasonRequiredSchema`. The "BR-11" citation points to a back-spec numbering, not to a node, so it can drift from the node unnoticed.
    kind: restates
    correction: >-
      Remove the comment. The code that holds the fact is `reason: ReasonRequiredSchema` in RejectItemBodySchema and in CorrectItemBodySchema.
    node: rules/knowledge-base/curation-reason-required
  - file: src/modules/curation/dto/item.dto.ts
    where: >-
      line 53, the comment above the someProvided check in CorrectItemBodySchema.superRefine
    evidence: >-
      // BR-18: at least one of value/target_node_id/valid_from/valid_to.
    cost: >-
      The comment states in prose the rule that a correction must change at least one field, while the `someProvided` branch holds it too. The node rules/knowledge-base/correction-changes-something is where the business decided it, and the BR-18 label is a second, unbound naming of the same rule.
    kind: restates
    correction: >-
      Remove the comment. The `someProvided` branch with the issue `BUSINESS_CORRECTION_NO_CHANGES` holds the fact.
    node: rules/knowledge-base/correction-changes-something
  - file: src/modules/curation/dto/item.dto.ts
    where: >-
      line 67, the comment above the two item_kind cross-field checks
    evidence: >-
      // Cross-field: value only on attribute, target_node_id only on link.
    cost: >-
      The comment restates the rule that a correction must not change a link's value or an attribute's target node. The two `ctx.addIssue` branches that follow already enforce it. The node rules/knowledge-base/correction-fits-assertion-kind is the home of the rule, so the comment is a second copy that can be read as authority.
    kind: restates
    correction: >-
      Remove the comment. The branches `body.item_kind === "link" && c.value !== undefined ...` and `body.item_kind === "attribute" && c.target_node_id !== undefined ...` hold the fact.
    node: rules/knowledge-base/correction-fits-assertion-kind
  - file: src/modules/curation/dto/item.dto.ts
    where: >-
      line 87, the comment above the valid_from / valid_from_source checks
    evidence: >-
      // valid_from change requires valid_from_source.
    cost: >-
      The comment restates the rule that a correction stating a validity start must state its basis. The `c.valid_from_source === undefined || ... === null` branch holds the same rule in code. A reader who trusts the comment may look here, not in rules/knowledge-base/stated-start-requires-basis, when the rule changes.
    kind: restates
    correction: >-
      Remove the comment. The branch that adds `BUSINESS_DATE_UNJUSTIFIED` at path `corrected.valid_from_source` holds the fact.
    node: rules/knowledge-base/stated-start-requires-basis
  - file: src/modules/curation/dto/item.dto.ts
    where: >-
      line 112, the comment above the valid_from >= valid_to check
    evidence: >-
      // Semi-open invariant on the new pair when both supplied.
    cost: >-
      The comment names, in prose, the rule that a correction giving both dates must put the start strictly before the end. The `c.valid_from >= c.valid_to` branch holds it too. The node rules/knowledge-base/validity-start-before-end is where it was decided.
    kind: restates
    correction: >-
      Remove the comment. The branch `c.valid_from >= c.valid_to` that adds `BUSINESS_TEMPORAL_INCOHERENT` holds the fact.
    node: rules/knowledge-base/validity-start-before-end
