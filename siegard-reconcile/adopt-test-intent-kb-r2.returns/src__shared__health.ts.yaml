findings:
  - file: src/shared/health.ts
    where: >-
      the docstring above collectHealth, lines 18-23
    evidence: >-
      Never
      throws — a DB failure surfaces as `{ ok: false, database: "unreachable" }`
      so callers always get a usable report (the BFF answering at all proves it is
      running; the `database` field reports the dependency separately).
    cost: >-
      The docstring states the read-health answer a second time (ok false and database "unreachable" when the store does not answer) in prose no running system emits. The catch branch in this same file already holds that answer. Prose that restates a node's fact can drift from the node unnoticed, and the next reader may treat it as the place the rule was decided.
    kind: restates
    correction: >-
      Remove the docstring prose. The fact stays held by the HealthReport shape and the try/catch in collectHealth in this file, and by the node.
    node: contracts/knowledge-base/access
