    evidence: >-
      export interface HealthReport { ok: boolean; service: "remember-bff"; database: "ok" | "unreachable"; checked_at: string; } and, in the try branch after `await pingDatabase(pool);`, `return { ok: true, service: "remember-bff", database: "ok", checked_at: checkedAt }`, with `database: "unreachable"` and `ok: false` in the catch. checkedAt is `new Date().toISOString()`.
