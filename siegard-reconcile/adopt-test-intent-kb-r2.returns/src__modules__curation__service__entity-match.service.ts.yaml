findings:
  - file: src/modules/curation/service/entity-match.service.ts
    where: >-
      line 45, the comment above the self-merge guard in resolveEntityMatchService
    evidence: >-
      // BR-23 defence in depth on resolveEntityMatch (target == self).
    cost: >-
      The comment says again that a node is never merged into itself, using a back-spec rule number (BR-23) that is not a specification identity. The code below it holds the rule (`body.target_node_id === nodeId` throwing BUSINESS_SELF_MERGE_FORBIDDEN). A reader who follows the comment goes to a document the specification does not bind, and the prose stays behind when the node moves.
    kind: restates
    correction: >-
      Remove the comment. The guard already holds the fact, and the trace is the place for the link from this file to the node.
    node: rules/knowledge-base/node-never-merged-into-itself
  - file: src/modules/curation/service/entity-match.service.ts
    where: >-
      line 60, the comment inside the keep_separate branch, above loadNodesForUpdate
    evidence: >-
      // BR-26: lock node and assert needs_review.
    cost: >-
      The comment restates the rule that an entity-match resolution must resolve a node in needs-review, and cites a back-spec number (BR-26) in place of the node. The code holds the rule (`if (node.status !== "needs_review") { throw new ConflictError("BUSINESS_REVIEW_NOT_PENDING", ...`). The comment is a second home for the fact outside behavior.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/entity-match-resolution-requires-pending-review
  - file: src/modules/curation/service/entity-match.service.ts
    where: >-
      line 90, the comment above the keep_separate deleteEntityMatchReviewByNode call
    evidence: >-
      // BR-10: drop review-context rows.
    cost: >-
      The comment restates the rule that an accepted resolution removes every entity match review of its node, citing a back-spec number (BR-10). The code holds it (`await deleteEntityMatchReviewByNode(client, nodeId);`, called in both branches). The prose duplicates the node's fact and points to a rule id the specification does not use.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/entity-match-resolution-clears-reviews
