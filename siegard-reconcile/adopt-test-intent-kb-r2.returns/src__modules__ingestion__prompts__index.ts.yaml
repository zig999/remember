findings:
  - file: src/modules/ingestion/prompts/index.ts
    where: >-
      header comment, lines 10-15, and the doc comment above UnknownPromptVersionError, line 72
    evidence: >-
      // An unknown version is a configuration error, NOT a silent fallback: BR-26
      // step 2 mandates "load the extraction.${prompt_version} module; fail with 500
      // SYSTEM_INTERNAL_ERROR if the module is missing". `selectPromptModule` throws
      // `UnknownPromptVersionError`
    cost: >-
      The refusal of an unknown prompt version is stated twice here, in prose and in the throw at
      selectPromptModule. The prose also states the HTTP status and error code. A reader who
      changes the node will not know that these comments say it again, and they will keep saying
      the old rule.
    kind: restates
    correction: >-
      Remove the comment prose. The throw in selectPromptModule (this file) holds the fact. The
      node is rules/knowledge-base/prompt-version-known. The contract operations run-extraction
      and ingest-document hold the SYSTEM_INTERNAL_ERROR answer.
    node: rules/knowledge-base/prompt-version-known
  - file: src/modules/ingestion/prompts/index.ts
    where: >-
      doc comment above DEFAULT_PROMPT_VERSION, line 62
    evidence: >-
      /** Recommended version for NEW runs — callers SHOULD send this at intake. */
      export const DEFAULT_PROMPT_VERSION: string = v4.PROMPT_VERSION;
    cost: >-
      The comment states in prose which version new runs take. The constant holds that version,
      and the comment describes a "SHOULD send" practice that no node holds. If the default moves,
      the comment is one more place that says the old value.
    kind: restates
    correction: >-
      Remove the comment. The constant DEFAULT_PROMPT_VERSION holds the fact. The node is
      rules/knowledge-base/default-prompt-version.
    node: rules/knowledge-base/default-prompt-version
