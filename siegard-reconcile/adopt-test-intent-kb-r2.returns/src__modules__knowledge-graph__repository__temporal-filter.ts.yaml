findings:
  - file: src/modules/knowledge-graph/repository/temporal-filter.ts
    where: >-
      header comment, lines 13-15 ("Modes" item 1, the current view)
    evidence: >-
      //   1. asOf undefined            -> "current view" (query (a), BR-07):
      //        AND <alias>.valid_to IS NULL
      //        AND <alias>.superseded_at IS NULL
    cost: >-
      The comment states a second time the rule that a read with no as-of date shows only current items. The code
      in this file already holds it (`AND ${alias}.valid_to IS NULL`, `AND ${alias}.superseded_at IS NULL`), and
      the node holds it too. If the rule changes, this prose keeps saying the old one and nothing flags it.
    kind: restates
    correction: >-
      Remove the prose. The fact stays held by the code of the "Query (a) — current view" branch and by the node.
    node: rules/knowledge-base/graph-read-current-view
  - file: src/modules/knowledge-graph/repository/temporal-filter.ts
    where: >-
      header comment lines 16-17 and 24-25, and the docstring of `inEffectOnly` at line 33 (the in-effect clause)
    evidence: >-
      //        [AND (<alias>.valid_from IS NULL OR <alias>.valid_from <= current_date)]
      //          (the bracketed clause is added when `inEffectOnly = true`)
      /** When true (and `asOf` undefined), restrict to rows in effect today. */
    cost: >-
      The prose restates when an item is in effect (current, and a validity start that is absent or not after
      today). The code holds it in the `opts.inEffectOnly` branch (`valid_from <= current_date`), so the
      definition appears in two places and only the code is run.
    kind: restates
    correction: >-
      Remove the comment lines and the docstring sentence. The code branch holds the fact.
    node: rules/knowledge-base/in-effect-assertion
  - file: src/modules/knowledge-graph/repository/temporal-filter.ts
    where: >-
      header comment, lines 19-22 ("Modes" item 2, valid-time travel)
    evidence: >-
      //   2. asOf provided             -> "valid-time travel" (query (b), BR-08):
      //        AND <alias>.superseded_at IS NULL
      //        AND (<alias>.valid_from IS NULL OR <alias>.valid_from <= $asOf)
      //        AND (<alias>.valid_to   IS NULL OR <alias>.valid_to   >  $asOf)
    cost: >-
      The comment states a second time the as-of view: no supersession time, a validity start that is absent or on
      or before the date, and a validity end that is absent or after it. The code holds the same fact in the
      "Query (b) — valid-time travel" branch, and the node holds it too. The comment can drift from both.
    kind: restates
    correction: >-
      Remove the prose. The code of the `opts.asOf !== undefined` branch holds the fact.
    node: rules/knowledge-base/graph-read-as-of-view
