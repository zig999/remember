findings:
  - file: src/modules/ingestion/chunker/config.ts
    where: >-
      line 19, the lower bound CHUNK_TARGET[0]
    evidence: >-
      export const CHUNK_TARGET: readonly [number, number] = [1500, 2000] as const;
    cost: >-
      The specification holds 2000 as the point past which a chunk closes (long-block-sentence-chunks)
      and holds no lower bound of 1500. The number lives only in this file, so the next reader
      looking for the chunk-size window in the specification will find only the upper edge.
      Nothing else in the tree reads CHUNK_TARGET[0]; only CHUNK_TARGET[1] is read, at v1.ts line 104.
    kind: unstated
    correction: >-
      Either a node (probably beside rules/knowledge-base/long-block-sentence-chunks) states the
      1500 lower bound, or the lower bound leaves the file.
    node: rules/knowledge-base/long-block-sentence-chunks
  - file: src/modules/ingestion/chunker/config.ts
    where: >-
      line 30, READING_TAIL
    evidence: >-
      export const READING_TAIL = 200 as const;
    cost: >-
      A 200 code-point reading-tail overlap is declared as a chunking constant and no node holds
      it. Nothing in the tree reads it, so it sits here looking like a decided value, and a later
      retrieval layer would inherit 200 from the file instead of from the specification.
    kind: unstated
    correction: >-
      The analysis gives the reading tail a node if the business decided it, or the constant is
      removed.
  - file: src/modules/ingestion/chunker/config.ts
    where: >-
      the doc comment above CHUNK_HARD_MAX, line 21
    evidence: >-
      /** Hard ceiling on a single chunk. A block above this size is sentence-split. */
    cost: >-
      Prose restating the long-block rule next to the number, so the cut-over exists as prose in
      a second place. The running behavior is in v1.ts (line 80, `if (blockSize <= CHUNK_HARD_MAX)`).
      The comment adds a second home that can drift from the node.
    kind: restates
    correction: >-
      Remove the prose.
    node: rules/knowledge-base/long-block-sentence-chunks
  - file: src/modules/ingestion/chunker/config.ts
    where: >-
      the header comment, lines 6-7
    evidence: >-
      // Units: Unicode code points (BR-05) — we measure block size by code-point
      // count, not by UTF-16 units or bytes.
    cost: >-
      Prose restating the code-point counting rule that a node holds, while the counting is done
      in v1.ts. This second home outside behavior can drift from the node.
    kind: restates
    correction: >-
      Remove the prose.
