findings:
  - file: src/modules/compliance-audit/mcp/compliance-toolset.ts
    where: >-
      Lines 1-22, the file header comment
    evidence: |-
      // Per BR-15 (P2.1 canonical taxonomy — same codes on REST and MCP):
      //   - Zod parse failure -> VALIDATION_REQUIRED_FIELD | VALIDATION_INVALID_FORMAT
      //                         | VALIDATION_OUT_OF_RANGE (Zod-discriminated)
      //   - raw_information_id resolves to no row -> RESOURCE_NOT_FOUND
      //   - UC-01 alt 4c legacy orphan -> SYSTEM_INTERNAL_ERROR
    cost: >-
      The header restates the compliance-delete refusal codes. The code in this file also holds them, in
      mapZodErrorToEnvelope and in the catch block's renderErrorEnvelope calls, and the node
      contracts/knowledge-base/compliance-audit states them. The comment is a third home that names BR and UC
      identifiers instead of the node. When the contract changes, this prose will still read as the
      authority and will be wrong.
    kind: restates
    correction: >-
      Remove the comment. The refusal codes are held by the code in this file and by
      contracts/knowledge-base/compliance-audit.
    node: contracts/knowledge-base/compliance-audit
  - file: src/modules/compliance-audit/mcp/compliance-toolset.ts
    where: >-
      Lines 48-72, the docstrings above McpEnvelope and mapZodErrorToEnvelope
    evidence: |-
      * principle of §14 ("business outcomes are not errors"): idempotent no-op is
      * a successful `ok: true` envelope with `outcome: noop_already_deleted`.
      ...
      *   3. `reason` length / trim violation (`too_small` / `too_big` on the `reason`
      *      path) -> `VALIDATION_OUT_OF_RANGE`.
    cost: >-
      The docstrings restate the noop_already_deleted outcome and the rule that a reason must be non-empty
      after trim and at most 1000 characters. The compliance-audit contract and the
      rules/knowledge-base/compliance-deletion-reason-length rule that it cites hold both. The code here
      forwards the outcome from complianceDelete() and holds the code and message in
      renderErrorEnvelope("VALIDATION_OUT_OF_RANGE", ...). A reader who trusts the prose is looking at a
      copy of the rule.
    kind: restates
    correction: >-
      Remove the docstrings. The outcome is carried by the service result, and the codes are held by the
      branches of mapZodErrorToEnvelope.
    node: contracts/knowledge-base/compliance-audit
  - file: src/modules/compliance-audit/mcp/compliance-toolset.ts
    where: >-
      Lines 139-143, the registerTool call
    evidence: |-
      deps.mcp.registerTool("curation", {
          name: "compliance_delete",
          description:
            "Tombstone a RawInformation under LGPD or owner request. Idempotent.",
    cost: >-
      The tool name compliance_delete, its placement in the curation toolset, and the description text that
      says what the tool is for are surface facts that the model and the owner see. No node holds them. The
      compliance-audit contract names the operation "compliance-delete" and says only "over MCP". The next
      reader looks for the MCP tool's name and toolset in the specification and finds this file.
    kind: unstated
    correction: >-
      The analysis should give the MCP tool name, its toolset and its purpose a node. The natural home is
      contracts/knowledge-base/compliance-audit.
    node: contracts/knowledge-base/compliance-audit
