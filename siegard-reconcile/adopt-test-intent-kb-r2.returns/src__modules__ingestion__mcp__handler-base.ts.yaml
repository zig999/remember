findings:
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      the header comment, lines 1-14 (steps 3 to 5 of the handler shape)
    evidence: >-
      // 4. On `ValidationFailure`: ROLLBACK the business TX, then open a SEPARATE
      //    short TX to write the audit `tool_call` row (BR-23).
      // 5. On uncaught error: ROLLBACK, write `tool_call` with `error`, surface
      //    `SYSTEM_INTERNAL_ERROR` envelope.
    cost: >-
      The audit rule is stated in prose here while runIngestHandler and safeWriteAuditOnRollback already hold it. A reader who finds the comment first takes it for the place the rule lives. If the node moves, the comment keeps saying the old thing and no check reaches it.
    kind: restates
    correction: >-
      Remove the header prose. The fact is held by runIngestHandler (the insertToolCall call inside the transaction, and insertToolCallStandalone with "rejected" or "error" on the rollback paths) and by the node.
    node: rules/knowledge-base/every-proposal-audited
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      the docstring of deriveValidationOutcome, lines 55-65
    evidence: >-
      Rule: when `result.outcome === 'rejected'` (the BELOW_CONFIDENCE_FLOOR
      branch returns this), the audit row is `'rejected'` per BR-17. Every other
      `ok:true` envelope is `'accepted'`.
    cost: >-
      The mapping from a proposal's outcome to the tool call's validation outcome is stated in prose beside the switch that implements it. It also says "every other ok:true envelope is accepted", which the switch immediately below contradicts. A reader of the docstring would be misled about the rule.
    kind: restates
    correction: >-
      Remove the docstring. The switch in deriveValidationOutcome holds the fact, and the node holds the rule.
    node: rules/knowledge-base/tool-call-validation-outcome
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      the docstring of runIngestHandler, lines 125-131
    evidence: >-
      BR-23: even when the business transaction rolls back, the audit row is
      written via a SEPARATE short transaction (`insertToolCallStandalone`).
    cost: >-
      The audit-on-rollback rule is cited by a back-spec code (BR-23) in prose, although the code in this file holds it. The citation invites the next reader to treat the comment as the authority.
    kind: restates
    correction: >-
      Remove the docstring prose. safeWriteAuditOnRollback and its calls hold the fact.
    node: rules/knowledge-base/every-proposal-audited
