looked_past: >-
  The file implements the resolve-dispute operation, which none of this pack's nodes govern. The nodes that do
  are outside the set, in contracts/knowledge-base/curation and the dispute-resolution rules. This file's
  check order, scope check, keep-disputed result, prefer-one outcome, adjust-periods outcome and recorded
  curation action all read as agreeing with those nodes. Two things were seen and not judged. The prefer_one
  branch does not check that winner_id is a member of item_ids, and the adjust_periods branch checks only that
  periods is non-empty, not that there is one period per item; the contract's messages say both, and whether
  an upstream DTO enforces them is outside this file. The "BR-26: lock every item row." comment (line 56) cites
  a back-spec number and states no node's fact that I could name.
