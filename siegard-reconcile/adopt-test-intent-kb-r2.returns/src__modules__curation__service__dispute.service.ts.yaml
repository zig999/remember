findings:
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      line 67, the comment above the loop that checks every locked row's status
    evidence: >-
      // BR-22: every row must be `disputed`.
    cost: >-
      The comment cites "BR-22", an identifier from a back-spec that is not in the specification tree. It
      restates what rules/knowledge-base/dispute-resolution-requires-disputed-items holds, which the loop
      below it already enforces (`if (row.status !== "disputed") { throw new ConflictError("BUSINESS_ITEM_NOT_DISPUTED", ...`).
      The next reader is sent to a rule number that does not resolve, and the comment is a second home for the rule.
    kind: restates
    correction: >-
      Remove the comment. The behavior is correct and the fact is already held by the node, so this is the
      comment route.
    node: rules/knowledge-base/dispute-resolution-requires-disputed-items
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      line 78 (the inline comment before assertSameScope) and line 285 (the docstring above assertSameScope)
    evidence: >-
      // BR-14: all items must share the same conflict scope.
      /** BR-14: all items must share the same conflict scope. */
    cost: >-
      Both comments restate rules/knowledge-base/dispute-resolution-single-scope under a back-spec number. The
      function body holds the rule (`"Items do not share the same conflict scope"`, `{ scope_mismatch: true }`).
      A reader who looks up "BR-14" finds nothing in the specification.
    kind: restates
    correction: >-
      Remove both comments.
    node: rules/knowledge-base/dispute-resolution-single-scope
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      lines 119-122 (prefer_one without a winner) and lines 202-205 (adjust_periods without periods), the messages of the two BusinessError throws
    evidence: >-
      throw new BusinessError("BUSINESS_DISPUTE_WINNER_REQUIRED", "decision=prefer_one requires winner_id");
      throw new BusinessError("BUSINESS_DISPUTE_PERIODS_REQUIRED", "decision=adjust_periods requires periods[]");
      The contract answers with the messages "decision=prefer_one requires winner_id (member of item_ids)" and "decision=adjust_periods requires periods[] (one entry per item_id)".
    cost: >-
      When either branch is reached, the owner's client receives a message without the parenthetical the
      contract states. A client or test that matches the contract's message text does not match what this file
      emits. The contract stays the authority, so the wording is not decided in the code.
    kind: contradicts
    correction: >-
      Emit the messages exactly as contracts/knowledge-base/curation states them for resolve-dispute.
    node: contracts/knowledge-base/curation
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      line 208, the comment above the scopeAllowsMultipleCurrent call
    evidence: >-
      // BR-16: functional-scope predicate — at most one row may end with
      // valid_to = NULL when the scope's `allows_multiple_current = false`.
    cost: >-
      The comment restates rules/knowledge-base/adjusted-periods-single-open under a back-spec number. The code
      below holds the same rule (`if (!allowsMultipleCurrent) { ... if (openCount > 1) { throw new BusinessError("BUSINESS_TEMPORAL_INCOHERENT", ...`).
      The comment is a second home for the rule, and its number does not resolve in the specification.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/adjusted-periods-single-open
