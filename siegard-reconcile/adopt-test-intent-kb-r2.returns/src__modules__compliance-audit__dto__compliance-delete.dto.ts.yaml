looked_past: >-
  The superRefine issue message is the bare string "VALIDATION_OUT_OF_RANGE", while the compliance-audit contract names the message "Time range bounds must satisfy `from < to`." Where the code is mapped to that message is another file's judgment. The comment's "`from` inclusive, `to` exclusive" half-open claim, which the audit-listing-window-half-open node holds, is carried by no code in this file.
