findings:
  - file: src/modules/query-retrieval/dto/fragment.dto.ts
    where: >-
      JSDoc of ListAcceptedFragmentsQuerySchema, lines 20-24 (the llm_run_id / raw_information_id bullet)
    evidence: >-
      * - `llm_run_id` / `raw_information_id` are independently optional but at
      *   least one MUST be supplied; otherwise the `.refine` raises a
      *   `VALIDATION_INVALID_FORMAT` with the `requires_one_of` detail
    cost: >-
      The requirement that a listing name a run, a raw information or both is written in prose as well as in the `.refine` at lines 39-45. A change to the node would leave this comment stating the old rule, and no tool reaches it.
    kind: restates
    correction: >-
      Remove the bullet. The `.refine` in this file holds the fact, so the comment only repeats it.
    node: rules/knowledge-base/listing-requires-a-filter
  - file: src/modules/query-retrieval/dto/fragment.dto.ts
    where: >-
      JSDoc of ListAcceptedFragmentsQuerySchema, lines 26-27 (limit bound)
    evidence: >-
      * - `limit` is `[1..100]`, default `20`; `offset >= 0`, default `0` —
    cost: >-
      The 1 to 100 bound on a page's limit is stated again in prose beside `.min(1).max(100)` at line 33. The bound lives in the node, and a second copy in a comment will not follow it when it moves.
    kind: restates
    correction: >-
      Remove the limit-bound clause of the comment. `IntegerQuery.pipe(z.number().int().min(1).max(100))` in this file holds the fact.
    node: rules/knowledge-base/page-limit-bounds
  - file: src/modules/query-retrieval/dto/fragment.dto.ts
    where: >-
      JSDoc of ListAcceptedFragmentsQuerySchema, line 26 (offset bound)
    evidence: >-
      `offset >= 0`
    cost: >-
      The non-negative offset rule is stated in prose beside `z.number().int().min(0)` at line 36, as a second home that the node's own changes do not reach.
    kind: restates
    correction: >-
      Remove the offset clause of the comment. `offset: IntegerQuery.pipe(z.number().int().min(0))` in this file holds the fact.
    node: rules/knowledge-base/page-offset-non-negative
  - file: src/modules/query-retrieval/dto/fragment.dto.ts
    where: >-
      JSDoc of ListAcceptedFragmentsQuerySchema, lines 26-27 (defaults)
    evidence: >-
      default `20`; `offset >= 0`, default `0`
    cost: >-
      The default limit of 20 and default offset of 0 are written in prose beside `.default(20)` and `.default(0)`. The node decides them, and a comment copy would go stale without notice.
    kind: restates
    correction: >-
      Remove the defaults from the comment. `.optional().default(20)` and `.optional().default(0)` in this file hold the fact.
    node: rules/knowledge-base/page-defaults
