findings:
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      the file header comment (lines 1-44), the propose-* mirrors comment block (lines 409-428) and the docblock of handleProposeMirror (lines 484-497)
    evidence: >-
      "//   4. Return HTTP 200 for any reachable handler. The `ok: true/false` flag on
      the body is the outcome indicator — a layered-validation rejection
      (ValidationFailure) is a *business result*, not a transport error, and
      surfaces as `{ ok: false, error: { code, message, details } }` with
      HTTP 200."; " *   - `ResourceNotFoundError` -> HTTP 404 with `RESOURCE_NOT_FOUND` envelope.
      *   - `RunNotRunningError`    -> HTTP 409 with `BUSINESS_RUN_NOT_RUNNING` envelope."
    cost: >-
      The answers of propose-fragment, propose-node, propose-link and propose-attribute (404 for an unknown run, 409 for a run that is not running, HTTP 200 carrying { ok: false, error } for a layered-validation rejection) are told a second time in prose. The code in this same file already holds them, in handleProposeMirror. When the contract moves, the comments stay behind and tell the next reader an answer the specification no longer gives.
    kind: restates
    correction: >-
      Remove the three comment blocks. The fact stays held by handleProposeMirror in this file and by contracts/knowledge-base/ingestion.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      POST_INGEST_BODY_LIMIT, line 126, passed as bodyLimit to app.post("/raw-information", ...) at line 144
    evidence: >-
      const POST_INGEST_BODY_LIMIT = 11 * 1024 * 1024;
    cost: >-
      A threshold decides whether the ingest request is accepted before any validation runs, and no node holds it. The only size limit the specification states is 10,485,760 UTF-16 code units for content (rules/knowledge-base/content-length) and for original input (rules/knowledge-base/original-input-length). The 11 MiB request-body ceiling lives only in this constant, so someone reading the specification cannot learn it. It is also easy to mistake for the content limit.
    kind: unstated
    correction: >-
      The analysis should decide whether the request-body ceiling for ingest-raw-information is a business fact. If it is, give it a node, either on contracts/knowledge-base/ingestion or as a rule beside rules/knowledge-base/content-length.
    node: contracts/knowledge-base/ingestion
