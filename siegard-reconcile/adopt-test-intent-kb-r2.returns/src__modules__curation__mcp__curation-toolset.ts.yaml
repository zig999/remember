findings:
  - file: src/modules/curation/mcp/curation-toolset.ts
    where: >-
      CurationToolDescriptions.merge_nodes, lines 171-175. This is the description
      served over tools/list, so it is emitted text.
    evidence: >-
      "every " +
      "link / attribute / alias is repointed to the survivor in the same " +
      "transaction (BR-04, BR-07). `reason` is mandatory."
    cost: >-
      The text the curation tool tells an LLM caller says the absorbed node's aliases
      are repointed to the survivor. The rule says the survivor receives a copy of each
      alias whose normalized form it does not hold, and the absorbed node keeps its own
      aliases. A caller that plans from the description expects the absorbed node to be
      left without aliases, and the next reader of this text does not learn that the
      node held something different.
    kind: contradicts
    correction: >-
      The description would have to say that links and attributes are moved to the
      survivor and that the survivor is given copies of the absorbed node's aliases
      it does not already hold. Whether that is worded as alias copying is for whoever
      owns the tool description.
    node: rules/knowledge-base/merge-copies-aliases
