findings:
  - file: src/modules/knowledge-graph/service/formatters.ts
    where: >-
      the docstring above deriveFlags, lines 99-104
    evidence: >-
      " * Derive the display flags surfaced in `LinkDetail.flags` and
      `AttributeDetail.flags`. Today this mirrors the storage `status` for
      `uncertain` / `disputed`; `low_confidence` is reserved for a future
      threshold-based flag."
    cost: >-
      The flag rule (uncertain when the status is uncertain, disputed when it is disputed, never low-confidence) is stated in prose beside the code that holds it. The prose also calls low_confidence "reserved for a future threshold-based flag", which the node does not say; it says the graph read never flags low-confidence. A reader who trusts the comment may take the flag as a planned feature rather than a decided exclusion.
    kind: restates
    correction: >-
      Remove the docstring. The code in deriveFlags in this same file holds the fact, and rules/knowledge-base/graph-item-flags holds it in the specification.
    node: rules/knowledge-base/graph-item-flags
  - file: src/modules/knowledge-graph/service/formatters.ts
    where: >-
      the timestamp fallbacks in toNodeAlias (line 127), toAttributeDetail (line 144), toLinkDetail (line 171) and toProvenanceEntry (lines 193-194)
    evidence: >-
      formatTimestamptz(row.created_at) ?? new Date(0).toISOString()
      formatTimestamptz(row.recorded_at) ?? new Date(0).toISOString()
      formatTimestamptz(row.received_at) ?? new Date(0).toISOString()
    cost: >-
      When a creation, recording or reception time is absent, the code reports the Unix epoch (1970-01-01T00:00:00.000Z) as if it were that time. No node holds this value or says what a read returns for an absent time. The epoch would read as a real date and would not show that the data was missing.
    kind: unstated
    correction: >-
      Give the behavior a node, either through the retrieval contract's accepted shapes or a rule saying what a read returns when one of these times is absent. Otherwise the code must not substitute a date.
    node: contracts/knowledge-base/retrieval
