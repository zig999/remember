findings:
  - file: src/modules/knowledge-graph/repository/catalog.repository.ts
    where: >-
      the docstring above listAttributeValidValues, lines 157-161
    evidence: >-
      "Keys with no rows here have an OPEN domain and get no `valid_values`."
    cost: >-
      The docstring is a second home outside behavior for the retrieval contract's list-attribute-keys
      statement that `valid_values` appears "only for a key the catalog closes". The code that holds it
      is in another file, so a reader of this repository finds a rule that nothing here applies.
    kind: restates
    correction: >-
      Remove the sentence from the docstring. The fact stays held by the conditional in
      catalog.service.ts that attaches `valid_values` only when a key has rows.
    node: contracts/knowledge-base/retrieval
