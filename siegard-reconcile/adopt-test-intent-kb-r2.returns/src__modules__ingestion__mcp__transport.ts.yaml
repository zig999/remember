looked_past: >-
  The header comment says the endpoint exposes only "4 tools ... the four `propose_*` actions" and that "`llm_run_id` is a per-call tool argument". It is prose with no running code behind it in this file, and the ingestion contract also lists `ingest-document` and `ingest-directed` as MCP operations, so I filed no finding.
