looked_past: >-
  The pack omits contracts/knowledge-base/curation, the node that governs this file: the metrics
  503 degradation, the envelope-free 200 bodies and the path validation before the body check all
  conform to it, and the findings above name it. A header comment also claims the parent scope
  enforces the Neon Auth JWT, with the code in another file, and the file's pino log messages
  (curation_request_failed, curation_metrics_degraded) state no domain fact.
