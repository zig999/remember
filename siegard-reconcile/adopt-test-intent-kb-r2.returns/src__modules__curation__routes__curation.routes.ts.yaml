findings:
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the doc comment above sendError, lines 72-79
    evidence: >-
      "Unknown-error 500s are NOT re-thrown to the global handler here: the
      shared mapper already produces the canonical SYSTEM_INTERNAL_ERROR /
      SYSTEM_SERVICE_UNAVAILABLE envelopes byte-identical to what the global
      handler would emit"
    cost: >-
      The comment is a second home for the access contract's answers to a failed request: 500
      SYSTEM_INTERNAL_ERROR for any other cause, 503 SYSTEM_SERVICE_UNAVAILABLE for an unreachable
      store. A reader who wants to know what the owner is told goes to this comment, not to
      curation/mcp/error-envelope.ts where mapErrorToHttpResponse produces it, and the comment
      does not move when the node does.
    kind: restates
    correction: >-
      Remove the prose. The answers are held by code in the imported mapErrorToHttpResponse
      (curation/mcp/error-envelope.ts), which this file only calls.
    node: contracts/knowledge-base/access
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the route path literals of every registration (app.get "/queue" at line 116, app.get
      "/metrics" at line 137, app.post "/entity-matches/:node_id/resolve" at line 196,
      "/nodes/merge" at line 222, "/disputes/resolve" at line 248, "/items/confirm" at line 272,
      "/items/reject" at line 300, "/items/correct" at line 328) and the header comment
      "Mounted under `/api/v1/curation/*`"
    evidence: >-
      app.post(
        "/entity-matches/:node_id/resolve",
        ...
      app.post(
        "/disputes/resolve",
    cost: >-
      The method-and-path under which each of the eight curation operations is served exists only
      in this file. No node in the specification holds any route path (a search of the
      specification root for these paths finds none). The next reader looks in the curation
      contract for how an operation is reached and finds only the operation names.
    kind: unstated
    correction: >-
      The curation contract, or a node it points to, would have to hold the address of each
      operation. This is the analysis route's to decide, not this file's.
    node: contracts/knowledge-base/curation
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the comment block above the /metrics route (lines 126-135) and the comment inside its catch
      (lines 152-153, 166-168)
    evidence: >-
      "ANY residual 500 outcome is re-mapped to 503 SYSTEM_SERVICE_UNAVAILABLE so the front spec
      MetricsStrip (R1) can fall back to per-kind totals from /queue. 401 auth failures and 2xx
      responses are NEVER degraded."
    cost: >-
      The comment restates the read-curation-metrics refusal (503 SYSTEM_SERVICE_UNAVAILABLE where
      the metrics cannot be read), and adds a rationale and a 401/2xx exclusion that no node
      states. The code holds the 500-to-503 re-map (`statusCode === 500 ? 503 : statusCode`), so
      the pair conforms. The prose is a second home that a reader may take for the decision.
    kind: restates
    correction: >-
      Remove the prose. The refusal is held by the catch branch of the /metrics handler in this
      same file.
    node: contracts/knowledge-base/curation
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the comment above the /metrics success reply, lines 145-149
    evidence: >-
      "Bare success body — consistent with every other curation REST endpoint
      (queue/confirm/reject/...). The SPA's httpCuration returns the raw 2xx JSON, so an
      `{ ok, result }` wrapper here would surface as all-undefined fields client-side"
    cost: >-
      The comment restates the contract's "HTTP 200 carrying, with no envelope" for the metrics
      and the other curation answers. The code holds it (`return reply.status(200).send(result)`),
      so the pair conforms. The comment is prose outside the running system.
    kind: restates
    correction: >-
      Remove the prose. The envelope-free body is held by the reply.status(200).send(result)
      calls in this file.
    node: contracts/knowledge-base/curation
