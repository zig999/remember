findings:
  - file: src/modules/ingestion/validation/errors.ts
    where: >-
      the header comment, lines 27-29 (the paragraph on BUSINESS_RUN_NOT_RUNNING)
    evidence: >-
      // The extra `BUSINESS_RUN_NOT_RUNNING` code is emitted by the MCP handler
      // guard when the ambient `llm_run_id` points to a row whose `status` is not
      // `'running'` (BR-21 / catalog Ingestion section).
    cost: >-
      The comment says again, in prose, that a proposal is refused unless its run is running. The rule is already a node, and running code holds it elsewhere. A reader who finds the sentence here may take this file for the rule's home, and it also still says the run id is "ambient", which no longer matches the run-id-as-argument wording in mcp-schemas.ts. When the node moves, nothing ties this prose to it.
    kind: restates
    correction: >-
      Remove the paragraph. Code in src/modules/ingestion/mcp/handler-base.ts (the branch throwing "BUSINESS_RUN_NOT_RUNNING" when `status !== 'running'`) and src/modules/ingestion/service/llm-run.service.ts (`public readonly code = "BUSINESS_RUN_NOT_RUNNING" as const;`) holds the fact. Rule node: rules/knowledge-base/proposal-requires-running-run.
    node: rules/knowledge-base/proposal-requires-running-run
