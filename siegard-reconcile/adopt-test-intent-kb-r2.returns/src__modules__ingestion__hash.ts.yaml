looked_past: >-
  The code holds two facts, the content hash (SHA-256 of the UTF-8 content, as lowercase hex) and the idempotency key (SHA-256 of content hash, prompt version, model and chunking version in order, with no separator). Both are held by nodes outside this pack, rules/knowledge-base/content-hash-is-sha256 and rules/knowledge-base/idempotency-key, and the code conforms to both, so I filed no code finding. The comments citing back-spec rule numbers (BR-01, BR-08) and v7 §8 are prose; they are filed only as the two restates findings above.
