findings:
  - file: src/modules/ingestion/hash.ts
    where: >-
      the docstring above sha256Hex, lines 10-15
    evidence: >-
      /** `sha256(content)` -- 64 char lowercase hex string. Used as `raw_information.content_hash` (BR-01); the DB CHECK constraint on the column enforces the same regex. */
    cost: >-
      The docstring states a second copy of the content-hash rule next to the code that implements it. The copy cites a back-spec rule number, "BR-01", where the specification holds the rule as a node. When the node moves, nothing reaches this prose, so a reader can't tell which copy was decided.
    kind: restates
    correction: >-
      Remove the docstring and the header comment (lines 1-6). The code createHash("sha256").update(content, "utf8").digest("hex") holds the fact, and the node rules/knowledge-base/content-hash-is-sha256 already states it. This finding is about prose and does not touch the behavior.
    node: rules/knowledge-base/content-hash-is-sha256
  - file: src/modules/ingestion/hash.ts
    where: >-
      the docstring above composeIdempotencyKey, lines 20-27
    evidence: >-
      `idempotency_key = sha256(content_hash ∥ prompt_version ∥ model ∥ chunking_version)`, concatenated WITHOUT a separator. The order is exactly as defined in §8 of v7 and as documented in `ingestion.back.md` BR-08.
    cost: >-
      The docstring restates the idempotency-key composition (operands, order, no separator) and points to a v7 section and a back-spec rule instead of the specification node. The code in the same function also holds it, so the prose is a second home. If the node changes, this prose keeps asserting the old order.
    kind: restates
    correction: >-
      Remove the docstring. The four h.update calls in order followed by h.digest("hex") hold the fact. The node rules/knowledge-base/idempotency-key states it.
    node: rules/knowledge-base/idempotency-key
