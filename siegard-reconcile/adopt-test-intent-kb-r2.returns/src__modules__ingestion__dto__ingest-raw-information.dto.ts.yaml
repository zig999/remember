looked_past: >-
  Two comments state facts that no code in this file carries and no node holds: "`storage_ref`: nullable; must be `null` in v1.0.0 (BR carve-out, A5)", and that `metadata.document_date` "is consumed by future temporal validation". The schema accepts any nullable string for storage_ref and nothing consumes document_date, so both are prose, not findings, and their route is the comment route.
