findings:
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      the JSDoc of IngestRawInformationRequestSchema, the `content` bullet (lines 16-18)
    evidence: >-
      - `content`: minLength 1 (empty document is meaningless), maxLength 10 MiB
         in code points — the Fastify `bodyLimit` of 11 MiB on the route is a
         coarser pre-filter; this Zod check is the precise contract from A5.
    cost: >-
      The bounds of content are restated in prose as "10 MiB in code points". The node counts UTF-16 code units, and the `z.string().min(1)...max(10 * 1024 * 1024)` on `content` also counts UTF-16 code units. A reader who trusts the comment will believe the limit is in code points, and a reader who looks in the specification finds a different unit. The 11 MiB `bodyLimit` it cites is a fact the specification does not hold and this file does not hold in code either.
    kind: restates
    correction: >-
      Remove the `content` bullet. The code in this file already holds the bound, and the node holds the fact.
    node: rules/knowledge-base/content-length
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      the JSDoc above the `original_input` field (lines 35-39)
    evidence: >-
      Never
         * factored into `content_hash`. Capped at 10 MiB to match `content`.
    cost: >-
      The cap on original_input is restated in prose while the same schema enforces it with `.max(10 * 1024 * 1024, "original_input must not exceed 10 MiB")`. A change to the node would leave this sentence and the error message stale together.
    kind: restates
    correction: >-
      Remove the sentence. The `.max(...)` in this file holds the cap, and the node holds the fact.
    node: rules/knowledge-base/original-input-length
