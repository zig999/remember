findings:
  - file: src/modules/compliance-audit/routes/compliance-audit.routes.ts
    where: >-
      the docstring above handleZodError, lines 182-189
    evidence: >-
      * Translate ZodError into our standard envelope. Two special-case mappings:
      *  - issue.message === 'VALIDATION_OUT_OF_RANGE' (from `superRefine` for
      *    semi-open range guards) -> error.code: VALIDATION_OUT_OF_RANGE.
      *  - empty / missing `reason` or `raw_information_id` -> the most specific
      *    code we can infer (VALIDATION_REQUIRED_FIELD vs VALIDATION_OUT_OF_RANGE).
      *  - anything else -> VALIDATION_INVALID_FORMAT.
    cost: >-
      The docstring is a second home for the error-code mapping that the compliance-audit contract
      holds. The mapping is also in the code just below, so the two can drift apart. The next reader
      may take the docstring as the decided mapping and not the contract.
    kind: restates
    correction: >-
      Remove the docstring. The code in handleZodError holds the mapping, and the contract
      contracts/knowledge-base/compliance-audit holds the decided answers.
    node: contracts/knowledge-base/compliance-audit
  - file: src/modules/compliance-audit/routes/compliance-audit.routes.ts
    where: >-
      the `details` of every validation envelope in handleZodError (lines 206, 235, 255, 264) and the
      zodIssuesAsDetails helper (lines 269-274)
    evidence: >-
      details: { issues: zodIssuesAsDetails(err) }
    cost: >-
      The access contract says a request that fails validation answers with "`details` a bare list of
      `{ path, message }`, each path joined by "."". These routes send the list wrapped in an object
      under `issues`. A client written to the access contract reads `details` as a list and gets an
      object. The shape is decided in the specification, so the next reader would not look in this
      file for a different one.
    kind: contradicts
    correction: >-
      Either handleZodError sends the bare list as `details`, or the specification states that these
      routes wrap the list under `issues`. The contract's own wording, "listing each failing field
      with its path and message", does not settle the shape.
    node: contracts/knowledge-base/access
  - file: src/modules/compliance-audit/routes/compliance-audit.routes.ts
    where: >-
      the comment before the third branch of handleZodError, lines 239-241
    evidence: >-
      // Priority 3 — `reason` length / trim violations. We can detect those by
      // the path being "reason" and the issue being `too_small` (empty after
      // trim) or `too_big` (> 1000 chars). Both map to OUT_OF_RANGE.
    cost: >-
      The comment states the 1000-character limit and its mapping to VALIDATION_OUT_OF_RANGE. The
      contract holds this, and the limit is also enforced in dto/compliance-delete.dto.ts
      (`z.string().trim().min(1).max(1000)`). The number now sits in a third place, and a change to
      it would not reach this comment.
    kind: restates
    correction: >-
      Remove the comment. dto/compliance-delete.dto.ts holds the limit, and this file's branch holds
      the mapping.
    node: contracts/knowledge-base/compliance-audit
