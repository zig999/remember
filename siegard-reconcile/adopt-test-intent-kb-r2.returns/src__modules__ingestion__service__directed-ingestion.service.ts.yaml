findings:
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      IsoDateSchema (lines 99-102), used by valid_from and valid_to of
      DirectedAttributeItemSchema (lines 141-142) and DirectedLinkItemSchema (lines 152-153)
    evidence: >-
      const IsoDateSchema = z.string().regex(/^\d{4}-\d{2}-\d{2}$/, "valid_from / valid_to must be ISO YYYY-MM-DD");
      ... valid_to: IsoDateSchema.optional(),
    cost: >-
      The service accepts, shape-checks and forwards a validity end for directed attributes
      and links, and emits a message naming it. The directed rules state only the validity
      start's shape, and the decision log beside directed-validity-start-shape records that
      only the validity start is stated. A reader looking in the specification for what a
      directed item may carry will not find the validity end, so the code is the only place
      it is decided.
    kind: unstated
    correction: >-
      Either the specification states that a directed item may carry a validity end and its
      shape, or the service stops accepting it.
    node: rules/knowledge-base/directed-validity-start-shape
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      DirectedFragmentItemSchema (line 108), enforcing the fragment text length at the
      directed input boundary
    evidence: >-
      export const DirectedFragmentItemSchema = z.object({ ref: DirectedRefSchema, text: z.string().min(1).max(1000), });
    cost: >-
      The 1 to 1000 limit on a fragment's text is held by fragment-text-length for an
      information fragment. Here it is implemented a second time in a directed-only schema,
      and the ingest-directed contract lists no refusal for it. If the node moves, nothing
      moves this copy, and a directed call is refused before dispatch with a message the
      contract does not name for this cause.
    kind: contradicts
    correction: >-
      Leave the limit to the single place that holds it, or have the ingest-directed
      contract state this refusal.
    node: rules/knowledge-base/fragment-text-length
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      DirectedNodeItemSchema (lines 111-117), the name and aliases length limits
    evidence: >-
      name: z.string().min(1).max(500),
      node_id: z.string().uuid().optional(),
      aliases: z.array(z.string().min(1).max(500)).optional(),
    cost: >-
      The 1 to 500 limit on a node's name and each alias is held by node-name-length for a
      node proposal. This is a second implementation in a directed-only schema, and the
      ingest-directed contract lists no refusal for it. The two copies can diverge unseen,
      and a directed call is refused with a cause the contract does not name.
    kind: contradicts
    correction: >-
      Leave the limit to the single place that holds it, or have the ingest-directed
      contract state this refusal.
    node: rules/knowledge-base/node-name-length
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      DirectedAttributeItemSchema line 144 and DirectedLinkItemSchema line 155, forwarded
      at lines 637 and 717
    evidence: >-
      change_hint: ChangeHintSchema.optional(),  ...  change_hint: item.change_hint ?? "none",
    cost: >-
      The node says a directed attribute or link is proposed with change hint none. The
      service lets the caller state any change hint and forwards it, so a directed
      supersession can be requested through this code. The decision log beside
      directed-defaults records that the directed tool carries no change hint, so the
      capability exists only here and the next reader of the node will not know it.
    kind: contradicts
    correction: >-
      Remove the change hint from the directed item schemas and propose every directed
      attribute and link with none.
    node: rules/knowledge-base/directed-defaults
