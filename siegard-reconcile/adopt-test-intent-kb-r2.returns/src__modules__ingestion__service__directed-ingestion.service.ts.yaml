    node: rules/knowledge-base/directed-ingestion-run
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      Comment above anchorChunkId (lines 449-455)
    evidence: >-
      // All fragments are anchored to the first chunk of the synthesised content.
      ... const anchorChunkId = chunks[0]!.id;
    cost: >-
      The comment restates directed-fragments-anchor-first-chunk, which the next line of
      code holds. It is prose that can drift from the node.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/directed-fragments-anchor-first-chunk
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      Steps 4-5, the swallowed run close and the empty affected nodes on a failed resolution
      (lines 764 and 776-787; closeRunCompletedSafe, lines 1006-1034)
    evidence: >-
      await closeRunCompletedSafe(deps.pool, llm_run_id, deps.logger);
      ... // resolvedAffected stays []; the run is still completed.
      ... /* swallow */
    cost: >-
      When the close transaction or the affected-nodes resolution fails, the response still
      says status "completed" with affected_nodes empty, and only a log line records the
      failure. The contract states a completed run with its affected nodes and names no
      answer for a run that did not close or whose nodes could not be read. This
      degradation is decided only in this file.
    kind: unstated
    correction: >-
      A node states what a directed ingestion answers when the run cannot be closed or its
      affected nodes cannot be resolved.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      readClosedRunSafe fallback (lines 1050-1054) and the null finished_at branch (lines 1072-1074)
    evidence: >-
      const fallback = { started_at: new Date(0).toISOString(), finished_at: new Date(0).toISOString(), attempts: 1, };
    cost: >-
      The run's start and finish times and its attempts are reported as the epoch
      (1970-01-01T00:00:00.000Z) and 1 when the closed run cannot be read. A caller
      receives these invented values as if they were the run's, and no node says so.
    kind: unstated
    correction: >-
      A node states what the run reports when its row cannot be read, or states that the
      call fails instead.
    node: contracts/knowledge-base/ingestion
