    evidence: >-
      code: "VALIDATION_INVALID_FORMAT",
      message: "Input failed Zod parse.",
      details: {
        issues: parsed.error.issues.map((i) => ({
    cost: >-
      The contract answers every directed validation refusal with message
      "ingest_directed arguments failed validation." listing each failing field with its
      path and message. This path tells the caller a different message and nests the list
      under details.issues. A caller or test that reads the message the contract states
      does not find it here. This file cannot show whether the tool handler validates
