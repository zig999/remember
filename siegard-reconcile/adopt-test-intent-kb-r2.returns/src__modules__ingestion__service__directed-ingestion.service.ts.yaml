    where: >-
      Header comment (lines 1-37), the sentinels and the no-language-model statement
    evidence: >-
      // the sentinels `model='directed'` / `prompt_version='directed-v1'`, ...
      // NEVER calls Anthropic — the directed path is `model = 'directed'`,
    cost: >-
      The prose says again what directed-ingestion-run holds and what
      DIRECTED_MODEL / DIRECTED_PROMPT_VERSION (lines 84 and 87) declare in this file. It is
