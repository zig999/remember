findings:
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 7-19, the header comment (Algorithm steps 1 and 2)
    evidence: >-
      "1. Split the content into "blocks" along the hard boundaries that apply to
      `sourceType` (BR-06)." and "2. For each block, try to keep it as one chunk if its size is at most
      `CHUNK_HARD_MAX` code points."
    cost: >-
      The block-then-chunk rule is written in prose in the file as well as held by the code
      (splitByHardBoundaries and the loop in chunkV1). A reader of the comment sees a second statement
      of the rule, and it will keep saying the old rule if the node moves.
    kind: restates
    correction: >-
      Remove the prose. The code in this file already holds the rule (splitByHardBoundaries, then
      chunkV1's per-block loop), and the node binds it.
    node: rules/knowledge-base/chunks-never-cross-blocks
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 11-12 and line 80, the header comment and the "Whole block fits" comment
    evidence: >-
      "try to keep it as one chunk if its size is at most `CHUNK_HARD_MAX` code points." and
      "// Whole block fits — emit as a single chunk."
    cost: >-
      The short-block rule is restated in prose beside the branch `if (blockSize <= CHUNK_HARD_MAX)`.
      The comment adds a second home for the 4000-code-point fact outside behavior.
    kind: restates
    correction: >-
      Remove the prose. The branch in this file holds the rule, and CHUNK_HARD_MAX in config.ts holds
      the value.
    node: rules/knowledge-base/short-block-one-chunk
