      and "close the buffer when adding the next sentence would push it above `CHUNK_TARGET[1]`" and
      "a single 5000-char sentence will become one chunk; this is BR-07's documented limit"
    cost: >-
      The sentence-cut rule and the long-sentence limit are written again in prose. The prose
