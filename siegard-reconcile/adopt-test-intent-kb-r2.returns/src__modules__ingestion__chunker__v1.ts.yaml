    kind: restates
    correction: >-
      Remove the prose. splitBySentences and the `tentativeSize > CHUNK_TARGET[1]` branch hold the rule
      in this file, and config.ts holds the 2000 and 4000 values.
    node: rules/knowledge-base/long-block-sentence-chunks
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 99-103, the inline comment above `if (tentativeSize > CHUNK_TARGET[1])`
    evidence: >-
      "If the buffer itself is already empty and the first sentence is larger than CHUNK_HARD_MAX, emit it
      standalone — we have no finer atom to split on"
    cost: >-
      The comment restates the long-sentence rule with a different threshold (CHUNK_HARD_MAX, 4000). The
      node says a sentence of more than 2000 code points is a chunk on its own, which is what the code
      does. The comment misleads the reader about where the line is.
    kind: restates
    correction: >-
      Remove the prose. The `tentativeSize > CHUNK_TARGET[1]` branch holds the rule.
    node: rules/knowledge-base/long-sentence-own-chunk
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 20-24, the header comment on offsets
    evidence: >-
      "All offsets are 0-based, semi-open, counted in Unicode code points of the ORIGINAL content (BR-05)."
    cost: >-
      The offset unit is restated in prose. The code in this file holds it (`Array.from(content)` and
      buildChunk's offset_start/offset_end), so the comment is a second home.
    kind: restates
    correction: >-
      Remove the prose. The code point array and buildChunk hold the rule.
    node: rules/knowledge-base/chunk-offsets-count-code-points
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 32-40, the exported type SourceType
    evidence: >-
      "export type SourceType =
        | "pdf"
        | "email"
        | "ata"
        | "chat"
        | "artigo"
        | "transcricao"
        | "outro";" (its doc comment: "mirrors the PostgreSQL `source_type` enum.")
    cost: >-
      The source-type vocabulary is declared a second time in a file the source-type node does not bind.
      src/modules/ingestion/dto/source-type.ts also carries these values. If the node's values change,
      the check never reaches this union, and the exhaustiveness switch in splitByHardBoundaries follows
      this copy.
    kind: contradicts
    correction: >-
      Use the one declaration that the source-type node binds (the one in src/modules/ingestion/dto/
      source-type.ts, if it declares the type) instead of declaring the union here. Alternatively, bind
      this file to the node.
    node: domain/knowledge-base/source-type
