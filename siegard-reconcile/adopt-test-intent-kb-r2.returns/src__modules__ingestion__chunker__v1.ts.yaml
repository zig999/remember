    kind: restates
    correction: >-
      Remove the prose. The `chunks.length === 0` branch in this file holds the rule.
    node: rules/knowledge-base/contentless-blocks-single-chunk
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 139-142 and 144-147, the splitByHardBoundaries doc comment (pdf)
    evidence: >-
      "- `pdf`:          form-feed (`\f`, U+000C). PDF extractors typically insert `\f` between pages."
    cost: >-
      The pdf block rule is restated in prose. The code holds it (`splitOnCharBoundary(codePoints, "\f")`),
      so the comment is a second home.
    kind: restates
    correction: >-
      Remove the prose. The `case "pdf":` branch and splitOnCharBoundary hold the rule.
    node: rules/knowledge-base/pdf-blocks-at-form-feeds
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 148-149 and 213-216, the email doc comments (header block)
    evidence: >-
      "- `email`:        first blank line (header/body separator)" and
      "Split an email: first blank line closes the headers"
    cost: >-
      The email header rule is restated in prose. splitEmail holds it, so the comment is a second home.
    kind: restates
    correction: >-
      Remove the prose. The `!headersClosed && isBlank` branch of splitEmail holds the rule.
    node: rules/knowledge-base/email-header-block
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 148-149 and 213-216, the email doc comments (quotation blocks)
    evidence: >-
      "plus every transition into / out of a `>` quotation block." and
      "every transition into or out of a quotation block (`^>+ `) closes a chunk."
    cost: >-
      The quotation rule is restated in prose, and the pattern shown (`^>+ `) differs from the code. The
      code treats a line as quoted when its first character after spaces or tabs is `>`, with no
      trailing space needed (isQuotedLine). The comment is a second home and it disagrees with the code.
    kind: restates
    correction: >-
      Remove the prose. The `headersClosed && ... isQuoted !== prevQuoted` branch of splitEmail and
      isQuotedLine hold the rule.
    node: rules/knowledge-base/email-quote-blocks
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 150-154 and 261-266, the chat/transcript doc comments (turn blocks)
    evidence: >-
      "A line that starts with `[ \t]*[A-Za-z0-9_]+[ \t]*:[ \t]` (e.g. `João:`, `[12:00] Maria:`) opens a
      new block. We never fuse two consecutive speakers into one chunk." and
      "Split chat / transcript: a new "speaker line" opens a new block."
    cost: >-
      The turn-block rule is restated in prose. splitTurns holds it, so the comment is a second home.
    kind: restates
    correction: >-
      Remove the prose. splitTurns (the loop from line index 1) holds the rule.
    node: rules/knowledge-base/turn-blocks
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 150-154, 261-266 and 341-350, the speaker-line comments
    evidence: >-
      "Accepts:
         - `Name:` followed by white space (Name = ASCII identifier characters
            plus single embedded spaces — we keep it strict to avoid false
            positives on prose like "Importante: ...")."
    cost: >-
      The speaker-line definition is written in prose in three places. The code holds it in
      SPEAKER_LINE_REGEX, which accepts `À-ÿ` and an optional `(`/`)` time stamp. The comments say "ASCII
      identifier characters" and `[ \t]*[A-Za-z0-9_]+[ \t]*:[ \t]`. The comments disagree with the code,
      so a reader who trusts them gets the wrong rule.
    kind: restates
    correction: >-
      Remove the prose. SPEAKER_LINE_REGEX in this file holds the rule.
    node: rules/knowledge-base/speaker-line
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      lines 229 and 289-307: `const isBlank = line.endExclusive === line.start;` and scanLines
    evidence: >-
      "Line terminator is `\n`; the terminator is NOT included in the range (so blank lines have
      `start == endExclusive`)." with `if (codePoints[i] === "\n")` and
      `const isBlank = line.endExclusive === line.start;`
    cost: >-
      The code decides what a line and a blank line are. A line ends only at `\n`, and a blank line has
      no characters at all. A line holding only spaces, or `\r` as in a CRLF email, is not blank. This
      decides where an email's header block ends and where its quote blocks start, and no node states
      it. The next reader looks for it in the email-header-block rule and does not find it. A CRLF email
      never closes its header block.
    kind: unstated
    correction: >-
      Analysis should give the line-break convention and the meaning of a blank line a node, probably
      email-header-block. The same line convention also sets the lines a speaker line is tested on.
    node: rules/knowledge-base/email-header-block
