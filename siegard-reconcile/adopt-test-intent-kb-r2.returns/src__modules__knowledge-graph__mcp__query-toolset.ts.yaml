  - node: rules/knowledge-base/required-start-fallback
    held_at: nowhere
    evidence: >-
      The file holds no proposal behavior and no validity-start handling.
  - node: rules/knowledge-base/review-queue-page-windows-entries
    held_at: nowhere
    evidence: >-
      The file has no review-queue listing. The only pagination is `limit: input.limit,
      offset: input.offset,` passed to listNodesService.
  - node: rules/knowledge-base/review-queue-total-before-pagination
    held_at: nowhere
