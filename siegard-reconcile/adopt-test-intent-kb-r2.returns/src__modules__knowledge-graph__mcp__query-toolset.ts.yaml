  - node: rules/knowledge-base/traversal-expands-live-nodes
    held_at: nowhere
    evidence: >-
      The file only dispatches: `traverseNodeService(client, catalog, { startingNodeId:
      input.node_id, direction: input.direction, ...` The expansion filter lives in the
      service.
  - node: rules/knowledge-base/traversal-lists-reached-nodes
    held_at: nowhere
    evidence: >-
      The file only dispatches to traverseNodeService. It lists no nodes and filters no
      merged or deleted nodes.
looked_past: >-
  Other comments restate back-spec identifiers (UC-nn, BR-23, BR-24, BR-25, TC-01) and
  describe the tool-input flattening and the pinning of JSON Schemas; I saw them and did not
  file them as findings. They are comment-route material, and the tool descriptions in
  QueryToolDescriptions state the depth bounds 1..3, the page limit of 100, the "active"
  catalog wording and the chronological order of attribute-key history consistently with the
  nodes, or with no contradicting node.
