      // call (5-layer validation already passed), look up the vigent row(s) under
      // `SELECT ... FOR UPDATE` (A11) and decide between the five branches of
      // §6.5:
    cost: >-
      The order of the five outcomes is described a second time in prose. A reader who finds it here
      may take it for the decision. The decision is the order of the branches in consolidateLinkOnce
      and consolidateAttributeOnce.
    kind: restates
    correction: >-
      Remove the comment. consolidateLinkOnce and consolidateAttributeOnce hold the order.
    node: rules/knowledge-base/consolidation-precedence
