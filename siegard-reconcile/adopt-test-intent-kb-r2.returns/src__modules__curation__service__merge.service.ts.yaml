findings:
  - file: src/modules/curation/service/merge.service.ts
    where: >-
      the header comment, lines 1-11 ("Steps inside the open transaction (BR-13 layered validation)"), and the inline comments at lines 63, 81 and 95
    evidence: >-
      "//   1. SELECT ... FOR UPDATE on both rows (BR-26).
      //   2. Inspect status: 404 if missing, 410 if deleted, 409/422 mismatch.
      //   3. Enforce node_type match (BR-06)." and "// BR-12: 410 for tombstones; explicit before 409/422 status checks."
    cost: >-
      The check order is written a second time in prose, under back-spec rule numbers (BR-06, BR-12, BR-13, BR-26) that are not specification node identities. The code in performMerge already holds that order: self-merge, absent survivor, absent absorbed, deleted survivor, deleted absorbed, survivor not active, absorbed status, node type. If the node moves, a reader of this file sees the old order described as current, and the prose is not bound to the node.
    kind: restates
    correction: >-
      Remove the header block and the BR-numbered inline comments. The order stays in the code of performMerge and in rules/knowledge-base/merge-check-order. This falls under the comment route, followed by /reconcile over the file.
    node: rules/knowledge-base/merge-check-order
