looked_past: >-
  None of the 25 pack nodes governs this file. The facts it applies (self-merge refusal, tombstone and status guards, node-type match, the status flip, path compression, alias copy and link and attribute repointing) are held by nodes outside the pack and outside the candidate index, namely rules/knowledge-base/node-never-merged-into-itself, curation-refuses-deleted-node, merge-survivor-active, node-merge-absorbs-active-node, merge-requires-same-node-type, merge-marks-absorbed-merged, merge-compresses-paths, merge-copies-aliases, merge-repoints-assertions and merge-counts-what-it-changed. The code agrees with them and with merge-check-order. The remaining BR-numbered comments (steps 4-7, "Defence in depth (BR-23)") restate those nodes and were not filed separately.
