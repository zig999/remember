looked_past: >-
  The IngestToolDescriptions entry `start_async_ingestion` (lines 165-173) describes a tool the
  candidate constraint says the ingest toolset must not offer; it is a retired entry that
  ingest-toolset.ts no longer registers, so I did not file it as emitted text. I also left
  alone the descriptions' guidance wording to the model ("quoted verbatim", "split compound
  sentences") and the tool names get_ingestion_status and start_async_ingestion, which no
  node spells; these are prompt-wording and dead-entry matters rather than conformance of a
  held fact. The header and the doc comments in the file (BR-24, the `zod-to-json-schema`
  divergence note and the doc comment above IngestToolDescriptions) are prose for the comment
  route.
