findings:
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      getLlmRunById, lines 97-119 (the BR-33 comment block and the try/catch around deriveAffectedNodes)
    evidence: >-
      "} catch {
              // Best-effort — omit the field on a transient read failure; the
              // caller can re-derive on the next poll.
              affectedNodes = undefined;
            }"
    cost: >-
      The code answers a completed run without its affected nodes whenever the derivation read fails, and the run is still returned as a successful read. No node states this degraded answer. The read-llm-run contract promises the affected nodes "when it is completed", and the rule affected-nodes-only-when-completed only limits when they are listed. A reader of the specification would expect a failed derivation to be refused. A caller cannot tell an omitted field from a run that has no affected nodes, because an empty list is also a valid completed-run payload.
    kind: unstated
    correction: >-
      An analysis would have to decide what read-llm-run answers for a completed run whose affected nodes cannot be derived, and give that decision a node. The likely home is contracts/knowledge-base/ingestion or a new rule beside affected-nodes-only-when-completed.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      getLlmRunById, comment at lines 97-102 ("BR-33 — attach `affected_nodes` ONLY when the run is `completed`...")
    evidence: >-
      "// BR-33 — attach `affected_nodes` ONLY when the run is `completed`. The
        // field is the snapshot of the run at completion; a `running` or `failed`
        // run does not surface a partial list."
    cost: >-
      The comment is prose that restates a rule a node holds. The same file holds the rule in code at `if (row.status === "completed") {`, so the pair conforms. The prose is a second home that can drift from the node and that `--check` does not follow. The comment at lines 254-256 is a similar second home; it restates the omission of the key and the preservation of an empty list.
    kind: restates
    correction: >-
      Remove the comment. The branch on `row.status === "completed"` already holds the fact.
    node: rules/knowledge-base/affected-nodes-only-when-completed
