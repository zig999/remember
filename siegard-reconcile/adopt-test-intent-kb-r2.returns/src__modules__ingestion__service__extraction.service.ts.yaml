looked_past: >-
  The prompt-caching breakpoint (`cache_control: { type: "ephemeral" }`), the `thinking: { type: "adaptive" }` request and the per-turn token-usage log carry no domain fact, so they belong to a code review. The facts the file does hold by code are three. The burst of three (`FATAL_ERROR_BURST`), the 200-character tail (`PREV_TAIL_CHARS`) and the soft skip of a refusal conform to candidate nodes outside this pack that I opened, and are not findings.
