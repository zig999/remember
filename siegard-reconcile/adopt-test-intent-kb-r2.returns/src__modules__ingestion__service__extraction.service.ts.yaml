    cost: >-
      The header says again a rule that a node holds and that the code applies in `if (run.status !== "running") { throw new RunNotRunnableError(llmRunId, run.status); }`. When the node moves, this prose still says the old rule and nothing flags it.
    kind: restates
    correction: >-
      Remove the comment. The check at line 424 holds the fact in this file, and the node holds it in the specification.
    node: rules/knowledge-base/extraction-requires-running-run
