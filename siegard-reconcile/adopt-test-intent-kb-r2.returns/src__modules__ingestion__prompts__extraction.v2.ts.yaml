findings:
  - file: src/modules/ingestion/prompts/extraction.v2.ts
    where: >-
      EVENT_DATING_DIRECTIVE, the third bullet (lines 50-51)
    evidence: >-
      "- Rescheduling an event is `change_hint:\"succession\"` on `event_date` — the",
      "  same mechanics as any functional attribute (the old date becomes history).",
    cost: >-
      This line is emitted to the model in every v2 extraction. It tells the model to mark a
      rescheduled event as a succession on event_date. The extraction rules
      (extraction-dates-events, extraction-event-date-is-the-value) say how event_date and its
      validity start are asked for. None of them says the model is asked to treat a
      rescheduling as a succession. A reader looking for what the model is told about moved
      events will not find it in the specification, and the prompt becomes the only place the
      decision lives.
    kind: unstated
    correction: >-
      An analysis would give this prompt instruction a node (for example a rule under
      rules/knowledge-base, constraining domain/knowledge-base/prompt-version). It would state
      that under prompt version v2 and later the model is asked to give a rescheduled event's
      new date a change hint of succession on event_date.
  - file: src/modules/ingestion/prompts/extraction.v2.ts
    where: >-
      the header comment (lines 1-9) and the doc comment on EVENT_DATING_DIRECTIVE (lines 32-37)
    evidence: >-
      "v2 = v1 + an explicit Event-dating directive. The \"go-live veio sem data\"
      gap was a PROMPT gap: v1 never told the model to propose `event_date` when it
      creates an Event"
    cost: >-
      The comment restates what extraction-dates-events holds: from v2 on, the model is asked
      to propose event_date. The code holds the same fact in EVENT_DATING_DIRECTIVE, in this
      file, so the pair conforms. The comment is a second home outside behavior, and it will
      drift from the node the first time the node moves.
    kind: restates
    correction: >-
      Remove the comment. This is prose, so it takes the comment route followed by
      /reconcile. Do not edit the directive string, which is emitted text.
    node: rules/knowledge-base/extraction-dates-events
