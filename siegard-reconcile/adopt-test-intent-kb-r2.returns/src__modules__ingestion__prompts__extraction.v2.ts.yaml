looked_past: >-
  The facts this file actually states are held by three nodes outside the pack. The directive's
  event_date and end_date request and its value-versus-validity-start distinction match
  rules/knowledge-base/extraction-dates-events and extraction-event-date-is-the-value. "NEVER
  invent a date" matches extraction-never-invents-a-date. I saw these in the pack and in the
  decision logs and did not report them as findings. The header comment also carries prose on
  the idempotency key including prompt_version and on the catalog's Event.event_date keys,
  which other nodes and files govern.
