  - node: domain/knowledge-base/raw-information
    held_at: >-
      RecentIngestionRow, lines 45-57. It names the raw-information attributes source_type,
      status (as raw_status) and received_at in part, plus a derived content_preview.
    evidence: >-
      export interface RecentIngestionRow { readonly raw_information_id: string;
      readonly source_type: string; readonly raw_status: string; readonly received_at: Date;
      readonly content_preview: string; ...
  - node: contracts/knowledge-base/access
    held_at: >-
      nowhere
    evidence: >-
      The file does no authentication, routing or health reporting. It has only repository
      queries such as `SELECT id, model, prompt_version, ... FROM llm_run WHERE id = $1`.
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      findRecentIngestions, lines 64-93. It holds the list-recent-ingestions answer: the
      raw-information fields, the first 80 characters, and the latest run. The tool-call page,
      the run read and the retry are supported by findToolCallsByRun, findLlmRunById and
      retryLlmRunRow.
    evidence: >-
      `left(ri.content, 80) AS content_preview` ... `LEFT JOIN LATERAL ( SELECT id, status,
      started_at, finished_at, prompt_version, model FROM llm_run WHERE input_raw_information_id
      = ri.id ORDER BY started_at DESC LIMIT 1 ) lr ON true`
