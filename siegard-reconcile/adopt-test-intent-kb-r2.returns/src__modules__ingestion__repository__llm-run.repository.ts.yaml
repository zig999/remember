findings:
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of RecentIngestionRow, lines 38-44
    evidence: >-
      `content_preview` is the first 80 code points of the
      raw text — enough for an operator to recognise a document after a client
      timeout without shipping the whole content back.
    cost: >-
      The 80-character preview is stated in prose a second time, next to the `left(ri.content, 80)`
      that holds it. The prose says "code points" and the node says "characters", so a reader
      who trusts the comment and a reader who trusts the node can come away with different sizes.
    kind: restates
    correction: >-
      Remove the prose. The fact is held by `left(ri.content, 80) AS content_preview` in
      findRecentIngestions, in this file.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of findRecentIngestions, lines 59-63
    evidence: >-
      `limit` is validated (1..50) at the toolset
       * boundary before it reaches here.
    cost: >-
      The 1..50 bound is restated in prose in a file that does not enforce it. The code that does
      is in mcp/mcp-schemas.ts, so the next reader may look for the limit check here and not
      find it.
    kind: restates
    correction: >-
      Remove the prose. The bound is held by `limit: z.number().int().min(1).max(50).default(10)`
      in ListRecentIngestionsMcpInputSchema, src/modules/ingestion/mcp/mcp-schemas.ts.
    node: rules/knowledge-base/recent-ingestions-limit-bounds
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of aggregateToolCallOutcomes, lines 111-114
    evidence: >-
      Returns a fully-formed `LlmRunSummary` — every field
       * present, missing buckets default to 0 (BR-12). Two parts:
       *   - the 8 outcome buckets, grouped from `tool_call.validation_outcome`;
    cost: >-
      The zero-for-absent-outcome rule is stated in prose beside the code that implements it (the
      zero-initialised `summary` object). A change to the node leaves this prose and its "BR-12"
      citation pointing at an older statement.
    kind: restates
    correction: >-
      Remove the prose. The fact is held by the `summary` literal with every bucket at 0 and the
      loop over the grouped `tool_call` rows, in this file.
    node: rules/knowledge-base/summary-counts-tool-calls
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of aggregateToolCallOutcomes, lines 115-117, and the comment at lines 148-149
    evidence: >-
      `orphaned_fragments`, the count of this run's `proposed` fragments with
       *     no provenance row (uncited → unsearchable; recall-gap signal). Defined
       *     identically to the retry orphan-cleanup in `retryLlmRunRow` (BR-10).
    cost: >-
      The definition of an orphaned fragment and the summary's count of them are written out in
      prose again. The "unsearchable; recall-gap signal" rationale is prose that no node holds.
    kind: restates
    correction: >-
      Remove the prose. The count is held by the `information_fragment` query with
      `status = 'proposed'` and `id NOT IN (SELECT fragment_id FROM provenance ...)`, in this file.
    node: rules/knowledge-base/summary-counts-orphaned-fragments
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of retryLlmRunRow, lines 165-171, and the comment at lines 188-189
    evidence: >-
      In the same transaction, orphan `proposed` fragments of this run are
       *    flipped to `rejected`.
    cost: >-
      The retry rule that rejects orphaned fragments is restated in prose above the UPDATE that
      performs it, so it exists in a second place that the node does not govern.
    kind: restates
    correction: >-
      Remove the prose. The fact is held by `UPDATE information_fragment SET status = 'rejected'
      WHERE llm_run_id = $1 AND status = 'proposed' AND id NOT IN (...)`, in this file.
    node: rules/knowledge-base/retry-rejects-orphaned-fragments
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of findToolCallsByRun, line 237
    evidence: >-
      /** Page of `tool_call` rows ordered by `created_at` ascending. */
    cost: >-
      The listing order is stated in prose. The code orders by `created_at ASC, id ASC`, so the
      prose is also incomplete next to the node, which names the identifier tiebreak.
    kind: restates
    correction: >-
      Remove the prose. The order is held by `ORDER BY created_at ASC, id ASC` in
      findToolCallsByRun, in this file.
    node: rules/knowledge-base/tool-call-listing-order
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring of countFragmentsAnchoredToSource, lines 320-326
    evidence: >-
      BR-18 anti-hallucination check. For every fragment in `fragment_ids`, the
       * fragment must exist AND have at least one `fragment_source` row pointing to
       * a `raw_chunk` of `expected_raw_information_id`.
    cost: >-
      The anchoring rule is restated in prose and attributed to a back-spec "BR-18" rather than
      to its node. Whoever edits the node will not reach this paragraph.
    kind: restates
    correction: >-
      Remove the prose. The count is held by the `information_fragment` / `fragment_source` /
      `raw_chunk` join in this file. The refusal that compares the count is in
      service/propose-link.service.ts and service/propose-attribute.service.ts.
    node: rules/knowledge-base/cited-fragments-anchored
