findings:
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      the doc comment of listNodes, lines 71-75 ("Prefix lookup mechanics")
    evidence: >-
      We pass the already-normalized prefix as `$X` and compare with
      `alias_norm LIKE $X || '%'`. The btree index on `alias_norm` supports
      left-anchored LIKE under the default collation.
    cost: >-
      The prefix-match rule is described a second time in prose beside the
      query that holds it. If the node moves, this comment keeps stating the
      old rule and nothing flags it.
    kind: restates
    correction: >-
      Remove the prose. The `JOIN node_alias na ... LIKE $n || '%'` in
      listNodes already holds the fact.
    node: rules/knowledge-base/node-listing-name-prefix
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      the doc comment of listProvenanceByTargets, lines 297-299 ("BR-16 excerpt computation")
    evidence: >-
      BR-16 excerpt computation: `substring(raw_chunk.text from offset_start + 1
      for offset_end - offset_start)` — 1-based `substring`, 0-based
      `[offset_start, offset_end)` offsets
    cost: >-
      The excerpt rule is stated a second time in prose. The `substring(rc."text" FROM rc.offset_start + 1 FOR rc.offset_end - rc.offset_start)` expression in the same function holds it, so the comment is a second home outside behavior.
    kind: restates
    correction: >-
      Remove the prose. The SQL in the same function holds the fact.
    node: rules/knowledge-base/graph-provenance-excerpt-is-chunk-excerpt
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      the comment inside fetchTraversalHop above the SQL, lines 411-413
    evidence: >-
      Excluded the `status = 'deleted'` rows explicitly here — a tombstoned link is never part of
      the traversal envelope (UC-06 alt 3a).
    cost: >-
      The deleted-link exclusion is restated in prose beside the `AND kl.status <> 'deleted'` predicate that holds it. If the rule changes, the comment keeps asserting the old one.
    kind: restates
    correction: >-
      Remove the prose. The `kl.status <> 'deleted'` predicate holds the fact.
    node: rules/knowledge-base/traversal-skips-deleted-links
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      the doc comment of walkLinkHistory, lines 431-446
    evidence: >-
      Walk the complete lineage chain anchored at `anchorId`. Issues one
      recursive CTE that follows BOTH directions (up via `supersedes_*_id`,
      down via reverse pointer). Returns each row at most once, ordered ASC
      by `recorded_at` then `id` for deterministic output.
    cost: >-
      The history's membership and ordering are restated in prose beside the recursive CTE that holds them. A change to the node would leave this comment asserting the old shape.
    kind: restates
    correction: >-
      Remove the prose. The `up` and `down` CTEs and the `ORDER BY recorded_at ASC, id ASC` hold the fact.
    node: rules/knowledge-base/lineage-history
