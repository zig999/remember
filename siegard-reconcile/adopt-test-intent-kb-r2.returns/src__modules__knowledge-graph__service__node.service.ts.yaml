findings:
  - file: src/modules/knowledge-graph/service/node.service.ts
    where: >-
      line 62, comment above `const status: NodeStatus = input.status ?? "active";` in listNodesService
    evidence: >-
      // BR-15 — default to active when caller omits status.
    cost: >-
      The comment restates in prose, under a back-spec rule number, a fact the specification holds. A reader who changes the default in the node will go looking for BR-15 here, and the comment will not move with it.
    kind: restates
    correction: >-
      Remove the comment. The fact stays held by the `?? "active"` branch in this file, and by the node.
    node: rules/knowledge-base/node-listing-by-status
  - file: src/modules/knowledge-graph/service/node.service.ts
    where: >-
      line 65, comment above `name_prefix_norm` in listNodesService
    evidence: >-
      // BR-01 of `.spec.md` — apply norm() before the LIKE prefix lookup.
    cost: >-
      The comment restates how a node listing compares the name prefix "as a name". The code already holds this by calling `norm(input.name_prefix)`, so the comment is a second home for the rule.
    kind: restates
    correction: >-
      Remove the comment. The `norm(...)` call carries the fact.
    node: rules/knowledge-base/node-listing-name-prefix
  - file: src/modules/knowledge-graph/service/node.service.ts
    where: >-
      line 101, comment above the `node.status === "deleted"` branch in getNodeByIdService
    evidence: >-
      // BR-11 — deleted -> 410 (row exists but tombstoned).
    cost: >-
      The comment restates the refusal of a read of a deleted node, including its HTTP status, in prose. The branch that throws NodeDeletedError holds the fact, and the status is stated in the contract. If the contract moves, the comment will still claim 410.
    kind: restates
    correction: >-
      Remove the comment. The `throw new NodeDeletedError(input.nodeId)` branch carries the fact.
    node: rules/knowledge-base/deleted-node-read-refused
  - file: src/modules/knowledge-graph/service/node.service.ts
    where: >-
      line 126, comment above the warnIfEmptyProvenance call in getNodeByIdService
    evidence: >-
      // BR-17 — empty provenance on non-deleted item -> WARN (no client error).
    cost: >-
      The comment restates in prose that an attribute with no provenance is not refused to the client. The code holds this by returning `provenanceByAttrId.get(r.id) ?? []`, so the comment is a second home for the policy.
    kind: restates
    correction: >-
      Remove the comment. The `?? []` in the attributes mapping carries the fact.
    node: rules/knowledge-base/graph-read-shows-empty-provenance
