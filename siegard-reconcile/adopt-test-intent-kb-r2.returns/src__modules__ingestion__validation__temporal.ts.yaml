findings:
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      header comment, lines 4-5, and the inline comment at line 106
    evidence: >-
      "//   - semi-open invariant: `valid_from < valid_to` when both are provided
      //     (BR-16 / §13.3 / §5.2)."
      The code that holds the fact is
      "if (input.valid_from >= input.valid_to) { throw new ValidationFailure(\"BUSINESS_TEMPORAL_INCOHERENT\", ..."
    cost: >-
      The start-before-end rule is written a second time as prose citing retired document
      sections (BR-16, §13.3). When the node moves, nobody is led to this comment, and it goes
      on saying the old rule beside code that no longer matches it.
    kind: restates
    correction: >-
      Remove the comment. The code in this file holds the fact, and the comment route removes
      the prose.
    node: rules/knowledge-base/validity-start-before-end
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      header comment lines 6-10 and the comment block at lines 128-135
    evidence: >-
      "//   - date justification chain (A14 / §6.5): when `requires_valid_from = true`
      //     for the link_type or attribute_key, AND `valid_from` is supplied, the
      //     caller must declare a non-null `valid_from_basis`."
      The code that holds the fact is
      "if (input.valid_from !== null && input.valid_from_basis === null) { throw new ValidationFailure(\"BUSINESS_DATE_UNJUSTIFIED\", ..."
    cost: >-
      The comment states the basis rule as conditional on `requires_valid_from = true`, but the
      code throws whenever a start is stated without a basis. A reader trusting the prose takes
      the wrong rule, and the node is not where they look.
    kind: restates
    correction: >-
      Remove the comments. The code holds the fact, and the node states it.
    node: rules/knowledge-base/stated-start-requires-basis
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      header comment lines 11-13, the doc comment at lines 61-65 and the inline comment at line 117
    evidence: >-
      "//   - correction signal: `change_hint = 'correction'` requires textual errata
      //     evidence in at least one cited fragment."
      and "* Errata-signal heuristic — `'correction'` requires textual evidence of an
      * errata in at least one cited fragment (case-insensitive substring of any
      * of the Portuguese/English markers used in the domain glossary)."
      The code that holds the fact is
      "const ERRATA_MARKERS = [\"errata\", \"errado\", \"correção\", \"corrigir\", \"correction\", \"correcao\"] as const;"
      and "if (!hasErrataSignal(input.fragment_texts)) { throw new ValidationFailure(\"BUSINESS_TEMPORAL_INCOHERENT\", ..."
    cost: >-
      The correction-evidence rule appears again in prose, with a pointer to a "domain glossary"
      as the origin of the marker list. The node and the code hold that list, so the pointer
      sends a reader to the wrong place.
    kind: restates
    correction: >-
      Remove the comments. The ERRATA_MARKERS constant and the throw hold the fact.
    node: rules/knowledge-base/correction-requires-errata-evidence
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      header comment lines 15-22, the doc comment at lines 49-55 and the inline comments at lines 159, 167 and 175-176
    evidence: >-
      "// Fallback chain for `requires_valid_from = true` (v7 §6.5 / §13c / A14):
      //   stated -> document -> received. When `valid_from` is not supplied and
      //   `document_date` is absent BUT `received_at` is available, the layer
      //   resolves `valid_from := received_at` (date portion) with
      //   `valid_from_source := 'received'`."
      The code that holds the fact is
      "const receivedDate = toIsoDate(input.received_at); if (receivedDate !== null) { return { valid_from: receivedDate, valid_from_basis: \"received\", }; }"
      The comment names `valid_from_source`, but the field in the code is `valid_from_basis`.
    cost: >-
      The fallback rule exists as prose citing retired sections (§6.5, §13c, A14). The prose
      also names a field, `valid_from_source`, that does not exist in the code, so a reader
      comparing it with the node gets a vocabulary the node does not use.
    kind: restates
    correction: >-
      Remove the comments. The branch at lines 143-166 holds the fact.
    node: rules/knowledge-base/required-start-fallback
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      header comment lines 19-20 and the comments at lines 128-135 and 167
    evidence: >-
      "//   rejection only fires when ALL THREE links of the chain are absent."
      and "// ALL three links absent — only now is the row BUSINESS_DATE_UNJUSTIFIED."
      The code that holds the fact is
      "throw new ValidationFailure(\"BUSINESS_DATE_UNJUSTIFIED\", \"link_type / attribute_key requires_valid_from = true but no date is available ..."
    cost: >-
      The refusal condition (no stated start, no document date and no reception date) is
      restated in prose. The node that governs it is a different one, so a change to that node
      leaves this prose untouched.
    kind: restates
    correction: >-
      Remove the comments. The throw at lines 168-172 holds the fact.
    node: rules/knowledge-base/required-start-available
