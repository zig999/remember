findings:
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      StartAsyncIngestionMcpInputSchema and its type, lines 81-123
    evidence: >-
      export const StartAsyncIngestionMcpInputSchema = z.object({ ... "The full plain text of the document to ingest. Paste the raw content; the server chunks it, runs structured extraction in the BACKGROUND, and persists the knowledge graph with provenance. No base64/binary." ... — and the docblock "`start_async_ingestion` (BR-32) — shape-identical to `ingest_document` for caller symmetry. The only difference is the new-run return semantics (immediate vs. awaited)"
    cost: >-
      The specification says the ingest toolset offers no tool that starts an ingestion and returns before it completes, and the retirement is recorded in its decision log. This file still declares and exports the input contract of exactly such a tool, with a description promising background extraction. The schema is not registered or imported anywhere in backend/src except a test. A later reader of the schema file will take the async tool as decided and may register it, which breaches the constraint without anything failing.
    kind: contradicts
    correction: >-
      The schema and its type would have to leave the file, because the node retires the tool. If the owner wants the tool back, the constraint changes first, through analysis.
    node: constraints/ingest-toolset-offers-no-async-ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      GetIngestionStatusSummarySchema, AffectedNodeOutputSchema and GetIngestionStatusOutputSchema, lines 206-249
    evidence: >-
      export const GetIngestionStatusOutputSchema = z.object({ id: z.string().uuid(), model: z.string(), prompt_version: z.string(), started_at: ..., finished_at: ..., status: z.enum(["running", "completed", "failed"]), attempts: z.number().int().positive(), input_raw_information_id: z.string().uuid(), idempotency_key: z.string().regex(/^[0-9a-f]{64}$/), summary: GetIngestionStatusSummarySchema, affected_nodes: z.array(AffectedNodeOutputSchema).optional() }); the docblock says "It mirrors `LlmRunResponseSchema` (`dto/llm-run.dto.ts`)"
    cost: >-
      The shape the read-llm-run operation answers (identity, model, prompt version, times, status, attempts, raw information, idempotency key, summary, affected nodes) is already declared in dto/llm-run.dto.ts as LlmRunResponseSchema, LlmRunSummarySchema and AffectedNodeSchema. This file declares it a second time, field for field. Nothing in src reads these schemas except a unit test, so the copy is a second authority that no transport follows. When the run shape moves, the copy stays behind, and the test asserts against the stale copy instead of the shape the transport emits.
    kind: contradicts
    correction: >-
      The run read has one declaration, the one the transports use. This second declaration of the same shape would have to go. The bind for the contract belongs on the file that holds the real shape.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      header comment of the ingest_directed section, lines 270-273
    evidence: >-
      // opens a `RawInformation` + `LLMRun` (sentinels `model='directed'`,
      // `prompt_version='directed-v1'`), then dispatches the items in dependency
      // order through the existing `propose_*` handlers. No Anthropic round-trip.
    cost: >-
      This is a second home, in prose, for the directed run's sentinel model and prompt version. Code holds them in service/directed-ingestion.service.ts (`export const DIRECTED_PROMPT_VERSION = "directed-v1" as const;`). A reader who finds the sentinels in this schema file's comment may take it for the place they are decided, and the comment does not move when the node does.
    kind: restates
    correction: >-
      Remove the prose. The fact is held by the node and by the code in directed-ingestion.service.ts.
    node: rules/knowledge-base/directed-ingestion-run
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      comment on `confidence` in the ingest_directed section, lines 276-280
    evidence: >-
      //   - `confidence` is DELIBERATELY ABSENT from every item — the server forces
      //     `confidence = 1.0` on every dispatched `propose_*` (BR-34 step 4 + the
      //     contract: a directed payload is a stated fact by construction; callers
      //     cannot lower confidence here).
    cost: >-
      This is a second home, in prose, for the rule that a directed ingestion proposes everything at confidence 1.0. Code holds the rule in service/directed-ingestion.service.ts (`confidence: 1.0`, lines 475, 632 and 712). The comment can drift from the node without any check noticing, and it tempts a later reader to add a `confidence` field here.
    kind: restates
    correction: >-
      Remove the prose. The fact is held by the node and by the code in directed-ingestion.service.ts.
    node: rules/knowledge-base/directed-full-confidence
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      the `describe` of `node_id` in IngestDirectedNodeItemSchema, line 348
    evidence: >-
      Rejected (VALIDATION_INVALID_FORMAT) if the id does not point to an active node.
    cost: >-
      This text is advertised to the calling model on tools/list. The contract splits the two refusals. A pinned identity that names no knowledge node is reported with RESOURCE_NOT_FOUND, and one that names a node that is not active with VALIDATION_INVALID_FORMAT. The description gives VALIDATION_INVALID_FORMAT for both, so a caller that branches on the code the description promises will mishandle a pin to an unknown node.
    kind: contradicts
    correction: >-
      The description would have to say that an unknown id is refused with RESOURCE_NOT_FOUND and an inactive node's id with VALIDATION_INVALID_FORMAT.
    node: contracts/knowledge-base/ingestion
