findings:
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      searchNodeAliasLayer, the ORDER BY of the node-layer SQL (line 130)
    evidence: >-
      ORDER BY score DESC, kn.canonical_name ASC, kn.id ASC
      LIMIT $4
      (the node says: "Search items are ranked by score descending, then by recording time descending with a knowledge node counting as never recorded, then by identifier ascending.")
    cost: >-
      The node layer breaks score ties by canonical name, a step the ranking node does not have. When the layer's LIMIT cuts the candidates, tied nodes survive in name order, not in identifier order. A reader who checks the ranking against search-ranking will not find the name tie-break, because it lives only in this SQL. Whether the service later re-sorts the survivors is outside this file.
    kind: contradicts
    correction: >-
      Either the node-layer tie-break follows the node (score descending, then identifier ascending), or search-ranking is amended to state the canonical-name tie-break if that is what the business decided.
    node: rules/knowledge-base/search-ranking
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      the excerpt expression in searchChunkLayer (lines 177-178), repeated in listProvenanceForFragments (264-265), listProvenanceForLinks (301-302) and listProvenanceForNodes (360-361)
    evidence: >-
      substring(rc."text" FROM rc.offset_start + 1
                FOR rc.offset_end - rc.offset_start) AS excerpt
    cost: >-
      A search result's chunk excerpt is cut from the chunk's own text starting at the chunk's start offset, for the chunk's length. No node states this cut for search. The only node that states it, graph-provenance-excerpt-is-chunk-excerpt, is scoped to "A graph read's provenance entry". Search is not a graph read, so the cut that decides what a search result shows lives only in this SQL, and the next reader will look for it in the specification and not find it.
    kind: unstated
    correction: >-
      Analysis gives the search excerpt a node. The simplest route is to widen graph-provenance-excerpt-is-chunk-excerpt to cover search provenance entries, or to add a search-item rule that states the cut.
    node: rules/knowledge-base/graph-provenance-excerpt-is-chunk-excerpt
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      the provenance lookups listProvenanceForFragments (lines 269-274), listProvenanceForLinks (306-312) and listProvenanceForNodes (365-373)
    evidence: >-
      JOIN fragment_source fs ON fs.fragment_id = f.id
      JOIN raw_chunk rc       ON rc.id = fs.raw_chunk_id
      JOIN raw_information ri ON ri.id = rc.raw_information_id
      WHERE f.id = ANY($1::uuid[])
      (no rc.superseded_at predicate and no raw_information status predicate in any of the three, while searchChunkLayer applies "AND rc.superseded_at IS NULL"; the node says: "Search shows no information fragment whose raw information was deleted for compliance, neither as a search item nor as the support of one.")
    cost: >-
      In this file the supporting provenance rows of a search item are read without the compliance exclusion the chunk layer applies. The link and node lookups also have no fragment status filter. A chunk excerpt or fragment text from raw information deleted for compliance can come back as the support of a search item unless another file filters it. The file's own comment says deleted content "must never come back through retrieval", yet only one of its four queries enforces that.
    kind: contradicts
    correction: >-
      Every provenance lookup that supports a search item has to exclude compliance-deleted sources, or the exclusion has to be shown to sit elsewhere. This file does not carry it.
    node: rules/knowledge-base/search-excludes-compliance-deleted-sources
