findings:
  - file: src/modules/knowledge-graph/traversal/config.ts
    where: >-
      the file header comment (lines 1-15) and the docstring above TRAVERSAL_DECAY (line 17)
    evidence: >-
      `// `TRAVERSAL_DECAY` (BR-14 of `knowledge-graph.back.md`, ADR A16) is the
      // single source of truth for the per-hop score decay applied by the BFS
      // traversal engine.` and `/** Per-hop score multiplier: `score(hop) = TRAVERSAL_DECAY ** hop`. */`
      above `export const TRAVERSAL_DECAY = 0.5 as const;`
    cost: >-
      Prose that no running system emits restates the per-hop decay rule and names itself the
      "single source of truth", while the node expansion-decay holds that fact. A reader who
      trusts the comment looks here, and not in the specification, for where the decay was
      decided. The code holds the value (`0.5`) in this same file, so the pair conforms and
      only the prose is owed removal.
    kind: restates
    correction: >-
      Remove the header comment and the docstring. The 0.5 value stays held by the
      `TRAVERSAL_DECAY` declaration. The traversal-link-score node states the same fact for
      traversal.
    node: rules/knowledge-base/expansion-decay
  - file: src/modules/knowledge-graph/traversal/config.ts
    where: >-
      the docstrings above TRAVERSAL_DEPTH_MIN and TRAVERSAL_DEPTH_MAX (lines 20 and 23)
    evidence: >-
      `/** Lower bound on the depth parameter (BR-05 of `knowledge-graph.back.md`). */` and
      `/** Upper bound on the depth parameter (BR-05). */`, above
      `export const TRAVERSAL_DEPTH_MIN = 1 as const;` and `export const TRAVERSAL_DEPTH_MAX = 3 as const;`
    cost: >-
      The depth bounds are restated as prose citing a back-spec rule, so the next reader
      follows the citation instead of the specification node expansion-depth-bounds. The
      constants hold the bounds in code in this file, so the pair conforms and the prose is
      owed removal.
    kind: restates
    correction: >-
      Remove the two docstrings. The constants keep holding 1 and 3.
    node: rules/knowledge-base/expansion-depth-bounds
  - file: src/modules/knowledge-graph/traversal/config.ts
    where: >-
      the docstring above TRAVERSAL_DEPTH_DEFAULT (line 26)
    evidence: >-
      `/** Default depth when the caller does not specify one. */` above
      `export const TRAVERSAL_DEPTH_DEFAULT = 1 as const;`
    cost: >-
      Prose restates that an omitted depth takes a default, a fact the node traversal-defaults
      holds ("goes one hop deep"). The code holds the value 1 in this file, so only the prose
      is owed removal.
    kind: restates
    correction: >-
      Remove the docstring. The constant keeps holding 1.
    node: rules/knowledge-base/traversal-defaults
