findings:
  - file: src/modules/compliance-audit/service/errors.ts
    where: >-
      the header comment, lines 1-16 (the "Three families" list)
    evidence: |-
      //   - ResourceNotFoundError -> 404 / RESOURCE_NOT_FOUND
      //   - ValidationFailure     -> 422 / VALIDATION_*  (code set by the caller)
      //   - InternalFailure       -> 500 / SYSTEM_INTERNAL_ERROR (BR-17 legacy-orphan alarm)
    cost: >-
      The status and code of the compliance-audit refusals are written again in prose. The classes
      below already carry them (`statusCode = 404`, `code = "RESOURCE_NOT_FOUND" as const`,
      `statusCode = 422`, `statusCode = 500`, `code = "SYSTEM_INTERNAL_ERROR" as const`).
      The contract that holds them is contracts/knowledge-base/compliance-audit, which is outside
      this file's node pack. When that contract moves, this list keeps saying the old mapping, and
      the trace does not reach prose.
    kind: restates
    correction: >-
      Remove the comment. The classes hold the fact, and the contract holds it for the pair. The
      comment route applies, then /reconcile over this file.
    node: contracts/knowledge-base/compliance-audit
  - file: src/modules/compliance-audit/service/errors.ts
    where: >-
      the docblock above InternalFailure, lines 54-59
    evidence: |-
      * 500 — UC-01 alt `4c` legacy inconsistency: `raw_information.status =
      * 'deleted'` exists with no `compliance_deletion` row. BR-17 mandates an
      * operational alarm (already emitted at the service layer) and a generic
      * 500 to the client.
    cost: >-
      The condition for this refusal (a raw information already deleted with no compliance deletion
      on record) and its generic 500 are stated in prose. Code holds the same fact in another file:
      compliance-audit.service.ts has `throw new InternalFailure("legacy_orphan_tombstone", {`,
      and this file holds the status, code and message `super("Unexpected internal error.", details)`.
      The contract contracts/knowledge-base/compliance-audit also states it. The docblock is a
      second home the next reader may trust over the contract, and it names a back-spec
      (UC-01, BR-17) instead of a node.
    kind: restates
    correction: >-
      Remove the docblock. The condition is held by the service's throw, and the answer is held by
      the class and by the contract.
    node: contracts/knowledge-base/compliance-audit
