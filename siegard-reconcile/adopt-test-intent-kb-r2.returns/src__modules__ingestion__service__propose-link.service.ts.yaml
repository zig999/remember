findings:
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      Layer 4 (Confidence) returning before Layer 5 (Anti-hallucination), lines 167-194
    evidence: >-
      const route = routeConfidence(args.confidence);
      if (route.kind === "below_floor") { ... return { ok: true, result }; }
      // ---- Layer 5: Anti-hallucination ----
      const anchored = await countFragmentsAnchoredToSource(client, {
    cost: >-
      A below-floor proposal that cites fragments not drawn from the run's source
      gets outcome rejected with reason BELOW_CONFIDENCE_FLOOR, and the anchoring
      refusal (VALIDATION_INVALID_FORMAT naming the fragments) is never raised.
      The same proposal at or above the floor is refused. No node states which
      answer takes precedence when both apply. The order lives only in this
      file's sequence of awaits, so the next reader looks for it in the
      specification and does not find it.
    kind: unstated
    correction: >-
      The ingestion contract, or the rules cited-fragments-anchored and
      below-confidence-floor-records-nothing, would have to state whether the
      anchoring refusal or the below-floor result is answered first.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      header comment, layer 4 line (line 13) and the paragraph at lines 17-19
    evidence: >-
      //   4. Confidence    — < 0.40 -> ok:true outcome=rejected (BELOW_CONFIDENCE_FLOOR).
    cost: >-
      The 0.40 floor is restated in prose in a file the node is not bound to for
      it. The running code holds it in src/modules/ingestion/validation/confidence.ts
      (`CONFIDENCE_FLOOR = 0.4`, `routeConfidence`), so if the node's number
      moves, this comment keeps saying the old one.
    kind: restates
    correction: >-
      Remove the comment. The behavior is correct and the node already holds the fact.
    node: rules/knowledge-base/below-confidence-floor-records-nothing
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      Layer 3 comment (lines 139-142) and the consolidator-args comment (lines 206-208)
    evidence: >-
      // is the LAST link of the date-justification chain (v7 §6.5 / §13c / A14)
      // and is consumed by `validateTemporal` as the fallback for
      // `requires_valid_from = true` rows that carry no stated/document date.
    cost: >-
      The fallback rule for a required validity start is restated in prose here.
      The code that holds it is src/modules/ingestion/validation/temporal.ts
      (`valid_from: receivedDate, valid_from_basis: "received"`). The prose speaks
      of a "chain" stated, document, received. The node says a source with a
      document date keeps no start and no basis, and the code does that. A reader
      of the comment would expect the document date to be used.
    kind: restates
    correction: >-
      Remove the comments. The behavior is correct and the node already holds the fact.
    node: rules/knowledge-base/required-start-fallback
