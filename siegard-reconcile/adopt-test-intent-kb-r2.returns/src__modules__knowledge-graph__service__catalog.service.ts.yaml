      the comment above the node-type check in listAttributeKeysService, line 102
    evidence: >-
      // BR-03 — fail fast before SQL.
    cost: >-
      The comment is prose that restates the refusal of an unknown node type. The code holds that refusal
      in this file (`throw new UnknownNodeTypeError(options.node_type)`), and
      errors.ts holds its code (`BUSINESS_UNKNOWN_NODE_TYPE`). A reader looking for where the rule lives
      is sent to a BR-number outside the specification.
    kind: restates
    correction: >-
      Remove the comment. The route for prose is removal, followed by /reconcile over this file.
    node: rules/knowledge-base/node-type-filter-in-catalog
  - file: src/modules/knowledge-graph/service/catalog.service.ts
    where: >-
      the comment above the valid-values query in listAttributeKeysService, lines 110-112
    evidence: >-
      // BR-30 — attach closed-domain values so REST/MCP clients see the allowed
      // set up-front (parity with the chat ontology block). Group per key id;
      // keys with no rows stay OPEN (no `valid_values`).
    cost: >-
      The comment restates, as prose, that `valid_values` appears only for a key the catalog closes.
      The code holds that fact in this same file (`values !== undefined && values.length > 0 ? { ...base, valid_values: [...values].sort() } : base`).
      The comment is a second home for the fact, citing a BR-number that is not a node.
    kind: restates
    correction: >-
      Remove the comment. The route for prose is removal, followed by /reconcile over this file.
    node: contracts/knowledge-base/retrieval
