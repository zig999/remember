findings:
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: >-
      LayersArray, lines 26-28 (the `layers` field of SearchQuerySchema)
    evidence: >-
      const LayersArray = z
        .union([z.string().min(1), z.array(z.string().min(1))])
        .transform((v) => (Array.isArray(v) ? v : [v]));
    cost: >-
      An empty layer name (`?layers=`) is not a search layer, and the node says such a query is refused
      with BUSINESS_INVALID_SEARCH_LAYER, naming the allowed layers. Here `.min(1)` stops it at the schema
      first, so it is refused as VALIDATION_INVALID_FORMAT. The code answers one input differently from
      the contract, and the comment above the schema says the opposite ("non-enum elements raise a
      ZodError that the service translates to BUSINESS_INVALID_SEARCH_LAYER").
    kind: contradicts
    correction: >-
      An empty layer name would have to reach the layer-set check and be refused as
      BUSINESS_INVALID_SEARCH_LAYER. Alternatively, the specification would have to say that an empty
      layer name is a malformed value.
    node: rules/knowledge-base/search-layer-outside-set-refused
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: >-
      the docstring above QueryString, lines 37-47
    evidence: >-
      * `query` validation per BR-04 of the back spec:
       *   - min 1 char (raw)
       *   - max 1000 chars (raw)
       *   - btrim non-empty after transform (rejects whitespace-only input)
    cost: >-
      The docstring is a second home outside behavior for the 1000-character cap and the non-blank rule.
      Both are already held by the code below it, `.max(1000, ...)` and `.refine((s) => s.length > 0, ...)`.
      A reader can take the prose for the place the limit is decided.
    kind: restates
    correction: >-
      Remove the docstring. The rule is held by the nodes and by the schema beneath it.
    node: rules/knowledge-base/search-query-length
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: >-
      `.strict()` closing SearchQuerySchema, line 74
    evidence: >-
      export const SearchQuerySchema = z
        .object({
          query: QueryString,
          ...
        })
        .strict();
    cost: >-
      The code refuses a search that names any parameter the search does not define. The `search`
      operation in the retrieval contract lists no such refusal. Only the accepted-fragment listing
      (a rule), the catalog listings and the graph reads state one. The refusal therefore lives only in
      this schema, and the next reader looks for it in the specification and does not find it. The same
      schema is reused by the MCP query toolset, so it applies on both transports.
    kind: unstated
    correction: >-
      The `search` operation's refusals would need to say whether an undefined parameter is refused, or
      the strictness would have to go.
    node: contracts/knowledge-base/retrieval
