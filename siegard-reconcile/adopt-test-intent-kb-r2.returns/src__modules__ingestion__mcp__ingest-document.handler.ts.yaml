findings:
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      Lines 18-22, the header comment on idempotency, and lines 159-163, the comment inside the
      noop_existing branch.
    evidence: >-
      "Idempotency (BR-08): if the same content was already ingested,
      `ingestRawInformation` returns `noop_existing`; we DO NOT re-run extraction
      (the existing run is completed, or running, and re-running would either no-op
      or 409). The tool reports `already_ingested` with the existing ids — never an
      error." and "a non-`completed` run means the prior extraction did
      not finish and recovery requires re-running that LLMRun (no retry tool is
      exposed over MCP yet — see BR-30)."
    cost: >-
      Two comments restate the already_ingested outcome and the unfinished-run recovery. Code
      holds both: the `outcome === "noop_existing"` branch returns `outcome: "already_ingested"`
      with the existing ids and the status-dependent message, and the contract holds the same
      fact. A reader can take the comment as a second home for the rule. It also cites a
      back-spec rule number (BR-30) that no node carries.
    kind: restates
    correction: >-
      Remove the two comments. The code in this file holds the fact and the node
      contracts/knowledge-base/ingestion holds it.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      Lines 41-48, the doc comment on DEFAULT_INGEST_MODEL, and lines 68-70, the doc comment on
      `ingestModel`.
    evidence: >-
      "Hard-coded fallback extraction model used only when the caller omits `model`
      AND no `ingestModel` is wired ... Override per call (the
      `model` arg) or via the INGEST_MODEL env (no recompile)."
    cost: >-
      The comment restates the fallback order for the extraction model. Code holds that order in
      this file as `model: input.model ?? deps.ingestModel ?? DEFAULT_INGEST_MODEL`, and the
      node holds it too. A second statement of a default value in prose will drift silently when
      the model changes.
    kind: restates
    correction: >-
      Remove the prose. The constant and the `??` chain in this file hold the fact, and the node
      rules/knowledge-base/default-extraction-model holds it as well. That node is outside this
      file's pack, so the file is not bound to it.
    node: rules/knowledge-base/default-extraction-model
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      The `body` object built at lines 114-121, the `storage_ref` and `metadata` members.
    evidence: >-
      storage_ref: null,
      metadata: input.metadata ?? {},
    cost: >-
      A document ingestion always records no storage reference and records empty metadata when
      the caller gives none. Neither value is stated by the contract's ingest-document operation
      or by any node I found (grep of projections/full-text.md for "storage reference", "storage_ref"
      and "metadata"). Because it is not in the specification, the next reader will not find it
      there, and this file becomes the place that decision lives.
    kind: unstated
    correction: >-
      Give the fact a node, for example in the ingest-document operation or a rule on what a
      document ingestion records, and bind this file to it.
    node: contracts/knowledge-base/ingestion
