read:
  - node: constraints/retrieval-transports-answer-alike
    held_at: >-
      the route handlers of this file. They hand known service errors to the mapper shared with the MCP
      transport (handleReadError, handleTraversalError, handleAttributeKeyHistoryError, all calling
      mapErrorToHttpResponse). The REST-only leniency for the node-type listing, the link and attribute
      reads and the three history reads is held by those routes parsing no query.
    evidence: >-
      app.get("/node-types", async (_req, reply) => ...) parses no query;
      app.get("/links/:link_id", ...) parses only `LinkIdParamSchema.parse(request.params)`;
      the history routes parse only params. The other retrieval routes parse a strict query schema, for
      example `ListLinkTypesQuerySchema.parse(request.query ?? {})`, and queries.dto.ts closes those with
      `.strict()`.
  - node: contracts/knowledge-base/access
    held_at: nowhere
    evidence: >-
      The file registers no authentication or routing behavior. It relies on the parent scope and rethrows
      unmapped errors: `if (!isMappableServiceError(err)) throw err;`. The authentication and the
      503/500/422 handling live in src/app.ts and src/middleware/error-handler.ts.
  - node: contracts/knowledge-base/ingestion
    held_at: nowhere
    evidence: >-
      No ingestion, run, proposal or chunk route is registered here. The only routes are
      `app.get("/node-types", ...)` through `app.get("/nodes/:node_id/attributes/:key/history", ...)`.
  - node: contracts/knowledge-base/retrieval
    held_at: >-
      the app.get registrations of registerKnowledgeGraphRoutes. They cover list-node-types,
      list-link-types, list-attribute-keys, list-nodes, read-node, read-link, read-attribute, the three
      history reads and traverse. Each wraps a service call in withReadOnly and replies with an
      `{ ok: true, result }` envelope. The route-context details the contract names for REST are passed to
      the mapper.
    evidence: >-
      `return reply.status(200).send({ ok: true, result: body });`.
      `return handleReadError(err, reply, { node_id: params.node_id });`.
      `return handleAttributeKeyHistoryError(err, reply, { node_id: params.node_id, key: params.key });`.
      `return handleTraversalError(err, reply, { node_id: params.node_id });`.
      search, the provenance reads and the accepted-fragment listing are not registered in this file.
