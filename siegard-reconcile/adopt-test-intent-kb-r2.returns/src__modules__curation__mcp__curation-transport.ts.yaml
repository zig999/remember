looked_past: >-
  The header comment and the deps doc comments state facts only as prose, with no code in this file holding them ("Exposes 8 tools", "NO X-LLM-Run-Id", "the curation DTOs encode the BR-30 BUSINESS_* cross-field rules", "the write-side `curation_action` audit happens INSIDE the service"); the route path, server name and version are transport wiring that no node in the pack or in the full-text projection mentions, and I judged them not to be a domain fact.
