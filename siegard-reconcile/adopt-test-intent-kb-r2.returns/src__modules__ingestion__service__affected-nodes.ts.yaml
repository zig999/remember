    where: >-
      the header comment (lines 27-30) and the comment above isContributingOutcome (lines 72-86)
    evidence: >-
      "`rejected` and `error` validation outcomes do NOT contribute (they did not touch the graph). De-dup is by `node_id`; first-write-wins on the entry. Iteration order on the final list is insertion order" and "Closed list per BR-33 / BR-27. propose_node: created_new | matched_existing | needs_review ... propose_link: accepted | consolidated | superseded_previous | disputed"
