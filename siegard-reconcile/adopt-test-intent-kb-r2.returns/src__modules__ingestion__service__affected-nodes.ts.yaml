    where: >-
      the doc comment of resolveAffectedNodes (lines 225-228)
    evidence: >-
      "Rows whose `knowledge_node.status = 'merged_into'` are resolved transparently to the surviving node via `merged_into_node_id`."
    cost: >-
      The merge-following rule is stated again in prose. The node that holds it is outside this file's pack, so a reader of that node does not see this comment, and a later change to the node leaves this one stale.
    kind: restates
    correction: >-
      Remove the prose. The code holds the fact: the survivor lookup and the `row = survivor` step in resolveAffectedNodes.
    node: rules/knowledge-base/affected-nodes-follow-merges
  - file: src/modules/ingestion/service/affected-nodes.ts
    where: >-
      the doc comment of resolveAffectedNodes (lines 229-231)
    evidence: >-
      "Ids the lookup does not find at all (e.g. a node compliance-deleted between the tool call and run-completion) are skipped silently"
    cost: >-
      The omission of absent nodes is stated again in prose, and the comment adds a compliance-deletion cause that no node states. A reader can take that cause for part of the rule.
    kind: restates
    correction: >-
      Remove the prose. The code holds the fact: `if (row === undefined) continue;` in resolveAffectedNodes.
    node: rules/knowledge-base/affected-nodes-omit-absent
