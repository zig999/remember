findings:
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      the file-header comment, lines 7-15 (Transaction policy (BR-02))
    evidence: >-
      // The CALLER (route or MCP handler) opens BEGIN / COMMIT / ROLLBACK and
      // hands the live `client` to `complianceDelete`. Every DB statement of
      // UC-01 runs on that same client; commit is reached only after BR-08 has
      // written BOTH audit rows.
    cost: >-
      The all-or-nothing rule for a compliance deletion is restated in prose in a file that does not
      open the transaction. If the node moves, nobody has to touch this comment, and it will keep
      describing the old rule.
    kind: restates
    correction: >-
      Remove the comment. The code that holds the fact is `withTransaction(deps.pool, ...)` in
      src/modules/compliance-audit/routes/compliance-audit.routes.ts, line 76.
    node: constraints/compliance-deletion-is-atomic
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      the docstring above REDACTED_LITERAL, lines 51-57, and the constant itself
    evidence: >-
      export const REDACTED_LITERAL = "[REDACTED]" as const;
    cost: >-
      The literal that a compliance deletion writes over content is declared a second time here.
      The actual redaction is the SQL in compliance-audit.repository.ts, `SET content = '[REDACTED]'`,
      with `original_input = CASE WHEN original_input IS NULL THEN NULL ELSE '[REDACTED]' END`.
      That SQL does not read this constant. The constant is only re-exported by index.ts and pinned
      by a test. If the node's literal changes, the repository and this constant can diverge
      silently, and the test pins the copy that nothing at runtime uses.
    kind: contradicts
    correction: >-
      Keep one declaration of the literal, in the file that performs the redaction, or have that
      file read this constant. The node is not bound to this file, so a bind cannot close the
      duplicate.
    node: rules/knowledge-base/compliance-deletion-redacts-content
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      the docstring of complianceDelete, lines 72-75 (discriminated union return)
    evidence: >-
      * Discriminated union return:
      *   - { outcome: 'deleted',              deletion } -> HTTP 201
      *   - { outcome: 'noop_already_deleted', deletion } -> HTTP 200
    cost: >-
      The outcome-to-status mapping of the compliance-delete contract is restated in prose. The
      mapping is chosen in the route, not here, so this comment can go stale without any check
      noticing.
    kind: restates
    correction: >-
      Remove the comment. The code that holds the mapping is `const status = result.outcome === "deleted" ? 201 : 200;`
      in src/modules/compliance-audit/routes/compliance-audit.routes.ts, line 79.
    node: contracts/knowledge-base/compliance-audit
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      coerceNonNegativeInt (lines 338-347), used by rowToDto for each of the four affected counts
    evidence: >-
      if (typeof v === "number" && Number.isFinite(v) && v >= 0) {
          return Math.trunc(v);
        }
        ...
        return 0;
    cost: >-
      A stored count that is absent, negative or not a number is reported to the owner as 0, and a
      fractional one is truncated. No node states either rule. The specification only says the
      counts are zero or more. The audit record can therefore show "0 links deleted" for a row that
      holds no such figure, and the next reader will look in the specification for the reason and
      not find it.
    kind: unstated
    correction: >-
      The analysis would have to decide whether a missing or invalid stored count is read as 0,
      refused, or cannot occur, and state that in the node for the counts.
    node: domain/knowledge-base/affected-counts
read:
