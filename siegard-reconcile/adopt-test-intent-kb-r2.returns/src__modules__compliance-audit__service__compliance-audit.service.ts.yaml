    held_at: nowhere
    evidence: >-
      The file holds no authentication, routing or health behavior. It only imports `pg`, `pino`, the
      DTOs and the repository, and throws ResourceNotFoundError and InternalFailure.
  - node: contracts/knowledge-base/ingestion
    held_at: nowhere
    evidence: >-
      The file holds no intake, proposal, extraction or ingestion operation. Its functions are
      complianceDelete, listComplianceDeletions, getComplianceDeletionById, listCurationActions and
      getCurationActionById.
  - node: contracts/knowledge-base/retrieval
    held_at: nowhere
    evidence: >-
      The file holds no search, provenance read, catalog listing or graph read. It only reads
      compliance_deletion and curation_action records.
  - node: rules/knowledge-base/accepted-fragment-listing-refuses-unknown-parameter
    held_at: nowhere
    evidence: >-
      The file has no accepted-fragment listing, and no query parameter is refused anywhere in it.
  - node: rules/knowledge-base/affected-nodes-of-a-run
    held_at: nowhere
    evidence: >-
      The file never computes the affected nodes of an LLM run. The only "affected" it builds is
      `const affected = { chunks, fragments, links, attributes };`, which is the compliance counts.
  - node: rules/knowledge-base/affected-nodes-omit-absent
    held_at: nowhere
