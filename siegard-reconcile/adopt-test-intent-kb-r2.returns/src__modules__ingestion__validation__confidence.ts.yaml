findings:
  - file: src/modules/ingestion/validation/confidence.ts
    where: >-
      the header comment, lines 1-5 (the active and uncertain buckets)
    evidence: >-
      // Confidence routing (BR-17 of `ingestion.back.md`, A13 of v7).
      //   confidence >= 0.75            -> assertion status = 'active'
      //   0.40 <= confidence < 0.75     -> assertion status = 'uncertain'
    cost: >-
      The two thresholds and the status each one maps to are written a second time in prose. The code holds the same fact in this file, in CONFIDENCE_UNCERTAIN_UPPER, CONFIDENCE_FLOOR and routeConfidence. A change to the node moves neither the comment nor anything that checks it, so a reader may take the comment as the decided value.
    kind: restates
    correction: >-
      Remove the header comment. The fact stays in rules/knowledge-base/new-assertion-status-from-confidence and in routeConfidence.
    node: rules/knowledge-base/new-assertion-status-from-confidence
  - file: src/modules/ingestion/validation/confidence.ts
    where: >-
      the header comment, lines 6-12 (the below-floor bucket), and the doc comment on routeConfidence at line 23
    evidence: >-
      //   confidence < 0.40             -> link/attribute NOT created;
      // The third branch is NOT a 5-layer validation failure — it is a business
      // result.
    cost: >-
      The rule that a proposal below 0.40 records nothing is restated in prose. The code holds it in this file as the `below_floor` return of routeConfidence. The comment also describes what the handler does with that result, which belongs to another file and to the contract, so it can drift from both without anything noticing.
    kind: restates
    correction: >-
      Remove the comment. The fact stays in rules/knowledge-base/below-confidence-floor-records-nothing and in routeConfidence.
    node: rules/knowledge-base/below-confidence-floor-records-nothing
