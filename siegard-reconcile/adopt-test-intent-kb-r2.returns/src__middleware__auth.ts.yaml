findings:
  - file: src/middleware/auth.ts
    where: >-
      the header comment, lines 9-12 (the "Error mapping" list)
    evidence: >-
      // Error mapping (registered in docs/specs/_global/error-codes.md):
      //   - Missing/malformed `Authorization` header     -> 401 AUTH_UNAUTHORIZED
      //   - Token expired (exp <= now)                   -> 401 AUTH_TOKEN_EXPIRED
      //   - Bad signature / wrong issuer / not a JWT     -> 401 AUTH_TOKEN_INVALID
    cost: >-
      The authenticate-owner refusals are listed a second time in prose outside behavior. The list
      omits the `sub`-claim refusal and names "wrong issuer", which the code does not check, so a
      reader who trusts it learns a different set of refusals than the node holds. The code holds
      the real mapping in this file (the `AuthError` constructions in `preHandler` and
      `mapJoseError`).
    kind: restates
    correction: >-
      Remove the comment. The refusals stay in the node and in the `AuthError` constructions.
    node: contracts/knowledge-base/access
  - file: src/middleware/auth.ts
    where: >-
      the comments on the local operator bypass: lines 110-113, 132-136 and 182-186
    evidence: >-
      // DEV-ONLY local operator bypass (see config/env.ts LOCAL_OPERATOR_TOKEN).
      // Resolved once at build time: enabled only when running in development AND a
      // token is configured. In any other mode this is `null` and the bypass branch
      // below is dead — production never trusts a static bearer.
    cost: >-
      The rule that the local operator token admits the owner only in development, compared in
      constant time, is stated again in prose. The rule already sits in a node and in this file's
      code (`env.NODE_ENV === "development"` and `constantTimeEqual`). A change to the node would
      leave these comments saying the old rule.
    kind: restates
    correction: >-
      Remove the comments. The code in this file already holds the fact, and the node outside the
      pack holds it as well.
    node: constraints/local-operator-token-development-only
