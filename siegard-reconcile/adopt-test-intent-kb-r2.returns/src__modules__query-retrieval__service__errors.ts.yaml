findings:
  - file: src/modules/query-retrieval/service/errors.ts
    where: >-
      class InvalidSearchQueryError, lines 1-22 (the reason union, the code field and the message ternary)
    evidence: >-
      public readonly code = "BUSINESS_INVALID_SEARCH_QUERY" as const;
      public readonly reason: "empty_after_trim" | "empty_after_parse" | "too_long";
      ... : "query exceeds 1000 characters"
    cost: >-
      The retrieval contract gives a blank query (search-query-not-blank) and an over-length query (search-query-length)
      the answer HTTP 422 with VALIDATION_INVALID_FORMAT. It gives BUSINESS_INVALID_SEARCH_QUERY only to a query whose
      parse yields no term (search-query-must-parse). This class pairs BUSINESS_INVALID_SEARCH_QUERY with the reasons
      empty_after_trim and too_long. If any caller raises it with those reasons, a blank or over-long query is answered
      with a different error code than the contract states. A client branching on the code then follows the wrong path.
      The shape also makes this file the place where the 1000-character limit appears, in the message text. The next
      reader looks for that limit in the search-query-length rule. I did not open the callers, because they are outside
      the file set, so whether the pairing is reachable is unverified.
    kind: contradicts
    correction: >-
      The class would have to carry BUSINESS_INVALID_SEARCH_QUERY only for the empty-after-parse case. A blank or
      over-long query would be answered with VALIDATION_INVALID_FORMAT, as the contract states.
    node: contracts/knowledge-base/retrieval
