findings:
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      The file-header comment (lines 18-23, "A Zod failure ... also goes through `runIngestHandler` so the rejected `tool_call` audit row is written") and the comment block above `extractLlmRunIdFromRaw` (lines 431-441).
    evidence: >-
      "A Zod failure (missing/invalid `llm_run_id` or malformed business DTO) also goes through `runIngestHandler` so the rejected `tool_call` audit row is written (BR-23 updated). When no `llm_run_id` is parseable from the raw input, the audit-row insert cannot resolve its FK; the shell's `safeWriteAuditOnRollback` logs and swallows that" and "a `tool_call` row with `validation_outcome='rejected'` is written under the same shell"
    cost: >-
      The prose restates, as a business rule, that a refused proposal is recorded as a tool call and that a failed recording is swallowed. The rule is held by rules/knowledge-base/every-proposal-audited. A second statement of it in a header comment gives a reader two places to look for the rule. If the node moves, `--check` does not reach this file's prose. The behavior itself is carried by code: `runZodFailureAudit` calls `runIngestHandler({ deps: { pool, logger, llm_run_id: llmRunId }, tool_name: toolName, input: rawInput as never, run: async () => { throw new ValidationFailure(...) } })`. The swallow-on-failure clause sits in handler-base.js, which is outside this file set.
    kind: restates
    correction: >-
      Remove the two comment passages. The fact is already held by the node, and the code in this file and in handler-base.js already implements it. The route is the comment route followed by `/reconcile` over this file.
    node: rules/knowledge-base/every-proposal-audited
read:
  - node: contracts/knowledge-base/access
    held_at: >-
      The `health` tool registration (`mcp.registerTool("ingest", { name: "health", ... })`, lines 325-333). It serves the report as the MCP `health` tool and passes the report through. The report's fields (`service`, `database`, `checked_at`) are not declared in this file. `mapReadError` also routes `ZodError`, store-unavailable and unknown failures through the shared envelopes.
    evidence: >-
      `const report = await collectHealth(pool); return { ok: true, result: report };`, and in `mapReadError`: `message: "Request payload failed validation."`, `if (isPgUnavailable(err)) { return serviceUnavailableError().envelope; }`, `return internalError().envelope;`
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      The MCP ingestion surface is registered here. `propose_fragment`, `propose_node`, `propose_link` and `propose_attribute` carry a Zod refusal through `runZodFailureAudit` (message "MCP tool args failed Zod parse."). `ingest_document` and `ingest_directed` are registered, and `ingest_document` has an inline validation refusal. `get_ingestion_status` serves read-llm-run, and `list_recent_ingestions` is registered. `mapReadError` supplies the validation, not-found, unavailable and internal answers for the two read tools.
    evidence: >-
      `"MCP tool args failed Zod parse."` with `code: "VALIDATION_INVALID_FORMAT"` and `issues: ... path: i.path.map((seg) => String(seg)).join("."), message: i.message`; `code: "VALIDATION_INVALID_FORMAT", message: "ingest_document arguments failed validation."`; `const result = await withReadOnly(pool, (client) => getLlmRunById(client, llm_run_id));`; `listRecentIngestions(client, limit)`; `code: err.code, message: err.message, details: { entity: err.entity, id: err.entityId }` for `ResourceNotFoundError`
