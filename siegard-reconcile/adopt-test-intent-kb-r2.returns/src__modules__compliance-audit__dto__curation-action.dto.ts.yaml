looked_past: >-
  The file's own facts are held by nodes outside this pack: domain/knowledge-base/curation-action-kind, curation-target-kind, curation-action-filter, rules/knowledge-base/audit-page-defaults, page-limit-bounds, page-offset-non-negative, audit-window-ordered and curation-action-reason-length. I read them in specification/projections/full-text.md and the code agrees with them: limit 1 to 100 with default 50, offset at least 0, window start strictly before end, reason at most 1000, and the seven action kinds and five target kinds. The node itself does not name a single sentinel message string for a window failure, and I did not judge the issue message "VALIDATION_OUT_OF_RANGE".
