findings:
  - file: src/modules/compliance-audit/dto/curation-action.dto.ts
    where: >-
      the header comment, lines 1-5, and the docblock of CurationActionNameSchema, line 11
    evidence: >-
      "The `action` filter is validated at the API layer ONLY (BR-10) — the underlying DB column is plain `text` (schema line 454)." and "/** 7 curation-tool names of §14.4 (BR-10). */" above z.enum(["resolve_entity_match", "merge_nodes", "resolve_dispute", "confirm_item", "reject_item", "correct_item", "compliance_delete"])
    cost: >-
      The closed set of seven action kinds is stated in prose that cites a business rule number and a section of a retired document, while the node holds the set. The next reader may take the comment as the place the set is decided. The comment's section and BR numbers will not follow the node when it moves. The enumeration itself is declared in this file by the z.enum, so the prose is a second home for the fact.
    kind: restates
    correction: >-
      Remove the header comment and the docblock. The z.enum already holds the set, and the node it answers to is bound to this file.
    node: domain/knowledge-base/curation-action-kind
  - file: src/modules/compliance-audit/dto/curation-action.dto.ts
    where: >-
      the docblock of ListCurationActionsQuerySchema, lines 33-37
    evidence: >-
      "BR-09 semi-open time-range honored (`from` inclusive, `to` exclusive); BR-10 action enum validated here."
    cost: >-
      The half-open window rule is restated as prose pointing at a BR number. The code that enforces it is the repository's `created_at >= $n` and `created_at < $n`, not this file, so a reader of this file sees a claim with no code behind it. The comment will go stale without any tool noticing.
    kind: restates
    correction: >-
      Remove the docblock. The window's half-open behavior is held by code in src/modules/compliance-audit/repository/compliance-audit.repository.ts (`where.push(`created_at >= $${i++}`)` and `where.push(`created_at < $${i++}`)`).
    node: rules/knowledge-base/audit-listing-window-half-open
