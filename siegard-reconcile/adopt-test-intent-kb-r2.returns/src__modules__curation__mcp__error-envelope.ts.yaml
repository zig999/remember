    cost: >-
      When one curation request breaks several validation rules at once, this
      list alone decides which refusal code and message the caller receives.
      contracts/knowledge-base/curation names each refusal and its code but
      never says which one wins when more than one applies. The next reader
      will look for the order in the specification, will not find it, and will
      take this array as the business decision.
    kind: unstated
    correction: >-
      The analysis would have to decide whether the order in which
      simultaneous curation validation refusals are answered is a business
      fact. If it is, it needs a node, in contracts/knowledge-base/curation or
      a rule beside it. If it is not, it is a code choice and no node needs to
      hold it.
    node: contracts/knowledge-base/curation
