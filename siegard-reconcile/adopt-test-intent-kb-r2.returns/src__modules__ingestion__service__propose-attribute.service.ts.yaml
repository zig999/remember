findings:
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      lines 71-80, the cross-table guard after the attribute key lookup
    evidence: |-
      if (resolvedKey.node_type_id !== nodeTypeId) {
        throw new ValidationFailure(
          "VALIDATION_INVALID_FORMAT",
          "attribute_key.node_type_id does not match the node's node_type_id.",
          { node_id: args.node_id, key: args.key }
        );
      }
    cost: >-
      The guard is a second implementation of the refusal for a key that does not belong to the node's type, and it answers with a different code and message. The specification answers that case with BUSINESS_UNKNOWN_ATTRIBUTE_KEY naming the key. The comment above the guard says it is unreachable today. If the catalog cache scope is ever relaxed, as that comment contemplates, the owner would get VALIDATION_INVALID_FORMAT with a message no node states, and anyone reading the specification would not expect it.
    kind: contradicts
    correction: >-
      Remove the guard, because the lookup keyed by (node_type_id, key) already is the rule. Or make it refuse with the code the contract names for this case, BUSINESS_UNKNOWN_ATTRIBUTE_KEY naming the key.
    node: rules/knowledge-base/attribute-key-for-node-type
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      lines 85-92, the comment block above the closed-domain gate
    evidence: >-
      // key is closed and `assertValueInDomain` rejects out-of-domain literals
      // with `VALIDATION_INVALID_FORMAT` carrying `{ value, allowed_values }`.
      // Exact match (no normalisation) per spec §1 / BR-30 v1 semantics.
    cost: >-
      The prose restates the allowed-values rule (exact match, the refusal code, the details it carries), and a second copy of a rule can drift from the node. The code holds the rule: the `domainOf` branch here, and `assertValueInDomain` in src/modules/ingestion/validation/structural.ts, which sorts and returns `{ value, allowed_values }`.
    kind: restates
    correction: >-
      Remove the comment. The code in this file and in structural.ts already carries the behavior.
    node: rules/knowledge-base/attribute-value-in-allowed-values
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      lines 131-134, the comment above the source metadata query
    evidence: >-
      // is the LAST link of the date-justification chain (v7 §6.5 / §13c / A14)
      // and is consumed by `validateTemporal` as the fallback for
      // `requires_valid_from = true` rows that carry no stated/document date.
    cost: >-
      The prose restates the received-date fallback, which the required-start-fallback node holds. The code holds it in validateTemporal in src/modules/ingestion/validation/temporal.ts (`valid_from_basis: "received"`). The comment is a second home for the fact, and it would go stale unnoticed if the node moved.
    kind: restates
    correction: >-
      Remove the comment. The behavior stays in validateTemporal.
    node: rules/knowledge-base/required-start-fallback
