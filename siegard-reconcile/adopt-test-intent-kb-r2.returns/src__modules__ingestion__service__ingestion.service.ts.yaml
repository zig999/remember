    held_at: nowhere
    evidence: >-
      The file declares no chunk shape. It only forwards chunker output and reads `c.chunk_index`, `c.offset_start` and `c.offset_end` from rows typed in ../repository/ingestion.repository.js: `chunkRows.map((c) => ({ id: c.id, chunk_index: c.chunk_index, offset_start: c.offset_start, offset_end: c.offset_end }))`.
  - node: domain/knowledge-base/raw-information
    held_at: nowhere
    evidence: >-
      The file declares no raw-information shape. It forwards values to `insertRawInformation(client, { source_type: input.source_type, content: input.content, content_hash: contentHash, metadata: input.metadata, original_input: input.original_input ?? null })`. The shape is declared in the repository and DTO files.
  - node: contracts/knowledge-base/access
    held_at: nowhere
    evidence: >-
      The file holds none of the authentication, routing or health answers. The only HTTP-adjacent code is ResourceNotFoundError (`statusCode = 404`, `code = "RESOURCE_NOT_FOUND"`), which is an ingestion read answer, not an access one.
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      Partially, in ingestRawInformation (the 201 body), noopExisting (the 200 body), getRawInformationById and listChunksByRawInformationId. This covers ingest-raw-information, read-raw-information and list-raw-chunks. The file holds no other operation.
    evidence: >-
      `status: 201, body: { outcome: "created", raw_information_id, content_hash, chunk_count: chunkRows.length, chunks: [...], llm_run_id, idempotency_key }`. `status: 200, body: { outcome: "noop_existing", ..., chunks: [], llm_run_id: run.id }`. `throw new InvariantError(\`noopExisting: raw_information ${existing.id} exists ... but no llm_run row matches idempotency_key\`)` for a run not opened under the named model and prompt version. `throw new ResourceNotFoundError("raw_information", id)`. `return { total: rows.length, items: rows.map(toRawChunkResponse) }`.
