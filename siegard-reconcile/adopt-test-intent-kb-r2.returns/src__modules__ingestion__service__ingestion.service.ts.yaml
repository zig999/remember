findings:
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      line 80, step 1 of the docstring of ingestRawInformation
    evidence: >-
      * 1. Compute `content_hash = sha256(content)`.
    cost: >-
      The docstring states the content-hash definition a second time, outside behavior. The first copy is rules/knowledge-base/content-hash-is-sha256, and the code that computes it is `sha256Hex(input.content)` in ../hash.js. If the digest definition moves, this prose keeps saying the old one.
    kind: restates
    correction: >-
      Remove the docstring line. The code in ../hash.js already holds the fact, and the node already binds it.
    node: rules/knowledge-base/content-hash-is-sha256
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      line 81, step 2 of the docstring of ingestRawInformation
    evidence: >-
      * 2. Compute `idempotency_key = sha256(content_hash ∥ prompt_version ∥ model ∥ chunking_version)`.
    cost: >-
      The docstring restates the composition and order of the idempotency key. The code calls `composeIdempotencyKey({ content_hash, prompt_version, model, chunking_version })` from ../hash.js, so the code holds the fact. A reader of this prose could take it for the place the key is defined, when the node is rules/knowledge-base/idempotency-key.
    kind: restates
    correction: >-
      Remove the docstring line. ../hash.js holds the composition and the node binds it.
    node: rules/knowledge-base/idempotency-key
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      lines 87-93, the "Idempotent no-op path" paragraph of the docstring of ingestRawInformation
    evidence: >-
      * Return 200 with `outcome = "noop_existing"` and empty `chunks` array.
    cost: >-
      The prose restates the intake contract's noop_existing answer (HTTP 200, no chunks, the held run). The code in noopExisting holds it too (`status: 200`, `outcome: "noop_existing"`, `chunks: []`). When the contract moves, this prose is a second description that nothing reads.
    kind: restates
    correction: >-
      Remove the paragraph. noopExisting already carries the answer, and the node binds it.
    node: contracts/knowledge-base/ingestion
