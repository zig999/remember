findings:
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      The header comment (lines 1-25) and the docstring above RECEIVED_AT_ANCHOR_DIRECTIVE (lines 42-49).
    evidence: >-
      "v4 teaches the model to use it as the FALLBACK anchor: resolve against `document_date` when present, against `received_at` otherwise."
      and "Carries the `received_at` fallback rule: when `document_date` is absent, the relative-date anchor is `received_at`"
    cost: >-
      The v4 anchor rule is written out in prose, with a citation of "BR-26 step 5a v1.4.2". The same rule is held by the running directive in this file, so a reader has two places to look. When the node moves, the prose does not, and `--check` does not reach it.
    kind: restates
    correction: >-
      Remove the comment and the docstring prose. The code in RECEIVED_AT_ANCHOR_DIRECTIVE already holds the fact. This is the comment route, followed by /reconcile over this file. The directive's strings are emitted text and are not to be edited.
    node: rules/knowledge-base/extraction-relative-date-falls-back-to-reception
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      RECEIVED_AT_ANCHOR_DIRECTIVE, lines 60-62: the instruction on the basis to give a date resolved from `received_at`.
    evidence: >-
      "  `\"document\"`). If `document_date` is `(unknown)`, fall back to the date",
      "  portion of `received_at` (the `YYYY-MM-DD` prefix of the ISO-8601 string) —",
      "  use basis `\"received\"`.",
    cost: >-
      The prompt sent to the model tells it to state the basis `received`. The node says "A proposal MUST NOT state the basis received." A model that follows the prompt produces a proposal the rule forbids. The decision log of the anchor rule records this as an open, unsettled contradiction, so the prompt is the only place the instruction lives.
    kind: contradicts
    correction: >-
      The owner has to settle which of the two nodes gives way: the prompt stops asking for basis `received`, or the rule changes. The log of rules/knowledge-base/extraction-relative-date-falls-back-to-reception says the owner has not yet asked for this to be settled.
    node: rules/knowledge-base/caller-never-states-received
