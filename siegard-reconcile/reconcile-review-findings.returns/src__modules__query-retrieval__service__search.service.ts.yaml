read:
  - node: domain/knowledge-base/search-item
    held_at: >-
      The IntermediateItem interface (lines 57-70), which declares kind, layer, score, hop, summary, flags and provenance. toSearchItem (line 478) projects it onto the SearchItem shape that dto/response.dto.ts declares. The attribute values are assigned at the three build sites: the fragment push (lines 178-191), the node push (lines 214-226) and toExpandedLinkItem (lines 387-399).
    evidence: >-
      interface IntermediateItem { readonly key: string; readonly kind: "node" | "link" | "fragment"; readonly layer: SearchLayer; readonly id: string; score: number; readonly hop: number; ... summary: string; flags: AssertionFlag[]; provenance: SearchProvenanceEntry[]; ... }
      and, for a link reached by expansion, `kind: "link", layer: "node", ... summary: `${meta.source_canonical_name} -[${meta.link_type}]-> ${meta.target_canonical_name}``
looked_past: >-
  The chunk and fragment hits are paired only to produce dedup_collapsed_count, a log metric, and this file does not itself show a chunk match as its fragment's excerpt (rules/knowledge-base/chunk-match-cites-its-fragment), which is another file's and another judgment's to answer.
