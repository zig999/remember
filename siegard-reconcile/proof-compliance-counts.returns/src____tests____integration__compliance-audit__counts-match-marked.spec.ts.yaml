read:
  - node: rules/knowledge-base/compliance-deletion-counts-what-it-marked
    held_at: |-
      The single `it(...)` at the end of the file, together with `countMarked` and `turnedToDeleted`. The test snapshots every row's status before `complianceDelete` runs and counts the rows whose status became "deleted" afterwards. It then asserts that count equals the `affected` record the fake store captured from the `INSERT INTO compliance_deletion` call.
    evidence: |-
      expect({
            recorded: store.compliance_deletions[0]?.affected,
            marked: countMarked(before, after),
          }).toEqual({ recorded: EXPECTED_AFFECTED, marked: EXPECTED_AFFECTED });
looked_past: |-
  The fake client's eligibility logic (`isEligible`, the `superseded_at IS NULL` and `ri.id <> $1` markers it matches in the SQL, and the fixture expecting the shared attribute and the already-superseded chunk to be left out) mirrors facts that rules/knowledge-base/compliance-deletion-propagates and rules/knowledge-base/compliance-deletion-tombstones hold, so it is not unstated. Matching SQL text in a test double is a test-design matter, not a conformance one.
