findings:
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      line 57, the exported constant REDACTED_LITERAL
    evidence: |-
      export const REDACTED_LITERAL = "[REDACTED]" as const;
    cost: >-
      The rule that a compliance deletion replaces content and original input with the literal [REDACTED] is declared a second time here, in a file the node is not bound to. Nothing the service runs reads this constant. The redaction that executes is the SQL in compliance-audit.repository.ts (`SET content = '[REDACTED]'`), and the only importers of the constant are the re-export in compliance-audit/index.ts and a unit test. If the node's literal changes, the constant and its test keep passing against the old value while the repository does something else, so nobody can tell which one was decided.
    kind: contradicts
    correction: >-
      The literal should be held in one place that executes, the repository SQL the node is bound to. This second declaration, and the test that pins it, would then go.
    node: rules/knowledge-base/compliance-deletion-redacts-content
