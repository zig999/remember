    held_at: >-
      complianceDelete(), lines 152-171: the four cascade calls and the `affected` object handed to insertComplianceDeletion and insertCurationAction.
    evidence: |-
      const chunks = await tombstoneRawChunksOfRaw(client, body.raw_information_id);
      const fragments = await tombstoneCascadedFragments(client, body.raw_information_id);
      const links = await tombstoneCascadedLinks(client, body.raw_information_id);
      const attributes = await tombstoneCascadedAttributes(client, body.raw_information_id);

      const affected = { chunks, fragments, links, attributes };
      The service stores exactly the counts the four tombstone calls return, with no arithmetic or substitution. Which rows are marked, and how they are counted, is done by the repository functions. The repository is not in this file set.
