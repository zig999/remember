    held_at: |-
      the `return res.rowCount ?? 0;` of tombstoneRawChunksOfRaw, tombstoneCascadedFragments, tombstoneCascadedLinks and tombstoneCascadedAttributes (lines 102, 136, 171, 206), carried into the `affected` column by the `jsonb_build_object('chunks', $3::int, 'fragments', $4::int, 'links', $5::int, 'attributes', $6::int)` of insertComplianceDeletion (lines 235-249)
