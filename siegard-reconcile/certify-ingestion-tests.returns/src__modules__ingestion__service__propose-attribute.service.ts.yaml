findings:
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      lines 71-80, the guard after the catalog lookup that compares `resolvedKey.node_type_id` with `nodeTypeId`
    evidence: >-
      if (resolvedKey.node_type_id !== nodeTypeId) {
          throw new ValidationFailure(
            "VALIDATION_INVALID_FORMAT",
            "attribute_key.node_type_id does not match the node's node_type_id.",
    cost: >-
      The attribute-key-for-node-type rule is implemented a second time in this file. This copy refuses with
      VALIDATION_INVALID_FORMAT. The contract answers the rule with BUSINESS_UNKNOWN_ATTRIBUTE_KEY naming the key
      (contracts/knowledge-base/ingestion.md, propose-attribute). If the catalog cache scope ever changes and this
      branch becomes reachable, the same refusal would carry a code the specification does not give it. A reader
      looking for the refusal in the specification would not find this code.
    kind: contradicts
    correction: >-
      Remove the second check, or make it refuse with the code the contract gives the rule. The first lookup
      already refuses with BUSINESS_UNKNOWN_ATTRIBUTE_KEY through `assertKnownType`.
    node: rules/knowledge-base/attribute-key-for-node-type
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      lines 85-92, the comment block above `const domain = domainOf(deps.catalog, resolvedKey.id);`
    evidence: >-
      Exact match (no normalisation) per spec §1 / BR-30 v1 semantics.
    cost: >-
      The comment restates the exact-as-written rule for allowed values, which the code holds in
      `assertValueInDomain(args.value, domain)`. It is a second home outside behavior, and it cites BR-30 and "spec
      §1" instead of the node that holds the rule. When the node moves, the comment will not follow.
    kind: restates
    correction: >-
      Remove the comment. The rule is held by the branch `if (domain !== null) { assertValueInDomain(...) }` and
      the node is bound to this file.
    node: rules/knowledge-base/attribute-value-in-allowed-values
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      lines 131-134, the comment above the `sourceMetaRes` query
    evidence: >-
      `received_at`
        // is the LAST link of the date-justification chain (v7 §6.5 / §13c / A14)
        // and is consumed by `validateTemporal` as the fallback for
        // `requires_valid_from = true` rows that carry no stated/document date.
    cost: >-
      The comment restates the required-start-available rule: a start that is stated, or taken from the source's
      document date, or from its reception date. The code holds this in the query selecting `document_date` and
      `received_at` and in the `validateTemporal(...)` call. The comment names v7 sections that are not the node,
      so the next reader is pointed at the wrong place.
    kind: restates
    correction: >-
      Remove the comment. The rule is held by the node, and the code reads the two dates and forwards them to
      `validateTemporal`.
    node: rules/knowledge-base/required-start-available
