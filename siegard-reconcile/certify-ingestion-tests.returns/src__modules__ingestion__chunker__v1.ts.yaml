  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      the SPEAKER_LINE_REGEX docstring, lines 341-350
    evidence: >-
      "- `Name:` followed by white space (Name = ASCII identifier characters
           plus single embedded spaces — we keep it strict to avoid false
           positives on prose like "Importante: ...").
         - Optional bracketed timestamp prefix `[12:00]` or `(12:00)`."
    cost: >-
      The prose restates the speaker-line definition, and it describes it differently from both the node and the regex. It says "ASCII identifier characters", while the regex accepts `À-ÿ`. The code holds the definition at SPEAKER_LINE_REGEX, so the pair differs in the code, not in the comment (see the contradicts finding on the regex). The comment is a third statement of the definition.
    kind: restates
    correction: >-
      Remove the prose. SPEAKER_LINE_REGEX holds the definition.
    node: rules/knowledge-base/speaker-line
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      SPEAKER_LINE_REGEX, line 351
    evidence: >-
      const SPEAKER_LINE_REGEX = /^\s*(?:[[(]\d{1,2}:\d{2}(?::\d{2})?[\])][\s\t]+)?[A-Za-zÀ-ÿ0-9_]+(?:\s[A-Za-zÀ-ÿ0-9_]+)?:\s/;
    cost: >-
      The node names four time stamp forms: [h:mm], [hh:mm], (hh:mm) and (hh:mm:ss). The regex accepts any of `[` or `(` closed by any of `]` or `)`, with optional seconds. It therefore also treats `[12:00:30] Ana: oi` (square brackets with seconds), `(1:05) Ana: oi` (parentheses with one-digit hour) and `[12:00) Ana: oi` (mismatched brackets) as speaker lines, and each of these starts a new block in chat and transcript sources. The node says "letters", while the class `A-Za-zÀ-ÿ` accepts only ASCII and Latin-1 characters, including `×` and `÷`, and refuses letters such as `ł`. Block boundaries, and so chunk offsets, differ from what the specification decided for these lines.
    kind: contradicts
    correction: >-
      Make the pattern accept exactly the four time stamp forms the node lists and "letters" as the node means them. If the wider acceptance is intended, the node is what changes, through analysis, not the regex.
    node: rules/knowledge-base/speaker-line
