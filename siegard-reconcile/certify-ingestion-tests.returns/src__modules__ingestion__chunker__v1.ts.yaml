                          `[ \t]*[A-Za-z0-9_]+[ \t]*:[ \t]` (e.g. `João:`,
                          `[12:00] Maria:`) opens a new block. We never fuse two
                          consecutive speakers into one chunk."
    cost: >-
      The prose restates the turn-block rule. The code holds it as `for (let i = 1; i < lines.length; i++)` with `isSpeakerLine` in splitTurns. The quoted pattern is not the pattern the code runs, which is SPEAKER_LINE_REGEX at line 351. A reader who trusts the comment learns a different speaker-line definition than the one applied.
    kind: restates
    correction: >-
