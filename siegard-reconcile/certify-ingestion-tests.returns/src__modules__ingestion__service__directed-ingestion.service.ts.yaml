looked_past: >-
  The file also declares the DirectedItemStatus vocabulary in a spelling of its own (`superseded_previous`, `dependency_failed`) and carries sentinel constants DIRECTED_MODEL and DIRECTED_PROMPT_VERSION. Both belong to nodes outside this set (directed-item-status as an enumeration and directed-ingestion-run), and style questions such as the epoch placeholders in readClosedRunSafe are another judgment's.
