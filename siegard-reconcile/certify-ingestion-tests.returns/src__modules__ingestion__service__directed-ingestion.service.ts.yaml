  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      DirectedAttributeItemSchema and DirectedLinkItemSchema, lines 141-142 and 152-153 (`IsoDateSchema`, lines 99-102)
    evidence: >-
      valid_from: IsoDateSchema.optional(),
      valid_to: IsoDateSchema.optional(),
      ... z.string().regex(/^\d{4}-\d{2}-\d{2}$/, "valid_from / valid_to must be ISO YYYY-MM-DD");
    cost: >-
      The code accepts a validity start and end on a directed attribute or link, in the format YYYY-MM-DD, and forwards them to the proposal. The directed nodes hold no validity dates for a directed item. The decision log of directed-defaults even says the directed tool declares no validity end. The directed validity surface therefore lives only in this schema, and the next reader will look for it in the specification and not find it.
    kind: unstated
    correction: >-
      Analysis should decide whether a directed attribute or link carries a validity start and end, and in what format, and give that a node (directed-item or a new rule).
