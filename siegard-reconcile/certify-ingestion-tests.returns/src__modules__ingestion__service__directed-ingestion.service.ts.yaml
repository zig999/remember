  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      DirectedAttributeItemSchema and DirectedLinkItemSchema `change_hint` (lines 144 and 155), applied at lines 637 and 717
    evidence: >-
      change_hint: ChangeHintSchema.optional(),
      ...
      change_hint: item.change_hint ?? "none",
    cost: >-
      The node says a directed attribute or link is proposed with change hint none, and gives no other case. The code proposes with whatever change hint the caller states, and falls back to none only when it is omitted. A service caller can supply `succession` or `correction` and change how the proposal supersedes a current assertion. The decision log of directed-defaults says the tool never delivers a change hint, but this file does not enforce that.
    kind: contradicts
    correction: >-
      Either the code stops accepting `change_hint` on directed items and always proposes `"none"`, or the node is amended to say a caller-stated change hint is honored.
    node: rules/knowledge-base/directed-defaults
