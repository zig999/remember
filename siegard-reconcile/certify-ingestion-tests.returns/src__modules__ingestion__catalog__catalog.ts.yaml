findings:
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      The doc comment on LinkTypeRuleRow, lines 47-51. The comment on the linkTypeRules field, line 90, repeats it.
    evidence: >-
      "A vigent `link_type_rule` row. We snapshot the whole table — the temporal
      filter (`valid_to IS NULL OR valid_to > current_date`) is applied at
      lookup time so a rule that expires between reloads is honoured."
    cost: >-
      The window in which a rule is in effect is written a second time as prose. It uses
      `current_date` and omits the `valid_from` bound, while the code that applies the window
      is `isLinkRuleActive` (`today.getTime() < from.getTime()`, `today.getTime() >= to.getTime()`
      over UTC-truncated dates). A reader who trusts the comment looks for a database-date
      filter that does not exist here.
    kind: restates
    correction: >-
      Remove the prose. The fact is already held by the node and implemented by
      `isLinkRuleActive` in this file.
    node: rules/knowledge-base/link-type-rule-in-effect
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      The doc comment on isLinkRuleActive, lines 265-270.
    evidence: >-
      "Returns `true` iff at least one rule covers the triple AND its
      validity window includes today (semi-open `[valid_from, valid_to)`; nulls
      mean unbounded — §5.1)."
    cost: >-
      The in-effect window and the "nulls mean unbounded" reading are stated again in a comment
      that cites a section of the old v7 document. The running code is `isLinkRuleActive`'s
      own `from`/`to` comparisons, so the prose becomes a second home once the node moves.
    kind: restates
    correction: >-
      Remove the prose. The code at lines 289-293 holds the fact.
    node: rules/knowledge-base/link-type-rule-in-effect
