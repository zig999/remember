certified:
  - node: rules/knowledge-base/directed-dispatch-order
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/directed-ingestion.spec.ts
        name: "happy path: dispatches fragments → nodes → attributes → links in order; run closes 'completed'"
    why: >-
      The test checks the order across groups: fragments, then nodes, then attributes, then links.
      It checks this on the proposals made and on the report refs. Within a group, the given order
      is only checked for fragments and nodes. The three fragments are given in an order that is
      not alphabetical, and the two nodes are given in an order a reversal would break. The input
      has one attribute and one link. So if the orchestrator reordered attributes among themselves,
      or links among themselves, both when proposing and when reporting, this test would still
      pass. The fact's "each group in the order given" goes unexercised for attributes and links.
      The other tests in the file give at most one attribute and one link. They locate report
      entries with find() by kind or ref, so they assert no order.
    remainder: testable
    remainder_why: >-
      Give a directed ingestion two or more attributes and two or more links, each group in an
      order no sort would produce. Assert that the attribute proposals and the link proposals
      follow that given order. Assert that the report's attribute entries and link entries appear
      in that same order, after the fragments and nodes.
