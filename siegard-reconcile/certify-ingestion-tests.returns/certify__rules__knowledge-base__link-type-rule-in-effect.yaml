certified:
  - node: rules/knowledge-base/link-type-rule-in-effect
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/graph-rules.spec.ts
        name: accepts a triple authorised by an active rule
      - file: src/__tests__/unit/ingestion/graph-rules.spec.ts
        name: respects valid_to of a rule (expired = not active)
      - file: src/__tests__/unit/ingestion/graph-rules.spec.ts
        name: respects valid_from of a rule (not yet effective)
    why: >-
      The proof checks three things. A rule with no validity start and no
      validity end is in effect. A rule whose validity end falls on the day
      is not in effect, which pins the strict "day < valid_to" boundary. A
      rule whose validity start is after the day is not in effect. The
      Tier 1 tests also only use rules with neither bound, so they add
      nothing beyond the first case. Several parts of the fact are never
      exercised. No rule has a validity start on or before the day, so
      nothing checks that such a rule is in effect. The "valid_from <= day"
      boundary, where the start equals the day, is not tested. An
      implementation that treated any present validity start as "not yet in
      effect" would pass. No rule has a validity end after the day, so
      nothing checks that a rule with a future end is still in effect. An
      implementation that treated any present validity end as expired would
      pass. Nothing checks that "day" is the UTC calendar date: the day
      falls at 12:00Z and every bound at 00:00Z, so comparing raw
      timestamps instead of UTC dates gives the same results in every test.
    remainder: testable
    remainder_why: >-
      Each gap is one input against one expected result, using isLinkRuleActive
      on a snapshot with a single rule. A rule whose validity start equals
      the day should be in effect. A rule whose validity start is before the
      day should be in effect. A rule whose validity end is after the day
      should be in effect. A rule with both bounds around the day should be
      in effect. One more input catches timestamp comparison: a moment
      whose clock time is earlier than a validity start set later on the
      same UTC date should still count as in effect.
