findings:
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateLinkOnce, the `reaffirmation` constant of branch (a), lines 549-552
    evidence: |-
      const reaffirmation =
        sameTarget &&
        args.change_hint === "none" &&
        (!functional || sameValidFrom);
    cost: >-
      The node says a type that allows multiple current assertions re-affirms whenever the hint is not
      correction. The code also requires hint none for those types. A multi-valued link proposal that
      meets a current link with the same target and carries hint succession is not re-affirmed. It
      skips branch (b) and (c) (c is functional-only) and falls through to (e), a second insert against
      the current-link duplicate guard (the `knowledge_link_current_dup_guard` index). That ends in the
      retry and then SYSTEM_INTERNAL_ERROR, instead of the consolidation the node decided. The wrong
      outcome sits in code, so a reader of the specification would not expect it.
    kind: contradicts
    correction: >-
      For a type that allows multiple current assertions, the re-affirmation condition becomes
      `sameTarget && args.change_hint !== "correction"`. The hint-none and same-validity-start
      requirement applies only to functional types.
    node: rules/knowledge-base/reaffirmation-consolidates
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateAttributeOnce, branch (a) re-affirmation, lines 777-781
    evidence: |-
      if (
        sameValue &&
        sameValidFrom &&
        args.change_hint === "none"
      ) {
    cost: >-
      The node has a multi-valued attribute with the same value re-affirm whatever its validity start,
      as long as the hint is not correction. The code requires the same validity start and hint none
      for every type. A multi-valued attribute re-stated with another validity start, or with hint
      succession, is not consolidated. It falls to (e) and inserts a second row, which meets the
      current-attribute duplicate guard (`node_attribute_current_dup_guard`) and ends in
      SYSTEM_INTERNAL_ERROR. The comment at lines 852-854 ("different valid_from on a multi-valued
      attribute is coexistence") states a rule no node holds. The link branch of the same file decides
      this case differently.
    kind: contradicts
    correction: >-
      Apply the node's condition: for a type that allows multiple current assertions, re-affirm when
      the value is the same and the hint is not correction. Require the same validity start and hint
      none only for functional keys.
    node: rules/knowledge-base/reaffirmation-consolidates
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      the `change_hint` members of ConsolidateLinkArgs (line 124) and ConsolidateAttributeArgs (line 140)
    evidence: |-
      readonly change_hint: "none" | "succession" | "correction";
    cost: >-
      The change-hint vocabulary is declared a second time in a file the node is not bound to. When the
      enumeration moves, `--check` does not reach this file, and the code and the node can disagree
      with no sign of which was decided.
    kind: contradicts
    correction: >-
      Bind domain/knowledge-base/change-hint to the file that is meant to declare the vocabulary. Code
      cannot read the specification, so the bind is what keeps this declaration answerable to the node.
    node: domain/knowledge-base/change-hint
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateLink (lines 443-485) and consolidateAttribute (lines 710-745), the two-attempt loop on a
      duplicate-guard violation
    evidence: |-
      // Two attempts max (BR-27 / task contract).
      for (let attempt = 1; attempt <= 2; attempt += 1) {
      ...
      if (attempt === 2) {
        throw new ValidationFailure(
          "SYSTEM_INTERNAL_ERROR",
          "graph consolidation: dup-guard constraint hit on retry; a concurrent transaction committed a conflicting row.",
          { scope: "knowledge_link" }
        );
    cost: >-
      No node holds the rule that a duplicate-guard race is re-decided exactly once, and that a second
      race is refused as SYSTEM_INTERNAL_ERROR. The retry count and the refusal live only in this file,
      so the next reader looks for them in the specification and does not find them.
    kind: unstated
    correction: >-
      The analysis would give this concurrency behavior a node, or decide that it is not a domain fact.
