findings:
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      TRIGRAM_CANDIDATE_LIMIT (line 47) and its use in the candidate query's `LIMIT` clause (line 165). The ambiguous branch (lines 186-217) takes its entity_match_review rows from this capped set.
    evidence: >-
      const TRIGRAM_CANDIDATE_LIMIT = 10;
      ...
      ORDER BY MAX(similarity(na.alias_norm, norm($1::text))) DESC
            LIMIT ${TRIGRAM_CANDIDATE_LIMIT}
    cost: >-
      The candidate node says the new needs-review node is paired with "each such node" at 0.55 or more. The code can pair it with at most 10, so an eleventh qualifying node would be dropped without trace. The cap of 10 exists only in this file. The next reader looks for it in the specification and does not find it, and the entity-match queue silently lists fewer candidates than the rule promises.
    kind: contradicts
    correction: >-
      Either the specification states the cap on considered candidates, or the query stops limiting the set that feeds the entity match reviews. Which of the two is a decision for the specification's owner.
    node: rules/knowledge-base/ambiguous-candidates-need-review
