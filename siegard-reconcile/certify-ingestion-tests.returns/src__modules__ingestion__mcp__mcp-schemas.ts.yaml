  - node: domain/knowledge-base/ingest-tool
    held_at: >-
      `INGEST_TOOL_NAMES`, lines 63-68, an enumeration of the four proposal kinds
      in the material's spelling
    evidence: |-
      export const INGEST_TOOL_NAMES = [
        "propose_fragment",
        "propose_node",
        "propose_link",
        "propose_attribute",
      ] as const;
  - node: domain/knowledge-base/raw-information
    held_at: nowhere
    evidence: >-
      The file declares only tool input schemas that carry document fields
      (`content`, `source_type`, `metadata`), for example `IngestDocumentMcpInputSchema`
      with `metadata: z.record(z.string(), z.unknown()).optional()`. It does not
      declare the raw-information element's shape. Its attributes, such as
      `content_hash`, `status` and `storage_ref`, are absent here.
  - node: rules/knowledge-base/recent-ingestions-limit-bounds
    held_at: >-
      `ListRecentIngestionsMcpInputSchema.limit`, lines 252-260, the `.min(1)`
      and `.max(50)` bounds
    evidence: |-
      limit: z
        .number()
        .int()
        .min(1)
        .max(50)
  - node: rules/knowledge-base/recent-ingestions-limit-default
    held_at: >-
      `ListRecentIngestionsMcpInputSchema.limit`, line 258, the `.default(10)`
      call
    evidence: ".default(10)"
