findings:
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      lines 81-123, `StartAsyncIngestionMcpInputSchema` and its docstring and
      `content` description
    evidence: >-
      "`start_async_ingestion` (BR-32) — shape-identical to `ingest_document` for
      caller symmetry. The only difference is the new-run return semantics
      (immediate vs. awaited)" and, in the schema, "the server chunks it, runs
      structured extraction in the BACKGROUND, and persists the knowledge graph
      with provenance."
    cost: >-
      A tool that ingests a document and starts extraction in the background,
      returning before the extraction finishes, exists only in this file. The
      `ingest-document` operation in contracts/knowledge-base/ingestion is
      described as completing the extraction and returning its run summary, and
      the contract's description names no background or asynchronous ingestion.
      The next reader looks for this tool's existence, its immediate-return
      outcome and its refusals in the specification and finds none.
    kind: unstated
    correction: >-
      An analysis would give the asynchronous-ingestion operation, with its
      accepted outcome and refusals, a place in the ingestion contract. Until
      then this schema is the only home of the tool.
    node: contracts/knowledge-base/ingestion
