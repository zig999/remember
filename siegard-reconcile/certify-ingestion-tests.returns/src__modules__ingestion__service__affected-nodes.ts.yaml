      if (!isContributingOutcome(outcome)) return [];
    cost: >-
      The node limits link and attribute contributions to proposals that were accepted, consolidated, superseded a previous assertion or were disputed. The code applies one shared allow-list to both tools. That list also admits created_new, matched_existing and needs_review, which are node resolutions. A grep of propose*.ts under service/ finds none of the three there. So the wider rule is probably dead today. It would take effect without any change here if a link or attribute proposal ever returned one of them. The next reader would not find the rule in the specification, because the code states a wider rule than the node does.
