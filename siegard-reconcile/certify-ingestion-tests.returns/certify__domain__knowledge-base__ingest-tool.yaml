certified:
  - node: domain/knowledge-base/ingest-tool
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/mcp-json-schemas.spec.ts
        name: exports a JSON Schema for each of the four propose-* tools
    why: >-
      The test checks the full value set as it is published. It asserts that the keys of
      IngestToolInputJsonSchemas are exactly propose_attribute, propose_fragment, propose_link and
      propose_node. If one of those values is added, dropped or renamed in that export map, the
      test fails. It does not check what the node actually states, which is that these values are
      the kind of proposal a tool call records. Nothing in the offered proof makes a tool call or
      reads back a recorded tool call. A recording that stored some other kind, or a fifth kind,
      or no kind at all, would still pass. The other five tests in the file compare each tool's
      input JSON Schema to its Zod DTO and check that each schema's top-level type is object. They
      cover input shape, not this enumeration, so they bear on nothing here.
    remainder: testable
    remainder_why: >-
      Make one call to each of the four propose tools inside a run, then read back the recorded
      tool call. For each call, the recorded kind must be propose_fragment, propose_node,
      propose_link or propose_attribute, matching the tool that was invoked. A test over those
      four inputs and four expected results covers the whole enumeration.
