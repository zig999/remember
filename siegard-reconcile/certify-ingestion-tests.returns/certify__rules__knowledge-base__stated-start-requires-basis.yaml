certified:
  - node: rules/knowledge-base/stated-start-requires-basis
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/temporal.spec.ts
        name: rejects BUSINESS_DATE_UNJUSTIFIED when valid_from supplied without basis
    why: >-
      The proposal half is exercised for one configuration only. A proposal that
      states valid_from with valid_from_basis null is refused with
      BUSINESS_DATE_UNJUSTIFIED. That proposal also has requires_valid_from true.
      The fact applies to any proposal that states a validity start, and nothing in
      the set submits a stated valid_from without a basis when requires_valid_from
      is false. So whether the requirement holds apart from that flag is
      unexercised. The correction half is unexercised. Both tests that submit
      change_hint 'correction' ("requires errata signal when change_hint =
      'correction'" and "accepts change_hint='correction' when fragment text
      contains 'errata'") supply valid_from_basis 'stated', and their assertions
      concern the errata signal. Neither one submits a correction that states a
      validity start without a basis. The pack does not show whether a correction
      of corrected-values reaches validateTemporal at all, and nothing in the
      offered proof drives a correction through its own entry point.
    remainder: testable
    remainder_why: >-
      Two inputs, each against one expected result. First, a correction that states
      a validity start with no basis, refused with BUSINESS_DATE_UNJUSTIFIED and
      not applied. Second, a proposal with requires_valid_from false that states
      valid_from with valid_from_basis null, refused with the same code.
