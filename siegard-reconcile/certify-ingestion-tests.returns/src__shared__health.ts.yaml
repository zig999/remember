findings:
  - file: src/shared/health.ts
    where: >-
      the docstring of collectHealth(), lines 18-23
    evidence: >-
      Never
       * throws — a DB failure surfaces as `{ ok: false, database: "unreachable" }`
       * so callers always get a usable report
    cost: >-
      The rule that an unanswering store is reported as unreachable and never makes the probe fail is stated twice in this file: in the try/catch that holds it, and in this prose. When the node moves, the docstring keeps saying the old rule and nothing flags it, because it is not code and `--check` does not reach it.
    kind: restates
    correction: >-
      Remove the sentences that restate the rule from the docstring. The try/catch in collectHealth() already holds the fact, and `rules/knowledge-base/health-probe-never-fails` is bound to this file.
    node: rules/knowledge-base/health-probe-never-fails
