certified:
  - node: rules/knowledge-base/ingestion-records-chunks-and-run
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/service.spec.ts
        name: returns status 201 with outcome=created and a non-empty chunks array
      - file: src/__tests__/unit/ingestion/service.spec.ts
        name: persists at least one raw_chunk and one llm_run row
      - file: src/__tests__/unit/ingestion/service.spec.ts
        name: returns the row when found
      - file: src/__tests__/unit/ingestion/service.spec.ts
        name: returns chunks ordered by chunk_index ascending
    why: >-
      Several parts are exercised. Ingesting new content records a raw information
      that can be read back by its id ("returns the row when found"). It records raw
      chunks that are read back under that raw information's id ("returns chunks
      ordered by chunk_index ascending"). It opens exactly one LLM run
      (llm_runs.size is 1 in "persists at least one raw_chunk and one llm_run row").
      Two parts are not exercised. The first is that the run is opened in status
      running. No test asserts the run's status. The fake client's INSERT INTO
      llm_run branch also sets status to "running" itself and ignores whatever the
      service sends, so the run's status could change and every test would still
      pass. The second is that the run is opened over this raw information. No test
      asserts that the run's input_raw_information_id is the raw_information_id the
      ingestion returned, so a run opened over a different raw information would
      also pass.
    remainder: testable
    remainder_why: >-
      One input closes it: new content given to ingestRawInformation. The expected
      result is that the one opened LLM run has status running and an
      input_raw_information_id equal to the returned raw_information_id. Both values
      must be read from what the service writes, not made up by the fake client, so
      the fake must keep the status it receives or the test must run against a real
      database.
