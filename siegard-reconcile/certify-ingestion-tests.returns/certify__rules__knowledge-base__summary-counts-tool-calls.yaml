certified:
  - node: rules/knowledge-base/summary-counts-tool-calls
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/ingest-ops-tools.spec.ts
        name: returns the run status + summary for a known id
    why: >-
      The test hands the fake pool rows that are already grouped and counted
      (accepted "23", rejected "2") whenever the SQL contains "FROM tool_call"
      and "GROUP BY validation_outcome". It then asserts the summary
      {accepted: 23, rejected: 2, consolidated: 0}. So it does exercise two
      things: grouped rows becoming per-outcome counts, and the zero for one
      outcome no tool call has (consolidated). It does not exercise the
      counting itself, because the fake answers by substring and never looks
      at the WHERE clause or the count expression. A query that counted
      another run's tool calls, or counted rows other than this run's tool
      calls, would still get the same canned rows back, and the test would
      pass. The zero half is asserted only for consolidated. toMatchObject
      ignores any other outcome in the validation-outcome vocabulary, so the
      summary could leave those out or give them a non-zero value and the
      test would still pass. No other test in the file reads a run's summary.
    remainder: testable
    remainder_why: >-
      One input against one expected result: an LLM run whose tool calls have
      known validation outcomes, next to a second run whose tool calls must
      not be counted, read through get_ingestion_status against a real query
      path. The expected result is a summary with the exact count of the
      first run's tool calls for each outcome, and an explicit zero for every
      other outcome in the validation-outcome vocabulary.
