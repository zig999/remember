certified:
  - node: domain/knowledge-base/valid-from-basis
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/dto-valid-from-basis.spec.ts
        name: "ValidFromBasisSchema (TC-FR-002 — caller-supplied enum) > accepts 'stated'"
      - file: src/__tests__/unit/ingestion/dto-valid-from-basis.spec.ts
        name: "ValidFromBasisSchema (TC-FR-002 — caller-supplied enum) > accepts 'document'"
      - file: src/__tests__/unit/ingestion/dto-valid-from-basis.spec.ts
        name: "ValidFromBasisSchema (TC-FR-002 — caller-supplied enum) > rejects 'received' — that value is the BFF-internal fallback only"
      - file: src/__tests__/unit/ingestion/dto-valid-from-basis.spec.ts
        name: "ValidFromBasisSchema (TC-FR-002 — caller-supplied enum) > rejects arbitrary strings"
      - file: src/__tests__/unit/ingestion/dto-valid-from-basis.spec.ts
        name: "ProposeLinkInputSchema rejects valid_from_basis='received' (TC-FR-002) > rejects the payload at the Zod boundary"
      - file: src/__tests__/unit/ingestion/dto-valid-from-basis.spec.ts
        name: "ProposeLinkInputSchema rejects valid_from_basis='received' (TC-FR-002) > still accepts 'stated' and 'document' (no regression)"
      - file: src/__tests__/unit/ingestion/dto-valid-from-basis.spec.ts
        name: "ProposeAttributeInputSchema rejects valid_from_basis='received' (TC-FR-002) > rejects the payload at the Zod boundary"
      - file: src/__tests__/unit/ingestion/dto-valid-from-basis.spec.ts
        name: "ProposeAttributeInputSchema rejects valid_from_basis='received' (TC-FR-002) > still accepts 'stated' and 'document' (no regression)"
    why: >-
      The node lists three values: stated, document and received. The tests check
      only the caller-facing DTO schemas. They show that stated and document are
      accepted values of the basis, and that ValidFromBasisSchema accepts nothing
      else (the "rejects arbitrary strings" test). Nothing in the offered proof uses
      received as a value of the basis. The three "rejects 'received'" tests assert
      the opposite at the API boundary: they pass only while received is refused
      there. That is an extra fact the node does not state. Each of these tests
      would also keep passing if received were dropped from the enumeration
      everywhere. The file's comments say received is set inside the backend by the
      temporal validator (validation/temporal.ts). A comment is not evidence, and no
      test of that validator is in the offered proof. So the third value is
      unproven by the named tests. The tests also check value labels only. Nothing
      checks that a stated basis matches a date the source states, a document basis
      the document's own date, or a received basis the date the source was received.
    remainder: testable
    remainder_why: >-
      Take an assertion whose source states no date and whose document carries no
      date of its own. Run it through the path that records the basis. The expected
      result is a basis of received, with valid_from equal to the source's received
      date. Matching assertions, one with a date the source states and one with only
      the document's own date, would close stated and document the same way: each
      should record that basis and that date.
