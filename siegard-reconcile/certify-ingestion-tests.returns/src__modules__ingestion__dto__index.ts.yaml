findings:
  - file: src/modules/ingestion/dto/index.ts
    where: >-
      IngestToolDescriptions.propose_link and IngestToolDescriptions.propose_attribute, lines 129-140
    evidence: >-
      "Both nodes must exist first, and you must cite at least one fragment_id as evidence."
      and "The node must exist; cite at least one fragment_id."
    cost: >-
      The tool descriptions tell the model that a link or attribute proposal which cites no fragment
      is not acceptable. No node holds a minimum of one cited fragment for a link or attribute
      proposal. The nodes I found cover only the citation checks (the cited fragments must exist,
      belong to the run and be anchored) and the at-least-one rule for correction evidence. A reader
      looking in the specification for this refusal will not find it, and the model is being taught
      a rule that only the code and this text hold.
    kind: unstated
    correction: >-
      Analysis should give the minimum-citation rule for link and attribute proposals a node, most
      likely a rule constraining the proposal. The description can then keep stating it as
      behavior that agrees with that node.
