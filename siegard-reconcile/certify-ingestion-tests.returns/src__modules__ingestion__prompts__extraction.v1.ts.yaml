    held_at: >-
      system(), opening lines 126-130, in the prompt text it emits to the model
    evidence: >-
      "traceable knowledge by calling the four tools `propose_fragment`,",
      "`propose_node`, `propose_link`, `propose_attribute`.",
  - node: domain/knowledge-base/prompt-version
    held_at: >-
      PROMPT_VERSION constant, line 45
    evidence: >-
      export const PROMPT_VERSION = "v1" as const;
  - node: domain/knowledge-base/raw-information
    held_at: >-
      DocumentMetadata interface, lines 52-61. It names four of the node's attributes, in part: source_type, received_at, document_date and title.
    evidence: >-
      export interface DocumentMetadata {
        readonly source_type: string;
        readonly received_at: string;
        readonly document_date: string | null;
        readonly title: string | null;
      }
  - node: domain/knowledge-base/valid-from-basis
    held_at: >-
      system(), "Dates" section lines 164-167, and the worked example's `valid_from_basis:"document"`. It is emitted text and states the three values consistently with the node.
    evidence: >-
      "- Justify it with `valid_from_basis`: `stated` only when the start date is",
      "  written in the chunk (and supported by a cited fragment); `document` uses",
      "  the document date; otherwise omit `valid_from`/basis and the backend",
      "  records `received`. NEVER invent a date. Dates are ISO `YYYY-MM-DD`.",
  - node: rules/knowledge-base/attribute-value-in-allowed-values
    held_at: >-
      the valuesSuffix construction in system(), lines 106-112. It prints each closed-domain key's allowed values in the catalog section, verbatim and JSON-quoted. Enforcement is held in other files.
    evidence: >-
      const valuesSuffix =
        domain !== null
          ? `, values: [${[...domain]
              .sort()
              .map((v) => JSON.stringify(v))
              .join(",")}]`
          : "";
  - node: rules/knowledge-base/below-confidence-floor-records-nothing
    held_at: >-
      system(), rule 7, line 153. The prompt tells the model the floor truthfully. The code that records nothing below 0.40 is not in this file.
    evidence: >-
      "7. CONFIDENCE ∈ [0,1], be honest: ≥ 0.75 → stored active; 0.40–0.74 →",
      "   `uncertain` (kept, flagged); < 0.40 → dropped. Lower it for hedged",
  - node: rules/knowledge-base/extraction-reads-chunks-in-order
    held_at: >-
      user(), lines 240-273. It builds the metadata block (source type, document date, title, reception time) and the previous-chunk-tail block for one chunk. The chunk loop, the index order and the 200-character slice are in src/modules/ingestion/service/extraction.service.ts, not here.
    evidence: >-
      `- source_type: ${meta.source_type}`,
      `- received_at: ${meta.received_at}`,
      meta.document_date !== null
        ? `- document_date: ${meta.document_date}`
        : "- document_date: (unknown)",
      meta.title !== null ? `- title: ${meta.title}` : "- title: (unknown)",
      ...
      "## Previous-chunk tail (context, do not re-extract)",
      args.prevTail,
  - node: rules/knowledge-base/new-assertion-status-from-confidence
    held_at: >-
      system(), rule 7, line 153. The prompt tells the model the two bands truthfully. The code that assigns the status is not in this file.
    evidence: >-
      "7. CONFIDENCE ∈ [0,1], be honest: ≥ 0.75 → stored active; 0.40–0.74 →",
      "   `uncertain` (kept, flagged); < 0.40 → dropped. Lower it for hedged",
  - node: rules/knowledge-base/stated-start-requires-basis
    held_at: >-
      system(), "Dates" section lines 164-167, and the worked example's proposals, which pair `valid_from` with `valid_from_basis`. The enforcing check is in other files.
    evidence: >-
      "- Justify it with `valid_from_basis`: `stated` only when the start date is",
      "  written in the chunk (and supported by a cited fragment); `document` uses",
      "  the document date; otherwise omit `valid_from`/basis and the backend",
      ...
      "    confidence:0.9, fragment_ids:[F1], valid_from:\"2026-06-11\", valid_from_basis:\"document\"}",
looked_past: >-
  Comments that assert facts neither code nor emitted text in this file carries (the claim at line 59 that the title comes from `raw_information.metadata.title`, and the comment listing source_type values) are prose and are not reported here. The prompt's extraction guidance (atomicity, node-versus-attribute classification, order of calls) was not judged against any node, because no node governs prompt wording.
