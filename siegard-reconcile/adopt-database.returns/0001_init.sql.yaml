findings:
  - file: 0001_init.sql
    where: >-
      the header comment lines 58-60 and the comment on raw_information lines 226-228
    evidence: >-
      "reject_item / compliance_delete devem gravar superseded_at = now() ao marcar status = 'deleted'"
      and "compliance_delete (§11), que redige `content` preservando `content_hash` e grava status = 'deleted' + superseded_at = now()".
      Code holds the same fact outside this file, in backend/src/modules/compliance-audit/repository/compliance-audit.repository.ts:
      "SET status        = 'deleted'," followed by "superseded_at = now()".
    cost: >-
      The tombstone rule is written in prose in the DDL header. Someone changing the node would not find this copy,
      and the prose would keep saying the old rule.
    kind: restates
    correction: >-
      Remove the prose. The repository code already marks rows deleted and stamps the supersession time.
    node: rules/knowledge-base/compliance-deletion-tombstones
  - file: 0001_init.sql
    where: >-
      function norm(), line 97, feeding node_alias.alias_norm (line 356) and UNIQUE (node_id, alias_norm) (line 360)
    evidence: >-
      RETURN lower(immutable_unaccent(regexp_replace(btrim(t), '\s+', ' ', 'g')));
      alias_norm        text NOT NULL GENERATED ALWAYS AS (norm(alias)) STORED,
      UNIQUE (node_id, alias_norm)
      Decision log, located at rules/knowledge-base/alias-unique-per-node.md: "The normalized form is the one name-normalization states, with every surrounding whitespace trimmed."
    cost: >-
      btrim(t) trims only spaces. A name with a leading or trailing tab or line break keeps a surrounding space after
      the collapse. "\tSilva" therefore normalizes to " silva", not "silva". Two aliases that differ only by
      surrounding whitespace get different normal forms, so the uniqueness guard does not stop the second one.
      Exact-match resolution also misses the name.
    kind: contradicts
    correction: >-
      Trim every surrounding whitespace in norm(), for example by collapsing first and then trimming, or by stripping
      '^\s+|\s+$'. This is the normal form rules/knowledge-base/name-normalization states.
    node: rules/knowledge-base/alias-unique-per-node
  - file: 0001_init.sql
    where: >-
      node_status enum (lines 126-130) used by raw_information.status (line 238) and raw_chunk.status (line 252), with the comment on lines 49-51
    evidence: >-
      CREATE TYPE node_status AS ENUM ('active', 'needs_review', 'merged', 'deleted');
      status        node_status NOT NULL DEFAULT 'active', -- tombstone (decisão 8)
      "Sem CHECK adicional: a aplicação é o gatekeeper (BR-12)."
    cost: >-
      The source status being only active or deleted appears in this file only as a comment. The column admits
      needs_review and merged, which the node denies. I found no code that restricts it, so the restriction
      exists only in prose.
    kind: contradicts
    correction: >-
      Hold the restriction in code, for example a CHECK (status IN ('active','deleted')) on both tables. Otherwise
      the backend must hold it and be bound to the node.
    node: rules/knowledge-base/source-status-active-or-deleted
  - file: 0001_init.sql
    where: >-
      the comment on assertion_status (lines 132-133) and the views banner (lines 529-530)
    evidence: >-
      "'inactive' NUNCA é gravado — é derivado em leitura (effective_status, §5.4 / A9)." and
      "is_current / is_in_effect / effective_status DERIVADOS, nunca armazenados."
      The views hold it in code: WHEN kl.status = 'active' AND kl.valid_to IS NOT NULL AND kl.valid_to <= current_date THEN 'inactive'
    cost: >-
      The derivation rule is narrated in comments beside the views that implement it. A change to the rule has a
      second copy in prose to keep in step.
    kind: restates
    correction: >-
      Remove the comments. The CASE in knowledge_link_resolved and node_attribute_resolved holds the rule.
    node: rules/knowledge-base/effective-status
  - file: 0001_init.sql
    where: >-
      CREATE TABLE node_type, column version (line 156)
    evidence: >-
      version     int  NOT NULL DEFAULT 1
    cost: >-
      A per-row version number on catalog rows is a domain fact in the schema alone. The node-type node lists only
      name and description. The next reader looks in the specification for what the number means and does not find it.
    kind: unstated
    correction: >-
      Analysis should give the catalog version a node, or the column should go.
    node: domain/knowledge-base/node-type
  - file: 0001_init.sql
    where: >-
      CREATE TABLE link_type, column version (line 169)
    evidence: >-
      version                     int NOT NULL DEFAULT 1
    cost: >-
      Same as node_type. The link-type node lists no version, so the catalog versioning lives only in the DDL.
    kind: unstated
    correction: >-
      Give the catalog row version a node, or remove the column.
    node: domain/knowledge-base/link-type
  - file: 0001_init.sql
    where: >-
      CREATE TABLE attribute_key, column version (line 198)
    evidence: >-
      version                 int NOT NULL DEFAULT 1,
    cost: >-
      The attribute-key node lists no version, so the catalog versioning lives only in the DDL.
    kind: unstated
    correction: >-
      Give the catalog row version a node, or remove the column.
    node: domain/knowledge-base/attribute-key
  - file: 0001_init.sql
    where: >-
      CREATE TABLE attribute_valid_value, column version (line 217)
    evidence: >-
      version          int  NOT NULL DEFAULT 1,
    cost: >-
      The allowed-value node lists value, label, sort_order and description, and no version. The catalog versioning
      lives only in the DDL.
    kind: unstated
    correction: >-
      Give the catalog row version a node, or remove the column.
    node: domain/knowledge-base/allowed-value
  - file: 0001_init.sql
    where: >-
      the comment on knowledge_node lines 336-337, and the header line 57
    evidence: >-
      "preenchido SSE status = 'merged' (§3.3); apontar para nó ATIVO é invariante de aplicação (compressão de caminho, §4.4)"
      The CHECK that holds the first half: CONSTRAINT knowledge_node_merged_ck CHECK ((status = 'merged') = (merged_into_node_id IS NOT NULL))
    cost: >-
      The "exactly when merged" half is prose beside a CHECK that already holds it. The prose is a second home for
      the rule.
    kind: restates
    correction: >-
      Remove the comment. knowledge_node_merged_ck holds the fact.
    node: rules/knowledge-base/merged-node-names-survivor
  - file: 0001_init.sql
    where: >-
      the comment on knowledge_node lines 336-337 and the header line 57
    evidence: >-
      "apontar para nó ATIVO é invariante de aplicação (compressão de caminho, §4.4)" and
      "merged_into_node_id sempre aponta para nó ATIVO (compressão de caminho na escrita, §4.4)"
    cost: >-
      That a merged node must point at an active survivor, with path compression on write, is a domain rule the
      source states. No node in the specification holds it. The specification has only "names the survivor exactly
      when merged" and "never merged into itself". The rule lives where a reader of the specification will not look.
    kind: unstated
    correction: >-
      Analysis should give the rule a node, on knowledge-node or a rule constraining it.
    node: domain/knowledge-base/knowledge-node
  - file: 0001_init.sql
    where: >-
      node_alias.alias column CHECK, line 355
    evidence: >-
      alias             text NOT NULL CHECK (btrim(alias) <> ''),
    cost: >-
      btrim() without a character set trims only spaces. An alias made of a tab or a line break passes the CHECK,
      although the node forbids an alias that is empty once surrounding whitespace is trimmed. A blank alias is
      stored, and its normal form is a lone space.
    kind: contradicts
    correction: >-
      Test the alias with all surrounding whitespace removed, for example CHECK (alias !~ '^\s*$') or
      btrim(alias, E' \t\r\n') <> ''.
    node: rules/knowledge-base/alias-not-blank
  - file: 0001_init.sql
    where: >-
      the comment before node_alias_one_canonical_uq, line 371
    evidence: >-
      "-- guarda de sanidade: um único alias canônico por nó (espelho de canonical_name)"
      The index that holds it: CREATE UNIQUE INDEX node_alias_one_canonical_uq ON node_alias (node_id) WHERE kind = 'canonical';
    cost: >-
      The one-canonical-alias rule is restated in prose next to the index that enforces it.
    kind: restates
    correction: >-
      Remove the comment. The partial unique index holds the fact.
    node: rules/knowledge-base/one-canonical-alias
  - file: 0001_init.sql
    where: >-
      the comment on node_attribute_interval_ck, line 399
    evidence: >-
      "-- intervalo semiaberto [from, to) ⇒ estritamente crescente (§5.2/§13.3)"
      Held by: CHECK (valid_from IS NULL OR valid_to IS NULL OR valid_from < valid_to)
    cost: >-
      The ordering rule is restated in prose beside the CHECK that holds it.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/attribute-validity-ordered
  - file: 0001_init.sql
    where: >-
      the comment on node_attribute_basis_ck, line 402
    evidence: >-
      "-- data sem justificativa não existe (A14)"
      Held by: CHECK (valid_from IS NULL OR valid_from_source IS NOT NULL)
    cost: >-
      The basis rule is restated in prose beside the CHECK that holds it.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/attribute-start-has-basis
  - file: 0001_init.sql
    where: >-
      the comment before provenance_attr_fragment_uq, line 481
    evidence: >-
      "-- guarda de sanidade: o mesmo fragmento não justifica o mesmo item duas vezes"
      Held by: CREATE UNIQUE INDEX provenance_attr_fragment_uq ON provenance (attribute_id, fragment_id) WHERE attribute_id IS NOT NULL;
    cost: >-
      The once-per-fragment rule for attributes is restated in prose beside the unique index that holds it.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/attribute-provenance-once-per-fragment
  - file: 0001_init.sql
    where: >-
      the comment before provenance_attr_fragment_uq, line 481, read for links
    evidence: >-
      "-- guarda de sanidade: o mesmo fragmento não justifica o mesmo item duas vezes"
      Held by: CREATE UNIQUE INDEX provenance_link_fragment_uq ON provenance (link_id, fragment_id) WHERE link_id IS NOT NULL;
    cost: >-
      The once-per-fragment rule for links is restated in the same prose. The comment is a second home for two nodes.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/link-provenance-once-per-fragment
  - file: 0001_init.sql
    where: >-
      curation_action.reason comment, line 511
    evidence: >-
      reason      text,                 -- obrigatório em ações destrutivas (validação do backend)
    cost: >-
      The rule that a reason is required on destructive curation actions is stated only here. The curation-action
      node declares reason as optional and no rule requires it. The DDL comment is the only place a reader finds it.
    kind: unstated
    correction: >-
      Analysis should give the rule a node on curation-action, or drop the claim.
    node: domain/knowledge-base/curation-action
