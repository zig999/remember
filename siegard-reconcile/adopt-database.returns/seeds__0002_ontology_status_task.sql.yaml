findings:
  - file: seeds/0002_ontology_status_task.sql
    where: >-
      header comment, line 23-24 (the "Totais após aplicar" line), the NodeType count
    evidence: >-
      -- Totais após aplicar: 9->10 NodeTypes, 28->30 LinkTypeRules,
    cost: >-
      The node-type total is stated a second time in a comment. The running rows are in this file and in
      seeds/0001_seed.sql. If the catalog gains or loses a node type, this number goes stale and nothing
      flags it, because it is not bound to the node.
    kind: restates
    correction: >-
      Remove the totals line. The catalog-node-types node holds the ten node types, and the INSERT at
      C.1 holds the Task row.
    node: rules/knowledge-base/catalog-node-types
  - file: seeds/0002_ontology_status_task.sql
    where: >-
      header comment, line 23-24 (the "Totais após aplicar" line), the AttributeKey count
    evidence: >-
      --   16->19 AttributeKeys, 9->28 valid_values.
    cost: >-
      The attribute-key total of nineteen is stated again in prose. The rows are in this file and in
      seeds/0001_seed.sql. If the catalog changes, the comment disagrees with the node and no bind reaches it.
    kind: restates
    correction: >-
      Remove the totals line. The catalog-attribute-keys node holds the nineteen keys, and the INSERT at
      C.3 holds the three Task keys.
    node: rules/knowledge-base/catalog-attribute-keys
  - file: seeds/0002_ontology_status_task.sql
    where: >-
      comment above C.3 AttributeKeys, lines 58-60
    evidence: >-
      --   status / priority: text, temporal, funcional, exige valid_from -> FECHADOS
      --   due_date: date, temporal, funcional -> ABERTO (espelha Project.deadline)
    cost: >-
      The temporal classification of the Task keys is written a second time as prose. The VALUES rows
      (is_temporal true, requires_valid_from true) hold it in this file. A reader may take the comment as
      the decision and edit it instead of the node.
    kind: restates
    correction: >-
      Remove the comment. The temporal-attribute-keys node holds the temporal keys, and the C.3 rows
      hold the flags.
    node: rules/knowledge-base/temporal-attribute-keys
  - file: seeds/0002_ontology_status_task.sql
    where: >-
      C.3 AttributeKeys VALUES, the description column of the three Task rows, lines 68-73
    evidence: >-
      'Situação corrente da tarefa (funcional) — domínio fechado em valid_values'
      'Prioridade corrente da tarefa (funcional) — domínio fechado em valid_values'
      'Prazo/entrega vigente da tarefa (funcional)'
    cost: >-
      These are catalog values written into attribute_key.description, which the catalog may show or
      send to the extraction model. The node holds each key and its value type but no description for any
      attribute key, so this wording lives only in the seed. The next reader looks for it in the
      specification and does not find it.
    kind: unstated
    correction: >-
      Analysis should give the attribute key descriptions a node, or state that they are not normative.
      Until then, no node answers for this text.
    node: rules/knowledge-base/catalog-attribute-keys
