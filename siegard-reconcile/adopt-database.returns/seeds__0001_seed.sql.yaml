looked_past: >-
  The file is a strict prefix of the catalog the nodes describe (Task, the Task link pairs, the five further event types and the project and task value sets belong to other seed files outside this set), and the comment «chave com >= 1 linha aqui => domínio FECHADO (backend rejeita fora do conjunto)» states a closed-domain mechanism in prose, both left for the caller to bind and route.
