findings:
  - file: seeds/0001_seed.sql
    where: >-
      section 2, the description column of the 13 link_type rows (lines 43-81)
    evidence: >-
      'Pessoa participa de projeto ou evento' / 'Subordinação direta entre pessoas (funcional: 1 chefe vigente)' / 'Composição: org⊂org, projeto⊂projeto, evento⊂projeto (funcional)' / 'Documento ou evento trata de / tem como assunto (aboutness estável)'
    cost: >-
      Each link type's required description is catalog text that only this seed holds. The catalog node states label and inverse and stops there, so a reader who looks in the specification finds no description. Some of it restates permitted pairs in prose that has already drifted from the rule node. The part_of description names org, projeto and evento as sources, but the rule node also permits Task to Project. The node moving would never reach this text.
    kind: unstated
    correction: >-
      Analysis would have to decide whether link type descriptions are catalog facts. If they are, catalog-link-types states each one, or the descriptions move out of the seed.
    node: rules/knowledge-base/catalog-link-types
  - file: seeds/0001_seed.sql
    where: >-
      section 4, the description column of the 16 attribute_key rows (lines 139-170)
    evidence: >-
      'Data-limite/go-live vigente do projeto (funcional)' / 'Situação textual corrente do projeto (funcional)' / 'Tipo do evento (reunião/workshop/go-live)' / 'CNPJ (estável; typo corrige-se via 6.5-B, sem fingir mudança no mundo)' / 'Tipo do documento (proposta/ata/contrato…) — domínio fechado em valid_values'
    cost: >-
      Attribute key descriptions, including remarks on stability and on how corrections are made, live only in this seed. No node holds them. The event_type description lists three values while the allowed-values node lists nine, so the seed text and the specification already disagree in words nobody governs.
    kind: unstated
    correction: >-
      Analysis would have to decide whether attribute key descriptions are catalog facts and give them a node, most naturally catalog-attribute-keys. Otherwise they are not catalog content.
    node: rules/knowledge-base/catalog-attribute-keys
