findings:
  - file: 0004_chat_persistence.sql
    where: >-
      header comment on chat_conversation.title, lines 40-41
    evidence: >-
      `title`            NULL until set by the Owner OR by the title-distillation
      job (BR-34); length 1..200 enforced at the BFF (Zod ChatTurnRequest mirror).
    cost: >-
      A conversation title limited to 1..200 characters is a domain rule. It appears only in this comment, which points to an enforcement in the BFF. No node holds it (domain/chat/conversation types title as a bare string), and no constraint in this file holds it. The next reader looks for the title's limits in the specification, finds none, and cannot tell whether the BFF or the specification is the authority.
    kind: unstated
    correction: >-
      The analysis gives the title's length limit a node, on domain/chat/conversation or a rule constraining it.
    node: domain/chat/conversation
  - file: 0004_chat_persistence.sql
    where: >-
      column summary_rolling of CREATE TABLE chat_conversation, line 52
    evidence: >-
      summary_rolling text        NULL,
    cost: >-
      The node names this attribute `rolling_summary`; the table spells it `summary_rolling`. The two names for one fact now live apart, so a reader who searches the code for the node's attribute finds nothing, and a change to the node's name never reaches this column.
    kind: contradicts
    correction: >-
      Either the column is named as the node names the attribute, or the node's attribute name is amended by analysis to the name the business uses.
    node: domain/chat/conversation
  - file: 0004_chat_persistence.sql
    where: >-
      comment on chat_message.stop_reason, lines 100-102
    evidence: >-
      -- One of: end_turn|max_tokens|stop_sequence
      -- |max_iterations|turn_timeout|cancelled
      -- |provider_error|internal_error  (assistant rows only)
    cost: >-
      The closed vocabulary of reasons a turn stopped, and the rule that only assistant rows carry one, is stated only in a comment. The column is plain text with no check, and domain/chat/message types stop_reason as a bare string. The vocabulary is a business fact that nobody can find in the specification.
    kind: unstated
    correction: >-
      The analysis gives the stop-reason values, and their restriction to assistant messages, a node.
    node: domain/chat/message
  - file: 0004_chat_persistence.sql
    where: >-
      comment on chat_message.idempotency_key, line 103 (and lines 86-89)
    evidence: >-
      idempotency_key uuid               NULL,  -- BR-26: non-null on user rows; null on assistant rows.
    cost: >-
      The rule that a user message always carries an idempotency key and an assistant message never does is stated only in a comment; the column allows NULL for every row. The node rules/chat/message-idempotency-key-unique says only that a conversation holds at most one message per key. The rule about which role carries a key has no home in the specification.
    kind: unstated
    correction: >-
      The analysis gives "a user message holds an idempotency key, an assistant message holds none" a node, on domain/chat/message or as a rule.
    node: domain/chat/message
  - file: 0004_chat_persistence.sql
    where: >-
      column created_at of CREATE TABLE chat_message, line 108
    evidence: >-
      created_at      timestamptz        NOT NULL DEFAULT now()
    cost: >-
      A message's creation time is declared and required here, and the chronological index depends on it (idx_chat_message_conversation_created_at). domain/chat/message lists no such attribute. The attribute that orders a conversation's turns is held only in SQL.
    kind: unstated
    correction: >-
      The analysis adds the message's creation time to domain/chat/message.
    node: domain/chat/message
  - file: 0004_chat_persistence.sql
    where: >-
      comment on chat_tool_call.tool_name, line 138
    evidence: >-
      --   - `tool_name`   one of the 13 names of the `query` toolset (BR-05).
    cost: >-
      The restriction of a chat tool call's tool name to the thirteen query tools is stated only in a comment. The column is unconstrained text, and domain/chat/tool-call types tool_name as a bare string. A reader cannot learn from the specification which tools a chat turn may call.
    kind: unstated
    correction: >-
      The analysis gives the set of tool names a chat tool call may name a node.
    node: domain/chat/tool-call
  - file: 0004_chat_persistence.sql
    where: >-
      column created_at of CREATE TABLE chat_tool_call, line 156
    evidence: >-
      created_at      timestamptz NOT NULL DEFAULT now()
    cost: >-
      A chat tool call's creation time is declared and required here. domain/chat/tool-call lists no such attribute, so the time a tool call was recorded exists only in the table.
    kind: unstated
    correction: >-
      The analysis adds the creation time to domain/chat/tool-call, or states that the tool call has none.
    node: domain/chat/tool-call
