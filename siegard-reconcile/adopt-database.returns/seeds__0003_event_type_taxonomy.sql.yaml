findings:
  - file: seeds/0003_event_type_taxonomy.sql
    where: >-
      header comment, lines 6-10 and 26-30 (the "+5 valid_values" list, the original four values, the sort_order note and the totals)
    evidence: >-
      "--   +5 valid_values em Event.event_type (mantém o domínio FECHADO):
      --     cobrança, decisão, escalonamento, bloqueio, marco" and "-- NOTA (sort_order): os novos valores entram em 5..9; o `outro` original
      --    permanece em 4."
    cost: >-
      The event_type value list, its closed domain and its ordering are stated a second time in prose beside the VALUES rows that hold them. If the node moves, the comment keeps saying the old list and nothing flags it, because the comment is not bound to the node. The rows in this file and the original four rows in seeds/0001_seed.sql are what run.
    kind: restates
    correction: >-
      Remove the comment text that restates the value list, the closed domain and the sort order. The rows in the VALUES list hold them, and the node rules/knowledge-base/allowed-event-types holds the governing statement.
    node: rules/knowledge-base/allowed-event-types
