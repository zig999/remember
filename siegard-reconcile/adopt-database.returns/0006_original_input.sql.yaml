findings:
  - file: 0006_original_input.sql
    where: >-
      Line 17-18, the COMMENT ON COLUMN raw_information.original_input statement (text stored in the database catalog).
    evidence: >-
      COMMENT ON COLUMN raw_information.original_input IS 'Verbatim do turno de usuario que disparou uma ingestao dirigida (chat). Null fora do chat. Coberto por compliance_delete.';
    cost: >-
      The statement says the column is null outside chat. The specification does not say that. The raw-information node only lists original_input as an optional string. The candidate rule directed-turn-is-original-input only says a directed ingestion made from a chat turn records the turn's excerpt there. Nothing says original_input stays empty for other sources. A reader of the catalog takes this for a decided rule, and the next reader looks for it in the specification and does not find it.
    kind: unstated
    correction: >-
      Analysis would have to decide whether original_input is present only for chat-directed ingestion, and give that a node, or the statement should stop asserting it.
    node: domain/knowledge-base/raw-information
