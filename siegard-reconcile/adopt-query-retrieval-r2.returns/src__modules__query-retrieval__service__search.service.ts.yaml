looked_past: >-
  The file carries many comments citing BR numbers and restating rules, which belong to the comment route rather than this judgment. It also runs a chunk-to-fragment dedup query (findChunkFragmentLinks) whose result feeds only a log metric. And the response echoes query, limit and offset, which the retrieval contract's search answer does not list.