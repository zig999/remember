findings:
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      line 56, the constant PER_LAYER_FETCH_LIMIT, passed to searchFragmentLayer, searchNodeAliasLayer and searchChunkLayer at lines 129-147
    evidence: >-
      const PER_LAYER_FETCH_LIMIT = 200;
      and the comment "We pull a generous slice from each layer so the global ranking has enough candidates"
    cost: >-
      The number 200 is a cap on what a search can ever rank, and no node states it. Matches beyond the 200th on a layer are dropped before ranking. The reported `total` is `filtered.length` (line 391), so it counts only what survived the cap. A reader who trusts search-total-before-pagination ("counts every search item before the page is cut") would not look here for the reason a total stops at some number.
    kind: unstated
    correction: >-
      Either a node states the per-layer candidate ceiling and how it bounds the total, or the code stops truncating the layers. The analysis decides which.
    node: rules/knowledge-base/search-total-before-pagination
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      lines 296-298 and 318-322, the scoring of an expanded link
    evidence: >-
      for (const it of items) { if (it.kind === "node") nodeScoreById.set(it.id, it.score); }
      ...
      const sourceScore = nodeScoreById.get(link.source_node_id) ?? nodeScoreById.get(link.target_node_id) ?? 0;
      const score = Math.pow(TRAVERSAL_DECAY, hop) * sourceScore;
    cost: >-
      The node scores a link at hop h as 0.5^h times the score of the matched node it was reached from. The map holds only matched nodes, and the code looks up the link's own two endpoints. A link at hop 2 or 3 whose endpoints are both unmatched gets `?? 0`, so its score is 0 and it ranks last, where the node gives it a decayed score. The comment on lines 316-317 says "fall back to the highest source score", but the code falls back to 0. The 0 is a value no node holds, and depth above 1 is where it shows.
    kind: contradicts
    correction: >-
      Score each link from the matched node it was reached from, as the node states. If the specification means a different fallback for a link with no matched endpoint, a node has to state it.
    node: rules/knowledge-base/expansion-decay
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      line 357, the `layer` of a link search item
    evidence: >-
      items.push({ key: `link:${link.id}`, kind: "link", layer: "node", id: link.id,
    cost: >-
      The search-item node types `layer` as a search-layer (fragment, node, chunk) and no node says which layer a link item reports. The code decides it is "node". A consumer filtering or grouping by layer inherits that decision, and the next reader will look for it in the specification and find nothing.
    kind: unstated
    correction: >-
      search-item, or a rule constraining it, should state the layer a link item carries, or state that it carries none.
    node: domain/knowledge-base/search-item
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      line 499, computeFlags
    evidence: >-
      flags.push("low_confidence");
    cost: >-
      The assertion-flag node declares the value `low-confidence`. The code emits `low_confidence`, and the assertion-flag node records no other spelling. The source-type node does record the material's own words for its values, so here the wire spelling exists only in code.
    kind: contradicts
    correction: >-
      Either the node records `low_confidence` as the spelling in use, as source-type does for its values, or the emitted value is brought to the node's spelling. The AssertionFlag type is declared in dto/response.dto.ts, outside this file set.
    node: domain/knowledge-base/assertion-flag
