findings:
  - file: src/modules/query-retrieval/index.ts
    where: lines 7-9, the comment above the `query-toolset.js` re-export
    evidence: |-
      // MCP toolset registration — registers the four query-retrieval read tools
      // onto the shared `query` MCP server instance owned by `knowledge-graph`
      // (BR-23 of `query-retrieval.back.md`).
    cost: >-
      The size of the language model's query tool surface (four tools, which leaves out the accepted-fragment
      listing) appears in this file only as a count in prose, and it cites a back-spec rule as the authority.
      No code in this file states which tools exist or that the listing is absent. A reader of this file would
      take the comment as where the surface is decided. The constraint node decides it.
    kind: contradicts
    correction: >-
      The comment carries no fact of its own. It goes under the comment rule, and `/reconcile` follows over
      this file. The tool set is held by the code in `mcp/query-toolset.ts`, which this file only re-exports,
      so that file needs its own reading against the constraint.
    node: constraints/llm-toolset-omits-fragment-listing
