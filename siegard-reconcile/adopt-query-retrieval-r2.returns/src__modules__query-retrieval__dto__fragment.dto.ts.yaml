looked_past: >-
  The file's header and doc comments are prose in source, which the comment route answers. They also assert that every validation failure surfaces as VALIDATION_INVALID_FORMAT, while the contract gives VALIDATION_OUT_OF_RANGE for limit and offset. The error mapping itself is outside this file set. Separately, llm_run_id is typed non-null on AcceptedFragmentItem while the information-fragment node leaves llm_run optional, so that mismatch is worth a second look by whoever owns the shape.