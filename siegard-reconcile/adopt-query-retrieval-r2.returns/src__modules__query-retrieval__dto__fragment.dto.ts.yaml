findings:
  - file: src/modules/query-retrieval/dto/fragment.dto.ts
    where: ListAcceptedFragmentsQuerySchema, the `.strict()` call on the query object (line 38)
    evidence: >-
      .strict()
    cost: >-
      A request carrying any query parameter outside llm_run_id, raw_information_id, limit and offset is
      refused here. The contract's refusals for the listing name only a missing filter, a malformed
      identifier and out-of-range paging, so this refusal is decided in the DTO. The next reader looks
      for it in the specification and does not find it.
    kind: unstated
    node: contracts/knowledge-base/retrieval
    correction: >-
      Either give the contract's list-accepted-fragments refusals an entry for an unrecognised request
      parameter, or drop the strictness. Which one is the business's call.
