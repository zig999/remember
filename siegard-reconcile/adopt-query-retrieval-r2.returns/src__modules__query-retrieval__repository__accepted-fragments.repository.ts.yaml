  - node: constraints/llm-toolset-omits-fragment-listing
    held_at: nowhere
    evidence: >-
      The file exports only `countAcceptedFragments` and `selectAcceptedFragments`, which take a `PoolClient`. It registers no tool and no toolset, so which surface exposes the listing is not stated here.
  - node: constraints/retrieval-is-lexical-only
    held_at: nowhere
    evidence: >-
      The filter is `f.status = 'accepted' AND ($1::uuid IS NULL OR f.llm_run_id = $1::uuid) ...`. There is no text matching in this file, so lexical-only matching is neither held nor contradicted.
  - node: constraints/retrieval-is-read-only
    held_at: nowhere
    evidence: >-
      Both functions receive an already-open `client: PoolClient` and only call `client.query(sql, [...])`. No transaction is opened or its mode set here.
  - node: constraints/retrieval-requires-owner-authentication
    held_at: nowhere
    evidence: >-
      The file only exports `countAcceptedFragments(client, llmRunId, rawInformationId)` and `selectAcceptedFragments(...)`. It has no authentication step.
