looked_past: >-
  The file's extensive header and JSDoc comments restate the listing rules and cite openapi and back-spec identifiers (comments are another judgment's). The `NULLS LAST`, the `rc.id ASC` chunk tiebreak, and the derivation `r.metadata->>'title' AS document_title` (no title column exists in the migrations) are storage-level choices, not domain facts a node lacks.