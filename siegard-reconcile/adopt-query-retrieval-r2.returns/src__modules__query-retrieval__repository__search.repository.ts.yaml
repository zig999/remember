looked_past: >-
  The file carries long comment blocks, notably the node-provenance docblock about a "synthetic provenance entry", a "known spec-vs-schema gap" and dropping node hits without provenance. They break the no-comments rule, and the claims in them belong to the comment route and not to this judgment. The file also imports FTS_PROSE_CONFIG, FTS_NAME_CONFIG and the LAYER_WEIGHT_* values from files outside this set, and I did not open them.