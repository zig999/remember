findings:
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      searchNodeAliasLayer, the SELECT score expression (line 123)
    evidence: |-
      (max(ts_rank_cd(to_tsvector($1::regconfig, na.alias), websearch_to_tsquery($1::regconfig, $2))) * $3::float)::float AS score,
    cost: >-
      A knowledge node's score is decided as the highest rank among its matching aliases, and the specification does not say how a node reached through several aliases is scored. Code becomes the only home of that choice. The next reader who wants to know why a node ranks where it does looks in layer-weights or search-item and finds nothing.
    kind: unstated
    correction: >-
      The specification would have to say how a node's score is derived when several of its aliases match. Layer-weights or search-item would be the natural home.
    node: rules/knowledge-base/layer-weights
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      searchNodeAliasLayer, the ORDER BY and LIMIT clauses (lines 130-131)
    evidence: |-
      ORDER BY score DESC, kn.canonical_name ASC, kn.id ASC
           LIMIT $4
    cost: >-
      Search-ranking orders items by score, then by recording time with a node counting as never recorded, then by identifier. Here the pre-cut order for nodes puts canonical name ahead of identifier. When more nodes tie than the limit admits, the alphabetical name decides which nodes reach the ranking stage. That is a tie-break the specification does not hold, and it differs from the rule that governs it.
    kind: contradicts
    correction: >-
      Either the node-layer tie-break drops canonical_name, so ties resolve by identifier ascending as search-ranking states, or the specification states a name-based tie-break for nodes.
    node: rules/knowledge-base/search-ranking
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      listProvenanceForLinks, the FROM/JOIN and WHERE clauses (lines 306-311)
    evidence: |-
      FROM provenance p
            JOIN information_fragment f ON f.id = p.fragment_id
            JOIN fragment_source fs     ON fs.fragment_id = f.id
            JOIN raw_chunk rc           ON rc.id = fs.raw_chunk_id
            JOIN raw_information ri     ON ri.id = rc.raw_information_id
       WHERE p.link_id = ANY($1::uuid[])
    cost: >-
      The rule says search shows no fragment from a compliance-deleted source, neither as an item nor as the support of one. This lookup takes every fragment attached to a link and applies no filter on fragment status, chunk supersession or the raw information's deletion. A link that keeps other provenance after a compliance deletion (propagation only deletes links whose sole provenance is the deleted fragments) would still show the deleted source's fragment text and excerpt as its support. Deleted content would come back through retrieval.
    kind: contradicts
    correction: >-
      The link-support lookup would have to exclude fragments that are not accepted and chunks or raw information deleted for compliance, as the fragment layer already does for items.
    node: rules/knowledge-base/search-excludes-compliance-deleted-sources
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      listProvenanceForNodes, the ORDER BY clause (line 373)
    evidence: |-
      ORDER BY kn.id, f.created_at DESC, f.id ASC
    cost: >-
      The order in which the fragments that support a node hit are presented is decided here, newest first, and no node states it. Provenance-in-recording-order covers only links and attributes. A reader looking for how a node's supporting fragments are ordered finds no rule.
    kind: unstated
    correction: >-
      The specification would have to state the order of the fragments that support a node search item, on search-item or in a sibling rule.
    node: domain/knowledge-base/search-item
