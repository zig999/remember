findings:
  - file: src/modules/query-retrieval/mcp/query-toolset.ts
    where: QUERY_RETRIEVAL_TOOL_NAMES and the four registerTool calls, lines 118-123 and 219-284
    evidence: >-
      "search",
      "get_provenance_link",
      "get_provenance_attribute",
      "get_provenance_fragment",
      ... mcp.registerTool<SearchInput, unknown>("query", {
    cost: >-
      The retrieval contract names its operations search, read-link-provenance, read-attribute-provenance and read-fragment-provenance. The
      names an MCP client actually calls (get_provenance_link and the others) and the toolset key "query" live only in this file. The next
      reader who looks in the specification for what the owner's language model calls will not find them.
    kind: unstated
    correction: >-
      The retrieval contract, or a node bound to this file, would have to state the MCP tool names and the toolset they belong to.
    node: contracts/knowledge-base/retrieval
  - file: src/modules/query-retrieval/mcp/query-toolset.ts
    where: search handler input mapping, lines 226-241, and the search description, lines 130-135
    evidence: >-
      query: input.query, layers: input.layers, asOf: input.as_of, inEffectOnly: input.in_effect_only, ...
      expandLinkTypes: input.expand_link_types
    cost: >-
      The search-query node names its choices text and link_types, and the contract gives no wire names. The input names `query` and
      `expand_link_types`, and the id parameters `link_id`, `attribute_id` and `fragment_id`, are fixed only in code. A reader comparing the
      node with the tool sees two vocabularies and no node saying which one the client must send.
    kind: unstated
    correction: >-
      A node bound to the DTO or to this file would have to state the wire names of the search and provenance inputs.
    node: domain/knowledge-base/search-query
  - file: src/modules/query-retrieval/mcp/query-toolset.ts
    where: QueryRetrievalToolDescriptions.search, line 134
    evidence: >-
      `expand`, `expand_depth` (1..3),
    cost: >-
      The depth bound is restated as a string served over tools/list, in a file the rule is not bound to. If the node's bound moves,
      `--check` never reaches this text and nobody can tell which of the two was decided.
    kind: contradicts
    correction: >-
      Either bind this file to the rule, since it is where the tool surface is declared, or drop the restated bound from the description.
    node: rules/knowledge-base/expansion-depth-bounds
  - file: src/modules/query-retrieval/mcp/query-toolset.ts
    where: QueryRetrievalToolDescriptions.search, line 135
    evidence: >-
      Pagination via `limit` (max 100) and `offset`.
    cost: >-
      The page limit ceiling is restated in a tool description, so it now has a second home in a file the node is not bound to. A change to
      the ceiling leaves this text stale with nothing to flag it.
    kind: contradicts
    correction: >-
      Either bind this file to the rule or remove the restated ceiling from the description.
    node: rules/knowledge-base/page-limit-bounds
  - file: src/modules/query-retrieval/mcp/query-toolset.ts
    where: get_provenance_link, get_provenance_attribute and get_provenance_fragment descriptions, lines 138-147
    evidence: >-
      404 if missing; 410 if any underlying raw is tombstoned by a compliance delete.
    cost: >-
      The compliance-deletion refusal, with its status number, is restated as tool documentation in a file the rule is not bound to. The
      wording ("tombstoned") also differs from the node's, so the two can drift without either being wrong on its face.
    kind: contradicts
    correction: >-
      Either bind this file to the rule or remove the restated refusal from the descriptions.
    node: rules/knowledge-base/provenance-refused-after-compliance-deletion
  - file: src/modules/query-retrieval/mcp/query-toolset.ts
    where: get_provenance_fragment description, lines 146-147
    evidence: >-
      404 if missing or if the fragment is not in status='accepted'
    cost: >-
      The accepted-only condition for a fragment's provenance is stated again in a description served to clients, in a file the rule is
      not bound to. A change to the rule leaves the served text saying the old one.
    kind: contradicts
    correction: >-
      Either bind this file to the rule or remove the restated condition from the description.
    node: rules/knowledge-base/provenance-requires-accepted-fragment
