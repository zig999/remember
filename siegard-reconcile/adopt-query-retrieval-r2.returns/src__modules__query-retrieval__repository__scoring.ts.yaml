findings:
  - file: src/modules/query-retrieval/repository/scoring.ts
    where: the doc comment above LAYER_WEIGHT_CHUNK, line 15
    evidence: >-
      /** Layer weight for raw `raw_chunk` hits (only surfaced when no fragment anchors them). */
      export const LAYER_WEIGHT_CHUNK = 0.6 as const;
    cost: >-
      The comment says a chunk hit is surfaced when no fragment anchors it. The node says a chunk-layer match never
      surfaces as a search item. This is prose next to the constant, not code, but it gives the next reader a second,
      opposite account of what a chunk match does. The two disagree, and nothing tells the reader which was decided.
    kind: contradicts
    correction: >-
      Remove the claim from the comment. The chunk weight itself agrees with rules/knowledge-base/layer-weights and
      needs no change.
    node: rules/knowledge-base/chunk-match-never-surfaces
