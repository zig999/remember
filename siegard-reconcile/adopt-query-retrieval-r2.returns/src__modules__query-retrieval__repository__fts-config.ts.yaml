looked_past: >-
  The header comment cites BR-06 of query-retrieval.back.md and ADR A4, and says a future synonym dictionary (pt_unaccent_v2) will be activated by changing the constant. Those are comment-rule matters, not a domain fact, so they are reported here and not as findings. Whether the identifiers pt_unaccent_v1 and simple_unaccent_v1 need a node is a database-object naming question for the migration's judgment. No node names them.