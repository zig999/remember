findings:
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: IsoDateOnly, lines 16-18, used by SearchQuerySchema.as_of at line 61
    evidence: |-
      const IsoDateOnly = z
        .string()
        .regex(/^\d{4}-\d{2}-\d{2}$/, "must be YYYY-MM-DD");
    cost: >-
      The contract refuses an as-of that "is not a calendar date written as year-month-day". This
      declaration only checks the digit shape, so a value such as 2026-13-45 passes the DTO. If no
      later layer refuses it, the calendar-date rule is not held anywhere in this file. The next
      reader who looks here for the as_of format rule finds a weaker one than the contract states.
    kind: contradicts
    correction: >-
      The as_of schema would have to refuse non-calendar dates with VALIDATION_INVALID_FORMAT, or a
      file the contract is bound to would have to be shown to do so.
    node: contracts/knowledge-base/retrieval
