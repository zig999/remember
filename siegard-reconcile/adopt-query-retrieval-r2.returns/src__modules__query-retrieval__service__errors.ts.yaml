findings:
  - file: src/modules/query-retrieval/service/errors.ts
    where: header comment, lines 1-5
    evidence: >-
      // Typed sentinel errors emitted by the query-retrieval services. The route
      // layer maps each one to its HTTP status + `error.code` envelope. [...]
      // All error codes registered in `docs/specs/_global/error-codes.md`.
    cost: >-
      The comment names a document outside the specification as the registry of these error codes. The retrieval contract node holds those codes and statuses. A reader who follows the comment goes to a registry that is not the authority, and the two can move apart without anything noticing.
    kind: contradicts
    correction: >-
      Remove the comment. The contract already holds the codes, and the bind from this file to the contract node is what keeps them together.
    node: contracts/knowledge-base/retrieval
  - file: src/modules/query-retrieval/service/errors.ts
    where: comment above InvalidSearchQueryError, line 7
    evidence: >-
      /** BR-05 — parsed tsquery is empty (Zod cap on length, but stopword-only also lands here). */
    cost: >-
      The comment restates the refusal of a query that yields no search term, and cites a back-spec rule number as its authority. The specification holds that rule in the must-parse node, so this prose is a second home for it.
    kind: contradicts
    correction: Remove the comment. This is prose only. The refusal is already held by the code and by the node.
    node: rules/knowledge-base/search-query-must-parse
  - file: src/modules/query-retrieval/service/errors.ts
    where: message of InvalidSearchQueryError, line 23
    evidence: >-
      : "query exceeds 1000 characters"
    cost: >-
      The number 1000 is the search-query-length node's value, and it is written a second time as a literal in a string. If the node's limit moves, this message still says 1000, and nothing ties the string to the node.
    kind: contradicts
    correction: >-
      The message should not carry the number. Otherwise the limit's home must be the bound file that enforces it.
    node: rules/knowledge-base/search-query-length
  - file: src/modules/query-retrieval/service/errors.ts
    where: comment above InvalidSearchLayerError, line 31
    evidence: >-
      /** BR-04 — `layers[]` element outside `{fragment, node, chunk}`. */
    cost: >-
      The comment restates the layer-outside-set refusal and re-lists the layer set, citing a back-spec rule number. The specification holds both the rule and the set, so this prose is a second home for them.
    kind: contradicts
    correction: Remove the comment. This is prose only.
    node: rules/knowledge-base/search-layer-outside-set-refused
  - file: src/modules/query-retrieval/service/errors.ts
    where: comment above FragmentNotAcceptedError, line 45
    evidence: >-
      /** BR-16 / partial-GIN — fragment exists but `status != 'accepted'`. */
    cost: >-
      The comment restates the rule that a fragment's provenance is read only when it is accepted, citing a back-spec rule number. It also mentions an index detail that no node holds.
    kind: contradicts
    correction: Remove the comment. This is prose only.
    node: rules/knowledge-base/provenance-requires-accepted-fragment
  - file: src/modules/query-retrieval/service/errors.ts
    where: comment above RawInformationDeletedError, line 60
    evidence: >-
      /** BR-17 — any underlying `raw_information` is tombstoned by `compliance_delete`. */
    cost: >-
      The comment restates the refusal after a compliance deletion, citing a back-spec rule number. The node holds that rule, so this prose is a second home for it.
    kind: contradicts
    correction: Remove the comment. This is prose only.
    node: rules/knowledge-base/provenance-refused-after-compliance-deletion
  - file: src/modules/query-retrieval/service/errors.ts
    where: comment above EmptyProvenanceError, line 77
    evidence: >-
      /** BR-19 — empty provenance on an existing anchor (legacy-data inconsistency). */
    cost: >-
      The comment restates the empty-chain refusal, citing a back-spec rule number. The node holds that rule, so this prose is a second home for it.
    kind: contradicts
    correction: Remove the comment. This is prose only.
    node: rules/knowledge-base/empty-provenance-chain-refused
  - file: src/modules/query-retrieval/service/errors.ts
    where: message of EmptyProvenanceError, lines 85-87
    evidence: >-
      `provenance chain is empty for ${anchorKind} ${anchorId} (legacy-data inconsistency).`
    cost: >-
      The message tells the owner that an empty provenance chain means legacy data. The node only says that a read of an existing item with an empty chain is refused, and states no cause. The owner is given a diagnosis that lives only in this string.
    kind: unstated
    correction: >-
      Either the node should state that an empty chain is a legacy-data inconsistency, or the message should drop the cause.
    node: rules/knowledge-base/empty-provenance-chain-refused
