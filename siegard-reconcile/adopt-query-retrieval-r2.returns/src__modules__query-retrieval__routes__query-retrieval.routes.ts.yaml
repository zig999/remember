looked_past: >-
  The file carries header and section comments ("BR-01", "BR-24", "TC-be-002", "Tombstoned sources are silently omitted", "at least one required") that restate rules and cite back-spec identifiers, which is the comment rule's judgment. The refusal for expansion depth (BUSINESS_INVALID_TRAVERSE_DEPTH) has no mapping branch in this file, and where that error is produced is a question for the DTO or service files outside this set.