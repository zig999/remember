findings:
  - file: src/modules/query-retrieval/service/accepted-fragments.service.ts
    where: >-
      header comment, lines 6-8 (step 2 of the service description)
    evidence: |-
      //   2. Runs the page query (deduped per fragment_id, ordered by
      //      `r.received_at DESC NULLS LAST, f.created_at DESC, f.id ASC`).
    cost: >-
      The comment states the listing order, and adds a null-placement clause ("NULLS LAST") that the
      node does not hold. The ordering and the once-per-fragment dedup are not implemented in this file.
      The next reader takes the comment as the decided order and never opens listing-order or
      listing-one-entry-per-fragment. When either node moves, `--check` does not reach this prose.
    kind: contradicts
    correction: >-
      Remove the ordering and dedup description from the comment. The order stays held by the node
      and by the query that implements it, not by prose in this file.
    node: rules/knowledge-base/listing-order
  - file: src/modules/query-retrieval/service/accepted-fragments.service.ts
    where: >-
      header comment, lines 12-13 (tombstone short-circuit)
    evidence: |-
      // short-circuit is in the repository SQL (`NOT EXISTS compliance_deletion`),
      // per back-spec BR-14: tombstoned RawInformation rows are silently omitted.
    cost: >-
      The comment restates the compliance-exclusion rule and cites a back-spec rule as its authority.
      Nothing in this file holds the exclusion. A reader of the service finds the claim here, not the
      node listing-excludes-compliance-deleted, so it becomes a second home for a decided rule.
    kind: contradicts
    correction: >-
      Remove the sentence. The exclusion stays held by the node and by the repository query that
      implements it.
    node: rules/knowledge-base/listing-excludes-compliance-deleted
