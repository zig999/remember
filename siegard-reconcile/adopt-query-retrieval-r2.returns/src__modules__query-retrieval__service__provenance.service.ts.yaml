looked_past: >-
  The route strings and structured log event names such as "query_retrieval_provenance_tombstone", the
  chunk-deduplication guard in groupChain, and the many BR-nn back-spec citations in comments are operational or
  code-review concerns, not domain facts. I did not judge them.