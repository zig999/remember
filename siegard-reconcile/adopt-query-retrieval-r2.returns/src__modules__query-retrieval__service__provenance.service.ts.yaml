findings:
  - file: src/modules/query-retrieval/service/provenance.service.ts
    where: header comment, lines 3-8
    evidence: |-
      // Precedence:
      //   1. anchor row missing             -> RESOURCE_NOT_FOUND (404)
      //   2. fragment anchor with status != 'accepted' -> BUSINESS_FRAGMENT_NOT_ACCEPTED (404)
      //   3. chain reaches a tombstoned raw -> BUSINESS_RAW_INFORMATION_DELETED (410)
      //   4. chain assembled but empty      -> SYSTEM_INTERNAL_ERROR (500) + WARN log
    cost: >-
      The order in which refusals win, with their codes and HTTP statuses, is written out again as the file's
      own authority. The node holds this order: a compliance deletion is refused ahead of every other refusal
      except a fragment that is not accepted. If the node moves, the file is the place a reader finds a second
      answer, and the code can no longer be told apart from the decision.
    kind: contradicts
    correction: >-
      Remove the comment. The precedence lives in the node and in the order of the checks in the three
      getProvenanceBy* functions and finalise; the comment adds a second statement of it.
    node: rules/knowledge-base/compliance-refusal-takes-precedence
  - file: src/modules/query-retrieval/service/provenance.service.ts
    where: comment inside finalise, step (b), lines 108-111
    evidence: |-
      // (b) Empty-chain alarm — BR-19. The anchor exists (step 1 already
      //     established that); zero chain rows means we have a legacy data
      //     inconsistency. The OpenAPI contract requires `fragments[] minItems: 1`,
      //     so we surface a 500 with a structured WARN — never an empty array.
    cost: >-
      The refusal of an empty provenance chain is justified by a back-spec rule number and an OpenAPI
      constraint, not by the node that holds it. The comment also gives a reason, "a legacy data inconsistency",
      that no node states. A reader who looks for why the read is refused finds the code's own account rather
      than the specification's.
    kind: contradicts
    correction: >-
      Remove the comment. The node states the refusal, and the rationale belongs in the decision log if it is
      wanted at all.
    node: rules/knowledge-base/empty-provenance-chain-refused
