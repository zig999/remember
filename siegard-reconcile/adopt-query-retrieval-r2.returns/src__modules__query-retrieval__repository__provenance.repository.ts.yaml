findings:
  - file: src/modules/query-retrieval/repository/provenance.repository.ts
    where: FragmentStatusRow.status (line 42) and ProvenanceChainRow.fragment_status (line 65)
    evidence: >-
      readonly status: "accepted" | "proposed" | "rejected" | "deleted";
    cost: >-
      The file declares its own fragment-status vocabulary with four values. The node has five, and
      `superseded` is missing. The database enum also has `superseded`, so a superseded fragment
      would come back through a type that says it cannot exist. The next reader takes this union as
      the list of fragment states and never looks for the fifth in the specification.
    kind: contradicts
    correction: >-
      Add `superseded` to both unions so they match the fragment-status node, or type the field as
      the shared fragment status instead of redeclaring it here.
    node: domain/knowledge-base/fragment-status
  - file: src/modules/query-retrieval/repository/provenance.repository.ts
    where: the ORDER BY clauses of the two chain queries in runChainSql (lines 154 and 179)
    evidence: >-
      ORDER BY p.created_at ASC, f.id, rc.chunk_index ASC, rc.id ASC
    cost: >-
      The order of the chunks inside each fragment (chunk index ascending, then chunk id) and the
      fragment tie-break by fragment id decide what the owner reads first in a provenance answer.
      The specification holds only that fragments come in recording order. The chunk order lives
      only in this SQL, so the next reader looks for it in the specification and does not find it.
    kind: unstated
    correction: >-
      The analysis would give the chunk order and the tie-break a home, most likely in the
      provenance read answers of contracts/knowledge-base/retrieval or in
      domain/knowledge-base/provenance.
    node: contracts/knowledge-base/retrieval
