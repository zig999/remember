looked_past: >-
  The file carries header and inline comments citing back-spec rules (BR-11, BR-16, BR-17, BR-18, A22, ingestion BR-34) and stating that original_input becomes '[REDACTED]' after compliance_delete, all of which belong to the comment route. It also renames the column `executed_at` to `performed_at` in TombstoneRow, claiming that name comes from "this domain's spec", while the compliance-deletion node names `executed_at`. That is a naming matter, not a domain fact.