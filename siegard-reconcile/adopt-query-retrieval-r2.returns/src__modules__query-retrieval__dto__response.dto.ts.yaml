looked_past: >-
  The header comments citing openapi.yaml, TC-04 and BR-18 break the no-comment rule, and toSourceType's InvariantError-to-500 handling of DB drift is an implementation matter. Neither is a domain-fact judgment. I also did not report the wire spellings (`low_confidence`, `offset_start`) as departures from the node spellings (`low-confidence`, `start_offset`), and I did not report `layer` and `hop` being non-optional on SearchItem where the node marks them not required.