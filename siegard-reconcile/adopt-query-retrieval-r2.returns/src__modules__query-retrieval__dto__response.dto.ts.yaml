findings:
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: ProvenanceRawInformation.metadata, line 80
    evidence: >-
      readonly metadata: Record<string, unknown>;
    cost: >-
      The specification decided the metadata to be a string, because the material gave it no shape and the retrieval only passes it through. The DTO states a structured JSON object. A reader who takes the shape from the node will expect a string. A client written to this type will expect an object.
    kind: contradicts
    correction: >-
      Either the node's `attributes.metadata.type` moves to a structured type through analysis, or the DTO carries the type the node decided.
    node: domain/knowledge-base/raw-information
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: comment above ProvenanceRawInformation.original_input, lines 81-84
    evidence: >-
      // `null` (or omitted) for non-chat sources and for rows that predate the
      // feature; `'[REDACTED]'` after compliance_delete (BR-18 of
      // compliance-audit).
    cost: >-
      The literal value a compliance-deleted source's original input takes is stated only in this prose. I searched the whole specification root, including the decision log, for REDACTED and found no node that holds it. It reads as a decision the business made, but the next reader will look for it in the specification and not find it.
    kind: unstated
    correction: >-
      An analysis should decide what `original_input` becomes after a compliance deletion and give it a node. The likely home is domain/knowledge-base/raw-information or domain/knowledge-base/compliance-deletion.
    node: domain/knowledge-base/raw-information
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: comment above ProvenanceRawInformation.original_input, lines 83-84
    evidence: >-
      NOT part of the content_hash; NOT searchable.
    cost: >-
      The comment states that the original input is excluded from the content hash. I searched the specification for content_hash and content hash and found no node that holds this. It is a rule of the idempotency identity that lives only in prose here.
    kind: unstated
    correction: >-
      The analysis of the ingestion side should give the content hash's composition a node.
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: ProvenanceChunk.locator, line 94
    evidence: >-
      readonly locator: Record<string, unknown> | null;
    cost: >-
      The specification decided the locator to be a string, because the material gave it no shape and the retrieval only passes it through. The DTO states a structured object that can be null. A reader who takes the shape from the node will expect a string. A client written to this type will expect an object.
    kind: contradicts
    correction: >-
      Either the node's `attributes.locator.type` moves through analysis, or the DTO carries the type the node decided.
    node: domain/knowledge-base/raw-chunk
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: ProvenanceFragment.status, line 102
    evidence: >-
      readonly status: "accepted" | "proposed" | "rejected" | "deleted";
    cost: >-
      The fragment-status node holds five values and the decision log decided "The five values stand, superseded included." The DTO's union leaves out superseded. A provenance read that lists a superseded fragment has no legal value for its status, and clients narrow on four states while the business defined five.
    kind: contradicts
    correction: >-
      Add "superseded" to the union so it matches the fragment-status enumeration.
    node: domain/knowledge-base/fragment-status
