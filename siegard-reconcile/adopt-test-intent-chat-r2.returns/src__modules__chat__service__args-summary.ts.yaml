findings:
  - file: src/modules/chat/service/args-summary.ts
    where: >-
      the start_async_ingestion and get_ingestion_status cases of formatByTool, lines 142-156
    evidence: >-
      return `source_type=${sourceType} content_len=${contentLen}`;  and  return `llm_run_id=${llmRunId}`;
    cost: >-
      The string is emitted in the tool_start frame and rendered to the owner. What an ingestion's tool-start
      summary shows (its source type and the code-point length of its content, or the run identity of a status
      read) is stated only here. tool-start-summary-bounded holds only that the content is never carried. The
      next reader who looks in the specification for what these two summaries show finds nothing.
    kind: unstated
    correction: >-
      An analysis would give the fact a node. It would state what the tool-start summary of a directed ingestion
      and of an ingestion status read shows. tool-start-summary-bounded is the neighbouring node.
    node: rules/chat/tool-start-summary-bounded
  - file: src/modules/chat/service/args-summary.ts
    where: >-
      the header comment, lines 1-38, and the comment on ARGS_SUMMARY_MAX_CHARS, line 40
    evidence: >-
      //   - search:                        query="<first 60 chars of query>" (+ optional layers=... expand_depth=<n>)
      // Fallback when the input shape is unexpected: `<n keys>`
      /** Hard cap on the produced string, per openapi.yaml `ToolStartEvent.args_summary.maxLength`. */
    cost: >-
      The comment restates the per-tool formats, the 60-character search cut, the fallback and the 200-character
      cap. Code in this same file holds each of them (formatByTool, fallbackSummary, clampToMax), so the pair
      conforms. The restatement is a second home outside behavior that drifts when a node moves. It also cites
      chat.back.md and openapi.yaml as the authority in place of the nodes.
    kind: restates
    correction: >-
      Remove the comment prose. The facts are held by the six tool-start-* nodes and by
      tool-start-summary-bounded, and the code holds them here.
