findings:
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      the header comment, lines 22-28 (the "BR-29 persistence sequencing" list)
    evidence: >-
      //       1. validate -> 2. load conv -> 3. archived -> 4. turn registry ->
      //       5. idempotency -> 6. insertUserMessage tx -> 7. buildModelContext ->
    cost: >-
      The order in which a sent message is refused is stated a second time in prose, and it is stated differently. The comment omits the disabled-chat check and the unavailable-toolset check that the code and the node both order. A reader who trusts the comment will not find the real order, which is the one the node holds.
    kind: restates
    correction: >-
      Remove the sequencing list from the header comment. The order is held by the handler's code in this file and by the node.
    node: rules/chat/send-message-check-order
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      the `catalog` field docblock in ChatRouteDeps (lines 148-155) and the comment above the graph_delta projection in the drain loop (lines 964-973)
    evidence: >-
      When the catalog is absent (e.g. tests that do not load it) the route silently skips graph normalization: tool_result frames still emit, but no `graph_delta` frame is generated.
      // entirely when the tool failed (ok:false), when the catalog snapshot is unavailable, or when the normalizer returns null
    cost: >-
      The rule that a tool result is followed by a graph delta only while the catalog snapshot is held is stated again in two comments. The code already holds it at `if (evt.type === "tool_result" && evt.ok && deps.catalog !== undefined)`. If the node moves, the comments keep stating the old rule.
    kind: restates
    correction: >-
      Remove the two comments. The condition at line 974 holds the fact.
    node: rules/chat/graph-delta-requires-catalog-snapshot
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      the comment inside handleIdempotentReplay (lines 1140-1143) and the docblock of mapStoredStopReason (lines 1540-1545)
    evidence: >-
      // We surface the stored stop_reason on the done frame. Synthetic
      // `provider_error` / `internal_error` markers are mapped back to
      // `end_turn` on the wire
    cost: >-
      The replay mapping is stated in prose as well as in code. Prose that explains it by an "openapi.yaml DoneEvent enum" sends the reader to a document other than the specification.
    kind: restates
    correction: >-
      Remove both comments. The mapping is held by mapStoredStopReason (cases `provider_error` and `internal_error` return "end_turn").
    node: rules/chat/replay-reports-failure
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      handleIdempotentReplay (lines 1144-1154) and mapStoredStopReason (lines 1546-1562), the replay of a turn recorded as provider_error or internal_error
    evidence: >-
      code: `case "provider_error": case "internal_error": default: return "end_turn";` followed by `frameJson("done", { stop_reason: storedStop, model: assistantRow.model ?? "", ...`.
      contracts/chat/conversations, send-message accepted: "or, for a turn recorded as provider-error or internal-error, the `error` frame that turn closed with"
    cost: >-
      The contract tells callers that a replay of a failed turn ends in an `error` frame. The code and rules/chat/replay-reports-failure, as its decision log last decided it, end it in `done` with stop reason end_turn. A client written from the contract expects an error frame and receives a successful-looking done event.
    kind: contradicts
    correction: >-
      Restate the replay sentence of send-message in the contract so it agrees with rules/chat/replay-reports-failure (done with stop reason end_turn). The code and the rule agree with each other.
    node: contracts/chat/conversations
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      emitChatBootLog (lines 1238-1261) and computeMissingToolNames (lines 1213-1219)
    evidence: >-
      for (const name of CHAT_TOOL_NAMES) { if (deps.mcp.getTool("query", name) !== undefined) queryResolved += 1; } ... const toolCount = queryResolved === CHAT_TOOL_NAMES.length ? CHAT_TOOL_NAMES.length + (ingestPortionAdvertised ? CHAT_INGEST_TOOL_NAMES.length : 0) : 0;
    cost: >-
      The test of whether every query tool is available is implemented here a second time, for a log line. It is not shared with the code that decides whether a turn may start (`buildChatToolCatalog`). When the two disagree, the boot log reports a tool count the deployment does not serve, and nobody knows which one was decided. The all-or-nothing treatment of the directed-ingestion tool is also restated here, and the node set does not hold it.
    kind: contradicts
    correction: >-
      Take the tool count from the resolved catalog (the result of `buildChatToolCatalog`) and stop recomputing availability in the route. Alternatively, state the rule once in a node that this file is bound to.
    node: rules/chat/chat-toolset-requires-every-query-tool
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      the comment before the "chat.recent_window_resolved" log (lines 1271-1274)
    evidence: >-
      // BR-31 v2.9: CHAT_RECENT_WINDOW changed UNIT (rows -> turns) and DEFAULT
      // (10 -> 6) in chat-context-fidelity TC-01.
    cost: >-
      The default of 6 for the recent window is stated in a comment of the route. The code that holds it is the env schema, `CHAT_RECENT_WINDOW: z.coerce.number().int().min(1).default(6)` in src/config/env.ts. A reader looks in the comment, or in the node, and does not know which is current.
    kind: restates
    correction: >-
      Remove the comment. The default is held by src/config/env.ts.
    node: rules/chat/model-context-window
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
