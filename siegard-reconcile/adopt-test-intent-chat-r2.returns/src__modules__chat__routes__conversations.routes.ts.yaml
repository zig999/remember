    node: rules/chat/owner-time-zone-default
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      projectGraphDelta, the catch block (lines 1411-1422)
    evidence: >-
      } catch (err) { logger.warn({ event: "chat.graph_delta_normalize_failure", ... }, "chat graph_delta normalization failed — skipping frame"); return null; }
    cost: >-
      The route decides that a failure while building a graph delta, for example a store error during search hydration, sends the tool result with no graph delta and the turn goes on. No node holds this. The unreadable-result node covers a result the normalizer reads as empty, and the recording-failure node covers recording. The next reader will look in the specification for what the owner's graph view shows when a delta cannot be built, and will not find it.
    kind: unstated
    correction: >-
      Give the fact a node beside rules/chat/graph-delta-follows-tool-result, or extend that rule: a graph delta that cannot be built is omitted and the stream continues.
    node: rules/chat/graph-delta-follows-tool-result
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      emitTurnLog (lines 1583-1611)
    evidence: >-
      const aborted = args.stopReason === "cancelled" || args.stopReason === "turn_timeout"; ... actor: "owner" as const, ... counter: { name: "chat_turn_total", labels: { stop_reason: args.stopReason }, value: 1 }
    cost: >-
      The route emits a per-turn record. It defines "aborted" as cancelled or timed out, names a counter `chat_turn_total` labelled by stop reason, and fixes the actor as "owner". No node holds any of it. The definition of "aborted" lives only in this log line, so the next reader of the metric cannot trace it to the specification.
    kind: unstated
    correction: >-
      Give the per-turn record (its fields, the meaning of "aborted", the counter and its label) a node, or decide that the record is not specified.
