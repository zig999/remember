findings:
  - file: src/modules/chat/service/context-builder.ts
    where: >-
      the docstring on BuildModelContextInput.ownerTz, lines 86-91
    evidence: >-
      * IANA timezone id used to render BlockB (BR-47 step 3) — typically
      `env.OWNER_TZ` (default `"America/Sao_Paulo"`).
    cost: >-
      The default time zone is also written in prose here. Code holds it in
      backend/src/config/env.ts as `OWNER_TZ: z.string().min(1).default("America/Sao_Paulo")`.
      If the default moves, this comment keeps naming the old zone, and a reader
      of this file takes it as the decided value.
    kind: restates
    correction: >-
      Remove the parenthetical default from the docstring. The code that holds
      the default is already in backend/src/config/env.ts.
    node: rules/chat/owner-time-zone-default
  - file: src/modules/chat/service/context-builder.ts
    where: >-
      the header comment lines 11-14 and the docstring on
      BuildModelContextInput.recentLimit, lines 93-100
    evidence: >-
      * Number of recent REAL TURNS to include (BR-31 v2.9 — TURN-based, not
      row-based; typically `env.CHAT_RECENT_WINDOW`, default 6). A real turn is
      one user `chat_message` row with `idempotency_key IS NOT NULL`; the
      repository returns ALL rows of each selected turn
    cost: >-
      The window size (default 6) and the rule for which messages the window
      starts from are restated in prose. Code holds them elsewhere:
      `CHAT_RECENT_WINDOW: z.coerce.number().int().min(1).default(6)` in
      backend/src/config/env.ts, and the `idempotency_key IS NOT NULL` anchor
      predicate in backend/src/modules/chat/repository/chat.repository.ts. A
      change to the window would leave this file describing a rule that is no
      longer decided.
    kind: restates
    correction: >-
      Remove the window size, the default and the real-turn definition from the
      comments. The repository and env code hold them.
    node: rules/chat/model-context-window
  - file: src/modules/chat/service/context-builder.ts
    where: >-
      the docstring on buildModelContext, step 2 (BlockB), lines 129-132
    evidence: >-
      `renderDatetimeBlockB(now, ownerTz)` — a SHORT
      pt-BR string of the exact shape `"Data/hora atual do dono: <ISO-8601
      with offset> (<tz-id>)"`.
    cost: >-
      The opening words of the owner-time statement are restated in prose.
      Code holds them in backend/src/modules/chat/service/datetime-block.ts as
      `const ISO_PREFIX = "Data/hora atual do dono: " as const;`. A change to
      the wording would leave this comment describing a shape the system no
      longer emits.
    kind: restates
    correction: >-
      Remove the quoted shape from the docstring. datetime-block.ts holds the
      opening.
    node: rules/chat/model-context-owner-time-opening
