looked_past: >-
  The file holds the rendering of the NodeType, LinkType and AttributeKey blocks and the insertion-order determinism for cache-control, which rules/chat/chat-prompt-presents-catalog and chat-prompt-carries-marker govern (neither is in the pack), plus module-structure and caching choices that are code-review matters.
