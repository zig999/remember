findings:
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      header comment, lines 13-17 (Block 4B description)
    evidence: >-
      // - Block 4B SEARCH DISCIPLINE — explicit directives the model MUST follow:
      //   `search` is lexical AND (one specific name per call, never concatenate
      //   multiple proper nouns); `list_nodes` MUST carry a `node_type` filter
    cost: >-
      The search-discipline rules are said a second time in prose that no running system emits. When the node moves, this comment keeps the old wording and nobody knows which one was decided.
    kind: restates
    correction: >-
      Remove the comment. BLOCK_4B_SEARCH_DISCIPLINE (lines 78-96) holds the fact as emitted text, so the pair conforms and only the prose is owed removal.
    node: rules/chat/chat-prompt-search-one-name
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      header comment, lines 18-24 (Block 4C description)
    evidence: >-
      // - Block 4C POST-INGESTION PLAYBOOK — explicit recipe for "show what was
      //   ingested" after `get_ingestion_status` returns `completed`. The model
      //   MUST consult `result.affected_nodes` FIRST (TC-5 propagation, BR-43 /
      //   BR-45 amendments) and do direct `get_node` / `traverse` lookups;
    cost: >-
      The affected-nodes-first rule and its fallback are restated in a comment. The comment points to BR-43/BR-45 and TC-5 as the authority, and a reader may take those for the home of the rule.
    kind: restates
    correction: >-
      Remove the comment. BLOCK_4C_POST_INGESTION_PLAYBOOK (lines 98-129) holds the fact as emitted text.
    node: rules/chat/chat-prompt-affected-nodes-first
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      BLOCK_4C_POST_INGESTION_PLAYBOOK step 1, lines 105-107
    evidence: >-
      "1. Chame `get_ingestion_status` UMA UNICA VEZ para confirmar que a",
      "   ingestao alcancou `status: \"completed\"`. Se ainda estiver em",
      "   `running`, informe e PARE — nao tente descrever o que foi ingerido.",
    cost: >-
      The prompt tells the assistant, when the owner asks for the result, to check status exactly once and to stop if the run is still running. The only node near this is rules/chat/chat-prompt-v2-no-status-polling, which covers the v2 prompt and the turn that started the ingestion. This is a different turn and a different prompt version. The behavior lives only in this string, and the next reader will look for it in the specification and not find it.
    kind: unstated
    correction: >-
      Give the v3-on result-request status check (once only, stop when not completed) a node, or widen the existing v2 node's reach, through analysis.
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      BLOCK_4C_POST_INGESTION_PLAYBOOK step 2.a, lines 113-114
    evidence: >-
      "      directamente em `get_node(id)` e/ou `traverse(start_node_id=id,",
      "      depth=2)`. Descreva APENAS o que essas chamadas retornaram.",
    cost: >-
      The traversal depth of 2 is a value the prompt sets, and chat-prompt-affected-nodes-first says only "traverse from it directly". Changing the depth is a code edit to a string with no node behind it.
    kind: unstated
    correction: >-
      State the depth (or its absence) in rules/chat/chat-prompt-affected-nodes-first, or drop it from the prompt.
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      BLOCK_4C_POST_INGESTION_PLAYBOOK step 2.a, line 114
    evidence: >-
      "      depth=2)`. Descreva APENAS o que essas chamadas retornaram.",
    cost: >-
      The restriction "describe ONLY what those calls returned" is a rule on what the assistant may tell the owner about an ingestion, and no node holds it for v3. It lives only in this emitted string.
    kind: unstated
    correction: >-
      Give the rule a node under the chat-prompt rules, or remove it from the prompt.
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      BLOCK_4C_POST_INGESTION_PLAYBOOK step 3, lines 122-124
    evidence: >-
      "3. Cite a fonte: o campo `raw_information_id` retornado por",
      "   `get_ingestion_status` identifica o documento ingerido — mencione-o",
      "   ao dono.",
    cost: >-
      The prompt requires the assistant to name the ingested document by its raw_information_id when reporting an ingestion. The only citing rule, chat-prompt-v1-cites-sources, is scoped to the v1 prompt. This requirement for v3 on is stated in the code alone.
    kind: unstated
    correction: >-
      Give the v3-on rule of citing the ingested document's raw information identity a node, through analysis.
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      comment inside renderOntologyBlock, lines 188-193
    evidence: >-
      // BR-30 — when the key has a CLOSED domain, list its allowed values inline
      // so the model uses one of them verbatim instead of guessing (e.g. an
      // English convention against a pt-BR domain).
    cost: >-
      The closed-values presentation rule is restated in a comment citing BR-30. The code below it holds the fact, so this is a second home in prose.
    kind: restates
    correction: >-
      Remove the comment. The `domainSuffix` construct (lines 195-198) holds the fact.
    node: rules/chat/chat-prompt-presents-catalog
  - file: src/modules/chat/prompts/v3.ts
    where: >-
      domainSuffix in renderOntologyBlock, line 197
    evidence: >-
      ` [dominio fechado: ${[...domain].sort().join(" | ")}]`
    cost: >-
      The closed values are shown in ascending string order, separated by " | ". rules/chat/chat-prompt-presents-catalog says only that the prompt presents "the closed values each allows". The ascending-order rule exists only for the extraction prompt, and no node holds it for the chat prompt. A change to this order goes unseen by the specification.
    kind: unstated
    correction: >-
      State the ordering of the closed values in rules/chat/chat-prompt-presents-catalog or in a sibling node.

