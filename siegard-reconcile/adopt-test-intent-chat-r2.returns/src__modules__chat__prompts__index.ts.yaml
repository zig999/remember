looked_past: >-
  The file's selectSummaryPromptModule() has no caller and states a summary persona ("compactador") that differs from the one in rules/chat/summary-prompt-v2-persona ("Sintetizador"). I did not report it because the text is never emitted. The registry's default of v4, its failure on an unknown version, and the shared marker are held by nodes outside the pack (rules/chat/default-chat-prompt-version, rules/chat/chat-prompt-version-known, rules/chat/chat-prompt-carries-marker), and the comments in this file that restate them are another judgment's.
