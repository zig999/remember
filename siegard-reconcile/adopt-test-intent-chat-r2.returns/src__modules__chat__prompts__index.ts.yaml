findings:
  - file: src/modules/chat/prompts/index.ts
    where: >-
      selectTitlePromptModule(), lines 167-180, the REGRAS list of the title prompt sent to the utility model
    evidence: >-
      "2. Sem aspas, sem prefixos como 'Titulo:'.", "3. Sem ponto final.", "4. Sem emojis.", "5. Responda APENAS com o titulo, em uma unica linha."
    cost: >-
      The shape a distilled title must take (no quotation marks, no prefix, no final full stop, no emoji, a single line) is told to the model only by this prompt, which distillation.service.ts sends as `system: selectTitlePromptModule()`. A reader who looks in the specification for what a distilled title looks like finds only its length (rules/chat/distilled-title-length) and not these constraints. The code does not enforce them either, so the prompt is the only place the decision lives.
    kind: unstated
    correction: >-
      Give these title-shape constraints a node, for example in rules/chat/title-distillation or a new rule beside it. The prompt text then follows the node.
    node: rules/chat/title-distillation
