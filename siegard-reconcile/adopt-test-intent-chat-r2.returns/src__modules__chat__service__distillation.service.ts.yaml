findings:
  - file: src/modules/chat/service/distillation.service.ts
    where: >-
      file header comment, lines 5-7 ("They use the `env.CHAT_UTILITY_MODEL` Anthropic model (default `claude-haiku-4-5`)")
    evidence: >-
      // `env.CHAT_UTILITY_MODEL` Anthropic model (default `claude-haiku-4-5`) via
    cost: >-
      The default utility model is named a second time in prose. The running default is `CHAT_UTILITY_MODEL: z.string().min(1).default("claude-haiku-4-5")` in backend/src/config/env.ts. If the node or that default moves, this comment still names the old model, and a reader of this file takes it for the decision.
    kind: restates
    correction: >-
      Remove the parenthetical default from the comment. The code that holds the default is backend/src/config/env.ts, and the node binds there.
    node: rules/chat/utility-model-default
  - file: src/modules/chat/service/distillation.service.ts
    where: >-
      docstring on SUMMARY_MAX_CHARS (lines 49-56) and step 4 of the maybeRefreshSummary docstring ("Oversize refusal (HARD CAP 2000 chars)")
    evidence: >-
      * `chat_conversation.summary_rolling`. Output longer than this is REFUSED:
    cost: >-
      The 2000-character limit on a rolling summary is stated in prose beside the code that enforces it (`if (summary_new.length > SUMMARY_MAX_CHARS)`). The prose can drift from the constant and from the candidate node, and nothing reads it.
    kind: restates
    correction: >-
      Remove the docstring and the step-4 prose. The constant and the guard in this file already hold the fact.
    node: rules/chat/rolling-summary-length
  - file: src/modules/chat/service/distillation.service.ts
    where: >-
      maybeDistillTitle docstring step 5 ("Trim; if empty OR length > 80: silently drop (BR-34 step 5)") and the comment above the guard ("The model is expected to obey the 80-char ceiling")
    evidence: >-
      *   5. Trim; if empty OR length > 80: silently drop (BR-34 step 5).
    cost: >-
      The 80-character title limit is repeated in prose beside `TITLE_MAX_LENGTH = 80` and the guard `candidate.length > TITLE_MAX_LENGTH`. The comment and the constant can disagree without anything noticing.
    kind: restates
    correction: >-
      Remove the docstring step and the comment. The constant and the guard hold the fact.
    node: rules/chat/distilled-title-length
  - file: src/modules/chat/service/distillation.service.ts
    where: >-
      constants SUMMARY_MAX_TOKENS and TITLE_MAX_TOKENS, lines 146-147
    evidence: >-
      const SUMMARY_MAX_TOKENS = 600;
      const TITLE_MAX_TOKENS = 64;
    cost: >-
      These are output ceilings the code applies to every summary refold and every title distillation. I found no node holding either value, so they sit only in this file. A reader looking in the specification for how much the utility model may emit will not find them. A summary that hits the ceiling is cut before the 2000-character check sees it.
    kind: unstated
    correction: >-
      The analysis should decide whether these ceilings are domain facts. If they are, a node needs to hold them. Likely homes are the chat summary-prompt-version and title-prompt rules, or the rolling-summary and distilled-title rules.

