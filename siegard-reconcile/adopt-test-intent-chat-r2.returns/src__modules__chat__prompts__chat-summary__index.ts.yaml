findings:
  - file: src/modules/chat/prompts/chat-summary/index.ts
    where: >-
      the header comment, lines 14-19 (item 2, "Boot-time fast failure"), above
      selectChatSummaryPromptModule
    evidence: >-
      an unknown `CHAT_SUMMARY_PROMPT_VERSION` is a configuration error, NEVER a silent fallback.
      `selectChatSummaryPromptModule` throws `UnknownChatSummaryPromptVersionError`
    cost: >-
      The comment restates the rule that the summary prompt version must be one the system holds.
      That rule is already held by the node and by the code in this file, which throws when
      `REGISTRY[promptVersion]` is undefined. The comment is a second home for the rule outside
      behavior. When the node moves, nothing reaches the comment, and a reader may trust either
      the comment or the node.
    kind: restates
    correction: >-
      Remove the prose. The rule stays held by the throw in selectChatSummaryPromptModule and by
      the node. The prose route removes it; this is not an edit to behavior.
    node: rules/chat/summary-prompt-version-known
  - file: src/modules/chat/prompts/chat-summary/index.ts
    where: >-
      the header comment lines 21-23 ("`v2` is the incremental fold ... default") and the
      docblock lines 56-61 ("Recommended default for NEW deployments — used when env is unset")
    evidence: >-
      `v2` is the incremental fold (BR-46, default — selected by BR-33 v2.9).
      and
      Recommended default for NEW deployments — used when env is unset. v2.9
      makes `v2` the default (incremental fold).
    cost: >-
      The default summary prompt version is stated in prose beside the constant
      `DEFAULT_CHAT_SUMMARY_PROMPT_VERSION = v2.PROMPT_VERSION`, which already holds it. If the
      default changes in the node or in the constant, the comments keep saying v2.
    kind: restates
    correction: >-
      Remove the prose. The default stays held by the constant and by the node.
    node: rules/chat/default-summary-prompt-version
