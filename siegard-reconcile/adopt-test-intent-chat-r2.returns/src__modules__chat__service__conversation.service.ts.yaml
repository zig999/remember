    where: >-
      the docblock of getConversation, lines 184-188
    evidence: >-
      * return to `ConversationNotFoundError`, which the route handler renders as
      * 404 `RESOURCE_NOT_FOUND`.
    cost: >-
      The comment restates the 404 and RESOURCE_NOT_FOUND answer for a missing conversation. Code
      holds that answer in src/modules/chat/service/errors.ts
      (`public readonly code = "RESOURCE_NOT_FOUND" as const`) and in
      src/modules/chat/routes/conversations.routes.ts (`message: "conversation not found"`). This
      file only throws the error, so the comment is a second home for a fact held elsewhere.
    kind: restates
    correction: >-
      Remove the prose. The throw of `ConversationNotFoundError` is the code here, and the answer
      is held in errors.ts and the routes.
    node: contracts/chat/conversations
