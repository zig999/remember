findings:
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      Step 5 of directedIngestionService, the catch around resolveAffectedNodes (about lines 767-787)
    evidence: >-
      let resolvedAffected: readonly AffectedNode[] = [];
      ... catch (err) { deps.logger.warn({ ... event: "directed_ingestion_affected_nodes_resolution_failed" ... }); // resolvedAffected stays []; the run is still completed. }
    cost: >-
      When the affected-nodes read fails, the caller still receives outcome "ingested" with an empty
      `affected_nodes` list, which looks the same as a run that touched no node. The ingestion contract
      says the answer carries "the completed run with its affected nodes" and names no such fallback. The
      rule is held only in this catch block, so a reader of the specification will not find it. The
      chat's prompt rule for "a completed run lists no affected nodes" would then be triggered by a read
      failure.
    kind: unstated
    correction: >-
      Give the ingest-directed answer in contracts/knowledge-base/ingestion a node stating what it
      reports when the affected nodes cannot be read, or state that the failure is surfaced.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      closeRunCompletedSafe (about lines 1006-1034), together with the hardcoded `status: "completed"` in the result (about line 817)
    evidence: >-
      catch (err) { try { await client.query("ROLLBACK"); } catch { /* swallow */ } logger.warn({ ... event: "directed_ingestion_close_failed" ... }) }
      and, in the result, `status: "completed",`
    cost: >-
      If flipping the run row to completed fails, the code only logs a warning. The answer still reports
      the run as `status: "completed"`, while the stored run may stay open. The node
      rules/knowledge-base/directed-run-completes says the run completes whatever the items' statuses,
      and says nothing about a failure to close it. The behaviour lives only in this helper.
    kind: unstated
    correction: >-
      State in a node on the ingest-directed answer what is reported when closing the run fails.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/directed-ingestion.service.ts
    where: >-
      readClosedRunSafe fallback and the null finished_at branch (about lines 1050-1075)
    evidence: >-
      const fallback = { started_at: new Date(0).toISOString(), finished_at: new Date(0).toISOString(), attempts: 1, };
      and `row.finished_at === null ? new Date(0).toISOString() : row.finished_at.toISOString()`
    cost: >-
      The answer's completed run can carry the 1970 epoch as its start and finish times, and an `attempts`
      of 1, when the run row is missing, unreadable or has no finish time. These are invented values that
      read as real timestamps and attempt counts. The ingestion contract says the answer carries "the
      completed run" and no node holds these placeholders, so the next reader will not find them in the
      specification.
    kind: unstated
    correction: >-
      Decide in the ingest-directed answer what the run block reports when the closed run cannot be read,
      for example null values or a refusal. Do not use an epoch date as a stand-in for a real time.
    node: contracts/knowledge-base/ingestion
