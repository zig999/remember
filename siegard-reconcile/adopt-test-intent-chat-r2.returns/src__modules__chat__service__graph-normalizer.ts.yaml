    where: >-
      header comment lines 40-42, and JSDoc step 5 at lines 444-448
    evidence: >-
      // every tool call. A guard miss returns an empty delta (`{nodes:[], links:[]}`)
      // rather than throwing, so a broken tool result never crashes the SSE stream.
    cost: >-
