      `if (!GRAPH_TOOL_NAMES.has(toolName)) { return Promise.resolve(null); }` branch. A
      second statement of the rule in a comment is left to go stale. The next reader may take
      it for the place the rule lives.
    kind: restates
    correction: >-
      Remove the comment. The node and the code already hold the fact.
    node: rules/chat/graph-delta-absent-for-catalog-history-provenance
