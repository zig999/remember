    kind: restates
    correction: >-
      Remove the comments.
    node: rules/chat/graph-delta-link-label
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      `normalizeSearch`, the `seen` set and the `ids` loop at lines 346-358
    evidence: >-
      // principle surface the same node twice via different layers — we emit
      // each node exactly once, in its FIRST appearance order).
      ...
      if (seen.has(item.id)) continue;
    cost: >-
      The code applies a rule of its own: a node that search surfaces more than once enters the
      delta once, at its first position. `graph-delta-content` says only "the nodes search found in
      search order". The next reader looks in the specification for what a repeated node does and
      finds nothing, so the code is the only place the rule lives.
    kind: unstated
    correction: >-
      `analyse` should state in `rules/chat/graph-delta-content`, or in a rule of its own, that
      a node search found more than once enters the graph delta once, in the order it was first
      found.
    node: rules/chat/graph-delta-content
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      comment at lines 379-381 inside `normalizeSearch`
    evidence: >-
      // If `byId.get(id)` is undefined, the node was deleted between the
      // search and the hydration (rare race) — we just drop it.
    cost: >-
      The prose restates the vanished-node rule. The code holds it in
      `if (node !== undefined) nodes.push(node);`. The comment adds a claim about the front-end
      ("never knew about it") that the file does not enforce.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/chat/graph-delta-search-drops-vanished-node
