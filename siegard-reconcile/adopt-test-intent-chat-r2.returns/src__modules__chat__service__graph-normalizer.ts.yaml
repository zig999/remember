    node: rules/chat/graph-delta-directed-links-bare
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      comment at line 479 inside `normalizeIngestDirected`
    evidence: >-
      // Forced: directed items are stated-by-construction (BR-43 v2.8).
      status: "active",
    cost: >-
      The comment restates a rule the code holds in `status: "active"`. It also gives a
      justification, extending the rule to merged and deleted statuses, which no node records.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/chat/graph-delta-directed-nodes-active
  - file: src/modules/chat/service/graph-normalizer.ts
    where: >-
      link branch of `normalizeIngestDirected`, lines 507-517
    evidence: >-
      const first = entry.ref.indexOf("->");
      const last = entry.ref.lastIndexOf("->");
      ...
      const link_type = entry.ref.slice(first + 2, last);
    cost: >-
      The code relies on a link item's `ref` being the text "<source_ref>-><link_type>-><target_ref>"
      and takes the link type and both endpoints from it. No node states that format.
      `domain/knowledge-base/directed-item` says only that `ref` is a string.
      `directed-reference-length` says only that it holds 1 to 120 characters.
      If the report's side changes the format, links are dropped here without any sign.
    kind: unstated
    correction: >-
      `analyse` should state in `domain/knowledge-base/directed-item` the form of a link item's
      reference, or the rule that fixes it, so the producer and this parser answer to one node.
    node: domain/knowledge-base/directed-item
