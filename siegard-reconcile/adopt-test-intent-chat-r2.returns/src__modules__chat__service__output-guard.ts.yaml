findings:
  - file: src/modules/chat/service/output-guard.ts
    where: >-
      the file header comment (lines 1-26), the docblocks on MARKER_VERSION, OutputGuardDecision and inspectDelta (lines 32-57), and the inline comments at lines 59-60 and 62-63
    evidence: >-
      "// Purpose: before the agentic loop yields a `ChatEvent.text_delta`, it asks
      // the guard "is the system-prompt marker present in this delta?". If yes, the
      // delta is dropped — not yielded, not aggregated into the assistant turn that
      // will be fed back on the next iteration."
    cost: >-
      The comments say again, as prose, that assistant text carrying the system prompt's marker is neither streamed nor kept. Code already holds this at `if (delta.length > 0 && delta.includes(CHAT_PROMPT_MARKER_V1))` followed by `return { drop: true };`. The comments also cite "chat.back.md BR-20" as the authority. If rules/chat/assistant-text-withholds-system-prompt changes, these comments keep stating the old rule, and a reader who trusts them takes the prose for the decision.
    kind: restates
    correction: >-
      Remove the comments. The comment route applies, followed by /reconcile over this file. The behavior is correct and the fact is already held by the node, so nothing in the code or the specification changes.
    node: rules/chat/assistant-text-withholds-system-prompt
