findings:
  - file: src/modules/chat/routes/chat.schemas.ts
    where: >-
      buildChatTurnRequestSchema and ChatMessageSchema, lines 5-37
    evidence: >-
      content: z.string().min(1, "content must be a non-empty string") ... .array(ChatMessageSchema).min(1, "messages must contain at least 1 entry").max(opts.maxHistoryMessages, `messages must contain at most ${opts.maxHistoryMessages} entries`) ... .refine((v) => v.messages[0]?.role === "user", { message: "first message must have role=user", path: ["messages", 0, "role"] })
    cost: >-
      The file declares a request shape in which the caller supplies its own message history. The history must hold at least one entry and a configured maximum, and it must start with a user message. No node in the specification states this. The send-message operation in contracts/chat/conversations takes a single `content` and an optional `model`, and the context window comes from rules/chat/model-context-window. The next reader will look in the specification for these limits and the first-role rule and find nothing, and the code becomes the only place they are decided. In the tree, the builder is declared in this file and is not called anywhere else.
    kind: unstated
    correction: >-
      Either the analysis gives the history-bearing turn request a node that states its minimum, maximum and first-role rule, or the declaration is removed if the specification does not intend it.
