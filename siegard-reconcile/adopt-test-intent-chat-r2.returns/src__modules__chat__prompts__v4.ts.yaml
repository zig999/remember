    kind: restates
    correction: >-
      Remove the comment. BLOCK_4C_DIRECTED_INGESTION item 5 holds the fact.
    node: rules/chat/chat-prompt-v4-reports-each-item
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      header comment, lines 24-27 (Block 4C item 5)
    evidence: >-
      //       (5) NO auto-loop — each command is a single `ingest_directed` call
