findings:
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      header comment, lines 8-12 (Block 4C item 1)
    evidence: >-
      //       (1) `ingest_directed` is the SINGLE write-bearing entry from chat,
      //           used ONLY on explicit Owner request (signal phrases:
    cost: >-
      The same fact (directed ingestion is the assistant's only way to write) sits in a second home outside behavior. The code holds it in BLOCK_4C_DIRECTED_INGESTION ("`ingest_directed` e a UNICA ferramenta de escrita disponivel no chat"). The next reader can take the comment for the place the rule lives, and it can drift from the node.
    kind: restates
    correction: >-
      Remove the comment. The prompt text in BLOCK_4C_DIRECTED_INGESTION is the code that holds the fact.
    node: rules/chat/chat-prompt-v4-directed-ingestion-writes
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      header comment, lines 14-17 (Block 4C item 2)
    evidence: >-
      //       (2) the model emits a typed payload with `ref` strings LOCAL to the
      //           call (`fragments[]`/`nodes[]`/`attributes[]`/`links[]`) and MAY
      //           use the `node_id` pin on a node item to re-affirm a known entity
      //           it just retrieved via `query`;
    cost: >-
      The pin rule is restated in prose while the emitted prompt already holds it (item 2: "isso e um PIN: bypassa a resolucao fuzzy"). Two homes for one fact leave the node's binding unclear about which one was decided.
    kind: restates
    correction: >-
      Remove the comment. BLOCK_4C_DIRECTED_INGESTION item 2 holds the fact.
    node: rules/chat/chat-prompt-v4-pins-known-entity
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      header comment, lines 18-20 (Block 4C item 3)
    evidence: >-
      //       (3) when a temporal link/attribute REQUIRES `valid_from` and the
      //           Owner did NOT state a date, the model MUST ASK the Owner — never
      //           silently fall back to the `received` basis;
    cost: >-
      The ask-the-owner-for-a-start-date rule is repeated in a comment although the prompt text holds it (item 3: "voce DEVE perguntar a data ao dono ANTES de chamar `ingest_directed`"). A change to the node reaches the code and leaves the comment stating the old rule.
    kind: restates
    correction: >-
      Remove the comment. BLOCK_4C_DIRECTED_INGESTION item 3 holds the fact.
    node: rules/chat/chat-prompt-v4-asks-start-date
