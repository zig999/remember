    node: rules/chat/chat-prompt-v4-one-ingestion-per-command
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      header comment, lines 28-32 (preserved post-ingestion playbook)
    evidence: >-
      //     The v3 post-ingestion playbook (`affected_nodes` → `get_node` /
      //     `traverse`; one-name-per-`search` fallback) is PRESERVED INSIDE
      //     block 4C for the case where the Owner asks about prior ingestions —
    cost: >-
      The affected-nodes-first rule and its fallback are summarized in a comment, while the prompt text holds them in PLAYBOOK POS-INGESTAO items 1, 1.a and 1.b. The summary is a second home, and it is looser than the node (the node's fallback is by node type).
    kind: restates
    correction: >-
      Remove the comment. The PLAYBOOK POS-INGESTAO text in BLOCK_4C_DIRECTED_INGESTION holds the facts.
    node: rules/chat/chat-prompt-affected-nodes-first
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      BLOCK_4C_DIRECTED_INGESTION, opening paragraph, lines 100-104
    evidence: >-
      "esta playbook quando — e SOMENTE quando — o dono pedir explicitamente",
      "para registrar conhecimento novo. Frases de gatilho tipicas: \"crie\",",
      "\"registre\", \"linke\", \"ingerir esta informacao\". Se nao houver",
    cost: >-
      The prompt fixes four trigger phrases for what counts as an explicit owner request to record. No node lists them; the node holds only the gate itself. The next reader looks for the phrases in the specification, finds none, and cannot tell whether they were decided or are illustrative.
    kind: unstated
    correction: >-
      Give the signal phrases a home in the specification, in rules/chat/assistant-writes-only-on-owner-request or a node beside it. Otherwise the prompt should drop the list and keep the gate.
    node: rules/chat/assistant-writes-only-on-owner-request
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      BLOCK_4C_DIRECTED_INGESTION, PLAYBOOK POS-INGESTAO item 1.a, lines 157-159
    evidence: >-
      "   a. Quando `affected_nodes` estiver presente e nao-vazio, use os ids",
      "      diretamente em `get_node(id)` e/ou `traverse(start_node_id=id,",
      "      depth=2)`. Descreva APENAS o que essas chamadas retornaram.",
    cost: >-
      The prompt fixes the traversal depth at 2 for reading a run's affected nodes. The node says only "traverse from it directly" and gives no depth, so the depth is a value that lives only in the prompt.
    kind: unstated
    correction: >-
      Either state the depth in the node or drop it from the prompt text.
    node: rules/chat/chat-prompt-affected-nodes-first
  - file: src/modules/chat/prompts/v4.ts
    where: >-
      BLOCK_4C_DIRECTED_INGESTION, PLAYBOOK POS-INGESTAO item 2, lines 166-168
    evidence: >-
      "2. Cite a fonte: o campo `raw_information_id` retornado por",
      "   `ingest_directed` identifica o documento sintetizado — mencione-o",
      "   ao dono.",
    cost: >-
      The prompt requires the assistant to name the raw information identity of a directed ingestion to the owner. No node in the v4 prompt family holds this. The only citation rule (rules/chat/chat-prompt-v1-cites-sources) is bound to the v1 prompt and says nothing about this identity.
    kind: unstated
    correction: >-
      Give the post-ingestion citation directive a node, or drop it from the prompt.

