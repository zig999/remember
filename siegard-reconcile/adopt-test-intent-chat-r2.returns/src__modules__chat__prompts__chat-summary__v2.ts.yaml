findings:
  - file: src/modules/chat/prompts/chat-summary/v2.ts
    where: >-
      the JSDoc on `system` (lines 27-39), the persona and "Stay at most ~8 sentences" bullets
    evidence: >-
      * System prompt body for v2 (BR-46). Persona = "Sintetizador da conversa do
      Remember". ... - Stay at most ~8 sentences (soft cap — BFF enforces 2000-char HARD cap);
    cost: >-
      The persona and the eight-sentence ceiling are stated a second time in prose that no running
      system emits. The literal `system` below it holds the fact. When the node moves, the docstring
      is not bound and keeps saying the old value, so a reader sees two answers and cannot tell
      which was decided.
    kind: restates
    correction: >-
      Remove the docstring. The fact is already held by the `system` literal in this file and by the
      node. Use the comment route, then run /reconcile over the file.
    node: rules/chat/summary-prompt-v2-persona
  - file: src/modules/chat/prompts/chat-summary/v2.ts
    where: >-
      the comment block above `buildUserTurn` (lines 77-78), the template line for the previous summary
    evidence: >-
      //   <summary_prev OR "(vazio)" when null>
    cost: >-
      The "(vazio)" placeholder is stated a second time as a comment. The code holds it in
      `renderPrev` (`if (summary_prev === null) return "(vazio)";`). If the node's value changes,
      the comment keeps the old one and reads as authoritative.
    kind: restates
    correction: >-
      Remove the comment. `renderPrev` in this file holds the fact. Use the comment route, then
      run /reconcile over the file.
    node: rules/chat/summary-prompt-v2-empty-previous
  - file: src/modules/chat/prompts/chat-summary/v2.ts
    where: >-
      `buildUserTurn`, the `messagesBlock` constant (lines 198-201)
    evidence: >-
      new_messages.length === 0
            ? "(nenhuma)"
    cost: >-
      The text shown to the model when the slice of new messages is empty is a value the code
      applies and no node holds. The sibling placeholder "(vazio)" has a node and this one has
      none. The next reader looks in the specification for what the model is shown for an empty
      slice and finds only "(vazio)".
    kind: unstated
    correction: >-
      The analysis should give the "(nenhuma)" placeholder for an empty slice of new messages a
      node, next to rules/chat/summary-prompt-v2-empty-previous. It is not a candidate: no node I
      found holds it.
  - file: src/modules/chat/prompts/chat-summary/v2.ts
    where: >-
      `TOOL_ARGS_INLINE_MAX` and `summariseToolUseArgs` (lines 96-115)
    evidence: >-
      const TOOL_ARGS_INLINE_MAX = 200;
      ...
        return serialised.slice(0, TOOL_ARGS_INLINE_MAX) + "...<truncated>";
    cost: >-
      A 200-character cut on the tool arguments shown to the summariser, and the "...<truncated>"
      marker, are thresholds the code applies and no node holds. The tool-result limit
      (rules/chat/tool-result-truncated, 8000) governs a different subject, so a reader looking
      for this limit in the specification finds nothing.
    kind: unstated
    correction: >-
      The analysis should give the cap on tool arguments rendered into the summary slice a node
      in the chat domain.
  - file: src/modules/chat/prompts/chat-summary/v2.ts
    where: >-
      the `system` literal, the preserve/fold list (lines 49-53)
    evidence: >-
      "- pontos em aberto — marcar explicitamente como 'pendente: ...';",
    cost: >-
      The rule that unresolved questions are marked with the literal "pendente: ..." is emitted to
      the model and shapes the stored summary the owner reads. No node holds it, since the persona
      node covers only the persona, pt-BR and the eight-sentence ceiling. The convention lives
      only in the prompt text.
    kind: unstated
    correction: >-
      The analysis should decide whether the summary-prompt-v2 instructions (the "pendente:"
      marker for open points, preserving entities and decisions, no headings or bullets) belong
      in a node, next to rules/chat/summary-prompt-v2-persona.
