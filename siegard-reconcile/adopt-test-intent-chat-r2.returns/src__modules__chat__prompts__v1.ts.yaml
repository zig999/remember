findings:
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      the header comment, lines 9-14
    evidence: >-
      chat.spec.md §4 BR-18 (required content: entities, temporal axes,
      confidence flag, resolve-before-call, never-invent-ids, citation,
      pt-BR response, data-not-instruction, no-stack-trace).
    cost: >-
      The comment lists the facts the prompt must carry, among them never inventing identifiers and citing the source, as a second statement of them. The emitted prompt text in this file already holds those two. The next reader may take the comment, not the node, as the place that lists them.
    kind: restates
    correction: >-
      Remove the comment. The prompt text at lines 64-70 holds the fact, and the node is bound to this file.
    node: rules/chat/chat-prompt-v1-cites-sources
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      CHAT_PROMPT_MARKER_V1, line 35, planted at the head of the prompt at line 52
    evidence: >-
      export const CHAT_PROMPT_MARKER_V1 = "__REMEMBER_CHAT_SYS_MARKER_V1__" as const;
    cost: >-
      The literal token the output guard scrubs for exists only in this source. The node rules/chat/chat-prompt-carries-marker says every version begins with "the one system-prompt marker" and never states its value. A reader looking in the specification for what the guard detects will not find it.
    kind: unstated
    correction: >-
      Analysis would have to give the marker's value a node, or amend rules/chat/chat-prompt-carries-marker to state it.
    node: rules/chat/chat-prompt-carries-marker
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      principle 5 of the emitted prompt, lines 71-74
    evidence: >-
      "5. RESPEITE OS EIXOS TEMPORAIS. O grafo distingue eixo de validade",
      "   (`valid_from`/`valid_to`) do eixo de transacao (`recorded_at`/",
      "   `superseded_at`). Quando o usuario perguntar sobre uma data, use",
      "   `get_history_*` para responder com precisao.",
    cost: >-
      The prompt tells the assistant which tool answers a dated question and how the two time axes differ. No node in the specification holds this instruction. The tool the assistant uses for date questions is decided only in this prompt text.
    kind: unstated
    correction: >-
      Analysis would have to give the temporal-axes instruction a node under the chat prompt rules, or drop it from the prompt.
  - file: src/modules/chat/prompts/v1.ts
    where: >-
      principle 8 of the emitted prompt, lines 81-82
    evidence: >-
      "8. Seja conciso. Prefira respostas curtas e diretas; agrupe varios",
      "   itens em listas quando apropriado.",
    cost: >-
      The answer style the assistant is told to follow is held by no node. A change to it would happen only in this file, where the next reader will not look for it.
    kind: unstated
    correction: >-
      Analysis would have to give the answer-style instruction a node, or drop it from the prompt.
