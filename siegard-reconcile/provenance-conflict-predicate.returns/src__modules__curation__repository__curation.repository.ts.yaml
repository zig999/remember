findings:
  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the inline literal unions typing valid_from_source in ItemLockedRow (line 154),
      CorrectionMutationArgs (line 365), DisputedLinkRow (line 739) and DisputedAttributeRow (line 788)
    evidence: >-
      readonly valid_from_source: "stated" | "document" | "received" | null;
      (the same file also imports the vocabulary as a type, `ValidFromSource` from "../dto/enums.dto.js",
      and uses it in `readonly validFromSource: ValidFromSource | null;` at NewAttributeArgs)
    cost: >-
      The vocabulary of what justifies a validity start is written out four times in this file
      beside the imported type that already names it. The node domain/knowledge-base/valid-from-basis
      is not bound to this file. If the node gains or renames a value, `--check` never reaches these
      declarations, and the next reader cannot tell which spelling was decided.
    kind: contradicts
    correction: >-
      Type the four members with the imported ValidFromSource instead of a second literal union,
      so the vocabulary has one declaration, in the file the node is bound to.
    node: domain/knowledge-base/valid-from-basis
