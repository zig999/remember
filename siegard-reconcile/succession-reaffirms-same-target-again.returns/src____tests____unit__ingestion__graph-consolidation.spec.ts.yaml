findings:
  - file: src/__tests__/unit/ingestion/graph-consolidation.spec.ts
    where: >-
      the comment above the first consolidated test (lines 528-529), the "Bug / Fix" comment block (lines 605-620) and the attribute test title at line 1045
    evidence: >-
      // BR-27 step (a): vigent row exists; same target; same valid_from;
      // change_hint='none' -> no new row, only provenance.
      ... "Fix: for multi-current types, recognize re-affirmation by `sameTarget && change_hint === 'none'` WITHOUT requiring `sameValidFrom`."
      ... it("consolidated — same (node, key, value, valid_from)"
    cost: >-
      The comments and the title say a re-affirmation depends on the same validity start, or only on same target with hint none for multi-current types. The node says it holds "whatever validity start it states" for hint none or succession. The test code at lines 626-661, 663-693 and 695-724 already holds the node's rule, so the prose is a second, narrower statement of it. A reader who finds the comment first will take the same-start condition as the rule and look for it in the code instead of in the specification.
    kind: restates
    correction: >-
      Remove the comments at lines 528-529 and 605-625. The test names and assertions already carry the behavior. The node binds the fact, and the code that holds it is the tests at 626-724 plus the consolidation service the candidate index binds.
    node: rules/knowledge-base/reaffirmation-consolidates
  - file: src/__tests__/unit/ingestion/graph-consolidation.spec.ts
    where: >-
      the comment above the disputed link test (lines 867-868)
    evidence: >-
      // BR-27 step (d): functional vigent row exists; different target; overlapping
      // period; no signal -> mark BOTH disputed.
    cost: >-
      The comment restates the dispute rule and adds an "overlapping period" condition the node does not hold. The node only requires a type that does not allow multiple current assertions and a proposal that meets the current assertion as a dispute. The assertions at lines 894-901 hold the outcome (old row disputed, new row disputed, supersedes nothing). A reader who trusts the comment will believe the specification makes overlap a condition of a dispute.
    kind: restates
    correction: >-
      Remove the comment. The assertions already hold the dispute outcome, and the node binds it.
    node: rules/knowledge-base/conflict-disputes
  - file: src/__tests__/unit/ingestion/graph-consolidation.spec.ts
    where: >-
      the comment inside the first consolidated test (line 553) and the comment on the multi-current test (line 656)
    evidence: >-
      // Provenance MUST still be inserted (BR-18) — re-affirmation accumulates.
      ... // Provenance accumulated on the vigent link (BR-18).
    cost: >-
      The comments restate that a taken proposal records provenance on the assertion it lands on. The assertions at lines 554-555 and 657-658 already hold that, so the sentence has two homes. When the node moves, the file stays unbound by the prose and nothing would flag the comment.
    kind: restates
    correction: >-
      Remove the comments. The assertions on state.inserts.provenance and its target_id hold the fact.
    node: rules/knowledge-base/consolidation-records-provenance
