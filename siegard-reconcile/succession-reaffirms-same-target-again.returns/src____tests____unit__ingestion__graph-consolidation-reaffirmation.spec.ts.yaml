looked_past: >-
  The correction, succession-signal and current-assertion behaviors the test also pins are held by nodes outside the set (rules/knowledge-base/correction-replaces, succession-signal, current-assertion, new-assertion), and the test restates them as expectations only, not as an authority. The test also feeds correction proposals NEUTRAL_TEXTS, which have no errata evidence, directly to the consolidation service, and that is a question for the correction-evidence rules and not for this pass.
