findings:
  - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
    where: >-
      the CORRECTED expectation (line 889), used by the precedence rows "correction before succession", "correction before dispute" and "correction before new assertion on a type allowing multiple current assertions"
    evidence: >-
      const CORRECTED: Taken = { outcome: "accepted", on_held: false, held_statuses: ["superseded"], new_assertions: 1, };
    cost: >-
      The test fixes which outcome word a correction proposal gets: "accepted", the same word as a new assertion, and not "superseded_previous". The ingestion contract lists the outcomes (consolidated; accepted; superseded_previous with the superseded identity; disputed). rules/knowledge-base/correction-replaces says what a correction does (supersedes the assertion, keeps its validity end, records a new assertion naming it) and says nothing about its outcome word. No node says which branch answers with which word. The mapping now lives only in this test and in the service, so a reader looking in the specification for the outcome of a correction finds nothing.
    kind: unstated
    correction: >-
      The analysis that owns the propose-link and propose-attribute answers would need to state which outcome a correction, a succession and a new assertion each carry. Nothing in this file changes.
    node: contracts/knowledge-base/ingestion
