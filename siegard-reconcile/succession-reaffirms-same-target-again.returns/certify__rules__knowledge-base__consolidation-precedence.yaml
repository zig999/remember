certified:
  - node: rules/knowledge-base/consolidation-precedence
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: takes a proposal as the first of re-affirmation, correction, succession, dispute and new assertion whose condition it meets
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: adds the provenance of the proposal and changes nothing else about the assertion, for every kind, every multiplicity and whatever validity start the proposal states
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: supersedes the held link, leaves its validity end and records a new link naming it, when its change hint is correction
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: is answered as a dispute when no cited fragment signals succession
    why: >-
      The order is checked by one table, PRECEDENCE, for both links and attributes and for both
      multiplicities. Where two branch conditions overlap, the table gives a proposal that meets
      both and asserts the outcome observed on the stored rows. The overlaps are: re-affirmation
      before succession, by hint and by signal; re-affirmation before new assertion; correction
      before succession, before dispute and before new assertion; succession, by hint and by
      signal, before dispute; and dispute before new assertion. It also checks that a proposal
      falls through to new assertion when nothing is current. Swapping any of those pairs makes
      a row come out wrong, so the test would fail.

      One reading that a reader should route: the test treats re-affirmation as met only under
      change hint none or succession (HINTS_OF_REAFFIRMATION). The correction test above then
      asserts that a correction with the same target or value is taken as a correction, not a
      re-affirmation. That agrees with this node only if the re-affirmation condition excludes
      change hint correction. This node does not state the condition, and the pack gave no node
      that does, so I did not check it.

      No row gives a succession hint with another target on a type that allows multiple current
      assertions. The meeting test shows such a proposal meets no current assertion, so it does
      not test the order between succession and new assertion. The test observes rows through
      the world fixture in reaffirm-consolidation-world.js. The pack let me open nothing else,
      so I read that fixture's write log as what was stored, without confirming it.
