certified:
  - node: rules/knowledge-base/proposal-meets-current-assertion
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: is the one of its node and type, or the one of its node, type and target or value where the type allows multiple current assertions, and no other
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: meets a held link or attribute as current only while it has neither a validity end nor a supersession time
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: answers a same-value proposal with another start as consolidated on an attribute key that allows multiple current values
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: answers the proposal as consolidated, carrying the identity of the held attribute
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: marks that assertion disputed and records a new assertion in status disputed that supersedes nothing, for a link and for an attribute
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: is answered as a dispute when no cited fragment signals succession
    why: >-
      The half for types that allow one current assertion is exercised whole.
      The meetings table seeds a held link or attribute that differs from the
      proposal in its node, its type or key, or its target or value. A proposal
      for another target or value is taken as a dispute on the held assertion.
      A proposal for another node or another type is taken as a new assertion.
      So leaving node or type out of the matching key, or adding target or value
      to it, would fail the table.

      The half for types that allow multiple current assertions is exercised
      only against a world that holds one current assertion, and only with
      change hint none. Its fact is that target or value is part of what is
      matched. If the code matched on node and type alone, the hint-none
      proposals in the table would land the same way: same value consolidates,
      and another value is a new assertion because no dispute applies to such
      a type. Two kinds of input would tell the two apart, and nothing in the
      file uses either:
      (1) a world that holds two current assertions under one node and one
      multi-valued type, with a proposal that repeats the second;
      (2) a correction or succession that names another target or value on a
      multi-valued type. The correction precedence row uses the same value only,
      and the succession rows cover one-current types only.
      So on a multi-valued type, the claim that a proposal meets the assertion
      with its own target or value, and not some other current one, goes
      unexercised.
    remainder: testable
    remainder_why: >-
      Seed two current assertions under one node and one multi-valued link type
      or attribute key: targets B and C for a link, or values alpha and beta for
      an attribute. Propose the second target or value with change hint none.
      The expected result is consolidated, carrying the identity of that second
      assertion, with no new assertion recorded.
      Also seed one current assertion with value alpha on a multi-valued key
      and propose value beta with change hint correction. The expected result
      is that the held alpha assertion is not superseded.
