certified:
  - node: rules/knowledge-base/consolidation-records-provenance
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: records, on the assertion a taken proposal lands on, one provenance for each fragment it cites, in every branch of the consolidation order
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: adds a second cited fragment once and the already-held one not again when the held link is re-cited
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: adds a second cited fragment once and the already-held one not again when the held attribute is re-cited
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: holds one provenance for each fragment it cites and none again for a fragment the link already holds
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: holds one provenance for each fragment it cites and none again for a fragment the attribute already holds
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: adds the provenance of the proposal and changes nothing else about the assertion, for every kind, every multiplicity and whatever validity start the proposal states
    why: >-
      Covered. The first test sends a link proposal and an attribute proposal that each cite two
      fragments down six paths: new assertion, re-affirmation, re-affirmation by succession,
      correction, succession and dispute. In each case it checks that the assertion the proposal
      landed on, found through the identity the call returns, holds exactly those two fragments,
      no more and no fewer. So it would fail if any of those paths recorded no provenance, wrote it
      on a different assertion, or wrote a duplicate. The four re-citation tests confirm that
      "one" still holds when the assertion already has a cited fragment. The matrix test covers
      re-affirmation on keys that allow several current values. Two taken paths are not checked
      for provenance on their own. The first is succession signalled by the fragment text rather
      than by the change hint. The second is correction on a type that allows several current
      assertions. Each reaches an outcome the first test does check by another route. The
      provenance the tests read comes from the in-memory world in reaffirm-consolidation-world.js.
      The pack did not offer that file, so it was not opened. Every assertion above relies on it
      faithfully recording what the service writes.
