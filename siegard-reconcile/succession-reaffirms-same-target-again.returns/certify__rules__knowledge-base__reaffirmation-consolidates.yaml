        name: "takes a proposal as the first of re-affirmation, correction, succession, dispute and new assertion whose condition it meets"
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: "is the one of its node and type, or the one of its node, type and target or value where the type allows multiple current assertions, and no other"
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: "re-affirms the link of a type allowing one current link: provenance added, no new link, not marked disputed, validity start kept"
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: "records, on the assertion a taken proposal lands on, one provenance for each fragment it cites, in every branch of the consolidation order"
      - file: src/__tests__/unit/ingestion/graph-consolidation-reaffirmation.spec.ts
        name: "meets a held link or attribute as current only while it has neither a validity end nor a supersession time"
    why: >-
      The set exercises re-affirmation with change hint none and with change hint succession, for
      links and attributes, for types allowing one and allowing several current assertions. It
      checks the consolidated outcome on the held assertion, the added provenance, that no new
      assertion is recorded and that the held row is left unwritten. It also checks that only a
      current assertion is met and that correction falls outside the rule. Two stated parts go
      unexercised.
      (1) "Whatever validity start it states": every stated start in the set is the held start, no
      start, or a start later than the held one (2024-06-01 and 2030-06-01 against 2024-01-01;
      2026-03-01 and 2030-06-01 against 2026-01-01). Nothing proposes a start earlier than the held
      start. Code that backdated the held assertion, or left re-affirmation, when the stated start
      precedes the held one would pass every test.
      (2) "Changing nothing else about the assertion" when the proposal states other fields: a
      proposal with another confidence, a validity end, the basis "received" and the status
      "uncertain" is checked for an unwritten row only on the one-current link type (leads) and
      the one-current attribute key (deadline). The cross-product test, which spans both
      multiplicities, sends only validity end null, basis "stated" and status "active". The one
      multiple-current test that sends the other fields ("answers a same-value proposal with
      another start as consolidated on an attribute key that allows multiple current values")
      checks only the outcome and identity, not that the row stays unwritten. No
      multiple-current link is sent those fields at all. So code that wrote a stated validity
      end, confidence or basis onto a multiple-current assertion it re-affirms would pass. This
      reading uses the test file alone. The behaviour of the world helper
      (reaffirm-consolidation-world.js) is taken as its call sites show it, since the pack does
      not offer that file as proof.
    remainder: testable
    remainder_why: >-
      Two assertions over the existing world would close it. First, a current link and a current
      attribute, each of a one-current and a multiple-current type, are met by a same-target or
      same-value proposal with change hint none and then succession, stating a start earlier
      than the held one. Expected for each: outcome consolidated on the held identity, the
      proposal's fragment added as provenance, no insert and no column assigned on the held row.
      Second, the same multiple-current subjects are met by a same-target or same-value proposal
      with another confidence, a validity end, the basis "received" and the status "uncertain",
      under each of the two hints. Expected for each: consolidated on the held identity, with no
      column assigned on the held row.
