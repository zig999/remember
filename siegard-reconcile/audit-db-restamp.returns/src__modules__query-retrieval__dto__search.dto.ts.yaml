findings:
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: >-
      SearchQuerySchema, lines 57-74 (keys `query`, `expand_link_types`, `limit`, `offset`)
    evidence: >-
      query: QueryString,
      expand_link_types: ExpandLinkTypesArray.optional(),
      limit: IntegerQuery.pipe(z.number().int().min(1).max(100))
      offset: IntegerQuery.pipe(z.number().int().min(0)).optional().default(0),
    cost: >-
      The node names the text attribute `text` and the link-type filter `link_types`, and nests limit and offset under `page`. This file declares the request shape with the names `query` and `expand_link_types` and with limit and offset flat. No node holds these names. A reader who searches the specification for `expand_link_types` finds nothing, and a change to the search-query attributes does not reach the wire names declared here.
    kind: contradicts
    correction: >-
      Either align the declared attribute names and nesting with the search-query and page nodes, or have the specification state the wire names and the flattening of `page` as the decided request shape.
    node: domain/knowledge-base/search-query
  - file: src/modules/query-retrieval/dto/search.dto.ts
    where: >-
      the docblock above QueryString, lines 37-47
    evidence: >-
      `query` validation per BR-04 of the back spec:
        - min 1 char (raw)
        - max 1000 chars (raw)
        - btrim non-empty after transform (rejects whitespace-only input)
    cost: >-
      The comment states the not-blank and length rules a second time as prose. The code below it holds both, so the pair conforms. The comment is a second home that will go stale when the node moves, and `--check` never reaches it.
    kind: restates
    correction: >-
      Remove the docblock. The behavior is held by `.min(1)`, `.max(1000)` and `.refine((s) => s.length > 0)` in this file.
    node: rules/knowledge-base/search-query-not-blank

