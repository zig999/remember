    cost: >-
      The hash rule is written a second time in prose. The running code that holds it is `sha256Hex`, imported from `../hash.js`. If the node moves, this comment stays behind and a reader may take it for where the rule lives.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by rules/knowledge-base/content-hash-is-sha256 and implemented by `sha256Hex` in `../hash.js`.
    node: rules/knowledge-base/content-hash-is-sha256
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      the docstring of ingestRawInformation, step 2 (line 81)
    evidence: >-
      * 2. Compute `idempotency_key = sha256(content_hash ∥ prompt_version ∥ model ∥ chunking_version)`.
    cost: >-
      The key's composition and its order are restated in prose. The code that holds them is `composeIdempotencyKey` in `../hash.js`. If either the node or that code moves, the comment disagrees silently.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by rules/knowledge-base/idempotency-key and implemented by `composeIdempotencyKey` in `../hash.js`.
    node: rules/knowledge-base/idempotency-key
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      noopExisting, the `findLlmRunByIdempotencyKey` lookup and its InvariantError (lines 215-222). The key it receives is built in ingestRawInformation from the request's prompt_version and model (lines 104-109).
    evidence: >-
      const run = await findLlmRunByIdempotencyKey(client, idempotencyKey);
      if (run === null) {
        throw new InvariantError(
          `noopExisting: raw_information ${existing.id} exists for content_hash ${contentHash} ` +
            `but no llm_run row matches idempotency_key ${idempotencyKey}. ` +
            `Database is inconsistent — BR-09 invariant violated.`
    cost: >-
      The contract says held content answers "HTTP 200 with outcome noop_existing ... and the run that raw information already has, whatever model or prompt version the request names". The code looks the run up by the key computed from the request's own model and prompt version. Re-ingesting held content under a different model or prompt version therefore finds no run and fails as an internal error, where the contract promises a 200. A request that records nothing has nothing to fail on.
    kind: contradicts
    correction: >-
      Find the run through the held raw information, not through the request's idempotency key. Do not treat a missing match on the request's key as database inconsistency.
    node: contracts/knowledge-base/ingestion

