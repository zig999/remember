findings:
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      the doc comment above insertRawChunks (lines 153-154) and the doc comment above findChunksByRawInformationId (lines 182-183)
    evidence: >-
      "Returns the inserted rows ordered by `chunk_index` ascending. That ordering
       is the contract of the calling route (the response chunk array is sorted)."
      and "Find every `raw_chunk` of the given `raw_information_id`, ordered by
       `chunk_index` ascending. Used by GET .../chunks."
    cost: >-
      The listing order is written in prose a second time. The code that holds it is `ORDER BY chunk_index ASC` in findChunksByRawInformationId and the `.sort((a, b) => a.chunk_index - b.chunk_index)` in insertRawChunks. If the node moves, these comments still assert the old order and nothing flags them.
    kind: restates
    correction: >-
      Remove the ordering sentences from both comments. The fact is held by the node and by the ORDER BY and the sort in this file.
    node: rules/knowledge-base/chunk-listing-order
read:
