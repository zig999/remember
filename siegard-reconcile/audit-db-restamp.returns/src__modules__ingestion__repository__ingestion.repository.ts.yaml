  - node: domain/knowledge-base/run-status
    held_at: >-
      the `status` member of LlmRunRow, line 72, an inline union of the enumeration's three values
    evidence: >-
      readonly status: "running" | "completed" | "failed";
  - node: rules/knowledge-base/chunk-listing-order
    held_at: >-
      the query in findChunksByRawInformationId, line 194, and the sort at the end of insertRawChunks, line 178
    evidence: >-
      WHERE raw_information_id = $1
            ORDER BY chunk_index ASC
      and return result.rows.sort((a, b) => a.chunk_index - b.chunk_index);
looked_past: >-
  The row types use physical column names (`text`, `offset_start`, `offset_end`) where the raw-chunk node names `excerpt`, `start_offset` and `end_offset`, the row types omit status, superseded_at and document_date, and comments mention DB defaults and cite TC-01/BR-34. These are column mapping and database-layer matters, not something this pass judges.
