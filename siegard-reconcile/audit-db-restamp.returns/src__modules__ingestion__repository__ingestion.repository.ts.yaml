      the LlmRunRow interface (lines 66-76), and the insertLlmRun and findLlmRunByIdempotencyKey statements
    evidence: >-
      readonly model: string; readonly prompt_version: string; readonly started_at: Date; readonly finished_at: Date | null; readonly status: "running" | "completed" | "failed"; readonly attempts: number; readonly input_raw_information_id: string; readonly idempotency_key: string;
