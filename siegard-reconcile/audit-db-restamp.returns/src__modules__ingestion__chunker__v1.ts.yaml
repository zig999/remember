  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      scanLines (lines 294-307, terminator is only `\n`) and splitEmail (line 229, `const isBlank = line.endExclusive === line.start;`)
    evidence: >-
      if (codePoints[i] === "\n") {
      const isBlank = line.endExclusive === line.start;
    cost: >-
      The code defines a line as ending at `\n` only, and a blank line as a zero-length line. A line holding only spaces, or `\r` in a CRLF email, is therefore not blank. A CRLF email's header block then never ends and its quotation changes start no blocks. No node says what a line or a blank line is, so this decision lives only in the code, where the next reader will not look for it.
    kind: unstated
    correction: >-
      Give the definition of a line break and of a blank line a node, for example in rules/knowledge-base/email-header-block, or in a node it refers to.
    node: rules/knowledge-base/email-header-block
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      SPEAKER_LINE_REGEX, line 351
    evidence: >-
      const SPEAKER_LINE_REGEX = /^\s*(?:[[(]\d{1,2}:\d{2}(?::\d{2})?[\])][\s\t]+)?[A-Za-zÀ-ÿ0-9_]+(?:\s[A-Za-zÀ-ÿ0-9_]+)?:\s/;
    cost: >-
      The node lists exactly four time stamp forms: `[h:mm]`, `[hh:mm]`, `(hh:mm)` and `(hh:mm:ss)`. The regex opens with either `[` or `(`, closes with either `]` or `)`, and allows optional seconds and a one- or two-digit hour in every combination. It therefore also accepts `[hh:mm:ss]`, `(h:mm)` and mismatched pairs such as `[12:00)`. The node says words of "letters", but the regex restricts letters to A-Za-z and the range À-ÿ. That range includes the non-letters U+00D7 and U+00F7 and excludes letters such as Cyrillic or Greek. Lines that the node calls speaker lines are not block starts, and lines it does not name are. This changes where chat and transcript blocks, and so chunks, begin.
    kind: contradicts
    correction: >-
      Make the time stamp alternatives and the letter class match the node's statement, or amend the node if the wider forms are the decision.
    node: rules/knowledge-base/speaker-line
