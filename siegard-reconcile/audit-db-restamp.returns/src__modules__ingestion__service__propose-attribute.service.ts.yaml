findings:
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      the comment block above the closed-domain gate, lines 85-92
    evidence: >-
      // Exact match (no normalisation) per spec §1 / BR-30 v1 semantics.
    cost: >-
      The exact-match rule for allowed values is stated in prose here as well as in the node. The code that enforces it is the call to assertValueInDomain, imported from ../validation/structural.js. If the rule moves, this comment keeps saying the old one, and a reader who trusts it over the node gets the wrong rule.
    kind: restates
    correction: >-
      Remove the comment. The node rules/knowledge-base/attribute-value-in-allowed-values holds the fact, and assertValueInDomain in ../validation/structural.js implements it. That implementation was not opened in this pass.
    node: rules/knowledge-base/attribute-value-in-allowed-values
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      the comment block at the start of Layer 3, lines 130-134
    evidence: >-
      // `received_at` is the LAST link of the date-justification chain (v7 §6.5 / §13c / A14) and is consumed by `validateTemporal` as the fallback for `requires_valid_from = true` rows that carry no stated/document date.
    cost: >-
      The fallback order of stated, then document, then received is written again as prose in this file. The code that applies it is validateTemporal, which this file only calls and which was not read in this pass. If the order changes, this comment goes stale without anything failing.
    kind: restates
    correction: >-
      Remove the comment. The node rules/knowledge-base/required-start-available holds the requirement that a start is stated or comes from a document date or a reception date. The order is applied in validateTemporal, in ../validation/temporal.js.
    node: rules/knowledge-base/required-start-available
