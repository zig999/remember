read:
  - node: domain/knowledge-base/accepted-fragment-filter
    held_at: >-
      ListAcceptedFragmentsQuerySchema (lines 29-45), plus the inferred type ListAcceptedFragmentsQuery
    evidence: >-
      z.object({ llm_run_id: z.string().uuid().optional(), raw_information_id: z.string().uuid().optional(), limit: ..., offset: ... }).strict()
  - node: domain/knowledge-base/information-fragment
    held_at: >-
      The AcceptedFragmentItem interface (lines 63-70). It declares the listing's projection of the fragment (text, confidence, llm_run_id, created_at). It does not carry status or superseded_at.
    evidence: >-
      export interface AcceptedFragmentItem { readonly fragment_id: string; readonly text: string; readonly confidence: number; readonly llm_run_id: string; readonly created_at: string; readonly source: AcceptedFragmentSourceRef; }
  - node: domain/knowledge-base/page
    held_at: >-
      The `limit` and `offset` fields of ListAcceptedFragmentsQuerySchema (lines 33-36). The AcceptedFragmentList response interface (lines 72-77) also carries `limit` and `offset`.
    evidence: >-
      limit: IntegerQuery.pipe(z.number().int().min(1).max(100)).optional().default(20), offset: IntegerQuery.pipe(z.number().int().min(0)).optional().default(0)
  - node: rules/knowledge-base/listing-requires-a-filter
    held_at: >-
      The `.refine` on the schema, lines 39-45
    evidence: >-
      (v) => v.llm_run_id !== undefined || v.raw_information_id !== undefined
  - node: rules/knowledge-base/page-defaults
    held_at: >-
      `.default(20)` on `limit` (line 35) and `.default(0)` on `offset` (line 36)
    evidence: >-
      .optional() .default(20), offset: IntegerQuery.pipe(z.number().int().min(0)).optional().default(0)
  - node: rules/knowledge-base/page-offset-non-negative
    held_at: >-
      The `offset` field of the schema, line 36
    evidence: >-
      offset: IntegerQuery.pipe(z.number().int().min(0)).optional().default(0)
looked_past: >-
  The header comment says every validation failure surfaces as `VALIDATION_INVALID_FORMAT` through the global error handler in another file, but contracts/knowledge-base/retrieval.md answers an out-of-range limit or offset with `VALIDATION_OUT_OF_RANGE`. That mapping lives outside this file set, so I did not judge it.
