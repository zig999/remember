    where: >-
      ListAcceptedFragmentsQuerySchema, the `limit` field (line 33), and the docstring bullet above it (line 26)
    evidence: >-
      limit: IntegerQuery.pipe(z.number().int().min(1).max(100))
    cost: >-
      The 1..100 bound is held in code here, but no node in this file's set states it. The node that does is rules/knowledge-base/page-limit-bounds, which constrains domain/knowledge-base/page. A change to that node reaches this file only if the bind is added. Until then a reader of this file's nodes finds the default of 20 and no bounds.
    kind: unstated
    correction: >-
      Bind rules/knowledge-base/page-limit-bounds to this file. No new node is needed, because the bound is already held there.
    node: rules/knowledge-base/page-limit-bounds
