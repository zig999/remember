looked_past: >-
  Several other file-wide comments restate rules that other nodes hold (BR-15 ranking, expansion decay, layer refusal). The file-header comment describes the same rules as BR-numbered steps. The repository-side behaviors the file delegates to (accepted-only provenance, chunk excerpts, link-validity filtering) sit in other files outside this set, so I did not review them.
