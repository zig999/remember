findings:
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      the constant PER_LAYER_FETCH_LIMIT (line 56) and its three uses in the layer fan-out (lines 128-148)
    evidence: >-
      const PER_LAYER_FETCH_LIMIT = 200;   and   fragmentHits = await searchFragmentLayer(client, input.query, PER_LAYER_FETCH_LIMIT);
    cost: >-
      The cap of 200 candidates per layer is a value the source decided and no node holds. It also sits upstream of the total, so `total = filtered.length` counts at most what the three capped layers returned. The reader who trusts the specification's "counts every search item" finds no cap there, and a query with more than 200 matching fragments reports a smaller total than the knowledge base holds.
    kind: unstated
    correction: >-
      Give the per-layer candidate cap a node, or state in search-total-before-pagination that the total counts items within that cap.
    node: rules/knowledge-base/search-total-before-pagination
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      the comment above the node-hit provenance guard, lines 241-243
    evidence: >-
      // BR-13 of back spec / OpenAPI: `provenance` minItems: 1. A node hit without ANY accepted-fragment trace is dropped — we never surface a node without a provenance chain.
    cost: >-
      The comment states, in prose, the rule that a node surfaces only with an accepted mention. The same fact also lives in the node and in the `if (provenance.length === 0) continue;` guard, so the next reader has a third place to check when the rule moves.
    kind: restates
    correction: >-
      Remove the comment. The fact stays held by the guard `if (provenance.length === 0) continue;` in this file and by the node.
    node: rules/knowledge-base/node-surfaces-only-with-accepted-mention
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      the comment above the link provenance guard, lines 331-332
    evidence: >-
      // BR-13 / OpenAPI: links without provenance are an alarm but we MUST NOT emit a `provenance: []` row. Log warn and drop.
    cost: >-
      The comment restates the rule that an expanded link surfaces only when it holds provenance. The guard `if (provenance.length === 0)` already holds it, so the prose is a second home that has to be kept in step with the node.
    kind: restates
    correction: >-
      Remove the comment. The log line `query_retrieval_search_empty_link_provenance` is emitted text and stays.
    node: rules/knowledge-base/expanded-link-requires-provenance
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      resolveLayers, the empty-list branch (line 431)
    evidence: >-
      if (layers === undefined || layers.length === 0) { return new Set(ALLOWED_LAYERS); }
    cost: >-
      The node gives the default of every search layer to a query that omits the option. The code also treats a present but empty `layers` list as omitted. That is a rule no node holds, so a caller who sends an empty list gets all three layers searched. The decision now lives only in this function.
    kind: unstated
    correction: >-
      State in search-option-defaults whether an empty layer list takes the default, or refuse it.
    node: rules/knowledge-base/search-option-defaults
