  The closed-domain versus open-domain semantics (an empty set means open, in domainOf), the boot-only snapshot and the comment-heavy style are not attribute-key's nodes or another judgment's concern. I also did not judge the caching design or the many BR-xx comments, apart from the two restatements filed above.
