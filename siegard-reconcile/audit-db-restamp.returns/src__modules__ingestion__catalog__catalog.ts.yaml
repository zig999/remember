findings:
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      the docstring on LinkTypeRuleRow, lines 47-51
    evidence: >-
      the temporal
       * filter (`valid_to IS NULL OR valid_to > current_date`) is applied at
       * lookup time so a rule that expires between reloads is honoured.
    cost: >-
      The in-effect rule is written a second time in prose, and in different terms from the node. The prose says `current_date`. The node says day is the UTC calendar date. If the node moves, `--check` never reaches this comment, and the next reader may take it as the rule that was decided.
    kind: restates
    correction: >-
      Remove the sentence. isLinkRuleActive in this same file holds the fact in code, in the `if (from !== null && today.getTime() < from.getTime()) continue;` and `if (to !== null && today.getTime() >= to.getTime()) continue;` branches, using stripTime, which works in UTC.
    node: rules/knowledge-base/link-type-rule-in-effect
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      the docstring on isLinkRuleActive, lines 265-270
    evidence: >-
      Returns `true` iff at least one rule covers the triple AND its
       * validity window includes today (semi-open `[valid_from, valid_to)`; nulls
       * mean unbounded — §5.1).
    cost: >-
      The window semantics (semi-open, null means unbounded) are restated in prose next to the code that enforces them. A second statement of the rule sits outside the specification, so the node and the comment can drift apart without anything catching it.
    kind: restates
    correction: >-
      Remove the prose. The same function holds the fact in code, with the `from`/`to` null checks and the `<` and `>=` comparisons.
    node: rules/knowledge-base/link-type-rule-in-effect
