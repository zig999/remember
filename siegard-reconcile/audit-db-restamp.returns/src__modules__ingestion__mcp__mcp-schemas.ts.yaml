findings:
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      the JSDoc above ListRecentIngestionsMcpInputSchema, line 251
    evidence: >-
      /** `list_recent_ingestions` — optional page size (1..50, default 10). */
    cost: >-
      The bound 1..50 is written a second time in prose beside the `.min(1).max(50)` that enforces it. If the node's bound moves, this line keeps saying the old one and a reader may take it for the decision.
    kind: restates
    correction: >-
      Remove the JSDoc. The fact is held by `.min(1).max(50)` in this file, line 257 and line 258, so the prose owes only its removal. The `.describe(...)` text beside it is emitted to clients and stays.
    node: rules/knowledge-base/recent-ingestions-limit-bounds
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      the same JSDoc above ListRecentIngestionsMcpInputSchema, line 251
    evidence: >-
      /** `list_recent_ingestions` — optional page size (1..50, default 10). */
    cost: >-
      The default of 10 is stated in prose as well as in `.default(10)`. The two can drift apart without anything noticing.
    kind: restates
    correction: >-
      Remove the JSDoc. The default is held by `.default(10)`, line 258.
    node: rules/knowledge-base/recent-ingestions-limit-default
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      the BR-34 header comment, line 276, and the docblock above IngestDirectedRefSchema, line 307
    evidence: >-
      //   - `ref` strings are local to the call (1..120 chars, must be non-empty).
      /** Local ref string scoped to one call. 1..120 chars; never persisted, never returned. */
    cost: >-
      The 1..120 bound on a directed reference is written twice in prose, next to `z.string().min(1).max(120)`. A change to the node's bound has two comments to go stale in a file where the fact already lives.
    kind: restates
    correction: >-
      Remove both comments. The bound is held by `IngestDirectedRefSchema = z.string().min(1).max(120)`, line 308.
    node: rules/knowledge-base/directed-reference-length
