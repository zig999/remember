            received_at: row.received_at.toISOString(),
            document_title: row.document_title,
          },
        }));
      ...
      return {
          total,
          limit: input.limit,
          offset: input.offset,
          items,
        };
  - node: domain/knowledge-base/accepted-fragment-filter
    held_at: >-
      The ListAcceptedFragmentsInput interface declares the filter, an optional LLM run, an optional raw information, and the page fields limit and offset.
