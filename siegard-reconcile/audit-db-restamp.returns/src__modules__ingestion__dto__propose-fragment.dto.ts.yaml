findings:
  - file: src/modules/ingestion/dto/propose-fragment.dto.ts
    where: >-
      the `.describe(...)` on `confidence` in ProposeFragmentInputSchema, lines 22-24
    evidence: >-
      "Confidence 0–1 that this claim is correctly extracted. ≥0.75 stored active; 0.40–0.74 kept but flagged uncertain; <0.40 dropped."
    cost: >-
      This text is emitted as the tool's input schema, so it tells the calling model what happens to a fragment by confidence band. The specification says a fragment proposal is recorded in status proposed whatever its confidence. The 0.75 and 0.40 bands belong to link and attribute proposals, not fragments. A model reading this is told a low-confidence fragment is dropped and a high-confidence one is stored active, and neither is what the system does.
    kind: contradicts
    correction: >-
      The description should state only what the fragment node holds: confidence is between 0 and 1. It should not apply the link and attribute confidence bands to a fragment.
    node: rules/knowledge-base/fragment-recorded-proposed
  - file: src/modules/ingestion/dto/propose-fragment.dto.ts
    where: >-
      header comment, lines 3-6
    evidence: >-
      "The DB CHECK on
      // `information_fragment.text` (≤ 1000 chars) is mirrored here so the failure
      // surfaces as a typed `VALIDATION_INVALID_FORMAT` instead of a SQLSTATE
      // error from pg."
    cost: >-
      The 1000-character bound is written a second time as prose beside the `.max(1000)` that enforces it. The next reader may take the comment, not the node, as where the limit was decided. If the node moves, the comment stays behind.
    kind: restates
    correction: >-
      Remove the comment. The bound is held by `.min(1).max(1000)` in this file, and the node holds the fact.
    node: rules/knowledge-base/fragment-text-length
