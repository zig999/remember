findings:
  - file: src/modules/query-retrieval/routes/query-retrieval.routes.ts
    where: >-
      the comment block above the /fragments/accepted route, lines 158-163 ("at least one required")
    evidence: >-
      // Lists `information_fragment` rows with `status = 'accepted'`
      // filtered by `llm_run_id` and/or `raw_information_id` (at least
      // one required). Tombstoned sources are silently omitted.
    cost: >-
      The at-least-one-filter rule is written as prose in a route file. A reader who changes the rule may edit this comment and miss the `.refine` in fragment.dto.ts, which enforces it.
    kind: restates
    correction: >-
      Remove the prose. The code holds the fact in src/modules/query-retrieval/dto/fragment.dto.ts: `(v) => v.llm_run_id !== undefined || v.raw_information_id !== undefined`.
