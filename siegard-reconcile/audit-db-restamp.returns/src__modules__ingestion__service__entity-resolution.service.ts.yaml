looked_past: >-
  The ambiguous branch, which creates a needs_review node and one entity_match_review row per candidate at or above 0.55, is held by rules/knowledge-base/ambiguous-candidates-need-review, a node outside this set, so I filed no finding. The advisory lock, the `LIMIT 1` with no ORDER BY in the exact-alias query, and the file's comment density are implementation or style judgments, not domain facts.
