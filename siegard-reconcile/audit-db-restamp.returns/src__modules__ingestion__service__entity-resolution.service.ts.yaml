findings:
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      TRIGRAM_CANDIDATE_LIMIT constant (line 47) and its use as LIMIT in the step 2 candidate query (line 165)
    evidence: >-
      const TRIGRAM_CANDIDATE_LIMIT = 10;
      ... ORDER BY MAX(similarity(na.alias_norm, norm($1::text))) DESC
      LIMIT ${TRIGRAM_CANDIDATE_LIMIT}
    cost: >-
      Only the ten most similar nodes are ever weighed. No node states this cap, so the next reader looks in the specification and finds nothing. The cap also changes outcomes. The strong-candidate rule says "when no other active knowledge node of that type reaches 0.55", and the review rule says to pair the new node with each such node. With more than ten nodes at or above 0.55, the eleventh and later are never seen and never get an entity match review row.
    kind: unstated
    correction: >-
      Give the candidate limit a node, or decide that every node at or above 0.55 is weighed and reviewed. The natural home is rules/knowledge-base/candidate-similarity, or a rule beside strong-candidate-resolves.
    node: rules/knowledge-base/candidate-similarity
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      docblock of decideFromCandidates (lines 249-262). Code holds the same decision in decideFromCandidates itself, lines 266-281.
    evidence: >-
      Strong unique: exactly ONE candidate with `sim >= MATCH_STRONG` AND no
      other candidate has `sim >= MATCH_FLOOR`.
    cost: >-
      The strong-candidate threshold and its uniqueness condition are written a second time in prose. If the node moves, the comment keeps claiming the old rule beside code that may have been updated.
    kind: restates
    correction: >-
      Remove the docblock text. The fact is held by the strong_unique branch in decideFromCandidates in this same file and by the MATCH_STRONG and MATCH_FLOOR constants. This is the prose-only route.
    node: rules/knowledge-base/strong-candidate-resolves
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      docblocks of MATCH_STRONG and MATCH_FLOOR (lines 26-41). Code holds the values in the constants at lines 32 and 41.
    evidence: >-
      Trigram-similarity floor below which a candidate is ignored entirely.
      Candidates with `sim < MATCH_FLOOR` do not feed the decision and do not
      produce `entity_match_review` rows.
    cost: >-
      The 0.55 floor and what it means are stated again in prose. A reader may take the comment, rather than the node, as the authority for how a low-similarity candidate is treated.
    kind: restates
    correction: >-
      Remove the constants' docblocks. The values are held by the `MATCH_STRONG` and `MATCH_FLOOR` constants in this same file.
    node: rules/knowledge-base/no-candidate-creates-active-node
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      step 2 of the resolveOrCreateNode docblock (lines 90-91) and the inline comment before the first attachAliases call (lines 145-146). Code holds the same rule in the step 1 query and in attachAliases, which is called without the canonical name.
    evidence: >-
      Canonical name not re-inserted on match (already present by virtue of
      alias_norm hit). LLM-supplied aliases still attempt insert.
    cost: >-
      The rule that a matched node gains only the proposed aliases, never the proposed name, is carried a second time in prose. The exact-alias resolution rule is also restated in the function docblock.
    kind: restates
    correction: >-
      Remove the comments. Code holds both facts in the step 1 query, which returns `matched_existing`, and in the matched branches, which call `attachAliases` with no canonical insert.
    node: rules/knowledge-base/matched-node-gains-only-aliases
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      docblock of attachCanonicalAndAliases (lines 284-288) and step 5 of the resolveOrCreateNode docblock (lines 102-104). Code holds the same rule in attachCanonicalAndAliases and attachAliases.
    evidence: >-
      Attach the canonical name as the first alias (`kind = 'canonical'`) plus
      any LLM-supplied aliases (`kind = 'alias'`) to a newly created node.
    cost: >-
      The alias-kind assignment for a new node is restated in prose beside the code that performs it.
    kind: restates
    correction: >-
      Remove the docblock text. The two INSERT statements in attachCanonicalAndAliases and attachAliases hold the fact.
    node: rules/knowledge-base/new-node-aliases
