findings:
  - file: src/modules/ingestion/catalog/catalog.ts
    where: >-
      the doc comment above isLinkRuleActive(), lines 265-270, and the
      comment above LinkTypeRuleRow, lines 47-51
    evidence: >-
      "validity window includes today (semi-open `[valid_from, valid_to)`; nulls
      mean unbounded — §5.1)." and "the temporal
      filter (`valid_to IS NULL OR valid_to > current_date`) is applied at
      lookup time so a rule that expires between reloads is honoured."
    cost: >-
      The in-effect window of a link type rule is stated in prose a second
      time. The comment above LinkTypeRuleRow describes only the valid_to half
      of the window, so a reader who takes it as the rule gets a shorter rule
      than the node's. The code that holds the rule is isLinkRuleActive in this
      file, but the node does not name this file as its home, so the prose
      reads as a second authority.
    kind: restates
    correction: >-
      Remove both comments. The fact is already held by the node, and
      isLinkRuleActive implements it with `from !== null && today.getTime() <
      from.getTime()` and `to !== null && today.getTime() >= to.getTime()` on
      UTC-stripped dates.
    node: rules/knowledge-base/link-type-rule-in-effect
