findings:
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      RECEIVED_AT_ANCHOR_DIRECTIVE, lines 57-62 (the system-prompt text sent to the model)
    evidence: >-
      "  deictics), resolve it AGAINST `document_date` if it is present (basis",
      "  `\"document\"`). If `document_date` is `(unknown)`, fall back to the date",
      "  portion of `received_at` (the `YYYY-MM-DD` prefix of the ISO-8601 string) —",
      "  use basis `\"received\"`.",
    cost: >-
      The prompt the model receives tells it to state the basis received on a proposal.
      The node caller-never-states-received says a proposal MUST NOT state it. Under v4
      the model is asked for exactly what the specification forbids a proposal to carry.
      Whoever reads the node expects no proposal to arrive with basis received. Whoever
      reads the prompt finds the opposite instruction, and the specification does not say
      which was decided. The log of extraction-relative-date-falls-back-to-reception says
      the rule leaves the basis out because this conflict is unsettled and the owner has
      not asked for it to be settled.
    kind: contradicts
    correction: >-
      The conflict between the two nodes is for the owner to settle in the specification,
      through the analysis route. Until then this prompt text and the node
      caller-never-states-received cannot both hold.
    node: rules/knowledge-base/caller-never-states-received
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      the header comment (lines 3-12) and the JSDoc above RECEIVED_AT_ANCHOR_DIRECTIVE (lines 43-48)
    evidence: >-
      "v4 teaches the model to use it as the FALLBACK anchor: resolve against `document_date` when present, against `received_at` otherwise."
      and "Carries the `received_at` fallback rule: when `document_date` is absent, the relative-date anchor is `received_at`"
    cost: >-
      The same fallback rule is also stated in prose, so a reader can take the comment
      for where the rule is decided. The code holds the rule in the directive text of
      this file. The comment is a second home outside behavior and can drift from it.
    kind: restates
    correction: >-
      Remove the prose; the directive text carries the fact.
    node: rules/knowledge-base/extraction-relative-date-falls-back-to-reception
