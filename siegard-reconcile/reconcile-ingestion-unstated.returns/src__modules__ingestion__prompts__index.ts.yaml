findings:
  - file: src/modules/ingestion/prompts/index.ts
    where: >-
      the header comment, lines 10-15 ("An unknown version is a configuration error, NOT a silent fallback ...")
    evidence: >-
      // An unknown version is a configuration error, NOT a silent fallback: BR-26
      // step 2 mandates "load the extraction.${prompt_version} module; fail with 500
      // SYSTEM_INTERNAL_ERROR if the module is missing". `selectPromptModule` throws
      // `UnknownPromptVersionError`
    cost: >-
      The rule that a prompt version outside the held set is refused is written as prose in this file as
      well as held by the throw in selectPromptModule. A reader who finds the comment first takes it for
      the decision, and the node that holds the fact is not the place they look. When the node moves, the
      comment keeps saying the old rule.
    kind: restates
    correction: >-
      Remove the comment. The throw at `throw new UnknownPromptVersionError(promptVersion)` stays. Under
      the comment route, run /reconcile over this file afterwards.
    node: rules/knowledge-base/prompt-version-known
  - file: src/modules/ingestion/prompts/index.ts
    where: >-
      the doc comment on DEFAULT_PROMPT_VERSION, line 62
    evidence: >-
      /** Recommended version for NEW runs — callers SHOULD send this at intake. */
      export const DEFAULT_PROMPT_VERSION: string = v4.PROMPT_VERSION;
    cost: >-
      The doc comment describes the default as a recommendation callers should send. The node says a
      document ingestion that names no prompt version runs under v4. The code applies it as a
      substitution at ingest-document.handler.ts line 120, `input.prompt_version ?? DEFAULT_PROMPT_VERSION`.
      The comment is a second, differently worded statement of a fact the specification and the code
      already hold. The next reader trusts the wording that says "recommended".
    kind: restates
    correction: >-
      Remove the doc comment. The constant and its use in the handler stay.
    node: rules/knowledge-base/default-prompt-version
