findings:
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      the header comment, lines 6-15 ("Layered validation (BR-13) in the documented order ...")
    evidence: >-
      // Layered validation (BR-13) in the documented order. Each layer is a
      // sequential `await`, so layer N+1 only runs when layer N has not thrown:
      //   1. Structural    — cross-table refs (nodes exist, fragments exist,
      //   2. Graph rules   — active link_type_rule for the triple (BR-15).
      //   3. Temporal      — semi-open invariant, change_hint signal, date basis.
      //   4. Confidence    — < 0.40 -> ok:true outcome=rejected (BELOW_CONFIDENCE_FLOOR).
      //   5. Anti-halluc.  — every cited fragment anchors a chunk of the run's
    cost: >-
      The order of checks is held twice. The code holds it in the sequence of awaits under the "Layer 1" to "Layer 5" markers. The prose repeats it, in a different grouping from the node: the comment's layer 1 folds the known link type, the node checks, and the fragments-in-run check together. When the node's order moves, a reader finds a second description here that nothing keeps in step with it.
    kind: restates
    correction: >-
      Remove the header block comment. The behavior is correct and the fact is held by the node, so this is the comment-only route (removal, never refresh). A /reconcile over this file follows.
    node: rules/knowledge-base/link-proposal-check-order
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      the header comment, lines 13 and 17-19 (confidence below 0.40 returns a rejected outcome)
    evidence: >-
      // On confidence < 0.40 the service returns `{ ok: true, result: { outcome:
      // 'rejected', reason: 'BELOW_CONFIDENCE_FLOOR' } }`. The caller maps this to
      // `validation_outcome = 'rejected'` on the `tool_call` row (BR-17).
    cost: >-
      The prose restates the 0.40 floor and the rule that nothing is recorded below it. The code in this file holds the no-record part: `if (route.kind === "below_floor") { ... return { ok: true, result }; }` returns before `consolidateLink`. The 0.40 value itself is decided behind `routeConfidence` in validation/confidence.js, which I did not read because it is outside the file set. The comment gives the threshold a third home, and it would go stale silently if the threshold moved.
    kind: restates
    correction: >-
      Remove the comment lines that state the threshold and the mapping. The no-record branch is held by the code that follows the "Layer 4" marker.
    node: rules/knowledge-base/below-confidence-floor-records-nothing
