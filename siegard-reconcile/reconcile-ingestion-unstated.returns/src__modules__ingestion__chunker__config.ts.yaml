findings:
  - file: src/modules/ingestion/chunker/config.ts
    where: >-
      line 19, the first element of the CHUNK_TARGET tuple
    evidence: >-
      export const CHUNK_TARGET: readonly [number, number] = [1500, 2000] as const;
    cost: >-
      The 1500 floor of the soft window is a size threshold the code declares and no node holds. The
      nodes state only the 2000 ceiling ("each closing before the sentence that would take it past
      2000 code points") and the 4000 cut-off. A reader who looks in the specification for how small
      a chunk may be finds nothing, and the number lives only in this file.
    kind: unstated
    correction: >-
      The analysis would need to give the 1500 lower bound of the target window a node, beside
      rules/knowledge-base/long-block-sentence-chunks, or decide that it is not a domain fact.
    node: rules/knowledge-base/long-block-sentence-chunks
  - file: src/modules/ingestion/chunker/config.ts
    where: >-
      line 30, the READING_TAIL constant
    evidence: >-
      export const READING_TAIL = 200 as const;
    cost: >-
      The file declares a 200-code-point reading-tail overlap, added to the end of a chunk. No node
      holds a chunk overlap. The only 200-character tail in the specification is the one
      rules/knowledge-base/extraction-reads-chunks-in-order shows the model from the previous chunk,
      which is a different role. The value would become the business's decision by default, and the
      next reader would not look for it in this file.
    kind: unstated
    correction: >-
      The analysis would need to decide whether a reading-tail overlap is a domain fact and give it a
      node, or whether the constant belongs to no behavior. If it is the same fact as the extraction
      node's 200 characters, that node would have to say so.
