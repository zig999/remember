findings:
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      file header comment, lines 18-22 (the "Idempotency (BR-08)" paragraph)
    evidence: >-
      "Idempotency (BR-08): if the same content was already ingested,
      `ingestRawInformation` returns `noop_existing`; we DO NOT re-run extraction
      (the existing run is completed, or running, and re-running would either no-op
      or 409). The tool reports `already_ingested` with the existing ids — never an
      error."
    cost: >-
      The already_ingested answer is now written in two places. The contract holds it, and the
      code holds it at `if (outcome === "noop_existing")` returning `outcome: "already_ingested"`.
      This comment says it a third time in prose. When the contract changes, the comment keeps
      saying the old behavior, and a reader who trusts the comment is misled. Its "(BR-08)"
      citation also points at a back-spec rule rather than at a node.
    kind: restates
    correction: >-
      Remove the paragraph. The already_ingested answer stays held by the code in this file and
      by the ingest-document operation of the contract.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      docblock above `DEFAULT_INGEST_MODEL`, lines 41-48
    evidence: >-
      "Hard-coded fallback extraction model used only when the caller omits `model`
      AND no `ingestModel` is wired (e.g. a bare test harness). Production threads
      `env.INGEST_MODEL` through `deps.ingestModel`."
    cost: >-
      The default-model order (the configured ingestion model, otherwise claude-sonnet-4-6) is
      held by a node. The code holds it too, at
      `model: input.model ?? deps.ingestModel ?? DEFAULT_INGEST_MODEL` and
      `export const DEFAULT_INGEST_MODEL = "claude-sonnet-4-6"`. The docblock restates the order
      and the constant's rationale outside behavior. When the model default moves, the docblock
      still names the old one.
    kind: restates
    correction: >-
      Remove the docblock. The fact stays held by the code in this file and by the node.
    node: rules/knowledge-base/default-extraction-model
