looked_past: >-
  The docblock above DEFAULT_INGEST_MODEL says Sonnet 4.6 is "Cost-optimized" and was chosen over
  Opus 4.8. Only prose states that rationale, so it is no finding. The comments citing
  "TC-MCI-002", "BR-19" and "BR-30" are also prose only. The log messages and structured log
  fields are not domain facts. Whether the error codes carried by `LlmProviderFatalError` and
  `ExtractionFatalError` (`err.code`) match the contract's SYSTEM_LLM_PROVIDER_UNAVAILABLE and
  SYSTEM_INTERNAL_ERROR is decided in the files that declare those classes, not in this file.
