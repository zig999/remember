findings:
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The doc comments on MATCH_STRONG and MATCH_FLOOR (lines 26-41).
    evidence: >-
      /** Trigram-similarity ceiling above which a SINGLE candidate is taken as a strong match (reuse the existing node). BR-25 / A12. ... */ export const MATCH_STRONG = 0.85; /** Trigram-similarity floor below which a candidate is ignored entirely. Candidates with `sim < MATCH_FLOOR` do not feed the decision and do not produce `entity_match_review` rows. BR-25 / A12. ... */ export const MATCH_FLOOR = 0.55;
    cost: >-
      The two thresholds are stated again in prose that no running system emits. The code holds them in this file, in the constants and in decideFromCandidates. If a node's threshold changes, a reader who finds the comment first will believe it still describes what was decided.
    kind: restates
    correction: >-
      Remove the doc comments through the route that answers prose. The constants and the node already carry the fact.
    node: rules/knowledge-base/strong-candidate-resolves
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      TRIGRAM_CANDIDATE_LIMIT (line 47) and its use in the candidate query's `LIMIT ${TRIGRAM_CANDIDATE_LIMIT}` (line 165). Those candidates feed the entity_match_review inserts in the ambiguous branch (lines 200-207).
    evidence: >-
      const TRIGRAM_CANDIDATE_LIMIT = 10; ... ORDER BY MAX(similarity(na.alias_norm, norm($1::text))) DESC LIMIT ${TRIGRAM_CANDIDATE_LIMIT}
      Node statement: "creates a knowledge node in status needs-review and records an entity match review pairing it with each such node and its similarity."
    cost: >-
      The node says a review is recorded for each active node of the type at a similarity of 0.55 or more. The code silently drops every qualifying node past the tenth. The owner's entity-match queue would then show fewer candidates than the rule promises. The cap of ten is a domain value that only this file holds, and no node states it.
    kind: contradicts
    correction: >-
      Either the node states the cap of ten candidates, decided through analysis, or the query stops limiting the set that feeds the entity_match_review inserts.
    node: rules/knowledge-base/ambiguous-candidates-need-review
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The advisory-lock acquisition at the start of resolveOrCreateNode (lines 114-128).
    evidence: >-
      SELECT pg_advisory_xact_lock(hashtextextended($1::text, 0))
      (the key is built as `node_type_id || E'\x1F' || norm(name)`)
    cost: >-
      This serialises concurrent node proposals for the same node type and normalised name, so that they resolve to one node instead of creating duplicates. I searched the specification root for a node stating that guarantee and found none; the consolidation-race nodes cover only link and attribute proposals. The behavior lives only in this file, and the next reader looking for it in the specification will not find it.
    kind: unstated
    correction: >-
      A node should state that concurrent node proposals for the same node type and normalised name resolve as if one after the other. It would sit beside the node-resolution rules.
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      The doc comment on decideFromCandidates (lines 249-262).
    evidence: >-
      * Strong unique: exactly ONE candidate with `sim >= MATCH_STRONG` AND no other candidate has `sim >= MATCH_FLOOR`.
      * Ambiguous: any candidate has `sim ∈ [MATCH_FLOOR, MATCH_STRONG)` OR two or more candidates have `sim >= MATCH_STRONG`.
      * Novel: every candidate has `sim < MATCH_FLOOR` (empty set included).
    cost: >-
      The three-way resolution table is restated in prose. The code holds it in decideFromCandidates, in the `strong.length === 1 && aboveFloor.length === 1` branch. Nodes hold it too: strong-candidate-resolves, ambiguous-candidates-need-review and no-candidate-creates-active-node. A fourth, uncounted copy drifts without notice when a node moves.
    kind: restates
    correction: >-
      Remove the comment through the route that answers prose. The function and the nodes already carry the fact.
    node: rules/knowledge-base/ambiguous-candidates-need-review
