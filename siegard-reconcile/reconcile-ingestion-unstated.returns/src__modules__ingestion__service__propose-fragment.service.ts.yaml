findings:
  - file: src/modules/ingestion/service/propose-fragment.service.ts
    where: >-
      the comment block inside the mismatch branch of proposeFragmentService, lines 50-55
    evidence: >-
      //  - chunk_id resolves to no row -> RESOURCE_NOT_FOUND (UC-08 alt 2b).
    cost: >-
      The comment states, in a second place, that a cited chunk which does not exist is refused with RESOURCE_NOT_FOUND. Code in this file already does it: the `exists !== args.chunk_ids.length` branch throws `new ValidationFailure("RESOURCE_NOT_FOUND", ...)`. A reader checking the refusal finds a second statement of it with a use-case citation ("UC-08 alt 2b") that no running system reads. If the rule moves, the code and the node move together and the comment keeps the old statement.
    kind: restates
    correction: >-
      Remove the comment lines. The throw below it holds the fact.
    node: rules/knowledge-base/fragment-chunks-exist
  - file: src/modules/ingestion/service/propose-fragment.service.ts
    where: >-
      the comment block inside the mismatch branch of proposeFragmentService, lines 50-55
    evidence: >-
      //  - chunk_id belongs to a different source -> VALIDATION_INVALID_FORMAT
      //    (cross-table FK mismatch, alt 2c).
    cost: >-
      The comment states, in prose, that a chunk belonging to another source is refused with VALIDATION_INVALID_FORMAT. Code in this file already does it: the final `throw new ValidationFailure("VALIDATION_INVALID_FORMAT", ...)` carries `expected_raw_information_id`. The comment is a second home for the rule, outside behavior. It also describes the cause as a "cross-table FK mismatch", which no node says.
    kind: restates
    correction: >-
      Remove the comment lines. The throw and the `countChunksInSource` call hold the fact.
    node: rules/knowledge-base/fragment-chunks-in-run-source
