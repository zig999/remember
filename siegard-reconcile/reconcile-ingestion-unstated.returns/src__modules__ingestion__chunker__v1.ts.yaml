    kind: restates
    correction: >-
      Remove the comment. The rule is held by splitTurns in this file.
    node: rules/knowledge-base/turn-blocks
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      docblock of splitEmail, lines 213-216 (header block)
    evidence: >-
      "Split an email: first blank line closes the headers, every transition into
       or out of a quotation block (`^>+ `) closes a chunk."
    cost: >-
      The header-block rule is restated in prose. The code holds it in splitEmail
      (`if (!headersClosed && isBlank)`).
    kind: restates
    correction: >-
      Remove the comment. The behavior is held in splitEmail.
    node: rules/knowledge-base/email-header-block
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      docblock of splitEmail, lines 213-216 (quotation transitions)
    evidence: >-
      "every transition into
       or out of a quotation block (`^>+ `) closes a chunk."
    cost: >-
      The quotation rule is restated in prose, and the pattern `^>+ ` differs from what
      isQuotedLine does: it skips spaces and tabs, then looks for `>` with no required
      trailing space. The code holds the real rule in splitEmail and isQuotedLine.
    kind: restates
    correction: >-
      Remove the comment. The rule is held by splitEmail and isQuotedLine.
    node: rules/knowledge-base/email-quote-blocks
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      docblocks of splitTurns (lines 261-266) and SPEAKER_LINE_REGEX (lines 341-350)
    evidence: >-
      "A speaker
       line is one whose trimmed start matches `[A-Za-z0-9_]+:` followed by white
       space (e.g. `João: Bom dia`). Bracketed timestamps like `[12:00] João:` are
       also accepted."
    cost: >-
      The speaker-line definition is restated in prose, in three variants that disagree with
      one another and with the regex. The code holds it in SPEAKER_LINE_REGEX and isSpeakerLine.
      Three descriptions of one rule leave the reader unsure which one was decided.
    kind: restates
    correction: >-
      Remove both comments. The rule is held by SPEAKER_LINE_REGEX and isSpeakerLine.
    node: rules/knowledge-base/speaker-line
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      SPEAKER_LINE_REGEX, line 351
    evidence: >-
      "const SPEAKER_LINE_REGEX = /^\\s*(?:[[(]\\d{1,2}:\\d{2}(?::\\d{2})?[\\])][\\s\\t]+)?[A-Za-zÀ-ÿ0-9_]+(?:\\s[A-Za-zÀ-ÿ0-9_]+)?:\\s/;"
    cost: >-
      The node admits exactly four time-stamp forms: [h:mm], [hh:mm], (hh:mm) and (hh:mm:ss).
      The pattern admits `[hh:mm:ss]` and `(h:mm)`, and any opening bracket with any closing
      bracket, such as `(12:00]`. It reads word characters as ASCII letters plus U+00C0 to
      U+00FF, which includes × and ÷ and leaves out every other letter, where the node says
      "letters". A chat line the node does not call a speaker line therefore opens a new block,
      and the cut positions, offsets and chunk count differ from the specification's.
    kind: contradicts
    correction: >-
      Make the pattern accept exactly the four time-stamp forms the node lists, with matching
      brackets. Make its word class agree with the node's "letters".
    node: rules/knowledge-base/speaker-line
