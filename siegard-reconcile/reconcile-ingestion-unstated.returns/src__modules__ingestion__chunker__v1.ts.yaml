findings:
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      header comment, lines 11-14 (algorithm step 2)
    evidence: >-
      "// 2. For each block, try to keep it as one chunk if its size is at most
      //    `CHUNK_HARD_MAX` code points. If the block exceeds `CHUNK_HARD_MAX`, fall
      //    back to sentence-level split via `Intl.Segmenter('pt', {granularity:
      //    'sentence'})` (BR-07)."
    cost: >-
      The oversize-block rule is said a second time in prose. The code holds it in chunkV1
      (`if (blockSize <= CHUNK_HARD_MAX)` and `splitBySentences(blockText, block.start)`).
      A reader who finds the comment first takes it for the place the rule is decided.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by the node and by the branch in chunkV1.
    node: rules/knowledge-base/long-block-sentence-chunks
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      the `SourceType` union, lines 33-40
    evidence: >-
      "export type SourceType =
        | \"pdf\"
        | \"email\"
        | \"ata\"
        | \"chat\"
        | \"artigo\"
        | \"transcricao\"
        | \"outro\";"
    cost: >-
      The closed set of source types is declared a second time in a file the source-type node
      may not be bound to. If the node's values change, `--check` does not reach this union.
      The exhaustive `switch` in splitByHardBoundaries would then disagree with the
      specification with nothing to say so.
    kind: contradicts
    correction: >-
      Bind domain/knowledge-base/source-type to this file so a change to the enumeration
      reaches it. Alternatively, take the type from the file the node is already bound to.
      The code cannot read the specification, so the bind is what closes this.
    node: domain/knowledge-base/source-type
