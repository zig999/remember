         `\\f` between pages."
    cost: >-
      The pdf boundary is restated in prose. The code holds it in
      `splitOnCharBoundary(codePoints, \"\\f\")`. The comment is a second home for the rule.
    kind: restates
    correction: >-
      Remove the comment. The behavior is held in the pdf case of the switch.
    node: rules/knowledge-base/pdf-blocks-at-form-feeds
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      docblock of splitByHardBoundaries, lines 150-154 (chat and transcricao policy)
    evidence: >-
      "- `chat`,
         `transcricao`:  speaker boundary. A line that starts with
                          `[ \\t]*[A-Za-z0-9_]+[ \\t]*:[ \\t]` (e.g. `João:`,
                          `[12:00] Maria:`) opens a new block."
    cost: >-
      The turn-block rule is restated in prose, together with a pattern that is not the one the
      code runs. The code holds the rule in splitTurns and SPEAKER_LINE_REGEX. A reader of the
