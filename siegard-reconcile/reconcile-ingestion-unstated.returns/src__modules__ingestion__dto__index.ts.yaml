findings:
  - file: src/modules/ingestion/dto/index.ts
    where: >-
      IngestToolDescriptions.start_async_ingestion (lines 165-173), the string the model is given for the
      start_async_ingestion tool
    evidence: >-
      "Ingest a whole document and IMMEDIATELY return the run id while extraction " + "continues in the
      background. Use this instead of `ingest_document` when you " + "cannot afford to block (chat turn,
      short client timeout): the server stores " + "the raw text + chunks synchronously (< 1 s) and runs
      structured extraction " + ... + "asynchronously. Poll " + "`get_ingestion_status` with the returned
      `llm_run_id` to learn the terminal " + "outcome. Re-sending the same content is a no-op (returns the
      existing run, no " + "new extraction). Arguments and defaults match `ingest_document` exactly."
    cost: >-
      The ingestion contract lists ingest-document, ingest-directed and list-recent-ingestions and no
      asynchronous start. The only place that says an ingestion can return its run identity at once and
      extract afterwards, and that the caller then polls the run, is this tool-description string. A reader
      looking in the contract will not find the operation. A reader changing the description will be
      changing what the model is told about an operation the specification never decided.
    kind: unstated
    correction: >-
      Analysis would give the asynchronous start (what it returns, that extraction continues after the
      return, what a repeated content does) a place in contracts/knowledge-base/ingestion, or in a rule or
      scenario constrained to it. The description would then restate a held fact.
  - file: src/modules/ingestion/dto/index.ts
    where: >-
      IngestToolDescriptions.ingest_document (lines 141-149), the sentences on a client timeout
    evidence: >-
      "If your client times out before this returns, the server keeps extracting — do NOT " + "re-send; use
      `list_recent_ingestions` to find the run, then `get_ingestion_status`."
    cost: >-
      The contract for ingest-document answers the accepted and already_ingested outcomes. It says nothing
      about extraction continuing after the caller's connection is lost, or about recovering the run
      through the recent-ingestions listing. That behaviour is told to the model only here, so the
      specification gives no basis for judging whether the server really behaves this way.
    kind: unstated
    correction: >-
      Analysis would decide whether extraction survives a caller timeout, and record it against
      contracts/knowledge-base/ingestion.
