looked_past: >-
  The file also states the request's `thinking: { type: "adaptive" }`, the `cache_control: { type: "ephemeral" }` prompt-caching breakpoint and the pause_turn resume, which are request and loop mechanics rather than domain facts. The 200-character prev_tail, the three-in-a-row SYSTEM_ error burst, the run-not-running refusal and the run-closing behavior are held in nodes outside this pack (extraction-reads-chunks-in-order, extraction-fails-on-repeated-system-errors, extraction-requires-running-run, extraction-closes-its-run), and the code agrees with them.
