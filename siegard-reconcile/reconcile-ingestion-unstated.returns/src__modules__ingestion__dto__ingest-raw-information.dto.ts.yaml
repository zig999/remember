    where: >-
      the doc comment above IngestRawInformationRequestSchema, the `content` bullet (lines 16-18)
    evidence: >-
      - `content`: minLength 1 (empty document is meaningless), maxLength 10 MiB
         in code points — the Fastify `bodyLimit` of 11 MiB on the route is a
         coarser pre-filter; this Zod check is the precise contract from A5.
    cost: >-
      The comment states the length bound a second time, and it counts in "code points" where the
      rule counts UTF-16 code units. The code that enforces it, `.min(1, ...)` and
      `.max(10 * 1024 * 1024, ...)` on `content` in this same file, is what holds it. A reader who
      takes the comment as the contract learns a different unit from the one the node decided.
    kind: restates
    correction: >-
      Remove the bullet. The code in this file holds the bound, and the node
      rules/knowledge-base/content-length holds the fact.
    node: rules/knowledge-base/content-length
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      the doc comment on the `original_input` field (lines 35-39)
    evidence: >-
      Capped at 10 MiB to match `content`.
    cost: >-
      The comment restates the original-input length ceiling as prose. The cap is enforced by
      `.max(10 * 1024 * 1024, "original_input must not exceed 10 MiB")` in this same file, so the
      comment is a second home for a fact the node and the code already hold.
    kind: restates
    correction: >-
      Remove the sentence. The `.max(...)` on `original_input` in this file holds the bound.
    node: rules/knowledge-base/original-input-length
