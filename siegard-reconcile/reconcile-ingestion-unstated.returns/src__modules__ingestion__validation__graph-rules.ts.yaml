findings:
  - file: src/modules/ingestion/validation/graph-rules.ts
    where: >-
      The file-header comment, lines 3-8 (the whole comment block above the import).
    evidence: >-
      // Look up an active `link_type_rule` matching the `(source_node_type,
      // link_type, target_node_type)` triple. The 22 seed rules of §15.2 are the v1
      // authoritative set. Any other triple yields `BUSINESS_LINK_RULE_VIOLATION`.
    cost: >-
      The comment restates the rule that a link proposal must be permitted by an in-effect link type rule for its link type and its source and target node types. validateGraphRule and isLinkRuleActive already hold that rule in code, so the comment is a second home outside behavior. The next reader may take the comment, with its "22 seed rules" count, as where the rule is decided, and it can drift from the node. This is the only place the "22" figure appears in this file, and the file's code never states it.
    kind: restates
    correction: >-
      Remove the comment. The rule stays in validateGraphRule, which calls isLinkRuleActive in ../catalog/catalog.js. That is the route for prose, followed by a reconcile over the file.
    node: rules/knowledge-base/link-permitted-by-type-rule

