looked_past: >-
  The comment "The 22 seed rules of §15.2 are the v1 authoritative set" states a catalog count that CLAUDE.md gives as 28 rules, and it appears only in prose, so it is not a finding. The rule node link-permitted-by-type-rule, which the code does conform to, is outside this pack's set. So is link-type-rule-in-effect, which governs the in-effect test that isLinkRuleActive carries in ../catalog/catalog.js, a file outside this set.
