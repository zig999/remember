findings:
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      StartAsyncIngestionMcpInputSchema (lines 81-123), with its doc comment citing BR-32 and its content description
    evidence: >-
      * `start_async_ingestion` (BR-32) — shape-identical to `ingest_document` for caller symmetry. The only difference is the new-run return semantics (immediate vs. awaited)
      ... "The full plain text of the document to ingest. Paste the raw content; the server chunks it, runs structured extraction in the BACKGROUND, and persists the knowledge graph with provenance. No base64/binary."
    cost: >-
      The tool is advertised to MCP clients with a defined input shape and background-extraction behaviour. The specification's ingestion contract lists operations ingest-raw-information, ingest-document, ingest-directed and list-recent-ingestions, and no start-async operation. No node says that a document can be ingested with extraction running in the background, or that the call returns before extraction ends. The behaviour exists only in the code and in a back-spec identifier (BR-32). The next reader looks for it in the specification and finds nothing.
    kind: unstated
    correction: >-
      Analysis would give the asynchronous-ingestion operation a node. The natural home is the operations and answers of contracts/knowledge-base/ingestion, plus the rule that extraction continues after the call returns.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      ListRecentIngestionsMcpInputSchema.limit, line 258 (`.default(10)`) and its description
    evidence: >-
      .min(1)
      .max(50)
      .default(10)
      .describe("How many recent ingestions to return, newest first. 1..50, default 10.")
    cost: >-
      The page size used when the caller names no limit is a business-visible value, and it lives only here and in the text sent to MCP clients. The specification rule holds only the bounds, "A recent-ingestions listing's limit MUST be between 1 and 50". The next reader looks for the default in the specification and does not find it. A change to it would never reach any node.
    kind: unstated
    correction: >-
      Analysis would give the default limit of the recent-ingestions listing a statement. The natural home is rules/knowledge-base/recent-ingestions-limit-bounds or a sibling rule.
    node: rules/knowledge-base/recent-ingestions-limit-bounds
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedNodeItemSchema.node_id description, line 348
    evidence: >-
      "... Rejected (VALIDATION_INVALID_FORMAT) if the id does not point to an active node."
    cost: >-
      This text is sent to MCP clients on tools/list. It says every pinned identity that is not an active node is refused with VALIDATION_INVALID_FORMAT. The contract separates two cases. An identity naming no knowledge node is reported rejected with RESOURCE_NOT_FOUND ("node_id pin does not resolve to an existing knowledge_node row."). Only an identity naming a node that is not active gets VALIDATION_INVALID_FORMAT. A client that follows the advertised text will mishandle the not-found case.
    kind: contradicts
    correction: >-
      The description would have to say that an identity naming no node is refused with RESOURCE_NOT_FOUND and one naming a non-active node with VALIDATION_INVALID_FORMAT. Alternatively it would stop naming codes the contract already holds.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      the BR-34 block comment, lines 275-277, restating the reference length
    evidence: >-
      //   - `ref` strings are local to the call (1..120 chars, must be non-empty).
    cost: >-
      The comment is a second home for the 1 to 120 character bound. The code holds the fact in this file (`z.string().min(1).max(120)`), so the pair conforms. The comment can drift from the schema and the node without anything failing.
    kind: restates
    correction: >-
      Remove the comment line by the route that answers prose. The code in this file already holds the fact.
    node: rules/knowledge-base/directed-reference-length
