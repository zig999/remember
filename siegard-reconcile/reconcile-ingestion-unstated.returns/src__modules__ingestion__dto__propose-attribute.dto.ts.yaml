looked_past: >-
  The descriptions on confidence and valid_to (the 0.75, 0.40 and 0.74 bands, "dropped", and "Intervals are half-open [from, to)") and the outcome and reason types state facts that nodes outside the set also hold (new-assertion-status-from-confidence, below-confidence-floor-records-nothing, effective-status and the ingestion contract); they agree, so they are no finding.
