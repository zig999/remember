    held_at: >-
      the fragment_ids field of ProposeAttributeInputSchema, lines 41-46
    evidence: >-
      fragment_ids: z
        .array(z.string().uuid())
        .min(1)
  - node: rules/knowledge-base/consolidation-race-decided-again
    held_at: nowhere
    evidence: >-
      The file declares only the input schema and the outcome type; it has no reading of a
      concurrently committed current assertion and no second decision. All it holds of the
      outcome is `export type ProposeAttributeOutcome = | "accepted" | "consolidated" | "superseded_previous" | "disputed" | "rejected";`.
  - node: rules/knowledge-base/consolidation-race-refuses-second-collision
    held_at: nowhere
    evidence: >-
      No refusal or retry logic appears in the file. It holds only the ProposeAttributeInputSchema
      shape and the ProposeAttributeResult interface.
  - node: rules/knowledge-base/directed-validity-start-shape
    held_at: nowhere
    evidence: >-
      The file has the regex `/^\d{4}-\d{2}-\d{2}$/` on IsoDateSchema, but it validates the
      plain MCP and REST proposal and is not scoped to a directed ingestion. The directed path
      declares its own IsoDateSchema in directed-ingestion.service.ts, line 100.
  - node: rules/knowledge-base/directed-source-metadata
    held_at: nowhere
    evidence: >-
      The file declares no raw-information metadata and no directed or chat-turn identity; its
      fields are node_id, key, value, confidence, fragment_ids, valid_from, valid_to,
      valid_from_basis and change_hint.
  - node: rules/knowledge-base/directed-chat-pointer-whole
    held_at: nowhere
    evidence: >-
      No conversation or message identity field appears in ProposeAttributeInputSchema or
      ProposeAttributeResult.
  - node: rules/knowledge-base/extraction-never-invents-a-date
    held_at: >-
      the description text emitted with the valid_from field, lines 47-49; it is part of the tool schema shown to the model
    evidence: >-
      valid_from: IsoDateSchema.optional().describe(
        "Date the value STARTS holding (YYYY-MM-DD). Omit if the text does not state it — never invent a date."
      )
  - node: rules/knowledge-base/extraction-stated-basis-needs-written-start
    held_at: nowhere
    evidence: >-
      The valid_from_basis description says "'stated' (written in the chunk) or 'document' (the
      document's date)". It does not ask the model to cite a supporting fragment for a stated
      start, which is half of what the node requires, and the extraction prompt itself is not in
      this file.
  - node: rules/knowledge-base/extraction-dates-events
    held_at: nowhere
    evidence: >-
      No event_date or end_date instruction and no prompt-version logic appears in the file.
  - node: rules/knowledge-base/extraction-event-date-is-the-value
