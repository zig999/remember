findings:
  - file: src/modules/ingestion/dto/propose-attribute.dto.ts
    where: >-
      IsoDateSchema, lines 7-9, used by valid_from and valid_to at lines 47-52
    evidence: >-
      const IsoDateSchema = z
        .string()
        .regex(/^\d{4}-\d{2}-\d{2}$/, "valid_from / valid_to must be ISO YYYY-MM-DD");
    cost: >-
      The written shape a plain (non-directed) attribute proposal must give its validity start,
      and the same shape for its validity end, is stated only here. The only node that states a
      written shape for a validity start is directed-validity-start-shape, and it covers directed
      ingestion and the start only. A reader looking in the specification for what a
      propose_attribute date must look like finds no node that says. A change to the format
      would be made in this regex and reach no node.
    kind: unstated
    correction: >-
      A node would have to state the written shape of a proposal's validity start and end. The
      domain/knowledge-base/proposal node declares valid_from and valid_to only as type date.
    node: domain/knowledge-base/proposal
  - file: src/modules/ingestion/dto/propose-attribute.dto.ts
    where: >-
      the JSDoc above the value field, lines 24-27
    evidence: >-
      Canonical-serialized value (string form). The structural layer parses
      this against the `attribute_key.value_type` and rejects on mismatch.
    cost: >-
      This prose is a second home for the value-type parsing rule outside behavior. The rule is
      held in code by parseAttributeValue in src/modules/ingestion/validation/structural.ts,
      which this file does not hold. The pair conforms, and the comment owes only its removal.
    kind: restates
    correction: >-
      Remove the comment. The fact stays with the node and with parseAttributeValue in
      validation/structural.ts.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/ingestion/dto/propose-attribute.dto.ts
    where: >-
      the value field, lines 28-30
    evidence: >-
      value: z
        .string()
        .min(1)
    cost: >-
      The node says a text-typed attribute value may be "any text". Here an empty string is
      refused at the shape layer before the value-type rule runs. Someone relying on the node
      would expect an empty text value to reach the value-type check, and it never does.
    kind: contradicts
    correction: >-
      Either the node states that a proposal's value must be non-empty, or this schema stops
      refusing the empty string.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/ingestion/dto/propose-attribute.dto.ts
    where: >-
      the change_hint field, lines 56-58
    evidence: >-
      change_hint: ChangeHintSchema.default("none")
    cost: >-
      The rule that an omitted change hint is read as none is stated here and nowhere in the
      specification for a plain proposal. The only node that states the default,
      directed-defaults, covers directed ingestion alone. It decides whether an unlabelled
      proposal can succeed or correct an assertion, and the next reader looks for it in the
      specification and does not find it.
    kind: unstated
    correction: >-
      A node would have to state what a proposal that names no change hint is taken as. The
      domain/knowledge-base/change-hint enumeration declares the values and no default.
    node: domain/knowledge-base/change-hint
read:
