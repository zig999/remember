looked_past: >-
  The in-memory affected-nodes cache (`getCachedAffectedNodes`/`setCachedAffectedNodes`), the many UC-/TC-/BR- identifier comments, the file-header error notes and the cache-free layering are comment prose and implementation structure that name no new domain fact, so they belong to the comment route and to code review.
