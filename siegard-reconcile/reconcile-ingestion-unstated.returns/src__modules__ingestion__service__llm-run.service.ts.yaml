findings:
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the comment block above `let affectedNodes` in getLlmRunById, lines 97-102
    evidence: >-
      // BR-33 — attach `affected_nodes` ONLY when the run is `completed`. The
      // field is the snapshot of the run at completion; a `running` or `failed`
      // run does not surface a partial list.
    cost: >-
      The prose restates a rule the code already enforces here with `if (row.status === "completed")`. The rule exists in two places, and the prose names the retired id BR-33. A reader who follows that id will not find the rule, because it now lives in the node.
    kind: restates
    correction: >-
      Remove the comment. The branch on `row.status === "completed"` holds the fact, and the node holds it as the specification.
    node: rules/knowledge-base/affected-nodes-only-when-completed
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the `catch` around deriveAffectedNodes in getLlmRunById, lines 109-117
    evidence: >-
      } catch {
        // Best-effort — omit the field on a transient read failure; the
        // caller can re-derive on the next poll.
        affectedNodes = undefined;
      }
    cost: >-
      The code decides that a completed run read which fails to derive its affected nodes still answers successfully, with the field absent. The specification states only «with its affected nodes ... when it is completed». A caller cannot tell a completed run with no affected nodes from one whose derivation failed. This decision lives only in the code, where nobody looks for it in the specification.
    kind: unstated
    correction: >-
      Give the behaviour a node, either a refusal or an explicit statement that the field is omitted when the derivation cannot be read, in the read-llm-run answer of the ingestion contract. Otherwise the code should not hold it.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the JSDoc of retryLlmRun, lines 187-193
    evidence: >-
      * UC-06: POST /llm-runs/{id}/retry. The order is critical:
       *   1. Pre-read to distinguish "not found" (404) from "wrong status" (409).
       *   2. Atomic `UPDATE ... WHERE status = 'failed'`; rowCount === 0 means the
       *      pre-read showed `failed` but a concurrent transition raced us -> 409.
    cost: >-
      The prose restates the transition table of the run lifecycle, where retry is allowed only from failed. The code already holds that in `if (existing.status !== "failed") { throw new RunNotRetryableError(...) }`. A second statement of the rule in prose can drift from the node without anything noticing.
    kind: restates
    correction: >-
      Remove the comment. The status guard in this function holds the fact.
    node: rules/knowledge-base/llm-run-lifecycle
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      the race branch of retryLlmRun, lines 206-216
    evidence: >-
      const currentStatus = refreshed?.status ?? "running";
          if (currentStatus === "failed") {
            // Should not happen — log internally and surface as 409 conservatively.
            throw new RunNotRetryableError(llmRunId, "running");
          }
    cost: >-
      The contract answers a refused retry with «HTTP 409, error code BUSINESS_RUN_NOT_RETRYABLE naming the run's status». In this branch the re-read says the run is `failed`, yet the error names `running`. The message sent to the caller says the run is in status 'running' and cannot be retried. The `?? "running"` fallback also names a status when the row could not be re-read. Neither is the run's status as the node requires.
    kind: contradicts
    correction: >-
      The refusal should name the status actually read. Where the status cannot be read, the specification would have to say what is named.
    node: contracts/knowledge-base/ingestion
