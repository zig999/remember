findings:
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docblock of RecentIngestionRow, lines 38-44, above the LATERAL join in findRecentIngestions, lines 81-87
    evidence: >-
      "its MOST RECENT `llm_run` (via LATERAL, so a raw with no run still appears
      with null run fields)"
    cost: >-
      The comment restates the rule that a recent ingestion shows the most recently started run, or none when it has none. The query (`ORDER BY started_at DESC LIMIT 1` inside a `LEFT JOIN LATERAL ... ON true`) already holds that rule. If the node moves, the prose stays behind and reads as a second decision.
    kind: restates
    correction: >-
      Remove the prose. The fact is held by the node and by the query in this file.
    node: rules/knowledge-base/recent-ingestion-latest-run
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docblock of aggregateToolCallOutcomes, lines 111-118
    evidence: >-
      "Returns a fully-formed `LlmRunSummary` — every field
      present, missing buckets default to 0 (BR-12)."
    cost: >-
      The comment restates the rule that a summary counts tool calls by validation outcome and counts zero for an outcome with no tool call. The initial object `{ accepted: 0, consolidated: 0, ... error: 0, ... }` holds the rule. A reader may take the comment, or its BR-12 citation, as the place the rule lives.
    kind: restates
    correction: >-
      Remove the prose.
    node: rules/knowledge-base/summary-counts-tool-calls
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the comment at lines 148-149 above the orphan count in aggregateToolCallOutcomes, repeated in the docblock at lines 114-117
    evidence: >-
      "Orphaned-fragment count (recall-gap signal). Same definition as the
      retry orphan-cleanup: `proposed` fragments of this run with no provenance."
    cost: >-
      The comment states the definition of an orphaned fragment, which a node holds. The SQL (`status = 'proposed' AND id NOT IN (SELECT fragment_id FROM provenance ...)`) holds it twice in this file, in the count and in the retry cleanup. The comment is a third copy outside behavior, and the "recall-gap signal" gloss is not in any node.
    kind: restates
    correction: >-
      Remove the prose.
    node: rules/knowledge-base/orphaned-fragment
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docblock of retryLlmRunRow, lines 165-171, and the comment at lines 188-189
    evidence: >-
      "In the same transaction, orphan `proposed` fragments of this run are
      flipped to `rejected`."
    cost: >-
      The comment restates the rule that retrying a run rejects its orphaned fragments. The second `UPDATE information_fragment SET status = 'rejected' ...` in the function holds that rule. The BR-10 citation sends the next reader to a back-spec rule instead of the node.
    kind: restates
    correction: >-
      Remove the prose.
    node: rules/knowledge-base/retry-rejects-orphaned-fragments
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docblock of findToolCallsByRun, line 237, above its ORDER BY
    evidence: >-
      "/** Page of `tool_call` rows ordered by `created_at` ascending. */"
    cost: >-
      The comment restates the listing order of a run's tool calls. `ORDER BY created_at ASC, id ASC` holds it, and the comment omits the identifier tiebreak the node states. The two can drift apart without anyone noticing.
    kind: restates
    correction: >-
      Remove the prose.
    node: rules/knowledge-base/tool-call-listing-order
