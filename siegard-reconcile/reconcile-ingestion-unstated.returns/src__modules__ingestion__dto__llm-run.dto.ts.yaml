looked_past: >-
  The file's domain facts (run status values, the nine summary counters, the four ingest tool names, the 64-hex idempotency key, the 500-character retry reason, the 1..100 limit with default 50, and the affected_nodes shape) are held by nodes outside this set (domain/knowledge-base/run-status, run-summary, llm-run and tool-call, rules/knowledge-base/page-limit-bounds, and the tool-call listing default rule), so I filed nothing as unstated. The comment prose restating them, for example "Fragments proposed by this run that carry NO provenance row ... excluded from the partial FTS index (`WHERE status='accepted'`)", is another judgment's: the comment route that removes prose.
