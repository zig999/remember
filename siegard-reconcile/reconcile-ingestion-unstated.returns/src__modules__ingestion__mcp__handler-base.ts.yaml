findings:
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      the doc comment above deriveValidationOutcome (lines 55-65) and the comment inside its default branch (lines 85-86)
    evidence: >-
      "Rule: when `result.outcome === 'rejected'` (the BELOW_CONFIDENCE_FLOOR
       * branch returns this), the audit row is `'rejected'` per BR-17. Every other
       * `ok:true` envelope is `'accepted'`." and "`accepted`, `matched_existing`, `created_new`, `proposed`, missing
            // tag — all collapse to `accepted` per the current contract."
    cost: >-
      The mapping from a result's outcome to the tool call's validation outcome is written as prose here as well as held by the switch. A reader who finds the comment can take it for the decision and never open the node. When the node moves, this comment goes on stating the old rule and no check reaches it.
    kind: restates
    correction: >-
      Remove the doc comment's rule paragraph and the default-branch comment. The switch in deriveValidationOutcome holds the fact, in this file.
    node: rules/knowledge-base/tool-call-validation-outcome
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      the doc comment above assertRunIsRunning (lines 91-102)
    evidence: >-
      "- id does not match any LLMRun row -> `RESOURCE_NOT_FOUND`
       *   - id matches a row whose `status !== 'running'` -> `BUSINESS_RUN_NOT_RUNNING`"
    cost: >-
      The order of the run checks and their codes are written as prose here and also held by the two ValidationFailure throws. The comment is a second home that the node cannot reach when it changes.
    kind: restates
    correction: >-
      Remove the doc comment. The two `throw new ValidationFailure(...)` branches in assertRunIsRunning hold the fact.
    node: rules/knowledge-base/proposal-requires-running-run
  - file: src/modules/ingestion/mcp/handler-base.ts
    where: >-
      the header comment (lines 1-14) and the doc comments of runIngestHandler (lines 125-131) and safeWriteAuditOnRollback (lines 207-211)
    evidence: >-
      "4. On `ValidationFailure`: ROLLBACK the business TX, then open a SEPARATE
      //      short TX to write the audit `tool_call` row (BR-23)." and "if the audit write itself fails we log and swallow — the original envelope
       * is what the caller sees."
    cost: >-
      That a refused or failed proposal keeps only its tool call, and that a failed audit write is swallowed, is written as prose here as well as held by the rollback and the standalone insert. The comments carry BR numbers from another document, so a reader is sent there rather than to the specification.
    kind: restates
    correction: >-
      Remove the header comment and the doc comments. The catch branch, `insertToolCallStandalone` and the try/catch in safeWriteAuditOnRollback hold the fact.
    node: rules/knowledge-base/refused-proposal-records-only-its-tool-call
