findings:
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      interface LlmRunRow, lines 65-76 (the whole llm_run row shape)
    evidence: >-
      export interface LlmRunRow {
        readonly id: string;
        readonly model: string;
        readonly prompt_version: string;
        readonly started_at: Date;
        readonly finished_at: Date | null;
        readonly status: "running" | "completed" | "failed";
        readonly attempts: number;
        readonly input_raw_information_id: string;
        readonly idempotency_key: string;
      }
    cost: >-
      This file declares the LLMRun attribute set (model, prompt_version, status, attempts, started_at, finished_at, idempotency_key) as its own shape. The node domain/knowledge-base/llm-run holds that shape and is not among the nodes bound to this file. If the node gains or renames an attribute, `--check` does not reach this file, and the next reader cannot tell whether the node or this interface is what was decided.
    kind: contradicts
    correction: >-
      Either bind domain/knowledge-base/llm-run to this file so the declaration here is the node's declared home, or keep the LLMRun shape in the one file that is bound to it. Code cannot read the specification, so the bind is what closes this.
    node: domain/knowledge-base/llm-run
  - file: src/modules/ingestion/repository/ingestion.repository.ts
    where: >-
      the status member of LlmRunRow, line 72
    evidence: >-
      readonly status: "running" | "completed" | "failed";
    cost: >-
      The run-status vocabulary is written out a second time as a string-literal union. The node domain/knowledge-base/run-status holds it and is not bound to this file. If a state is added to or removed from the enumeration, this union keeps the old values and nothing flags it.
    kind: contradicts
    correction: >-
      Bind domain/knowledge-base/run-status to this file, or take the status type from the file that is bound to it. Code cannot read the specification, so the bind is what closes this.
    node: domain/knowledge-base/run-status
