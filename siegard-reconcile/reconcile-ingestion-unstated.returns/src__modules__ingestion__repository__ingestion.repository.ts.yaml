    held_at: nowhere
    evidence: >-
      The file only inserts and selects raw_information, raw_chunk and llm_run rows, for example `INSERT INTO raw_information (source_type, content, content_hash, metadata, original_input)`. It handles no link or attribute proposal and no fragment citation.
  - node: rules/knowledge-base/consolidation-race-decided-again
    held_at: nowhere
    evidence: >-
      The file has no proposal recording and no current-assertion collision. Its queries are `INSERT INTO raw_chunk ...`, `INSERT INTO llm_run ...` and lookups by id, content_hash or idempotency_key.
  - node: rules/knowledge-base/consolidation-race-refuses-second-collision
    held_at: nowhere
    evidence: >-
      The file has no proposal decision and no refusal logic. The only error it raises is `throw new InvariantError("insertLlmRun: no row returned")`.
  - node: rules/knowledge-base/directed-validity-start-shape
    held_at: nowhere
