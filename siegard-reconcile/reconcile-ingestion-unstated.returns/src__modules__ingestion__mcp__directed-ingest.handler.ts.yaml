findings:
  - file: src/modules/ingestion/mcp/directed-ingest.handler.ts
    where: >-
      the doc comment of IngestDirectedInvocationContext (lines 93-98) and the
      comment above the metadataPointer spread in ingestDirectedHandler (lines 180-183)
    evidence: >-
      "Both ids are required when `pointer` is present — partial
      pointers are dropped." and "Both ids are mandatory together — a partial pointer is
      dropped (omitted) rather than persisted with a missing field."
    cost: >-
      Two comments state that a chat turn's conversation and message identities
      travel together or not at all. A node already holds that rule, and the guard at
      lines 184-186 enforces it. A reader who finds the comments may take them as the place
      the rule lives, and if the rule changes the comments stay behind with the old wording.
    kind: restates
    correction: >-
      Remove the two comments. The guard `typeof invocationContext.pointer.conversation_id === "string" && typeof invocationContext.pointer.message_id === "string"` already holds the
      fact, and the node holds it in the specification.
    node: rules/knowledge-base/directed-chat-pointer-whole
