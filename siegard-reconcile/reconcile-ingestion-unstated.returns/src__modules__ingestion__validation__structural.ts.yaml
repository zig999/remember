findings:
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      parseAttributeValue, case "date", line 38, the comment above the regex test
    evidence: >-
      // Strict ISO YYYY-MM-DD; not free-form.
    cost: >-
      The comment states the date shape of attribute-value-parses a second time, as prose. The regex on the next line already holds that shape. If the node's shape moves, this text stays behind and still looks authoritative.
    kind: restates
    correction: >-
      Remove the comment. The regex /^\d{4}-\d{2}-\d{2}$/ in this file already holds the fact.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      parseAttributeValue, case "date", lines 45-53, the calendar check
    evidence: >-
      // Validate it's a real calendar date by parsing.
      const ts = Date.parse(`${v}T00:00:00Z`);
      if (Number.isNaN(ts)) {
    cost: >-
      The node says a date value "MUST" be "a real calendar date" and "naming an existing day". Its log says the earlier material "leaves to the runtime's date parser whether a well-formed but impossible date such as 2024-02-30 is refused", and that this was decided as "Only a real calendar date is a date value." This code is that same delegation to the runtime parser. It refuses only what Date.parse returns NaN for. I did not run it. As far as I know, V8's ISO parser accepts any day from 1 to 31 and rolls it over, so a value such as 2024-02-30 would be accepted and recorded as a date attribute. The scenario impossible-calendar-date-refused requires that proposal to be refused, so the behavior would differ from the node and the scenario.
    kind: contradicts
    correction: >-
      Check that the day exists in its month and year, for example by comparing the parsed year, month and day back to the input, instead of relying on Date.parse returning NaN.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      parseAttributeValue, the details of the VALIDATION_INVALID_FORMAT failures in the date calendar branch (lines 49-52), the number finite branch (lines 67-71) and the bool branch (lines 77-81)
    evidence: >-
      "value is not a calendar-valid date.",
      { value: v }
      ...
      "value is not a finite number.",
      { value: v }
      ...
      "value does not parse as a bool (expected 'true' or 'false').",
      { value: v }
    cost: >-
      The ingestion contract's refusal under attribute-value-parses is "error code VALIDATION_INVALID_FORMAT naming the value and its value type". Three of the five failure sites name only the value. A caller refused for a bad bool is not told the value type, although the date-format and number-format branches in the same function do carry `value_type: args.value_type`. The same refusal therefore carries different details depending on which branch raised it.
    kind: contradicts
    correction: >-
      Carry value_type in the details of the calendar-valid, finite-number and bool failures as the other branches already do.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the docstring of assertValueInDomain, lines 89-97
    evidence: >-
      * `AttributeKey` has an open domain — `domainOf(keyId)` returning `null`
      ...
      * structural check on a known-closed domain: exact-match string equality,
      * no normalisation, no case-folding, no trim (v1 semantics, §1 / BR-30).
    cost: >-
      The docstring states the allowed-values rule a second time, as prose. The node holds the rule: carry "one of them exactly as written". The code holds it too, as `domain.has(value)` in this file. A reader who finds the rule here may take this prose as its home, and it will not follow the node if the node changes.
    kind: restates
    correction: >-
      Remove the docstring's restatement of exact-match semantics. `domain.has(value)` already holds it.
    node: rules/knowledge-base/attribute-value-in-allowed-values
