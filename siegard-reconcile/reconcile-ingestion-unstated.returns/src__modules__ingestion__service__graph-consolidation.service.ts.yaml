findings:
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateLinkOnce, the `reaffirmation` constant (lines 549-552) and the early return that follows it
    evidence: >-
      const reaffirmation =
            sameTarget &&
            args.change_hint === "none" &&
            (!functional || sameValidFrom);
    cost: >-
      The node requires change hint "none" and the same validity start only for a type that does not allow multiple
      current assertions. For a type that does, a same-target proposal with change hint succession is a
      re-affirmation. The code requires "none" for every type. That proposal skips the re-affirmation branch.
      It is not a correction, and succession needs `functional`. It reaches branch (e) and inserts a second current
      row for the same (source, target, link_type). That violates `knowledge_link_current_dup_guard`, so after the
      retry the caller gets SYSTEM_INTERNAL_ERROR instead of a consolidation. The comment at lines 628-627 presents
      this outcome as intended ("the correct outcome for a malformed proposal on a multi-current type"). The node
      does not treat that proposal as malformed.
    kind: contradicts
    correction: >-
      For a multi-current type, the re-affirmation condition has to be `change_hint !== "correction"` with no
      validity-start condition. For a functional type it stays `change_hint === "none"` and the same validity start.
    node: rules/knowledge-base/reaffirmation-consolidates
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      consolidateAttributeOnce, branch (a) re-affirmation (lines 776-784) and the closing comment at lines 852-854
    evidence: >-
      if (
            sameValue &&
            sameValidFrom &&
            args.change_hint === "none"
          ) {
      ... "different valid_from on a multi-valued attribute is coexistence"
    cost: >-
      The node asks for the same validity start and change hint "none" only for a type that does not allow multiple
      current assertions. For a multi-current attribute key, the same value is a re-affirmation whatever its validity
      start, as long as the hint is not correction. The code applies the functional-type test to every key. A
      multi-current attribute proposal with the same value and a different `valid_from` (for example the per-document
      "received" fallback date) falls to (e) and inserts a second current row. That violates
      `node_attribute_current_dup_guard` (node_id, attribute_key_id, value), and the caller gets
      SYSTEM_INTERNAL_ERROR instead of a consolidation. The comment states "coexistence", which no node holds, and
      the dup-guard makes it unreachable.
    kind: contradicts
    correction: >-
      Branch (a) has to take the multi-current case with `sameValue` and `change_hint !== "correction"`, and keep
      the same-validity-start and "none" tests for the functional case only.
    node: rules/knowledge-base/reaffirmation-consolidates
