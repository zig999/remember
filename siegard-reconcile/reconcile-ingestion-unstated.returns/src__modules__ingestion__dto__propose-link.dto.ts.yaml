looked_past: >-
  Other facts in the file sit under candidate nodes outside this pack and agree with them. These are the confidence thresholds in the `confidence` description, the outcome list and BELOW_CONFIDENCE_FLOOR, `ChangeHintSchema` and the `stated`/`document` enum. The one thing I did not settle is the `YYYY-MM-DD` regex on propose_link dates, because I found no node that states that shape for a non-directed proposal, so it is not claimed as held. Brief JSDoc lines on `ChangeHintSchema` and `IsoDateSchema` are comments with no domain fact of their own, so I did not report them.
