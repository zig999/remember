findings:
  - file: src/modules/ingestion/dto/propose-link.dto.ts
    where: >-
      The doc comment above ValidFromBasisSchema, lines 5-15.
    evidence: >-
      "Only `stated` and `document` are accepted at the API boundary. The third
      value, `received`, is a backend-only fallback that the temporal validator
      applies internally when neither `stated` nor `document` can justify the
      date — it is never sent by an LLM or any external caller, so it MUST NOT
      appear in this input enum."
    cost: >-
      The comment states, a second time and in prose, that a proposal may not
      state the basis `received`, and also the fallback to `received`. The
      enum `z.enum(["stated", "document"])` right below it already holds the
      first fact. If the rule changes, `--check` will not reach this comment,
      and the next reader finds two statements of one rule.
    kind: restates
    correction: >-
      Remove the comment. The fact stays held by the enum in this file, which
      the node's bind covers. The prose is removed by the comment route, then
      `/reconcile` over this file.
    node: rules/knowledge-base/caller-never-states-received
