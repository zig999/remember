findings:
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      the docstring of ingestRawInformation, lines 80 and 81, steps 1 and 2 of the happy path
    evidence: >-
      " *   1. Compute `content_hash = sha256(content)`." and
      " *   2. Compute `idempotency_key = sha256(content_hash ∥ prompt_version ∥ model ∥ chunking_version)`."
    cost: >-
      The docstring states the digest of the content hash and the composition order of the idempotency
      key. A node already holds both facts. If a node changes, this prose would still say the old
      formula, and a reader would trust it as a second source. The code holds the same facts, so the
      pair conforms and only the prose is owed removal.
    kind: restates
    correction: >-
      Remove the two docstring lines. The code at `sha256Hex(input.content)` and
      `composeIdempotencyKey({ content_hash, prompt_version, model, chunking_version })` holds the
      facts. The first fact is rules/knowledge-base/content-hash-is-sha256 and the second is
      rules/knowledge-base/idempotency-key.
    node: rules/knowledge-base/idempotency-key
  - file: src/modules/ingestion/service/ingestion.service.ts
    where: >-
      the docstring of ingestRawInformation, lines 87 to 93, "Idempotent no-op path (UC-01 alt 4a)",
      and the comment on the insertRawInformation call, lines 111 to 114
    evidence: >-
      " * Idempotent no-op path (UC-01 alt 4a):" and
      "// Attempt the INSERT; catch UNIQUE violation on content_hash and switch to
      // the no-op path."
    cost: >-
      The prose restates that held content records nothing new and takes the no-op branch. A node holds
      this fact, and the code holds it in the `catch` that returns `noopExisting(...)` before any chunk
      or run insert. The prose is a second home outside behavior and would go stale when the node moves.
    kind: restates
    correction: >-
      Remove the docstring paragraph and the comment. The `isUniqueViolation(err,
      RAW_INFORMATION_CONTENT_HASH_CONSTRAINT)` branch holds the fact.
    node: rules/knowledge-base/held-content-records-nothing
