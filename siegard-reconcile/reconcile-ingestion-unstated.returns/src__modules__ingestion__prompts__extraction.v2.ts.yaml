findings:
  - file: src/modules/ingestion/prompts/extraction.v2.ts
    where: >-
      header comment, lines 3-9 ("v2 = v1 + an explicit Event-dating directive ...")
    evidence: >-
      v1 never told the model to propose `event_date` when it
      creates an Event (the catalog has had Event.event_date — temporal, functional
      — all along, §15.3). v2 appends that directive (plus the value-vs-valid_from
      distinction) to v1's SYSTEM prompt
    cost: >-
      The header comment says in prose what EVENT_DATING_DIRECTIVE already says in code: v2 asks the model to propose event_date. It is a second home outside behavior. If the rule moves, the comment keeps saying the old thing and nothing flags it.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by the EVENT_DATING_DIRECTIVE constant in this file, and the node binds it.
    node: rules/knowledge-base/extraction-dates-events
  - file: src/modules/ingestion/prompts/extraction.v2.ts
    where: >-
      header comment, lines 11-15 ("Why a new version ...")
    evidence: >-
      `idempotency_key` — which includes
      prompt_version (hash.ts) — changes, so re-ingesting a document under v2 yields
      a NEW, distinct run instead of deduping to the stale v1 run.
    cost: >-
      The comment restates how the idempotency key is composed. That composition is held by code in hash.ts (`h.update(args.prompt_version, "utf8")`) and by the node. The prose is a third home that goes stale silently.
    kind: restates
    correction: >-
      Remove the comment. The key's composition is held in hash.ts and in the node.
    node: rules/knowledge-base/idempotency-key
  - file: src/modules/ingestion/prompts/extraction.v2.ts
    where: >-
      EVENT_DATING_DIRECTIVE, third bullet, lines 50-51
    evidence: >-
      "- Rescheduling an event is `change_hint:\"succession\"` on `event_date` — the",
      "  same mechanics as any functional attribute (the old date becomes history).",
    cost: >-
      This prompt text tells the model to mark a rescheduled event as change hint succession. No node holds an extraction rule asking for that. The succession rule governs how a received proposal is handled, not what the extraction asks of the model. The behavior lives only in this prompt, so a reader checking what v2 asks of the model will not find it in the specification. The rule is also carried into any later prompt built on v2.
    kind: unstated
    correction: >-
      Analysis should give the rescheduling instruction a node, for example an extraction rule alongside rules/knowledge-base/extraction-dates-events. It would state that, under prompt version v2 and later, the model is asked to give a rescheduled event's new event_date change hint succession.
