looked_past: >-
  The endpoint path `/mcp/ingest`, `serverName: "remember-bff-ingest"` and `serverVersion: "0.1.0"` are transport wiring that no node in this pack holds, and I did not judge them domain facts. The header comment's claims about BR-21, BR-23, the retired per-session model and "all four tools" are prose with no node in this pack, so I left them for the comment route.
