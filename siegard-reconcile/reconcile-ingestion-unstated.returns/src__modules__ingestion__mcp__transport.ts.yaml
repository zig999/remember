    held_at: >-
      nowhere
    evidence: >-
      The only code is `mountMcpEndpoint(scope, { path: "/mcp/ingest", ... getTools: () => deps.toolNames.map(...) })`.
      It has no recording, retry or concurrency logic.
  - node: rules/knowledge-base/consolidation-race-refuses-second-collision
