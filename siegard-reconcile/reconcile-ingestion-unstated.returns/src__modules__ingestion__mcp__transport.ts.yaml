    held_at: >-
      nowhere
    evidence: >-
      The file only mounts the endpoint and forwards each tool's name, description, inputSchema and handler
      (`inputSchema: t.inputSchema,` and `handler: t.handler as (input: unknown) => Promise<McpEnvelope>,`).
      It states no rule that a proposal must cite a fragment.
