findings:
  - file: src/modules/ingestion/dto/raw-information.dto.ts
    where: >-
      The JSDoc on ChunkLocatorSchema, line 11.
    evidence: >-
      /** Optional readable anchor (page/line/speaker/ts) — shape per A23. */
    cost: >-
      The comment lists the locator's four members a second time and cites an
      ADR number, "A23", as the authority for the shape. A reader who follows
      that citation looks outside the specification, where chunk-locator
      already holds the shape. The schema directly below it holds the same
      four members, so the comment adds a second home with nothing running
      behind it.
    kind: restates
    correction: >-
      Remove the comment. The code in this file already declares the shape,
      and chunk-locator holds the fact.
    node: domain/knowledge-base/chunk-locator
  - file: src/modules/ingestion/dto/raw-information.dto.ts
    where: >-
      The chunk_index member of RawChunkResponseSchema, line 40.
    evidence: >-
      chunk_index: z.number().int().nonnegative(),
    cost: >-
      The file requires a chunk's position to be zero or greater. The raw-chunk
      node declares chunk_index as a required integer with no lower bound, and
      no other node in the specification states one. The bound lives only in
      this schema, so a reader who looks for the rule in the specification
      does not find it.
    kind: unstated
    correction: >-
      Analysis should decide whether chunk_index has a lower bound and, if so,
      state it in raw-chunk or in an invariant that constrains raw-chunk.
    node: domain/knowledge-base/raw-chunk
read:
  - node: domain/knowledge-base/raw-chunk
    held_at: >-
      RawChunkResponseSchema (lines 37-46) and ChunkLocatorSchema (lines 12-19).
      The shape is declared in part: chunk_index, text, offset_start,
      offset_end, locator and chunking_version. status and superseded_at are
      not carried.
    evidence: >-
      export const RawChunkResponseSchema = z.object({ id: z.string().uuid(),
      raw_information_id: z.string().uuid(), chunk_index:
      z.number().int().nonnegative(), text: z.string(), offset_start:
      z.number().int().nonnegative(), offset_end: z.number().int().positive(),
      locator: ChunkLocatorSchema, chunking_version: z.string(), });
  - node: domain/knowledge-base/raw-information
    held_at: >-
      RawInformationResponseSchema (lines 23-31). The shape is declared in
      part: source_type, content, storage_ref, content_hash, received_at and
      metadata. title, original_input, document_date, status and superseded_at
      are not carried.
    evidence: >-
      export const RawInformationResponseSchema = z.object({ id:
      z.string().uuid(), source_type: SourceTypeSchema, content: z.string(),
      storage_ref: z.string().nullable(), content_hash:
      z.string().regex(/^[0-9a-f]{64}$/), received_at: z.string().datetime({
      offset: true }), metadata: z.record(z.string(), z.unknown()), });
