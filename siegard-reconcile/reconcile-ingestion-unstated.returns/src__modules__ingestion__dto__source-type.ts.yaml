findings:
  - file: src/modules/ingestion/dto/source-type.ts
    where: >-
      SourceTypeSchema, lines 10-18, the z.enum declaration
    evidence: >-
      export const SourceTypeSchema = z.enum([
        "pdf",
        "email",
        "ata",
        "chat",
        "artigo",
        "transcricao",
        "outro",
      ]);
    cost: >-
      domain/knowledge-base/source-type holds this closed set of seven source types. The trace binds that node to
      migrations/0001_init.sql and to the query-retrieval files response.dto.ts, accepted-fragments.repository.ts and
      provenance.repository.ts. It does not bind it to this file. So this file is a second authority for the
      vocabulary. If the node gains or drops a value, `--check` never reaches this file. The request validation that
      reads this enum would then accept or refuse different source types from the ones the business decided, and
      nobody could tell which list was decided.
    kind: contradicts
    correction: >-
      Bind domain/knowledge-base/source-type to this file, because it declares the enumeration. Code cannot read the
      specification, so the bind is the only thing that closes this. The values already match the node's
      Description, which gives `ata`, `artigo`, `transcricao` and `outro` as the material's own words for
      meeting-minutes, article, transcript and other.
    node: domain/knowledge-base/source-type
  - file: src/modules/ingestion/dto/source-type.ts
    where: >-
      header comment, lines 1-5, and the docstring on line 9
    evidence: >-
      // `source_type` enum — mirrors the PostgreSQL enum of the same name.
      // Keep this in sync with `migrations/0001_init.sql` (CREATE TYPE source_type)
      // and with `openapi.yaml#/components/schemas/SourceType`.
      /** Closed list — matches `CREATE TYPE source_type` in 0001_init.sql. */
    cost: >-
      This prose restates the closed source-type set, and no running system emits it. The code that holds the
      set is the z.enum in this file and the CREATE TYPE in migrations/0001_init.sql. The comment is a second home
      outside behavior. A reader who trusts "keep in sync" would look here and in the migration instead of in
      the node.
    kind: restates
    correction: >-
      Remove the comments. The set already lives in the node domain/knowledge-base/source-type and in the code that
      implements it.
    node: domain/knowledge-base/source-type
