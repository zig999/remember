findings:
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      runZodFailureAudit(), the ValidationFailure thrown inside the run closure (lines 465-474),
      used by propose_fragment, propose_node, propose_link and propose_attribute when the
      MCP-facing Zod parse fails
    evidence: >-
      throw new ValidationFailure(
        "VALIDATION_INVALID_FORMAT",
        "MCP tool args failed Zod parse.",
    cost: >-
      The contract says that over MCP a proposal refused for its shape answers the message
      "Input failed Zod parse." (and the decision log says the four MCP proposal handlers answer
      exactly that). This path, which runs before the proposal handlers are reached, builds a
      different message for the same refusal. An LLM client that reads or matches the message sees
      one wording or the other depending on which layer's parse failed, and the next reader who
      checks the contract will not find the wording this file emits. Whether the
      shell (handler-base.ts, outside the file set) rewrites the message before it is emitted is
      not visible from this file.
    kind: contradicts
    correction: >-
      The message this path emits for a proposal refused for its shape over MCP would have to be
      the one the contract states, "Input failed Zod parse."
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      the ingest_document handler's failed-parse branch (lines 254-268)
    evidence: >-
      code: "VALIDATION_INVALID_FORMAT",
      message: "ingest_document arguments failed validation.",
      details: {
        issues: parsed.error.issues.map((i) => ({
    cost: >-
      The ingest-document operation of the ingestion contract refuses a malformed request with
      VALIDATION_INVALID_FORMAT "listing each failing field with its path and message" and fixes
      no message. The fixed wording "ingest_document arguments failed validation." and the
      `details: { issues: [...] }` shape live only in this handler. The sibling ingest-directed
      operation has its wording fixed in the contract, so a reader checking ingest-document
      against the contract will not find the wording this file emits.
    kind: unstated
    correction: >-
      The ingest-document operation's validation refusal would need its message and details
      shape decided into the ingestion contract, as the ingest-directed one is.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      header comment, lines 18-23 (the Zod-failure audit path)
    evidence: >-
      A Zod failure (missing/invalid `llm_run_id` or malformed business DTO)
      //     also goes through `runIngestHandler` so the rejected `tool_call` audit
      //     row is written (BR-23 updated). When no `llm_run_id` is parseable from
      //     the raw input, the audit-row insert cannot resolve its FK; the shell's
      //     `safeWriteAuditOnRollback` logs and swallows that
    cost: >-
      The prose restates that every refused proposal is recorded as a tool call, with the
      best-effort exception, which every-proposal-audited holds. The code that does it is the
      runIngestHandler call in runZodFailureAudit (this file) and the shell it dispatches to
      (handler-base.ts). A second statement of the fact in a comment is one more place that
      drifts when the node moves.
    kind: restates
    correction: >-
      Remove the comment; the fact stays in the node and in the code that records the tool call.
    node: rules/knowledge-base/every-proposal-audited
