findings:
  - file: src/modules/ingestion/dto/propose-fragment.dto.ts
    where: >-
      the header comment, lines 1-6, above ProposeFragmentInputSchema
    evidence: >-
      // error from pg. -- the comment reads: "The DB CHECK on
      // `information_fragment.text` (≤ 1000 chars) is mirrored here so the failure
      // surfaces as a typed `VALIDATION_INVALID_FORMAT` instead of a SQLSTATE"
    cost: >-
      The 1-to-1000-character limit on a fragment's text is written a second time in prose,
      beside the `.min(1).max(1000)` that enforces it. When the node moves, the comment keeps
      saying the old figure and a reader trusts it. The comment's "≤ 1000" also leaves out the
      lower bound the node states.
    kind: restates
    correction: >-
      Remove the comment. The code in this file already holds the fact with
      `.string().min(1).max(1000)`. Rationale and the file-to-node link belong in the decision
      log and the trace, not in source.
    node: rules/knowledge-base/fragment-text-length
  - file: src/modules/ingestion/dto/propose-fragment.dto.ts
    where: >-
      the `.describe(...)` on `confidence` in ProposeFragmentInputSchema, lines 22-24
    evidence: >-
      "Confidence 0–1 that this claim is correctly extracted. ≥0.75 stored active; 0.40–0.74 kept but flagged uncertain; <0.40 dropped."
    cost: >-
      This text is part of the tool schema the model reads. It tells the model that a
      fragment's own confidence decides whether the fragment is stored active, flagged
      uncertain or dropped. The node says a fragment proposal is recorded in status proposed
      whatever its confidence. The 0.75 and 0.40 thresholds belong to link and attribute
      proposals, not to fragments. The model is therefore told that low-confidence fragments
      are discarded when the system records them as proposed. The next reader would also look
      for these thresholds in the wrong place.
    kind: contradicts
    correction: >-
      The description of a fragment's confidence has to say what the node holds: the fragment
      is recorded as proposed whatever its confidence. The thresholds apply to the link or
      attribute proposals that cite the fragment. The text must not attribute them to the
      fragment.
    node: rules/knowledge-base/fragment-recorded-proposed
