looked_past: >-
  The process-scoped LRU cache (`CACHE_CAPACITY = 256`), the in-memory-only persistence and the tool_call rebuild on a cache miss are operational mechanics rather than a domain fact, so I left them out. The only prose claiming that `affected_nodes` is absent when a lookup fails is the header comment, and I treated it as prose, not as a finding.
