findings:
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      the header comment, lines 4-5, and the comment at line 106, "// Semi-open interval invariant."
    evidence: >-
      //   - semi-open invariant: `valid_from < valid_to` when both are provided
      //     (BR-16 / §13.3 / §5.2).
    cost: >-
      The start-before-end rule is written as prose beside the branch that enforces it
      (`if (input.valid_from >= input.valid_to) { throw new ValidationFailure("BUSINESS_TEMPORAL_INCOHERENT", ...`).
      A reader can take the comment for the rule's home and not look in the node. The comment also
      cites BR/§ numbers, which are not specification nodes.
    kind: restates
    correction: >-
      Remove the comment. The branch at lines 107-115 holds the fact.
    node: rules/knowledge-base/validity-start-before-end
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      the header comment, lines 6-10, and the comment at lines 128-135
    evidence: >-
      //   - date justification chain (A14 / §6.5): when `requires_valid_from = true`
      //     for the link_type or attribute_key, AND `valid_from` is supplied, the
      //     caller must declare a non-null `valid_from_basis`.
    cost: >-
      The basis requirement is stated again as prose. The code that holds it is
      `if (input.valid_from !== null && input.valid_from_basis === null) { throw new ValidationFailure("BUSINESS_DATE_UNJUSTIFIED", ...`.
      The comment's wording makes the rule conditional on `requires_valid_from = true`. The
      code and the node apply it to any stated start. A reader of the comment learns a
      narrower rule than the node holds.
    kind: restates
    correction: >-
      Remove the comments. The branch at lines 136-142 holds the fact.
    node: rules/knowledge-base/stated-start-requires-basis
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      the header comment, lines 11-13, and the comment above ERRATA_MARKERS, lines 61-65
    evidence: >-
      //   - correction signal: `change_hint = 'correction'` requires textual errata
      //     evidence in at least one cited fragment.
    cost: >-
      The errata rule and its marker vocabulary are described in prose beside the code that holds
      them (`const ERRATA_MARKERS = ["errata", "errado", "correção", "corrigir", "correction", "correcao"] as const;`).
      The comment points to a "domain glossary" as the vocabulary's source, but the vocabulary is
      held in a node. Two descriptions can drift apart.
    kind: restates
    correction: >-
      Remove the comments. ERRATA_MARKERS and the `change_hint === "correction"` branch hold the fact.
    node: rules/knowledge-base/correction-requires-errata-evidence
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      the document_date branch of validateTemporal, lines 143-158
    evidence: >-
      if (input.requires_valid_from && input.valid_from === null) {
          // No stated date. Try document_date next.
          if (input.document_date !== null) {
            ...
            return {
              valid_from: input.valid_from,
              valid_from_basis: input.valid_from_basis,
            };
          }
    cost: >-
      The node says a proposal that requires a validity start and states none takes the document
      date with basis document. The code lets it pass with valid_from and valid_from_basis still
      null. Only a source with a reception date and no document date gets a resolved start, and
      that start has basis received. A required start can therefore be stored empty, which the node
      forbids. The decision log beside the node (required-start-fallback.log.md) records that
      this exact divergence was settled the other way. The code still carries the earlier
      behavior, and its comment names "accepts requires_valid_from = true when document_date is
      available" as the behavior it preserves.
    kind: contradicts
    correction: >-
      With a non-null document_date and no stated start, resolve valid_from to the document date
      and valid_from_basis to "document". Keep the received fallback for the case where the source
      has no document date.
    node: rules/knowledge-base/required-start-fallback
