      only mention of the consolidator is a comment about the values it returns.
  - node: rules/knowledge-base/consolidation-race-refuses-second-collision
    held_at: nowhere
    evidence: >-
      The file has no consolidation, collision or SYSTEM_INTERNAL_ERROR handling. It throws only
      BUSINESS_TEMPORAL_INCOHERENT and BUSINESS_DATE_UNJUSTIFIED.
  - node: rules/knowledge-base/directed-validity-start-shape
    held_at: nowhere
    evidence: >-
      `function toIsoDate(ts: string | null)` tests `/^\d{4}-\d{2}-\d{2}$/` on the first 10
      characters of received_at. That is the format check for the reception-date fallback, not
      for a directed item's validity start. The file has no notion of directed items.
  - node: rules/knowledge-base/directed-source-metadata
    held_at: nowhere
    evidence: >-
      The file reads no raw-information metadata and has no directed-ingestion concept. Its input
      shape is `TemporalLayerInput`.
