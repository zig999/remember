findings: []
read:
  - node: contracts/knowledge-base/entity-editing
    held_at: >-
      The tests of the node refusals in the file: RESOURCE_NOT_FOUND with HTTP 404 and BUSINESS_NODE_NOT_ACTIVE with HTTP 409 over REST. They sit in the first three describe blocks and in the final entity-edit describe block.
    evidence: >-
      expect({ status: answer.statusCode, code: answer.envelope.error.code }).toEqual({ status: 404, code: "RESOURCE_NOT_FOUND" }); and expect({ status: answer.statusCode, code: answer.envelope.error.code }).toEqual({ status: 409, code: NOT_ACTIVE_CODE });
  - node: domain/knowledge-base/assertion-status
    held_at: nowhere
    evidence: >-
      The file declares no assertion status. It makes no assertion about the values active, uncertain, disputed, superseded or deleted. Its only status strings are node statuses in nodeRow(...).
  - node: domain/knowledge-base/entity-edit
    held_at: nowhere
    evidence: >-
      The file declares no shape of an entity edit. It builds edits only through the imported helper editOf([setChange("phase", PHASE_VALUE)]), and the shape sits in edit-entity-world.js.
  - node: domain/knowledge-base/node-attribute
    held_at: nowhere
    evidence: >-
      The file declares no node attribute shape. It uses only the imported PHASE_VALUE and setChange("phase", PHASE_VALUE).
  - node: domain/knowledge-base/node-status
    held_at: >-
      The fixture node rows and the NODE_BY_STATUS table, which use the values active, needs_review, merged and deleted.
    evidence: >-
      const NODE_BY_STATUS: Readonly<Record<string, string>> = { active: ACTIVE_NODE_ID, needs_review: REVIEW_NODE_ID, merged: MERGED_NODE_ID, deleted: DELETED_NODE_ID, };
  - node: rules/knowledge-base/a-node-status-and-an-assertion-flag-cross-the-wire-with-underscores
    held_at: >-
      The test "for a node under review names the status as needs_review with its underscore, never as needs-review".
    evidence: >-
      expect({ underscored: textOf(refusal).includes("needs_review"), hyphenated: textOf(refusal).includes("needs-review"), }).toEqual({ underscored: true, hyphenated: false });
  - node: rules/knowledge-base/entity-edit-correction
    held_at: nowhere
    evidence: >-
      No test in the file edits an attribute. A correction effect, a supersession link and an active replacement are not asserted. The file's only edit is an active-node edit that sets "phase".
  - node: rules/knowledge-base/entity-edit-ended-attribute-correction
    held_at: nowhere
    evidence: >-
      The file never exercises an attribute with a validity end. It makes no assertion on the correction of an ended attribute.
  - node: rules/knowledge-base/entity-edit-names-an-active-node
    held_at: >-
      The test "is refused for needs_review, merged and deleted and not refused for active", and the final entity-edit describe block, which also asserts the store is left untouched.
    evidence: >-
      expect(outcomes).toEqual({ active: ACCEPTED, needs_review: NOT_ACTIVE_CODE, merged: NOT_ACTIVE_CODE, deleted: NOT_ACTIVE_CODE, });
  - node: rules/knowledge-base/entity-edit-provenance
    held_at: nowhere
    evidence: >-
      The file never asserts provenance. The word provenance does not appear in the file.
  - node: rules/knowledge-base/entity-edit-supersession-time
    held_at: nowhere
    evidence: >-
      The file never asserts a supersession time. The word superseded_at does not appear in the file.
  - node: scenarios/knowledge-base/stable-key-edit-is-a-correction
    held_at: nowhere
    evidence: >-
      The file does not stage an organization with a cnpj attribute, and it does not assert a correction. The only edit uses the "phase" key.
looked_past: >-
  The test asserts that a refused edit leaves the store unchanged. The node pack does not carry that fact, but constraints/entity-edit-is-atomic holds it, so it is attributed and I report no finding.