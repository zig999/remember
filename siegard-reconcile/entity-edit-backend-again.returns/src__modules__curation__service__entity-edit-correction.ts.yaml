looked_past: >-
  The `InvariantError` message in `recordCorrection` is an internal-consistency guard and states no domain fact. Whether `supersedeAttributeAtEdit` with `validTo: null` leaves an existing validity end untouched, which an ended-attribute correction would need, is decided in the repository, which is outside this file set.