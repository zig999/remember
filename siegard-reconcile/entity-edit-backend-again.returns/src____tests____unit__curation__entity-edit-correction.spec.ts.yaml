findings:
  - file: src/__tests__/unit/curation/entity-edit-correction.spec.ts
    where: >-
      line 36, the LIVE_STATUSES constant, used by supersedeStatement at line 128
    evidence: >-
      const LIVE_STATUSES: readonly string[] = ["active", "uncertain", "disputed"];
    cost: >-
      This is the enumeration that domain/knowledge-base/live-assertion-status holds, declared a second time in a
      file that node is not bound to. The test double decides which rows the supersede statement touches from this
      copy. If the node's values move, the double keeps applying the old set. The tests then pass against a
      vocabulary nobody decided, and `--check` never reaches this file through the node.
    kind: contradicts
    correction: >-
      Bind this file to domain/knowledge-base/live-assertion-status so the node answers for the vocabulary here. The
      alternative is for the double not to carry its own list of live statuses.
    node: domain/knowledge-base/live-assertion-status
