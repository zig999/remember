  - file: src/modules/curation/service/entity-match.service.ts
    where: >-
      the comment at the start of the merge_into branch, line 123
    evidence: >-
      // merge_into branch — DTO superRefine guarantees target_node_id+reason exist.
    cost: >-
      The requirement that merge-into name a target, and state a reason, is restated as prose that points at the DTO for enforcement. Code in this file also holds the target requirement, as the defensive `BUSINESS_TARGET_NODE_REQUIRED` throw. A reader now finds the rule in three places: the comment, the throw and the DTO.
    kind: restates
    correction: >-
      Remove the comment. The throw at lines 125-131 holds the target requirement in this file, and the DTO holds it upstream.
    node: rules/knowledge-base/merge-into-requires-target
