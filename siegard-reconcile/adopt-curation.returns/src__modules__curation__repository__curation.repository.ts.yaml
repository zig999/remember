findings:
  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the comment above the pathCompressMergedInto UPDATE, line 85
    evidence: >-
      /** BR-07: path compression — repoint anything that was pointing at absorbed. */
    cost: >-
      The comment states a second time what the statement below it already does (every node merged into the absorbed node names the survivor instead). Two homes for one rule means a change to the node leaves the prose to drift, and the prose is a place no check reaches.
    kind: restates
    correction: >-
      Remove the comment. The UPDATE in pathCompressMergedInto holds the fact in this file.
    node: rules/knowledge-base/merge-compresses-paths

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the docstring of copyAliases, lines 105-109
    evidence: >-
      Copy aliases from absorbed -> survivor. The absorbed node's canonical alias
       * is downgraded to `kind = 'alias'` on the survivor
    cost: >-
      The alias-copy rule (kind alias, skip forms the survivor already holds) is written in prose as well as in the INSERT ... SELECT ... ON CONFLICT (node_id, alias_norm) DO NOTHING. A reader can take the docstring for the decision and miss that the node holds it.
    kind: restates
    correction: >-
      Remove the docstring. The INSERT in copyAliases holds the fact.
    node: rules/knowledge-base/merge-copies-aliases

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the section header above deleteEntityMatchReviewByNode, line 164
    evidence: >-
      // entity_match_review (delete on resolution — BR-10)
    cost: >-
      The header says an accepted resolution removes the node's reviews, and the DELETE below it already does that. The prose is a second statement of the rule with no check behind it.
    kind: restates
    correction: >-
      Remove the header's rule claim. The DELETE FROM entity_match_review WHERE node_id = $1 holds the fact.
    node: rules/knowledge-base/entity-match-resolution-clears-reviews

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the docstring of confirmItem, line 245
    evidence: >-
      /** UC-08: confirm_item — flip `uncertain` -> `active`. BR-21. */
    cost: >-
      The prose restates that a confirmation makes its item active and requires it to be uncertain. The UPDATE ... SET status = 'active' WHERE id = $1 AND status = 'uncertain' already holds both, so the docstring is a second home for the rule.
    kind: restates
    correction: >-
      Remove the docstring.
    node: rules/knowledge-base/confirmation-activates

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the docstring of rejectItem, line 271
    evidence: >-
      /** UC-09: reject_item — pair status='deleted' AND superseded_at=now() (BR-20). */
    cost: >-
      The prose restates that a rejection marks the item deleted and stamps its supersession time. The UPDATE in rejectItem does exactly that, so the docstring duplicates the rule outside behavior.
    kind: restates
    correction: >-
      Remove the docstring.
    node: rules/knowledge-base/rejection-deletes

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the docstrings of resolveDisputeWinner and resolveDisputeLosers, lines 301 and 327
    evidence: >-
      /** UC-05 (prefer_one, winner): disputed -> active. */ ... /** UC-05 (prefer_one, losers): pair status='deleted' AND superseded_at=now(). */
    cost: >-
      The prefer-one outcome (winner active, every other item deleted with its supersession time stamped) is stated in prose and again in the two UPDATE statements. Nothing reads the prose, so the two can diverge unnoticed.
    kind: restates
    correction: >-
      Remove both docstrings.
    node: rules/knowledge-base/prefer-one-outcome

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the docstring of adjustItemPeriod, line 356
    evidence: >-
      /** UC-06 (adjust_periods): set new (valid_from, valid_to) and status='active'. */
    cost: >-
      The prose repeats the adjust-periods outcome that the UPDATE already carries (SET valid_from, valid_to, status = 'active'). It is a second place to look for a fact the node holds.
    kind: restates
    correction: >-
      Remove the docstring.
    node: rules/knowledge-base/adjust-periods-outcome

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the docstring of supersedePredecessor, line 401
    evidence: >-
