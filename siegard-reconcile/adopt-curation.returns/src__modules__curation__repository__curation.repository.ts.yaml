looked_past: >-
  Comments citing BR-26 (FOR UPDATE at transaction start), BR-33 "SQL sources" and other back-spec rules state facts owned by no node in this set, and the listEntityMatchQueue LIMIT/OFFSET cuts joined candidate rows rather than entries. Both belong to the service-layer reading and the analysis, and I did not judge them here.
