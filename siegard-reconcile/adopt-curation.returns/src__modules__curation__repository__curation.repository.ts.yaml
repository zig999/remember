    cost: >-
      The prose describes the rule that a correction's new item carries the stated values and otherwise the predecessor's. The COALESCE($n, column) expressions and the predecessor's confidence already hold this, so the docstring is a second home for it.
    kind: restates
    correction: >-
      Remove the docstring.
    node: rules/knowledge-base/corrected-item-values

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the docstrings of copyProvenance and appendProvenanceFragment, lines 510 and 541
    evidence: >-
      /** UC-10 BR-19 provenance copy from predecessor to successor. */ ... /** UC-10 BR-19 (extension): append the errata fragment if supplied. */
    cost: >-
      The prose says the new item holds the predecessor's provenance plus the cited fragment. The two INSERT ... SELECT / INSERT ... VALUES statements already do that, so the rule is stated twice and only one copy is behavior.
    kind: restates
    correction: >-
      Remove both docstrings.
    node: rules/knowledge-base/corrected-item-provenance

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the ACCEPT_ACTIONS docstring (line 786) and the accept_rate comments (lines 820-824) in aggregateCurationMetrics
    evidence: >-
      /** Accept actions are the five non-reject curator verbs (BR-33 spec table). */ ... Zero-division → 0 at BFF layer
    cost: >-
      The accept-rate definition (which five actions count, and 0 when none is recorded) is in prose and in the ACCEPT_ACTIONS array plus the totalActions > 0 guard. The prose is a second home for a fact the node already holds.
    kind: restates
    correction: >-
      Remove the docstring and the comment block. ACCEPT_ACTIONS and the guard in aggregateCurationMetrics hold the fact.
    node: rules/knowledge-base/accept-rate

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the reject_rate_by_code comment block, lines 841-844
    evidence: >-
      Today `curation_action.payload` of `reject_item` is `'{}'` (BR-25), so
        // this map is empty in practice. We still surface the field as `{}` rather
        // than omit it
    cost: >-
      The prose restates that reject_rate_by_code is a per-code share of reject-item actions, empty when there is none. The query and the `{}` initialiser already hold that. The comment also asserts what the payload holds today, which nothing checks.
    kind: restates
    correction: >-
      Remove the comment block.
    node: rules/knowledge-base/reject-rate-by-code

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the needs_review_count comment block, lines 861-864
    evidence: >-
      BR-33: surfaced as two separate fields even though they are logically
        // equal under BR-10
    cost: >-
      The prose restates that needs-review count and entity-match queue count are both the number of nodes in status needs-review. The query and `const entityMatchQueueCount = needsReviewCount` hold it, so the comment is a second home.
    kind: restates
    correction: >-
      Remove the comment block.
    node: rules/knowledge-base/metrics-review-counts

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the uncertain_count comment, lines 873-874
    evidence: >-
      Sum of resolved-view rows whose effective_status='uncertain' (§5.4/§6.6).
    cost: >-
      The prose restates that uncertain count is the number of links and attributes whose effective status is uncertain. The query over knowledge_link_resolved and node_attribute_resolved holds it, so the comment is a second home.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/metrics-assertion-counts

  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the disputed_queue_count statement and its comment, lines 892-912
    evidence: >-
      SELECT DISTINCT 'link' AS k, source_node_id, target_node_id, link_type_id
           FROM knowledge_link
          WHERE status = 'disputed'
      ... NOTE: this is an ADVISORY metric and is NOT fully consistent with the
        // queue's dispute grouping (queue.service.groupDisputedLinks), which is
        // cardinality-aware and collapses competing targets of a FUNCTIONAL link
        // into ONE group. For functional multi-target disputes this can over-count
    cost: >-
      The node says the metric is the number of entries the disputed queue holds. The code counts its own grouping, keyed by (source, target, link_type) for every link type. The queue's scope leaves the target out for a link type that does not allow multiple current links, per the curation contract. The dispute-scope rule is implemented a second time, differently, and the reported disputed_queue_count can exceed the number of queue entries, as the comment itself admits. The owner reads a number the queue does not back.
    kind: contradicts
    correction: >-
      Derive disputed_queue_count from the same scope grouping the queue listing uses, so both give the same count of entries. Do not keep a separate grouping in this SQL.
    node: rules/knowledge-base/metrics-disputed-queue-count

