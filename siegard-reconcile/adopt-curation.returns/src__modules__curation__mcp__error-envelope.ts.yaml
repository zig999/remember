    held_at: >-
      mapErrorToEnvelope, line 209, which shares one classification core with mapErrorToHttpResponse
    evidence: >-
      export function mapErrorToEnvelope(err: unknown) {
        return mapErrorToHttpResponse(err).envelope;
      }
