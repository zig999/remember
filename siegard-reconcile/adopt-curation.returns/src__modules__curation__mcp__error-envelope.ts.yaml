findings:
  - file: src/modules/curation/mcp/error-envelope.ts
    where: >-
      the header comment, lines 3-8, and the docstring of mapErrorToEnvelope, lines 204-208
    evidence: >-
      "BR-30 (curation.back.md): REST and MCP transports surface IDENTICAL error
      codes / messages / details for every thrown service error."
    cost: >-
      The same-answer-on-both-transports fact is written here as prose citing a back-spec rule (BR-30).
      The node holding it is the constraint, and its contract lists refusals whose details differ by
      transport, for example a bare list of `{ path, message }` over REST and `details: { issues }`
      over MCP. A reader who trusts this header, and not the contract, will believe the details are
      identical. The running code already holds the fact, because both renderings call one classifier.
    kind: restates
    correction: >-
      Remove the prose (the comment route). The code in this file, `mapErrorToEnvelope` returning
      `mapErrorToHttpResponse(err).envelope`, already holds the fact. The node binds to it, so the
      comment needs no replacement.
    node: constraints/curation-transports-answer-alike
