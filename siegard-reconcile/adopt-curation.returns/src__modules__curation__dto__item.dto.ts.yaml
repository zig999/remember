findings:
  - file: src/modules/curation/dto/item.dto.ts
    where: >-
      the doc comment above RejectItemBodySchema, line 21
    evidence: >-
      /** reject_item — reason mandatory (destructive, BR-11). */
    cost: >-
      The comment states, in prose, that a rejection must carry a reason. That is a fact the node holds, and this file's code already holds it in `reason: ReasonRequiredSchema`, which is declared without `.optional()`. The comment also cites a back-spec rule id, "BR-11", as its authority. A reader can take that as a second home for the rule, and it will go stale without anything flagging it.
    kind: restates
    correction: >-
      Remove the comment. The fact stays held by the `reason: ReasonRequiredSchema` field and by the node.
    node: rules/knowledge-base/curation-reason-required
  - file: src/modules/curation/dto/item.dto.ts
    where: >-
      CorrectedValuesSchema, the `value` field, line 31
    evidence: >-
      value: z.string().min(1).optional().nullable(),
    cost: >-
      The schema makes a corrected value that is an empty string a format refusal. No node says that. The corrected-values node declares `value` as a bare string with no length constraint, and the nearby rules (curation-reason-not-blank, alias-not-blank, search-query-not-blank) each name their own non-blank constraint. The refusal therefore lives only in this schema. The next reader will look for it in the specification and not find it, and it will read as a business decision.
    kind: unstated
    correction: >-
      Analysis should decide whether a correction's value must be non-empty, and give that decision a node, most naturally on domain/knowledge-base/corrected-values. Until then the constraint has no node behind it.
    node: domain/knowledge-base/corrected-values
