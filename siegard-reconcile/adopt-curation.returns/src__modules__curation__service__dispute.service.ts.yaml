        );
      }
    cost: >-
      The contract fixes the message as "decision=adjust_periods requires periods[] (one entry per item_id)". The code emits the text without the parenthesis. The guard here also checks only that the list is non-empty, so this file does not hold "exactly one period to each of its items". A list of periods that does not match the items reaches `adjustItemPeriod` and fails there as a different refusal, BUSINESS_ITEM_NOT_DISPUTED. The same contract message is owed by the code path that enforces one period per item.
    kind: contradicts
