findings:
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      the function `assertSameScope`, link branch (lines 292-305), called from `resolveDisputeService` at line 79.
    evidence: |-
      if (
        r.source_node_id !== first.source_node_id ||
        r.target_node_id !== first.target_node_id ||
        r.link_type_id !== first.link_type_id
      ) {
        throw new ConflictError(
          "BUSINESS_ITEM_NOT_DISPUTED",
          "Items do not share the same conflict scope",
          { scope_mismatch: true }
        );
    cost: >-
      The node gives two link scopes: one source node and one link type that does not allow multiple current links, whatever the target, or one source node, one link type and one target node. The code accepts only the second. Disputed links from one source under a functional link type that point at different targets are in one scope by the node. The code refuses them with BUSINESS_ITEM_NOT_DISPUTED and `scope_mismatch: true`, so the owner cannot resolve the dispute that the review queue lists as one scope. The scope definition has a second, narrower home in this function, and the catalog's `allows_multiple_current` is never consulted to choose the scope.
    kind: contradicts
    correction: >-
      For a link type that does not allow multiple current links, compare only the source node and the link type. Compare the target as well only when the link type allows multiple current links.
    node: rules/knowledge-base/dispute-scope
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      the prefer_one branch of `resolveDisputeService`, lines 118-123.
    evidence: |-
      throw new BusinessError(
        "BUSINESS_DISPUTE_WINNER_REQUIRED",
        "decision=prefer_one requires winner_id"
      );
    cost: >-
      The contract fixes the message as "decision=prefer_one requires winner_id (member of item_ids)". The code emits the text without "(member of item_ids)", so a client matching or displaying the specified message gets a different one. This file also checks only that `winnerId` is present, not that it is among `item_ids`. Whether another file enforces membership is outside this file set.
    kind: contradicts
    correction: >-
      Emit the message exactly as the contract states it, and state the membership check in the file that holds it.
    node: contracts/knowledge-base/curation
