read:
  - node: contracts/knowledge-base/curation
    held_at: >-
      Only in part, in the closed sets and shape primitives: `ReviewQueueKindSchema`, `EntityMatchDecisionSchema`, `DisputeDecisionSchema`, `AssertionStatusSchema`, `ValidFromSourceSchema`, `UuidSchema`, `IsoDateSchema`. The operations, answers and refusals of the contract are nowhere in this file.
