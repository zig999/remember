      ResolveDisputeBodySchema and its superRefine, which carry the resolve-dispute request refusals. The DTO does not hold the operation's answers, the accepted result shape or the unavailable and internal errors.
    evidence: >-
      message: "BUSINESS_DISPUTE_WINNER_REQUIRED" / message: "BUSINESS_DISPUTE_PERIODS_REQUIRED" / message: "BUSINESS_TEMPORAL_INCOHERENT" / message: "BUSINESS_REASON_REQUIRED" / message: "VALIDATION_INVALID_FORMAT"
