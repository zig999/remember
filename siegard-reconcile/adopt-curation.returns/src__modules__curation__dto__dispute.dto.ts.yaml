findings:
  - file: src/modules/curation/dto/dispute.dto.ts
    where: >-
      AdjustedPeriodSchema, line 15 (valid_from)
    evidence: >-
      valid_from: IsoDateSchema.nullable(),
      valid_to: IsoDateSchema.nullable().optional(),
    cost: >-
      The node declares both `valid_from` and `valid_to` as optional dates, with only `item_id` required. The schema accepts an omitted `valid_to` but refuses a period whose `valid_from` key is absent. The owner can omit a start in one field and not in the other. The only place that asymmetry is decided is this file, and a reader of the specification would not expect it.
    kind: contradicts
    correction: >-
      Either make `valid_from` optional like `valid_to`, or have the `adjusted-period` node state that the start must be present and may be null.
    node: domain/knowledge-base/adjusted-period
  - file: src/modules/curation/dto/dispute.dto.ts
    where: >-
      docstring of ResolveDisputeBodySchema, line 23 (prefer_one, winner_id required, member of item_ids)
    evidence: >-
      - `decision = prefer_one`  -> winner_id required, member of item_ids, reason required
    cost: >-
      The docstring is a second statement of the winner rule. The `ctx.addIssue` call with BUSINESS_DISPUTE_WINNER_REQUIRED in this same file holds that rule in code. If the node moves, this prose stays behind and reads as the authority.
    kind: restates
    correction: >-
      Remove the docstring line. The rule stays held by the superRefine branch for `prefer_one` in this file.
    node: rules/knowledge-base/prefer-one-requires-winner
  - file: src/modules/curation/dto/dispute.dto.ts
    where: >-
      docstring of ResolveDisputeBodySchema, line 23 (prefer_one, reason required)
    evidence: >-
      - `decision = prefer_one`  -> winner_id required, member of item_ids, reason required
    cost: >-
      The docstring restates that a prefer-one resolution must state a reason. The `BUSINESS_REASON_REQUIRED` issue in the `prefer_one` branch of the same superRefine holds that rule in code. The prose is a second home for it outside behavior.
    kind: restates
    correction: >-
      Remove the docstring line.
    node: rules/knowledge-base/curation-reason-required
  - file: src/modules/curation/dto/dispute.dto.ts
    where: >-
      docstring of ResolveDisputeBodySchema, lines 24-25 (adjust_periods, one entry per item_id)
    evidence: >-
      - `decision = adjust_periods` -> periods[] required with one entry per item_id;
                                        semi-open invariant (valid_from < valid_to)
    cost: >-
      The docstring restates the one-period-per-item rule while the `periods.length !== value.item_ids.length` check and the BUSINESS_DISPUTE_PERIODS_REQUIRED issues in this file hold it in code. Two homes for one rule means a reader may take the comment as the decided version.
    kind: restates
    correction: >-
      Remove these docstring lines.
    node: rules/knowledge-base/adjust-periods-one-per-item
  - file: src/modules/curation/dto/dispute.dto.ts
    where: >-
      inline comment before the start/end comparison, line 113, and docstring line 25
    evidence: >-
      // Semi-open invariant: valid_from < valid_to when both supplied.
    cost: >-
      The comment states the start-strictly-before-end rule, which the `p.valid_from >= p.valid_to` branch with BUSINESS_TEMPORAL_INCOHERENT holds in code in this same file. The prose is a second statement of the rule.
    kind: restates
    correction: >-
      Remove the comment and the matching docstring fragment.
    node: rules/knowledge-base/validity-start-before-end
