  - node: rules/knowledge-base/review-queue-total-before-pagination
    held_at: >-
      The count calls that sum into `total` in listReviewQueueService, lines 96, 104 and 105. They are taken independently of limit and offset.
    evidence: |-
      total += await countEntityMatchQueue(client);
      ...
      total += await countDisputedLinks(client);
      total += await countDisputedAttributes(client);
looked_past: >-
  The header comment and the "route layer logging" re-export comment state no domain fact that a running system emits. Whether the repository windows by entries, counts entries, sorts by creation time and filters status='needs_review' is the repository file's judgment, not this file's.
