findings:
  - file: src/modules/curation/service/queue.service.ts
    where: >-
      listReviewQueueService, lines 88-106: the limit and offset are handed separately to each of the three listings inside withReadOnly.
    evidence: |-
      const rows = await listEntityMatchQueue(client, limit, offset);
      ...
      const linkRows = await listDisputedLinks(client, limit, offset);
      const attrRows = await listDisputedAttributes(client, limit, offset);
      items.push(...groupDisputedLinks(linkRows));
      items.push(...groupDisputedAttributes(attrRows));
    cost: >-
      The node says a page skips and returns whole entries in listing order, where the listing is the combined one.
      The code instead windows each source on its own. With no kind filter, a page can return up to three times the requested limit.
      An offset past the last entity-match entry skips nothing of the disputes. An offset that falls inside the entity-match entries does not carry over into the link disputes.
      The page a client sees is therefore not a window of the ordered listing, and `total` no longer matches what paging through the listing returns.
      The disputed rows are also windowed before `groupDisputedLinks` and `groupDisputedAttributes` fold them into entries. A dispute whose sides straddle the page edge can be cut into a partial entry.
      The repository code that would confirm this is outside the file set, so that second point is read from the row types only.
    kind: contradicts
    correction: >-
      Apply one offset and limit over the combined ordered listing, which is entity-match entries, then link disputes, then attribute disputes, at the granularity of whole entries.
      Do not apply them separately per source or per row.
    node: rules/knowledge-base/review-queue-page-windows-entries
  - file: src/modules/curation/service/queue.service.ts
    where: >-
      the comment block at the top of groupDisputedLinks, lines 155-168.
    evidence: |-
      // Group by the CONFLICT SCOPE, which depends on the link type's cardinality
      // (A10, link_type.allows_multiple_current):
      //   - FUNCTIONAL (allows_multiple_current=false, ...): ... so the scope is (source, link_type) — target EXCLUDED, scope.target
      //     null. ...
      //   - MULTI-VALUED (allows_multiple_current=true): ... the target is part of
      //     the scope.
    cost: >-
      The prose restates the dispute-scope rule a second time outside behavior. The node holds that rule, and the keying in this file's code already implements it.
      When the node changes, this comment will keep stating the old scope rule.
    kind: restates
    correction: >-
      Remove the comment. The grouping code below it holds the rule, and the node holds the statement.
    node: rules/knowledge-base/dispute-scope
