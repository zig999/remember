  - node: rules/knowledge-base/review-queue-order
    held_at: >-
      Only the sequence of the pushes in listReviewQueueService: entity-match entries, then link disputes, then attribute disputes.
      Ordering within each kind follows the row order the repository returns, because the Maps preserve insertion order. No sorting is done here.
    evidence: |-
      items.push(...grouped);
      ...
