findings:
  - file: src/modules/curation/dto/entity-match.dto.ts
    where: >-
      the docstring above ResolveEntityMatchBodySchema (lines 17-23) and the docstring above MergeNodesBodySchema (line 62)
    evidence: >-
      " * ResolveEntityMatchRequest — BR-11 (reason mandatory on merge_into),"
      and "/** MergeNodesRequest — BR-11 (reason required), BR-23 (self-merge forbidden). */"
    cost: >-
      The rule that a merge-into decision or a node merge must state a reason is held twice in this file. It is in code (the `value.decision === "merge_into"` branch adding BUSINESS_REASON_REQUIRED, and `reason: ReasonRequiredSchema`) and again in prose citing back-spec rule numbers. A reader who follows the BR-11 citation goes to a document the node does not govern. When the node moves, the prose stays behind and claims a rule the code no longer applies.
    kind: restates
    correction: >-
      Remove the BR-11 citation and the "reason mandatory" / "reason required" wording from both docstrings. The code in this file holds the fact, and the bind to the node records the link.
    node: rules/knowledge-base/curation-reason-required
  - file: src/modules/curation/dto/entity-match.dto.ts
    where: >-
      the docstring above ResolveEntityMatchBodySchema (line 19) and the docstring above MergeNodesBodySchema (line 62)
    evidence: >-
      "BR-23 (self-merge forbidden at request shape)." and
      "BR-23 (self-merge forbidden). */"
    cost: >-
      The never-merged-into-itself rule is cited in prose beside code that enforces it only for `merge-nodes`: `if (value.survivor_id === value.absorbed_id)` adds BUSINESS_SELF_MERGE_FORBIDDEN. The ResolveEntityMatchBodySchema docstring claims the rule is applied at the request shape, but that schema has no check that compares `target_node_id` with the node identity. Anyone relying on the comment would believe entity-match resolution is guarded here. The comment also cites a back-spec rule number rather than the node.
    kind: restates
    correction: >-
      Remove the BR-23 prose from both docstrings. The merge-nodes check in this file is where the fact is held.
    node: rules/knowledge-base/node-never-merged-into-itself
