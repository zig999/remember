findings:
  - file: src/modules/curation/service/metrics.service.ts
    where: >-
      the header comment (lines 3-6) and the docblock above computeCurationMetricsService (lines 43-48)
    evidence: >-
      "All seven aggregates come from ONE
      `BEGIN READ ONLY` transaction (via `withReadOnly`) so they are mutually
      coherent" and "Wraps the seven aggregate SELECTs in
      a single `BEGIN READ ONLY` transaction (curation.back.md BR-33 point 1)"
    cost: >-
      The constraint that each metrics read runs in one read-only transaction is written out a second time in prose. The prose also adds "seven" and "MVCC" detail that the node does not hold. When the node moves, nothing reaches these comments. A later reader can take the comment for the place where the consistency rule was decided.
    kind: restates
    correction: >-
      Remove the comments. The code already holds the fact: the `withReadOnly(deps.pool, async (client) => { return aggregateCurationMetrics(client); })` call in this file. The transaction helper is imported from ./transaction.js, and I did not open it because it is outside the file set.
    node: constraints/curation-reads-are-consistent
  - file: src/modules/curation/service/metrics.service.ts
    where: >-
      the comments at lines 11-13 and 60-62 on the time source of computed_at
    evidence: >-
      "`computed_at` is the BFF wall clock at the moment the read transaction
      closed (immediately after `withReadOnly` returns)" and, at lines 11-13, "captured INSIDE the open
      `BEGIN READ ONLY` transaction (after the seven SELECTs, before COMMIT)"
    cost: >-
      The contract's rule that computed_at is taken after the metrics were read is restated in prose. The two comments describe different capture points, one inside the transaction and one after it closes. Only the code decides which is true, so a reader who trusts the comments learns a timing the running code may not have.
    kind: restates
    correction: >-
      Remove both comments. The code holds the fact in `const computedAt = new Date().toISOString();`, which runs after the `await withReadOnly(...)` read completes.
    node: contracts/knowledge-base/curation
