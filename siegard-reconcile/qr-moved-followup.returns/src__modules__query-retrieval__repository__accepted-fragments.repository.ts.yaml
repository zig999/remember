findings:
  - file: src/modules/query-retrieval/repository/accepted-fragments.repository.ts
    where: >-
      header comment, lines 8-11 (the "Filter" list, LLM run and raw information predicates)
    evidence: >-
      //   - `($1::uuid IS NULL OR f.llm_run_id = $1)`
      //   - `($2::uuid IS NULL OR r.id = $2)`
    cost: >-
      The narrowing to an LLM run, a raw information or both is described in prose and applied in
      FILTER_WHERE. A reader who finds the comment will treat it as a second statement of the filter.
      If the filter changes, the code moves and the comment is left saying the old thing.
    kind: restates
    correction: >-
      Remove the prose. The fact is held by the code in this file (FILTER_WHERE and the $1/$2
      parameters) and by the node.
    node: domain/knowledge-base/accepted-fragment-filter
  - file: src/modules/query-retrieval/repository/accepted-fragments.repository.ts
    where: >-
      header comment, lines 12-13 (the tombstone short-circuit bullet)
    evidence: >-
      //   - `NOT EXISTS (SELECT 1 FROM compliance_deletion cd
      //                  WHERE cd.raw_information_id = r.id)` — tombstone short-circuit.
    cost: >-
      The exclusion of compliance-deleted sources is narrated in a comment that cites back-spec
      BR-14 as its authority. The running code holds the exclusion in FILTER_WHERE, so the comment
      is a second home for the fact.
    kind: restates
    correction: >-
      Remove the prose. The fact is held by the NOT EXISTS clause in FILTER_WHERE in this file.
    node: domain/knowledge-base/compliance-deletion
