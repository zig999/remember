looked_past: >-
  The code also applies the accepted-only status filter, one-entry-per-fragment at the lowest chunk index, the listing order and the pre-pagination total. Rules nodes held outside this file's set (listing-holds-accepted-only, listing-one-entry-per-fragment, listing-order, listing-total-before-pagination) already hold these, so they are not unstated. The docstrings and the openapi/TC-be-002 citation restating them are another judgment's comment route.
