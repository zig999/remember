looked_past: >-
  The opening comment "Mirrors `openapi.yaml` components.schemas.AttributeDetail" states no domain fact, so it is prose for the comment route. The wire field names (valid_from_source, supersedes_attribute_id, node_id, attribute_key, is_current, is_in_effect, effective_status) are held in the retrieval contract only as prose, and effective_status, is_current and is_in_effect are derived values that other nodes govern and that this file does not compute.
