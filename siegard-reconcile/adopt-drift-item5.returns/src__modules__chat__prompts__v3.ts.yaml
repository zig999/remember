    held_at: >-
      system(), lines 203-212. The v3 prompt is built with the v2 body as its first element, and the file re-exports the marker constant from v1 at line 55. The marker text itself is declared in v1.ts, not here.
    evidence: >-
      return [
        v2Body,
        block4A,
        BLOCK_4B_SEARCH_DISCIPLINE,
        BLOCK_4C_POST_INGESTION_PLAYBOOK,
      ].join("\n");
      and `export { CHAT_PROMPT_MARKER_V1 } from "./v1.js";`. Whether v2's output starts with the marker cannot be seen from this file.
  - node: rules/chat/chat-prompt-presents-catalog
    held_at: >-
      renderOntologyBlock, lines 141-187. It presents node types, link types with their source -> target pairs, and attribute keys with a closed-values suffix, with the values sorted. The ordering of the other lists is not ascending, so a finding of kind contradicts is filed.
    evidence: >-
      parts.push(`- ${linkType.name}: ${linkType.description}${pairSuffix}`);
      ` [dominio fechado: ${[...domain].sort().join(" | ")}]`
      The node, link type and attribute key lists iterate `.values()` of Maps in insertion order.
  - node: rules/chat/tool-call-recorded
    held_at: nowhere
    evidence: >-
      The file builds a system prompt string only: `export function system(catalog: CatalogSnapshot): string`. It records no tool call and touches no conversation, message or turn.
