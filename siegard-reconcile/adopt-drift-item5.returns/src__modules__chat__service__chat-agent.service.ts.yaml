read:
  - node: rules/chat/tool-call-recorded
    held_at: >-
      nowhere
    evidence: >-
      This file runs the tool and emits it but never records it. It yields
      `type: "tool_result", tool: toolName, ok: toolEnvelope.ok, arguments: block.input, ... duration_ms: durationMs`
      and then `type: "iteration_end", iteration, assistant_content: iterationBlocks.slice(), tool_results: toolResultBlocks.slice()`.
      It imports no repository and writes no tool-call row. It also never names an assistant message, because it has no message identity. The recording of a tool call
      against a conversation and an assistant message is the work of the repository and routes
      files the candidate index lists for this node.
looked_past: >-
  The constants and failure envelopes in this file (the 4096-token cap, the unknown-tool, tool-timeout and thrown-tool envelopes, and the provider-unavailable, no-final-message and internal-error frames) are held by other chat nodes and contracts (for example rules/chat/tool-failure-answers-assistant and contracts/chat/conversations), so they are not this node's question.
