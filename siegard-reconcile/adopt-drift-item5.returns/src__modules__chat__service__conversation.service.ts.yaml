read:
  - node: rules/chat/conversation-request-check-order
    held_at: >-
      nowhere
    evidence: >-
      The file never checks the disabled chat or the request format. getConversation holds only the
      existence step, `if (row === null) throw new ConversationNotFoundError(id);`. getConversationUsage
      holds the same step, `if (exists === null) throw new ConversationNotFoundError(id);`. Its sole
      cursor check is `decodeCursor`, which throws InvalidCursorError. The file sequences no other
      check against these, so the order of the three checks is not held here.
  - node: rules/chat/tool-call-recorded
    held_at: >-
      nowhere
    evidence: >-
      The file only creates, lists, reads, patches and deletes conversations and aggregates their usage,
      for example `repo.insertConversation(client, { title: input.title })` and
      `return repo.getConversationUsage(client, id);`. It records no tool result and writes no tool call
      naming an assistant message.
looked_past: >-
