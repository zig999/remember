findings:
  - file: src/modules/chat/routes/conversations.routes.ts
    where: >-
      emitChatBootLog, lines 1222-1297 (the chat.boot, chat.recent_window_resolved, chat.deprecated_env and chat.owner_tz_resolved log records)
    evidence: >-
      deps.logger.info({ event: "chat.boot", chat_ingest_enabled: ingestFlagOn, tool_count: toolCount }, "chat module routes registered");
      and  if (process.env.CHAT_SUMMARY_AFTER_TURNS !== undefined) { deps.logger.info({ event: "chat.deprecated_env", name: "CHAT_SUMMARY_AFTER_TURNS", reason: "retired_as_gate_v2_9" }, "chat deprecated env var detected (BR-33 v2.9 — retired as gate)")
    cost: >-
      The event names, the fields, the rule that tool_count is 0 when the query portion is incomplete, and the deprecation of CHAT_SUMMARY_AFTER_TURNS all live only in this function. A person who greps the specification for the boot signal or the deprecated variable finds nothing, and so cannot tell whether the records are decided or incidental. The specification does give logged events a node elsewhere, for example constraints/curation-write-failure-logged.
    kind: unstated
    correction: >-
      Analysis would have to decide whether the chat boot records are a fact of the business. If so, they need a node, such as a chat constraint beside constraints/curation-write-failure-logged.
