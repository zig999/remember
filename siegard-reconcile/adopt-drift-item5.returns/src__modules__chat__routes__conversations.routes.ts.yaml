read:
  - node: rules/chat/conversation-request-check-order
    held_at: >-
      The guard at the top of each of the eight handlers other than sendMessage, in the order kill switch, then parse of the identity, body or query, then lookup of the conversation. These are POST /, GET /, GET /:id, PATCH /:id, DELETE /:id, GET /:id/messages, GET /:id/usage, GET/PUT /:id/graph and POST /:id/cancel. sendMessage is held by a different node (see looked_past).
    evidence: >-
      if (killSwitchTripped(deps.env)) { return sendKillSwitch(reply); }
      const { id } = ConversationIdParam.parse(request.params ?? {});
      const query = ListMessagesQuery.parse(request.query ?? {});
      // BR-22 before query.
      const exists = await withReadOnly(deps.pool, (client) => chatRepo.getConversationById(client, id));
      if (exists === null) { return sendNotFound(reply, id); }
  - node: rules/chat/tool-call-recorded
    held_at: >-
      The tool_result branch of the drain loop in sendMessage, steps (14) and (16). It records each tool result through chatRepo.insertToolCall and attaches the pending ids to the iteration's assistant row on iteration_end, or to the closing assistant row.
    evidence: >-
      if (evt.type === "tool_result") { ... chatRepo.insertToolCall(client, { conversation_id: id, message_id: null, tool_name: evt.tool, ... }) ... pendingToolCallIds.push(row.id);
      and  await chatRepo.attachToolCallsToMessage(client, [...pendingToolCallIds], assistant.id);
looked_past: >-
  sendMessage checks the idempotency key, identity and content before the disabled chat, which rules/chat/send-message-check-order holds, with a decision log recording the owner's choice that the source is the truth. That is why I filed no finding against conversation-request-check-order for it. I also left out the error-level chat.catalog_unresolved log beside the 404 refusal, which belongs to constraints/expected-refusals-not-logged-as-errors, and the prose that restates nothing in the specification.
