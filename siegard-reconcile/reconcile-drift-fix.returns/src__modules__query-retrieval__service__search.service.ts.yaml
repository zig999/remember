findings:
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      the dedup block (lines 138-155) and the fragment item built in the
      `fragmentHits` loop (lines 159-193)
    evidence: >-
      `for (const link of dedupLinks) { if (!chunksById.has(link.raw_chunk_id)) continue; dedupCollapsedCount += 1; }`
      and the fragment item takes `summary: f.text` and `provenance` from `listProvenanceForFragments`; nothing ever reads a matched chunk's text or excerpt into the fragment item.
    cost: >-
      The chunk-to-fragment link is looked up and only counted for the `dedup_collapsed_count` log field. The rule says the chunk match is shown as the fragment's excerpt, but no code in this file does it. A reader who trusts the node will assume the matched passage reaches the fragment's search item. In this file it does not.
    kind: contradicts
    correction: >-
      Where a chunk hit supports a matched fragment, carry that chunk's matched excerpt into the fragment item's provenance excerpt. Alternatively, if the repository's provenance excerpt is meant to be that match, the node's binding to this file should be reconsidered.
    node: rules/knowledge-base/chunk-match-cites-its-fragment
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      `toExpandedLinkItem`, the returned object (lines 387-399)
    evidence: >-
      `kind: "link",
      layer: "node",`
    cost: >-
      The search-item node types `layer` as a search-layer and never says which layer an expanded link item carries. The code decides `node`, and the next reader will look in the specification for it and not find it.
    kind: unstated
    correction: >-
      Analysis should state which layer, or none, an expanded link search item carries, on domain/knowledge-base/search-item.
    node: domain/knowledge-base/search-item
