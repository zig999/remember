read:
  - node: domain/knowledge-base/prompt-version
    held_at: >-
      nowhere
    evidence: >-
      The file declares no enumeration, type or table of versions. It only exports one value
      of the vocabulary: `export const PROMPT_VERSION = "v4" as const;`. That passes the value
      along and does not declare the shape.
  - node: rules/knowledge-base/caller-never-states-received
    held_at: >-
      nowhere
    evidence: >-
      No construct in the file states the basis `received`, forbids it, or validates it. The
      fallback directive says only "fall back to the date portion of received_at (the
      `YYYY-MM-DD` prefix of the ISO-8601 string)", and names no basis for that case. The
      only bases it names are `"document"` (a relative date resolved against `document_date`)
      and `"stated"` (absolute dates). The prompt does not ask the model to state `received`,
      so it does not conflict with the node.
  - node: rules/knowledge-base/extraction-never-invents-a-date
    held_at: >-
      the last line of the RECEIVED_AT_ANCHOR_DIRECTIVE array, which is the text `system()`
      appends to the prompt (line 30)
    evidence: >-
      "  text remain `\"stated\"`; never invent a date.",
      This is appended to the system prompt by
      `return `${systemV3(catalog)}\n${RECEIVED_AT_ANCHOR_DIRECTIVE}`;`
