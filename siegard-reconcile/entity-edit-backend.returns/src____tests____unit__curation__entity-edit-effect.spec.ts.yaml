    held_at: >-
      The test "holds exactly the five assertion statuses". It pins the values of `AssertionStatusSchema`, which is declared in `enums.dto.js`, a different file.
    evidence: >-
      const expected = ["active","deleted","disputed","superseded","uncertain"]; const actual = [...AssertionStatusSchema.options].sort();
  - node: domain/knowledge-base/attribute-change
    held_at: >-
      nowhere
    evidence: >-
      The shape is imported as `type AttributeChange` from `edit-entity.dto.js`. The file's `setChange` and the remove literal only construct values of it, which is not a declaration.
  - node: domain/knowledge-base/attribute-change-kind
    held_at: >-
      The test "holds exactly set and remove as the change kinds". It pins the values of `AttributeChangeKindSchema`, which is declared in `edit-entity.dto.js`.
    evidence: >-
      const expected = ["remove", "set"]; const actual = [...AttributeChangeKindSchema.options].sort();
