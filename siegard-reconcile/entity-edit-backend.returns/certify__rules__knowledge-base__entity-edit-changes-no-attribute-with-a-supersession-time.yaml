certified:
  - node: rules/knowledge-base/entity-edit-changes-no-attribute-with-a-supersession-time
    state: covered
    tests:
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: is refused as a conflict only when the attribute is active or uncertain and the change states a value other than its own
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: for a value change to an attribute carrying a supersession time names the change's attribute key
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: for a value change to an attribute carrying a supersession time names the attribute the change names
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: for a value change to an attribute carrying a supersession time is answered HTTP 409
    why: >-
      The fact is covered. The first named test sends a set change that states another value to an active attribute with a supersession time, and another to an uncertain attribute with a supersession time. It requires both to be refused with BUSINESS_ENTITY_EDIT_CONFLICT, so it fails if either change is let through. The three parameterized tests check the refusal only for the active case, and only as a side effect: refusalOf throws when no refusal comes. What they actually assert is the refusal's text and its HTTP 409 mapping.
      One over-assertion to route. The first test claims "only when" over shared ground. It requires acceptance for a set change that states the attribute's own value on a timed active or uncertain attribute, which belongs to rules/knowledge-base/entity-edit-unchanged-records-nothing. It also requires acceptance for any value on an active or uncertain attribute with no supersession time, which is outside this node. So the test will fail the day a sibling rule changes those outcomes, even though this node's fact still holds.