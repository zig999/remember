certified:
  - node: rules/knowledge-base/entity-edit-note-source
    state: covered
    tests:
      - file: src/__tests__/unit/curation/entity-edit-note.spec.ts
        name: has source type other and metadata of operator_note true and the edited node's identity under node_id
    why: >-
      Covered: the test calls recordOperatorNote for one edited node and checks the recorded
      raw information's source_type and metadata with deep equality. It fails if the source
      type stops being the "other" value, if operator_note is not true, or if node_id stops
      holding the edited node's identity. Two points for a reader to decide, not settled here.
      First, the test checks the stored literal "outro", while the node says "source type
      other". This audit reads "outro" as the stored spelling of the "other" value defined by
      domain/knowledge-base/source-type, but did not open that node to confirm it, as the pack
      instructs. Second, the test checks more than the node states. Its toEqual on metadata
      requires exactly the two keys operator_note and node_id. The node only says the metadata
      records those two, so the test would fail if a sibling fact legitimately added another
      metadata key to the note. No other test in the file bears on this fact.