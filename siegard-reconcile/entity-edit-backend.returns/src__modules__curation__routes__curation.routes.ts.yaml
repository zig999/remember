looked_past: >-
  The GET /queue handler and the path parse of the entity-match handler call .parse() outside any try block, so whether their refusals answer alike on both transports depends on an error handler outside this file. I did not read it, because it is outside the file set. I also noted that curation-write-failure-logged is bound to this file while its code lives in send-error.ts, which the index binds to other nodes.
