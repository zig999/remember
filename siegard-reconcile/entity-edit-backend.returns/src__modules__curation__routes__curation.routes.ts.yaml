findings:
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the catch block of the GET /metrics handler, lines 80-98 (the logger.warn call)
    evidence: >-
      deps.logger.warn({ route: "GET /api/v1/curation/metrics", operation: "getCurationMetrics", transport: "rest", original_status: statusCode, outcome: degradedStatus, error_code: degradedEnvelope.error.code, ... cause_message: err instanceof Error ? err.message : String(err), }, "curation_metrics_degraded")
    cost: >-
      The log name, the warn level, and the choice to log the cause of a degraded metrics read live only in this handler. Specification constraints do hold the logging facts of curation (a failed write is logged at error level as curation_request_failed), so the next reader looks for this one there and finds nothing. A person tuning alerts could not tell that a degraded read is logged at warn and a failed write at error.
    kind: unstated
    correction: >-
      An analysis would have to decide whether a degraded metrics read is logged, under what name, at what level and with what fields. It would give that fact a node, probably a refusal clause of read-curation-metrics in contracts/knowledge-base/curation or a sibling logging constraint.
    node: contracts/knowledge-base/curation
read:
  - node: constraints/curation-transports-answer-alike
    held_at: >-
      Only the REST half sits here. Each write handler forwards the result of the shared service, and each refusal goes through sendError, whose mapper is shared with the MCP transport.
    evidence: >-
      const result = await resolveEntityMatchService({ pool: deps.pool, logger: deps.logger }, params.node_id, body); return reply.status(200).send(result); ... return sendError(err, reply, deps.logger);
  - node: constraints/curation-write-failure-logged
    held_at: nowhere
    evidence: >-
      The handlers only delegate with `return sendError(err, reply, deps.logger);`. The `curation_request_failed` logger.error call is declared in src/modules/curation/routes/send-error.ts, which the candidate index does not bind to this node, not in this file.
  - node: rules/knowledge-base/curation-request-checked-first
    held_at: >-
      The write handlers, which parse the path and body before they call the service that reads any node, link, attribute or fragment.
    evidence: >-
      body = MergeNodesBodySchema.parse(request.body ?? {}); ... const result = await mergeNodesService({ pool: deps.pool, logger: deps.logger }, body.survivor_id, body.absorbed_id, body.reason);
