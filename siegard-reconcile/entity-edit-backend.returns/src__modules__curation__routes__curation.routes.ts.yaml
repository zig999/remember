    held_at: nowhere
    evidence: >-
      No handler in the file authenticates. `app.get("/queue", async (request: FastifyRequest, reply: FastifyReply) => {` runs no token check, so authentication is not held here.
  - node: constraints/expected-refusals-not-logged-as-errors
    held_at: nowhere
    evidence: >-
      The file never logs at error level. Its one direct log is `deps.logger.warn(`, and the per-refusal level is decided in sendError and mapErrorToHttpResponse, outside this file.
  - node: constraints/internal-failure-withholds-cause
    held_at: nowhere
    evidence: >-
      The file never answers an internal failure itself. The write handlers delegate with `return sendError(err, reply, deps.logger);`, and the metrics catch turns a 500 into a fixed 503 answer.
  - node: constraints/unreachable-store-answers-unavailable
    held_at: >-
      The catch block of GET /metrics, which answers 503 SYSTEM_SERVICE_UNAVAILABLE in place of a 500. The write routes delegate to sendError.
    evidence: >-
      const degradedStatus = statusCode === 500 ? 503 : statusCode; ... code: "SYSTEM_SERVICE_UNAVAILABLE", message: "A backing service is temporarily unavailable."
