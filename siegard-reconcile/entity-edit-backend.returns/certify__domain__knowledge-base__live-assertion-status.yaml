certified:
  - node: domain/knowledge-base/live-assertion-status
    state: partial
    tests:
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: is accepted for the active, uncertain and disputed statuses and refused as a conflict for the superseded and deleted statuses
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: is accepted only for a live attribute of the edited node and key, and refused as a conflict for every other identity
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: is refused as a conflict only when a single-current key already holds a live attribute of the edited node
      - file: src/__tests__/unit/curation/entity-edit-effect.spec.ts
        name: holds exactly active, uncertain and disputed as the live statuses
      - file: src/__tests__/unit/curation/entity-edit-effect.spec.ts
        name: holds exactly the five assertion statuses
    why: >-
      The node states which statuses count as still held for two subjects, a knowledge link and a node attribute. For the node attribute the offered proof does decide the enumeration. A named attribute is treated as held for active, uncertain and disputed, and refused as no longer held for superseded and deleted. A single-current key whose only attribute is disputed still counts as holding a value, while one whose attributes are all superseded or deleted does not. The exported LIVE_STATUSES constant is asserted to be exactly active, uncertain and disputed. Nothing in the offered proof holds or reads a knowledge link at any status, so the link half of the fact goes unexercised. The LIVE_STATUSES and AssertionStatusSchema tests assert the values of exported constants. They would fail if the set changed, but not if the link path held its own list of statuses, so they do not close the link half. "holds exactly the five assertion statuses" also asserts the whole status vocabulary, superseded and deleted included. That is more than this node states: the node names only the three live statuses and defines the rest only as what it excludes.
    remainder: testable
    remainder_why: >-
      For each of the five statuses (active, uncertain, disputed, superseded, deleted), hold one knowledge link with that status and run the operation that decides whether a link is still held. The expected result is that active, uncertain and disputed links are treated as held, and superseded and deleted links are not.