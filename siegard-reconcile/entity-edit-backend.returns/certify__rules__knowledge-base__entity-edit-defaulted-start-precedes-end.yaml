certified:
  - node: rules/knowledge-base/entity-edit-defaulted-start-precedes-end
    state: covered
    tests:
      - file: src/__tests__/unit/curation/attribute-change-validity.spec.ts
        name: answers BUSINESS_TEMPORAL_INCOHERENT when the end is of today
      - file: src/__tests__/unit/curation/attribute-change-validity.spec.ts
        name: answers BUSINESS_TEMPORAL_INCOHERENT when the end is earlier than today
      - file: src/__tests__/unit/curation/attribute-change-validity.spec.ts
        name: answers accepted when the end is later than today
      - file: src/__tests__/unit/curation/attribute-change-validity.spec.ts
        name: is not held to the defaulted-start rule when its end is not after today
      - file: src/__tests__/unit/curation/attribute-change-validity.spec.ts
        name: is not refused when it states neither a validity start nor a validity end
      - file: src/__tests__/unit/curation/attribute-change-validity.spec.ts
        name: takes today as the UTC calendar date when the server zone is behind UTC
      - file: src/__tests__/unit/curation/attribute-change-validity.spec.ts
        name: takes today as the UTC calendar date when the server zone is ahead of UTC
    why: >-
      The fact is exercised whole at its boundary. A set change to a temporal key with an
      end and no start is refused when the end is today or earlier, and accepted when the
      end is tomorrow. So if the refusal were dropped, or loosened to "not before today",
      a named test would fail. Changes outside the fact's scope are also exercised: one
      that states both a start and an end in the past is not refused on this ground, and
      one that states neither is accepted. Over-assertion, for a reader to route rather
      than settled here: the two tests "takes today as the UTC calendar date when the
      server zone is behind/ahead of UTC" require "today" to be the UTC calendar date.
      This node does not say which calendar "today" is read in. That may be held by
      rules/knowledge-base/entity-edit-start-defaults-to-today, which this certification
      did not open. The refusal cases also pin the code BUSINESS_TEMPORAL_INCOHERENT,
      which this node does not name.