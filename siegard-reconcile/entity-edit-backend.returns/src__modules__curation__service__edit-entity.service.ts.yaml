findings:
  - file: src/modules/curation/service/edit-entity.service.ts
    where: >-
      lazyNote(), line 86, together with the removal branch of recordChange(), lines 204-211. scope.noteOf is called only from writeNewAttribute(), line 178.
    evidence: >-
      `recorded ??= recordOperatorNote(client, input);` and, in the removal branch, `await recordRemoval(scope.client, {` with `attributeId: removedId,` and `editedAt: scope.editedAt,`. The only call of the note is `note: await scope.noteOf(),` inside writeNewAttribute.
    cost: >-
      The node says an accepted entity edit records one raw information, one raw chunk and one accepted information fragment whose text is the reason. This file records them only when a change writes a new attribute. An edit made only of remove changes, such as the scenario that empties one email, is accepted. It rejects the attribute and records its curation action, but it records no note. recordRemoval is handed only `attributeId` and `editedAt`, and recordEditAction only `nodeId`, `reason` and `applied`. Neither receives the note or `scope.noteOf`. The removal then has no raw information, chunk or fragment behind its reason. The decision log of entity-edit-removal says "the note for the same edit records that moment", which assumes the note exists for a removal. A reader who trusts the node will not find the case where the code skips it.
    kind: contradicts
    correction: >-
      Make the note unconditional for an accepted edit. Either call scope.noteOf() once an edit is known to change something, before recordEditAction, or drop the laziness. Also state in the specification where the LLM run opens, if an edit that records no note is intended.
    node: rules/knowledge-base/entity-edit-note
