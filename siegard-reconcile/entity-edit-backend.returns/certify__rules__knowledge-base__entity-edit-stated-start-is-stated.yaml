certified:
  - node: rules/knowledge-base/entity-edit-stated-start-is-stated
    state: partial
    tests:
      - file: src/__tests__/unit/curation/entity-edit-new-attribute.spec.ts
        name: is recorded with that start and the basis stated
    why: >-
      The named test sends a set change that states a validity start to a temporal
      key that holds no value yet. It asserts that the attribute is recorded with
      that same start and with the basis "stated". It would fail if either half
      stopped holding for that case. But the offered proof only drives
      recordNewAttribute, which records a first value or an addition. The fact
      covers every set change, and nothing in the set sends a set change that
      states a start to a key that already holds a current value. So whether a
      replacement value is also recorded with the stated start and the basis
      "stated" goes unexercised. Nothing in the set sends a stated start through a
      multi-valued key's addition either; only the single-valued deadline key with
      no held row is exercised. Two other tests in the file touch validity without
      bearing on this fact. "is recorded holding that end, or none when it states
      none, whether or not it states a start" asserts only the end. "holds no
      validity start, no validity end and no basis, whether or not the change
      states a validity" asserts that a non-temporal key records no start even
      when one is stated. The node does not say whether "a set change" includes
      changes to non-temporal keys, and that test settles the question in favour
      of recording nothing.
    remainder: testable
    remainder_why: >-
      One input: a set change stating a validity start for a temporal key that
      already holds a current value, so the change replaces it. One expected
      result: the successor attribute is recorded with exactly that start and the
      basis "stated". A second assertion of the same shape would close the
      addition case: a set change with a stated start to a multi-valued key,
      expecting that start and the basis "stated".