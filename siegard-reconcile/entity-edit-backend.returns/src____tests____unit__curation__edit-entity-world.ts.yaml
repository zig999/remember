    evidence: >-
      The file calls the service directly and has no authentication step.
  - node: constraints/expected-refusals-not-logged-as-errors
    held_at: >-
      nowhere
    evidence: >-
      `const deps = { pool, logger: pino({ level: "silent" }), catalog: CATALOG };` silences logging and states no logging rule.
  - node: constraints/internal-failure-withholds-cause
    held_at: >-
      nowhere
    evidence: >-
      `codeOf(error)` only reads an error's `code`. It states no fixed message and no withholding rule.
  - node: constraints/unreachable-store-answers-unavailable
    held_at: >-
      nowhere
    evidence: >-
      The file injects a store failure with `STORE_UNAVAILABLE_CODE = "08006"` and `throw storeError(failure.code ?? STORE_UNAVAILABLE_CODE)`. The answer to that failure is the service's and the route's.
