looked_past: >-
  The file is a test double of the store, a regex-driven imitation of SQL statements with fixture rows and a catalog snapshot. I saw it as test infrastructure and not as a stater of domain facts: its seed values are data, and its imitation of storage columns, statuses and the unique-violation code mirror the store's own schema, which belongs to another judgment.