      The file states no route, status or refusal code. It calls `editEntityService(deps, nodeId, body)` and returns the code a failure carries, in `settledCode`.
  - node: domain/knowledge-base/applied-change
    held_at: >-
      `entryOf` builds the expected shape of one applied change, as a test oracle and not as a declared type.
    evidence: >-
      `attribute_key: attributeKey, effect, item_id: ids.item ?? null, predecessor_id: ids.predecessor ?? null,`
