read:
  - node: constraints/entity-edit-is-atomic
    held_at: >-
      nowhere
    evidence: >-
      The harness only snapshots and restores around the service's own statements, in `applyControl`: `if (control === "begin") context.snapshot = structuredClone(context.store);`. The service holds the transaction.
  - node: constraints/entity-editing-is-not-a-language-model-tool
    held_at: >-
      nowhere
    evidence: >-
      The file builds only `editEntityService(deps, nodeId, body)` and has no tool surface.
  - node: constraints/every-operation-requires-owner-authentication
    held_at: >-
