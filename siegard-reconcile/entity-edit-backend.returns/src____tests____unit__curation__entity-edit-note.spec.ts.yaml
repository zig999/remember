findings:
  - file: src/__tests__/unit/curation/entity-edit-note.spec.ts
    where: >-
      the assertion of the raw information's source type, in the test "has source type other and metadata of operator_note true and the edited node's identity under node_id" (line 298)
    evidence: >-
      source_type: "outro",
    cost: >-
      The spelling in which a source type of other is stored sits only in this test. The node says only "source type other". The rule that gives "outro" as the material's word governs how a source type crosses the wire, not how it is stored. Someone who changes the stored spelling reads the specification, finds no stored spelling there, and has no node that tells them this assertion is the one to update.
    kind: unstated
    correction: >-
      Analysis would have to decide whether the stored spelling of a source type is a fact of the specification. If it is, a node holds it, either rules/knowledge-base/a-source-type-crosses-the-wire-in-the-materials-words extended beyond the wire or a new rule. If it is not, the assertion should not pin the stored spelling.
    node: rules/knowledge-base/entity-edit-note-source
