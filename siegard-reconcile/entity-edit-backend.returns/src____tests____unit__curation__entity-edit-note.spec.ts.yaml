looked_past: >-
  The test pins how the moment of the edit is written into the raw information's content: an ISO date and an HH:MM:SS time of day, from `EDITED_DATE`, `EDITED_TIME` and `includes(EDITED_TIME)`. The node says only "the moment of the edit". I read that as a format detail of the note's content, and I did not report it as a domain fact.
