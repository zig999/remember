    evidence: >-
      `{ label: "29 February of a common year", key: "born", value: "2023-02-29" },`, `{ label: "digits beyond a finite number", key: "height", value: HUGE_DIGITS },`, `{ label: "True for a bool key", key: "deceased", value: "True" },`, `{ label: "a negative decimal", key: "height", value: "-12.5" },`, `{ label: "text shaped like an impossible date", value: "2024-02-30" },`
