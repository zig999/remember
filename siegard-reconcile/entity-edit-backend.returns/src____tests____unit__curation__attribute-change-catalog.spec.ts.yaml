    held_at: >-
      The tests of the first describe block assert the refusal of a key the catalog does not hold for the node type.
    evidence: >-
      `const change = setChange("published_on", "2024-03-15"); const outcome = outcomeOf(change); expect(outcome).toBe(UNKNOWN_KEY);` and `const change = removeChange("favourite_colour"); ... expect(outcome).toBe(UNKNOWN_KEY);`
  - node: rules/knowledge-base/attribute-value-in-allowed-values
    held_at: >-
      The tests of the describe block "checking a set change's value against its key's allowed values". They assert the refusal of a value outside the allowed values and the acceptance of one written exactly.
    evidence: >-
      `{ label: "a value differing only in letter case", value: "Active" },` and `expect(outcome).toBe(INVALID_VALUE);` and `const change = setChange("lifecycle_stage", "active"); ... expect(outcome).toBe(ACCEPTED);`
  - node: rules/knowledge-base/attribute-value-parses
    held_at: >-
