findings:
  - file: src/modules/compliance-audit/dto/curation-action.dto.ts
    where: >-
      TargetKindSchema, the last enumeration member (line 22)
    evidence: >-
      "raw_information",
    cost: >-
      The curation-target-kind node holds this member as `raw-information`. The only rule that writes hyphens as underscores for curation actions, a-curation-action-kind-is-written-with-underscores, covers the action kind and nothing else. The target-kind filter value a listing accepts is therefore decided only in this schema. The next reader looks in the specification for how `raw-information` is spelled on the wire and finds the hyphen form. A client that follows the node and sends `raw-information` is refused as outside the closed set.
    kind: unstated
    correction: >-
      The analysis should decide the wire spelling of a curation target kind. It could add a rule beside a-curation-action-kind-is-written-with-underscores, or extend that rule to the target kind. The file would then hold a fact a node states.
    node: domain/knowledge-base/curation-target-kind
