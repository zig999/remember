certified:
  - node: rules/knowledge-base/entity-edit-names-a-live-attribute
    state: partial
    tests:
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: is accepted only for a live attribute of the edited node and key, and refused as a conflict for every other identity
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: is accepted for the active, uncertain and disputed statuses and refused as a conflict for the superseded and deleted statuses
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: is refused as a conflict when a set change states another value for the superseded deadline attribute
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: is refused as a conflict when a set change names a %s attribute and states that attribute's own value
      - file: src/__tests__/unit/curation/entity-edit-attributes.spec.ts
        name: is refused as a conflict when the attribute is superseded
    why: >-
      The rule covers every change that names an attribute, and the tests prove it fully only for
      set changes. For a set change, the tests cover each part of the rule. The named attribute
      must belong to the edited node, so naming another node's live attribute is refused. It must
      be of the change's key, so naming the node's live attribute of another key is refused. It
      must be held at all, so naming an identity where nothing is held is refused. Its status must
      be live: the tests accept active, uncertain and disputed and refuse superseded and deleted.
      Remove changes get much less. The only remove change in the set names a superseded
      attribute of the edited node and key. No remove change names a deleted attribute, another
      node's attribute, an attribute of another key, or an identity where nothing is held. No
      remove change names a live attribute and is accepted. If removal checked only status, or
      skipped the node and key check, the rule would stop holding for remove changes and every
      test in the set would still pass. The tests also take as given that active, uncertain and
      disputed are exactly the live statuses. The status table would catch a change in how the
      code classifies them, but nothing in the offered proof checks that classification against
      the live-assertion-status node itself.
    remainder: testable
    remainder_why: >-
      A table of remove changes against expected outcomes. A remove change naming each of these
      must come back as a conflict: a deleted attribute of the edited node and key, a live
      attribute of another key of the edited node, a live attribute of another node, and an
      identity where nothing is held. A remove change naming an active, an uncertain or a disputed
      attribute of the edited node and key must be accepted.