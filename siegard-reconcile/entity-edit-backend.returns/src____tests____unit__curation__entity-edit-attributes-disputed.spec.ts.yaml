  - node: rules/knowledge-base/entity-edit-leaves-disputes-to-curation
    held_at: >-
      The describe blocks "a set change naming a disputed attribute" and "a remove change naming a disputed attribute". Their `outcomeOf("disputed", change)` results are asserted equal to `DISPUTED` for a set change with another value, for a set change differing only in letter case, and for a remove change. The block "a change naming a live attribute that is not disputed" asserts acceptance for active and uncertain attributes.
    evidence: >-
      const outcome = await outcomeOf("disputed", change);

      expect(outcome).toBe(DISPUTED);
