certified:
  - node: rules/knowledge-base/entity-edit-note-run
    state: covered
    tests:
      - file: src/__tests__/unit/curation/entity-edit-note.spec.ts
        name: is the run the edit opened, never a run that already existed, for both the fragment and the raw information it is anchored in
      - file: src/__tests__/unit/curation/entity-edit-note.spec.ts
        name: is one raw information, one chunk holding all of its content and one accepted fragment anchored to that chunk whose text is the reason
    why: >-
      The first test seeds a run and a raw information that already existed. It asserts that the
      fragment's run is the operator run the edit opened, and that this run's input raw information
      is the one new raw information. A fragment filed under the existing run, or under any other
      run, fails it. That test finds the note's raw information by elimination, though: it does not
      follow the path from the fragment through its chunk to a raw information. That link is
      asserted only by the second test, where the chunk belongs to the single raw information and
      the fragment is anchored to that chunk. So the half saying "the raw information that fragment
      is anchored in" belongs to the opened run is proven by the two tests together, not by the
      run test alone. A change to the second test can drop that half without touching the run test.