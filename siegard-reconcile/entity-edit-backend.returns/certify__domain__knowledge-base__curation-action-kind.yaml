certified:
  - node: domain/knowledge-base/curation-action-kind
    state: partial
    tests:
      - file: src/__tests__/unit/compliance-audit/curation-action.dto.spec.ts
        name: admits $written as the action filter
      - file: src/__tests__/unit/compliance-audit/curation-action.dto.spec.ts
        name: refuses the hyphen spelling $enumerated as the action filter
    why: >-
      The node's set is these eight kinds and no others. The proof checks the first half: "admits
      $written as the action filter" sends each of the eight kinds, in its underscore spelling, to
      ListCurationActionsQuerySchema and requires that it parse. If a kind were dropped, that test
      would fail. The "no others" half is never tested. The only values the set expects to be
      refused are the hyphen spellings of the same eight kinds. Nothing submits a kind outside the
      eight, so a ninth kind admitted by the schema would pass every test in the set. The proof
      also reaches the kinds only through the list endpoint's query filter. Nothing in it records a
      curation action, so the node's statement that these are the kinds an action records is
      tested only through the filter that reads them back. The test "refuses the hyphen spelling
      $enumerated as the action filter" also asserts more than the node states. The node writes
      its values with hyphens. This test requires those exact spellings to be refused, which makes
      the underscore wire spelling the thing being enforced. The node does not decide that
      spelling. A reader should route this as a finding; it adds no coverage of the node.
    remainder: testable
    remainder_why: >-
      Two assertions would close it. First, a kind outside the eight, such as approve_item, is
      sent as the action filter and must be refused. Second, the set of action values the schema
      admits is asserted to equal exactly the eight kinds the node lists.