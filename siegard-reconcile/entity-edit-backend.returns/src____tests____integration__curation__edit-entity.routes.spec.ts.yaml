findings:
  - file: src/__tests__/integration/curation/edit-entity.routes.spec.ts
    where: >-
      namedBy(), lines 124-130, used by the it.each over PATH_NODES (lines 206-219)
    evidence: >-
      `return answer.node_id ?? answer.error?.details?.node_id;`
    cost: >-
      The test fixes the wire key `details.node_id` as the place a refusal names the node. The contract says only that the refusal is "naming the node". A reader who looks in the specification for where the refused node's identity travels finds no key, and the test is then the only place that decides it. A later change of that key would fail here with no node to say which side was decided.
    kind: unstated
    correction: >-
      Give the entity-editing contract the key under which BUSINESS_NODE_NOT_ACTIVE and RESOURCE_NOT_FOUND carry the node's identity in `details`. Alternatively, have the test assert only what the contract states.
    node: contracts/knowledge-base/entity-editing
