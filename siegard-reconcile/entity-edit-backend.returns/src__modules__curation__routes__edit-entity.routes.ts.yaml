  - node: contracts/knowledge-base/entity-editing
    held_at: >-
      The route declaration `app.post(EDIT_ENTITY_PATH, ...)`, the `ACCEPTED_STATUS` constant, and the `reply.status(ACCEPTED_STATUS).send(result)` statement. Refusals are delegated to `sendError`, which this file does not declare.
    evidence: >-
      const EDIT_ENTITY_PATH = "/nodes/:node_id/edit"; const ACCEPTED_STATUS = 200; return reply.status(ACCEPTED_STATUS).send(result);
  - node: rules/knowledge-base/an-edit-effect-crosses-the-wire-with-underscores
    held_at: nowhere
    evidence: >-
      The file only forwards the service result: `return reply.status(ACCEPTED_STATUS).send(result);`. It does not spell any effect.
  - node: constraints/entity-edit-is-atomic
    held_at: nowhere
    evidence: >-
      `const result = await editEntityService(deps, edit.nodeId, edit.body);`. The file opens no transaction. It only passes `deps` to the service.
  - node: constraints/entity-editing-is-not-a-language-model-tool
    held_at: nowhere
    evidence: >-
      `app.post(EDIT_ENTITY_PATH, ...)` registers a REST route only. The file mounts no MCP tool.
