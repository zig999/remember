  - node: domain/knowledge-base/edit-effect
    held_at: >-
      nowhere
    evidence: >-
      The file never asserts or names an effect. It reads only `status`, `superseded_at`, `valid_to`, `value` and `supersedes_attribute_id`.
  - node: domain/knowledge-base/entity-edit
    held_at: >-
      nowhere
    evidence: >-
      The file builds no edit with a reason and a list of changes. It calls `recordCorrection` with one `change`.
  - node: domain/knowledge-base/live-assertion-status
    held_at: >-
      nowhere
    evidence: >-
      `const LIVE_STATUSES: readonly string[] = ["active", "uncertain", "disputed"];` is a guard inside the fake store. It is not a declaration of the enumeration's shape, so the fact is not held here.
  - node: domain/knowledge-base/node-attribute
    held_at: >-
      nowhere
    evidence: >-
      The file keeps attribute rows as untyped `Row = Record<string, unknown>` in its fake store. It declares no node-attribute shape.
