  - node: rules/knowledge-base/entity-edit-correction
    held_at: >-
      The describe blocks "the status of the attribute a correction supersedes" and "the new attribute a correction records", and the cnpj correction cases. They run `recordCorrection` for a current attribute of a non-temporal key with a different value.
    evidence: >-
      expect(outcome.predecessor.status).toBe("superseded");
      expect(outcome.recorded.supersedes_attribute_id).toBe(PREDECESSOR_ID);
      expect(outcome.recorded.value).toBe(NEW_CNPJ);
  - node: rules/knowledge-base/entity-edit-defaulted-start-precedes-end
    held_at: >-
      nowhere
    evidence: >-
      No test states a validity end without a start.
  - node: rules/knowledge-base/entity-edit-ended-attribute-correction
    held_at: >-
      The test "is the moment of the supersession when the attribute already holds a validity end" and the test "is active even when the superseded attribute was uncertain and held a validity end".
    evidence: >-
      predecessor: { value: OLD_DEADLINE, status: "uncertain", valid_from: "2026-03-01", valid_to: PREDECESSOR_END, }
      expect(outcome.recorded.status).toBe("active");
  - node: rules/knowledge-base/entity-edit-first-value
