read:
  - node: constraints/entity-edit-is-atomic
    held_at: >-
      nowhere
    evidence: >-
      The file drives only `recordCorrection(client, {...})` against a fake client, with no transaction, commit or rollback in it.
  - node: constraints/entity-editing-is-not-a-language-model-tool
    held_at: >-
      nowhere
    evidence: >-
      No tool surface appears in the file. Its imports are `AttributeChangeSchema` and `recordCorrection`.
  - node: constraints/every-operation-requires-owner-authentication
    held_at: >-
      nowhere
    evidence: >-
      The file never reaches a network operation or a bearer token. It calls `recordCorrection` directly.
  - node: constraints/expected-refusals-not-logged-as-errors
    held_at: >-
      nowhere
    evidence: >-
      The file has no log call and no refusal path.
  - node: constraints/internal-failure-withholds-cause
    held_at: >-
      nowhere
    evidence: >-
      The only thrown errors are fake-store guards such as `throw new Error("expected the attribute to exist")`, not an operation's answer.
  - node: constraints/unreachable-store-answers-unavailable
    held_at: >-
      nowhere
    evidence: >-
      The fake client never simulates an unreachable store or a timeout.
  - node: contracts/knowledge-base/compliance-audit
    held_at: >-
      nowhere
    evidence: >-
      Compliance deletion and the listings are not touched in the file.
  - node: contracts/knowledge-base/entity-editing
    held_at: >-
      nowhere
    evidence: >-
      The file calls the service function, not the route. No `POST /api/v1/nodes/{node_id}/edit`, `applied` list or refusal code appears.
  - node: domain/knowledge-base/applied-change
    held_at: >-
      nowhere
    evidence: >-
      The file never builds or reads an applied change. `recordCorrection` is exercised for its store effects only.
  - node: domain/knowledge-base/assertion-status
    held_at: >-
      nowhere
    evidence: >-
      The file declares no shape for it. It only compares statuses, for example `expect(outcome.predecessor.status).toBe("superseded")`.
  - node: domain/knowledge-base/attribute-change
    held_at: >-
      nowhere
    evidence: >-
      The file only builds a change with `AttributeChangeSchema.parse({ attribute_key: "any", kind: "set", value: ... })`. The shape is declared in another file.
  - node: domain/knowledge-base/attribute-change-kind
    held_at: >-
      nowhere
    evidence: >-
      The file only passes `kind: "set"` along. It declares no enumeration.
  - node: domain/knowledge-base/attribute-key
    held_at: >-
      nowhere
    evidence: >-
      The file builds `CNPJ_KEY` and `DEADLINE_KEY` fixtures typed `AttributeKeyRow`, imported from the catalog. It declares no shape of its own.
  - node: domain/knowledge-base/curation-action
    held_at: >-
      nowhere
    evidence: >-
      The file records and reads no curation action.
  - node: domain/knowledge-base/curation-action-filter
    held_at: >-
      nowhere
    evidence: >-
      No listing or filter appears in the file.
  - node: domain/knowledge-base/curation-action-kind
    held_at: >-
