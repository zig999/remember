  - node: domain/knowledge-base/entity-edit
    held_at: >-
      nowhere. The file declares OperatorNoteInput, which carries only the reason and two other fields. It does not declare the entity edit's shape (reason, changes).
    evidence: >-
      readonly nodeId: string; readonly reason: string; readonly editedAt: Date;
  - node: rules/knowledge-base/entity-edit-note
    held_at: >-
      recordOperatorNote, through insertNoteSource, wholeContentChunk and insertAcceptedNoteFragment.
    evidence: >-
      const raw = await insertRawInformation(client, { ... content, ... }); const [chunk] = await insertRawChunks(client, raw.id, [ wholeContentChunk(content), ]); text: args.reason, ... chunk_ids: [args.chunkId], ... const accepted = await acceptInformationFragment(client, fragment.id);
  - node: rules/knowledge-base/entity-edit-note-confidence
    held_at: >-
      The OPERATOR_NOTE_CONFIDENCE constant, passed to insertFragmentWithSources.
    evidence: >-
      export const OPERATOR_NOTE_CONFIDENCE = 1.0; ... confidence: OPERATOR_NOTE_CONFIDENCE,
  - node: rules/knowledge-base/entity-edit-note-content
    held_at: >-
      composeNoteContent, called from recordOperatorNote with randomUUID() as the nonce.
    evidence: >-
      return [reason, editedAt.toISOString(), nonce].join(NOTE_CONTENT_SEPARATOR); ... const content = composeNoteContent(reason, input.editedAt, randomUUID());
  - node: rules/knowledge-base/entity-edit-note-run
    held_at: >-
      recordOperatorNote. It opens the run for the note's raw information and records the fragment under that same run's id.
    evidence: >-
      const run = await openOperatorRun(client, source.rawInformationId, source.contentHash); ... llmRunId: run.id,
  - node: rules/knowledge-base/entity-edit-note-source
    held_at: >-
      OPERATOR_NOTE_SOURCE_TYPE and the metadata argument in insertNoteSource.
    evidence: >-
      const OPERATOR_NOTE_SOURCE_TYPE: SourceType = "outro"; ... metadata: { operator_note: true, node_id: nodeId },
  - node: rules/knowledge-base/entity-edit-reason-trimmed
    held_at: >-
      The first statement of recordOperatorNote. Both the note content and the fragment text are built from the trimmed reason.
    evidence: >-
      const reason = input.reason.trim();
  - node: rules/knowledge-base/entity-edit-run
    held_at: >-
