looked_past: >-
  I saw the newline separator and ISO-8601 rendering of the moment inside the note content, the run's idempotency-key composition, and the code-point chunk offsets. They are representation choices beneath what entity-edit-note-content and entity-edit-note state, not domain facts, so I did not report them.
