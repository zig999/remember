  - node: rules/knowledge-base/entity-edit-defaulted-start-precedes-end
    held_at: >-
      The `describe("a set change to a temporal key that states a validity end and no validity start")` block. Its cases expect an end of today or earlier to be refused with `INCOHERENT` and an end later than today to be accepted. It also expects the rule not to apply when a start is stated, in "is not held to the defaulted-start rule when its end is not after today".
    evidence: >-
      { label: "of today", validTo: UTC_TODAY, expected: INCOHERENT }, { label: "later than today", validTo: UTC_TOMORROW, expected: ACCEPTED }
