  - node: rules/knowledge-base/stable-key-change-states-no-validity
    held_at: >-
      The `describe("a change to a key that is not temporal")` block, which expects a set or remove change stating a start or an end to be refused. The `describe("a change that states no validity to a key that accepts none")` block expects a change stating none to be accepted.
    evidence: >-
      it.each(STABLE_KEY_STATING_VALIDITY)("is refused with BUSINESS_TEMPORAL_INCOHERENT when it states $label", ... expect(outcome).toBe(INCOHERENT);
  - node: rules/knowledge-base/unrecorded-temporality-is-not-temporal
    held_at: >-
      The `describe("a change to a key that records no temporality")` block, which uses `UNRECORDED_TEMPORALITY_KEY` (`is_temporal: null`) and expects the same refusal as for a key that is not temporal.
    evidence: >-
      const UNRECORDED_TEMPORALITY_KEY = keyWithTemporality(null); ... const attributeKey = UNRECORDED_TEMPORALITY_KEY; ... expect(outcome).toBe(INCOHERENT);
  - node: rules/knowledge-base/validity-start-before-end
    held_at: >-
      The `describe("a change that states both a validity start and a validity end")` block. It expects a start equal to or later than the end to be refused, on a set or a remove change, and a start one day earlier to be accepted.
    evidence: >-
      label: "equal to its end", change: setChange({ valid_from: "2026-09-10", valid_to: "2026-09-10" }) ... expect(outcome).toBe(INCOHERENT);
