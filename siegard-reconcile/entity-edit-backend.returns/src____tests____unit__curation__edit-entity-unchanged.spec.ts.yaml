    held_at: >-
      The refusal code asserted for a named superseded or deleted attribute, `const CONFLICT = "BUSINESS_ENTITY_EDIT_CONFLICT";`, and the applied-entry shape read as `answer.applied[0]?.effect`.
    evidence: >-
      "a named superseded attribute, the same value": { held: emailHeld(NO_LONGER_LIVE), change: namingEmail(HELD_EMAIL), expected: CONFLICT }
  - node: domain/knowledge-base/applied-change
    held_at: >-
      Only the `effect` field of the first applied entry is read. The shape is declared elsewhere.
    evidence: >-
      return `${answer.applied[0]?.effect}/${probed.length}`;
