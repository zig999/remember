    held_at: >-
      nowhere
    evidence: >-
      The file never mentions a tool surface or MCP. It only calls `world.edit(body)`.
  - node: constraints/every-operation-requires-owner-authentication
    held_at: >-
      nowhere
    evidence: >-
      The file has no authentication step. `buildWorld({ attributes: [probe.held] })` is the whole setup.
