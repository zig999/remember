looked_past: >-
  The file carries no comments. The `refuseOnValidationFailure` wrapper, the ALLOWED_VALUES_SEPARATOR of ", " in the refusal message, and the way the unexpected-failure Error carries its cause are implementation choices that state no domain fact, and a code review would judge them.