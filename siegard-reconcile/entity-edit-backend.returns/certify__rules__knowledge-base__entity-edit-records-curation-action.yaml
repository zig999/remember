certified:
  - node: rules/knowledge-base/entity-edit-records-curation-action
    state: covered
    tests:
      - file: src/__tests__/unit/curation/edit-entity-answer.spec.ts
        name: is one edit_entity action on the edited node carrying the reason and every applied entry in the order given
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: is written edit_entity
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: is of the kind node
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: is the edited node's identity
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: is the edit's reason, inner whitespace kept
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: is an object holding an applied list
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: lists one entry for each applied change
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: lists the entries in the order the changes were given
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: gives each entry exactly attribute_key, effect, item_id and predecessor_id
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: gives an entry the values of the applied change it lists
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: writes the effect of a first-value entry as first_value
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: carries item_id as null on an unchanged entry rather than omitting it
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: carries predecessor_id as null on a first-value entry rather than omitting it
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: records one action for one accepted edit however many changes it applied
      - file: src/__tests__/unit/curation/entity-edit-action.spec.ts
        name: records the edit_entity action on the edited node with the reason and every applied change
    why: >-
      Every part of the fact is asserted on the recorded row. That covers one action per
      accepted edit, kind edit_entity, target kind node, target id the edited node, the reason
      as the reason, and a payload object whose applied list has one entry of exactly the four
      fields per change, in the order given. It also covers first-value written as first_value,
      and item_id and predecessor_id carried as null rather than left out. The end-to-end test
      in edit-entity-answer.spec.ts checks the same row through the accepted-edit path for six
      effects. Its expected entries come from the helper mixedEditEntries in
      edit-entity-world.js, which the pack does not offer, so I did not open it. Two points are
      for a reader to route, not for me to settle. First, "is the edit's reason without its
      surrounding whitespace" asserts more than this node states: it requires the reason to be
      trimmed, and the node only says the reason is recorded as the reason. Second, the unit
      tests rebuild the row by matching the SQL against a single
      INSERT INTO curation_action ... VALUES ($n[::jsonb]) pattern. Recording the same row in
      another statement shape would fail them even though the fact still holds, so they are
      partly tied to how the code is written.