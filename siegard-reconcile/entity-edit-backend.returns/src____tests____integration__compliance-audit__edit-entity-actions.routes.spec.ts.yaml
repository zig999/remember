read:
  - node: constraints/entity-edit-is-atomic
    held_at: nowhere
    evidence: >-
      The file only builds a fake pool that answers `FROM curation_action` reads and throws on any other SQL. It runs no edit write operation: `throw new Error(`fake client: unknown SQL: ${text.slice(0, 200)}`)`.
  - node: constraints/entity-editing-is-not-a-language-model-tool
    held_at: nowhere
    evidence: >-
      The app is built with `mcp: buildMcpServer(silentLogger)`, but the file calls no MCP tool and states nothing about which tools exist.
  - node: constraints/every-operation-requires-owner-authentication
    held_at: nowhere
    evidence: >-
      The file only supplies a valid token, `headers: { authorization: `Bearer ${token}` }`. It never sends a missing, expired or foreign token, so it asserts no authentication outcome.
  - node: constraints/expected-refusals-not-logged-as-errors
    held_at: nowhere
    evidence: >-
      `LOG_LEVEL: "silent"` and `const silentLogger = pino({ level: "silent" });`. The file asserts nothing about log levels.
  - node: constraints/internal-failure-withholds-cause
    held_at: nowhere
    evidence: >-
      No test provokes an unexpected failure. The only status codes asserted are 200 and 422.
  - node: constraints/unreachable-store-answers-unavailable
    held_at: nowhere
    evidence: >-
      The fake pool always answers. `PG_STATEMENT_TIMEOUT_MS: 10_000` is only an environment fixture value, and no test makes the store unreachable.
  - node: contracts/knowledge-base/compliance-audit
    held_at: >-
      The `describe` blocks "Audit listing action filter spelled with a hyphen" and "Reading one curation action of kind edit_entity". They assert the list-curation-actions closed-set refusal and the read-curation-action 200 fields. The conformance behavior lives in production code, not here.
    evidence: >-
      `expect(res.statusCode).toBe(422); expect(res.json().error.code).toBe("VALIDATION_INVALID_FORMAT");` and `expect(res.json()).toEqual({ id: EDIT_ENTITY_ACTION_ID, action: res.json().action, target_kind: "node", target_id: NODE_ID, payload, reason: "renamed", created_at: "2026-10-01T12:00:00.000Z" });`
