looked_past: >-
  Three things are fixture data or the route address, and no judgment of a domain fact. First, the audit route path `/api/v1/audit/curation-actions`, which no node states for list-curation-actions or read-curation-action; the production route holds it. Second, the fixture payload `{ changed: { name: "Acme Ltda" } }` on an edit_entity row, which differs in shape from the `applied` payload an entity edit records but is only passed through by the read. Third, the fixture `target_kind: "raw_information"`, whose wire spelling no node in this set states.