certified:
  - node: rules/knowledge-base/entity-edit-stated-end-is-held
    state: partial
    tests:
      - file: src/__tests__/unit/curation/entity-edit-new-attribute.spec.ts
        name: is recorded holding that end, or none when it states none, whether or not it states a start
      - file: src/__tests__/unit/curation/entity-edit-new-attribute.spec.ts
        name: holds no validity start, no validity end and no basis, whether or not the change states a validity
    why: >-
      The fact is covered for temporal keys only. "is recorded holding that end, or
      none when it states none, whether or not it states a start" sends three set
      changes to the temporal deadline key: one stating a start and an end, one
      stating only an end, and one stating neither. It asserts the recorded
      attribute's valid_to in all three, which is the stated end, the stated end, and
      none. If either half of the fact stopped holding for a temporal key, this test
      would fail.

      The node does not limit the fact to temporal keys. It says that a new attribute
      recorded from any entity edit's set change holds the validity end the change
      states. No offered test sends a set change stating an end to a key that is not
      temporal and asserts that the end is held. The other offered test, "holds no
      validity start, no validity end and no basis, whether or not the change states a
      validity", asserts the opposite. It sends a change stating valid_to 2027-03-31
      to the non-temporal cnpj key and requires the recorded attribute to hold no
      validity end.

      So for non-temporal keys, the fact as the node states it goes unexercised, and
      the offered proof pins behaviour that contradicts it. One of two things is
      true. Either another node limits validity to temporal keys, and this node's
      statement is missing that limit. Or the delivered behaviour departs from this
      node. Which one holds is a person's decision, and this audit does not make it.
    remainder: testable
    remainder_why: >-
      One input against one expected result would close it: an entity edit's set
      change to a key that is not temporal, stating a validity end, expecting the
      recorded attribute to hold that end, plus the same change stating no end,
      expecting no end. That test would fail against the behaviour the offered proof
      currently pins for non-temporal keys. The disagreement has to be settled in the
      specification before such a test, or a narrower statement of the node, can be
      written.