certified:
  - node: scenarios/knowledge-base/an-edit-with-no-changes-is-refused-as-changing-nothing
    state: partial
    tests:
      - file: src/__tests__/unit/curation/edit-entity-refusals.spec.ts
        name: >-
          is refused as changing nothing, with nothing recorded, when an active node is edited with a reason and an empty list of changes
      - file: src/__tests__/unit/curation/edit-entity-refusals.spec.ts
        name: >-
          is refused exactly when no change has an effect other than unchanged, whether every change is unchanged or the list is empty
    why: >-
      Two parts of the fact are exercised. First, an active node edited with a reason
      and an empty list of changes is refused with exactly
      BUSINESS_ENTITY_EDIT_NO_CHANGES. Second, nothing of the edit is recorded: the whole
      store (nodes, attributes, raw information, chunks, LLM runs, fragments, fragment
      sources, provenance, curation actions) must equal its seeded snapshot.

      One part is not exercised: "not as a malformed request". The proof reaches the edit
      through its fixture, edit-entity-world.ts, which the proof imports. I read that
      fixture to judge the proof. Its settledCode calls editEntityService directly with a
      body built by editOf as a plain object. The body never passes through the request
      body schema or the route, which is where a request is judged malformed. If that
      boundary started refusing an empty changes list as a malformed request (a
      VALIDATION_* answer), the owner's edit would be refused as malformed and both tests
      would still pass. Only the individual changes are parsed (AttributeChangeSchema in
      setChange), and an empty list has none.

      Also, the given says the edited node is a person. The fixture's active node is of
      type Project, so the refusal is never observed on a person node.
    remainder: testable
    remainder_why: >-
      One input against one result. The input is an edit carrying a reason and an empty
      changes list, aimed at an active person node and submitted through the edit's
      request boundary (the route, with the body schema it applies). The expected result
      is a refusal answered as BUSINESS_ENTITY_EDIT_NO_CHANGES and not as a
      VALIDATION_* malformed-request code, with the store left exactly as it was before
      the edit.