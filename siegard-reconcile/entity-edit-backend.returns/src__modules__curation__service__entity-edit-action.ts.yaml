looked_past: >-
  The file's `reason.trim()` repeats a trim that the request DTO's `ReasonRequiredSchema` may already apply upstream, and the `EDIT_OPERATION = "edit_entity"` constant in `edit-entity.service.ts` and the enumeration in `compliance-audit/dto/curation-action.dto.ts` also state the same kind. Both are outside this file set.