certified:
  - node: rules/knowledge-base/an-edit-effect-crosses-the-wire-with-underscores
    state: covered
    tests:
      - file: src/__tests__/integration/curation/edit-entity.routes.spec.ts
        name: writes every effect with an underscore for each hyphen of its enumeration value
      - file: src/__tests__/integration/curation/edit-entity.routes.spec.ts
        name: writes the effect of a first value as first_value
      - file: src/__tests__/integration/curation/edit-entity.routes.spec.ts
        name: holds exactly first-value, addition, succession, correction, removal and unchanged
      - file: src/__tests__/unit/curation/edit-entity-answer.spec.ts
        name: writes every effect with an underscore for each hyphen of its enumeration value
    why: >-
      Covered. The REST answer is checked to spell all six enumeration values as first_value,
      unchanged, succession, removal, addition and correction. The enumeration test pins the
      stored value as first-value, so the underscore really is a change of spelling, and
      writing first-value on the wire would fail both "writes every effect" tests. Over-assertion,
      for a reader to route: both "writes every effect" tests compare the exact effect list in
      order. That fixes which effect each change in mixedEdit records, which the node says this
      rule does not decide. If the rules that record effects change, these tests break even
      though the spelling still holds.