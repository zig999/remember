findings:
  - file: src/__tests__/unit/shared/error-mapping.entity-edit.spec.ts
    where: >-
      the it.each over ENTITY_EDIT_BUSINESS_REFUSALS, lines 85-92, and the list declared at lines 11-17
    evidence: >-
      "logs %s as a warning and never at error level" ... expect(result.logLevel).toBe("warn");
    cost: >-
      The node says only that a business or validation refusal is never logged at error level. The test fixes the level at warn for each entity edit refusal code. A later change to info or debug stays inside the node and still fails this test. The next reader will take warn as a decision the business made, and will look in the specification for it and not find it. The node's decision log mentions warn only for the chat streaming case.
    kind: unstated
    correction: >-
      Either the constraint gains the level its refusals are logged at, or the assertion narrows to what the node holds, that the level is not error.
    node: constraints/expected-refusals-not-logged-as-errors
