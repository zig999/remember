looked_past: >-
  The 404 assertion for BUSINESS_UNKNOWN_ATTRIBUTE_KEY on the retrieval surface is held by contracts/knowledge-base/retrieval, so it is no finding. The `details` field names `attribute_key` and `node_type` in the curation error case, and no node in the set names those fields. I read that as a test fixture and not a fact of its own.
