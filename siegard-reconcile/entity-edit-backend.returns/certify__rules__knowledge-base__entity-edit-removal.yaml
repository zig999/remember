certified:
  - node: rules/knowledge-base/entity-edit-removal
    state: covered
    tests:
      - file: src/__tests__/unit/curation/edit-entity-records.spec.ts
        name: marks that attribute deleted with the moment of the edit as its supersession time, records no attribute, and has the effect removal
    why: >-
      Every part of the fact is exercised by one remove change that names a live attribute,
      run with the clock frozen. The test asserts four things. The named attribute's status
      becomes deleted. Its superseded_at equals the frozen moment of the edit. The answer's
      effect is removal. And it asserts one thing the fact does not state: that no attribute
      at all is recorded in the world. The node says what happens to the attribute that is
      named. It says nothing about whether a removal records other attributes. That part of
      the assertion is an over-assertion for a person to route, not part of the fact's
      coverage. The proof's fixture module (edit-entity-world.js) was not opened, as the pack
      directs. So the conclusion that EDITED_AT is the moment the frozen clock gives the edit
      rests on how the test file uses it, not on reading the helper.