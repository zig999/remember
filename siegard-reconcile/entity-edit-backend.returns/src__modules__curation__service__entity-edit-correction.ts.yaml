    held_at: >-
      recordCorrection, the supersedeAttributeAtEdit call followed by the recordNewAttribute call with `supersedes`. The effect label correction and the choice of this case are not stated in this file.
    evidence: >-
      `const superseded = await supersedeAttributeAtEdit(client, {` ... `const attributeId = await recordNewAttribute(client, { ...recorded, supersedes: predecessor.id, });`
  - node: rules/knowledge-base/entity-edit-ended-attribute-correction
    held_at: >-
      The same supersede-then-record sequence in recordCorrection. It applies whatever the predecessor's key and leaves the predecessor's own validity end untouched. Selecting the case is not in this file.
    evidence: >-
      `validTo: null,` passed to supersedeAttributeAtEdit, whose update is `valid_to = COALESCE($2::date, valid_to)` in curation.repository.ts, so an existing validity end is kept.
  - node: rules/knowledge-base/entity-edit-provenance
    held_at: >-
      The copyProvenance call in recordCorrection holds the second half, the predecessor's provenance carried to the new attribute. The first half, the edit fragment's provenance, is not in this file.
    evidence: >-
      `await copyProvenance(client, "attribute", predecessor.id, attributeId);`
  - node: rules/knowledge-base/entity-edit-supersession-time
    held_at: >-
      The `supersededAt: input.editedAt` argument in recordCorrection. A correction gives the predecessor no validity end of its own (`validTo: null`), so the supersession time is always set.
    evidence: >-
      `supersededAt: input.editedAt,`
  - node: scenarios/knowledge-base/stable-key-edit-is-a-correction
    held_at: >-
      recordCorrection holds the supersession that keeps no validity end of its own, and the new attribute that names the earlier one. Effect reporting is not in this file.
    evidence: >-
      `validTo: null,` and `supersedes: predecessor.id,`
