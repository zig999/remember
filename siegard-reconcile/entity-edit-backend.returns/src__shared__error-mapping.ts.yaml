looked_past: >-
  The status table holds one status per code, while the curation contract (BUSINESS_INVALID_TARGET_NODE at 422 and at 409) and the ingestion contract (HTTP 200 with `{ ok: false, error }` for propose-* refusals) state per-operation statuses for codes in it, and compliance-audit gives "Unexpected internal error." where internalError() says "Internal server error." — those belong to nodes outside this set and other routes' judgments.