findings:
  - file: src/shared/error-mapping.ts
    where: >-
      codeToHttpStatus, the RESOURCE_ALREADY_EXISTS entry (line 55)
    evidence: >-
      RESOURCE_ALREADY_EXISTS: 409,
    cost: >-
      The code and its status exist only in this table. A reader who looks in the specification for what an
      "already exists" refusal answers finds no node that names the code or its status. The table becomes the place
      where that decision lives.
    kind: unstated
    correction: >-
      An analysis would have to give the code and its status a node (a contract refusal), or the entry would have to
      go if no operation answers it.
  - file: src/shared/error-mapping.ts
    where: >-
      codeToHttpStatus, the BUSINESS_UNKNOWN_ATTRIBUTE_KEY entry (line 66)
    evidence: >-
      BUSINESS_UNKNOWN_ATTRIBUTE_KEY: 404,
    cost: >-
      The entity-edit contract says this refusal is HTTP 422 over REST. This table, the only place a code is
      turned into a status, says 404. Unless the edit route overrides the status, an edit that names a key the
      catalog does not hold answers a status the contract does not give. The retrieval contract (not in this node
      set) states 404 for the same code, so one code holds two statuses in the specification and one slot in the
      code.
    kind: contradicts
    correction: >-
      The code-to-status table cannot hold both statuses. Either the edit route sets 422 for this operation, or the
      specification settles which operation owns the code's status.
    node: contracts/knowledge-base/entity-editing
  - file: src/shared/error-mapping.ts
    where: >-
      codeToHttpStatus, the BUSINESS_CHAT_INGEST_DISABLED entry (line 99)
    evidence: >-
      BUSINESS_CHAT_INGEST_DISABLED: 503,
    cost: >-
      A refusal code and its HTTP status that no node in the specification holds. A reader looking in the
      specification for when chat ingestion is disabled, and what it answers, finds nothing. The decision lives only
      in this table.
    kind: unstated
    correction: >-
      An analysis would have to give the code a node, probably in the chat conversations contract, or the entry
      would have to go if nothing answers it.
  - file: src/shared/error-mapping.ts
    where: >-
      renderErrorEnvelope, the logLevel derivation (line 120), together with the codeToHttpStatus entries
      BUSINESS_CHAT_DISABLED and BUSINESS_CHAT_INGEST_DISABLED (lines 94 and 99)
    evidence: >-
      const logLevel: "warn" | "error" = statusCode >= 500 ? "error" : "warn";
      — applied to BUSINESS_CHAT_DISABLED: 503, and to BUSINESS_CHAT_INGEST_DISABLED: 503,
    cost: >-
      The constraint says a refusal for a business cause is never logged at error level, except a failure to build
      the model provider at the start of a chat turn. Every BUSINESS_* code mapped to 5xx is logged at error. That
      includes the chat-disabled refusals, which are plain business refusals and not provider-build failures. A
      switched-off chat surface therefore raises error-level log noise that the owner decided it should not.
    kind: contradicts
    correction: >-
      The log level would have to follow the cause of the refusal, not the status. Only the provider-build failure
      at a chat turn's start may be error, and the other BUSINESS_ and VALIDATION_ codes stay at warn whatever
      their status.
    node: constraints/expected-refusals-not-logged-as-errors
