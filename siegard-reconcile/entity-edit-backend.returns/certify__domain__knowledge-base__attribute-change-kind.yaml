certified:
  - node: domain/knowledge-base/attribute-change-kind
    state: partial
    tests:
      - file: src/__tests__/unit/curation/entity-edit-effect.spec.ts
        name: holds exactly set and remove as the change kinds
      - file: src/__tests__/unit/curation/edit-entity.dto.spec.ts
        name: accepts exactly the change kinds set and remove
      - file: src/__tests__/unit/curation/edit-entity.dto.spec.ts
        name: requires a change to state a value exactly when its kind is set
      - file: src/__tests__/unit/curation/edit-entity.dto.spec.ts
        name: requires a remove change to name an attribute and asks no such thing of a set change
      - file: src/__tests__/unit/curation/entity-edit-effect.spec.ts
        name: gives removal to a remove change naming one of several live attributes of the key
    why: >-
      The tests fully check that the enumeration's values are exactly set and remove.
      "holds exactly set and remove as the change kinds" checks the full list of options.
      "accepts exactly the change kinds set and remove" accepts both and refuses add, SET,
      the empty string, null and a number. The node's description also says what each kind
      asks for. A set puts a value in place. A remove takes away the attribute's current
      value. The offered tests check only the outline of that meaning. A set must state a
      value. A remove must name an attribute and state no value. decideChangeEffect classifies
      a remove as "removal". No test in the offered proof applies a change and reads the
      result. Nothing checks that, after a set, the stated value is the attribute's current
      value. Nothing checks that, after a remove, the named attribute no longer holds a
      current value. If either kind changed what it does to the stored attribute, every
      offered test would still pass. Tests outside the offered proof may cover the applied
      behavior, for example the apply-entity-edit delivery's tests. They were not offered and
      are not cited here.
    remainder: testable
    remainder_why: >-
      Two tests would close it. First, apply a set change with a given value to an entity's
      attribute key, then read the key back. Expected: that value is the attribute's current
      value. Second, apply a remove change that names a live attribute, then read the key
      back. Expected: the named attribute no longer holds a current value.