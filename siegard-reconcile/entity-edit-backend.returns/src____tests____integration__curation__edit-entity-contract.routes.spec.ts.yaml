findings:
  - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
    where: >-
      CONTRACT_ROWS, the `details` objects the expected refusals pin, lines 285, 293-296, 303-306, 313-316, 323-327, 361-364, 393, 403-406 and 425-428.
    evidence: |-
      expected: refusedWith(404, NOT_FOUND_CODE, { node_id: ABSENT_NODE_ID }),
      expected: refusedWith(409, NOT_ACTIVE_CODE, { node_id: NEEDS_REVIEW_NODE_ID, status: "needs_review" }),
      expected: refusedWith(422, UNKNOWN_KEY_CODE, { attribute_key: UNCATALOGUED_KEY, node_type: "Project" }),
      expected: refusedWith(422, INVALID_VALUE_CODE, { value_type: "date", value: "not-a-date" }),
      allowed_values: expect.arrayContaining([PHASE_VALUE, OTHER_PHASE_VALUE]),
    cost: >-
      The test fixes the wire field names of each refusal's `details`. Those names are `node_id`, `status`, `attribute_key`, `node_type`, `value_type`, `value`, `allowed_values` and `item_id`. The contract says only that the refusal "names" the node, the key and the node type, and so on, and it gives no field name. So a client of the edit route would look in the contract for the shape of `details`, find none, and have to read this test to learn it. A change of a name would be decided here and never reach the contract.
    kind: unstated
    correction: >-
      Analysis would have to give the field names of each entity-edit refusal's `details` a home in contracts/knowledge-base/entity-editing. Alternatively, the test would assert only the code and the HTTP status, which the contract does state.
    node: contracts/knowledge-base/entity-editing
