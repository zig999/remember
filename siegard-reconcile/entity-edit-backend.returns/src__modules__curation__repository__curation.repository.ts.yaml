findings:
  - file: src/modules/curation/repository/curation.repository.ts
    where: >-
      the reject-rate query inside aggregateCurationMetrics, the rejectsRes statement
    evidence: >-
      `SELECT (payload->>'error_code') AS code,` ... `WHERE action = 'reject_item'
      AND payload ? 'error_code'`
    cost: >-
      The name of the payload field that carries a rejection's error code is
      stated only in this query. The node says only that a reject-item action's
      payload "carries" an error code. No node names the field or says what
      counts as one. A writer of reject-item payloads that spells the field
      differently drops out of the rate silently, and the next reader looks in
      the specification for the field's name and finds nothing.
    kind: unstated
    correction: >-
      Analysis would have to give the field that a reject-item curation action's
      payload carries its error code under a name, held by
      rules/knowledge-base/reject-rate-by-code or by a node on the payload's
      shape. The query then reads that name.
    node: rules/knowledge-base/reject-rate-by-code
