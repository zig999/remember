findings:
  - file: src/app.ts
    where: >-
      the fallback origins of `corsOrigins`, lines 65-68, passed as `origin` to `fastifyCors` at line 69
    evidence: >-
      const corsOrigins = env.CORS_ORIGINS ?? [ "http://localhost:5173", "http://127.0.0.1:5173", ];
    cost: >-
      Which origins may call the system when no origin list is configured is decided only here. The specification states that an allowed origin is echoed back, and never which origins are allowed or what the default is. A reader looking in the specification for who may reach the API finds no answer.
    kind: unstated
    correction: >-
      The analysis would have to give the default allowed origins a node, or state that the list comes from configuration alone and has no default. The constraint on answers carrying the allowed origin does not decide this.
    node: constraints/answers-carry-allowed-origin
  - file: src/app.ts
    where: >-
      the `/_self` route registered on the authenticated scope, lines 83-86
    evidence: >-
      scoped.get("/_self", async (request) => ({ ok: true, result: { user_id: request.user?.id ?? null }, }));
    cost: >-
      The code serves an operation at GET /api/v1/_self that answers the caller's identity as `user_id`, null when none. No node of the specification names this operation or its answer. The access contract lists only authenticate-owner, route-request and read-health, so a client depends on an answer nobody decided.
    kind: unstated
    correction: >-
      The analysis would have to add this operation and its answer to a contract, or remove the route. The access contract is the nearest home.
    node: contracts/knowledge-base/access
  - file: src/app.ts
    where: >-
      the `toolNames` allowlist of `registerIngestMcpTransport`, line 114
    evidence: >-
      "get_ingestion_status",
    cost: >-
      This allowlist names an ingest tool, `get_ingestion_status`, that no node holds. The ingestion contract holds `ingest_document`, `ingest_directed` and `list_recent_ingestions`, and `health` belongs to the access contract. A status tool is also what an asynchronous ingestion would need, and the ingest toolset is constrained not to offer one. The name's presence cannot be weighed against the specification.
    kind: unstated
    correction: >-
      Either the analysis gives the tool a node, or the allowlist drops the name. Nothing outside this file was read to learn whether a tool by this name is registered.
    node: contracts/knowledge-base/ingestion
