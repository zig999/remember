certified:
  - node: contracts/knowledge-base/entity-editing
    state: partial
    tests:
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers an accepted edit with HTTP 200 and node_id, action_id and applied with no envelope"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a reason of 1001 characters with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a set change that states no value with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a remove change that states a value with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a remove change that names no attribute with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a body with no reason with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a null reason with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers changes of the wrong type with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a change kind outside its closed set with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers an item_id that is not a well-formed identifier with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a valid_from that is not YYYY-MM-DD with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a request carrying no body with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a node_id path segment that is not a well-formed identifier with HTTP 422 VALIDATION_INVALID_FORMAT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a node that is not held with HTTP 404 RESOURCE_NOT_FOUND naming the node"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a node that is not active with HTTP 409 BUSINESS_NODE_NOT_ACTIVE naming the node and its status"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a key the catalog does not hold for the node type with HTTP 422 BUSINESS_UNKNOWN_ATTRIBUTE_KEY naming the key and the type"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a value that does not read as its value type with HTTP 422 BUSINESS_INVALID_ATTRIBUTE_VALUE naming the type and the value"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a value outside the allowed values with HTTP 422 BUSINESS_INVALID_ATTRIBUTE_VALUE naming the key, the value and the allowed values"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a validity stated on a key that is not temporal with HTTP 422 BUSINESS_TEMPORAL_INCOHERENT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a validity start that is not before its end with HTTP 422 BUSINESS_TEMPORAL_INCOHERENT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a validity end stated without a start and not after today with HTTP 422 BUSINESS_TEMPORAL_INCOHERENT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a named attribute that is not live with HTTP 409 BUSINESS_ENTITY_EDIT_CONFLICT naming the key and the item"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a named attribute that carries a supersession time with HTTP 409 BUSINESS_ENTITY_EDIT_CONFLICT naming the key and the item"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a second current value of a key that allows one with HTTP 409 BUSINESS_ENTITY_EDIT_CONFLICT naming the key"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers an attribute another operation changed first with HTTP 409 BUSINESS_ENTITY_EDIT_CONFLICT naming the key and the item"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a disputed attribute with HTTP 409 BUSINESS_ENTITY_EDIT_DISPUTED naming the key and the item"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers an edit that changes nothing with HTTP 422 BUSINESS_ENTITY_EDIT_NO_CHANGES"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a write a uniqueness guard of the store refuses with HTTP 422 BUSINESS_TEMPORAL_INCOHERENT"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers an unreachable store with HTTP 503 SYSTEM_SERVICE_UNAVAILABLE and its fixed message"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers a statement that times out with HTTP 503 SYSTEM_SERVICE_UNAVAILABLE and its fixed message"
      - file: src/__tests__/integration/curation/edit-entity-contract.routes.spec.ts
        name: "answers an unexpected cause with HTTP 500 SYSTEM_INTERNAL_ERROR, its fixed message and no cause"
    why: >-
      Every refusal the contract lists has a row. Each row checks the stated status and code, the named
      details, and, for the format, unavailable and internal answers, the fixed message. The format rows
      also check the {path, message} issue shape and the "."-joined path. The accepted answer is only
      partly bound. The accepted row checks that the body has no envelope, that node_id is the edited
      node, and that applied has its six entries with their attribute_key, effect, and the nulls where an
      effect has none. But action_id is checked only as any string, and so is every non-null item_id.
      The contract says action_id is the identity of the curation action the edit recorded. A route that
      returned an action_id or item_id matching no recorded action or written attribute would still pass.
      That correspondence is the part left unexercised.
      Some parts of this judgment rest on helper files the pack did not offer and I did not open. The
      POST /api/v1/nodes/{node_id}/edit path is built inside sendEdit in edit-entity-route-harness.js.
      The "in the order given" half depends on the order of changes inside mixedEdit in
      edit-entity-world.js. The service module is replaced through vi.mock by a forwarding module in
      edit-entity-routing.js.
      Two describe blocks in this file assert things this node does not state. "an edit failing a format
      check and a later check" asserts that the format refusal wins over not-found, not-active and
      unknown-key. "a refusal for a business or validation cause" asserts that no error-level log is
      written. Neither ordering nor logging is in this node, so I do not cite them as proof here. Each
      asserts a fact that some other node has to hold.
    remainder: testable
    remainder_why: >-
      One accepted edit against one expected result. action_id should equal the identity of the curation
      action that the edit recorded in the store. Each non-null item_id should equal the identity of the
      attribute row that its change wrote. Both are read back from the world after the request, instead
      of being checked as any string.