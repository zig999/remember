read:
  - node: constraints/entity-edit-is-atomic
    held_at: nowhere
    evidence: >-
      The harness only drives the route: `routing.forward = (nodeId, body) => world.edit(body, nodeId);`. It holds no transaction.
  - node: constraints/entity-editing-is-not-a-language-model-tool
    held_at: nowhere
    evidence: >-
      `mcp: buildMcpServer(logger),` only mounts the server. The harness declares no tool surface and exposes no edit tool.
  - node: constraints/every-operation-requires-owner-authentication
    held_at: nowhere
    evidence: >-
      `headers: authorization === null ? {} : { authorization },`. The harness supplies a token or none and enforces nothing. Enforcement sits in `buildNeonAuth`, in another file.
  - node: constraints/expected-refusals-not-logged-as-errors
    held_at: nowhere
    evidence: >-
      `return typeof level === "number" && level >= ERROR_LOG_LEVEL;`. The harness only reads captured log records and holds no logging rule.
  - node: constraints/internal-failure-withholds-cause
    held_at: nowhere
    evidence: >-
      `unreachablePool(error: Error)` only builds a failing pool. It states no message and withholds no cause.
  - node: constraints/unreachable-store-answers-unavailable
    held_at: nowhere
    evidence: >-
      `connect: async () => { throw error; },`. This is a fixture that makes the store unreachable. It answers nothing.
  - node: contracts/knowledge-base/compliance-audit
    held_at: nowhere
    evidence: >-
      The file sends and reads only `POST /api/v1/nodes/${request.nodeId}/edit`. No compliance operation appears.
  - node: contracts/knowledge-base/entity-editing
    held_at: >-
      The `AcceptedWire` and `RefusedWire` type declarations, and the request line in `sendEdit`. These are a test client's view of the answer, and the answer is enforced elsewhere.
    evidence: >-
      `url: `/api/v1/nodes/${request.nodeId}/edit``, `export type AcceptedWire = { node_id: string; action_id: string; applied: AppliedWire[]; };`, `error: { code: string; message: string; details?: unknown };`
  - node: domain/knowledge-base/applied-change
    held_at: the `AppliedWire` type declaration
    evidence: >-
      `export type AppliedWire = { attribute_key: string; effect: string; item_id: string | null; predecessor_id: string | null; };`
  - node: domain/knowledge-base/assertion-status
    held_at: nowhere
    evidence: >-
