looked_past: >-
  Seen and not reported as other judgments' business. The `ASSERTION_STATUSES` list is test data driving the cases. The tests pin a row-locking mechanism (`FOR\s+UPDATE`, the `locked` array), which the specification states only as a mechanism and never as a domain fact. The outcome `disputed: ACCEPTED` covers this one conflict check, while the dispute refusal belongs to rules/knowledge-base/entity-edit-leaves-disputes-to-curation.