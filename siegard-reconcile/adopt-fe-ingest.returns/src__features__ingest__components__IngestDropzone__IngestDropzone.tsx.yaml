    where: |-
      the docstring above isTxtFile, lines 33-37
    evidence: |-
      * Validate that a file is a text file by extension or MIME type. We do not
      * trust the OS-reported MIME alone (Windows sometimes reports
      * `application/octet-stream` for `.txt`) — extension wins as a fallback.
    cost: |-
      The docstring states the acceptance rule (text type or .txt name) in prose. The function below it holds the same rule in code. The rule therefore has a second home that no check reads, and it can diverge from the code unnoticed.
    kind: restates
    correction: |-
      Remove the docstring. isTxtFile holds the rule, and the node's bind claims it.
    node: rules/ingest-workspace/only-text-files-are-accepted
