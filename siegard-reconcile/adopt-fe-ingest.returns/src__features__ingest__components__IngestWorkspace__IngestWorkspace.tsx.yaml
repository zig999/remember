findings:
  - file: src/features/ingest/components/IngestWorkspace/IngestWorkspace.tsx
    where: >-
      the header doc comment, lines 15-21, the state machine paragraph (`ingest.feature.spec.md §3`)
    evidence: |-
      * State machine (`ingest.feature.spec.md §3`):
       *
       *   idle → ready → sending → { extracting | polling | noop | error } →
       *   { complete | revealing → complete | error }
    cost: >-
      The nine phases and the order the screen moves through them are written out a second time in prose
      inside a component that does not drive them. When the phase set or its transitions change, this
      comment still reads as the machine, and a reader of the layout file is sent to it instead of to
      the specification.
    kind: restates
    correction: >-
      Remove the paragraph. The phase names are held as code in the enumeration the node is bound to,
      src/features/ingest/components/IngestPanel/IngestPanel.types.ts, and the transitions are held in
      useIngestOrchestration.ts. This file only forwards `phase`. The node is a candidate here and is not
      in this file's set; the bind that claims the enumeration is the one that closes this.
    node: domain/ingest-workspace/ingest-phase
  - file: src/features/ingest/components/IngestWorkspace/IngestWorkspace.tsx
    where: >-
      the header doc comment, lines 19-21, the `node_selected` side-mode sentence
    evidence: |-
      *   plus the side-mode `node_selected` (right column swap; left column
       *   unaffected, hence the panel phase is unchanged).
    cost: >-
      The rule that the node detail replaces the graph and leaves the phase alone is stated a second time
      in prose. The code holds it (the `selectedNode !== null ? <NodeDetailPanel .../> : <GraphSpace .../>`
      branch, with `phase` never touched by `setSelectedNode`), so the comment is a second home that can
      drift from the node without anything noticing.
    kind: restates
    correction: >-
      Remove the sentence. The node is held by the conditional render in this file.
    node: rules/ingest-workspace/selected-node-detail-replaces-the-graph
