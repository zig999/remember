    held_at: |-
      the JSX returned by IngestNoopNotice (lines 25-55): the two paragraphs and the two Buttons wired to onAssembleExisting and onReset. This file holds only the show-known-content operation of the node; the other operations are held elsewhere.
    evidence: |-
      <p className="text-xs font-medium text-foreground">Documento já ingerido</p>
      <p className="text-xs text-muted-foreground">
        Este conteúdo já foi processado anteriormente. O grafo abaixo
        mostra os nós extraídos.
      </p>
      ... onClick={onAssembleExisting} ... Ver grafo existente ... onClick={onReset} ... Ingerir outro documento
looked_past: |-
  The two button labels "Ver grafo existente" and "Ingerir outro documento" appear in no node verbatim (the node names only the actions to view the existing graph and to ingest another document), and the file's docstring and prop comments carry file-size and extraction rationale, so I judged neither a domain fact nor a finding.