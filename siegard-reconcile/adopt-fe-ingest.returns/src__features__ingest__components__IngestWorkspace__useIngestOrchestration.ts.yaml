findings:
  - file: src/features/ingest/components/IngestWorkspace/useIngestOrchestration.ts
    where: |-
      the file header docstring, lines 1-17
    evidence: |-
      * - the phase machine (idle → ready → sending → … → complete | error)
       *   - the mutation orchestration (ingest → run → assembly)
       *   - the polling fallback when the LLM connection drops
       *   - the retry path
       *   - the noop "Ver grafo existente" CTA wiring
       *
       * The hook is intentionally not generic — it mirrors `ingest.feature.spec.md
       * §3` one-to-one.
    cost: |-
      The docstring restates, as prose, the phase machine and the retry and polling behavior that the ingest-session node holds. The code in this same file holds them too. A second home outside behavior means a reader may take the docstring's list of phases and paths as the decision. It also cites a feature spec section as the source of truth instead of the node.
    kind: restates
    correction: |-
      Remove the docstring. The behavior is held by the code in this file, so nothing is lost by removing it.
    node: domain/ingest-workspace/ingest-session
  - file: src/features/ingest/components/IngestWorkspace/useIngestOrchestration.ts
    where: |-
      the INGEST_MODEL constant, line 35, sent as `model` in handleSubmit (line 149)
    evidence: |-
      const INGEST_MODEL = "claude-opus-4-8";
    cost: |-
      The model that every ingestion started from the screen runs under, and that is recorded on the LLM run, is chosen only here. No node of the ingest screen states it. The bff-ingestion contract says only that `model` is sent as given. The one extraction-model default the specification holds, rules/knowledge-base/default-extraction-model, names claude-sonnet-4-6 and governs a document ingestion that names no model, whereas this screen always names one. A reader looking for which model the owner's ingestions use will not find it in the specification, and a change of model is a code edit nobody decided.
    kind: unstated
    correction: |-
      Analysis would have to give the model the screen sends a node. The contracts/ingest-workspace/bff-ingestion node, or a rule constraining domain/ingest-workspace/ingest-session, is the natural home.
    node: contracts/ingest-workspace/bff-ingestion
  - file: src/features/ingest/components/IngestWorkspace/useIngestOrchestration.ts
    where: |-
      the INGEST_PROMPT_VERSION constant, line 36, sent as `prompt_version` in handleSubmit (line 150)
    evidence: |-
      const INGEST_PROMPT_VERSION = "v3";
    cost: |-
      The prompt version every screen ingestion runs under is chosen only here, and it decides which extraction instructions apply. The specification states instructions per prompt version (v2, v3, v4), and a document ingestion that names no prompt version runs under v4. This screen pins v3 with no node stating it. A reader checking the screen against the specification will see v4 as the default and will not learn that the screen differs.
    kind: unstated
    correction: |-
      Analysis would have to give the prompt version the screen sends a node. The contracts/ingest-workspace/bff-ingestion node, or a rule constraining domain/ingest-workspace/ingest-session, is the natural home.
    node: contracts/ingest-workspace/bff-ingestion
