findings:
  - file: src/features/ingest/components/IngestWorkspace/_utils.ts
    where: |-
      the second branch of classifyError(), lines 23-25
    evidence: |-
      if (err instanceof Error) {
          return { code: "SYSTEM_UNKNOWN", message: err.message };
        }
    cost: |-
      The contract gives the fallback "Erro desconhecido." for a failure that has no message of its own. Here the fallback applies only to a thrown value that is not an Error. An Error with an empty message goes through with message "", so the owner sees "Erro na ingestão" with a blank body. The fallback text the specification names is not shown in that case.
    kind: contradicts
    correction: |-
      The fallback to "Erro desconhecido." would have to apply whenever the failure has no message, including an Error whose message is empty. The contract wording is "reading the failure's own message, or \"Erro desconhecido.\" when it has none".
    node: contracts/ingest-workspace/ingest-screen
  - file: src/features/ingest/components/IngestWorkspace/_utils.ts
    where: |-
      the docstring of isConnectionDropError(), lines 29-32
    evidence: |-
      Per the TC contract: anything other than 409/422 is treated as a
       *  drop.
    cost: |-
      The docstring states in prose the rule that the code at lines 36-46 already implements. If the node moves, nothing binds this prose to follow it, so a reader could take the comment as the decision.
    kind: restates
    correction: |-
      Remove the docstring. The code in this file holds the rule, and the node binds it.
    node: rules/ingest-workspace/connection-drop-is-an-unconflicting-envelope
  - file: src/features/ingest/components/IngestWorkspace/_utils.ts
    where: |-
      the inline comments inside the EnvelopeError branch of isConnectionDropError(), lines 35-45
    evidence: |-
      // Definite server-side rejections — surface as error.
          if (err.httpStatus === 409 || err.httpStatus === 422) return false;
          // Network/timeout — definitely a drop.
          // 5xx with an LLM_PROVIDER_UNAVAILABLE is a real error band per spec §6.
          // Any other code → treat as drop (graceful degradation per spec §4).
    cost: |-
      These comments restate the node's exclusions and cite "spec §6" and "spec §4" of the old specification document as their authority. The code holds the facts, and the comment about "5xx" says more than the code checks. A reader may take the prose as the home of the rule.
    kind: restates
    correction: |-
      Remove the inline comments. The branches that return false or true hold the fact, and the node binds them.
    node: rules/ingest-workspace/connection-drop-is-an-unconflicting-envelope
  - file: src/features/ingest/components/IngestWorkspace/_utils.ts
    where: |-
      the comment before the final return of isConnectionDropError(), lines 48-50
    evidence: |-
      // Non-Envelope errors are unknown ground — be conservative and surface
        // as error so they don't hide silently behind a polling spinner.
        return false;
    cost: |-
      The comment gives a rationale and restates in prose that a failure outside an envelope is no connection drop. The `return false` already holds that fact, so the prose is a second home outside behavior.
    kind: restates
    correction: |-
      Remove the comment. The `return false` holds the fact, and the node binds it.
    node: rules/ingest-workspace/failure-outside-an-envelope-is-no-connection-drop
