looked_past: >-
  The flag and status spellings on the wire (`low_confidence`, `needs_review`) use underscores where the nodes use hyphens (`low-confidence`, `needs-review`). I treated this as the BFF's wire convention, not a domain fact, and did not report it. The returned counters (`isAssembling`, `settledCount`) and the `useMemo` and `useRef` structure are implementation shape, not domain facts.
