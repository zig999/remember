      the file's header docstring, line 19 (the Accessibility list)
    evidence: |-
      * - All form controls disabled while the run is in flight
    cost: |-
      The docstring states, a second time and in different words, which phases lock the fields. The node says the fields are editable only in idle, ready and error, and isInputDisabled holds that in code. If the node moves, this sentence stays behind and reads as a rule that is still decided. "While the run is in flight" does not say whether complete and noop are locked, and the node and the code do.
    kind: restates
    correction: |-
      Remove the line from the docstring. The fact is held by the node and by isInputDisabled in this same file. Prose is removed, never refreshed, and /reconcile runs over the file afterwards.
