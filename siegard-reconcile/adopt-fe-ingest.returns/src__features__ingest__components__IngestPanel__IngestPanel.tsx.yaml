looked_past: |-
  I saw and did not report four things that belong to other judgments. The comment at lines 54-55 says the polling loop's failed status is surfaced by the caller as the synthetic RUN_FAILED. That fact is only prose here, and the code that holds it is in the workspace, outside this file set. The docstring's phase list (idle, sending, extracting, polling, complete, error, noop) and its note that the state machine lives in IngestWorkspace are prose too. The aria-busy choice of which phases count as busy (isProgressBusy), and the visible labels (headings, placeholder, "Ingerir", "Enviando…"), are surface and accessibility rather than a domain fact.