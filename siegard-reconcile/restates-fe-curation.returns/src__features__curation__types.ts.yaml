findings:
  - file: src/features/curation/types.ts
    where: >-
      the EffectiveStatus type, lines 13-18
    evidence: |-
      export type EffectiveStatus =
        | "active"
        | "uncertain"
        | "disputed"
        | "superseded"
        | "deleted";
    cost: >-
      The node holds six values, among them `inactive`, which is how an ended assertion reads
      without ever being stored. This file declares five. Typing `effective_status` in
      AttributeDetailWire and LinkDetailWire as this union says an ended assertion can never
      arrive as `inactive`. The next reader will take that vocabulary as the decided one, and no
      bind reaches the file when the node moves.
    kind: contradicts
    correction: >-
      The vocabulary has to match the node's six values. The file also has to be bound to the
      node, because code never reads the specification and only a bind keeps the two together.
    node: domain/knowledge-base/effective-status
  - file: src/features/curation/types.ts
    where: >-
      the ReviewQueueKind type, line 1
    evidence: |-
      export type ReviewQueueKind = "entity_match" | "disputed";
    cost: >-
      The two review queues are an enumeration a node holds. Here it is declared a second time in
      a file the node is not bound to, so a change to the node does not reach this file and the
      two can drift without anyone knowing which was decided.
    kind: contradicts
    correction: >-
      Bind this file to the node. The wire spelling `entity_match` comes from the published
      curation contract (`{ kind: "entity_match", ... }`), so the values agree.
    node: domain/knowledge-base/review-queue-kind
  - file: src/features/curation/types.ts
    where: >-
      the ItemKind type, line 2
    evidence: |-
      export type ItemKind = "link" | "attribute";
    cost: >-
      The two assertion kinds a curation request names are held by a node. They are declared here
      again in a file the node is not bound to, so a change to the node does not reach this file.
    kind: contradicts
    correction: >-
      Bind this file to the node. The values agree.
    node: domain/knowledge-base/assertion-kind
  - file: src/features/curation/types.ts
    where: >-
      the CorrectedValues interface, lines 231-238
    evidence: |-
      export interface CorrectedValues {
        readonly value?: string | null;
        readonly target_node_id?: string | null;
        readonly valid_from?: string | null;
        readonly valid_to?: string | null;
        readonly valid_from_source?: ValidFromSource;
        readonly valid_from_fragment_id?: string | null;
      }
    cost: >-
      The shape of the values a correction puts in place of an assertion's is declared here, and
      the node that holds it is not bound to this file. If the node gains or loses a value,
      nothing reaches this file.
    kind: contradicts
    correction: >-
      Bind this file to the node. The attributes agree with the node's value, valid_from,
      valid_to and valid_from_source, its target reference and its fragment reference.
    node: domain/knowledge-base/corrected-values
  - file: src/features/curation/types.ts
    where: >-
      the ResolveEntityMatchAffected interface, lines 154-159, and its reuse in
      MergeNodesResponse as Required<ResolveEntityMatchAffected>
    evidence: |-
      export interface ResolveEntityMatchAffected {
        readonly links_repointed?: number;
        readonly attributes_repointed?: number;
        readonly aliases_copied?: number;
        readonly path_compressed_nodes?: number;
      }
    cost: >-
      The four counts of a merge's reach are held by a node and declared here again, in a file the
      node is not bound to. The node's four counts are required, and this file makes them
      optional in the entity-match answer. A change to the node does not reach this file.
    kind: contradicts
    correction: >-
      Bind this file to the node. In the entity-match answer the published contract has `affected`
      null for keep_separate and the four counts for merge_into, so the optionality here follows
      the answer and not the node.
    node: domain/knowledge-base/merge-counts
  - file: src/features/curation/types.ts
    where: >-
      the evidence and history read shapes, lines 254-495: Provenance*Wire, AcceptedFragment*Wire,
      NodeSummaryWire, NodeAliasWire, AttributeDetailWire, NodeDetailWire, LinkDetailWire and the
      history responses
    evidence: |-
      export interface AcceptedFragmentItemWire {
        readonly fragment_id: string;
        readonly text: string;
        readonly confidence: number;
        readonly llm_run_id: string;
        readonly created_at: string;
        readonly source: AcceptedFragmentSourceRefWire;
      }
    cost: >-
      What each read of the knowledge base answers is held by a consumed contract that the trace
      does not bind to this file. These fields are declared here as their own authority, so when
      the contract moves, `--check` does not reach this file.
    kind: contradicts
    correction: >-
      Bind this file to the contract. The fields I compared match it: read-node, the link and
      attribute history, the three provenance reads and list-accepted-fragments.
    node: contracts/curation-workspace/bff-curation-reads
