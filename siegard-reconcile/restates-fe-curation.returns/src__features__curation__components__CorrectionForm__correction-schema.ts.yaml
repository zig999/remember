looked_past: |-
  The six validation messages the file emits match, word for word and field for field, contracts/curation-workspace/curation-screen (a node outside this set, found by searching the specification root and not offered as a candidate), so they are no finding. Also seen and not reported because they are other judgments: `itemId: z.string().min(1)` and `itemKind: z.enum(["link", "attribute"])` are shape guards on values the form always supplies, and CorrectionRawDefaults repeats the basis literals as a type union beside validFromSourceSchema, which is a code-review point and no domain fact.