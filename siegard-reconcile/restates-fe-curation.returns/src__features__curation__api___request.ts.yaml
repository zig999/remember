  - node: contracts/curation-workspace/bff-curation
    held_at: |-
      httpCuration(), lines 85-199, for the send-curation-request operation. The other operations of the contract (queue, metrics, resolve and so on) are outside this file.
    evidence: |-
      A 2xx answer returns the body unwrapped, and a 204 gives no value:
        if (response.status === 204) return undefined as unknown as T;
        return (await response.json()) as T;
      The failures carry the codes and messages the contract names:
        code: isTimeout ? "SYSTEM_TIMEOUT" : isAbort ? "SYSTEM_ABORTED" : "SYSTEM_NETWORK"
        "Tempo limite excedido na requisição." / "Requisição cancelada." / "Falha de rede ao contactar o servidor."
        code: "SYSTEM_INVALID_RESPONSE", message: "Resposta do servidor não é JSON válido."
        code: "AUTH_SESSION_EXPIRED", httpStatus: 401, message: "Sua sessão expirou. Faça login novamente."
      A non-2xx answer takes the error object's string code, its details and its message when that is a string. Otherwise it falls back by status:
        typeof errObj?.code === "string" ? errObj.code : response.status >= 500 ? "SYSTEM_UPSTREAM" : "SYSTEM_UNKNOWN"
        "Algo deu errado. Tente novamente." / "Erro desconhecido do servidor."
      A second 401 skips the refresh branch (`response.status === 401 && __retried !== true`) and goes to that same fallback, which gives SYSTEM_UNKNOWN when the body has no code.
