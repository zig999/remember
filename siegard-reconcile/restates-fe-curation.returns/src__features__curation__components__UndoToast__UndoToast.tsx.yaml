findings:
  - file: src/features/curation/components/UndoToast/UndoToast.tsx
    where: |-
      line 56, the aria-label of the Button that carries onUndo
    evidence: |-
      aria-label="Desfazer ação"
    cost: |-
      The button's accessible name is "Desfazer ação", while the specification says the toast "offers Desfazer". The announced wording is a string the specification does not hold. A screen-reader user hears text that a reader of the specification will not find. The visible label "Desfazer" is held; only this aria-label is not.
    kind: unstated
    correction: |-
      Give the announced name of the undo button a home in the node that holds the undo-decision operation's text, or drop the aria-label so the visible "Desfazer" is the name.
    node: contracts/curation-workspace/curation-screen

