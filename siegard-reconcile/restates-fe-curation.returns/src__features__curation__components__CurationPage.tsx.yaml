findings:
  - file: src/features/curation/components/CurationPage.tsx
    where: >-
      The mount effect at lines 50-54, together with deriveInitialSelection in curation-page-helpers.ts.
    evidence: |-
      useEffect(() => {
          if (isPending || data === undefined) return;
          const initial = deriveInitialSelection(data, deepLink);
          setSelectedItem(initial);
        }, [isPending, data, deepLink, kindFilter, setSelectedItem]);
      and, in curation-page-helpers.ts, deriveInitialSelection returns the address's item when it is in the queue, otherwise the first entry of the queue. It never returns the item already in the store.
    cost: |-
      The screen picks an item by itself: the address's item if it is in the queue, otherwise the first entry. It does this again whenever the loaded queue or the tab changes. No node states this selection rule. The next reader will look for it in the specification and will not find it there. It also decides when the idle panel can appear: with entries loaded, the idle state of the contract's "Nothing is selected or the selection is not in the loaded queue" never shows, because the first entry is selected instead.
    kind: unstated
    correction: |-
      Give the initial-selection rule a home in a node. domain/curation-workspace/curation-session holds select-item and selected_item, and is where it would belong. The rule is: deep link if it is in the loaded queue, otherwise the first entry, re-derived when the queue or the tab changes.
    node: domain/curation-workspace/curation-session
  - file: src/features/curation/components/CurationPage.tsx
    where: >-
      The same mount effect, lines 50-54, read against the store's selectedItem.
    evidence: |-
      const selectedItem = useCurationStore((s) => s.selectedItem);
      ...
      const initial = deriveInitialSelection(data, deepLink);
      setSelectedItem(initial);
    cost: |-
      The store keeps selectedItem while the owner is away. When the page mounts again with no item in the address, the effect replaces the kept selection with the first entry of the queue. The kept selection is discarded on re-entry even though nothing cleared it on leaving. A reader who trusts that leaving keeps the selected item will not find where it is lost. Whether this counts as clearing it is the person's to decide; the evidence is that the stored selection is not consulted on re-entry.
    kind: contradicts
    correction: |-
      Either the node states that the selection is rederived on entry from the address, or the page consults the stored selectedItem before deriving one. That choice is the person's.
    node: rules/curation-workspace/page-keeps-its-state-when-left
  - file: src/features/curation/components/CurationPage.tsx
    where: >-
      The text the page emits at lines 128, 139 and 179: the region aria-label values and the heading.
    evidence: |-
      aria-label="Fila de curadoria"
      <h2 className="text-lg font-semibold tracking-tight text-foreground">Curadoria</h2>
      aria-label="Painel de decisão"
    cost: |-
      This is text the screen tells the owner and assistive technology: the two region names and the page heading. No node holds it. The screen contract holds only the idle line "Selecione um item da fila para começar.", the tab names and the drawer title "Curadoria". A later change to the wording will not be seen as a change to a specified fact.
    kind: unstated
    correction: |-
      Add the queue region name, the decision region name and the page heading to the screen contract's accepted answers. The contract is the node that should hold them.
    node: contracts/curation-workspace/curation-screen
