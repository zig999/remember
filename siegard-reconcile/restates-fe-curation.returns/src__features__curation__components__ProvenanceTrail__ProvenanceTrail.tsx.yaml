  - node: rules/curation-workspace/viewed-signal-never-fires-on-a-failed-trail
    held_at: |-
      the dataReady gate on the effect, and the loading, compliance-deleted and error branches, which never attach sentinelRef
    evidence: |-
      const dataReady = !isPending && !isError && data !== undefined;  if (!dataReady || firedRef.current) return;  with rawDeleted tested on `error.code === "BUSINESS_RAW_INFORMATION_DELETED"`
looked_past: |-
  The aria-labels "Sem proveniência", "Trilha de evidência", "Proveniência indisponível" and "Erro ao carregar proveniência" are accessible names that curation-screen's show-evidence operation does not state, and I did not report them as unstated because they are surface wording; the visible texts, the source type labels and the "Fragmento · confiança N%" and "trecho" wording do match that contract.