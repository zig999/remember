  - node: rules/curation-workspace/viewed-signal-fires-once-per-mount
    held_at: |-
      firedRef, a ref that is never reset and is checked in both the effect guard and fire()
    evidence: |-
      const firedRef = useRef(false);  if (!dataReady || firedRef.current) return;  function fire(): void { if (firedRef.current) return; firedRef.current = true; onEvidenceViewed(); }
