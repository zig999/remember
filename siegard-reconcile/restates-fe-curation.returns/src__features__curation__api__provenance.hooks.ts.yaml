findings:
  - file: src/features/curation/api/provenance.hooks.ts
    where: |-
      useListAcceptedFragments, the queryKey object (lines 108-109)
    evidence: |-
      limit: params.limit ?? 20,
              offset: params.offset ?? 0,
    cost: |-
      The server's page defaults (20 items, offset 0) are held by rules/knowledge-base/page-defaults, and this file applies them a second time to build the cache key. If the node's default moves, this file is not bound to that node, so the check never reaches it. The key would then treat an omitted limit as 20 while the server returns another size.
    kind: contradicts
    correction: |-
      Key the cache on the params as given (undefined when omitted) so the hook stops carrying the server's default. Alternatively, bind rules/knowledge-base/page-defaults to this file.
    node: rules/knowledge-base/page-defaults
