findings: []
read:
  - node: rules/curation-workspace/decision-shows-as-sending-until-answered
    held_at: |-
      the `loading={submitting}` prop on each rendered `Button` in `DecisionBar`, driven by the `submitting` prop (default `false`)
    evidence: |-
      submitting = false,
      ...
      loading={submitting}
  - node: rules/curation-workspace/every-decision-waits-for-the-evidence
    held_at: |-
      the `gated(handler)` wrapper, which every button's `onClick` passes through, together with `aria-disabled={!evidenceViewed || undefined}` on each button
    evidence: |-
      if (!evidenceViewed) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      handler();
      ...
      aria-disabled={!evidenceViewed || undefined}
      ...
      onClick={gated(b.onClick)}
looked_past: |-
  The `hidden` filter, the variant default (`destructive` or `primary`), the toolbar's `aria-label` and the Tailwind classes are presentation, not a domain fact, so the review left them alone.