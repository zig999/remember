    held_at: |-
      the three flags at lines 40-42 and the conditional renders at lines 110, 123 and 137. A disputed kind sets none of the flags, so it renders no action.
    evidence: |-
      const showConfirm = kind === "uncertain";
      const showReject = kind === "uncertain";
      const showKeepSeparate = kind === "entity_match";
