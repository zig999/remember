    held_at: |-
      the `BatchKind` type and the single `kind` prop (lines 7 and 11). The bar takes one count and one kind and derives every action from that kind.
    evidence: |-
      export type BatchKind = "entity_match" | "disputed" | "uncertain";
      readonly count: number;
      readonly kind: BatchKind;
