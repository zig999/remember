findings:
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      RECEIVED_AT_ANCHOR_DIRECTIVE, lines 22-24, the list of relative-date expressions
    evidence: >-
      "- When you encounter a relative date in the chunk text (`\"hoje\"`, `\"ontem\"`,",
      "  `\"amanhã\"`, `\"semana que vem\"`, `\"esta semana\"`, similar pt-BR temporal",
      "  deictics), resolve it AGAINST `document_date` if it is present (basis"
    cost: >-
      The directive tells the model that "semana que vem", "esta semana" and "similar pt-BR temporal
      deictics" are also relative dates to resolve. The node holds only "hoje", "ontem" and "amanhã". A
      reader who looks in the specification for which expressions v4 resolves will not find these, and
      the prompt text is the only place that widens the set.
    kind: unstated
    correction: >-
      The analysis would decide whether the node's statement should also name these expressions and the
      open-ended "similar" class, or whether the prompt should name only the three the node holds.
    node: rules/knowledge-base/extraction-prompt-names-relative-date-words
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      RECEIVED_AT_ANCHOR_DIRECTIVE, lines 24-25, the basis the model is asked to give when it resolves
      against document_date
    evidence: >-
      "  deictics), resolve it AGAINST `document_date` if it is present (basis",
      "  `\"document\"`). If `document_date` is `(unknown)`, fall back to the date",
    cost: >-
      The prompt asks the model to give the basis "document" for a relative date resolved against the
      document date. The v4 anchor rule leaves the basis out, and valid-from-basis only enumerates
      stated, document and received. No node says which basis a relative date resolved this way
      carries. That mapping lives only in the prompt text.
    kind: unstated
    correction: >-
      The analysis would decide whether the anchor rule should state the basis "document" for the
      document-date case, or keep leaving the basis out as its decision log does.
    node: rules/knowledge-base/extraction-relative-date-falls-back-to-reception
