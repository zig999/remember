looked_past: >-
  The directive's fallback to the date of `received_at`, its supersession of v3's omit-when-unknown rule,
  its absolute-dates-stay-stated clause and its never-invent-a-date clause are held by nodes outside my
  set (extraction-relative-date-falls-back-to-reception, extraction-relative-date-needs-document-date,
  extraction-stated-basis-needs-written-start, extraction-never-invents-a-date). The prompt, as emitted
  text, states them in agreement with those nodes, so none is a finding.
