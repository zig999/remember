      This is prose, and no running system emits it. It enumerates values of event_type that rules/knowledge-base/allowed-event-types already holds. The code holds the same values in the migration seed migrations/seeds/0003_event_type_taxonomy.sql, which the comment names. A reader of this file gets a second, partial list of the domain. If the domain changes, the list here goes stale and no check finds it.
    kind: restates
