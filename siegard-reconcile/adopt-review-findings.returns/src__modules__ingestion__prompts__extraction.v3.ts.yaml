findings:
  - file: src/modules/ingestion/prompts/extraction.v3.ts
    where: >-
      header comment, lines 5-8: the sentence about v2 teaching the model to date events
    evidence: >-
      // The gap v3 closes: v2 taught the model to DATE events (`event_date`), but
      // never to CLASSIFY them (`event_type`)
    cost: >-
      This is prose, and no running system emits it. It says what rules/knowledge-base/extraction-dates-events holds: from v2 on, an extraction asks the model to propose event_date. A reader of this comment finds a second statement of the fact beside the node. The two can drift when the node moves, and --check does not reach the comment.
    kind: restates
    correction: >-
      Remove the comment by the comment route. The directive in extraction.v2.ts is where the code holds the fact, and the node holds it in the specification.
    node: rules/knowledge-base/extraction-dates-events
