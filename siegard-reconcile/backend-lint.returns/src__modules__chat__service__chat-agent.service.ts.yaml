findings:
  - file: src/modules/chat/service/chat-agent.service.ts
    where: >-
      line 53, the constant MAX_TOKENS_PER_ITERATION, passed as max_tokens at line 255
    evidence: >-
      const MAX_TOKENS_PER_ITERATION = 4096;
      ...
      max_tokens: MAX_TOKENS_PER_ITERATION,
    cost: >-
      This number caps how long every answer can be, and it decides when a turn ends as max-tokens. It is not configured and no node states it. Someone changing how long answers may be will look in the specification, find nothing, and not know this file decides it.
    kind: unstated
    correction: >-
      An analysis would have to give the per-model-call output ceiling a node, or state that it is configured like the other limits. domain/chat/turn is the closest home, since it holds how a turn ends.
    node: domain/chat/turn
  - file: src/modules/chat/service/chat-agent.service.ts
    where: >-
      lines 416-423, the branch for a tool name absent from the catalog
    evidence: >-
      toolEnvelope = {
              ok: false,
              error: {
                code: "VALIDATION_INVALID_FORMAT",
                message: "unknown tool name",
              },
            };
    cost: >-
      The code and message the assistant receives for a tool outside its toolset are stated only here. rules/chat/tool-failure-continues-turn holds that the failure is handed to the assistant and the turn continues, but not what the failure says. The text is what the assistant sees and reacts to, and no node can be checked against it.
    kind: unstated
    correction: >-
      The failure handed to the assistant for a tool outside its toolset needs a node that states its code and message.
    node: rules/chat/tool-failure-continues-turn
  - file: src/modules/chat/service/chat-agent.service.ts
    where: >-
      lines 634-640, the timeout branch of raceToolHandler
    evidence: >-
      resolve({
              ok: false,
              error: {
                code: "SYSTEM_SERVICE_UNAVAILABLE",
                message: "tool timeout",
              },
            });
    cost: >-
      The code and message the assistant receives when a tool runs past the configured tool time are stated only here. The node holds that the turn continues, not what the assistant is told.
    kind: unstated
    correction: >-
      The failure handed to the assistant when a tool runs past the tool time needs a node that states its code and message.
    node: rules/chat/tool-failure-continues-turn
  - file: src/modules/chat/service/chat-agent.service.ts
    where: >-
      lines 672-679, synthesiseInternalErrorEnvelope
    evidence: >-
      code: "SYSTEM_INTERNAL_ERROR",
          message: errMessage(err) ?? "tool handler threw",
    cost: >-
      When a tool throws, its raw error message, or the fallback "tool handler threw", is what the assistant is told. No node says the cause is passed along or what the fallback reads. Another node says the owner-facing internal error withholds the cause, so the next reader cannot tell whether passing the cause here was decided.
    kind: unstated
    correction: >-
      The failure handed to the assistant when a tool throws needs a node that states its code and whether the thrown message is carried.
    node: rules/chat/tool-failure-continues-turn
