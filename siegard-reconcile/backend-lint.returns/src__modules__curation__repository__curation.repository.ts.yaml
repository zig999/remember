findings:
  - file: src/modules/curation/repository/curation.repository.ts
    where: |-
      the `valid_from_source` field of ItemLockedRow (line 153), CorrectionMutationArgs.correctedValidFromSource (line 342), DisputedLinkRow (line 608) and DisputedAttributeRow (line 657)
    evidence: |-
      readonly valid_from_source: "stated" | "document" | "received" | null;
      readonly correctedValidFromSource?: "stated" | "document" | "received" | null;
    cost: |-
      The three values of the validity-start basis are spelled out inline four times in this file. The same enumeration is already declared as `ValidFromSourceSchema` in `dto/enums.dto.ts`, and this file does not use it. Neither this file nor `enums.dto.ts` is bound to `domain/knowledge-base/valid-from-basis`. If the enumeration changes, `--check` will not reach these four copies, and nobody can tell which spelling was decided.
    kind: contradicts
    correction: |-
      Take the type from the one declaration of the enumeration instead of restating the union here. This file already imports `AssertionStatus`, `ItemKind` and `NodeStatus` from `../dto/enums.dto.js`, so `ValidFromSource` can come from the same place.
    node: domain/knowledge-base/valid-from-basis
  - file: src/modules/curation/repository/curation.repository.ts
    where: |-
      listEntityMatchQueue, lines 565-588 (LIMIT and OFFSET over the joined review rows)
    evidence: |-
      FROM knowledge_node kn
             JOIN node_type nt ON nt.id = kn.node_type_id
        LEFT JOIN entity_match_review em ON em.node_id = kn.id
        LEFT JOIN knowledge_node cn ON cn.id = em.candidate_node_id
            WHERE kn.status = 'needs_review'
            ORDER BY kn.created_at ASC, kn.id ASC, em.similarity DESC NULLS LAST
            LIMIT $1 OFFSET $2
    cost: |-
      The query returns one row per candidate review, and the page is cut over those rows, not over nodes. A node with several candidates can have its candidate list split across two pages. The offset also skips candidate rows instead of entries. The owner then sees a queue entry with only part of its candidates, and the next page starts in the middle of that entry.
    kind: contradicts
    correction: |-
      Take the page over the knowledge nodes in `needs_review`, in the creation-time-then-identity order, and attach each page node's reviews after the cut.
    node: rules/knowledge-base/review-queue-page-windows-entries
  - file: src/modules/curation/repository/curation.repository.ts
    where: |-
      listDisputedLinks (lines 614-640) and listDisputedAttributes (lines 663-688), LIMIT and OFFSET over individual disputed items
    evidence: |-
      WHERE kl.status = 'disputed'
            ORDER BY kl.recorded_at ASC, kl.id ASC
            LIMIT $1 OFFSET $2
      WHERE na.status = 'disputed'
            ORDER BY na.recorded_at ASC, na.id ASC
            LIMIT $1 OFFSET $2
    cost: |-
      The disputed queue holds one entry per dispute scope, listing each disputed item as a side. These queries cut the page over single items. A scope's sides can fall on either side of the page boundary, and the offset skips items, not entries. The same item-level cut leaves an entry's creation time (the earliest recording time among its items) dependent on where the page falls.
    kind: contradicts
    correction: |-
      Apply the offset and limit to dispute scopes, in the entry order, and return every disputed item of each scope on the page.
    node: rules/knowledge-base/review-queue-page-windows-entries
  - file: src/modules/curation/repository/curation.repository.ts
    where: |-
      countDisputedLinks (lines 642-647) and countDisputedAttributes (lines 690-697)
    evidence: |-
      SELECT count(*)::text AS total FROM knowledge_link WHERE status = 'disputed'
      SELECT count(*)::text AS total FROM node_attribute WHERE status = 'disputed'
    cost: |-
      The totals for the disputed queue count disputed items, but an entry of that queue is a dispute scope holding several items. Any scope with two or more items is counted once per item. The total a listing reports is then larger than the number of entries it holds.
    kind: contradicts
    correction: |-
      Count dispute scopes holding disputed items, not the disputed rows themselves.
    node: rules/knowledge-base/review-queue-total-before-pagination
  - file: src/modules/curation/repository/curation.repository.ts
    where: |-
      aggregateCurationMetrics, the disputedQueueRes query, lines 776-788
    evidence: |-
      SELECT DISTINCT 'link' AS k, source_node_id, target_node_id, link_type_id
                 FROM knowledge_link
                WHERE status = 'disputed'
               UNION ALL
               SELECT DISTINCT 'attribute', node_id, attribute_key_id, NULL::uuid
                 FROM node_attribute
                WHERE status = 'disputed'
    cost: |-
      The count groups every disputed link by source, target and link type, whatever the link type. Under the dispute-scope rule, links of a link type that does not allow multiple current links share one scope by source node and link type, whatever their targets. Two disputed links from one node to different targets of such a type are one queue entry but count as two here. `disputed_queue_count` then reports more disputes than the disputed queue lists.
    kind: contradicts
    correction: |-
      Group disputed links by source node and link type alone where the link type does not allow multiple current links, and by source node, link type and target node where it does. Keep the attribute grouping by node and attribute key. This makes the count the number of entries the disputed queue holds.
    node: rules/knowledge-base/metrics-disputed-queue-count
