  - node: domain/chat/turn
    held_at: >-
      buildSendMessageRequestSchema, lines 66-82, for content and model. IdempotencyKeyHeader, line 103, for the idempotency key.
    evidence: |-
      content: z
        .string()
        .min(1, "content must be a non-empty string")
        .max(
          opts.maxContentLength,
          `content must be at most ${opts.maxContentLength} characters`
