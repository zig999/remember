looked_past: >-
  The update-names-a-field refusal message here reads "VALIDATION_REQUIRED_FIELD: at least one of title or archived_at must be present", while contracts/chat/conversations gives the message as "at least one of title or archived_at must be present". Whether a handler outside this file set strips the code prefix could not be settled from this file alone, so I report no finding on it.
