findings:
  - file: src/modules/chat/routes/chat.schemas.ts
    where: >-
      buildChatTurnRequestSchema and ChatMessageSchema, lines 5-37 (the messages-history request with its minimum, its maximum and its first-role refinement)
    evidence: |-
      messages: z
        .array(ChatMessageSchema)
        .min(1, "messages must contain at least 1 entry")
        .max(
          opts.maxHistoryMessages,
          `messages must contain at most ${opts.maxHistoryMessages} entries`
        ),
      ...
      .refine((v) => v.messages[0]?.role === "user", {
        message: "first message must have role=user",
        path: ["messages", 0, "role"],
      });
    cost: >-
      This file states a chat turn request that carries a whole history of role and content messages. It requires at least one entry, caps the count, and requires the first entry to be from the owner. No node holds any of this. The specification's turn is one owner message with its model and idempotency key, and its send-message refusals name only content and model. The next reader who looks in the specification for what a turn request accepts will not find the rule, and the schema becomes where it lives.
    kind: unstated
    correction: >-
      Analysis would have to decide whether a history-carrying turn request is a fact of the business. If it is, a node must hold the history, its bounds and the owner-first rule. If it is not, the schema has no specification behind it.
    node: domain/chat/turn
read:
  - node: domain/chat/conversation-listing
    held_at: >-
      ListConversationsQuery, lines 87-94
    evidence: |-
      limit: z.coerce.number().int().min(1).max(100).default(20),
      cursor: z.string().optional(),
      include_archived: z
        .union([z.boolean(), z.enum(["true", "false"])])
        .transform((v) => (typeof v === "boolean" ? v : v === "true"))
        .default(false),
  - node: domain/chat/graph-layout
