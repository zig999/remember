  - node: rules/chat/conversation-listing-excludes-archived
    held_at: >-
      the include_archived field of ListConversationsQuery, lines 90-93. The default is false. The exclusion itself is applied wherever the query runs, outside this file.
    evidence: |-
      include_archived: z
        .union([z.boolean(), z.enum(["true", "false"])])
        .transform((v) => (typeof v === "boolean" ? v : v === "true"))
        .default(false),
