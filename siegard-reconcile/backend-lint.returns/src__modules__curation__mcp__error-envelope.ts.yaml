    held_at: >-
      The BUSINESS_DISPUTE_PERIODS_REQUIRED entry of ZOD_CUSTOM_CODE_PRIORITY (line 27) and its case in messageForZodCustomCode (lines 43-44). The file maps the refusal. The check that one period is given per item is not in this file.
    evidence: >-
      case "BUSINESS_DISPUTE_PERIODS_REQUIRED":
        return "decision=adjust_periods requires periods[] (one entry per item_id)";
