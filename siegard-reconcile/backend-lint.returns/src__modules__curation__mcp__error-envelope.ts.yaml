    held_at: nowhere
    evidence: >-
      The file has no construct that checks or maps the rule that a dispute resolution names at least two items and none twice. Its dispute codes are BUSINESS_DISPUTE_WINNER_REQUIRED and BUSINESS_DISPUTE_PERIODS_REQUIRED, and neither concerns item count or duplicates.
