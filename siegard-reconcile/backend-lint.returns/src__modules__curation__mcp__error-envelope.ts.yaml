looked_past: >-
  Every code, message, HTTP status and the duplicate-guard mapping this file states matches contracts/knowledge-base/curation.md, a node outside the set that holds them, so I filed nothing against them. I did not judge whether the Zod schemas elsewhere emit these custom codes only where that contract expects them.
