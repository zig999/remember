read:
  - node: constraints/curation-transports-answer-alike
    held_at: >-
      mapErrorToEnvelope(err) and mapErrorToHttpResponse(err), the single mapping from a raised error to an error code and message (lines 87-145).
    evidence: >-
      export function mapErrorToEnvelope(err: unknown): ErrorEnvelope {
        return mapErrorToHttpResponse(err).envelope;
      }
      The file has one mapping that yields code and message. It carries no transport branch, so a caller on either transport gets the same code.
