findings:
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      RECEIVED_AT_ANCHOR_DIRECTIVE, lines 25-28, the bullet on resolving a relative date when document_date is unknown
    evidence: >-
      "  `\"amanhã\"`, `\"semana que vem\"`, `\"esta semana\"`, similar pt-BR temporal",
      ... "`document_date` is `(unknown)`, fall back to the date",
      "  portion of `received_at` (the `YYYY-MM-DD` prefix of the ISO-8601 string) —",
      "  use basis `\"received\"`."
    cost: >-
      The directive is joined into the system prompt that system() returns and sent to the model. It tells the model to state the basis received on a proposal. The node says no proposal may state that basis, and the log of this node records that the proposal schema refuses it. A run under v4 is therefore asked for something the proposal validation will reject. The reception-date fallback appears to reach the knowledge base only through the separate required-start-fallback rule, not through the model, and the prompt instructs otherwise.
    kind: contradicts
    correction: >-
      The directive would have to stop asking the model to state basis "received". It would keep the instruction to resolve the relative date against the date portion of received_at and leave the basis out, which is what extraction-relative-date-falls-back-to-reception holds after the withdrawal recorded in its log.
    node: rules/knowledge-base/caller-never-states-received
