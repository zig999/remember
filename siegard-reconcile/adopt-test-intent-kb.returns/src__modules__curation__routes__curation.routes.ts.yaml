findings:
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the comment block above the GET /metrics handler, lines 125-136
    evidence: >-
      // Wraps the shared mapper with a graceful-degradation override: ANY residual
      // 500 outcome is re-mapped to 503 SYSTEM_SERVICE_UNAVAILABLE so the front
      // spec MetricsStrip (R1) can fall back to per-kind totals from /queue.
    cost: >-
      The metrics-unavailable answer is also written in prose beside the code that holds it
      (`const degradedStatus = statusCode === 500 ? 503 : statusCode;` and the
      SYSTEM_SERVICE_UNAVAILABLE envelope in this file). Two homes now state it, so a change to
      the contract's refusal could leave the comment saying the old answer.
    kind: restates
    correction: >-
      Remove the comment. The behavior is correct and the contract
      contracts/knowledge-base/curation (operation read-curation-metrics) holds the fact.
    node: contracts/knowledge-base/curation
  - file: src/modules/curation/routes/curation.routes.ts
    where: >-
      the comment inside the GET /metrics success path, lines 145-149
    evidence: >-
      // Bare success body — consistent with every other curation REST
      // endpoint (queue/confirm/reject/...). The SPA's httpCuration returns
      // the raw 2xx JSON, so an `{ ok, result }` wrapper here would surface
    cost: >-
      The no-envelope success shape is restated as prose next to `return reply.status(200).send(result);`,
      which holds it. A second home for the contract's accepted answer ("HTTP 200 carrying, with no
      envelope") can drift from it.
    kind: restates
    correction: >-
      Remove the comment. The code holds the fact and the contract
      contracts/knowledge-base/curation holds it as the authority.
    node: contracts/knowledge-base/curation
