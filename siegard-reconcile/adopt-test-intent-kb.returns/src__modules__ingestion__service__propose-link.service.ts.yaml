findings:
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      Header docstring, lines 6-15 (the five-layer list), restated again by the
      "---- Layer N" section comments at lines 66, 127, 138, 167 and 180.
    evidence: >-
      // Layered validation (BR-13) in the documented order. Each layer is a
      // sequential `await`, so layer N+1 only runs when layer N has not thrown:
      //   1. Structural    — cross-table refs (nodes exist, fragments exist,
      //                      link_type known).
      //   2. Graph rules   — active link_type_rule for the triple (BR-15).
      //   3. Temporal      — semi-open invariant, change_hint signal, date basis.
      //   4. Confidence    — < 0.40 -> ok:true outcome=rejected (BELOW_CONFIDENCE_FLOOR).
      //   5. Anti-halluc.  — every cited fragment anchors a chunk of the run's
      //                      source (BR-18).
    cost: >-
      The order in which a link proposal is checked is written a second time in
      prose. The running code already holds it as the sequence of awaits
      (assertKnownType, assertFound, the fragment query, validateGraphRule,
      validateTemporal, routeConfidence, countFragmentsAnchoredToSource). The
      comment can drift from that sequence without anything noticing. A reader
      who trusts it will not look in rules/knowledge-base/link-proposal-check-order.
    kind: restates
    correction: >-
      Remove the docstring list and the layer comments by the comment route, then
      run /reconcile over this file. The code in this file is untouched. The
      order is already held by the sequential awaits in proposeLinkService.
    node: rules/knowledge-base/link-proposal-check-order
  - file: src/modules/ingestion/service/propose-link.service.ts
    where: >-
      Header docstring, line 13 and lines 17-20 (confidence floor), restated
      again by the Layer 4 comment at lines 169-171.
    evidence: >-
      // 4. Confidence    — < 0.40 -> ok:true outcome=rejected (BELOW_CONFIDENCE_FLOOR).
      // On confidence < 0.40 the service returns `{ ok: true, result: { outcome:
      // 'rejected', reason: 'BELOW_CONFIDENCE_FLOOR' } }`. The caller maps this to
      // `validation_outcome = 'rejected'` on the `tool_call` row (BR-17).
    cost: >-
      The 0.40 floor is quoted as a number in prose. The decision itself is the
      `route.kind === "below_floor"` branch, which returns before any write. The
      numeric value is not stated in this file's code; it comes from the imported
      routeConfidence, which I did not open because it is outside the file set.
      If the floor changes, the comment keeps saying 0.40 while the node and the
      code move.
    kind: restates
    correction: >-
      Remove the comment text by the comment route, then run /reconcile over this
      file. The below_floor branch and the rejected result are already held by
      the code in this file.
    node: rules/knowledge-base/below-confidence-floor-records-nothing
