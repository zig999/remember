findings:
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      listNodes, the optional alias join, lines 98-102
    evidence: >-
      aliasJoin = `JOIN node_alias na ON na.node_id = kn.id
                         AND na.alias_norm LIKE $${params.length} || '%'`;
    cost: >-
      The prefix goes into LIKE as a pattern, with no escaping and no ESCAPE clause. A percent sign or an underscore the owner types matches as a wildcard instead of as itself. The only caller I found, service/node.service.ts, applies norm() and nothing else (`norm(input.name_prefix)`). A listing can therefore return nodes whose aliases do not start with the typed prefix. The specification reads the prefix literally, and the next reader will look there for that rule.
    kind: contradicts
    correction: >-
      The prefix has to reach the comparison as literal text, either by escaping LIKE metacharacters or by a literal starts-with comparison.
    node: rules/knowledge-base/node-listing-name-prefix
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      listProvenanceByTargets, the excerpt column, lines 322-323
    evidence: >-
      substring(rc."text" FROM rc.offset_start + 1
                                FOR rc.offset_end - rc.offset_start) AS excerpt
    cost: >-
      The node says a graph read's provenance entry shows the whole text of the raw chunk it cites. The query instead cuts a substring of the chunk's text using the chunk's own source offsets. A chunk that does not start at offset 0 of its source gets a shifted or empty excerpt, and the provenance entry loses the text it exists to show. The decision log beside the node records this same slicing as the unstated material the rule replaced.
    kind: contradicts
    correction: >-
      Select the chunk's text whole as the excerpt, without offsetting it again.
    node: rules/knowledge-base/graph-provenance-excerpt-is-chunk-excerpt
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      listProvenanceByTargets, the FROM and WHERE clauses, lines 324-330
    evidence: >-
      JOIN raw_information ri    ON ri.id = rc.raw_information_id
                WHERE ${targetCol} = ANY($1::uuid[])
    cost: >-
      The provenance query joins raw_information and applies no condition on whether that raw information was deleted for compliance. A grep of the knowledge-graph module's non-test source found no compliance filter anywhere else in it. A compliance-deleted source's trace is therefore still presented by link and attribute reads. The compliance deletion exists to prevent exactly that.
    kind: contradicts
    correction: >-
      Provenance entries whose raw information was deleted for compliance have to be left out of what this assembler returns.
    node: rules/knowledge-base/graph-provenance-hides-compliance-deleted
