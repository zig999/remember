    held_at: nowhere
    evidence: >-
      The file carries compliance-audit reads (listComplianceDeletions, getComplianceDeletionById,
      listCurationActions, getCurationActionById). None of the retrieval operations (search, the
      provenance reads, the catalog listings, the node reads, traverse) appears in it.
  - node: rules/knowledge-base/accepted-fragment-listing-refuses-unknown-parameter
    held_at: nowhere
    evidence: >-
      The file has no accepted-fragment listing. It only forwards fields of the already-parsed
      ListComplianceDeletionsQuery: "raw_information_id: query.raw_information_id".
  - node: rules/knowledge-base/affected-nodes-omit-absent
    held_at: nowhere
    evidence: >-
      The file has no LLM run and no affected-nodes handling. Its only "affected" is the deletion
      counts, "const affected = { chunks, fragments, links, attributes };".
  - node: rules/knowledge-base/audit-listing-accepts-open-window
    held_at: nowhere
    evidence: >-
      The service only forwards the bounds, "executed_from: query.executed_from, executed_to:
      query.executed_to". It does not decide whether one bound alone is accepted. That sits in the
      DTO or repository, not in this file.
  - node: rules/knowledge-base/chunking-deterministic
    held_at: nowhere
    evidence: >-
      The file does not chunk. It only tombstones chunks that already exist,
      "await tombstoneRawChunksOfRaw(client, body.raw_information_id)".
  - node: rules/knowledge-base/concurrent-proposals-resolve-in-turn
    held_at: nowhere
    evidence: >-
      The file has no proposals and no node resolution. Its only row lock is
      loadRawInformationForUpdate(client, body.raw_information_id).
  - node: rules/knowledge-base/confirmation-keeps-assertion-values
    held_at: nowhere
    evidence: >-
      The file has no assertion confirmation. Its status changes are the deletion tombstones
      (tombstoneCascadedLinks, tombstoneCascadedAttributes).
  - node: rules/knowledge-base/extraction-prompt-lists-closed-values
    held_at: nowhere
    evidence: >-
      The file builds no prompt and reads no attribute-key catalog. Its only strings are log
      messages such as "compliance_delete_ok".
  - node: rules/knowledge-base/extraction-prompt-values-ascending
    held_at: nowhere
    evidence: >-
      The file builds no prompt and sorts no allowed values. The import list shows only repository
      and DTO functions of the compliance-audit module.
  - node: rules/knowledge-base/extraction-prompt-values-verbatim
    held_at: nowhere
    evidence: >-
      The file builds no prompt and lists no allowed values. The only literal it spells is
      "[REDACTED]", which is a different fact.
  - node: rules/knowledge-base/non-expanding-search-walks-no-graph
    held_at: nowhere
    evidence: >-
      The file has no search and no graph walk. Its reads are by identity or by compliance-audit
      listing filters, as in "findComplianceDeletionById(client, id)".
  - node: rules/knowledge-base/reaffirmation-consolidates
    held_at: nowhere
    evidence: >-
      The file has no proposal handling and no change hint. The nearest idempotent branch is the
      compliance-delete no-op, "outcome: \"noop_already_deleted\"", which is a different fact.
looked_past: >-
  The compliance-delete flow, its refusals, the no-op outcome and the cascade are held by compliance-audit nodes outside this pack (contracts/knowledge-base/compliance-audit, rules/knowledge-base/compliance-deletion-check-order, rules/knowledge-base/compliance-deletion-counts-what-it-marked, rules/knowledge-base/compliance-deletion-propagates, rules/knowledge-base/compliance-deletion-tombstones), and the code agrees with the wording I read there, so I filed no finding on them.
