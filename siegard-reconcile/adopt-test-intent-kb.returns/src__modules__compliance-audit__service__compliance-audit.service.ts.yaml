findings:
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      line 57, the exported constant REDACTED_LITERAL (re-exported at line 19 of
      src/modules/compliance-audit/index.ts)
    evidence: >-
      export const REDACTED_LITERAL = "[REDACTED]" as const;
      (the repository that performs the redaction does not read it; it spells the literal again:
      "SET content        = '[REDACTED]',
      original_input = CASE WHEN original_input IS NULL THEN NULL ELSE '[REDACTED]' END"
      in src/modules/compliance-audit/repository/compliance-audit.repository.ts, lines 68-69)
    cost: >-
      The redaction literal exists as code in two places, and nothing in this file's own flow uses
      the one declared here. A change to the node's literal can be made in one place and not the
      other, and nobody can tell which spelling was the decision. The constant looks like the
      authority (it is exported and carries a docstring), but the SQL that actually redacts does
      not read it.
    kind: contradicts
    correction: >-
      The literal should have a single home in code, bound to the node, or the unused exported
      constant should be dropped. The code cannot read the specification, so the bind has to
      claim whichever file holds it.
    node: rules/knowledge-base/compliance-deletion-redacts-content
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      lines 301-318 (rowToDto) and 338-347 (coerceNonNegativeInt)
    evidence: >-
      "defensively coerce missing keys to 0 so the response always satisfies the Zod contract on the
      read path even if a legacy row carries a partial blob."
      chunks: coerceNonNegativeInt(a.chunks),
      if (typeof v === "number" && Number.isFinite(v) && v >= 0) { return Math.trunc(v); }
      ... return 0;
    cost: >-
      A stored count that is absent, negative, non-numeric or fractional is reported to the owner as
      0 or a truncated integer, so an audit record can state "0 fragments deleted" for a deletion
      whose count was never recorded. The nodes say only that each count is zero or more. The
      substitution rule lives only in this converter, and the next reader will look for it in the
      specification and not find it.
    kind: unstated
    correction: >-
      Either give this read-time substitution a node, or let the nodes decide that a malformed
      stored count is refused or reported as absent.
    node: rules/knowledge-base/affected-counts-non-negative
  - file: src/modules/compliance-audit/service/compliance-audit.service.ts
    where: >-
      the comment at lines 173-174, above insertCurationAction at lines 175-181
    evidence: >-
      // BR-08 — write CurationAction row (action='compliance_delete',
      // target_kind='raw_information', target_id=<the raw>).
    cost: >-
      The comment restates, in prose, the kind, target kind and target of the curation action that
      the node holds. The insertCurationAction call at lines 175-181 carries the same values as
      code. A second statement of the fact outside behavior can drift from the node and from the
      call it describes. The same applies to the BR-nn and UC-nn labels in the other comments of
      this file.
    kind: restates
    correction: >-
      Remove the comment. The code in this file holds the fact.
    node: rules/knowledge-base/compliance-deletion-records-curation-action
read:
