      The file is a projection helper with no route, operation or refusal. It
      declares `export interface AffectedNode { readonly id: string; readonly
      canonical_name: string; readonly node_type: string; }`, and no search,
      provenance, listing or graph-read operation appears in it.
  - node: rules/knowledge-base/accepted-fragment-listing-refuses-unknown-parameter
    held_at: nowhere
    evidence: >-
      No accepted-fragment listing or query-parameter validation appears in the
      file. Its queries are `SELECT kn.id, kn.canonical_name ... FROM
      knowledge_node kn JOIN node_type nt` and `SELECT tool_name, result,
      validation_outcome FROM tool_call`.
  - node: rules/knowledge-base/affected-nodes-omit-absent
    held_at: >-
      resolveAffectedNodes, step 3 (lines 306-308 and 310-311), plus the
      batched lookup at lines 245-261
