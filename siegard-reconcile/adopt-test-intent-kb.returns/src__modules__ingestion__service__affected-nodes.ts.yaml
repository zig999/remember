looked_past: >-
  The process-scoped LRU of capacity 256 (`const CACHE_CAPACITY = 256 as const;`) and the in-memory-only persistence are performance and implementation choices with no observable effect on the wire payload (the derived fallback is byte-equivalent), so no domain judgment applies; the comment claiming "BR-33" authority for them, and the one at lines 79-86 claiming the spec says to collect the union, are prose only.
