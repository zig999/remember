findings:
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      lines 71-80, the guard after the attribute_key lookup
    evidence: >-
      if (resolvedKey.node_type_id !== nodeTypeId) {
        throw new ValidationFailure(
          "VALIDATION_INVALID_FORMAT",
          "attribute_key.node_type_id does not match the node's node_type_id.",
          { node_id: args.node_id, key: args.key }
        );
      }
    cost: >-
      The specification refuses an attribute key not held for the node's type with BUSINESS_UNKNOWN_ATTRIBUTE_KEY. This guard refuses the same condition with VALIDATION_INVALID_FORMAT and its own message. The catalog lookup above it is already scoped to (node_type_id, key), so the guard is unreachable today. If the catalog scope ever relaxes, callers would see a code and a message that no node holds, and the next reader would not find them in the specification.
    kind: contradicts
    correction: >-
      Either remove the guard, since the scoped lookup already enforces the rule, or make it refuse with the code the node's contract names for the unknown-attribute-key case.
    node: rules/knowledge-base/attribute-key-for-node-type
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      lines 85-92, the comment above the closed-domain gate
    evidence: >-
      // Closed-domain gate (BR-30). ... `assertValueInDomain` rejects out-of-domain literals
      // with `VALIDATION_INVALID_FORMAT` carrying `{ value, allowed_values }`.
      // Exact match (no normalisation) per spec §1 / BR-30 v1 semantics.
    cost: >-
      The comment restates a rule the node holds: a value must be one of the allowed values exactly as written. Code holds it too, in the call `assertValueInDomain(args.value, domain)` in this file. The comment is a second home for the rule outside behavior. If the node moves, the comment keeps saying the old rule and no check reaches it.
    kind: restates
    correction: >-
      Remove the comment. The fact stays in the node and in the gate's code.
    node: rules/knowledge-base/attribute-value-in-allowed-values
  - file: src/modules/ingestion/service/propose-attribute.service.ts
    where: >-
      lines 131-134, the comment above the source-metadata query
    evidence: >-
      // `received_at` is the LAST link of the date-justification chain (v7 §6.5 / §13c / A14)
      // and is consumed by `validateTemporal` as the fallback for
      // `requires_valid_from = true` rows that carry no stated/document date.
    cost: >-
      The comment restates the rule that a proposal needing a validity start falls back to the document date and then the reception date. Code holds it too: `received_at: receivedAt` is passed into `validateTemporal`. The comment is prose outside behavior and can diverge from the node without anything noticing.
    kind: restates
    correction: >-
      Remove the comment. The fact stays in the node and in the call to `validateTemporal`.
    node: rules/knowledge-base/required-start-available
