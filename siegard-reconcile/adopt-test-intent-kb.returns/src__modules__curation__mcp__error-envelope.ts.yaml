findings:
  - file: src/modules/curation/mcp/error-envelope.ts
    where: >-
      ZOD_CUSTOM_CODE_PRIORITY (lines 22-31) and its use in mapZodError (lines 70-79)
    evidence: >-
      const ZOD_CUSTOM_CODE_PRIORITY: readonly string[] = [
        "BUSINESS_TARGET_NODE_REQUIRED",
        "BUSINESS_REASON_REQUIRED",
        "BUSINESS_SELF_MERGE_FORBIDDEN",
        "BUSINESS_DISPUTE_WINNER_REQUIRED",
        "BUSINESS_DISPUTE_PERIODS_REQUIRED",
        "BUSINESS_TEMPORAL_INCOHERENT",
        "BUSINESS_CORRECTION_NO_CHANGES",
        "BUSINESS_DATE_UNJUSTIFIED",
      ];
      ... for (const code of ZOD_CUSTOM_CODE_PRIORITY) { if (seen.has(code)) { ... return mapped(status, "warn", {
    cost: >-
      This list decides which refusal code and message a person sees when a curation request fails
      on several grounds at once, and no node states that precedence. The contract lists its refusals
      per operation, but it nowhere says which wins when several apply. For correct-item the contract
      lists BUSINESS_CORRECTION_NO_CHANGES, then BUSINESS_DATE_UNJUSTIFIED, then
      BUSINESS_TEMPORAL_INCOHERENT. This list puts BUSINESS_TEMPORAL_INCOHERENT first. For merge-nodes
      the contract lists the self-merge refusal first. This list puts BUSINESS_REASON_REQUIRED first.
      The next reader looks in the specification for which refusal wins and finds nothing. The code is
      then the only place the decision lives.
    kind: unstated
    correction: >-
      Analysis would state the precedence among simultaneous curation refusals in the curation contract
      (or a rule it cites), so that the order here has a node to answer to.
    node: contracts/knowledge-base/curation
