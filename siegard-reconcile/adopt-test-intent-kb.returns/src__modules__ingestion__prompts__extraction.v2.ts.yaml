findings:
  - file: src/modules/ingestion/prompts/extraction.v2.ts
    where: >-
      The header comment, lines 1-15, and the last bullet of EVENT_DATING_DIRECTIVE, lines 50-51.
    evidence: >-
      "- Rescheduling an event is `change_hint:\"succession\"` on `event_date` — the"
      "  same mechanics as any functional attribute (the old date becomes history)."
    cost: >-
      This prompt text tells the model to mark a rescheduled event as a succession on event_date.
      No node holds that instruction. The nodes that hold the event directive (extraction-dates-events,
      extraction-event-date-is-the-value) cover proposing event_date and end_date and giving the
      validity start. They say nothing on rescheduling. Succession-closes-previous holds what the
      system does once a succession arrives, not what the model is asked to send. The next reader
      will look in the specification for how rescheduling reaches the model and find only this prompt.
    kind: unstated
    correction: >-
      Analysis should give the rescheduling instruction a node, for example a rule beside
      extraction-dates-events stating that under prompt version v2 and later the model is asked to
      mark a changed event date with change hint succession. Alternatively the sentence leaves the prompt.
  - file: src/modules/ingestion/prompts/extraction.v2.ts
    where: >-
      The header comment, lines 1-9, and the docstring of EVENT_DATING_DIRECTIVE, lines 32-37.
    evidence: >-
      "// v2 = v1 + an explicit Event-dating directive. The \"go-live veio sem data\""
      "// gap was a PROMPT gap: v1 never told the model to propose `event_date` when it"
      "// creates an Event"
    cost: >-
      The comment restates, as prose, that v2 asks the model to propose event_date for an Event.
      The directive itself holds this fact in this file (lines 41-44, the `## Events` bullets), and
      the node holds it too. The prose is a second home that must be kept in step with both.
    kind: restates
    correction: >-
      Remove the comment and docstring prose. The code in EVENT_DATING_DIRECTIVE holds the fact, and
      the rationale for the version belongs in the node's decision log.
    node: rules/knowledge-base/extraction-dates-events
