findings:
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      the comment block above `const reaffirmation` in consolidateLinkOnce, lines 530-548
    evidence: >-
      "For MULTI-CURRENT types (`functional === false`): `valid_from` equality is NOT required. ... For FUNCTIONAL types (`functional === true`): also require `sameValidFrom`."
    cost: >-
      The comment states, in prose, the node's rule on when a proposal re-affirms (change hint none, same validity start only for a type that does not allow multiple current assertions). The code below it already holds that rule: `sameTarget && args.change_hint === "none" && (!functional || sameValidFrom)`. A second statement of the rule outside the node can drift from the node. The attribute branch already has, and the comment does not mention that difference.
    kind: restates
    correction: >-
      Remove the comment block. The rule stays in rules/knowledge-base/reaffirmation-consolidates and in the `reaffirmation` expression.
    node: rules/knowledge-base/reaffirmation-consolidates
  - file: src/modules/ingestion/service/graph-consolidation.service.ts
    where: >-
      the re-affirmation condition in consolidateAttributeOnce, lines 776-784, and the closing comment at lines 852-854
    evidence: >-
      "if (\n      sameValue &&\n      sameValidFrom &&\n      args.change_hint === \"none\"\n    ) {" and "different valid_from\n    // on a multi-valued attribute is coexistence)."
    cost: >-
      The node (statement, final decision in its log) requires the same validity start to re-affirm only for a type that does not allow multiple current assertions. The attribute branch requires `sameValidFrom` for multi-current attribute keys as well. A multi-current attribute re-stated with change hint none and a different validity start therefore falls through to (e) and inserts a new row, where the node says it re-affirms and records no new assertion. The link branch applies `(!functional || sameValidFrom)`, so links and attributes decide differently for the same case. The comment calls this "coexistence", a rule no node holds and the node's log reads against.
    kind: contradicts
    correction: >-
      The attribute re-affirmation condition would have to drop the validity-start requirement when `attrKeyInfo.allows_multiple_current` is true, as the link branch does: `sameValue && args.change_hint === "none" && (!functional || sameValidFrom)`.
    node: rules/knowledge-base/reaffirmation-consolidates
