    cost: >-
      The at-least-one-change rule is restated in a comment citing a back-spec code, BR-18.
      The node and the `someProvided` check hold it, so a reader of the comment has a
      second statement to reconcile with the node.
    kind: restates
    correction: >-
      Remove the comment. The `someProvided` check below it holds the fact.
    node: rules/knowledge-base/correction-changes-something
