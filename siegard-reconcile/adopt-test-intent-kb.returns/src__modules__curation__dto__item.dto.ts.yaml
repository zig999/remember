      the docstring above RejectItemBodySchema, line 21
    evidence: >-
      /** reject_item — reason mandatory (destructive, BR-11). */
    cost: >-
      The reason-required rule is restated in prose beside the schema that enforces it
      (reason: ReasonRequiredSchema), citing a back-spec rule code, BR-11, instead of
      the node. When the node moves, this comment is the second place a reader finds
      the old rule, and nothing keeps it in step.
