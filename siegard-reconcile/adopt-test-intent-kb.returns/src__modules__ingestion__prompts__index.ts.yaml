findings:
  - file: src/modules/ingestion/prompts/index.ts
    where: >-
      the file-header comment (lines 10-15) and the docblock above selectPromptModule (lines 83-87)
    evidence: >-
      "// An unknown version is a configuration error, NOT a silent fallback: BR-26
      // step 2 mandates "load the extraction.${prompt_version} module; fail with 500
      // SYSTEM_INTERNAL_ERROR if the module is missing"." and "Throws
      `UnknownPromptVersionError` for an unregistered version (BR-26 step 2 — fail
      loud, never silently substitute a different prompt than the run declares)."
    cost: >-
      The comments restate the rule that an extraction's prompt version must be one the system holds, and
      they cite "BR-26", a back-spec rule number, as if it were the authority. Code already holds the
      fact in this file: `if (module === undefined) { throw new UnknownPromptVersionError(promptVersion); }`.
      The citation can drift from the node, and the next reader will look in the comment instead of in
      rules/knowledge-base/prompt-version-known. The comments also name a 500 SYSTEM_INTERNAL_ERROR
      outcome that this file does not produce. I did not check whether code in another file maps
      the error to that code.
    kind: restates
    correction: >-
      Remove the comments. This is a prose-only change, because the code already holds the fact. Do not touch
      the message of UnknownPromptVersionError, which is text the system emits.
    node: rules/knowledge-base/prompt-version-known
