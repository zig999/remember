findings:
  - file: src/modules/ingestion/validation/errors.ts
    where: >-
      header comment, lines 27-29 (the paragraph on the extra BUSINESS_RUN_NOT_RUNNING code)
    evidence: >-
      // The extra `BUSINESS_RUN_NOT_RUNNING` code is emitted by the MCP handler
      // guard when the ambient `llm_run_id` points to a row whose `status` is not
      // `'running'` (BR-21 / catalog Ingestion section).
    cost: >-
      The comment states that a proposal is refused unless its run is running, which is a fact
      a node holds. The code already holds it: handler-base.ts line 117 emits
      "BUSINESS_RUN_NOT_RUNNING", and llm-run.service.ts defines RunNotRunningError with that
      code. The comment is a second home for the rule outside behavior. A reader who trusts it
      would not know it can go stale, for example if the node is later reworded to say "ambient".
    kind: restates
    correction: >-
      Remove the comment through the comment route, then run /reconcile over the file. The
      union member "BUSINESS_RUN_NOT_RUNNING" stays, because it is code.
    node: rules/knowledge-base/proposal-requires-running-run
