findings:
  - file: src/modules/curation/dto/entity-match.dto.ts
    where: >-
      the comments at lines 17-23 (docstring of ResolveEntityMatchBodySchema), line 40 (inside
      the superRefine), and line 62 (above MergeNodesBodySchema)
    evidence: >-
      "ResolveEntityMatchRequest — BR-11 (reason mandatory on merge_into),
      BR-23 (self-merge forbidden at request shape)." and
      "// Surfaced as BUSINESS_TARGET_NODE_REQUIRED downstream." and
      "/** MergeNodesRequest — BR-11 (reason required), BR-23 (self-merge forbidden). */"
    cost: >-
      These comments state, in prose, that a reason is mandatory on merge_into and that a
      self-merge is forbidden. Code in this file already enforces both, at
      `message: "BUSINESS_REASON_REQUIRED"` and `message: "BUSINESS_SELF_MERGE_FORBIDDEN"`. The
      node contracts/knowledge-base/curation holds these refusals and cites no BR-11 or BR-23
      numbering. A reader who finds the "BR-nn" labels here may take the comment, not the node,
      for the authority. The labels also go stale on their own when the node changes.
    kind: restates
    correction: >-
      Remove the three comments. The behavior is correct and the facts are already held by the
      node, so this is the comment-only route, followed by /reconcile over the file.
    node: contracts/knowledge-base/curation
