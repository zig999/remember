findings:
  - file: src/modules/ingestion/dto/propose-link.dto.ts
    where: >-
      the docstring above ValidFromBasisSchema, lines 5-15
    evidence: >-
      "Only `stated` and `document` are accepted at the API boundary. The third
      value, `received`, is a backend-only fallback that the temporal validator
      applies internally when neither `stated` nor `document` can justify the
      date — it is never sent by an LLM or any external caller, so it MUST NOT
      appear in this input enum."
    cost: >-
      The rule that a caller never states the basis received is written in prose beside the enum.
      The enum is the only thing that enforces it. A reader who opens the docstring finds a second
      statement of the rule. When the node moves, nothing points at this comment, so it can drift
      unnoticed.
    kind: restates
    correction: >-
      Remove the docstring. The fact is held by the code, `z.enum(["stated", "document"])` in this
      file, and by the node. The route is the comment route, then a reconcile over this file.
    node: rules/knowledge-base/caller-never-states-received
