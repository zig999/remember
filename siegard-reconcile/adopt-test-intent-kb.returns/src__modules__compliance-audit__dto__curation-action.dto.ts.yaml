looked_past: >-
  The facts this file states are held by nodes outside the pack: the seven action kinds, the five target kinds, the 1 to 100 limit with default 50, the offset of at least 0, the 1000-character reason and the start-before-end window, and the pack's own nodes govern none of them, so I made no finding for them. Two further points belong to other judgments. The enum members are spelled with underscores (`resolve_entity_match`) while the nodes spell them with hyphens (`resolve-entity-match`), and I found no node stating the wire spelling. The comments "`from` inclusive, `to` exclusive" and "validated at the API layer ONLY (BR-10)" are prose, and the inclusive-start, exclusive-end rule is held by code in another file that I did not scan.
