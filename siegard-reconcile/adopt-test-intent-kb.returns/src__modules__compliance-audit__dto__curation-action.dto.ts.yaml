    where: >-
      the doc comment above CurationActionNameSchema, line 11
    evidence: >-
      /** 7 curation-tool names of §14.4 (BR-10). */
    cost: >-
      The comment states the closed set of seven curation action kinds. The enum right below it
      holds that set as code, and the specification holds it in the node
      domain/knowledge-base/curation-action-kind. The comment is a second home for the fact. It
      cites a section and a rule number from an earlier document, so a reader is sent there
      instead of to the node. Nothing keeps it in step with the node.
    kind: restates
    correction: >-
      Remove the comment. The enum in this file carries the fact, and the node holds it.
    node: domain/knowledge-base/curation-action-kind
