findings:
  - file: src/modules/knowledge-graph/traversal/config.ts
    where: >-
      The header comment (lines 1-15) and the doc comment on TRAVERSAL_DECAY (line 17)
    evidence: >-
      /** Per-hop score multiplier: `score(hop) = TRAVERSAL_DECAY ** hop`. */
      export const TRAVERSAL_DECAY = 0.5 as const;
    cost: >-
      The scoring rule is written in prose a second time beside the constant. The node says
      "A knowledge link a traversal reaches at hop h scores 0.5 raised to the power h". When
      the node moves, `--check` does not reach this comment, so it can quietly go on stating
      the old formula. The code that holds the value, the constant, is not affected.
    kind: restates
    correction: >-
      Remove the comment prose. The fact stays held by the constant and by the node
      rules/knowledge-base/traversal-link-score.
    node: rules/knowledge-base/traversal-link-score
  - file: src/modules/knowledge-graph/traversal/config.ts
    where: >-
      The doc comments on TRAVERSAL_DEPTH_MIN and TRAVERSAL_DEPTH_MAX (lines 20 and 23)
    evidence: >-
      /** Lower bound on the depth parameter (BR-05 of `knowledge-graph.back.md`). */
      /** Upper bound on the depth parameter (BR-05). */
    cost: >-
      The depth bounds are described in prose that cites a back-spec rule rather than the
      node. A reader who follows the citation is sent to a document that is not the
      authority. The node moving does not reach this comment.
    kind: restates
    correction: >-
      Remove the comments. The bounds stay held by the constants (1 and 3) and by the node
      rules/knowledge-base/expansion-depth-bounds.
    node: rules/knowledge-base/expansion-depth-bounds
  - file: src/modules/knowledge-graph/traversal/config.ts
    where: >-
      The doc comment on TRAVERSAL_DEPTH_DEFAULT (line 26)
    evidence: >-
      /** Default depth when the caller does not specify one. */
      export const TRAVERSAL_DEPTH_DEFAULT = 1 as const;
    cost: >-
      The default-depth rule is stated in prose beside the constant. The node says a
      traversal that omits an option "goes one hop deep". The comment is a second statement
      of that default that nothing keeps in step with the node.
    kind: restates
    correction: >-
      Remove the comment. The default stays held by the constant and by the node
      rules/knowledge-base/traversal-defaults.
    node: rules/knowledge-base/traversal-defaults
