findings:
  - file: src/modules/curation/mcp/curation-toolset.ts
    where: >-
      CurationToolDescriptions.merge_nodes, lines 171-175 (the description served over tools/list)
    evidence: >-
      "Merge two `active` KnowledgeNodes directly (no review queue). `absorbed_id` " +
      "is set to `status=merged` with `merged_into_node_id=survivor_id`; every " +
      "link / attribute / alias is repointed to the survivor in the same " +
      "transaction (BR-04, BR-07). `reason` is mandatory."
    cost: >-
      This text is what the LLM client is told over tools/list. It says aliases are repointed to the survivor. The rule says the survivor receives a copy of each alias whose normalized form it does not hold, and the absorbed node keeps its own aliases. A client reasoning from the description expects the absorbed node to lose its aliases, and it does not.
    kind: contradicts
    correction: >-
      The description should say that links and attributes move to the survivor and that aliases are copied, with the absorbed node keeping its own. The node itself is not the one that is wrong.
    node: rules/knowledge-base/merge-copies-aliases
