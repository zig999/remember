    where: >-
      line 7, ItemKindSchema (exported as ItemKind)
    evidence: >-
      export const ItemKindSchema = z.enum(["link", "attribute"]);
    cost: >-
      The vocabulary of curation item kinds is declared here, and the node that holds it is bound to no file in the trace. When the node moves, the check never reaches this file. The identifier ItemKind also names a different node, item-kind, whose values are node, link and fragment. A reader who looks up ItemKind in the specification finds the wrong vocabulary.
    kind: contradicts
    correction: >-
      Bind domain/knowledge-base/assertion-kind to this file, since this declaration is where the fact is held. The code cannot read the specification, so the bind is what closes it.
    node: domain/knowledge-base/assertion-kind
