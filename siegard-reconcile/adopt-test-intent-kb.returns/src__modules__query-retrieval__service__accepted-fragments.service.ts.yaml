looked_past: >-
  The route and log-event strings in the logger.info call ("GET /api/v1/fragments/accepted", "query_retrieval_list_accepted_fragments_ok"), and the skipping of the select when the count is zero, are observability and implementation choices that say nothing about a domain fact.
