looked_past: >-
  The docstrings cite openapi.yaml and BR-12, BR-33, BR-10 and UC-05, and
  restate that affected_nodes appears only for a completed run and how orphaned
  fragments are defined. That is prose; the facts these comments restate
  (completed-only affected nodes, the orphaned-fragment definition) are held by
  nodes outside this pack (rules/knowledge-base/affected-nodes-only-when-completed,
  rules/knowledge-base/orphaned-fragment). I did not check whether code
  elsewhere also holds them, and that is the comment route's judgment.
