looked_past: >-
  The limits the file enforces in code (content up to 10 MiB, fragment text 1..1000, node name and alias 1..500, attribute value 1..2000, source label 1..200, recent-ingestions limit 1..50 default 10, at least one fragment and one node) match nodes outside this pack and conform. The block comments in the `ingest_directed` section also restate other directed-ingestion facts (full confidence, the directed run's model and prompt sentinels, the pin skipping resolution, the label carried into metadata), whose code sits in the service and not in this file. I did not read that service, so I filed no `restates` for them.
