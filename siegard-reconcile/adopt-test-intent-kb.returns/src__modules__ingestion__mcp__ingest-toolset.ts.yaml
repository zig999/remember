findings:
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      the ingest_document handler's Zod-failure branch, lines 255-267
    evidence: >-
      code: "VALIDATION_INVALID_FORMAT",
      message: "ingest_document arguments failed validation.",
    cost: >-
      The ingestion contract gives the refusal's code and the failing-field listing for ingest-document but no message. The message is told to the MCP caller, and it lives only in this handler. The contract names the equivalent directed wording ("ingest_directed arguments failed validation."), so a reader checking the contract for this one finds nothing.
    kind: unstated
    correction: >-
      The analysis would give the ingest-document validation refusal its message in the ingestion contract, as was done for ingest-directed.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      mapReadError, the ZodError branch, lines 402-413. It serves get_ingestion_status and list_recent_ingestions.
    evidence: >-
      code: "VALIDATION_INVALID_FORMAT",
      message: "Request payload failed validation.",
      details: err.issues.map((i) => ({
    cost: >-
      The ingestion contract states VALIDATION_INVALID_FORMAT with the failing fields for list-recent-ingestions and read-llm-run, but not this message. The message is told to the caller and exists only here. The contract's silence leaves a reader unable to tell whether this wording was decided or just happened.
    kind: unstated
    correction: >-
      The analysis would state, in the ingestion contract, the message that the recent-ingestions listing and the MCP run read answer on a malformed argument.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-toolset.ts
    where: >-
      runZodFailureAudit, the ValidationFailure thrown inside run, lines 465-468. Through runIngestHandler it becomes the envelope message of all four propose_* tools on a failed parse.
    evidence: >-
      throw new ValidationFailure(
        "VALIDATION_INVALID_FORMAT",
        "MCP tool args failed Zod parse.",
    cost: >-
      The contract says that over MCP a proposal refused for its shape answers the message "Input failed Zod parse." for all four proposals. handler-base.ts copies this failure's message verbatim into the envelope (`message: validationFailure.message`). The MCP caller therefore gets a different message from the one decided, and callers that match on the decided wording will miss it.
    kind: contradicts
    correction: >-
      The message on this path would have to be the contract's "Input failed Zod parse.".
    node: contracts/knowledge-base/ingestion
