findings:
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      the file-header comment, lines 18-21 (Idempotency paragraph)
    evidence: >-
      // Idempotency (BR-08): if the same content was already ingested,
      // `ingestRawInformation` returns `noop_existing`; we DO NOT re-run extraction
      // (the existing run is completed, or running, and re-running would either no-op
      // or 409). The tool reports `already_ingested` with the existing ids — never an
      // error.
    cost: >-
      The held-content answer is stated in prose in this file as well as in the ingestion contract. The branch `if (outcome === "noop_existing")` carries the behavior, so the prose is a second home. A reader who finds the comment first takes it for the decision, and the contract never reaches it when the answer moves.
    kind: restates
    correction: >-
      Remove the paragraph. The branch at `outcome === "noop_existing"` and the contract hold the fact. The comment route lands the removal, followed by `/reconcile` over this file.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/ingest-document.handler.ts
    where: >-
      the docstring above `DEFAULT_INGEST_MODEL`, lines 41-49
    evidence: >-
      Hard-coded fallback extraction model used only when the caller omits `model`
      AND no `ingestModel` is wired (e.g. a bare test harness). Production threads
      `env.INGEST_MODEL` through `deps.ingestModel`. Cost-optimized to Sonnet 4.6 —
    cost: >-
      The default-model rule is described in a docstring while `input.model ?? deps.ingestModel ?? DEFAULT_INGEST_MODEL` and the constant `"claude-sonnet-4-6"` hold it in code. The docstring adds a second account of the rule, along with a cost rationale and a note about an earlier model that no node records. When the rule changes, the docstring is not updated by anything.
    kind: restates
    correction: >-
      Remove the docstring. The constant and the `??` chain hold the fact. The rationale belongs in the decision log of the rule, if anywhere. The comment route lands the removal, followed by `/reconcile` over this file.
    node: rules/knowledge-base/default-extraction-model
