      Only the list-nodes and read-node operations, in listNodesService (lines 47-83) and getNodeByIdService
      (lines 92-139). The read-node unknown-identity 404 is the throw at line 99, the deleted-node 410 is the
      throw at line 103, and the list-nodes unknown-node-type refusal is the throw at line 57. The accepted
      shapes are the returned objects.
    evidence: >-
      throw new ResourceNotFoundError("KnowledgeNode", input.nodeId); throw new NodeDeletedError(input.nodeId); throw new UnknownNodeTypeError(input.node_type); return { total: repoResult.total, limit: input.limit, offset: input.offset, items: repoResult.items.map(toNodeSummary) }; return { node: toNodeSummary(node), aliases: aliases.map(toNodeAlias), attributes: attributeRows.map(...) }
