findings:
  - file: src/modules/knowledge-graph/service/node.service.ts
    where: >-
      warnIfEmptyProvenance, lines 141-162, called from getNodeByIdService at line 127
    evidence: >-
      logger.warn({ route: ctx.route, node_id: ctx.nodeId, attribute_id: r.id, status: r.status }, "knowledge_graph_empty_provenance")
    cost: >-
      The service emits a WARN log whenever a node read meets a non-deleted attribute with no provenance. The
      specification states only that such an attribute is shown with an empty provenance list. It does not say the
      anomaly is logged, at what level, or under what event name. The next reader who looks in the specification for
      what an empty provenance chain does on a node read will not find this behavior.
    kind: unstated
    correction: >-
      Give the warning a node, for example a constraint beside the logging constraints, or an amendment to
      rules/knowledge-base/graph-read-shows-empty-provenance. Otherwise remove the log.
    node: rules/knowledge-base/graph-read-shows-empty-provenance
  - file: src/modules/knowledge-graph/service/node.service.ts
    where: >-
      the comment at line 52 above the node_type lookup in listNodesService
    evidence: >-
      // BR-03 — resolve node_type name to id via cache.
    cost: >-
      The comment restates, as a BR number, the refusal of a node type the catalog does not hold. A second home
      outside behavior will drift when the node moves.
    kind: restates
    correction: >-
      Remove the comment. The throw of UnknownNodeTypeError at line 57 holds the fact.
    node: rules/knowledge-base/node-type-filter-in-catalog
  - file: src/modules/knowledge-graph/service/node.service.ts
    where: >-
      the comment at line 62 above the status default in listNodesService
    evidence: >-
      // BR-15 — default to active when caller omits status.
    cost: >-
      The comment restates the node's default-to-active rule, which the code holds in the same file. The comment is
      a second home that nothing reads.
    kind: restates
    correction: >-
      Remove the comment. The expression `input.status ?? "active"` at line 63 holds the fact.
    node: rules/knowledge-base/node-listing-by-status
  - file: src/modules/knowledge-graph/service/node.service.ts
    where: >-
      the comment at line 101 above the deleted check in getNodeByIdService
    evidence: >-
      // BR-11 — deleted -> 410 (row exists but tombstoned).
    cost: >-
      The comment restates the refusal of a node read for a deleted node, and the HTTP 410 mapping with it. It is a
      second home for a fact the code and the node already hold.
    kind: restates
    correction: >-
      Remove the comment. The `node.status === "deleted"` branch throwing NodeDeletedError holds the fact.
    node: rules/knowledge-base/deleted-node-read-refused
  - file: src/modules/knowledge-graph/service/node.service.ts
    where: >-
      the comment at line 105 after the deleted check in getNodeByIdService
    evidence: >-
      // Merged nodes return 200 with the merged_into pointer; caller follows.
    cost: >-
      The comment states that a merged node is answered as itself. The code holds this by having no branch for
      status "merged". The comment is a second home, and it adds that the caller follows the pointer, which the
      node does not say.
    kind: restates
    correction: >-
      Remove the comment.
    node: rules/knowledge-base/merged-node-read-as-itself
