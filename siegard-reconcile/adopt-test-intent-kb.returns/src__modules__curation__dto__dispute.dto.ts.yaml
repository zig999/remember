findings:
  - file: src/modules/curation/dto/dispute.dto.ts
    where: >-
      the AdjustedPeriodSchema declaration, line 15
    evidence: >-
      valid_from: IsoDateSchema.nullable(),
      valid_to: IsoDateSchema.nullable().optional(),
    cost: >-
      The adjusted-period node lists valid_from and valid_to alike as optional dates, with only item_id required. This
      schema makes valid_from a mandatory key that may be null, and lets only valid_to be left out. A caller who gives
      only item_id and valid_to is refused here, which the node does not say. The next reader looks in the
      specification for why the two bounds differ and finds nothing.
    kind: contradicts
    correction: >-
      Either the node states that an adjusted period must always carry a validity start key, or the schema accepts an
      omitted valid_from as it does valid_to.
    node: domain/knowledge-base/adjusted-period
  - file: src/modules/curation/dto/dispute.dto.ts
    where: >-
      the docstring of ResolveDisputeBodySchema, lines 21-26, the `prefer_one` line
    evidence: >-
      `decision = prefer_one`  -> winner_id required, member of item_ids, reason required
    cost: >-
      The docstring restates the winner rule as prose. The rule is held by code in this same file, in the
      superRefine branch that adds BUSINESS_DISPUTE_WINNER_REQUIRED. The prose is a second home that can drift from the
      node, and it is never read by `--check`.
    kind: restates
    correction: >-
      Remove the prose. The code in this file already holds the fact.
    node: rules/knowledge-base/prefer-one-requires-winner
