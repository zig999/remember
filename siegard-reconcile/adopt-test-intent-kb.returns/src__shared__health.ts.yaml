looked_past: >-
  The file's own fact, the health report, is held by nodes outside this pack and the code
  conforms to them: `HealthReport` declares ok, service, database ("ok" | "unreachable") and
  checked_at, and `checked_at` is taken before `pingDatabase` is called. The header comment on
  why the module sits apart from app.ts is implementation rationale, not a domain fact.
