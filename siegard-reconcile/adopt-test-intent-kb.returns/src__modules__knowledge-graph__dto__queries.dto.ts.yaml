findings:
  - file: src/modules/knowledge-graph/dto/queries.dto.ts
    where: >-
      the doc comment above TraverseDirectionSchema, lines 114-117
    evidence: >-
      * Direction enum mirrors `openapi.yaml` traverseNode `direction` parameter.
      * Default in this schema is `both` (matches OpenAPI).
    cost: >-
      The traversal default of following links from either end is stated a second time in prose,
      and the prose names openapi.yaml as its authority, so the next reader checks that file
      instead of the specification node. The code in this file already holds the default, so
      nothing needs to change except the removal of the prose.
    kind: restates
    correction: >-
      Remove the comment. The default stays held by `direction: TraverseDirectionSchema.optional().default("both")`
      in TraverseQuerySchema.
    node: rules/knowledge-base/traversal-defaults
  - file: src/modules/knowledge-graph/dto/queries.dto.ts
    where: >-
      the doc comment above TraverseDepthCoercer, lines 130-136
    evidence: >-
      * Out-of-range `depth` is detected here AND re-asserted in the service layer
      * (defence in depth, BR-05 of back spec). Zod failure surfaces as Zod parse
      * error (422 VALIDATION_INVALID_FORMAT through the global handler); the
      * service-layer assertion produces BUSINESS_INVALID_TRAVERSE_DEPTH
    cost: >-
      The depth-bounds rule and its refusal code are described in prose that cites a back spec
      rather than the specification node. The prose also says the range is detected in this file,
      but TraverseDepthCoercer only checks that the value is a finite number. The bounds are held
      in ../traversal/config.js (TRAVERSAL_DEPTH_MIN, TRAVERSAL_DEPTH_MAX), which this file
      re-exports as TRAVERSAL_DEPTH_BOUNDS. A reader trusting the comment would look for a range
      check here that does not exist.
    kind: restates
    correction: >-
      Remove the comment. The bounds are held by the traversal config constants this file
      imports.
    node: rules/knowledge-base/expansion-depth-bounds
read:
  - node: contracts/knowledge-base/retrieval
    held_at: >-
      The request schemas for list-link-types, list-attribute-keys, list-nodes, read-node and
      traverse: ListLinkTypesQuerySchema, ListAttributeKeysQuerySchema, ListNodesQuerySchema,
      GetNodeByIdQuerySchema, TraverseQuerySchema, plus the path params NodeIdParamSchema,
      LinkIdParamSchema, AttributeIdParamSchema and NodeIdKeyParamSchema.
    evidence: >-
      `.strict()` on each query object (a parameter the operation does not define is refused);
      `z.union([z.boolean(), z.enum(["true", "false"])])` for switches;
      `node_type: z.string().min(1).max(200).optional()` for the 1 to 200 character name;
      `as_of: IsoDateOnly.optional()` with `/^\d{4}-\d{2}-\d{2}$/` for the year-month-day date;
      `z.enum(["out", "in", "both"])` for direction; `z.string().uuid()` for identities;
      `z.union([z.string().min(1), z.array(z.string().min(1))])` for an empty link-type name.
