findings:
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      line 56, the PER_LAYER_FETCH_LIMIT constant, used at lines 129-147 for the fragment, node and chunk layer queries
    evidence: |-
      const PER_LAYER_FETCH_LIMIT = 200;
    cost: >-
      Each layer contributes at most 200 candidates, and `total` is computed as `filtered.length` over those candidates. A search with more matches than that reports a smaller total than the real one and cannot page past the cap. The cap is not in any node I opened (the search-total-before-pagination node says the total counts every search item), so a reader checking the specification will not find it.
    kind: unstated
    correction: >-
      Give the per-layer candidate ceiling a node, or state that the total counts only the candidates retrieved. Alternatively, the code could drop the cap.
    node: rules/knowledge-base/search-total-before-pagination
