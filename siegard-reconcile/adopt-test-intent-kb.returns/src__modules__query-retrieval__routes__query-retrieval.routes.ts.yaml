findings:
  - file: src/modules/query-retrieval/routes/query-retrieval.routes.ts
    where: >-
      the /search handler, line 60 (the parse sits before the try block), with handleSearchError / isMappableSearchError, lines 200-221
    evidence: >-
      const query = SearchQuerySchema.parse(request.query ?? {});
      ... err instanceof InvalidSearchQueryError ||
      err instanceof InvalidSearchLayerError ||
      err instanceof UnknownLinkTypeError
    cost: >-
      The contract answers a blank, over-long or unparseable search query with HTTP 422 BUSINESS_INVALID_SEARCH_QUERY, and an expansion depth outside the bounds with HTTP 422 BUSINESS_INVALID_TRAVERSE_DEPTH. Here the query schema is parsed outside the try block, and the mappable set has no depth error. In search.dto.ts the schema rejects those inputs (min 1, max 1000, empty after trim, `expand_depth` min(1).max(3)). middleware/error-handler.ts maps every ZodError to 422 VALIDATION_INVALID_FORMAT with the message "Request payload failed validation.". A REST caller therefore gets a code the contract does not give for these refusals, and a client that branches on the contract's codes never sees them.
    kind: contradicts
    correction: >-
      The REST search refusals for a blank, over-long or unparseable query and for an out-of-bounds depth must reach the caller as the contract's BUSINESS_INVALID_SEARCH_QUERY and BUSINESS_INVALID_TRAVERSE_DEPTH, instead of falling into the generic ZodError mapping.
    node: contracts/knowledge-base/retrieval
  - file: src/modules/query-retrieval/routes/query-retrieval.routes.ts
    where: >-
      the /search handler line 60 and the /fragments/accepted handler line 168, where the query is parsed with no mapping of limit or offset refusals
    evidence: >-
      const query = SearchQuerySchema.parse(request.query ?? {});
      ...
      // ZodError -> 422 VALIDATION_INVALID_FORMAT via the global handler.
      const query = ListAcceptedFragmentsQuerySchema.parse(request.query ?? {});
    cost: >-
      For search and for the accepted-fragment listing the contract answers a page limit or offset out of bounds with HTTP 422 VALIDATION_OUT_OF_RANGE. These routes hand the ZodError to the global handler, which answers VALIDATION_INVALID_FORMAT. The code a client receives differs from the one the contract publishes.
    kind: contradicts
    correction: >-
      A limit or offset outside its bounds on these two operations must answer VALIDATION_OUT_OF_RANGE, as the contract states.
    node: contracts/knowledge-base/retrieval
  - file: src/modules/query-retrieval/routes/query-retrieval.routes.ts
    where: >-
      route registrations: "/search", "/provenance/links/:link_id", "/provenance/attributes/:attribute_id", "/provenance/fragments/:fragment_id", "/fragments/accepted" (lines 59, 90, 112, 136, 164)
    evidence: >-
      app.get("/provenance/links/:link_id", ... app.get("/fragments/accepted", ...
    cost: >-
      The contract names the operations (search, read-link-provenance, list-accepted-fragments and so on) but not the addresses they are served at. The paths exist only in this file's route table, so a reader of the specification cannot learn where the owner's read surface lives, and a change of address would not be a change to any node.
    kind: unstated
    correction: >-
      The contract should state the address of each operation it publishes, or a node should state that the operations are served at these paths.
    node: contracts/knowledge-base/retrieval
  - file: src/modules/query-retrieval/routes/query-retrieval.routes.ts
    where: >-
      the comment block above the /fragments/accepted handler, lines 158-163
    evidence: >-
      // filtered by `llm_run_id` and/or `raw_information_id` (at least
      // one required). Tombstoned sources are silently omitted.
    cost: >-
      The comment restates a rule a node already holds, and the code holds it in another file. fragment.dto.ts carries `.refine((v) => v.llm_run_id !== undefined || v.raw_information_id !== undefined`. A second home in prose means a reader may take the comment, not the node, as where the rule lives. The pair conforms, so what is owed is the prose's removal.
    kind: restates
    correction: >-
      Remove the comment. The rule is held by the node and enforced in src/modules/query-retrieval/dto/fragment.dto.ts.
    node: rules/knowledge-base/listing-requires-a-filter
