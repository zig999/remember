findings:
  - file: src/modules/knowledge-graph/mcp/query-toolset.ts
    where: >-
      QUERY_TOOL_NAMES (lines 161-171) and the nine registerTool calls with
      name: "..." in registerQueryToolset (lines 268-412)
    evidence: >-
      export const QUERY_TOOL_NAMES: readonly QueryToolName[] = [ "get_node",
      "traverse", "get_history_link", "get_history_attribute",
      "get_history_attribute_key", "list_nodes", "list_node_types",
      "list_link_types", "list_attribute_keys", ];
    cost: >-
      The specification's retrieval contract names these reads as
      read-node, read-link-history, read-attribute-history, list-node-types
      and so on. The names an LLM caller must use (get_node,
      get_history_link, ...) exist only in this array and the registerTool
      calls. A caller or reviewer who looks in the specification for the
      tool vocabulary will not find it. A rename here would change what
      callers see and no node would register the change.
    kind: unstated
    correction: >-
      An analysis would have to decide whether the retrieval contract (or a
      constraint beside the llm-toolset-* ones) holds the MCP tool name of
      each read operation. The code cannot close this.
    node: contracts/knowledge-base/retrieval
read:
  - node: contracts/knowledge-base/retrieval
    held_at: >-
      registerQueryToolset, lines 260-422. It registers nine of the contract's
      operations as MCP tools: read-node as get_node, traverse, the three
      history reads, list-nodes, list-node-types, list-link-types and
      list-attribute-keys. Each wraps its service call in a read-only
      transaction and returns { ok: true, result } or the mapped error
      envelope. The refusal codes are produced by the shared mapper and the
      DTO schemas in other files.
    evidence: >-
      handler: makeHandler(GetNodeInputSchema, (input, client) =>
      getNodeByIdService(client, {...}, svcLogger), pool) and makeHandler
      returns `return { ok: true, result };` or `return
      mapErrorToEnvelope(err);`. search, the three provenance reads,
      list-accepted-fragments, read-link and read-attribute are not
      registered in this file.
  - node: rules/knowledge-base/accepted-fragment-listing-refuses-unknown-parameter
    held_at: nowhere
    evidence: >-
      The file registers no accepted-fragment listing. The nine registered
      tools are get_node, traverse, the three history tools, list_nodes and
      the three catalog listings.
  - node: rules/knowledge-base/affected-nodes-omit-absent
    held_at: nowhere
    evidence: >-
      No LLM run or affected-node handling appears in the file. It only
      registers read tools.
  - node: rules/knowledge-base/audit-listing-accepts-open-window
    held_at: nowhere
