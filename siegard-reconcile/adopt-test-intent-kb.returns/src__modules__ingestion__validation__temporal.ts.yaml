    where: >-
      header comment lines 4-5 and the throw at lines 107-114
    evidence: >-
      // - semi-open invariant: `valid_from < valid_to` when both are provided
      //   (BR-16 / §13.3 / §5.2).
    cost: >-
      The comment restates a rule that rules/knowledge-base/validity-start-before-end holds and that the code at `input.valid_from >= input.valid_to` enforces in this file. The pair conforms. The prose is a second home that can drift from the node.
    kind: restates
    correction: >-
      Remove the comment through the comment route, then run /reconcile over the file. The behavior stays as it is.
    node: rules/knowledge-base/validity-start-before-end
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      header comment lines 10-13 and the ERRATA_MARKERS docstring lines 61-66
