findings:
  - file: src/modules/ingestion/validation/temporal.ts
    where: >-
      validateTemporal, the document_date branch inside `if (input.requires_valid_from && input.valid_from === null)`, lines 145-158
    evidence: >-
      if (input.document_date !== null) { ... return { valid_from: input.valid_from, valid_from_basis: input.valid_from_basis, }; }
    cost: >-
      The node says a proposal that requires a validity start and states none takes the document date with basis document. Here the layer returns valid_from null and basis null, and the proposal passes with no start and no basis. The next reader goes to the node, sees a document-dated source filling the start, and does not learn that the code leaves it empty. A required start can reach the consolidator as null whenever the source has a document date, but is filled whenever only a reception date exists. The comment at lines 148-153 says this keeps the previous version's behavior, which is a decision recorded only in the code.
    kind: contradicts
    correction: >-
      The branch would have to resolve valid_from to the source's document date and valid_from_basis to "document", as the node states for the second link of the chain. The node is not the one to change.
    node: rules/knowledge-base/required-start-fallback
