    cost: >-
      The comment and the docstring restate the rule and its marker list, and the code holds both in `ERRATA_MARKERS` and `hasErrataSignal` in this file. The pair conforms. The prose is a second home for the marker list.
    kind: restates
    correction: >-
      Remove the comment and the docstring through the comment route, then run /reconcile over the file.
    node: rules/knowledge-base/correction-requires-errata-evidence
  - file: src/modules/ingestion/validation/temporal.ts
