findings:
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      the header comment (lines 1-25) and the docstring above RECEIVED_AT_ANCHOR_DIRECTIVE (lines 42-49)
    evidence: >-
      "v4 teaches the model to use it as the FALLBACK anchor: resolve against `document_date` when present, against `received_at` otherwise."
      and "Carries the `received_at` fallback rule: when `document_date` is absent, the relative-date anchor is `received_at`"
    cost: >-
      The relative-date fallback is stated in prose and also held by the directive the file emits, so the fact has a second home outside behavior. A reader who looks in the comment for what v4 decides finds a copy that nothing keeps in step with the node.
    kind: restates
    correction: >-
      Remove the comment and docstring prose. The directive code (RECEIVED_AT_ANCHOR_DIRECTIVE, system()) holds the fact, and the node holds the decision.
    node: rules/knowledge-base/extraction-relative-date-falls-back-to-reception
  - file: src/modules/ingestion/prompts/extraction.v4.ts
    where: >-
      RECEIVED_AT_ANCHOR_DIRECTIVE, lines 59-62 (the instruction sent to the model in every v4 system prompt)
    evidence: >-
      "`\"amanhã\"`, `\"semana que vem\"`, `\"esta semana\"`, similar pt-BR temporal deictics), resolve it AGAINST `document_date` if it is present (basis `\"document\"`). If `document_date` is `(unknown)`, fall back to the date portion of `received_at` (the `YYYY-MM-DD` prefix of the ISO-8601 string) — use basis `\"received\"`."
    cost: >-
      The prompt tells the model to put the basis received on proposals, while the node says "A proposal MUST NOT state the basis received." The two instructions cannot both hold. The node's decision log records this conflict as known and not settled. Until someone settles it, the code carries the opposite rule from the one the specification states, and a reader who checks the specification would not expect the model to be asked for this.
    kind: contradicts
    correction: >-
      The owner has to settle which side governs. Either the node changes to allow the model to state received, or the directive stops naming basis received. Neither change is mine to make.
    node: rules/knowledge-base/caller-never-states-received
