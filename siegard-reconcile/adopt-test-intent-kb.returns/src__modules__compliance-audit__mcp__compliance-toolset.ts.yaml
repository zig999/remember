findings:
  - file: src/modules/compliance-audit/mcp/compliance-toolset.ts
    where: >-
      the header comment, lines 1-22 (the BR-15 error list and the
      envelope description)
    evidence: >-
      "//   - raw_information_id resolves to no row -> RESOURCE_NOT_FOUND
      //   - UC-01 alt 4c legacy orphan -> SYSTEM_INTERNAL_ERROR
      //   - Any unhandled exception -> SYSTEM_INTERNAL_ERROR"
    cost: >-
      The comment states which error code each compliance_delete refusal
      answers, a fact the compliance-audit contract holds and this
      file's code also holds in its renderErrorEnvelope calls and its
      generic handler. A reader sees two homes for the same refusal
      table, and when the contract moves the comment is not reached by
      any check.
    kind: restates
    correction: >-
      Remove the comment. The fact stays held by the contract node and
      by the code that emits the codes.
    node: contracts/knowledge-base/compliance-audit
  - file: src/modules/compliance-audit/mcp/compliance-toolset.ts
    where: >-
      the docstring above mapZodErrorToEnvelope, lines 57-72
    evidence: >-
      " *   3. `reason` length / trim violation (`too_small` / `too_big` on the
      `reason` path) -> `VALIDATION_OUT_OF_RANGE`.
       *   4. Everything else -> `VALIDATION_INVALID_FORMAT`."
    cost: >-
      The docstring restates the contract's validation refusals for
      compliance-delete (required field, reason length, invalid format),
      which the function body also carries. Prose and code can drift
      apart unnoticed, and the prose is a second home for the table.
    kind: restates
    correction: >-
      Remove the docstring. The mapping stays held by the branches of
      mapZodErrorToEnvelope and by the contract node.
    node: contracts/knowledge-base/compliance-audit
  - file: src/modules/compliance-audit/mcp/compliance-toolset.ts
    where: >-
      the registerTool call, lines 139-143
    evidence: >-
      deps.mcp.registerTool("curation", {
          name: "compliance_delete",
          description:
            "Tombstone a RawInformation under LGPD or owner request. Idempotent.",
    cost: >-
      The tool's name, its placement in the curation toolset and its
      description are what an MCP client sees. The compliance-audit
      contract says only "over MCP" and names no tool, toolset or
      description. The name and placement therefore live only in this
      file, and a reader looking in the specification for how a client
      reaches compliance deletion over MCP finds nothing.
    kind: unstated
    correction: >-
      Give the MCP tool name, its toolset and its description a node, in
      or beside contracts/knowledge-base/compliance-audit.
    node: contracts/knowledge-base/compliance-audit
