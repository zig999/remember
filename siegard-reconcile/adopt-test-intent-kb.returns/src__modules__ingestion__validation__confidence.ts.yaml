      header comment, lines 3-5 (the 0.75 and 0.40 to 0.75 routing table)
    evidence: >-
      //   confidence >= 0.75            -> assertion status = 'active'
      //   0.40 <= confidence < 0.75     -> assertion status = 'uncertain'
    cost: >-
      The same thresholds are written in prose beside the constants that enforce them
      (CONFIDENCE_UNCERTAIN_UPPER = 0.75, CONFIDENCE_FLOOR = 0.4). The comment is a second
      home for a number the node already holds. If the node's thresholds move, the comment
      goes stale without anything flagging it, and a reader may take it for the decision.
    kind: restates
