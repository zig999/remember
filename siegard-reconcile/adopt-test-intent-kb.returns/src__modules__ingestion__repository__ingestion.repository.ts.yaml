  - node: domain/knowledge-base/raw-chunk
    held_at: >-
      The RawChunkRow interface (lines 54-63) declares the chunk's shape. The insertRawChunks and findChunksByRawInformationId statements write and read these columns.
    evidence: >-
      export interface RawChunkRow { readonly chunk_index: number; readonly text: string; readonly offset_start: number; readonly offset_end: number; readonly locator: ChunkLocator; readonly chunking_version: string; ... }.
      The file declares no status or superseded_at attribute, so the shape is held in part.
  - node: domain/knowledge-base/raw-information
    held_at: >-
      The RawInformationRow interface (lines 36-51) declares the shape. insertRawInformation and the two find functions write and read it.
    evidence: >-
      export interface RawInformationRow { readonly source_type: SourceType; readonly content: string; readonly storage_ref: string | null; readonly content_hash: string; readonly received_at: Date; readonly metadata: Record<string, unknown>; readonly original_input: string | null; ... }.
      The file declares no title, document_date, status or superseded_at attribute, so the shape is held in part.
