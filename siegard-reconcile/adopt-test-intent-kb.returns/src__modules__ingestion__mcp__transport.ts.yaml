findings:
  - file: src/modules/ingestion/mcp/transport.ts
    where: >-
      the mountMcpEndpoint call in registerIngestMcpTransport, lines 42-46
    evidence: >-
      path: "/mcp/ingest",
      serverName: "remember-bff-ingest",
      serverVersion: "0.1.0",
    cost: >-
      The address the ingestion toolset is served at, and the name and
      version it announces to MCP clients, are fixed here and in no
      specification node. A search of the specification for "mcp/ingest"
      and "remember-bff-ingest" found nothing. A reader who needs to know
      where a client reaches ingestion over MCP will look in the
      specification and find only the statement that REST and MCP answer
      alike, with no route. The route lives only in this file.
    kind: unstated
    correction: >-
      Give the ingestion MCP endpoint's address to a node, for example a
      published-API contract for the ingest toolset, through the analysis
      route. The code should not be changed.
