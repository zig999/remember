looked_past: >-
  The header comment (lines 1-17) states facts of other nodes in prose: four
  propose_* tools, no ambient run-id header (llm_run_id is a per-call
  argument), the per-call transaction and tool_call audit row, and "tools/list
  always returns all four tools". The nodes in this pack do not hold those
  facts, and no running code in this file carries them; they belong to the
  comment route and to the ingestion nodes outside this pack.
