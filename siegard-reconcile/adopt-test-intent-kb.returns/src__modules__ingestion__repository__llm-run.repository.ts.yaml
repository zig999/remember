findings:
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above findRecentIngestions, lines 59-63
    evidence: >-
      * Most recent ingestions, newest first. Read-only; the caller wraps this in a
      * `BEGIN READ ONLY` transaction. `limit` is validated (1..50) at the toolset
      * boundary before it reaches here.
    cost: >-
      The 1..50 bound is a second home outside behavior. The code that enforces it is
      ListRecentIngestionsMcpInputSchema in src/modules/ingestion/mcp/mcp-schemas.ts
      (`.min(1).max(50)`), and this file's query forwards `limit` unchecked. If the node
      changes the bound, this comment goes stale and misleads the next reader about what
      this function accepts.
    kind: restates
    correction: >-
      Remove the sentence from the docstring. The bound is held by the node and enforced in
      mcp-schemas.ts.
    node: rules/knowledge-base/recent-ingestions-limit-bounds
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above retryLlmRunRow (lines 165-171) and the inline comment before the
      second UPDATE (lines 188-189)
    evidence: >-
      * In the same transaction, orphan `proposed` fragments of this run are
      * flipped to `rejected`.
      // Orphan-fragment cleanup (BR-10): proposed fragments of THIS run that have
      // no provenance row are flipped to `rejected`.
    cost: >-
      The prose restates the retry cleanup rule while the UPDATE ... SET status = 'rejected'
      in this same function holds it. A second statement of the rule sits outside behavior,
      so a reader may take it for the place the rule lives and not look at the node.
    kind: restates
    correction: >-
      Remove the docstring sentence and the inline comment. The rule is held by the node and
      carried out by the UPDATE statement.
    node: rules/knowledge-base/retry-rejects-orphaned-fragments
  - file: src/modules/ingestion/repository/llm-run.repository.ts
    where: >-
      the docstring above aggregateToolCallOutcomes, lines 111-118, and the comment at
      lines 148-149
    evidence: >-
      *   - `orphaned_fragments`, the count of this run's `proposed` fragments with
      *     no provenance row (uncited → unsearchable; recall-gap signal). Defined
      *     identically to the retry orphan-cleanup in `retryLlmRunRow` (BR-10).
    cost: >-
      The prose states the orphan count in the summary and the definition of an orphan. The
      SELECT count(*) query in this function holds both. A second statement outside behavior
      can drift from the node without anything noticing.
    kind: restates
    correction: >-
      Remove the prose. The count is held by the node and by the SELECT in this function.
    node: rules/knowledge-base/summary-counts-orphaned-fragments
