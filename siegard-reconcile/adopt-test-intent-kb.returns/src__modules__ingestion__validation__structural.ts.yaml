findings:
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the comments inside parseAttributeValue, lines 22-25, 37 and 57
    evidence: >-
      "Rejects "tomorrow" for `date`, "abc" for `number`, etc." and "// Strict ISO YYYY-MM-DD; not free-form." and "// Strict: must be a finite numeric literal (no NaN, no Infinity)."
    cost: >-
      The value-parsing rule has a second home in prose. If the node's expression changes, the comments keep saying the old rule beside code that no longer matches. A reader may take them for the decision. The code in this file (the regexes at lines 38 and 58, the `Date.parse` check, the `true`/`false` comparison) already holds the fact.
    kind: restates
    correction: >-
      Remove the comments. The rule is already held by the node and implemented in the function body.
    node: rules/knowledge-base/attribute-value-parses
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the docstring of assertValueInDomain, lines 88-108, and the comment at lines 116-118
    evidence: >-
      "exact-match string equality, no normalisation, no case-folding, no trim (v1 semantics, §1 / BR-30)." and "// `[...domain].sort()` is locale-default lexicographic, which matches the prompt builder's enumeration order"
    cost: >-
      The closed-domain rule (exact match, sorted allowed values) is restated as prose. It also carries a claim that is not the code's behavior: `Array.prototype.sort()` with no comparator orders by UTF-16 code unit, not by locale. A reader who trusts the comment learns a different ordering than the one the code applies. The code (`domain.has(value)` and `[...domain].sort()`) already holds the fact.
    kind: restates
    correction: >-
      Remove the docstring and the comment. The rules are already held by the nodes and implemented in the function body.
    node: rules/knowledge-base/attribute-value-in-allowed-values
  - file: src/modules/ingestion/validation/structural.ts
    where: >-
      the file header comment, lines 1-18, and the docstring of assertKnownType, lines 146-149
    evidence: >-
      "node_type, link_type, attribute_key all live in the seeded catalog." and "* `propose_attribute`: key.node_type_id == node.node_type_id;" and "Assert a catalog membership; raise the kind-specific `BUSINESS_UNKNOWN_*` code on miss"
    cost: >-
      The rule that an attribute key must be held for its node's type, and the refusal codes for unknown types, are restated in a header whose contents no running system emits. This file only raises the error for a `found` flag the caller computes, so the header reads as if the file decided the rule. If the node moves, the header stays and misleads.
    kind: restates
    correction: >-
      Remove the header and docstring prose. The `BUSINESS_UNKNOWN_*` selection in assertKnownType is the code that holds the fact. The cross-table comparison itself is made at the call sites, which this file set does not include.
    node: rules/knowledge-base/attribute-key-for-node-type
