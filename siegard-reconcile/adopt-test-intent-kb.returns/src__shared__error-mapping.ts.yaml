findings:
  - file: src/shared/error-mapping.ts
    where: >-
      line 96, the RESOURCE_ALREADY_EXISTS entry of the codeToHttpStatus registry
    evidence: >-
      RESOURCE_ALREADY_EXISTS: 409,
    cost: >-
      The code and its 409 status live only in this registry. The specification names
      RESOURCE_CONFLICT (409) and AUTH_FORBIDDEN as framework answers, and names no
      RESOURCE_ALREADY_EXISTS anywhere. A reader looking in the specification for what the
      system answers on a duplicate will not find it, and the registry becomes the place
      that decision lives.
    kind: unstated
    correction: >-
      An analysis would have to give the fact a node, or the entry would have to go if no
      sentinel emits the code. I did not check which of the two applies, because that
      lookup is outside the file set.
  - file: src/shared/error-mapping.ts
    where: >-
      line 139, the BUSINESS_CHAT_INGEST_DISABLED entry of the codeToHttpStatus registry
    evidence: >-
      BUSINESS_CHAT_INGEST_DISABLED: 503,
    cost: >-
      The refusal code and its 503 status for disabled directed ingestion through the chat
      exist only in this registry. contracts/chat/conversations holds BUSINESS_CHAT_DISABLED
      (503) and rules/chat/directed-ingestion-disabled-by-default states only that directed
      ingestion is disabled by default. No node holds the code or the status. The next
      reader will look for the refusal in the specification and will not find it.
    kind: unstated
    correction: >-
      The chat contract, contracts/chat/conversations, would have to hold the refusal
      (code, status and message) through an analysis.
    node: contracts/chat/conversations
