  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      scanLines, lines 289-307, which feeds splitEmail (the blank-line test) and splitTurns
    evidence: >-
      "if (codePoints[i] === "\n") {" together with "const isBlank = line.endExclusive === line.start;"
    cost: >-
      The code treats only "\n" as a line terminator and only a zero-length line as blank. A line holding just "\r", as in CRLF email, is therefore not blank. Such an email never closes its header block and so becomes one block. A CRLF speaker line keeps its "\r" in the line. No node says what a line or a blank line is. The next reader will look in the specification for it and not find it.
    kind: unstated
    correction: >-
      An analysis should state what ends a line and what makes a line blank, in the email header-block rule or in a node of its own.
    node: rules/knowledge-base/email-header-block
  - file: src/modules/ingestion/chunker/v1.ts
    where: >-
      SPEAKER_LINE_REGEX, line 351
    evidence: >-
      "const SPEAKER_LINE_REGEX = /^\s*(?:[[(]\d{1,2}:\d{2}(?::\d{2})?[\])][\s\t]+)?[A-Za-zÀ-ÿ0-9_]+(?:\s[A-Za-zÀ-ÿ0-9_]+)?:\s/;" Node: "an optional time stamp written [h:mm], [hh:mm], (hh:mm) or (hh:mm:ss) followed by whitespace, starts with one or two words of letters, digits or underscores"
    cost: >-
      The regex takes any opening bracket with any closing bracket and optional seconds. It therefore accepts [hh:mm:ss], (h:mm) and mismatched forms such as [12:00) as time stamps, none of which the node lists. Its letter class is Latin-1 only (À-ÿ, which includes × and ÷) and excludes other letters. A line the node does not call a speaker line therefore opens a new block and splits a chat or transcript chunk where the specification says none is cut.
    kind: contradicts
    correction: >-
      Change the pattern to the four listed time-stamp forms and to the node's letter set. If the broader forms are what the business wants, change the node first.
    node: rules/knowledge-base/speaker-line
