looked_past: >-
  The pack holds none of this file's dispute-resolution facts; they sit in nodes outside it, such as rules/knowledge-base/dispute-resolution-check-order, prefer-one-outcome, adjust-periods-outcome, keep-disputed-changes-nothing, adjusted-periods-single-open and dispute-resolution-single-scope, and the file's branches agree with them. Two things went unreported. The `?? true` fallback when the catalog lacks a link type or attribute key row is a defensive default, not a visible domain rule. Membership of winner_id and of each period's item_id in item_ids is not checked here, and I did not see where it is checked.
