findings:
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      resolveDisputeService, prefer_one branch, the BusinessError thrown when winner_id is absent (lines 118-123)
    evidence: >-
      throw new BusinessError(
          "BUSINESS_DISPUTE_WINNER_REQUIRED",
          "decision=prefer_one requires winner_id"
        );
    cost: >-
      The contract curation answers this refusal with the message "decision=prefer_one requires winner_id (member of item_ids)". This file emits the message without "(member of item_ids)". A client or test that reads the message gets different words depending on whether the request was refused here or at the body check. Nothing in this file checks that winner_id is a member of item_ids.
    kind: contradicts
    correction: >-
      Make the emitted message match the contract's text. The contract is bound to no file in this pack, so this file's refusal text has no node that tracks it.
    node: contracts/knowledge-base/curation
  - file: src/modules/curation/service/dispute.service.ts
    where: >-
      resolveDisputeService, adjust_periods branch, the BusinessError thrown when periods are absent or empty (lines 201-206)
    evidence: >-
      throw new BusinessError(
          "BUSINESS_DISPUTE_PERIODS_REQUIRED",
          "decision=adjust_periods requires periods[]"
        );
    cost: >-
      The contract curation answers this refusal with the message "decision=adjust_periods requires periods[] (one entry per item_id)". This file emits the message without "(one entry per item_id)". The same refusal therefore reads differently depending on where it is raised. This file only tests for an empty list, so the one-entry-per-item expectation is not visible here.
    kind: contradicts
    correction: >-
      Make the emitted message match the contract's text.
    node: contracts/knowledge-base/curation
