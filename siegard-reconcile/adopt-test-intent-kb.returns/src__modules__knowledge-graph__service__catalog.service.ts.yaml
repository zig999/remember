findings:
  - file: src/modules/knowledge-graph/service/catalog.service.ts
    where: >-
      the comment block above the valid-values query in listAttributeKeysService, lines 110-112
    evidence: >-
      // BR-30 — attach closed-domain values so REST/MCP clients see the allowed
      // set up-front (parity with the chat ontology block). Group per key id;
      // keys with no rows stay OPEN (no `valid_values`).
    cost: >-
      The comment restates the retrieval contract's rule that `valid_values` appears only for a key
      the catalog closes. The code holds that rule in the same function, in
      `values !== undefined && values.length > 0 ? { ...base, valid_values: [...values].sort() } : base`.
      The sentence is a second place describing the rule. If the rule changes, the comment will go
      on describing the old one, and a reader may take it for the decision.
    kind: restates
    correction: >-
      Remove the comment through the comment route. The fact is already held by the node and the
      code implements it.
    node: contracts/knowledge-base/retrieval
