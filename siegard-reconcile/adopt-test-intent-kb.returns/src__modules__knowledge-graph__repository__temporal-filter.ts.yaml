  - file: src/modules/knowledge-graph/repository/temporal-filter.ts
    where: >-
      the header comment, lines 19-22 (mode 2, "valid-time travel")
    evidence: |-
      //   2. asOf provided             -> "valid-time travel" (query (b), BR-08):
      //        AND <alias>.superseded_at IS NULL
      //        AND (<alias>.valid_from IS NULL OR <alias>.valid_from <= $asOf)
      //        AND (<alias>.valid_to   IS NULL OR <alias>.valid_to   >  $asOf)
    cost: >-
      The as-of window rule (validity start on or before the date, validity end after it) is restated in prose
      while the same predicate is in the `sql` array below it. A change to the node leaves two statements of
      the window that can disagree.
    kind: restates
    correction: >-
      Remove the comment. The code holds the fact in this file, in the `sql` array of the `opts.asOf !== undefined` branch.
    node: rules/knowledge-base/graph-read-as-of-view
  - file: src/modules/knowledge-graph/repository/temporal-filter.ts
    where: >-
      the header comment, lines 16-17 and 24-25 (the in-effect clause and the `inEffectOnly` note)
    evidence: |-
      //        [AND (<alias>.valid_from IS NULL OR <alias>.valid_from <= current_date)]
      //          (the bracketed clause is added when `inEffectOnly = true`)
      // Note: the `inEffectOnly` flag is meaningful only in mode 1 — when
    cost: >-
      The in-effect-only rule (no as-of date, validity start no later than today) is stated in prose as well as
      in the `inEffectOnly` branch. The comment would keep saying the old rule after the node changed.
    kind: restates
    correction: >-
      Remove the comment. The code holds the fact in this file, in `if (opts.inEffectOnly) { lines.push(...valid_from <= current_date...) }`.
    node: rules/knowledge-base/graph-read-in-effect-only
