findings:
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      lines 24-44, the file's header comment (TC-13 specifics)
    evidence: >-
      "Perform a run-state pre-check inside the open transaction that
      distinguishes 404 (`RESOURCE_NOT_FOUND`, llm_run row absent) from 409
      (`BUSINESS_RUN_NOT_RUNNING`, row present but `status != 'running'`)." and
      "Return HTTP 200 for any reachable handler. The `ok: true/false` flag on
      the body is the outcome indicator — a layered-validation rejection
      (ValidationFailure) is a *business result*, not a transport error"
    cost: >-
      The header says the contract's refusal answers (404 for an unknown run, 409
      BUSINESS_RUN_NOT_RUNNING for a run that is not running, HTTP 200 carrying
      `{ ok: false, error }` for a layered-validation rejection) a second time as
      prose. The code in this file already holds them, in handleProposeMirror and
      its error mapping. When the contract changes, the comment is not reached and
      says what was once decided.
    kind: restates
    correction: >-
      Remove the comment. The behavior is held by handleProposeMirror in this
      file and by the services in service/propose-*.service.ts, so the comment
      route applies.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      lines 484-497, the docstring of handleProposeMirror
    evidence: >-
      "loads the `llm_run` row first to distinguish 404 (unknown id) vs 409
      (status != 'running')" and "`RunNotRunningError`    -> HTTP 409 with
      `BUSINESS_RUN_NOT_RUNNING` envelope." and "`ValidationFailure`     -> HTTP 200
      with `{ ok: false, error: ... }` envelope (BR-28 envelope semantics)"
    cost: >-
      The docstring restates the proposal-requires-running-run refusal and the
      HTTP 200 `{ ok: false, error }` envelope. The same function holds both in
      code (`if (run.status !== "running") { throw new RunNotRunningError(...) }`
      and `reply.status(409)`), so the prose is a second home outside behavior.
    kind: restates
    correction: >-
      Remove the docstring and the inline comments that restate the same mapping.
      The code in handleProposeMirror holds the fact.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/routes/ingestion.routes.ts
    where: >-
      lines 125-126, POST_INGEST_BODY_LIMIT, used as the bodyLimit of POST /raw-information at line 144
    evidence: >-
      const POST_INGEST_BODY_LIMIT = 11 * 1024 * 1024;
      app.post("/raw-information", { bodyLimit: POST_INGEST_BODY_LIMIT }, ...
    cost: >-
      A request-size ceiling of 11 MiB is applied to ingest-raw-information, and
      no node holds it. The comment cites "ingestion.back.md §1", which is not a
      node. The nodes rules/knowledge-base/content-length and
      rules/knowledge-base/original-input-length each cap one field at
      10,485,760 UTF-16 code units. A request with both fields near their caps, or
      with multi-byte content, would be refused by this ceiling, with a status the
      contract does not list. Anyone reading the contract for what the endpoint
      accepts would not find this cap.
    kind: unstated
    correction: >-
      The analysis should decide whether ingest-raw-information has a request-size
      refusal and give it a home. contracts/knowledge-base/ingestion is the node
      that lists the operation's refusals.
    node: contracts/knowledge-base/ingestion
