findings:
  - file: src/modules/query-retrieval/service/errors.ts
    where: >-
      InvalidSearchLayerError, the `allowed` field (line 28)
    evidence: >-
      public readonly allowed = ["fragment", "node", "chunk"] as const;
    cost: >-
      The three search layers are declared a second time here. The same list is already declared as
      `export const ALLOWED_LAYERS = ["fragment", "node", "chunk"] as const;` in
      backend/src/modules/query-retrieval/dto/search.dto.ts line 101. The node
      domain/knowledge-base/search-layer holds the enumeration, but this file is not bound to it.
      If the layers change, the node and the DTO will be updated and this copy can stay behind.
      Then the refusal would name layers that no longer match the set the search accepts, and
      nobody could say which list was decided.
    kind: contradicts
    correction: >-
      The refusal should take its allowed layers from the one declaration of the enumeration
      instead of declaring them again here. The adopt-scope bind for domain/knowledge-base/search-layer
      should name the file that declares the enumeration.
    node: domain/knowledge-base/search-layer
