findings:
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      the file-header comment, lines 10-14 ("Why the lock comes first (BR-20)")
    evidence: >-
      // Why the lock comes first (BR-20): two concurrent `propose_node` calls for
      // the same `(node_type, norm(name))` must NOT race on the resolve-or-create
      // branch. Acquiring the advisory lock before the first SELECT serialises both
      // the candidate scan AND the subsequent INSERT inside the same transaction;
    cost: >-
      The serialisation of concurrent proposals of one name under one node type is stated a second time in prose. The lock call in resolveOrCreateNode (pg_advisory_xact_lock, lines 125-128) already holds it. When the node moves, this comment stays behind and reads as a current statement of the rule.
    kind: restates
    correction: >-
      Remove the comment. The behavior is correct and the node already holds the fact, so this is the comment-only route followed by a reconcile over the file.
    node: rules/knowledge-base/concurrent-proposals-resolve-in-turn
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      the docstring of MATCH_STRONG, lines 26-32
    evidence: >-
      /**
       * Trigram-similarity ceiling above which a SINGLE candidate is taken as a
       * strong match (reuse the existing node). BR-25 / A12.
    cost: >-
      The strong-match rule is restated in prose beside the constant `MATCH_STRONG = 0.85` that holds it. A reader can take the docstring as a second authority for the threshold.
    kind: restates
    correction: >-
      Remove the docstring. The constant and decideFromCandidates carry the rule, and the node holds the fact.
    node: rules/knowledge-base/strong-candidate-resolves
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      the docstring of MATCH_FLOOR, lines 34-41
    evidence: >-
      * Trigram-similarity floor below which a candidate is ignored entirely.
       * Candidates with `sim < MATCH_FLOOR` do not feed the decision and do not
       * produce `entity_match_review` rows. BR-25 / A12.
    cost: >-
      The floor rule (0.55, and no review rows below it) is restated in prose. `MATCH_FLOOR = 0.55`, the `aboveFloor` filter and the review-row loop already hold it.
    kind: restates
    correction: >-
      Remove the docstring. The code holds the floor and the node holds the fact.
    node: rules/knowledge-base/ambiguous-candidates-need-review
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      the constant TRIGRAM_CANDIDATE_LIMIT (lines 43-47) and its use in the candidate query (`LIMIT ${TRIGRAM_CANDIDATE_LIMIT}`, line 165)
    evidence: >-
      const TRIGRAM_CANDIDATE_LIMIT = 10;
      ...
      ORDER BY MAX(similarity(na.alias_norm, norm($1::text))) DESC
      LIMIT ${TRIGRAM_CANDIDATE_LIMIT}
    cost: >-
      The code caps the candidates a proposal is compared against at 10, and no node states the cap. The ambiguous-candidates rule says a review is recorded for "each such node" at similarity 0.55 or more. The cap leaves the 11th and later candidates out of the strong-unique check and out of the review rows. The decision lives only here, where the next reader will not look for it. I searched the whole projection for the figure and found no node holding it.
    kind: unstated
    correction: >-
      The analysis would have to decide whether the candidate set is capped and give that fact a node, or drop the cap.
    node: rules/knowledge-base/ambiguous-candidates-need-review
  - file: src/modules/ingestion/service/entity-resolution.service.ts
    where: >-
      the docstring of decideFromCandidates, lines 249-262
    evidence: >-
      *   - Strong unique: exactly ONE candidate with `sim >= MATCH_STRONG` AND no
      *     other candidate has `sim >= MATCH_FLOOR`.
      *   - Ambiguous: any candidate has `sim ∈ [MATCH_FLOOR, MATCH_STRONG)` OR two
      *     or more candidates have `sim >= MATCH_STRONG`.
      *   - Novel: every candidate has `sim < MATCH_FLOOR` (empty set included).
    cost: >-
      The three-way resolution rules are restated in prose above the branches (`strong.length === 1 && aboveFloor.length === 1`, the `novel` return, the `ambiguous` return) that hold them. Prose and code can drift apart, and the prose then reads as a decision.
    kind: restates
    correction: >-
      Remove the docstring. The code holds the decision and the nodes hold the facts.
    node: rules/knowledge-base/strong-candidate-resolves
