looked_past: >-
  The pack names none of the merge rules this file applies (the guards, the status flip, the path compression, the alias copy and the repointing); the nodes that hold them (merge-check-order, merge-survivor-active, merge-requires-same-node-type, node-never-merged-into-itself, curation-refuses-deleted-node, merge-marks-absorbed-merged, merge-compresses-paths, merge-copies-aliases, merge-repoints-assertions) are outside this pack and I read their statements and found no disagreement with the code, but I did not judge the repository SQL behind them, the details payload of the thrown errors (for example the self-merge refusal carries no `details` here) or the wording of the error messages, which belong to other judgments.
