findings:
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      the JSDoc above IngestRawInformationRequestSchema, the `content` bullet (lines 16-18), against the `content` field (lines 27-30)
    evidence: >-
      " * - `content`: minLength 1 (empty document is meaningless), maxLength 10 MiB
       *    in code points — the Fastify `bodyLimit` of 11 MiB on the route is a
       *    coarser pre-filter; this Zod check is the precise contract from A5."
    cost: >-
      The limit is held by the code (`.min(1, ...)` and `.max(10 * 1024 * 1024, ...)`), and rules/knowledge-base/content-length holds it too. The comment is a second home for it and gives the wrong unit. The node counts UTF-16 code units, and the comment says code points. A reader who trusts the comment will misread what a 10 MiB document is. It also sends them to "A5" instead of to the node.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by rules/knowledge-base/content-length and by the `.min`/`.max` calls in this file.
    node: rules/knowledge-base/content-length
  - file: src/modules/ingestion/dto/ingest-raw-information.dto.ts
    where: >-
      the JSDoc above `original_input` (lines 35-39), against the `original_input` field (lines 40-44)
    evidence: >-
      "Never factored into `content_hash`. Capped at 10 MiB to match `content`."
    cost: >-
      The cap is held by the code (`.max(10 * 1024 * 1024, "original_input must not exceed 10 MiB")`), and rules/knowledge-base/original-input-length holds it too. The comment repeats it and ties it to `content` by analogy. If the node moves, the comment keeps stating the old cap and nothing flags it.
    kind: restates
    correction: >-
      Remove the comment. The cap is held by rules/knowledge-base/original-input-length and by the `.max` call in this file.
    node: rules/knowledge-base/original-input-length

