      The contract's refusal for list-node-types, read-link, read-attribute, read-link-history,
      read-attribute-history and read-attribute-key-history reads: "A parameter is malformed or
      unknown: ... or a parameter the operation does not define." -> "HTTP 422, error code
      VALIDATION_INVALID_FORMAT". The routes that do parse a query (`ListLinkTypesQuerySchema.parse(request.query ?? {})`
      and the others) use `.strict()` schemas from `dto/queries.dto.ts`.
    cost: >-
      Over REST, a request to these six operations that carries an undefined query parameter is
      answered as accepted, where the node says HTTP 422 VALIDATION_INVALID_FORMAT. A caller who
      misspells a parameter gets no refusal and a result that ignores it. The MCP counterpart
      (`ListNodeTypesInputSchema = z.object({}).strict()`) does refuse, so the two transports of one
      operation disagree.
    kind: contradicts
    correction: >-
      Parse the query of these six operations with an empty strict schema, as the routes that already
      take a strict query schema do, so an unknown parameter is refused as the contract states.
    node: contracts/knowledge-base/retrieval
