findings:
  - file: src/modules/knowledge-graph/service/norm.ts
    where: >-
      The header comment block, lines 1-14, and the docblocks on collapseSpaces, stripDiacritics and norm, lines 16, 21 and 26.
    evidence: >-
      // norm(x) = lower(unaccent(collapseSpaces(trim(x))))
      // This is the SINGLE normalization policy of the system (CLAUDE.md
      // "Conventions").
    cost: >-
      The comment states the name-normalization policy in prose a second time. The executable form is the norm() function in this file, which trims, strips diacritics, collapses whitespace and lower-cases. A reader who changes the rule in the node, or changes this function, will also find a separate prose statement of the policy that nothing keeps in step with either. The comment also points the reader to CLAUDE.md as the authority, when the node rules/knowledge-base/name-normalization is.
    kind: restates
    correction: >-
      Remove the header comment and the docblocks. The code in this file holds the fact, and the node already states it. The header comment's reference to the database function `norm()` and to the `immutable_unaccent` wrapper describes the database side. It is not this file's fact, so it goes with the prose.
    node: rules/knowledge-base/name-normalization
