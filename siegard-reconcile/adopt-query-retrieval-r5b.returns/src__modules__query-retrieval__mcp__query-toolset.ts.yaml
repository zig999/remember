    evidence: >-
      "`in_effect_only`, `include_uncertain`, `expand`, `expand_depth` (1..3), "
    cost: >-
      The 1..3 bound is spelled in prose served over `tools/list`, and no code in this file enforces it. The enforcing code is `.min(1).max(3)` in `dto/search.dto.ts`. If the node or the DTO moves, this description keeps saying 1..3, and `--check` never reaches it because it is text and not code.
    kind: restates
