read:
  - node: rules/knowledge-base/alias-admitted-only-from-source
    held_at: >-
      ALIAS_ADMISSION_SQL, the admitted column, as run by admitAliases(); the exception for a directed ingestion is the `r.directed` term in that same column.
    evidence: >-
      COALESCE(r.directed OR (norm(a.alias) <> '' AND strpos(r.content_norm, norm(a.alias)) > 0), false) AS admitted ... SELECT (lr.model = $2 AND lr.prompt_version = $3) AS directed, norm(ri.content) AS content_norm FROM llm_run lr JOIN raw_information ri ON ri.id = lr.input_raw_information_id WHERE lr.id = $4
  - node: rules/knowledge-base/ambiguous-candidates-need-review
    held_at: >-
      decideFromCandidates() returns the "ambiguous" kind. createNewNode() inserts the node as needs_review and calls insertMatchReviews(). findTrigramCandidates() applies the ten-node limit.
    evidence: >-
      const TRIGRAM_CANDIDATE_LIMIT = 10; ... return { kind: "ambiguous", candidates: aboveFloor }; ... needsReview ? "needs_review" : "active" ... INSERT INTO entity_match_review (node_id, candidate_node_id, similarity)
  - node: rules/knowledge-base/candidate-similarity
    held_at: >-
      The SELECT in findTrigramCandidates(). It takes the maximum over a node's aliases of the trigram similarity to the normalized proposal name.
    evidence: >-
      SELECT na.node_id, MAX(similarity(na.alias_norm, norm($1::text)))::text AS sim ... GROUP BY na.node_id
  - node: rules/knowledge-base/concurrent-proposals-resolve-in-turn
    held_at: >-
      acquireNameLock(), called first in resolveOrCreateNode(). It takes a transaction-scoped advisory lock keyed by node type and normalized name.
    evidence: >-
      SELECT (CAST($1::text AS text) || E'\\x1F' || norm($2::text)) AS key ... SELECT pg_advisory_xact_lock(hashtextextended($1::text, 0))
  - node: rules/knowledge-base/exact-alias-resolves
    held_at: >-
      findExactMatch(), then the matchExisting() branch of resolveWithAdmittedAliases().
    evidence: >-
      WHERE na.alias_norm = norm($1::text) AND kn.node_type_id = $2 AND kn.status = 'active' ... return { node_id: nodeId, resolution: "matched_existing" };
  - node: rules/knowledge-base/matched-node-gains-only-aliases
    held_at: >-
      matchExisting() attaches only admittedOtherThanName. admitAliases() builds that list by dropping any alias whose normalized form equals the proposed name.
    evidence: >-
      aliases: admission.admittedOtherThanName, ... admittedOtherThanName: admitted.filter((r) => !r.is_name).map((r) => r.alias), ... norm(a.alias) = norm($5::text) AS is_name
  - node: rules/knowledge-base/name-normalization
    held_at: >-
      Every name comparison in the file goes through the database function norm(): the name lock, the admission SQL, findExactMatch() and findTrigramCandidates().
    evidence: >-
      WHERE na.alias_norm = norm($1::text) ... na.alias_norm % norm($1::text) ... strpos(r.content_norm, norm(a.alias)) > 0
  - node: rules/knowledge-base/new-node-aliases
    held_at: >-
      attachCanonicalAndAliases(), called from createNewNode(). It inserts the proposed name with kind 'canonical', then each admitted alias with kind 'alias'.
    evidence: >-
      VALUES ($1, $2, 'canonical', $3) ... aliases: plan.aliases ... VALUES ($1, $2, 'alias', $3) ... aliases: admission.admitted,
  - node: rules/knowledge-base/no-candidate-creates-active-node
    held_at: >-
      The "novel" branch of decideFromCandidates(). createNewNode() then inserts the node as active and returns created_new.
    evidence: >-
      export const MATCH_FLOOR = 0.55; ... if (aboveFloor.length === 0) { return { kind: "novel" }; } ... needsReview ? "needs_review" : "created_new"
  - node: rules/knowledge-base/strong-candidate-resolves
    held_at: >-
      decideFromCandidates() returns "strong_unique", and resolveWithAdmittedAliases() calls matchExisting() for it.
    evidence: >-
      export const MATCH_STRONG = 0.85; ... if (strong.length === 1 && aboveFloor.length === 1) { return { kind: "strong_unique", nodeId: strong[0]!.node_id }; }
  - node: scenarios/knowledge-base/acronym-in-source-is-admitted
    held_at: >-
      createNewNode() with plan.aliases set to admission.admitted. Admission is the strpos test in ALIAS_ADMISSION_SQL, and the canonical alias plus the admitted alias are inserted by attachCanonicalAndAliases().
    evidence: >-
      strpos(r.content_norm, norm(a.alias)) > 0 ... aliases: admission.admitted, ... VALUES ($1, $2, 'canonical', $3)
  - node: scenarios/knowledge-base/admitted-acronym-resolves-later-proposal
    held_at: >-
      findExactMatch() reads node_alias.alias_norm. An admitted alias is stored as an ordinary alias row, so a later proposal naming it matches exactly.
    evidence: >-
      WHERE na.alias_norm = norm($1::text) AND kn.node_type_id = $2 AND kn.status = 'active'
  - node: scenarios/knowledge-base/alias-absent-from-source-not-admitted
    held_at: >-
      admitAliases() lists the aliases that failed admission with reason ALIAS_NOT_IN_SOURCE. They are passed to neither createNewNode() nor matchExisting().
    evidence: >-
      notAdmitted: res.rows.filter((r) => !r.admitted).map((r) => ({ alias: r.alias, reason: ALIAS_NOT_IN_SOURCE })),
  - node: scenarios/knowledge-base/directed-alias-admitted-without-source
    held_at: >-
      The `r.directed` term of the admitted column in ALIAS_ADMISSION_SQL, fed by DIRECTED_MODEL and DIRECTED_PROMPT_VERSION in admitAliases().
    evidence: >-
