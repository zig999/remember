looked_past: >-
  The test's wording heuristics are a test-design matter and no domain fact: the regex shapes and ordering constraints, the v1-to-v4 scan that forbids any "alias", "pronoun" or "spelling" word, and its parsing of the "Known versions:" wording of the refusal message in the prompt module.
