findings:
  - file: src/__tests__/unit/ingestion/preliminary-reading.spec.ts
    where: >-
      lines 501-519, the test "presents the content to the model in the user turn, bracketed and labelled as data, and not among the instructions", the closedAfter entry
    evidence: >-
      closedAfter: text.slice(at + DEFAULT_CONTENT.length).trim().length > 0,
      and, expected, closedAfter: true,
    cost: >-
      The test requires non-empty text after the content, a closing marker as well as an opening one. The node only says the content is presented "marked apart from its instructions as data". A prompt that marks the data only at its start conforms to the node and fails this test. The bracketing rule then lives in the test, and a reader checking the specification will not find it.
    kind: unstated
    correction: >-
      The node would have to state that the content is closed by a marker after it as well as marked before it, or the assertion would have to drop to what the node holds, which is the content marked as data and kept out of the instructions.
    node: constraints/document-content-is-data

