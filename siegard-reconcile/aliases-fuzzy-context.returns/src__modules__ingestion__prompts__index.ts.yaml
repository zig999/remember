  - node: domain/knowledge-base/prompt-version
    held_at: >-
      the REGISTRY constant, lines 55-61. It keys one module per version, and the version values come from each extraction.vN.ts file's PROMPT_VERSION.
    evidence: |-
      const REGISTRY: Readonly<Record<string, PromptModule>> = {
        [v1.PROMPT_VERSION]: V1,
        [v2.PROMPT_VERSION]: V2,
        [v3.PROMPT_VERSION]: V3,
        [v4.PROMPT_VERSION]: V4,
        [v5.PROMPT_VERSION]: V5,
      };
  - node: rules/knowledge-base/default-prompt-version
    held_at: >-
      the DEFAULT_PROMPT_VERSION declaration, line 53.
    evidence: |-
      export const DEFAULT_PROMPT_VERSION: string = v5.PROMPT_VERSION;
  - node: rules/knowledge-base/prompt-version-known
    held_at: >-
      selectPromptModule and UnknownPromptVersionError, lines 63-79. A version absent from the registry throws.
    evidence: |-
      const module = REGISTRY[promptVersion];
        if (module === undefined) {
          throw new UnknownPromptVersionError(promptVersion);
        }
