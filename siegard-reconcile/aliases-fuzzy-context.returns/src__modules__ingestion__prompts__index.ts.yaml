  The message of UnknownPromptVersionError cites "(BR-26)", a rule identifier that no node under the specification root holds. It is emitted text pointing at a legacy rule number, not a fact stated about a value. The node's own answer for an unknown version is SYSTEM_INTERNAL_ERROR with no message fixed.
