certified:
  - node: rules/knowledge-base/link-and-fragment-items-carry-no-match
    state: partial
    tests:
      - file: src/__tests__/unit/query-retrieval/search-service-expansion.spec.ts
        name: answers every knowledge link reached by expansion, from an exactly or an approximately matched node, and every information fragment with no match and no similarity
    why: >-
      The link half is exercised. Links that expansion reaches from an exactly matched node
      (link-x1) and from an approximately matched node (link-1) are asserted to carry no match
      and no similarity, and the test would fail if either carried a non-null one. The fragment
      half is exercised only for the one fragment item in the world, fragment-1. The stand-in
      answers it from the accepted information_fragment query. No assertion pins that item's
      layer, and nothing in the world is set up so that the chunk layer surfaces a fragment.
      The node names fragments the chunk layer surfaces explicitly, and for those the absence
      of a match and a similarity goes unexercised. The other tests in the file assert scores,
      hops, flags, item shape and provenance. None of them reads match or similarity, so none
      bears on this fact.
    remainder: testable
    remainder_why: >-
      Input: a search whose term surfaces an information fragment through the chunk layer, with
      that item's layer asserted as chunk. Expected result: that fragment item carries no match
      and no similarity.
