findings:
  - file: src/modules/ingestion/service/llm-run.service.ts
    where: >-
      retryLlmRun(), the branch taken when retryLlmRunRow returns null (lines 154-161)
    evidence: |-
      const refreshed = await findLlmRunById(client, llmRunId);
          const currentStatus = refreshed?.status ?? "running";
          if (currentStatus === "failed") {
            throw new RunNotRetryableError(llmRunId, "running");
          }
    cost: >-
      When the run is read again and is still failed, the refusal BUSINESS_RUN_NOT_RETRYABLE says the run
      is in status 'running'. A caller reading the refusal is told a status the run does not have. The
      rewrite from 'failed' to 'running' exists only in this branch, so the next reader looks for the
      status the refusal names in the specification and finds a different one.
    kind: contradicts
    correction: >-
      The refusal would have to name the status the run actually holds, as the contract states ("naming the
      run's status"), or the node would have to state why a failed run that cannot be retried is reported as
      running.
    node: contracts/knowledge-base/ingestion

