findings:
  - file: src/app.ts
    where: >-
      line 55, BODY_LIMIT_BYTES, passed as `bodyLimit` to Fastify at line 59
    evidence: >-
      const BODY_LIMIT_BYTES = 11 * 1024 * 1024;
      ... bodyLimit: BODY_LIMIT_BYTES,
    cost: >-
      The 11 MiB ceiling is enforced here for every route, and the same figure is set again in
      src/modules/ingestion/routes/ingestion.routes.ts (`const POST_INGEST_BODY_LIMIT = 11 * 1024 * 1024;`).
      The node is bound to the routes file and not to this one, so if the node's figure moves,
      `--check` never reaches the declaration that applies it to the whole server. The two
      figures can then disagree and nobody knows which one was decided.
    kind: contradicts
    correction: >-
      The bind that claims the node has to claim this file as well as the routes file. The code
      cannot read the specification to close this itself.
    node: constraints/request-body-ceiling
  - file: src/app.ts
    where: >-
      lines 64-67, the fallback list of allowed origins used when CORS_ORIGINS is unset
    evidence: >-
      const corsOrigins = env.CORS_ORIGINS ?? [
          "http://localhost:5173",
          "http://127.0.0.1:5173",
        ];
    cost: >-
      Which origins are allowed when nothing is configured is a decision made only in this
      array. The constraint says that an allowed origin is echoed and any other gets none, but
      no node says which origins are allowed by default. A reader looking in the specification
      for who may call the system cross-origin finds nothing, and the two values live only here.
    kind: unstated
    correction: >-
      Analysis would have to give the default allowed origins a home in the constraint, or in a
      new node it names, so the list is stated once.
    node: constraints/answers-carry-allowed-origin
  - file: src/app.ts
    where: >-
      line 70, the `methods` option of the CORS registration
    evidence: >-
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
    cost: >-
      The set of methods a preflight answer permits is a rule the code applies and no node
      states. A method added to or dropped from this list changes what a cross-origin client
      may do, and the specification would not show that change.
    kind: unstated
    correction: >-
      Analysis would have to state the permitted cross-origin methods in a node, such as the
      preflight constraint, before the code can be said to hold them.
    node: constraints/preflight-needs-no-authentication
  - file: src/app.ts
    where: >-
      lines 82-85, the `/_self` route registered in the authenticated scope under /api/v1
    evidence: >-
      scoped.get("/_self", async (request) => ({
            ok: true,
            result: { user_id: request.user?.id ?? null },
          }));
    cost: >-
      This is a published operation that answers the caller's identity as `user_id`, or null,
      and it appears in no contract. The access contract names only authenticate-owner,
      route-request and read-health. A client may rely on the shape, and the next reader looks
      for it in the specification and does not find it.
    kind: unstated
    correction: >-
      Analysis would have to give the operation a place in the access contract, or retire it.
    node: contracts/knowledge-base/access

