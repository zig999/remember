findings:
  - file: src/modules/ingestion/prompts/preliminary-reading.ts
    where: >-
      line 5, the exported constant MAX_TOKENS
    evidence: >-
      export const MAX_TOKENS = 4000 as const;
    cost: >-
      The preliminary reading's output ceiling is a value that decides when the model's answer is cut,
      and the only place it is stated is this constant. The nearest node, extraction-turn-token-ceiling,
      says an extraction asks for at most 8000 tokens on each turn. Its decision log says it covers
      every model call of the four extraction prompt versions. So a reader who looks in the
      specification for the preliminary reading's ceiling finds 8000 and not 4000. The code has become
      the home of that decision.
    kind: unstated
    correction: >-
      The analysis would have to give the preliminary reading's output ceiling a node. Either
      rules/knowledge-base/extraction-turn-token-ceiling is widened to say whether it covers the
      preliminary reading, or a sibling rule states 4000 for the reading.
    node: rules/knowledge-base/extraction-turn-token-ceiling
  - file: src/modules/ingestion/prompts/preliminary-reading.ts
    where: >-
      line 30, the "summary" instruction in the Output section of INSTRUCTIONS
    evidence: >-
      "- summary: what the document is about, in the language of the document, in",
    cost: >-
      This fixes the language of the document context's summary, which the owner sees in the run's
      document context and which the model reads while extracting. No node holds it.
      domain/knowledge-base/document-context says only "a short summary", and
      document-context-summary-lines holds only the 5-line cap. A reader looking for what language the
      summary is written in finds nothing in the specification.
    kind: unstated
    correction: >-
      The analysis would have to state the summary's language in domain/knowledge-base/document-context,
      or in a rule constraining it.
    node: domain/knowledge-base/document-context
  - file: src/modules/ingestion/prompts/preliminary-reading.ts
    where: >-
      lines 32-36, the "entities" instruction in the Output section of INSTRUCTIONS
    evidence: >-
      "- entities: each entity the document speaks of, listed once, with EVERY name" ... "document denote the same entity. `node_type` is ONLY a NodeType name of the catalog below. A pronoun alone or a role alone is not a name."
    cost: >-
      This states two rules about what the document context lists: an entity appears once, and a
      pronoun or a role alone is never one of its names. domain/knowledge-base/document-entity holds
      only "the names the document uses for it". The pronoun and role exclusion is held for the
      extraction proper by rules/knowledge-base/extraction-asks-for-other-names, but not for the
      preliminary reading. The scenario scenarios/knowledge-base/context-links-later-mention has a
      context listing João Silva as a person the document also calls "o Diretor", a role, which this
      instruction tells the model not to list. Which of the two the business decided is not
      recoverable from the specification.
    kind: unstated
    correction: >-
      The analysis would have to state, in domain/knowledge-base/document-entity or a rule
      constraining it, whether an entity is listed once and whether a pronoun or a role alone may be
      one of its names. That would also settle the tension with the context-links-later-mention scenario.
    node: domain/knowledge-base/document-entity
