findings:
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      StartAsyncIngestionMcpInputSchema, lines 48-79, and its content description at line 53-55
    evidence: >-
      export const StartAsyncIngestionMcpInputSchema = z.object({ ... .describe("The full plain text of the document to ingest. Paste the raw content; the server chunks it, runs structured extraction in the BACKGROUND, and persists the knowledge graph with provenance. No base64/binary.")
    cost: >-
      The file declares the input shape, and the text a tool listing would show, for a tool that starts an ingestion and runs extraction in the background. The candidate constraint says the ingest toolset offers no such tool, and no operation of the ingestion contract names one. A reader looking in the specification would find the opposite of what this schema describes. Whether the toolset registers the schema is outside this file set and was not checked.
    kind: contradicts
    correction: >-
      Whoever owns the file should decide, through the specification, whether the schema has a place. If the constraint stands, the declaration and its description are not held by any node.
    node: constraints/ingest-toolset-offers-no-async-ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDocumentMcpInputSchema, the model and prompt_version fields, lines 101-114
    evidence: >-
      model: z.string().min(1).optional() ... prompt_version: z.string().min(1).optional()
    cost: >-
      An empty model or an empty prompt version is refused at the schema as a validation failure. The ingestion contract lists only content length and source type as validation refusals for ingest-document, and says nothing about a model or prompt version stated empty. The refusal lives only here, so the next reader looks for it in the contract and does not find it.
    kind: unstated
    correction: >-
      The contract's ingest-document refusals would have to name an empty model or prompt version, or the schema would have to stop refusing it.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      GetIngestionStatusOutputSchema, the attempts field, line 159
    evidence: >-
      attempts: z.number().int().positive(),
    cost: >-
      The LLM run node holds attempts as a required integer, and the retry rule only adds one to it. The floor of at least 1 is stated by this schema alone, so a stored run with 0 attempts would fail the output parse here while no node says that 0 is impossible.
    kind: unstated
    correction: >-
      The llm-run node, or a rule on it, would have to hold the lower bound of attempts, or the schema would have to drop it.
    node: domain/knowledge-base/llm-run
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      GetIngestionStatusOutputSchema, the idempotency_key field, line 161
    evidence: >-
      idempotency_key: z.string().regex(/^[0-9a-f]{64}$/),
    cost: >-
      The idempotency-key rule holds this fact, as 64 lowercase hexadecimal characters of a SHA-256 digest. It is bound to another file, not this one. The pattern is implemented a second time here, so a change to the node's format would not reach this file through its bind and the two would disagree without anyone knowing which was decided.
    kind: contradicts
    correction: >-
      The pattern should be read from the one declaration the node is bound to, or this file should be bound to the node. Code cannot read the specification, so the bind is what closes it.
    node: rules/knowledge-base/idempotency-key
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedNodeItemSchema, the node_id description, lines 225-231
    evidence: >-
      Rejected (VALIDATION_INVALID_FORMAT) if the id does not point to an active node.
    cost: >-
      The ingestion contract answers a pinned identity that names no knowledge node with error code RESOURCE_NOT_FOUND (reason not_found). It uses VALIDATION_INVALID_FORMAT only for a node that exists and is not active (reason inactive). This text, which the system emits to callers, gives one code for both cases, so a caller is told VALIDATION_INVALID_FORMAT for a missing node and receives RESOURCE_NOT_FOUND.
    kind: contradicts
    correction: >-
      The description should say what the contract says: RESOURCE_NOT_FOUND when no node is held at the identity, and VALIDATION_INVALID_FORMAT when the node is not active.
    node: contracts/knowledge-base/ingestion
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedAttributeItemSchema.valid_from, line 262-264, and IngestDirectedLinkItemSchema.valid_from, line 286-288
    evidence: >-
      Optional ISO date when this attribute became valid. Required when the catalog AttributeKey requires it. / Optional ISO date when this link became valid. Required when the catalog LinkType requires it.
    cost: >-
      The rule says a proposal that requires a validity start and states none takes the date its source was received, with basis received, when the source has no document date. A directed ingestion records its own raw information with no document date. The text emitted to callers says the start is required of them, which differs from the rule, so a caller may supply dates the system would have filled in itself. The text is also inconsistent with itself, saying Optional and then Required.
    kind: contradicts
    correction: >-
      The two descriptions should state what the rule holds, or stop stating a requirement the node does not place on the caller.
    node: rules/knowledge-base/required-start-fallback
  - file: src/modules/ingestion/mcp/mcp-schemas.ts
    where: >-
      IngestDirectedMcpInputSchema.source_label description, lines 324-326
    evidence: >-
      Carried into the run's `metadata.source_label` for audit; not parsed by the server.
    cost: >-
      The rule records the label in the raw information's metadata. The LLM run node holds no metadata attribute. The text emitted to callers names the run as the place the label lands, so someone looking for the label on the run, following this text, would not find it where the node puts it.
    kind: contradicts
    correction: >-
      The description should name the raw information's metadata, as directed-source-metadata states.
    node: rules/knowledge-base/directed-source-metadata
