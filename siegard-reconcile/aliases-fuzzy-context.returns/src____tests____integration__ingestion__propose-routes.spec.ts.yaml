findings:
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Header comment, lines 3-17 ("Acceptance criteria addressed here"), repeated in the per-test comments at lines 504-505, 532-534, 600-601, 667-669 and 739-740.
    evidence: >-
      "POST /llm-runs/:id/propose-node returns 409
      BUSINESS_RUN_NOT_RUNNING
      when run exists but is completed"
      and "POST /llm-runs/:id/propose-link returns 404 RESOURCE_NOT_FOUND when
      llmRunId is unknown"
    cost: >-
      The contract's refusal answers (status and error code per refusal) are written a second time as prose in the test. If a refusal answer changes in the node, this prose keeps saying the old one and nothing reads it, so a later reader can take it for the decided answer.
    kind: restates
    correction: >-
      Remove the comments. The contract holds the answers, and the test's own assertions (expect(res.statusCode).toBe(409), expect(body.error.code).toBe("BUSINESS_RUN_NOT_RUNNING"), and so on) hold them in code.
    node: contracts/knowledge-base/ingestion
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Comment "Note on the envelope semantics", lines 24-28, and the in-test comment at lines 865-866.
    evidence: >-
      "any
      `ValidationFailure` raised by the propose-* service surfaces as HTTP 200
      with `{ ok: false, error: ... }`. ZodErrors at the route boundary continue
      to surface as HTTP 422 via the global error handler"
    cost: >-
      The contract's split between refusals answered as HTTP 200 carrying { ok: false, error } and refusals answered as HTTP 422 is restated as prose naming internal types (ValidationFailure, ZodError). Where the node and the prose drift, the prose becomes a second authority that no check reaches.
    kind: restates
    correction: >-
      Remove the comments. The contract holds this split, and the assertions at lines 556 and 867 (expect(res.statusCode).toBe(200)) and line 757 (toBe(422)) hold it in code.
    node: contracts/knowledge-base/ingestion
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Comment in the second propose-fragment test, lines 536-541 ("Interpretation note (SD-2 in delivery)").
    evidence: >-
      "the original criterion referenced
      "text > 1000 chars" as the trigger; Zod's max(1000) intercepts that
      before the service runs"
    cost: >-
      The 1000-character fragment text limit is written in a test comment as well as in the rule. If the limit moves in the node, this comment still says 1000.
    kind: restates
    correction: >-
      Remove the comment. The limit is held by rules/knowledge-base/fragment-text-length, and the candidate index binds that rule to src/modules/ingestion/mcp/mcp-schemas.ts and src/modules/ingestion/service/directed-ingestion.service.ts.
    node: rules/knowledge-base/fragment-text-length
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Assertions in the "returns HTTP 409 BUSINESS_RUN_NOT_RUNNING" test, lines 623-624.
    evidence: >-
      expect(body.error.details.current_status).toBe("completed");
      expect(body.error.details.llm_run_id).toBe(RUN_COMPLETED_ID);
    cost: >-
      The contract says only that BUSINESS_RUN_NOT_RUNNING "name[s] the run's status". The detail keys current_status and llm_run_id, and the fact that the run's identity is also carried, exist only in this test and in the code it exercises. A client or reader that goes to the specification for the refusal's shape will not find them.
    kind: unstated
    correction: >-
      The analysis that owns the ingestion contract would state the detail keys of the BUSINESS_RUN_NOT_RUNNING refusal (the run's status and the run's identity) in the propose-fragment, propose-node, propose-link and propose-attribute answers.
    node: contracts/knowledge-base/ingestion
  - file: src/__tests__/integration/ingestion/propose-routes.spec.ts
    where: >-
      Comment above the allowed_values assertion, line 879.
    evidence: >-
      // allowed_values is lexicographically sorted per TC-02/TC-03 contract.
    cost: >-
      The ordering of allowed_values is stated in prose, citing a task-contract number, when the node states it as "in sorted order". If the node's ordering changes, this comment goes on claiming lexicographic order.
    kind: restates
    correction: >-
      Remove the comment. The contract holds the ordering, and the assertion toEqual(["Apollo", "Gemini", "Mercury"]) holds it in code.
    node: contracts/knowledge-base/ingestion
