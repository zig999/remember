certified:
  - node: rules/knowledge-base/document-context-entity-type-in-catalog
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/preliminary-reading.spec.ts
        name: records a document context without an entity listed under a node type the catalog does not hold
    why: >-
      The test checks more than the fact states. The fact only says that the
      entity listed under a node type the catalog does not hold ("Spaceship")
      is missing from the document context. The test compares the recorded
      entity list to exactly [PERSON_ENTITY, ORGANIZATION_ENTITY]. That also
      requires both entities with catalog types to be kept, in their original
      order. So the test would also fail on a change that leaves this fact
      intact, such as dropping or reordering the entities whose types the
      catalog holds. This is recorded for a reader to route. It does not reduce
      the coverage: removing the unknown-type entity is asserted directly, and
      the test fails if that entity is kept.
