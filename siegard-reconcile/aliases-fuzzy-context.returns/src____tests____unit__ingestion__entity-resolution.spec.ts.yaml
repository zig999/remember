findings:
  - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
    where: >-
      the "TC-10 — thresholds (BR-25)" test, line 181-184
    evidence: |-
      it("exports MATCH_STRONG = 0.85 and MATCH_FLOOR = 0.55", () => {
          expect(MATCH_STRONG).toBe(0.85);
    cost: >-
      The 0.85 strong-candidate value is written as a literal expectation in a test that no node is bound
      to. strong-candidate-resolves holds it and is bound only to entity-resolution.service.ts. When the
      node moves, `--check` never reaches this file. The test then fails on a literal nobody owns, and
      the next reader cannot tell whether the test or the specification holds the decision.
    kind: contradicts
    correction: >-
      Bind this file to rules/knowledge-base/strong-candidate-resolves so a change to the node reaches
      it. The literal cannot read the node.
    node: rules/knowledge-base/strong-candidate-resolves
  - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
    where: >-
      the same "TC-10 — thresholds (BR-25)" test, line 181-184, and the candidate sims used throughout
      (0.9, 0.6, 0.4, 0.3)
    evidence: |-
      expect(MATCH_FLOOR).toBe(0.55);
    cost: >-
      The 0.55 floor, below which a proposal creates an active node and at or above which it needs
      review, is restated here as an authority. no-candidate-creates-active-node holds it (and
      ambiguous-candidates-need-review reuses it) and is bound to entity-resolution.service.ts only. The
      test's candidate similarities (0.6, 0.4) are chosen around the same value, so a change to the node
      would be tracked by neither the bind nor `--check`.
    kind: contradicts
    correction: >-
      Bind this file to rules/knowledge-base/no-candidate-creates-active-node and
      rules/knowledge-base/ambiguous-candidates-need-review.
    node: rules/knowledge-base/no-candidate-creates-active-node
  - file: src/__tests__/unit/ingestion/entity-resolution.spec.ts
    where: >-
      the header comment, lines 12-16
    evidence: |-
      //   - entity_match_review row count = candidates with sim >= MATCH_FLOOR
      //   - aliases attempted via INSERT ... ON CONFLICT DO NOTHING
      //   - thresholds (MATCH_STRONG = 0.85, MATCH_FLOOR = 0.55) live in the
      //     entity-resolution module only.
    cost: >-
      A comment restates the strong and floor thresholds, and it says the review row count equals every
      candidate at or above the floor. ambiguous-candidates-need-review limits the review to "the ten
      such nodes most similar", so the prose is a second home that is narrower than the node. The
      thresholds are also held in code (the service, and the literals in this test), so removing the
      comment loses no behavior.
    kind: restates
    correction: >-
      Remove the comment. The route is the comment route, then a reconcile over this file.
    node: rules/knowledge-base/ambiguous-candidates-need-review
