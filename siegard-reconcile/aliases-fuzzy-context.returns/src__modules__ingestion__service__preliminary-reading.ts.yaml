read:
  - node: domain/knowledge-base/document-context
    held_at: >-
      nowhere
    evidence: >-
      The file builds a document context value, `return { summary: cutSummaryToLines(reading.summary, SUMMARY_MAX_LINES), entities: keepCatalogEntities(reading.entities, request.catalog), model: request.model, };`, but its shape comes from `import type { DocumentContext, DocumentContextStatus, DocumentEntity } from "../dto/llm-run.dto.js"`. The file declares no such shape.
  - node: domain/knowledge-base/document-context-status
    held_at: >-
      nowhere
    evidence: >-
      The file writes the values `"produced"`, `"single-chunk"`, `"too-long"` and `"failed"`, but the enumeration comes from `import type { DocumentContextStatus } from "../dto/llm-run.dto.js"`. The file declares no enumeration.
  - node: domain/knowledge-base/document-entity
    held_at: >-
      nowhere
    evidence: >-
      `function keepCatalogEntities(entities: readonly DocumentEntity[], ...)` only filters entities, and reads `e.node_type` from them. The type is imported from `../dto/llm-run.dto.js`.
  - node: domain/knowledge-base/llm-run
    held_at: >-
      nowhere
    evidence: >-
      The file only reads fields of the run through `readonly run: { readonly id: string; readonly prompt_version: string; readonly document_context: DocumentContext | null | undefined; }`. It declares no LLMRun shape.
  - node: rules/knowledge-base/document-context-entity-type-in-catalog
    held_at: >-
      keepCatalogEntities(), applied in readDocumentContext()
    evidence: >-
      `return entities.filter((e) => catalog.nodeTypeByName.has(e.node_type));`, used as `entities: keepCatalogEntities(reading.entities, request.catalog)`.
  - node: rules/knowledge-base/document-context-read-first
    held_at: >-
      shouldReadDocument() and produceDocumentContext()
    evidence: >-
      `readsDocumentFirst(request.run.prompt_version) && request.chunkCount > 1 && request.content.length <= PRELIMINARY_READING_MAX_CONTENT_UNITS && (request.run.document_context === null || request.run.document_context === undefined)`, with `export const PRELIMINARY_READING_MAX_CONTENT_UNITS = 100_000 as const;`. The model is called with `user(request.content)`, the whole content, in a single call.
  - node: rules/knowledge-base/document-context-status-kept-on-reuse
    held_at: >-
      the first statements of produceDocumentContext()
    evidence: >-
      `const held = request.run.document_context ?? null; if (held !== null) return held;`. This runs before any call that records a status.
  - node: rules/knowledge-base/document-context-status-recorded
    held_at: >-
      skippedReadingStatus(), recordProducedContext() and recordFailedReading()
    evidence: >-
      `if (request.chunkCount === SINGLE_CHUNK_COUNT) return "single-chunk"; if (request.chunkCount > SINGLE_CHUNK_COUNT && request.content.length > PRELIMINARY_READING_MAX_CONTENT_UNITS) { return "too-long"; }`, `document_context_status: "produced"` and `await recordReadingStatus(request.pool, request.run.id, "failed");`.
  - node: rules/knowledge-base/document-context-summary-cut-to-five-lines
    held_at: >-
      cutSummaryToLines(), applied in readDocumentContext()
    evidence: >-
      `if (lines.length <= maxLines) return summary; return lines.slice(0, maxLines).join(LINE_BREAK);`, used as `summary: cutSummaryToLines(reading.summary, SUMMARY_MAX_LINES)`. The limit value 5 is declared in the imported prompts file, which was not read.
  - node: rules/knowledge-base/document-context-summary-lines
    held_at: >-
      cutSummaryToLines()
    evidence: >-
      `const lines = summary.split(LINE_BREAK); if (lines[lines.length - 1] === "") lines.pop();`, with `const LINE_BREAK = "\n";`. A line ends at a newline, a carriage return ends none, an empty line counts, and a trailing newline starts no further line.
  - node: rules/knowledge-base/failed-preliminary-reading-continues
    held_at: >-
      the catch of produceDocumentContext()
    evidence: >-
      `} catch (err) { await recordFailedReading(request, err); return null; }`. The error is not rethrown, so the caller proceeds to read chunks without a context.
  - node: rules/knowledge-base/no-document-context-before-v5
    held_at: >-
      readsDocumentFirst(), as used by skippedReadingStatus() and shouldReadDocument()
    evidence: >-
      `Number.parseInt(major, 10) >= FIRST_PRELIMINARY_READING_VERSION` and `if (!readsDocumentFirst(request.run.prompt_version)) return null;`. Before v5 no reading is made and no context or status is written.
  - node: scenarios/knowledge-base/failed-context-reading-keeps-extracting
    held_at: >-
      the try/catch of produceDocumentContext()
    evidence: >-
      `context = await readDocumentContext(request); } catch (err) { await recordFailedReading(request, err); return null; }`. This records failed and returns no context.
  - node: scenarios/knowledge-base/preliminary-reading-proposes-nothing
    held_at: >-
      readDocumentContext() and produceDocumentContext()
    evidence: >-
      The model call is `request.anthropic.messages.stream({ model: request.model, system: system(request.catalog), max_tokens: MAX_TOKENS, messages: [...] })`. The file's only writes are `recordDocumentContext` and `recordDocumentContextStatus`. It makes no node, fragment, link or attribute proposal.
  - node: scenarios/knowledge-base/retried-run-reuses-context
    held_at: >-
      the first statements of produceDocumentContext()
    evidence: >-
      `const held = request.run.document_context ?? null; if (held !== null) return held;`. No second reading is made and the held context is returned.
  - node: scenarios/knowledge-base/single-chunk-document-has-no-context
    held_at: >-
      skippedReadingStatus() and recordSkippedReading()
    evidence: >-
      `if (request.chunkCount === SINGLE_CHUNK_COUNT) return "single-chunk";`, then `await recordReadingStatus(request.pool, request.run.id, status);` and `return null;`.
