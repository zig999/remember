looked_past: >-
  The logger events `document_context_reading_failed`, `document_context_reading_skipped` and `document_context_produced` and the `/^v(\d+)$/` ordering of prompt versions state no node's fact differently, so no finding was filed; the nodes in the set do not govern whether the preliminary reading call is bounded by wait or retry, which `constraints/extraction-model-call-bounded` governs for the injected client elsewhere.
