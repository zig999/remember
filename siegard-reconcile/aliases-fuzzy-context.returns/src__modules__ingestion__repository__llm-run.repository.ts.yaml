read:
  - node: domain/knowledge-base/document-context-status
    held_at: >-
      nowhere. The enumeration is imported as a type from ../dto/llm-run.dto.js. recordDocumentContextStatus only passes a value through, so the shape is declared in another file.
    evidence: >-
      `document_context_status: DocumentContextStatus;` and `SET document_context_status = $2::document_context_status`
  - node: domain/knowledge-base/information-fragment
    held_at: >-
      nowhere. insertFragmentWithSources only passes text and confidence to an INSERT. The orphan predicate in aggregateToolCallOutcomes and retryLlmRunRow reads status.
    evidence: >-
      `INSERT INTO information_fragment (llm_run_id, "text", confidence)`
  - node: domain/knowledge-base/llm-run
    held_at: >-
      The operations are realized in retryLlmRunRow (retry) and closeLlmRunRow (complete and fail). The row shape LlmRunRow is declared in ingestion.repository.js and re-exported here, not declared here.
    evidence: >-
      `SET status = 'running', attempts = attempts + 1, finished_at = NULL WHERE id = $1 AND status = 'failed'` and `SET status = $2::llm_run_status, finished_at = now() WHERE id = $1 AND status = 'running'`
  - node: domain/knowledge-base/raw-information
    held_at: >-
      Partly, in the RecentIngestionRow type and the findRecentIngestions projection of source type, status, reception time and content. The full shape is declared in ingestion.repository.
    evidence: >-
      `readonly source_type: string; readonly raw_status: string; readonly received_at: Date; readonly content_preview: string;`
  - node: domain/knowledge-base/tool-call
    held_at: >-
      The ToolCallRow interface, line 16, plus insertToolCall and insertToolCallStandalone.
    evidence: >-
      `export interface ToolCallRow { readonly id: string; readonly llm_run_id: string; readonly tool_name: IngestToolName; readonly arguments: Record<string, unknown>; readonly result: Record<string, unknown> | null; readonly validation_outcome: ValidationOutcome; readonly created_at: Date; }`
  - node: rules/knowledge-base/cited-fragments-anchored
    held_at: >-
      countFragmentsAnchoredToSource, which counts the fragments drawn from a chunk of the expected raw information.
    evidence: >-
      `JOIN fragment_source fs ON fs.fragment_id = f.id JOIN raw_chunk rc ON rc.id = fs.raw_chunk_id WHERE f.id = ANY($1::uuid[]) AND rc.raw_information_id = $2`
  - node: rules/knowledge-base/closing-stamps-finish-time
    held_at: >-
      closeLlmRunRow sets finished_at to now() when it completes or fails the run.
    evidence: >-
      `SET status = $2::llm_run_status, finished_at = now()`
  - node: rules/knowledge-base/fragment-chunks-in-run-source
    held_at: >-
      countChunksInSource, which counts the cited chunks that belong to the expected raw information.
    evidence: >-
      `FROM raw_chunk WHERE id = ANY($1::uuid[]) AND raw_information_id = $2`
  - node: rules/knowledge-base/llm-run-lifecycle
    held_at: >-
      The guards in retryLlmRunRow (only from failed) and closeLlmRunRow (only from running).
    evidence: >-
      `WHERE id = $1 AND status = 'failed'` and `WHERE id = $1 AND status = 'running'`
  - node: rules/knowledge-base/orphaned-fragment
    held_at: >-
      The orphan predicate in aggregateToolCallOutcomes and in retryLlmRunRow.
    evidence: >-
      `AND status = 'proposed' AND id NOT IN ( SELECT fragment_id FROM provenance WHERE fragment_id IS NOT NULL )`
  - node: rules/knowledge-base/recent-ingestion-latest-run
    held_at: >-
      The LEFT JOIN LATERAL in findRecentIngestions, which takes the latest started run and leaves it null when there is none.
    evidence: >-
      `LEFT JOIN LATERAL ( SELECT id, status, started_at, finished_at, prompt_version, model FROM llm_run WHERE input_raw_information_id = ri.id ORDER BY started_at DESC LIMIT 1 ) lr ON true`
  - node: rules/knowledge-base/recent-ingestions-order
    held_at: >-
      The ORDER BY of findRecentIngestions.
    evidence: >-
      `ORDER BY ri.received_at DESC LIMIT $1`
  - node: rules/knowledge-base/retry-counts-attempts
    held_at: >-
      The UPDATE in retryLlmRunRow. It leaves started_at untouched.
    evidence: >-
      `SET status = 'running', attempts = attempts + 1, finished_at = NULL`
  - node: rules/knowledge-base/retry-keeps-document-context-status
    held_at: >-
      The retryLlmRunRow UPDATE, whose SET list does not name document_context_status. The column only appears in RETURNING.
    evidence: >-
      `SET status = 'running', attempts = attempts + 1, finished_at = NULL WHERE id = $1 AND status = 'failed' RETURNING id, model, prompt_version, started_at, finished_at, status, attempts, input_raw_information_id, idempotency_key, document_context, document_context_status`
  - node: rules/knowledge-base/retry-rejects-orphaned-fragments
    held_at: >-
      The second statement of retryLlmRunRow.
    evidence: >-
      `UPDATE information_fragment SET status = 'rejected' WHERE llm_run_id = $1 AND status = 'proposed' AND id NOT IN ( SELECT fragment_id FROM provenance WHERE fragment_id IS NOT NULL )`
  - node: rules/knowledge-base/summary-counts-orphaned-fragments
    held_at: >-
      The orphan count query in aggregateToolCallOutcomes, which assigns summary.orphaned_fragments.
    evidence: >-
