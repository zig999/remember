  - node: rules/knowledge-base/summary-counts-tool-calls
    held_at: >-
      aggregateToolCallOutcomes. It groups tool_call by validation_outcome and starts every outcome at zero.
    evidence: >-
      `SELECT validation_outcome, count(*)::text AS n FROM tool_call WHERE llm_run_id = $1 GROUP BY validation_outcome` and `accepted: 0, consolidated: 0, superseded_previous: 0, needs_review: 0, uncertain: 0, disputed: 0, rejected: 0, error: 0,`
  - node: rules/knowledge-base/tool-call-listing-order
