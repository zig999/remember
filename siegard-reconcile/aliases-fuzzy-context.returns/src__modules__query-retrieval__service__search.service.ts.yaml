findings:
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      resolveLayers, lines 466-471, the branch taken when the layer list is absent or empty
    evidence: >-
      if (layers === undefined || layers.length === 0) {
          return new Set(ALLOWED_LAYERS);
        }
    cost: >-
      The code treats an empty layer list the same as an omitted one and searches every layer. The
      defaults node speaks only of an option the query omits, and no node says what an empty list
      means. The next reader will look for that in the specification and will not find it. The
      decision lives only in this branch.
    kind: unstated
    correction: >-
      A node should state whether a search query that names an empty layer list reads every layer,
      or is refused. search-option-defaults or search-layer-outside-set-refused are the nodes the
      statement would sit with.
    node: rules/knowledge-base/search-option-defaults
