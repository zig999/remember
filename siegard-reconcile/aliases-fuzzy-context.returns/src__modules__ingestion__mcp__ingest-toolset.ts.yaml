    cost: >-
      The name a caller uses to read an LLM run over MCP is stated only here and in the schema and description files. The contract's operation is named read-llm-run. The other ingest tools carry names a node spells (propose_fragment and the other three propose_* in domain/knowledge-base/ingest-tool, health in contracts/knowledge-base/access, and ingest_document and ingest_directed in the refusal messages of contracts/knowledge-base/ingestion). get_ingestion_status is not spelled anywhere in the specification, so a reader who looks there for the run-read tool's name does not find it, and a rename in code would pass without any node disagreeing.
    kind: unstated
    correction: >-
      Contracts/knowledge-base/ingestion would have to state that the run read over MCP is offered as the tool get_ingestion_status. That is for the analysis route to decide. It is not a change to this file.
    node: contracts/knowledge-base/ingestion
