  - node: domain/knowledge-base/llm-run
    held_at: >-
      The LlmRunRow interface (lines 44-56), insertLlmRun and findLlmRunByIdempotencyKey. They declare and select the run's attributes. The summary attribute is not declared here.
    evidence: >-
      readonly model: string; readonly prompt_version: string; readonly started_at: Date; readonly finished_at: Date | null; readonly status: "running" | "completed" | "failed"; readonly attempts: number; readonly input_raw_information_id: string; readonly idempotency_key: string; readonly document_context: DocumentContext | null; readonly document_context_status: DocumentContextStatus | null;
  - node: domain/knowledge-base/raw-chunk
    held_at: >-
      The RawChunkRow interface (lines 33-42), insertRawChunks, findChunksByRawInformationId and toRawChunkResponse. The node's status and superseded_at attributes are not declared in this file.
    evidence: >-
      readonly chunk_index: number; readonly text: string; readonly offset_start: number; readonly offset_end: number; readonly locator: ChunkLocator; readonly chunking_version: string;
  - node: domain/knowledge-base/raw-information
    held_at: >-
      The RawInformationRow interface (lines 22-31), insertRawInformation, the two find functions and toRawInformationResponse. The node's title, document_date, status and superseded_at attributes are not declared in this file.
    evidence: >-
      readonly source_type: SourceType; readonly content: string; readonly storage_ref: string | null; readonly content_hash: string; readonly received_at: Date; readonly metadata: Record<string, unknown>; readonly original_input: string | null;
  - node: domain/knowledge-base/run-status
    held_at: >-
      The status member of LlmRunRow (line 50), a literal union of the three values.
    evidence: >-
      readonly status: "running" | "completed" | "failed";
  - node: rules/knowledge-base/chunk-listing-order
    held_at: >-
      The ORDER BY clause of findChunksByRawInformationId (line 149). insertRawChunks also sorts its returned rows by chunk_index.
    evidence: >-
      WHERE raw_information_id = $1
            ORDER BY chunk_index ASC
  - node: constraints/document-content-is-data
    held_at: nowhere
    evidence: >-
      The file only reads and writes rows. It builds no prompt and sends nothing to a model, for example `SELECT id, source_type, content, storage_ref, content_hash, received_at, metadata, original_input FROM raw_information WHERE content_hash = $1`.
  - node: constraints/extraction-model-call-bounded
    held_at: nowhere
    evidence: >-
      The file makes no model call, timeout or retry. It holds only `client.query` calls such as `INSERT INTO llm_run (model, prompt_version, input_raw_information_id, idempotency_key)`.
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      toRawInformationResponse and toRawChunkResponse hold the field sets that read-raw-information and list-raw-chunks answer. Every other operation of the contract is not in this file. The finding-free conformance of these two mappers is read from the field lists below.
    evidence: >-
      return { id: row.id, source_type: row.source_type, content: row.content, storage_ref: row.storage_ref, content_hash: row.content_hash, received_at: row.received_at.toISOString(), metadata: row.metadata ?? {}, }; and return { id: row.id, raw_information_id: row.raw_information_id, chunk_index: row.chunk_index, text: row.text, offset_start: row.offset_start, offset_end: row.offset_end, locator: row.locator ?? null, chunking_version: row.chunking_version, };
