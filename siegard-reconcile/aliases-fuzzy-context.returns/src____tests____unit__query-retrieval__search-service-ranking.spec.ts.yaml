findings:
  - file: src/__tests__/unit/query-retrieval/search-service-ranking.spec.ts
    where: >-
      the DECLARED_ITEM_KEYS constant and the test "answers a node, a link and a fragment item with no attribute the search item does not declare" (lines 500-511 and 513-544)
    evidence: >-
      const DECLARED_ITEM_KEYS = [
        "kind",
        "layer",
        "id",
        "score",
        "hop",
        "summary",
        "flags",
        "provenance",
        "match",
        "similarity",
      ];
    cost: >-
      The test states what a search item declares and includes `id`, an attribute the node does not list. The node declares kind, layer, score, hop, summary, flags, match and similarity, plus the provenance association. A search item's identifier is nonetheless relied on by rules/knowledge-base/search-ranking ("then by identifier ascending"). A reader who looks for the item's identity in the specification finds only the ranking rule's passing mention. The test becomes the one place that says the item carries an `id`.
    kind: unstated
    correction: >-
      The analysis would give the search item's identifier an attribute on domain/knowledge-base/search-item. Alternatively it would record that the item deliberately has no `id` attribute of its own, so that this list matches the node.
    node: domain/knowledge-base/search-item
