looked_past: >-
  The file is a unit test that round-trips a document context and its status through a fake pg client. Its literals ("Person", "claude-haiku-4-5", "v5", the four status values) are fixtures and expectations over code declared elsewhere, so no domain fact is stated in it that no node holds, and the fake client's SQL parsing is a test-design matter, not a conformance one.
