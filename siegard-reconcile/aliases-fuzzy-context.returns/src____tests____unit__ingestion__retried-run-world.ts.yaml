looked_past: >-
  The file is a test fixture: a store stand-in that parses `UPDATE llm_run` SQL, a model stand-in, and literal inputs (`"v5"`, `"claude-haiku-4-5"`, the chunk offsets). These are test inputs and not domain rules, so I report no finding. Its fit to the tests that consume it is another judgment's.
