looked_past: >-
  The test "prose layers stay lexical" asserts that a trigram-only match reaches no fragment-layer or chunk-layer item, a fact no node statement holds. Only the decision log beside link-and-fragment-items-carry-no-match says it, and that log decides no fact of its own. I did not file it, because it follows from prose-matching and from the scoping of the trigram match to the node layer in node-layer-approximate-match.
