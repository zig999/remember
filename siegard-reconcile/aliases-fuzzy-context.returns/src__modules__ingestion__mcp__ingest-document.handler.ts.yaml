  The file's other facts are held by nodes outside the set and agree with them, so they are no finding: rules/knowledge-base/document-ingestion-records-no-storage-reference holds `storage_ref: null` and `metadata: input.metadata ?? {}`, and constraints/unreachable-store-answers-unavailable with the "A backing service is temporarily unavailable." wording of contracts/knowledge-base/access holds the SYSTEM_SERVICE_UNAVAILABLE answer. The contracts/knowledge-base/ingestion row for ingest-document states neither of those two.
