findings:
  - file: src/__tests__/unit/ingestion/chunk-prompt-document-context.spec.ts
    where: >-
      function normOf, lines 188-195, used by findExactNode and insertAlias to stand in for the
      database's alias comparison
    evidence: |-
      function normOf(text: string): string {
        return text
          .normalize("NFD")
          .replace(/\p{M}/gu, "")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();
      }
    cost: >-
      The normalization of a name (lower-casing, removing accents, trimming, collapsing inner
      whitespace) is implemented here a second time, in a file the node is not bound to. This copy
      decides whether the mock store finds an alias in the 4th test. If the node's rule moves,
      the test keeps its own definition and still passes, and nothing says which of the two was
      decided.
    kind: contradicts
    correction: >-
      The test would have to compare names without its own copy of the rule, for example by using
      the identical strings it already feeds the mock. Failing that, the bind of this file to the
      node is what claims the stand-in.
    node: rules/knowledge-base/name-normalization
