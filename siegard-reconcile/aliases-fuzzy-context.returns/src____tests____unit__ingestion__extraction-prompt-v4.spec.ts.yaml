findings:
  - file: src/__tests__/unit/ingestion/extraction-prompt-v4.spec.ts
    where: >-
      the test "v4.system extends v3.system verbatim with the received_at-anchor directive" (line 82) and the test "v4 keeps the load-bearing content of v1, v2 and v3" (line 89)
    evidence: |-
      expect(systemV4(s)).toBe(`${systemV3(s)}\n${RECEIVED_AT_ANCHOR_DIRECTIVE}`);
      expect(s).toContain("## Inviolable rules");
      expect(s).toContain("### NodeType");
      expect(s).toContain("## Events — always date the occurrence");
      expect(s).toContain("## Events — classify the type and resolve relative dates");
    cost: >-
      The test fixes the v4 extraction system prompt as the whole v3 prompt, a newline and one directive, and pins four v1 to v3 section headings as content v4 must keep. No node states either. The v4-to-v3 relationship exists only in this test. The nearby nodes only scope individual v4 instructions (the relative-date words and the reception fallback) to "v4 and later", and v5-keeps-v4 covers v5 over v4. A reader looking in the specification for what v4 carries from earlier versions finds nothing. A change to v3 that the node set never sees would fail this test with no node to say which side was decided.
    kind: unstated
    correction: >-
      An analysis would have to give the fact a node, in the shape of rules/knowledge-base/extraction-prompt-v5-keeps-v4. That node would say what the v4 extraction system prompt keeps from the v3 one, and whether that includes the headings the test pins.
    node: domain/knowledge-base/prompt-version
