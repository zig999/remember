findings:
  - file: src/__tests__/unit/env.spec.ts
    where: >-
      the "parses a valid environment" test, lines 28-31 (expectations on the JWKS cache lifetime, the connection pool bounds and the statement timeout)
    evidence: |-
      expect(env.NEON_AUTH_JWKS_TTL_S).toBe(600);
          expect(env.PG_POOL_MIN).toBe(2);
          expect(env.PG_POOL_MAX).toBe(10);
          expect(env.PG_STATEMENT_TIMEOUT_MS).toBe(10_000);
    cost: >-
      The values 600 seconds, a pool of 2 to 10 and a 10 000 ms statement timeout are asserted as the defaults, but a search of the specification (projections/full-text.md and the constraints and rules directories) found no node that holds them. The only nearby node, constraints/unreachable-store-answers-unavailable, says what a timed-out statement answers and gives no number. The test is now the only place besides the env loader where these defaults are written down. A later reader who looks in the specification for the statement timeout or the pool size will not find them.
    kind: unstated
    correction: >-
      An analysis would have to decide whether these operational defaults are domain facts and, if they are, give them a node. Otherwise they are configuration the test should not pin as business values.
  - file: src/__tests__/unit/env.spec.ts
    where: >-
      the "applies the v2 defaults (chat.back.md v2.0.0 §8)" test, line 211
    evidence: >-
      expect(env.CHAT_SUMMARY_AFTER_TURNS).toBe(20);
    cost: >-
      The test fixes 20 as the number of turns after which a conversation is summarised. The chat nodes hold the neighbouring defaults: the recent window of 6, the overlap of 40, the enabled flag for summaries, and the chat model. None of them holds the 20, and rules/chat/rolling-summary-overlap states the overlap of 40 and no turn threshold. The business rule for when a summary is refolded therefore lives only in the code and in this assertion, where a reader of the specification will not look.
    kind: unstated
    correction: >-
      The rule that decides when a live turn refolds the rolling summary would need a node stating the turn threshold and its default of 20 where none is configured.
