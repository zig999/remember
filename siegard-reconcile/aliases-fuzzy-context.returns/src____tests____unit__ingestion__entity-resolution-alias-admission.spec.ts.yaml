looked_past: >-
  The store stand-in carries its own copies of the normalization function (dbNorm) and of the admission and directed-run decisions (answerAdmission, including an empty-alias refusal that no test exercises), which is test-double construction and not a domain fact the tests assert, so I report no finding on it.
