      `const NOT_ADMITTED_REASON = "ALIAS_NOT_IN_SOURCE";` and `expect(result.resolution, "the resolution is answered").toBe("created_new");` and `text.includes(`"${alias}"`) && text.includes(NOT_ADMITTED_REASON)`. These assert the propose-node answer (resolution plus aliases not admitted with ALIAS_NOT_IN_SOURCE) as the contract states it.
