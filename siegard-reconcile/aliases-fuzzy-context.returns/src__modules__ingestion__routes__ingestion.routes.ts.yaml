looked_past: >-
  The 11 MiB limit is set only on POST /raw-information, and the other routes in this file take the framework's
  default limit unless something outside this file sets one. Whether the system-scoped ceiling holds for them is
  not decidable from this file, and I did not read the files that might settle it. Which of the run-extraction
  and propose-* routes get registered also depends on `deps.catalog` and `deps.env` being present. That is wiring,
  not a domain fact.
