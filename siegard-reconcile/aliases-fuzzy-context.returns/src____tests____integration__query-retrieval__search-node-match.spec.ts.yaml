looked_past: >-
  The fake pool discriminates statements by SQL fragments such as `websearch_to_tsquery`, `plainto_tsquery` and `word_similarity`, and the test fixtures carry environment, pool and token settings. This is test scaffolding and implementation coupling, not a domain fact, so it belongs to a code review and not to this pass.
