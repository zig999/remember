      LAYER_WEIGHT_NODE,
      LAYER_WEIGHT_CHUNK,
  - node: rules/knowledge-base/name-normalization
    held_at: >-
      APPROXIMATE_NODE_ALIAS_SQL, which compares the stored normalized alias against norm() of the query text
    evidence: >-
