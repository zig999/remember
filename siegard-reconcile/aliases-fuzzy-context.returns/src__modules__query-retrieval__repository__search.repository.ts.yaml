findings:
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      the score expressions of searchFragmentLayer (line 43), searchNodeAliasLayer (line 76) and searchChunkLayer (line 161)
    evidence: |-
      (ts_rank_cd(f.text_search, websearch_to_tsquery($1::regconfig, $2)) * $3::float)::float AS score
      (max(ts_rank_cd(to_tsvector($1::regconfig, na.alias), websearch_to_tsquery($1::regconfig, $2))) * $3::float)::float AS score
      (ts_rank_cd(rc.text_search, websearch_to_tsquery($1::regconfig, $2)) * $3::float)::float AS score
    cost: >-
      The measure of a match's strength on the fragment, chunk and exact node layers is PostgreSQL's cover-density rank. For the exact node layer it is the highest such rank over the matching aliases. No node says so. The weights node says a strength is weighted, and the approximate-match nodes define the strength of an approximate match. The base measure for every other match lives only in these three queries. The next reader looks in the specification for what a match's strength is and finds no answer. A change to the measure would not reach any node.
    kind: unstated
    correction: >-
      Give the strength of an exact node-layer, fragment-layer and chunk-layer match a statement, in rules/knowledge-base/layer-weights or in a sibling rule, through an analysis of the node set.
    node: rules/knowledge-base/layer-weights
  - file: src/modules/query-retrieval/repository/search.repository.ts
    where: >-
      the ORDER BY and LIMIT of searchFragmentLayer (lines 47-48), searchNodeAliasLayer (lines 83-84), APPROXIMATE_NODE_ALIAS_SQL (lines 119-120) and searchChunkLayer (lines 165-166)
    evidence: |-
      ORDER BY score DESC, f.created_at DESC, f.id ASC
      ORDER BY score DESC, kn.canonical_name ASC, kn.id ASC
      ORDER BY score DESC, rc.id ASC
    cost: >-
      The cap node says a search keeps at most 200 candidates per layer, but not which candidates survive when a layer holds more. This file decides it. Fragments tie-break by creation time descending then identity. Nodes tie-break by canonical name ascending then identity. Chunks tie-break by identity. The node-layer tie-break by canonical name matches neither the final ranking nor any node. The set of surviving candidates, and so the total, depends on a rule only the SQL states.
    kind: unstated
    correction: >-
      State in a node which candidates a layer keeps under the cap, and how ties between equal scores are broken, through an analysis of the node set.
    node: rules/knowledge-base/search-layer-candidate-cap
read:
  - node: constraints/retrieval-is-lexical-only
    held_at: >-
      every query in the file: tsvector and websearch_to_tsquery matching in the fragment, node-alias and chunk layers, and pg_trgm word_similarity in the approximate node layer
    evidence: |-
      f.text_search @@ websearch_to_tsquery($1::regconfig, $2)
      word_similarity(na.alias_norm, norm($1::text)) >= $4::real
  - node: domain/knowledge-base/node-status
    held_at: >-
      the status field of NodeAliasHitRow (line 62), which declares part of the enumeration, and the 'merged' and 'deleted' strings in the node-layer SQL
    evidence: |-
      readonly status: "active" | "needs_review";
      AND kn.status NOT IN ('merged', 'deleted')
  - node: rules/knowledge-base/alias-matching
    held_at: >-
      searchNodeAliasLayer, which matches aliases under the stemming-free accent-folding configuration
    evidence: |-
      WHERE to_tsvector($1::regconfig, na.alias) @@ websearch_to_tsquery($1::regconfig, $2)
      FTS_NAME_CONFIG,
  - node: rules/knowledge-base/approximate-match-similarity
    held_at: >-
      the similarity column of APPROXIMATE_NODE_ALIAS_SQL, selected without the layer weight, and ApproximateNodeAliasHitRow.similarity
    evidence: |-
      max(word_similarity(na.alias_norm, norm($1::text))) AS similarity,
      readonly similarity: number;
  - node: rules/knowledge-base/approximate-match-strength
    held_at: >-
      the score column of APPROXIMATE_NODE_ALIAS_SQL
    evidence: >-
      (max(word_similarity(na.alias_norm, norm($1::text))) * $2::float)::float AS score
  - node: rules/knowledge-base/chunk-layer-matches-current-chunks
    held_at: >-
      the WHERE clause of searchChunkLayer
    evidence: >-
      AND rc.superseded_at IS NULL
  - node: rules/knowledge-base/chunk-offsets-count-code-points
    held_at: >-
      the excerpt expressions, which read the chunk text by its offsets with substring, 1-based start and a length of end minus start
    evidence: |-
      substring(rc."text" FROM rc.offset_start + 1
                                FOR rc.offset_end - rc.offset_start) AS excerpt
  - node: rules/knowledge-base/fragment-layer-matches-accepted-only
    held_at: >-
      the WHERE clause of searchFragmentLayer
    evidence: >-
      WHERE f.status = 'accepted'
  - node: rules/knowledge-base/layer-weights
    held_at: >-
      the weight multiplications in the three layer scores (lines 43, 76, 109 and 161). The values are imported from scoring.ts and bound as parameters.
    evidence: |-
