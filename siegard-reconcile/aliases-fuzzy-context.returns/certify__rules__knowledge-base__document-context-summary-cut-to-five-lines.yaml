certified:
  - node: rules/knowledge-base/document-context-summary-cut-to-five-lines
    state: covered
    tests:
      - file: src/__tests__/unit/ingestion/preliminary-reading.spec.ts
        name: records the first 5 lines of a 7-line summary as the document context summary
      - file: src/__tests__/unit/ingestion/preliminary-reading.spec.ts
        name: counts an empty line as a line when it cuts a summary to 5 lines
      - file: src/__tests__/unit/ingestion/preliminary-reading.spec.ts
        name: lets a carriage return end no line when it cuts a summary to 5 lines
    why: >-
      The fact holds when these tests pass. Each one runs a preliminary reading whose summary
      is longer than 5 lines. It then checks the exact summary recorded on the run's document
      context against the first 5 lines: the 7-line test cuts at 7, and the other two cut at 6,
      one line past the limit. If no cut were made, or the cut were made at a different line,
      every one of them would fail. Some of these tests also check more than this node states.
      "lets a carriage return end no line" checks that only a line feed ends a line, so the
      fifth line keeps its trailing "\r" ("a\r\nb\r\nc\r\nd\r\ne\r"). "counts an empty line as
      a line" checks that an empty line counts toward the 5. Neither of these line-splitting
      rules is stated in this node. The node defers the line limit to
      rules/knowledge-base/document-context-summary-lines, which this certification did not
      open, so this pass does not establish whether that sibling states either rule. If the
      definition of a line changes, both tests will fail even while this node's fact still
      holds.
