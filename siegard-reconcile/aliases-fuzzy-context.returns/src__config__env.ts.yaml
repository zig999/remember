    evidence: >-
      .default("http://localhost:5173,http://127.0.0.1:5173")
    cost: >-
      The set of origins the system answers as allowed is decided here and no node states it.
      The constraint on allowed origins speaks of "an allowed origin" without saying which
      origins are allowed. A reader checking which origins are admitted looks in the
      specification and finds no value.
    kind: unstated
    correction: >-
      The node that governs allowed origins, or a new rule beside it, would have to state
      which origins are allowed where none is configured. Candidate
      constraints/answers-carry-allowed-origin states only the behavior toward an allowed
      origin, not the default set.
  - file: src/config/env.ts
    where: >-
      line 30, the default of PG_STATEMENT_TIMEOUT_MS
    evidence: >-
      PG_STATEMENT_TIMEOUT_MS: z.coerce.number().int().min(0).default(10_000),
    cost: >-
      The point at which a statement counts as timed out, and so answers "a backing service
      is unavailable", is decided here as 10 000 ms. The constraint on unreachable stores
      names the timeout outcome but gives no duration. An owner or reader cannot learn from
      the specification when that answer appears.
    kind: unstated
    correction: >-
      A node would have to hold the statement time limit and its default. Candidate
      constraints/unreachable-store-answers-unavailable holds the outcome only.
  - file: src/config/env.ts
    where: >-
      line 39, NEON_AUTH_JWKS_TTL_S with its floor and default
    evidence: >-
      NEON_AUTH_JWKS_TTL_S: z.coerce.number().int().min(60).default(600),
    cost: >-
      How long a fetched key set is trusted, with a floor of 60 and a default of 600 seconds,
      affects which tokens are accepted or refused. No node holds either value, so the code
      becomes the only place the decision can be read.
    kind: unstated
    correction: >-
