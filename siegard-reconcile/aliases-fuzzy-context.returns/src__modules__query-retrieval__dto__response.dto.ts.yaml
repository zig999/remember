findings:
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: >-
      interface SearchItem, line 44 (the `id` field)
    evidence: >-
      export interface SearchItem { readonly kind: SearchKind; readonly layer: SearchLayer; readonly id: string; readonly score: number;
    cost: >-
      A search item's identity is a shape the code declares and the search-item node never lists among its attributes (kind, layer, score, hop, summary, flags, match, similarity). The next reader of search-item will not find that every item carries the identity of the node, link or fragment it stands for, and will find it only here.
    kind: unstated
    correction: >-
      The search-item node should hold the identity the item carries, or the analysis should decide it is not part of the item's shape.
    node: domain/knowledge-base/search-item
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: >-
      interface SearchResponse, lines 55, 57 and 58 (the `query`, `limit` and `offset` fields)
    evidence: >-
      export interface SearchResponse { readonly query: string; readonly total: number; readonly limit: number; readonly offset: number; readonly items: readonly SearchItem[]; }
    cost: >-
      The retrieval contract's search answer is "the page of ranked search items ... and the total before pagination". It does not say the answer echoes the query text or carries the page's limit and offset (the contract does say so for list-nodes and list-tool-calls). The code states what a search answer carries, and the next reader looks in the contract and finds neither the echoed query nor the window.
    kind: unstated
    correction: >-
      The accepted answer of the search operation in the retrieval contract should name what it carries beyond the items and the total, or the analysis should decide the answer carries only those.
    node: contracts/knowledge-base/retrieval
  - file: src/modules/query-retrieval/dto/response.dto.ts
    where: >-
      interface ProvenanceFragment, line 84 (the `status` field)
    evidence: >-
      readonly status: "accepted" | "proposed" | "rejected" | "deleted";
    cost: >-
      The fragment-status enumeration, which types the information fragment's status, holds five values: proposed, accepted, rejected, superseded and deleted. The code declares four and omits superseded. A provenance read that reaches a superseded fragment has no declared status to carry it, and the narrower set is stated only in this file.
    kind: contradicts
    correction: >-
      The declared status values should agree with the fragment-status enumeration, or the specification should state why a provenance fragment never carries superseded.
    node: domain/knowledge-base/fragment-status
