certified:
  - node: domain/knowledge-base/document-context-status
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/llm-run-repository-document-context.spec.ts
        name: accepts produced, single-chunk, too-long and failed and nothing else
    why: >-
      The status values are a closed set: produced, single-chunk, too-long and failed. The
      test "accepts produced, single-chunk, too-long and failed and nothing else" checks
      DocumentContextStatusSchema against ten fixed candidate strings. It would fail if any of
      the four were removed or renamed. It would also fail if the schema accepted one of the
      six listed near-misses: pending, the empty string, Produced, single_chunk, too_long or
      skipped. It would not fail if a fifth value outside those ten were added to the
      enumeration. So the "nothing else" half of the closed set is only checked against six
      sampled strings, and an added value goes unnoticed. The test "reads back with the status
      that was recorded" round-trips only too-long through the repository. It does not test
      the value set. The two null read-back tests are about the run having no status recorded
      at all, not about the enumeration.
    remainder: testable
    remainder_why: >-
      One input, the complete list of values the document context status enumeration
      declares, against one expected result: exactly produced, single-chunk, too-long and
      failed, with no fifth member. A value added to or removed from the enumeration would
      then fail the test.
