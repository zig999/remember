looked_past: >-
  Several facts in this file are held by nodes outside the pack and its candidate index, with no finding owed: the 64-turn cap per chunk (rules/knowledge-base/extraction-chunk-turn-limit), the 8000-token output ceiling passed through prompt.MAX_TOKENS (extraction-turn-token-ceiling), the "Unknown tool '<name>'." and "Input failed Zod parse." refusals (extraction-unknown-tool-refused, extraction-malformed-arguments-refused), and the pause_turn and no-proposal turn handling (extraction-turn-without-proposals-ends-chunk). Also seen and not reported as another judgment's: closeRunSafe swallows a failed close, and the `void burstReset;` dead variable.
