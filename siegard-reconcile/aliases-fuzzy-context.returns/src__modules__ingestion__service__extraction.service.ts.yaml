read:
  - node: constraints/extraction-acts-only-through-proposals
    held_at: >-
      buildTools() offers only the four propose_* tools, and the default branch of dispatchToolUse refuses any other tool name.
    evidence: >-
      buildTool("propose_fragment", IngestToolDescriptions.propose_fragment), buildTool("propose_node", ...), buildTool("propose_link", ...), buildTool("propose_attribute", ...); default branch returns message: `Unknown tool '${toolName}'.`
  - node: constraints/extraction-model-call-bounded
    held_at: >-
      The ANTHROPIC_REQUEST_TIMEOUT_MS and ANTHROPIC_MAX_RETRIES constants, passed to the client in defaultAnthropicFactory.
    evidence: >-
      const ANTHROPIC_REQUEST_TIMEOUT_MS = 5 * 60 * 1000; const ANTHROPIC_MAX_RETRIES = 2; new AnthropicClient({ apiKey, timeout: ANTHROPIC_REQUEST_TIMEOUT_MS, maxRetries: ANTHROPIC_MAX_RETRIES })
  - node: contracts/knowledge-base/ingestion
    held_at: >-
      The run-extraction answers. RunNotRunnableError, LlmProviderFatalError and ExtractionFatalError carry the codes and statuses, and the failed run is carried as partialRun. runLlmExtraction throws ResourceNotFoundError for an unknown run and returns the completed run with its affected nodes.
    evidence: >-
      code = "BUSINESS_RUN_NOT_RUNNABLE" (statusCode = 409, message names `status '${currentStatus}'`); code = "SYSTEM_LLM_PROVIDER_UNAVAILABLE" (statusCode = 502, readonly partialRun: LlmRunResponse); code = "SYSTEM_INTERNAL_ERROR" (statusCode = 500, readonly partialRun: LlmRunResponse)
  - node: domain/knowledge-base/llm-run
    held_at: >-
      Only partially. LoadedRunContext.run names the run attributes the extraction reads, and readFinalRun builds the LlmRunResponse from the row. The full shape is declared in dto/llm-run.dto.ts.
    evidence: >-
      readonly run: { readonly id: string; readonly status: "running" | "completed" | "failed"; readonly model: string; readonly prompt_version: string; readonly input_raw_information_id: string; readonly document_context: DocumentContext | null; }
  - node: domain/knowledge-base/run-status
    held_at: >-
      The three-valued status union, written out in RunNotRunnableError.currentStatus, LoadedRunContext.run.status and closeRunSafe's outcome parameter. The file is bound to this node.
    evidence: >-
      public readonly currentStatus: "running" | "completed" | "failed"; outcome: "completed" | "failed"
  - node: rules/knowledge-base/affected-nodes-only-when-completed
    held_at: >-
      readFinalRun adds affected_nodes only when the row's status is completed. The failure paths call it without affected nodes.
    evidence: >-
      if (row.status === "completed" && affectedNodes !== undefined) { return { ...base, affected_nodes: [...affectedNodes] }; } return base;
  - node: rules/knowledge-base/document-context-model
    held_at: >-
      The call to produceDocumentContext passes the configured context model. The default claude-haiku-4-5 is not stated in this file.
    evidence: >-
      model: deps.env.CONTEXT_MODEL,
  - node: rules/knowledge-base/document-context-read-first
    held_at: >-
      runLlmExtraction awaits produceDocumentContext once, before the chunk loop, passing the run, the chunk count and the whole content. The v5 gate, the more-than-one-chunk gate and the 100000 limit are not evaluated in this file.
    evidence: >-
      const documentContext = await produceDocumentContext({ pool, anthropic, catalog, logger, model: deps.env.CONTEXT_MODEL, run, chunkCount: chunks.length, content, }); for (const chunk of chunks) {
  - node: rules/knowledge-base/extraction-anchors-to-read-chunk
    held_at: >-
      The propose_fragment branch of dispatchToolUse overwrites the model's chunk_ids with the chunk being read.
    evidence: >-
      const withChunk = { ...(rawInput as Record<string, unknown>), chunk_ids: [chunkId], };
  - node: rules/knowledge-base/extraction-closes-its-run
    held_at: >-
      runLlmExtraction calls closeRunSafe with completed after the chunk loop and with failed on the fatal burst, the provider error and any other error.
    evidence: >-
      await closeRunSafe(pool, llmRunId, "completed"); and, in the catch and the burst branch, await closeRunSafe(pool, llmRunId, "failed");
  - node: rules/knowledge-base/extraction-fails-on-repeated-system-errors
    held_at: >-
      The FATAL_ERROR_BURST constant and the consecutiveErrors counter in runChunkLoop. The counter is local to the chunk. A system error or an ok envelope with outcome "error" increments it, and any other result resets it.
    evidence: >-
      export const FATAL_ERROR_BURST = 3 as const; if (envelope.error.code.startsWith("SYSTEM_")) { consecutiveErrors += 1; } ... if (consecutiveErrors >= FATAL_ERROR_BURST) { return { kind: "fatal_burst" }; }
  - node: rules/knowledge-base/extraction-reads-chunks-in-order
    held_at: >-
      runLlmExtraction iterates the chunks and carries prevTail from one to the next, using the PREV_TAIL_CHARS constant and lastCodePoints. loadRunContext builds the metadata (source type, document date, title, reception time), and runChunkLoop passes metadata, prevTail and documentContext to the prompt's user builder. The ordering of the chunk rows comes from findChunksByRawInformationId, which is outside this file.
    evidence: >-
      export const PREV_TAIL_CHARS = 200 as const; prevTail = lastCodePoints(chunk.text, PREV_TAIL_CHARS); const userBlocks = input.prompt.user({ metadata: input.metadata, chunkText: input.chunkText, prevTail: input.prevTail, documentContext: input.documentContext, });
  - node: rules/knowledge-base/extraction-requires-running-run
    held_at: >-
      The status guard at the start of runLlmExtraction.
    evidence: >-
      if (run.status !== "running") { throw new RunNotRunnableError(llmRunId, run.status); }
  - node: rules/knowledge-base/model-refusal-skips-chunk
    held_at: >-
      The refusal branch of runChunkLoop returns a refused outcome, which the loop in runLlmExtraction does not treat as fatal.
    evidence: >-
      if (response.stop_reason === "refusal") { ... return { kind: "refused" }; } and only `if (outcome.kind === "fatal_burst")` closes the run as failed
  - node: scenarios/knowledge-base/context-links-later-mention
    held_at: >-
      runLlmExtraction passes the run's document context to every chunk, and the propose_fragment dispatch anchors the fragment to the chunk being read. Resolving the node proposal is done in the proposal handlers, outside this file.
    evidence: >-
      documentContext, ... chunkId: chunk.id, ... and chunk_ids: [chunkId],
  - node: constraints/document-content-is-data
    held_at: >-
      nowhere. The file hands the chunk text and the document context to prompt.user(...), and marking them as data is done in the prompt modules.
    evidence: >-
