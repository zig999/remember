    where: >-
      line 57, the exported constant REDACTED_LITERAL, with its docstring on lines 51-56
    evidence: >-
      export const REDACTED_LITERAL = "[REDACTED]" as const;
    cost: >-
      The node rules/knowledge-base/compliance-deletion-redacts-content holds the redaction literal. The
      literal is also declared here as a value of its own, and re-exported from
      modules/compliance-audit/index.ts. Nothing in this file uses it. The repository that does the
      redaction writes its own copy in SQL (`SET content = '[REDACTED]'`). The service constant is read
      only by a unit test that pins its bytes. If the node's literal changes, the repository and the
      test pin move independently of this constant, and this constant stays as a second place that
      looks like where the decision lives. The node's `--check` does not reach this file, because this
      file is bound to the counts node and not to the redaction node.
    kind: contradicts
    correction: >-
      Bind this file to rules/knowledge-base/compliance-deletion-redacts-content, or remove the
      unused constant. The redaction itself is behavior of the repository.
    node: rules/knowledge-base/compliance-deletion-redacts-content

