findings:
  - file: src/modules/knowledge-graph/dto/catalog.dto.ts
    where: >-
      NodeTypeResponseSchema, the `version` field (line 22)
    evidence: >-
      version: z.number().int().min(1),
    cost: >-
      The lower bound of 1 on a node type's version is enforced only here. The node declares `version` as a required integer with no bound. The next reader who looks for the smallest valid version in the specification will not find it.
