    where: >-
      the doc comment above `valid_values` in AttributeKeyResponseSchema (lines 80-85)
    evidence: >-
      Present ONLY when the key
         * has a closed domain; absent means OPEN (any literal parsing against
         * `value_type` is accepted).
    cost: >-
      The comment is a second home for the rule that `valid_values` appears only for a key the catalog closes. The contract holds that rule. The code holds it in `valid_values: z.array(z.string()).optional()`. If the contract changes, the comment keeps saying the old rule and nothing flags it.
    kind: restates
    correction: >-
      Remove the comment. The fact is held by contracts/knowledge-base/retrieval (list-attribute-keys) and by the `.optional()` declaration in this file.
    node: contracts/knowledge-base/retrieval

