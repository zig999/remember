read:
  - node: contracts/knowledge-base/retrieval
    held_at: >-
      LinkDetailResponseSchema (z.object, lines 14-33). It declares the link detail that read-link answers with and that traverse and read-link-history carry per link.
    evidence: >-
      z.object({ id: z.string().uuid(), source_node_id: z.string().uuid(), target_node_id: z.string().uuid(), link_type: z.string(), link_inverse_name: z.string(), valid_from: z.string().regex(/^\d{4}-\d{2}-\d{2}$/).nullable().optional(), valid_to: ..., recorded_at: ..., superseded_at: ..., status: AssertionStatusSchema, effective_status: EffectiveStatusSchema, is_current: z.boolean(), is_in_effect: z.boolean(), confidence: z.number().min(0).max(1), valid_from_source: ..., flags: z.array(AssertionFlagSchema).default([]), supersedes_link_id: ..., provenance: z.array(ProvenanceEntryResponseSchema) })
  - node: domain/knowledge-base/knowledge-link
    held_at: >-
      LinkDetailResponseSchema (lines 14-33). It declares the link's attributes and relationships in part: status, recorded_at, valid_from, valid_to, provenance, confidence, superseded_at, the source and target nodes, the link type and the superseded link. The LLM-run relationship is not declared here.
    evidence: >-
      status: AssertionStatusSchema, recorded_at: z.string().datetime({ offset: true }), valid_from: z.string().regex(/^\d{4}-\d{2}-\d{2}$/).nullable().optional(), confidence: z.number().min(0).max(1), superseded_at: z.string().datetime({ offset: true }).nullable().optional(), supersedes_link_id: z.string().uuid().nullable().optional(), provenance: z.array(ProvenanceEntryResponseSchema)
looked_past: >-
  The header comment ("Mirrors `openapi.yaml` components.schemas.LinkDetail") is prose that states no domain fact, so I left it to the comment route. I also left the wire name `valid_from_source`, which differs from the aggregate's `valid_from_basis`, because neither node in the set fixes wire field names. The 0..1 confidence bound matches rules/knowledge-base/link-confidence-range, which I read only through the full-text projection, not as a node file.
