read:
  - node: contracts/knowledge-base/retrieval
    held_at: >-
      AttributeDetailResponseSchema (lines 15-34), the shape of the read-attribute and read-attribute-history attribute detail.
    evidence: |-
      export const AttributeDetailResponseSchema = z.object({
        id: z.string().uuid(),
        node_id: z.string().uuid(),
        attribute_key: z.string(),
        value_type: AttributeValueTypeSchema,
        value: z.string(),
        valid_from: z.string().regex(/^\d{4}-\d{2}-\d{2}$/).nullable().optional(),
        valid_to: z.string().regex(/^\d{4}-\d{2}-\d{2}$/).nullable().optional(),
        recorded_at: z.string().datetime({ offset: true }),
        superseded_at: z.string().datetime({ offset: true }).nullable().optional(),
        status: AssertionStatusSchema,
        effective_status: EffectiveStatusSchema,
        is_current: z.boolean(),
        is_in_effect: z.boolean(),
        confidence: z.number().min(0).max(1),
        valid_from_source: ValidFromSourceSchema.nullable().optional(),
        flags: z.array(AssertionFlagSchema).default([]),
        supersedes_attribute_id: z.string().uuid().nullable().optional(),
        provenance: z.array(ProvenanceEntryResponseSchema),
      });
  - node: domain/knowledge-base/node-attribute
    held_at: >-
      AttributeDetailResponseSchema (lines 15-34). It declares the node's attributes: value, status, recorded_at, provenance, valid_from, valid_to, the validity-start basis, confidence and superseded_at. It also declares the supersedes reference and the knowledge-node and attribute-key references, as node_id and attribute_key.
    evidence: |-
      value: z.string(),
      status: AssertionStatusSchema,
      recorded_at: z.string().datetime({ offset: true }),
      superseded_at: z.string().datetime({ offset: true }).nullable().optional(),
      valid_from_source: ValidFromSourceSchema.nullable().optional(),
      supersedes_attribute_id: z.string().uuid().nullable().optional(),
      provenance: z.array(ProvenanceEntryResponseSchema),
looked_past: >-
  The response schema bounds confidence with `z.number().min(0).max(1)`, which rules/knowledge-base/attribute-confidence-range holds and which agrees with it. I also left the wire name `valid_from_source`, against the node attribute `valid_from_basis`, because neither node names a wire field, and the header comment "Mirrors `openapi.yaml`" as prose, which is another judgment's.
