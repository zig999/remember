  - node: domain/knowledge-base/value-type
    held_at: >-
      the string-literal union on AttributeKeyRow.value_type, line 54. The file declares no named enumeration.
    evidence: >-
      readonly value_type: "date" | "number" | "text" | "bool";
  - node: rules/knowledge-base/allowed-value-unique-per-key
    held_at: >-
      the per-key `Set` accumulation in buildSnapshot(), lines 176-184.
    evidence: >-
      bucket = new Set<string>();
      attributeValidValuesByKeyId.set(r.attribute_key_id, bucket);
      ...
      bucket.add(r.value);
  - node: rules/knowledge-base/attribute-key-unique-per-node-type
    held_at: >-
      nowhere. The file indexes rows by `(node_type_id, key)` but enforces nothing. A second row with the same pair overwrites the first without a refusal.
    evidence: >-
      attributeKeyByNodeTypeAndKey.set(
        attributeKeyCacheKey(r.node_type_id, r.key),
        r
      );
  - node: rules/knowledge-base/link-type-name-unique
    held_at: >-
      nowhere. The file indexes link types by name and enforces nothing. A duplicate name overwrites silently.
    evidence: >-
      linkTypeByName.set(r.name, r);
  - node: rules/knowledge-base/node-type-name-unique
    held_at: >-
      nowhere. The file indexes node types by name and enforces nothing. A duplicate name overwrites silently.
    evidence: >-
      nodeTypeByName.set(r.name, r);
looked_past: >-
  The header and `attributeValidValuesByKeyId` comments (catalog data changes only by versioned migration, cache invalidation is a process restart, a key without an entry has an open domain) state facts only in prose, since no code in this file applies them, so I left them as comment-route matters and did not file them as findings.
