findings:
  - file: src/modules/knowledge-graph/catalog/catalog.ts
    where: >-
      the comment above the accumulation loop in buildSnapshot(), lines 173-175
    evidence: >-
      // BR-30 — accumulate the closed value domain per attribute_key_id. The DB's
      // UNIQUE(attribute_key_id, value) constraint already guarantees uniqueness;
      // the `Set` deduplicates hand-built test fixtures too.
    cost: >-
      The comment states "no two allowed values of one attribute key hold the same value" a second time, in prose. The specification holds that rule in a node, and this file holds it in behavior, because the `Set` (`bucket.add(r.value)`) cannot hold two equal values. A reader looking for where the uniqueness lives finds the comment first and takes it for the decision. If the node moves, `--check` never reaches this prose.
    kind: restates
    correction: >-
      Remove the comment. The fact is already held by the node and by the `Set` in this file, so the prose owes only its removal.
    node: rules/knowledge-base/allowed-value-unique-per-key
read:
