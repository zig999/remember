      interface AttributeValidValueRow, lines 63-66, which declares only `attribute_key_id` and `value`. It is held in part, and the rest of the shape is declared elsewhere.
    evidence: >-
      export interface AttributeValidValueRow {
        readonly attribute_key_id: string;
        readonly value: string;
      }
  - node: domain/knowledge-base/attribute-key
    held_at: >-
