  - file: src/modules/knowledge-graph/service/traversal.service.ts
    where: >-
      traverseNodeService lines 102-111 together with the frontier seed in traverseNodes at line 180
    evidence: >-
      let startingResolved = starting;
      if (
        starting.status === "merged" &&
        starting.merged_into_node_id !== null
      ) {
        const survivor = await findNodeById(client, starting.merged_into_node_id);
        if (survivor !== null && survivor.status !== "deleted") {
          startingResolved = survivor;
        }
      }
      ...
      let frontier: readonly string[] = input.startingNodeIds;
    cost: >-
      When a starting node is merged and its survivor is absent or deleted, startingResolved stays the merged node. traverseNodes then expands it at hop 1, because the frontier is seeded from the starting ids with no status check. The rule says a traversal expands no merged or deleted node. The `nextFrontier` loop applies the status filter; the seed does not. The same holds for any caller of traverseNodes passing a merged or deleted id, such as the internal query-retrieval batch. The merged start is also dropped from `nodes` by the `finalNodes` filter, while `starting_node_id` still names it.
    kind: contradicts
    correction: >-
      The frontier seed would have to apply the same deleted and merged exclusion the next-hop frontier applies. What the specification wants listed for such a start is not stated and would be decided in the node.
    node: rules/knowledge-base/traversal-expands-live-nodes
