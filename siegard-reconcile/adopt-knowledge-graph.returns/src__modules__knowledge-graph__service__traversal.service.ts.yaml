      The code treats a link that is not deleted and has no provenance as an anomaly worth a warning, and exempts deleted links. No node holds this alarm or its exemption. The candidate rules/knowledge-base/graph-read-shows-empty-provenance only says such a link is shown with an empty list, which the code also does. A reader looking in the specification for when the system raises this warning finds nothing, and the deleted exemption lives only here.
