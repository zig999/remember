    held_at: >-
      The five refusal classes in the file: ResourceNotFoundError (404 RESOURCE_NOT_FOUND), NodeDeletedError (410 BUSINESS_NODE_DELETED), UnknownNodeTypeError (422 BUSINESS_UNKNOWN_NODE_TYPE), UnknownLinkTypeError (422 BUSINESS_UNKNOWN_LINK_TYPE), InvalidTraverseDepthError (422 BUSINESS_INVALID_TRAVERSE_DEPTH, carrying depth and max) and UnknownAttributeKeyError (404 BUSINESS_UNKNOWN_ATTRIBUTE_KEY, carrying nodeType and key).
    evidence: >-
      public readonly statusCode = 404; public readonly code = "RESOURCE_NOT_FOUND" as const; ... public readonly statusCode = 410; public readonly code = "BUSINESS_NODE_DELETED" as const; ... public readonly statusCode = 422; public readonly code = "BUSINESS_UNKNOWN_NODE_TYPE" as const; ... public readonly code = "BUSINESS_UNKNOWN_LINK_TYPE" as const; ... public readonly code = "BUSINESS_INVALID_TRAVERSE_DEPTH" as const; ... public readonly statusCode = 404; public readonly code = "BUSINESS_UNKNOWN_ATTRIBUTE_KEY" as const;
looked_past: >-
  The file's header comment restating that the route layer maps each error to an HTTP status and code is another judgment's (a comment route). The hardcoded "1" in the InvalidTraverseDepthError message agrees with the depth rule's 1-to-3 bound, so it is no finding.
