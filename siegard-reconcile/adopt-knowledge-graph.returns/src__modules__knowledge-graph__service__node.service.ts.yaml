    cost: >-
      The system emits a warning for every non-deleted attribute that has no provenance, and skips deleted ones. No node holds this. The grep of the full-text projection for empty provenance, WARN and log terms finds only the refusal on the provenance reads and the rule that a graph read shows an empty list. Because the warning exists only here, it reads as a decision the business made, and the next reader looks for it in the specification and does not find it.
