looked_past: >-
  Two things were not reported. The values `needs_review` and `low_confidence` use underscores where the nodes use hyphens, and I read that as an identifier-spelling convention, not a differing value. The remaining comments (the "Mirrors DB enum ..." lines and the header) only cite openapi.yaml, the migration and other sections, so they are prose for the comment route.
