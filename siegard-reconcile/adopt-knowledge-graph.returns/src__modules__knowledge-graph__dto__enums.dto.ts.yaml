findings:
  - file: src/modules/knowledge-graph/dto/enums.dto.ts
    where: >-
      SourceTypeSchema, lines 69-78
    evidence: >-
      export const SourceTypeSchema = z.enum([
        "pdf",
        "email",
        "ata",
        "chat",
        "artigo",
        "transcricao",
        "outro",
      ]);
      Node domain/knowledge-base/source-type lists the values: pdf, email, meeting-minutes, chat, article, transcript, other. It adds: "The material's own words for four of the values are `ata` (meeting-minutes), `artigo` (article), `transcricao` (transcript) and `outro` (other)."
    cost: >-
      The source declares four values as the material's Portuguese words (ata, artigo, transcricao, outro). The node holds meeting-minutes, article, transcript and other as the values, and names the Portuguese words only as the material's own. No node says the Portuguese words are the stored or wire form, so a reader who looks to the specification for the vocabulary will not find the one this file enumerates. Changing either side would leave the two disagreeing with no record of which was decided.
    kind: contradicts
    correction: >-
      Decide which vocabulary is the stored and wire form, and have the node state it, or have this schema carry the node's values. The code cannot be asked to read the node.
    node: domain/knowledge-base/source-type
  - file: src/modules/knowledge-graph/dto/enums.dto.ts
    where: >-
      the comment above EffectiveStatusSchema, lines 30-33
    evidence: >-
      /**
       * Derived `effective_status` computed inside the resolved views (§5.4 / A9).
       * Includes the read-only `inactive` projection that is never stored.
       */
    cost: >-
      The comment restates the effective-status node's fact that `inactive` is derived and never stored. The code holds it too: `AssertionStatusSchema` omits `inactive` and `EffectiveStatusSchema` adds it. The pair conforms, but the prose is a second home for the fact and will drift from the node if the node moves.
    kind: restates
    correction: >-
      Remove the comment. The node already holds the fact, and the two schemas carry it as code.
    node: domain/knowledge-base/effective-status
