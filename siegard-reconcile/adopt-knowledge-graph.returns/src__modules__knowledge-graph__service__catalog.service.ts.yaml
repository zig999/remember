read:
  - node: contracts/knowledge-base/retrieval
    held_at: >-
      listNodeTypesService (lines 26-39), listLinkTypesService (lines 42-90) and listAttributeKeysService (lines 93-146). Each builds the `total` and `items` answer for its listing. Attribute keys carry `valid_values` only when the key is closed. A link type's `rules` appear only when rules are asked for.
    evidence: >-
      return { total: rows.length, items: rows.map((r) => ({ id: r.id, name: r.name, description: r.description, version: r.version, })), }; ... return { ...base, rules }; ... return values !== undefined && values.length > 0 ? { ...base, valid_values: [...values].sort() } : base;
  - node: domain/knowledge-base/attribute-key
    held_at: >-
      nowhere
    evidence: >-
      The file only fills attribute-key fields into a response object typed by an import, `import type { AttributeKeyListResponse, ... } from "../dto/catalog.dto.js"`. It declares no shape for the element. `base = { id: r.id, node_type: r.node_type, key: r.key, value_type: r.value_type, is_temporal: r.is_temporal, ... }` only passes values along.
  - node: domain/knowledge-base/link-type
    held_at: >-
      nowhere
    evidence: >-
      The file only passes link-type fields along: `base = { id: lt.id, name: lt.name, label: lt.label, ... version: lt.version }`. The shape is declared in the imported `LinkTypeListResponse` from `../dto/catalog.dto.js`, not here.
  - node: domain/knowledge-base/link-type-rule
    held_at: >-
      nowhere
    evidence: >-
      The file only maps rule fields into a response: `const rules: LinkTypeRuleResponse[] = ruleRows.map((r) => ({ id: r.id, source_node_type: r.source_node_type, ... }))`. `LinkTypeRuleResponse` and `LinkTypeRuleJoined` are imported from other files, so the shape is not declared here.
  - node: domain/knowledge-base/node-type
    held_at: >-
      nowhere
    evidence: >-
      The file only passes node-type fields along: `items: rows.map((r) => ({ id: r.id, name: r.name, description: r.description, version: r.version }))`. The response shape comes from the imported `NodeTypeListResponse`.
