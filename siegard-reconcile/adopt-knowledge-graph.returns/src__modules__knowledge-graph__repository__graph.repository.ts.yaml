looked_past: >-
  The header and inline comments cite BR-xx, UC-xx and CLAUDE.md rules and restate derived-field and ordering facts that the code also holds, which is the comment route's judgment. KnowledgeNodeRow.status also spells the node-status value as `needs_review` where the node writes `needs-review`, which I took to be the storage spelling and did not report.
