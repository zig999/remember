findings:
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      listNodes, the optional alias join built when name_prefix_norm is set (lines 98-102)
    evidence: >-
      aliasJoin = `JOIN node_alias na ON na.node_id = kn.id
                         AND na.alias_norm LIKE $${params.length} || '%'`;
    cost: >-
      The bound prefix goes straight into a LIKE pattern, so a percent sign or underscore the owner types in a
      name prefix acts as a wildcard and matches nodes whose names do not start with those characters. The
      service only applies norm() (node.service.ts, `norm(input.name_prefix)`), and norm() escapes nothing, so
      no code in the tree reads the prefix literally. The decision log records this same behavior as the gap
      the rule closed.
    kind: contradicts
    correction: >-
      The prefix would have to match literally, for example by escaping LIKE metacharacters in the bound value
      and adding an ESCAPE clause, or by using a literal-prefix comparison.
    node: rules/knowledge-base/node-listing-name-prefix
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      listProvenanceByTargets, the excerpt expression in the SELECT list (lines 322-323)
    evidence: >-
      substring(rc."text" FROM rc.offset_start + 1
                                FOR rc.offset_end - rc.offset_start) AS excerpt
    cost: >-
      rc."text" is the chunk's own text, while offset_start and offset_end are offsets into the source. The
      slice is therefore shifted or empty for any chunk that does not start at offset 0, and the provenance
      entry loses the text it exists to show. Every graph read (link, attribute, node, traversal, history)
      takes its excerpt from this function.
    kind: contradicts
    correction: >-
      The entry would have to carry the chunk's whole excerpt, which is rc."text" itself, without re-applying
      the source offsets.
    node: rules/knowledge-base/graph-provenance-excerpt-is-chunk-excerpt
  - file: src/modules/knowledge-graph/repository/graph.repository.ts
    where: >-
      listProvenanceByTargets, the join chain and WHERE clause (lines 324-330)
    evidence: >-
      JOIN raw_information ri    ON ri.id = rc.raw_information_id
                WHERE ${targetCol} = ANY($1::uuid[])
    cost: >-
      No predicate on the raw information's compliance-deleted state is applied here. A grep of the
      knowledge-graph services finds none for compliance, so a provenance entry whose source was deleted for
      compliance can still be shown as traceable. A compliance deletion exists to prevent exactly that.
    kind: contradicts
    correction: >-
      The provenance read would have to leave out entries whose raw information was deleted for compliance.
    node: rules/knowledge-base/graph-provenance-hides-compliance-deleted
