    cost: >-
      The code applies its own rule here: a history version that is not deleted and has no provenance raises a warning alarm, and a deleted one does not. The deleted exemption and the alarm's existence are decisions no node records. The empty-provenance rule only says the read shows an empty list. A later reader looking for what an empty chain does in a history read will not find this in the specification. It is stated in code, and someone could change it without any node noticing.
    kind: unstated
    correction: >-
      Give the alarm a node. The natural home is rules/knowledge-base/graph-read-shows-empty-provenance, which is bound to this file. It should say that a graph read of a non-deleted item with no provenance is reported as an operational warning, and that a deleted item is not.
