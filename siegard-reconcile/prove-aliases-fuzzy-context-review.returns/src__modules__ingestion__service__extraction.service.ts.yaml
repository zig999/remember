looked_past: >-
  The chunk turn cap of 64, the three consecutive system errors, the resume on pause_turn, the skip on refusal, the 8000-token ceiling and the two refused-call messages are all held here and match nodes outside this set that this file is not bound to, and there are further things I saw and did not report because they are another judgment's: the run-status vocabulary is declared again inline when dto/llm-run.dto.ts already declares it, the ok-envelope-with-outcome-error branch of isErrorValidationOutcome has no producer I could find, and the burstReset variable is dead code.
