findings:
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      runChunkLoop, line 466, the system block built for every model call
    evidence: >-
      { type: "text", text: systemText, cache_control: { type: "ephemeral" } },
    cost: >-
      Marking the system prompt for ephemeral caching is a rule about how the
      model is called, and it lives only in this line. No node states it, so a
      reader looking in the specification for how extraction calls the model
      finds the timeout, the retries and the token ceiling, each in its own
      node, and does not find this.
    kind: unstated
    correction: >-
      Either a node for how the extraction calls the model holds the caching
      mark, or the specification states that it is not a domain fact.
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      runChunkLoop, line 487, the request passed to anthropic.messages.stream
    evidence: >-
      thinking: { type: "adaptive" },
    cost: >-
      The thinking mode the model runs under on every extraction turn is
      fixed here. The sibling call parameters, the five-minute wait, the two
      retries and the 8000-token ceiling, each have a node. The thinking mode
      has none, so changing it would change what the extraction does without
      reaching any node.
    kind: unstated
    correction: >-
      A node for the extraction's model-call parameters holds the thinking
      mode.
  - file: src/modules/ingestion/service/extraction.service.ts
    where: >-
      closeRunSafe, lines 672-687, called at lines 371, 386, 394 and 404
    evidence: >-
      } catch {
          await client.query("ROLLBACK").catch(() => undefined);
        } finally {
    cost: >-
      When closing the run fails, nothing is logged and nothing is raised.
      The extraction goes on and answers the run as read back, which can
      still be running. No node says what an extraction answers when it
      cannot close its run. The ingestion contract states the fallback only
      for ingest-document and ingest-directed. The behavior therefore lives
      only in this swallow.
    kind: unstated
    node: rules/knowledge-base/extraction-closes-its-run
    correction: >-
      The node that holds the extraction's closing of its run, or the
      run-extraction operation of the ingestion contract, states what is
      answered when the close fails.
