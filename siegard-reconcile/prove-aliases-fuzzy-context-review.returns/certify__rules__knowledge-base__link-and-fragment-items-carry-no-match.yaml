certified:
  - node: rules/knowledge-base/link-and-fragment-items-carry-no-match
    state: partial
    tests:
      - file: src/__tests__/unit/query-retrieval/search-service-link-fragment-no-match-by-layer.spec.ts
        name: >-
          answers a link reached from an exactly matched node, a link reached from an approximately matched node, and a fragment the fragment layer matched directly, each with no match and no similarity
      - file: src/__tests__/unit/query-retrieval/search-service-link-fragment-no-match-by-layer.spec.ts
        name: >-
          answers no fragment item carrying a match or a similarity when the chunk layer matches a raw chunk that supports a fragment the fragment layer does not match
    why: >-
      Three cases are proven. A link the expansion reaches from an exactly matched node carries no match and no similarity. So does a link it reaches from an approximately matched node. So does a fragment the fragment layer matched directly. The first test lists every item that is not a node, so it would fail if any of these items were missing or carried a match or a similarity. The fourth case is fragments the chunk layer surfaces, and here the proof cannot be shown to fail. The second test only checks that no fragment item carries a match or a similarity. It never checks that the chunk-only search returns a fragment item for fragment-1 at all. If the stand-in client's SQL matching or the chunk-to-fragment path stopped producing that item, the test would still pass with nothing in it. Nothing in the proof shows that a fragment item reached through the chunk layer exists to be checked. A link item that the search reaches other than through expansion is never set up either. The node includes links its expansion reaches without limiting the fact to them.
    remainder: testable
    remainder_why: >-
      Input: a search whose only match is the chunk layer matching chunk-1, which supports fragment-1. Expected result: the items include exactly one fragment item for fragment-1, and it carries no match and no similarity. Checking that the item is present together with checking its fields would close the chunk-surfaced half.
