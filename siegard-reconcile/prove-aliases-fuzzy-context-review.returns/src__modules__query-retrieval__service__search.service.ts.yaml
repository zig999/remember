findings:
  - file: src/modules/query-retrieval/service/search.service.ts
    where: >-
      searchKnowledgeService, the expansion step (lines 247-256), together with scoreMatchedNodes (lines 329-339)
    evidence: >-
      `if (provenance.length === 0) continue;` skips a node hit before it becomes an item. The expansion is then seeded from the items only: `const expanded = await collectExpandedLinks(context, scoreMatchedNodes(items));`, where scoreMatchedNodes does `for (const it of items) { if (it.kind === "node") { matchedById.set(it.id, ...` and never reads `nodeHits`.
    cost: >-
      A knowledge node the node layer matched but that holds no provenance does not seed expansion, and the links around it never appear. The two nodes say only that a search expands "from its matched knowledge nodes" and that a matched node without provenance does not surface. Neither says whether such a node still seeds expansion. That choice lives only in this code, where the next reader will not look for it in the specification.
    kind: unstated
    correction: >-
      Analysis would have to settle whether an unsurfaced matched node seeds expansion. The answer then belongs in rules/knowledge-base/expansion-starts-from-matched-nodes or in rules/knowledge-base/matched-node-requires-provenance.
    node: rules/knowledge-base/expansion-starts-from-matched-nodes
