  - node: rules/knowledge-base/extraction-prompt-v5-keeps-v4
    held_at: >-
      the function v4LinesMissingFromV5 (lines 164-169) and the single it(...) assertion
      (lines 171-181)
    evidence: >-
      const v4Lines = instructionLines(selectPromptModule("v4").system(catalog));
      const v5Lines = new Set(instructionLines(selectPromptModule("v5").system(catalog)));
      ... return v4Lines.filter((line) => !v5Lines.has(line));
      The test then expects the missing-lines list to equal [] for each catalog shape.
