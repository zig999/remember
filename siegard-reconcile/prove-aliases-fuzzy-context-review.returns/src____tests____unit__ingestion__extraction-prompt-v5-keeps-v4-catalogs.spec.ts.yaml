looked_past: >-
  The catalog fixtures (link type names such as "concerns" and attribute keys such as "budget" and
  "event_date") are test inputs rather than facts the code applies, and whether the single-line
  comparison unit matches the node's notion of an instruction is a test-design question, not a
  conformance one.
