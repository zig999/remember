    where: >-
      the receptionProblems helper (lines 265-275) and the title of the first test (line 277)
    evidence: >-
      const showsStarted = [STARTED_AT_DATE, STARTED_AT_TIME]
            .filter((needle) => prompt.includes(needle))
            .map((needle) => `chunk ${at + 1} shows started_at (${needle})`);
      it("shows received_at and never the run's started_at in every chunk prompt when the two differ", async () => {
    cost: >-
      The test fails any chunk prompt that shows the run's start date or time, so the code now carries a
      prohibition that is in no node. rules/knowledge-base/extraction-reads-chunks-in-order says what the
      prompt shows (the source's type, document date, title and reception time) and says nothing about
      what it must not show. A reader looking for what a chunk prompt may carry will not find this
      exclusion in the specification, and a later prompt change that legitimately shows the run's start
      time would fail here with no rule to consult.
    kind: unstated
    correction: >-
      Either a node states that a chunk prompt never shows the run's start time, or the assertion
      narrows to what the nodes hold, which is that the prompt shows the reception time.
    node: rules/knowledge-base/extraction-reads-chunks-in-order
