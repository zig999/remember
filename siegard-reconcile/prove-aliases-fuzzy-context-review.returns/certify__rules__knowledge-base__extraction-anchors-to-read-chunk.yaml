certified:
  - node: rules/knowledge-base/extraction-anchors-to-read-chunk
    state: uncovered
    tests:
      - file: src/__tests__/unit/ingestion/extraction-anchors-to-read-chunk.spec.ts
        name: >-
          anchors each of two fragments to the chunk being read alone, whether the model names that chunk and another of the same raw information or only a chunk of a different raw information
      - file: src/__tests__/unit/ingestion/extraction-anchors-to-read-chunk.spec.ts
        name: >-
          anchors a fragment that names only another chunk of the same raw information to the chunk being read
      - file: src/__tests__/unit/ingestion/extraction-anchors-to-read-chunk.spec.ts
        name: >-
          anchors a fragment that names no chunk to the chunk being read
    why: >-
      All three tests replace propose-fragment.handler with a vi.fn mock. Each one calls
      __testing__.dispatchToolUse, then asserts only on the `chunk_ids` field of the first
      argument that was passed to that mock. That is an assertion on an internal call. No test
      ever observes a proposed fragment or what it is anchored to. The tests would fail if the
      handoff were rearranged, for example if the reading chunk reached the handler through a
      different parameter or the anchoring moved into the handler. They would still pass if the
      fragment ended up anchored to a chunk the model named. That could happen if the mocked
      handler anchored the fragment some other way, or if the model's chunk ids reached it
      through any field other than `chunk_ids`, because the tests do not assert the rest of the
      handed argument. So no test checks that a proposed fragment is anchored to the chunk being
      read. The naming cases the tests feed in are: the read chunk plus another chunk of the same
      raw information, only a chunk of a different raw information, only another chunk of the
      same raw information, and no chunk.
    remainder: testable
    remainder_why: >-
      Run an extraction while it reads one raw chunk. Have it propose a fragment whose model
      input names other raw chunks: another chunk of the same raw information, a chunk of a
      different raw information, and none. Each time, read the proposed fragment back as
      recorded. The expected result is that it is anchored to the chunk being read and to no
      chunk the model named.
