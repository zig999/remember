      reading is expected for a run holding a context"); }`, and the call is
      never expected to be made.
  - node: rules/knowledge-base/document-context-status-kept-on-reuse
    held_at: >-
      The test's `it(...)` block, lines 81-93, together with
      `statusAfterExtraction` (lines 66-79). The store starts at
      `HELD_STATUS` ("produced"), `produceDocumentContext` is called with
      `run: { ..., prompt_version: promptVersion, document_context:
      HELD_CONTEXT }`, and the status is expected to be unchanged under "v5"
      and under the later "v6".
    evidence: >-
      const wanted = { [FIRST_READING_VERSION]: HELD_STATUS, [LATER_VERSION]:
      HELD_STATUS }; ... expect(observed).toEqual(wanted);
  - node: rules/knowledge-base/document-context-status-recorded
    held_at: >-
      nowhere
    evidence: >-
      The file never asserts a status of single-chunk, too-long, failed or
      produced as recorded by a reading. `chunkCount: SEVERAL_CHUNKS` and
      `content: "x".repeat(OVER_LIMIT_UNITS)` (100_001) are inputs that would
      select too-long if a reading were made, and the test expects the held
      status to stay instead. The recording rule is not exercised.
  - node: rules/knowledge-base/extraction-anchors-to-read-chunk
    held_at: >-
