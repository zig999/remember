certified:
  - node: rules/knowledge-base/extraction-prompt-v5-keeps-v4
    state: partial
    tests:
      - file: src/__tests__/unit/ingestion/extraction-prompt-v5-keeps-v4-catalogs.spec.ts
    why: >-
      The test renders the v4 and v5 extraction system prompts from the same catalog and checks that every non-blank, trimmed v4 line appears whole and unchanged in v5. It does this for seven catalog shapes: a non-temporal link type, a link type allowing several current values, a temporal link type requiring neither date, date/number/bool attribute keys, a text attribute key with no valid values, a node type without a description, and an empty catalog. The test fails if v5 drops or changes any v4 instruction for those catalogs. The node's fact holds for any catalog, though, and none of these fixtures has a link type rule (linkTypeRules is empty in every one) or an attribute key with valid values. So for catalogs that have link type rules or closed value sets, nothing checks that v5 keeps the v4 instructions. The test's own name says a separate "rich-catalog comparison" covers the shapes it leaves out. That test is not in the offered proof, so it cannot be cited here, and the node stays short of covered on this file alone.
    remainder: testable
    remainder_why: >-
      One more assertion would close it: build one catalog that has at least one link type rule and an attribute key with a non-empty set of valid values, render both prompts from it, and expect every non-blank v4 system-prompt line to appear unchanged in the v5 system prompt. If the rich-catalog comparison the test name refers to already does this, adding it to the offered proof would close the gap.
